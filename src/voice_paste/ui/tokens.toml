# 画面の見た目の値（開発者ツールのスタイル）。QSS はここの値で組み立てる

[font]
# 本文・見出し・ボタンの書体
ui = ["Segoe UI", "Yu Gothic UI", "Meiryo UI"]
# 経過時間・ホットキー・設定のキー・エラーの詳細の書体
mono = ["Cascadia Mono", "Consolas", "BIZ UDGothic"]

[size]
# 本文の文字の大きさ（px）
text = 14
# 案内・補足の文の大きさ（px）
text_small = 12
# ホットキー・設定のキーの大きさ（px）
text_key = 11
# 録音の画面の経過時間の大きさ（px）
time = 26

[shape]
# 窓・ボタン・入力欄の角丸（px）
radius = 6
# ボタン・入力欄・選択欄の高さ（px）
control_height = 32
# 窓の中の余白（px）
padding = 16
# 並べた要素の間（px）
gap = 10
# 選んだボタンの丸い印が、ボタンの枠の右上の角から外へはみ出す幅（px）
badge_overhang = 6
# チェックボックスの箱・ラジオボタンの丸の一辺（px）
indicator = 16
# 選んだラジオボタンの点の直径（px）
indicator_dot = 8
# 印と名前の間（px）
indicator_gap = 8
# ラジオボタンの選択肢の間（px。印と名前の間より広くする）
choice_gap = 20

[motion]
# 回る印の 1 周の時間（ミリ秒）
spinner_ms = 900
# 切り替えのつまみが滑る時間（ミリ秒）
switch_ms = 150

# 明るいテーマの色
[color.light]
bg = "#e6eaef"
surface = "#eef1f4"
sunken = "#e3e8ed"
text = "#1f2328"
text_muted = "#59636e"
border = "#c8d1da"
# 窓の外側の縁（枠なしの窓とメニュー）
frame = "#818b98"
primary = "#1f883d"
primary_hover = "#1c8139"
on_primary = "#ffffff"
on_primary_line = "rgba(255, 255, 255, 90)"
accent_fg = "#0a5cc2"
recording = "#cf222e"
paused = "#875e00"
busy = "#0a5cc2"
success = "#18742f"
danger = "#cf222e"
danger_bg = "#ffebe9"
notice_bg = "#fff8c5"

# 暗いテーマの色
[color.dark]
bg = "#1c2128"
surface = "#22272e"
sunken = "#1c2128"
text = "#e6edf3"
text_muted = "#9198a1"
border = "#3d444d"
# 窓の外側の縁（枠なしの窓とメニュー）
frame = "#768390"
primary = "#238636"
primary_hover = "#29903b"
on_primary = "#ffffff"
on_primary_line = "rgba(255, 255, 255, 90)"
accent_fg = "#539bf5"
recording = "#ff6a69"
paused = "#d29922"
busy = "#539bf5"
success = "#57ab5a"
danger = "#ff6a69"
danger_bg = "#2d2023"
notice_bg = "#2e2a1f"
