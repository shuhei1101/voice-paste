[project]
name = "voice-paste-haas-server"
version = "0.1.0"
description = "voice-paste の Haas の文字起こしのサーバー"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=11,<19",
    "fastapi~=0.142.2",
    "haas-asr",
    "numpy",
    "python-multipart~=0.0.32",
    # flash-linear-attention 0.5.2 は triton 3.9 でモデルの読み込みに失敗する。PoC で確かめた版に固定する
    "torch==2.14.0",
    "triton==3.8.0",
    "uvicorn~=0.54.0",
]

[tool.uv]
package = false
# haas-asr の dev の設定を写す（依存へは伝わらない）。NeMo のコード生成が .pyc を壊すため先にコンパイルする
compile-bytecode = true
override-dependencies = [
    "fsspec[http]>=2026.6.0",
    "hydra-core>=1.3.8",
    "packaging>=26.3",
    "transformers>=5.10.0",
    "virtualenv>=21.14.9",
]

[tool.uv.sources]
haas-asr = { git = "https://github.com/third-intelligence/Haas-ASR", rev = "acc614f68769dcbfae9dba96b48439c4a66295af" }
