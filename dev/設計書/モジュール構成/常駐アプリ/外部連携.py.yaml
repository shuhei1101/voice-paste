  - name: _fade_to
    title: 音量を変える
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: internal
    summary: 目標の音量へ fade_sec をかけて変える。fade_sec が 0 以下なら呼び出しの中ですぐ変える。音量のロックを持ち、進行中のフェードを打ち切った後に呼ぶ
    args:
      - name: target
        type: float
        required: true
        passing: positional
        description: 目標の音量（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: かける秒数
    returns:
      type: None
      description: なし
    process: |-
      1. fade_sec が 0 以下なら、COM を初期化して target を書き、解放する
         - pycaw・COM が例外を出した場合、VolumeControlError を送出する
      2. fade_sec が正なら、target を進行中のフェードの目標として持ち、新しい打ち切りの合図を作ってデーモンのスレッドを始める
         - スレッドの中で COM を初期化し、今の音量から target までを FADE_STEPS 回に分け、fade_sec / FADE_STEPS 秒ごとに 1 回分ずつ書く（今の音量と target の差が 0.005 未満なら 1 回で書く）
         - 打ち切りを知らされたら、次の回を書かずに終わる
         - pycaw・COM が例外を出した場合、そこで終わる
           - `[ERROR]` 音量を変えられなかった（理由）
    exceptions:
      - name: VolumeControlError
        condition: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した
    unit_tests:
      - name: test_fade_to
        case: 正常
        summary: FADE_STEPS 回で目標の音量に届く
        condition: 今の音量 0.8、target=0.4・fade_sec=0.1 で呼び、1 秒待つ
        mock: _open_endpoint_volume
        expected: 書かれた音量が FADE_STEPS 個で単調に減り、最後が 0.4
      - name: test_fade_to_when_write_failed
        case: 異常
        summary: すぐ変えるときに書けなければ VolumeControlError
        condition: fade_sec=0、SetMasterVolumeLevelScalar が COMError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出される
        exception: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した
    status: implemented
  - name: _open_endpoint_volume
    title: 音量のインターフェースを引く
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: internal
    summary: pycaw の AudioUtilities.GetSpeakers() の EndpointVolume を返す。pycaw の API に触れるのはこの関数と音量の読み書きの 2 つのメソッドだけにする（バージョンを上げたときに直す場所）
    returns:
      type: IAudioEndpointVolume
      description: 既定の再生デバイスの音量のインターフェース（呼ぶスレッドで COM を初期化しておく）
    refs:
      - dev/設計書/外部ライブラリ/pycaw#
    status: implemented
  - name: _cancel_fade
    title: 進行中のフェードを打ち切る
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: internal
    summary: 進行中のフェードに打ち切りを知らせて終わりを待ち、そのフェードの目標の音量を返す。音量のロックを持って呼ぶ（フェードのスレッド・打ち切りの合図・目標は _ 付きのモジュール変数で持ち、この関数と _fade_to だけが触る）
    returns:
      type: float | None
      description: 打ち切ったフェードの目標の音量。進行中のフェードが無ければ None
    process: |-
      1. フェードのスレッドが動いていなければ、目標を None にして None を返す
      2. 打ち切りを知らせ、スレッドの終わりを FADE_JOIN_TIMEOUT_SEC まで待つ
      3. 目標を返し、None に戻す
    unit_tests:
      - name: test_cancel_fade_when_idle
        case: 正常
        summary: 進行中のフェードが無ければ None
        condition: フェードを始めていない、または始めたフェードが終わった後に呼ぶ
        mock: _open_endpoint_volume
        expected: None が返る
    status: implemented
  - name: open_app_window
    title: アプリのウィンドウで開く
    kind: 関数
    container: integrations/browser/opener.py
    usecase: 起こした文字を届ける
    scope: public
    summary: URL を Microsoft Edge の `--app` でアプリのウィンドウとして開く。Edge が見つからなければ既定のブラウザで開く
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 開く URL（確定の操作で選んだブラウザ添付のプリセットの URL）
    returns:
      type: None
      description: なし（開いた画面の読み込みを待たない）
    process: |-
      1. Edge の実行ファイルを探す（PATH の `msedge`、無ければ EDGE_PATHS の順に存在するもの）
      2. 見つかった場合、`[{Edge}, "--app={url}"]` を subprocess.Popen で起動する
         - `[INFO]` URL を Edge のアプリのウィンドウで開いた（url）
      3. 見つからない場合、os.startfile で既定のブラウザで開く
         - `[INFO]` URL を既定のブラウザで開いた（url）
         - 2・3 で OSError が出た場合、DeliveryError を送出する。理由は `ブラウザ添付のプリセットの画面を開けませんでした（{元の例外}）` にし、元の例外を連鎖して残す（トレイの通知の `{理由}` にそのまま出る）
    exceptions:
      - name: DeliveryError
        condition: Edge も既定のブラウザも起動できない
    refs:
      - dev/設計書/外部ライブラリ/Microsoft_Edge#
    status: implemented
    unit_tests:
      - name: test_open_app_window
        case: 正常
        summary: Edge があれば --app で開く
        condition: shutil.which が msedge を返す
        mock: shutil.which・subprocess.Popen・os.startfile
        expected: Popen に ["msedge", "--app=https://chatgpt.com"] が渡り、os.startfile が呼ばれない
      - name: test_open_app_window_when_installed_path
        case: 正常
        summary: PATH に無くても既定の置き場所の Edge で開く
        condition: shutil.which が None で、EDGE_PATHS の 2 つ目だけが存在する
        mock: shutil.which・Path.exists・subprocess.Popen
        expected: Popen の先頭に EDGE_PATHS の 2 つ目が渡る
      - name: test_open_app_window_when_edge_missing
        case: 正常
        summary: Edge が無ければ既定のブラウザで開く
        condition: shutil.which が None で、EDGE_PATHS がどれも存在しない
        mock: shutil.which・Path.exists・subprocess.Popen・os.startfile
        expected: os.startfile に URL が渡り、Popen が呼ばれない
      - name: test_open_app_window_when_failed
        case: 異常
        summary: 起動できなければ DeliveryError
        condition: subprocess.Popen が OSError を送出する
        mock: shutil.which・subprocess.Popen
        expected: DeliveryError が送出され、理由が `ブラウザ添付のプリセットの画面を開けませんでした（` で始まり「起動できない」を含む（「AI チャット」を含まない）
        exception: Edge も既定のブラウザも起動できない
  - name: post_json
    title: JSON の POST
    kind: 関数
    container: integrations/http/client.py
    usecase: 起こした文字を届ける
    role: client
    scope: public
    inherits: PostJsonFn
    summary: httpx で JSON を POST してステータスと Retry-After を返す。タイムアウトと接続できないことは DeliveryError に変える
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 送信先
      - name: payload
        type: dict[str, object]
        required: true
        passing: positional
        description: 送信する JSON
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 1 回の POST のタイムアウト（呼び出し元へ返すは非機能要件の返送のタイムアウトを部分適用し、エンドポイントへ送信は設定の値を渡す）
      - name: headers
        type: Mapping[str, str]
        required: false
        default: 空の辞書
        passing: positional
        description: 付けるヘッダー（Authorization など。値はログと例外の文に書かない）
    returns:
      type: PostResult
      description: 送信先が返したステータスと Retry-After
    process: |-
      1. httpx.Client(timeout=timeout_sec, follow_redirects=False) で headers を付けて POST する（リダイレクトで許していないホストへ行かず、認証のヘッダーを他の先へ流さない）
         - httpx.TransportError（タイムアウト・接続できない）の場合、DeliveryError を送出する
      2. Retry-After を秒に直す（秒数はそのまま、HTTP の日付は今の時刻からの差。負の値は 0 にそろえる。無い・読めない場合は None）
      3. ステータスと Retry-After を PostResult で返す（2xx 以外でも送出しない）
    exceptions:
      - name: DeliveryError
        condition: タイムアウトか接続できない
    unit_tests:
      - name: test_post_json
        case: 正常
        summary: JSON を送信してステータスを返す
        condition: エンドポイントが 204 を返す
        mock: httpx.MockTransport
        expected: status 204・retry_after_sec None が返り、エンドポイントに Content-Type application/json で payload が届いている
      - name: test_post_json_when_headers
        case: 正常
        summary: 渡したヘッダーを付けて送信する
        condition: 'headers に {"Authorization": "Bearer test-token"} を渡す'
        mock: httpx.MockTransport
        expected: 'エンドポイントに Authorization: Bearer test-token が届いている'
      - name: test_post_json_when_retry_after_seconds
        case: 正常
        summary: 秒数の Retry-After を返す
        condition: 'エンドポイントが 429 と Retry-After: 3 を返す'
        mock: httpx.MockTransport
        expected: status 429・retry_after_sec 3.0 が返る
      - name: test_post_json_when_retry_after_invalid
        case: 正常
        summary: 読めない Retry-After は None
        condition: 'エンドポイントが 503 と Retry-After: soon を返す'
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec None が返る
      - name: test_post_json_when_retry_after_past_date
        case: 正常
        summary: 過去の日付の Retry-After は 0
        condition: エンドポイントが 503 と、今より 1 分前の HTTP の日付の Retry-After を返す
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec 0.0 が返る
      - name: test_post_json_when_redirected
        case: 正常
        summary: リダイレクトを追わない
        condition: エンドポイントが 307 で別のホストを指す
        mock: httpx.MockTransport
        expected: status 307 が返り、別のホストへの要求が出ない
      - name: test_post_json_when_timeout
        case: 異常
        summary: タイムアウトは DeliveryError
        condition: エンドポイントが httpx.ReadTimeout を送出する
        mock: httpx.MockTransport
        expected: DeliveryError が送出される
        exception: タイムアウトか接続できない
    refs:
      - dev/設計書/外部ライブラリ/httpx#
    status: implemented
  - name: load_vad_session
    title: VAD のセッションの読み込み
    container: integrations/vad/adapter.py
    usecase: 録音する
    role: アダプタ
    kind: 関数
    scope: public
    summary: 常駐アプリのパッケージに同梱した Silero VAD（ONNX）を onnxruntime の CPU で開き、セッションを返す。faster-whisper が入っていない環境でも開ける
    description: モデルは faster-whisper 1.2.1 が同梱する `assets/silero_vad_v6.onnx` と同じファイルを `integrations/vad/assets/` に、Silero VAD の LICENSE の全文（`LICENSE.silero-vad`）と並べて置き、pyproject.toml の `[tool.setuptools.package-data]` の voice_paste に `"integrations/vad/assets/*.onnx"`・`"integrations/vad/assets/LICENSE.*"` を追加して常駐アプリのパッケージに含める（faster-whisper は `local-whisper` の extra へ移り、`openai` のエンジンでは入れない環境があるため）。faster_whisper を import しない（`__init__` が ctranslate2 と CUDA の DLL を常駐サービスに読み込み、文字起こしワーカーを子プロセスに隔離した構造の決定（`dev/pr/12/方針決め/4_構造の決定.md`）に反する）。起動の配線で 1 回だけ呼ぶ。
    returns:
      type: onnxruntime.InferenceSession
      description: Silero VAD のセッション
    process: |-
      1. `importlib.resources.files("voice_paste.integrations.vad")` から VAD_MODEL_RESOURCE を引き、`as_file` でファイルのパスにする
      2. onnxruntime の SessionOptions（inter_op_num_threads=1・intra_op_num_threads=1・enable_cpu_mem_arena=False・log_severity_level=4）と CPUExecutionProvider で InferenceSession を開いて返す
