      - 再起動せずに、動いている常駐アプリが次に組み立てる Haas への要求に、単語の表記と読みの組が載る（マイクを開かずに確認する。録音を経由した文字起こしは 録音を文字に起こす の 正常シナリオ（Haas で起こす））
      - ローカルの Whisper への要求の手がかりは、読みを入れる前と同じく表記だけを読点（、）でつないだ文になっている
