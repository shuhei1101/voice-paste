id: MOD-69
visibility: internal
title: 常駐アプリ / 外部連携 / transcriber.py
test_files:
  - tests/unit/voice_paste/integrations/openai/test_transcriber.py
external_test_files:
  - tests/external/voice_paste/integrations/openai/test_transcriber.py
classes:
  - name: OpenAITranscriber
    title: OpenAI API の文字起こし
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    role: アダプタ
    kind: クラス
    summary: 録音を OpenAI API の文字起こし（POST {base_url}/audio/transcriptions）へ httpx の multipart で送信し、起こした文字を返却する。一時的な失敗は回数の上限まで送信し直す
    description: API キーはヘッダーにだけ載せ、ログ・例外の文に書き込まない。リダイレクトを追わない（認証のヘッダーを設定のベース URL 以外へ送信しない）。
    properties:
      - name: _settings
        type: OpenAISettings
        access: 内部 (_)
        description: モデル・言語・ベース URL
      - name: _api_key
        type: pydantic.SecretStr
        access: 内部 (_)
        description: API キー（read_openai_api_key が返却したもの。送信のときだけ get_secret_value で取り出す）
      - name: _sleep
        type: Callable[[float], None]
        access: 内部 (_)
        default: time.sleep
        description: 送信し直す前に待つ関数（テストで差し替える）
      - name: _uniform
        type: Callable[[float, float], float]
        access: 内部 (_)
        default: random.uniform
        description: 待つ秒数のジッターを引く関数（テストで差し替える）
      - name: _transport
        type: httpx.BaseTransport | None
        access: 内部 (_)
        default: None
        description: httpx.Client に引き渡すトランスポート（テストで httpx.MockTransport に差し替える）
    methods:
      - name: transcribe
        title: 文字起こし
        kind: メソッド
        inherits: 文字起こしの EngineFn
        scope: public
        summary: 録音を送信し、起こした文字を 1 区間の並びで返却する
        args:
          - name: audio_path
            type: Path
            required: true
            passing: positional
            description: 録音の WAV か、ブラウザから受けた音声
          - name: on_progress
            type: ProgressFn | None
            required: false
            default: None
            passing: keyword
            description: 受けるが呼ばない（OpenAI API は途中の進みを返却しない）
          - name: hint
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 文字起こしの手がかり（有効なプリセットの単語を HINT_SEPARATOR でつないだ文）。None なら prompt も keywords[] も送信しない
        returns:
          type: list[str]
          description: 起こした文字の 1 要素の並び。起こした文字が空なら空の並び
        exceptions:
          - name: EngineError
            condition: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
        process: |-
          1. 音声の大きさが OPENAI_MAX_AUDIO_BYTES 以下で、拡張子（小文字）が OPENAI_AUDIO_SUFFIXES にあるかを確認する
             - 外れる場合、送信せずに EngineError を送出する（理由は「音声が OpenAI API の上限（25 MB）を超えています」か「OpenAI API が受けられない形式です（{拡張子}）」）
               - `[WARNING]` OpenAI API へ送信しない音声（大きさ・拡張子）
          2. httpx.Client（timeout=None でアプリ側では待つ時間の上限を設けない、follow_redirects=False、transport=_transport）で `{base_url}/audio/transcriptions` へ POST する。ヘッダーは `Authorization: Bearer {API キー}`、本文は multipart の file（音声）・model・response_format=json と、_build_form が返却する言語と手がかりの項目
          3. 応答を確認する
             - 200 の場合、JSON の text の前後の空白を除き、空でなければ [text]、空なら [] を返却する
               - `[INFO]` OpenAI API で起こした（モデル・音声のバイト数・かかった秒・試した回数）
             - 429・500 以上か、httpx.TimeoutException・httpx.TransportError の場合、送信し直した回数が OPENAI_MAX_RETRIES 未満なら待ってから 2 へ戻る。待つ秒数は Retry-After（秒数）があればそれ、無ければ _uniform(0, OPENAI_RETRY_BASE_SEC × 2^回数)。どちらも OPENAI_RETRY_MAX_SEC で頭打ちにする
               - `[WARNING]` OpenAI API へ送信し直す（ステータスか例外の種類・待つ秒）
             - それ以外の応答（3xx・4xx）か、回数の上限に達した場合、EngineError を送出する（理由はステータスと、JSON の error.type・error.code。読み込めなければステータスか例外の種類だけ。API キー・本文は書き込まない）
               - `[ERROR]` OpenAI API の文字起こしに失敗した（ステータスか例外の種類・error.type・error.code）
        unit_tests:
          - name: test_transcribe
            case: 正常
            summary: 録音と設定を送信して起こした文字を返却する
            condition: 'エンドポイントが 200 と {"text": " 今日は晴れ "} を返却する。model="gpt-4o-mini-transcribe"・hint="voice-paste、Whisper"'
            mock: httpx.MockTransport
            expected: '["今日は晴れ"] が返り、`{base_url}/audio/transcriptions` に Authorization: Bearer {API キー}・file・model・language・response_format=json・prompt="voice-paste、Whisper" が届いている'
          - name: test_transcribe_when_no_hint
            case: 正常
            summary: 手がかりが無ければ prompt を送信しない
            condition: hint=None
            mock: httpx.MockTransport
            expected: 届いた本文に prompt が無い
          - name: test_transcribe_when_empty_text
            case: 正常
            summary: 起こした文字が空なら空の並び
            condition: 'エンドポイントが 200 と {"text": ""} を返却する'
            mock: httpx.MockTransport
            expected: '[] が返る'
          - name: test_transcribe_when_retry_after
            case: 正常
            summary: 429 は Retry-After を待って送信し直す
            condition: '1 回目が 429 と Retry-After: 2、2 回目が 200 を返却する'
            mock: httpx.MockTransport・_sleep
            expected: _sleep が 2.0 で 1 回呼ばれ、起こした文字が返る
          - name: test_transcribe_when_server_error_retried
            case: 正常
            summary: 5xx とタイムアウトは待って送信し直す
            condition: 1 回目が 503、2 回目が httpx.ReadTimeout、3 回目が 200 を返却する
            mock: httpx.MockTransport・_sleep・_uniform
            expected: _uniform が (0, 0.5)・(0, 1.0) で呼ばれ、起こした文字が返る
          - name: test_transcribe_when_retry_exhausted
            case: 異常
            summary: 回数の上限まで失敗したら EngineError
            condition: エンドポイントが 3 回とも 500 を返却する
            mock: httpx.MockTransport・_sleep
            expected: EngineError が送出され、要求は 3 回（最初と送信し直し 2 回）
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_unauthorized
            case: 異常
            summary: 401 は送信し直さずに EngineError にし、API キーを書き込まない
            condition: 'エンドポイントが 401 と {"error": {"type": "invalid_request_error", "code": "invalid_api_key"}} を返却する'
            mock: httpx.MockTransport
            expected: 要求は 1 回で、EngineError の理由に 401・invalid_api_key が入り API キーが入っていない。ログにも API キーが無い
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_audio_too_large
            case: 異常
            summary: 25 MB を超える音声は送信しない
            condition: OPENAI_MAX_AUDIO_BYTES + 1 バイトの webm
            mock: httpx.MockTransport
            expected: EngineError が送出され、エンドポイントに要求が届いていない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_unsupported_suffix
            case: 異常
            summary: 受けられない形式は送信しない
            condition: 拡張子 .ogg の音声
            mock: httpx.MockTransport
            expected: EngineError の理由に ogg が入り、エンドポイントに要求が届いていない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_redirected
            case: 異常
            summary: リダイレクトを追わない
            condition: エンドポイントが 307 で別のホストを指す
            mock: httpx.MockTransport
            expected: EngineError が送出され、別のホストへの要求が出ない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_keywords_model
            case: 正常
            summary: gpt-transcribe では keywords[] と languages[] を同じ項目名で繰り返して送信する
            condition: 'エンドポイントが 200 と {"text": "今日は晴れ"} を返却する。model="gpt-transcribe"・hint="voice-paste、Whisper"'
            mock: httpx.MockTransport
            expected: 届いた本文に keywords[] のパートが voice-paste・Whisper の 2 つ、languages[] のパートが ja の 1 つあり、language・prompt のパートが無い
          - name: test_transcribe_when_no_timeout
            case: 正常
            summary: 待つ時間の上限を設けずに送信する
            condition: 'エンドポイントが 200 と {"text": "今日は晴れ"} を返却する'
            mock: httpx.MockTransport
            expected: 届いた要求の extensions["timeout"] の connect・read・write・pool が全て None（httpx の既定の 5 秒が掛かっていない）
        connectivity_tests:
          - name: test_ext_transcribe
            api: OpenAI API POST /v1/audio/transcriptions
            summary: 実際の OpenAI API で、短い音声を起こせる
            checks: 約 3 秒の日本語の WAV を既定のモデル（gpt-transcribe）・languages[]=ja・keywords[] 付きで送信し、空でない文字が 1 区間で返る。かかった秒を記録する
            cost: 従量課金。約 3 秒 × $0.0045/分 で 1 回あたり約 $0.0003。実行の前に規約『開発時の従量課金APIの実行』で見積もる
            notes: API キー（環境変数 OPENAI_API_KEY か secrets/openai_api_key）が無い環境では skip する
      - name: _build_form
        title: 言語と手がかりの項目の組み立て
        kind: メソッド
        scope: internal
        summary: 設定のモデルに合わせて、言語と手がかりを記載する multipart の項目を返却する
        args:
          - name: hint
            type: str | None
            required: true
            passing: positional
            description: transcribe が受けた手がかり
        returns:
          type: dict[str, str | list[str]]
          description: multipart の項目名 → 値。list の値は同じ項目名で繰り返し送信する
        process: |-
          1. 設定のモデルが OPENAI_KEYWORDS_MODEL_PREFIX で始まるかを確認する
             - 始まる場合、`languages[]` に [設定の言語] を入れる。hint があれば HINT_SEPARATOR で単語に分け、OPENAI_KEYWORD_FORBIDDEN_CHARS のどれかを含む単語を除いた単語を `keywords[]` に入れる（残る単語が無ければ `keywords[]` を入れない）。`language`・`prompt` は入れない
               - `[WARNING]` keywords[] に入れない単語がある（除いた単語の数。単語そのものは書き込まない）
             - 始まらない場合、`language` に設定の言語を入れ、hint があれば `prompt` に hint をそのまま入れる
          2. 組み立てた項目を返却する
        unit_tests:
          - name: test_build_form_when_keywords_model
            case: 正常
            summary: gpt-transcribe は単語を keywords[]、言語を languages[] に入れる
            condition: model="gpt-transcribe"・language="ja"・hint="voice-paste、Whisper"
            mock: なし
            expected: '{"languages[]": ["ja"], "keywords[]": ["voice-paste", "Whisper"]} が返り、language・prompt が無い'
          - name: test_build_form_when_keywords_model_snapshot
            case: 正常
            summary: gpt-transcribe で始まるスナップショットも keywords[] で引き渡す
            condition: model="gpt-transcribe-2026-08-26"・hint="voice-paste"
            mock: なし
            expected: keywords[] が ["voice-paste"]、languages[] が [設定の言語]
          - name: test_build_form_when_keywords_model_no_hint
            case: 正常
            summary: 手がかりが無ければ keywords[] を入れない
            condition: model="gpt-transcribe"・hint=None
            mock: なし
            expected: '{"languages[]": ["ja"]} だけが返る'
          - name: test_build_form_when_forbidden_keyword
            case: 正常
            summary: < か > を含む単語は keywords[] に入れない
            condition: model="gpt-transcribe"・hint="<tag>、Whisper、a>b"
            mock: なし
            expected: keywords[] が ["Whisper"] だけで、WARNING のログに除いた単語の数 2 が書き込まれ、単語そのものが書き込まれていない
          - name: test_build_form_when_all_keywords_forbidden
            case: 正常
            summary: 全ての単語が除かれたら keywords[] を入れない
            condition: model="gpt-transcribe"・hint="<tag>"
            mock: なし
            expected: '{"languages[]": ["ja"]} だけが返る'
          - name: test_build_form_when_previous_model
            case: 正常
            summary: 前のモデルは今のまま language と prompt に入れる
            condition: model="gpt-4o-mini-transcribe"・language="ja"・hint="voice-paste、Whisper"
            mock: なし
            expected: '{"language": "ja", "prompt": "voice-paste、Whisper"} が返り、languages[]・keywords[] が無い'
        status: planned
        introduced:
          pr: 225
    refs:
      - API-2#
      - LIB-9#
      - NFR-1#requirements[OpenAIの文字起こしのタイムアウトと再送]
      - NFR-1#requirements[OpenAIへ送信する音声の上限]
    status: planned
    introduced:
      pr: 204
constants:
  - name: OPENAI_MAX_RETRIES
    title: OpenAI API へ送信し直す回数
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 429・5xx・タイムアウト・接続できないときに送信し直す上限（最初の 1 回を含まない）
    value: '2'
    status: planned
    introduced:
      pr: 204
  - name: OPENAI_RETRY_BASE_SEC
    title: 送信し直しの待ちの基数
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 指数バックオフの基数。n 回目の待ちは 0 から基数 × 2^n の間の一様な乱数
    value: '0.5'
    status: planned
    introduced:
      pr: 204
  - name: OPENAI_RETRY_MAX_SEC
    title: 送信し直しの待ちの上限
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 送信し直す前に待つ秒数の上限（Retry-After にもかける）
    value: '8.0'
    status: planned
    introduced:
      pr: 204
  - name: OPENAI_MAX_AUDIO_BYTES
    title: OpenAI API へ送信できる音声の大きさ
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 送信する前に確認する音声の上限（25 MB から要求の本文の固定の消費分を引いた値。非機能要件の OpenAIへ送信する音声の上限）
    value: '26_204_569'
    status: planned
    introduced:
      pr: 204
  - name: OPENAI_AUDIO_SUFFIXES
    title: OpenAI API が受ける音声の拡張子
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 送信する前に確認する拡張子（公式のリファレンスの file の形式）
    value: frozenset({".mp3", ".mp4", ".mpeg", ".mpga", ".m4a", ".wav", ".webm"})
    status: planned
    introduced:
      pr: 204
  - name: OPENAI_KEYWORDS_MODEL_PREFIX
    title: keywords[] と languages[] で渡すモデルの名前の頭
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 設定のモデルの名前がこれで始まれば、手がかりを keywords[]、言語を languages[] で引き渡す（スナップショットの名前も含める）
    value: '"gpt-transcribe"'
    status: planned
    introduced:
      pr: 225
  - name: OPENAI_KEYWORD_FORBIDDEN_CHARS
    title: keywords[] に入れられない文字
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    summary: 含むと OpenAI API が要求ごと拒む文字。改行は手がかりの単語に入らない（HINT_WORD_FORBIDDEN_CHARS）ため持たない
    value: ("<", ">")
    status: planned
    introduced:
      pr: 225
