title: "トレイの通知"
elements:
  - name: 通知
    id: tray_notification
    kind: notification
    position: 通知
    description: トレイのアイコンから出す Windows の通知。アプリ名は voice-paste。モーダルにせず、作業中のアプリの入力を遮らない。失敗の通知は警告のアイコン、コピーの完了の通知は情報のアイコンで出す
    visible_when: '`notify` で microphone_unavailable・transcription_failed・delivery_failed・api_unavailable を受けたとき、`notify_copied` でコピーの完了を受けたときと、文字起こしのエンジンを準備できなかった・設定ファイルを読めなかった起動のとき'
    source: UiBridge.notified（通知の種類と理由）・UiBridge.copied（起こした文字）
    action: 押すと、失敗の通知はログフォルダを開き、コピーの完了の通知は起こした文字をもう一度コピーする。閉じると待機中（トレイ）に戻る
  - name: 見出し
    id: notification_title
    kind: label
    position: 通知 > 見出し
    description: 何ができなかったか・何ができたかを短く出す（通知の種類ごとの文言は補足）
    io: 表示
    type: 文字列
    visible_when: 常時
    source: 通知の種類
  - name: 本文
    id: notification_body
    kind: label
    position: 通知 > 本文
    description: 失敗の通知は、理由を 1 文で出し、履歴に残っていること・次にすることを添える。コピーの完了の通知は、貼り付けることと、通知を押すとコピーし直せることを固定の文で出す
    io: 表示
    type: 文字列
    visible_when: 常時
    source: UiBridge.notified の理由（`notify` の detail）
  - name: ログフォルダを開く
    id: open_log_folder
    kind: action
    position: 通知 > 下
    description: 失敗の通知の操作。ログのフォルダをエクスプローラーで開く
    label: ログフォルダを開く
    visible_when: 失敗の通知（コピーの完了の通知を除く全ての通知）
    action: ログのフォルダを開く
  - name: もう一度コピー
    id: recopy
    kind: action
    position: 通知 > 下
    description: コピーの完了の通知の操作。その通知のときに起こした文字をクリップボードへもう一度書く。書けなければ `delivery_failed` の失敗の通知を出す
    visible_when: コピーの完了の通知
    source: UiBridge.copied の起こした文字
    action: 起こした文字をクリップボードへ書く
screen: src/voice_paste/ui/tray.py
mock: dev/mock/pages/tray-notification/37/a-notification/
lead: 裏の処理で起きた失敗と、「コピーのみ」のコピーの完了を Windows の通知で知らせる。通知は数秒で畳まれ、通知センターには残らない。畳まれた後は、失敗の理由をトレイのメニューの「ログフォルダを開く」から見る。
refs:
  - dev/設計書/モジュール構成/常駐アプリ/ホットキーと画面.py#functions[notify]
  - dev/設計書/シナリオ/単一ユースケース/常駐アプリを起動する#
notes:
  知らせの種類ごとの文言: |-
    | 通知 | 見出し | 本文 |
    | --- | --- | --- |
    | `microphone_unavailable` | 録音を開始できませんでした | マイクを使用できません。マイクが接続されているか、ほかのアプリが使用していないかを確認してください。 |
    | `transcription_failed` | 文字起こしできませんでした | {理由}。録音は履歴に残っています。 |
    | `delivery_failed` | 届けられませんでした | {理由}。起こした文字は履歴に残っています。 |
    | `api_unavailable` | API を使用できません | {理由}。ホットキーとトレイからの録音は使えます。 |
    | 文字起こしのエンジンを準備できない（`engine_unavailable`） | 起動できませんでした | 文字起こしのエンジンを準備できませんでした（{理由}）。設定を修正して再起動してください。 |
    | 設定ファイルを読めない（`settings_invalid`） | 起動できませんでした | 設定ファイルを読み込めませんでした（{理由}）。設定フォルダの settings.toml を修正して再起動してください。 |
    | コピーの完了（`notify_copied`） | コピーしました | 任意の場所に貼り付けてください。この通知を押すと、もう一度コピーします。 |

    {理由} は `notify` の `detail` を 1 文で出し、詳しい内容はログに書く。届けられないときは、どの出力先でも同じ見出しで出し、理由を変える。
  通知の操作: PySide6 のトレイの通知（`QSystemTrayIcon.showMessage`）は通知の中にボタンを置けないため、「ログフォルダを開く」「もう一度コピー」は「通知を押す（`messageClicked`）」で実現する。`messageClicked` はどの通知を押したかを渡さないため、トレイは最後に出した通知の種類と、コピーの完了なら起こした文字を持ち、押されたときにその種類で出し分ける。次の通知を出すと、種類を問わず持つものを置き換える
test_file: tests/integration/ui/test_tray_notification.py
