title: "トレイから操作する"
scenarios:
  - name: 正常シナリオ（ログフォルダを開く）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「ログフォルダを開く」を選ぶ
        TRAY->>TRAY: ログの置き場所が無ければ作る
        TRAY->>EXP: ログの置き場所を開く
      ```
    expected:
      - エクスプローラーでログの置き場所（`%LOCALAPPDATA%\voice-paste\log\`。データの置き場所を渡した起動ではその下の `log\`）が開いている
    test: test_normal_when_open_log_folder
  - name: 正常シナリオ（設定フォルダを開く）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「設定フォルダを開く」を選ぶ
        TRAY->>EXP: settings.toml のあるフォルダを開く
      ```
    expected:
      - エクスプローラーで `settings.toml` のあるフォルダ（`%APPDATA%\voice-paste\`。データの置き場所を渡した起動ではそのフォルダ）が開いている
    test: test_normal_when_open_settings_folder
  - name: 正常シナリオ（再起動する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        U->>TRAY: 「再起動」を選ぶ
        TRAY->>APP: 再起動を求め、アイコンを消す
        APP->>APP: ホットキーの受付・API の待ち受け・文字起こしワーカーを止める
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ
      ```
    expected:
      - 前の常駐アプリのプロセスが終わっている
      - 新しい常駐アプリが待機中になり、`settings.toml` の今の設定で動いている
    test: test_normal_when_restart
  - name: 正常シナリオ（終了する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant API as API のサーバー
        participant WK as 文字起こしワーカー（子プロセス）

        U->>TRAY: 「終了」を選ぶ
        TRAY->>APP: 終了を求め、アイコンを消す
        APP->>APP: ホットキーの受付を止める
        APP->>API: 待ち受けを止める
        APP->>WK: 終了を送り、終わらなければ止める
        APP->>APP: プロセスを終える
      ```
    expected:
      - トレイから voice-paste のアイコンが消えている
      - 常駐アプリと文字起こしワーカーのプロセスが終わり、常駐アプリの終了コードが 0 である
      - 127.0.0.1 の API が応えない
    test: test_normal_when_quit
  - name: 正常シナリオ（設定画面で値を変えたまま終了する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 設定画面
        description: 設定画面を開いて欄の値を変え、保存していない
      - name: 終え方
        description: トレイの「終了」と、起動したコンソールの Ctrl+Break の 2 通り
        notes: parametrize で並べる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant SW as 設定画面

        U->>TRAY: 「終了」を選ぶ（または Ctrl+Break）
        TRAY->>APP: 終了を求める
        APP->>SW: 変えた値を捨てる確認を出さずに閉じる
        APP->>APP: プロセスを終える
        Note over APP: 以降は 正常シナリオ（終了する） と同じ
      ```
    expected:
      - 変えた値を捨てる確認で止まらずに、常駐アプリのプロセスが終わり、終了コードが 0 である
    test: test_normal_when_quit_with_unsaved_settings
  - name: 正常シナリオ（設定画面で値を変えたまま再起動する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 設定画面
        description: 設定画面を開いて欄の値を変え、保存していない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant SW as 設定画面
        participant NEW as 新しい常駐アプリ

        U->>TRAY: 「再起動」を選ぶ
        TRAY->>APP: 再起動を求め、アイコンを消す
        APP->>SW: 変えた値を捨てる確認を出さずに閉じる
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 正常シナリオ（再起動する） と同じ
      ```
    expected:
      - 変えた値を捨てる確認で止まらずに、前の常駐アプリのプロセスが終わっている
      - 新しい常駐アプリが待機中になり、設定画面で変えた値は `settings.toml` に保存されていない
    test: test_normal_when_restart_with_unsaved_settings
lead: トレイのアイコンのメニューから、フォルダを開く・再起動する・終了する単一ユースケース。
issue: 21
primary_actor: 音声入力を使うユーザー
trigger: トレイの voice-paste のアイコンを右クリックしてメニューを開く
preconditions:
  - 常駐アプリが動いていて、トレイにアイコンが出ている
notes:
  メニューの項目: |-
    「録音を始める」（アイコンの既定の操作）・「設定…」・「設定フォルダを開く」・「ログフォルダを開く」・「再起動」・「終了」。「録音を始める」は 録音する、「設定…」は 設定を変える が扱う。
    「録音の画面を出す」は 録音する が扱う。
  録音中の操作: |-
    録音から届けるまでの間（API から始めた録音の間を含む）は「録音を始める」と「設定…」を押せなくし、項目名に理由を出す。
    その間に「再起動」・「終了」を選ぶと、トレイのアイコンは選んだ時点で消え、再起動・終了はその回が終わってから行う。
    ホットキー・トレイから始めた録音の間は、アイコンの左クリックと「録音の画面を出す」で、隠した録音の画面を戻す（録音する）。
    戻すのはその回に隠した録音の画面だけで、録音の画面を出さない設定の録音と API から始めた録音では、アイコンの左クリックは何もせず、「録音の画面を出す」は押せない。
  E2E のテスト: |-
    E2E の常駐アプリの起こし方と操作の渡し方は、常駐アプリを起動する の補足『E2E のテスト』と同じ。メニューは項目を trigger して選ぶ。
    フォルダが開いたことは、エクスプローラーを開かず、フォルダを開く呼び出しを差し替えて渡されたパスで確かめる。
    トレイのアイコンが消えたことは、トレイのアイコンが出ていない状態になったことで、終了コードは `main()` の戻り値で確かめる。
    常駐アプリのプロセスが終わることは、終了・再起動とも `main()` が戻ったことで確かめる。文字起こしワーカーのプロセスが終わることは、`main()` が戻った後に pytest のプロセスの子孫にワーカーが残っていないことで確かめる。
    Ctrl+Break は、テストが自分のプロセスの中で SIGBREAK を上げて（`signal.raise_signal`）渡す。
    再起動で起動し直す新しいプロセスは別プロセスで動き（Qt は offscreen）、待機中になったことをログとトークンのファイルで確かめる
test_file: tests/e2e/単一ユースケース/test_operate_from_tray.py
