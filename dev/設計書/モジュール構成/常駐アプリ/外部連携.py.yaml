  - name: send_paste
    title: 貼り付けのキーの送信
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: pynput で設定の貼り付けのキー（既定 Ctrl+V）を今のアクティブなウィンドウへ送る
    args:
      - name: paste_key
        type: str
        required: true
        passing: positional
        description: 貼り付けのキー（pynput の GlobalHotKeys の書式。設定の keyboard.paste_key）
    returns:
      type: None
      description: なし
    process: |-
      1. paste_key を `+` で区切り、各キーの前後の空白を除いて小文字にする（`<Ctrl> + v` も `<ctrl>+v` と同じに扱う。刷新前と同じ）
      2. `<ctrl>`・`<shift>`・`<alt>`・`<cmd>`・`<win>` を修飾キー、それ以外を主キーにする
         - 主キーが 1 つでない場合、DeliveryError を送出する（キーを送らない）
      3. FOCUS_SETTLE_SEC だけ待つ（貼り付け先のフォーカスが落ち着くのを待つ）
      4. 修飾キーを順に押し、主キーを押して離し、修飾キーを逆順に離す
         - `[INFO]` 貼り付けのキーを送った（paste_key）
