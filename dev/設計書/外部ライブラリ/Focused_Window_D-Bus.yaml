title: "Focused Window D-Bus"
kind: "サービス"
version:
  current: ユーザーが入れたバージョン（バージョンを指定していない）
  checked_on: '2026-11-01'
  pinning: 固定しない。ユーザーが GNOME Shell の拡張として入れる
catalogs:
  - name: D-Bus のメソッド
    version: ユーザーが入れたバージョン
    entries:
      - name: org.gnome.shell.extensions.FocusedWindow.Get
        kind: メソッド
        purpose: フォーカスしているウィンドウの `wm_class`・`wm_class_instance` を読み、端末アプリかを見分ける
        description: セッションバスのバス名 `org.gnome.Shell`・パス `/org/gnome/shell/extensions/FocusedWindow` にある。常駐アプリは `gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/shell/extensions/FocusedWindow --method org.gnome.shell.extensions.FocusedWindow.Get` を子プロセスで呼ぶ。拡張が無い・無効のときは D-Bus のエラーになり、`gdbus` が終了コード 1 を返す。常駐アプリは読めなかったとして扱い、設定の貼り付けのキーを送信する
        returns:
          - name: '-'
            type: (s)
            description: ウィンドウの情報の JSON の文字列 1 つのタプル（`gdbus` は `('{...}',)` の書式で出す）
          - name: wm_class
            type: string
            description: ウィンドウのクラス名（Xorg の WM_CLASS と同じ名前。GNOME Terminal は `gnome-terminal-server`）
          - name: wm_class_instance
            type: string
            description: ウィンドウのインスタンス名
          - name: title
            type: string
            description: ウィンドウのタイトル（常駐アプリは使わない）
        returns_example: |-
          ```
          ('{"wm_class":"gnome-terminal-server","wm_class_instance":"gnome-terminal-server","title":"端末", ...}',)
          ```
lead: GNOME Shell の拡張。フォーカスしているウィンドウの `wm_class`・`wm_class_instance`・タイトルなどを、セッションバスの D-Bus のメソッドから JSON で返す。
supplier: flexagoon
dependency_scope: 任意
adoption: 採用
used_in:
  - src/voice_paste/integrations/keyboard/active_window_wayland.py
upstream: flexagoon/focused-window-dbus
verification:
  state: 済
  date: '2026-11-01'
  detail: PoC [#239](https://github.com/shuhei1101/voice-paste/pull/239) で、Ubuntu 24.04・GNOME 46 の Wayland のセッションに拡張を入れ、`gdbus call` で `Get` を呼んだ。GNOME Terminal は `gnome-terminal-server`、GNOME テキストエディターは `org.gnome.TextEditor`、Qt の Wayland のウィンドウは `python3`、XWayland のウィンドウはスクリプト名を `wm_class`・`wm_class_instance` に返し、読む時間は 0.006〜0.009 秒だった。拡張を無効にすると `gdbus` が終了コード 1 を返す（[結果の記録](https://github.com/shuhei1101/voice-paste/blob/9ae7a3f4a19829ae3396ce1878d2400c11fa205f/poc/linux_tray_and_wayland_terminal/223_poc_results.txt)）
license: MIT（常駐アプリに同梱せず、D-Bus で呼ぶだけ）
official_url: https://extensions.gnome.org/extension/5592/focused-window-d-bus/
install: ユーザーが GNOME の拡張のページ（公式 URL）か「拡張機能マネージャー」で入れて有効にする。対応する GNOME Shell のバージョンは公式 URL のページで確かめる。呼び出しに使う `gdbus` は Ubuntu の `libglib2.0-bin` に入っている
refs:
  - dev/設計書/シナリオ/単一ユースケース/起こした文字を届ける#
