id: MOD-76
title: 常駐アプリ / 外部連携 / credentials.py
test_files:
  - tests/unit/voice_paste/integrations/openai/test_credentials.py
constants:
  - name: OPENAI_API_KEY_ENV
    title: OpenAI の API キーの環境変数
    container: integrations/openai/credentials.py
    usecase: 常駐アプリを起動する
    summary: read_openai_api_key が秘匿のファイルより先に読む環境変数の名前（OpenAI の公式 SDK と同じ名前）
    value: '"OPENAI_API_KEY"'
    status: planned
    introduced:
      pr: 204
functions:
  - name: read_openai_api_key
    title: OpenAI の API キーの読み込み
    kind: 関数
    container: integrations/openai/credentials.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 環境変数 OPENAI_API_KEY があればそれを、無ければ秘匿のファイルの中身を、前後の空白を除いて SecretStr で返す。設定のエンジンが openai のときだけ起動の配線が 1 回呼ぶ
    args:
      - name: key_file
        type: Path
        required: true
        passing: positional
        description: API キーのファイル（AppPaths.openai_api_key_file）
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（main.py が os.environ を渡す）
    returns:
      type: pydantic.SecretStr
      description: API キー
    process: |-
      1. environ の OPENAI_API_KEY_ENV の値の前後の空白を除き、空でなければ返す
      2. key_file を UTF-8 で読み、前後の空白と改行を除いて、空でなければ返す
         - ファイルが無い・読めない・空の場合、StartupError を送出する（理由は「OpenAI の API キーがありません: 環境変数 OPENAI_API_KEY か {key_file} に置いてください」。キーの中身は書かない）
           - `[ERROR]` OpenAI の API キーを読めなかった（環境変数の名前・ファイルのパス）
    exceptions:
      - name: StartupError
        condition: 環境変数にもファイルにも API キーが無い（空白だけのときを含む）
    unit_tests:
      - name: test_read_openai_api_key_when_env
        case: 正常
        summary: 環境変数を先に使う
        condition: 'environ={"OPENAI_API_KEY": " sk-env "}、key_file にも別のキーがある'
        mock: なし
        expected: get_secret_value() が "sk-env"
      - name: test_read_openai_api_key_when_file
        case: 正常
        summary: 環境変数が無ければファイルを読む
        condition: environ={}、key_file の中身が "sk-file\n"
        mock: なし
        expected: get_secret_value() が "sk-file"
      - name: test_read_openai_api_key_when_missing
        case: 異常
        summary: どちらにも無ければ起動の失敗にする
        condition: environ={} で、key_file が無い場合と、中身が空白だけの場合
        mock: なし
        expected: どちらも StartupError が送出され、理由に OPENAI_API_KEY と key_file のパスが入り、キーの中身は入らない
        exception: 環境変数にもファイルにも API キーが無い（空白だけのときを含む）
    status: planned
    introduced:
      pr: 204
