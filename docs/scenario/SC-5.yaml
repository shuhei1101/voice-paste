      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant HS as Haas の文字起こしのサーバー（WSL）
        participant LOG as ログ
        participant TRAY as トレイ

        U->>SVC: 起動する
        Note over SVC: 準備中のアイコンを出すまでは 正常シナリオ と同じ
        SVC->>HS: 設定の接続先へ応答を確認する
        HS-->>SVC: 起動の引数で受けたモデル・計算の精度・装置
        SVC->>SVC: 設定のモデル・計算の精度・装置と違う
        SVC->>LOG: 違う値と、設定の値で動かすにはサーバーを止めてから起動し直すことを書き込む
        SVC->>TRAY: 動いているサーバーが設定と違う値で動いていることを通知する
        SVC->>SVC: そのサーバーで Haas のエンジンを作る（サーバーを起動せず、止めない）
