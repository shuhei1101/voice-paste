        returns:
          type: str
          description: そのままの文言
        unit_tests:
          - name: test_edge_phrase_settings
            case: 正常
            summary: 文言と位置を読む
            condition: text 「 ご視聴ありがとうございました 」・position 無し
            mock: なし
            expected: text が「ご視聴ありがとうございました」、position が end
          - name: test_edge_phrase_settings_when_wildcard_only
            case: 異常
            summary: '`*` だけの文言を断る'
            condition: Settings の edge_phrases の 2 件目の text が「 * 」
            mock: なし
            expected: ValidationError。失敗の type が EDGE_PHRASE_WILDCARD_ONLY_ERROR_TYPE、場所が ("edge_phrases", 1, "text")
    refs:
      - dev/設計書/設定/常駐アプリ#settings[edge_phrases[].text]
      - dev/設計書/設定/常駐アプリ#settings[edge_phrases[].position]
