notes:
  反映の列の読み方: '`immediate` は設定画面で保存すると動いている常駐アプリに効く項目。`.env` を直接書き換えたときは、どの項目も再起動まで効かない（起動時に 1 度だけ読む）。'
  値の読み方: bool の項目は小文字にして `true` のときだけ真として扱う。数値の項目に数値でない値があると、起動時に設定を読むところで例外になり起動できない。
  新しい構成の設定への移行: |-
    `.env` から settings.toml への写し方は `--migrate-env` で行う（`src/voice_paste/shared/env_migration.py` の migrate_env）。`.env` は読むだけで書き換えも改名もしない。
    `RESIDENT_MODE` は 1 回だけ実行する起動が無くなるため写さない。`.env` に無いキー・空のキーは settings.toml の既定値になる。
    普段使いの `.env` を移して `.env.migrated` に改名するのは、起動を切り替える #22 の反映作業で 1 度だけ行う。
