id: MOD-39
visibility: internal
title: 常駐アプリ / ホットキーと画面 / settings_hints.py
test_files:
  - tests/unit/voice_paste/ui/windows/test_settings_hints.py
classes:
  - name: HintPresetPanel
    title: 表記のヒントの長さとプリセットの一覧
    container: ui/windows/settings_hints.py
    usecase: 設定を変える
    role: 画面の部品
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    summary: 設定画面の「表記のヒント」のまとまりに配置する、有効なヒントの長さ・プリセットのまとまりの縦の並び・「プリセットを追加」・補足。プリセットと単語の追加・削除・並べ替えを受け、長さを数え直す
    description: |-
      要素（説明・有効なヒントの長さ・一覧・空の案内・有効の切り替え・単語の数と長さ・名前・列の見出し・単語・読み込み・単語を削除・単語が無いときの文・単語を追加・上へ・下へ・削除・追加・補足）と読み上げの名前は画面設計「設定画面」が持つ。
      プリセットのまとまりは PresetListPanel と同じ構造（頭に切り替え・名前・上へ・下へ・削除、下に欄）で作る。単語の欄は、単語の入力・読みの入力・削除ボタンを 1 行に（幅は単語 3 : 読み込み 2）、上から下が単語の順に縦に追加する。単語が 1 つ以上あるときだけ、上に列の見出し「語」「読み」を左端を欄に合わせて出す。エラーはその行の下に出す。
      長さは欄の入力・切り替え・追加・削除・並べ替えのたびに、今の欄の値（プリセットごとの有効かと単語の並び。HintWordSource を満たす値で、HintPresetSettings にはしない）を join_hint_words でつないだ UTF-8 のバイト数で数え直し、HINT_MAX_BYTES を超えたらバーと数字を赤にして「（{超えた分} バイト超過）」を添える。空の名前・空の単語・区切りを含む単語もそのまま数える（確かめは保存で行う）。
      無効のプリセットの単語の欄は、用語集のオフの行と同じく文字を薄くして取り消し線を引く（編集はできる）。
      追加・削除・並べ替えはこの部品の中だけを変え、settings.yaml へは設定画面の保存で書き込む。
      変えた欄の数えのため、プリセットごとに、開いたとき・保存したときのプリセットを追う番号を持つ。set_presets と mark_saved で今の並びの順に 0 から振り直し、追加したプリセットには振ったどの番号より大きい番号を振る。削除・並べ替え・単語の追加・削除で一覧を作り直しても番号を引き継ぐ。単体テストは tests/unit/voice_paste/ui/windows/test_settings_hints.py に配置する。
    properties:
      - name: changed
        type: Signal()
        description: 追加・削除・並べ替え・切り替え・欄の入力で値が変わった（設定画面が変えた欄の数えに使用する）
    methods:
      - name: set_presets
        title: 一覧に入れる
        kind: メソッド
        scope: public
        summary: 引き渡したプリセットで一覧を作り直し、長さを数え直す。空なら空の案内を出す
        args:
          - name: presets
            type: Sequence[HintPresetSettings]
            required: true
            passing: positional
            description: 設定の hint_presets
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_hint_preset_panel_set_presets_when_readings
            case: 正常
            summary: 読みを単語の欄の右に出す
            condition: 単語 2 つ・読みは 1 つ目だけのプリセットを set_presets に引き渡す。QT_QPA_PLATFORM=offscreen
            mock: なし
            expected: hint_reading_0_0 に読みが、hint_reading_0_1 が空で、列の見出しが出ている
          - name: test_hint_preset_panel_set_presets_when_no_words
            case: 正常
            summary: 単語が無ければ列の見出しを出さない
            condition: 単語の無いプリセットを set_presets に引き渡す
            mock: なし
            expected: 列の見出しが隠れ、単語が無いときの文が出ている
      - name: collect
        title: 一覧の値の収集
        kind: メソッド
        scope: public
        summary: 今の並びのプリセットを 設定と同じ構造の dict（name・words・enabled）の並びにする。空の単語の欄もそのまま入れ（確かめで断る）、前後の空白は設定のモデルが除く
        returns:
          type: list[dict[str, Any]]
          description: hint_presets の並び。readings は全ての単語の読みが空なら空の一覧
        unit_tests:
          - name: test_hint_preset_panel_collect
            case: 正常
            summary: 入れたプリセットをそのまま集める
            condition: 有効な「開発」（単語 voice-paste・Whisper）と無効な「会議」（単語 議事録）を set_presets する
            mock: なし（offscreen）
            expected: collect が 2 件を同じ並びで返却し、1 件目の words が ["voice-paste", "Whisper"]・enabled True、2 件目の enabled False
          - name: test_hint_preset_panel_move
            case: 正常
            summary: 下へで並びを入れ替える
            condition: A・B の 2 件で、A の「下へ」を押す
            mock: なし（offscreen）
            expected: collect の名前が B・A の順
          - name: test_hint_preset_panel_collect_when_readings
            case: 正常
            summary: 読みを単語と同じ並びで集める
            condition: 1 つ目の単語に読みを入れ、2 つ目は空
            mock: なし
            expected: readings が [読み, ""]
          - name: test_hint_preset_panel_collect_when_no_readings
            case: 正常
            summary: 全ての読みが空なら空の一覧
            condition: 単語 2 つで読みは全て空
            mock: なし
            expected: readings が []
          - name: test_hint_preset_panel_collect_when_word_removed
            case: 正常
            summary: 単語を削除すると読みも消える
            condition: 単語 A（読み あ）・B（読み い）の A を削除する
            mock: なし
            expected: words が ["B"]、readings が ["い"]
      - name: add_preset
        title: プリセットを追加
        kind: メソッド
        scope: public
        summary: 末尾に名前と単語が空で有効のプリセットを追加し、名前の欄へフォーカスを移して changed を emit する。「プリセットを追加」が呼ぶ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_hint_preset_panel_add_preset
            case: 正常
            summary: 追加したプリセットは有効で始まる
            condition: 空の一覧で add_preset を呼ぶ
            mock: なし（offscreen）
            expected: collect が 1 件（enabled True・name が空・words が空）を返却し、changed が 1 回 emit され、空の案内が消える
      - name: add_word
        title: 語を追加
        kind: メソッド
        scope: public
        summary: そのプリセットの単語の末尾に空の欄を追加してフォーカスを移し、changed を emit する。「語を追加」が呼ぶ
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: 一覧の何件目のプリセットか（0 から）
        returns:
          type: None
          description: なし
      - name: hint_length
        title: 有効なヒントの長さ
        kind: メソッド
        scope: public
        summary: 今の欄の値で、有効なプリセットの単語をつないだ UTF-8 のバイト数を返却する（長さの行の表示と同じ値）
        returns:
          type: int
          description: バイト数
        unit_tests:
          - name: test_hint_preset_panel_hint_length
            case: 正常
            summary: 切り替えと入力で長さを数え直す
            condition: 有効な「開発」（単語 abc）と無効な「会議」（単語 議事録）を入れ、「会議」を有効に切り替える
            mock: なし（offscreen）
            expected: 切り替える前は 3、切り替えた後は 15（abc、議事録）。長さの行の文字が「15 / 222 バイト」
          - name: test_hint_preset_panel_hint_length_when_over
            case: 正常
            summary: 上限を超えたら超過を文字で添える
            condition: 有効なプリセットにつないだ長さが 258 バイトになる単語を入れる
            mock: なし（offscreen）
            expected: 長さの行の文字が「258 / 222 バイト（36 バイト超過）」
          - name: test_hint_preset_panel_hint_length_when_unvalidated
            case: 正常
            summary: 追加した直後と、区切りを含む単語を入れた直後にも長さを数え直せる
            condition: 空の一覧で add_preset を呼び（名前と単語が空）、add_word で追加した単語の欄に「A、B」を入れる
            mock: なし（offscreen）
            expected: 例外が出ず、追加した直後の hint_length が 0、入れた後の hint_length が 5（A、B の UTF-8 のバイト数）
      - name: focus_field
        title: 欄へフォーカスを移す
        kind: メソッド
        scope: public
        summary: 失敗の場所で欄を探し、フォーカスを移す（エラーの一覧の行を押したとき）。場所が `hint_presets` だけなら長さの行へ移す
        args:
          - name: location
            type: tuple[int | str, ...]
            required: true
            passing: positional
            description: hint_presets より後ろの失敗の場所（例 (1, "words", 3)・(1, "readings", 3)・(2, "name")・()）
        returns:
          type: None
          description: なし
      - name: change_values
        title: 変えた件数を数える値
        kind: メソッド
        scope: public
        summary: 変えた欄の数えに使用する値を、プリセット 1 つ = 1 キーと、並べ替えの 1 キーで返却する（SettingsWindow が開いたとき・保存したときの値と比べて件数にする）
        returns:
          type: dict[str, object]
          description: '`hint_presets[{番号}]` → （名前, 単語の並び, 読みの並び, 有効か）（collect と同じ値）、`hint_presets.order` → 開いたとき・保存したときからあって今も残っているプリセットが、番号の小さい順に並んでいるか'
        process: |-
          1. 今の並びのプリセットごとに、番号をキーにして名前・単語の並び・有効かを入れる
          2. set_presets か mark_saved で番号を振ったプリセット（追加したプリセットを除く）を今の並びで取り出し、番号の小さい順に並んでいるかを `hint_presets.order` に入れる（削除したプリセットは入らず、追加したプリセットも確認しないため、追加・削除だけでは変わらない）
        unit_tests:
          - name: test_hint_preset_panel_change_values
            case: 正常
            summary: プリセットごとの値と並びの値を返却する
            condition: 有効な「開発」（単語 voice-paste）と無効な「会議」（単語 議事録）を set_presets する
            mock: なし（offscreen）
            expected: キーは 3 つで、hint_presets[0] が（"開発", ["voice-paste"], True）、hint_presets[1] が（"会議", ["議事録"], False）、hint_presets.order が True
          - name: test_hint_preset_panel_change_values_when_moved
            case: 正常
            summary: 並べ替えるとプリセットの値は変わらず、並びの値だけが変わる
            condition: A・B・C の 3 件を set_presets し、A の「下へ」を押す
            mock: なし（offscreen）
            expected: hint_presets[0]・[1]・[2] が並べ替える前と同じ値で、hint_presets.order が False
          - name: test_hint_preset_panel_change_values_when_removed
            case: 正常
            summary: 途中のプリセットを削除しても並びの値は変わらない
            condition: A・B・C の 3 件を set_presets し、B の「削除」を押す
            mock: なし（offscreen）
            expected: キーは hint_presets[0]・hint_presets[2]・hint_presets.order の 3 つで、hint_presets[2] が C の値、hint_presets.order が True
          - name: test_hint_preset_panel_change_values_when_added
            case: 正常
            summary: 追加したプリセットは新しい番号で返却し、並びの値に入れない
            condition: A の 1 件を set_presets し、add_preset を呼んでから、追加したプリセットの「上へ」を押す
            mock: なし（offscreen）
            expected: hint_presets[0] が A の値、hint_presets[1] が（"", [], True）、hint_presets.order が True
          - name: test_hint_preset_panel_change_values_when_word_removed
            case: 正常
            summary: 単語を削除して一覧を作り直しても番号を引き継ぐ
            condition: A（単語 x・y）と B の 2 件を set_presets し、A の単語 x を削除する
            mock: なし（offscreen）
            expected: hint_presets[0] が（"A", ["y"], True）、hint_presets[1] が B の値のまま、hint_presets.order が True
        status: implemented
      - name: mark_saved
        title: 保存したプリセットを基準にする
        kind: メソッド
        scope: public
        summary: 今の並びの順にプリセットの番号を 0 から振り直し、追加したプリセットも保存したプリセットとして扱う。SettingsWindow.save が書き込めた後に呼ぶ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_hint_preset_panel_mark_saved
            case: 正常
            summary: 保存した並びと追加したプリセットを基準にする
            condition: A・B の 2 件を set_presets し、B の「上へ」を押して add_preset を呼び、mark_saved を呼ぶ
            mock: なし（offscreen）
            expected: hint_presets[0] が B、hint_presets[1] が A、hint_presets[2] が（"", [], True）の値で、hint_presets.order が True。続けて add_preset を呼ぶと hint_presets[3] が増える
        status: implemented
    refs:
      - SCR-9#
    status: implemented
