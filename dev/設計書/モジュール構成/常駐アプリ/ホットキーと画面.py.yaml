  - name: SettingsWindow
    title: 設定画面
    container: ui/windows/settings_window.py
    usecase: 設定を変える
    role: 画面
    summary: Settings のモデルから欄を組み立ててまとまりに並べ、保存で確かめてから書く
    description: |-
      要素と入力チェックは画面設計「設定画面」が持つ。
      欄は `Settings.model_fields` を辿って型から部品を決め、欄の名前は各項目の `description`、「再起動で反映」の印は `json_schema_extra` の reload から出す。まとまりと型から決まらない部品は画面設計の補足「まとまりと欄」の表を FIELD_LAYOUT に写す（「画面」のまとまりは `ui.theme` を先頭に置く）。
      設定のモデルは開いたときの設定のモデル（`type(設定)`。main.py の SETTINGS_MODEL）を使い、失敗の場所の判別子の値から出力先のモデルをその output_models で引く。
      出力先は outputs[] の 1 件ごとに、名前を UiDeps.output_titles から引いて「オン」と「ホットキー」の欄を置き、その出力先のモデルが id・enabled・hotkey のほかに持つ項目（貼り付けて送信の enter_delay_sec など）を型から決めた部品で並べる。その項目の `json_schema_extra` に note があれば欄の下に出す（出力先の ID ごとの分け方を持たない）。
      リテラルの列挙の一覧（貼り付けて送信の enter_modifiers など）は、列挙の値ごとのチェックボックスを欄の名前の下の行に横に並べ、オンにした値を列挙の並びで一覧にする。チェックボックスの名前はその項目の `json_schema_extra` の choice_labels（無ければ値そのまま）、objectName は `field_{キー}_{値}`。
      リテラルの列挙の 1 つを選ぶ欄（ui.position・ui.theme など）は make_radio_group にその項目の choice_labels を渡してラジオボタンの名前にし、保存では selected_radio が返す値を設定に入れる。
      カスタムプリセットは、PRESET_KIND_NAMES の種類ごとにまとまり（「出力先」のすぐ下のタブ）を 1 つ作り、その中に PresetListPanel とその種類の preset_options の欄を置く。Authorization の欄は `QLineEdit.EchoMode.Password` にする。
      エラーの一覧のプリセットの行は、失敗の場所 `presets[{n}].{項目}` を「プリセット「{タイトル}」の{欄の名前}」（タイトルが空なら「プリセット {そのタブの中の何件目か} 件目の{欄の名前}」）にし、押すとそのタブへ切り替えて PresetListPanel.focus_field で欄へフォーカスを移す。
      ホットキーの欄は押したキーを format_hotkey の形で出し、parse_hotkey で pynput の書式に戻す。
      コンストラクタは UiDeps を受ける。欄の部品は設定のキーを使った objectName（`field_{キー}`。プリセットの欄は画面設計の項目 ID）を持つ。窓が閉じたら（保存して再起動・今すぐ再起動・取り消し・窓の閉じるのどの経路でも。「保存」では閉じない）closed を emit する。
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    properties:
      - name: saved
        type: Signal()
        description: 保存した（UiController.on_settings_saved へ）
      - name: restart_requested
        type: Signal()
        description: 「保存して再起動」「今すぐ再起動」
      - name: _deps
        type: UiDeps
        access: 内部 (_)
        description: 設定の読み書き
      - name: _original
        type: Settings
        access: 内部 (_)
        description: 開いたときの設定（変えた欄の数えと「再起動で反映」の変更の判定に使う）
      - name: closed
        type: Signal()
        description: 窓が閉じた（UiController.on_settings_closed へ）
    methods:
      - name: collect
        title: 欄の値の収集
        summary: 全ての欄の値を settings.toml と同じ形の dict にする
        kind: メソッド
        scope: internal
        returns:
          type: dict[str, Any]
          description: Settings.model_validate へ渡す値。presets はブラウザ添付のタブの並び → エンドポイントへ送るのタブの並びの順（各 PresetListPanel.collect をつなぐ）。glossaries は GlossaryPanel.collect、active_glossary は GlossaryPanel.active_name。hint_presets は HintPresetPanel.collect。glossary_path は置かない
      - name: save
        title: 保存
        summary: 欄の値を設定のモデルで確かめ、通れば書いて効かせ、窓を開いたまま保存した知らせを出す（restart のときだけ閉じる）。通らなければエラーを出す
        kind: メソッド
        scope: public
        args:
          - name: restart
            type: bool
            required: true
            passing: keyword
            description: 保存の後に再起動するか（「保存して再起動」）
        returns:
          type: bool
          description: 保存できたか
        process: |-
          1. collect した値を Settings.model_validate に渡し、あわせて GlossaryPanel.row_errors で用語集の行（誤変換か正しい表記の片方だけが空）を確かめる
             - ValidationError か行の失敗がある場合、失敗ごとに to_field_message で欄ごとのエラーにし（行の失敗は「誤変換を入れてください。」「正しい表記を入れてください。」）、エラーの一覧と欄の下のエラーを出して一覧へフォーカスを移し、False を返す（入れた値は消さない）
               - `[INFO]` 設定画面の値が確かめに通らなかった（キーの一覧）
          2. save_settings（UiDeps）に、確かめた設定と GlossaryPanel.changed_rows（行を変えた用語集と足した用語集の場所 → 行）を渡して書いて効かせる
             - HotkeyError の場合、エラーの一覧に「ホットキーを受け付けられませんでした（{理由}）。別のキーにしてください。」を出し、False を返す（settings.toml も用語集の CSV も書かれていない）
               - `[WARNING]` 保存するホットキーを受け付けられなかった（理由）
             - OSError の場合、エラーの一覧に「設定ファイルを書けませんでした（{理由}）」を出し、False を返す（用語集の CSV を書けないときも同じ文言で、理由にそのパスが出る）
               - `[ERROR]` 設定ファイルを書けなかった（logger.exception）
          3. GlossaryPanel.mark_saved で用語集の書き戻しの基準を保存した行へ置き直し、変えた欄の数えの基準（`_baseline`）を今の欄の値へ置き直す（「再起動で反映」の件数の基準は開いたときの値のまま）
          4. saved を emit する
             - restart の場合、restart_requested を emit して窓を閉じ、True を返す
          5. 窓を開いたまま、保存した知らせを出して、同じ文を `QAccessible.updateAccessibility(QAccessibleAnnouncementEvent(知らせ, 文))` で読み上げにも伝え、True を返す（入れた値・選んでいたまとまり・欄のフォーカスはそのまま）
             - 知らせの文は「保存しました。」。ホットキーの欄（`hotkeys.*`・`outputs[].hotkey`・`presets[].hotkey`。`keyboard.paste_key` は含めない）のどれかが開いたときの値から変わっていれば「新しいホットキーは、設定画面を閉じると効きます。」を続ける
             - 開いたときの値から変わった「再起動で反映」の欄がある場合、「「再起動で反映」の設定 {件数} 件は、再起動するまで前の値で動きます。」を続け、今すぐ再起動のボタンを出して、再起動の知らせと保存して再起動のボタンを隠す
             - 欄を変えると知らせ（と今すぐ再起動のボタン）を消し、開いたときの値から数えた再起動の知らせと保存して再起動のボタンを出し直す
        unit_tests:
          - name: test_save
            case: 正常
            summary: 通った値を書く
            condition: 「録音中の音量の割合」を 30 にして save(restart=False)
            mock: UiDeps.save_settings・QAccessible.updateAccessibility（渡したイベントを控える）
            expected: True。save_settings に recording.volume_percent=30 の Settings が渡り、saved が 1 回 emit される。窓が開いたままで closed が知らされず、保存した知らせが「保存しました。」で、欄の値と選んでいたまとまりがそのまま。QAccessible.updateAccessibility が 1 回呼ばれ、渡したイベントの文が「保存しました。」
          - name: test_save_when_invalid
            case: 異常
            summary: 通らなければ書かずにエラーを出す
            condition: 「貼り付けてから Enter を送るまでの秒数」に abc
            mock: UiDeps.save_settings
            expected: False。save_settings が呼ばれず、エラーの一覧に outputs[0].enter_delay_sec の行が出て、欄の値が abc のまま
            exception: 確かめに通らない
          - name: test_save_when_hotkey_unavailable
            case: 異常
            summary: ホットキーを受け付けられなければエラーを出し、保存した知らせを出さない
            condition: save_settings が HotkeyError を送出する
            mock: UiDeps.save_settings
            expected: False。エラーの一覧に「ホットキーを受け付けられませんでした」の行が出て、saved が emit されず、保存した知らせが隠れたままで、窓が開いたまま
            exception: ホットキーを受け付けられない
          - name: test_save_when_presets
            case: 正常
            summary: タブごとのプリセットを 1 つの一覧にして書く
            condition: エンドポイントへ送るのタブでプリセットを 1 件足し、ブラウザ添付のタブでも 1 件足して（どちらもタイトル・URL を入れる）save(restart=False)
            mock: UiDeps.save_settings
            expected: True。save_settings に渡った Settings の presets が [browser の 1 件, endpoint の 1 件] の順
          - name: test_save_when_preset_invalid
            case: 異常
            summary: タイトルが空のプリセットは書かずにエラーを出す
            condition: ブラウザ添付のタブでプリセットを 1 件足し、URL だけ入れて save(restart=False)
            mock: UiDeps.save_settings
            expected: 'False。save_settings が呼ばれず、エラーの一覧に「プリセット 1 件目のタイトル: タイトルを入れてください。」の行が出る'
            exception: 確かめに通らない
          - name: test_save_when_enter_modifiers
            case: 正常
            summary: オンにした修飾キーを一覧にして書く
            condition: 「Enter と一緒に押す修飾キー」の「Shift」と「Ctrl」をこの順にオンにして save(restart=False)
            mock: UiDeps.save_settings
            expected: True。save_settings に渡った Settings の貼り付けて送信の enter_modifiers が ["ctrl", "shift"]。チェックボックスの名前が「Ctrl」「Alt」「Shift」
          - name: test_save_when_theme
            case: 正常
            summary: 明暗の欄で選んだ値を保存する
            condition: ui.theme=system の設定で開き、「画面」のまとまりの「ライト」を選んで保存する。QT_QPA_PLATFORM=offscreen
            mock: UiDeps.save_settings
            expected: save_settings に ui.theme=light の設定が渡る
          - name: test_save_when_glossaries
            case: 正常
            summary: 用語集の一覧と補正に使う用語集を設定に入れ、行を変えた用語集だけを書き戻しに渡す
            condition: 2 件の用語集を持つ設定で開き、2 件目の行を 1 つオフにし、補正に使う用語集を 2 件目にして保存する
            mock: UiDeps.save_settings（引数を控える）・list_glossaries・read_glossary（決まった一覧と行を返す）
            expected: 渡した設定の glossaries が 2 件で active_glossary が 2 件目の名前、glossary_path が None。書き戻しの引数は 2 件目の場所だけを持ち、その行がオフになっている
          - name: test_save_when_glossaries_untouched
            case: 正常
            summary: 用語集を変えずに保存すると、書き戻す CSV は無い
            condition: 今までの用語集 1 件だけの設定で開き、ホットキーだけを変えて保存する
            mock: UiDeps.save_settings（引数を控える）・list_glossaries・read_glossary
            expected: 書き戻しの引数が空。渡した設定の glossaries がその 1 件
          - name: test_save_when_glossary_invalid
            case: 異常
            summary: 名前の重なりと片方が空の行では保存せず、エラーを出す
            condition: 足した用語集の名前を 2 件目と同じにし、その 2 行目の誤変換を空にして保存する
            mock: UiDeps.save_settings（呼ばれたかを控える）・list_glossaries・read_glossary
            expected: 'False。save_settings は呼ばれず、エラーの一覧に「用語集 3 件目の名前: …」と「用語集 3 件目の 2 行目の誤変換: 誤変換を入れてください」が出る'
          - name: test_save_when_hint_presets
            case: 正常
            summary: 表記のヒントのプリセットを設定に入れて書く
            condition: 「表記のヒント」でプリセットを 1 件足して名前「開発」と語 voice-paste を入れ、save(restart=False)
            mock: UiDeps.save_settings
            expected: True。save_settings に渡った Settings の hint_presets が [「開発」（words ["voice-paste"]・enabled True）]
          - name: test_save_when_hint_too_long
            case: 異常
            summary: 有効なヒントが上限を超えたら書かずにエラーを出す
            condition: 有効なプリセットにつないだ長さが 223 バイトになる語を入れ、save(restart=False)
            mock: UiDeps.save_settings
            expected: False。save_settings が呼ばれず、エラーの一覧と長さの行の下に「有効なヒントが長すぎます（223 / 222 バイト）。…」が出る
            exception: 確かめに通らない
          - name: test_save_when_hint_word_invalid
            case: 異常
            summary: 空の語と区切りを含む語では保存せず、エラーを出す
            condition: プリセット 1 件目の 1 つ目の語を空にし、2 つ目の語を「A、B」にして save(restart=False)
            mock: UiDeps.save_settings
            expected: 'False。save_settings が呼ばれず、エラーの一覧に「プリセット 1 件目の 1 つ目の語: 語を入れるか、この欄を消してください。」「プリセット 1 件目の 2 つ目の語: 読点（、）・句点（。）・改行は入れられません。語を分けて足してください。」が出る'
            exception: 確かめに通らない
          - name: test_save_when_restart
            case: 正常
            summary: 「保存して再起動」は書いてから窓を閉じ、再起動を頼む
            condition: モデルを変えて save(restart=True)
            mock: UiDeps.save_settings
            expected: True。saved と restart_requested が 1 回ずつ emit され、closed が 1 回知らされる
          - name: test_save_when_hotkey_changed
            case: 正常
            summary: ホットキーを変えた保存では、閉じると効くことを添える
            condition: 録音開始のホットキーを変えて save(restart=False)。別のケースで出力先の確定のホットキーを変えて save(restart=False)。もう 1 つのケースで貼り付けに送るキーだけを変えて save(restart=False)
            mock: UiDeps.save_settings
            expected: 録音開始か出力先の確定のホットキーを変えたときは保存した知らせが「保存しました。新しいホットキーは、設定画面を閉じると効きます。」。貼り付けに送るキーだけのときは「保存しました。」
          - name: test_save_when_restart_field_changed
            case: 正常
            summary: 「再起動で反映」の欄を保存すると、件数と今すぐ再起動を出し、保存の後に欄を変えると開いたときの値から数え直す
            condition: モデルを変えて save(restart=False) し、続けて言語を変える
            mock: UiDeps.save_settings
            expected: 保存の直後は保存した知らせが「保存しました。「再起動で反映」の設定 1 件は、再起動するまで前の値で動きます。」で今すぐ再起動のボタンが出て、再起動の知らせと保存して再起動のボタンが隠れている。言語を変えた後は保存した知らせと今すぐ再起動のボタンが消え、再起動の知らせが 2 件で保存して再起動のボタンが出る
          - name: test_save_when_glossary_reverted
            case: 正常
            summary: 開いたままの 2 回目の保存で、開いたときの行へ戻した用語集も書き戻す
            condition: 1 件目の用語集の行を 1 つオフにして保存し、開いたままその行をオンに戻してもう一度保存する
            mock: UiDeps.save_settings（引数を控える）・list_glossaries・read_glossary
            expected: 2 回目の書き戻しの引数が 1 件目の場所を持ち、その行がオン
          - name: test_save_then_close
            case: 正常
            summary: 保存の後に欄を変えずに閉じると確認を出さずに閉じ、保存の後に欄を変えると知らせが消える
            condition: 「録音中の音量の割合」を 30 にして save(restart=False) し、try_close を呼ぶ。別のケースで用語集の行を 1 つオフにして save(restart=False) し、欄を変えずに try_close を呼ぶ。もう 1 つのケースで保存の後に「録音の画面を出さない」をオンにする
            mock: UiDeps.save_settings・list_glossaries・read_glossary・confirm_discard
            expected: 音量のケースと用語集のケースのどちらも、try_close が True を返し、confirm_discard が呼ばれず、closed が 1 回知らされる。欄を変えたケースは保存した知らせが隠れる
      - name: reset_to_defaults
        title: 既定に戻す
        summary: confirm_reset で確かめ、戻すなら開いたときの設定と同じ設定のモデルの既定値（`type(開いたときの設定)()`）を書いて欄に入れ、再起動が要る設定が変わっていれば件数と「今すぐ再起動」を出す
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. confirm_reset で確かめる
             - 戻さない場合、何もせずに終える
          2. 開いたときの設定と同じ設定のモデルの既定値を、save_settings（UiDeps）に空の書き戻し（`{}`）と共に渡して書く（用語集の CSV は書き換えない）
          3. 既定の値を欄に入れ、用語集の一覧を UiDeps.list_glossaries で引き直して GlossaryPanel.set_glossaries に入れ直す（設定ファイルと同じフォルダの yogo.csv の 1 件に戻る）
          4. 再起動が要る設定が変わっていれば、件数と「今すぐ再起動」を出す
      - name: try_close
        title: 取り消し
        summary: 欄を変えていなければ閉じ、変えていれば confirm_discard で確かめて捨てるなら閉じる。closeEvent・Esc・キャンセルが呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: bool
          description: 閉じたか
      - name: close_without_confirm
        title: 確かめずに閉じる
        summary: 変えた値を捨てる確認を出さずに閉じる（変えた値は保存しない）。アプリの終了・再起動のときに UiController が呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: 1. 強制で閉じる印（`_force_close`）を立てて窓を閉じる。closeEvent は確認を出さずに閉じ、closed を知らせる
        unit_tests:
          - name: test_close_without_confirm
            case: 正常
            summary: 欄を変えたままでも確認を出さずに閉じる
            condition: 欄の値を変えてから close_without_confirm を呼ぶ
            mock: UiDeps の全関数・confirm_discard
            expected: confirm_discard が呼ばれず、closed が 1 回知らされ、save_settings が呼ばれない
        status: implemented
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
    notes:
      用語集のまとまり: |-
        「文字起こし」の次のまとまり「用語集」に GlossaryPanel を 1 つ置く（今の `glossary_path` の欄と「選ぶ…」は消す）。開くときに UiDeps.list_glossaries の一覧と、補正に使う用語集の名前（設定の active_glossary。None か一覧に無ければ 1 件目）を GlossaryPanel.set_glossaries に渡す。
        収集では `glossaries` に GlossaryPanel.collect、`active_glossary` に GlossaryPanel.active_name を入れ、`glossary_path` は置かない（None）。
        変えた欄の数えには、GlossaryPanel.change_values のキーごとの変更を 1 件として含める（反映はどれも immediate）。足した・消した・名前か行を変えた用語集 1 つが 1 件（1 つの用語集で何度変えても 1 件）、補正に使う用語集の切り替えが 1 件になる。
        エラーの一覧の用語集の行は、失敗の場所 `glossaries[{n}].name` を「用語集 {n+1} 件目の名前」、行の失敗を「用語集 {n+1} 件目の {m+1} 行目の{誤変換か正しい表記}」にし、押すと「用語集」のまとまりへ切り替えて GlossaryPanel.focus_field でその用語集の行の表を出し、欄へフォーカスを移す。
        to_field_message は、用語集の名前の空を「名前を入れてください。」、名前の重なり（find_glossary_name_overlaps の PydanticCustomError）を「用語集「{名前}」と同じ名前です。別の名前にしてください。」にする。
        既定に戻すと、用語集の一覧は設定ファイルと同じフォルダの yogo.csv の 1 件に戻る（用語集の CSV のファイルは消さず、書き換えない）。
      表記のヒントのまとまり: |-
        「文字起こし」の次、「用語集」の前のまとまり「表記のヒント」に HintPresetPanel を 1 つ置き、開くときに設定の hint_presets を HintPresetPanel.set_presets に渡す。
        収集では `hint_presets` に HintPresetPanel.collect を入れる。変えた欄の数えには、プリセットの一覧（名前・語・有効か・並び）の変更も含める（反映は immediate）。
        エラーの一覧の表記のヒントの行は、失敗の場所 `hint_presets` を「有効なヒントの長さ」、`hint_presets[{n}].name` を「プリセット {n+1} 件目の名前」、`hint_presets[{n}].words[{m}]` を「プリセット {n+1} 件目の {m+1} つ目の語」にし、押すと「表記のヒント」のまとまりへ切り替えて HintPresetPanel.focus_field で欄へフォーカスを移す。長さの失敗は長さの行の下にも出す。
        既定に戻すと、表記のヒントのプリセットは空になる。
  - name: PresetListPanel
    title: プリセットの一覧
    container: ui/windows/settings_presets.py
    usecase: 設定を変える
    role: 画面の部品
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    summary: 設定画面の 1 つの種類のタブに置く、プリセットのまとまりの縦の並びと「プリセットを足す」。足す・消す・上へ・下へを受ける
    description: |-
      要素（有効の切り替え・タイトル・URL・Enter まで送る・Authorization・確定のホットキー・上へ・下へ・消す・足す・空の案内）と読み上げの名前は画面設計「設定画面」が持つ。
      種類ごとに違う欄（browser は Enter まで送る、endpoint は Authorization）は、種類の設定のモデル（BrowserPreset・EndpointPreset）の共通でない項目から組み立てる。
      並べ替え・足す・消すはこの部品の中だけを変え、settings.toml へは設定画面の保存で書く。
    properties:
      - name: kind
        type: str
        description: この一覧が持つプリセットの種類（browser・endpoint）
      - name: changed
        type: Signal()
        description: 足す・消す・並べ替え・欄の入力で値が変わった（設定画面が変えた欄の数えに使う）
    methods:
      - name: set_presets
        title: 一覧に入れる
        kind: メソッド
        scope: public
        summary: 渡したプリセット（この種類のものだけ）で一覧を作り直す。空なら空の案内を出す
        args:
          - name: presets
            type: Sequence[Preset]
            required: true
            passing: positional
            description: この種類のプリセット（設定の presets[] の並び）
        returns:
          type: None
          description: なし
      - name: collect
        title: 一覧の値の収集
        kind: メソッド
        scope: public
        summary: 今の並びのプリセットを settings.toml と同じ形の dict の並びにする（kind を含める。ホットキーは parse_hotkey で pynput の書式に戻し、空は空文字）
        returns:
          type: list[dict[str, Any]]
          description: この種類のプリセットの並び
        unit_tests:
          - name: test_preset_list_panel_collect
            case: 正常
            summary: 入れたプリセットをそのまま集める
            condition: kind endpoint の一覧に、hotkey <ctrl>+<alt>+4・authorization Bearer x のプリセットと hotkey が空のプリセットを set_presets する
            mock: なし（offscreen）
            expected: collect が 2 件を同じ並びで返し、kind が endpoint、1 件目の hotkey が <ctrl>+<alt>+4・authorization が Bearer x、2 件目の hotkey が空文字
          - name: test_preset_list_panel_move
            case: 正常
            summary: 下へで並びを入れ替える
            condition: A・B の 2 件で、A の「下へ」を押す
            mock: なし（offscreen）
            expected: collect のタイトルが B・A の順
      - name: add_preset
        title: プリセットを足す
        kind: メソッド
        scope: public
        summary: 末尾に空のプリセット（有効。browser は Enter まで送るがオン）を足し、タイトルの欄へフォーカスを移して changed を emit する。「プリセットを足す」が呼ぶ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_preset_list_panel_add_preset
            case: 正常
            summary: 足したプリセットは有効で Enter まで送る
            condition: kind browser の空の一覧で add_preset を呼ぶ
            mock: なし（offscreen）
            expected: collect が 1 件（enabled True・send_enter True・title・url・hotkey が空）を返し、changed が 1 回 emit される
      - name: focus_field
        title: 欄へフォーカスを移す
        kind: メソッド
        scope: public
        summary: この一覧の中の何件目かと項目の名前で欄を探し、フォーカスを移す（エラーの一覧の行を押したとき）
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: この一覧の中の何件目か（0 から）
          - name: field
            type: str
            required: true
            passing: positional
            description: 項目の名前（title・url・hotkey など）
        returns:
          type: None
          description: なし
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
  - name: GlossaryPanel
    title: 用語集の一覧と行の表
    container: ui/windows/settings_glossaries.py
    usecase: 設定を変える
    role: 画面の部品
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    summary: 設定画面の「用語集」のまとまりに置く、用語集の一覧と、選んだ用語集の名前の欄・行の表。用語集と行を足す・消す、補正に使う用語集を選ぶ、行のオン・オフを受ける
    description: |-
      要素（用語集の一覧・補正に使う用語集の選択・名前のボタン・行の数・消す・足す・名前の欄・行の表・行が無いときの文・凡例）と読み上げの名前・objectName（項目 ID）は画面設計「設定画面」が持つ。
      用語集ごとに、名前・CSV の場所・行・開いたときの行（足した用語集は無し）を持つ。足す・消す・入力はこの部品の中だけを変え、settings.toml と CSV へは設定画面の保存で書く。
      補正に使う用語集の消すボタンは、フォーカスとツールチップを残すため `setEnabled(False)` にせず、押しても消さない扱いと薄い見た目にする。
      コンストラクタは、行を読む関数（UiDeps.read_glossary）と、足す用語集の場所を決める関数（UiDeps.new_glossary_path）を受ける。
      単体テストは tests/unit/voice_paste/ui/windows/test_settings_glossaries.py に置く（ファイルを作った段で、この設計書の対応テストファイルに足す）。
    properties:
      - name: changed
        type: Signal()
        description: 用語集と行を足す・消す、補正に使う用語集の切り替え、欄の入力、行のオン・オフで値が変わった（設定画面が変えた欄の数えに使う）
    methods:
      - name: set_glossaries
        title: 一覧に入れる
        kind: メソッド
        scope: public
        summary: 渡した用語集で一覧を作り直し、用語集ごとに行を読んで開いたときの行として控え（読めなかった用語集は理由を控える）、補正に使う用語集の行の表を出す
        args:
          - name: glossaries
            type: Sequence[GlossarySettings]
            required: true
            passing: positional
            description: 用語集の一覧（1 件以上。path は絶対パス）
          - name: active_name
            type: str
            required: true
            passing: positional
            description: 補正に使う用語集の名前（一覧にある名前）
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_glossary_panel_set_glossaries
            case: 正常
            summary: 一覧と行の数を出し、補正に使う用語集の消すボタンを無効の扱いにする
            condition: 5 行（オン 3）と 2 行の 2 件の用語集と、1 件目の名前
            mock: 行を読む関数（決まった行を返す）
            expected: 行の数が「5 行（オン 3）」「2 行（オン 2）」。1 件目が選ばれ、その消すボタンを押しても一覧が減らない
          - name: test_glossary_panel_set_glossaries_when_unreadable
            case: 正常
            summary: 読めない用語集も一覧に出し、行の表の代わりに理由を出す
            condition: 2 件の用語集のうち、2 件目で行を読む関数が GlossaryReadError を送出する
            mock: 行を読む関数（2 件目の場所で GlossaryReadError を送出する）
            expected: 一覧が 2 件で、2 件目の行の数が「読めません」。2 件目を選ぶと、理由を含む知らせが出て行の表が出ず、行を足すボタンが無効
      - name: collect
        title: 一覧の値の収集
        kind: メソッド
        scope: public
        summary: 今の並びの用語集を settings.toml と同じ形の dict（name・path）の並びにする（name は前後の空白を除く）
        returns:
          type: list[dict[str, Any]]
          description: 用語集の一覧
        unit_tests:
          - name: test_glossary_panel_collect
            case: 正常
            summary: 名前を変えた用語集と足した用語集を並びの順に返す
            condition: 1 件の用語集の名前を変え、用語集を 1 つ足して名前を入れる
            mock: 行を読む関数・場所を決める関数（決まった場所を返す）
            expected: 2 件が返り、1 件目は変えた名前と元の場所、2 件目は入れた名前と決めた場所
      - name: active_name
        title: 補正に使う用語集の名前
        kind: メソッド
        scope: public
        summary: 補正に使う用語集に選んでいる用語集の、今の名前の欄の値（前後の空白を除く）を返す
        returns:
          type: str
          description: 補正に使う用語集の名前
        unit_tests:
          - name: test_glossary_panel_active_name
            case: 正常
            summary: 補正に使う用語集を切り替えてから名前を変えると、変えた名前を返す
            condition: 2 件目を補正に使う用語集にし、その名前を変える
            mock: 行を読む関数
            expected: 変えた名前が返り、1 件目の消すボタンが押せるようになる
      - name: changed_rows
        title: 書き戻す行の収集
        kind: メソッド
        scope: public
        summary: 行を変えた用語集と足した用語集だけの、CSV の場所 → 行を返す
        returns:
          type: dict[Path, list[GlossaryEntry]]
          description: 書き戻す用語集の CSV の場所 → 行（表の順。前後の空白を除き、誤変換と正しい表記の両方が空の行は除く）
        process: |-
          1. 今の一覧の用語集ごとに、表の行（両方が空の行を除く）を開いたときの行と比べる
             - 読めなかった用語集の場合、入れない
             - 足した用語集（開いたときの行が無い）か、行が違う場合、その場所と行を入れる
             - 同じ場合、入れない（名前だけを変えた用語集と、一覧から消した用語集も入らない）
        unit_tests:
          - name: test_glossary_panel_changed_rows
            case: 正常
            summary: 行を変えた用語集だけを返す
            condition: 2 件の用語集のうち、2 件目の行を 1 つオフにする
            mock: 行を読む関数
            expected: 2 件目の場所だけを持ち、その行の enabled が False
          - name: test_glossary_panel_changed_rows_when_untouched
            case: 正常
            summary: 行を変えていなければ空（名前だけ変えても空）
            condition: 1 件目の名前だけを変える
            mock: 行を読む関数
            expected: '{} が返る'
          - name: test_glossary_panel_changed_rows_when_added
            case: 正常
            summary: 足した用語集は行が無くても返し、両方が空の行は除く
            condition: 用語集を 1 つ足し、行を 2 つ足して 1 つだけに値を入れる
            mock: 行を読む関数・場所を決める関数
            expected: 足した用語集の場所を持ち、行は値を入れた 1 つだけ
          - name: test_glossary_panel_changed_rows_when_unreadable
            case: 正常
            summary: 読めなかった用語集は書き戻しに入れない
            condition: 読めなかった用語集の名前を変え、補正に使う用語集に選ぶ
            mock: 行を読む関数（GlossaryReadError を送出する）
            expected: '{} が返る'
      - name: row_errors
        title: 行の確かめ
        kind: メソッド
        scope: public
        summary: 読めた全ての用語集の行を find_glossary_row_errors で確かめ、（用語集の何件目か, 何行目か, 空の側の項目）の並びを返す（補正に使わない用語集も確かめる）
        returns:
          type: list[tuple[int, int, Literal["wrong", "right"]]]
          description: 片方だけが空の行の場所（どれも 0 から）
        unit_tests: []
      - name: add_glossary
        title: 用語集を足す
        kind: メソッド
        scope: public
        summary: 末尾に名前が空で行の無い用語集を足し（場所は、今の一覧の場所を渡して決める関数から得る）、その行の表を出して名前の欄へフォーカスを移し、changed を emit する。「用語集を足す」が呼ぶ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_glossary_panel_add_glossary
            case: 正常
            summary: 空の用語集を末尾に足し、行が無いときの文を出す
            condition: 1 件の用語集の一覧で add_glossary を呼ぶ
            mock: 行を読む関数・場所を決める関数
            expected: 一覧が 2 件になり、2 件目の名前が「（名前未入力）」、行の数が「0 行（オン 0）」。行が無いときの文が出て、補正に使う用語集は 1 件目のまま。changed が 1 回出る
      - name: focus_field
        title: 欄へフォーカスを移す
        kind: メソッド
        scope: public
        summary: 用語集の何件目かと項目（と行）で欄を探し、その用語集の行の表を出してフォーカスを移す（エラーの一覧の行を押したとき）
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: 用語集の何件目か（0 から）
          - name: field
            type: Literal["name", "wrong", "right"]
            required: true
            passing: positional
            description: 項目の名前
          - name: row
            type: int | None
            required: false
            default: None
            passing: keyword
            description: 何行目か（0 から。name のときは None）
        returns:
          type: None
          description: なし
        unit_tests: []
      - name: show_error
        title: 欄の下にエラーを出す
        kind: メソッド
        scope: public
        summary: 用語集の何件目かと項目（と行）の欄の下にエラーを出し、欄をエラーの見た目にする。clear_errors で全て消す
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: 用語集の何件目か（0 から）
          - name: field
            type: Literal["name", "wrong", "right"]
            required: true
            passing: positional
            description: 項目の名前
          - name: message
            type: str
            required: true
            passing: positional
            description: エラーの文言
          - name: row
            type: int | None
            required: false
            default: None
            passing: keyword
            description: 何行目か（0 から。name のときは None）
        returns:
          type: None
          description: なし
        unit_tests: []
      - name: mark_saved
        title: 保存した行を基準にする
        summary: 書き戻す用語集を決める基準（開いたときの行）を、今の表の行へ置き直す。SettingsWindow.save が書けた後に呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. 今の一覧の用語集ごとに、表の行（両方が空の行を除く）を開いたときの行として控える
             - 読めなかった用語集の場合、そのままにする
             - 足した用語集の場合も、保存した行を開いたときの行にする（次の changed_rows は行を変えなければ入れない）
        unit_tests:
          - name: test_glossary_panel_mark_saved
            case: 正常
            summary: 保存した行を基準にし、そこから戻した用語集を書き戻しに入れる
            condition: 1 件目の行を 1 つオフにして mark_saved を呼び、その行をオンに戻す
            mock: 行を読む関数
            expected: mark_saved の直後の changed_rows は {}。オンに戻した後は 1 件目の場所を持ち、その行がオン
          - name: test_glossary_panel_mark_saved_when_added
            case: 正常
            summary: 足した用語集も保存した行が基準になる
            condition: 用語集を 1 つ足して行を 1 つ入れ、mark_saved を呼ぶ
            mock: 行を読む関数・場所を決める関数
            expected: changed_rows が {}
      - name: change_values
        title: 変えた件数を数える値
        kind: メソッド
        scope: public
        summary: 変えた欄の数えに使う値を、用語集 1 つ = 1 キーと、補正に使う用語集の 1 キーで返す（SettingsWindow が開いたとき・保存したときの値と比べて件数にする）
        returns:
          type: dict[str, object]
          description: '`glossaries[{CSV の場所}]` → （前後の空白を除いた名前, 行（表の順。前後の空白を除き、両方が空の行は除く。読めなかった用語集は None））、`active_glossary` → 補正に使う用語集の CSV の場所'
        process: |-
          1. 今の一覧の用語集ごとに、CSV の場所をキーにして名前と行を入れる
             - 読めなかった用語集の場合、行を None にする
          2. 補正に使う用語集の CSV の場所を `active_glossary` に入れる（名前ではなく場所にし、補正に使う用語集の名前を変えても切り替えとして数えない）
        unit_tests:
          - name: test_glossary_panel_change_values
            case: 正常
            summary: 用語集ごとの名前と行と、補正に使う用語集の場所を返す
            condition: 2 件の用語集を持ち、2 件目を補正に使う一覧で開き、1 件目に両方が空の行を 1 つ足す
            mock: 行を読む関数
            expected: 2 件の場所のキーがそれぞれ（名前, 行）を持ち、1 件目の行に足した空の行が入らない。active_glossary が 2 件目の場所
          - name: test_glossary_panel_change_values_when_active_renamed
            case: 正常
            summary: 補正に使う用語集の名前を変えても、補正に使う用語集の値は変わらない
            condition: 補正に使う用語集の名前を変える
            mock: 行を読む関数
            expected: その用語集のキーの名前が新しい名前になり、active_glossary は名前を変える前と同じ場所
          - name: test_glossary_panel_change_values_when_added
            case: 正常
            summary: 足した用語集は新しいキーで返す
            condition: 1 件の用語集の一覧で用語集を 1 つ足す
            mock: 行を読む関数・場所を決める関数
            expected: 足した用語集の場所のキーが（"", []）を持つ。キーは 3 つ（2 件の用語集と active_glossary）
          - name: test_glossary_panel_change_values_when_unreadable
            case: 正常
            summary: 読めなかった用語集の行は None で返す
            condition: 読めなかった用語集を含む一覧で開く
            mock: 行を読む関数（GlossaryReadError を送出する）
            expected: 読めなかった用語集のキーが（名前, None）
        status: planned
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
    notes:
      読めない用語集: |-
        行を読む関数が GlossaryReadError を送出した用語集は、読めない用語集として一覧に残す（設定画面は開く）。行の数は「読めません」、行の表の代わりに「この用語集の CSV を読めませんでした（{理由}）。保存しても、この CSV は書き換えません。」を出し、行を足すボタンを無効にする。名前を変える・補正に使う用語集に選ぶ・一覧から消すはできる。
        changed_rows と row_errors には入れない（保存してもその CSV に触れない）。
  - name: HintPresetPanel
    title: 表記のヒントの長さとプリセットの一覧
    container: ui/windows/settings_hints.py
    usecase: 設定を変える
    role: 画面の部品
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    summary: 設定画面の「表記のヒント」のまとまりに置く、有効なヒントの長さ・プリセットのまとまりの縦の並び・「プリセットを足す」・補足。プリセットと語の足す・消す・並べ替えを受け、長さを数え直す
    description: |-
      要素（説明・有効なヒントの長さ・一覧・空の案内・有効の切り替え・語の数と長さ・名前・語・語を消す・語が無いときの文・語を足す・上へ・下へ・消す・足す・補足）と読み上げの名前は画面設計「設定画面」が持つ。
      プリセットのまとまりは PresetListPanel と同じ形（頭に切り替え・名前・上へ・下へ・消す、下に欄）で作る。語の欄は入力と消すボタンの組を `QGridLayout` の 2 列（左から右、上から下が語の順）に並べ、部品の幅が 2 組入らないときは 1 列に並べ直す（resizeEvent）。幅に応じて列の数を 3 以上に増やす自前のレイアウトは作らない。
      長さは欄の入力・切り替え・足す・消す・並べ替えのたびに、今の欄の値（プリセットごとの有効かと語の並び。HintWordSource を満たす値で、HintPresetSettings にはしない）を join_hint_words でつないだ UTF-8 のバイト数で数え直し、HINT_MAX_BYTES を超えたらバーと数字を赤にして「（{超えた分} バイト超過）」を添える。空の名前・空の語・区切りを含む語もそのまま数える（確かめは保存で行う）。
      無効のプリセットの語の欄は、用語集のオフの行と同じく文字を薄くして取り消し線を引く（編集はできる）。
      足す・消す・並べ替えはこの部品の中だけを変え、settings.toml へは設定画面の保存で書く。単体テストは tests/unit/voice_paste/ui/windows/test_settings_hints.py に置く。
    properties:
      - name: changed
        type: Signal()
        description: 足す・消す・並べ替え・切り替え・欄の入力で値が変わった（設定画面が変えた欄の数えに使う）
    methods:
      - name: set_presets
        title: 一覧に入れる
        kind: メソッド
        scope: public
        summary: 渡したプリセットで一覧を作り直し、長さを数え直す。空なら空の案内を出す
        args:
          - name: presets
            type: Sequence[HintPresetSettings]
            required: true
            passing: positional
            description: 設定の hint_presets
        returns:
          type: None
          description: なし
      - name: collect
        title: 一覧の値の収集
        kind: メソッド
        scope: public
        summary: 今の並びのプリセットを settings.toml と同じ形の dict（name・words・enabled）の並びにする。空の語の欄もそのまま入れ（確かめで断る）、前後の空白は設定のモデルが除く
        returns:
          type: list[dict[str, Any]]
          description: hint_presets の並び
        unit_tests:
          - name: test_hint_preset_panel_collect
            case: 正常
            summary: 入れたプリセットをそのまま集める
            condition: 有効な「開発」（語 voice-paste・Whisper）と無効な「会議」（語 議事録）を set_presets する
            mock: なし（offscreen）
            expected: collect が 2 件を同じ並びで返し、1 件目の words が ["voice-paste", "Whisper"]・enabled True、2 件目の enabled False
          - name: test_hint_preset_panel_move
            case: 正常
            summary: 下へで並びを入れ替える
            condition: A・B の 2 件で、A の「下へ」を押す
            mock: なし（offscreen）
            expected: collect の名前が B・A の順
      - name: add_preset
        title: プリセットを足す
        kind: メソッド
        scope: public
        summary: 末尾に名前と語が空で有効のプリセットを足し、名前の欄へフォーカスを移して changed を emit する。「プリセットを足す」が呼ぶ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_hint_preset_panel_add_preset
            case: 正常
            summary: 足したプリセットは有効で始まる
            condition: 空の一覧で add_preset を呼ぶ
            mock: なし（offscreen）
            expected: collect が 1 件（enabled True・name が空・words が空）を返し、changed が 1 回 emit され、空の案内が消える
      - name: add_word
        title: 語を足す
        kind: メソッド
        scope: public
        summary: そのプリセットの語の末尾に空の欄を足してフォーカスを移し、changed を emit する。「語を足す」が呼ぶ
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: 一覧の何件目のプリセットか（0 から）
        returns:
          type: None
          description: なし
      - name: hint_length
        title: 有効なヒントの長さ
        kind: メソッド
        scope: public
        summary: 今の欄の値で、有効なプリセットの語をつないだ UTF-8 のバイト数を返す（長さの行の表示と同じ値）
        returns:
          type: int
          description: バイト数
        unit_tests:
          - name: test_hint_preset_panel_hint_length
            case: 正常
            summary: 切り替えと入力で長さを数え直す
            condition: 有効な「開発」（語 abc）と無効な「会議」（語 議事録）を入れ、「会議」を有効に切り替える
            mock: なし（offscreen）
            expected: 切り替える前は 3、切り替えた後は 15（abc、議事録）。長さの行の文字が「15 / 222 バイト」
          - name: test_hint_preset_panel_hint_length_when_over
            case: 正常
            summary: 上限を超えたら超過を文字で添える
            condition: 有効なプリセットにつないだ長さが 258 バイトになる語を入れる
            mock: なし（offscreen）
            expected: 長さの行の文字が「258 / 222 バイト（36 バイト超過）」
          - name: test_hint_preset_panel_hint_length_when_unvalidated
            case: 正常
            summary: 足した直後と、区切りを含む語を入れた直後にも長さを数え直せる
            condition: 空の一覧で add_preset を呼び（名前と語が空）、add_word で足した語の欄に「A、B」を入れる
            mock: なし（offscreen）
            expected: 例外が出ず、足した直後の hint_length が 0、入れた後の hint_length が 5（A、B の UTF-8 のバイト数）
      - name: focus_field
        title: 欄へフォーカスを移す
        kind: メソッド
        scope: public
        summary: 失敗の場所で欄を探し、フォーカスを移す（エラーの一覧の行を押したとき）。場所が `hint_presets` だけなら長さの行へ移す
        args:
          - name: location
            type: tuple[int | str, ...]
            required: true
            passing: positional
            description: hint_presets より後ろの失敗の場所（例 (1, "words", 3)・(2, "name")・()）
        returns:
          type: None
          description: なし
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
functions:
  - name: notify
    title: ユーザーへの知らせ
    kind: 関数
    container: ui/bridge.py
    usecase: 共通
    scope: public
    thread_safe: true
    inherits: NotifyFn
    summary: UiBridge.notified を emit して、メインスレッドでトレイのアイコン・ダイアログ・画面を変える
    args:
      - name: event
        type: Literal["state_changed", "busy", "microphone_unavailable", "transcription_failed", "delivery_failed", "api_unavailable", "show_recording_window", "output_changed"]
        required: true
        passing: positional
        description: 知らせの種類（show_recording_window は、録音開始のホットキーで隠した録音の画面を戻す指示。output_changed は、文字起こし中に届ける出力先を差し替えたこと）
      - name: detail
        type: str | None
        required: false
        default: None
        passing: positional
        description: 理由
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
    returns:
      type: None
      description: なし
    status: implemented
    process: |-
      1. `bridge.notified.emit(event, detail)` を呼ぶ
         - `[INFO]` / `[WARNING]` ユーザーへの知らせ（種類・理由。state_changed・show_recording_window・output_changed は INFO、それ以外は WARNING）
    unit_tests:
      - name: test_notify
        case: 正常
        summary: 知らせを Signal で渡す
        condition: event=delivery_failed、detail="クリップボードに書けない"
        mock: なし（notified に受け手をつなぐ）
        expected: 受け手に (delivery_failed, クリップボードに書けない) が届き、WARNING のログが 1 行出る
      - name: test_notify_from_other_thread
        case: 正常
        summary: ほかのスレッドからの知らせをメインスレッドで受ける
        condition: threading.Thread から notify(state_changed) を呼び、イベントループを回す
        mock: なし（QueuedConnection の受け手）
        expected: 受け手がメインスレッドで 1 回呼ばれる
  - name: report_progress
    title: 文字起こしの進みの知らせ
    container: ui/bridge.py
    usecase: 録音を文字に起こす
    summary: UiBridge.progressed を emit して、文字起こし中の表示の進みを変える
    kind: 関数
    inherits: ProgressFn
    scope: public
    thread_safe: true
    args:
      - name: position_sec
        type: float
        required: true
        passing: positional
        description: 起こし終えた区間の終わりの時刻
      - name: duration_sec
        type: float
        required: true
        passing: positional
        description: 録音の長さ
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
