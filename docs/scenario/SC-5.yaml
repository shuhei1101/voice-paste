        HS--xSVC: 応答が無い（まだ起動していない）
        SVC->>WSL: 設定のディストリビューションで、リポジトリのサーバーの起動スクリプトを、設定のモデル・計算の精度・装置を引数にして流す
        WSL->>HS: サーバーを起動する（引数のモデルを、引数の計算の精度と装置で読み込む）
        loop 応答するまで（非機能要件の起動の待ち時間まで）
          SVC->>HS: 応答を確認する
        end
        HS-->>SVC: モデルを読み込んだ
        SVC->>SVC: Haas のエンジンを作る（文字起こしワーカーは起動しない）
