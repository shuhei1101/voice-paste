  - name: HintPresetSettings
    title: 表記のヒントのプリセットの設定
    container: shared/settings.py
    usecase: 設定を変える
    role: 設定のモデル
    summary: 表記のヒントのプリセット 1 つの名前・語の並び・有効か
    description: 語は `field_validator` で 1 つずつ前後の空白を除いて確かめる。空の語は `PydanticCustomError`（type `hint_word_empty`）、読点（、）・句点（。）・改行を含む語は `PydanticCustomError`（type `hint_word_separator`）にし、失敗の場所を `words[{m}]` にする。無効のプリセットの語も確かめる。読みも `field_validator` で 1 つずつ前後の空白を除き、ひらがな・カタカナ・長音符（ー）以外の文字を含むものは `PydanticCustomError`（type `hint_reading_not_kana`）にし、失敗の場所を `readings[{m}]` にする。`model_validator(mode="after")` が、readings が空でなく長さが words と違う設定を `PydanticCustomError`（type `hint_readings_length`、場所 `readings`）に、同じ語に違う読み（空を除く）がある設定を、後ろの語の読みの場所の `PydanticCustomError`（type `hint_reading_conflict`、場所 `readings[{m}]`）にする。
    inherits: pydantic.BaseModel
    properties:
      - name: name
        type: str
        description: 設定画面の一覧に出す名前（前後の空白を除く。`min_length=1`）
      - name: words
        type: list[str]
        default: '[]'
        description: 文字起こしに渡す語の並び（各語の前後の空白を除く）
      - name: enabled
        type: bool
        default: 'True'
        description: このプリセットの語を文字起こしに渡すか
      - name: readings
        type: list[str]
        default: '[]'
        description: words と同じ並びの読み（各読みの前後の空白を除く）。空の一覧か words と同じ長さ。空文字は読みが無い語
    refs:
      - CFG-1#settings[hint_presets[].name]
      - CFG-1#settings[hint_presets[].words]
      - CFG-1#settings[hint_presets[].enabled]
      - CFG-1#settings[hint_presets[].readings]
    status: implemented
