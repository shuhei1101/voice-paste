id: MOD-2
title: 常駐アプリ / YAML の文書 / yaml_document.py
lead: コメントを保った YAML の読み書き（ruamel.yaml）と、キーの追加・削除でのコメントの付け替え・レイヤーの重ね合わせを持つ。設定の読み書き（共通 の shared/settings.py）が使う。
test_files:
  - tests/unit/voice_paste/shared/test_yaml_document.py
directory: |-
  ```
  src/voice_paste/shared/
  └── yaml_document.py  # コメントを保った YAML の読み書き（ruamel.yaml）と、キーの追加・削除でのコメントの付け替え・レイヤーの重ね合わせ
  ```
functions:
  - name: make_yaml
    title: YAML の読み書きの準備
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: internal
    summary: コメントと引用符を保って読み書きする ruamel.yaml の YAML を、字下げと引用符の決まりを当てて返す
    returns:
      type: ruamel.yaml.YAML
      description: typ="rt" の YAML
    process: |-
      1. `YAML(typ="rt")` を作り、`preserve_quotes = True`・`indent(mapping=2, sequence=4, offset=2)`・`width` を十分大きな値にする
      2. 文字列の representer を、YAML 1.1 で文字列でなくなる値（yes・no・on・off・y・n と大文字の形・null・`~`・数・`*` で始まる値）を単引用符で囲むものに替える
    refs:
      - LIB-25#
    status: planned
  - name: read_yaml_document
    title: YAML の文書の読み込み
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: public
    summary: YAML のファイルを、コメントを保った文書（CommentedMap）として UTF-8 で読む。無ければ空の文書を返す
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 読むファイル
    returns:
      type: CommentedMap
      description: 読んだ文書（空のファイルは空の文書）
    process: |-
      1. path が無ければ空の CommentedMap を返す
      2. UTF-8 で読み、make_yaml の YAML で解釈する
         - YAMLError の場合、パスと行・列（problem_mark の line と column に 1 を足した値）を示した SettingsError を送出する
         - 一番上が表でない場合、SettingsError を送出する
    exceptions:
      - name: SettingsError
        condition: YAML として読めない・一番上が表でない・UTF-8 で読めない
        message: '設定ファイルを読めない（{path}: {行}行目 {列}列目: {理由}）'
    unit_tests:
      - name: test_read_yaml_document_when_broken
        case: 異常
        summary: 読めない YAML はパスと行・列を示して断る
        condition: 3 行目の字下げが崩れたファイル
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージにパスと「3行目」を含む
        exception: YAML として読めない
      - name: test_read_yaml_document_when_not_mapping
        case: 異常
        summary: 一番上が一覧のファイルを断る
        condition: '`- a` だけのファイル'
        mock: なし（一時フォルダ）
        expected: SettingsError
        exception: 一番上が表でない
    status: planned
  - name: read_yaml_mapping
    title: YAML の値の読み込み
    kind: 関数
    container: shared/yaml_document.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: YAML のファイルを、コメントを持たない素の dict として読む。無ければ空の dict を返す
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 読むファイル
    returns:
      type: dict[str, Any]
      description: 素の dict・list・値に変えた中身
    process: 1. read_yaml_document で読み、表と一覧を素の dict と list へ再帰で変えて返す
    exceptions:
      - name: SettingsError
        condition: read_yaml_document と同じ
    status: planned
  - name: write_yaml_document
    title: YAML の文書の書き込み
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: public
    summary: 文書か dict を UTF-8 の YAML として、同じフォルダの一時ファイルに書いてから置き換える
    side_effects: path を書く（親のフォルダが無ければ作る）。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 書くファイル
      - name: document
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 書く文書（CommentedMap か dict）
    returns:
      type: None
      description: なし
    process: |-
      1. 親のフォルダを作る
      2. 同じフォルダの一時ファイルへ make_yaml の YAML で UTF-8 で書き、os.replace で path に置き換える
         - OSError の場合、一時ファイルを削除してから送出する
    status: planned
  - name: set_key
    title: キーの書き込み
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: public
    summary: ドット区切りのキーの値を文書に書く。無い表は作り、新しく追加するキーは次のキーの前のコメントより前に置く
    side_effects: document を書き換える。
    args:
      - name: document
        type: CommentedMap
        required: true
        passing: positional
        description: 書き換える文書
      - name: key
        type: tuple[str, ...]
        required: true
        passing: positional
        description: 一番上からのキーの並び（例 ("hotkeys", "start")）
      - name: value
        type: Any
        required: true
        passing: positional
        description: 書く値（素の dict・list・値）
    returns:
      type: None
      description: なし
    process: |-
      1. 途中の表をたどり、無い表は CommentedMap を作って追加する
      2. 末尾のキーがあれば値だけを置き換える（行末のコメントは残す）
      3. 無ければ追加する。追加の前に、表の最後のキーに付いた後ろのコメント（ruamel.yaml が `ca.items[key][2]` に持つ、次の表の見出しのコメント）を外し、追加したキーの後ろへ付け直す
    unit_tests:
      - name: test_set_key_when_added
        case: 正常
        summary: 追加したキーが、次の表の見出しのコメントより前に入る
        condition: 'hotkeys の表（start だけ）の後ろに「# 文字起こし」と transcription の表がある文書に ("hotkeys", "pause") を書く'
        mock: なし
        expected: 書き出した YAML で hotkeys.pause の行が「# 文字起こし」の行より前にあり、他の行が全て残る
      - name: test_set_key_when_nested_table_added
        case: 正常
        summary: 無い表を作って書く
        condition: 空の文書に ("transcription", "local_whisper", "model") を書く
        mock: なし
        expected: 'transcription.local_whisper.model が書いた値'
      - name: test_set_key_when_existing
        case: 正常
        summary: 既にあるキーは値だけを替え、行末のコメントを残す
        condition: '`start: a  # 録音の開始` の行を持つ文書に ("hotkeys", "start") を b で書く'
        mock: なし
        expected: 書き出した行に b と「# 録音の開始」がある
    refs:
      - LIB-25#
    status: planned
  - name: delete_key
    title: キーの削除
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: public
    summary: ドット区切りのキーを文書から外し、中のキーが無くなった表も外す。外したキーの後ろのコメントは前のキーへ付け直す
    side_effects: document を書き換える。
    args:
      - name: document
        type: CommentedMap
        required: true
        passing: positional
        description: 書き換える文書
      - name: key
        type: tuple[str, ...]
        required: true
        passing: positional
        description: 一番上からのキーの並び
    returns:
      type: None
      description: なし
    process: |-
      1. キーが無ければ何もしない
      2. 外すキーに付いた後ろのコメント（行末のコメントを除く。入れ子の表なら、その表の最後のキーに付いたもの）を取り出してからキーを外す
      3. 取り出したコメントを、同じ表の前のキー（前のキーが表ならその最後のキー）の後ろへ付け直す。前のキーが無ければ、表の先頭のコメントに付ける
      4. 外した後に空になった表を、親から同じ手順で外す
    unit_tests:
      - name: test_delete_key_when_trailing_comment
        case: 正常
        summary: 外したキーの後ろのコメントと空行が残る
        condition: hotkeys.cancel の後ろに空行と「# 文字起こし」がある文書から ("hotkeys", "cancel") を外す
        mock: なし
        expected: 書き出した YAML に cancel の行が無く、空行と「# 文字起こし」の行が transcription の表の前に残る
      - name: test_delete_key_when_table_emptied
        case: 正常
        summary: 中のキーが無くなった表を外し、表の後ろのコメントを前の表へ付け直す
        condition: recording・hotkeys（start だけ）・transcription の表の順で、hotkeys の後ろに「# 文字起こし」がある文書から ("hotkeys", "start") を外す
        mock: なし
        expected: 書き出した YAML に hotkeys の表が無く、「# 文字起こし」の行が transcription の表の直前に残り、YAML として読める
      - name: test_delete_key_when_missing
        case: 正常
        summary: 無いキーは何もしない
        condition: 空の文書から ("hotkeys", "start") を外す
        mock: なし
        expected: 文書が空のまま
    refs:
      - LIB-25#
    status: planned
  - name: merge_layers
    title: レイヤーの重ね合わせ
    kind: 関数
    container: shared/yaml_document.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 後ろのレイヤーの値で前のレイヤーを上書きした新しい dict を返す。表はキーごとに重ね、一覧と値は丸ごと替える
    args:
      - name: layers
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 前から順に重ねるレイヤー（可変長の位置引数 `*layers`）
    returns:
      type: dict[str, Any]
      description: 重ねた dict（渡した dict は書き換えない）
    process: 1. 前から順に、両方が表のキーは再帰で重ね、それ以外は後ろの値を深いコピーで置く
    unit_tests:
      - name: test_merge_layers
        case: 正常
        summary: 表はキーごと、一覧は丸ごと上書きする
        condition: 'layers が ({"a": {"x": 1, "y": 2}, "l": [1, 2]}, {"a": {"y": 3}, "l": [9]})'
        mock: なし
        expected: '{"a": {"x": 1, "y": 3}, "l": [9]}。渡した dict が変わっていない'
    status: planned
  - name: changed_keys
    title: 変わったキーの洗い出し
    kind: 関数
    container: shared/yaml_document.py
    usecase: 設定を変える
    scope: public
    summary: 2 つの dict で値が違うキーを、表はキーごとにたどって、一覧と値は丸ごと比べて返す
    args:
      - name: before
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 前の値
      - name: after
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 後の値
    returns:
      type: list[tuple[str, ...]]
      description: 値が違うキーの並び（片方にしか無いキーを含む）
    process: 1. 両方のキーの和集合を順にたどり、両方が表なら再帰で比べ、それ以外は値が違えばキーを集める
    unit_tests:
      - name: test_changed_keys
        case: 正常
        summary: 表の中の違うキーと、一覧の違いを返す
        condition: 'before {"a": {"x": 1, "y": 2}, "l": [1, 2]}・after {"a": {"x": 1, "y": 3}, "l": [1]}'
        mock: なし
        expected: '[("a", "y"), ("l",)]'
    status: planned
  - name: diff_from_defaults
    title: 既定値と違う値の抜き出し
    kind: 関数
    container: shared/yaml_document.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 値のうち既定値と違うキーだけを残した dict を返す。表はキーごとに比べ、一覧と値は丸ごと比べる
    args:
      - name: values
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 比べる値
      - name: defaults
        type: Mapping[str, Any]
        required: true
        passing: positional
        description: 既定値
    returns:
      type: dict[str, Any]
      description: 既定値と違うキーだけの dict（空になった表は含めない）
    process: 1. changed_keys(defaults, values) のうち values にあるキーを、merge_layers で重ねると values と等しくなるように集める
    unit_tests:
      - name: test_diff_from_defaults
        case: 正常
        summary: 違うキーだけが残り、既定値に重ねると元に戻る
        condition: 'values {"a": {"x": 1, "y": 3}, "l": [1, 2], "b": {"z": 0}}・defaults {"a": {"x": 1, "y": 2}, "l": [1], "b": {"z": 0}}'
        mock: なし
        expected: '{"a": {"y": 3}, "l": [1, 2]}。merge_layers(defaults, 戻り値) が values と等しい'
    status: planned
