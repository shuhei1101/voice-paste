id: SC-14
visibility: internal
title: 音声ファイルを指定して文字に起こす
lead: 常駐サービスのトレイのメニューから手元の音声ファイルを指定し、文字に起こして選んだ出力先へ届けるまでの複合ユースケース。
primary_actor: 音声入力を使用するユーザー
stakeholders:
  - name: ユーザー
    interest: 文字起こしに失敗して履歴に残った録音や手元の音声ファイルを、話し直さずに PC で文字にして貼り付け先へ入れられること
trigger: ユーザーがトレイのメニューから音声ファイルを指定する項目を選ぶ
preconditions:
  - Windows の端末で、ショートカットから常駐サービスを起動している
  - 常駐サービスが待機中である
  - 設定の文字起こしのエンジンに要るものがそろっている（ローカルの Whisper のモデルと GPU）
success_guarantee: |-
  指定した音声ファイルから起こした文字が、ホットキーから始めた録音と同じ出力先の選び方で貼り付け先へ入る。
  指定した音声ファイルは移動も削除もされない。
minimal_guarantee: |-
  読めない音声ファイルを指定しても、文字起こしに失敗しても、常駐サービスは止まらず待機中に戻り、次のホットキーとトレイの操作を受け付ける。
  指定した音声ファイルは移動も削除もされない。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: ファイルを選ぶダイアログ・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・ホットキーの受付）は経由せず、pytest のプロセスの中で build_handlers で配線し、トレイの項目の入口から始める
        notes: ファイルを選ぶダイアログは、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV のパスを返す。貼り付けのキーは送信せずに記録し、通知は記録する
      - name: 出力先
        description: 出力先のうち「貼り付けて送信」だけをオンにする
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|トレイのメニューから項目を選ぶ| UC1([音声ファイルを指定する:正常シナリオ])
        UC1 -->|指定した音声ファイル| UC2([録音を文字に起こす:正常シナリオ（指定した音声ファイル）])
        UC2 -->|用語集で補正した文字| UC3([起こした文字を届ける:正常シナリオ])
        UC3 --> DONE([貼り付けのキーと Enter を送信し<br>常駐サービスは待機中に戻る])

        click UC1 "id:SC-15#scenarios[正常シナリオ]"
        click UC2 "id:SC-9#scenarios[正常シナリオ（指定した音声ファイル）]"
        click UC3 "id:SC-7#scenarios[正常シナリオ]"
      ```

      <!-- /map -->
    expected:
      - 貼り付けのキーと Enter が送信されている（差し替えた貼り付けのキーに控えがある）
      - クリップボードに起こした文字が入り、書き出した文の言葉を含む
      - 指定した音声ファイルが元の場所に同じ中身で残っている
      - 録音セッションが終わり、ホットキーの入口から録音を始められる
    test: test_normal
    uses:
      - SC-15#scenarios[正常シナリオ]
      - SC-9#scenarios[正常シナリオ（指定した音声ファイル）]
      - SC-7#scenarios[正常シナリオ]
  - name: 正常シナリオ（ファイルの選択を取り消す）
    setup:
      - name: Mock
        description: ファイルを選ぶダイアログ・貼り付けのキー・通知を差し替える。pytest のプロセスの中で build_handlers で配線し、トレイの項目の入口から始める
        notes: ファイルを選ぶダイアログは、取り消したときと同じく空のパスを返す
    flow: |-
      <!-- map: {"title": "正常シナリオ（ファイルの選択を取り消す）"} -->

      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|トレイのメニューから項目を選ぶ| UC1([音声ファイルを指定する:正常シナリオ（選択を取り消す）])
        UC1 --> DONE([何も起こさずに<br>常駐サービスは待機中のまま])

        click UC1 "id:SC-15#scenarios[正常シナリオ（選択を取り消す）]"
      ```

      <!-- /map -->
    expected:
      - 貼り付けのキーが送信されておらず、通知も出ていない
      - 録音セッションが作られておらず、ホットキーの入口から録音を始められる
    test: test_normal_when_cancel_selection
    uses:
      - SC-15#scenarios[正常シナリオ（選択を取り消す）]
  - name: 異常シナリオ（読めない形式を指定する）
    setup:
      - name: Mock
        description: ファイルを選ぶダイアログ・貼り付けのキー・通知を差し替える。pytest のプロセスの中で build_handlers で配線し、トレイの項目の入口から始める
        notes: ファイルを選ぶダイアログは、音声ではない形式のファイル（テキストのファイル）のパスを返す
    flow: |-
      <!-- map: {"title": "異常シナリオ（読めない形式を指定する）"} -->

      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|トレイのメニューから項目を選ぶ| UC1([音声ファイルを指定する:異常シナリオ（読めない形式）])
        UC1 --> DONE([読めない形式であることを通知して<br>常駐サービスは待機中に戻る])

        click UC1 "id:SC-15#scenarios[異常シナリオ（読めない形式）]"
      ```

      <!-- /map -->
    expected:
      - 読めない形式であることがユーザーに通知されている（差し替えた通知に控えがある）
      - 貼り付けのキーが送信されていない
      - 指定したファイルが元の場所に同じ中身で残っている
      - 録音セッションが作られておらず、ホットキーの入口から録音を始められる
    test: test_error_when_unsupported_format
    uses:
      - SC-15#scenarios[異常シナリオ（読めない形式）]
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: ファイルを選ぶダイアログ・貼り付けのキー・通知を差し替える。pytest のプロセスの中で build_handlers で配線し、トレイの項目の入口から始める
        notes: ファイルを選ぶダイアログは、拡張子が .wav で中身の壊れたファイルのパスを返し、文字起こしワーカーがエラーを返却する状態にする
    flow: |-
      <!-- map: {"title": "異常シナリオ（文字起こしに失敗）"} -->

      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|トレイのメニューから項目を選ぶ| UC1([音声ファイルを指定する:正常シナリオ])
        UC1 -->|指定した音声ファイル| UC2([録音を文字に起こす:異常シナリオ（指定した音声ファイルの文字起こしに失敗）])
        UC2 --> DONE([失敗を通知して<br>常駐サービスは待機中に戻る])

        click UC1 "id:SC-15#scenarios[正常シナリオ]"
        click UC2 "id:SC-9#scenarios[異常シナリオ（指定した音声ファイルの文字起こしに失敗）]"
      ```

      <!-- /map -->
    expected:
      - 文字起こしに失敗したことがユーザーに通知されている（差し替えた通知に控えがある）
      - 貼り付けのキーが送信されていない
      - 指定したファイルが元の場所に同じ中身で残っている
      - 録音セッションが終わり、ホットキーの入口から録音を始められる
    test: test_error_when_transcription_failed
    uses:
      - SC-15#scenarios[正常シナリオ]
      - SC-9#scenarios[異常シナリオ（指定した音声ファイルの文字起こしに失敗）]
  - name: 異常シナリオ（音声ファイルの処理中にホットキーを押す）
    setup:
      - name: Mock
        description: ファイルを選ぶダイアログ・録音の入力・貼り付けのキー・通知を差し替える。pytest のプロセスの中で build_handlers で配線し、トレイの項目の入口から始める
        notes: ファイルを選ぶダイアログは、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV のパスを返す。文字起こしが終わる前にホットキーの入口から録音を始める。貼り付けのキーは送信せずに記録し、通知は記録する
      - name: 出力先
        description: 出力先のうち「貼り付けて送信」だけをオンにする
    flow: |-
      <!-- map: {"title": "異常シナリオ（音声ファイルの処理中にホットキーを押す）"} -->

      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|トレイのメニューから項目を選ぶ| UC1([音声ファイルを指定する:正常シナリオ])
        UC1 -->|文字起こしの間に<br>ホットキーを押す| UC2([録音する:異常シナリオ（処理中に開始が来る）])
        UC2 -->|音声ファイルの文字起こしを続ける| UC3([録音を文字に起こす:正常シナリオ（指定した音声ファイル）])
        UC3 -->|用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ])
        UC4 --> DONE([貼り付けのキーと Enter を送信し<br>常駐サービスは待機中に戻る])

        click UC1 "id:SC-15#scenarios[正常シナリオ]"
        click UC2 "id:SC-8#scenarios[異常シナリオ（処理中に開始が来る）]"
        click UC3 "id:SC-9#scenarios[正常シナリオ（指定した音声ファイル）]"
        click UC4 "id:SC-7#scenarios[正常シナリオ]"
      ```

      <!-- /map -->
    expected:
      - 処理中のため録音を始められないことがユーザーに通知されている（差し替えた通知に処理中の記録がある）
      - 録音が始まっていない
      - 貼り付けのキーと Enter が送信され、クリップボードに音声ファイルから起こした文字が入っている
      - 録音セッションが終わり、ホットキーの入口から録音を始められる
    test: test_error_when_hotkey_during_file_transcription
    uses:
      - SC-15#scenarios[正常シナリオ]
      - SC-8#scenarios[異常シナリオ（処理中に開始が来る）]
      - SC-9#scenarios[正常シナリオ（指定した音声ファイル）]
      - SC-7#scenarios[正常シナリオ]
refs:
  - to: SC-12
    type: references
    when: 録音から届けるまでの複合ユースケースと、文字起こしから届けるまでの期待値を揃えるとき。
  - to: SC-13
    type: references
    when: 外の端末のブラウザから音声ファイルを送信する流れと、読める形式・失敗の扱いを揃えるとき。
test_file: tests/e2e/複合ユースケース/test_transcribe_audio_file.py
tags:
  - name: topic:音声
    main: true
  - name: topic:トレイ
  - name: topic:文字起こし
  - name: topic:出力先
  - name: action:貼り付け
