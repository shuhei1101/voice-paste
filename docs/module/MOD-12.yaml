id: MOD-12
visibility: internal
title: "常駐アプリ / 起動と配線"
lead: 常駐サービスの入口。単一インスタンスを確かめ、各 feature と外部連携を関数で配線し（composition root）、API・ホットキー・トレイを立てて画面のイベントループを回す。
directory: |-
  ```
  src/voice_paste/
  ├── __init__.py
  ├── __main__.py              # python -m voice_paste で main() を呼ぶ
  ├── main.py                  # parse_args・build_handlers・build_ui_deps・apply_settings・start_local_session・main
  └── runtime/
      ├── single_instance.py   # instance_name と、Windows の名前付きのミューテックスと終了の依頼（名前付きのイベント）
      ├── single_instance_linux.py # Linux のロックファイル（flock）と終了の依頼（抽象名前空間の Unix ドメインソケット）
      ├── settings_store.py    # SettingsStore（動いている間の今の設定）
      ├── process.py           # relaunch（同じ引数で起動し直す）
      └── timer.py             # RepeatingTimer（上限での打ち切りを定期に呼ぶ）
  ```

  リポジトリの直下は `pyproject.toml`・`uv.lock`・`.python-version`・起動のバッチファイル（`voice-paste.bat`）・Linux の起動のスクリプト（`voice-paste.sh`）・自動起動の雛形（`voice-paste.desktop`）・`config/`・`settings.sample.yaml`・`README.md`・`CLAUDE.md`・`src/`・`resources/`・`tests/`・`dev/`・`docs/` に絞る。

  動かす環境は、リポジトリの直下で Windows の uv（WSL からは `uv.exe`）で `uv sync --frozen` を流して `.venv/` に作り、ローカルの Whisper（faster-whisper・nvidia-*）を使う環境は `--extra local-whisper` を付けて流す（`uv.lock` のバージョンで入り、Python のバージョンは `.python-version` の 3.14）。
  Windows のクローンで WSL の uv で流すと `.venv/` を Linux の構成に作り直すため、Windows のクローンの環境を作るコマンドと環境で流すコマンドは Windows の uv で流す（`uv lock` はどちらでもよい）。
  Ubuntu のクローンでは、Linux の起動のスクリプトが Linux の uv で `uv sync --frozen --extra local-whisper` を流して `.venv/` を作り、`.venv/bin/python -m voice_paste` で起動する（`pycaw`・`comtypes`・`pywin32` は `sys_platform == "win32"` の条件で入らない）。
  起動のバッチファイル（`voice-paste.bat`）は、起動のたびにリポジトリの直下で `uv sync --frozen --extra local-whisper` を流し、`.venv/` を `uv.lock` に揃える（揃っていれば何も書き換えずに終わる）。uv は PATH から探し、無ければ `%USERPROFILE%\.local\bin\uv.exe` を使う。
  `uv sync --frozen` を流す前に、コンソールに `Syncing .venv with uv sync --frozen. See log: {launcher.log のパス}` を表示する。
  続けて `.venv\Scripts\python.exe -c "import voice_paste"` で `.venv` から voice_paste を import できるかを確かめる（`.venv` のフォルダや `python.exe` があるかでは判定しない）。
  uv が見つからないときは `uv sync --frozen` を飛ばして `launcher.log` にその旨を書き、import できれば起動する。
  import できたら、`.venv` を有効にし、CUDA の DLL（`.venv` の `Lib/site-packages/nvidia/` の `cublas`・`cudnn`・`cuda_nvrtc` の `bin`）を `PATH` に追加して、`.venv\Scripts\pythonw.exe -m voice_paste` を引数なしで起動する（コンソールを出さない）。システムの `pythonw` では起動しない。
  次のときは起動せず、コンソールに理由の 1 行と `See log: {launcher.log のパス}` を表示して `pause` で止まり、0 以外の終了コードで終わる（`uv sync` の失敗はその終了コード、ほかは 1）。

  | 起きたこと | 理由の行 |
  | --- | --- |
  | uv が PATH にも `%USERPROFILE%\.local\bin\uv.exe` にも無く、import もできない | `[ERROR] uv not found. Install uv and run voice-paste.bat again.` |
  | `uv sync --frozen` が 0 以外で終わる | `[ERROR] uv sync --frozen failed with code {終了コード}.` |
  | `uv sync --frozen` の後も import できない | `[ERROR] voice_paste cannot be imported from .venv after uv sync.` |

  起動の記録（起動した時刻・import の確かめの結果・`uv sync --frozen` の出力・使った Python・起動の終了コード）は `%LOCALAPPDATA%\voice-paste\log\launcher.log` へ起動ごとに上書きで書く。
  ログの保持期間の削除（purge_old_logs）は日付の名前のログだけを消すため、上書きで大きさを保ち、日付でログを消す処理は持たない。
  Linux の起動のスクリプト（`voice-paste.sh`。bash、`set -euo pipefail`、git で実行権限を付ける）は、スクリプトの場所へ移り、`voice-paste.bat` と同じ順で動く。

  | 手順 | Linux での動き |
  | --- | --- |
  | uv を探す | PATH（`command -v uv`）から探し、無ければ `~/.local/bin/uv` を使う |
  | 環境を揃える | 標準出力に `Syncing .venv with uv sync --frozen. See log: {launcher.log のパス}` を出し、`uv sync --frozen --extra local-whisper` を流す |
  | import を確かめる | `.venv/bin/python -c "import voice_paste"` |
  | 起動する | `setsid -f .venv/bin/python -m voice_paste "$@"` で端末から切り離し（標準入出力は `/dev/null`）、0 で終わる。`setsid -f` が 0 以外で終わったときは、理由の行 `[ERROR] failed to launch voice_paste with code {終了コード}.` で「起動しない」と同じ終わり方をする。CUDA のライブラリのパスは追加しない（Linux の既定は cpu） |
  | 起動しない | 上の表の理由の行（`voice-paste.bat` は `voice-paste.sh` に読み替える）と `See log: {launcher.log のパス}` を標準エラーに出し、同じ終了コードで終わる。`pause` に当たる止めは持たず、標準エラーが端末でなく `notify-send` があるときは同じ 2 行を通知する |
  | 起動の記録 | `${XDG_DATA_HOME:-~/.local/share}/voice-paste/log/launcher.log` へ起動ごとに上書きで書く（platformdirs の user_data_dir の `log/` と同じ場所） |

  自動起動の雛形（`voice-paste.desktop`）は `Type=Application`・`Name=voice-paste`・`Exec="@REPO_DIR@/voice-paste.sh"`・`Icon=@REPO_DIR@/resources/tray/idle.png`・`Terminal=false`・`X-GNOME-Autostart-enabled=true` を持つ。手順のページの `sed` で `@REPO_DIR@` をクローンの絶対パスに置き換えて、`~/.config/autostart/`（ログイン時の自動起動）と `~/.local/share/applications/`（アプリの一覧）へ書き出す。
  起動のスクリプトと雛形は単体テストを持たず、検証環境の VM での起動から貼り付けまでの通しの確認で確かめる（`voice-paste.bat` と同じ）。
  `pyproject.toml` の `[project.scripts]` の `voice-paste` は `voice_paste.main:main` を指す。
