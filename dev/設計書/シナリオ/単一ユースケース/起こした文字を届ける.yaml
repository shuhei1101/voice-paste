title: "起こした文字を届ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 出力先
        description: 「貼り付けて送信」をオンにし、録音する で「貼り付けて送信」を選んだ
      - name: Enter と一緒に押す修飾キー
        description: 設定画面で Ctrl・Alt・Shift を全てオフにした（既定）
        notes: '`outputs[paste_and_send]` の修飾キーの項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（貼り付けて送信）
        participant CB as クリップボード
        participant TGT as 貼り付け先のアプリ
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TGT: 貼り付けのキーを送る
        OUT->>TGT: 設定の間を置いて Enter を送る
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 貼り付け先の入力欄に起こした文字が入り、Enter が送られている
      - クリップボードに起こした文字が入っている
      - トレイのアイコンが待機中に戻っている
  - name: 正常シナリオ（貼り付けのみ）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 出力先
        description: 「貼り付けのみ」をオンにし、録音する で「貼り付けのみ」を選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（貼り付けのみ）
        participant CB as クリップボード
        participant TGT as 貼り付け先のアプリ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TGT: 貼り付けのキーを送る
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - 貼り付け先の入力欄に起こした文字が入り、Enter は送られていない
      - クリップボードに起こした文字が入っている
  - name: 正常シナリオ（コピーのみ）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 出力先
        description: 「コピーのみ」をオンにし、録音する で「コピーのみ」を選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（コピーのみ）
        participant CB as クリップボード

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - クリップボードに起こした文字が入っている
      - 貼り付けのキーも Enter も送られていない
  - name: 正常シナリオ（ブラウザ添付のプリセット）
    setup:
      - name: Mock
        description: なし（実機の Windows と Microsoft Edge で実行）
      - name: プリセット
        description: 種類「ブラウザ添付」・Enter まで送るをオンにしたプリセットを 1 つ足し、録音する でそのプリセットを選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（ブラウザ添付）
        participant CB as クリップボード
        participant EDGE as Microsoft Edge

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>EDGE: プリセットの URL をアプリのウィンドウとして開く（Edge が見つからなければ既定のブラウザで開く）
        OUT->>OUT: 設定の間を置く
        OUT->>EDGE: 貼り付けのキーを送り、設定の間を置いて Enter を送る
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - プリセットの URL の画面がアプリのウィンドウとして開いている
      - その画面の入力欄に起こした文字が入り、送信されている
  - name: 正常シナリオ（呼び出し元へ返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: API から始めた録音で、起こした文字が得られた
      - name: ほかの出力先
        description: 「貼り付けて送信」をオンにしている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字と返送先を渡す
        OUT->>OUT: 返送先が loopback か設定で許可したホストであることを確かめる
        OUT->>CB: セッションの ID と起こした文字を送る
        CB-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 返送先の受け口に、セッションの ID と起こした文字が 1 回届いている
      - クリップボードと貼り付け先が届ける前のままである
      - トレイのアイコンが待機中に戻っている
  - name: 正常シナリオ（呼び出し元へ空の文字を返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: API から始めた録音で、文字起こしの結果が空だった
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        SVC->>OUT: 空の文字と返送先を渡す
        OUT->>CB: セッションの ID と空の文字を送る
        CB-->>OUT: 受け取った
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - 返送先の受け口に、セッションの ID と空の文字が 1 回届いている
      - トレイのアイコンが待機中に戻っている
  - name: 異常シナリオ（呼び出し元へ失敗を返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: API から始めた録音で、文字起こしに失敗した
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        SVC->>OUT: 文字起こしの失敗と返送先を渡す
        OUT->>CB: セッションの ID と文字起こしに失敗したことを送る
        CB-->>OUT: 受け取った
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - 返送先の受け口に、セッションの ID と文字起こしに失敗したことが 1 回届いている
      - トレイのアイコンが待機中に戻っている
  - name: 異常シナリオ（返送先に届かない）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 入口
        description: API から始めた録音で、起こした文字が得られた
      - name: 返送先の停止
        description: 返送先の受け口を止めておき、送っても届かないようにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant LOG as ログ

        SVC->>OUT: 起こした文字と返送先を渡す
        loop 決めた回数まで
          OUT->>CB: セッションの ID と起こした文字を送る
          CB--xOUT: 届かない（タイムアウトか接続できない）
          OUT->>OUT: 決めた間を置く
        end
        OUT->>LOG: 返送先に届かなかったこととセッションの ID を書く
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - ログに返送先に届かなかったこととセッションの ID が書かれている
      - 履歴に録音と起こした文字が残っている
      - トレイのアイコンが待機中に戻り、次の録音を始められる
    notes:
      再送の回数と間: 再送の回数・間・タイムアウトは非機能要件で決める。
  - name: 正常シナリオ（エンドポイントへ送るプリセット）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。送り先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: プリセット
        description: 種類「エンドポイントへ送る」で URL にテスト用の受け口を設定したプリセットを 1 つ足し、録音する でそのプリセットを選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（エンドポイントへ送る）
        participant EP as 送り先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>EP: セッションの ID と起こした文字を送る
        EP-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 送り先の受け口に、セッションの ID と起こした文字が 1 回届いている
      - クリップボードと貼り付け先が届ける前のままである
      - トレイのアイコンが待機中に戻っている
  - name: 異常シナリオ（送り先に届かない）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: プリセット
        description: 種類「エンドポイントへ送る」で URL にテスト用の受け口を設定したプリセットを 1 つ足し、録音する でそのプリセットを選んだ
      - name: 応えない送り先
        description: 送り先の受け口が、受け取っても設定のタイムアウトより長く応えないようにしておき、送っても届かない（タイムアウト）ようにする
        notes: 受け口は動かしたままにして、送った回数を数える（既定のタイムアウト 1.5 秒に対し 3 秒応えない）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（エンドポイントへ送る）
        participant EP as 送り先のエンドポイント
        participant TRAY as トレイ
        participant LOG as ログ

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>EP: セッションの ID と起こした文字を送る
        EP--xOUT: 届かない（タイムアウトか接続できないか、2xx 以外）
        OUT-->>SVC: 届けられなかった
        SVC->>TRAY: 届けられなかったことを知らせる
        SVC->>LOG: 届けられなかった理由とセッションの ID を書く
        SVC->>SVC: 待機中に戻す
      ```
    expected:
      - トレイで届けられなかったことが知らされている
      - ログに届けられなかった理由とセッションの ID が書かれている
      - 送り先へ送ったのは 1 回だけである（送り直さない）
      - 履歴に録音と起こした文字が残っている
      - トレイのアイコンが待機中に戻り、次の録音を始められる
  - name: 正常シナリオ（ブラウザ添付のプリセット・貼り付けだけ）
    setup:
      - name: Mock
        description: なし（実機の Windows と Microsoft Edge で実行）
      - name: プリセット
        description: 種類「ブラウザ添付」・Enter まで送るをオフにしたプリセットを 1 つ足し、録音する でそのプリセットを選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（ブラウザ添付）
        participant CB as クリップボード
        participant EDGE as Microsoft Edge

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>EDGE: プリセットの URL をアプリのウィンドウとして開く
        OUT->>OUT: 設定の間を置く
        OUT->>EDGE: 貼り付けのキーを送る（Enter は送らない）
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - プリセットの URL の画面がアプリのウィンドウとして開いている
      - その画面の入力欄に起こした文字が入り、送信はされていない
  - name: 正常シナリオ（区間ごとに呼び出し元へ返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: 連続録音で、区間の文字が通し番号つきで得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        loop 区間ごと（通し番号の順）
          SVC->>OUT: 区間の文字・通し番号・返送先を渡す
          OUT->>OUT: 返送先が loopback か設定で許可したホストであることを確かめる
          OUT->>CB: セッションの ID・通し番号・区間の文字を送る
          CB-->>OUT: 受け取った
        end
      ```
    expected:
      - 返送先の受け口に、区間ごとにセッションの ID・通し番号・区間の文字が 1 回ずつ届いている
      - 届いた順が通し番号の順である
      - クリップボードと貼り付け先が届ける前のままである
    notes:
      順の保ち方: 前の区間の返送を終えて（届かなかったときは再送を終えて）から次の区間を送る。
  - name: 正常シナリオ（連続録音の終わりを返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: 連続録音が完了か上限で終わり、最後の区間まで届け終えた（区間が 1 つも無い場合を含む）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 終わった理由（完了か上限での打ち切り）と区間の数を渡す
        OUT->>CB: セッションの ID・終わった理由・区間の数を送る
        CB-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 返送先の受け口に、最後の区間の返送の後で、セッションの ID・終わった理由・区間の数が 1 回届いている
      - 区間の数が、届けた区間の通し番号の最後の値と一致する（区間が無ければ 0）
      - トレイのアイコンが待機中に戻り、次の録音を始められる
  - name: 異常シナリオ（区間の失敗を呼び出し元へ返す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行。返送先は 127.0.0.1 で待ち受けるテスト用の受け口）
      - name: 入口
        description: 連続録音で、ある区間の文字起こしが失敗した
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        SVC->>OUT: 区間の失敗・通し番号・返送先を渡す
        OUT->>CB: セッションの ID・通し番号・失敗した理由を送る
        CB-->>OUT: 受け取った
        Note over SVC: 連続録音は続け、次の区間を 正常シナリオ（区間ごとに呼び出し元へ返す） のとおり届ける
      ```
    expected:
      - 返送先の受け口に、失敗した区間のセッションの ID・通し番号・失敗した理由が 1 回届いている
      - その後の区間の文字が通し番号の順に届いている
  - name: 異常シナリオ（区間の返送先に届かない）
    setup:
      - name: Mock
        description: 返送先の受け口を、通し番号 2 の区間の返送にだけ常に 500 を返すようにする
      - name: 再送の設定
        description: 返送の再送の間隔をテストで待てる短い値に差し替える
      - name: 入口
        description: 連続録音で、通し番号 1・2・3 の区間の文字が得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant LOG as ログ

        SVC->>OUT: 通し番号 2 の区間の文字を渡す
        loop 決めた回数まで
          OUT->>CB: セッションの ID・通し番号 2・区間の文字を送る
          CB-->>OUT: 500
          OUT->>OUT: 決めた間を置く
        end
        OUT->>LOG: 返送先に届かなかったこととセッションの ID・通し番号を書く
        SVC->>OUT: 通し番号 3 の区間の文字を渡す
        OUT->>CB: セッションの ID・通し番号 3・区間の文字を送る
        CB-->>OUT: 受け取った
      ```
    expected:
      - 通し番号 2 の区間の返送が、決めた回数だけ送られている
      - ログに、届かなかったこととセッションの ID・通し番号 2 が書かれている
      - 通し番号 3 の区間の文字がその後に届いている
      - 連続録音は止まっていない
    notes:
      再送の回数と間: 再送の回数・間・タイムアウトは 1 回の録音の返送と同じ非機能要件の値を使う。
  - name: 正常シナリオ（Enter と一緒に修飾キーを押す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 出力先
        description: 「貼り付けて送信」をオンにし、録音する で「貼り付けて送信」を選んだ
      - name: Enter と一緒に押す修飾キー
        description: 設定画面で Ctrl をオンにし、Alt・Shift をオフにした
        notes: '`outputs[paste_and_send]` の修飾キーの項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（貼り付けて送信）
        participant CB as クリップボード
        participant TGT as 貼り付け先のアプリ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TGT: 貼り付けのキーを送る
        OUT->>TGT: 設定の間を置いて、Ctrl を押したまま Enter を送る
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - 貼り付け先の入力欄に起こした文字が入り、Ctrl+Enter が送られている
      - Enter を送り終えた後、Ctrl が押されたままになっていない
      - クリップボードに起こした文字が入っている
lead: 起こした文字を、ホットキーから始めた録音は選んだ出力先へ、API から始めた録音は呼び出し元のエンドポイントへ届ける単一ユースケース。
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: 録音を文字に起こす で空でない文字が起きるか、API から始めた録音で空の文字・文字起こしの失敗が渡される
preconditions:
  - ホットキー・トレイから始めた録音では、貼り付けたいアプリの入力欄にフォーカスがある（貼り付けはその時点のアクティブなウィンドウへ入る）
  - API から始めた録音では、開始で指定された返送先のエンドポイントがある
notes:
  出力先の選ばれ方: |-
    ホットキー・トレイから始めた録音は、設定でオンにした固定の出力先（貼り付けて送信・貼り付けのみ・コピーのみ）と、有効にしたカスタムプリセット（ブラウザ添付・エンドポイントへ送る）のうち、録音する で選んだものへ届ける。
    API から始めた録音は、呼び出し元へ返す出力先だけを使い、そのほかの出力先とプリセットはオンでも通さない。
  クリップボードに書けないとき: |-
    ほかのアプリがクリップボードを開いたままで書けないときは、届けられなかったことをユーザーに知らせ、ログに理由を書く。
    録音と起こした文字は履歴に残っている。
    実機で決定的に起こせないため、シナリオにはしていない。
  E2E のテスト: 全シナリオが録音を始め、実機のマイクを開くため、E2E のテストを置かない（#65）。録音から届けるまでは、複合ユースケース「声で入力した文字を貼り付ける」「ほかのシステムから録音を文字に起こす」の E2E が、録音のファイルを内部で渡して確かめる
