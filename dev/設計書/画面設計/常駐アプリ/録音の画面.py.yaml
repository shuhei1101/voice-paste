lead: ホットキー・トレイから始めた録音の間だけ出る小さな窓。状態・経過時間・波形と、一時停止・取り消し・確定の操作を並べる。
refs:
  - dev/設計書/シナリオ/単一ユースケース/録音する#
  - dev/設計書/モジュール構成/常駐アプリ/ホットキーと画面.py#classes[UiBridge]
notes:
  ホットキー: ボタンと同じ操作は、どこにフォーカスがあってもホットキーで行える（`HotkeyListener`）。窓のキーボードの操作は持たず、窓を押してフォーカスを取った後に Tab で移ったときだけフォーカスの枠を出す
  ボタンのホットキーの出し方: 一時停止・再開・取り消し・出力先の確定・カスタムプリセットのボタンは、名前を 1 行目に、同じ操作のホットキーを 2 行目に出す。ホットキーは `format_hotkey` で整えた全体を省略せず、枠で囲んだ等幅のキー（キーキャップ風）で出す。ボタンの大きさは中の名前とホットキーが要る大きさから決め、幅は名前とホットキーの長い方にする。窓は既定の幅（360px）より狭くせず、ボタンが要る幅まで広げる。プリセットの列は列ごとにいちばん広いボタンの幅に揃える。ホットキーが空のボタンは名前だけを出す
  状態の受け取り: 画面はメインスレッドで `UiBridge.notified` の state_changed を受けて開く・閉じる・状態を替える。経過時間と波形はメインスレッドのタイマーで描き直す
  隠して戻す: 隠すのはその回の録音の画面だけで、次の録音ではいつもどおり出す（`recording.hide_window` は変えない）。戻すときは、隠したときの経過時間・状態（録音中・一時停止中）のまま、隠す前の位置にフォーカスを取らずに出す。録音開始と同じホットキーの出力先がある設定（既定の設定）では、録音開始のホットキーは今どおりその出力先で確定し、戻すのはトレイだけになる。隠したまま確定した回も、文字起こし中の表示は隠す前の位置に出す
