summary: 単一 / 複合ユースケースの業務フロー設計（E2E テストの元）
items:
- page: SC-5.yaml
  summary: ショートカットから常駐サービスを起動し、文字起こしのエンジン・API・ホットキーを立てて録音の開始を待つ
- page: SC-8.yaml
  summary: ホットキー・トレイ・API から録音を始め、確定して履歴に残すか取り消す
- page: SC-9.yaml
  summary: 確定した録音を設定のエンジンで文字に起こし、文頭・文末の決まった文言を消して用語集で補正する
- page: SC-7.yaml
  summary: 起こした文字を、選んだ出力先か API の呼び出し元のエンドポイントへ届ける
- page: SC-6.yaml
  summary: 設定画面で設定を変えて settings.yaml に保存する
- page: SC-2.yaml
  summary: トレイのメニューからフォルダを開く・再起動する・終了する
- page: SC-1.yaml
  summary: ほかのプロセスが API の開始・停止・完了で、画面を出さない録音を始めて確定する
- page: SC-3.yaml
  summary: 外の端末のブラウザで録るか音声ファイルを選び、端末に残してから送信して job_id を受け取る
- page: SC-4.yaml
  summary: job_id で進み具合と結果を取りに行き、結果を端末に残してコピー・削除する
- page: SC-12.yaml
  summary: ホットキーで録音し、話した内容を文字に起こしてアクティブなアプリへ届ける
- page: SC-11.yaml
  summary: ほかのプロセスが API で録音を開始・停止・完了し、指定したエンドポイントで起こした文字を受け取る
- page: SC-10.yaml
  summary: ほかのプロセスが API で連続録音を始め、無音で区切った区間ごとの文字を区切った順に受け取り、完了で終える
- page: SC-13.yaml
  summary: 外の端末のブラウザで録った音声か音声ファイルをゲートウェイを通して送信し、文字に起こした結果を画面で受け取る
