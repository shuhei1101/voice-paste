普段使いの環境の作り直し:
  説明: 普段使いのクローン（master）で常駐アプリを終了し、Windows の uv（WSL からは `uv.exe`）の `uv sync --frozen` で `.venv/` に環境を作り、起動のバッチファイルから起動し直す。今の `venv/` は消さずに残し、動かなければ `venv/` を参照する前の起動のバッチファイルに戻して切り戻す
  タグ: [環境の作り直し, 再起動]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら残した環境へ切り戻して依頼元へ返す
  確認方法: 普段使いのクローンで Windows の uv（WSL からは `uv.exe`）の `uv sync --frozen --check` が差分なしで終わり、起動のバッチファイルから起動した常駐アプリのログの最後の起動の行の時刻が作り直しより後になっている
  状態: "-"
