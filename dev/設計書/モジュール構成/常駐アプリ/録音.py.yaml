title: "常駐アプリ / 録音"
lead: マイクで録音し、録音中はシステム音量を下げて戻す。入口を問わず同じ録音を使い、画面には触れない。連続録音では録音を止めずに無音で区切り、区間を区切った順に渡す。
directory: |-
  ```
  src/voice_paste/features/recording/
  ├── __init__.py   # Recorder・Segmenter の公開
  ├── types.py      # 音量の操作・マイクの入力を開く・話し声の判定の関数型
  ├── service.py    # Recorder（開始・一時停止・再開・停止・破棄・音の大きさ・連続録音の開始と停止）
  ├── segmenter.py  # Segmenter（窓ごとの話し声の確率から区間を切り出す）
  └── client.py     # sounddevice の入力を開く（open_input）
  ```
data_models: []
function_types:
  - name: LowerVolumeFn
    title: 音量を下げる
    container: features/recording/types.py
    usecase: 録音する
    summary: 今の音量に対する割合へ fade_sec をかけて下げ始め、下げる前の音量を返す
    args:
      - name: ratio
        type: float
        description: 今の音量に対する割合（0.0〜1.0）
      - name: fade_sec
        type: float
        description: 下げるのにかける秒数（0 なら呼び出しの中ですぐ変える）
    returns:
      type: float
      description: 下げる前の音量（0.0〜1.0）
    implementations:
      - target: 外部連携の lower_volume（pycaw のアダプタ）
    status: implemented
  - name: RestoreVolumeFn
    title: 音量を戻す
    container: features/recording/types.py
    usecase: 録音する
    summary: 下げる前の音量へ fade_sec をかけて戻し始める
    args:
      - name: volume
        type: float
        description: 戻す音量（0.0〜1.0）
      - name: fade_sec
        type: float
        description: 戻すのにかける秒数（0 なら呼び出しの中ですぐ変える）
    returns:
      type: None
      description: なし
    implementations:
      - target: 外部連携の restore_volume（pycaw のアダプタ）
    status: implemented
  - name: OpenInputFn
    title: マイクの入力を開く
    container: features/recording/types.py
    usecase: 録音する
    summary: 既定のマイクの入力を開いて始め、届いた音を on_frames へ渡す。閉じる操作を持つストリームを返す
    args:
      - name: on_frames
        type: Callable[[numpy.ndarray], None]
        description: 入力のスレッドから、届いた音（モノラル・int16）を受け取る
    returns:
      type: sounddevice.InputStream
      description: 開いて始めた入力（stop・close で閉じる）
    implementations:
      - target: 録音の open_input
    status: implemented
  - name: SpeechProbabilityFn
    title: 話し声の判定
    container: features/recording/types.py
    usecase: 録音する
    summary: 1 窓（VAD_WINDOW サンプル・float32）の話し声の確率を返す。前の窓からの状態を持ち越す
    args:
      - name: window
        type: numpy.ndarray
        description: 1 窓の音（float32・-1.0〜1.0）
    returns:
      type: float
      description: 話し声の確率（0.0〜1.0）
    implementations:
      - target: 外部連携の StreamingVad
    status: planned
    introduced:
      pr: 78
  - name: CreateSpeechDetectorFn
    title: 話し声の判定を作る
    container: features/recording/types.py
    usecase: 録音する
    summary: 状態を持たない新しい話し声の判定を作って返す（連続録音を始めるたびに呼ぶ）
    returns:
      type: SpeechProbabilityFn
      description: 新しい話し声の判定
    implementations:
      - target: main.py が load_vad_session のセッションを部分適用した StreamingVad
    status: planned
    introduced:
      pr: 78
classes:
  - name: Recorder
    title: 録音機
    container: features/recording/service.py
    usecase: 録音する
    role: サービス
    kind: クラス
    summary: 開いているマイクの入力と貯めた音、下げる前の音量を持つ
    description: |-
      マイクの入力（コールバックのストリーム）を長く持つためクラスにする。
      入力のスレッドが音を貯める処理と、呼び出し元のスレッドの操作を 1 つのロックで守る。
      どの終わり方（停止・破棄・開始の失敗・連続録音の停止）でも、下げた音量を 1 回だけ戻す。
      設定は録音を始めるたびに読み直す（`recording.*` は再起動なしで効く）。
      連続録音では、入力のスレッドは届いた音を待ち行列へ積むだけにし、話し声の判定と区切りは区切りのスレッドで行う（入力のコールバックを遅らせない）。音は貯めず、区間は Segmenter が渡す。
    properties:
      - name: _lower_volume
        type: LowerVolumeFn
        access: 内部 (_)
        description: 音量を下げる
      - name: _restore_volume
        type: RestoreVolumeFn
        access: 内部 (_)
        description: 音量を戻す
      - name: _open_input
        type: OpenInputFn
        access: 内部 (_)
        description: マイクの入力を開く（client.py の open_input）
      - name: _get_settings
        type: Callable[[], RecordingSettings]
        access: 内部 (_)
        description: 今の録音の設定を返す（main.py が設定の持ち主から引く関数を渡す）
      - name: _stream
        type: sounddevice.InputStream | None
        access: 内部 (_)
        default: None
        description: 開いている入力。録音していなければ None
      - name: _frames
        type: list[numpy.ndarray]
        access: 内部 (_)
        default: '[]'
        description: 貯めた音
      - name: _paused
        type: bool
        access: 内部 (_)
        default: 'False'
        description: 一時停止中か
      - name: _latest_frame
        type: numpy.ndarray | None
        access: 内部 (_)
        default: None
        description: 直近に届いた音（音の大きさの元）。一時停止で None に戻す
      - name: _volume_before
        type: float | None
        access: 内部 (_)
        default: None
        description: 下げる前の音量。下げていなければ None
      - name: _fade_sec
        type: float
        access: 内部 (_)
        default: '0.0'
        description: 始めたときに読んだ、音量を変えるときの秒数（戻すときも同じ値を使う）
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: 入力のスレッドと呼び出し元のスレッドの間で、貯めた音と状態を守る
      - name: _create_speech_detector
        type: CreateSpeechDetectorFn
        access: 内部 (_)
        description: 連続録音を始めるたびに、状態を持たない新しい話し声の判定を作る（main.py が VAD のセッションを部分適用した StreamingVad を渡す）
      - name: _blocks
        type: queue.Queue[numpy.ndarray | None] | None
        access: 内部 (_)
        default: None
        description: 連続録音で、入力のスレッドから区切りのスレッドへ渡す音の待ち行列（None は終わりの印）。連続録音でなければ None
      - name: _segment_thread
        type: threading.Thread | None
        access: 内部 (_)
        default: None
        description: 連続録音で、待ち行列の音を Segmenter へ流すスレッド（名前 SEGMENT_THREAD_NAME）
    methods:
      - name: start
        title: 録音の開始
        kind: メソッド
        scope: public
        inherits: StartRecordingFn
        summary: 音量を下げてマイクを開く。開けなければ音量を戻して送出する
        returns:
          type: None
          description: なし
        process: |-
          1. 録音中（_stream がある）なら RuntimeError を送出する（呼び出し順の誤り。セッションが排他する）
          2. 設定を読み、貯めた音・一時停止・直近の音を空に戻す
          3. 設定の lower_volume が真なら、volume_percent / 100 の割合と fade_sec で音量を下げ、返った音量を _volume_before に持つ（音量を下げる）
             - VolumeControlError の場合、音量を下げずに続ける（_volume_before は None のまま）
               - `[WARNING]` 音量を下げられなかった（理由）
          4. マイクの入力を開く（入力のスレッドから音を受け取る関数を渡す）
             - 例外の場合、音量を戻し（音量を戻す）、MicrophoneUnavailableError を送出する（理由に元の例外を残す）
               - `[ERROR]` マイクを開けなかった（理由）
          5. `[INFO]` 録音を始めた（音量を下げたか）
        exceptions:
          - name: MicrophoneUnavailableError
            condition: マイクの入力を開けない
          - name: RuntimeError
            condition: 録音中（呼び出し順の誤り）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 音量を下げてマイクを開く
            condition: lower_volume=True・volume_percent=50・fade_sec=0.5
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: lower_volume に (0.5, 0.5) が渡り、その後に open_input が呼ばれる
          - name: test_start_when_lower_volume_disabled
            case: 正常
            summary: 音量を下げない設定なら音量に触れない
            condition: lower_volume=False
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: open_input が呼ばれ、lower_volume が呼ばれない
          - name: test_start_when_microphone_unavailable
            case: 異常
            summary: マイクを開けなければ音量を戻す
            condition: lower_volume が 0.8 を返し、open_input が例外を送出する
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: MicrophoneUnavailableError が送出され、restore_volume に (0.8, fade_sec) が 1 回渡り、続く start が通る
            exception: マイクの入力を開けない
          - name: test_start_when_volume_control_failed
            case: 正常
            summary: 音量を下げられなくても録音は始める
            condition: lower_volume が VolumeControlError を送出する
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: open_input が呼ばれ、例外が出ず、続く stop で restore_volume が呼ばれない
          - name: test_start_when_already_recording
            case: 異常
            summary: 録音中の開始は断る
            condition: start の後にもう一度 start を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: RuntimeError が送出され、open_input・lower_volume が 1 回だけ呼ばれる
            exception: 録音中（呼び出し順の誤り）
      - name: pause
        title: 一時停止
        kind: メソッド
        scope: public
        summary: 入力は開いたまま、音を貯めるのを止める
        returns:
          type: None
          description: なし
        process: 1. 一時停止中にし、直近の音を None に戻す（録音していなければ何もしない）
        unit_tests:
          - name: test_pause_when_not_recording
            case: 正常
            summary: 録音していなければ何もしない
            condition: start の前に pause を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: 例外が出ず、続く start が通る
      - name: resume
        title: 再開
        kind: メソッド
        scope: public
        summary: 音を貯めるのを再び始める
        returns:
          type: None
          description: なし
        process: 1. 一時停止を解く（録音していなければ何もしない）
      - name: stop
        title: 録音の停止
        kind: メソッド
        scope: public
        inherits: StopRecordingFn
        summary: 入力を閉じ、音量を戻し、貯めた音を返す
        returns:
          type: Recording
          description: 貯めた音（16 kHz・モノラル・int16。貯めた音が無ければ長さ 0 の音）
        process: |-
          1. 録音していなければ RuntimeError を送出する
          2. 入力を閉じて音量を戻す（_close）
          3. 貯めた音をつないで Recording にする。長さはサンプル数 / サンプルレート
             - `[INFO]` 録音を止めた（長さ）
        exceptions:
          - name: RuntimeError
            condition: 録音していない（呼び出し順の誤り）
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 貯めた音を返して音量を戻す
            condition: lower_volume が 0.8 を返す。入力に 1 秒分の音を流した後に止める
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: duration_sec が 1.0・sample_rate が 16000 の Recording が返り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡る
          - name: test_stop_when_paused_between
            case: 正常
            summary: 一時停止の間の音は貯めない
            condition: 1 秒流す → pause → 1 秒流す → resume → 1 秒流す
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: duration_sec が 2.0
          - name: test_stop_when_no_frames
            case: 正常
            summary: 音が届く前に止めたら長さ 0 の音を返す
            condition: start の直後に stop を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: duration_sec が 0.0 の Recording が返る
          - name: test_stop_when_restore_failed
            case: 正常
            summary: 音量を戻せなくても録音は返す
            condition: restore_volume が VolumeControlError を送出する
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: Recording が返り、例外が出ない
          - name: test_stop_when_not_recording
            case: 異常
            summary: 録音していなければ断る
            condition: start の前に stop を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: RuntimeError が送出される
            exception: 録音していない（呼び出し順の誤り）
      - name: discard
        title: 録音の破棄
        kind: メソッド
        scope: public
        summary: 入力を閉じ、音量を戻し、貯めた音を捨てる
        returns:
          type: None
          description: なし
        process: |-
          1. 録音していなければ何もしない
          2. 入力を閉じて音量を戻し（_close）、貯めた音を空にする
          3. 連続録音なら、待ち行列を空にして区切りのスレッドを flush せずに止め（残りの音は区間にしない）、待ち行列とスレッドを手放す
             - `[INFO]` 録音を捨てた
        unit_tests:
          - name: test_discard
            case: 正常
            summary: 音を捨てて音量を戻す
            condition: lower_volume が 0.8 を返す。1 秒流した後に discard、続けて start・stop
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: restore_volume に (0.8, fade_sec) が渡り、後の stop の duration_sec に捨てた 1 秒が入らない
          - name: test_discard_when_not_recording
            case: 正常
            summary: 録音していなければ何もしない
            condition: start の前に discard を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: 例外が出ず、restore_volume が呼ばれない
          - name: test_discard_when_continuous
            case: 正常
            summary: 連続録音を捨てると残りの音を区間にしない
            condition: 話し声の判定が常に 0.9 を返す。start_continuous で 1 秒分の音を流して discard
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment が呼ばれず、restore_volume が呼ばれ、区切りのスレッドが残らず、続く start が通る
      - name: level
        title: 音の大きさ
        kind: メソッド
        scope: public
        summary: 直近に届いた音の RMS を int16 の最大（32767）で割り、0.0〜1.0 で返す。録音していない・一時停止中・音が届いていなければ 0.0
        returns:
          type: float
          description: 音の大きさ（0.0〜1.0）
        unit_tests:
          - name: test_level
            case: 正常
            summary: 直近の音の大きさを返す
            condition: 振幅 16384 の矩形の音を流す
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: 0.5 に近い値（誤差 0.01 以内）が返る
          - name: test_level_when_paused
            case: 正常
            summary: 一時停止中は 0
            condition: 音を流した後に pause
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: 0.0 が返る
      - name: _close
        title: 入力を閉じて音量を戻す
        kind: メソッド
        scope: internal
        summary: 入力を止めて閉じ、下げた音量があれば戻して _volume_before を None にする
        returns:
          type: None
          description: なし
        process: |-
          1. 入力を stop・close して _stream を None にする
             - 例外の場合、閉じたものとして続ける
               - `[WARNING]` マイクの入力を閉じられなかった（理由）
          2. _volume_before があれば、その音量と _fade_sec で音量を戻し、_volume_before を None にする（戻すのは 1 回だけ）
             - VolumeControlError の場合、続ける
               - `[WARNING]` 音量を戻せなかった（理由）
      - name: start_continuous
        title: 連続録音の開始
        kind: メソッド
        scope: public
        inherits: StartContinuousRecordingFn
        summary: 音量を下げてマイクを開き、届いた音を区切りのスレッドで Segmenter へ流す。区切った区間は on_segment へ渡る
        args:
          - name: on_segment
            type: OnSegmentFn
            required: true
            description: 区切った区間を受け取る（区切りのスレッドから呼ばれる）
          - name: on_failed
            type: OnContinuousFailedFn
            required: true
            description: 区切りに失敗して連続録音を止めたことを受け取る（区切りのスレッドから呼ばれる）
          - name: min_silence_sec
            type: float
            required: true
            passing: keyword
            description: 区切る無音の長さ（設定の api.continuous.min_silence_sec。main.py が部分適用する）
        returns:
          type: None
          description: なし
        process: |-
          1. start と同じく、録音中なら RuntimeError を送出し、設定を読んで音量を下げる
          2. 新しい話し声の判定（_create_speech_detector）と on_segment・min_silence_sec で Segmenter を作り、音の待ち行列を空で作る
          3. 区切りのスレッドを始める（待ち行列から音を取り出して Segmenter.feed へ渡し、終わりの印で Segmenter.flush を呼んで終える。捨てる印では flush せずに終える）
             - feed・flush の例外の場合、そこで連続録音を終える。入力を閉じて音量を戻し（_close。入力は待ち行列へ積めなくなり、音は貯まらない）、待ち行列を空にして、on_failed に理由を渡してスレッドを終える（それまでに渡した区間はそのまま）
               - `[ERROR]` 連続録音の区切りに失敗したため録音を止めた（logger.exception）
          4. マイクの入力を開く（_on_frames は音を待ち行列へ積む）
             - 例外の場合、区切りのスレッドを flush せずに止め、音量を戻して MicrophoneUnavailableError を送出する
               - `[ERROR]` マイクを開けなかった（理由）
          5. `[INFO]` 連続録音を始めた（区切る無音の長さ・音量を下げたか）
        exceptions:
          - name: MicrophoneUnavailableError
            condition: マイクの入力を開けない
          - name: RuntimeError
            condition: 録音中（呼び出し順の誤り）
        unit_tests:
          - name: test_start_continuous
            case: 正常
            summary: 届いた音が区切りへ流れ、区間が on_segment へ渡る
            condition: 話し声の判定を「最初の 1 秒は 0.9、その後は 0.0」を返すものにし、min_silence_sec=0.5 で始めて入力へ 2 秒分の音を流す
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、lower_volume が呼ばれ、入力が開いたままである
          - name: test_start_continuous_when_microphone_unavailable
            case: 異常
            summary: マイクを開けなければ区切りのスレッドを止めて音量を戻す
            condition: lower_volume が 0.8 を返し、open_input が例外を送出する
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: MicrophoneUnavailableError が送出され、restore_volume に (0.8, fade_sec) が 1 回渡り、on_segment が呼ばれず、区切りのスレッドが残らない
            exception: マイクの入力を開けない
          - name: test_start_continuous_when_segmenter_failed
            case: 異常
            summary: 区切りに失敗したら入力を閉じて音量を戻し、on_failed に知らせる
            condition: 話し声の判定が 3 窓目で RuntimeError を送出する。lower_volume が 0.8 を返す。1 秒分の音を流す
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment・on_failed
            expected: on_failed に理由が 1 回渡り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡り、その後に入力へ流した音が待ち行列に貯まらず、続く start が通る
      - name: stop_continuous
        title: 連続録音の停止
        kind: メソッド
        scope: public
        summary: 入力を閉じて音量を戻し、待ち行列に残った音を区切り終えてから、区間に切り出していない話し声を最後の区間として渡す
        description: 戻るまでに、最後の区間を含む全ての区間を on_segment へ渡し終える（呼び出し元は、戻った後に終わりを区間の後ろへ並べられる）。
        returns:
          type: None
          description: なし
        process: |-
          1. 連続録音していなければ RuntimeError を送出する（区切りに失敗して自ら止めた後を含む）
          2. 入力を閉じて音量を戻す（_close）
          3. 待ち行列へ終わりの印を積み、区切りのスレッドの終わりを待つ（スレッドが残りの音を feed し、flush で最後の区間を渡す）
          4. 待ち行列とスレッドを手放す
             - `[INFO]` 連続録音を止めた
        exceptions:
          - name: RuntimeError
            condition: 連続録音していない（呼び出し順の誤り）
        unit_tests:
          - name: test_stop_continuous
            case: 正常
            summary: 話し声の途中で止めると、残りを最後の区間として渡してから戻る
            condition: 話し声の判定が常に 0.9 を返す。lower_volume が 0.8 を返す。1 秒分の音を流した直後に stop_continuous を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: stop_continuous が戻るまでに on_segment へ reason=flush の区間が 1 つ渡り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡り、続く start が通る
          - name: test_stop_continuous_when_no_speech
            case: 正常
            summary: 話し声が無ければ区間を渡さない
            condition: 話し声の判定が常に 0.0 を返す。2 秒分の音を流して止める
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment が呼ばれない
          - name: test_stop_continuous_when_not_recording
            case: 異常
            summary: 連続録音していなければ断る
            condition: start（連続でない録音）の後に stop_continuous を呼ぶ
            mock: lower_volume・restore_volume・open_input・get_settings・create_speech_detector・on_segment
            expected: RuntimeError が送出される
            exception: 連続録音していない（呼び出し順の誤り）
    refs:
      - dev/設計書/外部ライブラリ/numpy#
    status: implemented
  - name: Segmenter
    title: 区切り
    container: features/recording/segmenter.py
    usecase: 録音する
    role: サービス
    kind: クラス
    summary: 届いた音を 512 サンプルの窓に組み直し、窓ごとの話し声の確率から区間を切り出して、通し番号の順に渡す。録音は止めない
    description: |-
      窓をまたいで区切りの状態（話し声の始まり・無音の候補・前の区切り）と、前の区切り以降の音を持ち続けるためクラスにする。
      区切ったら区切りより前の音を手放し、持つ音は区間の最大の長さ程度に収める（連続録音の長さで増えない）。
      区切りの決め方は PoC #80 の Segmenter と同じ（faster-whisper の get_speech_timestamps と同じ閾値の決め方）。
      区切りのスレッドからだけ呼ぶ（並行で呼ばない）。
    properties:
      - name: _detect_speech
        type: SpeechProbabilityFn
        access: 内部 (_)
        description: 1 窓の話し声の確率を返す（StreamingVad）
      - name: _on_segment
        type: OnSegmentFn
        access: 内部 (_)
        description: 区切った区間の渡し先
      - name: _min_silence_samples
        type: int
        access: 内部 (_)
        description: 区切る無音の長さ（サンプル数。min_silence_sec × SAMPLE_RATE）
      - name: _audio
        type: numpy.ndarray
        access: 内部 (_)
        description: 前の区切り以降の音（int16）
      - name: _audio_start
        type: int
        access: 内部 (_)
        default: '0'
        description: _audio の先頭が録音の始めから何サンプル目か
      - name: _pending
        type: numpy.ndarray
        access: 内部 (_)
        description: 窓に満たない末尾の音（float32）
      - name: _position
        type: int
        access: 内部 (_)
        default: '0'
        description: 判定し終えたサンプル数
      - name: _triggered
        type: bool
        access: 内部 (_)
        default: 'False'
        description: 話し声の途中か
      - name: _speech_start
        type: int
        access: 内部 (_)
        default: '0'
        description: 今の区間の話し声の始まり
      - name: _temp_end
        type: int
        access: 内部 (_)
        default: '0'
        description: 続いている無音の始まり（無ければ 0）
      - name: _last_short_silence
        type: int
        access: 内部 (_)
        default: '0'
        description: 直近の短い無音の中ほど（最大の長さで区切るときの候補。無ければ 0）
      - name: _previous_cut
        type: int
        access: 内部 (_)
        default: '0'
        description: 前の区切りの位置
    methods:
      - name: feed
        title: 音を流す
        kind: メソッド
        scope: public
        summary: 届いた音（int16）を貯め、1 窓ずつ話し声の確率を求めて区切りの状態を進める
        args:
          - name: block
            type: numpy.ndarray
            required: true
            description: 入力から届いた音（形 (フレーム数, 1) か (フレーム数,)・int16。長さは揃わない）
        returns:
          type: None
          description: なし
        process: |-
          1. block を 1 次元にして _audio に足し、INT16_SCALE で割った float32 を _pending に足す
          2. _pending が VAD_WINDOW 以上ある間、先頭の 1 窓を取り出して話し声の確率を求め、_step で状態を進めて _position を VAD_WINDOW 進める
        unit_tests:
          - name: test_feed_cuts_at_silence
            case: 正常
            summary: 話し声の後の無音が区切る長さに達したら区切る
            condition: 確率を 1 秒分 0.9、続いて 2.5 秒分 0.0 にする。min_silence_sec=2.0。16 kHz の音を 1024 フレームずつ渡す
            mock: detect_speech・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、その長さが「話し声の前の余白 SEGMENT_PAD_SEC + 1 秒 + 話し声の後の余白 SEGMENT_PAD_SEC」に 1 窓の誤差で合う
          - name: test_feed_keeps_short_pause
            case: 正常
            summary: 区切る長さに届かない無音では区切らない
            condition: 確率を 0.9 を 1 秒、0.0 を 1 秒、0.9 を 1 秒にする。min_silence_sec=2.0
            mock: detect_speech・on_segment
            expected: on_segment が呼ばれない
          - name: test_feed_cuts_at_max_length
            case: 正常
            summary: 無音が来ないまま最大の長さに達したら、直近の短い無音の中で区切る
            condition: 確率を 0.9 にし、20 秒の位置だけ 0.2 を 0.2 秒挟んで MAX_SEGMENT_SEC を超えて流す
            mock: detect_speech・on_segment
            expected: on_segment に reason=max_length の区間が渡り、その終わりが 20 秒の無音の中にあり、長さが MAX_SEGMENT_SEC 以下
          - name: test_feed_cuts_at_max_length_without_pause
            case: 正常
            summary: 短い無音も無ければ最大の長さの位置で区切る
            condition: 確率を常に 0.9 にして MAX_SEGMENT_SEC + 1 秒流す
            mock: detect_speech・on_segment
            expected: on_segment に reason=max_length の区間が 1 つ渡り、長さが MAX_SEGMENT_SEC 以下
          - name: test_feed_ignores_silence_only
            case: 正常
            summary: 話し声を含まない間は区間にしない
            condition: 確率を常に 0.0 にして 10 秒流す
            mock: detect_speech・on_segment
            expected: on_segment が呼ばれない
          - name: test_feed_does_not_drop_samples
            case: 正常
            summary: 区間をつなぐと話し声が落ちていない
            condition: 話し声と区切る無音を 3 回繰り返し、音には位置が分かる連番の値を入れる。最後に flush
            mock: detect_speech・on_segment
            expected: 区間が 3 つ渡り、話し声の窓の値が全ていずれかの区間に含まれ、区間どうしが重ならない
      - name: flush
        title: 残りを区切る
        kind: メソッド
        scope: public
        summary: 話し声の途中なら、そこまでを最後の区間として渡す（話し終えて無音が区切る長さに届く前の完了を含む）
        returns:
          type: None
          description: なし
        process: |-
          1. 窓に満たない末尾の音も判定せずに区間に含める
          2. 話し声の途中なら、前の区切りから末尾までを reason=flush の区間として渡す
             - 話し声の途中でなければ何も渡さない
        unit_tests:
          - name: test_flush_when_speaking
            case: 正常
            summary: 話し声の途中なら最後の区間を渡す
            condition: 確率 0.9 を 1 秒と、窓に満たない 100 サンプルを流して flush
            mock: detect_speech・on_segment
            expected: on_segment に reason=flush の区間が 1 つ渡り、末尾の 100 サンプルを含む
          - name: test_flush_when_silent_after_speech
            case: 正常
            summary: 話し終えて区切る長さに届く前の無音で止めても、その文を区間にする
            condition: 確率 0.9 を 1 秒、0.0 を 1 秒流して flush（min_silence_sec=2.0）
            mock: detect_speech・on_segment
            expected: on_segment に reason=flush の区間が 1 つ渡る
          - name: test_flush_when_idle
            case: 正常
            summary: 話し声が残っていなければ何も渡さない
            condition: 区切った直後に flush
            mock: detect_speech・on_segment
            expected: flush では on_segment が呼ばれない
      - name: _step
        title: 状態を進める
        kind: メソッド
        scope: internal
        summary: 1 窓の確率で区切りの状態を進め、区切りが決まれば _emit する
        args:
          - name: probability
            type: float
            required: true
            description: 窓の話し声の確率
        returns:
          type: None
          description: なし
        process: |-
          1. 確率が SPEECH_THRESHOLD 以上なら、続いている無音の候補を取り消す。話し声の途中でなければ、ここを話し声の始まりにして終える
          2. 話し声の途中でなければ何もしない
          3. 話し声の始まりから MAX_SEGMENT_SEC に達したら、直近の短い無音の中ほど（無ければ今の位置）で reason=max_length で区切り、そこを次の話し声の始まりにして終える
          4. 確率が NEG_THRESHOLD 未満なら無音の候補として続いた長さを数える
             - SHORT_SILENCE_SEC 以上続いたら、その無音の中ほどを短い無音として控える
             - 区切る無音の長さ以上続いたら、無音の始まり + SEGMENT_PAD_SEC で reason=silence で区切り、話し声の途中でなくする
      - name: _emit
        title: 区間を渡す
        kind: メソッド
        scope: internal
        summary: 前の区切り（か話し声の始まり − SEGMENT_PAD_SEC の遅い方）から区切りまでの音を Segment にして on_segment へ渡し、区切りより前の音を手放す
        args:
          - name: cut
            type: int
            required: true
            description: 区切る位置（録音の始めからのサンプル数）
          - name: reason
            type: Literal["silence", "max_length", "flush"]
            required: true
            description: 区切った理由
        returns:
          type: None
          description: なし
        process: |-
          1. 区間の始まりを「前の区切り」と「話し声の始まり − SEGMENT_PAD_SEC」の遅い方にし、_audio から始まりから cut までを切り出して Recording（16 kHz）にする
          2. Segment（recording・reason）を on_segment へ渡す
          3. cut を前の区切りにし、_audio から cut より前を捨てる
             - `[INFO]` 区間を区切った（理由・長さ）
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[区間の最大の長さ]
      - dev/設計書/外部ライブラリ/numpy#
    status: planned
    introduced:
      pr: 78
functions:
  - name: open_input
    title: マイクの入力を開く
    kind: 関数
    container: features/recording/client.py
    usecase: 録音する
    scope: public
    inherits: OpenInputFn
    summary: 既定の入力デバイスを 16 kHz・モノラル・int16 のコールバックのストリームで開いて始める
    args:
      - name: on_frames
        type: Callable[[numpy.ndarray], None]
        required: true
        passing: positional
        description: 届いた音（形 (フレーム数, 1)）を受け取る
    returns:
      type: sounddevice.InputStream
      description: 始めた入力
    process: |-
      1. sounddevice の InputStream を samplerate=SAMPLE_RATE・channels=1・dtype=int16 で作り、コールバックで届いた音の写しを on_frames へ渡す
         - コールバックに状態（オーバーフロー等）が付いていれば `[WARNING]` 入力の状態（状態）
      2. start して返す
         - 作る・始めるときの例外（PortAudioError 等）はそのまま上げる（Recorder が MicrophoneUnavailableError に変える）
    unit_tests:
      - name: test_open_input
        case: 正常
        summary: 決めた形式で開いて始め、届いた音を渡す
        condition: InputStream の Mock のコールバックへ 160 フレームの音を渡す
        mock: sounddevice.InputStream
        expected: samplerate=16000・channels=1・dtype='int16' で作られて start が呼ばれ、on_frames に同じ値の写しが渡る
    refs:
      - dev/設計書/外部ライブラリ/sounddevice#
    status: implemented
constants:
  - name: SAMPLE_RATE
    title: 録音のサンプルレート
    container: features/recording/client.py
    usecase: 録音する
    summary: マイクの入力のサンプルレート（Hz）。刷新前と同じ値で、文字起こしと履歴が受ける形
    value: '16000'
    status: implemented
  - name: VAD_WINDOW
    title: 判定の窓のサンプル数
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声の判定に 1 回で渡すサンプル数（16 kHz で 32 ms。Silero VAD が受ける窓の大きさ）
    value: '512'
    status: planned
    introduced:
      pr: 78
  - name: SPEECH_THRESHOLD
    title: 話し声の閾値
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声と判定する確率（faster-whisper の VadOptions の既定と同じ）
    value: '0.5'
    status: planned
    introduced:
      pr: 78
  - name: NEG_THRESHOLD
    title: 無音の閾値
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声の終わり（無音の候補）と判定する確率（SPEECH_THRESHOLD − 0.15。faster-whisper の既定の決め方と同じ）
    value: '0.35'
    status: planned
    introduced:
      pr: 78
  - name: SHORT_SILENCE_SEC
    title: 短い無音の長さ
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 最大の長さで区切るときに区切りの候補にする無音の長さ（秒。faster-whisper の get_speech_timestamps の最大の長さの区切りと同じ）
    value: '0.098'
    status: planned
    introduced:
      pr: 78
  - name: SEGMENT_PAD_SEC
    title: 区間の余白
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: '話し声の前後に残す余白（秒。言葉の頭と尾を切らないため。PoC #80 と同じ）'
    value: '0.3'
    status: planned
    introduced:
      pr: 78
  - name: MAX_SEGMENT_SEC
    title: 区間の最大の長さ
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 無音が来ないままこの長さ（秒）に達したら区切る。非機能要件の区間の最大の長さの決定値
    value: '30.0'
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[区間の最大の長さ]
    status: planned
    introduced:
      pr: 78
  - name: INT16_SCALE
    title: int16 を float にする除数
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 入力の int16 の音を話し声の判定が受ける -1.0〜1.0 の float32 にする除数
    value: '32768.0'
    status: planned
    introduced:
      pr: 78
  - name: SEGMENT_THREAD_NAME
    title: 区切りのスレッドの名前
    container: features/recording/service.py
    usecase: 録音する
    summary: 連続録音で、待ち行列の音を Segmenter へ流すスレッドの名前
    value: '"recording-segmenter"'
    status: planned
    introduced:
      pr: 78
test_files:
  - tests/unit/voice_paste/features/recording/test_service.py
  - tests/unit/voice_paste/features/recording/test_client.py
