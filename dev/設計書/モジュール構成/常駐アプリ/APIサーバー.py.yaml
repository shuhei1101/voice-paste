title: "常駐アプリ / APIサーバー"
lead: FastAPI の app を組み立て、127.0.0.1 での待ち受け・Host・Origin・トークンの守りと、例外の HTTP への変換を持つ。uvicorn を専用のスレッドで動かす。
directory: |-
  ```
  src/voice_paste/server/
  ├── app.py              # build_fastapi（route の集約・middleware・例外ハンドラ）
  ├── middleware.py       # RequestGuardMiddleware（Host・Origin・トークン。/web/ の下は Origin の許可リスト）
  ├── body_limit.py       # BodyLimitMiddleware（/web/transcriptions の本文の上限で 413）
  ├── web_page.py         # web_page_router（GET /web/・/web の移し）・mount_web_assets（/web/assets/）
  ├── web/                # 外の端末の画面（index.html・assets/app.ts と tsc が出す assets/app.js・assets/style.css）
  ├── error_handlers.py   # register_exception_handlers（RFC 9457）
  ├── token.py            # create_token・write_token_file（起動ごとのトークンを作り、待ち受けを始めてからファイルへ書く）
  └── runner.py           # ApiServerRunner（uvicorn をスレッドで動かし started を確かめる）
  ```
classes:
  - name: RequestGuardMiddleware
    title: 要求の守り
    container: server/middleware.py
    usecase: APIで録音を操作する
    role: middleware
    kind: クラス
    inherits: starlette.middleware.base.BaseHTTPMiddleware
    summary: 全ての要求で Host を確かめる。`/web/` の外は Origin・トークンを、`/web/` の下は Origin の許可リストを確かめ、当たらなければ 403・401 で断る
    properties:
      - name: _token
        type: SecretStr
        access: 内部 (_)
        description: 今回の起動のトークン
      - name: _port
        type: int
        access: 内部 (_)
        description: 待ち受けのポート
      - name: _allowed_web_origins
        type: frozenset[str]
        access: 内部 (_)
        description: '`/web/` の下に許す Origin（設定 api.allowed_web_origins。末尾の `/` を落として持つ）'
    methods:
      - name: dispatch
        title: 要求の確かめ
        kind: メソッド
        scope: public
        is_async: true
        summary: Origin・Host・Authorization の順に確かめて、通れば次へ渡す
        args:
          - name: request
            type: Request
            required: true
            passing: positional
            description: 要求
          - name: call_next
            type: Callable
            required: true
            passing: positional
            description: 次の処理
        returns:
          type: Response
          description: 断ったときは problem+json の応答
        process: |-
          1. Host が `127.0.0.1:{ポート}` か `localhost:{ポート}` でなければ 403 を返す
             - `[WARNING]` 断った要求（理由・Host・Origin。トークンは書かない）
          2. パスが `/web` か `/web/` で始まるかで分ける
             - `/web/` の下の場合
               - GET・HEAD で Origin が無いか、Origin が _allowed_web_origins にあれば次へ渡す（トークンは求めない）
               - それ以外のメソッドで Origin が _allowed_web_origins にあれば次へ渡す
               - どちらでもなければ 403 を返す
                 - `[WARNING]` 同上
             - それ以外の場合
               - Origin が付いていれば 403 を返す
                 - `[WARNING]` 同上
               - Authorization が `Bearer {トークン}` と定数時間で一致しなければ 401 を返す
                 - `[WARNING]` 同上
               - 次の処理へ渡す
        unit_tests:
          - name: test_dispatch
            case: 正常
            summary: 正しい要求は通す
            condition: Origin 無し、Host 127.0.0.1:{ポート}、正しいトークン
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_origin_present
            case: 正常
            summary: Origin 付きは 403
            condition: 'Origin: http://evil.example'
            mock: call_next
            expected: 403 が返り、call_next が呼ばれず、WARNING のログにトークンが含まれない
          - name: test_dispatch_when_host_mismatch
            case: 正常
            summary: ほかの Host は 403
            condition: 'Host: evil.example'
            mock: call_next
            expected: 403 が返る
          - name: test_dispatch_when_token_mismatch
            case: 正常
            summary: トークンが合わなければ 401
            condition: Authorization 無しと、違うトークン
            mock: call_next
            expected: どちらも 401 が返る
          - name: test_dispatch_when_web_get_without_origin
            case: 正常
            summary: /web/ の下の Origin の無い GET はトークン無しで通す
            condition: GET /web/、Host localhost:{ポート}、Origin と Authorization 無し
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_web_post_with_allowed_origin
            case: 正常
            summary: /web/ の下の許す Origin の POST を通す
            condition: POST /web/transcriptions、Origin https://voice.example.com（許可リストにある）、Authorization 無し
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_web_post_without_origin
            case: 異常
            summary: /web/ の下の Origin の無い POST・許さない Origin は 403
            condition: POST /web/transcriptions で Origin 無しと、GET /web/ で Origin http://evil.example
            mock: call_next
            expected: どちらも 403 が返り、call_next が呼ばれない
            exception: Origin が許可リストに無い
          - name: test_dispatch_when_sessions_with_allowed_origin
            case: 異常
            summary: /web/ の外は許す Origin でも 403
            condition: POST /sessions、Origin https://voice.example.com（許可リストにある）、正しいトークン
            mock: call_next
            expected: 403 が返る
            exception: Origin が付いている
    refs:
      - dev/設計書/外部ライブラリ/fastapi#
    status: implemented
  - name: ApiServerRunner
    title: API サーバーの起動
    container: server/runner.py
    usecase: 常駐アプリを起動する
    role: ランタイム
    kind: クラス
    summary: uvicorn.Server を専用のスレッドで動かし、待ち受けを始められたかを確かめる
    methods:
      - name: start
        title: 起動
        kind: メソッド
        scope: public
        summary: スレッドで serve() を始め、started が True になるかスレッドが終わるまで待つ
        args:
          - name: timeout_sec
            type: float
            required: true
            passing: positional
            description: 待つ上限
        returns:
          type: bool
          description: 待ち受けを始められたか。uvicorn は待ち受けに失敗しても例外を出さずスレッドを終えるため、戻り値で判断する
        process: |-
          1. スレッドで asyncio.run(server.serve()) を始める
          2. started が True になるか、スレッドが終わるか、timeout_sec が過ぎるまで待つ
             - started が False のままの場合、False を返す
               - `[ERROR]` API の待ち受けを始められなかった（ポート）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 空きポートなら待ち受けを始める
            condition: 127.0.0.1 の空きポート
            mock: なし（GET だけを返す小さな app）
            expected: True が返り、そのポートへの要求に応答が返る
          - name: test_start_when_port_in_use
            case: 正常
            summary: ポートが使われていれば False
            condition: 先に同じポートを開いておく
            mock: なし（127.0.0.1 の空きポート）
            expected: False が返り、ERROR のログが 1 行出る
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: should_exit を立ててスレッドの終わりを待つ
        returns:
          type: None
          description: なし
        process: |-
          1. スレッドが無ければ何もしない
          2. should_exit を立て、スレッドの終わりを待つ
             - `[INFO]` API の待ち受けを止めた（ポート）
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めるとポートが空く
            condition: start で True が返った後に stop を呼ぶ
            mock: なし（127.0.0.1 の空きポート）
            expected: スレッドが終わっており、同じポートを開き直せる
          - name: test_stop_when_not_started
            case: 正常
            summary: 始めていなければ何もしない
            condition: start を呼ばずに stop を呼ぶ
            mock: なし
            expected: 例外が出ない
    refs:
      - dev/設計書/外部ライブラリ/uvicorn#
    status: implemented
    description: |-
      app とポートを受けて `uvicorn.Server`（host は `127.0.0.1` 固定、アクセスログを出さない）を作る。
      待ち受けの成否を戻り値で返すのは、uvicorn が待ち受けに失敗しても例外を出さずスレッドを終えるため。
    properties:
      - name: _server
        type: uvicorn.Server
        access: 内部 (_)
        description: 127.0.0.1:{ポート} で待ち受ける uvicorn のサーバー
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: serve() を動かすスレッド。start の前は None
  - name: BodyLimitMiddleware
    title: 本文の上限
    container: server/body_limit.py
    usecase: ブラウザから音声を送信する
    role: middleware
    kind: クラス
    summary: '`POST /web/transcriptions` の本文が上限以上なら 413 で断る純粋な ASGI middleware'
    description: BaseHTTPMiddleware は本文を流しながら数えられないため、ASGI の `receive` を包む純粋な middleware にする。外部ライブラリではなく API サーバーに置く。
    properties:
      - name: _app
        type: ASGIApp
        access: 内部 (_)
        description: 次の ASGI アプリ
      - name: _limit
        type: int
        access: 内部 (_)
        default: WEB_BODY_LIMIT_BYTES
        description: 本文の上限（このバイト数以上を断る）
    methods:
      - name: __call__
        title: 要求の受け取り
        kind: メソッド
        scope: public
        is_async: true
        summary: 対象の要求の本文の大きさを確かめながら次へ渡す
        args:
          - name: scope
            type: Scope
            required: true
            passing: positional
            description: ASGI の scope
          - name: receive
            type: Receive
            required: true
            passing: positional
            description: ASGI の receive
          - name: send
            type: Send
            required: true
            passing: positional
            description: ASGI の send
        returns:
          type: None
          description: なし
        process: |-
          1. http の `POST /web/transcriptions` でなければそのまま次へ渡す
          2. Content-Length があり _limit 以上なら、本文を読まずに 413 の problem+json を返す
             - `[WARNING]` 本文が大きすぎるため断った（大きさ）
          3. receive を包む関数を次へ渡す。包む関数は `http.request` の body のバイト数を加算し、_limit 以上になったら RequestBodyTooLargeError を送出する（例外ハンドラが 413 にする。読みかけの SpooledTemporaryFile は Starlette が閉じる）
             - `[WARNING]` 同上
        exceptions:
          - name: RequestBodyTooLargeError
            condition: Content-Length の無い本文が読んでいる途中で上限に達した
        unit_tests:
          - name: test_call
            case: 正常
            summary: 上限未満は通す
            condition: _limit=1000、999 バイトの本文（Content-Length あり・chunked の 2 通り）
            mock: 次の ASGI アプリ（本文を最後まで読む）
            expected: 次のアプリが 999 バイトを受け取る
          - name: test_call_when_content_length_over
            case: 異常
            summary: Content-Length が上限以上なら読まずに 413
            condition: _limit=1000、Content-Length 1000
            mock: 次の ASGI アプリ
            expected: 413 の problem+json が返り、次のアプリが呼ばれない
            exception: Content-Length が上限以上
          - name: test_call_when_chunked_over
            case: 異常
            summary: chunked で上限に達したら送出する
            condition: _limit=1000、Content-Length 無しで 500 バイトを 2 回
            mock: 次の ASGI アプリ（本文を最後まで読む）
            expected: 2 回目の receive で RequestBodyTooLargeError が送出される
            exception: 読んでいる途中で上限に達した
          - name: test_call_when_other_path
            case: 正常
            summary: 対象外のパスは数えない
            condition: _limit=1000、POST /sessions に Content-Length 2000
            mock: 次の ASGI アプリ
            expected: 次のアプリが呼ばれる
    refs:
      - dev/設計書/インターフェース定義/常駐アプリ/音声を受け付ける.py#
      - dev/設計書/非機能要件/非機能要件#requirements[ブラウザの本文の上限]
    status: planned
functions:
  - name: build_fastapi
    title: app の組み立て
    kind: 関数
    container: server/app.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: セッションとブラウザの文字起こしの route・画面の配信・要求の守り・本文の上限・例外ハンドラを組み込んだ app を返す
    args:
      - name: session_api
        type: SessionApiDeps
        required: true
        passing: positional
        description: セッションの API の依存（app.state.session_api に置く）
      - name: token
        type: SecretStr
        required: true
        passing: positional
        description: 今回の起動のトークン
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: web_api
        type: WebApiDeps
        required: true
        passing: keyword
        description: ブラウザの API の依存（app.state.web_api に置く）
      - name: allowed_web_origins
        type: Sequence[str]
        required: true
        passing: keyword
        description: '`/web/` の下に許す Origin（設定 api.allowed_web_origins）'
    returns:
      type: FastAPI
      description: 組み立てた app
    status: implemented
    process: |-
      1. 自動で作られる文書のページ（docs・redoc・openapi.json）を持たない FastAPI を作る
      2. app.state.session_api にセッションの API の依存を置き、セッションの route（開始・停止・完了）を include_router で集める
      3. app.state.web_api にブラウザの API の依存を置き、ブラウザの文字起こしの route（受け付け・結果の取得）と画面の配信（web_page_router）を集め、画面の素材を組み込む（mount_web_assets）
      4. 例外ハンドラを登録する（register_exception_handlers）
      5. 本文の上限（BodyLimitMiddleware）を組み込む
      6. 要求の守り（RequestGuardMiddleware）にトークン・ポート・許す Origin を渡して組み込む（最後に追加するため、本文の上限より先に動き、断る要求の本文を読まない）
    unit_tests:
      - name: test_build_fastapi
        case: 正常
        summary: 守りを通った開始がセッション管理へ届く
        condition: TestClient（base_url は http://127.0.0.1:{ポート}）で正しいトークンと loopback の返送先を付けて POST /sessions
        mock: SessionManager（start がセッションを返す）・is_callback_allowed
        expected: 202 と session_id が返り、start が entry=api と返送先で 1 回呼ばれる
      - name: test_build_fastapi_when_docs_requested
        case: 正常
        summary: 文書のページを出さない
        condition: 正しいトークンで GET /docs と GET /openapi.json
        mock: SessionManager
        expected: どちらも 404
  - name: register_exception_handlers
    title: 例外ハンドラの登録
    kind: 関数
    container: server/error_handlers.py
    usecase: APIで録音を操作する
    scope: public
    summary: 共通の例外を RFC 9457 の application/problem+json へ変える。入力の検証の失敗（RequestValidationError）は既定の 422 でなく 400 にする
    args:
      - name: app
        type: FastAPI
        required: true
        passing: positional
        description: 登録先
    returns:
      type: None
      description: なし
    process: |-
      1. CallbackNotAllowedError・GlossaryPresetNotFoundError・RequestValidationError → 400、SessionNotFoundError・WebJobNotFoundError → 404、SessionBusyError・SessionConflictError → 409、RequestBodyTooLargeError → 413、AudioUnreadableError → 415、MicrophoneUnavailableError・WebQueueFullError → 503 を登録する
      2. Starlette の HTTPException（StaticFiles の 404 など）を、そのステータスの problem+json にする
      3. それ以外の AppError と例外は 500 にする
         - `[ERROR]` 想定していない例外（logger.exception）
    unit_tests:
      - name: test_register_exception_handlers_when_validation_error
        case: 正常
        summary: URI でない callback_url は 400
        condition: TestClient で callback_url="nope" を送信する
        mock: SessionManager
        expected: 400 と application/problem+json が返る
      - name: test_register_exception_handlers_when_busy
        case: 正常
        summary: SessionBusyError は 409
        condition: start が SessionBusyError を送出する
        mock: SessionManager
        expected: 409 が返る
      - name: test_register_exception_handlers_when_conflict
        case: 正常
        summary: SessionConflictError は 409
        condition: stop が SessionConflictError を送出する
        mock: SessionManager
        expected: 409 が返り、detail に断った理由が入る
      - name: test_register_exception_handlers_when_web_errors
        case: 正常
        summary: ブラウザの API の例外を対応するステータスにする
        condition: route が WebJobNotFoundError・RequestBodyTooLargeError・AudioUnreadableError・WebQueueFullError を送出する
        mock: WebJobQueue・probe_audio
        expected: 順に 404・413・415・503 と application/problem+json が返る
    status: implemented
  - name: write_token_file
    title: トークンのファイルの書き出し
    kind: 関数
    container: server/token.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 待ち受けを始めた後に、今回のトークンとポートをトークンのファイル（置き場所の token_file）へ書く
    args:
      - name: token_file
        type: Path
        required: true
        passing: positional
        description: トークンのファイル
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: token
        type: SecretStr
        required: true
        passing: positional
        description: create_token で作った今回の起動のトークン
    returns:
      type: None
      description: なし
    status: implemented
    process: |-
      1. `{"port": {ポート}, "token": "{トークン}"}` の JSON を、同じフォルダの一時ファイルに UTF-8 で書いてから token_file へ置き換える（読む側が書きかけを読まない）
         - `[INFO]` トークンのファイルを書いた（パス・ポート。トークンは書かない）
    unit_tests:
      - name: test_write_token_file
        case: 正常
        summary: トークンとポートを書く
        condition: 一時フォルダの token_file、ポート 47823、create_token で作ったトークン
        mock: なし（一時フォルダ）
        expected: token_file の JSON の port が 47823、token が渡したトークンの値と一致し、INFO のログにトークンが含まれない
      - name: test_write_token_file_when_exists
        case: 正常
        summary: 前の起動のファイルを置き換える
        condition: 別のトークンの token_file がある
        mock: なし（一時フォルダ）
        expected: token_file には今回のトークンだけがあり、一時ファイルが残らない
  - name: create_token
    title: トークンの作成
    kind: 関数
    container: server/token.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: secrets.token_urlsafe(TOKEN_BYTES) で起動ごとのトークンを作る。ファイルには書かない（待ち受けを始めてから write_token_file で書く）
    returns:
      type: SecretStr
      description: 作ったトークン
    unit_tests:
      - name: test_create_token
        case: 正常
        summary: 呼ぶたびに違うトークンになる
        condition: 2 回呼ぶ
        mock: なし
        expected: 2 つの値が違い、どちらも 43 文字以上
    status: implemented
  - name: serve_web_page
    title: 画面の配信
    kind: 関数
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    scope: public
    summary: '`GET /web/`。`server/web/index.html` を `Cache-Control: no-cache` で返す（web_page_router。`GET /web` は `/web/` への 307）'
    returns:
      type: FileResponse
      description: 画面の HTML
    process: '1. パッケージに同梱した `server/web/index.html` を `text/html; charset=utf-8`・`Cache-Control: no-cache` で返す'
    unit_tests:
      - name: test_serve_web_page
        case: 正常
        summary: 画面を返す
        condition: TestClient で GET /web/ と GET /web
        mock: なし
        expected: /web/ が 200・text/html・no-cache、/web が /web/ への 307
    status: planned
  - name: mount_web_assets
    title: 画面の素材の組み込み
    kind: 関数
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    scope: public
    summary: '`/web/assets/` に `server/web/assets/` を StaticFiles で組み込む'
    args:
      - name: app
        type: FastAPI
        required: true
        passing: positional
        description: 組み込み先
    returns:
      type: None
      description: なし
    process: 1. `/web/assets` に `StaticFiles(directory=server/web/assets)` を mount する（置き場所の外を指す `..` と無いファイルは StaticFiles が 404 にする）
    unit_tests:
      - name: test_mount_web_assets
        case: 正常
        summary: 素材を返し、置き場所の外は 404
        condition: GET /web/assets/app.js と GET /web/assets/..%2F..%2Fapp.py
        mock: なし
        expected: app.js は 200・text/javascript、置き場所の外は 404 の problem+json
    status: planned
