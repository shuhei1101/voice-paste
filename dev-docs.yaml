# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v0.0.0/schemas/dev-docs.schema.json
version: "3"
name: voice-input
worktrees: [".claude/worktrees/*"]
description: 録音・区切り・文字起こし・用語の補正をほかのシステムへ提供する音声入力のサービスの設計書と目次
github:
  repository: shuhei1101/voice-input
documents:
  - id: data
    title: データ
    paths: ["docs/data/**/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/data.schema.yaml
      ref: design-schemas/v8.3.0
    writable: true
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/architecture.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/nonfunctional.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/scenario.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/interface.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/module.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: screen
    title: 画面設計
    paths: ["docs/screen/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/screen.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: er
    title: ER 図
    paths: ["docs/er/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/er.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/config.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: api
    title: 外部API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/external_api.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/library.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/test_procedure.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/dev_command.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: layout
    title: フォルダ構成
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/glossary.schema.yaml
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths: ["docs/index.yaml", "docs/*/index.yaml"]
    schema:
      source: knowledge
      path: schemas/design/index.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      description: summary
  - id: files_root
    title: docs の直下の Markdown
    paths: ["docs/_root/files.yml"]
    exclude: ["*.yaml", README.md]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
    metadata:
      visibility: visibility
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: files_mock
    title: モックの Markdown
    paths: ["docs/mock/files.yml"]
    exclude: ["*.html", "*.js", "*.css"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_src
    title: 常駐アプリのコード
    paths: ["src/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_haas_server
    title: Haas の文字起こしのサーバーのコード
    paths: ["haas_server/src/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_tests
    title: テスト
    paths: ["tests/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
nav:
  tabs:
    - title: はじめに
      items:
        - page: files_guide/docs/guide/変更履歴.md
    - title: 使い方
      items:
        - page: files_guide/docs/guide/起動と設定.md
        - page: files_guide/docs/guide/録音して貼り付ける.md
        - page: files_guide/docs/guide/外の端末から文字に起こす.md
    - title: 設計書
      items:
        - group: アーキテクチャ図
          items:
            - auto: {document: architecture}
        - group: 非機能要件
          items:
            - auto: {document: nonfunctional}
        - group: シナリオ
          items:
            - auto: {document: scenario}
        - group: インターフェース定義
          items:
            - auto: {document: interface}
        - group: モジュール構成
          items:
            - auto: {document: module}
        - group: 画面設計
          items:
            - auto: {document: screen}
            - page: files_root/docs/design-policy.md
        - group: データ
          items:
            - auto: {document: data}
        - group: ER 図
          items:
            - auto: {document: er}
        - group: 設定
          items:
            - auto: {document: config}
        - group: 外部API
          items:
            - auto: {document: api}
        - group: 外部ライブラリ
          items:
            - auto: {document: library}
        - group: フォルダ構成
          items:
            - auto: {document: layout}
        - group: 開発コマンド
          items:
            - auto: {document: dev_command}
        - group: テスト実行方法
          items:
            - auto: {document: test_procedure}
    - title: コード
      items:
        - group: 常駐アプリ
          items:
            - auto: {document: files_src}
        - group: Haas の文字起こしのサーバー
          items:
            - auto: {document: files_haas_server}
        - group: テスト
          items:
            - auto: {document: files_tests}
    - title: リファレンス
      items:
        - page: files_guide/docs/guide/API.md
    - title: 用語集
      items:
        - auto: {document: glossary}
