許す Origin の設定:
  説明: 稼働中の常駐アプリが読む settings.toml の、`/web/` の下に許す Origin の一覧へ、ゲートウェイの公開のサブドメインを書き、常駐アプリを起動し直して読み込ませる
  タグ: [設定の書き換え, 再起動]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 外の端末のブラウザで開いた画面から送った要求が 403 にならず、`GET /web/transcriptions/{job_id}` が `state` を返す
  状態: "-"
ゲートウェイへの登録:
  説明: shuhdev-gateway の `~/.config/shuhdev-gateway/settings.toml` に、voice-paste のサブドメインを `127.0.0.1:47823` へ振り分ける固定の登録（`[[fixed_registrations]]`。name `voice-paste`・port `47823`・path `/web/`・`rewrite_origin = false`）を書き、ゲートウェイを再起動する。一時の登録（`gw add`）は常駐サービスを止めて約 30 秒で外れ、起動し直して足し直すと名前がずれて許す Origin と合わなくなるため使わない。切り戻しは追加した表を消してゲートウェイを再起動する
  タグ: [外部への公開, 設定の書き換え, 再起動]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: `gw ls` に voice-paste が固定の登録として `47823` 向きで出て、Cloudflare Access を通した外の端末から `/web/` が画面を返す。常駐サービスを起動し直した後も同じ公開 URL で画面が返る
  状態: "-"
