  - name: setup_logging
    title: ログの設定
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 標準の logging を日付ごとのファイルへ書くようにし、uvicorn のロガーもそこへ寄せる
    side_effects: ルートロガーと uvicorn のロガーのハンドラを入れ替える。log_dir が無ければ作る。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        required: true
        passing: positional
        description: ルートロガーのレベル
    returns:
      type: None
      description: なし
    process: |-
      1. log_dir を作る
      2. ルートロガーに既にこの関数が付けたハンドラがあれば外す（2 回呼んでも 1 組だけにする）
      3. 日付ごとのファイルのハンドラ（_DailyFileHandler）を付ける。書くたびにモジュールの `_today()`（今日の `date` を返す内部の関数。単体テストが差し替える）を呼び、`{log_dir}/{YYYY-MM-DD}.log` が変わっていれば開き直す
      4. 書式は 1 行 1 JSON（JSON Lines）で、ts（ローカルの時刻を UTC オフセット付きの ISO 8601）・level・name・msg・例外があれば exc を持つ（ensure_ascii=False）
      5. sys.stderr があれば同じ書式で stderr にも出す（pythonw では無い）
      6. ルートロガーのレベルを level にする
      7. uvicorn・uvicorn.error・uvicorn.access のロガーのハンドラを外し、propagate を True にする
    unit_tests:
      - name: test_setup_logging
        case: 正常
        summary: 今日のファイルに JSON Lines で書く
        condition: level=INFO、日本語の INFO と DEBUG を 1 行ずつ出す
        mock: なし（一時フォルダ）
        expected: '{log_dir}/{今日}.log に INFO の 1 行だけがあり、JSON として読めて msg が日本語のまま、ts に UTC オフセットが付く'
      - name: test_setup_logging_when_called_twice
        case: 正常
        summary: 2 回呼んでも二重に書かない
        condition: setup_logging を 2 回呼んでから 1 行出す
        mock: なし（一時フォルダ）
        expected: ファイルに 1 行だけ
      - name: test_setup_logging_when_date_changed
        case: 正常
        summary: 日付が変われば次のファイルへ書く
        condition: 1 行出した後に今日を翌日へ差し替えて 1 行出す
        mock: 今日の日付を返す関数（monkeypatch）
        expected: 2 つの日付のファイルに 1 行ずつ
      - name: test_setup_logging_when_uvicorn_logger
        case: 正常
        summary: uvicorn のログも同じファイルへ寄せる
        condition: uvicorn.error のロガーにハンドラを 1 つ付けておき、setup_logging の後に uvicorn.error へ INFO を 1 行出す
        mock: なし（一時フォルダ）
        expected: uvicorn.error のハンドラが空になり、今日のファイルに name が uvicorn.error の 1 行がある
    notes:
      秘密の値: トークンはログに出さない（断った要求のログにも含めない）。
    status: implemented
