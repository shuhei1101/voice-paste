summary: "常駐アプリの API と、呼び出し元への返送"
docs_index: true
items:
  - page: 録音を開始する.py.yaml
    summary: POST /sessions。画面を出さない録音を始めてセッションの ID を返す
  - page: 録音を停止する.py.yaml
    summary: POST /sessions/{session_id}/stop。録音を止めて完了を待つ
  - page: 録音を完了する.py.yaml
    summary: POST /sessions/{session_id}/complete。録音を確定して文字起こしを始める
  - page: 呼び出し元へ返す.py.yaml
    summary: API から始めた録音の結果を、開始で指定された返送先へ送る
