id: MOD-30
visibility: internal
title: 常駐アプリ / ホットキーと画面 / controller.py
test_files:
  - tests/unit/voice_paste/ui/test_controller.py
data_models:
  - name: UiDeps
    title: 画面の依存
    container: ui/controller.py
    usecase: 共通
    role: DTO
    summary: 画面・トレイが呼ぶ配線済みの関数。ui は features を import せず、main.py がこの束を引き渡す
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: start
        type: Callable[[], None]
        description: トレイからの録音の開始（entry=tray を部分適用した start_local_session）
      - name: pause
        type: Callable[[], None]
        description: SessionManager.pause
      - name: resume
        type: Callable[[], None]
        description: SessionManager.resume
      - name: complete
        type: Callable[[str, str | None], None]
        description: 固定の出力先の ID かカスタムプリセットのどちらかで確定する（SessionManager.complete を output_id・preset で呼ぶ）
      - name: cancel
        type: Callable[[], None]
        description: SessionManager.cancel
      - name: current_session
        type: Callable[[], Session | None]
        description: SessionManager.current
      - name: level
        type: Callable[[], float]
        description: 録音中の音量（0.0〜1.0。Recorder.level）
      - name: get_settings
        type: Callable[[], Settings]
        description: 最新の設定（SettingsStore.latest。録音セッションが固定した設定ではなく、設定画面に出す値）
      - name: save_settings
        type: Callable[[Settings, Mapping[Path, Sequence[GlossaryEntry]]], bool]
        description: 設定と、行を変えた用語集の CSV（場所 → 行）を書き込んで有効にし、再起動が要る項目が変わったかを返却する（apply_settings）
      - name: reset_settings
        type: Callable[[], tuple[Settings, bool]]
        description: 環境の値を空にして読み込み直した設定を有効にし、その設定と再起動が要る項目が変わったかを返却する（reset_applied_settings）
      - name: default_settings
        type: Callable[[], Settings]
        description: 既定の設定（load_default_settings）。設定画面の入力エラーの数値の例に使用する
      - name: settings_dir
        type: Path
        description: settings.yaml のあるフォルダ
      - name: log_dir
        type: Path
        description: ログのフォルダ
      - name: request_restart
        type: Callable[[], None]
        description: 終わった後に起動し直すようにしてイベントループを抜ける
      - name: request_quit
        type: Callable[[], None]
        description: イベントループを抜ける（QApplication.quit）
      - name: set_hotkey_capturing
        type: Callable[[bool], None]
        description: 設定画面のホットキーの欄が入力待ちに入る（True）・出る（False）ことを伝える（HotkeyListener.set_suspended か GnomeShortcutListener.set_suspended）。入力待ちの間に押したキーで録音・確定・一時停止・取り消し・ショートカットが動かないようにする
      - name: reload_hotkeys
        type: Callable[[], None]
        description: 最新の設定でホットキーの受付を張り直す（SettingsStore.latest で build_hotkey_bindings → HotkeyListener.start か GnomeShortcutListener.start）。設定画面の保存・既定に戻すの後に呼ぶ
      - name: output_titles
        type: Mapping[str, str]
        description: 画面に出す出力先の名前（出力先の ID → OUTPUTS の title。API 専用の出力先を除く）。設定画面の欄と録音の画面のボタンが取得する
      - name: apply_theme
        type: Callable[[], None]
        description: 今の設定の ui.theme で画面の明暗を当て直す（配線で apply_theme に QApplication と SettingsStore.get の ui.theme を引き渡したもの）
      - name: list_glossaries
        type: Callable[[], list[GlossarySettings]]
        description: 今の設定の用語集の一覧（path は絶対パス。glossaries が空なら今までの用語集の 1 件。resolve_glossaries）
      - name: read_glossary
        type: Callable[[Path], list[GlossaryEntry]]
        description: 用語集の CSV の行を、オン・オフと片方が空の行も含めて読み込む（read_glossary_rows）。読み込めなければ GlossaryReadError を送出する
      - name: new_glossary_path
        type: Callable[[Collection[Path]], Path]
        description: 追加する用語集の CSV の場所を、一覧にある場所と重ならないように決める（フォルダを部分適用した next_glossary_path）
      - name: copy
        type: Callable[[str], None]
        description: クリップボードへ書き込む（copy_to_clipboard。書き込めなければ DeliveryError）。コピーの完了の通知を押したときにもう一度コピーする
      - name: switch_output
        type: Callable[[str], None]
        description: 文字起こし中に届ける出力先を差し替える（SessionManager.switch_output）。文字起こし中の表示の切り替えのボタンが呼ぶ
      - name: list_glossary_presets
        type: Callable[[], list[GlossaryPresetSettings]]
        description: 今の設定の用語集のプリセットの一覧（glossary_presets が空なら「既定」の 1 件。一覧に無い用語集の名前は除外する。resolve_glossary_presets）
      - name: hidden_setting_keys
        type: frozenset[str]
        description: 設定画面で出さない設定のキー（hidden_setting_keys(unavailable_features(CURRENT_OS))）。Linux では録音中の音量のキーと api.allowed_web_origins
      - name: reports_progress
        type: bool
        description: 動いているエンジンが区間ごとの進みを通知するか（local_whisper は True、openai・haas は False。haas から切り戻した起動は local_whisper として True）。engine の反映は再起動のため、保存した設定ではなく起動の配線で決めた値を持つ
    status: implemented
classes:
  - name: UiController
    title: 画面の振り分け
    container: ui/controller.py
    usecase: 共通
    role: ランタイム
    summary: UiBridge の通知を受けて、トレイ・録音の画面・文字起こし中の表示・ダイアログを開く・閉じる・替える。処理中に選ばれた再起動・終了を待たせる
    description: |-
      画面とトレイを長く持つためクラスにする。全てのメソッドはメインスレッドで呼ぶ。
      録音セッションの状態と画面の対応:

      | 今の録音セッション | トレイ | 録音の画面 | 文字起こし中の表示 |
      | --- | --- | --- | --- |
      | 無い | 待機中（押せない項目を戻す） | 閉じる | 閉じる |
      | recording・paused（hotkey・tray） | 録音中・処理中 | `recording.hide_window` がオフなら出して状態を替える | 閉じる |
      | transcribing・delivering（hotkey・tray） | 文字起こし中・処理中 | 閉じる | `recording.hide_window` がオフなら出す |
      | api の録音セッション | 録音中か文字起こし中・処理中 | 出さない | 出さない |

      録音の画面をその回だけ隠した間（`_recording_hidden`）は、recording・paused の通知を受けても窓を出さず、状態の表示だけを替える（RecordingWindow.set_paused）。録音セッションが recording・paused を抜けたら隠したフラグを下ろす。
      トレイの「録音の画面を表示」は、今の録音セッションと隠したフラグから RecordingWindowState を決めて Tray.set_recording_window で替える（hotkey・tray の recording・paused で隠していれば hidden、出していれば shown、`recording.hide_window` がオンか api の録音なら no_window、それ以外は not_recording）。
      コンストラクタは UiDeps と、キーワードで tray・recording_window・indicator を受け、トレイの操作と録音の画面の「隠す」（Signal）をつなぐ（Tray.settings_requested → open_settings()、settings_glossary_requested → open_settings(group="用語集")、settings_shortcuts_requested → open_settings(group="ショートカット", add_shortcut_row=True)）。文字起こし中の表示の切り替えのボタン（TranscribingIndicator.output_selected）は UiDeps.switch_output へつなぐ。あわせて QApplication に自分をイベントフィルタとして入れ、アプリの終了で設定画面を確認せずに閉じる（eventFilter）。
    kind: クラス
    inherits: PySide6.QtCore.QObject
    properties:
      - name: _deps
        type: UiDeps
        access: 内部 (_)
        description: 配線済みの関数
      - name: _tray
        type: Tray
        access: 内部 (_)
        description: トレイ
      - name: _recording_window
        type: RecordingWindow
        access: 内部 (_)
        description: 録音の画面
      - name: _indicator
        type: TranscribingIndicator
        access: 内部 (_)
        description: 文字起こし中の表示
      - name: _settings_window
        type: SettingsWindow | None
        access: 内部 (_)
        description: 開いている設定画面
      - name: _pending_exit
        type: Literal["restart", "quit"] | None
        access: 内部 (_)
        description: 処理中に選ばれ、待機中になったら行う再起動・終了
      - name: _recording_hidden
        type: bool
        access: 内部 (_)
        description: その回の録音の画面を「隠す」で隠しているか
    methods:
      - name: on_notified
        title: 知らせの受け取り
        summary: UiBridge.notified のスロット。通知の種類ごとに画面とトレイを変える
        kind: メソッド
        scope: public
        args:
          - name: event
            type: str
            required: true
            passing: positional
            description: 通知の種類
          - name: detail
            type: str | None
            required: true
            passing: positional
            description: 理由
        returns:
          type: None
          description: なし
        process: |-
          1. state_changed の場合、今の録音セッションを引き（current_session）、説明の表のとおりにトレイ・録音の画面・文字起こし中の表示を変える
             - 録音セッションが無く、待たせた再起動・終了がある場合、それを行う（request_restart か request_quit）
             - 録音の画面を隠している場合、窓は出さずに状態の表示だけを替える（RecordingWindow.set_paused）
             - transcribing・delivering で文字起こし中の表示を出す場合、その回に録音の画面を動かしていれば動かした位置（RecordingWindow.moved_position）を引き渡す。動かしていなければ引き渡さず、設定の位置に出す。あわせて録音セッションの output_id と、カスタムプリセットで確定したならそのタイトル（output_preset.title）を引き渡す（TranscribingIndicator.open。文字起こし中の表示が既に出ている delivering の通知では開き直さない）
             - 最後に、トレイの「録音の画面を表示」を今の状態に合わせる（Tray.set_recording_window）
          2. output_changed の場合、文字起こし中の表示の今の出力先を detail（切り替えた先の出力先の ID）に替える（TranscribingIndicator.set_output）
          3. busy の場合、処理中のダイアログを出す（show_busy_dialog）
          4. show_recording_window の場合、隠した録音の画面を戻す（show_recording）
          5. microphone_unavailable・transcription_failed・delivery_failed・api_unavailable の場合、トレイの通知を出す（Tray.show_failure）
             - それ以外の種類の場合、何もしない
               - `[WARNING]` 知らない通知を受けた（種類）
        unit_tests:
          - name: test_on_notified_when_recording
            case: 正常
            summary: ホットキーの録音で録音の画面を表示する
            condition: current_session が hotkey・recording を返却する。hide_window はオフ
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: Tray.set_state(RECORDING, busy=True)・RecordingWindow.open・TranscribingIndicator.close が呼ばれる
          - name: test_on_notified_when_hidden_window
            case: 正常
            summary: 画面を出さない設定では録音の画面を出さない
            condition: current_session が hotkey・recording、recording.hide_window がオン
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: Tray.set_state(RECORDING, busy=True) が呼ばれ、RecordingWindow.open が呼ばれない
          - name: test_on_notified_when_api_session
            case: 正常
            summary: API の録音では画面を出さない
            condition: current_session が api・transcribing を返却する
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: Tray.set_state(TRANSCRIBING, busy=True) が呼ばれ、TranscribingIndicator.open が呼ばれない
          - name: test_on_notified_when_idle_with_pending_quit
            case: 正常
            summary: 待たせた終了を待機中で行う
            condition: 処理中に request_exit("quit") を呼んだ後、current_session が None で state_changed を受ける
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: request_quit が 1 回呼ばれる
          - name: test_on_notified_when_busy
            case: 正常
            summary: 処理中のダイアログを出す
            condition: event=busy
            mock: show_busy_dialog・Tray
            expected: show_busy_dialog が 1 回呼ばれる
          - name: test_on_notified_when_failure
            case: 正常
            summary: 失敗をトレイの通知で通知する
            condition: event=delivery_failed、detail="クリップボードに書き込めない"
            mock: Tray
            expected: Tray.show_failure(delivery_failed, クリップボードに書き込めない) が呼ばれる
          - name: test_on_notified_when_recording_hidden
            case: 正常
            summary: 隠した録音の画面は、一時停止しても出さずに状態だけ替える
            condition: hide_recording の後、current_session が hotkey・paused を返却する state_changed を受ける
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: RecordingWindow.set_paused(True) が呼ばれ、RecordingWindow.open・restore が呼ばれず、Tray.set_recording_window(hidden) が呼ばれる
          - name: test_on_notified_when_transcribing_after_hidden
            case: 正常
            summary: 動かして隠したまま確定した回も、文字起こし中の表示を動かした位置に出す
            condition: hide_recording の後、current_session が hotkey・transcribing を返却する state_changed を受ける。RecordingWindow.moved_position が QPoint(300, 200) を返却する
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: TranscribingIndicator.open(at=QPoint(300, 200)) が呼ばれ、Tray.set_recording_window(not_recording) が呼ばれる
          - name: test_on_notified_when_show_recording_window
            case: 正常
            summary: ホットキーからの指示で隠した録音の画面を戻す
            condition: hide_recording の後、event=show_recording_window
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: RecordingWindow.restore が 1 回呼ばれ、Tray.set_recording_window(shown) が呼ばれる
          - name: test_on_notified_when_transcribing_without_move
            case: 正常
            summary: 動かしていない回は、文字起こし中の表示を設定の位置に出す
            condition: current_session が hotkey・recording を返却する state_changed の後、hotkey・transcribing を返却する state_changed を受ける。RecordingWindow.moved_position が None を返却する
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: TranscribingIndicator.open(at=None) が呼ばれる
          - name: test_on_notified_when_output_changed
            case: 正常
            summary: 出力先の差し替えを文字起こし中の表示へ引き渡す
            condition: current_session が hotkey・transcribing を返却する state_changed の後、event=output_changed、detail="copy_only"
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: TranscribingIndicator.set_output("copy_only") が呼ばれ、TranscribingIndicator.open は state_changed の 1 回だけ
          - name: test_on_notified_when_transcribing_with_output
            case: 正常
            summary: 文字起こし中の表示へ確定した出力先・プリセットを引き渡して開く
            condition: current_session が output_id=paste_and_send の hotkey・transcribing を返却する state_changed と、output_preset=BrowserPreset(title="ChatGPT", url="https://chatgpt.com") の hotkey・transcribing を返却する state_changed を別々に受ける
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: TranscribingIndicator.open に output_id="paste_and_send"・preset_title=None と、output_id=None・preset_title="ChatGPT" が渡る
          - name: test_on_notified_when_output_selected
            case: 正常
            summary: 文字起こし中の表示で選んだ出力先を差し替えへ引き渡す
            condition: UiController を作った後、TranscribingIndicator.output_selected に "paste_only" を emit する
            mock: UiDeps の全関数・Tray・RecordingWindow
            expected: UiDeps.switch_output("paste_only") が 1 回呼ばれる
      - name: on_progressed
        title: 進みの受け取り
        summary: UiBridge.progressed のスロット。文字起こし中の表示が出ていれば進みを引き渡す
        kind: メソッド
        scope: public
        args:
          - name: position_sec
            type: float
            required: true
            passing: positional
            description: 起こし終えた区間の終わりの時刻
          - name: duration_sec
            type: float
            required: true
            passing: positional
            description: 録音の長さ
        returns:
          type: None
          description: なし
      - name: request_exit
        title: 再起動・終了の依頼
        summary: トレイ・設定画面からの再起動・終了。待機中ならすぐ行い、処理中ならアイコンを非表示にしてその回が終わるまで待つ
        kind: メソッド
        scope: public
        args:
          - name: kind
            type: Literal["restart", "quit"]
            required: true
            passing: positional
            description: 再起動か終了か
        returns:
          type: None
          description: なし
        process: |-
          1. 今の録音セッションが無ければ、すぐに request_restart か request_quit を呼ぶ
          2. あれば待たせる依頼に記録し、トレイのアイコンを非表示にする（Tray.hide）
             - `[INFO]` 処理中のため再起動・終了を待たせた（種類・録音セッションの ID）
        unit_tests:
          - name: test_request_exit_when_idle
            case: 正常
            summary: 待機中ならすぐ再起動する
            condition: current_session が None、kind=restart
            mock: UiDeps の全関数・Tray
            expected: request_restart が 1 回呼ばれ、Tray.hide が呼ばれない
          - name: test_request_exit_when_busy
            case: 正常
            summary: 処理中はアイコンを非表示にして待たせる
            condition: current_session が hotkey・transcribing、kind=quit
            mock: UiDeps の全関数・Tray
            expected: Tray.hide が呼ばれ、request_quit が呼ばれない
      - name: open_settings
        title: 設定画面を開く
        summary: 設定画面を開く。開いていれば新しい窓を作らずに最小化を戻して最前面に出し、フォーカスを移す。まとまりを指定すればそのまとまりへ切り替え、add_shortcut_row なら行を 1 つ追加する（SettingsWindow.show_group）。ホットキーの受付は止めない（入力待ちの欄のキーだけ SettingsWindow.hotkey_capturing → UiDeps.set_hotkey_capturing で伝えない）。設定画面が閉じたら（保存して再起動・今すぐ再起動・取り消し・窓の閉じるのどの経路でも）on_settings_closed を呼ぶ
        kind: メソッド
        scope: public
        args:
          - name: group
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 選ぶまとまりの名前（GROUP_NAMES の値）。None は新しく開くときは出力先、開いているときはまとまりを変えない
          - name: add_shortcut_row
            type: bool
            required: false
            default: 'False'
            passing: keyword
            description: ショートカットの一覧に行を 1 つ追加するか（トレイの「ショートカットの設定…」）
        process: |-
          1. 設定画面が開いている場合、`setWindowState` で最小化を除き、`showNormal`・`raise_`・`activateWindow` で最前面に出す
             - group が None でなければ SettingsWindow.show_group(group, add_shortcut_row=add_shortcut_row) を呼ぶ
          2. 開いていない場合、SettingsWindow を作って saved・restart_requested・closed・hotkey_capturing をつなぎ、show_group(group か 出力先, add_shortcut_row=add_shortcut_row) の後に表示して前面に出す
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_open_settings
            case: 正常
            summary: 開いてもホットキーの受付を止めない
            condition: open_settings を呼び、設定画面のホットキーの欄を入力待ちにしてから出し、取り消しで閉じる
            mock: UiDeps の全関数
            expected: set_hotkey_capturing が True・False の順に 1 回ずつ呼ばれ、reload_hotkeys は呼ばれない
          - name: test_open_settings_with_group
            case: 正常
            summary: まとまりを指定して開き、ショートカットの行を追加する
            condition: open_settings(group="ショートカット", add_shortcut_row=True)
            mock: UiDeps の全関数
            expected: 設定画面が「ショートカット」のまとまりを選び、ショートカットの一覧に行が 1 つある
          - name: test_open_settings_when_minimized
            case: 正常
            summary: 最小化した設定画面を戻し、まとまりを切り替える
            condition: open_settings で開いて showMinimized した後に open_settings(group="用語集")
            mock: UiDeps の全関数
            expected: SettingsWindow が 1 つだけで、windowState に WindowMinimized が無く、「用語集」のまとまりを選んでいる
          - name: test_open_settings_when_already_open
            case: 正常
            summary: 開いていれば前面に出すだけ
            condition: 「表記のヒント」のまとまりを選んだ設定画面で open_settings() をもう一度呼ぶ
            mock: UiDeps の全関数
            expected: SettingsWindow が 1 つだけで、「表記のヒント」のまとまりのまま
          - name: test_open_settings_when_reopened
            case: 正常
            summary: 開き閉めを繰り返しても窓が重ならない
            condition: open_settings を呼んで設定画面を取り消しで閉じるのを 5 回繰り返し、毎回 deleteLater の破棄を実行して gc.collect する
            mock: UiDeps の全関数
            expected: 毎回新しい SettingsWindow が開き、5 回目を閉じた後の QApplication.topLevelWidgets の数が開く前と同じで、SettingsWindow が 1 つも残らない
      - name: on_settings_saved
        title: 保存した設定の反映
        summary: 設定画面が保存した後（既定に戻した後も）、最新の設定でホットキーの受付を張り直し（UiDeps.reload_hotkeys。HotkeyError はログに書き込んで続ける）、画面の明暗を当て直し（UiDeps.apply_theme）、録音の画面の出し方とトレイのホットキーの表示を新しい設定に合わせる
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_on_settings_saved
            case: 正常
            summary: 保存したら明暗を当て直す
            condition: UiDeps の get_settings が ui.theme=dark の設定を返却する
            mock: UiDeps.apply_theme・Tray
            expected: UiDeps.reload_hotkeys と UiDeps.apply_theme が 1 回ずつ呼ばれ、Tray.set_start_hotkey に設定の hotkeys.start が渡る
      - name: on_settings_closed
        title: 設定画面が閉じた
        summary: 設定画面を手放して破棄する。入力待ちのまま閉じたときに備え、UiDeps.set_hotkey_capturing(False) を呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. UiDeps.set_hotkey_capturing(False) を呼ぶ
          2. 設定画面を手放し、deleteLater で破棄する（中のコンボボックスのポップアップの窓も一緒に消える）
             - 欄のシグナルに SettingsWindow のメソッドをつないでいるため、参照を手放しただけでは GC で消えず、トップレベルの窓が開くたびに積もる
      - name: on_glossary_preset_switched
        title: 用語集のプリセットを切り替えた
        summary: UiBridge.glossary_preset_switched のスロット。トレイに切り替えの通知を出す（Tray.show_glossary_preset_switched）。設定画面が開いていても、画面の「補正に使うプリセット」の選択は変えない
        kind: メソッド
        scope: public
        args:
          - name: name
            type: str
            required: true
            passing: positional
            description: 切り替えた用語集のプリセットの名前
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_on_glossary_preset_switched
            case: 正常
            summary: トレイに切り替えの通知を出す
            condition: name="会議"
            mock: UiDeps の全関数・Tray
            expected: Tray.show_glossary_preset_switched("会議") が 1 回呼ばれる
        status: planned
        introduced:
          pr: 291
      - name: hide_recording
        title: 録音の画面を隠す
        summary: RecordingWindow.hide_requested のスロット。その回の録音の画面を隠し、トレイの「録音の画面を表示」を押せるようにする
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. 録音の画面が出ていない場合、何もしない
          2. 窓を隠し（RecordingWindow.hide_window）、隠したフラグを作成する
          3. トレイを hidden にする（Tray.set_recording_window）
        unit_tests:
          - name: test_hide_recording
            case: 正常
            summary: 録音の画面を隠してトレイの項目を押せるようにする
            condition: current_session が hotkey・recording を返却する state_changed で画面を出した後、hide_recording を呼ぶ
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: RecordingWindow.hide_window が 1 回呼ばれ、Tray.set_recording_window(hidden) が呼ばれる
        status: implemented
      - name: show_recording
        title: 隠した録音の画面を戻す
        summary: トレイの「録音の画面を表示」・アイコンの左クリック（Tray.show_window_requested）と、録音開始のホットキー（show_recording_window の通知）から呼ぶ。隠した録音の画面を、隠す前の位置にフォーカスを取らずに戻す
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. 録音の画面を隠していない場合、何もしない（画面を出さない設定の録音・API の録音・すでに出ている画面を含む）
          2. 隠したフラグを下ろし、窓を戻す（RecordingWindow.restore）
          3. トレイを shown にする（Tray.set_recording_window）
        unit_tests:
          - name: test_show_recording_when_not_hidden
            case: 正常
            summary: 隠していなければ何もしない
            condition: current_session が hotkey・recording を返却する state_changed で画面を出した後、show_recording を呼ぶ
            mock: UiDeps の全関数・Tray・RecordingWindow・TranscribingIndicator
            expected: RecordingWindow.restore が呼ばれない
        status: implemented
      - name: eventFilter
        title: アプリの終了を受ける
        summary: QApplication に届く QEvent.Quit を受け、開いている設定画面を確認せずに閉じる（イベントは止めない）。コンストラクタで QApplication に自分を入れる
        kind: メソッド
        scope: public
        args:
          - name: watched
            type: QObject
            required: true
            passing: positional
            description: イベントの宛先
          - name: event
            type: QEvent
            required: true
            passing: positional
            description: 届いたイベント
        returns:
          type: bool
          description: 常に False（イベントを先へ引き渡す）
        process: |-
          1. QEvent.Quit で、設定画面を開いていれば SettingsWindow.close_without_confirm を呼ぶ
             - QApplication.quit は窓へ閉じる要求を送信する前に QEvent.Quit をアプリのイベントフィルタへ引き渡すため、トレイの「終了」・「再起動」・SIGINT・SIGBREAK・後から起動したプロセスからの依頼のどれでも、変えた値を捨てる確認を出さずに閉じてイベントループを抜ける
             - 閉じると on_settings_closed がホットキーの受付を張り直すが、抜けた後の片付け（_stop_all）で止める
          2. False を返却する
        unit_tests:
          - name: test_event_filter_when_quit_with_settings_open
            case: 正常
            summary: 設定画面を開いて欄を変えたまま終了しても、確認せずに閉じてイベントループを抜ける
            condition: open_settings で開いて欄の値を変え、イベントループを回して QApplication.quit を呼ぶ
            mock: UiDeps の全関数・confirm_discard
            expected: confirm_discard が呼ばれず、設定画面が閉じ、イベントループを抜け、save_settings が呼ばれない
          - name: test_event_filter_when_quit_without_settings
            case: 正常
            summary: 設定画面を開いていなければ何もしない
            condition: 設定画面を開かずに QEvent.Quit を引き渡す
            mock: UiDeps の全関数
            expected: False を返却し、resume_hotkeys が呼ばれない
        status: implemented
      - name: on_copied
        title: コピーの完了の受け取り
        summary: UiBridge.copied のスロット。トレイにコピーの完了の通知を出す
        kind: メソッド
        scope: public
        args:
          - name: text
            type: str
            required: true
            passing: positional
            description: クリップボードへ書き込んだ起こした文字
        returns:
          type: None
          description: なし
        process: 1. トレイにコピーの完了の通知を出す（Tray.show_copy_completed）
        unit_tests:
          - name: test_on_copied
            case: 正常
            summary: コピーの完了をトレイの通知で通知する
            condition: text="テスト"
            mock: Tray
            expected: Tray.show_copy_completed("テスト") が 1 回呼ばれる
      - name: recopy
        title: もう一度コピーする
        summary: Tray.recopy_requested のスロット。起こした文字をクリップボードへもう一度書く
        kind: メソッド
        scope: public
        args:
          - name: text
            type: str
            required: true
            passing: positional
            description: コピーの完了の通知のときに起こした文字
        returns:
          type: None
          description: なし
        process: |-
          1. 起こした文字をクリップボードへ書き込む（UiDeps.copy）
             - DeliveryError の場合、トレイに届けられなかったことを通知する（Tray.show_failure(delivery_failed, 理由)）
               - `[ERROR]` コピーし直せなかった（理由）
        unit_tests:
          - name: test_recopy
            case: 正常
            summary: 起こした文字をもう一度コピーする
            condition: text="テスト"
            mock: UiDeps の全関数・Tray
            expected: UiDeps.copy("テスト") が 1 回呼ばれ、Tray.show_failure が呼ばれない
          - name: test_recopy_when_copy_failed
            case: 異常
            summary: コピーし直せなければ届けられなかったことを通知する
            condition: UiDeps.copy が DeliveryError("クリップボードへ書き込めませんでした") を送出する
            mock: UiDeps の全関数・Tray
            expected: Tray.show_failure(delivery_failed, クリップボードへ書き込めませんでした) が呼ばれ、ERROR のログが 1 行出て、例外が外へ出ない
    refs:
