title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/unit
      ```
    description: pytest で実行する。`tests/unit` は `src/voice_paste/` をミラーした並びの単体テスト。
    prerequisites:
      - 外部依存なし（GPU も録音も要らない）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {単体テストファイルパス}
        ```
  - name: 結合テスト（バック）
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/integration
      ```
    description: pytest で実行する。`tests/integration/` の下に、インターフェース定義ごとのファイルを置き、`tests/integration/ui/` の下に画面設計ごとのファイルを置く。
    prerequisites:
      - 外部依存なし（GPU も実機のマイクも要らない）
      - マイク・システム音量・文字起こしのエンジンは Mock に差し替え、履歴は一時フォルダに書く
      - 画面のテスト（`tests/integration/ui/`）は offscreen（`QT_QPA_PLATFORM=offscreen`。`tests/conftest.py` が設定する）の QApplication で開き、操作は QtTest で行う。実機の画面・トレイ・ホットキーは使わず、UiDeps の関数は Mock で受ける
      - 返送先は 127.0.0.1 で待ち受けるテスト用の受け口で、テストが立てる
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {結合テストファイルパス}
        ```
  - name: E2E テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/e2e --run-e2e
      ```
    description: pytest で実行する。`tests/e2e/` の下に、シナリオごとのファイルを置く（複合ユースケースは `tests/e2e/複合ユースケース/test_transcribe_from_other_system.py`）。
    prerequisites:
      - Windows の実機が要る。実機のマイクは開かない
      - 複合ユースケースの E2E（`tests/e2e/複合ユースケース/`）は、常駐アプリを pytest のプロセスの中で `build_handlers` で配線し、録音の入力・システム音量・貼り付けのキー・通知を差し替える（起動・トレイ・ホットキーの受付は通さない）。録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す。API は `build_fastapi` で組み立てた app を 127.0.0.1 で待ち受けさせる。実物のクリップボードを書き換える（テストの後に元の文字へ戻す）ため、実行中はクリップボードを使わない
      - ローカルの Whisper（GPU）で起こす。NVIDIA GPU が要り、CUDA の DLL は venv の `Lib/site-packages/nvidia/` から読む
      - 返送先は 127.0.0.1 で待ち受けるテスト用の受け口で、テストが立てて返送を受ける
      - 実機の画面・トレイを操作し、GPU を使う。誤実行を防ぐため `--run-e2e` を必須にする（付けなければ全て skip する）
      - 画面・トレイの E2E（`tests/e2e/単一ユースケース/`）は、実機の Windows のデスクトップにサインインし、画面がロックされていない状態で流す。環境変数 `VOICE_PASTE_ACCEPT_INJECTED_HOTKEYS=1` を付けて `python -m voice_paste --data-dir {一時フォルダ}` で常駐アプリを起動し（テストが付ける）、画面・トレイ・メニュー・通知は UI Automation で、トレイのアイコンの右クリックとメニューの選択だけマウスで操作する。実行中はキーボードとマウスを触らない
      - 画面・トレイの E2E は、普段使いの voice-paste のトレイのアイコンが出ていると、ホットキーを両方が受けるため、終了してから流す（タスクバーと隠れたアイコンの一覧のどちらかに出ていれば skip する）。`--data-dir` の一時フォルダで起動した常駐アプリは普段使いと単一インスタンスの名前が違うため、普段使いを終わらせない
      - '画面・トレイの E2E は、トレイのアイコンのヒントを UI Automation で読んで状態を知る。アイコンが隠れたアイコンの一覧に入っていても、テストが一覧を開いて読み、読み終えたら一覧を閉じて開く前の前面のウィンドウへフォーカスを戻す（Windows のトレイの表示設定は変えない）。Windows はアイコンのボタンの名前に、アイコンを出した時点のヒントと今のヒントを並べる（例 `voice-paste: 準備中 voice-paste: 待機中`）ため、名前の最後のヒントを今の状態として読む。前のケースの常駐アプリ（強制終了したもの・トレイの「終了」で終わったもの）のアイコンが隠れたアイコンの一覧に残っていても、テストは自分のアイコン（右クリックでこの常駐アプリのメニューが出るもの）を選ぶ。候補を試す途中で一覧が閉じれば、開き直して試していない候補を続ける'
      - 設定画面で欄を変えたままトレイの「終了」・Ctrl+Break で終える行は、実機の Windows の設定画面で確かめる
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {E2Eテストファイルパス} --run-e2e
        ```
  - name: 非機能要件テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/nfr --run-e2e
      ```
    description: pytest で実行する。録音・用語集・設定・期待値は git 管理外の `tests/nfr/fixtures/` から読み、今のローカルの Whisper（GPU）で起こす。
    prerequisites:
      - Windows と NVIDIA GPU が要る（無い環境では文字起こしのテストを skip する。CUDA の DLL は venv の `Lib/site-packages/nvidia/` から読む）
      - '`tests/nfr/fixtures/` に録音・用語集・設定・期待値が要る（無ければ skip する）'
      - API の開始・処理中のテスト（`tests/nfr/test_api_start_response_time.py`・`test_busy_response_time.py`）は、常駐アプリを pytest のプロセスの中で `build_handlers` で配線し、録音の入力をテストの中で書き出した無音の WAV を流すものに、システム音量を何もしないものに差し替える（実機のマイクを開かない）。`--run-e2e` を付けたときだけ走る（付けなければ skip する）
      - セッションの上限時間のテスト（`tests/nfr/test_api_session_limit.py`）は、SessionManager を上限時間 3 秒で自分で組み、録音機の入力をテストの中で書き出した無音の WAV を流すものに、システム音量を何もしないものに差し替える（実機のマイクを開かず、GPU を使わない）。`--run-e2e` を付けたときだけ走る（付けなければ skip する）
      - 話し終えてから貼り付くまでの時間のテスト（`tests/nfr/test_paste_latency.py`）は実物のクリップボードを書き換える（測った後に元の文字へ戻す）ため、`--run-e2e` を付けたときだけ走る。測っている間はクリップボードを使わない
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {非機能要件テストファイルパス} --run-e2e
        ```
  - name: 外部疎通テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/external --run-external
      ```
    description: pytest で実行する。`tests/external/` のテストは `--run-external` を付けたときだけ走り、付けなければ全て skip する。
    prerequisites:
      - 接続先の外部サービスの認証情報（API キーなど）を環境変数で渡す（無ければそのテストは skip する）
      - 従量課金のかかる外部サービスは、実行のたびに課金がかかる
      - 音量の契約テスト（`tests/external/voice_paste/integrations/volume/`）は Windows の実機の既定の再生デバイスが要る（無ければ skip する）。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
      - AI はユーザーが実行を許可したときだけ実行する（CI では実行しない）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {外部疎通テストファイルパス} --run-external
        ```
  - name: lint
    description: import-linter で pyproject.toml の `[tool.importlinter]` の契約（層・feature の独立・出力先の独立）を検査する。単体テストと一緒に回す。
    prerequisites:
      - 外部依存なし
    run_all: |-
      ```bash
      venv/Scripts/lint-imports
      ```
    results: 契約ごとの KEPT / BROKEN と、破った import の行を標準出力に出す（破れていれば終了コード 1）
prerequisites:
  - Windows の Python 3.11 以上の venv（`venv/Scripts/python.exe`）に `pip install -e . --group dev` を済ませる（pip 25.1 以上。pytest と import-linter と pywin32 は pyproject.toml の `[dependency-groups]` の dev から入る）
  - 実機のテスト（E2E・非機能要件テスト）が起こす常駐アプリへは `QT_QPA_PLATFORM` を渡さず（pytest のプロセスに `tests/conftest.py` の `offscreen` が入っていても外して）、実機の画面で起動する
