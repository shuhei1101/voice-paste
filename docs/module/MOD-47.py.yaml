id: MOD-47
visibility: internal
title: 常駐アプリ / ホットキーと画面 / send_hotkey.py
test_files:
  - tests/unit/voice_paste/runtime/test_send_hotkey.py
functions:
  - name: main
    title: 押されたホットキーの送信
    kind: 関数
    container: runtime/send_hotkey.py
    usecase: 録音する
    scope: public
    summary: GNOME のカスタムショートカットから `python -m voice_paste.runtime.send_hotkey {排他の名前} {ホットキー}` で起動し、常駐サービスの終了の依頼のソケットへ押されたホットキーを送信する
    description: 常駐サービスが動いていない（接続できない）ときは何もせず 0 で終わる。登録が残ったまま常駐サービスが終わっていても、押すたびにエラーを出さない。
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: コマンドの引数。None なら sys.argv[1:]
    returns:
      type: int
      description: 終了コード（引数の数が違えば 2、それ以外は 0）
    process: |-
      1. 引数が排他の名前・ホットキーの 2 つか
         - 違う場合、2 を返却する
      2. 抽象名前空間の `\0{排他の名前}-quit` へ接続し、HOTKEY_REQUEST_PREFIX にホットキーの UTF-8 をつないだバイト列を送信する
         - OSError の場合（常駐サービスが動いていない）、何もせず進む
      3. 0 を返却する
    unit_tests:
      - name: test_main
        case: 正常
        summary: 常駐サービスへホットキーを送信する
        condition: 一意の名前で LinuxSingleInstanceLock を取り、on_hotkey に受け手を引き渡してから、argv=[名前, "<cmd>+<alt>+d"] で呼ぶ
        mock: ホットキーの受け手（実物の抽象名前空間のソケット）
        expected: 0 が返り、受け手が "<cmd>+<alt>+d" で 1 秒以内に 1 回呼ばれる
      - name: test_main_when_not_running
        case: 正常
        summary: 常駐サービスが動いていなければ何もしない
        condition: 誰も待っていない一意の名前で argv=[名前, "<cmd>+<alt>+d"]
        mock: なし
        expected: 0 が返り、例外が出ない
      - name: test_main_when_wrong_args
        case: 異常
        summary: 引数の数が違えば 2
        condition: argv=[名前]
        mock: なし
        expected: 2 が返る
        exception: 引数の数が違う
    status: planned
