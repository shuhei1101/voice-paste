title: "常駐アプリ / 補正"
lead: 用語集の CSV を読み書きし、補正に使う用語集の誤変換を正しい表記へ置き換える。決まった入力に決まった出力を返し、特性テストの基準になる。
directory: |-
  ```
  src/voice_paste/features/correction/
  ├── __init__.py   # load_glossary・read_glossary_rows・save_glossary・apply_glossary・resolve_glossaries・pick_active_glossary・next_glossary_path の公開
  └── service.py    # 用語集の一覧の解決、CSV の読み書き、置き換え
  ```
data_models: []
functions:
  - name: load_glossary
    title: 用語集の読み込み
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 用語集の CSV から、補正に使う行（オンで、誤変換と正しい表記の両方がある行）を読む。文字起こしのたびに読み直す
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV（補正に使う用語集の場所。pick_active_glossary が返す path）
    returns:
      type: list[GlossaryEntry]
      description: 補正に使う行。ファイルが無ければ空
    process: |-
      1. read_glossary_rows で行を読む（ファイルが無ければ空）
         - GlossaryReadError の場合、空を返す（補正せずに届ける。文字起こしは失敗にしない）
           - `[WARNING]` 用語集を読めなかった（パス・理由）
      2. オフの行と、誤変換か正しい表記のどちらかが空の行を飛ばす（どちらかが空の行を飛ばすのは刷新前と同じ）
         - `[INFO]` 用語集を読んだ（パス・行数・補正に使う行数）
    unit_tests:
      - name: test_load_glossary
        case: 正常
        summary: CSV の行を読む
        condition: 2 行と空行 1 つの CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry が 2 つ返る
      - name: test_load_glossary_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 存在しないパス
        mock: なし
        expected: '[] が返る'
      - name: test_load_glossary_when_bom
        case: 正常
        summary: BOM つきの CSV も列名で読める
        condition: BOM つきの UTF-8 で 1 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry が 1 つ返る
      - name: test_load_glossary_when_blank_cells
        case: 正常
        summary: 空白を除き、どちらかが空の行を飛ばす
        condition: 「 くろーど , Claude 」・「あいう,」・「,えお」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry(wrong="くろーど", right="Claude") だけが返る
      - name: test_load_glossary_when_disabled_rows
        case: 正常
        summary: オフの行を飛ばす
        condition: 列 `使う` が「1」「0」「（空）」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: 「1」と「（空）」の 2 行だけが返る
      - name: test_load_glossary_when_unreadable
        case: 正常
        summary: 読めない CSV は空として扱い、例外を上げない
        condition: Shift_JIS で書いた 1 行の CSV
        mock: なし（一時フォルダ）
        expected: '[] が返る'
      - name: test_load_glossary_when_malformed
        case: 正常
        summary: csv が解釈できない CSV も空として扱い、例外を上げない
        condition: 見出しの次の行が「あ,"」で始まり、閉じない引用符の後ろに x を 200000 文字続けた CSV
        mock: なし（一時フォルダ）
        expected: '[] が返る'
    status: implemented
  - name: apply_glossary
    title: 用語集での補正
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 誤変換を正しい表記へ置き換える（用語集の行の順に、前の行で置き換えた結果へ次の行を当てる）
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 起こした文字
      - name: entries
        type: list[GlossaryEntry]
        required: true
        passing: positional
        description: 用語集の行
    returns:
      type: str
      description: 補正した文字
    unit_tests:
      - name: test_apply_glossary
        case: 正常
        summary: 誤変換を置き換える
        condition: 「くろーどこーど」→「Claude Code」の行と、それを含む文
        mock: なし
        expected: 「Claude Code」に置き換わった文が返る
      - name: test_apply_glossary_when_chained
        case: 正常
        summary: 前の行で置き換えた結果に次の行を当てる
        condition: 「A」→「B」、「B」→「C」の順の 2 行と文字「A」
        mock: なし
        expected: 「C」が返る
      - name: test_apply_glossary_when_no_match
        case: 正常
        summary: 誤変換を含まなければそのまま
        condition: 「くろーどこーど」→「Claude Code」の行と文字「今日は晴れ」
        mock: なし
        expected: 「今日は晴れ」が返る
    notes:
      特性テスト: 置き換えの結果は、#15 で固める特性テスト（今の実装の入出力）と一致させる（品質シナリオ 2）。
    status: implemented
    process: |-
      1. 用語集の行の順に、誤変換を含むなら全て正しい表記へ置き換える
         - `[INFO]` 用語集で置き換えた（置き換えた誤変換 → 正しい表記の並び）
  - name: read_glossary_rows
    title: 用語集の行の読み込み
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 用語集の CSV の行を、オン・オフと片方が空の行も含めて読む。設定画面の行の表と load_glossary が使う
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV
    returns:
      type: list[GlossaryEntry]
      description: CSV の行の順の行。ファイルが無ければ空
    process: |-
      1. ファイルが無ければ空を返す
         - `[WARNING]` 用語集が無い（パス）
      2. UTF-8（BOM ありも）の CSV を列名で読み、`誤変換`・`正しい表記` の前後の空白を除く
         - OSError の場合、理由「ファイルを開けません（{OS のエラー}）」の GlossaryReadError を送出する
         - UnicodeDecodeError の場合、理由「文字コードが UTF-8 ではありません」の GlossaryReadError を送出する
         - 見出しに `誤変換` か `正しい表記` の列が無い場合、理由「見出しに「誤変換」「正しい表記」の列がありません」の GlossaryReadError を送出する
         - csv.Error の場合（閉じていない引用符の後ろが csv の 1 項目の上限を超えるなど、csv が解釈できない）、理由「CSV の書式が正しくありません（{csv のエラー}）」の GlossaryReadError を送出する
         - 誤変換と正しい表記の両方が空の行は飛ばす（片方だけが空の行は返す）
      3. 列 `使う` の前後の空白を除いた値が `0` の行だけをオフにする（列が無い・空・ほかの値はオン）
    unit_tests:
      - name: test_read_glossary_rows
        case: 正常
        summary: 行をオン・オフつきで読む
        condition: '`誤変換,正しい表記,使う` の列で、使うが「1」と「0」の 2 行の CSV'
        mock: なし（一時フォルダ）
        expected: enabled が True・False の GlossaryEntry が CSV の順に返る
      - name: test_read_glossary_rows_when_no_enabled_column
        case: 正常
        summary: 列 `使う` が無い CSV の行は全てオン
        condition: '`誤変換,正しい表記` の 2 列だけの 2 行の CSV'
        mock: なし（一時フォルダ）
        expected: 2 行とも enabled が True
      - name: test_read_glossary_rows_when_half_empty
        case: 正常
        summary: 片方が空の行は返し、両方が空の行は飛ばす
        condition: 「あいう,」「,えお」「,」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: 「あいう,」と「,えお」の 2 行が返る
      - name: test_read_glossary_rows_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 存在しないパス
        mock: なし
        expected: '[] が返る'
      - name: test_read_glossary_rows_when_not_utf8
        case: 異常
        summary: UTF-8 でない CSV は読めないとする
        condition: Shift_JIS で書いた 1 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「文字コードが UTF-8 ではありません」
      - name: test_read_glossary_rows_when_no_header
        case: 異常
        summary: 見出しの列が無い CSV は読めないとする
        condition: 1 行目が「くろーど,Claude」で、見出しの無い CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「見出しに「誤変換」「正しい表記」の列がありません」
      - name: test_read_glossary_rows_when_unreadable
        case: 異常
        summary: 開けない CSV は読めないとする
        condition: path にフォルダを渡す
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「ファイルを開けません（」で始まる
      - name: test_read_glossary_rows_when_malformed
        case: 異常
        summary: csv が解釈できない CSV は読めないとする
        condition: 見出しの次の行が「あ,"」で始まり、閉じない引用符の後ろに x を 200000 文字続けた CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「CSV の書式が正しくありません（」で始まる
    status: implemented
    exceptions:
      - name: GlossaryReadError
        condition: CSV を開けない・UTF-8 として読めない・見出しに `誤変換` か `正しい表記` の列が無い・csv が解釈できない
        message: '{理由}（設定画面がそのまま出す文言）'
  - name: save_glossary
    title: 用語集の書き戻し
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 用語集の行を CSV へ書く。設定画面で行を変えた用語集と足した用語集だけに呼ぶ
    side_effects: path を書く（親のフォルダが無ければ作る）。列 `誤変換`・`正しい表記`・`使う` のほかの列は残らない。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV
      - name: entries
        type: Sequence[GlossaryEntry]
        required: true
        passing: positional
        description: 書く行（表の順）
    returns:
      type: None
      description: なし
    process: |-
      1. 親のフォルダを作る
      2. 同じフォルダの一時ファイルに、UTF-8（BOM あり）で見出し `誤変換,正しい表記,使う` と行を書く（使うはオンが `1`、オフが `0`。誤変換と正しい表記の両方が空の行は書かない）
      3. os.replace で置き換える
         - `[INFO]` 用語集を書いた（パス・行数）
    exceptions:
      - name: OSError
        condition: CSV を書けない（元の CSV は変わらない）
    unit_tests:
      - name: test_save_glossary
        case: 正常
        summary: 書いた行を同じ順とオン・オフで読み戻せる
        condition: オンとオフの 2 行を書き、read_glossary_rows で読む
        mock: なし（一時フォルダ）
        expected: 書いた 2 行と同じ GlossaryEntry が同じ順で返る
      - name: test_save_glossary_when_new_directory
        case: 正常
        summary: 親のフォルダが無ければ作る
        condition: 存在しないフォルダの下のパスに 1 行を書く
        mock: なし（一時フォルダ）
        expected: ファイルができ、1 行が読める
      - name: test_save_glossary_when_both_empty_row
        case: 正常
        summary: 両方が空の行は書かない
        condition: 誤変換と正しい表記が空の行を 1 つ含む 2 行を書く
        mock: なし（一時フォルダ）
        expected: 読み戻すと 1 行だけ
    status: implemented
  - name: resolve_glossaries
    title: 用語集の一覧の解決
    kind: 関数
    container: features/correction/service.py
    usecase: 共通
    scope: public
    summary: 設定から、CSV の場所を絶対パスにした用語集の一覧を返す。`glossaries` が空なら、今までの `glossary_path` の CSV を 1 つ目の用語集にする
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.toml のあるフォルダ
    returns:
      type: list[GlossarySettings]
      description: 用語集の一覧（1 件以上。path は絶対パス）
    process: |-
      1. `glossaries` が空かを確かめる
         - 空の場合、`glossary_path`（None なら settings_dir の `yogo.csv`。DEFAULT_GLOSSARY_FILE_NAME）を場所にし、名前をそのファイル名から拡張子を除いたものにした 1 件を返す。相対パスの `glossary_path` は、今までと同じく起動したフォルダからの絶対パスにする（`Path.absolute()`。保存で `glossaries[].path` に書いた後も同じファイルを指す）
      2. `glossaries` の並びのまま、相対パスの path を settings_dir からのパスにして返す（絶対パスはそのまま）
    unit_tests:
      - name: test_resolve_glossaries_when_empty
        case: 正常
        summary: 一覧が空でキーも無ければ、設定のフォルダの yogo.csv が 1 件目
        condition: 既定の設定と settings_dir
        mock: なし
        expected: 名前が「yogo」、path が settings_dir の yogo.csv の 1 件
      - name: test_resolve_glossaries_when_legacy_path
        case: 正常
        summary: 一覧が空で glossary_path があれば、その CSV が 1 件目
        condition: glossary_path = C:/x/terms.csv の設定
        mock: なし
        expected: 名前が「terms」、path が C:/x/terms.csv の 1 件
      - name: test_resolve_glossaries_when_relative_path
        case: 正常
        summary: 相対パスを設定のフォルダから解決し、絶対パスはそのまま返す
        condition: path が `glossaries/glossary_1.csv` と絶対パスの 2 件の glossaries
        mock: なし
        expected: 1 件目は settings_dir の下の絶対パス、2 件目は元のまま。並びと名前は変わらない
      - name: test_resolve_glossaries_when_relative_legacy_path
        case: 正常
        summary: 相対パスの glossary_path は、起動したフォルダからの絶対パスにする
        condition: glossary_path = terms.csv の設定と、起動したフォルダとは別の settings_dir
        mock: なし（monkeypatch.chdir で起動したフォルダを一時フォルダにする）
        expected: path が起動したフォルダの terms.csv の絶対パス（settings_dir の下ではない）
    status: implemented
  - name: pick_active_glossary
    title: 補正に使う用語集の選択
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 用語集の一覧から、`active_glossary` の名前の用語集を返す。名前が無い・一覧に無いときは 1 件目を返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.toml のあるフォルダ
    returns:
      type: GlossarySettings
      description: 補正に使う用語集（path は絶対パス）
    process: |-
      1. resolve_glossaries で一覧を引く
      2. `active_glossary` と同じ名前の用語集を返す
         - None か、同じ名前が無い場合、1 件目を返す
    unit_tests:
      - name: test_pick_active_glossary
        case: 正常
        summary: active_glossary の名前の用語集を返す
        condition: 「yogo」「会議用」の 2 件と active_glossary = 会議用
        mock: なし
        expected: 「会議用」の用語集が返る
      - name: test_pick_active_glossary_when_unset
        case: 正常
        summary: active_glossary が無ければ 1 件目
        condition: 2 件の glossaries と active_glossary = None
        mock: なし
        expected: 1 件目が返る
      - name: test_pick_active_glossary_when_unknown_name
        case: 正常
        summary: 一覧に無い名前なら 1 件目
        condition: 2 件の glossaries と active_glossary = 無い名前
        mock: なし
        expected: 1 件目が返る
    status: implemented
  - name: next_glossary_path
    title: 足す用語集の CSV の場所
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 設定画面で足す用語集の CSV の場所を、今あるファイルとも一覧の用語集とも重ならない連番で決める
    args:
      - name: directory
        type: Path
        required: true
        passing: injected
        description: 足した用語集の CSV を置くフォルダ（settings.toml と同じフォルダの `glossaries`）
      - name: taken
        type: Collection[Path]
        required: true
        passing: positional
        description: 設定画面の一覧にある用語集の場所（保存する前に足した分を含む）
    returns:
      type: Path
      description: '`{directory}/glossary_{n}.csv`（絶対パス）'
    process: 1. n を 1 から順に上げ、`glossary_{n}.csv` が directory に無く、taken にも無い最初の場所を返す（消した用語集の CSV が残っていれば、その番号は使わない。ファイルは作らない）
    reason: ファイル名を用語集の名前から作ると、名前を変えたときと、消した用語集と同じ名前を足し直したときに、残った CSV と重なる。Windows はファイル名の大文字と小文字を区別しないので、名前の重なりの確かめとも食い違う
    unit_tests:
      - name: test_next_glossary_path
        case: 正常
        summary: 空のフォルダなら 1 番
        condition: 存在しない directory と空の taken
        mock: なし（一時フォルダ）
        expected: directory の glossary_1.csv
      - name: test_next_glossary_path_when_file_exists
        case: 正常
        summary: 残っている CSV の番号は使わない
        condition: glossary_1.csv がある directory と空の taken
        mock: なし（一時フォルダ）
        expected: glossary_2.csv
      - name: test_next_glossary_path_when_taken
        case: 正常
        summary: 保存する前に足した用語集の場所とも重ねない
        condition: 空の directory と、glossary_1.csv を含む taken
        mock: なし（一時フォルダ）
        expected: glossary_2.csv
    status: implemented
test_files:
  - tests/unit/voice_paste/features/correction/test_service.py
constants:
  - name: DEFAULT_GLOSSARY_FILE_NAME
    title: 既定の用語集のファイル名
    container: features/correction/service.py
    value: '"yogo.csv"'
    summary: '`glossaries` も `glossary_path` も無いときに読む、settings.toml と同じフォルダの用語集のファイル名（main.py の GLOSSARY_FILE_NAME を移す）'
    status: implemented
