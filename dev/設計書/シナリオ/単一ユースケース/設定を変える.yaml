title: "設定を変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 変える設定
        description: 録音開始のホットキーを別のキーの組み合わせに変える
        notes: '`hotkeys.start`。反映は `immediate`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        U->>TRAY: 「設定…」を選ぶ
        TRAY->>SW: 開く（設定のモデルから欄を組み立て、今の値を入れる）
        U->>SW: 「ホットキー」のまとまりを選ぶ
        U->>SW: 録音開始の欄で新しいキーの組み合わせを押す
        SW-->>U: 押した組み合わせを欄に出す
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>TOML: 変わった値を、コメントを保ったまま書く
        SW->>APP: 反映が immediate の値を動いている常駐アプリに効かせる
        APP->>APP: ホットキーの受付を張り直す
        SW->>SW: 閉じる
      ```
    expected:
      - '`settings.toml` の `hotkeys.start` が新しい組み合わせになり、ほかのキーとコメントが変わっていない'
      - 再起動せずに、新しい組み合わせで録音が始まり、前の組み合わせでは始まらない
      - 設定画面が閉じている
  - name: 正常シナリオ（保存して再起動する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 変える設定
        description: ローカルの Whisper のモデルを別のモデルに変える
        notes: '`transcription.local_whisper.model`。反映は `restart`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「文字起こし」のまとまりでモデルを変える
        SW-->>U: 欄に「再起動で反映」を出し、「保存して再起動」を出す
        U->>SW: 「保存して再起動」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>TOML: 変わった値を書く
        SW->>APP: 閉じて再起動を求める
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ（新しいモデルを読み込む）
      ```
    expected:
      - '`settings.toml` の `transcription.local_whisper.model` が新しいモデルになっている'
      - 前の常駐アプリのプロセスが終わり、新しいプロセスが新しいモデルで文字を起こす
    test: test_normal_when_save_and_restart
  - name: 正常シナリオ（既定に戻す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 変えた設定
        description: '`settings.toml` に既定と違う値がある'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant DLG as 既定に戻す確認
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「既定に戻す」を押す
        SW->>DLG: 全ての設定を既定の値へ戻すかを確かめる
        U->>DLG: 「既定に戻す」を押す
        DLG->>TOML: 全てのキーを既定の値で書く
        DLG->>APP: 反映が immediate の値を動いている常駐アプリに効かせる
        DLG->>SW: 戻り、既定の値を欄に入れる
      ```
    expected:
      - '`settings.toml` の全てのキーが既定の値になっている'
      - 反映が `immediate` のキーは動いている常駐アプリに効き、`restart` のキーは再起動するまで前の値のまま動く
      - 設定画面が開いたまま、欄に既定の値が入っている
    test: test_normal_when_reset
  - name: 正常シナリオ（取り消す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 取り消し
        description: 欄を書き換えてから「キャンセル」を押し、確認で「捨てて閉じる」を選ぶ
        notes: Esc・窓を閉じるでも同じ。欄を変えていなければ確認を出さずに閉じる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant DLG as 変えた値を捨てる確認

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 欄を書き換えて「キャンセル」を押す
        SW->>DLG: 変えた値を捨てて閉じるかを確かめる
        U->>DLG: 「捨てて閉じる」を押す
        DLG->>SW: 何も書かずに閉じる
      ```
    expected:
      - '`settings.toml` が変わっていない'
      - 動いている常駐アプリの設定が変わっていない
      - 設定画面が閉じている
    test: test_normal_when_cancel
  - name: 異常シナリオ（確かめに通らない値を入れる）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 通らない値
        description: 「出力先」のまとまりで、貼り付けて送信の Enter までの秒数に `abc` を入れて「保存」を押す
        notes: '`outputs[].enter_delay_sec`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: Enter までの秒数を abc にして「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通らない（数値でない）
        SW-->>U: その欄の下にエラーを出し、最初のエラーの欄へフォーカスを移す
      ```
    expected:
      - '`settings.toml` が変わっていない'
      - 設定画面が開いたまま、Enter までの秒数の欄の下にエラーが出て、その欄にフォーカスがある
      - 動いている常駐アプリの設定が変わっていない
    test: test_error_when_invalid_value
  - name: 正常シナリオ（カスタムプリセットを足す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 足すプリセット
        description: 「エンドポイントへ送る」のまとまり（タブ）で、タイトル・URL・確定のホットキーを入れたプリセットを 1 つ足す
        notes: 反映は `immediate`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「エンドポイントへ送る」のまとまりで「プリセットを足す」を押す
        U->>SW: タイトル・URL・確定のホットキーを入れる
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>TOML: プリセットの一覧を、コメントを保ったまま書く
        SW->>APP: 効かせる
        APP->>APP: プリセットのホットキーの受付を張り直す
        SW->>SW: 閉じる
      ```
    expected:
      - '`settings.toml` に足したプリセットが書かれ、ほかのキーとコメントが変わっていない'
      - 再起動せずに、次の録音の画面にそのプリセットのボタンが出、そのホットキーで確定できる
      - 設定画面が閉じている
  - name: 正常シナリオ（用語集の行を編集する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 用語集
        description: 選んでいる用語集のプリセットに、誤変換と正しい表記の行が 2 つある
        notes: 反映は `immediate`
      - name: 変える行
        description: 「用語集」のまとまりで、行を 1 つ足し、1 つ目の行の正しい表記を書き換え、2 つ目の行をオフにする
        notes: 行を消すのも同じ流れ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant GL as 用語集のファイル
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「用語集」のまとまりを選ぶ
        SW-->>U: 選んでいるプリセットの行（誤変換・正しい表記・オン・オフ）を一覧に出す
        U->>SW: 行を足し、行を書き換え、行をオフにする
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>GL: プリセットの行とオン・オフを書き戻す
        SW->>TOML: 変わった値を、コメントを保ったまま書く
        SW->>APP: 効かせる
        SW->>SW: 閉じる
      ```
    expected:
      - 用語集のファイルに、足した行と書き換えた正しい表記があり、オフにした行がオフとして書かれている
      - 再起動せずに、動いている常駐アプリの補正に文字を渡すと、足した行と書き換えた行の誤変換が置き換わり、オフにした行の誤変換は残る（マイクを開かずに確かめる。録音を通した補正は 録音を文字に起こす の 正常シナリオ）
      - 設定画面が閉じている
    test: test_normal_when_edit_glossary
  - name: 正常シナリオ（用語集のプリセットを足して切り替える）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 足すプリセット
        description: 「用語集」のまとまりで、名前を付けた用語集のプリセットを 1 つ足し、行を 1 つ入れて、補正に使うプリセットをそのプリセットに切り替える
        notes: 補正に当てるのは選んだ 1 つだけ。反映は `immediate`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant GL as 用語集のファイル
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「用語集」のまとまりでプリセットを足し、名前を入れる
        U->>SW: 足したプリセットに行を入れる
        U->>SW: 補正に使うプリセットを足したプリセットに切り替える
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>GL: 足したプリセットの行を書く
        SW->>TOML: プリセットの一覧と選んでいるプリセットを、コメントを保ったまま書く
        SW->>APP: 効かせる
        SW->>SW: 閉じる
      ```
    expected:
      - 足したプリセットの用語集のファイルに入れた行があり、前のプリセットの用語集のファイルが変わっていない
      - '`settings.toml` に足したプリセットと、補正に使うプリセットがそのプリセットであることが書かれ、ほかのキーとコメントが変わっていない'
      - 再起動せずに、動いている常駐アプリの補正に文字を渡すと、足したプリセットの行の誤変換が置き換わり、前のプリセットだけにある行の誤変換は残る（マイクを開かずに確かめる）
      - 設定画面が閉じている
    test: test_normal_when_switch_glossary_preset
  - name: 正常シナリオ（文字起こしの手がかりのプリセットを編集する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 手がかりのプリセット
        description: 手がかりのプリセットが 1 つあり、語が 2 つ入っていて、有効になっている
        notes: 反映は `immediate`
      - name: 変えるプリセット
        description: 手がかりのプリセットの一覧で、名前と語を 1 つ入れたプリセットを 1 つ足し、前からあるプリセットに語を 1 つ足して 1 つ目の語を書き換える。もう 1 つプリセットを足して語を入れ、無効に切り替える
        notes: 足したプリセットは有効で始まる。語を消す・プリセットを消すのも同じ流れ
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 手がかりのプリセットの一覧があるまとまりを選ぶ
        SW-->>U: 手がかりのプリセット（名前・語の一覧・有効か）を一覧に出す
        U->>SW: プリセットを足し、語を足して書き換え、有効・無効を切り替える
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通った
        SW->>TOML: 手がかりのプリセットの一覧を、コメントを保ったまま書く
        SW->>APP: 効かせる
        SW->>SW: 閉じる
    expected:
      - '`settings.toml` に、足したプリセット・足した語と書き換えた語・プリセットごとの有効か無効かが一覧の順に書かれ、ほかのキーとコメントが変わっていない'
      - 再起動せずに、動いている常駐アプリが次に組み立てる文字起こしの要求に、有効なプリセットの語が一覧の順に読点（、）でつながって載り、無効のプリセットの語が載らない（マイクを開かずに確かめる。録音を通した文字起こしは 録音を文字に起こす の 正常シナリオ（文字起こしの手がかりを渡す））
      - 設定画面が閉じている
    test: test_normal_when_edit_hint_presets
  - name: 異常シナリオ（手がかりが上限を超える）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 上限を超える語
        description: 有効な手がかりのプリセットに、読点（、）でつないだ長さが UTF-8 で 223 バイトになる語を入れて「保存」を押す
        notes: 上限は 222 バイト
    flow: |-
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant TOML as settings.toml

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 有効なプリセットに語を足して「保存」を押す
        SW->>MDL: 欄の値を確かめる
        MDL-->>SW: 通らない（有効な手がかりをつないだ長さが上限を超える）
        SW-->>U: エラーの一覧と有効な手がかりの長さの行の下にエラーを出す
    expected:
      - '`settings.toml` が変わっていない'
      - 設定画面が開いたまま、手がかりが長すぎることと、語を減らすかプリセットを無効にすることを求めるエラーが出ている
      - 動いている常駐アプリの設定が変わっていない
    test: test_error_when_hints_too_long
    notes:
      同じ扱いになる入力: 語が空のとき、語に読点（、）・句点（。）・改行が入っているときも、保存を止めてその語の欄の下にエラーを出す。
lead: トレイの「設定…」から設定画面を開き、変えた設定を設定のモデルで確かめてから `settings.toml` に保存する単一ユースケース。
issue: 21
primary_actor: 音声入力を使うユーザー
trigger: トレイのメニューの「設定…」を選ぶ
preconditions:
  - 常駐アプリが待機中である（録音から届けるまでの間は、API から始めた録音の間を含めて、トレイの「設定…」を押せない）
notes:
  画面の項目: '`settings.toml` の全てのキーを、出力先・ホットキー・録音・文字起こし・表記のヒント・用語集・画面・履歴とログ・API のまとまりに分け、左のメニューで切り替える。欄は設定のモデルから組み立てる（キーの一覧は 設定/常駐アプリ）。手がかりのプリセットは、画面では「表記のヒント」のまとまりに「ヒントのプリセット」として出す。'
  反映の種類: キーごとの反映（`immediate` / `restart`）は 設定/常駐アプリ が持つ。反映が `restart` の欄には「再起動で反映」を出し、そうした欄を変えたときだけ「保存して再起動」を出す。`immediate` の値は保存した時点で動いている常駐アプリに効く。
  E2E のテスト: |-
    正常シナリオと「カスタムプリセットを足す」は、変えた設定で録音を始めて実機のマイクを開くため、E2E のテストを置かない（#65）

    E2E の常駐アプリの起こし方と操作の渡し方は、常駐アプリを起動する の補足『E2E のテスト』と同じ。
    設定画面はトレイの「設定…」を trigger して開き、まとまりのメニュー・欄・ボタンはクリックとキーを Qt のイベントで渡す。
    「保存して再起動する」で起動し直す新しいプロセスは別プロセスで動き（Qt は offscreen）、ログとトークンのファイルで確かめる
test_file: tests/e2e/単一ユースケース/test_change_settings.py
