id: MOD-25
visibility: internal
title: 常駐アプリ / 録音セッション / route.py
test_files:
  - tests/unit/voice_paste/features/session/test_route.py
functions:
  - name: start_session_route
    title: 開始の route
    kind: 関数
    container: features/session/route.py
    usecase: APIで録音を操作する
    role: route
    scope: public
    is_async: false
    summary: POST /sessions。コールバック先と用語集のプリセットを確かめて SessionManager.start(entry="api") を呼ぶ
    args:
      - name: body
        type: StartSessionRequest
        required: true
        passing: positional
        description: リクエストの body
      - name: deps
        type: Annotated[SessionApiDeps, Depends(get_session_api_deps)]
        required: true
        passing: injected
        description: 録音セッションの API の依存。トークンは API サーバーの守りで照合済み
    returns:
      type: StartSessionResponse
      description: 202 で返す
    process: |-
      1. コールバック先のホストが許されるかを確かめる（出力先の is_callback_allowed）
         - 許されない場合、CallbackNotAllowedError を送出する（400 に変わる）
      2. body.glossary_preset があれば、今の設定の用語集のプリセットの一覧にあるかを確かめる（glossary_preset_exists）
         - 無い場合、その名前を含む GlossaryPresetNotFoundError を送出する（400 に変わる。録音を始めず、録音セッションも作らない）
           - `[WARNING]` 用語集のプリセットが無いため開始を断った（指定された名前）
      3. SessionManager.start(entry="api", callback_url, continuous=body.continuous, glossary_preset=body.glossary_preset) を呼ぶ（SessionBusyError は 409、MicrophoneUnavailableError は 503 に変わる）
      4. 録音セッションの ID を返す
    exceptions:
      - name: CallbackNotAllowedError
        condition: コールバック先のホストが loopback でも設定で許可したホストでもない
      - name: GlossaryPresetNotFoundError
        condition: 指定した用語集のプリセットが今の設定の一覧に無い
    refs:
      - IF-10#
    unit_tests:
      - name: test_start_session_route_when_callback_not_allowed
        case: 異常
        summary: 許されないコールバック先は開始しない
        condition: callback_url が http://example.com/result
        mock: SessionApiDeps の SessionManager
        expected: CallbackNotAllowedError が送出され、start が呼ばれない
        exception: コールバック先のホストが許されない
      - name: test_start_session_route_when_continuous
        case: 正常
        summary: continuous を SessionManager.start へ渡す
        condition: 'body が {callback_url: http://127.0.0.1:9000/r, continuous: true}。省いた body も送信する'
        mock: SessionApiDeps の SessionManager
        expected: start に continuous=True が渡り、省いたときは continuous=False が渡る
      - name: test_start_session_route_when_glossary_preset
        case: 正常
        summary: 一覧にある用語集のプリセットを SessionManager.start へ渡す
        condition: 'body が {callback_url: http://127.0.0.1:9000/r, glossary_preset: 会議} で、glossary_preset_exists が True を返す。glossary_preset を省いた body も送信する'
        mock: SessionApiDeps の SessionManager・glossary_preset_exists
        expected: start に glossary_preset="会議" が渡る。省いたときは glossary_preset=None が渡り、glossary_preset_exists は呼ばれない
      - name: test_start_session_route_when_glossary_preset_not_found
        case: 異常
        summary: 一覧に無い用語集のプリセットでは開始しない
        condition: 'body が {callback_url: http://127.0.0.1:9000/r, glossary_preset: 無い名前} で、glossary_preset_exists が False を返す'
        mock: SessionApiDeps の SessionManager・glossary_preset_exists
        expected: メッセージに「無い名前」を含む GlossaryPresetNotFoundError が送出され、start が呼ばれない
        exception: 指定した用語集のプリセットが一覧に無い
    status: implemented
  - name: stop_session_route
    title: 停止の route
    kind: 関数
    container: features/session/route.py
    usecase: APIで録音を操作する
    role: route
    scope: public
    summary: POST /sessions/{session_id}/stop。SessionManager.stop を呼ぶ（SessionNotFoundError は 404）
    args:
      - name: session_id
        type: str
        required: true
        passing: positional
        description: パスの録音セッションの ID
      - name: deps
        type: Annotated[SessionApiDeps, Depends(get_session_api_deps)]
        required: true
        passing: injected
        description: 録音セッションの API の依存
    returns:
      type: None
      description: 200 で返す
    refs:
      - IF-8#
    status: implemented
  - name: complete_session_route
    title: 完了の route
    kind: 関数
    container: features/session/route.py
    usecase: APIで録音を操作する
    role: route
    scope: public
    summary: POST /sessions/{session_id}/complete。SessionManager.complete を呼ぶ（SessionNotFoundError は 404）
    args:
      - name: session_id
        type: str
        required: true
        passing: positional
        description: パスの録音セッションの ID
      - name: deps
        type: Annotated[SessionApiDeps, Depends(get_session_api_deps)]
        required: true
        passing: injected
        description: 録音セッションの API の依存
    returns:
      type: None
      description: 202 で返す
    refs:
      - IF-9#
    status: implemented
  - name: get_session_api_deps
    title: 録音セッションの API の依存の取得
    kind: 関数
    container: features/session/route.py
    usecase: APIで録音を操作する
    scope: public
    summary: Depends で使う。request.app.state.session_api を返す
    args:
      - name: request
        type: Request
        required: true
        passing: positional
        description: 要求
    returns:
      type: SessionApiDeps
      description: 録音セッションの API の依存
    status: implemented
