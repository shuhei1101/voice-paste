id: IF-10
visibility: internal
title: "録音を開始する"
entry:
  kind: endpoint
  value: POST /sessions
flows:
  - name: 正常系
    summary: 画面を出さない録音を始め、録音セッションの ID を返却する
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える（マイクは開ける）
      - name: 待機中
        description: ほかの録音・文字起こしを処理していない
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク

        C->>IF: トークン・callback_url
        IF->>IF: Host・Origin・トークン・コールバック先を確認する
        IF->>MIC: 録音を始める
        IF-->>C: 202・session_id
      ```

      <!-- /map -->
    expected:
      - 202 と session_id が返る
      - 録音セッションが録音中になっている
      - 録音の画面を開いていない
      - 録音中に画面を暗くしない設定がオンのとき、画面の消灯を 1 回抑止している
    test: test_normal
  - name: 正常系（連続録音）
    summary: continuous=true で、完了が来るまで停止しない画面を出さない録音を始め、録音セッションの ID を返却する
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える（マイクは開ける）
      - name: 待機中
        description: ほかの録音・文字起こしを処理していない
      - name: 要求
        description: continuous を true にする
        notes: '`{"callback_url": "http://127.0.0.1:9000/voice-paste/result", "continuous": true}`'
    flow: |-
      <!-- map: {"title": "正常系（連続録音）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク

        C->>IF: トークン・callback_url・continuous=true
        IF->>IF: Host・Origin・トークン・コールバック先を確認する
        IF->>MIC: 録音を始める（無音での区切りを始める）
        IF-->>C: 202・session_id
      ```

      <!-- /map -->
    expected:
      - 202 と session_id が返る
      - 録音セッションが連続録音の録音中になっている
      - 録音の画面を開いていない
      - 続く開始が 409 になる
    test: test_normal_when_continuous
  - name: 異常系（コールバック先が許可されていない・400）
    summary: 許可していないコールバック先では録音を始めない
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: コールバック先
        description: loopback でも許可したホストでもない URL
        notes: '`http://example.com/result`'
    flow: |-
      <!-- map: {"title": "異常系（コールバック先が許可されていない・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions

        C->>IF: トークン・許可していない callback_url
        IF-->>C: 400
      ```

      <!-- /map -->
    expected:
      - 400 が返る
      - 録音が始まっていない
    test: test_error_when_callback_not_allowed
  - name: 異常系（トークンが合わない・401）
    summary: トークンが合わなければ録音を始めない
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: トークン
        description: 今回の起動のものと違うトークンか、Authorization 無し
    flow: |-
      <!-- map: {"title": "異常系（トークンが合わない・401）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant LOG as ログ

        C->>IF: 合わないトークン
        IF->>LOG: 断った理由と要求元（Host・Origin）を書き込む（トークンは書き込まない）
        IF-->>C: 401
      ```

      <!-- /map -->
    expected:
      - 401 が返る
      - 録音が始まっていない
      - ログに断った理由と要求元が書き込まれ、トークンの値は書き込まれていない
    test: test_error_when_token_mismatch
  - name: 異常系（ブラウザからの要求・403）
    summary: Origin の付いた要求と、Host が待ち受けのホストでない要求を断る
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 要求のヘッダー
        description: 正しいトークンに Origin を付けるか、Host をほかのホスト名にする
        notes: '`Origin: http://evil.example`・`Host: evil.example`'
    flow: |-
      <!-- map: {"title": "異常系（ブラウザからの要求・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant LOG as ログ

        C->>IF: Origin ありか、ほかの Host
        IF->>LOG: 断った理由と要求元（Host・Origin）を書き込む（トークンは書き込まない）
        IF-->>C: 403
      ```

      <!-- /map -->
    expected:
      - 403 が返る
      - 録音が始まっていない
      - ログに断った理由と要求元が書き込まれ、トークンの値は書き込まれていない
    test: test_error_when_browser_request
  - name: 異常系（処理中・409）
    summary: ほかの録音・文字起こしの処理中は開始を断る
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 処理中
        description: ホットキーから始めた録音が録音中である
    flow: |-
      <!-- map: {"title": "異常系（処理中・409）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions

        C->>IF: トークン・callback_url
        IF-->>C: 409
      ```

      <!-- /map -->
    expected:
      - 409 が返る
      - 処理中の録音が続いている
      - 2 つ目の録音が始まっていない
    test: test_error_when_busy
  - name: 異常系（マイクを開けない・503）
    summary: マイクを開けなければ音量と画面の消灯の抑止を戻して断る
    setup:
      - name: Mock
        description: マイクを開くと例外になるように差し替える。システム音量・トレイも差し替える
    flow: |-
      <!-- map: {"title": "異常系（マイクを開けない・503）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク
        participant LOG as ログ

        C->>IF: トークン・callback_url
        IF->>MIC: 録音を始める
        MIC-->>IF: 開けない
        IF->>LOG: マイクを開けなかった理由を書き込む
        IF-->>C: 503
      ```

      <!-- /map -->
    expected:
      - 503 が返る
      - システム音量が録音前の値に戻っている
      - 画面の消灯の抑止が解除されている
      - 待機中に戻り、続く開始が 409 にならない
      - ログにマイクを開けなかった理由が書き込まれている
    test: test_error_when_microphone_unavailable
  - name: 正常系（用語集のプリセットを指定）
    summary: glossary_preset で指定した用語集のプリセットを持たせて画面を出さない録音を始め、録音セッションの ID を返却する
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える（マイクは開ける）
      - name: 待機中
        description: ほかの録音・文字起こしを処理していない
      - name: 用語集のプリセット
        description: 設定に用語集のプリセット「既定」と「会議」があり、設定で選んでいるのは「既定」
        notes: '`{"callback_url": "http://127.0.0.1:9000/voice-paste/result", "glossary_preset": "会議"}`'
    flow: |-
      <!-- map: {"title": "正常系（用語集のプリセットを指定）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク

        C->>IF: トークン・callback_url・glossary_preset
        IF->>IF: Host・Origin・トークン・コールバック先・プリセットが設定の一覧にあるかを確認する
        IF->>MIC: 録音を始める（録音セッションにプリセットを持たせる）
        IF-->>C: 202・session_id
      ```

      <!-- /map -->
    expected:
      - 202 と session_id が返る
      - 録音セッションが録音中で、補正に使用する用語集のプリセットとして「会議」を持っている
      - 設定で選んでいる用語集のプリセットは「既定」のまま変わっていない
    test: test_normal_when_glossary_preset
  - name: 異常系（一覧に無い用語集のプリセット・400）
    summary: 設定の一覧に無い用語集のプリセットを指定したら録音を始めない
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 無いプリセット
        description: 設定の用語集のプリセットの一覧に無い名前を指定する
        notes: '`{"callback_url": "http://127.0.0.1:9000/voice-paste/result", "glossary_preset": "無いプリセット"}`'
    flow: |-
      <!-- map: {"title": "異常系（一覧に無い用語集のプリセット・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions

        C->>IF: トークン・callback_url・一覧に無い glossary_preset
        IF-->>C: 400（detail に指定したプリセットの名前）
      ```

      <!-- /map -->
    expected:
      - 400 が返り、detail に指定したプリセットの名前が含まれている
      - 録音が始まっていない
    test: test_error_when_glossary_preset_not_found
lead: コールバック先のエンドポイントを受け取り、画面を出さない録音を始めて録音セッションの ID を返却する。continuous を指定すると、完了が来るまで録音を停止せず、無音で区切った区間ごとに返却する連続録音を始める。
identifier: start_session
permissions: 今回の起動のトークン（トークンのファイルを読み込める、同じ端末・同じユーザーのプロセス）
idempotent: false
side_effects: マイクの録音を始め、設定で録音中の音量を下げるようにしていればシステム音量を下げ、録音中に画面を暗くしないようにしていれば画面の消灯を抑止する（抑止に失敗しても録音は始め、警告をログに残す）。トレイのアイコンを録音中にする。連続録音では、区切った区間ごとに履歴へ保存し（履歴を残す設定のとき）、文字に起こして 呼び出し元へ返却する がコールバック先へ送信する。
exclusivity: 録音・文字起こしは入口（ホットキー・トレイ・API）をまたいで同時に 1 つだけ。処理中に来た開始は 409 で断る。
request:
  - name: Authorization
    type: str
    required: true
    location: header
    description: 今回の起動のトークン
    format: '`Bearer {トークン}`'
    status: implemented
  - name: Host
    type: str
    required: true
    location: header
    description: 待ち受けのホスト
    constraints: '`127.0.0.1:{ポート}` か `localhost:{ポート}`'
    status: implemented
  - name: Origin
    type: str
    required: false
    default: なし（付いていれば 403）
    location: header
    description: ブラウザが付ける要求元。付いていてはいけない
    status: implemented
  - name: callback_url
    type: str
    required: true
    location: body
    description: 起こした文字・空の文字・失敗を返却するエンドポイント
    constraints: ホストが loopback（127.0.0.0/8・::1・localhost）か、設定で許可したホスト
    format: uri
    example: http://127.0.0.1:9000/voice-paste/result
    status: implemented
  - name: continuous
    type: bool
    required: false
    default: 'false'
    location: body
    description: 連続録音にするか。true なら、完了が来るまで録音を停止せず、無音で区切った区間ごとに起こした文字をコールバック先へ送信する。false なら、1 回の録音を確定してから 1 回だけ返す
    example: 'true'
    status: planned
  - name: glossary_preset
    type: str
    required: false
    default: なし（設定で選んでいる用語集のプリセットを使用する）
    location: body
    description: この録音セッションの補正に使用する用語集のプリセットの名前。開始の時点で決まり、後から設定で選ぶプリセットを変えてもこの録音セッションは指定したプリセットで補正する。連続録音では区間ごとの文字に適用する
    constraints: 設定の用語集のプリセットの一覧にある名前（大文字と小文字を区別する）
    example: 会議
    status: planned
request_example: |-
  ```json
  {
    "callback_url": "http://127.0.0.1:9000/voice-paste/result",
    "continuous": false,
    "glossary_preset": "会議"
  }
  ```
response:
  - name: session_id
    type: str
    description: 始めた録音セッションの ID。停止・完了と返送で使用する
    format: uuid
    example: 3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10
response_example: |-
  ```json
  {
    "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10"
  }
  ```
status_codes:
  - code: '202'
    condition: 録音を始めた
  - code: '400'
    condition: コールバック先が無い・URI でない・loopback でも許可したホストでもない。または、glossary_preset が設定の用語集のプリセットの一覧に無い
  - code: '401'
    condition: トークンが無いか、今回の起動のものと合わない
  - code: '403'
    condition: Origin が付いているか、Host が 127.0.0.1 でも localhost でもない
  - code: '409'
    condition: ほかの録音・文字起こしが処理中
  - code: '503'
    condition: マイクを開けず、録音を始められない
error_format: |-
  RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）で返す。
  `detail` には断った理由を書き、トークンなど秘密の値は含めない。
constraints:
  - item: 待ち受け
    constraint: 127.0.0.1 だけ
  - item: 応答時間
    constraint: 非機能要件の開始の応答時間以内（202・409 とも）
  - item: 認可
    constraint: 起動ごとに作るトークンの一致
  - item: レート制限
    constraint: 制限なし
    notes: 同時に 1 つだけの排他で足りる
  - item: 録音セッションの長さ
    constraint: continuous が false のときは非機能要件の API の録音セッションの上限時間、true のときは設定の連続録音の録音セッションの上限時間（api.continuous.session_limit_sec）。どちらも開始からの経過時間で数え、達したら 上限で打ち切る
    decided_by: NFR-1#requirements[連続録音の録音セッションの上限時間]
  - item: 区切り
    constraint: continuous が true のときだけ。話し声の後で、設定の区切る無音の長さ（api.continuous.min_silence_sec）以上無音が続いたところで区切る。無音が来ないまま区間が区間の最大の長さに達したら、直近の短い無音の中（無ければその位置）で区切る。話し声を含まない間は区間にしない
    decided_by: NFR-1#requirements[区間の最大の長さ]
    notes: 話し声か無音かは常駐アプリに同梱の Silero VAD（faster-whisper 1.2.1 と同じモデル） で判定する。背景にノイズがあると区切りの無音をわずかに超える間では区切れず、区間が長くなることがある
test_file: tests/integration/test_start_session.py
