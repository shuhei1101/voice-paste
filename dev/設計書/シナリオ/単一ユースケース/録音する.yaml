id: SC-8
title: "録音する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 録音中の音量
        description: 録音中にシステム音量を今の音量の半分へ下げる設定にする
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 確定
        description: 録音の画面で「貼り付けて送信」を選んで確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant VOL as システム音量
        participant MIC as マイク
        participant GUI as 録音の画面
        participant HIST as 履歴

        U->>SVC: 録音開始のホットキーを押す
        SVC->>SVC: ほかの録音・文字起こしが動いていないことを確かめ、処理中にする
        SVC->>TRAY: 録音中のアイコンにする
        SVC->>VOL: 録音中の音量へ下げる
        SVC->>MIC: 録音を始める
        SVC->>GUI: 録音の画面を開く（表示中は最前面を保つ）
        U->>MIC: 話す
        U->>GUI: 「貼り付けて送信」で確定する
        GUI->>SVC: 選んだ出力先を渡して閉じる
        SVC->>MIC: 録音を停止する
        SVC->>VOL: 録音前の音量へ戻す
        SVC->>HIST: 確定した録音を履歴に保存する
      ```
    expected:
      - 録音の画面が閉じている
      - 履歴に話した録音が保存されている
      - システム音量が録音前の値に戻っている
      - 選んだ出力先（貼り付けて送信）で 録音を文字に起こす へ進む
    test: test_normal
  - name: 正常シナリオ（一時停止して再開する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文を実時間で流す WAV
      - name: 一時停止
        description: 話している途中で一時停止し、一時停止の間も話し、再開する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant GUI as 録音の画面
        participant SVC as 常駐サービス
        participant MIC as マイク

        Note over GUI: 録音の画面を開くまでは 正常シナリオ と同じ
        U->>GUI: 一時停止する
        GUI->>SVC: 一時停止を渡す
        SVC->>MIC: 録音した音を貯めるのを停止する
        GUI-->>U: 一時停止中であることと、一時停止した時点の経過時間を示す
        U->>GUI: 再開する
        GUI->>SVC: 再開を渡す
        SVC->>MIC: 録音した音を貯めるのを再び始める
        Note over GUI: 確定から後は 正常シナリオ と同じ
      ```
    expected:
      - 履歴に保存した録音に、一時停止の間に話した声が入っていない
      - 経過時間が、一時停止の間を除いた長さを示している
    test: test_normal_when_pause_and_resume
  - name: 正常シナリオ（録音を取り消す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 録音中の音量
        description: 録音中にシステム音量を下げる設定にする
      - name: 貼り付け先
        description: 「常に手前に表示」でない窓（貼り付け先の入力欄）を前面に出してから録音を始める
      - name: 取り消し
        description: 録音の画面で取り消す
        notes: 「取り消し」のボタンと閉じるボタン（×）の 2 通り。parametrize で並べる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant GUI as 録音の画面
        participant SVC as 常駐サービス
        participant MIC as マイク
        participant VOL as システム音量
        participant TRAY as トレイ

        Note over GUI: 録音の画面を開くまでは 正常シナリオ と同じ
        U->>GUI: 取り消す（「取り消し」か ×）
        GUI->>SVC: 取り消しを渡して閉じる
        SVC->>MIC: 録音を停止し、貯めた音を捨てる
        SVC->>VOL: 録音前の音量へ戻す
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 録音の画面が閉じている
      - 履歴にこの録音が残っていない
      - システム音量が録音前の値に戻っている
      - トレイのアイコンが待機中に戻り、文字起こしへ進まない
      - 前面が録音を始める前の貼り付け先の窓に戻っている
    test: test_normal_when_cancel
  - name: 正常シナリオ（録音の画面を出さない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。入口は、API と、録音の画面を出さない設定での録音開始のホットキーの 2 通り。parametrize で並べる
      - name: 画面を出さない録音
        description: APIで録音を操作する が録音を始めるか、録音の画面を出さない設定でホットキーかトレイから始める
        notes: API から始めた録音は、設定によらず画面を出さない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IN as 入口（API・ホットキー・トレイ）
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant VOL as システム音量
        participant MIC as マイク
        participant HIST as 履歴

        IN->>SVC: 録音を始める
        SVC->>SVC: ほかの録音・文字起こしが動いていないことを確かめ、処理中にする
        SVC->>TRAY: 録音中のアイコンにする
        SVC->>VOL: 録音中の音量へ下げる
        SVC->>MIC: 録音を始める（画面は開かない）
        IN->>SVC: 確定する（API の完了か、確定のホットキー）
        SVC->>MIC: 録音を停止する
        SVC->>VOL: 録音前の音量へ戻す
        SVC->>HIST: 確定した録音を履歴に保存する
      ```
    expected:
      - 録音中に録音の画面が出ていない
      - 履歴に録音が保存されている
      - システム音量が録音前の値に戻っている
      - 録音を文字に起こす へ進む
    test: test_normal_when_no_window
  - name: 正常シナリオ（履歴を残さない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 履歴の保存
        description: 履歴を残さない設定にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant TMP as 一時の音声

        Note over SVC: 録音を停止して音量を戻すまでは 正常シナリオ と同じ
        SVC->>TMP: 確定した録音を一時の音声として保存する
      ```
    expected:
      - 履歴にこの録音が残っていない
      - 一時の音声（`%LOCALAPPDATA%\voice-paste\` の下）に録音があり、録音を文字に起こす へ進む
    test: test_normal_when_no_history
  - name: 異常シナリオ（処理中に開始が来る）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV を実時間で流す。API から始める録音の返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 処理中の録音
        description: API から始めた録音が録音中のときに、録音開始のホットキーを押す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant DLG as ダイアログ

        U->>SVC: 録音開始のホットキーを押す
        SVC->>SVC: ほかの録音が処理中で、開始を受け付けない
        SVC->>DLG: 処理中のため録音を始められないことを通知する
      ```
    expected:
      - 処理中のため録音を始められないことがダイアログで知らされている
      - 2 つ目の録音が始まっていない
      - 処理中の録音が録音中のまま続いている
    notes:
      API から来たとき: API の開始が処理中に来たときは、APIで録音を操作する の 異常シナリオ（処理中に開始が来る） がエラーを返す。
    test: test_error_when_busy
  - name: 異常シナリオ（マイクを開けない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、開くとマイクを開けないエラーを出すもの（マイクの欠落 の行）
      - name: 録音中の音量
        description: 録音中にシステム音量を下げる設定にする
      - name: マイクの欠落
        description: 録音の入力を、開くとマイクを開けないエラーを出すものに差し替え、録音の入力を開けないようにする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant VOL as システム音量
        participant MIC as マイク
        participant LOG as ログ

        U->>SVC: 録音開始のホットキーを押す
        SVC->>TRAY: 録音中のアイコンにする
        SVC->>VOL: 録音中の音量へ下げる
        SVC->>MIC: 録音を始めようとする
        MIC-->>SVC: 入力を開けない
        SVC->>VOL: 録音前の音量へ戻す
        SVC->>LOG: マイクを開けなかった理由を書く
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにし、録音を始められなかったことを通知する
      ```
    expected:
      - 録音の画面が開いていない
      - システム音量が録音前の値に戻っている
      - トレイのアイコンが待機中に戻り、録音を始められなかったことが知らされている
      - ログにマイクを開けなかった理由が書かれている
      - 録音開始のホットキーをもう一度受け付ける
    notes:
      API から来たとき: API の開始でマイクを開けなかったときは、APIで録音を操作する の 異常シナリオ（マイクを開けない） がエラーを返す。
    test: test_error_when_microphone_unavailable
  - name: 正常シナリオ（ほかの窓を前面に出す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: ほかの窓
        description: 「常に手前に表示」でない窓（貼り付け先の入力欄）を開いておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面
        participant WIN as ほかの窓

        U->>SVC: 録音を始める
        SVC->>GUI: 録音の画面を開く（表示中は最前面を保つ）
        U->>WIN: 前面に出す（繰り返す）
        GUI->>GUI: ほかの窓より上に残る
        U->>GUI: 「取り消し」で閉じる
      ```
    expected:
      - ほかの窓を前面に出すたびに、録音の画面がその窓より上にある
  - name: 正常シナリオ（主のモニターに出す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: モニター
        description: モニターを 2 枚以上つなぐ
        notes: 1 枚なら枚数を出して skip する
      - name: 表示位置
        description: カーソルのあるモニターに出さない設定にし、カーソルを主でないモニターに置く
        notes: '`ui.follow_cursor: false`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面

        U->>SVC: 録音を始める
        SVC->>GUI: 主のモニターの作業領域の、設定の位置に開く
        U->>GUI: 「取り消し」で閉じる
      ```
    expected:
      - 録音の画面が主のモニターの作業領域の中にある
  - name: 正常シナリオ（カーソルのあるモニターに出す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: モニター
        description: モニターを 2 枚以上つなぐ
        notes: 1 枚なら枚数を出して skip する。拡大率の違うモニターをつないだ環境でも流す
      - name: 表示位置
        description: カーソルのあるモニターに出す設定にする
        notes: '`ui.follow_cursor: true`'
      - name: 入口
        description: 主のモニターと、それ以外のモニターの中央にカーソルを置いて、それぞれ録音開始のホットキーを押す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面

        U->>SVC: カーソルを置いたモニターで録音開始のホットキーを押す
        SVC->>GUI: カーソルのあるモニターの作業領域の、設定の位置に開く
        U->>GUI: 「取り消し」で閉じる
      ```
    expected:
      - 録音の画面が、録音を始めたときにカーソルのあったモニターの作業領域の中にある（主のモニターとそれ以外のモニターの両方）
  - name: 正常シナリオ（録音の画面を動かす）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 動かす先
        description: 録音の画面を、開いた位置から同じモニターの作業領域の中の別の位置へドラッグする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面
        participant MIC as マイク

        U->>SVC: 録音を始める
        SVC->>GUI: 録音の画面を開く
        U->>GUI: 録音の画面をドラッグする
        GUI-->>U: ドラッグを放した位置へ動く
        U->>MIC: 話し続ける
        Note over GUI: 確定から後は 正常シナリオ と同じ
      ```
    expected:
      - 録音の画面が、ドラッグを放した位置にある
      - 動かしている間も録音が続き、経過時間が進み続けている
      - 動かした後も録音の画面のボタンで確定でき、録音を文字に起こす へ進む
  - name: 正常シナリオ（録音の画面を隠して戻す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文を実時間で流す WAV
      - name: 貼り付け先
        description: 「常に手前に表示」でない窓（貼り付け先の入力欄）を前面に出してから、録音開始のホットキーで録音を始める
      - name: 隠している間の操作
        description: 録音の画面を隠している間に行う操作
        notes: 何もしない・一時停止のホットキーで一時停止する の 2 通り。parametrize で並べる
      - name: 戻す手段
        description: 隠した録音の画面を戻す
        notes: トレイのアイコンの左クリック・トレイのメニューの「録音の画面を表示」・録音開始のホットキーの 3 通り。parametrize で並べる。録音開始のホットキーと同じホットキーの出力先を持たない設定にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant IN as 入口（トレイ・ホットキー）
        participant SVC as 常駐サービス
        participant GUI as 録音の画面
        participant MIC as マイク

        U->>IN: 録音開始のホットキーを押す
        IN->>SVC: 録音を始める
        SVC->>GUI: 録音の画面を開く
        U->>GUI: 録音の画面を隠す
        GUI-->>U: 録音の画面が消え、前面が貼り付け先へ戻る
        U->>MIC: 話し続ける（一時停止しなければ録音は続く）
        U->>IN: 録音の画面を戻す（トレイのアイコン・メニュー、または録音開始のホットキー）
        IN->>SVC: 録音の画面を戻す
        SVC->>GUI: フォーカスを取らずに録音の画面を表示する
        GUI-->>U: 隠していた間を含む経過時間と、今の状態を示す
        Note over GUI: 確定から後は 正常シナリオ と同じ
      ```
    expected:
      - 隠している間、録音の画面が出ておらず、トレイのアイコンが録音中のまま
      - 隠したときに、前面が録音を始める前の貼り付け先の窓に戻っている
      - 戻した録音の画面の経過時間が、隠していた間を含む長さを示している
      - 戻した録音の画面がフォーカスを取らず、前面が録音の画面でない
      - 録音開始のホットキーで戻した場合、戻した後も前面が貼り付け先の窓のまま（トレイのアイコン・メニューで戻すと、操作した時点で Windows が前面をタスクバーかメニューへ移すため、貼り付け先のままではない）
      - 履歴に保存した録音に、隠していた間に話した声が入っている
      - 隠している間に一時停止した場合、戻した録音の画面が一時停止中を示し、経過時間が一時停止した時点のままである
    test: test_normal_when_hide_and_restore
  - name: 正常シナリオ（隠したまま確定する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 確定
        description: 録音の画面を隠した後、戻さずに確定のホットキー（貼り付けて送信）で確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面
        participant MIC as マイク
        participant HIST as 履歴

        Note over GUI: 録音の画面を隠すまでは 正常シナリオ（録音の画面を隠して戻す） と同じ
        U->>SVC: 確定のホットキーを押す
        SVC->>MIC: 録音を停止する
        SVC->>HIST: 確定した録音を履歴に保存する
        U->>SVC: 届け終えた後、録音開始のホットキーで次の録音を始める
        SVC->>GUI: 録音の画面を開く
      ```
    expected:
      - 隠したままでも確定のホットキーで確定でき、選んだ出力先で 録音を文字に起こす へ進む
      - 次の録音では、録音の画面がいつもどおり出ている
    test: test_normal_when_confirm_while_hidden
  - name: 正常シナリオ（隠したまま取り消す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 取り消し
        description: 録音の画面を隠した後、戻さずに取り消しのホットキーで取り消す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant GUI as 録音の画面
        participant MIC as マイク
        participant TRAY as トレイ

        Note over GUI: 録音の画面を隠すまでは 正常シナリオ（録音の画面を隠して戻す） と同じ
        U->>SVC: 取り消しのホットキーを押す
        SVC->>MIC: 録音を停止し、貯めた音を捨てる
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
        U->>SVC: 録音開始のホットキーで次の録音を始める
        SVC->>GUI: 録音の画面を開く
      ```
    expected:
      - 履歴にこの録音が残っておらず、文字起こしへ進まない
      - トレイのアイコンが待機中に戻っている
      - 次の録音では、録音の画面がいつもどおり出ている
    test: test_normal_when_cancel_while_hidden
  - name: 正常シナリオ（録音を停止せずに無音で区切る）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV を実時間で流す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 連続録音
        description: APIで録音を操作する が連続録音を始める（画面は出さない）
      - name: 話し声
        description: 文を話し、区切りの無音の長さより長い間を置いて次の文を話す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IN as 入口（API）
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant VOL as システム音量
        participant MIC as マイク
        participant HIST as 履歴

        IN->>SVC: 連続録音を始める
        SVC->>SVC: ほかの録音・文字起こしが動いていないことを確かめ、処理中にする
        SVC->>TRAY: 録音中のアイコンにする
        SVC->>VOL: 録音中の音量へ下げる
        SVC->>MIC: 録音を始める（画面は開かない）
        loop 完了が来るまで
          MIC-->>SVC: 録った音
          SVC->>SVC: 話し声か無音かを判定する
          opt 話し声の後で無音が区切りの長さ以上続いた
            SVC->>SVC: そこまでを区間として切り出し、通し番号を付ける（録音は停止しない）
            SVC->>HIST: 区間の録音を履歴に保存する
            SVC->>SVC: 区間を 録音を文字に起こす へ渡す
          end
        end
        IN->>SVC: 完了する
        SVC->>MIC: 録音を停止する
        SVC->>VOL: 録音前の音量へ戻す
        opt 区間に切り出していない話し声が残っている（話し終えて無音が区切りの長さに届く前の完了を含む）
          SVC->>HIST: そこまでを最後の区間として履歴に保存し、録音を文字に起こす へ渡す
        end
      ```
    expected:
      - 区間を切り出している間もマイクの録音が停止していない
      - 話した文ごとに区間が切り出され、通し番号が 1 から 1 ずつ増えている
      - 区間を通し番号の順につなぐと、話した声が欠けていない
      - 話し声を含まない無音だけの間は区間になっていない
      - 区間ごとの録音が履歴に保存されている
      - 完了の後、システム音量が録音前の値に戻っている
      - 最後の文を話し終えて無音が区切りの長さに届く前に完了すると、その文が最後の区間として切り出されている
    notes:
      区切りの見つけ方: 話し声か無音かは Silero VAD で判定する。背景にノイズがあると、区切りの無音をわずかに超える間では区切れず、区間が長くなることがある。背景に人の声があると話し声と見分けられない。
    test: test_normal_when_split_by_silence
  - name: 正常シナリオ（話し続けて最大の長さで区切る）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文を区切りの無音に届かない間でつないだ WAV を実時間で流す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 連続録音
        description: APIで録音を操作する が連続録音を始める（画面は出さない）
      - name: 話し続ける声
        description: 区切りの無音の長さに届かない間だけで、区間の最大の長さを超えて話し続ける
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant MIC as マイク
        participant HIST as 履歴

        loop 完了が来るまで
          MIC-->>SVC: 録った音
          SVC->>SVC: 話し声か無音かを判定し、短い無音の位置を控える
          opt 区間が最大の長さに達した
            SVC->>SVC: 直近の短い無音の中（無ければ今の位置）で区切り、通し番号を付ける（録音は停止しない）
            SVC->>HIST: 区間の録音を履歴に保存する
            SVC->>SVC: 区間を 録音を文字に起こす へ渡す
          end
        end
      ```
    expected:
      - 切り出した区間の長さが、どれも区間の最大の長さに話し声の前の余白を加えた長さ以下である
      - 区間を通し番号の順につなぐと、話した声が欠けていない
      - 区切った後もマイクの録音が停止していない
    test: test_normal_when_split_by_max_length
  - name: 正常シナリオ（Wayland のセッションでホットキーから録音する）
    setup:
      - name: Mock
        description: なし（検証環境の VM を Ubuntu 24.04 の Wayland のセッションで起動し、実機で確かめる）
        notes: 録音の入力は PipeWire の仮想マイクへ流す WAV
      - name: ホットキー
        description: 録音開始と「貼り付けて送信」の確定に同じホットキーを設定し、常駐サービスが GNOME のカスタムショートカットへ登録している
        notes: 既定の `<cmd>+<alt>+d`
      - name: フォーカス
        description: ネイティブの Wayland のアプリ（GNOME のテキストエディター）の入力欄にフォーカスがある
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant GN as GNOME のカスタムショートカット
        participant SVC as 常駐サービス
        participant GUI as 録音の画面

        U->>GN: 録音開始のホットキーを押す
        GN->>SVC: 押されたホットキーを伝える
        SVC->>SVC: 待機中なので録音開始に振り分ける
        Note over SVC,GUI: 録音を始めて録音の画面を開くまでは 正常シナリオ と同じ
        U->>GN: 同じホットキーを押す
        GN->>SVC: 押されたホットキーを伝える
        SVC->>SVC: 録音中なので「貼り付けて送信」の確定に振り分ける
        SVC->>GUI: 録音の画面を閉じる
        Note over SVC: 録音の停止から履歴への保存までは 正常シナリオ と同じ
      ```
    expected:
      - 録音の画面が画面の中央に開き、貼り付け先のアプリがフォーカスを保っている
      - 履歴に話した録音が保存されている
      - 選んだ出力先（貼り付けて送信）で 録音を文字に起こす へ進む
lead: ホットキー・トレイ・API のどれかから録音を始め、確定して履歴に残すか取り消すまでの単一ユースケース。
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: 待機中に、ユーザーが録音開始のホットキーを押すかトレイのメニューから録音を始めるか、APIで録音を操作する が録音を始める
preconditions:
  - 常駐サービスが待機中で、ほかの録音・文字起こしを処理していない（処理中なら 異常シナリオ（処理中に開始が来る））
notes:
  確定・一時停止・取り消しの手段: |-
    ホットキー・トレイから始めた録音は、録音の画面のボタンと、どこにフォーカスがあっても効くホットキーで確定・一時停止・取り消しを行う。
    録音の画面は、設定でオンにした固定の出力先と、有効にしたカスタムプリセットごとに確定のボタンを並べ、ホットキーを持つボタンに同じ操作のホットキーを途中で切らずに出す。
    録音の画面を出さない設定では、トレイから始めても画面を出さず、ホットキーだけで操作する。
    API から始めた録音は、API の停止・完了で操作する（APIで録音を操作する）。
    録音の画面はドラッグで動かせ、閉じるボタン（×）は「取り消し」と同じく働く。
    録音中にその回だけ録音の画面を隠せ、隠している間もホットキーで確定・一時停止・取り消しを行える。
    隠した録音の画面は、トレイのアイコンの左クリック・トレイのメニューの「録音の画面を表示」・録音開始のホットキー（同じホットキーの出力先が無いとき）で戻す。
  E2E のテスト: |-
    E2E の常駐アプリの起こし方と操作の渡し方は、常駐アプリを起動する の補足『E2E のテスト』と同じ。
    録音の入力は WAV を流すもの（音声合成の文か無音）に、システム音量は下げた値と戻した値を控えるものに、貼り付けのキーは送信したキーを控えるものに差し替える（マイクを開かず、システム音量を変えず、キーを送信しない）。
    API から始める録音は起動した常駐アプリの API を呼び、返送先はテストが 127.0.0.1 に立てるエンドポイントにする。
    トレイのアイコンの左クリックと通知を押す操作は、アイコンが押されたシグナルと通知が押されたシグナルを渡す。
    「ほかの窓を前面に出す」「主のモニターに出す」「カーソルのあるモニターに出す」「録音の画面を動かす」は、Windows の窓の重なり・モニター・窓の移動を使い offscreen の Qt では起こせないため、E2E を置かない（画面の結合テストが、最前面を保つ指定・表示位置・ドラッグで動かす呼び出しを確かめる）。
    「録音を取り消す」「録音の画面を隠して戻す」の期待値のうち、前面の窓（Windows のフォアグラウンド）は E2E で確かめない。フォーカスを取らないことは、Qt のアクティブな窓が録音の画面でないことで確かめる
  Wayland のセッション: |-
    Linux の Wayland のセッションでは、押されたホットキーを GNOME のカスタムショートカットが受け、常駐サービスへ伝える（常駐アプリを起動する の補足『Wayland のセッションのホットキー』）。
    伝えられたホットキーは、Windows と Xorg のセッションと同じく、そのときの状態で録音開始・確定・一時停止・取り消しに振り分ける。
    録音の画面・文字起こし中の表示・トレイ・設定画面は XWayland で出す（ネイティブの Wayland では、画面を設定の位置に置けず、貼り付け先のフォーカスを取る）。
    Wayland のセッションのシナリオの E2E は、Linux で E2E を自動で流す仕組み（[#219](https://github.com/shuhei1101/voice-paste/issues/219)）ができるまで持たず、検証環境の VM で確かめる。
test_file: tests/e2e/単一ユースケース/test_record.py
