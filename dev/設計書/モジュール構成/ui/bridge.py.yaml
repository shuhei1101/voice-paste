id: MOD-32
title: 常駐アプリ / ホットキーと画面 / bridge.py
test_files:
  - tests/unit/voice_paste/ui/test_bridge.py
classes:
  - name: UiBridge
    title: 画面への橋渡し
    container: ui/bridge.py
    usecase: 共通
    role: アダプタ
    kind: クラス
    inherits: PySide6.QtCore.QObject
    summary: ほかのスレッド（API・ホットキー・ワーカースレッド）からの知らせを Signal でメインスレッドへ渡す。画面の部品はメインスレッドだけが触る
    properties:
      - name: notified
        type: Signal(str, object)
        description: 通知の種類と理由（str | None）
      - name: progressed
        type: Signal(float, float)
        description: 文字起こしの区間の終わりの時刻と録音の長さ（秒）
      - name: copied
        type: Signal(str)
        description: コピーの完了と起こした文字
    refs:
      - LIB-21#
    status: implemented
    description: メインスレッドで作り、受け手は `Qt.ConnectionType.QueuedConnection` でつなぐ（PoC で 100/100 がメインスレッドのスロットで動いた）。
functions:
  - name: notify
    title: ユーザーへの知らせ
    kind: 関数
    container: ui/bridge.py
    usecase: 共通
    scope: public
    thread_safe: true
    inherits: NotifyFn
    summary: UiBridge.notified を emit して、メインスレッドでトレイのアイコン・ダイアログ・画面を変える
    args:
      - name: event
        type: Literal["state_changed", "busy", "microphone_unavailable", "transcription_failed", "delivery_failed", "api_unavailable", "show_recording_window", "output_changed"]
        required: true
        passing: positional
        description: 通知の種類（show_recording_window は、録音開始のホットキーで隠した録音の画面を戻す指示。output_changed は、文字起こし中に届ける出力先を差し替えたこと）
      - name: detail
        type: str | None
        required: false
        default: None
        passing: positional
        description: 理由
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
    returns:
      type: None
      description: なし
    status: implemented
    process: |-
      1. `bridge.notified.emit(event, detail)` を呼ぶ
         - `[INFO]` / `[WARNING]` ユーザーへの知らせ（種類・理由。state_changed・show_recording_window・output_changed は INFO、それ以外は WARNING）
    unit_tests:
      - name: test_notify
        case: 正常
        summary: 知らせを Signal で渡す
        condition: event=delivery_failed、detail="クリップボードに書けない"
        mock: なし（notified に受け手をつなぐ）
        expected: 受け手に (delivery_failed, クリップボードに書けない) が届き、WARNING のログが 1 行出る
      - name: test_notify_from_other_thread
        case: 正常
        summary: ほかのスレッドからの知らせをメインスレッドで受ける
        condition: threading.Thread から notify(state_changed) を呼び、イベントループを回す
        mock: なし（QueuedConnection の受け手）
        expected: 受け手がメインスレッドで 1 回呼ばれる
  - name: report_progress
    title: 文字起こしの進みの知らせ
    container: ui/bridge.py
    usecase: 録音を文字に起こす
    summary: UiBridge.progressed を emit して、文字起こし中の表示の進みを変える
    kind: 関数
    inherits: ProgressFn
    scope: public
    thread_safe: true
    args:
      - name: position_sec
        type: float
        required: true
        passing: positional
        description: 起こし終えた区間の終わりの時刻
      - name: duration_sec
        type: float
        required: true
        passing: positional
        description: 録音の長さ
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
    returns:
      type: None
      description: なし
    unit_tests:
      - name: test_report_progress
        case: 正常
        summary: 進みを Signal で渡す
        condition: position_sec=3.1、duration_sec=5.0
        mock: なし（progressed に受け手をつなぐ）
        expected: 受け手に (3.1, 5.0) が届く
    status: implemented
  - name: notify_copied
    title: コピーの完了の知らせ
    container: ui/bridge.py
    usecase: 起こした文字を届ける
    summary: UiBridge.copied を emit して、メインスレッドでトレイにコピーの完了の通知を出す
    description: 起こした文字は「理由」を運ぶ notify の detail と分けて渡し、ログに書かない。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: クリップボードへ書いた起こした文字
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
    returns:
      type: None
      description: なし
    process: |-
      1. `bridge.copied.emit(text)` を呼ぶ
         - `[INFO]` ユーザーへの知らせ（copy_completed。起こした文字は書かない）
    unit_tests:
      - name: test_notify_copied
        case: 正常
        summary: 起こした文字を Signal で渡し、ログには書かない
        condition: text="テストの文字"
        mock: なし（copied に受け手をつなぐ）
        expected: 受け手に "テストの文字" が届き、INFO のログが 1 行出て、ログに "テストの文字" が含まれない
    status: planned
    refs:
      - SCR-2#elements[もう一度コピー]
