<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: 狭い幅でも見本を縦に積んで読めるようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>処理中のダイアログ | voice-paste のモック</title>
  <link rel="stylesheet" href="../../../../refs/37/assets/style.css">
</head>
<body>
  <main>
    <!-- パンくず -->
    <nav class="crumb" aria-label="パンくず"><a href="../../../">pages</a> / <a href="../../">busy-dialog</a> / <a href="../">339</a> / <span>a-file-busy</span></nav>

    <!-- 画面の説明 -->
    <header class="intro">
      <h1>処理中のダイアログ</h1>
      <p>#288 の理由ごとの本文に、トレイから指定した音声ファイルの文字起こしの処理中を足したもの。ほかの理由の本文は変えない。</p>
    </header>

    <div class="desk">
      <!-- 場面: 音声ファイルの文字起こしの処理中に録音開始のホットキーを押した -->
      <section class="specimen" aria-labelledby="h-file">
        <h2 id="h-file">音声ファイルの文字起こしの処理中に録音開始のホットキーを押した</h2>
        <div class="win dialog" role="alertdialog" aria-labelledby="d-file" aria-describedby="b-file">
          <div class="titlebar"><span class="titlebar__app">voice-paste</span><svg class="titlebar__close" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></div>
          <div class="dialog__main">
            <svg class="dialog__icon dialog__icon--info" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
            <div>
              <h3 id="d-file">録音を開始できませんでした</h3>
              <p id="b-file">音声ファイルを文字に起こして届けています。終わってから、もう一度録音開始のホットキーを押してください。</p>
            </div>
          </div>
          <div class="dialog__actions">
            <a class="btn btn--primary" href="../../../transcribing-indicator/339/a-file-name/index.html">閉じる</a>
          </div>
        </div>
        <p class="scene-note">閉じた後も音声ファイルの文字起こしは続き、終わると出力先へ届ける。Enter・Esc でも閉じる。</p>
      </section>
    </div>
  </main>
</body>
</html>
