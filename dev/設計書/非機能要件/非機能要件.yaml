        measurement: 応答のステータス
        expected: '202'
      - name: test_web_body_limit_when_at_limit
        summary: 上限ちょうどの本文を断る
        condition: 本文が 100,000,000 バイトになる webm の音声。Content-Length を付けたものと、付けずに chunked で送信するものの 2 通り
        measurement: 応答のステータスと、一時のフォルダのファイルの数
        expected: どちらも 413 で、一時のファイルが残っていない
    status: planned
    introduced:
      pr: 171
  - name: 画面の録音の上限時間
    english_name: web_recording_limit
    category: 耐障害
