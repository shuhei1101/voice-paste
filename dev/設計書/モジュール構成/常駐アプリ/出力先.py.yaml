      - name: get_open_delay_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 画面を開いてから貼り付けるまでの秒数を返す（呼ぶたびに設定の preset_options.browser.open_delay_sec を読む）
      - name: get_enter_delay_sec
