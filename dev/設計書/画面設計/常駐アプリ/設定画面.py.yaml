notes:
  まとまりと欄: |-
    | まとまり | キー | 欄の部品 |
    | --- | --- | --- |
    | 出力先 | `outputs[].enabled`（paste_and_send・paste_only・copy_only） | チェックボックス。右に `outputs[].hotkey` のホットキーの欄 |
    | 出力先（送るまでの間） | `outputs[paste_and_send].enter_delay_sec` | 数値の欄。補助文「「貼り付けて送信」と、「ブラウザ添付」の Enter まで送るプリセットで使う。」 |
    | 出力先（Enter と一緒に押す修飾キー） | `outputs[paste_and_send].enter_with_ctrl`・`enter_with_alt`・`enter_with_shift` | チェックボックス（Ctrl・Alt・Shift の順に縦に並べる） |
    | ブラウザ添付（カスタムプリセット） | `presets[]` のうち `kind = "browser"` の enabled・title・url・send_enter・hotkey | プリセットの一覧 |
    | ブラウザ添付（オプション） | `preset_options.browser.open_delay_sec` | 数値の欄。補助文「貼り付けてから Enter を送るまでの秒数は「出力先」の値を使う。」 |
    | エンドポイントへ送る（カスタムプリセット） | `presets[]` のうち `kind = "endpoint"` の enabled・title・url・authorization・hotkey | プリセットの一覧 |
    | エンドポイントへ送る（オプション） | `preset_options.endpoint.timeout_sec` | 数値の欄（0.5 刻み）。補助文「既定は 1.5 秒で、10 秒まで入れられる。この秒数で届かなければ、送り直さずにトレイで知らせる。」 |
    | ホットキー | `hotkeys.start`・`hotkeys.pause`・`hotkeys.cancel`・`keyboard.paste_key` | ホットキーの欄 |
    | 録音 | `recording.lower_volume`・`recording.hide_window` | チェックボックス |
    | 録音 | `recording.volume_percent` | つまみ（0〜100、右に %） |
    | 録音 | `recording.fade_sec` | 数値の欄 |
    | 文字起こし（エンジン） | `transcription.engine`・`transcription.local_whisper.model` | 選択の欄 |
    | 文字起こし（エンジン） | `transcription.local_whisper.device`・`transcription.local_whisper.compute_type` | ラジオボタン |
    | 文字起こし（エンジン） | `transcription.local_whisper.language` | 文字の欄 |
    | 文字起こし（詳しい調整） | `transcription.local_whisper` の cpu_threads・num_workers・beam_size・best_of・temperature・no_speech_threshold・vad_threshold・vad_min_speech_ms・vad_min_silence_ms | 数値の欄 |
    | 文字起こし（詳しい調整） | `transcription.local_whisper` の condition_on_previous_text・vad_filter | チェックボックス |
    | 文字起こし（用語集） | `glossary_path` | 文字の欄と「選ぶ…」 |
    | 画面 | `ui.topmost`・`ui.follow_cursor` | チェックボックス |
    | 画面 | `ui.position` | ラジオボタン（中央・左上・右上・左下・右下） |
    | 画面 | `ui.wave_gain` | 数値の欄 |
    | 履歴とログ | `history.enabled` | チェックボックス |
    | 履歴とログ | `history.retention_days`・`logging.retention_days` | 数値の欄 |
    | 履歴とログ | `logging.level` | ラジオボタン |
    | API | `api.port` | 数値の欄 |
    | API | `api.allowed_callback_hosts` | 複数行の文字の欄（1 行 = 1 ホスト） |
    | API（連続録音） | `api.continuous.min_silence_sec`・`api.continuous.session_limit_sec` | 数値の欄 |

    欄の部品は設定のモデルの型から決める（bool → チェックボックス、リテラルの列挙 → ラジオボタンか選択の欄、int・float → 数値の欄、str → 文字の欄、ホットキーの型 → ホットキーの欄）。上の表は欄の並びと、型からは決まらない部品（つまみ・プリセットの一覧・用語集の選ぶ…）を決める。
