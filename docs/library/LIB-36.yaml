id: LIB-36
visibility: internal
title: actions/upload-artifact
tags:
  - name: tool:github-actions
    main: true
  - name: topic:ci
lead: GitHub Actions のジョブのファイルを、実行の成果物として上げる action。
kind: サービス
adoption: 採用
dependency_scope: 開発のみ
used_in:
  - .github/workflows/test.yml
upstream: actions/upload-artifact
license: MIT
official_url: https://github.com/actions/upload-artifact
docs_url: https://github.com/actions/upload-artifact#readme
verification:
  state: 未確認
  detail: workflow_dispatch は既定のブランチ develop にある workflow だけを起動できるため、作業 PR の中では動かせない。develop へ入った後の作業 PR のランナーでの全件実行で確かめる
version:
  current: v7.0.2
  latest: v7.0.2
  checked_on: '2026-11-15'
  source: .github/workflows/test.yml
  pinning: メジャーバージョンのタグで指定する
catalogs:
  - name: action
    version: v7.0.2
    entries:
      - name: actions/upload-artifact@v7
        kind: action
        purpose: test.log を成果物 test-log に上げる
        params:
          - name: name
            type: '`string`'
            default: '`artifact`'
            description: 成果物の名前
            required: false
            verification_state: docs_only
          - name: path
            type: '`string`'
            description: 上げるファイルのパス
            required: true
            verification_state: docs_only
          - name: if-no-files-found
            type: '`warn` / `error` / `ignore`'
            default: '`warn`'
            description: 上げるファイルが無いときの扱い
            required: false
            verification_state: docs_only
