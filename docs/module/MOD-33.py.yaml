id: MOD-33
visibility: internal
title: 常駐アプリ / ホットキーと画面 / hotkey.py
test_files:
  - tests/unit/voice_paste/runtime/test_hotkey.py
classes:
  - name: HotkeyListener
    title: ホットキーの受付
    container: runtime/hotkey.py
    usecase: 録音する
    role: ランタイム
    summary: 設定のホットキーを pynput で受け付け、押されたら配線された関数を呼ぶ。録音セッションは import しない
    description: |-
      受付のスレッド（`pynput.keyboard.GlobalHotKeys`）を 1 つだけ持ち、張り直すときは止めてから新しく立てる。
      呼ぶ関数は pynput のスレッドで動くため、例外を握ってログに書き、受付を止めない。
    kind: クラス
    properties:
      - name: _listener
        type: keyboard.GlobalHotKeys | None
        access: 内部 (_)
        description: 動いている受付。start の前と stop の後は None
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: start・stop を 1 つずつにする
    methods:
      - name: start
        title: 受付の開始
        summary: ホットキーと関数の組を登録して受付を始める。動いていれば、新しい受付を作れたときだけ入れ替える
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: bindings
            type: dict[str, Callable[[], None]]
            required: true
            passing: positional
            description: pynput の書式のホットキー → 呼ぶ関数
        returns:
          type: None
          description: なし
        process: |-
          1. ロックを取る
          2. 各関数を例外を握る関数で包む
             - 呼んだ関数が例外を出した場合、握って受付を続ける
               - `[ERROR]` ホットキーの処理で想定外の例外（ホットキー。logger.exception）
          3. 新しい受付を先に作る（`GlobalHotKeys(包んだ組)`。作るときに pynput が書式を確かめる）
             - ValueError（書式を読めない）の場合、動いている受付をそのままにして HotkeyError を送出する
          4. 動いている受付があれば止め、スレッドの終わりを HOTKEY_STOP_TIMEOUT_SEC まで待つ（上限を過ぎたら stop と同じく手放して進む）
          5. 新しい受付を始める
             - `[INFO]` ホットキーの受付を始めた（ホットキーの一覧）
        exceptions:
          - name: HotkeyError
            condition: ホットキーの書式を pynput が読めない
        unit_tests:
          - name: test_start
            case: 正常
            summary: 登録したホットキーで関数を呼ぶ
            condition: '{"<ctrl>+<alt>+d": 関数} で始め、差し替えた GlobalHotKeys に渡った関数を呼ぶ'
            mock: keyboard.GlobalHotKeys
            expected: 関数が 1 回呼ばれる
          - name: test_start_when_restarted
            case: 正常
            summary: 張り直すと前の受付を止める
            condition: start を 2 回呼ぶ
            mock: keyboard.GlobalHotKeys
            expected: 1 つ目の受付の stop と join が呼ばれ、2 つ目だけが動いている
          - name: test_start_when_handler_raised
            case: 正常
            summary: 関数の例外で受付を止めない
            condition: 登録した関数が RuntimeError を送出する
            mock: keyboard.GlobalHotKeys
            expected: 例外が漏れず、ERROR のログが 1 行出て、もう一度呼ぶとまた呼ばれる
          - name: test_start_when_invalid_hotkey
            case: 異常
            summary: 読めない書式は断る
            condition: '{"<ctrl>+<nokey>": 関数}'
            mock: なし
            expected: HotkeyError が送出される
            exception: 書式を読めない
          - name: test_start_when_invalid_hotkey_while_running
            case: 異常
            summary: 張り直しに失敗しても前の受付を止めない
            condition: '{"<ctrl>+<alt>+d": 関数} で始めた後、{"<ctrl>+<nokey>": 関数} で start を呼ぶ'
            mock: keyboard.GlobalHotKeys（2 回目の生成が ValueError）
            expected: HotkeyError が送出され、1 つ目の受付の stop が呼ばれず、動いたまま
            exception: 書式を読めない
      - name: stop
        title: 受付の停止
        summary: 受付を止め、スレッドの終わりを HOTKEY_STOP_TIMEOUT_SEC まで待つ。上限を過ぎたら WARNING のログを書き、スレッドを手放して戻る。動いていなければ何もしない
        kind: メソッド
        scope: public
        thread_safe: true
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めた後は動いていない
            condition: start の後に stop を 2 回呼ぶ
            mock: keyboard.GlobalHotKeys
            expected: 受付の stop と join が 1 回ずつ呼ばれ、2 回目は例外が出ない
          - name: test_stop_when_join_timed_out
            case: 正常
            summary: スレッドが上限までに終わらなくても戻る
            condition: start の後、差し替えた GlobalHotKeys の join が戻っても is_alive が True を返す状態で stop を呼ぶ
            mock: keyboard.GlobalHotKeys
            expected: join に timeout=HOTKEY_STOP_TIMEOUT_SEC が渡り、例外が出ず、WARNING のログが 1 行出て、もう一度 start すると新しい受付だけが動いている
      - name: __init__
        title: 受付の用意
        summary: 受付はまだ始めない
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
    refs:
      - LIB-19#
    status: implemented
constants:
  - name: HOTKEY_STOP_TIMEOUT_SEC
    title: ホットキーの受付の終わりを待つ上限
    container: runtime/hotkey.py
    usecase: 録音する
    summary: HotkeyListener が止めた受付のスレッドの終わりを待つ上限（秒）。Linux の pynput は次のキー入力まで終わらないため、上限で手放す。値は非機能要件『ホットキーの受付の終わりを待つ時間』
    value: '0.5'
    status: planned
functions:
  - name: validate_hotkeys
    title: ホットキーの書式の確かめ
    container: runtime/hotkey.py
    usecase: 設定を変える
    summary: ホットキーを pynput が読めるかを、受付を始めずに確かめる（`keyboard.HotKey.parse`）
    kind: 関数
    scope: public
    args:
      - name: hotkeys
        type: Iterable[str]
        required: true
        passing: positional
        description: pynput の書式のホットキー
    returns:
      type: None
      description: なし
    exceptions:
      - name: HotkeyError
        condition: 読めないホットキーがある（メッセージにそのホットキーを出す）
    unit_tests:
      - name: test_validate_hotkeys
        case: 正常
        summary: 読める書式は通す
        condition: '["<ctrl>+<alt>+d", "<ctrl>+<shift>+<f5>"]'
        mock: なし
        expected: 例外が出ない
      - name: test_validate_hotkeys_when_invalid
        case: 異常
        summary: 読めない書式を断る
        condition: '["<ctrl>+<nokey>"]'
        mock: なし
        expected: HotkeyError が送出され、メッセージに <ctrl>+<nokey> が出る
        exception: 読めないホットキーがある
    refs:
      - LIB-19#
    status: implemented
