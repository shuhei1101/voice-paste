  - kind: single
    scenario: docs/scenario/SC-2.yaml
    impact: changed
    detail: トレイのメニューに履歴のフォルダを開く操作を追加し、メニューの項目の並びに音声ファイルを指定する項目を加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-9.yaml
    impact: changed
    detail: 録音のほかに、指定した音声ファイルを文字に起こす入力を受ける
    depends_on:
      - docs/scenario/SC-14.yaml
  - kind: single
    scenario: docs/scenario/SC-7.yaml
    impact: changed
    detail: 音声ファイルから起こした文字を、ホットキーから始めた録音と同じ出力先の選び方で届ける
    depends_on:
      - docs/scenario/SC-14.yaml
  - kind: single
    scenario: docs/scenario/SC-8.yaml
    impact: following
    detail: 音声ファイルの文字起こしの間は録音を始められないことに追随する
    depends_on:
      - docs/scenario/SC-15.yaml
  - kind: composite
    scenario: docs/scenario/SC-12.yaml
    impact: run_only
    detail: 文字起こしと届ける流れに入口を足すため、声で入力した文字を貼り付ける流れが壊れていないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-13.yaml
    impact: none
    detail: 外の端末のブラウザから音声ファイルを送信する流れは変えない
    depends_on: []
