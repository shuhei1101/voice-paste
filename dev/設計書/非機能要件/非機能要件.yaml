  - name: 終わったジョブを持つ件数
    english_name: web_finished_jobs_kept
    category: 保守性
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '100'
    unit: 件
    rationale: 終わったジョブ（done・failed）は、画面が結果を取りに来るまで常駐サービスのメモリに持つ。画面を閉じて後で再度開いても取りに来られるように、時間では捨てず件数で古い順に捨てる。画面が残す結果の件数（10 件）の 10 倍にし、30 分の録音の文字（約 2 万字・約 60 KB）が 100 件でも約 6 MB に収まる。常駐サービスを再起動すると全て消える（起こした文字は PC の履歴に残る）
    overflow: いちばん古く終わったジョブを捨て、その結果の取得は 404 になる
    measurement: ジョブを 101 件終わらせ、最初のジョブと最後のジョブの結果を取りに行く
    test_file: tests/nfr/test_web_finished_jobs_kept.py
    tests:
      - name: test_web_finished_jobs_kept
        summary: 終わったジョブが 100 件を超えると、いちばん古い件から 404 になる
        condition: 文字起こしのエンジンを決めた文をすぐ返す関数に差し替え、小さい webm を 101 回送信して全て done にする
        measurement: 1 件目・2 件目・101 件目の結果の取得のステータス
        expected: 1 件目が 404、2 件目と 101 件目が 200 で state が done
    status: planned
    introduced:
      pr: 171
  - name: ホットキーの受付の終わりを待つ時間
    english_name: hotkey_stop_timeout
    category: 可用性
    external_constraint: Linux（Xorg）の pynput 1.8.2 は、GlobalHotKeys.stop() の後も次のキー入力が届くまでリスナーのスレッドが終わらない（python-xlib の record の応答待ち）。Windows は停止がすぐに届く
    source_kind: 外部ライブラリの制限
    source: https://github.com/shuhei1101/voice-paste/pull/202#discussion_r4396904459
    value: '0.5'
    unit: 秒
    rationale: スレッドの終わりを待つのは、設定画面を開くとき・張り直すとき・終了の片付けで、いずれもメインスレッドを塞ぐ。Windows の待ちの実測が無いため、メインスレッドを塞いでも操作の応答が遅れて見えにくい 0.5 秒を仮に置き、実装の工程で Windows の stop から join が戻るまでを測って、その p99.9 に 50% の余裕を足しても 0.5 秒に収まることを確かめる。上限で手放したスレッドは daemon で、次のキー入力で終わり、プロセスの終了を妨げない
    measurement: Windows の実機で、pynput の GlobalHotKeys を始めてから stop し、join が戻るまでの時間を 100 回測る
    overflow: 上限を過ぎたら WARNING のログを書き、スレッドを手放して進む
    refs:
      - dev/設計書/モジュール構成/常駐アプリ/ホットキーと画面.py#constants[HOTKEY_STOP_TIMEOUT_SEC]
    status: planned
  - name: OpenAIの文字起こしのタイムアウトと再送
    english_name: openai_transcription_retry
    category: 耐障害
    external_constraint: OpenAI は文字起こしの応答時間を保証しない。公式の Python SDK は既定でタイムアウト 600 秒・接続 5 秒・再送 2 回・待ち 0.5 秒から上限 8 秒で、429・5xx・タイムアウト・接続の失敗を再送する
    source_kind: 外部 API の制限
    source: https://github.com/openai/openai-python/blob/main/src/openai/_constants.py
    value: タイムアウトを設けない・再送 2 回・間隔の基数 0.5 秒・待ちの上限 8 秒
    rationale: タイムアウトはユーザーの判断（[#232 の回答](https://github.com/shuhei1101/voice-paste/pull/232#discussion_r4431424473)）で、アプリ側では設けない。httpx の既定の 5 秒が掛からないよう、要求には timeout=None を渡す。再送は規約『資源の値の決め方』で導く。下流（OpenAI API）の実測が無いため、公開仕様の値として公式の SDK が公開する既定値を使う。外部疎通テストでは、約 3 秒の音声で 1.97 秒（2026-10-28、1 回）。再送は 1 層だけで、指数バックオフとフルジッター（再送の n 回目の前に、0 以上、基数 × 2^(n−1) 以下の乱数の秒数を待つ）にし、Retry-After があれば従う。文字起こしは同じ音声を送り直しても結果が変わらないため再送できる（課金は送信ごとにかかる）
    measurement: 単体テストで httpx.MockTransport に 503・タイムアウト・429 を返させ、再送の回数と待ちを確かめる。外部疎通テストで実際の応答の秒を記録する
    overflow: 再送しても失敗したら EngineError にして、文字起こしの失敗として扱う（録音は履歴に残る）
    breakdown:
      - part: タイムアウト
        value: 設けない
        notes: ユーザーの判断。timeout=None で接続・応答・書き込みの待ちに上限を掛けない
      - part: 再送の回数の上限
        value: 2 回
        notes: 最初の 1 回と合わせて最大 3 回
      - part: 間隔の基数
        value: 0.5 秒
        notes: 公式の SDK の既定
      - part: 待ちの上限（Retry-After の上限）
        value: 8 秒
        notes: 公式の SDK の既定。Retry-After がこれを超えるときは 8 秒で頭打ちにする
      - part: 文字起こしの最長
        value: 上限なし
        notes: タイムアウトを設けないため、応答か接続の失敗が返るまで待つ
    tests:
      - name: test_openai_transcription_retry
        summary: 一時的な失敗を上限まで送信し直す
        condition: httpx.MockTransport が 500 を 3 回返す。_sleep と _uniform を差し替える
        measurement: 要求の回数と _uniform に渡った上限
        expected: 要求は 3 回で、_uniform の上限は 0.5・1.0、EngineError が送出される
    refs:
      - dev/設計書/外部API/OpenAI#
    status: planned
    introduced:
      pr: 204
    test_file: tests/nfr/test_openai_transcription_retry.py
  - name: OpenAIへ送信する音声の上限
    english_name: openai_audio_limit
    category: 性能
    external_constraint: 音声のファイルは 25 MB 以下。形式はガイドでは mp3・mp4・mpeg・mpga・m4a・wav・webm（API リファレンスは flac・ogg も挙げる）
    source_kind: 外部 API の制限
    source: https://platform.openai.com/docs/guides/speech-to-text
    value: 26,204,569 バイト以下。拡張子が mp3・mp4・mpeg・mpga・m4a・wav・webm
    unit: バイト
    rationale: 規約『資源の値の決め方』の外部の上限がある量として、上限から要求の本文の固定の消費分と安全率を引き、送信する前に手元で確かめて弾く（上限が音声のファイルではなく multipart の本文全体と比べられても超えないようにする）。形式は公開された 2 つの一覧のうち狭い方（ガイド）に合わせる。ブラウザの本文の上限（100 MB 未満）より小さいため、この値を超えるブラウザの音声は OpenAI のエンジンではジョブの失敗になる
    overflow: 送信せずに EngineError にして、文字起こしの失敗として扱う（録音は履歴に残る）
    tests:
      - name: test_openai_audio_limit_when_over
        summary: 上限を 1 バイト超える音声は送信しない
        condition: 26,204,569 バイトと 26,204,570 バイトの webm。モデルは gpt-transcribe、手がかりは 1 バイトの語 56 個を読点でつないだ 221 バイト
        measurement: httpx.MockTransport に届いた要求の数
        expected: 26,204,569 バイトは 1 回届き、届いた要求の本文が 26,214,400 バイト以下。26,204,570 バイトは届かず EngineError
    refs:
      - dev/設計書/外部API/OpenAI#
    status: planned
    introduced:
      pr: 204
    breakdown:
      - part: 外部の上限
        value: 26,214,400 バイト
        notes: 25 MB（25 × 1,048,576）
      - part: 固定の消費分
        value: − 8,192 バイト
        notes: 手がかりを keywords[] で渡すときが最も大きい。手がかりの上限 222 バイト（HINT_MAX_BYTES）に 1 バイトの語を読点（3 バイト）でつなぐと最大 56 語で、語ごとのパートの境界・Content-Disposition（100 バイト未満）と、model・languages[]・response_format・file の各パートのヘッダー（200 バイト未満）を含め、切り上げて 8 KiB を見込む
      - part: 安全率
        value: − 1,639 バイト
        notes: 固定の消費分の 20%（規約『資源の値の決め方』の既定値。1,638.4 を切り上げ）
    test_file: tests/nfr/test_openai_audio_limit.py
  - name: OpenAIの文字起こしの料金
    english_name: openai_transcription_cost
    category: コスト
    external_constraint: gpt-transcribe は音声 1 分あたり $0.0045
    source_kind: 外部 API の制限
    source: https://developers.openai.com/api/docs/models/gpt-transcribe
    value: 既定のモデルは gpt-transcribe。常駐アプリは料金の上限を持たない
    rationale: 文字起こし 1 回の料金は音声の長さで決まり、利用者が契約する OpenAI のアカウントにかかる。上限は利用者が OpenAI の管理画面の利用の上限で持つ（超えると 429 が返り、再送しても失敗したら文字起こしの失敗になる）。送信し直すごとに課金されうるため、再送は一時的な失敗だけにする
    refs:
      - dev/設計書/外部API/OpenAI#
    status: planned
    introduced:
