id: MOD-8
visibility: internal
title: "常駐アプリ / 外部連携"
lead: 文字起こしワーカーの子プロセス・OpenAI API の文字起こし・システム音量・キーボードとクリップボード・ブラウザ添付の画面を開くブラウザ・HTTP の POST・話し声の判定（Silero VAD）を包むアダプタ。feature の関数型を満たし、外の例外をアプリの例外に変える。
directory: |-
  ```
  src/voice_paste/integrations/
  ├── whisper/
  │   ├── client.py     # WhisperWorkerClient（子プロセスの起動・監視・立て直し・やり直し）・ensure_local_whisper_installed
  │   └── worker.py     # 子プロセスの本体（文字起こしワーカーのサブシステム）
  ├── openai/
  │   ├── credentials.py # read_openai_api_key（環境変数か秘匿のファイルから API キーを読む）
  │   └── transcriber.py # OpenAITranscriber（OpenAI API の文字起こしへ httpx で送信する）
  ├── haas/
  │   ├── server.py     # HaasServer（WSL のサーバーの起動・応答の確認・停止）
  │   └── transcriber.py # HaasTranscriber（Haas の文字起こしのサーバーへ httpx で送信する）
  ├── audio/
  │   └── probe.py      # probe_audio（受けた音声を PyAV で開いて容れ物・秒数を読む）
  ├── vad/
  │   ├── adapter.py    # load_vad_session・StreamingVad（同梱の Silero VAD を onnxruntime で窓ごとに流す）
  │   └── assets/
  │       ├── silero_vad_v6.onnx # faster-whisper 1.2.1 が同梱するものと同じ Silero VAD のモデル（MIT）
  │       └── LICENSE.silero-vad # Silero VAD の MIT のライセンスの全文
  ├── volume/
  │   ├── adapter.py    # lower_volume・restore_volume（pycaw を == で固定して包む。Windows だけが読み込む）
  │   └── noop.py       # lower_volume_noop・restore_volume_noop（Linux の、音量を変えない実装）
  ├── keyboard/
  │   ├── sender.py     # copy_to_clipboard・use_xclip_clipboard・split_paste_key・send_paste・send_enter・TERMINAL_WM_CLASSES
  │   ├── sender_linux.py # send_paste_linux（Linux。端末アプリなら Ctrl+Shift+V にし、主キーを XTEST で送信する）
  │   ├── sender_wayland.py # UInputKeyboard（Linux の Wayland のセッション。python-evdev の UInput の仮想キーボードで貼り付けのキーと Enter を送信する）
  │   ├── active_window_linux.py # read_active_wm_class（Linux。python-xlib でアクティブなウィンドウの WM_CLASS を読む）
  │   └── active_window_wayland.py # read_focused_wm_class（Linux の Wayland のセッション。拡張 Focused Window D-Bus からフォーカスしているウィンドウの wm_class を読む）
  ├── browser/
  │   ├── opener.py     # open_app_window（Windows。Edge の --app で開き、無ければ既定のブラウザ）
  │   └── opener_linux.py # open_app_window_linux（Linux。Chromium 系の --app で開き、無ければ既定のブラウザ）
  └── http/
      ├── types.py      # PostResult・PostJsonFn
      └── client.py     # post_json（httpx）
  ```
notes:
  Wayland のキーの送信のテスト: integrations/keyboard/sender_wayland.py の単体テストのファイルは `tests/unit/voice_paste/integrations/keyboard/test_sender_wayland.py`。evdev は Linux だけの依存のため、Windows では skip する。evdev.UInput を差し替えて write の並びで確認し、実物の `/dev/uinput` は検証環境の VM での通しの確認で確認する。
