id: MOD-94
title: 文字起こしワーカー / ワーカー / protocol.py
data_models:
  - name: WorkerMessage
    title: ワーカーのメッセージ
    container: integrations/whisper/protocol.py
    usecase: 録音を文字に起こす
    role: DTO
    summary: 標準入出力でやり取りする 1 行の JSON。type で種類を分ける
    properties:
      - name: type
        type: Literal["config", "ready", "transcribe", "progress", "result", "error"]
        description: config（常駐 → ワーカー。モデル・デバイス・量子化）/ ready（ワーカー → 常駐）/ transcribe（常駐 → ワーカー。録音のパスと言語・ビーム幅・温度・VAD）/ progress（区間の終わりの時刻）/ result（区間ごとの文字）/ error（理由）
      - name: payload
        type: dict
        description: '種類ごとの中身。config: model・device・compute_type・cpu_threads・num_workers・log_dir / transcribe: audio_path・language・beam_size・best_of・temperature・vad_filter・vad_threshold・vad_min_speech_ms・vad_min_silence_ms・condition_on_previous_text・no_speech_threshold・hotwords（省ける。文字起こしの手がかり） / progress: end・duration（秒） / result: segments（前後の空白を除き空でない区間の文字の並び） / error: message'
    status: implemented
