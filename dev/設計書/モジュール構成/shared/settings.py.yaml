  - name: HaasSettings
    title: Haas の文字起こしのサーバーの設定
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    role: 設定のモデル
    summary: Haas の文字起こしのサーバーを動かす WSL のディストリビューション・待ち受けのポートと、認識の調整の値
    description: |-
      反映は distribution・port・model・dtype・device が restart（サーバーの起動で決まる）、ほかは immediate（送信するたびに読む）。設定画面は `json_schema_extra` の note で、欄ごとの補助文（画面設計『設定画面』の補足『まとまりと欄』）を欄の下に出し、dtype は choice_labels（HAAS_DTYPE_LABELS）でラジオボタンの名前を出す。
      `field_validator` が、前後の空白を除いて空の model を `PydanticCustomError`（type `haas_model_empty`）、HAAS_DEVICE_PATTERN に合わない device を（type `haas_device_form`）、HAAS_SEPARATOR_MAX_LENGTH 文字を超える separator を（type `haas_separator_too_long`）にする。数値の範囲は `Field` の ge・le で断る。
      範囲はインターフェース定義『音声を文字に起こす』『準備できたかを返す』の制約と同じにする（サーバーは別のサブシステムで import できないため、値は両方に持つ）。
    inherits: pydantic.BaseModel
    properties:
      - name: distribution
        type: str
        default: "''"
        description: '`wsl.exe -d` に渡すディストリビューションの名前。空なら `-d` を付けない'
      - name: port
        type: int
        default: '47824'
        description: サーバーが待ち受けるポート。`ge=1024`・`le=65535`
      - name: model
        type: str
        default: third-intelligence/Haas-ja-v1.0
        description: サーバーが読み込むモデル（Hugging Face Hub の名前か WSL の中の .nemo のパス）。restart
      - name: dtype
        type: Literal["auto", "bfloat16", "float16", "float32"]
        default: auto
        description: 計算の精度。restart
      - name: device
        type: str
        default: cuda
        description: 装置（cuda・cuda:{番号}・cpu）。restart
      - name: short_audio_limit_sec
        type: float
        default: '30.0'
        description: 一度に起こす音声の長さの上限。`ge=1.0`・`le=60.0`
      - name: batch_size
        type: int
        default: '64'
        description: まとめて起こす区切りの数。`ge=1`・`le=256`
      - name: alpha
        type: float
        default: '2.0'
        description: 手がかりの強さ。`ge=0.0`・`le=10.0`
      - name: guard
        type: bool
        default: 'true'
        description: 手がかりの採否の守り
      - name: chunk_sec
        type: float
        default: '30.0'
        description: 長い音声を区切る長さ。`ge=1.0`・`le=60.0`
      - name: search_sec
        type: float
        default: '2.0'
        description: 静かな箇所を探す幅。`ge=0.0`・`le=10.0`
      - name: window_sec
        type: float
        default: '0.1'
        description: 静かさを測る窓。`ge=0.01`・`le=1.0`
      - name: separator
        type: str
        default: "''"
        description: 区切って起こした文字をつなぐ文字
    refs:
      - CFG-1#settings[transcription.haas.distribution]
      - CFG-1#settings[transcription.haas.port]
      - CFG-1#settings[transcription.haas.model]
      - CFG-1#settings[transcription.haas.dtype]
      - CFG-1#settings[transcription.haas.device]
      - CFG-1#settings[transcription.haas.short_audio_limit_sec]
      - CFG-1#settings[transcription.haas.batch_size]
      - CFG-1#settings[transcription.haas.alpha]
      - CFG-1#settings[transcription.haas.guard]
      - CFG-1#settings[transcription.haas.chunk_sec]
      - CFG-1#settings[transcription.haas.search_sec]
      - CFG-1#settings[transcription.haas.window_sec]
      - CFG-1#settings[transcription.haas.separator]
    status: planned
