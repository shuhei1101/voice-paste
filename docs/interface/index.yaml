summary: サブシステムの外部インターフェースと処理フロー（サブシステム結合テストの元）
items:
- page: IF-10.py.yaml
  summary: POST /sessions。画面を出さない録音（連続録音を含む）を始めて録音セッションの ID を返す
- page: IF-8.py.yaml
  summary: POST /sessions/{session_id}/stop。録音を停止して完了を待つ
- page: IF-9.py.yaml
  summary: POST /sessions/{session_id}/complete。録音を確定して文字起こしを始める
- page: IF-3.py.yaml
  summary: API から始めた録音の結果（連続録音は区間ごとと終わり）を、開始で指定されたコールバック先へ送信する
- page: IF-2.py.yaml
  summary: 完了が来ないまま録音セッションの上限時間に達した API の録音を打ち切り、履歴に残してコールバック先へ通知する
- page: IF-7.py.yaml
  summary: 起こした文字を、設定の送信先のエンドポイントへ JSON で 1 回送信する
- page: IF-6.py.yaml
  summary: GET /web/。外の端末のブラウザで開く文字起こしの画面と素材を返す
- page: IF-11.py.yaml
  summary: POST /web/transcriptions。ブラウザから送信された音声を積んでジョブの ID を返す
- page: IF-4.py.yaml
  summary: GET /web/transcriptions/{job_id}。ジョブの状態・進み具合と、起こした文字か失敗の理由を返す
- page: IF-1.py.yaml
  summary: 受け付けたブラウザの音声を 1 件ずつ起こして補正し、履歴とジョブに残す
- page: IF-5.py.yaml
  summary: GET /web/glossary-presets。外の端末の画面が選ぶ用語集のプリセットの名前の一覧と、設定で選んでいるプリセットを返す
- page: IF-12.py.yaml
  summary: POST /transcriptions。受けた音声を Haas-ja-v1.0 で文字に起こして返す
- page: IF-13.py.yaml
  summary: GET /health。モデルを読み込み終えたことを返す
- page: IF-14.py.yaml
  summary: POST /shutdown。常駐アプリが起動したサーバーを止める
