summary: "常駐アプリの録音の画面・文字起こし中の表示・トレイ・設定画面とダイアログ、外の端末の文字起こしの画面"
docs_index: true
items:
  - page: 録音の画面.py.yaml
    summary: 録音中の状態・経過時間・波形と、一時停止・取り消し・出力先を選んでの確定
  - page: 文字起こし中の表示.py.yaml
    summary: 確定から届けるまでの経過と残りの時間を、フォーカスを取らずに出す
  - page: トレイ.py.yaml
    summary: 状態ごとのアイコンと、録音・設定・フォルダ・再起動・終了のメニュー
  - page: トレイの通知.py.yaml
    summary: 裏の処理で起きた失敗と、「コピーのみ」のコピーの完了を Windows の通知で知らせる
  - page: 処理中のダイアログ.py.yaml
    summary: API の録音の処理中に録音開始のホットキーを押したときに、始められない理由を知らせる
  - page: 設定画面.py.yaml
    summary: 設定の全てのキーをまとまりに並べ、確かめてから保存する
  - page: 変えた値を捨てる確認.py.yaml
    summary: 設定画面で変えた値を捨てて閉じるかを確かめる
  - page: 既定に戻す確認.py.yaml
    summary: 全ての設定を既定の値へ戻すかを確かめる
  - page: 外の端末の文字起こしの画面.html.yaml
    summary: 外の端末のブラウザで録るかファイルを送信し、文字起こしの結果を受け取ってコピーする
  - page: 取り消せない操作の確認.html.yaml
    summary: 外の端末の画面で、結果の削除と文字起こし前の音声の置換を確かめる
