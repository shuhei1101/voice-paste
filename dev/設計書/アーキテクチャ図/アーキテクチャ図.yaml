title: "アーキテクチャ図"
overview:
  direction: LR
  nodes:
    - id: U
      label: ユーザー
      shape: stadium
      kind: actor
    - id: CALLER
      label: API の呼び出し元（同じ端末のほかのプロセス）
      shape: stadium
      kind: actor
    - id: APP
      label: 常駐アプリ（API・トレイ・ホットキー・画面）
      kind: process
    - id: WORKER
      label: 文字起こしワーカー（子プロセス）
      kind: process
    - id: ENV
      label: 設定（settings.toml）
      shape: cylinder
      kind: store
    - id: HIST
      label: 履歴・ログ・トークン
      shape: cylinder
      kind: store
    - id: TARGET
      label: アクティブなアプリ
      kind: external
    - id: HF
      label: Hugging Face Hub
      kind: external
    - id: EDGE
      label: Microsoft Edge
      kind: external
    - id: EP
      label: 設定の送り先のエンドポイント
      kind: external
  edges:
    - from: U
      to: APP
      label: ホットキー・トレイ・音声
    - from: CALLER
      to: APP
      label: 開始・停止・完了（127.0.0.1・トークン）
    - from: APP
      to: CALLER
      label: 起こした文字の返送
    - from: APP
      to: ENV
      label: 読み書き
    - from: APP
      to: WORKER
      label: 録音のパス（JSON Lines）
    - from: WORKER
      to: HF
      label: モデルの取得
    - from: APP
      to: HIST
      label: 書き込み
    - from: APP
      to: TARGET
      label: 貼り付け
    - from: APP
      to: EDGE
      label: 子プロセス
    - from: APP
      to: EP
      label: 起こした文字（POST）
  subgraphs:
    - id: SYS
      label: voice-paste
      nodes:
        - APP
        - WORKER
        - ENV
        - HIST
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/voice-paste
subsystems:
  - name: 常駐アプリ
    scope: desktop-app
    role: ショートカットから起動する 1 つの常駐サービス。ホットキー・トレイ・API のどの入口からも同じセッション（録音 → 文字起こし → 補正 → 出力先）を同時に 1 つだけ動かし、画面とトレイを出す（ローカルの文字起こしは文字起こしワーカーに任せる）
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows）
    implementation: src/voice_paste/main.py
  - name: 文字起こしワーカー
    scope: transcription-worker
    role: 常駐アプリの子プロセスとしてローカルの Whisper のモデルを持ち、標準入出力の JSON Lines で受けた録音を文字に起こす
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows。常駐アプリが起動し、落ちたら起動し直す）
    implementation: src/voice_paste/integrations/whisper/worker.py
lead: voice-paste のサブシステムと、ユーザー・貼り付け先のアプリ・文字起こしのモデルの取得元との境界。
external_systems:
  - name: Hugging Face Hub
    purpose: faster-whisper のモデルの取得（手元に無いときだけ）
    direction: 受信のみ
    protocol: HTTPS（faster-whisper が取得する）
    notes:
      事前確認: 文字起こしワーカーの起動時に、モデルを読み込めることを確かめる（手元に無ければその時点で取得する）。
    detail: dev/設計書/外部API/Hugging_Face_Hub#
  - name: Microsoft Edge
    purpose: AI 送信のボタンで AI チャットの画面を開く
    direction: 送信のみ
    protocol: 子プロセスの起動（`--app={URL}`）
    notes:
      事前確認: 不要。開けなかったときはそのボタンの操作だけが失敗し、音声入力には影響しない。
    detail: dev/設計書/外部ライブラリ/Microsoft_Edge#
  - name: API の呼び出し元
    purpose: 同じ端末のほかのプロセスが録音を開始・停止・完了し、指定したエンドポイントで起こした文字を受け取る
    direction: 双方向
    protocol: HTTP（127.0.0.1・Bearer のトークン。返送は呼び出し元のエンドポイントへ POST）
    notes:
      事前確認: 起動時に API の待ち受けを始められたか（uvicorn の started）を確かめ、始められなければトレイで知らせてホットキーだけで続ける。返送先は開始の要求を受けたときに許されるホストかを確かめる。届くかは返送のたびに確かめ、届かなくても常駐アプリを止めない。
    detail: dev/設計書/インターフェース定義/常駐アプリ/録音を開始する.py#
  - name: 設定の送り先のエンドポイント
    purpose: ホットキー・トレイから始めた録音を「エンドポイントへ送る」で確定したときに、起こした文字を受け取る
    direction: 送信のみ
    protocol: HTTP / HTTPS の POST（設定の URL。任意で `Authorization` ヘッダー）
    notes:
      事前確認: 不要。届くかは送るたびに確かめ、届かなければトレイで知らせて常駐アプリを止めない。
    detail: dev/設計書/インターフェース定義/常駐アプリ/設定のエンドポイントへ送る.py#
constraints: |-
  - Windows で動かす（トレイ・ホットキー・クリップボード・キー入力・システムの音量を Windows の機能で扱う）
  - Windows のショートカットから起動できる（手段はバッチファイルに限らない）
  - ビルドせず、master のソースをそのまま動かす
  - Python で書く
  - API は 127.0.0.1 だけで待ち受け、起動ごとのトークンで照合する
  - ローカルの文字起こしは GPU（CUDA）で動かす
  - ユーザーは master のコードをビルドせずに普段使いしている（ショートカットは起動のバッチファイルから常駐アプリを起動する）
