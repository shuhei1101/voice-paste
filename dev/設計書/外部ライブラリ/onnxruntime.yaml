id: LIB-15
title: "onnxruntime"
kind: "ライブラリ"
version:
  current: 1.31.0
  checked_on: '2026-10-10'
  source: pyproject.toml（~=1.25）と uv.lock のバージョン。faster-whisper の依存としても入る
  pinning: 互換リリースで固定（~=1.25）
catalogs:
  - name: API
    version: 1.25.0
    entries:
      - name: SessionOptions
        kind: クラス
        purpose: 推論のスレッド数を 1 にし、ログを抑える（faster-whisper の SileroVADModel と同じ inter_op_num_threads=1・intra_op_num_threads=1・enable_cpu_mem_arena=False・log_severity_level=4）
      - name: InferenceSession
        kind: クラス
        purpose: Silero VAD の ONNX を CPUExecutionProvider で開き、run(None, {input, h, c}) で窓ごとの話し声の確率と次の状態を求める
lead: ONNX 形式のモデルを CPU・GPU で推論する実行環境。
purl: pkg:pypi/onnxruntime
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/vad/adapter.py
upstream: microsoft/onnxruntime
verification:
  state: 済
  date: '2026-10-10'
  detail: '作業 PR #78 の venv（Windows・onnxruntime 1.25.0）で、`importlib.util.find_spec("faster_whisper").submodule_search_locations[0]` に `assets/silero_vad_v6.onnx` をつなぎ、SessionOptions（inter_op 1・intra_op 1・mem arena 無し・log 4）と CPUExecutionProvider で開いた。入力は `input`（seq_len, 576）・`h`・`c`（どちらも 1, 1, 128）、出力は `speech_probs`・`hn`・`cn` で、`run(None, {input: (1, 576), h, c})` で確率 (1,) と次の h・c (1, 1, 128) が返った。開いた後も `faster_whisper`・`ctranslate2` は `sys.modules` に無く、プロセスに CUDA の DLL も無い（[レビューでの確認](https://github.com/shuhei1101/voice-paste/pull/78#discussion_r4235543437)）'
license: MIT（商用利用可）
official_url: https://onnxruntime.ai/
docs_url: https://onnxruntime.ai/docs/api/python/api_summary.html
