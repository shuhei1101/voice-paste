<h1>トレイの通知</h1>
<p>ショートカットで補正に使用する用語集のプリセットを切り替えたことを知らせる通知。数秒で畳まれ、通知センターに残る。</p>
</header>
<div class="desk">
<section class="specimen" aria-labelledby="h-switched">
<h2 id="h-switched">用語集のプリセットを切り替えた</h2>
<div class="win toast" role="status" aria-labelledby="t-switched">
<p class="toast__meta">voice-paste</p>
<p class="toast__title" id="t-switched"><span class="ticon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></span>用語集のプリセットを切り替えました</p>
<p class="toast__body">次の録音から「会議」で補正します。</p>
</div>
<p class="scene-note">すでにそのプリセットのときも同じ通知を出す。録音中に押したときも同じ文面で、その回は始めたときのプリセットで補正する。操作のボタンは置かない。</p>
</section>
