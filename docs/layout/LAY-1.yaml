gitignore:
  - pattern: .env
    reason: 秘匿値を持つ環境変数
  - pattern: .env.migrated
    reason: 環境変数を設定ファイルへ移した後に残る、移行前の `.env`（秘匿値）
  - pattern: venv/
    reason: Python の仮想環境
  - pattern: .venv/
    reason: Python の仮想環境
  - pattern: node_modules/
    reason: Node.js の開発用の依存
  - pattern: __pycache__/
    reason: Python のキャッシュ
  - pattern: "*.pyc"
    reason: Python のキャッシュ
  - pattern: "*.pyo"
    reason: Python のキャッシュ
  - pattern: "*.pyd"
    reason: Python の拡張モジュールの生成物
  - pattern: .Python
    reason: 仮想環境の生成物
  - pattern: log/
    reason: 実行時のログ
  - pattern: cache/
    reason: 一時音声ファイルなどのキャッシュ
  - pattern: /history/
    reason: 実行時に生成する履歴
  - pattern: voice_paste.pid
    reason: シングルインスタンス制御の一時ファイル
  - pattern: build/
    reason: ビルドの生成物
  - pattern: dist/
    reason: ビルドの生成物
  - pattern: "*.egg-info/"
    reason: パッケージの生成物
  - pattern: .vscode/
    reason: 利用者ごとのエディタの設定
  - pattern: .idea/
    reason: 利用者ごとのエディタの設定
  - pattern: .DS_Store
    reason: OS が作るファイル
  - pattern: Thumbs.db
    reason: OS が作るファイル
  - pattern: "*.local.*"
    reason: checkout ごとの上書きの設定
  - pattern: docs/generated/
    reason: YAML の設計書から生成した Markdown
  - pattern: .claude/worktrees/
    reason: Claude Code の作業ブランチの worktree
refs:
  - ARCH-1#subsystems
  - CMD-1#categories
notes:
  目次と行のファイル: |-
    `docs/{種類}/`（設計書と公開ドキュメントの種類のフォルダ）の `index.yaml` と、そこから生成する `README.md` は、エントリに記載しない。
    `README.md` は `CMD-1#categories[ビルド・生成]` の publish で生成する。
    フォルダの `content_types` は、`index.yaml`・`README.md`・`files.yml` を除いた中身で決める。
tags:
  - name: topic:フォルダ
    main: true
  - name: topic:構成
  - name: topic:リポジトリ
