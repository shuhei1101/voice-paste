title: "常駐アプリ / 出力先"
lead: 起こした文字の届け方を出力先ごとのサブフォルダに分け、一覧への登録で足せる形にする。出力先どうしは import しない。
directory: |-
  ```
  src/voice_paste/features/outputs/
  ├── __init__.py          # deliver・OUTPUTS・is_callback_allowed の公開
  ├── types.py             # 出力先の関数型・出力先の定義
  ├── registry.py          # OUTPUTS（出力先の一覧。足すときはここに 1 行足す）
  ├── service.py           # deliver（入口と設定で出力先を選んで呼ぶ）
  ├── paste_and_send/
  │   └── service.py       # paste_and_send（貼り付けて送信）
  ├── paste_only/
  │   └── service.py       # paste_only（貼り付けのみ）
  ├── copy_only/
  │   └── service.py       # copy_only（コピーのみ）
  ├── ai_chat/
  │   └── service.py       # send_to_ai_chat（AI チャットへ送る。Edge のアプリの画面）
  └── callback/            # 呼び出し元へ返す
      ├── types.py         # 返送の中身（pydantic）・返送の応答
      ├── client.py        # post_json（httpx）
      └── service.py       # deliver_to_caller・is_callback_allowed
  ```

  各出力先はクリップボード・キー・ブラウザの操作を関数で受け取り、`integrations` を import しない（main.py が外部連携の copy_to_clipboard・send_paste・send_enter・open_app_window を部分適用する）。
data_models:
  - name: OutputSpec
    title: 出力先の定義
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: 出力先の ID・表示名・届ける関数の組
    properties:
      - name: id
        type: str
        description: 出力先の ID。設定の出力先の一覧と確定の操作がこの ID で指す
        example: paste_and_send
      - name: title
        type: str
        description: '画面に出す名前（文言は #21 で決める）'
      - name: handler
        type: OutputFn
        description: 届ける関数
      - name: api_only
        type: bool
        default: 'False'
        description: API から始めた録音だけが使うか（呼び出し元へ返すだけが True）
    status: implemented
  - name: CallbackPayload
    title: 返送の中身
    container: features/outputs/callback/types.py
    usecase: 起こした文字を届ける
    role: スキーマ
    summary: 呼び出し元へ送る JSON
    inherits: pydantic.BaseModel
    properties:
      - name: session_id
        type: str
        description: セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated"]
        description: 結果の種類
      - name: text
        type: str
        description: 起こした文字（空もある）
      - name: error
        type: str | None
        description: 失敗の理由
    refs:
      - dev/設計書/インターフェース定義/常駐アプリ/呼び出し元へ返す.py#
    status: implemented
  - name: PostResult
    title: 返送の応答
    container: features/outputs/callback/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: post_json が返す、返送先のステータスと再送までに待つ秒数
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: status
        type: int
        description: 返送先が返したステータス
      - name: retry_after_sec
        type: float | None
        description: Retry-After を秒に直した値。無い・読めないときは None
    status: implemented
function_types:
  - name: OutputFn
    title: 出力先
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    summary: 1 つの出力先へ結果を届ける。届けられなければ DeliveryError
    args:
      - name: outcome
        type: TranscriptionOutcome
        description: 届ける結果
      - name: target
        type: str | None
        description: 出力先に固有の宛先（AI チャットの送り先の URL・返送先の URL）。持たない出力先は None
    returns:
      type: None
      description: なし
    implementations:
      - target: paste_and_send
        notes: クリップボードへ書き、貼り付けのキーと Enter を送る
      - target: paste_only
        notes: クリップボードへ書き、貼り付けのキーを送る
      - target: copy_only
        notes: クリップボードへ書く
      - target: send_to_ai_chat
        notes: Edge のアプリの画面を開いて貼り付けて送る
      - target: deliver_to_caller
        notes: 返送先へ POST する。API から始めた録音だけが使う
    status: implemented
constants:
  - name: OUTPUTS
    title: 出力先の一覧
    container: features/outputs/registry.py
    usecase: 起こした文字を届ける
    summary: 登録した出力先。出力先を 1 つ足すときに既存のモジュールで変えるのはここだけ（品質シナリオ 5）
    entries:
      - key: '0'
        value: OutputSpec(id="paste_and_send", title="貼り付けて送信", handler=paste_and_send)
        description: 貼り付けて送信
      - key: '1'
        value: OutputSpec(id="paste_only", title="貼り付けのみ", handler=paste_only)
        description: 貼り付けのみ
      - key: '2'
        value: OutputSpec(id="copy_only", title="コピーのみ", handler=copy_only)
        description: コピーのみ
      - key: '3'
        value: OutputSpec(id="ai_chat", title="AI チャットへ送る", handler=send_to_ai_chat)
        description: AI チャットへ送る
      - key: '4'
        value: OutputSpec(id="callback", title="呼び出し元へ返す", handler=deliver_to_caller, api_only=True)
        description: 呼び出し元へ返す
    status: implemented
    notes:
      配線: 各 handler が受け取るクリップボード・キー・ブラウザの操作と設定の値は、main.py が出力先の ID ごとに部分適用する（起動と配線の _wire_outputs）。
functions:
  - name: deliver
    title: 出力先への配送
    kind: 関数
    container: features/outputs/service.py
    usecase: 起こした文字を届ける
    role: サービス
    scope: public
    inherits: DeliverFn（main.py でセッションを分けて渡す）
    summary: 入口と設定で出力先を 1 つ選んで届ける
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: 入口
      - name: output_id
        type: str | None
        required: true
        passing: positional
        description: 確定の操作で選んだ出力先の ID（API のときは None）
      - name: output_target
        type: str | None
        required: true
        passing: positional
        description: 確定の操作で選んだ出力先に固有の宛先（AI チャットの送り先の URL。持たない出力先と API のときは None）
      - name: callback_url
        type: str | None
        required: true
        passing: positional
        description: 返送先（API のときだけ）
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: enabled_ids
        type: frozenset[str]
        required: true
        passing: injected
        description: 設定でオンにした出力先の ID
      - name: outputs
        type: Sequence[OutputSpec]
        required: true
        passing: injected
        description: 出力先の一覧（OUTPUTS）
    returns:
      type: None
      description: なし
    process: |-
      1. 入口が api なら、呼び出し元へ返す出力先を選び、返送先を宛先にする（設定のオン・オフによらない）
      2. それ以外は、セッションで選んだ出力先を選び、output_target を宛先にする
         - 選んだ出力先が無いかオフの場合、UnknownOutputError を送出する
      3. 選んだ出力先の関数で届ける
         - `[INFO]` 出力先へ渡した（セッションの ID・出力先の ID）
    exceptions:
      - name: UnknownOutputError
        condition: 選んだ出力先が一覧に無いか、設定でオフ
    unit_tests:
      - name: test_deliver_when_api_session
        case: 正常
        summary: API のセッションは呼び出し元へ返すだけ
        condition: 入口が api、設定で paste_and_send がオン
        mock: 各出力先の handler
        expected: callback の handler だけが返送先と共に呼ばれ、paste_and_send は呼ばれない
      - name: test_deliver_when_hotkey_session
        case: 正常
        summary: ホットキーのセッションは選んだ出力先へ届ける
        condition: 入口が hotkey、output_id が paste_only でオン
        mock: 各出力先の handler
        expected: paste_only の handler だけが呼ばれる
      - name: test_deliver_when_output_disabled
        case: 異常
        summary: オフの出力先は届けない
        condition: output_id が ai_chat で設定でオフ
        mock: 各出力先の handler
        expected: UnknownOutputError が送出される
        exception: 設定でオフ
      - name: test_deliver_when_output_target
        case: 正常
        summary: 選んだ送り先を宛先として渡す
        condition: 入口が hotkey、output_id が ai_chat でオン、output_target が https://chatgpt.com
        mock: 各出力先の handler
        expected: ai_chat の handler だけが outcome と https://chatgpt.com で呼ばれる
    status: implemented
  - name: is_callback_allowed
    title: 返送先の確かめ
    kind: 関数
    container: features/outputs/callback/service.py
    usecase: APIで録音を操作する
    scope: public
    summary: 返送先のホストが loopback か設定で許可したホストかを確かめる
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 返送先
      - name: allowed_hosts
        type: frozenset[str]
        required: true
        passing: injected
        description: 設定で許可したホスト
    returns:
      type: bool
      description: 許されるか
    unit_tests:
      - name: test_is_callback_allowed_when_loopback
        case: 正常
        summary: loopback は許す
        condition: http://127.0.0.1:9000/x・http://localhost/x・http://[::1]/x
        mock: なし
        expected: どれも True
      - name: test_is_callback_allowed_when_allowed_host
        case: 正常
        summary: 許可したホストは許す
        condition: allowed_hosts にホストがある
        mock: なし
        expected: 'True'
      - name: test_is_callback_allowed_when_other_host
        case: 正常
        summary: それ以外は許さない
        condition: http://example.com/x
        mock: なし
        expected: 'False'
    status: implemented
  - name: deliver_to_caller
    title: 呼び出し元へ返す
    kind: 関数
    container: features/outputs/callback/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: OutputFn
    summary: 返送先へ結果を POST し、届かなければ決めた回数まで再送する
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: target
        type: str | None
        required: true
        passing: positional
        description: 返送先
      - name: post
        type: Callable[[str, dict], PostResult]
        required: true
        passing: injected
        description: 返送先へ JSON を POST してステータスと Retry-After を返す（タイムアウトを部分適用した post_json）
      - name: allowed_hosts
        type: frozenset[str]
        required: true
        passing: injected
        description: 設定で許可したホスト
      - name: retry_count
        type: int
        required: true
        passing: injected
        description: 非機能要件の返送の再送回数
      - name: retry_base_sec
        type: float
        required: true
        passing: injected
        description: 非機能要件の返送の再送の間隔の基数（回ごとに 2 倍にする）
      - name: sleep
        type: Callable[[float], None]
        required: true
        passing: injected
        description: 間を置く（time.sleep。テストで差し替える）
      - name: jitter
        type: Callable[[float], float]
        required: true
        passing: injected
        description: 0 以上この値以下の乱数を返す（random.uniform(0, x)。テストで差し替える）
    returns:
      type: None
      description: なし
    process: |-
      1. 返送先が許されるかをもう一度確かめる（返送先の確かめ）
         - 許されない場合、DeliveryError を送出する
      2. 返送の中身（CallbackPayload）を作り、1 + 再送回数まで POST する
         - 2xx なら終える
           - `[INFO]` 返送先へ届けた（セッションの ID・result・回数）
         - 一時的な失敗（5xx・408・429 か DeliveryError。タイムアウト・接続できない）で次の回がある場合、待ちを置いて次へ
           - 待ちは、Retry-After があればその秒数、無ければ jitter(retry_base_sec × 2^(回数−1))（指数バックオフとフルジッター）
           - Retry-After が retry_base_sec × 2^(再送回数−1)（待ちの上限）を超える場合、待たずに 3 へ（返送の間はセッションが残り次の開始を断るため、待ちを決めた上限に収める）
           - `[WARNING]` 返送に失敗した（セッションの ID・回数・理由）
         - それ以外のステータス（408・429 を除く 4xx など、送り直しても変わらない応答）の場合、再送せずに 3 へ
      3. 届かなかったらログに書いて終える（送出しない。履歴は残っている）
         - `[ERROR]` 返送先に届かなかった（セッションの ID・最後の理由）
    exceptions:
      - name: DeliveryError
        condition: 返送先が許されない（開始の後に設定が変わった）
    unit_tests:
      - name: test_deliver_to_caller
        case: 正常
        summary: 1 回で届く
        condition: post が 200
        mock: post・sleep・jitter
        expected: post が 1 回、session_id・result・text・error を持つ dict で呼ばれ、sleep が呼ばれない
      - name: test_deliver_to_caller_when_retry_succeeds
        case: 正常
        summary: 再送で届く
        condition: post が 500 → DeliveryError → 200、再送回数 2、retry_base_sec 1.0、jitter は受けた値をそのまま返す
        mock: post・sleep・jitter
        expected: post が 3 回呼ばれ、sleep に 1.0・2.0 がこの順で渡り、例外が出ない
      - name: test_deliver_to_caller_when_retry_after
        case: 正常
        summary: Retry-After に従う
        condition: post が 429（Retry-After 1.5）→ 200、再送回数 2、retry_base_sec 1.0
        mock: post・sleep・jitter
        expected: sleep に 1.5 が渡り、jitter が呼ばれず、post が 2 回呼ばれる
      - name: test_deliver_to_caller_when_retry_after_too_long
        case: 正常
        summary: 待ちの上限を超える Retry-After は待たずに終える
        condition: post が 503（Retry-After 60）、再送回数 2、retry_base_sec 1.0（待ちの上限 2.0）
        mock: post・sleep・jitter
        expected: post が 1 回だけ呼ばれ、sleep が呼ばれず、ERROR のログが 1 行出る
      - name: test_deliver_to_caller_when_client_error
        case: 正常
        summary: 送り直しても変わらない 4xx は再送しない
        condition: post が 404、再送回数 2
        mock: post・sleep・jitter
        expected: post が 1 回だけ呼ばれ、sleep が呼ばれず、ERROR のログが 1 行出る
      - name: test_deliver_to_caller_when_unreachable
        case: 正常
        summary: 届かなければログに書いて終える
        condition: post が常に 500、再送回数 2
        mock: post・sleep・jitter
        expected: post が 3 回、sleep が 2 回呼ばれ、例外が出ず、ERROR のログが 1 行出る
      - name: test_deliver_to_caller_when_not_allowed
        case: 異常
        summary: 許されない返送先へは送らない
        condition: target が http://example.com/x
        mock: post・sleep・jitter
        expected: DeliveryError が送出され、post が呼ばれない
        exception: 返送先が許されない
    refs:
      - dev/設計書/外部ライブラリ/httpx#
      - dev/設計書/インターフェース定義/常駐アプリ/呼び出し元へ返す.py#
    status: implemented
  - name: paste_and_send
    title: 貼り付けて送信
    kind: 関数
    container: features/outputs/paste_and_send/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: OutputFn
    summary: クリップボードへ書き、貼り付けのキーと、設定の間を置いて Enter を送る
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: target
        type: str | None
        required: true
        passing: positional
        description: 使わない（OutputFn に合わせて受ける）
      - name: copy
        type: Callable[[str], None]
        required: true
        passing: injected
        description: クリップボードへ書く（copy_to_clipboard。書けなければ DeliveryError）
      - name: paste
        type: Callable[[], None]
        required: true
        passing: injected
        description: 貼り付けのキーを送る（呼ぶたびに設定の keyboard.paste_key を読んで send_paste を呼ぶ）
      - name: send_enter
        type: Callable[[], None]
        required: true
        passing: injected
        description: Enter を送る
      - name: sleep
        type: Callable[[float], None]
        required: true
        passing: injected
        description: 間を置く（time.sleep。テストで差し替える）
      - name: get_enter_delay_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 貼り付けてから Enter を送るまでの秒数を返す（呼ぶたびに設定の outputs[paste_and_send].enter_delay_sec を読む）
    returns:
      type: None
      description: なし
    process: |-
      1. outcome.text をクリップボードへ書く
      2. 貼り付けのキーを送る
      3. get_enter_delay_sec() の秒数だけ待ち、Enter を送る
         - 1 が DeliveryError を送出した場合、キーを送らずにそのまま送出する
    exceptions:
      - name: DeliveryError
        condition: クリップボードへ書けない
    unit_tests:
      - name: test_paste_and_send
        case: 正常
        summary: コピー・貼り付け・待ち・Enter の順に送る
        condition: outcome.text が「テスト」、get_enter_delay_sec が 0.5 を返す
        mock: copy・paste・send_enter・sleep・get_enter_delay_sec
        expected: copy("テスト")・paste()・sleep(0.5)・send_enter() の順に 1 回ずつ呼ばれる
      - name: test_paste_and_send_when_copy_failed
        case: 異常
        summary: クリップボードへ書けなければキーを送らない
        condition: copy が DeliveryError を送出する
        mock: copy・paste・send_enter・sleep
        expected: DeliveryError が送出され、paste・send_enter が呼ばれない
        exception: クリップボードへ書けない
    status: implemented
  - name: paste_only
    title: 貼り付けのみ
    kind: 関数
    container: features/outputs/paste_only/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: OutputFn
    summary: クリップボードへ書き、貼り付けのキーを送る
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: target
        type: str | None
        required: true
        passing: positional
        description: 使わない（OutputFn に合わせて受ける）
      - name: copy
        type: Callable[[str], None]
        required: true
        passing: injected
        description: クリップボードへ書く（copy_to_clipboard）
      - name: paste
        type: Callable[[], None]
        required: true
        passing: injected
        description: 貼り付けのキーを送る（設定の keyboard.paste_key を部分適用した send_paste）
    returns:
      type: None
      description: なし
    process: |-
      1. outcome.text をクリップボードへ書く
      2. 貼り付けのキーを送る
         - 1 が DeliveryError を送出した場合、キーを送らずにそのまま送出する
    exceptions:
      - name: DeliveryError
        condition: クリップボードへ書けない
    unit_tests:
      - name: test_paste_only
        case: 正常
        summary: コピーして貼り付ける
        condition: outcome.text が「テスト」
        mock: copy・paste
        expected: copy("テスト")・paste() の順に 1 回ずつ呼ばれる
      - name: test_paste_only_when_copy_failed
        case: 異常
        summary: クリップボードへ書けなければ貼り付けない
        condition: copy が DeliveryError を送出する
        mock: copy・paste
        expected: DeliveryError が送出され、paste が呼ばれない
        exception: クリップボードへ書けない
    status: implemented
  - name: copy_only
    title: コピーのみ
    kind: 関数
    container: features/outputs/copy_only/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: OutputFn
    summary: クリップボードへ書く
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: target
        type: str | None
        required: true
        passing: positional
        description: 使わない（OutputFn に合わせて受ける）
      - name: copy
        type: Callable[[str], None]
        required: true
        passing: injected
        description: クリップボードへ書く（copy_to_clipboard）
    returns:
      type: None
      description: なし
    process: |-
      1. outcome.text をクリップボードへ書く
         - DeliveryError はそのまま送出する
    exceptions:
      - name: DeliveryError
        condition: クリップボードへ書けない
    unit_tests:
      - name: test_copy_only
        case: 正常
        summary: クリップボードへ書くだけ
        condition: outcome.text が「テスト」
        mock: copy
        expected: copy("テスト") が 1 回呼ばれる
    status: implemented
  - name: send_to_ai_chat
    title: AI チャットへ送る
    kind: 関数
    container: features/outputs/ai_chat/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: OutputFn
    summary: 選んだ送り先（設定の AI チャットの一覧の 1 つ）の URL を Edge のアプリの画面で開き、設定の間を置いて貼り付けて送る
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: target
        type: str | None
        required: true
        passing: positional
        description: 確定の操作で選んだ送り先の URL
      - name: copy
        type: Callable[[str], None]
        required: true
        passing: injected
        description: クリップボードへ書く（copy_to_clipboard）
      - name: open_window
        type: Callable[[str], None]
        required: true
        passing: injected
        description: URL をアプリのウィンドウで開く（open_app_window。開けなければ DeliveryError）
      - name: paste
        type: Callable[[], None]
        required: true
        passing: injected
        description: 貼り付けのキーを送る（呼ぶたびに設定の keyboard.paste_key を読んで send_paste を呼ぶ）
      - name: send_enter
        type: Callable[[], None]
        required: true
        passing: injected
        description: Enter を送る
      - name: sleep
        type: Callable[[float], None]
        required: true
        passing: injected
        description: 間を置く（time.sleep。テストで差し替える）
      - name: get_open_delay_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 画面を開いてから貼り付けるまでの秒数を返す（呼ぶたびに設定の outputs[ai_chat].open_delay_sec を読む）
      - name: get_enter_delay_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 貼り付けてから Enter を送るまでの秒数を返す（呼ぶたびに設定の outputs[paste_and_send].enter_delay_sec を読む。voice_paste_legacy と同じく貼り付けて送信の間を使う）
    returns:
      type: None
      description: なし
    process: |-
      1. target が None の場合、DeliveryError を送出する（送り先を選ばずに確定した）
      2. outcome.text をクリップボードへ書く
      3. target をアプリのウィンドウで開く
      4. get_open_delay_sec() の秒数だけ待ち、貼り付けのキーを送る
      5. get_enter_delay_sec() の秒数だけ待ち、Enter を送る
         - 2・3 が DeliveryError を送出した場合、そこで止めてそのまま送出する
         - `[INFO]` AI チャットへ送った（セッションの ID・target）
    exceptions:
      - name: DeliveryError
        condition: 送り先が無い・クリップボードへ書けない・画面を開けない
    unit_tests:
      - name: test_send_to_ai_chat
        case: 正常
        summary: コピー・開く・待ち・貼り付け・待ち・Enter の順に送る
        condition: outcome.text が「テスト」、target が https://chatgpt.com、get_open_delay_sec が 3.0・get_enter_delay_sec が 0.5 を返す
        mock: copy・open_window・paste・send_enter・sleep・get_open_delay_sec・get_enter_delay_sec
        expected: copy("テスト")・open_window("https://chatgpt.com")・sleep(3.0)・paste()・sleep(0.5)・send_enter() の順に呼ばれる
      - name: test_send_to_ai_chat_when_no_target
        case: 異常
        summary: 送り先が無ければ何もしない
        condition: target が None
        mock: copy・open_window・paste・send_enter・sleep
        expected: DeliveryError が送出され、copy・open_window が呼ばれない
        exception: 送り先が無い
      - name: test_send_to_ai_chat_when_open_failed
        case: 異常
        summary: 画面を開けなければ貼り付けない
        condition: open_window が DeliveryError を送出する
        mock: copy・open_window・paste・send_enter・sleep
        expected: DeliveryError が送出され、paste・send_enter が呼ばれない
        exception: 画面を開けない
    refs:
      - dev/設計書/外部ライブラリ/Microsoft_Edge#
    status: implemented
  - name: post_json
    title: 返送先への POST
    kind: 関数
    container: features/outputs/callback/client.py
    usecase: 起こした文字を届ける
    role: client
    scope: public
    summary: httpx で JSON を POST してステータスと Retry-After を返す。タイムアウトと接続できないことは DeliveryError に変える
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 返送先
      - name: payload
        type: dict
        required: true
        passing: positional
        description: 送る JSON
      - name: timeout_sec
        type: float
        required: true
        passing: injected
        description: 非機能要件の返送のタイムアウト
    returns:
      type: PostResult
      description: 返送先が返したステータスと Retry-After
    process: |-
      1. httpx.Client(timeout=timeout_sec, follow_redirects=False) で POST する（リダイレクトで許していないホストへ行かない）
         - httpx.TransportError（タイムアウト・接続できない）の場合、DeliveryError を送出する
      2. Retry-After を秒に直す（秒数はそのまま、HTTP の日付は今の時刻からの差。負の値は 0 にそろえる。無い・読めない場合は None）
      3. ステータスと Retry-After を PostResult で返す（2xx 以外でも送出しない）
    exceptions:
      - name: DeliveryError
        condition: タイムアウトか接続できない
    unit_tests:
      - name: test_post_json
        case: 正常
        summary: JSON を送ってステータスを返す
        condition: 受け口が 204 を返す
        mock: httpx.MockTransport
        expected: status 204・retry_after_sec None が返り、受け口に Content-Type application/json で payload が届いている
      - name: test_post_json_when_retry_after_seconds
        case: 正常
        summary: 秒数の Retry-After を返す
        condition: '受け口が 429 と Retry-After: 3 を返す'
        mock: httpx.MockTransport
        expected: status 429・retry_after_sec 3.0 が返る
      - name: test_post_json_when_retry_after_invalid
        case: 正常
        summary: 読めない Retry-After は None
        condition: '受け口が 503 と Retry-After: soon を返す'
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec None が返る
      - name: test_post_json_when_redirected
        case: 正常
        summary: リダイレクトを追わない
        condition: 受け口が 307 で別のホストを指す
        mock: httpx.MockTransport
        expected: status 307 が返り、別のホストへの要求が出ない
      - name: test_post_json_when_timeout
        case: 異常
        summary: タイムアウトは DeliveryError
        condition: 受け口が httpx.ReadTimeout を送出する
        mock: httpx.MockTransport
        expected: DeliveryError が送出される
        exception: タイムアウトか接続できない
      - name: test_post_json_when_retry_after_past_date
        case: 正常
        summary: 過去の日付の Retry-After は 0
        condition: 受け口が 503 と、今より 1 分前の HTTP の日付の Retry-After を返す
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec 0.0 が返る
    refs:
      - dev/設計書/外部ライブラリ/httpx#
    status: implemented
test_files:
  - tests/unit/voice_paste/features/outputs/test_service.py
  - tests/unit/voice_paste/features/outputs/paste_and_send/test_service.py
  - tests/unit/voice_paste/features/outputs/paste_only/test_service.py
  - tests/unit/voice_paste/features/outputs/copy_only/test_service.py
  - tests/unit/voice_paste/features/outputs/ai_chat/test_service.py
  - tests/unit/voice_paste/features/outputs/callback/test_service.py
  - tests/unit/voice_paste/features/outputs/callback/test_client.py
