id: MOD-40
visibility: internal
title: 常駐アプリ / ホットキーと画面 / indicator_style.py
classes:
  - name: IndicatorStyle
    title: マーカーを描くスタイル
    container: ui/indicator_style.py
    usecase: 共通
    role: アダプタ
    kind: クラス
    inherits: PySide6.QtWidgets.QProxyStyle
    summary: チェックボックスの箱・ラジオボタンの丸を、Qt の既定のスタイルに任せず theme_color の色で描く。それ以外の部品は包んだスタイルのまま描く
    description: アプリ全体のスタイルシートを当てると、Windows 11 のスタイルはオンのチェックボックスの箱と選んだラジオボタンのマーカーを描かなくなる。マーカーはこのスタイルが QPainter で描き、スタイルシートは `::indicator` の規則を持たない（規則が無いマーカーはスタイルシートがこのスタイルの drawPrimitive へ回す）。選択欄の開くマーカーは、`::drop-down` に規則を置くとこのスタイルへ回らないため、build_stylesheet が `::down-arrow` の画像で描く。色は描くたびに theme_color で引くため、明暗を当て直しても作り直さない。大きさは tokens.toml の `[shape]` の `indicator`（箱と丸の一辺、16px）と `indicator_dot`（選んだ点の直径、8px）。色の役割は画面設計『設定画面』の補足「マーカーの見え方」のとおり。単体テストは test_style.py に置く
    methods:
      - name: drawPrimitive
        title: マーカーの描画
        summary: チェックボックス・ラジオボタンのマーカーを状態に合わせた色で描き、ほかの要素は包んだスタイルへ渡す
        kind: メソッド
        scope: public
        inherits: QProxyStyle.drawPrimitive
        args:
          - name: element
            type: QStyle.PrimitiveElement
            required: true
            passing: positional
            description: 描く要素
          - name: option
            type: QStyleOption
            required: true
            passing: positional
            description: 状態（State_On・State_Enabled・State_MouseOver）と描く範囲
          - name: painter
            type: QPainter
            required: true
            passing: positional
            description: 描く先
          - name: widget
            type: QWidget | None
            required: false
            default: None
            passing: positional
            description: 描く部品
        returns:
          type: None
          description: なし
        process: |-
          1. 要素で分ける
             - PE_IndicatorCheckBox: 角を 4px 丸めた箱を描く。オンなら箱を accent_fg で塗り、surface の線でチェックを描く。オフなら sunken で塗り text_muted の線で囲む（マウスを重ねていれば線を accent_fg）。使えなければ線を border にし、オンの箱を border で塗りチェックを text_muted で描く
             - PE_IndicatorRadioButton: 丸を描く。選んでいれば線を accent_fg にし、中に accent_fg の点を描く。選んでいなければ sunken で塗り text_muted の線で囲む（マウスを重ねていれば線を accent_fg）。使えなければ線を border にし、選んだ点を text_muted で描き丸の中は塗らない
             - それ以外: 包んだスタイルの drawPrimitive へ渡す
        unit_tests:
          - name: test_draw_checkbox_when_on
            case: 正常
            summary: オンの箱を accent_fg で塗りチェックを surface で描く
            condition: apply_theme(app, "light") の後、オンの QCheckBox を grab した画像。QT_QPA_PLATFORM=offscreen
            mock: なし
            expected: 箱の中に tokens.toml の light の accent_fg と surface の色の画素がある
          - name: test_draw_checkbox_when_off
            case: 正常
            summary: オフの箱は塗らず text_muted の線で囲む
            condition: apply_theme(app, "dark") の後、オフの QCheckBox を grab した画像。QT_QPA_PLATFORM=offscreen
            mock: なし
            expected: 箱の縁に dark の text_muted の画素があり、accent_fg の画素が無い
          - name: test_draw_checkbox_when_disabled
            case: 正常
            summary: 使えないオンの箱を border で塗りチェックを text_muted で描く
            condition: apply_theme(app, "light") の後、使えないオンの QCheckBox を grab した画像。QT_QPA_PLATFORM=offscreen
            mock: なし
            expected: 箱の中に light の border と text_muted の画素があり、accent_fg の画素が無い
          - name: test_draw_radio_when_checked
            case: 正常
            summary: 選んだラジオボタンに accent_fg の点を描く
            condition: apply_theme(app, "dark") の後、選んだ QRadioButton と選んでいない QRadioButton を grab した画像。QT_QPA_PLATFORM=offscreen
            mock: なし
            expected: 選んだ方の丸の中心が dark の accent_fg、選んでいない方の丸の中心は accent_fg でない
          - name: test_draw_primitive_when_other
            case: 正常
            summary: マーカーでない要素は包んだスタイルへ渡す
            condition: PE_FrameFocusRect を描かせる。QT_QPA_PLATFORM=offscreen
            mock: 包んだスタイルの drawPrimitive
            expected: 包んだスタイルの drawPrimitive が同じ引数で 1 回呼ばれる
      - name: pixelMetric
        title: マーカーの大きさ
        summary: チェックボックスの箱とラジオボタンの丸の幅・高さを tokens.toml の `shape.indicator` にし、ほかは包んだスタイルの値を返す
        kind: メソッド
        scope: public
        inherits: QProxyStyle.pixelMetric
        args:
          - name: metric
            type: QStyle.PixelMetric
            required: true
            passing: positional
            description: 問い合わせる大きさ
          - name: option
            type: QStyleOption | None
            required: false
            default: None
            passing: positional
            description: 状態
          - name: widget
            type: QWidget | None
            required: false
            default: None
            passing: positional
            description: 部品
        returns:
          type: int
          description: 論理ピクセル
        unit_tests:
          - name: test_pixel_metric_when_indicator
            case: 正常
            summary: マーカーの大きさを tokens.toml から返す
            condition: PM_IndicatorWidth・PM_IndicatorHeight・PM_ExclusiveIndicatorWidth・PM_ExclusiveIndicatorHeight
            mock: なし
            expected: どれも tokens.toml の shape.indicator（16）
          - name: test_pixel_metric_when_other
            case: 正常
            summary: ほかの大きさは包んだスタイルの値
            condition: PM_ButtonMargin
            mock: なし
            expected: 包んだスタイルの pixelMetric の値と同じ
    refs:
      - SCR-9#notes.マーカーの見え方
      - LIB-21#
    status: implemented
    introduced:
      pr: 159
