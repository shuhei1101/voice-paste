title: "トレイから操作する"
scenarios:
  - name: 正常シナリオ（ログフォルダを開く）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「ログフォルダを開く」を選ぶ
        TRAY->>TRAY: log/ が無ければ作る
        TRAY->>EXP: log/ を開く
      ```
    expected:
      - エクスプローラーで `log/` が開いている
  - name: 正常シナリオ（設定フォルダを開く）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「設定フォルダを開く」を選ぶ
        TRAY->>EXP: 設定の置き場（.env のあるフォルダ）を開く
      ```
    expected:
      - エクスプローラーで `.env` のあるフォルダが開いている（`voice-paste.bat` から起動したときはリポジトリの直下）
  - name: 正常シナリオ（再起動する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        U->>TRAY: 「再起動」を選ぶ
        TRAY->>APP: 再起動を求め、アイコンを消す
        APP->>NEW: 同じ引数で新しいプロセスを起動する（リポジトリのコードを優先して読む）
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ
      ```
    expected:
      - 前の常駐アプリのプロセスが終わっている
      - 新しい常駐アプリが待機中になり、`.env` の今の設定で動いている
  - name: 正常シナリオ（終了する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant WK as 文字起こしワーカー（子プロセス）
        participant FS as PID ファイル

        U->>TRAY: 「終了」を選ぶ
        TRAY->>APP: 終了を求め、アイコンを消す
        APP->>APP: ホットキーの受付を止める
        APP->>WK: 終了を送り、終わらなければ止める
        APP->>FS: 自分の番号が書かれていれば消す
        APP->>APP: プロセスを終える
      ```
    expected:
      - トレイから voice-paste のアイコンが消えている
      - 常駐アプリと文字起こしワーカーのプロセスが終わっている
      - PID ファイルが消えている
lead: トレイのアイコンのメニューから、フォルダを開く・再起動する・終了する単一ユースケース。
issue: 3
primary_actor: 音声入力を使うユーザー
trigger: トレイの voice-paste のアイコンを右クリックしてメニューを開く
preconditions:
  - 常駐アプリが常駐モードで動いている
notes:
  メニューの項目: 上から「録音開始」（アイコンの既定の操作）・「設定フォルダを開く」・「ログフォルダを開く」・「設定」・区切り・「再起動」・「終了」。「録音開始」は 録音する、「設定」は 設定を変える が扱う。
  録音中の操作: |-
    録音から届けるまでの間に「再起動」・「終了」を選ぶと、トレイのアイコンは選んだ時点で消える。
    録音から届けるまではアイコンの無いまま続き、再起動・終了はその回が終わってから行う。
