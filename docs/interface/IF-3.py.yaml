id: IF-3
visibility: internal
title: "呼び出し元へ返す"
entry:
  kind: trigger
  value: API から始めた録音の文字起こしが終わるか、上限で打ち切る が打ち切ったときに `POST {callback_url}` を送信する。連続録音では、区間の文字起こしが終わるたびと、完了か上限か区切りの失敗で録音が停止した後に全ての区間を送信し終えたときに送信する
flows:
  - name: 正常系
    summary: 起こした文字をコールバック先へ送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、空でない文字が得られた
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=transcribed・text
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に result=transcribed と起こした文字が 1 回届いている
      - 録音セッションが終わり、待機中に戻っている
    test: test_normal
  - name: 正常系（結果が空）
    summary: 空の文字をコールバック先へ送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、結果が空だった
    flow: |-
      <!-- map: {"title": "正常系（結果が空）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=transcribed・text=""
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に result=transcribed と空の text が 1 回届いている
    test: test_normal_when_empty
  - name: 正常系（文字起こしに失敗）
    summary: 文字起こしの失敗をコールバック先へ送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、文字起こしに失敗した
    flow: |-
      <!-- map: {"title": "正常系（文字起こしに失敗）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=failed・error
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に result=failed と失敗の理由が 1 回届いている
    test: test_normal_when_transcription_failed
  - name: 正常系（上限で打ち切った）
    summary: 完了が来ないまま上限で打ち切ったことをコールバック先へ送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 打ち切り
        description: 上限で打ち切る が、完了が来ないまま録音セッションの上限時間（開始からの経過時間）に達した録音セッションを打ち切った
    flow: |-
      <!-- map: {"title": "正常系（上限で打ち切った）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=truncated
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に result=truncated が 1 回届いている
    test: test_normal_when_truncated
  - name: 正常系（連続録音の区間）
    summary: 連続録音で起こした区間の文字を、通し番号を付けて区切った順に送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 1 と 2 の区間の文字がこの順に得られた
    flow: |-
      <!-- map: {"title": "正常系（連続録音の区間）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=transcribed・segment_number=1・text
        CB-->>IF: 200
        IF->>CB: POST session_id・result=transcribed・segment_number=2・text
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に segment_number=1 と segment_number=2 の区間の文字が、この順に 1 回ずつ届いている
      - segment_count が null である
      - 録音セッションが終わらず、連続録音が続いている
    test: test_normal_when_continuous_segment
  - name: 正常系（連続録音の区間の文字起こしに失敗）
    summary: 区間の文字起こしの失敗を通し番号つきで送信し、連続録音は続ける
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 2 の区間の文字起こしに失敗し、通し番号 3 の区間の文字が得られた
    flow: |-
      <!-- map: {"title": "正常系（連続録音の区間の文字起こしに失敗）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=failed・segment_number=2・error
        CB-->>IF: 200
        IF->>CB: POST session_id・result=transcribed・segment_number=3・text
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に segment_number=2 の result=failed と失敗の理由が 1 回届いている
      - その後に segment_number=3 の区間の文字が届いている
    test: test_normal_when_continuous_segment_failed
  - name: 正常系（連続録音を完了した）
    summary: 最後の区間を送信した後に、完了したことと区間の数を送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 連続録音の終わり
        description: 連続録音が完了し、通し番号 1・2 の区間を送信し終えた
    flow: |-
      <!-- map: {"title": "正常系（連続録音を完了した）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=transcribed・segment_number=2・text
        CB-->>IF: 200
        IF->>CB: POST session_id・result=completed・segment_count=2
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に、segment_number=2 の区間の後で result=completed・segment_count=2 が 1 回届いている
      - 録音セッションが終わり、待機中に戻っている
    test: test_normal_when_continuous_completed
  - name: 正常系（連続録音が区切りの失敗で停止した）
    summary: 区切りに失敗して録音が停止した連続録音で、それまでの区間を送信した後に、失敗したことと理由・区間の数を送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、200 を返す
      - name: 連続録音の終わり
        description: 連続録音で通し番号 1・2 の区間を送信した後、区切り（話し声の判定）が例外を送出して録音が停止した
    flow: |-
      <!-- map: {"title": "正常系（連続録音が区切りの失敗で停止した）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        IF->>CB: POST session_id・result=transcribed・segment_number=2・text
        CB-->>IF: 200
        IF->>CB: POST session_id・result=failed・segment_count=2・error
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - コールバック先に、segment_number=2 の区間の後で result=failed・segment_number=null・segment_count=2 と失敗の理由が 1 回届いている
      - 録音セッションが終わり、待機中に戻っている（同じ ID への完了は 404）
    test: test_normal_when_continuous_segmenter_failed
  - name: 異常系（連続録音の区間がコールバック先に届かない・ログに書いて次の区間へ進む）
    summary: 決めた回数まで再送しても届かない区間はログに書き、次の区間を送信する
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、segment_number=2 の返送にだけ常に 500 を返す
      - name: 再送の設定
        description: 再送の間隔をテストで待てる短い値に差し替える
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 2 と 3 の区間の文字がこの順に得られた
    flow: |-
      <!-- map: {"title": "異常系（連続録音の区間がコールバック先に届かない・ログに書いて次の区間へ進む）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先
        participant LOG as ログ

        loop 決めた回数まで
          IF->>CB: POST session_id・result=transcribed・segment_number=2・text
          CB-->>IF: 500
        end
        IF->>LOG: 届かなかったことと session_id・segment_number=2 を書く
        IF->>CB: POST session_id・result=transcribed・segment_number=3・text
        CB-->>IF: 200
      ```

      <!-- /map -->
    expected:
      - segment_number=2 の送信が決めた回数だけ行われている
      - ログに届かなかったことと session_id・segment_number=2 が書かれている
      - segment_number=3 の区間の文字がその後に届いている
      - 録音セッションが終わらず、連続録音が続いている
    test: test_error_when_continuous_segment_unreachable
  - name: 異常系（コールバック先に届かない・ログに書いて終える）
    summary: 決めた回数まで再送しても届かなければログに書いて終える
    setup:
      - name: Mock
        description: コールバック先を 127.0.0.1 のテスト用のエンドポイントにし、常に 500 を返す
      - name: 再送の設定
        description: 再送の間隔をテストで待てる短い値に差し替える
    flow: |-
      <!-- map: {"title": "異常系（コールバック先に届かない・ログに書いて終える）"} -->

      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as コールバック先

        loop 決めた回数まで
          IF->>CB: POST session_id・result・text
          CB-->>IF: 500
        end
        IF->>IF: 届かなかったことと session_id をログに書く
      ```

      <!-- /map -->
    expected:
      - コールバック先への送信が決めた回数だけ行われている
      - ログに届かなかったことと session_id が書かれている
      - 録音セッションが終わり、待機中に戻っている
    test: test_error_when_callback_unreachable
lead: API から始めた録音の結果（起こした文字・空の文字・文字起こしの失敗・上限での打ち切り）を、開始で指定されたコールバック先へ送信する。連続録音では、区間ごとの結果を通し番号つきで区切った順に送信し、最後に終わった理由と区間の数を送信する。
identifier: deliver_to_caller
idempotent: false
side_effects: コールバック先へ HTTP で 1 回送信する（届かなければ決めた回数まで再送する）。届かなかったときはログに書く。送信し終えたら録音セッションを終えて待機中に戻す（連続録音では、終わりの返送を送信し終えたら）。
exclusivity: 1 録音セッションにつき 1 回だけ送信する（再送は同じ中身）。連続録音では区間ごとに 1 回と終わりを 1 回送信し、前の返送を終えて（届かなかったときは再送を終えて）から次を送信する。
exceptions:
  - name: なし（正常終了）
    condition: コールバック先が 2xx を返した
  - name: なし（届かなかったことをログに書いて終える）
    condition: 決めた回数まで再送しても、タイムアウト・接続できない・2xx 以外のどれかで届かない
    notes: 履歴は残り、常駐サービスは待機中に戻る
  - name: なし（届かなかった区間をログに書いて次の区間へ進む）
    condition: 連続録音の区間の返送が、決めた回数まで再送してもタイムアウト・接続できない・2xx 以外のどれかで届かない
    notes: 連続録音は停止せず、次の区間と終わりは送信する。終わりの返送が届かないときは、上の「届かなかったことをログに書いて終える」
constraints:
  - item: 送信先
    constraint: 開始で受け取った callback_url だけ。ホストが loopback か設定で許可したホストであることを送信する前にもう一度確かめる
  - item: タイムアウト
    constraint: 非機能要件の返送のタイムアウト
    decided_by: NFR-1#requirements[返送のタイムアウトと再送]
  - item: 再送
    constraint: 非機能要件の返送の再送回数と間隔
    decided_by: NFR-1#requirements[返送のタイムアウトと再送]
  - item: リダイレクト
    constraint: 追わない
    notes: 許可していないホストへ流れるのを防ぐ
  - item: エンドポイントの応答時間
    constraint: エンドポイントは返送を受け取ったら 1 秒以内に 2xx を返す。重い処理は 2xx を返した後で行う
    decided_by: NFR-1#requirements[返送のタイムアウトと再送]
    notes: 呼び出し元との取り決め。返送のタイムアウトはこの時間から導く
  - item: 重なって届く返送
    constraint: エンドポイントが 2xx を返す前にタイムアウトすると、同じ中身が同じ session_id（連続録音の区間は同じ session_id と segment_number）で再送される。エンドポイントは session_id（連続録音は session_id と segment_number、終わりは session_id と result）で重複を見分ける
    notes: 常駐アプリが送信するのは 1 録音セッション（連続録音は 1 区間・終わり）につき 1 つの中身だけで、届いたかを確かめられないときだけ同じ中身を再送する
  - item: 終了で捨てた録音
    constraint: 常駐サービスの終了で捨てた録音（録音中・停止中の API の録音セッション）は返送しない
    notes: 終了の時点で API サーバーも停止しており、返送を待つと終了が返送の最長まで遅れるため。呼び出し元は返送が来ないことで気づく
  - item: 連続録音の順
    constraint: 区間は通し番号の順に送信し、終わりは全ての区間の後に送信する。届かなかった区間も通し番号を飛ばして次の区間へ進むため、エンドポイントは通し番号の欠けと segment_count で届かなかった区間に気づける
    decided_by: NFR-1#requirements[区切ってから返送が届くまでの時間]
    notes: 前の区間を再送している間は、後の区間が返送の最長（13 秒）まで待つ
notes:
  送信する内容: |-
    `application/json` で次のフィールドを送信する。

    | フィールド | 型 | 説明 |
    | --- | --- | --- |
    | `session_id` | `str`（uuid） | 開始で返した録音セッションの ID |
    | `result` | `Literal["transcribed", "failed", "truncated", "completed"]` | `transcribed`: 起こした文字（空を含む）を得た。`failed`: 文字起こしに失敗した（連続録音で `segment_number` が `null` のときは、区切りに失敗して録音が停止し、全ての区間を送信し終えた）。`truncated`: 完了が来ないまま上限で打ち切った。`completed`: 連続録音を完了し、全ての区間を送信し終えた（連続録音だけ） |
    | `text` | `str` | 用語集で補正した文字。`transcribed` で結果が空のときと、`failed`・`truncated`・`completed` のときは空文字 |
    | `error` | `str \| None` | `failed` のときの理由。それ以外は `null` |
    | `segment_number` | `int \| None` | 連続録音の区間の通し番号（1 から 1 ずつ増える）。連続録音の `transcribed` と区間の `failed` のときだけ入り、それ以外は `null` |
    | `segment_count` | `int \| None` | 連続録音で区切った区間の数（届かなかった区間も含む。区間が無ければ 0）。連続録音の終わり（`completed`・`truncated`、区切りの失敗で停止したときの `failed`）だけに入り、それ以外は `null` |

    `continuous` を指定しない開始では、`segment_number`・`segment_count` は常に `null` で、それ以外の中身は今までと同じ。

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "transcribed",
      "text": "今日の会議は 15 時からです。",
      "error": null,
      "segment_number": null,
      "segment_count": null
    }
    ```

    連続録音の区間と終わりの例:

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "transcribed",
      "text": "今日の会議は 15 時からです。",
      "error": null,
      "segment_number": 1,
      "segment_count": null
    }
    ```

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "completed",
      "text": "",
      "error": null,
      "segment_number": null,
      "segment_count": 3
    }
    ```
test_file: tests/integration/test_deliver_to_caller.py
