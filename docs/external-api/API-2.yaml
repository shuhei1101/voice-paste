id: API-2
visibility: internal
title: "OpenAI"
version:
  api_version: URL 埋め込み型（/v1）
  checked_on: '2026-10-28'
auth:
  method: Bearer
  steps: |-
    1. https://platform.openai.com/api-keys で API キーを発行する
    2. 開発の端末と常駐アプリを動かす端末の `~/.config/voice-paste/secrets/openai_api_key`（Windows は設定のフォルダの `secrets/openai_api_key`）に、キーだけを書き込んだ権限 600 のファイルとして配置する。環境変数で引き渡すときは OPENAI_API_KEY
  env_vars:
    - OPENAI_API_KEY
  usage: |-
    ```
    Authorization: Bearer {API キー}
    ```
endpoints:
  - name: POST /audio/transcriptions
    method: POST
    path: /audio/transcriptions
    summary: 音声のファイルを文字に起こす
    idempotent: false
    request:
      - name: file
        type: file
        required: true
        location: body
        format: multipart/form-data
        description: 起こす音声
        constraints: 25 MB 以下。形式はガイドでは mp3・mp4・mpeg・mpga・m4a・wav・webm、API リファレンスではこれに flac・ogg を加えたもの（常駐アプリはガイドの形式だけを送信する）
      - name: model
        type: string
        required: true
        location: body
        description: モデル（gpt-transcribe・gpt-4o-mini-transcribe・gpt-4o-transcribe・whisper-1 など）。gpt-4o-mini-transcribe・gpt-4o-transcribe・whisper-1 は 2027-02-26 に提供が終わる（https://developers.openai.com/api/docs/deprecations）。gpt-live-transcribe は Realtime だけでこのエンドポイントでは使用できない
      - name: language
        type: string
        required: false
        location: body
        description: 音声の言語（ISO-639-1。例 ja）。指定すると精度と速さが上がる。gpt-transcribe では languages[] が代わりになり、両方を送信しない
      - name: prompt
        type: string
        required: false
        location: body
        description: 表記や文脈の手がかり。gpt-transcribe も受ける（録音の話題など自由な文脈）
      - name: response_format
        type: string
        required: false
        default: json
        location: body
        description: 応答の形式。gpt-4o 系のモデルは json か text
      - name: languages[]
        type: string[]
        required: false
        location: body
        description: gpt-transcribe で音声に想定する言語の並び。multipart では同じ項目名を繰り返す
        constraints: ISO 639-1・一部の ISO 639-3・地域付きの zh。対応しないコードは要求ごと拒まれる
      - name: keywords[]
        type: string[]
        required: false
        location: body
        description: gpt-transcribe・gpt-live-transcribe で、発話に出る用語の手がかり。multipart では同じ項目名を繰り返す
        constraints: 単語ごとに 1 行で、`<`・`>`・改行を含まない。違反すると要求ごと拒まれる。数・長さの上限は公開されていない（https://developers.openai.com/api/docs/guides/speech-to-text）
    response:
      - name: text
        type: string
        description: 起こした文字
    status_codes:
      - code: '200'
        condition: 起こせた
      - code: '400'
        condition: 要求が不正（形式・大きさ・パラメータ）
      - code: '401'
        condition: API キーが無い・誤り
      - code: '429'
        condition: レートの上限か利用の上限に達した
      - code: 5xx
        condition: OpenAI 側の障害
lead: OpenAI のモデルを HTTP で呼ぶ API。音声の文字起こし（Audio API の transcriptions）を含む。
used_in:
  - src/voice_paste/integrations/openai/transcriber.py
verification:
  state: 済
  date: '2026-10-30'
  detail: 外部疎通テスト（tests/external/voice_paste/integrations/openai/test_transcriber.py の test_ext_transcribe）を Windows の開発の端末で 1 回流した。約 3 秒の日本語の WAV を、既定のモデル（gpt-transcribe）・languages[]=ja・keywords[]（voice-paste・Whisper）付きで送信し、空でない文字が 1 区間で返った。かかった秒は 1.81。見積もりは約 $0.0003（約 0.05 円）、実費の目安は約 3 秒 × $0.0045/分 ≈ $0.00023（約 0.04 円）
base_urls:
  - env: 本番
    url: https://api.openai.com/v1
official_url: https://openai.com/api/
docs_url: https://platform.openai.com/docs/api-reference/audio/createTranscription
terms_url: https://openai.com/policies/
status_page: https://status.openai.com
retry: 429（レートの上限）・5xx・タイムアウト・接続の失敗は一時的な失敗として、指数バックオフとジッターで送信し直す。Retry-After があれば従う。回数と待ちは非機能要件が持つ
pricing:
  - target: gpt-transcribe
    price: $0.0045 / 分（音声の長さ）
    notes: 設定の既定のモデル（https://developers.openai.com/api/docs/models/gpt-transcribe）
  - target: gpt-4o-mini-transcribe
    price: $0.003 / 分（音声の長さ）
    notes: 2027-02-26 に提供が終わる
pricing_url: https://openai.com/api/pricing/
error_format: |-
  ```json
  {"error": {"message": "...", "type": "invalid_request_error", "param": null, "code": "invalid_api_key"}}
  ```
