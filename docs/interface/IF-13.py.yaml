title: 準備できたかを返す
entry:
  kind: endpoint
  value: GET /health
lead: モデルを読み込み終え、文字起こしの要求を受けられることを返却する。常駐アプリが起動のときに接続先を確認するのに使用する。
test_file: tests/integration/haas_server/test_health.py
identifier: health
permissions: なし（トークンを求めない。Host と Origin だけを確認する）
idempotent: true
side_effects: なし
exclusivity: 制限なし（文字起こしの最中も返却する）
response:
  - name: ok
    type: Literal[True]
    description: モデルを読み込み終えた
  - name: model
    type: str
    description: 起動の引数で受けたモデルの名前
    example: third-intelligence/Haas-ja-v1.0
  - name: dtype
    type: str
    description: 起動の引数で受けた計算の精度（`auto` は解決する前の `auto` のまま）
    example: auto
  - name: device
    type: str
    description: 起動の引数で受けた装置
    example: cuda
response_example: |-
  ```json
  {
    "ok": true,
    "model": "third-intelligence/Haas-ja-v1.0",
    "dtype": "auto",
    "device": "cuda"
  }
  ```
response_notes: サーバーはモデルを読み込み終えてから待ち受けを始める。読み込みの間は接続できず、常駐アプリは応答が無いものとして待つ。
status_codes:
  - code: '200'
    condition: モデルを読み込み終えている
  - code: '403'
    condition: Host が 127.0.0.1 でも localhost でもないか、Origin が付いている
constraints:
  - item: 待ち受け
    constraint: 音声を文字に起こす と同じ
  - item: 認可
    constraint: 音声を文字に起こす と同じ（Host が `127.0.0.1:{ポート}` か `localhost:{ポート}` で、Origin が付いていないこと）
  - item: 応答時間
    constraint: 制限なし
    notes: モデルを使用せずに返却する
  - item: 起動の引数
    constraint: 起動スクリプトはポート・model・dtype・device を受ける。dtype は `auto`・`bfloat16`・`float16`・`float32`、device は `cuda`・`cuda:{番号}`・`cpu`
    notes: 引数が無いときは既定（third-intelligence/Haas-ja-v1.0・auto・cuda）で起動する。読み込めない値はモデルの読み込みの失敗と同じく、待ち受けずに終わる
  - item: 返却する値
    constraint: model・dtype・device は起動の引数で受けた文字列をそのまま返却する
    notes: 常駐アプリは起動の前から動いているサーバーの値を設定の値と文字列で比べる（常駐アプリを起動する の 正常シナリオ（動いている Haas のサーバーが設定と違う））
flows:
  - name: 正常系
    summary: モデルを読み込んだ後に呼ぶと、ok と、起動の引数で受けたモデル・計算の精度・装置を返却する
    setup:
      - name: Mock
        description: Haas のモデルの読み込みを、決まったモデルを返却する関数に差し替える
        notes: GPU を使用しない。起動の引数は model を third-intelligence/Haas-ja-v1.0、dtype を auto、device を cuda にする
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as 常駐アプリ
        participant IF as GET /health

        C->>IF: 要求
        IF-->>C: 200・ok・model・dtype・device
      ```

      <!-- /map -->
    expected:
      - 200 で ok が true、model が third-intelligence/Haas-ja-v1.0、dtype が auto、device が cuda
    test: test_normal
  - name: 異常系（許されていない要求元・403）
    summary: Origin が付いた要求を断る
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 要求のヘッダー
        description: Origin を付ける
        notes: '`Origin: http://evil.example`'
    flow: |-
      <!-- map: {"title": "異常系（許されていない要求元・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ほかのサイトのページ
        participant IF as GET /health

        C->>IF: 要求（Origin が付いている）
        IF-->>C: 403（problem+json）
      ```

      <!-- /map -->
    expected:
      - 403 の problem+json が返り、モデルの名前を含まない
    test: test_error_when_origin_not_allowed
id: IF-13
visibility: internal
