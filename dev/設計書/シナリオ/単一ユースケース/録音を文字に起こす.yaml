title: "録音を文字に起こす"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV（区間を 2 つ以上にする）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
        notes: '-'
      - name: 用語集
        description: 設定で選んでいる用語集のプリセットに用語集が 2 つある。1 つ目の用語集に、話す内容で起きる誤変換と正しい表記のオンの行と、話す内容に入る文言を誤変換にして正しい表記を空にしたオンの行（消す行）と、別の誤変換のオフの行がある。2 つ目の用語集に、話す内容で起きる別の誤変換と正しい表記のオンの行がある
        notes: 選んでいないプリセットだけが使う用語集にも、話す内容で起きる誤変換の行を 1 つ置く
      - name: 入口
        description: ホットキーから始めた録音を確定する
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant GL as 用語集
        participant TRAY as トレイ
        participant OV as 文字起こし中の表示
        participant WK as 文字起こしワーカー（子プロセス）
        participant HIST as 履歴
        actor U as ユーザー

        SVC->>GL: 選んでいるプリセットの用語集を全て読み直す（オンの行だけ）
        SVC->>TRAY: 文字起こし中のアイコンにする
        SVC->>OV: 開く（経過と残りの時間・貼り付けたい場所にカーソルを合わせる案内）
        U->>U: 貼り付けたいアプリの入力欄へカーソルを移す
        SVC->>WK: 録音とローカルの Whisper の設定を送信する
        loop 区間ごと
          WK-->>SVC: 区間の終わりの時刻
          SVC->>OV: 残りの時間を更新する
        end
        WK-->>SVC: 区間ごとの文字を改行でつないだ結果
        SVC->>SVC: 文頭・文末から削除する文言の一覧を上から順に当て、文頭・文末に一致した文言を消す
        SVC->>SVC: プリセットに並べた用語集の順に、行の順で誤変換を正しい表記へ置き換える（正しい表記が空の行は誤変換を消す）
        SVC->>HIST: 起こした文字を録音と同じ履歴に追記する
        SVC->>OV: 閉じる
      ```
    expected:
      - 起こした文字の中の用語集の誤変換が、正しい表記に置き換わっている
      - 2 つ目の用語集の誤変換も、正しい表記に置き換わっている
      - 選んでいないプリセットだけが使う用語集の誤変換は、置き換わらずに残っている
      - 消す行の誤変換が、起こした文字から消えている
      - オフの行の誤変換は置き換わらずに残っている
      - 起こした文字が区間ごとに改行で区切られている
      - 履歴に録音と起こした文字がある
      - 文字起こし中の表示が閉じている
      - 起こした文字を届ける へ進む
    notes:
      API から始めた録音: API から始めた録音では、文字起こし中の表示を開かない。それ以外は同じ流れである。
      録音の画面を出さない設定: 録音の画面を出さない設定でホットキー・トレイから始めた録音も、文字起こし中の表示を開かず、トレイのアイコンだけが状態を示す。
      文字起こし中の表示: |-
        フォーカスを取らずに開き、貼り付けたいアプリの入力欄からフォーカスを奪わない。
        今の出力先を出し、届け始めるまで固定の出力先への切り替えを受ける（起こした文字を届ける の 正常シナリオ（文字起こし中にコピーのみへ切り替える））。
      用語集の重なり: |-
        プリセットの用語集の行は、用語集の並びの順・用語集の中の行の順に 1 本の並びとして当て、前の行で置き換えた結果へ次の行を当てる。
        複数の用語集に同じ誤変換の行があるときは、先に並べた用語集の行で置き換わり、後の用語集の行は当たらない。
        読めない用語集の CSV は空の用語集として飛ばし、残りの用語集で補正する。
    test: test_normal
  - name: 正常シナリオ（文字起こしワーカーが異常終了する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、文字起こしの途中でワーカーを停止できるよう、音声合成の文を繰り返した WAV
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: ワーカーの停止
        description: 文字起こしの途中で、文字起こしワーカーの子プロセスを外から終わらせる（再起動したワーカーは停止しない）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant WK2 as 新しい文字起こしワーカー

        SVC->>WK: 録音と設定を送信する
        WK--xSVC: 応答の途中で終わる
        SVC->>WK2: 子プロセスを起動し直し、モデルを読み込ませる
        WK2-->>SVC: ready
        SVC->>WK2: 同じ録音を再送する（再試行は 1 回だけ）
        WK2-->>SVC: 文字起こしの結果
        Note over SVC: 用語集での補正から後は 正常シナリオ と同じ
      ```
    expected:
      - 起こした文字が得られ、起こした文字を届ける へ進む
      - 文字起こしワーカーが新しい子プロセスで動いている
      - 常駐サービスのプロセスが動き続けている
    test: test_normal_when_worker_dies
  - name: 異常シナリオ（再起動したワーカーも異常終了する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、文字起こしの途中でワーカーを停止できるよう、音声合成の文を繰り返した WAV
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: ワーカーの停止
        description: 文字起こしの途中で文字起こしワーカーの子プロセスを終わらせ、再起動したワーカーも終わらせる
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK2 as 再起動したワーカー
        participant WK3 as 次の録音のためのワーカー
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        actor U as ユーザー

        Note over SVC: 最初のワーカーが異常終了して再起動するまでは 正常シナリオ（文字起こしワーカーが異常終了する） と同じ
        WK2--xSVC: 応答の途中で終わる
        SVC->>WK3: 子プロセスを起動し直し、次の録音に備える
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
        SVC-->>U: 文字起こしに失敗したことを通知する
      ```
    expected:
      - 文字起こしに失敗したことがユーザーに知らされている
      - 履歴にこの録音が残っている
      - 常駐サービスのプロセスが動き続けている
      - 文字起こしワーカーが新しい子プロセスで動いている
    test: test_error_when_worker_dies_again
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。保存した録音を読めない中身に書き換える
      - name: 文字起こしの失敗
        description: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        participant LOG as ログ
        actor U as ユーザー

        Note over SVC: 用語集を読み、表示を開くまでは 正常シナリオ と同じ
        SVC->>WK: 録音と設定を送信する
        WK-->>SVC: エラー（読めない録音）
        SVC->>LOG: 失敗した理由を書く
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
        SVC-->>U: 文字起こしに失敗したことと理由を通知する
      ```
    expected:
      - 文字起こしに失敗したことと理由がユーザーに知らされている
      - 履歴にこの録音が残っている
      - 起こした文字を届ける へ進まず、トレイのアイコンが待機中に戻っている
    test: test_error_when_transcription_failed
  - name: 異常シナリオ（文字起こしの結果が空）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 何も話さずに録音を確定する
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        participant LOG as ログ

        Note over SVC: 用語集を読み、表示を開くまでは 正常シナリオ と同じ
        SVC->>WK: 録音と設定を送信する
        WK-->>SVC: 空の文字
        SVC->>LOG: 結果が空だったことを書く
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - ダイアログが出ていない
      - 起こした文字を届ける へ進まず、履歴にこの録音が残っている
      - トレイのアイコンが待機中に戻っている
    test: test_error_when_transcription_empty
  - name: 正常シナリオ（API から始めた録音の結果が空）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 何も話さずに録音を確定する
      - name: 入口
        description: API から始めた録音を、API の完了で確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 録音と設定を送信する（文字起こし中の表示は開かない）
        WK-->>SVC: 空の文字
        SVC->>LOG: 結果が空だったことを書く
        SVC->>SVC: 空の文字を 起こした文字を届ける へ渡す
      ```
    expected:
      - 空の文字が 起こした文字を届ける へ渡されている
      - 履歴にこの録音が残っている
      - ダイアログも文字起こし中の表示も出ていない
    test: test_normal_when_api_transcription_empty
  - name: 異常シナリオ（API から始めた録音の文字起こしに失敗）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。保存した録音を読めない中身に書き換える。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 文字起こしの失敗
        description: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
      - name: 入口
        description: API から始めた録音を、API の完了で確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 録音と設定を送信する（文字起こし中の表示は開かない）
        WK-->>SVC: エラー（読めない録音）
        SVC->>LOG: 失敗した理由を書く
        SVC->>SVC: 文字起こしの失敗を 起こした文字を届ける へ渡す
      ```
    expected:
      - 文字起こしの失敗が 起こした文字を届ける へ渡されている
      - 履歴にこの録音が残っている
      - ダイアログも文字起こし中の表示も出ていない
    notes:
      同じ扱いになる失敗: 再起動したワーカーも異常終了したときも同じ扱いになる。
    test: test_error_when_api_transcription_failed
  - name: 異常シナリオ（失敗の通知を押す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。保存した録音を読めない中身に書き換える
      - name: 文字起こしの失敗
        description: 異常シナリオ（文字起こしに失敗） と同じ状態にして失敗の通知を出す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        Note over TRAY: 失敗を通知するまでは 異常シナリオ（文字起こしに失敗） と同じ
        U->>TRAY: 畳まれる前の失敗の通知を押す
        TRAY->>EXP: ログの置き場所を開く
      ```
    expected:
      - エクスプローラーでログの置き場所が開いている
      - トレイのアイコンが待機中である
    test: test_error_when_failure_notification_clicked
  - name: 正常シナリオ（区間を区切った順に起こす）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV を実時間で流す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: 入口
        description: 連続録音が、前の区間を起こしている間に次の区間を区切る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant Q as 区間の待ち行列
        participant GL as 用語集
        participant WK as 文字起こしワーカー（子プロセス）
        participant HIST as 履歴

        SVC->>Q: 区切った区間を通し番号つきで積む（録音は続ける）
        loop 待ち行列に区間がある間
          Q-->>SVC: 区切った順に 1 つ取り出す
          SVC->>WK: 区間の録音とローカルの Whisper の設定を送信する（文字起こし中の表示は開かない）
          WK-->>SVC: 区間の文字
          SVC->>SVC: 文頭・文末から削除する文言の一覧を、区間の文字の文頭・文末に当てる
          SVC->>GL: 用語集の誤変換を正しい表記へ置き換える
          SVC->>HIST: 起こした文字を区間の録音と同じ履歴に追記する
          SVC->>SVC: 区間の文字を通し番号つきで 起こした文字を届ける へ渡す
        end
      ```
    expected:
      - 区間の文字が区切った順に 起こした文字を届ける へ渡されている
      - 区間を起こしている間もマイクの録音が続いている
      - 区間の文字の中の用語集の誤変換が、正しい表記に置き換わっている
      - 履歴に区間ごとの録音と起こした文字がある
      - 文字起こし中の表示が開いていない
    test: test_normal_when_segments_in_order
  - name: 異常シナリオ（区間の文字起こしに失敗）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV を実時間で流す。文字起こしは通し番号 2 の区間だけ失敗を返す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: 連続録音が 3 つの区間を区切る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 通し番号 2 の区間の録音を送信する
        WK-->>SVC: エラー
        SVC->>LOG: 失敗した理由と通し番号を書く
        SVC->>SVC: 区間の失敗を通し番号つきで 起こした文字を届ける へ渡す
        SVC->>WK: 通し番号 3 の区間の録音を送信する（連続録音は続ける）
      ```
    expected:
      - 通し番号 2 の区間の失敗が 起こした文字を届ける へ渡されている
      - 通し番号 3 の区間がその後に起こされている
      - 履歴に通し番号 2 の区間の録音が残っている
      - ログに失敗した理由と通し番号が書かれている
    notes:
      同じ扱いになる失敗: 再起動したワーカーも異常終了したときも同じ扱いになる。
    test: test_error_when_segment_transcription_failed
  - name: 正常シナリオ（文字起こしの手がかりを渡す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: 手がかりのプリセット
