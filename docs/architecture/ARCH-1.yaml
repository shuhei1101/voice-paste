id: ARCH-1
visibility: internal
title: アーキテクチャ図
overview:
  direction: LR
  nodes:
    - id: U
      label: ユーザー
      kind: actor
    - id: CALLER
      label: API の呼び出し元（同じ端末のほかのプロセス）
      kind: actor
    - id: APP
      label: 常駐アプリ（API・トレイ・ホットキー・画面）
      kind: process
    - id: WORKER
      label: 文字起こしワーカー（子プロセス）
      kind: process
    - id: ENV
      label: 設定（defaults.yaml・settings.yaml・settings.local.yaml）
      kind: store
    - id: HIST
      label: 履歴・ログ・トークン
      kind: store
    - id: TARGET
      label: アクティブなアプリ
      kind: external
    - id: HF
      label: Hugging Face Hub
      kind: external
    - id: EDGE
      label: Microsoft Edge
      kind: external
    - id: EP
      label: 設定の送信先のエンドポイント
      kind: external
    - id: WEB
      label: 外の端末のブラウザ（スマホ・iPad・外の PC）
      kind: actor
    - id: GW
      label: ゲートウェイ（shuhdev-gateway・Cloudflare Access）
      kind: external
    - id: OAI
      label: OpenAI API
      kind: external
    - id: FWD
      label: Focused Window D-Bus（GNOME Shell の拡張）
      kind: external
    - id: PWR
      label: Windows の電源要求の API
      kind: external
    - id: GSI
      label: gnome-session-inhibit
      kind: external
    - id: HAAS
      label: Haas の文字起こしのサーバー（WSL）
      kind: process
  edges:
    - from: U
      to: APP
      label: ホットキー・トレイ・音声
    - from: CALLER
      to: APP
      label: 開始・停止・完了（127.0.0.1・トークン）
    - from: APP
      to: CALLER
      label: 起こした文字の返送
    - from: APP
      to: ENV
      label: 読み書き
    - from: APP
      to: WORKER
      label: 録音のパス（JSON Lines）
    - from: WORKER
      to: HF
      label: モデルの取得
    - from: APP
      to: HIST
      label: 書き込み
    - from: APP
      to: TARGET
      label: 貼り付け
    - from: APP
      to: EDGE
      label: 子プロセス
    - from: APP
      to: EP
      label: 起こした文字（POST）
    - from: WEB
      to: GW
      label: 画面・音声・結果の取得（HTTPS）
    - from: GW
      to: APP
      label: /web/ の下（127.0.0.1・Origin の許可リスト）
    - from: APP
      to: OAI
      label: 録音（HTTPS・API キー。エンジンが openai のとき）
    - from: APP
      to: FWD
      label: フォーカスしているウィンドウの読み取り（Wayland）
    - from: APP
      to: PWR
      label: 録音の間の画面の消灯の抑止（Windows）
    - from: APP
      to: GSI
      label: 録音の間のアイドルの抑止（Linux。子プロセス）
    - from: APP
      to: HAAS
      label: 起動（wsl.exe）・録音（HTTP・127.0.0.1。エンジンが haas のとき）
    - from: HAAS
      to: HF
      label: モデルの取得
  frame:
    label: voice-paste
    nodes:
      - APP
      - WORKER
      - ENV
      - HIST
      - HAAS
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/voice-paste
subsystems:
  - name: 常駐アプリ
    scope: desktop-app
    role: ショートカットから起動する 1 つの常駐サービス。ホットキー・トレイ・API のどの入口からも同じ録音セッション（録音 → 文字起こし → 補正 → 出力先）を同時に 1 つだけ動かし、画面とトレイを出す（ローカルの文字起こしは文字起こしワーカーに任せる）
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows。Linux は Ubuntu 24.04 の Xorg のセッションと Wayland のセッション）
    implementation: src/voice_paste/main.py
  - name: 文字起こしワーカー
    scope: transcription-worker
    role: 常駐アプリの子プロセスとしてローカルの Whisper のモデルを持ち、標準入出力の JSON Lines で受けた録音を文字に起こす
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows か Linux。常駐アプリが起動し、落ちたら再起動する）
    implementation: src/voice_paste/integrations/whisper/worker.py
  - name: Haas の文字起こしのサーバー
    scope: haas-server
    role: WSL の中で Haas-ja-v1.0 のモデルを持ち、常駐アプリから HTTP で受けた音声を文字に起こす。設定のエンジンが haas のときに常駐アプリが起動し、終了・再起動で止める
    runtime: Python 3.11
    runs_on: ユーザーの端末の WSL2（Ubuntu・NVIDIA GPU。ネットワークは mirrored のモード）
    implementation: haas_server/main.py
lead: voice-paste のサブシステムと、ユーザー・貼り付け先のアプリ・文字起こしのモデルの取得元との境界。
external_systems:
  - name: Hugging Face Hub
    purpose: faster-whisper のモデルの取得（手元に無いときだけ）
    direction: 受信のみ
    protocol: HTTPS（faster-whisper が取得する）
    notes:
      事前確認: 文字起こしワーカーの起動時に、モデルを読み込めることを確認する（手元に無ければその時点で取得する）。
    detail: API-1#
  - name: Microsoft Edge
    purpose: ブラウザ添付のプリセットで確定したときに、プリセットの URL の画面を開く
    direction: 送信のみ
    protocol: 子プロセスの起動（`--app={URL}`）
    notes:
      事前確認: 不要。開けなかったときはそのボタンの操作だけが失敗し、音声入力には影響しない。
    detail: LIB-2#
  - name: API の呼び出し元
    purpose: 同じ端末のほかのプロセスが録音を開始・停止・完了し、指定したエンドポイントで起こした文字を受け取る
    direction: 双方向
    protocol: HTTP（127.0.0.1・Bearer のトークン。返送は呼び出し元のエンドポイントへ POST）
    notes:
      事前確認: 起動時に API の待ち受けを始められたか（uvicorn の started）を確認し、始められなければトレイで通知してホットキーだけで続ける。コールバック先は開始の要求を受けたときに許されるホストかを確認する。届くかは返送のたびに確認し、届かなくても常駐アプリを止めない。
    detail: IF-10#
  - name: 設定の送信先のエンドポイント
    purpose: ホットキー・トレイから始めた録音を「エンドポイントへ送信」種類のカスタムプリセットで確定したときに、起こした文字を受け取る
    direction: 送信のみ
    protocol: HTTP / HTTPS の POST（プリセットの URL。任意で `Authorization` ヘッダー）
    notes:
      事前確認: 不要。届くかは送信するたびに確認し、届かなければトレイで通知して常駐アプリを止めない。
    detail: IF-7#
  - name: ゲートウェイ（shuhdev-gateway）
    purpose: 外の端末のブラウザの要求を、Cloudflare Access で認証してから 127.0.0.1 の API の `/web/` の下へ中継する
    direction: 双方向
    protocol: HTTPS（外）→ HTTP（127.0.0.1。Host を `localhost:{ポート}` に書き換え、Origin はそのまま引き渡す）。常駐アプリは受けて応答を返却するだけで、自分からは接続しない
    detail: IF-11#
    cost: 無料。本文は 100 MB まで（Cloudflare の無料プラン）・応答待ちは 83 秒まで（ゲートウェイの `upstream.header_timeout_sec`）
    refs:
      - NFR-1#requirements[ブラウザの要求の応答時間]
      - NFR-1#requirements[ブラウザの本文の上限]
    notes:
      事前確認: 常駐アプリはゲートウェイへ問い合わせない（受ける側のため）。公開の登録は反映作業『ゲートウェイへの登録』で行い、外の端末から `/web/` が画面を返却することで確認する。
    status: planned
    introduced:
      pr: 171
  - name: OpenAI API
    purpose: 設定のエンジンが openai のときに、録音とブラウザの音声を文字に起こす（文字起こしワーカーの代わり）
    direction: 双方向
    protocol: 'HTTPS の POST（multipart。`Authorization: Bearer`。ベース URL は設定の transcription.openai.base_url）'
    detail: API-2#
    test_file: tests/external/voice_paste/integrations/openai/test_transcriber.py
    cost: 従量課金（既定の gpt-transcribe は音声 1 分あたり $0.0045）。録音が端末の外へ送信される
    refs:
      - NFR-1#requirements[OpenAIの文字起こしのタイムアウトと再送]
      - NFR-1#requirements[OpenAIの文字起こしの料金]
    status: planned
    introduced:
      pr: 204
  - name: Focused Window D-Bus（GNOME Shell の拡張）
    purpose: Linux の Wayland のセッションで、貼り付けのキーを送信する直前にフォーカスしているウィンドウの wm_class を読み込み、端末アプリかを見分ける
    direction: 双方向
    protocol: D-Bus（セッションバス。`gdbus call` を子プロセスで起動する）
    detail: LIB-1#
    notes:
      事前確認: 不要。読み込めない（拡張が無い・無効）ときは設定の貼り付けのキーを送信し、貼り付けを止めない。
    status: planned
    introduced:
      pr: 238
  - name: Windows の電源要求の API
    purpose: 録音中に画面を暗くしない設定がオンのとき、録音の間だけ画面の消灯とアイドルによるスリープを抑止する
    direction: 送信のみ
    protocol: kernel32.dll の関数（ctypes）
    detail: LIB-33#
    notes:
      事前確認: 不要。抑止できないときは警告をログに残して録音を続ける。
    status: planned
    introduced:
      pr: 292
  - name: gnome-session-inhibit
    purpose: Linux の GNOME のセッション（Xorg・Wayland）で、録音中に画面を暗くしない設定がオンのとき、録音の間だけアイドル（画面の消灯）を抑止する
    direction: 送信のみ
    protocol: 子プロセスの起動（`gnome-session-inhibit --inhibit idle ... cat`。標準入力のパイプを閉じると終わる）
    detail: LIB-32#
    notes:
      事前確認: 不要。起動できないときは警告をログに残して録音を続ける。
    status: planned
    introduced:
      pr: 292
constraints: |-
  - Windows で動かす（トレイ・ホットキー・クリップボード・キー入力・システムの音量を Windows の機能で扱う）
  - Linux（Ubuntu 24.04 の Xorg のセッションと Wayland のセッション）でも起動できる。OS で分かれる実装は配線で選び、Linux ではシステムの音量を変えず、ローカルの文字起こしの既定は CPU にする
  - Windows のショートカットから起動できる（手段はバッチファイルに限らない）。Linux は起動のスクリプト（`voice-paste.sh`）から起動でき、ログイン時の自動起動とアプリの一覧の `.desktop` の雛形を持つ
  - ビルドせず、master のソースをそのまま動かす
  - Python で書き込む
  - API は 127.0.0.1 だけで待ち受ける。`/web/` の外は起動ごとのトークンで照合し、`/web/` の下はトークンを求めず Host と Origin の許可リストで許可し、Origin の無い要求も許可する（外からの認証はゲートウェイの Cloudflare Access が持つ）
  - ローカルの文字起こしは GPU（CUDA）で動かす
  - ユーザーは master のコードをビルドせずに普段使いしている（ショートカットは起動のバッチファイルから常駐アプリを起動する）
