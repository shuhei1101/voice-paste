  - name: ブラウザの音声の待ちの上限
    english_name: web_queue_limit
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '10'
    unit: 件（文字起こし待ちと文字起こし中のジョブの合計）
    rationale: 終わっていないジョブは音声を一時のファイルに持つため、ディスクの使用を本文の上限 × 10 件で最大 1 GB に抑える。使うのは外の端末の利用者 1 人で、画面は 1 件ずつ録って送信するため、10 件を超えて待たせる使い方は想定しない
    overflow: 503 の problem+json で断り、画面は送信失敗を出して端末内の音声を残す
    measurement: 文字起こしのエンジンを止めたままにして音声を送信し続け、断られる件目を数える
    test_file: tests/nfr/test_web_queue_limit.py
    tests:
