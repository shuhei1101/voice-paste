  疎通確認: 配布先のデータの設計書の作成/疎通確認.py
  実行: 配布先のデータの設計書の作成/実行.py
  確認: 配布先のデータの設計書の作成/確認.py
  切り戻し: 配布先のデータの設計書の作成/切り戻し.py
