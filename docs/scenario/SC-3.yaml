id: SC-3
visibility: internal
title: "ブラウザから音声を送信する"
scenarios:
  - name: 正常シナリオ（画面で録る）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは受けたパスを控える関数に差し替える
        notes: 偽のマイクには SAPI で書き出した WAV を流す
      - name: 許す Origin
        description: 画面を開いたオリジンを許す Origin の一覧に入れる
    flow: |-
      <!-- map: {"title": "正常シナリオ（画面で録る）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー
        participant SVC as 常駐サービス

        U->>PG: 録音を始める
        PG->>PG: MediaRecorder の形式を選んで録り、残り時間を出す
        U->>PG: 録音を停止する
        PG->>DB: 録った音声を保存日時つきで残す（前の 1 件を置き換える）
        PG->>API: 音声を送信する（multipart の audio）
        API->>API: Origin・大きさ・形式を確認する
        API->>SVC: 一時のファイルに書き込んでジョブを積む
        API-->>PG: 202（job_id）
        PG->>PG: 結果の一覧に待ちの件を出す
      ```

      <!-- /map -->
    expected:
      - 送信が `202` で返り、応答に `job_id` がある
      - 端末（IndexedDB）に録った音声が 1 件だけ、保存日時つきで残っている
      - '`GET /web/transcriptions/{job_id}` がそのジョブ（`queued` か `running`）を返却する'
      - 結果の一覧の先頭に待ちの件が出ている
      - 録った音声で 録音を文字に起こす へ進む
    test: test_normal_when_record_in_page
  - name: 正常シナリオ（ファイルを選ぶ）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは受けたパスを控える関数に差し替える
      - name: 音声ファイル
        description: SAPI で書き出した文を MP3 にしたファイルを選ぶ
    flow: |-
      <!-- map: {"title": "正常シナリオ（ファイルを選ぶ）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー
        participant SVC as 常駐サービス

        U->>PG: 音声ファイルを選んで送信する
        PG->>API: 音声を送信する（multipart の audio）
        API->>API: Origin・大きさ・形式を確認する
        API->>SVC: 一時のファイルに書き込んでジョブを積む
        API-->>PG: 202（job_id）
        PG->>PG: 結果の一覧に待ちの件を出す
      ```

      <!-- /map -->
    expected:
      - 送信が `202` で返り、応答に `job_id` がある
      - '`GET /web/transcriptions/{job_id}` がそのジョブ（`queued` か `running`）を返却する'
      - 端末（IndexedDB）に残した音声は置き換わっていない
      - 選んだ音声で 録音を文字に起こす へ進む
    test: test_normal_when_select_file
    notes:
      端末に残すもの: 端末に残すのは画面で録った音声だけで、選んだファイルは端末に元があるため残さない。
  - name: 正常シナリオ（録音時間の上限に達する）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く。画面の時計を進められるようにする
        notes: 録音の上限時間は非機能要件の決定値（30 分）
    flow: |-
      <!-- map: {"title": "正常シナリオ（録音時間の上限に達する）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー

        U->>PG: 録音を始める
        PG->>PG: 残り時間を出して録る
        PG->>PG: 上限時間に達して録音を停止する
        PG->>DB: 録った音声を残す
        PG->>API: 音声を送信する
        API-->>PG: 202（job_id）
      ```

      <!-- /map -->
    expected:
      - 上限時間で録音が停止し、そこまでの音声が端末に残って送信されている
      - 録音が上限で停止したことが画面に出ている
    test: test_normal_when_recording_limit_reached
  - name: 正常シナリオ（用語集のプリセットを選ぶ）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは受けたパスを控える関数に差し替える。補正は受けたプリセットの名前を控える関数に差し替える
      - name: 用語集のプリセット
        description: 用語集のプリセットが 2 つある
        notes: 設定で選んでいるのは 1 つ目のプリセット
      - name: 音声ファイル
        description: SAPI で書き出した文を MP3 にしたファイルを選ぶ
    flow: |-
      <!-- map: {"title": "正常シナリオ（用語集のプリセットを選ぶ）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー
        participant SVC as 常駐サービス

        U->>PG: 画面を開く
        PG->>API: 用語集のプリセットの一覧を取得する
        API-->>PG: 200（プリセットの名前の一覧・設定で選んでいるプリセットの名前）
        PG->>PG: 選択欄に、既定（設定で選んでいるプリセット）と一覧のプリセットを並べる
        U->>PG: 2 つ目のプリセットを選択する
        U->>PG: 音声ファイルを選んで送信する
        PG->>API: 音声を送信する（multipart の audio・選択したプリセットの名前）
        API->>API: Origin・大きさ・形式と、プリセットの名前が一覧にあるかを確認する
        API->>SVC: 一時のファイルに書き込み、プリセットの名前を持たせてジョブを積む
        API-->>PG: 202（job_id）
        PG->>PG: 結果の一覧に待ちの件を出す
      ```

      <!-- /map -->
    expected:
      - 選択欄に、既定の項目と、設定の用語集のプリセットが設定の並びで出ている
      - 送信が `202` で返り、応答に `job_id` がある
      - '`GET /web/transcriptions/{job_id}` がそのジョブ（`queued` か `running`）を返却する'
      - 起こし終えた後、補正の控えに選択したプリセットの名前が残っている
    test: test_normal_when_select_glossary_preset
    notes:
      選択の使われ方: |-
        画面で録った音声と、端末内の音声の再送信も、送信した時点の選択を一緒に送信する。
        既定を選択したまま送信するときは、プリセットの名前を送信しない（設定で選んでいるプリセットで補正する）。
  - name: 異常シナリオ（送信に失敗する）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く
      - name: 届かない送信
        description: 録音を停止する前に常駐アプリの API の待ち受けを停止し、送信が届かないようにする
    flow: |-
      <!-- map: {"title": "異常シナリオ（送信に失敗する）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー

        U->>PG: 録音を停止する
        PG->>DB: 録った音声を残す
        PG-xAPI: 音声を送信する（届かない）
        PG->>PG: 送信に失敗したことを出す
        U->>PG: 再送信する（待ち受けを戻した後）
        PG->>DB: 残した音声を読み込む
        PG->>API: 音声を送信する
        API-->>PG: 202（job_id）
      ```

      <!-- /map -->
    expected:
      - 送信に失敗したことが画面に出て、再送信ボタンとダウンロードボタンを押せる
      - 端末（IndexedDB）に録った音声が残っている
      - 再送信すると `202` で受け付けられる
      - ダウンロードボタンで、残した音声を端末へ保存できる
    test: test_error_when_send_failed
  - name: 異常シナリオ（読めない形式）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動する
      - name: 壊れたファイル
        description: 拡張子を `.mp3` にした、音声でない中身のファイルを選ぶ
    flow: |-
      <!-- map: {"title": "異常シナリオ（読めない形式）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        U->>PG: ファイルを選んで送信する
        PG->>API: 音声を送信する
        API->>API: 形式を確認する（読み込めない）
        API-->>PG: 415（problem+json）
        PG->>PG: 読み込めない形式であることを出す
      ```

      <!-- /map -->
    expected:
      - 送信が `415` の problem+json で返っている
      - 画面に読み込めない形式であることが出て、結果の一覧に件が増えていない
      - 応答に `job_id` が無く、一時のファイルも書き込まれていない
    test: test_error_when_unreadable_format
  - name: 異常シナリオ（大きすぎる）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動する
      - name: 大きすぎるファイル
        description: 非機能要件の本文の上限（100MB 未満）を超える音声ファイルを選ぶ
    flow: |-
      <!-- map: {"title": "異常シナリオ（大きすぎる）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        U->>PG: ファイルを選んで送信する
        PG->>API: 音声を送信する
        API->>API: 大きさを確認する（上限を超える）
        API-->>PG: 413（problem+json）
        PG->>PG: 大きすぎることを出す
      ```

      <!-- /map -->
    expected:
      - 送信が `413` の problem+json で返っている
      - 画面に大きすぎることが出て、結果の一覧に件が増えていない
      - 応答に `job_id` が無く、一時のファイルも書き込まれていない
    test: test_error_when_too_large
  - name: 異常シナリオ（許可されていない Origin）
    setup:
      - name: Mock
        description: 常駐アプリは pytest のプロセスの中で起動し、テストから HTTP で送信する
      - name: 許可リスト
        description: 許す Origin の一覧に、送信の Origin を入れない
    flow: |-
      <!-- map: {"title": "異常シナリオ（許可されていない Origin）"} -->

      ```mermaid
      sequenceDiagram
        participant C as 許可されていないオリジンのページ
        participant API as API のサーバー

        C->>API: 音声を送信する（許可されていない Origin）
        API->>API: Origin を確認する（一覧に無い）
        API-->>C: 403（problem+json）
      ```

      <!-- /map -->
    expected:
      - 送信が `403` の problem+json で返っている
      - 応答に `job_id` が無く、一時のファイルも履歴も書き込まれていない
    test: test_error_when_origin_not_allowed
  - name: 異常シナリオ（一覧に無いプリセット）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動する
      - name: 用語集のプリセット
        description: 用語集のプリセットが 2 つある画面を開き、2 つ目のプリセットを選択した後に、設定から 2 つ目のプリセットを削除する
      - name: 音声ファイル
        description: SAPI で書き出した文を MP3 にしたファイルを選ぶ
    flow: |-
      <!-- map: {"title": "異常シナリオ（一覧に無いプリセット）"} -->

      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        U->>PG: 音声ファイルを選んで送信する
        PG->>API: 音声を送信する（multipart の audio・削除されたプリセットの名前）
        API->>API: プリセットの名前を確認する（一覧に無い）
        API-->>PG: 400（problem+json）
        PG->>PG: 選択したプリセットが見つからないことを出す
        PG->>API: 用語集のプリセットの一覧を取得し直す
        API-->>PG: 200（プリセットの名前の一覧）
        PG->>PG: 選択欄を取得し直した一覧にし、既定を選択する
      ```

      <!-- /map -->
    expected:
      - 送信が `400` の problem+json で返っている
      - 画面に選択したプリセットが見つからないことが出て、結果の一覧に件が増えていない
      - 応答に `job_id` が無く、一時のファイルも書き込まれていない
      - 選択欄から削除したプリセットが消え、既定が選択されている
    test: test_error_when_glossary_preset_not_found
lead: 外の端末のブラウザの画面で録るか音声ファイルを選び、端末に残してから常駐アプリへ送信して、受け付けた `job_id` を受け取る。
issue: 92
primary_actor: ユーザー（外の端末のブラウザ）
trigger: ユーザーが画面で録音を停止するか、音声ファイルを選んで送信する
preconditions:
  - 常駐サービスが Windows で起動しており、`/web/` でブラウザの音声を受け付けている（Linux で動いているときは `/web/` の下の要求を受け付けない）
  - 画面（`GET /web/`）を、設定の許す Origin の一覧にあるオリジンから開いている
test_file: tests/e2e/単一ユースケース/test_send_audio_from_browser.py
