title: "トレイから操作する"
scenarios:
  - name: 正常シナリオ（ログフォルダを開く）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「ログフォルダを開く」を選ぶ
        TRAY->>TRAY: ログの置き場所が無ければ作る
        TRAY->>EXP: ログの置き場所を開く
      ```
    expected:
      - エクスプローラーでログの置き場所（`%LOCALAPPDATA%\voice-paste\log\`。データの置き場所を渡した起動ではその下の `log\`）が開いている
  - name: 正常シナリオ（設定フォルダを開く）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        U->>TRAY: 「設定フォルダを開く」を選ぶ
        TRAY->>EXP: settings.toml のあるフォルダを開く
      ```
    expected:
      - エクスプローラーで `settings.toml` のあるフォルダ（`%APPDATA%\voice-paste\`。データの置き場所を渡した起動ではそのフォルダ）が開いている
  - name: 正常シナリオ（再起動する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        U->>TRAY: 「再起動」を選ぶ
        TRAY->>APP: 再起動を求め、アイコンを消す
        APP->>APP: ホットキーの受付・API の待ち受け・文字起こしワーカーを止める
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ
      ```
    expected:
      - 前の常駐アプリのプロセスが終わっている
      - 新しい常駐アプリが待機中になり、`settings.toml` の今の設定で動いている
  - name: 正常シナリオ（終了する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 待機中
        description: 録音も設定画面も開いていない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant API as API のサーバー
        participant WK as 文字起こしワーカー（子プロセス）

        U->>TRAY: 「終了」を選ぶ
        TRAY->>APP: 終了を求め、アイコンを消す
        APP->>APP: ホットキーの受付を止める
        APP->>API: 待ち受けを止める
        APP->>WK: 終了を送り、終わらなければ止める
        APP->>APP: プロセスを終える
      ```
    expected:
      - トレイから voice-paste のアイコンが消えている
      - 常駐アプリと文字起こしワーカーのプロセスが終わり、常駐アプリの終了コードが 0 である
      - 127.0.0.1 の API が応えない
lead: トレイのアイコンのメニューから、フォルダを開く・再起動する・終了する単一ユースケース。
issue: 21
primary_actor: 音声入力を使うユーザー
trigger: トレイの voice-paste のアイコンを右クリックしてメニューを開く
preconditions:
  - 常駐アプリが動いていて、トレイにアイコンが出ている
notes:
  メニューの項目: 「録音を始める」（アイコンの既定の操作）・「設定…」・「設定フォルダを開く」・「ログフォルダを開く」・「再起動」・「終了」。「録音を始める」は 録音する、「設定…」は 設定を変える が扱う。
  録音中の操作: |-
    録音から届けるまでの間（API から始めた録音の間を含む）は「録音を始める」と「設定…」を押せなくし、項目名に理由を出す。
    その間に「再起動」・「終了」を選ぶと、トレイのアイコンは選んだ時点で消え、再起動・終了はその回が終わってから行う。
