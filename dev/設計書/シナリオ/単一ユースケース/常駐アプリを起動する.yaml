title: "常駐アプリを起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as ファイル（ログ・履歴・トークン）
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant API as API のサーバー

        U->>SVC: 起動する
        SVC->>SVC: 名前付きの排他を取る
        SVC->>FS: 保持期間を過ぎたログと履歴を消す
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送信する
        WK-->>SVC: モデルを読み込んだ（ready）
        SVC->>FS: 起動ごとのトークンを作り、トークンのファイルに書く
        SVC->>SVC: ブラウザの音声のキューとジョブのワーカースレッドを立てる
        SVC->>API: 127.0.0.1 で待ち受けを始める（`/sessions` と `/web/`）
        API-->>SVC: 待ち受けを始めた
        SVC->>SVC: 録音開始のホットキーの受付を始める
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - トレイのアイコンが待機中になっている
      - 録音開始のホットキーを押すと録音が始まる
      - 127.0.0.1 の API が、トークンを付けた要求に応える
      - '`/web/` が、許す Origin の一覧にあるオリジンから送信したブラウザの音声を受け付ける'
      - トークンのファイル（Windows は `%LOCALAPPDATA%\voice-paste\`、Linux は `~/.local/share/voice-paste/` の下）に今回の起動のトークンが書かれている
      - 文字起こしワーカーの子プロセスが動いている
    test: test_normal
  - name: 正常シナリオ（前の常駐サービスが動いている）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを別プロセスで 2 つ起動し、操作はしない（補足『E2E のテスト』）
      - name: 前のプロセス
        description: 常駐サービスが 1 つ動いており、名前付きの排他を持っている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant NEW as 新しい常駐サービス
        participant OLD as 前の常駐サービス

        U->>NEW: 起動する
        NEW->>NEW: 名前付きの排他が取られている
        NEW->>OLD: 終わるよう頼む
        OLD->>OLD: 録音・文字起こしを停止し、トレイのアイコンを消して終わる
        NEW->>NEW: 名前付きの排他を取る
        Note over NEW: 以降は 正常シナリオ と同じ
      ```
    expected:
      - 前の常駐サービスのプロセスが終わり、トレイに前のアイコンが残っていない
      - 新しい常駐サービスのアイコンが待機中で出ている
      - 常駐サービスのプロセスが 1 つだけ動いている
    notes:
      起動し直しの手作業: master を取り込んだ後にショートカットから起動し直す使い方を残すため、新しいプロセスが前のプロセスに終わるよう頼む。プロセスの番号での強制終了はしない。
    test: test_normal_when_previous_running
  - name: 正常シナリオ（保持期間を過ぎた履歴とログがある）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: 保持期間
        description: 履歴とログの保持期間を 1 日にする
      - name: 古い履歴とログ
        description: 今日から 2 日前の日付の履歴とログと、今日の日付の履歴とログがある
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as 履歴・ログ

        U->>SVC: 起動する
        SVC->>FS: 保持期間を過ぎた履歴とログを消す
        Note over SVC: 以降は 正常シナリオ と同じ
        loop 常駐中、非機能要件の削除の間隔ごと
          SVC->>FS: 同じ条件で古い履歴とログを消す
        end
      ```
    expected:
      - 2 日前の日付の履歴とログが消えている
      - 今日の日付の履歴とログが残っている
    test: test_normal_when_expired_history_and_logs
  - name: 異常シナリオ（文字起こしのエンジンを準備できない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
      - name: モデルの読み込みの失敗
        description: ローカルの Whisper のモデルに存在しない名前を設定し、文字起こしワーカーがモデルを読み込めずに error を返す状態にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送信する
        WK-->>SVC: モデルを読み込めない（error）
        SVC->>LOG: 起動に失敗した理由を書く
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを通知する
      ```
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに起動に失敗した理由が書かれている
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
      - 録音開始のホットキーを押しても録音が始まらない
    notes:
      同じ扱いになる失敗: 文字起こしワーカーが ready を返さずに終わったときも同じ扱いになる。
    test: test_error_when_engine_unavailable
  - name: 異常シナリオ（API の待ち受けを始められない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: ポートの使用中
        description: API の待ち受けのポートを、ほかのプロセスが先に使っている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant API as API のサーバー
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        Note over SVC: エンジンの準備までは 正常シナリオ と同じ
        SVC->>API: 127.0.0.1 で待ち受けを始める
        API-->>SVC: 待ち受けを始められない
        SVC->>LOG: 待ち受けに失敗した理由を書く
        SVC->>TRAY: API を使えないことを通知する
        SVC->>SVC: 録音開始のホットキーの受付を始める
      ```
    expected:
      - トレイで API を使えないことが知らされている
      - ログに待ち受けに失敗した理由が書かれている
      - 録音開始のホットキーを押すと録音が始まる
    test: test_error_when_api_unavailable
  - name: 正常シナリオ（古い AI チャットの設定が残っている）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー・ブラウザを開く呼び出し。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。ブラウザを開く呼び出しは渡された URL を控え、Microsoft Edge を開かない
      - name: 古い設定
        description: '`settings.toml` の `outputs` に `id = "ai_chat"` の項目と送信先（`targets[]`）を 2 つ書いておく（うち 1 つは出さない）'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TOML as settings.toml
        participant TRAY as トレイ

        U->>SVC: 起動する
        SVC->>TOML: 設定を読む
        SVC->>SVC: ai_chat の送信先を、ブラウザ添付の種類のプリセットへ読み替える
        Note over SVC: 以降は 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - トレイのアイコンが待機中になっている（起動が中断されない）
      - 録音の画面に、出すとした送信先と同じタイトル・ホットキーのプリセットのボタンだけが出る
      - そのボタンで確定すると、送信先の URL を開いて貼り付け、Enter まで送信する
      - 起動しただけでは `settings.toml` が書き換わっていない
    test: test_normal_when_old_ai_chat_settings_remain
  - name: 正常シナリオ（OpenAI API を使う設定）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 文字起こしのエンジン
        description: OpenAI API を使う設定にし、設定の置き場所の `secrets/openai_api_key` に API キーの文字列だけを書いたファイルを置く
        notes: 環境変数 `OPENAI_API_KEY` は渡さない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant KEY as API キーのファイル
        participant TRAY as トレイ

        U->>SVC: 起動する
        Note over SVC: 準備中のアイコンを出すまでは 正常シナリオ と同じ
        SVC->>SVC: 環境変数 OPENAI_API_KEY が無い
        SVC->>KEY: API キーを読む
        KEY-->>SVC: API キー
        SVC->>SVC: OpenAI API のエンジンを作る（文字起こしワーカーは起動しない）
        Note over SVC: トークンを作るところからは 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - トレイのアイコンが待機中になっている
      - 録音開始のホットキーを押すと録音が始まる
      - 文字起こしワーカーの子プロセスが動いていない
      - ログにエンジンが OpenAI API であることが書かれ、API キーが書かれていない
    test: test_normal_when_openai
    notes:
      API キーの読み先: 環境変数 `OPENAI_API_KEY` があればそれを使い、無ければ設定の置き場所（Windows は `%APPDATA%\voice-paste\`、Linux は `~/.config/voice-paste/`）の `secrets/openai_api_key` を読む。ファイルの前後の空白と改行は除く。起動時はキーを読めるかだけを確かめ、OpenAI API へは送信しない。
      依存: faster-whisper・nvidia-* を入れていない仮想環境でも同じ流れで起動する。
  - name: 異常シナリオ（OpenAI の API キーが無い）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: '-'
      - name: API キーの欠落
        description: OpenAI API を使う設定にし、環境変数 `OPENAI_API_KEY` も `secrets/openai_api_key` も置かない
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>SVC: 環境変数にもファイルにも API キーが無い
        SVC->>LOG: 起動に失敗した理由（読んだ環境変数の名前とファイルのパス）を書く
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを通知する
      ```
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに、API キーを読む環境変数の名前とファイルのパスが書かれている
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
      - 録音開始のホットキーを押しても録音が始まらない
    test: test_error_when_openai_api_key_missing
    notes:
      ファイルが空: ファイルはあるが空白だけのときも同じ扱いになる。
  - name: 異常シナリオ（ローカルの Whisper の依存が入っていない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: faster-whisper のパッケージを見つけられないように差し替える
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
        notes: '-'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>SVC: faster-whisper のパッケージが見つからない（文字起こしワーカーは起動しない）
        SVC->>LOG: 起動に失敗した理由と、local-whisper の extra を含めて環境を作り直すことを書く
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを通知する
      ```
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに、local-whisper の extra を含めて環境を作り直すことが書かれている
      - 文字起こしワーカーの子プロセスが動いていない
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
    test: test_error_when_local_whisper_not_installed
lead: '常駐サービスを起動し、文字起こしのエンジン・API の待ち受け・ホットキーの受付を立てて、録音の開始を待つ状態にする単一ユースケース。'
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: ユーザーが常駐サービスを起動する（Windows はショートカットを開く、Linux は `python -m voice_paste` を流す）
preconditions:
  - Windows か Linux（Ubuntu 24.04 の Xorg のセッション）の端末で、リポジトリの直下に仮想環境がある
  - 設定ファイル（Windows は `%APPDATA%\voice-paste\settings.toml`、Linux は `~/.config/voice-paste/settings.toml`）がある（無ければ既定値で作る）
test_file: tests/e2e/単一ユースケース/test_start_resident_app.py
notes:
  E2E のテスト: |-
    正常シナリオと「API の待ち受けを始められない」の期待値「録音開始のホットキーを押すと録音が始まる」と、「古い AI チャットの設定が残っている」の期待値のうちプリセットのボタンと確定して送信するまでの 2 つは、録音の入力を WAV を流すものに、システム音量を下げた値と戻した値を控えるものに差し替えて確かめる（マイクを開かない）。「古い AI チャットの設定が残っている」は、さらに貼り付けのキーを送信したキーを控えるものに、ブラウザを開く呼び出しを渡された URL を控えるものに差し替え、送信先の URL を開いて貼り付け、Enter まで送信することを、控えた URL・クリップボード・控えたキーで確かめる

    E2E は実機のマウス・キーボードを使わず、Windows のシェル（タスクバーのトレイ・通知・エクスプローラー）を読まない（#75）。
    常駐アプリは pytest のプロセスの中で `main()` から起動し（`--data-dir` の一時フォルダ、Qt は offscreen で画面に出さない）、トレイの状態はトレイのアイコンのヒントの文字で、通知はログで確かめる。
    トレイのメニューは項目を trigger して選び、画面のボタン・欄はクリックとキーを Qt のイベントで渡す。
    ホットキーの受付は差し替え、ホットキーが押された体で登録された関数を呼ぶ。「文字起こしのエンジンを準備できない」の「録音開始のホットキーを押しても録音が始まらない」は、ホットキーの受付が始まっていないことで確かめる。
    「前の常駐サービスが動いている」は、別プロセスで 2 つ起動し、ログ・トークンのファイル・プロセスで確かめる。前のアイコンが残っていないことは、前のプロセスが片付けでアイコンを消して終わったことで確かめる
