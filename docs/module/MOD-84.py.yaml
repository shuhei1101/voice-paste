        passing: positional
        description: QApplication.quit
      - name: hotkey_listener
        type: HotkeyListener | GnomeShortcutListener
        required: true
        passing: positional
        description: ホットキーの受付（PlatformAdapters.create_hotkey_listener で作ったもの。設定画面の間は止める）
      - name: show_recording_window
        type: Callable[[], None]
        required: true
        passing: positional
        description: 隠した録音の画面を戻す指示（notify に show_recording_window と bridge を部分適用したもの。resume_hotkeys が build_hotkey_bindings へ渡す）
      - name: apply_theme
        type: Callable[[], None]
        required: true
        passing: positional
        description: SettingsStore.get の ui.theme で画面の明暗を当て直す（apply_theme に QApplication と paths.ui_image_dir を部分適用したもの）
    returns:
      type: UiDeps
      description: 画面の依存
    process: |-
      1. start に start_local_session(tray)、pause・resume・cancel・current_session・switch_output に SessionManager のメソッド、complete に output_id・preset で SessionManager.complete を呼ぶ関数、level に recorder_level、get_settings に SettingsStore.get を渡す（エンジンを準備できなかった起動の UiDeps の switch_output は、ほかの録音の関数と同じく何もしない関数）
      2. suspend_hotkeys に hotkey_listener.stop、resume_hotkeys に SettingsStore.get の設定と show_recording_window で build_hotkey_bindings して hotkey_listener.start を呼ぶ関数を渡す（Wayland のセッションの GnomeShortcutListener では、設定画面を開いている間はカスタムショートカットの登録を外す）
      3. settings_dir に settings.yaml のフォルダ、log_dir にログのフォルダを渡す
      4. output_titles に、OUTPUTS のうち api_only でない出力先の ID → title を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      5. apply_theme に引数の apply_theme を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      6. list_glossaries に SettingsStore.get の設定と settings.yaml のフォルダで resolve_glossaries を呼ぶ関数、list_glossary_presets に同じ設定とフォルダで resolve_glossary_presets を呼ぶ関数、read_glossary に read_glossary_rows、new_glossary_path に settings.yaml のフォルダの `glossaries` を部分適用した next_glossary_path を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      7. copy に copy_to_clipboard、reset_settings に引数の reset_settings、default_settings に paths.defaults_file と SETTINGS_MODEL で load_default_settings を呼ぶ関数を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      8. hidden_setting_keys に hidden_setting_keys(unavailable_features(CURRENT_OS)) を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      9. reports_progress に、Handlers.active_engine が local_whisper かを渡す（切り戻した起動では進みを知らせる。エンジンを準備できなかった起動の UiDeps は、このときの SettingsStore.get の transcription.engine が local_whisper か）
    status: implemented
  - name: reset_applied_settings
    title: 設定を既定に戻して反映
    container: main.py
    usecase: 設定を変える
    summary: 環境の値から全てのキーを外し、既定値と checkout の上書きを重ねた設定を読み直して SettingsStore を入れ替える（UiDeps.reset_settings）
    kind: 関数
    scope: public
    args:
      - name: paths
        type: AppPaths
        required: true
        passing: injected
        description: 置き場所
      - name: store
        type: SettingsStore
        required: true
        passing: injected
        description: 今の設定
      - name: model
        type: type[Settings]
        required: true
        passing: injected
        description: SETTINGS_MODEL
    returns:
      type: tuple[Settings, bool]
      description: 読み直した設定と、再起動が要る項目が変わったか
    process: |-
      1. 環境の値のキーを全て外す（reset_settings(paths.settings_file)）
      2. 設定を読み直す（load_settings(paths, model)）
         - SettingsError の場合、SettingsStore を入れ替えずにそのまま送出する
      3. has_restart_change(store.get(), 読み直した設定) を控えてから SettingsStore を入れ替え、読み直した設定と控えた値を返す
         - `[INFO]` 設定を既定に戻した（設定ファイルのパス・再起動が要るか）
    exceptions:
      - name: SettingsError
        condition: checkout の上書きか既定値を読めない
    unit_tests:
      - name: test_reset_applied_settings
        case: 正常
        summary: 環境の値を空にし、既定値の設定に入れ替える
        condition: 一時フォルダに hotkeys.start と transcription.local_whisper.model を既定と違う値にした settings.yaml
        mock: なし（一時フォルダ）
        expected: (load_default_settings の設定, True)。settings.yaml にキーが無く、store.get() が返った設定
      - name: test_reset_applied_settings_when_local_override
        case: 正常
        summary: checkout の上書きの値は残る
        condition: settings.local.yaml に hotkeys.start = B、settings.yaml に hotkeys.start = A
        mock: なし（一時フォルダ）
        expected: 返った設定の hotkeys.start が B。settings.local.yaml が変わっていない
    refs:
      - SC-6#
    status: planned
  - name: purge_old_files
    title: 古いログと履歴の削除
    container: main.py
    usecase: 常駐アプリを起動する
    summary: 設定の保持期間を過ぎたログと履歴を消す
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定（ログと履歴の保持期間・履歴を残すか）
      - name: paths
        type: AppPaths
        required: true
        passing: keyword
        description: 置き場所
      - name: active_session_ids
        type: Callable[[], set[str]]
        required: true
        passing: keyword
        description: 処理中の録音セッションの ID を返す関数（一時の音声を消さずに残す）
    returns:
      type: None
      description: なし
    process: |-
      1. 保持期間を過ぎた日付のログを消す（purge_old_logs(paths.log_dir, settings.logging.retention_days, local_today())）
      2. 履歴を残す設定（settings.history.enabled）か
         - 残す場合、保持期間を過ぎた履歴のフォルダと取り残された一時の音声を消す（purge_expired(retention_days=settings.history.retention_days, paths, now=_local_now, active_session_ids)）
         - 残さない場合、履歴は消さない
    unit_tests:
      - name: test_purge_old_files
        case: 正常
        summary: ログと履歴の両方を消す
        condition: history.enabled=true・history.retention_days=1・logging.retention_days=7
        mock: purge_old_logs・purge_expired
        expected: purge_old_logs に (log_dir, 7, 今日) が、purge_expired に retention_days=1 と active_session_ids が渡る
      - name: test_purge_old_files_when_history_disabled
        case: 正常
        summary: 履歴を残さない設定ならログだけ消す
        condition: history.enabled=false
        mock: purge_old_logs・purge_expired
        expected: purge_old_logs が 1 回呼ばれ、purge_expired が呼ばれない
    status: implemented
  - name: _wire_preset_kinds
    title: プリセットの種類の配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: internal
    summary: PRESET_KINDS の各種類の handler に、種類ごとの外部連携の関数と設定の値を部分適用して返す
    args:
      - name: get_settings
        type: Callable[[], Settings]
        required: true
        passing: positional
        description: 今の設定を返す（keyboard.paste_key・outputs[]・preset_options を読む）
      - name: open_window
        type: Callable[[str], None]
        required: true
        passing: keyword
        description: ブラウザ添付の画面を開く（PlatformAdapters.open_app_window）
      - name: send_paste
        type: Callable[[str], None]
        required: true
        passing: keyword
        description: 貼り付けのキーの送信（PlatformAdapters.send_paste）
      - name: send_enter_fn
        type: SendEnterFn | None
        required: false
        default: None
        passing: keyword
        description: ブラウザ添付が Enter を送信する関数（PlatformAdapters.send_enter）。None なら sender.py の send_enter を使う
    returns:
      type: tuple[PresetKindSpec, ...]
      description: handler を配線した種類の一覧（PRESET_KINDS と同じ並び）
    process: |-
      1. 呼ぶたびに get_settings() を読む関数を作る（届けるたびに読む）
         - paste: keyboard.paste_key で引数の send_paste を呼ぶ
         - get_enter_delay_sec: read_enter_delay_sec(get_settings())（貼り付けて送信の秒数）
         - get_open_delay_sec: preset_options.browser.open_delay_sec を返す
         - get_timeout_sec: preset_options.endpoint.timeout_sec を返す
      2. PRESET_KINDS を順に見て、種類ごとに build_handlers の 4 のとおり部分適用した handler に差し替える
         - 部分適用の対象に無い種類はそのまま残す
    unit_tests:
      - name: test_wire_preset_kinds
        case: 正常
        summary: 各種類に設定の値を配線する
        condition: preset_options.browser.open_delay_sec が 1.5、paste_and_send の enter_delay_sec が 0.2、preset_options.endpoint.timeout_sec が 2.0
        mock: copy_to_clipboard・send_paste・send_enter・open_app_window・time.sleep・post_json
        expected: 返った一覧の kind が PRESET_KINDS と同じ並びで、browser の handler を send_enter True のプリセットで呼ぶと sleep に 1.5・0.2 がこの順に渡り、endpoint の handler を呼ぶと post_json の timeout_sec に 2.0 が渡る
      - name: test_wire_preset_kinds_when_settings_changed
        case: 正常
        summary: 配線の後に変えたタイムアウトが次の送信に効く
        condition: 配線の後に get_settings が返す設定の preset_options.endpoint.timeout_sec を 5.0 に差し替える
        mock: post_json
        expected: endpoint の handler を呼ぶと post_json の timeout_sec に 5.0 が渡る
    refs:
      - MOD-58#constants[PRESET_KINDS]
    status: implemented
  - name: select_platform_adapters
    title: OS ごとの実装の選択
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    summary: OS とデスクトップのセッションに合った実装を PlatformAdapters に束ねる。その OS・セッションだけのモジュールは、選んだ分岐の中で import する
    scope: public
    args:
      - name: os_kind
        type: OsKind
        required: true
        passing: positional
        description: 動いている OS（main は CURRENT_OS を渡す）
      - name: lock_file
        type: Path
        required: true
        passing: keyword
        description: Linux のロックファイル（main は AppPaths.lock_file を渡す。Windows では使わない）
      - name: display_session
        type: DisplaySession
        required: true
        passing: keyword
        description: Linux のデスクトップのセッション（main は detect_display_session(os.environ) を渡す。Windows では使わない）
    returns:
      type: PlatformAdapters
      description: OS ごとの実装
    process: |-
      1. os_kind で分ける
         - OsKind.WINDOWS の場合、integrations/volume/adapter.py（comtypes・pycaw を読み込む）をここで import し、acquire_single_instance・lower_volume・restore_volume・open_app_window・send_paste・send_enter・HotkeyListener() を返す関数・validate_hotkeys・qt_platform None・何もしない open_key_sender と close_key_sender・CREATE_NO_WINDOW・relaunch(os_kind=WINDOWS) を束ねる
         - OsKind.LINUX の場合、runtime/single_instance_linux.py（fcntl を読み込む）をここで import し、acquire_single_instance_linux（functools.partial で lock_file を部分適用）・lower_volume と restore_volume に None・open_app_window_linux・0・relaunch(os_kind=LINUX) に、display_session で分けた実装を足して束ねる
           - DisplaySession.X11 の場合、integrations/keyboard/sender_linux.py（python-xlib を読み込む）をここで import し、send_paste_linux・send_enter・HotkeyListener() を返す関数・validate_hotkeys・qt_platform None・何もしない open_key_sender と close_key_sender
           - DisplaySession.WAYLAND の場合、integrations/keyboard/sender_wayland.py（python-evdev を読み込む）と runtime/hotkey_gnome.py をここで import する。pyperclip の書き先を xclip にし（use_xclip_clipboard）、まだ開かない UInputKeyboard を 1 つ作って、その send_paste・send_enter・open・close と、GnomeShortcutListener(name, lock) を返す関数・validate_gnome_hotkeys・qt_platform `xcb` を束ねる
    unit_tests:
      - name: test_select_platform_adapters_when_windows
        case: 正常
        summary: Windows は pycaw の音量・Edge・Win32 の排他を選ぶ
        condition: os_kind=OsKind.WINDOWS（Linux では skip）
        mock: なし
        expected: lower_volume が integrations/volume/adapter.py の lower_volume、open_app_window が opener.py の open_app_window、acquire_single_instance が single_instance.py の acquire_single_instance、send_paste が sender.py の send_paste、worker_creationflags が CREATE_NO_WINDOW、send_enter が sender.py の send_enter、create_hotkey_listener が HotkeyListener を返し、qt_platform が None
      - name: test_select_platform_adapters_when_linux
        case: 正常
        summary: Linux の Xorg のセッションは何もしない音量・Chromium 系・flock の排他・XTEST の貼り付けを選ぶ
        condition: os_kind=OsKind.LINUX・display_session=DisplaySession.X11（Windows では skip）
        mock: なし
        expected: lower_volume と restore_volume が None、validate_hotkeys が hotkey.py の validate_hotkeys、open_app_window が open_app_window_linux、send_paste が send_paste_linux、acquire_single_instance が lock_file を部分適用した acquire_single_instance_linux（func と keywords で確かめる）、worker_creationflags が 0。voice_paste.integrations.volume.adapter が sys.modules に無い。send_enter が sender.py の send_enter、create_hotkey_listener が HotkeyListener を返し、qt_platform が None。voice_paste.integrations.keyboard.sender_wayland が sys.modules に無い
      - name: test_select_platform_adapters_when_wayland
        case: 正常
        summary: Wayland のセッションは uinput のキーの送信・GNOME のショートカット・xcb を選ぶ
        condition: os_kind=OsKind.LINUX・display_session=DisplaySession.WAYLAND（Windows では skip）
        mock: pyperclip.set_clipboard・evdev.UInput
        expected: send_paste・send_enter・open_key_sender・close_key_sender が同じ UInputKeyboard のメソッドで、UInput が作られていない（open の前）。create_hotkey_listener(名前, 排他) が GnomeShortcutListener を返し、qt_platform が "xcb"、validate_hotkeys が validate_gnome_hotkeys、pyperclip.set_clipboard に "xclip" が 1 回渡る。voice_paste.integrations.keyboard.sender_linux が sys.modules に無い
    status: planned
