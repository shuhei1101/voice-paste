  state: 済
  date: '2026-10-01'
  detail: WSL（Linux・Python 3.12）で、127.0.0.1 のエンドポイントへ結果の JSON（session_id・result・text）を POST して 200 と受け取りを確かめた。Windows の実機では未確認
