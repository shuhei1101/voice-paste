id: LIB-28
visibility: internal
title: "tomlkit"
kind: "ライブラリ"
version:
  current: 0.15.2
  latest: 0.15.1
  checked_on: '2026-10-01'
  source: pyproject.toml と uv.lock のバージョン
  pinning: マイナーバージョンの中で固定（~=0.15.1。0.x はマイナーバージョンで互換の無い変更が入る）
catalogs:
  - name: API
    version: 0.15.1
    entries:
      - name: parse
        kind: 関数
        purpose: 前のバージョンの settings.toml を、settings.yaml へ移すために読む
      - name: TOMLDocument.unwrap
        kind: メソッド
        purpose: 読んだ文書を素の dict に戻し、既定値との差分を求める
      - name: TOMLKitError
        kind: 例外
        purpose: 書式の壊れた settings.toml を移すときに送出される（SettingsError に変え、settings.yaml を作らない）
lead: コメントと書式を保ったまま TOML を読み書きするライブラリ。
purl: pkg:pypi/tomlkit
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/shared/settings.py
upstream: python-poetry/tomlkit
verification:
  state: 済
  date: '2026-10-01'
  detail: WSL（Linux・Python 3.12）で、コメント付きの TOML を parse して値を書き換え、dumps で行頭・行末のコメントが残ることと、表の配列（aot）を丸ごと入れ替えられることを確かめた。Windows（Python 3.14.3の一時の venv、tomlkit 0.15.1）で、設定の書き戻しを単体テストで動かし、コメントを保った値の置き換えと、`unwrap()` で素の dict に戻しての検証を確かめた
license: MIT（商用利用可）
official_url: https://github.com/python-poetry/tomlkit
docs_url: https://tomlkit.readthedocs.io/
