title: "アーキテクチャ図"
overview:
  direction: LR
  nodes:
    - id: U
      label: ユーザー
      shape: stadium
      kind: actor
    - id: CALLER
      label: API の呼び出し元（同じ端末のほかのプロセス）
      shape: stadium
      kind: actor
    - id: APP
      label: 常駐アプリ（API・トレイ・ホットキー・画面）
      kind: process
    - id: WORKER
      label: 文字起こしワーカー（子プロセス）
      kind: process
    - id: ENV
      label: 設定（settings.toml）
      shape: cylinder
      kind: store
    - id: HIST
      label: 履歴・ログ・トークン
      shape: cylinder
      kind: store
    - id: TARGET
      label: アクティブなアプリ
      kind: external
    - id: HF
      label: Hugging Face Hub
      kind: external
    - id: EDGE
      label: Microsoft Edge
      kind: external
    - id: EP
      label: 設定の送信先のエンドポイント
      kind: external
    - id: WEB
      label: 外の端末のブラウザ（スマホ・iPad・外の PC）
      shape: stadium
      kind: actor
    - id: GW
      label: ゲートウェイ（shuhdev-gateway・Cloudflare Access）
      kind: external
    - id: OAI
      label: OpenAI API
      kind: external
  edges:
    - from: U
      to: APP
      label: ホットキー・トレイ・音声
    - from: CALLER
      to: APP
      label: 開始・停止・完了（127.0.0.1・トークン）
    - from: APP
      to: CALLER
      label: 起こした文字の返送
    - from: APP
      to: ENV
      label: 読み書き
    - from: APP
      to: WORKER
      label: 録音のパス（JSON Lines）
    - from: WORKER
      to: HF
      label: モデルの取得
    - from: APP
      to: HIST
      label: 書き込み
    - from: APP
      to: TARGET
      label: 貼り付け
    - from: APP
      to: EDGE
      label: 子プロセス
    - from: APP
      to: EP
      label: 起こした文字（POST）
    - from: WEB
      to: GW
      label: 画面・音声・結果の取得（HTTPS）
    - from: GW
      to: APP
      label: /web/ の下（127.0.0.1・Origin の許可リスト）
    - from: APP
      to: OAI
      label: 録音（HTTPS・API キー。エンジンが openai のとき）
  subgraphs:
    - id: SYS
      label: voice-paste
      nodes:
        - APP
        - WORKER
        - ENV
        - HIST
repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/voice-paste
subsystems:
  - name: 常駐アプリ
    scope: desktop-app
    role: ショートカットから起動する 1 つの常駐サービス。ホットキー・トレイ・API のどの入口からも同じセッション（録音 → 文字起こし → 補正 → 出力先）を同時に 1 つだけ動かし、画面とトレイを出す（ローカルの文字起こしは文字起こしワーカーに任せる）
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows。Linux は Ubuntu 24.04 の Xorg のセッション）
    implementation: src/voice_paste/main.py
  - name: 文字起こしワーカー
    scope: transcription-worker
    role: 常駐アプリの子プロセスとしてローカルの Whisper のモデルを持ち、標準入出力の JSON Lines で受けた録音を文字に起こす
    runtime: Python 3.11
    runs_on: ユーザーの端末（Windows か Linux。常駐アプリが起動し、落ちたら再起動する）
    implementation: src/voice_paste/integrations/whisper/worker.py
lead: voice-paste のサブシステムと、ユーザー・貼り付け先のアプリ・文字起こしのモデルの取得元との境界。
external_systems:
  - name: Hugging Face Hub
    purpose: faster-whisper のモデルの取得（手元に無いときだけ）
    direction: 受信のみ
    protocol: HTTPS（faster-whisper が取得する）
    notes:
      事前確認: 文字起こしワーカーの起動時に、モデルを読み込めることを確かめる（手元に無ければその時点で取得する）。
    detail: dev/設計書/外部API/Hugging_Face_Hub#
  - name: Microsoft Edge
    purpose: ブラウザ添付のプリセットで確定したときに、プリセットの URL の画面を開く
    direction: 送信のみ
    protocol: 子プロセスの起動（`--app={URL}`）
    notes:
      事前確認: 不要。開けなかったときはそのボタンの操作だけが失敗し、音声入力には影響しない。
    detail: dev/設計書/外部ライブラリ/Microsoft_Edge#
  - name: API の呼び出し元
    purpose: 同じ端末のほかのプロセスが録音を開始・停止・完了し、指定したエンドポイントで起こした文字を受け取る
    direction: 双方向
    protocol: HTTP（127.0.0.1・Bearer のトークン。返送は呼び出し元のエンドポイントへ POST）
    notes:
      事前確認: 起動時に API の待ち受けを始められたか（uvicorn の started）を確かめ、始められなければトレイで知らせてホットキーだけで続ける。返送先は開始の要求を受けたときに許されるホストかを確かめる。届くかは返送のたびに確かめ、届かなくても常駐アプリを止めない。
    detail: dev/設計書/インターフェース定義/常駐アプリ/録音を開始する.py#
  - name: 設定の送信先のエンドポイント
    purpose: ホットキー・トレイから始めた録音を「エンドポイントへ送信」種類のカスタムプリセットで確定したときに、起こした文字を受け取る
    direction: 送信のみ
    protocol: HTTP / HTTPS の POST（プリセットの URL。任意で `Authorization` ヘッダー）
    notes:
      事前確認: 不要。届くかは送信するたびに確かめ、届かなければトレイで知らせて常駐アプリを止めない。
    detail: dev/設計書/インターフェース定義/常駐アプリ/設定のエンドポイントへ送信する.py#
  - name: ゲートウェイ（shuhdev-gateway）
    purpose: 外の端末のブラウザの要求を、Cloudflare Access で認証してから 127.0.0.1 の API の `/web/` の下へ中継する
    direction: 双方向
    protocol: HTTPS（外）→ HTTP（127.0.0.1。Host を `localhost:{ポート}` に書き換え、Origin はそのまま渡す）。常駐アプリは受けて応答を返すだけで、自分からは接続しない
    detail: dev/設計書/インターフェース定義/常駐アプリ/音声を受け付ける.py#
    cost: 無料。本文は 100 MB まで（Cloudflare の無料プラン）・応答待ちは 83 秒まで（ゲートウェイの `upstream.header_timeout_sec`）
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[ブラウザの要求の応答時間]
      - dev/設計書/非機能要件/非機能要件#requirements[ブラウザの本文の上限]
    notes:
      事前確認: 常駐アプリはゲートウェイへ問い合わせない（受ける側のため）。公開の登録は反映作業『ゲートウェイへの登録』で行い、外の端末から `/web/` が画面を返すことで確かめる。
    status: planned
    introduced:
      pr: 171
  - name: OpenAI API
    purpose: 設定のエンジンが openai のときに、録音とブラウザの音声を文字に起こす（文字起こしワーカーの代わり）
    direction: 双方向
    protocol: 'HTTPS の POST（multipart。`Authorization: Bearer`。ベース URL は設定の transcription.openai.base_url）'
    detail: dev/設計書/外部API/OpenAI#
    test_file: tests/external/voice_paste/integrations/openai/test_transcriber.py
    cost: 従量課金（gpt-4o-mini-transcribe は音声 1 分あたり $0.003）。録音が端末の外へ送信される
    refs:
      - dev/設計書/非機能要件/非機能要件#requirements[OpenAIの文字起こしのタイムアウトと再送]
      - dev/設計書/非機能要件/非機能要件#requirements[OpenAIの文字起こしの料金]
    status: planned
    introduced:
      pr: 204
constraints: |-
  - Windows で動かす（トレイ・ホットキー・クリップボード・キー入力・システムの音量を Windows の機能で扱う）
  - Linux（Ubuntu 24.04 の Xorg のセッション）でも起動できる。OS で分かれる実装は配線で選び、Linux ではシステムの音量を変えず、ローカルの文字起こしの既定は CPU にする
  - Windows のショートカットから起動できる（手段はバッチファイルに限らない）
  - ビルドせず、master のソースをそのまま動かす
  - Python で書く
  - API は 127.0.0.1 だけで待ち受ける。`/web/` の外は起動ごとのトークンで照合し、`/web/` の下はトークンを求めず Host と Origin の許可リストで通す（外からの認証はゲートウェイの Cloudflare Access が持つ）
  - ローカルの文字起こしは GPU（CUDA）で動かす
  - ユーザーは master のコードをビルドせずに普段使いしている（ショートカットは起動のバッチファイルから常駐アプリを起動する）
