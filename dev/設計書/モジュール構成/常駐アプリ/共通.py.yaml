title: "常駐アプリ / 共通"
lead: どの層からも使う設定のモデル・ログ・例外・置き場所のパスと、feature の間を渡る型を持つ。ほかの層に依存しない。
directory: |-
  ```
  src/voice_paste/shared/
  ├── __init__.py
  ├── settings.py       # 設定のモデル（pydantic）、TOML の読み書き（tomlkit）
  ├── logger.py         # 標準の logging の設定。日付ごとのファイルと保持期間での削除
  ├── errors.py         # 例外の階層
  ├── constants.py      # アプリ名と置き場所のパス（platformdirs）
  └── types.py          # feature の間を渡る型（入口・録音・文字起こしの結果）
  ```
enums:
  - name: Entry
    title: 入口
    container: shared/types.py
    usecase: 共通
    summary: セッションを始めた入口。セッションと出力先が使う
    values:
      - value: hotkey
        title: ホットキー
        description: 録音開始のホットキー
      - value: tray
        title: トレイ
        description: トレイのメニュー
      - value: api
        title: API
        description: POST /sessions
    status: implemented
  - name: OutputSettings
    title: 出力先の設定
    container: shared/settings.py
    usecase: 共通
    summary: 出力先ごとの設定の判別共用体（`Annotated[... | ..., Field(discriminator="id")]`）
    description: |-
      呼び出し元へ返す出力先（callback）は API から始めた録音だけが使い、オン・オフを持たないため一覧に置かない。
      既定の一覧は下の 4 件をこの並びで持つ。
    values:
      - value: paste_and_send
        title: 貼り付けて送信
        description: PasteAndSendSettings
      - value: paste_only
        title: 貼り付けのみ
        description: PasteOnlySettings
      - value: copy_only
        title: コピーのみ
        description: CopyOnlySettings
      - value: ai_chat
        title: AI チャットへ送る
        description: AiChatSettings
    status: implemented
data_models:
  - name: Recording
    title: 録音
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 止めた録音の音と形式。録音・セッション・履歴が使う
    properties:
      - name: samples
        type: numpy.ndarray
        description: モノラルの 16 bit の音
      - name: sample_rate
        type: int
        description: サンプルレート（Hz）
      - name: duration_sec
        type: float
        description: 録音の長さ（一時停止の間を除く）
    status: implemented
  - name: TranscriptionOutcome
    title: 文字起こしの結果
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 出力先へ渡す結果。セッションと出力先が使う
    properties:
      - name: session_id
        type: str
        description: セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated"]
        description: 結果の種類
      - name: text
        type: str
        description: 用語集で補正した文字。空・失敗・打ち切りは空文字
      - name: error
        type: str | None
        description: 失敗の理由
    status: implemented
  - name: AppPaths
    title: 置き場所のパス
    container: shared/constants.py
    usecase: 共通
    role: DTO
    summary: 設定・履歴・ログ・一時の音声・トークンの置き場所
    description: |-
      resolve_app_paths で作る。
      既定は platformdirs で `%APPDATA%\voice-paste\`（設定）と `%LOCALAPPDATA%\voice-paste\`（それ以外）を引く。
      データの置き場所（`--data-dir`）を渡したときは、全てをその下に置く。E2E・非機能要件テストはこれで普段使いの置き場所に触れない。
      `@dataclass(frozen=True, slots=True, kw_only=True)`。
    properties:
      - name: settings_file
        type: Path
        description: '`%APPDATA%\voice-paste\settings.toml`（データの置き場所を渡したときは `{data_dir}\settings.toml`）'
      - name: history_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\history\`（`{data_dir}\history\`）'
      - name: log_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\log\`（`{data_dir}\log\`）'
      - name: tmp_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\tmp\`（`{data_dir}\tmp\`。履歴を残さないときの一時の音声）'
      - name: token_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\api_token`（`{data_dir}\api_token`。起動ごとのトークンとポート）'
    refs:
      - dev/設計書/外部ライブラリ/platformdirs#
    status: implemented
  - name: Settings
    title: 設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: settings.toml の全体。項目ごとに範囲・説明・再起動が要るかの印を持ち、設定画面の欄はこのモデルから組み立てる
    inherits: pydantic.BaseModel
    description: |-
      キーの一つ一つ（型・既定値・範囲・反映）は設計書『設定』の settings.toml の行が持つ。
      まとまりのモデルも全て `pydantic.BaseModel` で、どれも `model_config = ConfigDict(extra="forbid")` にして知らないキー（書き間違い）を断る。
      各項目は `Field(description=..., json_schema_extra={"reload": "immediate" | "restart"})` で再起動が要るかの印を持つ。
      全ての項目に既定値があり、`Settings()` が既定の設定になる。
    properties:
      - name: transcription
        type: TranscriptionSettings
        description: 使うエンジンと、エンジンごとの設定
      - name: recording
        type: RecordingSettings
        description: 録音中の音量・画面を出さない設定
      - name: hotkeys
        type: HotkeySettings
        description: 録音の開始・一時停止・取り消しのホットキー（確定のホットキーは出力先ごとに持つ）
      - name: keyboard
        type: KeyboardSettings
        description: 貼り付けのキー
      - name: outputs
        type: list[OutputSettings]
        description: 出力先ごとのオン・オフ・確定のホットキー・出力先ごとの設定。ID は重ならない
      - name: history
        type: HistorySettings
        description: 履歴を残すか・保持期間
      - name: logging
        type: LoggingSettings
        description: ログのレベル・保持期間
      - name: ui
        type: UiSettings
        description: 録音の画面の出し方
      - name: glossary_path
        type: Path | None
        default: None
        description: 用語集の CSV。None は設定ファイルと同じフォルダの yogo.csv
      - name: api
        type: ApiSettings
        description: 待ち受けのポート・返送を許すホスト
    refs:
      - dev/設計書/外部ライブラリ/pydantic#
      - dev/設計書/設定/常駐アプリ#
    status: implemented
  - name: TranscriptionSettings
    title: 文字起こしの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 使うエンジンと、エンジンごとの設定
    inherits: pydantic.BaseModel
    properties:
      - name: engine
        type: Literal["local_whisper"]
        default: local_whisper
        description: 使う文字起こしのエンジン（文字起こしの EngineName）。エンジンはローカルの Whisper だけで、エンジンを足すときに値を足す
      - name: local_whisper
        type: LocalWhisperSettings
        description: ローカルの Whisper の設定
    status: implemented
  - name: LocalWhisperSettings
    title: ローカルの Whisper の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 文字起こしワーカーへ渡すモデル・デバイス・量子化・言語・ビーム幅・温度・VAD
    inherits: pydantic.BaseModel
    properties:
      - name: model
        type: str
        default: large-v3
        description: faster-whisper のモデル
      - name: device
        type: Literal["cuda", "cpu"]
        default: cuda
        description: 動かすデバイス
      - name: compute_type
        type: Literal["float16", "int8", "float32"]
        default: float16
        description: 計算の精度
      - name: cpu_threads
        type: int
        default: '0'
        description: CPU のスレッド数（0 は自動）
      - name: num_workers
        type: int
        default: '1'
        description: 並列のデコードの数
      - name: beam_size
        type: int
        default: '10'
        description: ビームサーチの幅
      - name: best_of
        type: int
        default: '5'
        description: サンプリングの候補の数
      - name: language
        type: str
        default: ja
        description: 認識する言語
      - name: vad_filter
        type: bool
        default: 'True'
        description: 無音の区間を除くか
      - name: vad_threshold
        type: float
        default: '0.5'
        description: 音声とみなす確信度の閾値
      - name: vad_min_speech_ms
        type: int
        default: '250'
        description: これより短い音を雑音として除く（ミリ秒）
      - name: vad_min_silence_ms
        type: int
        default: '2000'
        description: これ以上の無音で区間を区切る（ミリ秒）
      - name: condition_on_previous_text
        type: bool
        default: 'False'
        description: 前の区間の文字を次の区間の文脈に使うか
      - name: temperature
        type: float
        default: '0.0'
        description: サンプリングの温度
      - name: no_speech_threshold
        type: float
        default: '0.6'
        description: 区間を無音とみなす確信度の閾値
    status: implemented
  - name: RecordingSettings
    title: 録音の設定
    container: shared/settings.py
    usecase: 共通
