title: "録音を開始する"
entry:
  kind: endpoint
  value: POST /sessions
flows:
  - name: 正常系
    summary: 画面を出さない録音を始め、セッションの ID を返す
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える（マイクは開ける）
      - name: 待機中
        description: ほかの録音・文字起こしを処理していない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク

        C->>IF: トークン・callback_url
        IF->>IF: Host・Origin・トークン・返送先を確かめる
        IF->>MIC: 録音を始める
        IF-->>C: 202・session_id
      ```
    expected:
      - 202 と session_id が返る
      - セッションが録音中になっている
      - 録音の画面を開いていない
    test: test_normal
  - name: 異常系（返送先が許可されていない・400）
    summary: 許可していない返送先では録音を始めない
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える
      - name: 返送先
        description: loopback でも許可したホストでもない URL
        notes: '`http://example.com/result`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions

        C->>IF: トークン・許可していない callback_url
        IF-->>C: 400
      ```
    expected:
      - 400 が返る
      - 録音が始まっていない
    test: test_error_when_callback_not_allowed
  - name: 異常系（トークンが合わない・401）
    summary: トークンが合わなければ録音を始めない
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える
      - name: トークン
        description: 今回の起動のものと違うトークンか、Authorization 無し
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant LOG as ログ

        C->>IF: 合わないトークン
        IF->>LOG: 断った理由と要求元（Host・Origin）を書く（トークンは書かない）
        IF-->>C: 401
      ```
    expected:
      - 401 が返る
      - 録音が始まっていない
      - ログに断った理由と要求元が書かれ、トークンの値は書かれていない
    test: test_error_when_token_mismatch
  - name: 異常系（ブラウザからの要求・403）
    summary: Origin の付いた要求と、Host が待ち受けのホストでない要求を断る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える
      - name: 要求のヘッダー
        description: 正しいトークンに Origin を付けるか、Host をほかのホスト名にする
        notes: '`Origin: http://evil.example`・`Host: evil.example`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant LOG as ログ

        C->>IF: Origin ありか、ほかの Host
        IF->>LOG: 断った理由と要求元（Host・Origin）を書く（トークンは書かない）
        IF-->>C: 403
      ```
    expected:
      - 403 が返る
      - 録音が始まっていない
      - ログに断った理由と要求元が書かれ、トークンの値は書かれていない
    test: test_error_when_browser_request
  - name: 異常系（処理中・409）
    summary: ほかの録音・文字起こしの処理中は開始を断る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える
      - name: 処理中
        description: ホットキーから始めた録音が録音中である
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions

        C->>IF: トークン・callback_url
        IF-->>C: 409
      ```
    expected:
      - 409 が返る
      - 処理中の録音が続いている
      - 2 つ目の録音が始まっていない
    test: test_error_when_busy
  - name: 異常系（マイクを開けない・503）
    summary: マイクを開けなければ音量を戻して断る
    setup:
      - name: Mock
        description: マイクを開くと例外になるように差し替える。システム音量・トレイも差し替える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions
        participant MIC as マイク
        participant LOG as ログ

        C->>IF: トークン・callback_url
        IF->>MIC: 録音を始める
        MIC-->>IF: 開けない
        IF->>LOG: マイクを開けなかった理由を書く
        IF-->>C: 503
      ```
    expected:
      - 503 が返る
      - システム音量が録音前の値に戻っている
      - 待機中に戻り、続く開始が 409 にならない
      - ログにマイクを開けなかった理由が書かれている
    test: test_error_when_microphone_unavailable
lead: 返送先のエンドポイントを受け取り、画面を出さない録音を始めてセッションの ID を返す。
identifier: start_session
permissions: 今回の起動のトークン（トークンのファイルを読める、同じ端末・同じユーザーのプロセス）
idempotent: false
side_effects: マイクの録音を始め、設定で録音中の音量を下げるようにしていればシステム音量を下げる。トレイのアイコンを録音中にする。
exclusivity: 録音・文字起こしは入口（ホットキー・トレイ・API）をまたいで同時に 1 つだけ。処理中に来た開始は 409 で断る。
request:
  - name: Authorization
    type: str
    required: true
    location: header
    description: 今回の起動のトークン
    format: '`Bearer {トークン}`'
    status: implemented
  - name: Host
    type: str
    required: true
    location: header
    description: 待ち受けのホスト
    constraints: '`127.0.0.1:{ポート}` か `localhost:{ポート}`'
    status: implemented
  - name: Origin
    type: str
    required: false
    default: なし（付いていれば 403）
    location: header
    description: ブラウザが付ける要求元。付いていてはいけない
    status: implemented
  - name: callback_url
    type: str
    required: true
    location: body
    description: 起こした文字・空の文字・失敗を返すエンドポイント
    constraints: ホストが loopback（127.0.0.0/8・::1・localhost）か、設定で許可したホスト
    format: uri
    example: http://127.0.0.1:9000/voice-paste/result
    status: implemented
request_example: |-
  ```json
  {
    "callback_url": "http://127.0.0.1:9000/voice-paste/result"
  }
  ```
response:
  - name: session_id
    type: str
    description: 始めた録音のセッションの ID。停止・完了と返送で使う
    format: uuid
    example: 3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10
response_example: |-
  ```json
  {
    "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10"
  }
  ```
status_codes:
  - code: '202'
    condition: 録音を始めた
  - code: '400'
    condition: 返送先が無い・URI でない・loopback でも許可したホストでもない
  - code: '401'
    condition: トークンが無いか、今回の起動のものと合わない
  - code: '403'
    condition: Origin が付いているか、Host が 127.0.0.1 でも localhost でもない
  - code: '409'
    condition: ほかの録音・文字起こしが処理中
  - code: '503'
    condition: マイクを開けず、録音を始められない
error_format: |-
  RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）で返す。
  `detail` には断った理由を書き、トークンなど秘密の値は含めない。
constraints:
  - item: 待ち受け
    constraint: 127.0.0.1 だけ
  - item: 応答時間
    constraint: 非機能要件の開始の応答時間以内（202・409 とも）
  - item: 認可
    constraint: 起動ごとに作るトークンの一致
  - item: レート制限
    constraint: 制限なし
    notes: 同時に 1 つだけの排他で足りる
  - item: セッションの長さ
    constraint: 非機能要件のセッションの上限時間（開始からの経過時間。停止中も数える）。達したら 上限で打ち切る
test_file: tests/integration/test_start_session.py
