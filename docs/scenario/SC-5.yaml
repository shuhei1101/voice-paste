        Note over SVC: 準備中のアイコンを出すまでは 正常シナリオ と同じ
        SVC->>WSL: サーバーの起動スクリプトを流す
        SVC->>SVC: 起動の待ち時間までにサーバーが応答しない
        SVC->>LOG: Haas のサーバーへ接続できなかった理由と、ローカルの Whisper で起こすことを書き込む
        SVC->>TRAY: Haas のサーバーへ接続できないため、ローカルの Whisper で起こすことを通知する
        SVC->>WK: 子プロセスを起動し、ローカルの Whisper の設定を送信する
        WK-->>SVC: モデルを読み込んだ（ready）
        Note over SVC: トークンを作るところからは 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```

      <!-- /map -->
    expected:
      - トレイで、Haas のサーバーへ接続できないためローカルの Whisper で起こすことが知らされている
      - ログに、接続できなかった理由とローカルの Whisper で起こすことが書き込まれている
      - 文字起こしワーカーの子プロセスが動いている
      - トレイのアイコンが待機中になり、録音開始のホットキーを押すと録音が始まる
      - '`settings.yaml` の `transcription.engine` は `haas` のまま変わっていない'
    test: test_normal_when_haas_unavailable
    notes:
      同じ扱いになる失敗: wsl.exe が無い・設定のディストリビューションが無い・起動スクリプトが失敗して終わったときも同じ扱いになる。
      切り戻す単位: 切り戻しは起動のときに決め、常駐サービスが終わるまでローカルの Whisper で起こす。Haas とローカルの Whisper のモデルを同時に GPU へ読み込まない。次の起動ではまた Haas のサーバーへの接続から始める。
      ローカルの Whisper も使えないとき: 切り戻した先のローカルの Whisper を準備できないときは、異常シナリオ（文字起こしのエンジンを準備できない）・異常シナリオ（ローカルの Whisper の依存が入っていない） と同じ扱いになる。
