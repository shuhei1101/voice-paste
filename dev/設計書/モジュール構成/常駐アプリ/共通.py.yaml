      1. data_dir が渡されているか
         - ある場合、設定・履歴・ログ・一時の音声・トークンを全て data_dir の下に置く
         - 無い場合、設定は user_config_dir(APP_NAME, appauthor=False, roaming=True)、それ以外は user_data_dir(APP_NAME, appauthor=False) の下に置く
    unit_tests:
