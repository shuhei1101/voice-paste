kind: "ライブラリ"
version:
  current: 0.28.1
  latest: 0.28.1
  checked_on: '2026-10-01'
  source: pyproject.toml
  pinning: マイナーバージョンの中で固定（~=0.28.1。0.x はマイナーバージョンで互換の無い変更が入る）
catalogs:
  - name: API
    version: 0.28.1
    entries:
      - name: Client.post
        kind: メソッド
        purpose: コールバック先のエンドポイントへ結果を JSON で送信する
      - name: Timeout
        kind: クラス
        purpose: 返送のタイムアウトを渡す
      - name: follow_redirects=False
        kind: 引数
        purpose: 許可していないホストへリダイレクトで流れるのを防ぐ（既定も追わない）
      - name: HTTPError
        kind: 例外
        purpose: 届かなかったときに再送するかを判断する
lead: 同期と非同期の両方を持つ Python の HTTP クライアント。
