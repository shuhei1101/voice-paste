id: MOD-46
visibility: internal
title: 常駐アプリ / ホットキーと画面 / settings_fields.py
functions:
  - name: make_radio_group
    title: ラジオボタンの組の組み立て
    container: ui/windows/settings_fields.py
    usecase: 設定を変える
    summary: リテラルの列挙の 1 つを選ぶ欄のラジオボタンを、tokens.toml の `shape.choice_gap`（20px。マーカーと名前の間より広くする）を空けて横に並べた QWidget を返却する。ボタンの名前は labels（無ければ値そのまま）にし、値はボタンに持たせて selected_radio で読み込む。単体テストは test_settings_window.py に配置する
    kind: 関数
    scope: public
    args:
      - name: choices
        type: tuple[str, ...]
        required: true
        passing: positional
        description: 列挙の値（並べる順）
      - name: current
        type: str
        required: true
        passing: positional
        description: 今の値（そのボタンを選んだ状態にする）
      - name: labels
        type: Mapping[str, str] | None
        required: false
        default: None
        passing: keyword
        description: 値 → ボタンの名前（項目の `json_schema_extra` の choice_labels）。無い値は値そのままを名前にする
    returns:
      type: QWidget
      description: ラジオボタンの組
    unit_tests:
      - name: test_make_radio_group_when_labels
        case: 正常
        summary: ボタンの名前を labels から出す
        condition: 'choices=(system, light, dark)、current=light、labels={system: Windows の設定に従う, light: ライト, dark: ダーク}。QT_QPA_PLATFORM=offscreen'
        mock: なし
        expected: ボタンの名前が「Windows の設定に従う」「ライト」「ダーク」の順で、「ライト」だけが選ばれている
      - name: test_make_radio_group_when_no_labels
        case: 正常
        summary: labels が無ければ値をそのまま名前にする
        condition: choices=(center, top-left)、current=center、labels なし。QT_QPA_PLATFORM=offscreen
        mock: なし
        expected: ボタンの名前が「center」「top-left」で、「center」が選ばれている
      - name: test_make_radio_group_when_spacing
        case: 正常
        summary: 選択肢の間を choice_gap だけ空ける
        condition: choices=(cuda, cpu)、current=cuda。QT_QPA_PLATFORM=offscreen
        mock: なし
        expected: 並べるレイアウトの spacing が tokens.toml の shape.choice_gap（20）
    status: implemented
  - name: selected_radio
    title: 選んだラジオボタンの値
    container: ui/windows/settings_fields.py
    usecase: 設定を変える
    summary: make_radio_group の組で選んでいるボタンの値（名前ではなく列挙の値）を返却する。単体テストは test_settings_window.py に配置する
    kind: 関数
    scope: public
    args:
      - name: container
        type: QWidget
        required: true
        passing: positional
        description: make_radio_group が返却した組
    returns:
      type: str
      description: 選んでいるボタンの値。どれも選んでいなければ空の文字
    unit_tests:
      - name: test_selected_radio_when_labels
        case: 正常
        summary: 名前ではなく値を返却する
        condition: test_make_radio_group_when_labels と同じ組で「ダーク」を選ぶ。QT_QPA_PLATFORM=offscreen
        mock: なし
        expected: dark
    status: implemented
