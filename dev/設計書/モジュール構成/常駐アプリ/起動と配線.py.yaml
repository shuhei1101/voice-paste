title: "常駐アプリ / 起動と配線"
lead: 常駐サービスの入口。単一インスタンスを確かめ、各 feature と外部連携を関数で配線し（composition root）、API・ホットキー・トレイを立てて画面のイベントループを回す。
directory: |-
  ```
  src/voice_paste/
  ├── __init__.py
  ├── __main__.py              # python -m voice_paste で main() を呼ぶ（CUDA の DLL のフォルダの登録もここ）
  ├── main.py                  # parse_args・build_handlers・main
  └── runtime/
      ├── single_instance.py   # 名前付きのミューテックスと終了の依頼（名前付きのイベント）
      └── timer.py             # RepeatingTimer（上限での打ち切りを定期に呼ぶ）
  ```

  リポジトリの直下は `pyproject.toml`・起動のバッチファイル 1 つ・`settings.sample.toml`・`README.md`・`CLAUDE.md`・`src/`・`resources/`・`tests/`・`dev/`・`docs/` に絞る。

  中身をまだ作らない層・feature・出力先（`features/{session,recording,transcription,correction,outputs,history}/`・`features/outputs/{paste_and_send,paste_only,copy_only,ai_chat,callback}/`・`integrations/`・`runtime/`・`server/`・`ui/`）は、import-linter の契約が指せるよう `__init__.py`（docstring 1 行）だけを置く。出力先の `registry.py`・`service.py`・`types.py` はそれぞれを作る Issue が置く。
diagrams:
  - name: 依存の向き
    diagram: |-
      ```mermaid
      classDiagram
        direction TB
        class 起動と配線
        class APIサーバー
        class ホットキーと画面
        class セッション
        class 録音
        class 文字起こし
        class 補正
        class 出力先
        class 履歴
        class 外部連携
        class 共通
        起動と配線 --> APIサーバー
        起動と配線 --> ホットキーと画面
        起動と配線 --> セッション
        起動と配線 --> 外部連携
        APIサーバー --> セッション : route の集約
        セッション --> 共通
        録音 --> 共通
        文字起こし --> 共通
        補正 --> 共通
        出力先 --> 外部連携
        履歴 --> 共通
        ホットキーと画面 --> 共通
        外部連携 --> 共通
      ```
data_models:
  - name: Handlers
    title: 配線済みの関数の束
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: 入口（API・ホットキー・画面）が使う配線済みのもの
    properties:
      - name: session_manager
        type: SessionManager
        description: セッション管理
      - name: session_api
        type: SessionApiDeps
        description: API サーバーへ渡すセッションの API の依存（設定の許可ホストを部分適用した返送先の確かめを含む）
      - name: settings
        type: Settings
        description: 読み込んだ設定
      - name: start_local_session
        type: Callable[[Entry], None]
        description: ホットキー・トレイの開始（SessionManager と notify を部分適用した start_local_session）
      - name: stop_engine
        type: Callable[[], None]
        description: 文字起こしのエンジンを止める（WhisperWorkerClient.stop）。終了時に呼ぶ
    status: implemented
  - name: CliArgs
    title: 起動の引数
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: '`python -m voice_paste` に渡した引数'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: data_dir
        type: Path | None
        description: データの置き場所（`--data-dir`）。設定・履歴・ログ・一時の音声・トークンをこの下に置く
      - name: migrate_env
        type: Path | None
        description: 設定へ移す .env（`--migrate-env`）。渡されたときだけ移す
    status: implemented
functions:
  - name: build_handlers
    title: 配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: public
    summary: 設定からエンジン・録音機・出力先・履歴を組み立て、SessionDeps を作って SessionManager と SessionApiDeps を返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 設定
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: notify
        type: NotifyFn
        required: true
        passing: positional
        description: 画面への知らせ
    returns:
      type: Handlers
      description: 配線済みの関数の束
    process: |-
      1. 設定のエンジン（local_whisper）の WhisperWorkerClient を作って起動し、その transcribe を文字起こしの engine に渡す
         - EngineError の場合、StartupError を送出する
      2. Recorder に音量のアダプタを渡す
      3. 出力先の deliver にオンの出力先と OUTPUTS を部分適用し、Session を入口・出力先・出力先に固有の宛先・返送先に分けて渡すアダプタを作る。各出力先には出力先の ID ごとに次を部分適用する（_wire_outputs）
         - 貼り付けて送信: copy_to_clipboard・設定の keyboard.paste_key を部分適用した send_paste・send_enter・time.sleep・設定の enter_delay_sec
         - 貼り付けのみ: copy_to_clipboard・部分適用した send_paste
         - コピーのみ: copy_to_clipboard
         - AI チャットへ送る: copy_to_clipboard・open_app_window・部分適用した send_paste・send_enter・time.sleep・設定の open_delay_sec・貼り付けて送信の enter_delay_sec
         - 呼び出し元へ返す: タイムアウトを部分適用した post_json・設定の許可ホスト・再送の回数と間隔の基数・time.sleep・random.uniform(0, x)
      4. 用語集を文字起こしのたびに読み直す correct を作る（load_glossary → apply_glossary）
      5. SessionDeps を組み、API のセッションの上限時間と共に SessionManager を作る
      6. SessionManager と、設定の許可ホストを部分適用した is_callback_allowed を SessionApiDeps に束ねる
      7. start_local_session に SessionManager と notify を部分適用する
    exceptions:
      - name: StartupError
        condition: 文字起こしのエンジンを準備できない
    status: implemented
    notes:
      並走の間の配線: 'ホットキーと画面を作る #21 までは 7 を飛ばし、Handlers は start_local_session を持たない。'
  - name: main
    title: 起動
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 常駐サービスを起動し、終わるまで画面のイベントループを回す
    returns:
      type: int
      description: 終了コード
    process: |-
      1. 名前付きの排他を取る（acquire_single_instance）
      2. ログを設定する（setup_logging）
      3. QApplication とトレイを作り、準備中を出す
      4. 設定を読む（load_settings）
         - SettingsError の場合、トレイで知らせてログに理由を書き、録音を受け付けずにトレイだけで続ける（5〜8 を飛ばす。古いログと履歴も消さない）
           - `[ERROR]` 起動に失敗した（理由）
      5. 設定の保持期間で古いログと履歴を消す（purge_old_logs・purge_expired）
      6. 配線する（build_handlers）
         - StartupError の場合、トレイで知らせてログに理由を書き、録音を受け付けずにトレイだけで続ける（7 と 8 を飛ばす）
           - `[ERROR]` 起動に失敗した（理由）
      7. トークンを作り、API サーバーを起動する（create_token・build_fastapi・ApiServerRunner.start）
         - True の場合だけ、トークンのファイルを書く（write_token_file。ファイルが指すのは常に待ち受けている自分になり、動いているほかの起動のトークンを上書きしない）
         - False の場合、トークンのファイルを書かずに api_unavailable を知らせて（トレイ）続ける
      8. ホットキーの受付を始め（開始は start_local_session、確定・一時停止・取り消しは SessionManager のメソッド）、上限の打ち切りを RepeatingTimer で SESSION_LIMIT_CHECK_INTERVAL_SEC ごとに、古い履歴・ログの削除を定期に呼ぶ
      9. トレイを待機中にし、イベントループを回す
      10. 終了の依頼かトレイの終了で、新しい開始が来ないように入口とタイマー（ホットキー・API サーバー・タイマー）を先に止め、録音を捨て（SessionManager.close）、ワーカーを止め、トレイを消して終わる
    status: implemented
    notes:
      並走の間の処理: |-
        画面とホットキーが無い間（画面を作る #21 まで）は、main(argv: list[str] | None = None, *, wait_for_shutdown: Callable[[], None] = wait_for_shutdown_signal) を次の処理にする。各 Issue が上の処理の段を足していく。

        1. 起動の引数を読む（parse_args。argv が None なら sys.argv[1:]）
        2. 置き場所を決め、ログを INFO で設定する（resolve_app_paths・setup_logging）
        3. `--migrate-env` が渡されていれば、.env を移して書く（migrate_env・save_settings）
           - settings.toml が既にある場合、移さずに 1 を返す（書き換えた設定を上書きしない）
             - `[ERROR]` 設定ファイルが既にあるため .env を移さなかった（設定ファイルのパス）
           - SettingsError の場合、1 を返す
             - `[ERROR]` .env を移せなかった（理由）
           - `[INFO]` .env を設定ファイルへ移した（.env のパス・設定ファイルのパス）
        4. 設定を読む（load_settings）
           - SettingsError の場合、1 を返す
             - `[ERROR]` 起動に失敗した（理由）
        5. ルートロガーのレベルを設定のログのレベルにし、保持期間で古いログを消す（purge_old_logs）
           - `[INFO]` 設定を読んだ（設定ファイルのパス・エンジン・オンの出力先の ID）
        6. 配線する（build_handlers。notify は log_notify）
           - StartupError の場合、1 を返す
             - `[ERROR]` 起動に失敗した（理由）
        7. トークンを作り、API サーバーを起動する（create_token・build_fastapi・ApiServerRunner.start(API_START_TIMEOUT_SEC)）
           - True の場合だけ、トークンのファイルを書く（write_token_file）
           - False の場合、トークンのファイルを書かずに api_unavailable を知らせ、エンジンを止めて 1 を返す（画面とホットキーが無い間は続けても受け付ける入口が無い）
        8. 上限の打ち切りを RepeatingTimer で SESSION_LIMIT_CHECK_INTERVAL_SEC ごとに呼ぶ（SessionManager.truncate_if_expired）
           - `[INFO]` 常駐サービスを始めた（API のポート）
        9. 終了の合図を待つ（wait_for_shutdown）
        10. 新しい開始が来ないようにタイマー・API サーバーを先に止め、録音を捨て（SessionManager.close）、エンジンを止めて 0 を返す
            - `[INFO]` 常駐サービスを終えた

        `__main__.py` は `sys.exit(main())` だけを呼ぶ（CUDA の DLL の場所は、文字起こしワーカーの窓口が子プロセスの PATH へ足す）。
    unit_tests:
      - name: test_main
        case: 正常
        summary: 設定を読んで API を立て、終了の合図で片付けて 0 を返す
        condition: --data-dir に空の一時フォルダ。wait_for_shutdown はすぐ戻る
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer
        expected: 0。{data_dir}/settings.toml が既定値ででき、{data_dir}/log/{今日}.log に「設定を読んだ」の行があり、token_file があり、RepeatingTimer.stop・ApiServerRunner.stop・SessionManager.close・stop_engine がこの順に 1 回ずつ呼ばれる
      - name: test_main_when_migrate_env
        case: 正常
        summary: .env を移してから読む
        condition: --data-dir に空の一時フォルダ、--migrate-env に WHISPER_MODEL=small の .env。wait_for_shutdown はすぐ戻る
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer
        expected: 0。settings.toml の transcription.local_whisper.model が small、.env の中身が変わらず .env.migrated が無い
      - name: test_main_when_settings_exists_and_migrate_env
        case: 異常
        summary: 設定ファイルがあれば移さない
        condition: hotkeys.start を変えた settings.toml がある data_dir、--migrate-env に .env
        mock: build_handlers
        expected: 1。settings.toml が変わらず、ERROR のログが 1 行、build_handlers が呼ばれない
        exception: settings.toml が既にある
      - name: test_main_when_invalid_settings
        case: 異常
        summary: 設定が合わなければ 1 を返す
        condition: transcription.local_whisper.beam_size = "x" の settings.toml がある data_dir
        mock: build_handlers
        expected: 1。ERROR のログに transcription.local_whisper.beam_size が出、build_handlers が呼ばれない
        exception: SettingsError
      - name: test_main_when_startup_error
        case: 異常
        summary: エンジンを準備できなければ 1 を返す
        condition: build_handlers が StartupError を送出する
        mock: build_handlers・ApiServerRunner
        expected: 1。ERROR のログが 1 行、ApiServerRunner が作られない
        exception: StartupError
      - name: test_main_when_api_unavailable
        case: 正常
        summary: 待ち受けを始められなければトークンのファイルを書かずに知らせて 1 を返す
        condition: 前回の起動の token_file がある data_dir。ApiServerRunner.start が False を返す
        mock: build_handlers・ApiServerRunner・log_notify
        expected: 1。token_file が前回の内容のままで、log_notify に api_unavailable が渡り、stop_engine が 1 回呼ばれ、wait_for_shutdown が呼ばれない
  - name: acquire_single_instance
    title: 単一インスタンスの確保
    kind: 関数
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 名前付きのミューテックスを取る。取られていれば名前付きのイベントで前のプロセスに終わるよう頼み、解放を待ってから取る
    args:
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 前のプロセスの終わりを待つ上限
    returns:
      type: SingleInstanceLock
      description: 取った排他（終了時に解放する。終了の依頼を待つスレッドも持つ）
    exceptions:
      - name: StartupError
        condition: 上限まで待っても前のプロセスが排他を放さない
    notes:
      強制終了しない: プロセスの番号での強制終了はしない（番号を使い回された無関係なプロセスを止めない）。
    status: planned
  - name: start_local_session
    title: ホットキー・トレイからの開始
    kind: 関数
    container: main.py
    usecase: 録音する
    scope: public
    summary: SessionManager.start を呼び、断られた理由をユーザーへ知らせる。例外を pynput・画面のスレッドへ漏らさない
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: hotkey か tray
      - name: session_manager
        type: SessionManager
        required: true
        passing: injected
        description: セッション管理
      - name: notify
        type: NotifyFn
        required: true
        passing: injected
        description: ユーザーへの知らせ
    returns:
      type: None
      description: なし
    process: |-
      1. SessionManager.start(entry) を呼ぶ
         - SessionBusyError の場合、busy を知らせる（ダイアログ）
         - MicrophoneUnavailableError の場合、microphone_unavailable を知らせる（トレイ）
         - それ以外の例外の場合、ログに書いて握る
           - `[ERROR]` 録音を始められなかった（logger.exception）
    unit_tests:
      - name: test_start_local_session_when_busy
        case: 正常
        summary: 処理中なら busy を知らせる
        condition: start が SessionBusyError を送出する
        mock: session_manager・notify
        expected: notify に busy が渡り、例外が出ない
      - name: test_start_local_session_when_microphone_unavailable
        case: 正常
        summary: マイクを開けなければ microphone_unavailable を知らせる
        condition: start が MicrophoneUnavailableError を送出する
        mock: session_manager・notify
        expected: notify に microphone_unavailable が渡り、例外が出ない
      - name: test_start_local_session_when_unexpected_error
        case: 正常
        summary: 想定外の例外も漏らさない
        condition: start が RuntimeError を送出する
        mock: session_manager・notify
        expected: 例外が出ず、ERROR のログが 1 行出る
    status: planned
  - name: parse_args
    title: 起動の引数の解釈
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: argparse で `--data-dir` と `--migrate-env` を読む
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: コマンドの引数（プログラム名を除く）
    returns:
      type: CliArgs
      description: 起動の引数
    process: |-
      1. `--data-dir {フォルダ}` と `--migrate-env {ファイル}` を読む
         - 並走の間（起動を切り替える #22 まで）は `--data-dir` を必須にし、普段使いの既定の置き場所へ書かない
         - 知らない引数・`--data-dir` が無い場合、argparse が使い方を出して SystemExit(2) で終わる
    unit_tests:
      - name: test_parse_args
        case: 正常
        summary: データの置き場所だけを読む
        condition: '["--data-dir", "C:/tmp/vp"]'
        mock: なし
        expected: data_dir が Path("C:/tmp/vp")、migrate_env が None
      - name: test_parse_args_when_migrate_env
        case: 正常
        summary: 移す .env も読む
        condition: '["--data-dir", "C:/tmp/vp", "--migrate-env", "C:/repo/.env"]'
        mock: なし
        expected: migrate_env が Path("C:/repo/.env")
      - name: test_parse_args_when_no_data_dir
        case: 異常
        summary: データの置き場所が無ければ終わる
        condition: '[]'
        mock: なし
        expected: SystemExit（code 2）
    status: implemented
  - name: log_notify
    title: ログへの知らせ
    kind: 関数
    container: main.py
    usecase: 共通
    scope: public
    summary: 画面とトレイが入るまでの NotifyFn。知らせをログに書く
    args:
      - name: event
        type: Literal["state_changed", "busy", "microphone_unavailable", "transcription_failed", "delivery_failed", "api_unavailable"]
        required: true
        passing: positional
        description: 知らせの種類
      - name: detail
        type: str | None
        required: false
        default: None
        passing: positional
        description: 理由
    returns:
      type: None
      description: なし
    process: |-
      1. state_changed は INFO、それ以外は WARNING で、種類と理由をログに書く
         - `[INFO]` / `[WARNING]` ユーザーへの知らせ（種類・理由）
    unit_tests:
      - name: test_log_notify_when_failure
        case: 正常
        summary: 失敗の知らせは WARNING
        condition: event=api_unavailable、detail="47823"
        mock: なし
        expected: WARNING のログに api_unavailable と 47823 が出る
    notes:
      差し替え: '画面を作る #21 で、build_handlers へ渡す notify をホットキーと画面の notify に差し替え、この関数を消す。'
    status: implemented
  - name: wait_for_shutdown_signal
    title: 終了の合図の待ち
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: Ctrl+C（SIGINT）か Ctrl+Break（SIGBREAK）が来るまで待つ。画面とトレイが入るまでの終わり方
    returns:
      type: None
      description: なし
    process: |-
      1. threading.Event を作り、SIGINT と（あれば）SIGBREAK のハンドラで立てる
      2. 立つまで 1 秒ずつ待つ（メインスレッドがシグナルを受けられるよう、上限なしの wait にしない）
         - `[INFO]` 終了の合図を受けた（シグナル）
    notes:
      差し替え: '画面を作る #21 で、イベントループとトレイの終了に差し替え、この関数を消す。'
    status: implemented
  - name: _wire_outputs
    title: 出力先の配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: internal
    summary: OUTPUTS の各出力先の handler に、出力先の ID ごとの外部連携の関数と設定の値を部分適用して返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 設定（keyboard.paste_key・outputs[]・api.allowed_callback_hosts）
    returns:
      type: tuple[OutputSpec, ...]
      description: handler を配線した出力先の一覧（OUTPUTS と同じ並び）
    process: |-
      1. 設定の outputs[] から貼り付けて送信と AI チャットへ送るの設定を id で引く（一覧に無ければそのモデルの既定値）
      2. keyboard.paste_key を部分適用した send_paste を作る
      3. OUTPUTS を順に見て、出力先の ID ごとに build_handlers の 3 のとおり部分適用した handler に差し替える
         - 部分適用の対象に無い ID はそのまま残す
    unit_tests:
      - name: test_wire_outputs
        case: 正常
        summary: 各出力先に設定の値を配線する
        condition: keyboard.paste_key が `<ctrl>+<shift>+v`、paste_and_send の enter_delay_sec が 0.2、ai_chat の open_delay_sec が 1.5
        mock: copy_to_clipboard・send_paste・send_enter・open_app_window・time.sleep
        expected: 返った一覧の ID が OUTPUTS と同じ並びで、paste_and_send の handler を呼ぶと send_paste に `<ctrl>+<shift>+v`、sleep に 0.2 が渡り、ai_chat の handler を呼ぶと sleep に 1.5・0.2 がこの順に渡る
    status: planned
notes:
  依存の向き: |-
    コーディング規約『依存関係管理』のとおり `features`・`server`・`ui` → `integrations`・`runtime` → `shared` とし、上の層へは import しない。
    `features` どうしと、`features/outputs` の出力先どうしも import しない。セッションはほかの feature を SessionDeps の関数型で受け取り、`main.py` だけが全てを知る。
    `server` はセッションの route を include_router で集め、SessionApiDeps を app.state に置くためだけに `features/session` を import する。route は `main.py`・`server` を import せず、SessionApiDeps を app.state から受け取る。
  依存の向きの検査: |-
    import-linter の契約を pyproject.toml の `[tool.importlinter]`（root_package は `voice_paste`）に置き、単体テストと一緒に `lint-imports` で回す（品質シナリオ 5。コマンドは設計書『テスト実行方法』）。

    | 契約 | 種類 | 中身 |
    | --- | --- | --- |
    | 層 | layers | `voice_paste.main` → `voice_paste.server` \| `voice_paste.ui` → `voice_paste.features` → `voice_paste.integrations` \| `voice_paste.runtime` → `voice_paste.shared`（`\|` で並べた層どうしも import しない） |
    | feature の独立 | independence | `voice_paste.features.*` |
    | 出力先の独立 | independence | `voice_paste.features.outputs.*`。ignore_imports で `voice_paste.features.outputs.registry -> voice_paste.features.outputs.*`・`voice_paste.features.outputs.service -> voice_paste.features.outputs.registry`・`voice_paste.features.outputs.** -> voice_paste.features.outputs.types` を除く |

    出力先を足すときは `features/outputs/` にサブフォルダを足すだけで契約の対象に入り、契約は直さない。
classes:
  - name: RepeatingTimer
    title: 定期の呼び出し
    container: runtime/timer.py
    usecase: APIで録音を操作する
    role: ランタイム
    kind: クラス
    summary: 渡された関数を専用のデーモンスレッドで一定の間隔ごとに呼ぶ
    description: |-
      終わりの合図を threading.Event で持ち、Event.wait(間隔) で待つ。
      呼んだ関数が例外を出してもスレッドを止めず、logger.exception で残して次の回を待つ（上限での打ち切りが 1 回の失敗で止まらない）。
    properties:
      - name: _action
        type: Callable[[], object]
        access: 内部 (_)
        description: 呼ぶ関数
      - name: _interval_sec
        type: float
        access: 内部 (_)
        description: 呼ぶ間隔
      - name: _stopped
        type: threading.Event
        access: 内部 (_)
        description: 終わりの合図
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: 呼び出しのスレッド。start の前は None
    methods:
      - name: start
        title: 開始
        kind: メソッド
        scope: public
        summary: スレッドを始め、間隔ごとに関数を呼ぶ
        returns:
          type: None
          description: なし
        process: |-
          1. デーモンスレッドで、終わりの合図が立つまで「間隔だけ待つ → 関数を呼ぶ」を繰り返す
             - 関数が例外を出した場合、次の回を待つ
               - `[ERROR]` 定期の呼び出しで想定外の例外（logger.exception）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 間隔ごとに呼ぶ
            condition: 間隔 0.01 秒で始め、呼ばれた回数が 3 になるまで待つ
            mock: 呼ぶ関数
            expected: 1 秒以内に 3 回呼ばれる
          - name: test_start_when_action_raised
            case: 正常
            summary: 例外でも止まらない
            condition: 呼ぶ関数が 1 回目だけ RuntimeError を送出する
            mock: 呼ぶ関数
            expected: 2 回目以降も呼ばれ、ERROR のログが 1 行出る
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: 終わりの合図を立て、スレッドの終わりを待つ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めた後は呼ばない
            condition: start の後に stop を呼び、間隔の 5 倍待つ
            mock: 呼ぶ関数
            expected: stop の後に呼ばれた回数が増えず、スレッドが終わっている
    status: implemented
constants:
  - name: API_START_TIMEOUT_SEC
    title: API の待ち受けの始まりを待つ秒数
    container: main.py
    usecase: 常駐アプリを起動する
    summary: ApiServerRunner.start が started を待つ上限。uvicorn の起動の実測が無いため仮に置き、結合テストで起動にかかる時間を測って p99.9 + 50% に直す
    value: '5.0'
    status: implemented
  - name: SESSION_LIMIT_CHECK_INTERVAL_SEC
    title: 上限での打ち切りを確かめる間隔
    container: main.py
    usecase: APIで録音を操作する
    summary: RepeatingTimer が truncate_if_expired を呼ぶ間隔。打ち切りの遅れはこの間隔までで、API のセッションの上限時間（600 秒）に対して無視できる 1 秒にする
    value: '1.0'
    status: implemented
  - name: API_SESSION_LIMIT_SEC
    title: API のセッションの上限時間
    container: main.py
    usecase: APIで録音を操作する
    summary: SessionManager へ渡す上限時間。非機能要件の API のセッションの上限時間の決定値
    value: '600'
    status: implemented
  - name: CALLBACK_TIMEOUT_SEC
    title: 返送のタイムアウト
    container: main.py
    usecase: 起こした文字を届ける
    summary: post_json へ渡す 1 回の POST のタイムアウト。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.5'
    status: implemented
  - name: CALLBACK_RETRY_COUNT
    title: 返送の再送回数
    container: main.py
    usecase: 起こした文字を届ける
    summary: 最初の 1 回の後に再送する回数。非機能要件の返送のタイムアウトと再送の決定値
    value: '3'
    status: implemented
  - name: CALLBACK_RETRY_BASE_SEC
    title: 返送の再送の間隔の基数
    container: main.py
    usecase: 起こした文字を届ける
    summary: 再送の間隔の基数（回ごとに 2 倍にし、フルジッターをかける）。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.0'
    status: implemented
