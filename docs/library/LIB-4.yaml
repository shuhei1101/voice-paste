id: LIB-4
visibility: internal
title: "av"
kind: "ライブラリ"
version:
  current: 18.1.0
  latest: 19.0.1
  checked_on: '2026-10-05'
  source: pyproject.toml（`av>=11,<19`）と uv.lock のバージョン
  pinning: '`>=11,<19`。下限は faster-whisper 1.2.1 の `Requires-Dist: av>=11` に揃え、上限は av 19 が faster-whisper 1.2.1 の `av.open(..., metadata_errors="ignore")` を受け付けない不具合のため（faster-whisper の設計書の不具合一覧）。faster-whisper が av 19 に対応したバージョンを出したら上限を解除する'
catalogs:
  - name: API
    version: 18.1.0
    entries:
      - name: av.open
        kind: 関数
        purpose: ファイルやストリームを開き、音声・動画のコンテナを返却する（faster-whisper が録音を読み込むときに呼ぶ）
        params:
          - name: file
            type: str | Path | file-like
            required: true
            description: 開くファイルかストリーム
          - name: mode
            type: '"r" | "w"'
            default: '"r"'
            description: 読み込みか書き込みか
          - name: format
            type: str | None
            default: None（自動判定）
            description: 使用する形式
          - name: options
            type: dict[str, str] | None
            default: None
            description: コンテナと全ストリームへ引き渡すオプション
          - name: container_options
            type: dict[str, str] | None
            default: None
            description: コンテナへ引き渡すオプション
          - name: stream_options
            type: list[str] | None
            default: None
            description: 各ストリームへ引き渡すオプション
          - name: metadata_encoding
            type: str
            default: '"utf-8"'
            description: メタデータを読み書きするときの文字コード
          - name: metadata_errors
            type: str
            default: '"strict"'
            description: メタデータの文字コードのエラーの扱い（`str.encode` と同じ）
            notes: faster-whisper 1.2.1 は `"ignore"` を引き渡す。av 19.0.1 は受け付けない
          - name: buffer_size
            type: int
            default: '32768'
            description: Python の入出力のバッファの大きさ（バイト）。file-like のときだけ効く
          - name: timeout
            type: float | tuple | None
            default: None
            description: データを待つ秒数。`(開く, 読む)` の組でも指定できる
          - name: io_open
            type: Callable | None
            default: None
            description: 追加のファイルを開く独自の入出力
          - name: hwaccel
            type: HWAccel | None
            default: None
            description: ハードウェアデコードの設定
        params_example: |-
          ```python
          import av

          with av.open("recording.wav", mode="r", metadata_errors="ignore") as container:
              for frame in container.decode(audio=0):
                  ...
          ```
        returns:
          - name: '-'
            type: InputContainer（mode が "r"）/ OutputContainer（"w"）
            description: 開いたコンテナ
      - name: container.streams.audio / container.format.name / container.duration / container.demux
        kind: 属性・メソッド
        purpose: ブラウザから受けた音声を開き、音声のストリームの有無・容れ物の形式・秒数を読み込む（probe_audio）。Edge の MediaRecorder の webm は container.duration が None のため、そのときは demux で音声のパケットを読み込み、最後の pts + duration に time_base を掛けて秒数にする（デコードはしない）
        status: planned
      - name: av.error.FFmpegError
        kind: 例外
        purpose: 開けない中身を見分ける（音声でない中身は子の InvalidDataError）。probe_audio が AudioUnreadableError に変える
        status: planned
lead: FFmpeg の Python バインディング（PyAV）。音声・動画のファイルやストリームを開いて、読み書きする。
purl: pkg:pypi/av
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/whisper/worker.py
upstream: PyAV-Org/PyAV
verification:
  state: 済
  date: '2026-10-24'
  detail: 'Linux の使い捨ての venv で、faster-whisper 1.2.1 と av 18.1.0 の組が 1 秒の WAV を decode_audio で読み込めること（av.open が metadata_errors="ignore" を受け付けること）と、av 19.0.1 の組では TypeError になることを最小のコードで動かした（2026-10-05）。PR [#171 外の端末のブラウザから音声を送って文字に起こす画面とエンドポイントを追加する](https://github.com/shuhei1101/voice-paste/issues/171) で、av 18.1.0 に PR [#171 外の端末のブラウザから音声を送って文字に起こす画面とエンドポイントを追加する](https://github.com/shuhei1101/voice-paste/issues/171) の PoC の音声（Edge が録った webm/opus・mp4/AAC、PyAV で書き込んだ MP3・ogg。どれも約 11 秒）を BytesIO で引き渡し、format.name がそれぞれ `matroska,webm`・`mov,mp4,m4a,3gp,3g2,mj2`・`mp3`・`ogg` で音声のストリームが 1 つあること、container.duration は webm だけ None で、demux の最後のパケットから求めた秒数が 10.68〜10.98 秒で容れ物の秒数と 0.1 秒以内で合うこと、音声でない中身は InvalidDataError（FFmpegError の子）になることを確認した（2026-10-24）'
