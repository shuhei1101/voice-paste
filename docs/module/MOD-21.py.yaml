id: MOD-21
visibility: internal
title: 常駐アプリ / APIサーバー / web_page.py
test_files:
  - tests/unit/voice_paste/server/test_web_page.py
functions:
  - name: serve_web_page
    title: 画面の配信
    kind: 関数
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    scope: public
    summary: '`GET /web/`。`server/web/index.html` を `Cache-Control: no-cache` で返却する（web_page_router。`GET /web` は `/web/` への 307）'
    returns:
      type: FileResponse
      description: 画面の HTML
    process: '1. パッケージに同梱した `server/web/index.html` を `text/html; charset=utf-8`・`Cache-Control: no-cache` で返却する'
    unit_tests:
      - name: test_serve_web_page
        case: 正常
        summary: 画面を返却する
        condition: TestClient で GET /web/ と GET /web
        mock: なし
        expected: /web/ が 200・text/html・no-cache、/web が /web/ への 307
    status: planned
  - name: mount_web_assets
    title: 画面の素材の組み込み
    kind: 関数
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    scope: public
    summary: '`/web/assets/` に `server/web/assets/` を WebAssetFiles で組み込む'
    args:
      - name: app
        type: FastAPI
        required: true
        passing: positional
        description: 組み込み先
    returns:
      type: None
      description: なし
    process: 1. `/web/assets` に `WebAssetFiles(directory=server/web/assets)` を mount する（`.js` は JS_MEDIA_TYPE で返却する。配置先の外を指す `..` と無いファイルは StaticFiles が 404 にする）
    unit_tests:
      - name: test_mount_web_assets
        case: 正常
        summary: 素材を返却し、配置先の外は 404
        condition: GET /web/assets/app.js と GET /web/assets/..%2F..%2Fapp.py
        mock: なし
        expected: app.js は 200・text/javascript; charset=utf-8、配置先の外は 404 の problem+json
    status: planned
lead: 外の端末の画面の HTML と JS・CSS の配信を受け持ち、画面の配信の経路やキャッシュの扱いを変えるときに参照する。
tags:
  - name: topic:画面
    main: true
  - name: topic:ブラウザ
  - name: topic:アセット
  - name: action:配信
constants:
  - name: JS_MEDIA_TYPE
    title: JS の素材の Content-Type
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    summary: '`/web/assets/` の下の `.js` を返却するときの Content-Type。端末の `mimetypes`（Windows ではレジストリの `.js` の値）に依らず、RFC 9239 の JavaScript の型にする'
    value: '"text/javascript; charset=utf-8"'
    status: planned
classes:
  - name: WebAssetFiles
    title: 画面の素材の配信
    container: server/web_page.py
    usecase: ブラウザから音声を送信する
    role: 配信
    kind: クラス
    inherits: starlette.staticfiles.StaticFiles
    summary: '`.js` の Content-Type を JS_MEDIA_TYPE に固定する StaticFiles。ほかの拡張子と、配置先の外・無いファイルの 404 は StaticFiles のまま'
    methods:
      - name: file_response
        title: 素材の応答の作成
        kind: メソッド
        scope: public
        summary: StaticFiles.file_response の応答のうち、`.js` で Content-Type を持つもの（304 は持たない）の Content-Type を JS_MEDIA_TYPE に変更する
        args:
          - name: full_path
            type: os.PathLike[str] | str
            required: true
            passing: positional
            description: 返却するファイルのパス
          - name: stat_result
            type: os.stat_result
            required: true
            passing: positional
            description: ファイルの stat
          - name: scope
            type: starlette.types.Scope
            required: true
            passing: positional
            description: 要求の ASGI の scope
          - name: status_code
            type: int
            required: false
            default: '200'
            passing: positional
            description: 応答のステータスコード
        returns:
          type: starlette.responses.Response
          description: 素材の応答（変更されていなければ 304）
        process: |-
          1. StaticFiles.file_response で応答を作る
          2. full_path の拡張子が `.js` で、応答の headers に content-type があれば、JS_MEDIA_TYPE に変更する
          3. 応答を返却する
        unit_tests:
          - name: test_file_response_when_registry_differs
            case: 正常
            summary: 端末の mimetypes が別の型を返却しても、.js は JS_MEDIA_TYPE で返却する
            condition: starlette.responses.guess_type を、.js には application/javascript を返却し、ほかの拡張子は元の guess_type へ委ねる関数に差し替え、TestClient で GET /web/assets/app.js と GET /web/assets/style.css
            mock: starlette.responses.guess_type（ランナーの Windows のレジストリの値を再現する）
            expected: app.js は 200・text/javascript; charset=utf-8。style.css は 200・text/css で始まる型
    status: planned
