title: "呼び出し元へ返す"
entry:
  kind: trigger
  value: API から始めた録音の文字起こしが終わるか、上限で打ち切る が打ち切ったときに `POST {callback_url}` を送る。連続録音では、区間の文字起こしが終わるたびと、完了か上限の後に全ての区間を送り終えたときに送る
flows:
  - name: 正常系
    summary: 起こした文字を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、空でない文字が得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・text
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=transcribed と起こした文字が 1 回届いている
      - セッションが終わり、待機中に戻っている
    test: test_normal
  - name: 正常系（結果が空）
    summary: 空の文字を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、結果が空だった
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・text=""
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=transcribed と空の text が 1 回届いている
    test: test_normal_when_empty
  - name: 正常系（文字起こしに失敗）
    summary: 文字起こしの失敗を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、文字起こしに失敗した
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=failed・error
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=failed と失敗の理由が 1 回届いている
    test: test_normal_when_transcription_failed
  - name: 正常系（上限で打ち切った）
    summary: 完了が来ないまま上限で打ち切ったことを返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 打ち切り
        description: 上限で打ち切る が、完了が来ないままセッションの上限時間（開始からの経過時間）に達したセッションを打ち切った
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=truncated
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=truncated が 1 回届いている
    test: test_normal_when_truncated
  - name: 正常系（連続録音の区間）
    summary: 連続録音で起こした区間の文字を、通し番号を付けて区切った順に送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 1 と 2 の区間の文字がこの順に得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・segment_number=1・text
        CB-->>IF: 200
        IF->>CB: POST session_id・result=transcribed・segment_number=2・text
        CB-->>IF: 200
      ```
    expected:
      - 返送先に segment_number=1 と segment_number=2 の区間の文字が、この順に 1 回ずつ届いている
      - segment_count が null である
      - セッションが終わらず、連続録音が続いている
    test: test_normal_when_continuous_segment
  - name: 正常系（連続録音の区間の文字起こしに失敗）
    summary: 区間の文字起こしの失敗を通し番号つきで送り、連続録音は続ける
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 2 の区間の文字起こしに失敗し、通し番号 3 の区間の文字が得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=failed・segment_number=2・error
        CB-->>IF: 200
        IF->>CB: POST session_id・result=transcribed・segment_number=3・text
        CB-->>IF: 200
      ```
    expected:
      - 返送先に segment_number=2 の result=failed と失敗の理由が 1 回届いている
      - その後に segment_number=3 の区間の文字が届いている
    test: test_normal_when_continuous_segment_failed
  - name: 正常系（連続録音を完了した）
    summary: 最後の区間を送った後に、完了したことと区間の数を送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 連続録音の終わり
        description: 連続録音が完了し、通し番号 1・2 の区間を送り終えた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・segment_number=2・text
        CB-->>IF: 200
        IF->>CB: POST session_id・result=completed・segment_count=2
        CB-->>IF: 200
      ```
    expected:
      - 返送先に、segment_number=2 の区間の後で result=completed・segment_count=2 が 1 回届いている
      - セッションが終わり、待機中に戻っている
    test: test_normal_when_continuous_completed
  - name: 異常系（連続録音の区間が返送先に届かない・ログに書いて次の区間へ進む）
    summary: 決めた回数まで再送しても届かない区間はログに書き、次の区間を送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、segment_number=2 の返送にだけ常に 500 を返す
      - name: 再送の設定
        description: 再送の間隔をテストで待てる短い値に差し替える
      - name: 文字起こしの結果
        description: 連続録音で、通し番号 2 と 3 の区間の文字がこの順に得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先
        participant LOG as ログ

        loop 決めた回数まで
          IF->>CB: POST session_id・result=transcribed・segment_number=2・text
          CB-->>IF: 500
        end
        IF->>LOG: 届かなかったことと session_id・segment_number=2 を書く
        IF->>CB: POST session_id・result=transcribed・segment_number=3・text
        CB-->>IF: 200
      ```
    expected:
      - segment_number=2 の送信が決めた回数だけ行われている
      - ログに届かなかったことと session_id・segment_number=2 が書かれている
      - segment_number=3 の区間の文字がその後に届いている
      - セッションが終わらず、連続録音が続いている
    test: test_error_when_continuous_segment_unreachable
  - name: 異常系（返送先に届かない・ログに書いて終える）
    summary: 決めた回数まで再送しても届かなければログに書いて終える
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、常に 500 を返す
      - name: 再送の設定
        description: 再送の間隔をテストで待てる短い値に差し替える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        loop 決めた回数まで
          IF->>CB: POST session_id・result・text
          CB-->>IF: 500
        end
        IF->>IF: 届かなかったことと session_id をログに書く
      ```
    expected:
      - 返送先への送信が決めた回数だけ行われている
      - ログに届かなかったことと session_id が書かれている
      - セッションが終わり、待機中に戻っている
    test: test_error_when_callback_unreachable
lead: API から始めた録音の結果（起こした文字・空の文字・文字起こしの失敗・上限での打ち切り）を、開始で指定された返送先へ送る。連続録音では、区間ごとの結果を通し番号つきで区切った順に送り、最後に終わった理由と区間の数を送る。
identifier: deliver_to_caller
idempotent: false
side_effects: 返送先へ HTTP で 1 回送る（届かなければ決めた回数まで再送する）。届かなかったときはログに書く。送り終えたらセッションを終えて待機中に戻す（連続録音では、終わりの返送を送り終えたら）。
exclusivity: 1 セッションにつき 1 回だけ送る（再送は同じ中身）。連続録音では区間ごとに 1 回と終わりを 1 回送り、前の返送を終えて（届かなかったときは再送を終えて）から次を送る。
exceptions:
  - name: なし（正常終了）
    condition: 返送先が 2xx を返した
  - name: なし（届かなかったことをログに書いて終える）
    condition: 決めた回数まで再送しても、タイムアウト・接続できない・2xx 以外のどれかで届かない
    notes: 履歴は残り、常駐サービスは待機中に戻る
  - name: なし（届かなかった区間をログに書いて次の区間へ進む）
    condition: 連続録音の区間の返送が、決めた回数まで再送してもタイムアウト・接続できない・2xx 以外のどれかで届かない
    notes: 連続録音は止めず、次の区間と終わりは送る。終わりの返送が届かないときは、上の「届かなかったことをログに書いて終える」
constraints:
  - item: 送り先
    constraint: 開始で受け取った callback_url だけ。ホストが loopback か設定で許可したホストであることを送る前にもう一度確かめる
  - item: タイムアウト
    constraint: 非機能要件の返送のタイムアウト
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
  - item: 再送
    constraint: 非機能要件の返送の再送回数と間隔
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
  - item: リダイレクト
    constraint: 追わない
    notes: 許可していないホストへ流れるのを防ぐ
  - item: 受け口の応答時間
    constraint: 受け口は返送を受け取ったら 1 秒以内に 2xx を返す。重い処理は 2xx を返した後で行う
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
    notes: 呼び出し元との取り決め。返送のタイムアウトはこの時間から導く
  - item: 重なって届く返送
    constraint: 受け口が 2xx を返す前にタイムアウトすると、同じ中身が同じ session_id（連続録音の区間は同じ session_id と segment_number）で再送される。受け口は session_id（連続録音は session_id と segment_number、終わりは session_id と result）で重複を見分ける
    notes: 常駐アプリが送るのは 1 セッション（連続録音は 1 区間・終わり）につき 1 つの中身だけで、届いたかを確かめられないときだけ同じ中身を送り直す
  - item: 終了で捨てた録音
    constraint: 常駐サービスの終了で捨てた録音（録音中・停止中の API のセッション）は返送しない
    notes: 終了の時点で API サーバーも止まっており、返送を待つと終了が返送の最長まで遅れるため。呼び出し元は返送が来ないことで気づく
  - item: 連続録音の順
    constraint: 区間は通し番号の順に送り、終わりは全ての区間の後に送る。届かなかった区間も通し番号を飛ばして次の区間へ進むため、受け口は通し番号の欠けと segment_count で届かなかった区間に気づける
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[区切ってから返送が届くまでの時間]
    notes: 前の区間を再送している間は、後の区間が返送の最長（13 秒）まで待つ
notes:
  送る中身: |-
    `application/json` で次のフィールドを送る。

    | フィールド | 型 | 説明 |
    | --- | --- | --- |
    | `session_id` | `str`（uuid） | 開始で返したセッションの ID |
    | `result` | `Literal["transcribed", "failed", "truncated", "completed"]` | `transcribed`: 起こした文字（空を含む）を得た。`failed`: 文字起こしに失敗した。`truncated`: 完了が来ないまま上限で打ち切った。`completed`: 連続録音を完了し、全ての区間を送り終えた（連続録音だけ） |
    | `text` | `str` | 用語集で補正した文字。`transcribed` で結果が空のときと、`failed`・`truncated`・`completed` のときは空文字 |
    | `error` | `str \| None` | `failed` のときの理由。それ以外は `null` |
    | `segment_number` | `int \| None` | 連続録音の区間の通し番号（1 から 1 ずつ増える）。連続録音の `transcribed`・`failed` のときだけ入り、それ以外は `null` |
    | `segment_count` | `int \| None` | 連続録音で区切った区間の数（届かなかった区間も含む。区間が無ければ 0）。連続録音の `completed`・`truncated` のときだけ入り、それ以外は `null` |

    `continuous` を指定しない開始では、`segment_number`・`segment_count` は常に `null` で、それ以外の中身は今までと同じ。

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "transcribed",
      "text": "今日の会議は 15 時からです。",
      "error": null,
      "segment_number": null,
      "segment_count": null
    }
    ```

    連続録音の区間と終わりの例:

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "transcribed",
      "text": "今日の会議は 15 時からです。",
      "error": null,
      "segment_number": 1,
      "segment_count": null
    }
    ```

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "completed",
      "text": "",
      "error": null,
      "segment_number": null,
      "segment_count": 3
    }
    ```
test_file: tests/integration/test_deliver_to_caller.py
