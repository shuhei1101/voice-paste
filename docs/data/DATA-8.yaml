    item: "tables[%LOCALAPPDATA%\\voice-paste\\api_token]"
    type: references
    when: "『ER 図: 常駐アプリのファイル』の「%LOCALAPPDATA%\\voice-paste\\api_token」の列と制約を確認するとき。"
tags:
  - name: topic:トークン
    main: true
  - name: topic:api
  - name: topic:ポート
