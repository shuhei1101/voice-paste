    container: shared/settings.py
    usecase: 録音を文字に起こす
    kind: 関数
    scope: public
    summary: 有効なプリセットの語を、一覧の上から順に表記と読みの組で返す。同じ表記は 1 つにまとめる
    args:
      - name: presets
        type: Sequence[HintPresetSettings]
        required: true
        passing: positional
        description: 設定の hint_presets
    returns:
      type: list[HintVocabularyWord]
      description: 表記と読みの組。有効な語が無ければ空の一覧
    process: |-
      1. enabled が True のプリセットの words と readings を一覧の順に並べる（readings が空の一覧なら読みは全て None、空文字の読みも None）
      2. 同じ表記は最初の位置に 1 つにまとめ、読みが None で後の語に読みがあればその読みを使う
    unit_tests:
      - name: test_collect_hint_vocabulary
        case: 正常
