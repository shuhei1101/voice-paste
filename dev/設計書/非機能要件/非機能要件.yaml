    rationale: 品質シナリオ 5。既存のモジュールの変更は出力先の一覧（OUTPUTS）への登録だけにする。出力先どうしの import を import-linter で禁じる
    measurement: import-linter の出力先の独立の契約が通ることと、試しの出力先を OUTPUTS への登録だけで追加したときに設定・ホットキー・画面・届けに乗ることを確かめる
