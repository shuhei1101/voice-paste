id: MOD-84
visibility: internal
title: 常駐アプリ / 起動と配線 / main.py
test_files:
  - tests/unit/voice_paste/test_main.py
data_models:
  - name: Handlers
    title: 配線済みの関数の束
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: 入口（API・ホットキー・画面）が使う配線済みのもの
    properties:
      - name: session_manager
        type: SessionManager
        description: 録音セッション管理
      - name: session_api
        type: SessionApiDeps
        description: API サーバーへ渡す録音セッションの API の依存（設定の許可ホストを部分適用したコールバック先の確かめを含む）
      - name: settings_store
        type: SettingsStore
        description: 今効いている設定。出力先・録音・画面はここから読むため、保存した immediate の項目が次の回から効く
      - name: start_local_session
        type: Callable[[Entry], None]
        description: ホットキー・トレイの開始（SessionManager と notify を部分適用した start_local_session）
      - name: recorder_level
        type: Callable[[], float]
        description: 録音中の音量（Recorder.level）。録音の画面の波形に使う
      - name: stop_engine
        type: Callable[[], None]
        description: 文字起こしのエンジンを止める（local_whisper は WhisperWorkerClient.stop、openai は何もしない）。終了時に呼ぶ
      - name: web_api
        type: WebApiDeps | None
        description: API サーバーへ渡すブラウザの API の依存（WebJobQueue・probe_audio・一時のフォルダ）。WebJobQueue の開始と終了は main が呼ぶ。外の端末のブラウザの機能を使えない OS では None
      - name: active_engine
        type: EngineName
        description: 実際に動いているエンジン。設定が haas で切り戻した起動では local_whisper
    status: implemented
  - name: CliArgs
    title: 起動の引数
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: '`python -m voice_paste` に渡した引数'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: data_dir
        type: Path | None
        description: データの置き場所（`--data-dir`）。渡したときは設定・履歴・ログ・一時の音声・トークンをこの下に置き、渡さなければ None（既定の置き場所）
    status: implemented
  - name: PlatformAdapters
    title: OS ごとの実装
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: 動いている OS とデスクトップのセッションに合わせて選んだ、単一インスタンス・音量・ブラウザ・貼り付けのキーと Enter の送信・ホットキーの受付・Qt のプラットフォーム・文字起こしワーカーの起動・再起動の実装
    description: |-
      select_platform_adapters が作る。OS を見て実装を選ぶのはここだけで、各モジュールは sys.platform を見ない。
      `@dataclass(frozen=True, slots=True, kw_only=True)`。
    properties:
      - name: acquire_single_instance
        type: Callable[[str, float], SingleInstanceLock | LinuxSingleInstanceLock]
        description: 単一インスタンスの確保（名前・待つ上限）
      - name: lower_volume
        type: LowerVolumeFn | None
        description: 録音中に音量を下げる（Windows）。Linux は None（build_handlers が OS_UNAVAILABLE_FEATURES の Feature.LOWER_VOLUME を見て、何もしない関数を渡す）
      - name: restore_volume
        type: RestoreVolumeFn | None
        description: 下げた音量を戻す（Windows）。Linux は None
      - name: open_app_window
        type: Callable[[str], None]
        description: ブラウザ添付のプリセットの画面を開く
      - name: worker_creationflags
        type: int
        description: 文字起こしワーカーの子プロセスの起動のフラグ（WhisperWorkerClient へ渡す）
      - name: relaunch
        type: Callable[[list[str]], None]
        description: 同じ引数で起動し直す（os_kind を部分適用した relaunch）
      - name: send_paste
        type: Callable[[str], None]
        description: 貼り付けのキーの送信（設定の keyboard.paste_key を受ける。Windows は send_paste、Linux の Xorg のセッションは send_paste_linux、Wayland のセッションは UInputKeyboard.send_paste）
      - name: send_enter
        type: SendEnterFn
        description: Enter の送信（Windows と Linux の Xorg のセッションは send_enter、Wayland のセッションは UInputKeyboard.send_enter）
      - name: create_hotkey_listener
        type: Callable[[str, SingleInstanceLock | LinuxSingleInstanceLock], HotkeyListener | GnomeShortcutListener]
        description: ホットキーの受付を作る（排他の名前・取った排他を受ける。Windows と Linux の Xorg のセッションは引数を使わず HotkeyListener()、Wayland のセッションは GnomeShortcutListener）
      - name: qt_platform
        type: str | None
        description: Qt のプラットフォーム（main が QT_QPA_PLATFORM に入れる）。Wayland のセッションは `xcb`（XWayland）、ほかは None（Qt に任せる）
      - name: open_key_sender
        type: Callable[[], None]
        description: キーの送信の機器を開く（Wayland のセッションは UInputKeyboard.open。開けなければ DeliveryError を送出する）。ほかは何もしない関数
      - name: close_key_sender
        type: Callable[[], None]
        description: キーの送信の機器を閉じる（Wayland のセッションは UInputKeyboard.close）。ほかは何もしない関数
      - name: validate_hotkeys
        type: Callable[[Iterable[str]], None]
        description: 設定の保存の前に、ホットキーを動いているセッションの受付で受け付けられるかを確かめる（Windows と Linux の Xorg のセッションは validate_hotkeys、Wayland のセッションは validate_gnome_hotkeys）
    status: planned
classes:
  - name: _StartupBuild
    title: 起動の配線のスレッド
    container: main.py
    usecase: 常駐アプリを起動する
    role: ランタイム
    kind: クラス
    summary: 配線（build_handlers）をメインスレッドの外のスレッドで流し、結果を Qt のシグナルでメインスレッドへ戻す。配線の間に抜けたときはエンジンを止める
    description: |-
      QObject を継承し、`done = Signal(object)` を持つ。main は done を結果の扱いへ QueuedConnection でつなぎ、受け取りをメインスレッドで行う。
      参照が切れて消えないよう、main は片付けまで持つ。
    inherits: QObject
    properties:
      - name: done
        type: Signal(object)
        access: public
        description: 配線の結果（Handlers か StartupError）を渡すシグナル。cancel の後は送出しない
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: 配線のスレッド。start の前は None
      - name: _stop_engine
        type: Callable[[], None] | None
        access: 内部 (_)
        description: build_handlers の on_engine_created で控えたエンジンを止める関数
      - name: _cancelled
        type: bool
        access: 内部 (_)
        default: 'False'
        description: cancel が呼ばれたか
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: _stop_engine・_cancelled の読み書きと done の送出を 1 つずつにする
    methods:
      - name: start
        title: 配線の開始
        kind: メソッド
        scope: public
        summary: 渡した配線の関数をデーモンスレッド（名前 `startup-build`）で流し、結果を done で渡す
        args:
          - name: build
            type: Callable[[Callable[[Callable[[], None]], None]], Handlers]
            required: true
            passing: positional
            description: エンジンを止める関数を控える関数を受け取り、Handlers を返す配線（main は build_handlers を部分適用して渡す）
        returns:
          type: None
          description: なし
        process: |-
          1. デーモンスレッド（名前 `startup-build`）で build に _register_stop を渡して呼ぶ
             - StartupError の場合、その例外を結果にする
             - それ以外の例外の場合、StartupError（「起動の配線で想定外のエラーが起きた（元の例外）」）を結果にする（トレイを失敗にし、設定画面と「再起動」を使えるようにする。準備中のまま止めない）
               - `[ERROR]` 起動の配線で想定外のエラーが起きた（logger.exception）
          2. ロックを取り、cancel が呼ばれていなければ done で結果を送出する
             - 呼ばれていて、結果が Handlers の場合、Handlers.stop_engine を呼んで捨てる（done は送出しない）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 配線の結果を done で渡す
            condition: build が Handlers を返す
            mock: build・done を受ける関数
            expected: done で Handlers が 1 回渡り、build がスレッド名 `startup-build` のスレッドで呼ばれる
          - name: test_start_when_startup_error
            case: 正常
            summary: 配線の失敗を done で渡す
            condition: build が StartupError を送出する
            mock: build・done を受ける関数
            expected: done でその StartupError が 1 回渡る
          - name: test_start_when_unexpected_error
            case: 異常
            summary: 想定外の例外も StartupError にして done で渡す
            condition: build が RuntimeError を送出する
            mock: build・done を受ける関数
            expected: done で StartupError が 1 回渡り、ERROR のログが 1 行出る
      - name: _register_stop
        title: エンジンを止める関数を控える
        kind: メソッド
        scope: internal
        thread_safe: true
        summary: build_handlers の on_engine_created として、エンジンを止める関数を控える
        args:
          - name: stop
            type: Callable[[], None]
            required: true
            passing: positional
            description: エンジンを止める関数
        returns:
          type: None
          description: なし
        process: |-
          1. ロックを取り、stop を控える
          2. cancel が既に呼ばれていれば、ロックを放してから stop を呼ぶ
      - name: cancel
        title: 配線の取り消し
        kind: メソッド
        scope: public
        summary: 控えたエンジンを止め、配線のスレッドの終わりを待つ。以降は done を送出しない
        args:
          - name: timeout_sec
            type: float
            required: true
            passing: positional
            description: スレッドの終わりを待つ秒数（main は STARTUP_CANCEL_TIMEOUT_SEC）
        returns:
          type: None
          description: なし
        process: |-
          1. ロックを取り、cancel が呼ばれたことにして、控えたエンジンを止める関数を引く
          2. ロックを放してから、控えた関数があれば呼ぶ（ワーカーが終わり、配線は StartupError で終わる）
          3. スレッドの終わりを timeout_sec だけ待つ
             - 待ちきれない場合、そのまま戻る
               - `[WARNING]` 起動の配線が終わらないまま終える
        unit_tests:
          - name: test_cancel
            case: 正常
            summary: 控えた関数でエンジンを止め、done を送出しない
            condition: build が止める関数を控えた後、その関数が呼ばれるまで待ってから StartupError を送出する。start の後に cancel(1.0)
            mock: build・止める関数・done を受ける関数
            expected: 止める関数が 1 回呼ばれ、cancel が戻った時点でスレッドが終わっていて、done が送出されない
          - name: test_cancel_when_not_registered
            case: 正常
            summary: 控える前に取り消されたら、控えたときに止める
            condition: build が Event を待ってから止める関数を控え、Handlers を返す。start の後に cancel(0.01) を呼んでから Event を立てる
            mock: build・止める関数・Handlers.stop_engine・done を受ける関数
            expected: 止める関数が控えたときに呼ばれ、返った Handlers の stop_engine が呼ばれ、done が送出されない
          - name: test_cancel_when_thread_not_finished
            case: 異常
            summary: スレッドが終わらなければ待つのをやめて戻る
            condition: build が止める関数を控えた後、Event を待ち続ける（止める関数では戻らない）。start の後に cancel(0.05)
            mock: build・止める関数
            expected: cancel が 0.05 秒ほどで戻り、WARNING のログが出る
    status: planned
constants:
  - name: STARTUP_CANCEL_TIMEOUT_SEC
    title: 起動の配線の取り消しの待ち
    container: main.py
    usecase: 常駐アプリを起動する
    summary: 配線の間に抜けたときに、配線のスレッドの終わりを待つ秒数
    value: '5.0'
    reason: WhisperWorkerClient.stop は終わりを最大で WORKER_STOP_TIMEOUT_SEC（2.0 秒）の 2 回待ってから kill する。止めた後に配線が StartupError で終わるまでの余裕を 1 秒置く
    status: planned
  - name: API_START_TIMEOUT_SEC
    title: API の待ち受けの始まりを待つ秒数
    container: main.py
    usecase: 常駐アプリを起動する
    summary: ApiServerRunner.start が started を待つ上限。uvicorn の起動の実測が無いため仮に置き、結合テストで起動にかかる時間を測って p99.9 + 50% に直す
    value: '5.0'
    status: implemented
  - name: SESSION_LIMIT_CHECK_INTERVAL_SEC
    title: 上限での打ち切りを確かめる間隔
    container: main.py
    usecase: APIで録音を操作する
    summary: RepeatingTimer が truncate_if_expired を呼ぶ間隔。打ち切りの遅れはこの間隔までで、API の録音セッションの上限時間（600 秒）に対して無視できる 1 秒にする
    value: '1.0'
    status: implemented
  - name: API_SESSION_LIMIT_SEC
    title: API の録音セッションの上限時間
    container: main.py
    usecase: APIで録音を操作する
    summary: SessionManager へ渡す上限時間。非機能要件の API の録音セッションの上限時間の決定値
    value: '600'
    status: implemented
  - name: WAKE_INTERVAL_MS
    title: Python へ戻る間隔
    container: main.py
    usecase: 常駐アプリを起動する
    summary: Qt のイベントループの中で Python のシグナルのハンドラが動くようにする空の QTimer の間隔。PoC で 200 ms なら Ctrl+Break から 0.3 秒で終わった
    value: '200'
    status: implemented
  - name: SINGLE_INSTANCE_TIMEOUT_SEC
    title: 前の常駐サービスの終わりを待つ時間
    container: main.py
    usecase: 常駐アプリを起動する
    summary: acquire_single_instance に渡す、前のプロセスが排他を放すのを待つ上限。非機能要件の前の常駐サービスの終わりを待つ時間の決定値
    value: '55.0'
    status: implemented
  - name: PURGE_INTERVAL_SEC
    title: 常駐中に古いログと履歴を削除する間隔
    container: main.py
    usecase: 常駐アプリを起動する
    summary: RepeatingTimer が purge_old_files を呼ぶ間隔。非機能要件の常駐中に古い履歴とログを削除する間隔（24 時間）を秒にした値
    value: '86400.0'
    status: implemented
  - name: SETTINGS_MODEL
    title: アプリの設定のモデル
    container: main.py
    usecase: 常駐アプリを起動する
    summary: OUTPUTS のうち settings_model を持つ出力先のモデルを OUTPUTS の並びで build_settings_model に渡して組み立てた設定のモデル。load_settings と既定の設定はこれを使う
    value: build_settings_model([spec.settings_model for spec in OUTPUTS if spec.settings_model is not None])
    status: planned
  - name: GLOSSARIES_DIR_NAME
    title: 追加した用語集の CSV を置くフォルダの名前
    container: main.py
    usecase: 設定を変える
    summary: 設定画面で追加した用語集の CSV を置く、settings.yaml と同じフォルダの下のフォルダの名前。next_glossary_path の directory に渡す
    value: '"glossaries"'
    status: implemented
  - name: HAAS_SETTING_LABELS
    title: Haas の起動の値の名前
    container: main.py
    usecase: 常駐アプリを起動する
    summary: 動いている Haas のサーバーが設定と違うときの通知に出す項目の名前（画面設計『トレイの通知』の {違う項目}）
    entries:
      - key: model
        value: モデル
      - key: dtype
        value: 計算の精度
      - key: device
        value: 装置
    refs:
      - SCR-2#
    status: planned
functions:
  - name: build_handlers
    title: 配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: public
    summary: 設定からエンジン・録音機・出力先・履歴を組み立て、SessionDeps を作って SessionManager と SessionApiDeps を返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 設定
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: notify
        type: NotifyFn
        required: true
        passing: positional
        description: 画面への知らせ
      - name: report_progress
        type: ProgressFn
        required: true
        passing: positional
        description: 文字起こしの進みの知らせ（ui の report_progress）
      - name: notify_copied
        type: Callable[[str], None]
        required: true
        passing: positional
        description: コピーの完了の知らせ（ui の notify_copied）
      - name: adapters
        type: PlatformAdapters
        required: true
        passing: keyword
        description: OS ごとの実装（select_platform_adapters）
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: keyword
        description: 環境変数（main が os.environ を渡す。OpenAI の API キーを読むのに使う）
      - name: unavailable
        type: frozenset[Feature]
        required: true
        passing: keyword
        description: OS で使えない機能（main が unavailable_features(CURRENT_OS) を渡す）
      - name: on_engine_created
        type: Callable[[Callable[[], None]], None]
        required: false
        default: 何もしない関数
        passing: keyword
        description: エンジンを止める関数を、エンジンの準備（ワーカーの ready の待ち）を始める前に受け取る関数（main は _StartupBuild の控える関数を渡す）
    returns:
      type: Handlers
      description: 配線済みの関数の束
    process: |-
      1. 設定を SettingsStore に入れる。以降の配線は設定を値でなく SettingsStore.get から読む（保存した immediate の項目を次の回から効かせる）
      2. 設定のエンジンで文字起こしの engine と stop_engine を作り、engine を文字起こしに渡す。get_hint には、SettingsStore.get の hint_presets を join_hint_words でつなぎ、空なら None を返す関数を渡す
         - local_whisper の場合、ensure_local_whisper_installed で確かめ（StartupError はそのまま送出する）、WhisperWorkerClient を adapters.worker_creationflags で作り、on_engine_created にその stop を渡してから起動する。engine はその transcribe、stop_engine はその stop
           - EngineError の場合、StartupError を送出する
         - openai の場合、read_openai_api_key（paths.openai_api_key_file・environ）で読んだ API キーと設定の transcription.openai で OpenAITranscriber を作る（文字起こしワーカーは起動しない）。engine はその transcribe、stop_engine は何もしない関数（StartupError はそのまま送出する）。on_engine_created には stop_engine を渡す
         - haas の場合、設定の transcription.haas で HaasServer を作り、on_engine_created にその stop を渡してから ensure_started を呼ぶ。unavailable に Feature.HAAS_ENGINE があれば ensure_started を呼ばずに次の切り戻しへ進む
           - 通った場合、ensure_started が返した違う項目があれば、notify（engine_settings_mismatch）に HAAS_SETTING_LABELS で名前にした項目を「・」でつないで渡す。HaasTranscriber（SettingsStore.get の hint_presets を collect_hint_vocabulary で集める関数を get_vocabulary、SettingsStore.get の transcription.haas を返す関数を get_settings に渡す）を作る。engine はその transcribe、stop_engine は HaasServer.stop、動いているエンジンは haas
           - EngineError の場合、ローカルの Whisper へ切り戻す。notify（engine_fallback）で「Haas のサーバーへ接続できないため、ローカルの Whisper で起こします。」を知らせ、上の local_whisper の場合と同じ流れで作る。動いているエンジンは local_whisper
             - `[WARNING]` Haas のサーバーへ接続できないためローカルの Whisper で起こす（理由）
      3. 連続録音の話し声の判定に使う VAD のセッションを 1 回だけ読む（load_vad_session。StartupError はそのまま送出する）
      4. Recorder に音量の関数（unavailable に Feature.LOWER_VOLUME があれば integrations/volume/noop.py の lower_volume_noop・restore_volume_noop、無ければ adapters の lower_volume・restore_volume）と、SettingsStore から録音の設定を返す関数と、VAD のセッションを部分適用した StreamingVad（話し声の判定を作る）を渡す
      5. 出力先の deliver に、配線した OUTPUTS（_wire_outputs）・配線した PRESET_KINDS（_wire_preset_kinds。open_window に adapters.open_app_window、send_paste に adapters.send_paste、send_enter_fn に adapters.send_enter）と、届けるたびに SettingsStore からオンの出力先の ID を引く関数を部分適用し、Session を入口・出力先の ID・選んだプリセット・コールバック先に分けて渡すアダプタを作る
         - 出力先には OutputDeps（copy_to_clipboard・設定の keyboard.paste_key で adapters.send_paste を呼ぶ関数・adapters.send_enter・time.sleep・random.uniform(0, x)・post_json・SettingsStore.get・notify_copied）を渡し、各出力先の inject が選ぶ
         - ブラウザ添付（種類）: copy_to_clipboard・adapters.open_app_window・adapters.send_paste を呼ぶ関数・adapters.send_enter・time.sleep・設定の preset_options.browser.open_delay_sec を返す関数・貼り付けて送信の enter_delay_sec を返す関数（read_enter_delay_sec）
         - エンドポイントへ送信（種類）: post_json・設定の preset_options.endpoint.timeout_sec を返す関数
      6. 文字起こしのたびに、SettingsStore の設定の edge_phrases で文頭・文末の文言を消してから（strip_edge_phrases）用語集を読み直して置き換える correct（起こした文字と用語集のプリセットの名前か None を受ける）を作る。そのたびに、SettingsStore の設定と settings.yaml のフォルダから pick_glossary_preset（requested に受けた名前）でプリセットを引き、list_preset_glossaries（用語集の一覧は resolve_glossaries）の順に load_glossary した行を 1 本の並びにつないで apply_glossary を当てる（読めない CSV は load_glossary が空を返すので飛ばされる。使う用語集が無ければ置き換えない）
         - `[INFO]` 用語集で補正する（用語集のプリセットの名前・用語集ごとの名前と補正に使う行数）
      7. SessionDeps を組み（report_progress、起動時の設定の api.continuous.min_silence_sec を部分適用した Recorder.start_continuous、Recorder.stop_continuous を含む）、API の録音セッションの上限時間と、起動時の設定の api.continuous.session_limit_sec の連続録音の上限時間と共に SessionManager を作る（api.continuous.* は再起動で効く）
      8. SessionManager と、設定の許可ホストを部分適用した is_callback_allowed と、SettingsStore の設定と settings.yaml のフォルダで resolve_glossary_presets した一覧にその名前があるかを返す glossary_preset_exists を SessionApiDeps に束ねる
      9. start_local_session に SessionManager と notify を部分適用する
      10. unavailable に Feature.WEB_TRANSCRIPTION があれば、ブラウザの文字起こしを配線せず web_api を None にする。無ければブラウザの文字起こしを配線する。WebTranscriptionDeps に、履歴を残すかをそのたびに SettingsStore.get から引いて渡す store_web_audio、7 と同じ transcribe、6 の correct（ジョブの用語集のプリセットの名前を受ける）・append_text・discard_temporary を部分適用して渡し、WebJobQueue を作る。WebJobQueue・probe_audio・`{tmp_dir}/web`・8 と同じ glossary_preset_exists・そのたびに SettingsStore の設定と settings.yaml のフォルダで resolve_glossary_presets した名前の一覧と pick_glossary_preset（requested なし）の名前を GlossaryPresetChoices で返す list_glossary_preset_choices・2 で決まった動いているエンジンが local_whisper か（reports_progress。build_ui_deps の reports_progress と同じ判定）を WebApiDeps に束ねる（ワーカースレッドはまだ立てない）
    exceptions:
      - name: StartupError
        condition: 文字起こしのエンジンを準備できない（ローカルの Whisper の依存が無い（Haas から切り戻した先でも同じ）・ワーカーが立たない・OpenAI の API キーが無い・VAD を読めない）
    status: implemented
    unit_tests:
      - name: test_build_handlers_when_haas
        case: 正常
        summary: 設定が haas でサーバーが応答する
        condition: transcription.engine=haas、HaasServer.ensure_started が通る
        mock: HaasServer・WhisperWorkerClient
        expected: active_engine が haas、stop_engine が HaasServer.stop、WhisperWorkerClient が作られない
      - name: test_build_handlers_when_haas_unavailable
        case: 正常
        summary: サーバーへ接続できなければローカルの Whisper へ切り戻す
        condition: transcription.engine=haas、ensure_started が EngineError を送出する
        mock: HaasServer・WhisperWorkerClient・notify
        expected: notify に切り戻しの文が渡り、active_engine が local_whisper、WhisperWorkerClient が起動され、reports_progress が True
      - name: test_build_handlers_when_haas_not_supported_on_os
        case: 正常
        summary: Haas を使えない OS では接続先を確かめずに切り戻す
        condition: transcription.engine=haas、unavailable に Feature.HAAS_ENGINE がある
        mock: HaasServer・WhisperWorkerClient・notify
        expected: ensure_started が呼ばれず、active_engine が local_whisper
      - name: test_build_handlers_when_haas_settings_mismatch
        case: 正常
        summary: 動いている Haas のサーバーが設定と違う
        condition: transcription.engine=haas、HaasServer.ensure_started が ("dtype", "device") を返す
        mock: HaasServer・WhisperWorkerClient・notify
        expected: notify に engine_settings_mismatch と「計算の精度・装置」が渡り、active_engine が haas
  - name: main
    title: 起動
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 常駐サービスを起動し、終わるまで画面のイベントループを回す
    returns:
      type: int
      description: 終了コード
    process: |-
      1. 起動の引数を読む（parse_args。argv が None なら sys.argv[1:]）
      2. 置き場所を決め、ログを INFO で設定する（resolve_app_paths・setup_logging）
      3. デスクトップのセッションを判定して OS に合った実装を選び（select_platform_adapters(CURRENT_OS, lock_file=paths.lock_file, display_session=detect_display_session(os.environ))）、OS で使えない機能を引き（unavailable_features(CURRENT_OS)）、置き場所ごとの名前で単一インスタンスを確保する（instance_name・PlatformAdapters.acquire_single_instance(SINGLE_INSTANCE_TIMEOUT_SEC)）
         - StartupError の場合、1 を返す（トレイを出す前のため、ログにだけ残す）
           - `[ERROR]` 起動に失敗した（理由）
      4. PlatformAdapters.qt_platform が None でなく、環境変数に QT_QPA_PLATFORM が無ければ、QT_QPA_PLATFORM にその値を入れる（Wayland のセッションの xcb）。QApplication（最後の窓を閉じても終わらない）・UiBridge・Tray を作り、apply_theme(app, "system", image_dir=paths.ui_image_dir) で画面の明暗を当ててトレイに準備中を出す。WAKE_INTERVAL_MS ごとの空の QTimer を置き、SIGINT・SIGBREAK・SIGTERM で QApplication.quit を呼ぶ（SIGTERM はログアウト・systemctl stop で届き、12 の片付けを通す）。後から起動したプロセスに終わるよう頼まれたら、QApplication.quit をメインスレッドで呼ぶ（SingleInstanceLock.on_quit_requested に、QMetaObject.invokeMethod で QApplication.quit をキューに入れる関数を渡す）。トレイの「再起動」「終了」を _ExitRequest の request_restart・request_quit へつなぐ（7 の配線の間も抜けられるようにする。7 の結果を受けたら外す）
      5. 設定を読む（load_settings(paths, SETTINGS_MODEL)。--data-dir を渡したときは checkout の上書きを読まない）
         - SettingsError の場合、トレイを失敗にして設定を読めないことを通知し（Tray.set_failed(settings_enabled=False)・Tray.show_failure(settings_invalid, 理由, paths=SettingsError.paths)）、「録音を開始」「設定…」を押せないまま 11 へ（フォルダを開いて読めなかったファイルを直し、再起動できる）
           - `[ERROR]` 起動に失敗した（理由）
      6. 設定の ui.theme で画面の明暗を当て直し（apply_theme。image_dir は paths.ui_image_dir）、QStyleHints.colorSchemeChanged に、SettingsStore.get の ui.theme で apply_theme を呼ぶ関数をつなぐ（OS の明暗が変わったときに当て直す）。ルートロガーのレベルを設定のログのレベルにし、保持期間で古いログと履歴を消す（purge_old_files。処理中の録音セッションは無いため、一時の音声も全て消す対象にする）
         - `[INFO]` 設定を読んだ（設定ファイルのパス・エンジン・オンの出力先の ID）
      7. 配線を、_StartupBuild でメインスレッドの外のスレッドに流す（build_handlers。notify・report_progress・notify_copied は UiBridge を部分適用した ui のもの、adapters は 3 で選んだ PlatformAdapters、environ は os.environ、unavailable は 3 で引いた使えない機能、on_engine_created は _StartupBuild がエンジンを止める関数を控える関数）。配線の間の知らせ（engine_fallback・engine_settings_mismatch）は、受ける UiController がまだ無いため、UiBridge.notified を Tray.show_failure へ queued でつなぎ、配線の結果を受けたときに外す。流している間も 11 のイベントループを回し、トレイを準備中のまま出す（モデルの取得の間もトレイのアイコンが出て、メニューを操作できる）。結果は _StartupBuild.done でメインスレッドへ戻り、4 でつないだ「再起動」「終了」を外してから、8〜10 か下の StartupError の扱いをメインスレッドで行う
         - StartupError の場合、トレイを失敗にして起動の失敗を通知し（Tray.set_failed(settings_enabled=True)・Tray.show_failure(engine_unavailable, 理由)）、「設定…」だけを押せるまま 11 へ（設定画面は読んだ設定で開き、保存は settings.yaml へ書くだけにする。Handlers が無いため、UiDeps のうち録音・ホットキーの関数（start・pause・resume・complete・cancel・current_session・level・suspend_hotkeys・resume_hotkeys）は何もしない関数にし、設定画面を閉じてもホットキーの受付を始めない）
           - `[ERROR]` 起動に失敗した（理由）
      8. ホットキーの受付を作り（PlatformAdapters.create_hotkey_listener(排他の名前, 3 で取った排他)）、UiController を作り（build_ui_deps）、UiBridge の知らせの受け手につなぐ（notified → on_notified・progressed → on_progressed・copied → on_copied。9 で待ち受けを始められない知らせを取りこぼさないよう、API より先に作る）
      9. Handlers.web_api が None でなければブラウザの音声のキューを始め（WebJobQueue.start(`{tmp_dir}/web`)）、トークンを作り、API サーバーを起動する（create_token・build_fastapi（Handlers.web_api と設定の api.allowed_web_origins を渡す。web_api が None なら `/web/` の下のルートを持たない）・ApiServerRunner.start(API_START_TIMEOUT_SEC)）
         - True の場合だけ、トークンのファイルを書く（write_token_file）
         - False の場合、トークンのファイルを書かずに api_unavailable を知らせて続ける（ホットキーとトレイからの録音は使える）。理由は「ポート {ポート} で待ち受けを始められません」の 1 文にする
      10. ホットキーの受付を始め（8 で作った受付の start(build_hotkey_bindings(設定))。Wayland のセッションでは GNOME のカスタムショートカットへ登録する）、上限の打ち切りを RepeatingTimer で SESSION_LIMIT_CHECK_INTERVAL_SEC ごとに呼ぶ（SessionManager.truncate_if_expired）。古いログと履歴の削除を RepeatingTimer で PURGE_INTERVAL_SEC ごとに呼ぶ（purge_old_files。設定は呼ぶたびに SettingsStore.get から引き、設定画面で変えた保持期間・履歴を残すかを次の回から効かせる。処理中の録音セッションの ID は SessionManager.current から引く）。トレイを待機中にする
         - HotkeyError の場合、ホットキーを受け付けずに続ける（トレイから録音でき、設定画面で直せる）
           - `[ERROR]` ホットキーを受け付けられなかった（理由）
         - キーの送信の機器を開く（PlatformAdapters.open_key_sender）
           - DeliveryError の場合、トレイで貼り付けを使えないことを知らせて続ける（Tray.show_failure(paste_unavailable, 理由)。「コピーのみ」は使える）
             - `[ERROR]` キーの送信の機器を開けなかった（理由）
         - `[INFO]` 常駐サービスを始めた（API のポート）
      11. イベントループを回す（exec_loop）
      12. 抜けたら、新しい開始が来ないように入口とタイマー（ホットキー・API サーバー・2 つのタイマー）を先に止め、録音を捨て（SessionManager.close）、ブラウザの音声のキューを始めていれば閉じ（WebJobQueue.close。待ちの一時のファイルを消す）、エンジンを止め、キーの送信の機器を閉じ（PlatformAdapters.close_key_sender）、トレイを消す（8 までで立てたものだけ）。7 の配線を流している間に抜けた場合は、_StartupBuild.cancel(STARTUP_CANCEL_TIMEOUT_SEC) でエンジンを止め、配線のスレッドの終わりを待つ。最後に単一インスタンスの排他を放す（SingleInstanceLock.release）
          - `[INFO]` 常駐サービスを終えた
      13. 再起動を頼まれていれば、同じ引数で起動し直す（PlatformAdapters.relaunch。排他を放した後に呼ぶため、次のプロセスは待たずに排他を取れる）
      14. 0 を返す
    status: implemented
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: コマンドの引数。None なら sys.argv[1:]
      - name: exec_loop
        type: Callable[[QApplication], int]
        required: false
        default: QApplication.exec を呼ぶ関数
        passing: keyword
        description: イベントループを回す関数。テストではすぐ抜ける関数を渡す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 設定を読んで API・ホットキー・トレイを立て、イベントループが抜けたら片付けて 0 を返す
        condition: --data-dir に空の一時フォルダ。QT_QPA_PLATFORM=offscreen、exec_loop は _StartupBuild.done を受けて 10 が終わるまでイベントを処理してから 0 を返す
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。{data_dir}/settings.yaml ができず（既定値で動く）、token_file があり、HotkeyListener が引数なしで作られ、HotkeyListener.start に既定のホットキーが渡り、RepeatingTimer が SESSION_LIMIT_CHECK_INTERVAL_SEC と PURGE_INTERVAL_SEC の 2 つ作られ、HotkeyListener.stop・2 つの RepeatingTimer.stop・ApiServerRunner.stop・SessionManager.close・stop_engine・Tray.hide がこの順に 1 回ずつ呼ばれ、最後に単一インスタンスの排他が放される（同じ data_dir でもう一度取れる）
      - name: test_main_when_building_off_main_thread
        case: 正常
        summary: 配線をメインスレッドの外で流し、その間もイベントループを回す
        condition: --data-dir に空の一時フォルダ。build_handlers が threading.Event を待ってから Handlers を返す。exec_loop の中でイベントを処理し、トレイが準備中のままであることを確かめてから Event を立て、10 が終わるまでイベントを処理して抜ける
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。build_handlers がスレッド名 `startup-build` のスレッドで呼ばれ、Event を立てる前は Tray.set_state(IDLE) と HotkeyListener.start が呼ばれておらず、立てた後に呼ばれる
      - name: test_main_when_quit_while_building
        case: 正常
        summary: 配線の間に終了を頼まれたら、エンジンを止めて排他を放す
        condition: --data-dir に空の一時フォルダ。build_handlers が on_engine_created に止める関数を渡した後、その関数が呼ばれるまで戻らない（呼ばれたら StartupError を送出する）。exec_loop の中で Tray.quit_requested を送出し、イベントを処理してから抜ける
        mock: build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray
        expected: 0。on_engine_created に渡した止める関数が 1 回呼ばれ、HotkeyListener と ApiServerRunner が作られず、Tray.show_failure が呼ばれず、Tray.hide の後に排他が放され、relaunch が呼ばれない
      - name: test_main_when_restart_while_building
        case: 正常
        summary: 配線の間に再起動を頼まれたら、エンジンを止めてから起動し直す
        condition: test_main_when_quit_while_building と同じで、exec_loop の中で Tray.restart_requested を送出する
        mock: build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray・relaunch
        expected: 0。止める関数が 1 回呼ばれ、排他を放した後に relaunch が 1 回呼ばれる
      - name: test_main_when_invalid_settings
        case: 異常
        summary: 設定が合わなければトレイで知らせて入口を立てない
        condition: transcription.local_whisper.beam_size = "x" の settings.yaml がある data_dir。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed(settings_enabled=False) と Tray.show_failure(settings_invalid, 理由, paths=(settings.yaml のパス,)) が呼ばれ（理由に transcription.local_whisper.beam_size が出る）、ERROR のログに transcription.local_whisper.beam_size が出、build_handlers・ApiServerRunner・HotkeyListener.start が呼ばれない
        exception: SettingsError
      - name: test_main_when_startup_error
        case: 異常
        summary: エンジンを準備できなければトレイを失敗にして続ける
        condition: build_handlers が StartupError を送出する。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed(settings_enabled=True) と Tray.show_failure(engine_unavailable) が呼ばれ、ApiServerRunner が作られず、HotkeyListener.start が呼ばれない
        exception: StartupError
      - name: test_main_when_api_unavailable
        case: 正常
        summary: 待ち受けを始められなければトークンのファイルを書かずに知らせて続ける
        condition: 前回の起動の token_file がある data_dir。ApiServerRunner.start が False を返す。exec_loop はイベントを処理してから 0 を返す
        mock: build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray
        expected: 0。token_file が前回の内容のままで、Tray.show_failure に api_unavailable と「ポート {ポート} で待ち受けを始められません」が渡り、HotkeyListener.start が呼ばれる
      - name: test_main_when_restart_requested
        case: 正常
        summary: 再起動を頼まれたら片付けた後に起動し直す
        condition: exec_loop の中で UiDeps.request_restart を呼ぶ
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray・relaunch
        expected: 0。relaunch が ApiServerRunner.stop と stop_engine の後に、同じ argv で 1 回呼ばれる
      - name: test_main_when_no_data_dir
        case: 正常
        summary: データの置き場所を渡さなければ既定の置き場所で起動する
        condition: argv=[]。QT_QPA_PLATFORM=offscreen、exec_loop はすぐ 0 を返す
        mock: platformdirs の user_config_dir・user_data_dir（それぞれ一時フォルダの config・local を返す）・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。一時フォルダの config/settings.yaml ができず、local/api_token があり、local/log の下にログが書かれる
      - name: test_main_when_previous_instance_not_released
        case: 異常
        summary: 前のプロセスが排他を放さなければトレイを出さずに終わる
        condition: acquire_single_instance が StartupError を送出する
        mock: acquire_single_instance・build_handlers・Tray
        expected: 1。ERROR のログが 1 行出、Tray・build_handlers が作られない
        exception: 前のプロセスが排他を放さない
      - name: test_main_when_quit_requested
        case: 正常
        summary: 後から起動したプロセスに頼まれたら片付けて排他を放す
        condition: --data-dir に空の一時フォルダ。exec_loop の中で、on_quit_requested に渡された関数を別のスレッドから呼び、イベントを処理してから抜ける
        mock: acquire_single_instance（SingleInstanceLock の代わりを返す）・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。QApplication.quit がメインスレッドで呼ばれ、stop_engine・Tray.hide の後に SingleInstanceLock.release が 1 回呼ばれ、relaunch が呼ばれない
      - name: test_main_when_sigterm
        case: 正常
        summary: SIGTERM を受けたら片付けて排他を放す
        condition: Linux（Windows では skip）。--data-dir に空の一時フォルダ。exec_loop の中で自分のプロセスへ SIGTERM を送り、イベントを処理してから抜ける
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。QApplication.quit が呼ばれ、HotkeyListener.stop・Tray.hide が 1 回ずつ呼ばれ、単一インスタンスの排他が放される（同じ data_dir でもう一度取れる）
      - name: test_main_when_key_sender_unavailable
        case: 異常
        summary: キーの送信の機器を開けなければトレイで知らせて続ける
        condition: --data-dir に空の一時フォルダ。select_platform_adapters の戻り値の open_key_sender が DeliveryError("Permission denied") を送出する。exec_loop はすぐ 0 を返す
        mock: select_platform_adapters・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。Tray.show_failure に paste_unavailable と「Permission denied」が渡り、HotkeyListener.start が呼ばれ、トレイが待機中になり、close_key_sender が片付けで 1 回呼ばれる
        exception: キーの送信の機器を開けない
      - name: test_main_when_web_transcription_unavailable
        case: 正常
        summary: 外の端末のブラウザの機能を使えない OS ではキューを始めず、/web/ のルートを持たない
        condition: --data-dir に空の一時フォルダ。unavailable_features が frozenset({Feature.WEB_TRANSCRIPTION}) を返す。exec_loop はすぐ 0 を返す
        mock: unavailable_features・build_handlers（web_api が None の Handlers を返す）・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。build_handlers の unavailable に Feature.WEB_TRANSCRIPTION が渡り、build_fastapi の web_api が None で、WebJobQueue.start・WebJobQueue.close が呼ばれない
      - name: test_main_when_qt_platform
        case: 正常
        summary: Wayland のセッションでは Qt のプラットフォームを xcb にする
        condition: --data-dir に空の一時フォルダ。環境変数 QT_QPA_PLATFORM を消し、select_platform_adapters の戻り値の qt_platform が "xcb"。QApplication の生成を差し替え、exec_loop はすぐ 0 を返す
        mock: select_platform_adapters・QApplication・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: QApplication を作る時点で環境変数 QT_QPA_PLATFORM が "xcb"。あらかじめ QT_QPA_PLATFORM=offscreen を入れたときは offscreen のまま
      - name: test_main_when_engine_fallback
        case: 正常
        summary: 配線の間の知らせをトレイの通知で出す
        condition: build_handlers の中で notify に engine_fallback と文を渡す
        mock: select_platform_adapters・build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray
        expected: 0。Tray.show_failure に engine_fallback と文が渡る
    notes:
      テスト: 7 の配線の結果はイベントループの中で届くため、exec_loop の差し替えは、_StartupBuild.done を受けて 10（StartupError の場合は 7 の扱い）が終わるまでイベントを処理してから抜ける
  - name: start_local_session
    title: ホットキー・トレイからの開始
    kind: 関数
    container: main.py
    usecase: 録音する
    scope: public
    summary: SessionManager.start を呼び、断られた理由をユーザーへ知らせる。例外を pynput・画面のスレッドへ漏らさない
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: hotkey か tray
      - name: session_manager
        type: SessionManager
        required: true
        passing: injected
        description: 録音セッション管理
      - name: notify
        type: NotifyFn
        required: true
        passing: injected
        description: ユーザーへの知らせ
    returns:
      type: None
      description: なし
    process: |-
      1. SessionManager.start(entry) を呼ぶ
         - SessionBusyError の場合、busy を知らせる（ダイアログ）
         - MicrophoneUnavailableError の場合、microphone_unavailable を知らせる（トレイ）
         - それ以外の例外の場合、ログに書いて握る
           - `[ERROR]` 録音を始められなかった（logger.exception）
    unit_tests:
      - name: test_start_local_session_when_busy
        case: 正常
        summary: 処理中なら busy を知らせる
        condition: start が SessionBusyError を送出する
        mock: session_manager・notify
        expected: notify に busy が渡り、例外が出ない
      - name: test_start_local_session_when_microphone_unavailable
        case: 正常
        summary: マイクを開けなければ microphone_unavailable を知らせる
        condition: start が MicrophoneUnavailableError を送出する
        mock: session_manager・notify
        expected: notify に microphone_unavailable が渡り、例外が出ない
      - name: test_start_local_session_when_unexpected_error
        case: 正常
        summary: 想定外の例外も漏らさない
        condition: start が RuntimeError を送出する
        mock: session_manager・notify
        expected: 例外が出ず、ERROR のログが 1 行出る
    status: implemented
