id: MOD-65
visibility: internal
title: 常駐アプリ / 出力先 / service.py
test_files:
  - tests/unit/voice_paste/features/outputs/endpoint/test_service.py
functions:
  - name: deliver_to_endpoint
    title: エンドポイントへ送信
    kind: 関数
    container: features/outputs/endpoint/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: PresetFn
    summary: 選んだエンドポイントへ送信のプリセットの URL へ、送信する内容を 1 回 POST する。再送しない
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: preset
        type: EndpointPreset
        required: true
        passing: positional
        description: 確定の操作で選んだエンドポイントへ送信のプリセット（url・authorization・title を使用する）
      - name: post
        type: PostJsonFn
        required: true
        passing: injected
        description: 送信先へ JSON を POST してステータスを返却する（外部連携の post_json。タイムアウト・接続できないことは DeliveryError）
      - name: get_timeout_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 送信するときのタイムアウトの秒数を返却する（呼ぶたびに設定の preset_options.endpoint.timeout_sec を読み込む）
    returns:
      type: None
      description: なし
    process: |-
      1. 送信する内容（ResultPayload.from_outcome）を作る
      2. preset.authorization が空でなければ、その値を `Authorization` ヘッダーにする（空ならヘッダーを付けない）
      3. post(preset.url, 中身, get_timeout_sec(), ヘッダー) で 1 回だけ送信する
         - post が DeliveryError を送出した（タイムアウト・接続できない）場合、再送せずにそのまま送出する
      4. 2xx なら終える
         - `[INFO]` エンドポイントへ届けた（録音セッションの ID・プリセットのタイトル・ステータス）
         - 2xx 以外（3xx を含む）の場合、再送せずに DeliveryError を送出する
         - Authorization の値はログと例外の文に書き込まない
    exceptions:
      - name: DeliveryError
        condition: タイムアウト・接続できない・2xx 以外
    unit_tests:
      - name: test_deliver_to_endpoint
        case: 正常
        summary: 送信する内容を 1 回送信する
        condition: post が 200 を返却する、preset の url が http://127.0.0.1:9000/hook・authorization が空、get_timeout_sec が 1.5 を返却する
        mock: post・get_timeout_sec
        expected: post が 1 回、url・session_id・result・text・error を持つ dict・1.5・空のヘッダーで呼ばれる
      - name: test_deliver_to_endpoint_when_authorization
        case: 正常
        summary: Authorization を付けて送信し、ログに書き込まない
        condition: preset の authorization が Bearer test-token、post が 204
        mock: post・get_timeout_sec
        expected: 'post に {"Authorization": "Bearer test-token"} が渡り、ログに test-token が出ない'
      - name: test_deliver_to_endpoint_when_error_status
        case: 異常
        summary: 2xx 以外は再送せず DeliveryError
        condition: post が 500 を返却する
        mock: post・get_timeout_sec
        expected: DeliveryError が送出され、post が 1 回だけ呼ばれる
        exception: 2xx 以外
      - name: test_deliver_to_endpoint_when_unreachable
        case: 異常
        summary: 届かなければ再送せず DeliveryError
        condition: post が DeliveryError を送出する
        mock: post・get_timeout_sec
        expected: DeliveryError が送出され、post が 1 回だけ呼ばれる
        exception: タイムアウト・接続できない
    refs:
      - IF-7#
      - NFR-1#requirements[エンドポイントへ送信するときのタイムアウト]
    status: implemented
