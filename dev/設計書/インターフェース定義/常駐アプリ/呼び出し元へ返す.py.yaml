title: "呼び出し元へ返す"
entry:
  kind: trigger
  value: API から始めた録音の文字起こしが終わるか、上限で打ち切る が打ち切ったときに `POST {callback_url}` を送る
flows:
  - name: 正常系
    summary: 起こした文字を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、空でない文字が得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・text
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=transcribed と起こした文字が 1 回届いている
      - セッションが終わり、待機中に戻っている
    test: test_normal
  - name: 正常系（結果が空）
    summary: 空の文字を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、結果が空だった
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=transcribed・text=""
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=transcribed と空の text が 1 回届いている
    test: test_normal_when_empty
  - name: 正常系（文字起こしに失敗）
    summary: 文字起こしの失敗を返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 文字起こしの結果
        description: API から始めた録音で、文字起こしに失敗した
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=failed・error
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=failed と失敗の理由が 1 回届いている
    test: test_normal_when_transcription_failed
  - name: 正常系（上限で打ち切った）
    summary: 完了が来ないまま上限で打ち切ったことを返送先へ送る
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、200 を返す
      - name: 打ち切り
        description: 上限で打ち切る が、完了が来ないままセッションの上限時間（開始からの経過時間）に達したセッションを打ち切った
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        IF->>CB: POST session_id・result=truncated
        CB-->>IF: 200
      ```
    expected:
      - 返送先に result=truncated が 1 回届いている
    test: test_normal_when_truncated
  - name: 異常系（返送先に届かない・ログに書いて終える）
    summary: 決めた回数まで再送しても届かなければログに書いて終える
    setup:
      - name: Mock
        description: 返送先を 127.0.0.1 のテスト用の受け口にし、常に 500 を返す
      - name: 再送の設定
        description: 再送の間隔をテストで待てる短い値に差し替える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant IF as 呼び出し元へ返す
        participant CB as 返送先

        loop 決めた回数まで
          IF->>CB: POST session_id・result・text
          CB-->>IF: 500
        end
        IF->>IF: 届かなかったことと session_id をログに書く
      ```
    expected:
      - 返送先への送信が決めた回数だけ行われている
      - ログに届かなかったことと session_id が書かれている
      - セッションが終わり、待機中に戻っている
    test: test_error_when_callback_unreachable
lead: API から始めた録音の結果（起こした文字・空の文字・文字起こしの失敗・上限での打ち切り）を、開始で指定された返送先へ送る。
identifier: deliver_to_caller
idempotent: false
side_effects: 返送先へ HTTP で 1 回送る（届かなければ決めた回数まで再送する）。届かなかったときはログに書く。送り終えたらセッションを終えて待機中に戻す。
exclusivity: 1 セッションにつき 1 回だけ送る（再送は同じ中身）。
exceptions:
  - name: なし（正常終了）
    condition: 返送先が 2xx を返した
  - name: なし（届かなかったことをログに書いて終える）
    condition: 決めた回数まで再送しても、タイムアウト・接続できない・2xx 以外のどれかで届かない
    notes: 履歴は残り、常駐サービスは待機中に戻る
constraints:
  - item: 送り先
    constraint: 開始で受け取った callback_url だけ。ホストが loopback か設定で許可したホストであることを送る前にもう一度確かめる
  - item: タイムアウト
    constraint: 非機能要件の返送のタイムアウト
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
  - item: 再送
    constraint: 非機能要件の返送の再送回数と間隔
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
  - item: リダイレクト
    constraint: 追わない
    notes: 許可していないホストへ流れるのを防ぐ
  - item: 受け口の応答時間
    constraint: 受け口は返送を受け取ったら 1 秒以内に 2xx を返す。重い処理は 2xx を返した後で行う
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[返送のタイムアウトと再送]
    notes: 呼び出し元との取り決め。返送のタイムアウトはこの時間から導く
  - item: 重なって届く返送
    constraint: 受け口が 2xx を返す前にタイムアウトすると、同じ中身が同じ session_id で再送される。受け口は session_id で重複を見分ける
    notes: 常駐アプリが送るのは 1 セッションにつき 1 つの中身だけで、届いたかを確かめられないときだけ同じ中身を送り直す
  - item: 終了で捨てた録音
    constraint: 常駐サービスの終了で捨てた録音（録音中・停止中の API のセッション）は返送しない
    notes: 終了の時点で API サーバーも止まっており、返送を待つと終了が返送の最長まで遅れるため。呼び出し元は返送が来ないことで気づく
notes:
  送る中身: |-
    `application/json` で次のフィールドを送る。

    | フィールド | 型 | 説明 |
    | --- | --- | --- |
    | `session_id` | `str`（uuid） | 開始で返したセッションの ID |
    | `result` | `Literal["transcribed", "failed", "truncated"]` | `transcribed`: 起こした文字（空を含む）を得た。`failed`: 文字起こしに失敗した。`truncated`: 完了が来ないまま上限で打ち切った |
    | `text` | `str` | 用語集で補正した文字。`transcribed` で結果が空のときと、`failed`・`truncated` のときは空文字 |
    | `error` | `str \| None` | `failed` のときの理由。それ以外は `null` |

    ```json
    {
      "session_id": "3f1c2a9e-8d4b-4c4e-9a0b-2f7d1e6c5b10",
      "result": "transcribed",
      "text": "今日の会議は 15 時からです。",
      "error": null
    }
    ```
