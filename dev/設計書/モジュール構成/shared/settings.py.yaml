  - name: join_hint_words
    title: 表記のヒントの語のつなぎ
    container: shared/settings.py
    usecase: 録音を文字に起こす
    summary: 有効なプリセットの語を、一覧の上から順に読点（、）でつなぐ。Settings の長さの確かめと、文字起こしに渡す手がかりの組み立て（main.py）が共に使う
    kind: 関数
    scope: public
    args:
      - name: presets
        type: Sequence[HintWordSource]
        required: true
        passing: positional
        description: 設定の hint_presets、または設定画面の入力の途中の値（確かめを通らない値もそのままつなぐ）
    returns:
      type: str
      description: つないだ手がかり。有効な語が無ければ空文字
    process: 1. enabled が True のプリセットの words を一覧の順に並べ、読点（、）でつなぐ
    notes:
      補足: Settings の `model_validator(mode="after")` が、返した文字の UTF-8 のバイト数が HINT_MAX_BYTES を超えたら `PydanticCustomError`（type `hint_too_long`、場所 `hint_presets`、ctx に今のバイト数）を集める。ホットキー・用語集の名前の重なりと同じ確かめの中で集め、1 回の ValidationError にまとめる
    unit_tests:
      - name: test_join_hint_words
        case: 正常
        summary: 有効なプリセットの語を一覧の順につなぐ
        condition: 有効な A（語 voice-paste・Whisper）・無効な B（語 議事録）・有効な C（語 返信）
        mock: なし
        expected: '"voice-paste、Whisper、返信" が返る'
      - name: test_join_hint_words_when_none_enabled
        case: 正常
        summary: 有効な語が無ければ空文字
        condition: プリセットが空、または全て無効
        mock: なし
        expected: '"" が返る'
      - name: test_settings_when_hint_at_limit
        case: 正常
        summary: つないだ長さが上限ちょうどなら通る
        condition: 有効な語をつないだ長さが 222 バイトの hint_presets を SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: 検証に通る
      - name: test_settings_when_hint_too_long
        case: 異常
        summary: 上限を 1 バイトでも超えたら通らない
        condition: 有効な語をつないだ長さが 223 バイトの hint_presets を SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: ValidationError。type が hint_too_long、失敗の場所が hint_presets
      - name: test_settings_when_disabled_hint_long
        case: 正常
        summary: 無効のプリセットの語は長さに数えない
        condition: 有効な語は 100 バイト、無効なプリセットに 300 バイトの語を持つ hint_presets を SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: 検証に通る
      - name: test_settings_when_hint_word_has_separator
        case: 異常
        summary: 読点・句点・改行を含む語は通らない
        condition: 語「A、B」「C。」「D\nE」をそれぞれ持つ無効のプリセットを SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: ValidationError。type がどれも hint_word_separator、失敗の場所が hint_presets[0].words[0] などその語
      - name: test_settings_when_hint_word_blank
        case: 異常
        summary: 空白だけの語は通らない
        condition: 語「  」を持つ hint_presets を SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: ValidationError。type が hint_word_empty、失敗の場所が hint_presets[0].words[0]
      - name: test_load_settings_when_no_hint_presets
        case: 正常
        summary: hint_presets のキーが無い settings.yaml を読める
        condition: hint_presets を持たない settings.yaml を load_settings で読む
        mock: なし（tmp_path）
        expected: hint_presets が空の一覧
      - name: test_join_hint_words_when_unvalidated
        case: 正常
        summary: 確かめを通らない値もそのままつなぐ
        condition: enabled True・words ["", "A、B"] を持つ（HintPresetSettings でない）値を渡す
        mock: なし
        expected: '"、A、B" が返り、例外が出ない'
      - name: test_settings_when_hint_reading_not_kana
        case: 異常
        summary: 読みにかな以外の文字が入っている
        condition: readings が ["totsugou"] の hint_presets を SETTINGS_MODEL.model_validate に渡す
        mock: なし
        expected: ValidationError。type が hint_reading_not_kana、失敗の場所が hint_presets[0].readings[0]
      - name: test_settings_when_hint_readings_length
        case: 異常
        summary: 読みの数が語の数と違う
        condition: words が 2 つ、readings が 1 つ
        mock: なし
        expected: ValidationError。type が hint_readings_length、失敗の場所が hint_presets[0].readings
      - name: test_settings_when_hint_reading_conflict
        case: 異常
        summary: 同じ語に違う読みがある
        condition: words が 突合・突合、readings が とつごう・とつあわせ
        mock: なし
        expected: ValidationError。type が hint_reading_conflict、失敗の場所が hint_presets[0].readings[1]
      - name: test_settings_when_hint_reading_blank_on_duplicate_word
        case: 正常
        summary: 同じ語で片方の読みが空なら通る
        condition: words が 突合・突合、readings が とつごう・空文字
        mock: なし
        expected: 検証を通る
      - name: test_settings_when_haas_port_overlap
        case: 異常
        summary: Haas のポートが API のポートと同じ
        condition: transcription.haas.port と api.port が同じ番号
        mock: なし
        expected: ValidationError。type が haas_port_overlap、失敗の場所が transcription.haas.port
      - name: test_settings_when_haas_model_empty
        case: 異常
        summary: Haas のモデルが空
        condition: transcription.haas.model が空白だけ
        mock: なし
        expected: ValidationError。type が haas_model_empty、失敗の場所が transcription.haas.model
      - name: test_settings_when_haas_device_invalid
        case: 異常
        summary: Haas の装置の形式が違う
        condition: transcription.haas.device が gpu
        mock: なし
        expected: ValidationError。type が haas_device_form、失敗の場所が transcription.haas.device
      - name: test_settings_when_haas_separator_too_long
        case: 異常
        summary: Haas の区切りをつなぐ文字が長い
        condition: transcription.haas.separator が 17 文字
        mock: なし
        expected: ValidationError。type が haas_separator_too_long、失敗の場所が transcription.haas.separator
      - name: test_settings_when_haas_out_of_range
        case: 異常
        summary: Haas の数値が範囲の外
        condition: transcription.haas.chunk_sec が 0.5
        mock: なし
        expected: ValidationError。失敗の場所が transcription.haas.chunk_sec
      - name: test_settings_when_haas_device_numbered
        case: 正常
        summary: 番号つきの cuda は通る
        condition: transcription.haas.device が cuda:1
        mock: なし
        expected: 検証を通り、device が cuda:1
    refs:
      - CFG-1#settings[hint_presets[].words]
    status: implemented
