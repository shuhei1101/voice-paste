id: SCR-1
visibility: internal
title: "トレイ"
elements:
  - name: トレイのアイコン
    id: tray_icon
    kind: icon
    position: タスクバーの通知領域
    description: 状態ごとに同梱した画像（`resources/` の下）を出し分ける。失敗は録音中と同じ赤の地にマイクの斜線を入れ、色だけでなく形でも分ける。左クリック（既定の操作）は「録音を開始」と同じ。右クリックでメニューを開く。録音の画面を隠している間の左クリックは「録音の画面を表示」と同じで、それ以外の録音から届けるまでの間は何もしない
    io: 表示
    visible_when: 起動してから終了まで
    options: 準備中・待機中・録音中・文字起こし中・失敗（文字起こしのエンジンを準備できなかったか、設定を読み込めなかった起動のときだけで、次の起動まで続く）
    source: UiBridge.notified（state_changed）と起動の結果
    action_ref: MOD-24#classes[SessionManager].methods[start]
  - name: アイコンのヒント
    id: tray_tooltip
    kind: tooltip
    position: トレイのアイコン
    description: アイコンにかざすと状態を文字で出す
    io: 表示
    visible_when: アイコンにかざしたとき
    display_format: 'voice-paste: {状態}（例 voice-paste: 待機中）'
  - name: 録音を開始
    id: menu_start
    kind: menu_item
    position: メニュー > 1 番目
    description: 録音を開始する。後の流れは録音開始のホットキーと同じで、`recording.hide_window` がオンなら録音の画面を出さない。右に録音開始のホットキーを出す。既定の項目として太字で出し、押せないときは太字を外す
    label: 録音を開始 [hotkeys.start]（処理中は「録音を開始（処理中）」、準備に失敗した起動では「録音を開始（準備に失敗）」）
    visible_when: 常時
    enabled_when: 待機中のとき。録音から届けるまでの間（API から始めた録音の間を含む）と、起動に失敗した起動では押せない
    action_ref: MOD-24#classes[SessionManager].methods[start]
    refs:
      - SCR-10#
  - name: 設定…
    id: menu_settings
    kind: menu_item
    position: メニュー > 区切りの後 > 3 番目
    description: 設定画面を開く。文字起こしのエンジンを準備できなかった起動でも、設定を修正して再起動できるよう押せるまま残す。設定を読み込めなかった起動では、読み込んだ設定が無いため押せない
    label: 設定…（処理中は「設定…（処理中）」）
    visible_when: 常時
    enabled_when: 準備中（起動してから待機中か失敗になるまで）でなく、録音から届けるまでの間（API から始めた録音の間を含む）でもなく、設定を読み込めなかった起動でもないとき
    action_ref: SCR-9#
  - name: 設定フォルダを開く
    id: menu_open_settings_folder
    kind: menu_item
    position: メニュー > 4 番目
    description: settings.yaml のあるフォルダをエクスプローラーで開く
    label: 設定フォルダを開く
    visible_when: 常時
    action: 設定のフォルダを開く
  - name: ログフォルダを開く
    id: menu_open_log_folder
    kind: menu_item
    position: メニュー > 5 番目
    description: ログのフォルダをエクスプローラーで開く
    label: ログフォルダを開く
    visible_when: 常時
    action: ログのフォルダを開く
  - name: 再起動
    id: menu_restart
    kind: menu_item
    position: メニュー > 区切りの後 > 6 番目
    description: 常駐アプリを再起動する（処理中の扱いは補足）
    label: 再起動
    visible_when: 常時
    action: 常駐アプリを再起動する
  - name: 終了
    id: menu_quit
    kind: menu_item
    position: メニュー > 7 番目
    description: 常駐アプリを終了する（処理中の扱いは補足）
    label: 終了
    visible_when: 常時
    action: 常駐アプリを終了する
  - name: 録音の画面を表示
    id: menu_show_window
    kind: menu_item
    position: メニュー > 2 番目
    description: その回に隠した録音の画面を、隠す前の位置にフォーカスを取らずに戻す。隠している間はアイコンの左クリックと同じ操作になるため、既定の項目として太字で出す。項目は常に出し、押せないときは項目名に理由を添えて太字を外す
    label: 録音の画面を表示（録音の画面が出ている間は「録音の画面を表示（表示中）」、画面を出さない設定の録音と API から始めた録音の間は「録音の画面を表示（画面を表示しない録音）」、待機中・文字起こし中・準備に失敗した起動では「録音の画面を表示（録音していません）」）
    visible_when: 常時
    enabled_when: ホットキー・トレイから始めた録音セッションが recording か paused で、その回の録音の画面を隠しているとき
    action: 録音の画面を戻す
    refs:
      - SCR-10#
screen: src/voice_paste/ui/tray.py
mock: docs/mock/pages/tray/48/a-show-item/
lead: 常駐アプリの入口。アイコンで状態を示し、右クリックでメニューを開く。
refs:
  - SC-2#
  - SC-5#
  - SCR-2#
  - CFG-1#settings[ui.theme]
notes:
  処理中の再起動・終了: 録音から届けるまでの間（API から始めた録音の間を含む）に「再起動」・「終了」を選ぶと、アイコンはその時点で消し、再起動・終了はその回を届け終えてから行う
  メニューの見た目: 右クリックで開くメニュー（`QMenu`）の面は `color.*.surface`、外側の縁は `color.*.frame` の 1px の線で描く（`*` は `ui.theme` で決まる明暗）
test_file: tests/integration/ui/test_tray.py
