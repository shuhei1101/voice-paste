id: LIB-20
visibility: internal
title: "pyperclip"
kind: "ライブラリ"
version:
  current: 1.11.0
  checked_on: '2026-09-30'
  source: pyproject.toml（~=1.9）と uv.lock のバージョン
  pinning: 互換リリースで固定（~=1.9）
catalogs:
  - name: API
    version: 1.11.0
    entries:
      - name: copy
        kind: 関数
        purpose: 起こした文字をクリップボードへ書き込む
      - name: set_clipboard
        kind: 関数
        purpose: クリップボードの書き先を指定する（Wayland のセッションで `"xclip"` を引き渡し、`wl-copy` を使用しない）
        status: planned
lead: OS のクリップボードへ文字を書き込み、読み込むライブラリ。
purl: pkg:pypi/pyperclip
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/keyboard/sender.py
upstream: asweigart/pyperclip
verification:
  state: 済
  date: '2026-10-01'
  detail: Windows で pyperclip.copy / paste を呼び、起こした文字をクリップボードへ書き込んで元の文字へ戻せることを確認した
license: BSD（商用利用可）
official_url: https://github.com/asweigart/pyperclip
install: |-
  `uv sync --frozen` で入る。Linux（Xorg）ではクリップボードを `xclip` か `xsel` で扱うため、OS のパッケージを入れる。Wayland のセッションも `xclip`（XWayland）で書き込む（`set_clipboard("xclip")`）。pyperclip は `WAYLAND_DISPLAY` を確認して `wl-copy` を選ぶが、GNOME の `wl-copy` は書き込むたびに貼り付け先のフォーカスを取り、貼り付けのキーが落ちる（[#221](https://github.com/shuhei1101/voice-paste/pull/221) の PoC）。

  ```bash
  sudo apt install xclip
  ```
