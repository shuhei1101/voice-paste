title: "OpenAI API"
version:
  api_version: v1（URL 埋め込み型）
  checked_on: '2026-09-30'
auth:
  method: Bearer（API キー）
  env_vars:
    - OPENAI_API_KEY
  steps: https://platform.openai.com/api-keys で発行し、`.env` の `OPENAI_API_KEY` に入れる（設定画面の「OpenAI API キー」でも入れられる）。
endpoints:
  - name: POST /audio/transcriptions
    method: POST
    path: /audio/transcriptions
    summary: 録音の WAV を送り、区間ごとの文字と音声の長さを受け取る（モデル `whisper-1`・応答の形式 `verbose_json`・言語・温度）
    status_codes:
      - code: '200'
        condition: 文字起こしに成功した
      - code: 4xx / 5xx
        condition: SDK が例外を投げ、「文字起こしエラー」のダイアログを出す（ステータスごとの扱いの違いは無い）
lead: OpenAI のモデルを HTTP で呼ぶ API。音声の文字起こしのエンドポイントを持つ。
used_in:
  - voice_paste/transcription/openai_transcriber.py
verification:
  state: 未確認
  detail: 現状の棚卸しで、コードが呼んでいる範囲を写しただけで、動かしてはいない（呼ぶと従量課金が発生する）
base_urls:
  - env: 本番
    url: https://api.openai.com/v1
docs_url: https://platform.openai.com/docs/api-reference/audio/createTranscription
pricing_url: https://openai.com/api/pricing/
retry: 再試行はコードには無く、SDK の既定の挙動に任せている。
