id: MOD-56
visibility: internal
title: 常駐アプリ / 出力先 / settings.py
data_models:
  - name: PasteOnlySettings
    title: 貼り付けのみの設定
    container: features/outputs/paste_only/settings.py
    usecase: 起こした文字を届ける
    role: 設定のモデル
    summary: 出力先 paste_only のオン・オフ・確定のホットキー
    inherits: OutputSettingsBase
    properties:
      - name: id
        type: Literal["paste_only"]
        default: paste_only
        description: 出力先の ID
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        description: この出力先で確定するホットキー。OS で既定が変わるため既定値を持たず必須（既定の一覧の値は config/defaults.yaml の outputs と os_overrides が持ち、<ctrl>+<alt>+v、Linux は <cmd>+<alt>+v）
    status: planned
