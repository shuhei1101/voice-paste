id: LIB-24
visibility: internal
title: "pywin32"
kind: "ライブラリ"
version:
  current: '312'
  latest: '312'
  checked_on: '2026-10-05'
  source: pyproject.toml の [dependency-groups].dev（~=312.0）
  pinning: 互換リリースの範囲で固定（~=312.0。dev グループの既存の行に揃える。pywin32 のバージョンは整数 1 つなので、小数点以下を添えて 312.* の範囲にする）
catalogs:
  - name: API
    version: '312'
    entries:
      - name: win32com.client.Dispatch
        kind: 関数
        purpose: COM のオブジェクトを名前で作って呼ぶ（SAPI.SpVoice で文字を読み上げ、SAPI.SpFileStream へ書き出す）
lead: Windows の API（Win32）を Python から呼ぶライブラリ。
purl: pkg:pypi/pywin32
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - tests/support/inprocess.py
upstream: mhammond/pywin32
verification:
  state: 済
  date: '2026-10-05'
  detail: 新しく作った Windows の venv（Python 3.14）へ `pip install "pywin32~=312.0"` で入れ、`win32api`・`win32con`・`win32gui`・`win32process`・`win32com.client` を import でき、`win32com.client.Dispatch` で `Shell.Application` と `SAPI.SpVoice` を作れることを確かめた（入ったバージョンは 312）
license: PSF（商用利用可）
official_url: https://github.com/mhammond/pywin32
docs_url: https://mhammond.github.io/pywin32/
install: |-
  ```bash
  uv sync --frozen
  ```

  リポジトリの直下で Windows の uv（WSL からは `uv.exe`）で流す。
  dev グループに `; sys_platform == "win32"` を付けて宣言し、Linux の `uv sync --frozen` では入らない（Linux の wheel が無い）。使うテストは Linux で skip する。
