id: SC-5
visibility: internal
title: "常駐アプリを起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使用する設定にする
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as ファイル（ログ・履歴・トークン）
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant API as API のサーバー

        U->>SVC: 起動する
        SVC->>SVC: 名前付きの排他を取る
        SVC->>FS: 保持期間を過ぎたログと履歴を削除する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送信する
        WK-->>SVC: モデルを読み込んだ（ready）
        SVC->>FS: 起動ごとのトークンを作り、トークンのファイルに書き込む
        opt 動いている OS で外の端末のブラウザの機能を使用できる（Windows）
          SVC->>SVC: ブラウザの音声のキューとジョブのワーカースレッドを立てる
        end
        SVC->>API: 127.0.0.1 で待ち受けを始める（`/sessions`。Windows は `/web/` も）
        API-->>SVC: 待ち受けを始めた
        SVC->>SVC: 録音開始のホットキーの受付を始める
        SVC->>TRAY: 待機中のアイコンにする
      ```

      <!-- /map -->
    expected:
      - トレイのアイコンが待機中になっている
      - 録音開始のホットキーを押すと録音が始まる
      - 127.0.0.1 の API が、トークンを付けた要求に応える
      - Windows では、`/web/` が、許す Origin の一覧にあるオリジンから送信したブラウザの音声を受け付ける
      - Linux では、ブラウザの音声のキューが立たず、`/web/` の下の要求が 404 になる
      - トークンのファイル（Windows は `%LOCALAPPDATA%\voice-paste\`、Linux は `~/.local/share/voice-paste/` の下）に今回の起動のトークンが書き込まれている
      - 文字起こしワーカーの子プロセスが動いている
    test: test_normal
  - name: 正常シナリオ（前の常駐サービスが動いている）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを別プロセスで 2 つ起動し、操作はしない（補足『E2E のテスト』）
      - name: 前のプロセス
        description: 常駐サービスが 1 つ動いており、名前付きの排他を持っている
    flow: |-
      <!-- map: {"title": "正常シナリオ（前の常駐サービスが動いている）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant NEW as 新しい常駐サービス
        participant OLD as 前の常駐サービス

        U->>NEW: 起動する
        NEW->>NEW: 名前付きの排他が取られている
        NEW->>OLD: 終わるよう頼む
        OLD->>OLD: 録音・文字起こしを停止し、トレイのアイコンを消して終わる
        NEW->>NEW: 名前付きの排他を取る
        Note over NEW: 以降は 正常シナリオ と同じ
      ```

      <!-- /map -->
    expected:
      - 前の常駐サービスのプロセスが終わり、トレイに前のアイコンが残っていない
      - 新しい常駐サービスのアイコンが待機中で出ている
      - 常駐サービスのプロセスが 1 つだけ動いている
    notes:
      起動し直しの手作業: master を取り込んだ後にショートカットから起動し直す使い方を残すため、新しいプロセスが前のプロセスに終わるよう頼む。プロセスの番号での強制終了はしない。
    test: test_normal_when_previous_running
  - name: 正常シナリオ（保持期間を過ぎた履歴とログがある）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 保持期間
        description: 履歴とログの保持期間を 1 日にする
      - name: 古い履歴とログ
        description: 今日から 2 日前の日付の履歴とログと、今日の日付の履歴とログがある
    flow: |-
      <!-- map: {"title": "正常シナリオ（保持期間を過ぎた履歴とログがある）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as 履歴・ログ

        U->>SVC: 起動する
        SVC->>FS: 保持期間を過ぎた履歴とログを削除する
        Note over SVC: 以降は 正常シナリオ と同じ
        loop 常駐中、非機能要件の削除の間隔ごと
          SVC->>FS: 同じ条件で古い履歴とログを削除する
        end
      ```

      <!-- /map -->
    expected:
      - 2 日前の日付の履歴とログが消えている
      - 今日の日付の履歴とログが残っている
    test: test_normal_when_expired_history_and_logs
  - name: 異常シナリオ（文字起こしのエンジンを準備できない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: モデルの読み込みの失敗
        description: ローカルの Whisper のモデルに存在しない名前を設定し、文字起こしワーカーがモデルを読み込めずに error を返却する状態にする
    flow: |-
      <!-- map: {"title": "異常シナリオ（文字起こしのエンジンを準備できない）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送信する
        WK-->>SVC: モデルを読み込めない（error）
        SVC->>LOG: 起動に失敗した理由を書き込む
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを通知する
      ```

      <!-- /map -->
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに起動に失敗した理由が書き込まれている
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
      - 録音開始のホットキーを押しても録音が始まらない
    notes:
      同じ扱いになる失敗: 文字起こしワーカーが ready を返却せずに終わったときも同じ扱いになる。
    test: test_error_when_engine_unavailable
  - name: 異常シナリオ（API の待ち受けを始められない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: ポートの使用中
        description: API の待ち受けのポートを、ほかのプロセスが先に使用している
    flow: |-
      <!-- map: {"title": "異常シナリオ（API の待ち受けを始められない）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant API as API のサーバー
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        Note over SVC: エンジンの準備までは 正常シナリオ と同じ
        SVC->>API: 127.0.0.1 で待ち受けを始める
        API-->>SVC: 待ち受けを始められない
        SVC->>LOG: 待ち受けに失敗した理由を書き込む
        SVC->>TRAY: API を使用できないことを通知する
        SVC->>SVC: 録音開始のホットキーの受付を始める
      ```

      <!-- /map -->
    expected:
      - トレイで API を使用できないことが知らされている
      - ログに待ち受けに失敗した理由が書き込まれている
      - 録音開始のホットキーを押すと録音が始まる
    test: test_error_when_api_unavailable
  - name: 正常シナリオ（古い AI チャットの設定が残っている）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー・ブラウザを開く呼び出し。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。ブラウザを開く呼び出しは引き渡された URL を控え、Microsoft Edge を開かない
      - name: 古い設定
        description: '`settings.yaml` の `outputs` に `id: ai_chat` の項目と送信先（`targets[]`）を 2 つ書いておく（うち 1 つは出さない）'
    flow: |-
      <!-- map: {"title": "正常シナリオ（古い AI チャットの設定が残っている）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant ENV as settings.yaml
        participant TRAY as トレイ

        U->>SVC: 起動する
        SVC->>ENV: 設定を読み込む
        SVC->>SVC: ai_chat の送信先を、ブラウザ添付の種類のプリセットへ読み替える
        Note over SVC: 以降は 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```

      <!-- /map -->
    expected:
      - トレイのアイコンが待機中になっている（起動が中断されない）
      - 録音の画面に、出すとした送信先と同じタイトル・ホットキーのプリセットのボタンだけが出る
      - そのボタンで確定すると、送信先の URL を開いて貼り付け、Enter まで送信する
      - 起動しただけでは `settings.yaml` が書き換わっていない
    test: test_normal_when_old_ai_chat_settings_remain
  - name: 正常シナリオ（settings.toml だけが残っている）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 前のバージョンの設定
        description: 設定の配置先に `settings.yaml` が無く、`settings.toml` があり、録音開始のホットキー（`hotkeys.start`）を既定と違う組み合わせにしてある
    flow: |-
      <!-- map: {"title": "正常シナリオ（settings.toml だけが残っている）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TOML as settings.toml
        participant ENV as settings.yaml
        participant LOG as ログ
        participant TRAY as トレイ

        U->>SVC: 起動する
        SVC->>SVC: settings.yaml が無く、settings.toml がある
        SVC->>TOML: 設定を読み込む
        SVC->>ENV: 既定値と違う値を書き込んで作る
        SVC->>LOG: settings.toml から settings.yaml へ移したことを書き込む
        Note over SVC: 以降は 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` に `hotkeys.start` の組み合わせが書き込まれ、既定値と同じキーが書き込まれていない'
      - '`settings.toml` が変わらずに残っている'
      - 既定と違う組み合わせで録音が始まる
      - ログに、移した元と先のファイルのパスが書き込まれている
    notes:
      移す条件: '`settings.yaml` があるときは `settings.toml` を読み込まない。`settings.toml` を読み込めないときは、`settings.yaml` を作らずに 異常シナリオ（設定を読み込めない） と同じ扱いになる。'
    test: test_normal_when_only_settings_toml
  - name: 正常シナリオ（checkout の上書きがある）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 環境の値
        description: '`settings.yaml` で、録音開始のホットキー（`hotkeys.start`）を既定と違う組み合わせ A にしてある'
      - name: checkout の上書き
        description: リポジトリ直下の `settings.local.yaml` で、`hotkeys.start` を組み合わせ B にしてある
    flow: |-
      <!-- map: {"title": "正常シナリオ（checkout の上書きがある）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant DEF as config/defaults.yaml
        participant ENV as settings.yaml
        participant LOCAL as settings.local.yaml

        U->>SVC: 起動する
        SVC->>DEF: 既定値を読み込む
        SVC->>ENV: 環境の値を読み込み、既定値に重ねる
        SVC->>LOCAL: checkout の上書きを読み込み、さらに重ねる
        SVC->>SVC: 重ねた値を設定のモデルで確認する
        Note over SVC: 以降は 正常シナリオ と同じ
      ```

      <!-- /map -->
    expected:
      - 組み合わせ B で録音が始まり、組み合わせ A では始まらない
      - '`settings.yaml` と `settings.local.yaml` が書き換わっていない'
    notes:
      E2E を持たない理由: E2E は `--data-dir` の一時フォルダで起動するため、リポジトリ直下の `settings.local.yaml` を使用できない。重ねる順は単体テストと結合テストで確認する。
  - name: 異常シナリオ（設定を読めない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 読めない設定
        description: '`settings.yaml` を YAML として読み込めない中身にする'
    flow: |-
      <!-- map: {"title": "異常シナリオ（設定を読めない）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant ENV as settings.yaml
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>ENV: 設定を読み込む
        ENV-->>SVC: 読み込めない
        SVC->>LOG: 読み込めなかったファイルのパスと理由を書き込む
        SVC->>TRAY: 失敗のアイコンにし、設定を読み込めないことを通知する
      ```

      <!-- /map -->
    expected:
      - トレイで設定を読み込めないことが知らされている
      - ログに読み込めなかったファイルのパスと理由が書き込まれている
      - トレイのメニューの「録音を開始」と「設定…」が押せず、「設定フォルダを開く」と「再起動」が押せる
      - '`settings.yaml` が書き換わっていない'
    notes:
      同じ扱いになる失敗: '`config/defaults.yaml` を読み込めないとき、あるのに読み込めない `settings.local.yaml`・`settings.toml`（移すとき）と、重ねた値が設定のモデルの確かめに通らないときも同じ扱いになる。'
    test: test_error_when_settings_unreadable
  - name: 正常シナリオ（OpenAI API を使う設定）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV
      - name: 文字起こしのエンジン
        description: OpenAI API を使用する設定にし、設定の配置先の `secrets/openai_api_key` に API キーの文字列だけを書き込んだファイルを配置する
        notes: 環境変数 `OPENAI_API_KEY` は引き渡さない
    flow: |-
      <!-- map: {"title": "正常シナリオ（OpenAI API を使う設定）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant KEY as API キーのファイル
        participant TRAY as トレイ

        U->>SVC: 起動する
        Note over SVC: 準備中のアイコンを出すまでは 正常シナリオ と同じ
        SVC->>SVC: 環境変数 OPENAI_API_KEY が無い
        SVC->>KEY: API キーを読み込む
        KEY-->>SVC: API キー
        SVC->>SVC: OpenAI API のエンジンを作る（文字起こしワーカーは起動しない）
        Note over SVC: トークンを作るところからは 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```

      <!-- /map -->
    expected:
      - トレイのアイコンが待機中になっている
      - 録音開始のホットキーを押すと録音が始まる
      - 文字起こしワーカーの子プロセスが動いていない
      - ログにエンジンが OpenAI API であることが書き込まれ、API キーが書き込まれていない
    test: test_normal_when_openai
    notes:
      API キーの読み先: 環境変数 `OPENAI_API_KEY` があればそれを使用し、無ければ設定の配置先（Windows は `%APPDATA%\voice-paste\`、Linux は `~/.config/voice-paste/`）の `secrets/openai_api_key` を読み込む。ファイルの前後の空白と改行は除く。起動時はキーを読み込めるかだけを確かめ、OpenAI API へは送信しない。
      依存: faster-whisper・nvidia-* を入れていない仮想環境でも同じ流れで起動する。
  - name: 異常シナリオ（OpenAI の API キーが無い）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: '-'
      - name: API キーの欠落
        description: OpenAI API を使用する設定にし、環境変数 `OPENAI_API_KEY` も `secrets/openai_api_key` も配置しない
        notes: '-'
    flow: |-
      <!-- map: {"title": "異常シナリオ（OpenAI の API キーが無い）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: 起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>SVC: 環境変数にもファイルにも API キーが無い
        SVC->>LOG: 起動に失敗した理由（読み込んだ環境変数の名前とファイルのパス）を書き込む
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを通知する
      ```

      <!-- /map -->
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに、API キーを読み込む環境変数の名前とファイルのパスが書き込まれている
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
      - 録音開始のホットキーを押しても録音が始まらない
    test: test_error_when_openai_api_key_missing
    notes:
      ファイルが空: ファイルはあるが空白だけのときも同じ扱いになる。
  - name: 異常シナリオ（ローカルの Whisper の依存が入っていない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: faster-whisper のパッケージを見つけられないように差し替える
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使用する設定にする
        notes: '-'
    flow: |-
