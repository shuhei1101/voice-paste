        mock: なし（一時フォルダ）
        expected: settings_file の edge_phrases に一覧の全ての行が書かれる
      - name: test_migrate_settings_toml_when_special_strings
        case: 正常
        summary: YAML で特別な意味を持つ文字列を文字列のまま移す
        condition: 'edge_phrases の文言に `*`・yes・no・on・off・0123・`a: b`・null・`~`・日本語の文字列を書いた settings.toml'
        mock: なし（一時フォルダ）
        expected: settings_file を読み直した文言が全て文字列で、TOML の値と等しい
      - name: test_migrate_settings_toml_when_ai_chat_remains
