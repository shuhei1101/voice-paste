id: MOD-29
visibility: internal
title: 常駐アプリ / ブラウザの文字起こし / route.py
functions:
  - name: create_web_transcription_route
    title: 音声の受け付けの route
    kind: 関数
    container: features/web_transcription/route.py
    usecase: ブラウザから音声を送信する
    scope: public
    summary: '`POST /web/transcriptions`。UploadFile の audio と glossary_preset を accept_audio に引き渡し、202 と job_id を返却する'
    args:
      - name: audio
        type: UploadFile
        required: true
        passing: positional
        description: multipart の audio
      - name: deps
        type: WebApiDeps
        required: true
        passing: injected
        description: app.state.web_api（get_web_api_deps）
      - name: glossary_preset
        type: Annotated[str | None, Form()]
        required: false
        default: None
        passing: positional
        description: multipart の glossary_preset（文字の項目）
    returns:
      type: CreateWebTranscriptionResponse
      description: 202 の本文
    process: |-
      1. accept_audio に audio.file・glossary_preset・依存を引き渡す（例外は例外ハンドラが HTTP に変える。GlossaryPresetNotFoundError は 400）
      2. job_id を返却する
    status: planned
  - name: get_web_transcription_route
    title: 文字起こしの結果の route
    kind: 関数
    container: features/web_transcription/route.py
    usecase: ブラウザで結果を受け取る
    scope: public
    summary: '`GET /web/transcriptions/{job_id}`。キューからジョブを引いて状態を返却する'
    args:
      - name: job_id
        type: str
        required: true
        passing: positional
        description: ジョブの ID
      - name: deps
        type: WebApiDeps
        required: true
        passing: injected
        description: app.state.web_api（get_web_api_deps）
    returns:
      type: WebTranscriptionStatus
      description: 200 の本文
    process: |-
      1. queue.get でジョブを引く（無ければ WebJobNotFoundError を例外ハンドラが 404 にする）
      2. job_id・state・progress・text・error と、deps.reports_progress を返却する
    status: planned
  - name: get_web_api_deps
    title: ブラウザの API の依存の取得
    kind: 関数
    container: features/web_transcription/route.py
    usecase: 共通
    scope: public
    summary: app.state.web_api に配置された WebApiDeps を返却する（Depends）
    args:
      - name: request
        type: Request
        required: true
        passing: positional
        description: 要求
    returns:
      type: WebApiDeps
      description: 依存
    status: planned
  - name: get_web_glossary_presets_route
    title: 用語集のプリセットの一覧の route
    container: features/web_transcription/route.py
    usecase: 用語集のプリセットを選んで送信する
    summary: '`GET /web/glossary-presets`。list_glossary_presets で引いた名前の一覧と設定で選んでいるプリセットの名前を返却する'
    kind: 関数
    scope: public
    args:
      - name: deps
        type: WebApiDeps
        required: true
        passing: injected
        description: app.state.web_api（get_web_api_deps）
    returns:
      type: WebGlossaryPresetsResponse
      description: 200 の本文
    process: |-
      1. list_glossary_presets で今の設定の選択肢を引く
      2. presets・active を返却する（Host・Origin の守りは要求の守りのミドルウェアが `/web/` の下として持つ）
    status: planned
    introduced:
      pr: 180
