title: Haas の文字起こしのサーバー / サーバー / app.py
test_files:
  - tests/unit/haas_server/test_app.py
function_types:
  - name: TranscribeFn
    title: 音声の文字起こし
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    summary: 音声を起こす（haas_asr の transcribe・transcribe_longform）
    args:
      - name: samples
        type: numpy.ndarray
        description: 16 kHz モノラルの音声
      - name: vocabulary
        type: object | None
        description: haas_asr.Vocabulary か None
    returns:
      type: str
      description: 起こした文字
    status: planned
  - name: BuildVocabularyFn
    title: Vocabulary の組み立て
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    summary: 表記 → 読みの一覧の対応から Vocabulary を作る（haas_asr.Vocabulary）
    args:
      - name: words
        type: dict[str, list[str]]
        description: 表記 → 読みの一覧。読みが無い語は空の一覧
    returns:
      type: object
      description: Vocabulary
    status: planned
data_models:
  - name: HaasEngine
    title: Haas のモデルの関数の束
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    role: DTO
    summary: create_app に渡す、モデルの関数と名前
    properties:
      - name: model_name
        type: str
        description: モデルの名前
      - name: transcribe
        type: TranscribeFn
        description: 30 秒以下の音声を起こす関数
      - name: transcribe_longform
        type: TranscribeFn
        description: 30 秒を超える音声を静かな箇所で区切って起こす関数
      - name: build_vocabulary
        type: BuildVocabularyFn
        description: Vocabulary を作る関数
    status: planned
constants:
  - name: SHORT_AUDIO_LIMIT_SEC
    title: 一度に起こす音声の長さの上限
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    summary: これを超える音声は transcribe_longform で起こす
    value: '30.0'
    refs:
      - IF-12#
    status: planned
  - name: SAMPLE_RATE
    title: モデルのサンプリングレート
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    summary: 音声の長さを秒にするときに使う
    value: '16000'
    status: planned
functions:
  - name: create_app
    title: サーバーの app の組み立て
    kind: 関数
    container: haas_server/app.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 3 つの API と Host・Origin の守りを持つ FastAPI の app を作る
    args:
      - name: engine
        type: HaasEngine
        required: true
        passing: positional
        description: モデルの関数の束
      - name: port
        type: int
        required: true
        passing: keyword
        description: 待ち受けのポート（Host の確かめに使う）
      - name: request_shutdown
        type: Callable[[], None]
        required: true
        passing: keyword
        description: サーバーを止める関数（uvicorn.Server.should_exit を立てる）
    returns:
      type: fastapi.FastAPI
      description: app
    process: |-
      1. 全ての要求の前に、Host が `127.0.0.1:{port}` か `localhost:{port}` で、Origin が付いていないかを確かめる
         - 外れる場合、403 の problem+json を返す
           - `[WARNING]` 要求を断った（理由・Host・Origin）
      2. GET /health: ok=True と engine.model_name を返す
      3. POST /shutdown: 202 を返した後に request_shutdown を呼ぶ（uvicorn が処理中の要求を返し終えてから終わる）
      4. POST /transcriptions:
         1. vocabulary を読む（JSON の配列で、各要素の written が空でない）
            - 外れる場合、400 の problem+json を返す
              - `[WARNING]` 手がかりの形が合わない
         2. audio を decode_audio で復号する
            - AudioDecodeError の場合、400 の problem+json を返す
              - `[WARNING]` 音声を復号できない（理由）
         3. threading.Lock を取り、長さが SHORT_AUDIO_LIMIT_SEC 以下なら engine.transcribe、超えるなら engine.transcribe_longform で起こす（Vocabulary は語があるときだけ engine.build_vocabulary で作る）。FastAPI のスレッドプールで動かす
            - 例外の場合、500 の problem+json（detail に例外の文）を返す
              - `[ERROR]` 文字起こしに失敗した（スタックトレースつき）
         4. text を返す
            - `[INFO]` 起こした（音声の秒・かかった秒）
    unit_tests:
      - name: test_create_app_when_host_not_allowed
        case: 異常
        summary: Host が合わない要求を断る
        condition: 'Host: evil.example:47824 で GET /health'
        mock: なし（TestClient）
        expected: 403 の problem+json
    status: planned
refs:
  - IF-12#
  - IF-13#
  - IF-14#
