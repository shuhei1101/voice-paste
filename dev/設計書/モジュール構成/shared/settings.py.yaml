  - name: EdgePhraseSettings
    title: 文頭・文末から削除する文言の設定
    container: shared/settings.py
    usecase: 録音を文字に起こす
    role: 設定のモデル
    summary: 文頭・文末から削除する文言 1 行の文言と当てる位置
    description: |-
      `model_config = ConfigDict(extra="forbid", str_strip_whitespace=True)`。
      文言は前後の空白を除いて確かめる。`*` だけの文言は `PydanticCustomError`（type は EDGE_PHRASE_WILDCARD_ONLY_ERROR_TYPE）にし、失敗の場所を `edge_phrases[{n}].text` にする。空の文言はこのモデルでは断らず、Settings が一覧から除く。
    inherits: pydantic.BaseModel
    properties:
      - name: text
        type: str
        description: 消す文言（前後の空白を除く。`*` は任意の文字列）
      - name: position
        type: Literal["start", "end", "both"]
        default: '"end"'
        description: 当てる位置（文頭・文末・両方）
    methods:
      - name: _reject_wildcard_only
        title: 文言の確かめ
        summary: '`*` だけの文言を断る（`field_validator("text")` のクラスメソッド）'
        kind: メソッド
        scope: internal
        args:
          - name: text
            type: str
            required: true
            passing: positional
            description: 前後の空白を除いた文言
        returns:
          type: str
          description: そのままの文言
        unit_tests:
          - name: test_edge_phrase_settings
            case: 正常
            summary: 文言と位置を読む
            condition: text 「 ご視聴ありがとうございました 」・position 無し
            mock: なし
            expected: text が「ご視聴ありがとうございました」、position が end
          - name: test_edge_phrase_settings_when_wildcard_only
            case: 異常
            summary: '`*` だけの文言を断る'
            condition: Settings の edge_phrases の 2 件目の text が「 * 」
            mock: なし
            expected: ValidationError。失敗の type が EDGE_PHRASE_WILDCARD_ONLY_ERROR_TYPE、場所が ("edge_phrases", 1, "text")
    refs:
      - CFG-1#settings[edge_phrases[].text]
      - CFG-1#settings[edge_phrases[].position]
    status: implemented
  - name: GlossaryPresetSettings
    title: 用語集のプリセットの設定
