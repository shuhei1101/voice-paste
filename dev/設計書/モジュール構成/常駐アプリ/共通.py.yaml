  - name: find_hotkey_overlaps
    title: ホットキーの重なりの検出
    container: shared/settings.py
    usecase: 設定を変える
    summary: 受け付けるホットキーのうち、前に並んだものと重なるものを返す。Settings の確かめ（`model_validator(mode="after")`）が呼ぶ
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 確かめる設定
    returns:
      type: list[tuple[str, str]]
      description: （重なったキー, 先に並んだ同じホットキーのキー）の並び。キーは format_error_location と同じ書式（例 `presets[2].hotkey`）
    process: |-
      1. 受け付けるホットキーを（キー, 値）でこの順に並べる: `hotkeys.start`・`hotkeys.pause`・`hotkeys.cancel`、オンの出力先の `outputs[].hotkey`、有効なプリセットの `presets[].hotkey`（種類をまたいで 1 つの並び。空のホットキーは受け付けないので並べない）
      2. 値を小文字にして、先に並んだものと同じものを集める
         - `hotkeys.start` と「貼り付けて送信」の `hotkey` が同じ組は重なりにしない（録音中に押すとその出力先で確定する既定）
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
    notes:
      補足: Settings に `model_validator(mode="after")` を追加し、この関数が返した重なりごとに `PydanticCustomError` を集めた ValidationError を送出する（場所は重なったキー、理由は「{先のキー}と同じホットキー」）。設定画面は list_validation_failures で欄ごとのエラーにする
    unit_tests:
      - name: test_find_hotkey_overlaps
        case: 正常
        summary: 前に並んだホットキーと重なるキーを、重なった組で返す
        condition: 出力先の hotkey を <ctrl>+<alt>+d・v・c に固定し、presets に 2 件を置き、2 件目の hotkey を <ctrl>+<alt>+v（貼り付けのみと同じ）にした設定（model_construct で確かめを飛ばして作る）
        mock: なし
        expected: '[("presets[1].hotkey", "outputs[1].hotkey")]'
      - name: test_find_hotkey_overlaps_when_presets_of_different_kinds
        case: 正常
        summary: 種類をまたいだプリセットどうしの重なりを返す
        condition: presets が [browser（<ctrl>+<alt>+3）, endpoint（<ctrl>+<alt>+3）]
        mock: なし
        expected: '[("presets[1].hotkey", "presets[0].hotkey")]'
      - name: test_find_hotkey_overlaps_when_start_equals_paste_and_send
        case: 正常
        summary: 録音の開始と貼り付けて送信が同じキー（既定）は重なりにしない
        condition: SETTINGS_MODEL()（どちらも <ctrl>+<alt>+d）
        mock: なし
        expected: '[]'
      - name: test_find_hotkey_overlaps_when_disabled_output
        case: 正常
        summary: オフの出力先・無効のプリセットのホットキーは重なりにしない
        condition: parametrize で (1) コピーのみをオフにし、その hotkey を <ctrl>+<alt>+z（一時停止と同じ） (2) 無効のプリセットの hotkey を <ctrl>+<alt>+z
        mock: なし
        expected: どちらも []
      - name: test_find_hotkey_overlaps_when_empty_preset_hotkeys
        case: 正常
        summary: 空のホットキーのプリセットどうしは重なりにしない
        condition: presets に hotkey が空の 2 件
        mock: なし
        expected: '[]'
      - name: test_settings_when_hotkeys_overlap
        case: 異常
        summary: ホットキーが重なる設定は、重なったキーと先のキーを持つ ValidationError で断る
        condition: hotkeys.pause と hotkeys.cancel を同じ <ctrl>+<alt>+z にした dict を Settings.model_validate に渡す
        mock: なし
        expected: ValidationError。list_validation_failures のキーに hotkeys.cancel、理由に hotkeys.pause
        exception: ホットキーが重なる
  - name: migrate_ai_chat
    title: 古い AI チャットの設定の読み替え
    kind: 関数
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: settings.toml を素の dict にしたものから `id = "ai_chat"` の出力先を外し、送信先をブラウザ添付のプリセットへ読み替えた dict を返す。load_settings と save_settings が検証の前に呼ぶ
    args:
      - name: document
        type: dict[str, Any]
        required: true
        passing: positional
        description: settings.toml を素の dict にしたもの（書き換えない）
    returns:
      type: dict[str, Any]
      description: 読み替えた dict。ai_chat の項目が無ければ document と同じ中身
    process: |-
      1. outputs の中の `id = "ai_chat"` の項目を探す
         - 無い場合（outputs が無い・配列でないも含む）、document をそのまま返す（検証は Settings に任せる）
      2. その項目の targets（無ければ、前の既定の ChatGPT・Google AI・Claude の 3 件）を並びのまま、`{kind: "browser", title: name, url, hotkey, enabled: 項目の enabled かつ target の enabled, send_enter: true}` にして、既にある presets の後ろに追加する
      3. その項目に open_delay_sec があり、preset_options.browser.open_delay_sec が無ければ、その値を入れる
      4. outputs からその項目を外した新しい dict を返す
         - `[INFO]` 古い AI チャットの設定をプリセットへ読み替えた（件数）
    unit_tests:
      - name: test_migrate_ai_chat
        case: 正常
        summary: 送信先をブラウザ添付のプリセットにし、ai_chat を外す
        condition: outputs が [paste_and_send, ai_chat（open_delay_sec 2.0、targets に ChatGPT と Claude（enabled false））]
        mock: なし
        expected: outputs が [paste_and_send]、presets が ChatGPT（enabled true）・Claude（enabled false）の kind browser・send_enter true の 2 件、preset_options.browser.open_delay_sec が 2.0。元の dict は変わらない
      - name: test_migrate_ai_chat_when_output_disabled
        case: 正常
        summary: オフの AI チャットの送信先は無効のプリセットにする
        condition: ai_chat の enabled が false、targets の enabled がどれも true
        mock: なし
        expected: presets がどれも enabled false
      - name: test_migrate_ai_chat_when_targets_missing
        case: 正常
        summary: targets の無い ai_chat は前の既定の 3 件をプリセットにする
        condition: ai_chat が id だけを持つ
        mock: なし
        expected: presets が ChatGPT（<ctrl>+<alt>+1）・Google AI（<ctrl>+<alt>+2）・Claude（<ctrl>+<alt>+3）の 3 件
      - name: test_migrate_ai_chat_when_absent
        case: 正常
        summary: ai_chat が無ければ変えない
        condition: outputs が [paste_only] だけ、または outputs が無い
        mock: なし
        expected: document と同じ中身が返る
    status: implemented
  - name: build_settings_model
    title: 設定のモデルの組み立て
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: public
    summary: 出力先の設定のモデルを受け、outputs をその判別共用体と既定の一覧にした Settings の子のモデルを返す
    args:
      - name: output_models
        type: Sequence[type[OutputSettingsBase]]
        required: true
        passing: positional
        description: 出力先の設定のモデル（OUTPUTS の並び。この並びが既定の一覧の並びになる）
    returns:
      type: type[Settings]
      description: 組み立てた設定のモデル
    process: |-
      1. 各モデルの id の既定値を集める
         - 空か、重なる ID がある場合、ValueError を送出する（登録の誤り。起動の前に単体テストで止める）
      2. outputs の型を、モデルの数によらず `list[Annotated[Union[...], Field(discriminator="id")]]` にする（モデルが 1 つでも判別共用体にし、失敗の場所に添字の次の判別子の値を入れる。format_error_location がそれを外す）
      3. outputs の既定を、各モデルを引数なしで作った一覧（渡した並び）にする。説明・反映のマーカーは Settings の outputs のものを引き継ぐ
      4. Settings を継いだモデルを `pydantic.create_model` で作り、output_models に ID → モデルを入れて返す（確かめは Settings のものを引き継ぐ）
    exceptions:
      - name: ValueError
        condition: モデルが空か、ID が重なる
    unit_tests:
      - name: test_build_settings_model
        case: 正常
        summary: 渡したモデルで outputs を検証し、既定の一覧をその並びで持つ
        condition: '試しのモデル 2 つ（ID a・b。b だけ delay_sec: float = 1.0 を持つ）を渡し、返ったモデルで既定値を作り、outputs = [{id: b, hotkey: <ctrl>+<alt>+b, delay_sec: 2.0}] の dict を model_validate する'
        mock: なし
        expected: '既定値の outputs が [a のモデル, b のモデル] の順で、model_validate の outputs[0] が b のモデル（delay_sec 2.0）、model_dump(mode="json") の outputs[0] に delay_sec があり、output_models が {a: a のモデル, b: b のモデル}'
      - name: test_build_settings_model_when_unknown_output
        case: 異常
        summary: 渡していない出力先の ID を断る
        condition: '試しのモデル a・b で組み立て、outputs = [{id: c}] を model_validate する'
        mock: なし
        expected: ValidationError。list_validation_failures のキーが outputs[0] で始まる
      - name: test_build_settings_model_when_single_output
        case: 正常
        summary: 出力先が 1 つでも組み立てられる
        condition: '試しのモデル a だけを渡して組み立て、outputs = [{id: a, hotkey: 1}]（hotkey が文字列でない）を model_validate する'
        mock: なし
        expected: 既定値の outputs が [a のモデル]。model_validate は ValidationError で、list_validation_failures のキーが outputs[0].hotkey
      - name: test_build_settings_model_when_duplicate_id
        case: 異常
        summary: ID が重なる登録を断る
        condition: ID がどちらも a の試しのモデル 2 つを渡す
        mock: なし
        expected: ValueError
        exception: ID が重なる
    status: planned
