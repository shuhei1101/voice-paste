    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-15.yaml
    impact: new
    detail: トレイのメニューから音声ファイルを選び、文字起こしを始めるまで（選べない・読めないファイルと、録音から届けるまでの間の扱いを含む）を新設する
