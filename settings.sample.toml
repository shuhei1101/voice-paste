# voice-paste の設定ファイルの見本（既定値）。
# 設定のモデルの既定値と一致させてある。
# 「再起動」と書いた項目は、アプリを再起動してから効く。それ以外は設定画面で保存すると動いているアプリに効く。

# 補正に使う用語集の名前。キーが無いとき・一覧に無い名前のときは、1 つ目の用語集を使う
# active_glossary = "yogo"

# 今までの用語集の CSV の場所。glossaries が空のときだけ、この CSV を 1 つ目の用語集として使う。
# キーも無いときは、この設定ファイルと同じフォルダの yogo.csv を使う
# glossary_path = "C:\\Users\\name\\yogo.csv"

# 用語集の一覧（設定画面の「用語集」で編集する）。用語集ごとに名前と CSV の場所を書く。
# path は、この設定ファイルのフォルダからの相対パスか絶対パス。
# [[glossaries]]
# name = "yogo"
# path = "glossaries/glossary_1.csv"

# 表記のヒント（文字起こしの手がかり）のプリセットの一覧（設定画面の「表記のヒント」で編集する）。既定は空で、空の間はヒントを渡さない。
# 有効なプリセットの語を上から順に読点（、）でつないで渡す。つないだ長さは UTF-8 で 222 バイトまで。
# 語は空にできず、読点（、）・句点（。）・改行を含められない。
# [[hint_presets]]
# name = "開発"
# words = ["voice-paste", "Whisper"]
# enabled = true

# 起こした文字の文頭・文末から削除する文言の一覧（設定画面の「ハルシネーション」で編集する）。
# キーが無いときは、上から「チャンネル登録*」「ご視聴ありがとうございました」「ありがとうございました」（全て文末）。空の一覧にすると何も削除しない。
# 上の行から順に、前の行で削除した結果へ当てる。文言は完全な一致で、* は 0 文字以上の任意の文字列に一致する。
# position は start（文頭）・end（文末）・both（両方）。
# [[edge_phrases]]
# text = "ご視聴ありがとうございました"
# position = "end"

# === 文字起こし ===
[transcription]
# 使うエンジン（再起動）。local_whisper
engine = "local_whisper"

[transcription.local_whisper]
# faster-whisper のモデル（再起動）
model = "large-v3"
# 動かすデバイス（再起動）。cuda または cpu
device = "cuda"
# 計算の精度（再起動）。float16・int8・float32。cuda は float16、cpu は int8 が目安
compute_type = "float16"
# CPU のスレッド数（再起動）。0 は自動
cpu_threads = 0
# 並列のデコードの数（再起動）。1 以上
num_workers = 1
# ビームサーチの幅（再起動）。1 以上。大きいほど精度が上がり、遅くなる
beam_size = 10
# サンプリングの候補の数（再起動）。1 以上
best_of = 5
# 認識する言語（再起動）
language = "ja"
# 無音の区間を除くか（再起動）
vad_filter = true
# 音声とみなす確信度の閾値（再起動）。0〜1
vad_threshold = 0.5
# これより短い音を雑音として除く、ミリ秒（再起動）。0 以上
vad_min_speech_ms = 250
# これ以上の無音で区間を区切る、ミリ秒（再起動）。0 以上。起こした文字の改行の位置に効く
vad_min_silence_ms = 2000
# 前の区間の文字を次の区間の文脈に使うか（再起動）。false にすると幻覚を抑えられる
condition_on_previous_text = false
# サンプリングの温度（再起動）。0 以上。0.0 は決定的
temperature = 0.0
# 区間を無音とみなす確信度の閾値（再起動）。0〜1
no_speech_threshold = 0.6

# === 録音 ===
[recording]
# 録音中にシステム音量を下げるか
lower_volume = true
# 録音中の音量の、録音前の音量に対する割合。0〜100（50 は半分）
volume_percent = 50.0
# 音量を下げる・戻すときにかける秒数。0 以上
fade_sec = 0.5
# 録音の画面も文字起こし中の表示も表示せず、トレイとホットキーだけで操作するか
hide_window = false

# === ホットキー（pynput の GlobalHotKeys の書式） ===
[hotkeys]
# 録音開始
start = "<ctrl>+<alt>+d"
# 録音の一時停止・再開
pause = "<ctrl>+<alt>+z"
# 録音の取り消し
cancel = "<ctrl>+<alt>+q"

[keyboard]
# 貼り付け先へ送信する貼り付けのキー。ターミナル向けには <ctrl>+<shift>+v
paste_key = "<ctrl>+v"

# === 出力先（id は重ならない。enabled = false の出力先は確定の操作に出さず、ホットキーも登録しない） ===
[[outputs]]
# 貼り付けて送信
id = "paste_and_send"
enabled = true
# この出力先で確定するホットキー
hotkey = "<ctrl>+<alt>+d"
# 貼り付けてから Enter を送信するまで待つ秒数。0 以上
enter_delay_sec = 0.5
# Enter と一緒に押す修飾キー（"ctrl"・"alt"・"shift"）。空なら Enter だけを送信する
enter_modifiers = []

[[outputs]]
# 貼り付けのみ
id = "paste_only"
enabled = true
hotkey = "<ctrl>+<alt>+v"

[[outputs]]
# コピーのみ
id = "copy_only"
enabled = true
hotkey = "<ctrl>+<alt>+c"

# === カスタムプリセット（既定は無し） ===
# 録音の画面の見出し「カスタムプリセット」の下に、有効なプリセットのボタンが並ぶ。
# kind = "browser"（ブラウザ添付）と kind = "endpoint"（エンドポイントへ送信）の 2 種類。書く例:
#
# [[presets]]
# kind = "browser"
# title = "ChatGPT"
# url = "https://chatgpt.com"
# hotkey = "<ctrl>+<alt>+1"
# enabled = true
# send_enter = true
#
# [[presets]]
# kind = "endpoint"
# title = "エンドポイント"
# url = "http://127.0.0.1:9000/hook"
# hotkey = ""
# enabled = true
# authorization = "Bearer {トークン}"

# === プリセットの種類ごとのオプション ===
[preset_options.browser]
# 画面を開いてから貼り付けるまで待つ秒数。0 以上
open_delay_sec = 3.0

[preset_options.endpoint]
# 送信のタイムアウトの秒数。0.5〜10。この秒数で届かなければ、再送せずにトレイで通知する
timeout_sec = 1.5

# === 履歴 ===
[history]
# 録音と起こした文字を履歴に残すか（再起動）
enabled = true
# 履歴を保持する日数（再起動）。1 以上
retention_days = 1

# === ログ ===
[logging]
# ログのレベル（再起動）。DEBUG・INFO・WARNING・ERROR
level = "INFO"
# 日付ごとのログを保持する日数（再起動）。1 以上
retention_days = 7

# === 録音の画面と文字起こし中の表示 ===
[ui]
# 画面の明暗。system（Windows の設定に従う）・light・dark
theme = "system"
# 常に最前面に表示するか
topmost = true
# 表示する位置。center・top-left・top-right・bottom-left・bottom-right
position = "center"
# マウスカーソルのあるモニターに表示するか
follow_cursor = true
# 波形の振れの大きさ。0 より大きい。大きいほど小さい声でも大きく振れる
wave_gain = 4.0
# 録音の画面のボタンにホットキーを表示するか。false のときは名前だけを表示する（ホットキーでの操作はそのまま効く）
show_hotkeys = true
# 文字起こし中の表示のボタンにホットキーを表示するか。false のときは名前だけを表示する（ホットキーでの切り替えはそのまま効く）。書かなければ show_hotkeys と同じ値で動く
transcribing_show_hotkeys = true

# === API ===
[api]
# 127.0.0.1 で待ち受けるポート（再起動）。1024〜65535
port = 47823
# loopback のほかに、起こした文字の返送を許すホスト（再起動）
allowed_callback_hosts = []
# /web/ の下（外の端末のブラウザの画面）へ要求を送信してよい Origin（再起動）。ゲートウェイの公開のサブドメインを scheme://host[:port] の形で書く。例: ["https://voice-paste.example.com"]
allowed_web_origins = []

# === 連続録音（API で continuous を指定した録音）===
[api.continuous]
# 話し声の後にこの秒数以上無音が続いたところで区間を区切る（再起動）。0.5〜10
min_silence_sec = 2.0
# 完了が来ないまま開始からこの秒数が経ったところで打ち切る（再起動）。60〜86400
session_limit_sec = 14400
