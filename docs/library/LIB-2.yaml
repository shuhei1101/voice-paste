id: LIB-2
visibility: internal
title: "Microsoft Edge"
kind: "CLI"
version:
  current: 端末に入っているバージョン（バージョンを指定していない）
  checked_on: '2026-09-30'
catalogs:
  - name: コマンド
    version: 端末に入っているバージョン
    entries:
      - name: msedge --app={URL}
        kind: コマンド
        purpose: ブラウザ添付のプリセットの画面をアプリのウィンドウとして開く（`msedge` が PATH に無ければ Program Files の既定の場所を探し、無ければ既定のブラウザで URL を開く。Linux では `google-chrome`・`chromium`・`chromium-browser`・`microsoft-edge` の順に PATH から探して同じ `--app` で開き、無ければ `webbrowser`（xdg-open）で開く）
lead: Windows に入っている Web ブラウザ。`--app` でページをアプリのウィンドウとして開ける。
dependency_scope: 任意
adoption: 採用
used_in:
  - src/voice_paste/integrations/browser/opener.py
verification:
  state: 済
  date: '2026-10-24'
  detail: 'PR #171 の E2E の補助（`tests/support/browser.py`）で、headless・偽のマイク（SAPI で書き出した WAV）の Edge を起動し、DevTools Protocol で `http://localhost:{ポート}/web/` を開いて、録音から送信・起こした文字の表示まで動くことを確かめた（`test_send_audio_from_browser.py::test_normal_when_record_in_page` が pass）。`--app` で窓を開く使い方は、使っているデスクトップに窓が出るため動かしていない（単体テストで Mock にして確かめている）'
official_url: https://www.microsoft.com/edge
