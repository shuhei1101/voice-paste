verification:
  state: 済
  date: '2026-10-01'
  detail: pycaw 20251023 で、AudioUtilities.GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar で既定の再生デバイスのマスター音量を読み、同じ値を SetMasterVolumeLevelScalar で書いて読み直しても値が変わらないことを、メインのスレッドと別のスレッドの両方で動かした（音量は変えていない。下げ戻しの実機での確認は音量のアダプタの契約テストが担う）
