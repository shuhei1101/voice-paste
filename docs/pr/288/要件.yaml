use_cases:
  - kind: single
    scenario: docs/scenario/SC-8.yaml
    impact: changed
    detail: 取り消しの猶予の間に取り消すと画面だけを閉じて猶予が経ってから内部で録音を捨てる正常シナリオ、猶予の間に録音を始め直す正常シナリオ、猶予の間の確定・一時停止を受け付けない異常シナリオ、確定の後の終了の処理の間に録音を始めようとしたときに理由が示される異常シナリオを追加する。既存の「録音を取り消す」は猶予を 0 にした場合にする
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-12.yaml
    impact: run_only
    detail: シナリオの記述は変わらないが、録音の取り消しと開始の流れの修正が、声で入力した文字を貼り付ける流れを壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-6.yaml
    impact: run_only
    detail: シナリオの記述は変わらない（設定画面の欄は設定のモデルから組み立てる）が、録音のまとまりに取り消しの猶予の秒数の欄が加わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-1.yaml
    impact: changed
    detail: 利用者がホットキー・トレイの録音を取り消した後の猶予の間に、ほかのシステムが API で録音を始めると、取り消した録音をその場で捨てて新しい録音を始める正常シナリオを追加する
    depends_on:
      - docs/scenario/SC-8.yaml
docs:
  - page: docs/guide/録音して貼り付ける.md
    new: false
    change: 処理中のダイアログで通知される場面に、確定の後の終了の処理中を追加する。取り消しの行に、開始の直後の取り消しは画面だけを閉じ、猶予の秒数が経ってから録音を捨てることを追加する
    status: todo
  - page: docs/mock/pages/busy-dialog/index.md
    new: false
    change: この作業 PR の処理中のダイアログのモックの案の行を追加する
    status: todo
scope_out:
