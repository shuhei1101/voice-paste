name: test

on:
  workflow_dispatch:
    inputs:
      layer:
        description: テストを回す層
        type: choice
        required: true
        options:
          - unit
          - integration
      paths:
        description: 回すテストのパス（空白区切り。省くと層の全件）
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ inputs.layer }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON('{"unit":82,"integration":26}')[inputs.layer] }}
    defaults:
      run:
        shell: bash
    steps:
      - name: ブランチを取得する
        uses: actions/checkout@v7

      - name: uv を入れる
        uses: astral-sh/setup-uv@v10.3.3

      - name: Python の依存を入れる
        run: uv sync --frozen

      - name: テストを回す
        env:
          LAYER: ${{ inputs.layer }}
          PATHS: ${{ inputs.paths }}
        run: |
          case "$LAYER" in
            unit) limit=190 ;;
            integration) limit=110 ;;
          esac
          read -r -a targets <<< "$PATHS"
          if [ "${#targets[@]}" -eq 0 ]; then
            targets=("tests/$LAYER")
          fi
          invalid=()
          for target in "${targets[@]}"; do
            if { [ "$target" != "tests/$LAYER" ] && [[ "$target" != "tests/$LAYER/"* ]]; } || [[ "$target" == *..* ]]; then
              invalid+=("$target")
            fi
          done
          if [ "${#invalid[@]}" -gt 0 ]; then
            echo "tests/$LAYER の外のパスか .. を含むパスは回せません: ${invalid[*]}" > test.log
            exit 1
          fi
          uv run --frozen pytest "${targets[@]}" -v -p no:cacheprovider --timeout="$limit" > test.log 2>&1

      - name: ログを成果物に上げる
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore
