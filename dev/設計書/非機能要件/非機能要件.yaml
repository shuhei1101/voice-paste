  - name: 画面の録音のビットレート
    english_name: web_recording_bitrate
    category: コスト
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/issues/92
    value: '32'
    unit: kbps（MediaRecorder の audioBitsPerSecond に渡す値）
    rationale: 'Issue #92 の要望の値。実際のビットレートはブラウザが決め、PR #171 の PoC で Edge の AAC は約 100 kbps になった（2026-10-23）。どのブラウザでも、画面の録音の上限時間の録音が本文の上限に収まればよい'
    measurement: 実機の iPhone の Safari・iPad・Edge で 30 分録り、音声の大きさがブラウザの本文の上限未満であることを確かめる
    status: planned
