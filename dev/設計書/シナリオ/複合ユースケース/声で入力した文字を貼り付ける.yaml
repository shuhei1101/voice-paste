id: SC-12
title: "声で入力した文字を貼り付ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、ホットキーの入口から録音を始める
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 録音中の音量
        description: 録音中にシステム音量を下げる設定にする
      - name: 出力先
        description: 出力先のうち「貼り付けて送信」だけをオンにする
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|トレイが待機中<br>ホットキーを待つ| UC2([録音する:正常シナリオ])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:正常シナリオ])
        UC3 -->|用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ])
        UC4 --> DONE([貼り付けのキーと Enter を送信し<br>常駐サービスは次のホットキーを待つ])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ"
      ```
    expected:
      - 貼り付けのキーと Enter が送信されている（差し替えた貼り付けのキーに控えがある）
      - クリップボードに起こした文字が入り、書き出した文の言葉を含む
      - 履歴に録音と起こした文字がある
      - システム音量を録音前の値へ戻す操作が行われている
      - セッションが終わり、ホットキーの入口からもう一度録音を始められる
    test: test_normal
  - name: 正常シナリオ（録音を取り消す）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、ホットキーの入口から録音を始める
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: 録音中の音量
        description: 録音中にシステム音量を下げる設定にする
      - name: 取り消し
        description: 録音を確定せずに取り消す
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|トレイが待機中<br>ホットキーを待つ| UC2([録音する:正常シナリオ（録音を取り消す）])
        UC2 --> DONE([何も届けずに<br>常駐サービスは次のホットキーを待つ])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を取り消す"
      ```
    expected:
      - クリップボードが録音前のままで、貼り付けのキーが送信されていない
      - 履歴にこの録音が残っていない
      - システム音量を録音前の値へ戻す操作が行われている
      - セッションが終わり、ホットキーの入口からもう一度録音を始められる
    test: test_normal_when_cancel
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、ホットキーの入口から録音を始める
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 文字起こしの失敗
        description: 文字起こしのエンジンが失敗を返す状態にする
        notes: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|トレイが待機中<br>ホットキーを待つ| UC2([録音する:正常シナリオ])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:異常シナリオ（文字起こしに失敗）])
        UC3 --> DONE([失敗を通知して<br>常駐サービスは次のホットキーを待つ])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#異常シナリオ文字起こしに失敗"
      ```
    expected:
      - 文字起こしに失敗したことがユーザーに知らされている（差し替えた通知に控えがある）
      - 貼り付けのキーが送信されていない
      - 履歴にこの録音が残っている
      - セッションが終わり、ホットキーの入口からもう一度録音を始められる
    test: test_error_when_transcription_failed
  - name: 異常シナリオ（再起動したワーカーも異常終了する）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、ホットキーの入口から録音を始める
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: ワーカーの停止
        description: エンジンをローカルの Whisper にし、文字起こしの途中で文字起こしワーカーのプロセスを停止し、再起動したワーカーも停止する
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|トレイが待機中<br>ホットキーを待つ| UC2([録音する:正常シナリオ])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:異常シナリオ（再起動したワーカーも異常終了する）])
        UC3 --> DONE([失敗を通知してワーカーを再起動し<br>常駐サービスは次のホットキーを待つ])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#異常シナリオ再起動したワーカーも異常終了する"
      ```
    expected:
      - セッションの管理が動き続け、ホットキーの入口からもう一度録音を始められる
      - 文字起こしに失敗したことがユーザーに知らされている（差し替えた通知に控えがある）
      - 履歴にこの録音が残っている
      - 文字起こしワーカーが新しい子プロセスで動いている
    test: test_error_when_worker_dies_again
  - name: 異常シナリオ（文字起こしの結果が空）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、ホットキーの入口から録音を始める
        notes: 音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 録音の入力に無音の WAV を流して確定し、起こした文字が空になるようにする
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|トレイが待機中<br>ホットキーを待つ| UC2([録音する:正常シナリオ])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:異常シナリオ（文字起こしの結果が空）])
        UC3 --> DONE([何も届けずに<br>常駐サービスは次のホットキーを待つ])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#異常シナリオ文字起こしの結果が空"
      ```
    expected:
      - クリップボードが録音前のままで、貼り付けのキーが送信されていない
      - 履歴にこの録音が残っている
      - セッションが終わり、ホットキーの入口からもう一度録音を始められる
    test: test_error_when_transcription_empty
  - name: 異常シナリオ（API の処理中にホットキーを押す）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える。常駐アプリを起動する（ショートカットからの起動・トレイ・ホットキーの受付）は通さず、pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は下げた値と戻した値を控え、貼り付けのキーは送信せずに控え、通知は控える
      - name: API の録音
        description: API で録音を開始し、完了する前にホットキーの入口から録音を始める
    flow: |-
      ```mermaid
      flowchart TD
        U0([ユーザー]) -->|ショートカットから起動| UC1([常駐アプリを起動する:正常シナリオ])
        UC1 -->|API の録音を処理中に<br>ホットキーを押す| UC2([録音する:異常シナリオ（処理中に開始が来る）])
        UC2 --> DONE([処理中であることを通知し<br>API の録音を続ける])

        click UC1 "../単一ユースケース/常駐アプリを起動する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#異常シナリオ処理中に開始が来る"
      ```
    expected:
      - 処理中のため録音を始められないことがユーザーに知らされている（差し替えた通知に処理中の控えがある）
      - 2 つ目の録音が始まっていない
      - API の録音が録音中のまま続いている
    test: test_error_when_api_session_busy
lead: 常駐サービスがホットキーで録音を始め、話した内容を文字に起こしてアクティブなアプリへ届けるまでの複合ユースケース。
issue: 14
primary_actor: 音声入力を使うユーザー
stakeholders:
  - name: ユーザー
    interest: 話した内容が打ち直しなしで貼り付け先に入り、失敗しても話した内容が消えないこと
trigger: ユーザーが録音開始のホットキーを押すか、トレイのメニューから録音を始める
preconditions:
  - Windows の端末で、ショートカットから常駐サービスを起動している
  - マイクがつながっている
  - 設定の文字起こしのエンジンに要るものがそろっている（ローカルの Whisper のモデルと GPU）
success_guarantee: |-
  起こした文字が、設定でオンにした出力先で貼り付け先へ入る。
  録音を確定した時点で、録音が履歴に残る（履歴を残す設定のとき）。
minimal_guarantee: |-
  文字起こしに失敗しても、文字起こしワーカーが異常終了しても、常駐サービスは止まらず次のホットキーを受け付ける。
  確定した録音は、文字起こしの成否によらず履歴に残る（履歴を残す設定のとき）。
  録音中に下げたシステム音量は、録音を確定しても取り消しても録音前の値へ戻る。
test_file: tests/e2e/複合ユースケース/test_paste_voice_text.py
