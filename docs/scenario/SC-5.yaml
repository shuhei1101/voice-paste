        notes: 録音の入力は無音の WAV。WSL でサーバーを起動するコマンドは、127.0.0.1 でテスト用のエンドポイントを立てるコマンドに差し替え、起動された回数と引数を記録する
      - name: 文字起こしのエンジン
        description: Haas を使用する設定にする
        notes: '`transcription.engine: haas`'
      - name: 起動の調整の値
        description: Haas のモデル・計算の精度・装置を既定と違う値にする
        notes: '例: `transcription.haas.dtype: float32`・`device: cpu`'
    flow: |-
      <!-- map: {"title": "正常シナリオ（Haas を使う設定）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant WSL as WSL（wsl.exe）
