Haas のサーバーの起動の待ち時間の測定:
  説明: Windows の再起動の直後に、エンジンを Haas にした常駐アプリを起動し、ログの「Haas のサーバーを起動した（{秒} 秒」を読んで、非機能要件『Haasのサーバーの起動の待ち時間』の仮の値 60 秒と比べる。60 秒に近ければ値を見直す Issue を起票する（エージェントは WSL の中で動くため、WSL が止まっている状態を作れない）
  タグ: [ユーザーの操作, 測定]
  実行者: ユーザー
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 実行者が原因を確かめて依頼元へ返す
  確認方法: 常駐アプリのログの「Haas のサーバーを起動した」の行の秒が 60 秒を十分に下回っている
  状態: "-"
