id: MOD-48
visibility: internal
title: 常駐アプリ / 共通 / types.py
data_models:
  - name: Recording
    title: 録音
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 止めた録音の音と形式。録音・録音セッション・履歴が使う
    properties:
      - name: samples
        type: numpy.ndarray
        description: モノラルの 16 bit の音
      - name: sample_rate
        type: int
        description: サンプルレート（Hz）
      - name: duration_sec
        type: float
        description: 録音の長さ（一時停止の間を除く）
    status: implemented
  - name: TranscriptionOutcome
    title: 文字起こしの結果
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 出力先へ渡す結果。録音セッションと出力先が使う
    properties:
      - name: session_id
        type: str
        description: 録音セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated", "completed"]
        description: 結果の種類。completed は連続録音を完了し、全ての区間を届け終えたときだけ
      - name: text
        type: str
        description: 用語集で補正した文字。空・失敗・打ち切り・完了は空文字
      - name: error
        type: str | None
        description: 失敗の理由
      - name: segment_number
        type: int | None
        default: None
        description: 連続録音の区間の通し番号（1 始まり）。連続録音の transcribed・failed だけが持つ
      - name: segment_count
        type: int | None
        default: None
        description: 連続録音で区切った区間の数。連続録音の終わり（completed・truncated、区切りに失敗して止めたときの failed）だけが持つ
    status: implemented
  - name: Segment
    title: 区間
    container: shared/types.py
    usecase: 録音する
    role: DTO
    summary: 連続録音で区切った 1 区間の音。録音が作り、録音セッションが受ける（feature の間を渡るため shared に置く）
    properties:
      - name: recording
        type: Recording
        description: 区間の音（16 kHz・モノラル・int16）
      - name: reason
        type: Literal["silence", "max_length", "flush"]
        description: '区切った理由。silence: 話し声の後の無音、max_length: 区間の最大の長さ、flush: 録音を止めたときの残り'
    status: planned
    introduced:
      pr: 78
  - name: GlossaryEntry
    title: 用語集の行
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 誤変換と正しい表記の組と、補正に使うか。補正と設定画面の間を渡る
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。今の features/correction/types.py から移し（設定画面は features を import しないため）、enabled を追加する。features/correction/types.py は消す。'
    properties:
      - name: wrong
        type: str
        description: 誤変換（CSV の列 `誤変換`）
      - name: right
        type: str
        description: 正しい表記（CSV の列 `正しい表記`）
      - name: enabled
        type: bool
        default: 'True'
        description: 補正に使うか（CSV の列 `使う`。`0` がオフ）
    refs:
      - ER-2#tables[%APPDATA%\voice-paste\glossaries\glossary_{n}.csv]
    status: implemented
  - name: AudioProbe
    title: 音声の形式
    container: shared/types.py
    usecase: ブラウザから音声を送信する
    role: DTO
    summary: 受けた音声を PyAV で開いて読んだ容れ物の形式・秒数・大きさ。外部連携が作り、ブラウザの文字起こしが受ける（feature と integration の間を渡るため shared に置く）
    properties:
      - name: container
        type: str
        description: 容れ物の形式の名前（`webm`・`ogg`・`mp4`・`mp3`・`wav` など）
      - name: suffix
        type: str
        description: 一時のファイルと履歴に付ける拡張子（`.webm` など。container から決める）
      - name: duration_sec
        type: float | None
        description: 音声の秒数。容れ物が持たないとき（Cues の無い webm）は音声のパケットから求め、それでも求まらなければ None（ログでは秒数を省く）
      - name: size_bytes
        type: int
        description: 音声の大きさ
    status: planned
    introduced:
      pr: 171
enums:
  - name: Entry
    title: 入口
    container: shared/types.py
    usecase: 共通
    summary: 録音セッションを始めた入口。録音セッションと出力先が使う
    values:
      - value: hotkey
        title: ホットキー
        description: 録音開始のホットキー
      - value: tray
        title: トレイ
        description: トレイのメニュー
      - value: api
        title: API
        description: POST /sessions
    status: implemented
  - name: EnterModifier
    title: Enter と一緒に押す修飾キー
    container: shared/types.py
    usecase: 起こした文字を届ける
    summary: 貼り付けて送信が Enter と一緒に押す修飾キー（`Literal["ctrl", "alt", "shift"]`）。出力先の設定と integrations/keyboard が使う（integrations は features を import できないため shared に置く）
    values:
      - value: ctrl
        title: Ctrl
        description: Ctrl キー
      - value: alt
        title: Alt
        description: Alt キー
      - value: shift
        title: Shift
        description: Shift キー
    refs:
      - CFG-1#settings[outputs[].enter_modifiers]
    status: planned
function_types:
  - name: ProgressFn
    title: 文字起こしの進みの知らせ先
    container: shared/types.py
    usecase: 共通
    summary: 文字起こしの区間の終わりの時刻と録音の長さ（秒）を受け取る。features/transcription と integrations/whisper が使う（integrations は features を import できないため shared に置く）
    args:
      - name: end
        type: float
        description: 区間の終わりの時刻（秒）
      - name: duration
        type: float
        description: 録音の長さ（秒）
    returns:
      type: None
      description: なし
    status: implemented
  - name: OnSegmentFn
    title: 区間の受け取り先
    container: shared/types.py
    usecase: 録音する
    summary: 区切った区間を区切った順に受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、録音セッションが渡す（feature の間を渡るため shared に置く）
    args:
      - name: segment
        type: Segment
        description: 区切った区間
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: OnContinuousFailedFn
    title: 連続録音の失敗の知らせ先
    container: shared/types.py
    usecase: 録音する
    summary: 区切りに失敗して連続録音を止めたことを、理由を添えて受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、録音セッションが渡す
    args:
      - name: reason
        type: str
        description: 失敗の理由
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: SendEnterFn
    title: Enter の送信方法
    container: shared/types.py
    usecase: 起こした文字を届ける
    summary: 渡した修飾キーを押したまま Enter を送信する（`Protocol`。修飾キーを省いて呼べるため、`Callable[[], None]` を受ける側にも渡せる）。integrations/keyboard が満たし、出力先が受ける
    args:
      - name: modifiers
        type: Sequence[EnterModifier]
        description: 一緒に押す修飾キー。既定は空（Enter だけ）
    returns:
      type: None
      description: なし
    implementations:
      - target: send_enter
        notes: pynput で送信する（外部連携。Windows と Xorg のセッション）
      - target: UInputKeyboard.send_enter
        notes: python-evdev の UInput の仮想キーボードで送信する（外部連携。Wayland のセッション）
    status: planned
