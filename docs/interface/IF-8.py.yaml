id: IF-8
visibility: internal
title: "録音を停止する"
entry:
  kind: endpoint
  value: POST /sessions/{session_id}/stop
flows:
  - name: 正常系
    summary: 録音中の録音セッションを停止する
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 録音中の録音セッション
        description: 録音を開始する で始めた録音セッションが録音中
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop
        participant MIC as マイク

        C->>IF: トークン・session_id
        IF->>MIC: 録音を停止する
        IF-->>C: 200
      ```

      <!-- /map -->
    expected:
      - 200 が返る
      - 録音セッションが停止中（完了待ち）になっている
      - システム音量が録音前の値に戻っている
      - 画面の消灯の抑止が解除されている
      - 停止した後に入った音が録音に貯まっていない
    test: test_normal
  - name: 正常系（既に停止している）
    summary: 停止した録音セッションへの停止は何も変えず 200 を返却する
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 停止中の録音セッション
        description: 一度停止を呼んだ録音セッション
    flow: |-
      <!-- map: {"title": "正常系（既に停止している）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop

        C->>IF: トークン・session_id
        IF-->>C: 200
      ```

      <!-- /map -->
    expected:
      - 200 が返る
      - 録音セッションが停止中のままである
    test: test_normal_when_already_stopped
  - name: 異常系（トークンが合わない・401）
    summary: トークンが合わなければ停止しない
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 録音中の録音セッション
        description: 録音を開始する で始めた録音セッションが録音中
      - name: トークン
        description: 今回の起動のものと違うトークン
    flow: |-
      <!-- map: {"title": "異常系（トークンが合わない・401）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop
        participant LOG as ログ

        C->>IF: 合わないトークン
        IF->>LOG: 断った理由と要求元（Host・Origin）を書き込む（トークンは書き込まない）
        IF-->>C: 401
      ```

      <!-- /map -->
    expected:
      - 401 が返る
      - 録音セッションが録音中のままである
      - ログに断った理由と要求元が書き込まれ、トークンの値は書き込まれていない
    test: test_error_when_token_mismatch
  - name: 異常系（ブラウザからの要求・403）
    summary: Origin の付いた要求と、Host が待ち受けのホストでない要求を断る
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 録音中の録音セッション
        description: 録音を開始する で始めた録音セッションが録音中
      - name: 要求のヘッダー
        description: 正しいトークンに Origin を付けるか、Host をほかのホスト名にする
    flow: |-
      <!-- map: {"title": "異常系（ブラウザからの要求・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop
        participant LOG as ログ

        C->>IF: Origin ありか、ほかの Host
        IF->>LOG: 断った理由と要求元（Host・Origin）を書き込む（トークンは書き込まない）
        IF-->>C: 403
      ```

      <!-- /map -->
    expected:
      - 403 が返る
      - 録音セッションが録音中のままである
      - ログに断った理由と要求元が書き込まれ、トークンの値は書き込まれていない
    test: test_error_when_browser_request
  - name: 異常系（知らない録音セッション・404）
    summary: 録音中でも停止中でもない録音セッションは断る
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 録音セッションの ID
        description: 開始で受け取っていない ID か、完了した録音セッションの ID
    flow: |-
      <!-- map: {"title": "異常系（知らない録音セッション・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop

        C->>IF: トークン・知らない session_id
        IF-->>C: 404
      ```

      <!-- /map -->
    expected:
      - 404 が返る
      - 処理中のほかの録音セッションがあれば、そのまま続いている
    test: test_error_when_session_unknown
  - name: 異常系（連続録音の録音セッション・409）
    summary: 連続録音の録音セッションは停止せずに断る
    setup:
      - name: Mock
        description: マイク・システム音量・画面の消灯の抑止・トレイを差し替える
      - name: 連続録音の録音セッション
        description: 録音を開始する を continuous=true で呼んだ録音セッションが録音中
    flow: |-
      <!-- map: {"title": "異常系（連続録音の録音セッション・409）"} -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/stop

        C->>IF: トークン・連続録音の session_id
        IF-->>C: 409
      ```

      <!-- /map -->
    expected:
      - 409 が返り、detail に連続録音は完了で終えることが書き込まれている
      - 録音セッションが録音中のままで、区切りを続けている
    test: test_error_when_continuous
lead: API から始めた録音を停止し、完了を待つ状態にする。停止した後の音は貯めない。連続録音の録音セッションは停止せずに 409 で断る。
identifier: stop_session
permissions: 今回の起動のトークン
idempotent: true
side_effects: マイクの録音を停止し、システム音量を録音前の値へ戻して、画面の消灯の抑止を解除する。録音はまだ確定せず、履歴にも残さない。
exclusivity: 録音セッションは同時に 1 つだけ。停止した録音セッションも、完了するか 上限で打ち切る（非機能要件の録音セッションの上限時間。開始からの経過時間で、停止中も数える）で終わるまでは処理中としてほかの開始を断る。
request:
  - name: Authorization
    type: str
    required: true
    location: header
    description: 今回の起動のトークン
    format: '`Bearer {トークン}`'
    status: implemented
  - name: session_id
    type: str
    required: true
    location: path
    description: 開始で受け取った録音セッションの ID
    format: uuid
    status: implemented
response_notes: |-
  > [!NOTE]
  > 停止した録音セッションへもう一度停止を呼んでも 200 を返却し、状態は変わらない。
status_codes:
  - code: '200'
    condition: 録音を停止した（既に停止していたときも）
  - code: '401'
    condition: トークンが無いか、今回の起動のものと合わない
  - code: '403'
    condition: Origin が付いているか、Host が 127.0.0.1 でも localhost でもない
  - code: '404'
    condition: その録音セッションが録音中でも停止中でもない（知らない ID・完了済み・上限で打ち切り済み）
  - code: '409'
    condition: その録音セッションが連続録音（continuous=true で始めた）
    notes: 連続録音は停止せずに区切り続け、完了で終える。停止したまま完了を待つ状態を持たない
error_format: 録音を開始する と同じ RFC 9457 の `application/problem+json`。
constraints:
  - item: 待ち受け
    constraint: 127.0.0.1 だけ
  - item: 認可
    constraint: 起動ごとに作るトークンの一致。Host・Origin の確認方法は 録音を開始する と同じ
  - item: タイムアウト
    constraint: 制限なし
    notes: マイクを停止するだけで待ちが無い
test_file: tests/integration/test_stop_session.py
