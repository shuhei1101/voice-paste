title: "tomlkit"
kind: "ライブラリ"
version:
  current: 0.15.2
  latest: 0.15.1
  checked_on: '2026-10-01'
  source: pyproject.toml と uv.lock の版
  pinning: マイナー版の中で固定（~=0.15.1。0.x はマイナー版で互換の無い変更が入る）
catalogs:
  - name: API
    version: 0.15.1
    entries:
      - name: parse
        kind: 関数
        purpose: settings.toml をコメントを保った文書として読む
      - name: dumps
        kind: 関数
        purpose: 値を書き換えた文書を文字列に戻す
      - name: document
        kind: 関数
        purpose: 設定ファイルが無いときの空の文書を作る
      - name: table
        kind: 関数
        purpose: まとまりの表を作る
      - name: aot
        kind: 関数
        purpose: 出力先の一覧（表の配列）を作る
      - name: TOMLKitError
        kind: 例外
        purpose: 書式の壊れた settings.toml を読んだときに送出される（SettingsError に変える）
      - name: Container.body
        kind: 属性
        purpose: 配列の表の最後の要素（`Table.value`）の末尾にある、キーを持たないコメントと空行（キーが `None` の `Comment`・`Whitespace`）を取り出し、入れ替えた後の表の末尾へ付け直す
        description: 配列の表の後ろに書いたコメントは、parse で最後の要素の中（`body` の末尾の `(None, Comment)`・`(None, Whitespace)`）として読まれる。`body` は `(キー, 項目)` のリストで、末尾へ `(None, 項目)` を足すと dumps でその位置に書かれる
      - name: Trivia.indent
        kind: 属性
        purpose: 表・配列の表の要素の見出しの前に書かれる文字列。配列の表を入れ替えるとき、最初の要素の分を引き継ぎ、0 件になるときは次の表の頭へコメントを付け直す
        description: '`Table.trivia.indent` の頭へコメントの行を追加すると、dumps でその表の見出しの直前に書かれる。文書の `body` の途中へ足すのと違い、キーから位置を引く対応表をずらさない。super table（見出しを持たない表）の indent は書かれないため、中の最初の表の indent を使う'
lead: コメントと書式を保ったまま TOML を読み書きするライブラリ。
purl: pkg:pypi/tomlkit
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/shared/settings.py
upstream: python-poetry/tomlkit
verification:
  state: 済
  date: '2026-10-01'
  detail: WSL（Linux・Python 3.12）で、コメント付きの TOML を parse して値を書き換え、dumps で行頭・行末のコメントが残ることと、表の配列（aot）を丸ごと入れ替えられることを確かめた。Windows（Python 3.14.3の一時の venv、tomlkit 0.15.1）で、設定の書き戻しを単体テストで動かし、コメントを保った値の置き換えと、`unwrap()` で素の dict に戻しての検証を確かめた
license: MIT（商用利用可）
official_url: https://github.com/python-poetry/tomlkit
docs_url: https://tomlkit.readthedocs.io/
