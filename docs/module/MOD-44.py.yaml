id: MOD-44
visibility: internal
title: 常駐アプリ / ホットキーと画面 / style.py
test_files:
  - tests/unit/voice_paste/ui/test_style.py
functions:
  - name: build_stylesheet
    title: スタイルシートの組み立て
    container: ui/style.py
    usecase: 共通
    summary: tokens.toml（デザイン方針の色・書体・余白）を QSS に埋め、アプリ全体のスタイルシートを返す。部品ごとに色・書体を直書きしない。枠なしの窓（録音の画面・文字起こし中の表示）の外側の枠 `QFrame[role="window"]` と `QMenu` は、面を surface、縁を frame の 1px の線で描き、ほかの線は border のままにする。チェックボックス・ラジオボタンはマーカーと名前の組に透明の 1px の枠を持たせ、フォーカスで枠を accent_fg、使えないとき名前を text_muted にする。マーカーと名前の間は `shape.indicator_gap`。選択欄の開くマーカーは、区画（`::drop-down`）に枠を持たせず、`::down-arrow` に write_arrow_image が書いた V 字の画像を当てる（`url()` には `/` 区切りのパス（`Path.as_posix()`）を `"` で囲んで入れる。`\` 区切りでは描かれない）。チェックボックス・ラジオボタンのマーカー（`::indicator`）の規則は持たず IndicatorStyle が描く
    kind: 関数
    scope: public
    args:
      - name: dark
        type: bool
        required: true
        passing: positional
        description: 暗い組の色を使うか（resolve_dark で ui.theme と OS の明暗から決めた値）
      - name: image_dir
        type: Path
        required: true
        passing: keyword
        description: 選択欄の開くマーカーの画像を書くフォルダ（write_arrow_image へ渡す）
    returns:
      type: str
      description: QApplication.setStyleSheet へ渡す QSS
    unit_tests:
      - name: test_build_stylesheet
        case: 正常
        summary: 明暗ごとのトークンを埋める
        condition: dark=True と False
        mock: なし
        expected: それぞれ tokens.toml の dark・light の背景色が入り、`{` と `}` の数が合う
      - name: test_build_stylesheet_when_window_frame
        case: 正常
        summary: 枠なしの窓とメニューの縁を frame で描く
        condition: dark=False
        mock: なし
        expected: '`QFrame[role="window"]` と `QMenu` の規則に tokens.toml の light の frame の色が入り、`QFrame[role="surface"]` の規則には border の色が入る。置き換えていない `@` の場所が残らない'
      - name: test_build_stylesheet_when_check_indicator
        case: 正常
        summary: チェックボックス・ラジオボタンのフォーカスの枠と選択欄の開くマーカーの区画の規則を持ち、マーカーの規則を持たない
        condition: dark=False、image_dir=tmp_path の下の空白を含むフォルダ
        mock: なし
        expected: '`QCheckBox:focus`・`QRadioButton:focus` の規則に light の accent_fg の色が入り、`QComboBox::drop-down` の規則があり、`QComboBox::down-arrow` の `url("...")` が image_dir に書いた light の画像の `as_posix()` を指し、`\` を含まない。`::indicator` の規則が無い'
    status: implemented
  - name: resolve_dark
    title: 明暗の決定
    container: ui/style.py
    usecase: 共通
    summary: ui.theme と OS の明暗から、暗い組の色を使うかを決める
    kind: 関数
    scope: public
    args:
      - name: theme
        type: Literal["system", "light", "dark"]
        required: true
        passing: positional
        description: ui.theme
      - name: system_dark
        type: bool
        required: true
        passing: positional
        description: OS が暗いテーマか（is_dark_theme）
    returns:
      type: bool
      description: '`light` は False、`dark` は True、`system` は system_dark'
    unit_tests:
      - name: test_resolve_dark_when_light
        case: 正常
        summary: light は OS によらず明るい組
        condition: theme=light、system_dark=True
        mock: なし
        expected: 'False'
      - name: test_resolve_dark_when_dark
        case: 正常
        summary: dark は OS によらず暗い組
        condition: theme=dark、system_dark=False
        mock: なし
        expected: 'True'
      - name: test_resolve_dark_when_system
        case: 正常
        summary: system は OS の明暗に従う
        condition: theme=system、system_dark=True と False
        mock: なし
        expected: それぞれ True と False
    refs:
      - CFG-1#settings[ui.theme]
    status: implemented
  - name: apply_theme
    title: 明暗の適用
    container: ui/style.py
    usecase: 共通
    summary: ui.theme で Qt の明暗を揃え、決めた明暗のスタイルシートをアプリ全体に当て、開いている窓を描き直す
    description: |-
      今の明暗はモジュールの `_current_dark` に控え、theme_color が読む（書くのはこの関数だけ）。当てた IndicatorStyle はモジュールの `_indicator_style` に控える（書くのはこの関数だけ）。メインスレッドから呼ぶ。
      スタイルシートで塗らない部品（設定画面のスクロールバーなど）は style がパレットで描くため、Qt の明暗（`QStyleHints.setColorScheme`。Qt 6.8 から）も揃える。setColorScheme・unsetColorScheme で colorSchemeChanged が出て main からもう一度呼ばれるが、2 回目は同じ値を入れ直すだけでシグナルは出ない。
    kind: 関数
    scope: public
    side_effects: QApplication の明暗（styleHints の colorScheme）とスタイルシートを替え、`_current_dark` を書き換える
    args:
      - name: app
        type: QApplication
        required: true
        passing: positional
        description: 当てる先
      - name: theme
        type: Literal["system", "light", "dark"]
        required: true
        passing: positional
        description: ui.theme
      - name: image_dir
        type: Path
        required: true
        passing: keyword
        description: 選択欄の開くマーカーの画像を書くフォルダ（AppPaths.ui_image_dir）
    returns:
      type: None
      description: なし
    process: |-
      1. Qt の明暗を揃える。`light`・`dark` は app.styleHints().setColorScheme(Qt.ColorScheme.Light / Dark)、`system` は app.styleHints().unsetColorScheme() で上書きを外す（外した後に 2 で OS の明暗を読む）
      2. resolve_dark(theme, is_dark_theme()) で暗い組を使うかを決め、`_current_dark` に控える
      3. モジュールの `_indicator_style` が None のときだけ、app.style() を包んだ IndicatorStyle を作って `_indicator_style` に控え、app.setStyle で当てる（スタイルシートを当てると app.style() は Qt の内部のスタイルに差し替わるため、app.style() では当てたかを確かめない）。続けて app.setStyleSheet(build_stylesheet(決めた明暗, image_dir=引数の image_dir)) を当てる
      4. 開いている窓（QApplication.topLevelWidgets）を update で描き直す（theme_color で描く状態のマーカー・波形・回るマーカーを新しい組の色にする）
         - `[INFO]` 画面の明暗を当てた（theme・暗い組か）
    unit_tests:
      - name: test_apply_theme_when_dark
        case: 正常
        summary: dark を当てると OS が明るくても暗い組になる
        condition: theme=dark。QT_QPA_PLATFORM=offscreen
        mock: is_dark_theme（False）
        expected: QApplication.styleSheet() に tokens.toml の dark の bg が入り、theme_color("surface") が dark の surface の色を返す
      - name: test_apply_theme_when_system
        case: 正常
        summary: system は OS の明暗に従う
        condition: theme=system。QT_QPA_PLATFORM=offscreen
        mock: is_dark_theme（True）
        expected: QApplication.styleSheet() に dark の bg が入り、theme_color("surface") が dark の surface の色を返す
      - name: test_apply_theme_when_switched
        case: 正常
        summary: 当て直すと開いている窓の色も変わる
        condition: theme=dark を当てて QWidget を 1 つ出した後、theme=light を当てる。QT_QPA_PLATFORM=offscreen
        mock: is_dark_theme（False）・QWidget.update
        expected: QApplication.styleSheet() に light の bg が入り、theme_color("surface") が light の surface を返し、出した QWidget.update が呼ばれる
      - name: test_apply_theme_when_color_scheme
        case: 正常
        summary: light・dark は Qt の明暗を上書きし、system は上書きを外してから OS の明暗を読む
        condition: theme=light・dark・system をそれぞれ当てる。QT_QPA_PLATFORM=offscreen
        mock: app.styleHints()（setColorScheme・unsetColorScheme）・is_dark_theme（False）
        expected: light は setColorScheme(Qt.ColorScheme.Light)、dark は setColorScheme(Qt.ColorScheme.Dark) が 1 回呼ばれ、unsetColorScheme は呼ばれない。system は unsetColorScheme が is_dark_theme より先に 1 回呼ばれ、setColorScheme は呼ばれない
      - name: test_apply_theme_when_indicator_style
        case: 正常
        summary: IndicatorStyle を 1 回だけ当てる
        condition: image_dir=tmp_path。theme=light を当てた後、theme=dark を当てる。QT_QPA_PLATFORM=offscreen
        mock: is_dark_theme（False）
        expected: 1 回目の後に `_indicator_style` が IndicatorStyle のインスタンスになり、2 回目の後も同じインスタンスのまま（app.setStyle は 1 回だけ呼ばれる）。fixture は終わりに `_indicator_style` を None に戻し、アプリのスタイルを元に戻す
    refs:
      - CFG-1#settings[ui.theme]
    status: implemented
  - name: theme_color
    title: 今の明暗の色
    container: ui/style.py
    usecase: 共通
    summary: apply_theme で当てた明暗の組の色のトークンを、描画に使う色で返す
    description: 録音の画面の状態のマーカー・波形・閉じるボタンと、文字起こし中の表示の回るマーカーが描くたびに呼ぶ。apply_theme が控えた `_current_dark` の組を返す。apply_theme をまだ呼んでいなければ OS の明暗（is_dark_theme）の組を使う
    kind: 関数
    scope: public
    args:
      - name: name
        type: str
        required: true
        passing: positional
        description: tokens.toml の `[color.*]` のキー
    returns:
      type: QColor
      description: 今の明暗の組の色
    unit_tests:
      - name: test_theme_color_when_not_applied
        case: 正常
        summary: apply_theme の前は OS の明暗の組
        condition: name=busy。`_current_dark` が未設定
        mock: is_dark_theme（True）
        expected: tokens.toml の dark の busy の色
      - name: test_theme_color_when_applied
        case: 正常
        summary: apply_theme の後は当てた明暗の組
        condition: name=busy。apply_theme(app, "light") の後。QT_QPA_PLATFORM=offscreen
        mock: is_dark_theme（True）
        expected: tokens.toml の light の busy の色
    status: implemented
  - name: is_dark_theme
    title: OS の明暗
    container: ui/style.py
    usecase: 共通
    summary: OS が暗いテーマかを返す（`QGuiApplication.styleHints().colorScheme()` が Dark か）
    kind: 関数
    scope: public
    returns:
      type: bool
      description: OS が暗いテーマなら True
    status: implemented
  - name: write_arrow_image
    title: 開くマーカーの画像の書き出し
    container: ui/style.py
    usecase: 共通
    summary: 選択欄の開くマーカー（text_muted の線の V 字）を明暗の組の色で SVG にして image_dir に書き、そのパスを返す。ファイル名は中身のハッシュから作り、同じ名前のファイルがあれば書き直さない
    kind: 関数
    scope: public
    side_effects: image_dir を作り、SVG を書く
    args:
      - name: dark
        type: bool
        required: true
        passing: positional
        description: 暗い組の色を使うか
      - name: image_dir
        type: Path
        required: true
        passing: keyword
        description: 書くフォルダ（無ければ作る）
    returns:
      type: Path
      description: 書いた SVG のパス
    unit_tests:
      - name: test_write_arrow_image
        case: 正常
        summary: 明暗ごとの色で V 字の SVG を書く
        condition: dark=True と False、image_dir=tmp_path の下のまだ無いフォルダ
        mock: なし
        expected: フォルダが作られ、明暗で別のファイルに tokens.toml のそれぞれの text_muted の色を持つ SVG が書かれる
    status: implemented
    introduced:
      pr: 159
