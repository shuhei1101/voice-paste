summary: 採用済みの外部ライブラリ / 外部ツールのリファレンス
items:
  - page: faster-whisper.yaml
    summary: ローカルの Whisper で音声を文字に起こす
  - page: sounddevice.yaml
    summary: マイクの入力を開いて録音する
  - page: scipy.yaml
    summary: 録音を WAV に読み書きする
  - page: numpy.yaml
    summary: 録音した音を配列で貯め、音量を求める
  - page: pyperclip.yaml
    summary: 起こした文字をクリップボードへ書く
  - page: pynput.yaml
    summary: ホットキーを受け付け、貼り付けのキーを仮想的に送信する
  - page: pycaw.yaml
    summary: Windows のシステム音量を読み書きする
  - page: comtypes.yaml
    summary: 音量を操作するスレッドで COM を初期化する
  - page: nvidia-cublas-cu12.yaml
    summary: GPU での文字起こしに使う cuBLAS の DLL
  - page: nvidia-cudnn-cu12.yaml
    summary: GPU での文字起こしに使う cuDNN の DLL
  - page: nvidia-cuda-nvrtc-cu12.yaml
    summary: GPU での文字起こしに使う NVRTC の DLL
  - page: Microsoft_Edge.yaml
    summary: ブラウザ添付のプリセットの画面をアプリのウィンドウとして開く
  - page: fastapi.yaml
    summary: 常駐サービスの API のルートと入出力の検証を組み立てる
  - page: uvicorn.yaml
    summary: API を 127.0.0.1 で待ち受ける
  - page: httpx.yaml
    summary: 起こした文字を呼び出し元のエンドポイントへ返す
  - page: pydantic.yaml
    summary: 設定と API の入出力を検証する
  - page: pyside6-essentials.yaml
    summary: 画面とトレイを出し、ほかのスレッドからメインスレッドへ操作を渡す
  - page: tomlkit.yaml
    summary: 設定をコメントを保ったまま TOML で読み書きする
  - page: platformdirs.yaml
    summary: 設定・履歴・ログの置き場所を Windows の慣習で引く
  - page: import-linter.yaml
    summary: 新しい構成の import の向きを検査する
  - page: av.yaml
    summary: faster-whisper が録音を読むために使う、FFmpeg の Python バインディング
  - page: pywin32.yaml
    summary: テストが Windows のウィンドウ・マウス・キーを操作する
  - page: onnxruntime.yaml
    summary: 連続録音の話し声を Silero VAD の ONNX で判定する
  - page: python-multipart.yaml
    summary: ブラウザから送信された multipart の音声を FastAPI の UploadFile で受け取る
  - page: python-xlib.yaml
    summary: Linux でアクティブなウィンドウの WM_CLASS を Xorg から読む
  - page: evdev.yaml
    summary: Linux の Wayland のセッションで、仮想キーボードから貼り付けのキーと Enter を送信する
  - page: Focused_Window_D-Bus.yaml
    summary: Linux の Wayland のセッションで、フォーカスしているウィンドウの wm_class を GNOME Shell の拡張から読む
  - page: Open_JTalk.yaml
    summary: Linux の E2E で、録音の入力にする文を WAV に書き出す
