title: "上限で打ち切る"
entry:
  kind: trigger
  value: API から始めたセッションが、完了が来ないまま上限時間（開始からの経過時間。非機能要件の API のセッションの上限時間、連続録音は設定の連続録音のセッションの上限時間）に達したとき
flows:
  - name: 正常系
    summary: 録音中のまま上限に達したセッションを打ち切る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・返送を差し替える。時計を差し替えて経過時間を進める。履歴は一時フォルダに書く
      - name: 録音中のセッション
        description: 録音を開始する だけを呼んだセッション
    flow: |-
      ```mermaid
      sequenceDiagram
        participant T as 時計
        participant IF as 上限で打ち切る
        participant MIC as マイク
        participant HIST as 履歴
        participant RET as 呼び出し元へ返す
        participant LOG as ログ

        T->>IF: 開始から上限時間が経った
        IF->>MIC: 録音を止める
        IF->>HIST: そこまでの録音を保存する
        IF->>RET: session_id・result=truncated
        IF->>LOG: 打ち切ったことと session_id を書く
      ```
    expected:
      - マイクの録音が止まり、システム音量が録音前の値に戻っている
      - 履歴に打ち切った録音がある
      - 呼び出し元へ返す に result=truncated が渡っている
      - ログに打ち切ったことと session_id が書かれている
      - 文字起こしが始まっておらず、待機中に戻っている
    test: test_normal
  - name: 正常系（停止中に上限に達する）
    summary: 停止したまま完了が来ないセッションも、開始からの経過時間で打ち切る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・返送を差し替える。時計を差し替えて経過時間を進める。履歴は一時フォルダに書く
      - name: 停止中のセッション
        description: 録音を開始する と 録音を停止する を呼んだセッション
    flow: |-
      ```mermaid
      sequenceDiagram
        participant T as 時計
        participant IF as 上限で打ち切る
        participant HIST as 履歴
        participant RET as 呼び出し元へ返す
        participant LOG as ログ

        T->>IF: 開始から上限時間が経った
        IF->>HIST: 止めた録音を保存する
        IF->>RET: session_id・result=truncated
        IF->>LOG: 打ち切ったことと session_id を書く
      ```
    expected:
      - 履歴に止めた録音がある
      - 呼び出し元へ返す に result=truncated が渡っている
      - ログに打ち切ったことと session_id が書かれている
      - 待機中に戻り、続く開始が 409 にならない
    test: test_normal_when_stopped
  - name: 正常系（連続録音が上限に達する）
    summary: 連続録音の上限時間に達したら録音を止め、残りの話し声を最後の区間として届けた後に打ち切ったことを知らせる
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジン・話し声の判定・返送を差し替える。時計を差し替えて経過時間を進める。履歴は一時フォルダに書く
      - name: 連続録音のセッション
        description: 録音を開始する を continuous=true で呼び、区間を 1 つ区切った後、話し声が続いている間に上限時間が経つ
        notes: 上限時間は設定の api.continuous.session_limit_sec
    flow: |-
      ```mermaid
      sequenceDiagram
        participant T as 時計
        participant IF as 上限で打ち切る
        participant MIC as マイク
        participant HIST as 履歴
        participant ENG as 文字起こしのエンジン
        participant RET as 呼び出し元へ返す
        participant LOG as ログ

        T->>IF: 開始から連続録音の上限時間が経った
        IF->>MIC: 録音を止める
        IF->>HIST: 区間に切り出していない話し声を最後の区間として保存する
        IF->>ENG: 最後の区間を区切った順の待ちに積む
        IF->>LOG: 打ち切ったことと session_id を書く
        ENG-->>RET: 通し番号 2 の区間の文字
        IF->>RET: session_id・result=truncated・segment_count=2（全ての区間の後）
      ```
    expected:
      - マイクの録音が止まり、システム音量が録音前の値に戻っている
      - 履歴に通し番号 1 と 2 の区間の録音がある
      - 呼び出し元へ返す に、segment=2 の区間の後で result=truncated・segment_count=2 が渡っている
      - ログに打ち切ったことと session_id が書かれている
      - 終わりを渡した後、待機中に戻り、続く開始が 409 にならない
    test: test_normal_when_continuous
lead: 完了が来ないまま上限時間に達したセッションを打ち切り、録音を履歴に残して返送先へ知らせ、待機中に戻す。連続録音では、残りの話し声を最後の区間として届けた後に知らせる。
identifier: truncate_session
idempotent: true
side_effects: 録音中なら録音を止めて音量を戻す。そこまでの録音を履歴に保存し（履歴を残す設定のとき）、文字起こしはしない。呼び出し元へ返す へ `truncated` を渡し、打ち切ったことをログに書く。連続録音では、区間に切り出していない話し声が残っていれば最後の区間として履歴に保存して文字に起こし、全ての区間を返した後に `truncated` と区間の数を渡す。
exclusivity: 同じセッションへの完了と同時に起きたときは、先に受け付けた方だけを通す（後の完了は 404、後の打ち切りは何もしない）。
exceptions:
  - name: なし（正常終了）
    condition: 録音中か停止中のセッション（連続録音は録音中のセッション）を打ち切った
constraints:
  - item: 上限時間
    constraint: 非機能要件の API のセッションの上限時間。開始からの経過時間で数え、停止中も数える
    notes: 経過時間は録音の長さ以上のため、この上限で録音の大きさも抑えられる
  - item: 対象
    constraint: API から始めたセッションだけ。ホットキー・トレイから始めた録音は対象外
  - item: 連続録音の上限時間
    constraint: 設定の連続録音のセッションの上限時間（api.continuous.session_limit_sec）。開始からの経過時間で数える
    decided_by: dev/設計書/非機能要件/非機能要件#requirements[連続録音のセッションの上限時間]
    notes: 連続録音は区間ごとに録音を手放すため、上限は録音の大きさではなく、呼び出し元が落ちたときにマイクを閉じるために持つ
test_file: tests/integration/test_truncate_session.py
