title: "ブラウザから音声を送る"
scenarios:
  - name: 正常シナリオ（画面で録る）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは受けたパスを控える関数に差し替える
        notes: 偽のマイクには SAPI で書き出した WAV を流す
      - name: 許す Origin
        description: 画面を開いたオリジンを許す Origin の一覧に入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー
        participant SVC as 常駐サービス

        U->>PG: 録音を始める
        PG->>PG: MediaRecorder の形式を選んで録り、残り時間を出す
        U->>PG: 録音を止める
        PG->>DB: 録った音声を保存日時つきで残す（前の 1 件を置き換える）
        PG->>API: 音声を送る（multipart の audio）
        API->>API: Origin・大きさ・形式を確かめる
        API->>SVC: 一時のファイルに書いてジョブを積む
        API-->>PG: 202（job_id）
        PG->>PG: 結果の一覧に待ちの件を出す
      ```
    expected:
      - 送信が `202` で返り、応答に `job_id` がある
      - 端末（IndexedDB）に録った音声が 1 件だけ、保存日時つきで残っている
      - '`GET /web/transcriptions/{job_id}` がそのジョブ（`queued` か `running`）を返す'
      - 結果の一覧の先頭に待ちの件が出ている
      - 録った音声で 録音を文字に起こす へ進む
    test: test_normal_when_record_in_page
  - name: 正常シナリオ（ファイルを選ぶ）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは受けたパスを控える関数に差し替える
      - name: 音声ファイル
        description: SAPI で書き出した文を MP3 にしたファイルを選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー
        participant SVC as 常駐サービス

        U->>PG: 音声ファイルを選んで送る
        PG->>API: 音声を送る（multipart の audio）
        API->>API: Origin・大きさ・形式を確かめる
        API->>SVC: 一時のファイルに書いてジョブを積む
        API-->>PG: 202（job_id）
        PG->>PG: 結果の一覧に待ちの件を出す
      ```
    expected:
      - 送信が `202` で返り、応答に `job_id` がある
      - '`GET /web/transcriptions/{job_id}` がそのジョブ（`queued` か `running`）を返す'
      - 端末（IndexedDB）に残した音声は置き換わっていない
      - 選んだ音声で 録音を文字に起こす へ進む
    test: test_normal_when_select_file
    notes:
      端末に残すもの: 端末に残すのは画面で録った音声だけで、選んだファイルは端末に元があるため残さない。
  - name: 正常シナリオ（録音時間の上限に達する）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く。画面の時計を進められるようにする
        notes: 録音の上限時間は非機能要件の決定値（30 分）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー

        U->>PG: 録音を始める
        PG->>PG: 残り時間を出して録る
        PG->>PG: 上限時間に達して録音を止める
        PG->>DB: 録った音声を残す
        PG->>API: 音声を送る
        API-->>PG: 202（job_id）
      ```
    expected:
      - 上限時間で録音が止まり、そこまでの音声が端末に残って送られている
      - 録音が上限で止まったことが画面に出ている
    test: test_normal_when_recording_limit_reached
  - name: 異常シナリオ（送信に失敗する）
    setup:
      - name: Mock
        description: Windows の Edge を偽のマイクで起動し、画面を開く
      - name: 届かない送信
        description: 録音を止める前に常駐アプリの API の待ち受けを止め、送信が届かないようにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー

        U->>PG: 録音を止める
        PG->>DB: 録った音声を残す
        PG-xAPI: 音声を送る（届かない）
        PG->>PG: 送信に失敗したことを出す
        U->>PG: 送り直す（待ち受けを戻した後）
        PG->>DB: 残した音声を読む
        PG->>API: 音声を送る
        API-->>PG: 202（job_id）
      ```
    expected:
      - 送信に失敗したことが画面に出て、送り直しボタンとダウンロードボタンを押せる
      - 端末（IndexedDB）に録った音声が残っている
      - 送り直すと `202` で受け付けられる
      - ダウンロードボタンで、残した音声を端末へ保存できる
    test: test_error_when_send_failed
  - name: 異常シナリオ（読めない形式）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動する
      - name: 壊れたファイル
        description: 拡張子を `.mp3` にした、音声でない中身のファイルを選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        U->>PG: ファイルを選んで送る
        PG->>API: 音声を送る
        API->>API: 形式を確かめる（読めない）
        API-->>PG: 415（problem+json）
        PG->>PG: 読めない形式であることを出す
      ```
    expected:
      - 送信が `415` の problem+json で返っている
      - 画面に読めない形式であることが出て、結果の一覧に件が増えていない
      - 応答に `job_id` が無く、一時のファイルも書かれていない
    test: test_error_when_unreadable_format
  - name: 異常シナリオ（大きすぎる）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動する
      - name: 大きすぎるファイル
        description: 非機能要件の本文の上限（100MB 未満）を超える音声ファイルを選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        U->>PG: ファイルを選んで送る
        PG->>API: 音声を送る
        API->>API: 大きさを確かめる（上限を超える）
        API-->>PG: 413（problem+json）
        PG->>PG: 大きすぎることを出す
      ```
    expected:
      - 送信が `413` の problem+json で返っている
      - 画面に大きすぎることが出て、結果の一覧に件が増えていない
      - 応答に `job_id` が無く、一時のファイルも書かれていない
    test: test_error_when_too_large
  - name: 異常シナリオ（許可されていない Origin）
    setup:
      - name: Mock
        description: 常駐アプリは pytest のプロセスの中で起動し、テストから HTTP で送る
      - name: 許可リスト
        description: 許す Origin の一覧に、送信の Origin を入れない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as 許可されていないオリジンのページ
        participant API as API のサーバー

        C->>API: 音声を送る（許可されていない Origin）
        API->>API: Origin を確かめる（一覧に無い）
        API-->>C: 403（problem+json）
      ```
    expected:
      - 送信が `403` の problem+json で返っている
      - 応答に `job_id` が無く、一時のファイルも履歴も書かれていない
    test: test_error_when_origin_not_allowed
lead: 外の端末のブラウザの画面で録るか音声ファイルを選び、端末に残してから常駐アプリへ送って、受け付けた `job_id` を受け取る。
issue: 92
primary_actor: ユーザー（外の端末のブラウザ）
trigger: ユーザーが画面で録音を止めるか、音声ファイルを選んで送る
preconditions:
  - 常駐サービスが起動しており、ブラウザの音声のキューを立てている
  - 画面（`GET /web/`）を、設定の許す Origin の一覧にあるオリジンから開いている
