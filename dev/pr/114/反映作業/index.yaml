普段使いの環境の作り直し:
  説明: 普段使いのクローン（master）で、Windows の uv（WSL からは `uv.exe`）の `uv sync --frozen` で `.venv/` に環境を作り、起動のバッチファイルから起動し直す（前の常駐アプリには起動のバッチファイルが終了を頼む）。今の `venv/` は消さずに残し、動かなければ作った `.venv/` を `.venv.failed/` へ移して残し、`.venv` を残した `venv/` へのジャンクションにして起動し直す形で切り戻す（次の起動からも `venv/` で立つ。実行を流し直す前にジャンクションを外す）
  タグ: [環境の作り直し, 再起動]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: 普段使いの環境の作り直し/疎通確認.sh
  実行: 普段使いの環境の作り直し/実行.sh
  確認: 普段使いの環境の作り直し/確認.sh
  切り戻し: 普段使いの環境の作り直し/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら残した環境へ切り戻して依頼元へ返す
  確認方法: 普段使いのクローンで Windows の uv（WSL からは `uv.exe`）の `uv sync --frozen --check` が差分なしで終わり、`%LOCALAPPDATA%\voice-paste\log\launcher.log` の更新時刻が `.venv/pyvenv.cfg` より後で、起動した Python が `.venv\Scripts\pythonw.exe`、起動の終了コードが 0 になっている
  状態: "-"
