summary: 単一ユースケースのシナリオ
items:
  - page: 常駐アプリを起動する.yaml
    summary: voice-paste.bat から起動し、文字起こしのエンジンを準備してホットキーを待つ
  - page: 録音する.yaml
    summary: ホットキーで録音を始め、録音の画面で届け方を選んで確定するか取り消す
  - page: 録音を文字に起こす.yaml
    summary: 確定した録音を設定のエンジンで文字に起こし、用語集で補正する
  - page: 起こした文字を届ける.yaml
    summary: 起こした文字を履歴に残し、選んだ届け方で貼り付け先へ届ける
  - page: 設定を変える.yaml
    summary: 設定画面で設定を変えて .env に保存する
  - page: トレイから操作する.yaml
    summary: トレイのメニューからフォルダを開く・再起動する・終了する
