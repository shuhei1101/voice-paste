# yaml-language-server: $schema=../schemas/files.schema.yaml
files:
  - path: e2e/workflow/test_test_yml.py
    description: "workflow test.yml のフローを本物の GitHub Actions で起動して確かめる E2E テストを受け持ち、テストを回す workflow を変えるときに参照する。"
    tags:
      - topic:testing
      - topic:ci
      - tool:github-actions
    related:
      - to: .github/workflows/test.yml
        type: tests
  - path: external/voice_paste/integrations/keyboard/test_sender.py
    description: "クリップボードへの書き込みと、貼り付けのキー・Enter の送信を検証する外部の疎通テストを受け持ち、キーの送信やクリップボードの扱いを変えるときに参照する。"
    tags:
      - topic:testing
      - topic:貼り付け
      - topic:クリップボード
      - topic:キーボード
      - tool:pyperclip
      - tool:pynput
    related:
      - to: src/voice_paste/integrations/keyboard/sender.py
        type: tests
  - path: external/voice_paste/integrations/openai/test_transcriber.py
    description: "録音を OpenAI API の文字起こしへ送信し、一時的な失敗を再送する処理を検証する外部の疎通テストを受け持ち、OpenAI での文字起こしを変えるときに参照する。"
    tags:
      - topic:testing
      - tool:openai
      - topic:文字起こし
      - topic:リトライ
      - tool:httpx
    related:
      - to: src/voice_paste/integrations/openai/transcriber.py
        type: tests
  - path: external/voice_paste/integrations/volume/test_adapter.py
    description: "pycaw でのシステムの音量の下げ・戻しとフェードを検証する外部の疎通テストを受け持ち、録音中の音量の扱いを変えるときに参照する。"
    tags:
      - topic:testing
      - topic:音量
      - topic:windows
      - tool:pycaw
    related:
      - to: src/voice_paste/integrations/volume/adapter.py
        type: tests
  - path: unit/haas_server/test_app.py
    description: "文字起こし・準備の確認・停止の API と Host・Origin の守り、調整の値の確認を持つ FastAPI の app を検証する単体テストを受け持ち、Haas のサーバーの API を変えるときに参照する。"
    tags:
      - topic:testing
      - topic:api
      - topic:サーバー
      - tool:fastapi
    related:
      - to: haas_server/src/haas_server/app.py
        type: tests
