title: "pyside6-essentials"
kind: "フレームワーク"
version:
  current: 6.11.2
  latest: 6.11.2
  checked_on: '2026-10-01'
  source: 'pyproject.toml'
  pinning: '`pyside6-essentials~=6.11.2`（パッチの版だけ上げる。PoC で動かした 6.11.2 から、イベントループとスレッドの受け渡しの振る舞いが変わりうるマイナーの版を上げない）'
catalogs:
  - name: API
    version: 6.11.2
    entries:
      - name: QtWidgets.QApplication
        kind: クラス
        purpose: メインスレッドで画面のイベントループを回す
      - name: QtWidgets.QSystemTrayIcon
        kind: クラス
        purpose: トレイのアイコン・メニュー・通知を出す
      - name: QtCore.QObject / Signal
        kind: クラス
        purpose: ほかのスレッド（API・ホットキー・ワーカーの監視）から画面の操作をメインスレッドへ渡す
      - name: QtWidgets.QMessageBox
        kind: クラス
        purpose: 処理中に開始が来た・起動に失敗したなどのダイアログを出す
      - name: QtCore.QTimer
        kind: クラス
        purpose: 波形・経過時間の描き直しと、Python のシグナルのハンドラを動かす空の定期のタイマー
      - name: QtWidgets.QWidget
        kind: クラス
        purpose: 録音の画面・文字起こし中の表示・設定画面の窓（`WA_ShowWithoutActivating` でフォーカスを取らずに出す）
      - name: QtGui.QGuiApplication.screenAt
        kind: 関数
        purpose: カーソルのあるモニターを引く
      - name: QtTest.QTest
        kind: クラス
        purpose: 画面の結合テストでボタンを押し、キーを送る（pytest-qt は使わない）
      - name: QtGui.QWindow.startSystemMove
        kind: 関数
        purpose: 録音の画面を見出しの行のドラッグで動かす（枠なしの窓を `QWidget.windowHandle()` から動かす）
lead: Qt 6 の Python バインディング（Qt for Python）のうち、基本のモジュールだけを持つパッケージ。
purl: pkg:pypi/pyside6-essentials
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/ui/
verification:
  state: 済
  date: '2026-10-02'
  detail: 'Windows の実機（拡大率 150% のモニター 1 枚）で 6.11.2 を動かした PoC（#39）で、ホットキー・API のスレッドから emit した Signal がメインスレッドのスロットで受け取られること（100/100）、画面が固まらないこと（発火の間隔の最大 123 ms）、トレイのアイコンとメニューが出ること、`screenAt(QCursor.pos())` の作業領域に窓が出ること、`WindowStaysOnTopHint` の窓が「常に手前に表示」でない窓より上に残ること、200 ms の空のタイマーがあれば Ctrl+Break で 0.3 秒で終わることを確かめた（結果は PR #37 の計画書の PoC 結果）。複数のモニター・拡大率の違うモニターでの表示位置は測れていない（実機の E2E で確かめる）'
