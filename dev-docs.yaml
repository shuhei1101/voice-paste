      main_tags: tags[main].name
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/glossary.schema.yaml
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths: ["docs/index.yaml", "docs/*/index.yaml"]
    schema:
      source: knowledge
      path: schemas/design/index.schema.yaml
      ref: design-schemas/v8.3.0
    metadata:
      description: summary
  - id: files_repo
    title: リポジトリの直下の設定・スクリプトと、CI・設定の雛形・リソース
    paths: ["files.yml"]
    exclude: [.git, uv.lock, package-lock.json]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
  - id: files_docs
    title: docs の目次・画面の設定と直下のページ
    paths: ["docs/files.yml"]
    exclude: ["docs/pr/**", "docs/_theme/assets/vendor/**", "docs/_theme/search.json"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
    metadata:
      visibility: visibility
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v9.2.0
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: files_mock
    title: モック
    paths: ["docs/mock/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_src
    title: 常駐アプリのコード
    paths: ["src/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_haas_server
    title: Haas の文字起こしのサーバーのコード
    paths: ["haas_server/src/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
  - id: files_tests
    title: テスト
    paths: ["tests/files.yml"]
    schema:
      source: knowledge
      path: schemas/knowledge-files.schema.yaml
      ref: design-schemas/v8.3.0
    records: files
    body_file: path
