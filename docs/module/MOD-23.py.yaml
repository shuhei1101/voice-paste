id: MOD-23
visibility: internal
title: 常駐アプリ / 録音セッション / schemas.py
data_models:
  - name: StartSessionRequest
    title: 開始のリクエスト
    container: features/session/schemas.py
    usecase: APIで録音を操作する
    role: スキーマ
    summary: POST /sessions の body
    inherits: pydantic.BaseModel
    properties:
      - name: callback_url
        type: AnyHttpUrl
        description: コールバック先。ホストが許されるかは route が出力先の is_callback_allowed で確かめる
      - name: continuous
        type: bool
        default: 'False'
        description: 連続録音にするか（省略時は 1 回の録音）
      - name: glossary_preset
        type: str | None
        default: None
        description: 補正に使う用語集のプリセットの名前（省略時は設定で選んでいるプリセット）。一覧にあるかは route が glossary_preset_exists で確かめる
    refs:
      - LIB-18#
    status: implemented
  - name: StartSessionResponse
    title: 開始のレスポンス
    container: features/session/schemas.py
    usecase: APIで録音を操作する
    role: スキーマ
    summary: POST /sessions の 202 の body
    inherits: pydantic.BaseModel
    properties:
      - name: session_id
        type: str
        description: 始めた録音セッションの ID
    status: implemented
