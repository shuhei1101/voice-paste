id: MOD-87
title: 常駐アプリ / 起動と配線 / single_instance.py
test_files:
  - tests/unit/voice_paste/runtime/test_single_instance.py
classes:
  - name: SingleInstanceLock
    title: 単一インスタンスの排他
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    role: ランタイム
    summary: 取った名前付きのミューテックスと、終了の依頼を待つスレッドを持つ
    description: |-
      終了の依頼のイベント（名前付き）と停止のイベント（名前の無い自分専用）を専用のデーモンスレッドで待ち、終了の依頼が立ったら on_quit_requested で渡された関数を 1 回呼んでスレッドを終える（呼ぶのはそのスレッド。メインスレッドへ渡すのは渡す側の関数が行う）。
      名前付きのイベントは自分では立てない（立てると、ハンドルが残る間に次のプロセスへ依頼が引き継がれる）。
      ミューテックスは取ったスレッド（メインスレッド）で放す。
    kind: クラス
    properties:
      - name: _mutex
        type: int
        access: 内部 (_)
        description: 名前付きのミューテックスのハンドル
      - name: _quit_event
        type: int
        access: 内部 (_)
        description: 終了の依頼のイベントのハンドル
      - name: _on_quit
        type: Callable[[], None] | None
        access: 内部 (_)
        description: 終了を頼まれたときに呼ぶ関数。on_quit_requested の前は None（その間に頼まれたら、渡された時点で呼ぶ）
      - name: _thread
        type: threading.Thread
        access: 内部 (_)
        description: 終了の依頼を待つスレッド
      - name: _stop_event
        type: int
        access: 内部 (_)
        description: 待つスレッドを止める、名前の無い自分専用のイベントのハンドル
    methods:
      - name: on_quit_requested
        title: 終了の依頼の受け手の登録
        summary: 終了を頼まれたときに呼ぶ関数を渡す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: callback
            type: Callable[[], None]
            required: true
            passing: positional
            description: 終了を頼まれたときに呼ぶ関数
        returns:
          type: None
          description: なし
        process: |-
          1. 受け手を覚える
             - 既に頼まれていた場合、その場で 1 回呼ぶ
        unit_tests:
          - name: test_on_quit_requested
            case: 正常
            summary: 頼まれたら受け手を呼ぶ
            condition: 取った後に受け手を渡し、同じ名前のイベントを立てる
            mock: 受け手
            expected: 受け手が 1 秒以内に 1 回呼ばれる
          - name: test_on_quit_requested_when_already_requested
            case: 正常
            summary: 受け手を渡す前に頼まれていても取りこぼさない
            condition: 取った後、受け手を渡す前にイベントを立てる
            mock: 受け手
            expected: 受け手を渡した時点で 1 回呼ばれる
      - name: release
        title: 排他の解放
        summary: 待つスレッドを止め、ミューテックスを放してハンドルを閉じる
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. 停止のイベント（名前の無い自分専用）を立てて待つスレッドを抜けさせ、終わりを待つ（名前付きの終了の依頼のイベントは立てない）
          2. ミューテックスを放し（ReleaseMutex）、ミューテックス・終了の依頼のイベント・停止のイベントのハンドルを閉じる（CloseHandle）
             - 2 回目以降の呼び出しは何もしない
        unit_tests:
          - name: test_release
            case: 正常
            summary: 放した後は同じ名前ですぐ取れ、受け手は呼ばれない
            condition: 取ってから release を 2 回呼ぶ
            mock: 受け手
            expected: 同じ名前で timeout_sec=0.1 で取れ、受け手が呼ばれていない
    status: implemented
constants:
  - name: INSTANCE_HASH_LENGTH
    title: 単一インスタンスの名前のハッシュの長さ
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: instance_name が名前に使う SHA-256 の 16 進の文字数。置き場所が 1 台に数個のため、16 文字（64 ビット）で重ならない
    value: '16'
    status: implemented
  - name: OPEN_EVENT_RETRY_INTERVAL_SEC
    title: 前のプロセスのイベントを再度開く間隔
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: 前のプロセスがミューテックスを作ってからイベントを作るまでの間に OpenEventW が失敗したとき、開き直す間隔。前のプロセスの起動の初めの数ミリ秒の間だけ起こるため、依頼の遅れを 0.1 秒までに抑える
    value: '0.1'
    status: implemented
functions:
  - name: acquire_single_instance
    title: 単一インスタンスの確保
    kind: 関数
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 名前付きのミューテックスを取る。取られていれば名前付きのイベントで前のプロセスに終わるよう頼み、解放を待ってから取る
    args:
      - name: name
        type: str
        required: true
        passing: positional
        description: 排他の名前（instance_name）。ミューテックスは `Local\{name}`、終了の依頼のイベントは `Local\{name}-quit` にする
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 前のプロセスの終わりを待つ上限
    returns:
      type: SingleInstanceLock
      description: 取った排他（終了の依頼を待つスレッドを持つ。終了時に release で放す）
    exceptions:
      - name: StartupError
        condition: 上限まで待っても前のプロセスが排他を放さない
    notes:
      強制終了しない: プロセスの番号での強制終了はしない（番号を使い回された無関係なプロセスを止めない）。
    status: implemented
    process: |-
      1. 名前付きのミューテックスを作る（ctypes で Win32 の CreateMutexW。kernel32 は最初の呼び出しで読み込み、single_instance.py を Linux でも import できるようにする）
      2. 既にあった（ERROR_ALREADY_EXISTS）か
         - ある場合、前のプロセスの終了の依頼のイベントを開いて立て（OpenEventW・SetEvent）、ミューテックスの解放を timeout_sec まで待つ（WaitForSingleObject。前のプロセスが片付けずに落ちて放棄されたミューテックス（WAIT_ABANDONED）も取れたものとして扱う）
           - イベントを開けない場合（前のプロセスがミューテックスを作ってからイベントを作るまでの間）、OPEN_EVENT_RETRY_INTERVAL_SEC ごとに開き直しながら、同じ上限までミューテックスの解放を待つ（開けたらその時点で立てる）
           - `[INFO]` 前の常駐サービスに終わるよう頼んだ
           - 上限まで取れない場合、ミューテックスのハンドルを閉じて StartupError を送出する。上限まで一度もイベントを開けなかったときは、理由にその旨を書く
         - 無い場合、そのまま取れている
      3. 自分の終了の依頼のイベント（自動リセット）を作り、作った直後に ResetEvent で立ったまま残っていた依頼を消す（同じ名前のイベントは前のプロセスのハンドルが残る間は引き継がれ、取る前に立った依頼は前のプロセス宛てのため）
      4. 終了の依頼のイベントと、名前の無い自分専用の停止のイベントを WaitForMultipleObjects で待つデーモンスレッドを始めて SingleInstanceLock を返す
         - 終了の依頼のイベントが立った場合、受け手を 1 回呼んでスレッドを終える（2 回目以降の依頼は、既に終わりに向かっているため受けない）
         - 停止のイベントが立った場合、受け手を呼ばずにスレッドを終える
         - `[INFO]` 単一インスタンスを確保した（名前）
    unit_tests:
      - name: test_acquire_single_instance
        case: 正常
        summary: ほかに持つプロセスが無ければすぐ取れる
        condition: 一意の名前（テストごとに uuid を付ける）
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: SingleInstanceLock が返り、release の後に同じ名前でもう一度取れる
      - name: test_acquire_single_instance_when_held
        case: 正常
        summary: 持っている側に終わるよう頼み、放されたら取れる
        condition: 別のスレッドで同じ名前の SingleInstanceLock を先に取り、その on_quit_requested には呼ばれたことを知らせるだけの関数を渡す。知らせを受けたら、取ったスレッドが release する（名前付きのミューテックスは取ったスレッドだけが放せる）。テストのスレッドで timeout_sec=5 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: 先の on_quit_requested が 1 回呼ばれ、後の呼び出しが SingleInstanceLock を返す
      - name: test_acquire_single_instance_when_not_released
        case: 異常
        summary: 上限まで放されなければ StartupError
        condition: 別のスレッドで同じ名前の SingleInstanceLock を先に取り、頼まれても放さない。テストのスレッドで timeout_sec=0.2 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: StartupError。先の SingleInstanceLock は持ったまま
        exception: 上限まで待っても前のプロセスが排他を放さない
      - name: test_acquire_single_instance_when_taken_over
        case: 正常
        summary: 前の持ち主が依頼を受けて放した直後に取ったロックは、受け手を呼ばない
        condition: test_acquire_single_instance_when_held の流れで後から取ったロックに受け手を渡す。先のロックを取ったスレッドは、依頼の知らせを受けたら、同じ名前のイベントのハンドルを開いたまま、3 つ目の依頼として同じ名前のイベントをもう 1 回立ててから release する（立ったままの依頼が残り、acquire_single_instance の ResetEvent が無ければ後のロックの受け手が呼ばれる）
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: 後から取ったロックの受け手が 1 秒呼ばれない
      - name: test_acquire_single_instance_when_event_not_ready
        case: 正常
        summary: 前のプロセスのイベントがまだ無くても、開き直して頼む
        condition: 別のスレッドが CreateMutexW だけで同じ名前のミューテックスを持ち、0.3 秒後に同じ名前の終了の依頼のイベントを作り、立ったら放す。timeout_sec=5 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: SingleInstanceLock が返り、別のスレッドがイベントの立ったことを受けている
  - name: instance_name
    title: 単一インスタンスの名前
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: 設定の置き場所から、単一インスタンスの排他の名前を作る
    kind: 関数
    scope: public
    args:
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: 設定ファイルを置くフォルダ（AppPaths.settings_file の親）
    returns:
      type: str
      description: '`voice-paste-{ハッシュ}`（ハッシュは解決した絶対パスを小文字にした文字列の SHA-256 の先頭 16 文字）'
    process: |-
      1. settings_dir を解決した絶対パスを小文字にし、SHA-256 の 16 進の先頭 INSTANCE_HASH_LENGTH 文字を `{APP_NAME}-` に続けて返す
         - 普段使い（既定の置き場所）と E2E・非機能要件テスト（`--data-dir` の一時フォルダ）は別の名前になり、テストの起動が普段使いを終わらせない
    unit_tests:
      - name: test_instance_name
        case: 正常
        summary: 同じフォルダは大文字・小文字によらず同じ名前になる
        condition: '`C:/Users/a/AppData/Roaming/voice-paste` と `c:/users/a/appdata/roaming/VOICE-PASTE`'
        mock: なし
        expected: 同じ名前で、`voice-paste-` に 16 文字の 16 進が続く
      - name: test_instance_name_when_other_folder
        case: 正常
        summary: 違うフォルダは違う名前になる
        condition: 既定の置き場所と一時フォルダ
        mock: なし
        expected: 名前が違う
    status: implemented
