id: LIB-25
visibility: internal
title: "ruamel.yaml"
kind: "ライブラリ"
version:
  current: 0.19.1
  latest: 0.19.1
  checked_on: '2026-11-01'
  source: PoC（PR #247）で入れたバージョン
  pinning: マイナーバージョンの中で固定（~=0.19.1。0.x はマイナーバージョンで互換の無い変更が入る）。extra（`[libyaml]`・`[oldlibyaml]`）は付けない（C のパーサーはコメントを読まず、round-trip に使えない）
selection:
  candidates: ruamel.yaml・yarutsk・pyrs-yaml・StrictYAML・yamlsmith（[ライブラリ選定の案](https://github.com/shuhei1101/voice-paste/pull/246#discussion_r4436106780)）
  decision: |-
    キーの追加・変更・削除の後もコメント・空行・キーの順を保って書き戻せたのは ruamel.yaml だけだった。
    yarutsk は編集しなくても末尾のコメントが消え、pyrs-yaml は編集を重ねると空行が消え、StrictYAML は削除で次のキーの前のコメントが消え、yamlsmith は編集しなくても空行とコメントが消えた。
  consequences: 保守が止まり気味（最後のリリースとコミットは 2026-01-02）なため、上流の修正を当てにせず、コメントの所属を移す処理・引用符の representer・インデントの指定を自前で持ち、往復の結果を単体テストで固定する。
catalogs:
  - name: API
    version: 0.19.1
    entries:
      - name: YAML
        kind: クラス
        purpose: '`typ="rt"`（既定）で、コメント・空行・キーの順を保ったまま config/defaults.yaml・settings.yaml・settings.local.yaml を読み込み、settings.yaml を書き込む'
        description: '`typ="rt"` は任意のオブジェクトを組み立てない（`!!python/object` などのタグは `CommentedSeq`・`TaggedScalar` として読み込まれる）。`load` と `dump` はファイルのパスかストリームを受ける。ファイルは UTF-8 を指定して開く'
      - name: YAML.indent
        kind: メソッド
        purpose: '`indent(mapping=2, sequence=4, offset=2)` で、一覧の要素を `  - x` の字下げで書き込む'
        description: 個々の字下げは保たれず、指定しないと `mapping=2, sequence=2, offset=0` で `- x` に詰まる
      - name: YAML.preserve_quotes
        kind: 属性
        purpose: '`True` にして、ユーザーが引用符で書き込んだ文字列を同じ引用符で書き戻す'
      - name: YAML.max_depth
        kind: 属性
        purpose: 深すぎる入れ子の YAML を MaxDepthExceededError で止める
      - name: Representer.add_representer
        kind: メソッド
        purpose: str の representer を差し替え、YAML 1.1 で読み込むと文字列でなくなる値（yes・no・on・off など）を単引用符で囲んで書き込む
      - name: CommentedMap
        kind: クラス
        purpose: 読み込んだ表。dict と同じ操作でキーを追加・変更・削除する
      - name: CommentedMap.ca
        kind: 属性
        purpose: 表のコメント。`ca.items[キー][2]` がそのキーの後ろのコメント（次のキーの前のコメントと空行を含む）、`ca.comment` が表の前のコメント
        description: キーを追加・削除するときに、このコメントを前後のキーへ移す（不具合一覧の「キーの追加・削除でコメントの位置がずれる」）
      - name: YAMLError
        kind: 例外
        purpose: 読み込めない YAML を読み込んだときに送出される（SettingsError に変える）
        description: 構文の誤りは `MarkedYAMLError`（`ScannerError`・`ParserError`・`DuplicateKeyError` など）で、`problem_mark.line`・`problem_mark.column`（0 始まり）から行と列が取れる
lead: コメントと書式を保ったまま YAML を読み書きするライブラリ。
purl: pkg:pypi/ruamel.yaml
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/shared/settings.py
  - src/voice_paste/shared/yaml_document.py
verification:
  state: 済
  date: '2026-11-01'
  detail: PoC（PR #247 の poc/settings_yaml/poc.py）で、Windows と WSL の Linux（どちらも Python 3.14.3・ruamel.yaml 0.19.1）で同じ結果を確かめた。値の変更で変えた行だけが変わること、キーの追加・削除でコメントを前後のキーへ移せば外したキーの行末のコメント以外が残ること、TOML から読んだ値（一覧・入れ子の表・特別な意味を持つ文字列）を書いて読み直すと等しいこと、構文の誤りで `ScannerError` の行と列が取れること、UTF-8 を指定すれば既定のエンコーディングが cp932 の Windows でも日本語が崩れないことを確かめた
license: MIT（商用利用可）
official_url: https://sourceforge.net/p/ruamel-yaml/code/
docs_url: https://yaml.dev/doc/ruamel.yaml/
limitations:
  - item: 個々の字下げ
    content: 読み込んだファイルの字下げは保たれず、`YAML.indent` の指定で書き直される
  - item: C 拡張
    content: round-trip では C のパーサーを使用できない（コメントを読み込まない）
issues:
  - title: キーの追加・削除でコメントの位置がずれる
    summary: 次のキーの前のコメントが直前のキーの持ち物になっているため、キーの追加・削除でそのコメントが消えるか、新しいキーの上に来る
    occurred_on: '2026-11-01'
    state: 回避策あり
    description: |-
      ruamel.yaml はキーの前のコメントと空行を、直前のキーの後ろのコメント（`ca.items[直前のキー][2]`）として持つ。
      `del` でキーを外すと、そのキーが持っていた次のキー向けのコメント（次の表の見出しのコメント・末尾のコメント）が一緒に消える。
      表の末尾へキーを追加すると、最後のキーが持つ次の表の見出しのコメントの後ろに新しいキーが入る。
      `CommentedMap.__delitem__` と `insert` は `ca.items` を触らない。
    conditions:
      - 外す・追加するキーの前後にコメントか空行がある
    workarounds:
      - method: キーを外す前に、そのキー（値が表なら中の最後のキー）の後ろのコメントを前のキー（値が表なら中の最後の要素）へ移す。キーを末尾へ追加するときは、それまで最後のキーの後ろのコメントを追加したキーへ移す
        result: 外したキーの行末のコメント以外のコメントと空行が残り、追加したキーが次の表の見出しのコメントの前に入る（PoC で確認）。表ごと外したときは、表の見出しのコメントが前の表の後ろに残る
        recommended: true
    upstream_issue: https://sourceforge.net/p/ruamel-yaml/tickets/444/
  - title: yes・no・on・off が引用符なしで書かれる
    summary: 既定の YAML 1.2 では yes・no・on・off を文字列として引用符なしで書き込むため、YAML 1.1 で読み込む道具では真偽値になる
    occurred_on: '2026-11-01'
    state: 回避策あり
    description: |-
      ruamel.yaml で読み直すと文字列のまま戻るが、YAML 1.1 で読み込む道具（PyYAML など）では `True`・`False` になる。
      `version=(1, 1)` にすると引用符が付くが、先頭に `%YAML 1.1` が書き込まれ、読み込むときも on・off が真偽値になる。
    conditions:
      - 文字列の値が yes・no・on・off など YAML 1.1 で真偽値に読み込まれる単語
    workarounds:
      - method: str の representer を差し替え、YAML 1.1 で読み込むと文字列でなくなる値を単引用符で囲んで書き込む
        result: YAML 1.1 で読み込んでも文字列で戻る（PoC で確認）。ユーザーが引用符なしで書き込んだ触っていない値にも、保存のたびに引用符が付く。値は変わらないため受け入れ、往復の単体テストの期待値もそれに合わせる
        recommended: true
