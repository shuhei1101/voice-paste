id: SC-6
visibility: internal
title: "設定を変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV を供給する（マイクを開かない）。音量は下げた値と戻した値を記録する
      - name: 変える設定
        description: 録音開始のホットキーを別のキーの組み合わせに変える
        notes: '`hotkeys.start`。反映は `immediate`'
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        U->>TRAY: 「設定…」を選ぶ
        TRAY->>SW: 開く（設定のモデルから欄を組み立て、今の値を入れる）
        U->>SW: 「ホットキー」のまとまりを選ぶ
        U->>SW: 録音開始の欄で新しいキーの組み合わせを押す
        SW-->>U: 押した組み合わせを欄に出す
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>ENV: 変わった値を、コメントを保ったまま書き込む
        SW->>APP: 反映が immediate の値を動いている常駐アプリに適用する
        SW-->>U: 開いたまま、保存できたことを出す
        U->>SW: 「キャンセル」を押す
        SW->>SW: 保存の後に欄を変えていないので、確認せずに閉じる
        SW->>APP: 閉じたことを通知する
        APP->>APP: ホットキーの受付を張り直す
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` の `hotkeys.start` が新しい組み合わせになり、ほかのキーとコメントが変わっていない'
      - 「保存」の後、設定画面が開いたまま、入れた値と選んでいたまとまりが残り、保存できたことが出ている
      - 保存の後に欄を変えずに「キャンセル」を押すと、変えた値を捨てる確認を出さずに設定画面が閉じる
      - 設定画面を閉じた後、再起動せずに、新しい組み合わせで録音が始まり、前の組み合わせでは始まらない
    test: test_normal
  - name: 正常シナリオ（保存して再起動する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 変える設定
        description: ローカルの Whisper のモデルを別のモデルに変える
        notes: '`transcription.local_whisper.model`。反映は `restart`'
    flow: |-
      <!-- map: {"title": "正常シナリオ（保存して再起動する）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「文字起こし」のまとまりで「ローカルの Whisper」を開き、モデルを変える
        SW-->>U: 欄に「再起動で反映」を出し、「保存して再起動」を出す
        U->>SW: 「保存して再起動」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>ENV: 変わった値を書き込む
        SW->>APP: 閉じて再起動を求める
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ（新しいモデルを読み込む）
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` の `transcription.local_whisper.model` が新しいモデルになっている'
      - 前の常駐アプリのプロセスが終わり、新しいプロセスが新しいモデルで文字を起こす
    test: test_normal_when_save_and_restart
  - name: 正常シナリオ（既定に戻す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 変えた設定
        description: '`settings.yaml` に既定と違う値がある'
    flow: |-
      <!-- map: {"title": "正常シナリオ（既定に戻す）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant DLG as 既定に戻す確認
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「既定に戻す」を押す
        SW->>DLG: 全ての設定を既定の値へ戻すかを確認する
        U->>DLG: 「既定に戻す」を押す
        DLG->>ENV: 設定のキーを全て除外する
        DLG->>APP: 反映が immediate の値を動いている常駐アプリに適用する
        DLG->>SW: 戻り、既定の値を欄に入れる
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` に設定のキーが無く、全てのキーが `config/defaults.yaml` の値（`settings.local.yaml` があるキーはその値）で動いている'
      - 反映が `immediate` のキーは動いている常駐アプリに効き、`restart` のキーは再起動するまで前の値のまま動く
      - 設定画面が開いたまま、欄に既定の値（`settings.local.yaml` があるキーはその値）が入っている
    test: test_normal_when_reset
  - name: 正常シナリオ（取り消す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 取り消し
        description: 欄を書き換えてから「キャンセル」を押し、確認で「破棄して閉じる」を選ぶ
        notes: Esc・窓を閉じるでも同じ。欄を変えていなければ確認を出さずに閉じる
    flow: |-
      <!-- map: {"title": "正常シナリオ（取り消す）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant DLG as 変えた値を捨てる確認

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 欄を書き換えて「キャンセル」を押す
        SW->>DLG: 変えた値を捨てて閉じるかを確認する
        U->>DLG: 「破棄して閉じる」を押す
        DLG->>SW: 何も書き込まずに閉じる
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` が変わっていない'
      - 動いている常駐アプリの設定が変わっていない
      - 設定画面が閉じている
    test: test_normal_when_cancel
  - name: 異常シナリオ（確かめに通らない値を入れる）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
      - name: 通らない値
        description: 「出力先」のまとまりで、貼り付けて送信の Enter までの秒数に `abc` を入れて「保存」を押す
        notes: '`outputs[].enter_delay_sec`'
    flow: |-
      <!-- map: {"title": "異常シナリオ（確かめに通らない値を入れる）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant ENV as settings.yaml

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: Enter までの秒数を abc にして「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通らない（数値でない）
        SW-->>U: その欄の下にエラーを出し、最初のエラーの欄へフォーカスを移す
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` が変わっていない'
      - 設定画面が開いたまま、Enter までの秒数の欄の下にエラーが出て、その欄にフォーカスがある
      - 動いている常駐アプリの設定が変わっていない
    test: test_error_when_invalid_value
  - name: 正常シナリオ（カスタムプリセットを追加する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を供給する（マイクを開かない）。音量は下げた値と戻した値を記録する
      - name: 追加するプリセット
        description: 「エンドポイントへ送信」のまとまり（タブ）で、タイトル・URL・確定のホットキーを入れたプリセットを 1 つ追加する
        notes: 反映は `immediate`。URL は 127.0.0.1 で待ち受けるテスト用のエンドポイント
    flow: |-
      <!-- map: {"title": "正常シナリオ（カスタムプリセットを追加する）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「エンドポイントへ送信」のまとまりで「プリセットを追加」を押す
        U->>SW: タイトル・URL・確定のホットキーを入れる
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>ENV: プリセットの一覧を、コメントを保ったまま書き込む
        SW->>APP: 有効にする
        SW-->>U: 開いたまま、保存できたことを出す
        U->>SW: 「キャンセル」を押す
        SW->>SW: 保存の後に欄を変えていないので、確認せずに閉じる
        SW->>APP: 閉じたことを通知する
        APP->>APP: プリセットのホットキーの受付を張り直す
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` に追加したプリセットが書き込まれ、ほかのキーとコメントが変わっていない'
      - 「保存」の後、設定画面が開いたまま、追加したプリセットが一覧に残り、保存できたことが出ている
      - 設定画面を閉じた後、再起動せずに、次の録音の画面にそのプリセットのボタンが出、そのホットキーで確定できる
    test: test_normal_when_add_custom_preset
  - name: 正常シナリオ（用語集の行を編集する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 用語集
        description: 補正に使用する用語集のプリセットが使用する用語集に、誤変換と正しい表記の行が 2 つある
        notes: 反映は `immediate`
      - name: 変える行
        description: 「用語集」のまとまりで、行を 2 つ追加し（1 つは誤変換だけを入れて正しい表記を空にする）、1 つ目の行の正しい表記を書き換え、2 つ目の行をオフにする
        notes: 行を削除するのも同じ流れ
    flow: |-
      <!-- map: {"title": "正常シナリオ（用語集の行を編集する）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant GL as 用語集のファイル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「用語集」のまとまりを選ぶ
        U->>SW: 編集する用語集を選ぶ
        SW-->>U: 選んだ用語集の行（誤変換・正しい表記・オン・オフ）を一覧に出す
        U->>SW: 行を追加し、行を書き換え、行をオフにする
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>GL: 用語集の行とオン・オフを書き戻す
        SW->>ENV: 変わった値を、コメントを保ったまま書き込む
        SW->>APP: 有効にする
        SW-->>U: 開いたまま、保存できたことを出す
      ```

      <!-- /map -->
    expected:
      - 用語集のファイルに、正しい表記を入れて追加した行と書き換えた正しい表記があり、正しい表記を空にして追加した行が空のまま書き込まれ、オフにした行がオフとして書き込まれている
      - 再起動せずに、動いている常駐アプリの補正に文字を引き渡すと、正しい表記を入れて追加した行と書き換えた行の誤変換が置き換わり、正しい表記を空にして追加した行の誤変換が消え、オフにした行の誤変換は残る（マイクを開かずに確認する。録音を経由した補正は 録音を文字に起こす の 正常シナリオ）
      - 設定画面が開いたまま、保存できたことが出ている
    test: test_normal_when_edit_glossary
  - name: 正常シナリオ（用語集のプリセットを追加して切り替える）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 今の用語集
        description: 用語集が 1 つあり、補正に使用する用語集のプリセットはその用語集だけを使用する既定のプリセット
        notes: '-'
      - name: 追加する用語集とプリセット
        description: 「用語集」のまとまりで、名前を付けた用語集を 1 つ追加して行を 1 つ入れ、名前を付けた用語集のプリセットを 1 つ追加して今の用語集と追加した用語集の両方を使用する用語集に選び、補正に使用するプリセットをそのプリセットに切り替える
        notes: 補正に適用するプリセットは選んだ 1 つだけ。反映は `immediate`
    flow: |-
      <!-- map: {"title": "正常シナリオ（用語集のプリセットを追加して切り替える）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant GL as 用語集のファイル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「用語集」のまとまりで用語集を追加し、名前と行を入れる
        U->>SW: 用語集のプリセットを追加し、名前を入れる
        U->>SW: 追加したプリセットで、今の用語集と追加した用語集を使用する用語集に選ぶ
        U->>SW: 補正に使用するプリセットを追加したプリセットに切り替える
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>GL: 追加した用語集の行を書き込む
        SW->>ENV: 用語集の一覧・用語集のプリセットの一覧・補正に使用するプリセットを、コメントを保ったまま書き込む
        SW->>APP: 有効にする
        SW-->>U: 開いたまま、保存できたことを出す
      ```

      <!-- /map -->
    expected:
      - 追加した用語集のファイルに入れた行があり、今の用語集のファイルが変わっていない
      - '`settings.yaml` に、追加した用語集と、両方の用語集を使用する追加したプリセットと、補正に使用するプリセットがそのプリセットであることが書き込まれ、ほかのキーとコメントが変わっていない'
      - 再起動せずに、動いている常駐アプリの補正に文字を引き渡すと、今の用語集と追加した用語集の両方の行の誤変換が置き換わる（マイクを開かずに確認する）
      - 設定画面が開いたまま、保存できたことが出ている
    test: test_normal_when_switch_glossary_preset
    notes:
      既定のプリセット: 用語集のプリセットのキーが無い設定は、今の補正に使用する用語集（`active_glossary`。無ければ 1 つ目の用語集）だけを使用するプリセットを 1 つ持ち、それを補正に使用するとして読み込む。
      入力の確かめ: |-
        プリセットの名前が空・ほかのプリセットと同じ名前のときは、確認に通らず保存しない（異常シナリオ（確認に通らない値を入れる）と同じ流れ）。
        使用する用語集を 1 つも選ばないプリセットは保存でき、補正では何も置き換えない。
        補正に使用するプリセットは削除できない。
      用語集の削除・名前の変更: |-
        用語集を一覧から削除すると、その用語集を使用するプリセットからも除外される。
        用語集の名前を変更すると、プリセットの使用する用語集も新しい名前を指す。
  - name: 正常シナリオ（文字起こしの手がかりのプリセットを編集する）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: '-'
      - name: 手がかりのプリセット
        description: 手がかりのプリセットが 1 つあり、単語が 2 つ入っていて、有効になっている
        notes: 反映は `immediate`
      - name: 変えるプリセット
        description: 手がかりのプリセットの一覧で、名前と単語を 1 つ入れたプリセットを 1 つ追加し、前からあるプリセットに単語を 1 つ追加して 1 つ目の単語を書き換える。もう 1 つプリセットを追加して単語を入れ、無効に切り替える
        notes: 追加したプリセットは有効で始まる。単語を削除する・プリセットを削除するのも同じ流れ
    flow: |-
      <!-- map: {"title": "正常シナリオ（文字起こしの手がかりのプリセットを編集する）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant MDL as 設定のモデル
        participant ENV as settings.yaml
        participant APP as 常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 手がかりのプリセットの一覧があるまとまりを選ぶ
        SW-->>U: 手がかりのプリセット（名前・単語の一覧・有効か）を一覧に出す
        U->>SW: プリセットを追加し、単語を追加して書き換え、有効・無効を切り替える
        U->>SW: 「保存」を押す
        SW->>MDL: 欄の値を確認する
        MDL-->>SW: 通った
        SW->>ENV: 手がかりのプリセットの一覧を、コメントを保ったまま書き込む
        SW->>APP: 有効にする
        SW-->>U: 開いたまま、保存できたことを出す
      ```

      <!-- /map -->
    expected:
      - '`settings.yaml` に、追加したプリセット・追加した単語と書き換えた単語・プリセットごとの有効か無効かが一覧の順に書き込まれ、ほかのキーとコメントが変わっていない'
      - 再起動せずに、動いている常駐アプリが次に組み立てる文字起こしの要求に、有効なプリセットの単語が一覧の順に読点（、）でつながって載り、無効のプリセットの単語が載らない（マイクを開かずに確認する。録音を経由した文字起こしは 録音を文字に起こす の 正常シナリオ（文字起こしの手がかりを引き渡す））
      - 設定画面が開いたまま、保存できたことが出ている
    test: test_normal_when_edit_hint_presets
  - name: 異常シナリオ（手がかりが上限を超える）
    setup:
      - name: Mock
