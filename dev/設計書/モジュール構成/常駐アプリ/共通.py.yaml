  - name: migrate_settings_toml
    title: settings.toml の移行
    kind: 関数
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 前のバージョンの settings.toml を読み、既定値と違うキーだけを settings.yaml に書く。settings.toml は残す
    side_effects: settings_file を書く。legacy_settings_file は書き換えない。
    args:
      - name: legacy_settings_file
        type: Path
        required: true
        passing: positional
        description: settings.toml
      - name: settings_file
        type: Path
        required: true
        passing: positional
        description: settings.yaml（無いこと）
      - name: defaults
        type: dict[str, Any]
        required: true
        passing: positional
        description: OS の上書きを重ねた既定値（_read_defaults）
    returns:
      type: None
      description: なし
    process: |-
      1. legacy_settings_file を UTF-8 で読み、tomlkit で解釈して素の dict にする（unwrap）
         - TOMLKitError の場合、SettingsError を送出する（settings_file を作らない）
      2. 古い AI チャットの設定を読み替え（migrate_ai_chat）、文字起こし中の表示のホットキーを引き継ぐ（inherit_transcribing_show_hotkeys）
      3. 既定値と違うキーだけを集める（diff_from_defaults。表はキーごと、一覧と値は丸ごとで比べる）
      4. 集めた dict を書く（write_yaml_document）
         - `[INFO]` settings.toml から settings.yaml へ移した（移した元と先のパス・移したキーの数）
    exceptions:
      - name: SettingsError
        condition: settings.toml の書式が壊れている
        message: '設定ファイルを読めない（{path}: {理由}）'
    unit_tests:
      - name: test_migrate_settings_toml
        case: 正常
        summary: 既定値と違うキーだけを移し、既定値に重ねると TOML の値と等しい
        condition: hotkeys.start と transcription.engine を既定と違う値にし、他のキーを既定値で全て書いた settings.toml
        mock: なし（一時フォルダ）
        expected: settings_file に hotkeys.start と transcription.engine だけが書かれ、既定値に重ねた値が TOML の値と等しい。settings.toml が変わっていない
      - name: test_migrate_settings_toml_when_lists
        case: 正常
        summary: 一覧は一部だけ違っても丸ごと移す
        condition: edge_phrases の 1 行だけを既定と違う値にした settings.toml
        mock: なし（一時フォルダ）
        expected: settings_file の edge_phrases に一覧の全ての行が書かれる
      - name: test_migrate_settings_toml_when_special_strings
        case: 正常
        summary: YAML で特別な意味を持つ文字列を文字列のまま移す
        condition: 'edge_phrases の文言に `*`・yes・no・on・off・0123・`a: b`・null・`~`・日本語の文字列を書いた settings.toml'
        mock: なし（一時フォルダ）
        expected: settings_file を読み直した文言が全て文字列で、TOML の値と等しい
      - name: test_migrate_settings_toml_when_ai_chat_remains
        case: 正常
        summary: 古い AI チャットの設定はプリセットに読み替えて移す
        condition: outputs に id = "ai_chat" を書いた settings.toml
        mock: なし（一時フォルダ）
        expected: settings_file の outputs に ai_chat が無く、presets に読み替えたプリセットが書かれる
      - name: test_migrate_settings_toml_when_only_show_hotkeys
        case: 正常
        summary: 録音の画面のホットキーの表示だけが既定と違えば、文字起こし中の表示も同じ値で移す
        condition: '[ui] に show_hotkeys = false だけを書き、transcribing_show_hotkeys を書いていない settings.toml'
        mock: なし（一時フォルダ）
        expected: settings_file に ui.show_hotkeys と ui.transcribing_show_hotkeys が false で書かれ、load_settings の ui.transcribing_show_hotkeys が False
    refs:
      - dev/設計書/外部ライブラリ/tomlkit#
    status: planned
  - name: inherit_transcribing_show_hotkeys
    title: 文字起こし中の表示のホットキーの引き継ぎ
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: internal
    summary: show_hotkeys を持ち transcribing_show_hotkeys を持たないレイヤーの `ui` へ、show_hotkeys の値を入れる。既定値に重ねる前の環境の値・checkout の上書き・移すときの settings.toml の dict に当てる
    args:
      - name: layer
        type: dict[str, Any]
        required: true
        passing: positional
        description: 重ねる前の 1 つのレイヤー（素の dict）
    returns:
      type: dict[str, Any]
      description: transcribing_show_hotkeys を入れたコピー。入れる必要が無いときは layer をそのまま返す
    process: |-
      1. layer の `ui` が dict でないか、transcribing_show_hotkeys を持つか、show_hotkeys を持たないときは layer をそのまま返す（両方を持たないときは前のレイヤーの値に任せる）
      2. layer のコピーの `ui` に transcribing_show_hotkeys として show_hotkeys の値を入れて返す（layer は書き換えない）
    unit_tests:
      - name: test_inherit_transcribing_show_hotkeys_when_missing
        case: 正常
        summary: 文字起こし中の表示の項目が無ければ録音の画面の値を入れる
        condition: '{"ui": {"show_hotkeys": false}} を渡す'
        mock: なし
        expected: '{"ui": {"show_hotkeys": false, "transcribing_show_hotkeys": false}}。渡した dict が変わっていない'
      - name: test_inherit_transcribing_show_hotkeys_when_both_missing
        case: 正常
        summary: どちらの項目も無ければそのまま返す
        condition: 'parametrize で (1) {} (2) {"ui": {"theme": "dark"}} を渡す'
        mock: なし
        expected: 渡した dict と等しい
      - name: test_inherit_transcribing_show_hotkeys_when_set
        case: 正常
        summary: 文字起こし中の表示の項目があればその値を保つ
        condition: '{"ui": {"show_hotkeys": false, "transcribing_show_hotkeys": true}} を渡す'
        mock: なし
        expected: transcribing_show_hotkeys が true のまま
    status: planned
  - name: setup_logging
    title: ログの設定
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 標準の logging を日付ごとのファイルへ書くようにし、uvicorn のロガーもそこへ寄せる
    side_effects: ルートロガーと uvicorn のロガーのハンドラを入れ替える。log_dir が無ければ作る。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        required: true
        passing: positional
        description: ルートロガーのレベル
    returns:
      type: None
      description: なし
    process: |-
      1. log_dir を作る
      2. ルートロガーに既にこの関数が付けたハンドラがあれば外す（2 回呼んでも 1 組だけにする）
      3. 日付ごとのファイルのハンドラ（_DailyFileHandler）を付ける。書くたびにモジュールの `_today()`（今日の `date` を返す内部の関数。単体テストが差し替える）を呼び、`{log_dir}/{YYYY-MM-DD}.log` が変わっていれば開き直す
      4. 書式は 1 行 1 JSON（JSON Lines）で、ts（ローカルの時刻を UTC オフセット付きの ISO 8601）・level・name・msg・例外があれば exc を持つ（ensure_ascii=False）
      5. sys.stderr があれば同じ書式で stderr にも出す（pythonw では無い）
      6. ルートロガーのレベルを level にする
      7. uvicorn・uvicorn.error・uvicorn.access のロガーのハンドラを外し、propagate を True にする
    unit_tests:
      - name: test_setup_logging
        case: 正常
        summary: 今日のファイルに JSON Lines で書く
        condition: level=INFO、日本語の INFO と DEBUG を 1 行ずつ出す
        mock: なし（一時フォルダ）
        expected: '{log_dir}/{今日}.log に INFO の 1 行だけがあり、JSON として読めて msg が日本語のまま、ts に UTC オフセットが付く'
      - name: test_setup_logging_when_called_twice
        case: 正常
        summary: 2 回呼んでも二重に書かない
        condition: setup_logging を 2 回呼んでから 1 行出す
        mock: なし（一時フォルダ）
        expected: ファイルに 1 行だけ
      - name: test_setup_logging_when_date_changed
        case: 正常
        summary: 日付が変われば次のファイルへ書く
        condition: 1 行出した後に今日を翌日へ差し替えて 1 行出す
        mock: 今日の日付を返す関数（monkeypatch）
        expected: 2 つの日付のファイルに 1 行ずつ
      - name: test_setup_logging_when_uvicorn_logger
        case: 正常
        summary: uvicorn のログも同じファイルへ寄せる
        condition: uvicorn.error のロガーにハンドラを 1 つ付けておき、setup_logging の後に uvicorn.error へ INFO を 1 行出す
        mock: なし（一時フォルダ）
        expected: uvicorn.error のハンドラが空になり、今日のファイルに name が uvicorn.error の 1 行がある
    notes:
      秘密の値: トークンはログに出さない（断った要求のログにも含めない）。
    status: implemented
  - name: purge_old_logs
    title: 古いログの削除
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 保持期間を過ぎた日付のログだけを消す（今日より前を全て消す今のやり方はやめる）
    side_effects: log_dir の下のファイルを消す。
    args:
