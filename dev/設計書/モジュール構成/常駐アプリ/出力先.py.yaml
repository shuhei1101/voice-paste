    kind: 関数
    container: features/outputs/endpoint/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: PresetFn
    summary: 選んだエンドポイントへ送るのプリセットの URL へ、送る中身を 1 回 POST する。送り直さない
    args:
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: preset
        type: EndpointPreset
        required: true
        passing: positional
        description: 確定の操作で選んだエンドポイントへ送るのプリセット（url・authorization・title を使う）
      - name: post
        type: PostJsonFn
        required: true
        passing: injected
        description: 送り先へ JSON を POST してステータスを返す（外部連携の post_json。タイムアウト・接続できないことは DeliveryError）
      - name: get_timeout_sec
        type: Callable[[], float]
        required: true
        passing: injected
        description: 送るときのタイムアウトの秒数を返す（呼ぶたびに設定の preset_options.endpoint.timeout_sec を読む）
    returns:
      type: None
      description: なし
    process: |-
      1. 送る中身（ResultPayload.from_outcome）を作る
      2. preset.authorization が空でなければ、その値を `Authorization` ヘッダーにする（空ならヘッダーを付けない）
      3. post(preset.url, 中身, get_timeout_sec(), ヘッダー) で 1 回だけ送る
         - post が DeliveryError を送出した（タイムアウト・接続できない）場合、送り直さずにそのまま送出する
      4. 2xx なら終える
         - `[INFO]` エンドポイントへ届けた（セッションの ID・プリセットのタイトル・ステータス）
         - 2xx 以外（3xx を含む）の場合、送り直さずに DeliveryError を送出する
         - Authorization の値はログと例外の文に書かない
    exceptions:
      - name: DeliveryError
        condition: タイムアウト・接続できない・2xx 以外
    unit_tests:
      - name: test_deliver_to_endpoint
        case: 正常
        summary: 送る中身を 1 回送る
        condition: post が 200 を返す、preset の url が http://127.0.0.1:9000/hook・authorization が空、get_timeout_sec が 1.5 を返す
        mock: post・get_timeout_sec
        expected: post が 1 回、url・session_id・result・text・error を持つ dict・1.5・空のヘッダーで呼ばれる
      - name: test_deliver_to_endpoint_when_authorization
        case: 正常
        summary: Authorization を付けて送り、ログに書かない
        condition: preset の authorization が Bearer test-token、post が 204
        mock: post・get_timeout_sec
        expected: 'post に {"Authorization": "Bearer test-token"} が渡り、ログに test-token が出ない'
      - name: test_deliver_to_endpoint_when_error_status
        case: 異常
        summary: 2xx 以外は送り直さず DeliveryError
        condition: post が 500 を返す
        mock: post・get_timeout_sec
        expected: DeliveryError が送出され、post が 1 回だけ呼ばれる
        exception: 2xx 以外
      - name: test_deliver_to_endpoint_when_unreachable
        case: 異常
        summary: 届かなければ送り直さず DeliveryError
        condition: post が DeliveryError を送出する
        mock: post・get_timeout_sec
        expected: DeliveryError が送出され、post が 1 回だけ呼ばれる
        exception: タイムアウト・接続できない
    refs:
      - dev/設計書/インターフェース定義/常駐アプリ/設定のエンドポイントへ送信する.py#
      - dev/設計書/非機能要件/非機能要件#requirements[エンドポイントへ送るときのタイムアウト]
    status: implemented
  - name: read_enter_delay_sec
    title: 貼り付けてから Enter までの秒数の読み出し
    kind: 関数
    container: features/outputs/paste_and_send/service.py
    usecase: 起こした文字を届ける
    scope: public
    summary: 設定の outputs[] の貼り付けて送信の enter_delay_sec を返す。inject_paste_and_send と、ブラウザ添付の種類の配線（main.py の _wire_preset_kinds）が使う
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
    returns:
      type: float
      description: 貼り付けてから Enter を送るまでの秒数。outputs[] に PasteAndSendSettings が無ければそのモデルの既定値
    unit_tests:
      - name: test_read_enter_delay_sec
        case: 正常
        summary: 貼り付けて送信の秒数を返す
        condition: outputs に enter_delay_sec が 0.2 の PasteAndSendSettings を持つ設定
        mock: なし
        expected: '0.2'
      - name: test_read_enter_delay_sec_when_missing
        case: 正常
        summary: 一覧に無ければ既定値
        condition: outputs に PasteAndSendSettings が無い設定
        mock: なし
        expected: PasteAndSendSettings() の enter_delay_sec（0.5）
    status: planned
  - name: inject_paste_and_send
    title: 貼り付けて送信の注入
    kind: 関数
    container: features/outputs/paste_and_send/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: InjectFn
    summary: paste_and_send に部分適用する copy・paste・send_enter・sleep・get_enter_delay_sec・get_enter_modifiers を返す
    args:
      - name: deps
        type: OutputDeps
        required: true
        passing: positional
        description: 外部連携の関数と今の設定
    returns:
      type: Mapping[str, object]
      description: copy・paste・send_enter・sleep は deps のもの、get_enter_delay_sec は呼ぶたびに read_enter_delay_sec(deps.get_settings())、get_enter_modifiers は呼ぶたびに read_enter_modifiers(deps.get_settings()) を返す関数
    unit_tests:
      - name: test_inject_paste_and_send
        case: 正常
        summary: 呼ぶたびに今の設定の秒数と修飾キーを返す関数を渡す
        condition: deps.get_settings が enter_delay_sec 0.2・enter_modifiers [] の設定を返し、取り出した後に 1.0・["ctrl"] の設定へ差し替える
        mock: OutputDeps の全関数
        expected: 返った copy・paste・send_enter・sleep が deps のものと同じで、get_enter_delay_sec() が差し替えの前は 0.2、後は 1.0、get_enter_modifiers() が前は ()、後は ("ctrl",) を返す
    status: planned
  - name: inject_paste_only
    title: 貼り付けのみの注入
    kind: 関数
    container: features/outputs/paste_only/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: InjectFn
    summary: paste_only に部分適用する copy・paste を返す
    args:
      - name: deps
        type: OutputDeps
        required: true
        passing: positional
        description: 外部連携の関数と今の設定
    returns:
      type: Mapping[str, object]
      description: deps の copy・paste
    unit_tests:
      - name: test_inject_paste_only
        case: 正常
        summary: copy・paste だけを渡す
        condition: OutputDeps を渡す
        mock: OutputDeps の全関数
        expected: キーが copy・paste だけで、値が deps のものと同じ
    status: planned
  - name: inject_copy_only
    title: コピーのみの注入
    kind: 関数
    container: features/outputs/copy_only/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: InjectFn
    summary: copy_only に部分適用する copy・notify_copied を返す
    args:
      - name: deps
        type: OutputDeps
        required: true
        passing: positional
        description: 外部連携の関数と今の設定
    returns:
      type: Mapping[str, object]
      description: deps の copy・notify_copied
    unit_tests:
      - name: test_inject_copy_only
        case: 正常
        summary: copy・notify_copied だけを渡す
        condition: OutputDeps を渡す
        mock: OutputDeps の全関数
        expected: キーが copy・notify_copied だけで、値が deps のものと同じ
    status: planned
  - name: inject_callback
    title: 呼び出し元へ返すの注入
    kind: 関数
    container: features/outputs/callback/service.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: InjectFn
    summary: deliver_to_caller に部分適用する post・allowed_hosts・retry_count・retry_base_sec・sleep・jitter を返す
    args:
      - name: deps
        type: OutputDeps
        required: true
        passing: positional
        description: 外部連携の関数と今の設定
    returns:
      type: Mapping[str, object]
      description: post は CALLBACK_TIMEOUT_SEC を timeout_sec に部分適用した deps.post、allowed_hosts はこの時点の deps.get_settings() の api.allowed_callback_hosts、retry_count・retry_base_sec は CALLBACK_RETRY_COUNT・CALLBACK_RETRY_BASE_SEC、sleep・jitter は deps のもの
    unit_tests:
      - name: test_inject_callback
        case: 正常
        summary: 返送の決定値と設定の許可ホストを渡す
        condition: deps.get_settings が api.allowed_callback_hosts = ["host.local"] の設定を返す
        mock: OutputDeps の全関数
        expected: allowed_hosts が frozenset({"host.local"})、retry_count が 3、retry_base_sec が 1.0 で、post を呼ぶと deps.post に timeout_sec=1.5 が渡る
    status: planned
  - name: read_enter_modifiers
    title: Enter と一緒に押す修飾キーの読み出し
    kind: 関数
    container: features/outputs/paste_and_send/service.py
    usecase: 起こした文字を届ける
    scope: public
    summary: 設定の outputs[] の貼り付けて送信の enter_modifiers を返す。inject_paste_and_send が使う（ブラウザ添付の種類の配線は使わない）
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
    returns:
      type: tuple[EnterModifier, ...]
      description: Enter と一緒に押す修飾キー。outputs[] に PasteAndSendSettings が無ければ空
    unit_tests:
      - name: test_read_enter_modifiers
        case: 正常
        summary: 貼り付けて送信の修飾キーを返す
        condition: outputs に enter_modifiers が ["ctrl", "shift"] の PasteAndSendSettings を持つ設定
        mock: なし
        expected: ("ctrl", "shift")
      - name: test_read_enter_modifiers_when_missing
        case: 正常
        summary: 一覧に無ければ空
        condition: outputs に PasteAndSendSettings が無い設定
        mock: なし
        expected: ()
    status: planned
