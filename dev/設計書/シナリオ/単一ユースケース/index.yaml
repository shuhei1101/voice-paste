summary: 単一ユースケースのシナリオ
items:
  - page: 常駐アプリを起動する.yaml
    summary: ショートカットから常駐サービスを起動し、文字起こしのエンジン・API・ホットキーを立てて録音の開始を待つ
  - page: 録音する.yaml
    summary: ホットキー・トレイ・API から録音を始め、確定して履歴に残すか取り消す
  - page: 録音を文字に起こす.yaml
    summary: 確定した録音を設定のエンジンで文字に起こし、用語集で補正する
  - page: 起こした文字を届ける.yaml
    summary: 起こした文字を、選んだ出力先か API の呼び出し元のエンドポイントへ届ける
  - page: 設定を変える.yaml
    summary: 設定画面で設定を変えて .env に保存する
  - page: トレイから操作する.yaml
    summary: トレイのメニューからフォルダを開く・再起動する・終了する
  - page: APIで録音を操作する.yaml
    summary: ほかのプロセスが API の開始・停止・完了で、画面を出さない録音を始めて確定する
