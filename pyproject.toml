[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-paste"
version = "0.7.1"
description = "音声入力＆自動貼り付けツール"
requires-python = ">=3.11"
dependencies = [
    "av>=11,<19",
    "sounddevice~=0.5",
    "scipy~=1.13",
    "pyperclip~=1.9",
    "pynput~=1.7",
    "python-xlib~=0.33; sys_platform == \"linux\"",
    "evdev~=2.0; sys_platform == \"linux\"",
    "pycaw==20251023; sys_platform == \"win32\"",
    "fastapi~=0.142.2",
    "uvicorn~=0.54.0",
    "httpx~=0.28.1",
    "pydantic~=2.13",
    "tomlkit~=0.15.1",
    "platformdirs~=4.12",
    "numpy~=2.4",
    "onnxruntime~=1.25",
    "comtypes~=1.4; sys_platform == \"win32\"",
    "pyside6-essentials~=6.11.2",
    "python-multipart~=0.0.32",
    "ruamel-yaml~=0.19.1",
]

[project.optional-dependencies]
local-whisper = [
    "faster-whisper~=1.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "import-linter~=2.15",
    "pywin32~=312.0; sys_platform == \"win32\"",
]

[project.scripts]
voice-paste = "voice_paste.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["voice_paste*"]

[tool.setuptools.package-data]
voice_paste = [
    "server/web/index.html",
    "server/web/assets/*.js",
    "server/web/assets/*.css",
    "integrations/vad/assets/*.onnx",
    "integrations/vad/assets/LICENSE.*",
]

[tool.pytest]
# Haas の文字起こしのサーバーは別の Python のプロジェクトで、この環境には入れないため、テストから import できるようにする
pythonpath = ["haas_server/src"]

[tool.importlinter]
root_package = "voice_paste"

[[tool.importlinter.contracts]]
name = "層の向き"
type = "layers"
layers = [
    "voice_paste.main",
    "voice_paste.server | voice_paste.ui",
    "voice_paste.features",
    "voice_paste.integrations | voice_paste.runtime",
    "voice_paste.shared",
]

[[tool.importlinter.contracts]]
name = "feature の独立"
type = "independence"
modules = ["voice_paste.features.*"]

[[tool.importlinter.contracts]]
name = "出力先の独立"
type = "independence"
modules = ["voice_paste.features.outputs.*"]
ignore_imports = [
    "voice_paste.features.outputs.registry -> voice_paste.features.outputs.*",
    "voice_paste.features.outputs.service -> voice_paste.features.outputs.registry",
    "voice_paste.features.outputs.** -> voice_paste.features.outputs.types",
]
# service は一覧を import せず main.py が渡すため、service -> registry の除外には一致する import が無い
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "画面から feature の中へ"
type = "forbidden"
source_modules = ["voice_paste.ui"]
forbidden_modules = ["voice_paste.features", "voice_paste.integrations"]
ignore_imports = [
    "voice_paste.ui.** -> voice_paste.features.session.types",
]
