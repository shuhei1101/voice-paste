  - name: 消す行の説明
    id: glossary_delete_note
    kind: label
    position: 窓 > 右 > 用語集 > 用語集の行 > 名前の欄の下、行の表の上
    description: 正しい表記を空にした行が、起こした文字から誤変換を消すことを伝える
    label: 正しい表記を空にすると、誤変換を消す。
    io: 表示
    visible_when: 行の表を出している用語集を読めたとき（CSV を読めなかった用語集では出さない）
    status: planned
    introduced:
