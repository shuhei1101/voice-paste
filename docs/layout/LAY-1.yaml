id: LAY-1
visibility: internal
title: voice-paste
repository: shuhei1101/voice-paste
lead: 常駐アプリのコードの `src/`、Haas の文字起こしのサーバーの `haas_server/`、テストの `tests/`、設計書と公開ドキュメントの `docs/` に分ける。
content_types:
  - name: source
    group: role
    summary: アプリのコード
  - name: test
    group: role
    summary: テストのコードと、テストが使用するデータ
  - name: design_doc
    group: role
    summary: YAML の設計書
  - name: doc_index
    group: role
    summary: フォルダの目次と、Markdown・コードの行を記載する files.yml
  - name: guide
    group: role
    summary: 人が参照する Markdown のドキュメント
  - name: mock
    group: role
    summary: 画面のモック
  - name: pr_doc
    group: role
    summary: 作業 PR ごとの計画と記録
  - name: schema
    group: role
    summary: 設計書のスキーマ
  - name: config
    group: role
    summary: アプリの設定と、その既定値・見本
  - name: tool_config
    group: role
    summary: 開発の道具（Git・Python・Node.js・エディタ・dev-docs・rule-inject・Pages・GitHub Actions）の設定
  - name: manifest
    group: role
    summary: 依存と起動の入口を持つマニフェストと、そのロックファイル
  - name: launcher
    group: role
    summary: アプリを起動するスクリプトとショートカット
  - name: version
    group: role
    summary: バージョンを記載するファイル
  - name: asset
    group: role
    summary: アプリが読み込む画像・モデル
  - name: design_token
    group: role
    summary: 画面の色・書体・余白のデザイントークン
  - name: agent_instruction
    group: role
    summary: Claude Code に参照させる指示
  - name: web_transcription
    group: feature
    summary: 外の端末のブラウザから音声を送信して文字に起こす機能
entries:
  - type: file
    name: .gitattributes
    contents: 改行コードと差分の扱い
    content_types:
      - tool_config
  - type: file
    name: .gitignore
    contents: Git で管理しないパターン
    content_types:
      - tool_config
  - type: file
    name: .python-version
    contents: uv が使用する Python のバージョン
    content_types:
      - tool_config
  - type: file
    name: CLAUDE.md
    contents: Claude Code に参照させる、リポジトリの概要とドキュメントの索引の引き方
    content_types:
      - agent_instruction
  - type: file
    name: README.md
    contents: リポジトリのトップページ
    content_types:
      - guide
  - type: file
    name: ai-monitor-version.ini
    contents: 追従している AI Monitor の配布物のバージョン
    content_types:
      - version
  - type: file
    name: ai-monitor-theme.yaml
    contents: AI Monitor から取り込んだ GitHub Pages の共通レイアウトのバージョンと取り込み元
    content_types:
      - version
  - type: file
    name: version.ini
    contents: voice-paste のバージョン
    content_types:
      - version
  - type: file
    name: dev-docs.yaml
    contents: dev-docs と project-index の配信元の設定（設計書の種類ごとの場所とスキーマ）
    content_types:
      - tool_config
  - type: file
    name: rules.yaml
    contents: rule-inject に参照させる、このリポジトリのルールの索引
    content_types:
      - tool_config
  - type: file
    name: eslint.config.mjs
    contents: 外の端末の画面のスクリプトの ESLint の設定
    content_types:
      - tool_config
  - type: file
    name: package.json
    contents: 外の端末の画面のスクリプトを生成・検査する Node.js の開発用の依存とコマンド
    content_types:
      - manifest
  - type: file
    name: package-lock.json
    contents: package.json のロックファイル
    content_types:
      - manifest
  - type: file
    name: pyproject.toml
    contents: 常駐アプリの Python の依存・起動の入口・pytest・ruff の設定
    content_types:
      - manifest
  - type: file
    name: uv.lock
    contents: pyproject.toml のロックファイル
    content_types:
      - manifest
  - type: file
    name: tsconfig.json
    contents: 外の端末の画面のスクリプトの型検査の設定
    content_types:
      - tool_config
  - type: file
    name: tsconfig.build.json
    contents: 外の端末の画面のスクリプトから JavaScript を生成するときの設定
    content_types:
      - tool_config
  - type: file
    name: voice-paste.bat
    contents: Windows のショートカットから常駐アプリを起動するスクリプト
    content_types:
      - launcher
  - type: file
    name: voice-paste.sh
    contents: Linux で常駐アプリを起動するスクリプト
    content_types:
      - launcher
  - type: file
    name: voice-paste.desktop
    contents: Linux のデスクトップのショートカット
    content_types:
      - launcher
  - type: file
    name: voice-paste.code-workspace
    contents: VS Code のワークスペースの設定
    content_types:
      - tool_config
  - type: folder
    name: .github
    contents: GitHub の設定
    children:
      - type: folder
        name: workflows
        contents: GitHub Actions の workflow
        content_types:
          - tool_config
        children:
          - type: file
            name: test.yml
            contents: テスト実行方法の実行場所が runner の層の全件を、ランナーで回す workflow
            content_types:
              - tool_config
  - type: folder
    name: config
    contents: 常駐アプリの設定の既定値と、利用者が手元に作る設定ファイルの見本
    content_types:
      - config
    children:
      - type: file
        name: defaults.yaml
        contents: 全てのキーを持つ設定の既定値。settings.yaml と settings.local.yaml をこの上に重ねる
        content_types:
          - config
      - type: file
        name: settings.sample.yaml
        contents: 利用者が手元に作る settings.yaml・settings.local.yaml の見本
        content_types:
          - config
      - type: file
        name: yogo.sample.csv
        contents: 用語集の CSV（誤変換と正しい表記）の見本
        content_types:
          - config
  - type: folder
    name: resources
    contents: 常駐アプリが読み込む画像（トレイの状態ごとのアイコン）
    content_types:
      - asset
    naming:
      - tray_{state}.png
    children:
      - type: file
        name: tray_starting.png・tray_idle.png・tray_recording.png・tray_transcribing.png・tray_failed.png
        contents: トレイのアイコン（状態ごと）
  - type: folder
    name: content
    contents: 常駐アプリが読み込む、設定で上書きしない定義の原本
    content_types:
      - design_token
    children:
      - type: file
        name: tokens.toml
        contents: 画面の色・書体・余白のデザイントークン
        content_types:
          - design_token
  - type: folder
    name: schemas
    contents: knowledge に無く、このリポジトリが持つ用語集の設計書のスキーマ
    content_types:
      - schema
    naming:
      - glossary.schema.yaml
  - type: folder
    name: src
    contents: 常駐アプリのコード
    children:
      - type: file
        name: files.yml
        contents: src/ のコードの行（project-index の配信元の常駐アプリのコード）
        content_types:
          - doc_index
      - type: folder
        name: voice_paste
        contents: 常駐アプリと文字起こしワーカーのパッケージ
        content_types:
          - source
        convention: python-architecture-layout
        children:
          - type: folder
            name: ui
            contents: Qt の画面・トレイ・画面と録音セッションのつなぎ
            children:
              - type: folder
                name: windows
                contents: 画面ごとのウィンドウとダイアログ
                content_types:
                  - source
                children:
                  - type: file
                    name: recording_window.py
                    contents: RecordingWindow
                  - type: file
                    name: transcribing_indicator.py
                    contents: TranscribingIndicator
                  - type: file
                    name: window_parts.py
                    contents: HeadRow・GripIcon・HotkeyButton（録音の画面と文字起こし中の表示が使用する見出しの行・ドラッグのハンドル・名前の下にホットキーを出すボタン）
                  - type: file
                    name: busy_dialog.py
                    contents: show_busy_dialog
                  - type: file
                    name: settings_window.py
                    contents: SettingsWindow・confirm_discard・confirm_reset・PRESET_KIND_NAMES
                  - type: file
                    name: settings_fields.py
                    contents: make_radio_group・selected_radio など設定画面の欄の部品
                  - type: file
                    name: settings_presets.py
                    contents: PresetListPanel（設定画面の種類ごとのタブのプリセットの一覧）
                  - type: file
                    name: settings_glossaries.py
                    contents: GlossaryPanel（設定画面の用語集の一覧と行の表）・find_glossary_row_errors
                  - type: file
                    name: settings_hints.py
                    contents: HintPresetPanel（設定画面の表記のヒントの長さとプリセットの一覧）
                  - type: file
                    name: settings_edge_phrases.py
                    contents: EdgePhrasePanel（設定画面のハルシネーションの文言の一覧）
              - type: file
                name: __init__.py
                contents: 画面のパッケージの初期化
                content_types:
                  - source
              - type: file
                name: bridge.py
                contents: ほかのスレッドからメインスレッドの画面へ知らせを渡す橋渡し
                content_types:
                  - source
              - type: file
                name: controller.py
                contents: 知らせを受けて、トレイ・録音の画面・文字起こし中の表示・ダイアログを開く・閉じる・替える
                content_types:
                  - source
              - type: file
                name: indicator_style.py
                contents: チェックボックスの箱・ラジオボタンの丸を、テーマの色で描くスタイル
                content_types:
                  - source
              - type: file
                name: placement.py
                contents: 窓を配置する位置
                content_types:
                  - source
              - type: file
                name: style.py
                contents: content/tokens.toml からアプリ全体のスタイルシートを作る
                content_types:
                  - source
              - type: file
                name: tray.py
                contents: システムトレイのアイコン・メニュー・通知
                content_types:
                  - source
          - type: folder
            name: server
            contents: API と外の端末の画面を配信する FastAPI のサーバー
            content_types:
              - source
            children:
              - type: folder
                name: web
                contents: 外の端末の画面
                content_types:
                  - source
                  - web_transcription
                children:
                  - type: file
                    name: index.html
                    contents: 外の端末の画面の HTML
                    content_types:
                      - source
                      - web_transcription
                  - type: folder
                    name: assets
                    contents: 外の端末の画面のスクリプトとスタイル
                    content_types:
                      - source
                      - web_transcription
                    children:
                      - type: file
                        name: app.ts
                        contents: 外の端末の画面のスクリプトの原本
                        content_types:
                          - source
                          - web_transcription
                      - type: file
                        name: app.js
                        contents: app.ts から tsc で生成したスクリプト。Node.js の無い端末でも配信できるよう Git で管理する
                        content_types:
                          - source
                          - web_transcription
                        generated_from:
                          path: src/voice_paste/server/web/assets/app.ts
                          command: CMD-1#categories[ビルド・生成]
                      - type: file
                        name: style.css
                        contents: 外の端末の画面のスタイル
                        content_types:
                          - source
                          - web_transcription
              - type: file
                name: app.py
                contents: build_fastapi（route の集約・middleware・例外ハンドラ）
              - type: file
                name: middleware.py
                contents: RequestGuardMiddleware（Host・Origin・トークン。/web/ の下は Origin の許可リスト）
              - type: file
                name: body_limit.py
                contents: BodyLimitMiddleware（/web/transcriptions の本文の上限で 413）
              - type: file
                name: web_page.py
                contents: web_page_router（GET /web/・/web の移し）・mount_web_assets（/web/assets/）
              - type: file
                name: error_handlers.py
                contents: register_exception_handlers（RFC 9457）
              - type: file
                name: token.py
                contents: create_token・write_token_file（起動ごとのトークンを作り、待ち受けを始めてからファイルへ書き込む）
              - type: file
                name: runner.py
                contents: ApiServerRunner（uvicorn をスレッドで動かし started を確認する）
          - type: folder
            name: integrations
            contents: 外部のサービス・ライブラリ・OS の機能との連携
            content_types:
              - source
            children:
              - type: folder
                name: vad
                contents: 音声区間の検出
                content_types:
                  - source
                children:
                  - type: folder
                    name: assets
                    contents: Silero VAD のモデルとライセンス
                    content_types:
                      - asset
                    children:
                      - type: file
                        name: silero_vad_v6.onnx
                        contents: faster-whisper 1.2.1 が同梱するものと同じ Silero VAD のモデル（MIT）
                      - type: file
                        name: LICENSE.silero-vad
                        contents: Silero VAD の MIT のライセンスの全文
                  - type: file
                    name: adapter.py
                    contents: load_vad_session・StreamingVad（同梱の Silero VAD を onnxruntime で窓ごとに供給する）
              - type: folder
                name: whisper
                contents: 未記載
                children:
                  - type: file
                    name: worker.py
                    contents: 子プロセスの入口（python -m voice_paste.integrations.whisper.worker） / 子プロセスの本体（文字起こしワーカーのサブシステム）
                  - type: file
                    name: protocol.py
                    contents: 常駐サービスとやり取りする 1 行の JSON の型（client.py と共有）
                  - type: file
                    name: client.py
                    contents: WhisperWorkerClient（子プロセスの起動・監視・立て直し・やり直し）・ensure_local_whisper_installed
              - type: folder
                name: openai
                contents: 未記載
                children:
                  - type: file
                    name: credentials.py
                    contents: read_openai_api_key（環境変数か秘匿のファイルから API キーを読み込む）
                  - type: file
                    name: transcriber.py
                    contents: OpenAITranscriber（OpenAI API の文字起こしへ httpx で送信する）
              - type: folder
                name: haas
                contents: 未記載
                children:
                  - type: file
                    name: server.py
                    contents: HaasServer（WSL のサーバーの起動・応答の確認・停止）
                  - type: file
                    name: transcriber.py
                    contents: HaasTranscriber（Haas の文字起こしのサーバーへ httpx で送信する）
              - type: folder
                name: audio
                contents: 未記載
                children:
                  - type: file
                    name: probe.py
                    contents: probe_audio（受けた音声を PyAV で開いて容れ物・秒数を読み込む）
              - type: folder
                name: volume
                contents: 未記載
                children:
                  - type: file
                    name: adapter.py
                    contents: lower_volume・restore_volume（pycaw を == で固定して包む。Windows だけが読み込む）
                  - type: file
                    name: noop.py
                    contents: lower_volume_noop・restore_volume_noop（Linux の、音量を変えない実装）
              - type: folder
                name: display
                contents: 未記載
                children:
                  - type: file
                    name: adapter.py
                    contents: inhibit_display・release_display（Windows。電源要求の API を ctypes で呼ぶ。Windows だけが読み込む）
                  - type: file
                    name: adapter_linux.py
                    contents: inhibit_display_linux・release_display_linux（Linux。gnome-session-inhibit の子プロセス）
              - type: folder
                name: keyboard
                contents: 未記載
                children:
                  - type: file
                    name: sender.py
                    contents: copy_to_clipboard・use_xclip_clipboard・split_paste_key・send_paste・send_enter・TERMINAL_WM_CLASSES
                  - type: file
                    name: sender_linux.py
                    contents: send_paste_linux（Linux。端末アプリなら Ctrl+Shift+V にし、主キーを XTEST で送信する）
                  - type: file
                    name: sender_wayland.py
                    contents: UInputKeyboard（Linux の Wayland のセッション。python-evdev の UInput の仮想キーボードで貼り付けのキーと Enter を送信する）
                  - type: file
                    name: active_window_linux.py
                    contents: read_active_wm_class（Linux。python-xlib でアクティブなウィンドウの WM_CLASS を読み込む）
                  - type: file
                    name: active_window_wayland.py
                    contents: read_focused_wm_class（Linux の Wayland のセッション。拡張 Focused Window D-Bus からフォーカスしているウィンドウの wm_class を読み込む）
              - type: folder
                name: browser
                contents: 未記載
                children:
                  - type: file
                    name: opener.py
                    contents: open_app_window（Windows。Edge の --app で開き、無ければ既定のブラウザ）
                  - type: file
                    name: opener_linux.py
                    contents: open_app_window_linux（Linux。Chromium 系の --app で開き、無ければ既定のブラウザ）
              - type: folder
                name: http
                contents: 未記載
                children:
                  - type: file
                    name: types.py
                    contents: PostResult・PostJsonFn
                  - type: file
                    name: client.py
                    contents: post_json（httpx）
          - type: folder
            name: features
            contents: 未記載
            children:
              - type: folder
                name: transcription
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: transcribe の公開
                  - type: file
                    name: types.py
                    contents: エンジンの関数型とエンジンの種類
                  - type: file
                    name: service.py
                    contents: transcribe（エンジンの選択と失敗の変換）
              - type: folder
                name: correction
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: load_glossary・read_glossary_rows・save_glossary・apply_glossary・resolve_glossaries・resolve_glossary_presets・pick_glossary_preset・list_preset_glossaries・next_glossary_path・strip_edge_phrases の公開
                  - type: file
                    name: service.py
                    contents: 用語集の一覧の解決、CSV の読み書き、置き換え、文頭・文末の文言の削除
              - type: folder
                name: recording
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: Recorder・Segmenter の公開
                  - type: file
                    name: types.py
                    contents: 音量の操作・マイクの入力を開く・話し声の判定の関数型
                  - type: file
                    name: service.py
                    contents: Recorder（開始・一時停止・再開・停止・破棄・音の大きさ・連続録音の開始と停止）
                  - type: file
                    name: segmenter.py
                    contents: Segmenter（窓ごとの話し声の確率から区間を切り出す）
                  - type: file
                    name: client.py
                    contents: sounddevice の入力を開く（open_input）
              - type: folder
                name: session
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: SessionManager・route の公開
                  - type: file
                    name: types.py
                    contents: 録音セッションの状態・録音セッション・ほかの feature を受け取る関数型（入口・録音・結果の型は shared/types.py）
                  - type: file
                    name: service.py
                    contents: SessionManager（状態の遷移と排他、録音から出力までの流れ）
                  - type: file
                    name: schemas.py
                    contents: API のリクエスト・レスポンス
                  - type: file
                    name: route.py
                    contents: POST /sessions・/stop・/complete
              - type: folder
                name: web_transcription
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: WebJobQueue・accept_audio・router の公開
                  - type: file
                    name: types.py
                    contents: ジョブの状態・ジョブ・用語集のプリセットの選択肢・ほかの feature を受け取る関数型・API の依存
                  - type: file
                    name: service.py
                    contents: WebJobQueue（ジョブの一覧とワーカースレッド）・accept_audio（受け付け）
                  - type: file
                    name: schemas.py
                    contents: API のレスポンス
                  - type: file
                    name: route.py
                    contents: POST /web/transcriptions・GET /web/transcriptions/{job_id}・GET /web/glossary-presets
              - type: folder
                name: outputs
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: deliver・OUTPUTS・PRESET_KINDS・is_callback_allowed の公開
                  - type: file
                    name: types.py
                    contents: 出力先・プリセットの種類の関数型と定義、配線に引き渡すもの（OutputDeps）、送信する内容（pydantic）
                  - type: file
                    name: registry.py
                    contents: OUTPUTS・PRESET_KINDS（出力先・プリセットの種類の一覧。追加するときはここに 1 行追加する）
                  - type: file
                    name: service.py
                    contents: deliver（入口と確定の操作で出力先かプリセットを選んで呼ぶ）
                  - type: folder
                    name: paste_and_send
                    contents: 未記載
                    children:
                      - type: file
                        name: settings.py
                        contents: PasteAndSendSettings（貼り付けて送信の設定のモデル）
                      - type: file
                        name: service.py
                        contents: paste_and_send・inject_paste_and_send・read_enter_delay_sec・read_enter_modifiers
                  - type: folder
                    name: paste_only
                    contents: 未記載
                    children:
                      - type: file
                        name: settings.py
                        contents: PasteOnlySettings
                      - type: file
                        name: service.py
                        contents: paste_only・inject_paste_only
                  - type: folder
                    name: copy_only
                    contents: 未記載
                    children:
                      - type: file
                        name: settings.py
                        contents: CopyOnlySettings
                      - type: file
                        name: service.py
                        contents: copy_only・inject_copy_only
                  - type: folder
                    name: browser
                    contents: 未記載
                    children:
                      - type: file
                        name: service.py
                        contents: send_to_browser（ブラウザ添付の種類のプリセット。Edge のアプリの画面）
                  - type: folder
                    name: endpoint
                    contents: 未記載
                    children:
                      - type: file
                        name: service.py
                        contents: deliver_to_endpoint（エンドポイントへ送信の種類のプリセット）
                  - type: folder
                    name: callback
                    contents: 未記載
                    children:
                      - type: file
                        name: service.py
                        contents: deliver_to_caller・is_callback_allowed・inject_callback・返送の決定値（呼び出し元へ返却する）
              - type: folder
                name: history
                contents: 未記載
                children:
                  - type: file
                    name: __init__.py
                    contents: save_recording・store_web_audio・append_text・discard_temporary・purge_expired の公開
                  - type: file
                    name: service.py
                    contents: 録音の保存・ブラウザの音声の保存・文字の追記・一時の音声の削除・古い履歴の削除
          - type: file
            name: __init__.py
            contents: 未記載
          - type: file
            name: __main__.py
            contents: python -m voice_paste で main() を呼ぶ
          - type: file
            name: main.py
            contents: parse_args・build_handlers・build_ui_deps・apply_settings・start_local_session・main
          - type: folder
            name: runtime
            contents: 未記載
            children:
              - type: file
                name: single_instance.py
                contents: instance_name と、Windows の名前付きのミューテックスと終了の依頼（名前付きのイベント）
              - type: file
                name: single_instance_linux.py
                contents: Linux のロックファイル（flock）と終了の依頼（抽象名前空間の Unix ドメインソケット）
              - type: file
                name: settings_store.py
                contents: SettingsStore（動いている間の今の設定）
              - type: file
                name: process.py
                contents: relaunch（同じ引数で起動し直す）
              - type: file
                name: timer.py
                contents: RepeatingTimer（上限での打ち切りを定期に呼ぶ）
              - type: file
                name: hotkey.py
                contents: HotkeyListener（pynput の GlobalHotKeys を別のスレッドで動かす）
              - type: file
                name: hotkey_gnome.py
                contents: GnomeShortcutListener（Wayland のセッション。設定のホットキーを GNOME のカスタムショートカットへ登録する）・to_gnome_accelerator・validate_gnome_hotkeys
              - type: file
                name: send_hotkey.py
                contents: GNOME のカスタムショートカットが実行するコマンド。押されたホットキーを常駐サービスへ送信する
          - type: folder
            name: shared
            contents: 未記載
            children:
              - type: file
                name: yaml_document.py
                contents: コメントを保った YAML の読み書き（ruamel.yaml）と、キーの追加・削除でのコメントの付け替え・レイヤーの重ね合わせ
              - type: file
                name: __init__.py
                contents: 未記載
              - type: file
                name: settings.py
                contents: 設定のモデル（pydantic）と出力先の設定の共通の親・設定のモデルの組み立て、3 レイヤーの読み込みと環境の値の書き戻し・settings.toml からの移行
              - type: file
                name: logger.py
                contents: 標準の logging の設定。日付ごとのファイルと保持期間での削除
              - type: file
                name: errors.py
                contents: 例外の階層
              - type: file
                name: constants.py
                contents: アプリ名と配置先のパス（platformdirs）・リポジトリの直下の既定値と checkout の上書きのパス
              - type: file
                name: os_kind.py
                contents: 動いている OS とデスクトップのセッションの判定と、OS ごとに使用できない機能（OS ごとの実装・既定値・機能を選ぶ唯一の場所）
              - type: file
                name: types.py
                contents: feature の間を渡る型（入口・録音・文字起こしの結果・用語集の行）
  - type: folder
    name: haas_server
    contents: WSL の中で動かす Haas の文字起こしのサーバー。常駐アプリとは別の Python のプロジェクト
    children:
      - type: file
        name: pyproject.toml
        contents: Haas の文字起こしのサーバーの依存
        content_types:
          - manifest
      - type: file
        name: uv.lock
        contents: haas_server/pyproject.toml のロックファイル
        content_types:
          - manifest
      - type: file
        name: start.sh
        contents: 常駐アプリが WSL の中でサーバーを起動するスクリプト
        content_types:
          - launcher
      - type: folder
        name: src
        contents: Haas の文字起こしのサーバーのコード
        children:
          - type: file
            name: files.yml
            contents: haas_server/src/ のコードの行（project-index の配信元の Haas の文字起こしのサーバーのコード）
            content_types:
              - doc_index
          - type: folder
            name: haas_server
            contents: Haas の文字起こしのサーバーのパッケージ
            content_types:
              - source
            children:
              - type: file
                name: __init__.py
                contents: パッケージの初期化
                content_types:
                  - source
              - type: file
                name: main.py
                contents: 起動の入口
                content_types:
                  - source
              - type: file
                name: app.py
                contents: HTTP のエンドポイント
                content_types:
                  - source
              - type: file
                name: audio.py
                contents: 受信した音声の読み込み
                content_types:
                  - source
  - type: folder
    name: tests
    contents: 常駐アプリと Haas の文字起こしのサーバーのテスト
    content_types:
      - test
    convention: python-testing-layers
    children:
      - type: file
        name: files.yml
        contents: tests/ のテストの行（project-index の配信元のテスト）
        content_types:
          - doc_index
      - type: folder
        name: nfr
        contents: 非機能要件のテスト
        content_types:
          - test
        naming:
          - test_{requirement}.py
          - __init__.py
        children:
          - type: folder
            name: fixtures
            contents: 非機能要件のテストが実行時に作る音声。直下の .gitignore で全て Git の管理から除外する
            content_types:
              - test
      - type: folder
        name: mocks
        contents: 外部の依存の差し替え
        content_types:
          - test
      - type: folder
        name: support
        contents: 結合・非機能要件のテストが共有する起動と fixture の部品
        content_types:
          - test
  - type: folder
    name: docs
    contents: 設計書・公開ドキュメント・モック・PR ドキュメント
    children:
      - type: file
        name: index.yaml
