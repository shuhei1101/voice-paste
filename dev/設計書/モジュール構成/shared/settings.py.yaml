      - key: linux / hotkeys.pause
        value: '"<cmd>+<alt>+z"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / hotkeys.cancel
        value: '"<cmd>+<alt>+q"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / outputs.paste_and_send.hotkey
        value: '"<cmd>+<alt>+d"'
        description: hotkeys.start と同じキー。出力先のキーは `outputs.{出力先の ID}.{項目}`
      - key: linux / outputs.paste_only.hotkey
        value: '"<cmd>+<alt>+v"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / outputs.copy_only.hotkey
        value: '"<cmd>+<alt>+c"'
        description: hotkeys.start と同じく Super+Alt にそろえる
    description: 型は `Mapping[OsKind, Mapping[str, object]]`。
    status: removed
  - name: DEFAULTS_OS_OVERRIDES_KEY
    title: 既定値の OS ごとの上書きのキー
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    role: 設定のモデル
    summary: config/defaults.yaml の中で、OS ごとの既定値の上書きを持つ一番上のキー。中は OsKind の値（windows・linux）→ 設定と同じ構造の上書き
    value: '"os_overrides"'
    description: 上書きは共通の既定値に表はキーごと、一覧は丸ごとで重ねる（outputs の一覧は、出力先のホットキーを変える OS で一覧ごと持つ）。
    status: planned
  - name: WEB_ORIGIN_FORM_ERROR_TYPE
