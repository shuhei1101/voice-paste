# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/project-index/v0.1.0/schemas/project-index.schema.json
version: "3"
name: voice-input
worktrees: [".claude/worktrees/*"]
description: 録音・区切り・文字起こし・用語の補正をほかのシステムへ提供する音声入力のサービスの設計書と目次
github:
  repository: shuhei1101/voice-input
documents:
  - id: data
    title: データ
    paths: ["docs/data/**/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/data.schema.yaml
      ref: design-schemas/v8.3.0
    writable: true
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
