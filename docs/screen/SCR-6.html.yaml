id: SCR-6
visibility: internal
title: "外の端末の文字起こしの画面"
elements:
  - name: 画面の頭
    id: page_title
    kind: label
    position: 画面の頭
    description: 製品名と画面名
    label: voice-paste 文字起こし
    visible_when: 常時
  - name: 音声送信の見出し
    id: send_heading
    kind: label
    position: 音声送信
    description: 音声送信の区画の見出し
    label: 音声送信
    visible_when: 常時
  - name: 録音開始ボタン
    id: record_button
    kind: button
    position: 音声送信 > 操作
    description: 画面での録音を始める。MediaRecorder の形式を `isTypeSupported` で webm/opus・mp4・ogg の順に選び、audioBitsPerSecond に画面の録音のビットレートを引き渡す。マイクの許可はブラウザ標準の確認に任せる。端末内の音声が「送信失敗」「未送信」「文字起こし前」のときは塗りを除外し、主の操作を再送信ボタンへ移す
    disabled_reason: ファイルの送信中の行（送信中のファイル名と「送信中 {n}%」）が、送信中で押せないことを示す
    label_display: icon_and_text
    confirm: none
    icon: circle
    label: 録音開始
    visible_when: 録音中・一時停止中でないとき
    enabled_when: 送信中でないとき
    action: 端末内の音声が「送信失敗」「未送信」「文字起こし前」なら置換の確認を開く。それ以外（音声が無い・送信済み）なら確認せずに録音を始め、録音中の表示に替える
    action_ref: SCR-4#
    status: planned
    notes:
      エラーの表示: マイクを開けないときは、音声送信のエラーに「マイク使用不可」「ブラウザのマイクの許可を確認」を出す
  - name: ファイル送信ボタン
    id: file_input
    kind: input
    position: 音声送信 > 操作
    description: 録ってある音声ファイルを選ぶ。選んだら確認せずにすぐ送信し、送信している間はファイルの送信中の行を出す。選んだファイルは端末内の音声に残さない（元が端末にあるため）
    retained_state:
      - what: 選んだファイル
        store: none
        reason: 選んだらすぐ送信し、端末内の音声にも残さないため
    label: ファイル送信
    io: input
    type: File
    visible_when: 録音中・一時停止中でないとき
    enabled_when: 送信中でないとき
    constraints: '`accept="audio/*"`。大きさがブラウザの本文の上限以上なら送信せずにファイルサイズ超過を出す'
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 送信の補足
    id: send_hint
    kind: label
    position: 音声送信 > 操作
    description: 録音の上限時間とファイルの大きさの上限
    label: 録音 最大 30 分・ファイル 100 MB 未満
    visible_when: 録音中・一時停止中でないとき
    refs:
      - to: NFR-1
        item: "requirements[画面の録音の上限時間]"
        type: requires
        when: "『非機能要件』の要件「画面の録音の上限時間」の決定値を確認するとき。"
      - to: NFR-1
        item: "requirements[ブラウザの本文の上限]"
        type: requires
        when: "『非機能要件』の要件「ブラウザの本文の上限」の決定値を確認するとき。"
  - name: 録音中の状態
    id: recording_state
    kind: label
    position: 音声送信 > 録音中の表示
    description: 録音中か一時停止中かを、マーカーと文言で出す（色だけに頼らない）。録音中は丸の点と「録音中」、一時停止中は四角のマーカーと「一時停止中」
    label: 録音中（一時停止中は「一時停止中」）
    visible_when: 録音中・一時停止中
  - name: 経過時間
    id: recording_elapsed
    kind: label
    position: 音声送信 > 録音中の表示
    description: 録った時間の合計（一時停止していた時間を含まない）。録音中は 1 秒ごとに更新し、一時停止中は止めて補足の色にする（role=timer）。読み上げ名は「経過時間 {分} 分 {秒} 秒」
    io: output
    visible_when: 録音中・一時停止中
    display_format: '`mm:ss`（例 `02:14`）'
  - name: 上限までの録音時間
    id: recording_progress
    kind: progress
    position: 音声送信 > 録音中の表示
    description: 画面の録音の上限時間に対する、録った時間の合計（秒）。一時停止中は進めない。値の範囲は 0〜1800
    io: output
    visible_when: 録音中・一時停止中
  - name: 上限と残り時間
    id: recording_remaining
    kind: label
    position: 音声送信 > 録音中の表示
    description: 上限時間と、録った時間の合計で数えた残り時間（一時停止中は進めない）。残り 60 秒未満になったら残り時間を注意の色にし、「（上限で自動送信）」を添える
    label: 上限 30:00 / 残り {m:ss}
    io: output
    visible_when: 録音中・一時停止中
    display_format: '`m:ss`（例 `27:46`・`0:48`）'
  - name: 録音停止・送信ボタン
    id: stop_button
    kind: button
    position: 音声送信 > 録音中の表示
    description: 録音を止め、録った音声（一時停止していた間を含まない）を保存日時つきで端末（IndexedDB）に 1 件だけ残して（前の 1 件を置き換える）送信する。一時停止中も押せる。録った時間の合計が上限時間に達したときも同じ動きを自動で行う。録音中の表示の主の操作（塗り）で、幅が 30rem 未満の録音中の表示では 1 行目に幅いっぱいで配置する
    label_display: icon_and_text
    confirm: none
    icon: square
    label: 録音停止・送信
    visible_when: 録音中・一時停止中
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 上限到達のメッセージ
    id: limit_notice
    kind: label
    position: 音声送信
    description: 上限時間で録音が止まり、送信していること（role=status）
    label: 上限 30 分に到達。録音停止・送信中
    visible_when: 上限時間で録音が止まってから、その送信が終わるまで
  - name: 音声送信のエラー
    id: send_error
    kind: label
    position: 音声送信
    description: 送信の失敗を、見出しと本文で出す（role=alert）。次の送信か録音を始めると削除する
    overflow:
      type: wrap
      max_length: 200
    io: output
    visible_when: 直前の送信か録音の開始が失敗したとき
    source: 音声を受け付ける の応答のステータス
    notes:
      エラーの表示: '415: 「非対応形式」「{ファイル名} は未送信。対応形式: WAV・MP3・webm・ogg・mp4」。413（送信前に大きさで弾いたときも）: 「ファイルサイズ超過」「{ファイル名}（{大きさ}）は未送信。上限: 100 MB 未満。MP3 等に圧縮して再選択」。届かない・403・503・504・そのほか（一覧に無いプリセットの 400 は除く。一覧に無いプリセットのエラー に出す）: 「送信失敗」「PC の voice-paste に接続不可。音声は端末内に保存済み。PC の起動を確認後に再送信」（選んだファイルのときは「音声は端末内に保存済み」を出さない）。マイクを開けない: 「マイク使用不可」「ブラウザのマイクの許可を確認」'
  - name: 端末内の音声の情報
    id: kept_meta
    kind: label
    position: 音声送信 > 端末内の音声
    description: 画面で録った直近 1 件の音声の録った日時・長さ・形式・大きさ。送信中は、送信した時点の用語集のプリセット（選択欄の表示文言のまま）を末尾に添え、次に送信する音声の選択と分ける。見出しは「端末内の音声」
    io: output
    visible_when: 端末（IndexedDB）に音声があるとき
    display_format: '`MM/DD HH:mm 録音・{m:ss}・{形式}・{大きさ}`（例 `10/23 14:05 録音・2:14・webm・540 KB`）。送信中は末尾に `・プリセット「{名前}」`'
  - name: 端末内の音声の状態
    id: kept_state
    kind: label
    position: 音声送信 > 端末内の音声
    description: 'その音声の送信と文字起こしの状態。マーカーと文言で分け、色だけに頼らない。並び: 「送信中 {n}%」（送信中）・「送信済み」（202 を受けた後。そのジョブが failed か 404 になるまで）・「送信失敗」（送信が失敗した）・「未送信」（一覧に無いプリセットで 400 になった）・「文字起こし前」（そのジョブが failed か 404）'
    io: output
    visible_when: 端末（IndexedDB）に音声があるとき
  - name: 送信の進捗
    id: kept_progress
    kind: progress
    position: 音声送信 > 端末内の音声
    description: 送信したバイト数の割合（XMLHttpRequest の upload の progress）。読み上げ名は「送信の進捗」。値の範囲は 0〜100
    io: output
    visible_when: 送信中
  - name: ダウンロードボタン
    id: download_button
    kind: button
    position: 音声送信 > 端末内の音声
    description: 端末内の音声を、録った日時の名前と形式の拡張子で端末へ保存する
    label_display: icon_and_text
    confirm: none
    icon: download
    label: ダウンロード
    visible_when: 端末（IndexedDB）に音声があるとき
    action: '`voice-paste_{YYYYMMDD-HHmmss}.{拡張子}` の名前で保存する'
  - name: 再送信ボタン
    id: resend_button
    kind: button
    position: 音声送信 > 端末内の音声
    description: 端末内の音声を、再送信した時点の用語集のプリセットの選択でもう一度送信する。このときの主の操作（塗り）。新しい job_id で結果の一覧に待ちの件を追加し、失敗した前の件は一覧から除外する
    label_display: icon_and_text
    confirm: none
    icon: rotate-cw
    label: 再送信
    visible_when: 端末内の音声が「送信失敗」「未送信」「文字起こし前」のとき
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 結果の見出し
    id: results_heading
    kind: label
    position: 結果
    description: 結果の区画の見出し
    label: 結果
    visible_when: 常時
  - name: 結果の件数
    id: results_meta
    kind: label
    position: 結果 > 見出し
    description: 一覧の件数（待ちの件を含む）と、残す件数・期限
    label: '{n} 件・最大 10 件・保存 7 日（0 件のときは「最大 10 件・保存 7 日」）'
    io: output
    visible_when: 常時
  - name: 結果なしの表示
    id: results_empty
    kind: label
    position: 結果
    description: 一覧に件が無いこと
    label: 結果 0 件
    visible_when: 一覧に件が無いとき
  - name: 結果の一覧
    id: results_list
    kind: list
    position: 結果
    description: 新しい件を先頭に並べる（aria-live=polite）。終わっていない件（文字起こし待ち・文字起こし中）は 2 秒ごとに結果を取りに行き、done・failed・404 で取りに行くのをやめる。取りに行けなかったとき（届かない・5xx）は次の間隔で取りに行く。終わっていない件の job_id も端末（localStorage）に持ち、画面を開き直したら取りに行くのを続ける。画面を開いたときに、保存日時から 7 日を過ぎた結果と端末内の音声を削除する。結果は直近 10 件を残し、超えたらいちばん古い件を削除する
    overflow:
      type: wrap
      unbounded: true
    retained_state:
      - what: 結果の一覧（終わっていない件の job_id を含む）
        store: local_storage
        key: voice-paste.results
        save_on: 件を追加したとき・結果を取りに行って状態が変わったとき・削除したとき
        restore_on: 画面を開いたとき（開き直し・再読み込み）
        reset_when: 保存日時から 7 日を過ぎた件と、直近 10 件を超えた件は削除する
    io: output
    visible_when: 一覧に件があるとき
    source: 文字起こしの結果を返却する.state
    action_ref: IF-4#
    status: planned
  - name: 結果の日時
    id: result_time
    kind: label
    position: 結果 > 結果の 1 件 > 頭の行
    description: 送信した日時
    io: output
    visible_when: 常時
    display_format: '`MM/DD HH:mm`'
  - name: 結果の元の音声
    id: result_source
    kind: label
    position: 結果 > 結果の 1 件 > 頭の行
    description: 画面で録った音声は「画面録音・{長さ}」、選んだファイルはファイル名。日時の右に並べ、コピー・削除に場所を譲って 1 行で末尾を `…` で省く（狭い幅では「画面録音・{長さ}」も省く）。省いた全文は `title` で出す
    io: output
    visible_when: 常時
  - name: 結果の状態
    id: result_status
    kind: label
    position: 結果 > 結果の 1 件
    description: '終わっていない件と失敗した件の状態。並び: queued: 「文字起こし待ち」。running: reports_progress が true なら「文字起こし中 {n}%」、false なら「文字起こし中」。failed: 「文字起こし失敗」。404: 「結果消失」'
    overflow:
      type: wrap
      max_length: 20
    io: output
    visible_when: state が queued・running・failed か 404 のとき
    source: 文字起こしの結果を返却する.state・文字起こしの結果を返却する.reports_progress
  - name: 文字起こしの進捗
    id: result_progress
    kind: progress
    position: 結果 > 結果の 1 件
    description: 文字起こしの進み具合。読み上げ名は「文字起こしの進捗」。値の範囲は 0〜100
    overflow:
      type: wrap
      max_length: 4
    io: output
    visible_when: state が running で、reports_progress が true のとき（false のときは hidden にして読み上げにも出さない）
    source: 文字起こしの結果を返却する.progress（× 100 して整数に丸める）
  - name: 起こした文字
    id: result_text
    kind: label
    position: 結果 > 結果の 1 件
    description: 用語集で補正した文字。改行を保ち、長い単語も折り返す。表示が 5 行を超える件は先頭の 5 行だけを出して折りたたみ、続きを読む・折りたたむボタンで全文と行き来する。done を受けたら保存日時つきで端末（localStorage）に残す
    overflow:
      type: wrap
      unbounded: true
    io: output
    visible_when: state が done のとき
    source: 文字起こしの結果を返却する.text
  - name: 失敗の詳細
    id: result_detail
    kind: label
    position: 結果 > 結果の 1 件
    description: 失敗の理由と対処。失敗した件は端末（localStorage）に残さず、画面を開いている間だけ出す
    overflow:
      type: wrap
      max_length: 200
    io: output
    visible_when: state が failed か 404 のとき
    source: 文字起こしの結果を返却する.error
    notes:
      エラーの表示: 'failed: 「PC の voice-paste で文字起こしが停止。端末内の音声から再送信可」と「詳細: {error}」。404: 「PC の voice-paste の再起動で結果が消失。端末内の音声から再送信可」'
  - name: コピーボタン
    id: copy_button
    kind: button
    position: 結果 > 結果の 1 件 > 頭の行 > 操作
    description: 起こした文字の全文を、折りたたみの状態によらずクリップボードへ入れる（`navigator.clipboard.writeText`）。日時・元の音声と同じ行の右端（起こした文字の上）に配置する。768px 未満の幅ではアイコンだけにする（削除ボタンと同じ大きさ）。押した後の表示は結果の伝え方のとおり
    feedback:
      success: 押した直後の 2 秒だけアイコンをチェックに替えて成功の色にし、文言は「コピー」のまま替えない。読み上げには「コピーしました」を伝える
      failure: クリップボードへ書き込めなかったときは表示を替えない（拒否の理由はブラウザのコンソールに出す）
    narrow:
      action: icon_only
    tooltip: コピー
    accessible_name: コピー
    label_display: icon_and_text
    confirm: none
    icon: copy
    label: コピー
    visible_when: state が done のとき
    action: 起こした文字をクリップボードへ入れる
  - name: 削除ボタン
    id: delete_button
    kind: button
    position: 結果 > 結果の 1 件 > 頭の行 > 操作
    description: その結果を端末から削除する確認を開く。アイコンだけのボタンで、読み上げ名は「この結果を削除」
    label_display: icon_only
    confirm: dialog
    icon: trash-2
    accessible_name: この結果を削除
    tooltip: この結果を削除
    visible_when: state が done のとき
    action_ref: SCR-4#
  - name: 送信中のファイル名
    id: file_sending_name
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 選んで送信しているファイルの名前と大きさ。操作のすぐ下に出し、録音開始ボタンとファイル送信ボタンが押せない理由をその場で確認できるようにする。長い名前は名前だけを 1 行で末尾を `…` で省き、大きさは省かずに残す
    io: output
    visible_when: 選んだファイルを送信している間（202 か失敗を受けたら削除する）
    display_format: '`{ファイル名}・{大きさ}`（例 `interview-part2.m4a・38.4 MB`）'
  - name: ファイルの送信の状態
    id: file_sending_state
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 送信したバイト数の割合（role=status）。202 を受けたらこの行を削除し、結果の一覧の先頭に待ちの件を出す。失敗したらこの行を削除し、音声送信のエラーを出す
    label: 送信中 {n}%
    io: output
    visible_when: 選んだファイルを送信している間
  - name: ファイルの送信の進捗
    id: file_sending_progress
    kind: progress
    position: 音声送信 > ファイルの送信中
    description: 送信したバイト数の割合（XMLHttpRequest の upload の progress）。読み上げ名は「送信の進捗」。値の範囲は 0〜100
    io: output
    visible_when: 選んだファイルを送信している間
  - name: 用語集のプリセットの選択欄
    id: preset_select
    kind: select
    position: 音声送信 > 用語集のプリセット
    description: 次に送信する音声の補正に使用する用語集のプリセットを選ぶ。録音開始ボタン・ファイル送信ボタンの上に配置する。録音停止・送信・ファイル送信・再送信のどれも、送信した時点の選択を送信する。送信中も次に送信する音声のために変えられる
    retained_state:
      - what: 選んだ用語集のプリセットの名前（「設定に従う」は空文字）
        store: local_storage
        key: voice-paste.glossary_preset
        save_on: 選んだとき
        restore_on: 画面を開いたとき
        reset_when: 覚えた名前が presets に無いときは「設定に従う」にする
    label: 用語集のプリセット
    io: input
    type: 文字列
    visible_when: 常時
    enabled_when: 録音中・一時停止中でないとき
    required: false
    initial_value: 端末（localStorage voice-paste.glossary_preset）に覚えた名前が presets にあればその名前。覚えた名前が無い・一覧に無いときは「設定に従う」
    options: 先頭に「設定に従う（{active}）」（値は空文字。既定）、続けて presets を一覧の並びのまま並べる。一覧を取得できないときは「設定に従う」だけ。複数選択はしない
    source: 用語集のプリセットの一覧を返却する.presets・用語集のプリセットの一覧を返却する.active（画面を開いたときに 1 回取得する）
    target: 音声を受け付ける.glossary_preset（「設定に従う」は空文字）
    action: 選んだら、その名前を端末（localStorage voice-paste.glossary_preset）に覚える（「設定に従う」は空文字）
    action_ref: IF-5#
    status: planned
  - name: 録音中の選択欄の補足
    id: preset_help
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 選択欄が押せない理由。選択欄の aria-describedby で読み上げにも伝える
    label: 録音中は変更不可
    visible_when: 録音中・一時停止中
    status: planned
  - name: 画面を暗くしないかのチェック
    id: keep_screen_check
    kind: checkbox
    position: 音声送信 > 画面を暗くしない
    description: 画面で録っている間、Screen Wake Lock で端末の画面の消灯を抑止するか。用語集のプリセットの選択欄のすぐ下、録音開始ボタンの上に配置する。オンなら録音を始めるときに `navigator.wakeLock.request("screen")` を取得し、一時停止中も抑止を続け、録音の停止・上限での停止・破棄で解放する。録音中・一時停止中に画面が隠れるとブラウザが解放し、画面へ戻ったとき（visibilitychange）に録音中か一時停止中なら取得し直す。取得できないとき（拒否）は抑止せずに録音を続け、ブラウザのコンソールに警告を出す。ファイルの送信では抑止しない（モック `docs/mock/pages/web-transcription/292/a-below-preset/`）
    retained_state:
      - what: チェックのオン・オフ
        store: local_storage
        key: voice-paste.keep_screen_on
        save_on: 変えたとき
        restore_on: 画面を開いたとき
    label: 録音中は画面を暗くしない
    io: input
    type: 真偽値
    visible_when: 常時
    enabled_when: 録音中・一時停止中でなく、ブラウザが Screen Wake Lock に対応しているとき（`navigator.wakeLock` がある）
    required: false
    initial_value: 端末（localStorage voice-paste.keep_screen_on）に覚えた値。無いときはオン。対応しないブラウザではオフ
    action: 変えたら、その値を端末（localStorage voice-paste.keep_screen_on）に覚える
    refs:
      - to: ER-1
        item: "tables[localStorage voice-paste.keep_screen_on]"
        type: references
        when: "『ER 図: ブラウザの端末のデータ』のテーブル「localStorage voice-paste.keep_screen_on」の列と制約を確認するとき。"
    status: planned
  - name: 画面を暗くしない機能に対応しないことの補足
    id: keep_screen_unsupported
    kind: label
    position: 音声送信 > 画面を暗くしない
    description: ブラウザが Screen Wake Lock に対応しないため、チェックを押せないこと。チェックの aria-describedby で読み上げにも伝える。録音中にチェックが押せない理由は、用語集のプリセットの選択欄の「録音中は変更不可」で伝わるため出さない
    label: このブラウザでは使えません。録音はできます
    visible_when: '`navigator.wakeLock` が無いとき'
    status: planned
  - name: 一覧の取得失敗のメッセージ
    id: preset_fetch_notice
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 用語集のプリセットの一覧を取得できなかったこと（role=status）。送信は続けられるため、注意ではなく通知の色にする。取得し直すのは画面を開き直したとき。選択欄の aria-describedby で読み上げにも伝える
    label: プリセットの一覧を取得できませんでした。送信した音声は、PC の設定で選択中のプリセットで補正します。
    visible_when: 画面を開いたときの一覧の取得が失敗したとき（届かない・403・5xx）
    source: 用語集のプリセットの一覧を返却する の応答のステータス
    status: planned
  - name: 一覧に無いプリセットのエラー
    id: preset_not_found_error
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 選んだプリセットが PC の設定から削除済みで、音声を受け付ける が 400 を返却したことを、見出しと本文で選択欄のすぐ下に出す（role=alert）。glossary_preset を付けた送信の 400 をこのエラーとして扱う。出す前に一覧を取得し直し、選択と端末に覚えた名前を「設定に従う」へ戻す。録った音声は端末内の音声に「未送信」で残る。次の送信か録音を始めると削除する
    visible_when: 直前の送信が一覧に無いプリセットで 400 になったとき
    source: 音声を受け付ける の応答のステータス
    action_ref: IF-5#
    status: planned
    notes:
      エラーの表示: '見出しは「選択したプリセットが見つかりません」。選んだファイル: 「「{名前}」は PC の設定から削除済みのため、{ファイル名} は未送信です。一覧を再取得し、「設定に従う」に戻しました。プリセットを確認して、ファイルをもう一度選択してください。」。録った音声: 「「{名前}」は PC の設定から削除済みのため、録った音声は未送信です。一覧を再取得し、「設定に従う」に戻しました。プリセットを確認して、再送信してください。」'
  - name: 送信中のファイルのプリセット
    id: file_sending_preset
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 送信しているファイルに付けた用語集のプリセット。送信した時点の選択欄の表示文言をそのまま出し、次に送信する音声の選択と分ける。ファイル名が長いと省かれるため、送信中のファイル名とは別の行に出す
    io: output
    visible_when: 選んだファイルを送信している間
    display_format: プリセット「{名前}」（例 プリセット「下書き」）
    status: planned
  - name: 一時停止・再開ボタン
    id: pause_button
    kind: button
    position: 音声送信 > 録音中の表示
    description: 録音中は「一時停止」で MediaRecorder を `pause()` し、一時停止中は「再開」で `resume()` する。録音停止・送信ボタンの右に配置し、幅が 30rem 未満の録音中の表示では破棄ボタンと 2 行目に同じ幅で並べる
    label_display: icon_and_text
    confirm: none
    icon: pause（一時停止中は play）
    label: 一時停止（一時停止中は「再開」）
    visible_when: 録音中・一時停止中
    action: 録音中なら一時停止中の表示に替え、一時停止中なら録音中の表示に戻す
    status: planned
  - name: 破棄ボタン
    id: discard_button
    kind: button
    position: 音声送信 > 録音中の表示
    description: 録った音声を送信せず、端末（IndexedDB）にも残さずに録音を止める確認を開く。取り消せない操作のため文字を警告の色にする。一時停止・再開ボタンの右に配置する
    label_display: icon_and_text
    confirm: dialog
    icon: trash-2
    label: 破棄
    visible_when: 録音中・一時停止中
    action_ref: SCR-4#
    status: planned
  - name: 続きを読む・折りたたむボタン
    id: result_toggle
    kind: button
    position: 結果 > 結果の 1 件
    description: 起こした文字のすぐ下の左に出し、起こした文字の全文と先頭の 5 行を切り替える。`aria-expanded` と `aria-controls`（起こした文字）で開閉を伝え、開くと文言を「折りたたむ」、山形を上向きに替える。開閉に動きは付けない
    toggle_state: expanded
    label_display: icon_and_text
    confirm: none
    icon: chevron-down（全文を出した後は上向き）
    label: 続きを読む（全文を出した後は「折りたたむ」）
    visible_when: state が done で、起こした文字の表示が 5 行を超えるとき
    action: 起こした文字の全文と先頭の 5 行を切り替える
    status: planned
