端末の設定の配信元の設定ファイルの書き換え:
  説明: project-index・dev-docs・alias-inject の端末の設定（~/.config/project-index/settings.yaml・~/.config/dev-docs/settings.yaml・~/.config/alias-inject/settings.yaml）で、配信元 voice-input の設定ファイルとして /home/shuhei2441/repo/voice-paste/.claude/worktrees/develop/dev-docs.yaml を指す値を、同じフォルダの project-index.yaml へ書き換える。書き換える前に同じ場所へ {ファイル名}.bak-{YYYYMMDD-HHMMSS} のバックアップを取り、ほかの行は変えない（project-index は端末の設定の API の PATCH /settings/sources/voice-input で書き換えて配信元を再読み込みさせ、API が保存の前のファイルを残さないためバックアップは取らない）。develop の worktree に project-index.yaml が入ったことを確かめてから書き換える
