title: "ブラウザで結果を受け取る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く。常駐アプリは pytest のプロセスの中で起動し、文字起こしのエンジンは決めた文を区間ごとに進みを返しながら返す関数に差し替える
      - name: 受け付けたジョブ
        description: ブラウザから音声を送る でジョブを 1 件受け付けている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant LS as 端末（localStorage）
        participant API as API のサーバー

        loop 終わるまで
          PG->>API: 結果を取りに行く（job_id）
          API-->>PG: state（queued / running）・progress
          PG->>PG: 待ちの件に進み具合を出す
        end
        PG->>API: 結果を取りに行く（job_id）
        API-->>PG: state（done）・text
        PG->>LS: 結果を保存日時つきで残す（直近 10 件）
        PG->>PG: 待ちの件を起こした文字に置き換える
        U->>PG: コピーボタンを押す
        PG->>PG: 起こした文字をクリップボードへ入れる
      ```
    expected:
      - 待ちの間、件に進み具合が出ている
      - 終わると、件に用語集で補正した文字が出ている
      - 端末（localStorage）に結果が保存日時つきで残っている
      - コピーボタンで、その文字がクリップボードに入る
    test: test_normal
  - name: 正常シナリオ（結果を消す）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く
      - name: 残っている結果
        description: 端末（localStorage）に結果を 2 件入れておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant LS as 端末（localStorage）

        U->>PG: 1 件の消すボタンを押す
        PG->>PG: 削除の確認のモーダルを出す
        U->>PG: 消す
        PG->>LS: その件を消す
        PG->>PG: 一覧からその件を外す
      ```
    expected:
      - 一覧と端末（localStorage）からその 1 件だけが消え、もう 1 件は残っている
    test: test_normal_when_delete_result
  - name: 正常シナリオ（残す件数を超える）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開き、文字起こしのエンジンは決めた文を返す関数に差し替える
      - name: 残っている結果
        description: 端末（localStorage）に結果を 10 件入れておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant PG as 画面（ブラウザ）
        participant LS as 端末（localStorage）
        participant API as API のサーバー

        PG->>API: 結果を取りに行く（job_id）
        API-->>PG: state（done）・text
        PG->>LS: 結果を残し、いちばん古い 1 件を消す
      ```
    expected:
      - 端末（localStorage）の結果が 10 件のままで、新しい件が先頭にあり、いちばん古い件が消えている
    test: test_normal_when_over_result_limit
  - name: 正常シナリオ（期限を過ぎた件を消す）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開く
      - name: 古い件
        description: 端末に、保存日時が期限より前の結果 1 件と音声 1 件、期限内の結果 1 件を入れておく
        notes: 期限は非機能要件の決定値
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as ユーザー
        participant PG as 画面（ブラウザ）
        participant LS as 端末（localStorage）
        participant DB as 端末（IndexedDB）

        U->>PG: 画面を開く
        PG->>LS: 期限を過ぎた結果を消す
        PG->>DB: 期限を過ぎた音声を消す
        PG->>PG: 残った結果を一覧に出す
      ```
    expected:
      - 期限を過ぎた結果と音声が端末から消えている
      - 期限内の結果は一覧に出ている
    test: test_normal_when_expired
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: Windows の Edge で画面を開き、文字起こしのエンジンは失敗を返す関数に差し替える
      - name: 受け付けたジョブ
        description: 画面で録った音声を送り、ジョブを 1 件受け付けている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant PG as 画面（ブラウザ）
        participant DB as 端末（IndexedDB）
        participant API as API のサーバー

        PG->>API: 結果を取りに行く（job_id）
        API-->>PG: state（failed）・error
        PG->>PG: 件に失敗を出す
        PG->>DB: 残した音声はそのままにする
      ```
    expected:
      - 件に文字起こしに失敗したことが出ている
      - 端末（IndexedDB）に録った音声が残り、送り直しボタンとダウンロードボタンを押せる
      - 端末（localStorage）に失敗した件は残っていない
    test: test_error_when_transcription_failed
  - name: 異常シナリオ（ジョブが見つからない）
    setup:
      - name: Mock
        description: 常駐アプリは pytest のプロセスの中で起動し、Windows の Edge で画面を開く
      - name: 忘れられたジョブ
        description: ジョブを受け付けた後、結果を取りに行く前に常駐アプリを起動し直す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant PG as 画面（ブラウザ）
        participant API as API のサーバー

        PG->>API: 結果を取りに行く（job_id）
        API-->>PG: 404（problem+json）
        PG->>PG: 件に結果が見つからないことを出し、取りに行くのをやめる
      ```
    expected:
      - 結果の取得が `404` の problem+json で返っている
      - 件に結果が見つからないことが出て、画面が取りに行くのをやめている
      - 端末（IndexedDB）に録った音声が残っていれば、送り直せる
    test: test_error_when_job_not_found
lead: 外の端末のブラウザの画面が、受け付けた `job_id` で進み具合と結果を取りに行き、結果を端末に残してコピー・削除できるようにする。
issue: 92
primary_actor: ユーザー（外の端末のブラウザ）
trigger: 画面が音声の送信の `202`（`job_id`）を受け取るか、ユーザーが画面を開き直す
preconditions:
  - ブラウザから音声を送る で、音声が受け付けられている（開き直すときを除く）
