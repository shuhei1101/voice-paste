title: "開発コマンド"
categories:
  - name: 取り込み後の追従（pull 後）
    commands: |-
      1. `uv.lock` どおりに環境を合わせる

      ```bash
      uv.exe sync --frozen
      ```
    effects: '`.venv/` を `uv.lock` のバージョンに再作成する。依存のダウンロードが要り、`.venv/` が無いときは時間がかかる'
    verification:
      state: 済
      date: '2026-10-20'
      detail: '`.venv/` の無い作業ツリーで流し、`uv.lock` どおりに依存が入ることを確かめた'
  - name: 依存の追加・更新・削除
    commands: |-
      1. 依存を追加する

      ```bash
      uv.exe add {パッケージ}
      ```

      2. dev グループへ追加する

      ```bash
      uv.exe add --group dev {パッケージ}
      ```

      3. 追加した依存を上げる（`uv.lock` だけを書き換え、環境へは入れない。環境へ入れるときは『取り込み後の追従（pull 後）』を流す）

      ```bash
      uv.exe lock --upgrade-package {パッケージ}
      ```

      4. 依存を外す（dev グループから外すときは `--group dev` を付ける）

      ```bash
      uv.exe remove {パッケージ}
      ```
    effects: '`uv add` / `uv remove` は `pyproject.toml` と `uv.lock` を書き換え、環境にも入れる・外す。`uv lock --upgrade-package` は `uv.lock` だけを書き換える'
    verification:
      state: 済
      date: '2026-10-20'
      detail: 作業ツリーで `tomli-w` を使い、`uv.exe add`・`uv.exe add --group dev`・`uv.exe lock --upgrade-package`・`uv.exe remove`（dev グループからも）が通ることを確かめた。流した後に `pyproject.toml` と `uv.lock` を元に戻し、commit していない
  - name: ビルド・生成
    prerequisites:
      - Node.js（LTS）と npm を入れておく
      - リポジトリの直下で `npm ci` を流し、`package-lock.json` のバージョンで `typescript`・`eslint`・`typescript-eslint` を `node_modules/` に入れる
    commands: |-
      1. 外の端末の画面のスクリプト（`src/voice_paste/server/web/assets/app.ts`）から、同じフォルダの `app.js` を生成する（生成した `app.js` はコミットする）

      ```bash
      npm run build
      ```

      2. 開発中に保存ごとに再生成する

      ```bash
      npm run dev
      ```

      3. 開発の道具を追加・更新する（`package.json` と `package-lock.json` を書き換える）

      ```bash
      npm install --save-dev {パッケージ}
      ```
    verification:
      state: 済
      date: '2026-10-24'
      detail: 'PR #171 の作業ツリー（WSL・Node.js v24.14.0・npm 11.9.0）で、`node_modules/` を削除してから `npm ci` で `package-lock.json` どおりに入れ、`npm run build` が `assets/app.ts` から `assets/app.js` を生成し（再実行しても差分が出ない）、`npm run dev` が `Found 0 errors. Watching for file changes.` で保存を待つことを確かめた。`npm install --save-dev typescript eslint typescript-eslint @eslint/js` で `package.json` と `package-lock.json` が書き換わることも確かめた'
  - name: 環境構築（クローン直後）
    prerequisites:
      - クローンしたリポジトリの直下で流す
    commands: |-
      1. `uv.lock` どおりに `.venv/` を作る（dev グループを含む）

      Windows:

      ```bash
      uv.exe sync --frozen
      ```

      Ubuntu 24.04:

      ```bash
      uv sync --frozen
      ```
    effects: '`.venv/` を `uv.lock` のバージョンで作る。依存のダウンロードが要る。Ubuntu では `pycaw`・`comtypes`・`pywin32` は `sys_platform == "win32"` の条件で入らない'
    verification:
      state: 済
      date: '2026-10-28'
      detail: 検証環境の VM（Ubuntu 24.04・uv 0.13.6）の新しいフォルダに作業ツリー（feat/platform/linux-startup）の追跡ファイルを置いて `uv sync --frozen` を流し、成功することを確かめた。`pycaw`・`comtypes`・`pywin32` は入らず、dev グループの `pytest`・`import-linter` は入る。続けて VM で単体テスト（684 passed、21 skipped）と `lint-imports`（4 契約とも KEPT）を流した
  - name: 起動・停止
    prerequisites:
      - Ubuntu 24.04 の Xorg のセッションの端末で、『環境構築（クローン直後）』を流しておく
      - Qt の xcb プラグインが使う `libxcb-cursor0` を `sudo apt install libxcb-cursor0` で入れておく
    commands: |-
      1. 常駐サービスを起動する

      ```bash
      .venv/bin/python -m voice_paste
      ```
    effects: トレイにアイコンを出し、ホットキーを受け付け、録音の開始を待つ。同じ設定の置き場所で 2 つ目を起動すると、前のプロセスに終わるよう頼んでから起動する
    verification:
      state: 済
      date: '2026-10-28'
      detail: 検証環境の VM で、`--data-dir` に一時のフォルダ（`settings.toml` で `transcription.local_whisper.model = "tiny"`）を渡して `.venv/bin/python -m voice_paste` を起動し、エンジン・API・ホットキーが立ち上がること（ログの `常駐サービスを始めた`）を確かめた。同じ設定の置き場所で 2 つ目を起動すると、`前の常駐サービスに終わるよう頼んだ` の約 0.8 秒後に前のプロセスが終わり（ホットキーの受付は 0.5 秒の上限で手放した）、2 つ目が排他を取って起動することを確かめた。VM に `libxcb-cursor0` が入っていないため、deb を `apt-get download` で取得して `dpkg -x` で展開し、`LD_LIBRARY_PATH` で読ませて起動した（VM のパッケージは変えていない）。VM の Xorg のセッションは画面のロック中で GNOME のトレイの拡張が無効のため、トレイのアイコンは VM 内の Xephyr に `stalonetray`（XEmbed のトレイの受け手。deb を展開して使用）を立てて確かめ、緑のマイクのアイコンが出ることを撮影した。GNOME の実際のトレイ（`ubuntu-appindicators`）では確かめていない
lead: クローン直後に環境を作る・常駐サービスを起動するとき、依存を追加する・上げる・外すとき、取り込んだ変更に手元の環境を追従させるときに打つコマンド。
prerequisites:
  - リポジトリの直下で、Windows では Windows の uv（WSL からは `uv.exe`）、Ubuntu 24.04 では Linux の uv（`uv`）で流す。各分類のコマンドは Windows の uv で書き、Ubuntu では `uv.exe` を `uv` に読み替える
