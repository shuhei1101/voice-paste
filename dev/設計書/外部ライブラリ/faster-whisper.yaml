title: "faster-whisper"
kind: "ライブラリ"
version:
  current: 1.2.1
  checked_on: '2026-09-30'
  source: pyproject.toml（~=1.0）と uv.lock の版
  pinning: 互換リリースで固定（~=1.0）
catalogs:
  - name: API
    version: 1.2.1
    entries:
      - name: WhisperModel
        kind: クラス
        purpose: モデル名・デバイス・量子化・CPU スレッド数・ワーカー数を指定してモデルを読み込む（手元に無ければ Hugging Face Hub から取得する）
      - name: WhisperModel.transcribe
        kind: メソッド
        purpose: 音声ファイルを言語・ビーム幅・候補数・温度・VAD・前の区間の文脈・無音の閾値・手がかりの語（hotwords）を指定して文字に起こし、区間ごとの文字と音声の長さを返す
        params:
          - name: hotwords
            type: str | None
            required: false
            default: None
            description: 書き方を寄せたい語の並び。録音の長さによらず 30 秒のウィンドウごとに、頭に半角の空白を足して前の文脈の枠へ入る
            constraints: トークンが 224 以上なら先頭の 223 トークン（`max_length // 2 - 1`、`max_length = 448`）に切られる（v1.2.1 の transcribe.py L1542-1548）
            notes: prefix を渡すと使われない。渡すと句読点が付く・区間ごとの改行がまとまる・口癖が一部消える、など書き方も変わる（#99 の PoC）
      - name: assets/silero_vad_v6.onnx
        kind: ファイル
        purpose: 同梱の Silero VAD のモデル。常駐アプリのプロセスが onnxruntime で直接開き、連続録音の話し声を判定する
        description: '常駐アプリのプロセスでは faster_whisper を import しない（パッケージの `__init__` が ctranslate2・CUDA の DLL を読み、方針で子プロセスに隔離したものが常駐に入るため）。`importlib.util.find_spec("faster_whisper")` の `submodule_search_locations` でパッケージの場所だけを引き（`__init__` を実行しない）、`assets/silero_vad_v6.onnx` を開く。ファイル名は faster-whisper の `vad.get_vad_model` が開くものと同じ（1.2.1）で、版を上げるときは名前が変わっていないかを確かめる。入力は input（(1, 576) の float32）・h・c（(1, 1, 128)）、出力は確率・h・c（PoC #80 で確かめた形）。'
        refs:
          - dev/設計書/外部ライブラリ/onnxruntime#
        status: planned
        introduced:
          pr: 78
lead: CTranslate2 で Whisper のモデルを動かし、音声を文字に起こすライブラリ。
purl: pkg:pypi/faster-whisper
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/whisper/worker.py
  - src/voice_paste/integrations/vad/adapter.py
upstream: SYSTRAN/faster-whisper
verification:
  state: 済
  date: '2026-10-01'
  detail: ワーカーのサブプロセスで WhisperModel（large-v3・cuda・int8）を読み込み、履歴の録音 10 件を beam_size=10・VAD ありで起こして文字が返ることを確かめた
license: MIT（商用利用可）
official_url: https://github.com/SYSTRAN/faster-whisper
issues:
  - title: av 19 で録音を読むときに TypeError になる
    summary: av 19 では faster-whisper 1.2.1 の av.open(..., metadata_errors="ignore") が TypeError になり、文字起こしが毎回失敗する
    occurred_on: '2026-10-05'
    state: 回避策あり
    description: |-
      av 19.0.1 が入った環境で faster-whisper 1.2.1 に録音を渡すと、録音を読む `av.open(input_file, mode="r", metadata_errors="ignore")` が `TypeError: open() got an unexpected keyword argument 'metadata_errors'` で失敗し、文字起こしが毎回失敗する。
      faster-whisper 1.2.1 は `av>=11` と下限しか宣言しないため、依存を入れ直すと最新の av 19 が入る。
      av 18.1.0 では同じ録音が読める（faster-whisper 1.2.1 と av 18.1.0 / 19.0.1 の組で `decode_audio` を呼んで確かめた）。
      上流では master で修正済み（コミット 2ce7f9d）だが、リリースは 1.2.1 のまま（2026-10-05 時点）。
    conditions:
      - faster-whisper 1.2.1
      - av 19 以降（19.0.1 で確認）
    workarounds:
      - method: '`pyproject.toml` の `dependencies` に `av>=11,<19` を宣言する'
        result: 新しく作った venv でも av 19 未満が入り、文字起こしが通る。faster-whisper が av 19 に対応した版を出すまで av の上限を外せない
        recommended: true
    upstream_issue: https://github.com/SYSTRAN/faster-whisper/issues/1589
    refs:
      - dev/設計書/外部ライブラリ/av#
