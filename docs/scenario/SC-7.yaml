lead: 起こした文字を、ホットキーから始めた録音は選んだ出力先へ、API から始めた録音は呼び出し元のエンドポイントへ届ける単一ユースケース。
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: 録音を文字に起こす で空でない文字が起きるか、API から始めた録音で空の文字・文字起こしの失敗が渡される
preconditions:
  - ホットキー・トレイから始めた録音では、貼り付けたいアプリの入力欄にフォーカスがある（貼り付けはその時点のアクティブなウィンドウへ入る）
  - API から始めた録音では、開始で指定された返送先のエンドポイントがある
notes:
  出力先の選ばれ方: |-
    ホットキー・トレイから始めた録音は、設定でオンにした固定の出力先（貼り付けて送信・貼り付けのみ・コピーのみ）と、有効にしたカスタムプリセット（ブラウザ添付・エンドポイントへ送信）のうち、録音する で選んだものへ届ける。
    API から始めた録音は、呼び出し元へ返す出力先だけを使い、そのほかの出力先とプリセットはオンでも通さない。
    文字起こし中の表示が出ている間は、届け始めるまで、設定でオンにした固定の出力先へ切り替えられ、切り替えた先へ届ける（カスタムプリセットで確定した録音は切り替えない。カスタムプリセットへは切り替えない）。
  クリップボードに書けないとき: |-
    ほかのアプリがクリップボードを開いたままで書けないときは、届けられなかったことをユーザーに通知し、ログに理由を書く。
    録音と起こした文字は履歴に残っている。
    実機で決定的に起こせないため、シナリオにはしていない。
  E2E のテスト: |-
    E2E の常駐アプリの起こし方と差し替えは、録音する の補足『E2E のテスト』と同じ。
    貼り付け先の入力欄に入ることは、クリップボードの文字と、控えた貼り付けのキー・Enter・Enter に添えた修飾キーで確かめる。
    ブラウザ添付のプリセットは、ブラウザを開く呼び出しを渡された URL を控えるものに差し替え、Microsoft Edge を開かない。アプリのウィンドウとして開くことは控えた URL で、入力欄に入って送信されることはクリップボードと控えたキーで確かめる。
    コピーの完了の通知が出たことは通知のログで確かめる。
    「Enter と一緒に修飾キーを押す」の「Ctrl が押されたままになっていない」は E2E で確かめない（キーを送信する部品の単体テストが確かめる）
  コピーし直せないとき: |-
    コピーの完了の通知を押してもクリップボードに書けないときは、届けられなかったことをトレイに通知し、ログに理由を書く。
    実機で決定的に起こせないため、シナリオにはしていない。
    通知は数秒で畳まれ通知センターに残らないため、畳まれた後はコピーし直せない（Win+V のクリップボードの履歴で代える）。
  届け始めた後の切り替え: |-
    届け始めた後の切り替えは受けず、届けている出力先のまま届ける。
    実機で決定的に起こせないため、シナリオにはしていない。
  Linux の端末アプリへの貼り付け: |-
    Linux では、貼り付けのキーを送信する直前にアクティブなウィンドウを見て、端末アプリなら設定の貼り付けのキーに代えて `Ctrl+Shift+V` を送信する（端末アプリでは `Ctrl+V` が貼り付けにならない）。
    「貼り付けて送信」も同じキーで貼り付けてから Enter を送信する。
    Windows は、貼り付け先によらず設定の貼り付けのキーを送信する。
    Xorg のセッションは X の WM_CLASS を読む。Wayland のセッションは GNOME にアクティブなウィンドウを読む標準のインターフェースが無いため、ユーザーが入れた GNOME Shell の拡張 Focused Window D-Bus から `wm_class`・`wm_class_instance` を D-Bus で読み、Xorg と同じ端末アプリの一覧と照らす。
    拡張が入っていない・無効で読めないときは、貼り付け先によらず設定の貼り付けのキーを送信する（エラーにしない）。
    このシナリオの E2E は、Linux で E2E を動かす仕組み（[#199](https://github.com/shuhei1101/voice-paste/issues/199)）ができるまで持たない。
  Wayland のセッションの貼り付け: |-
    Linux の Wayland のセッションでは、クリップボードへ XWayland の `xclip` で書き、貼り付けのキーと Enter（修飾キーつき）を uinput の仮想のキーボードから送信する。
    ネイティブの Wayland のアプリにも XWayland のアプリにも同じに届く（GNOME が X のクリップボードを Wayland のクリップボードへ渡す）。
    `wl-copy` は、GNOME がクリップボードを外から書くプロトコルを持たないため書くたびに貼り付け先のフォーカスを取り、貼り付けのキーが落ちるため使わない。
    「コピーのみ」で書いた文字は、常駐サービスの終了後も貼り付けられる。
    Wayland のセッションのシナリオの E2E は、Linux で E2E を自動で流す仕組み（[#219](https://github.com/shuhei1101/voice-paste/issues/219)）ができるまで持たず、検証環境の VM で確かめる。
