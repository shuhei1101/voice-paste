title: "常駐アプリ / 共通"
lead: どの層からも使う設定のモデル・ログ・例外・置き場所のパスと、feature の間を渡る型を持つ。ほかの層に依存しない。
directory: |-
  ```
  src/voice_paste/shared/
  ├── __init__.py
  ├── settings.py       # 設定のモデル（pydantic）と出力先の設定の共通の親・設定のモデルの組み立て、TOML の読み書き（tomlkit）
  ├── logger.py         # 標準の logging の設定。日付ごとのファイルと保持期間での削除
  ├── errors.py         # 例外の階層
  ├── constants.py      # アプリ名と置き場所のパス（platformdirs）
  ├── os_kind.py        # 動いている OS の判定（OS ごとの実装・既定値を選ぶ唯一の場所）
  └── types.py          # feature の間を渡る型（入口・録音・文字起こしの結果・用語集の行）
  ```
enums:
  - name: Entry
    title: 入口
    container: shared/types.py
    usecase: 共通
    summary: セッションを始めた入口。セッションと出力先が使う
    values:
      - value: hotkey
        title: ホットキー
        description: 録音開始のホットキー
      - value: tray
        title: トレイ
        description: トレイのメニュー
      - value: api
        title: API
        description: POST /sessions
    status: implemented
  - name: Preset
    title: カスタムプリセット
    container: shared/settings.py
    usecase: 共通
    summary: プリセットの種類ごとの設定の判別共用体（`Annotated[... | ..., Field(discriminator="kind")]`）
    description: |-
      種類を追加するときは、種類の設定のモデルを 1 つ作ってここに追加し、出力先の PRESET_KINDS と画面の種類の名前に登録する。
      セッションは確定の操作で選んだプリセットをこの型のコピーとして持ち、出力先へ渡す。
    values:
      - value: browser
        title: ブラウザ添付
        description: BrowserPreset
      - value: endpoint
        title: エンドポイントへ送信
        description: EndpointPreset
    refs:
      - dev/設計書/設定/常駐アプリ#settings[presets[].kind]
    status: implemented
  - name: EnterModifier
    title: Enter と一緒に押す修飾キー
    container: shared/types.py
    usecase: 起こした文字を届ける
    summary: 貼り付けて送信が Enter と一緒に押す修飾キー（`Literal["ctrl", "alt", "shift"]`）。出力先の設定と integrations/keyboard が使う（integrations は features を import できないため shared に置く）
    values:
      - value: ctrl
        title: Ctrl
        description: Ctrl キー
      - value: alt
        title: Alt
        description: Alt キー
      - value: shift
        title: Shift
        description: Shift キー
    refs:
      - dev/設計書/設定/常駐アプリ#settings[outputs[].enter_modifiers]
    status: planned
  - name: OsKind
    title: OS の種類
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS の判定
    summary: 動いている OS。main.py の配線が OS ごとの実装を、設定のモデルが OS ごとの既定値を選ぶのに使う
    description: '`enum.StrEnum`。'
    values:
      - value: windows
        member: WINDOWS
        title: Windows
        description: '`sys.platform` が `win32`'
      - value: linux
        member: LINUX
        title: Linux
        description: '`sys.platform` が `win32` 以外（対応するのは Ubuntu 24.04 の Xorg のセッション）'
    status: planned
data_models:
  - name: Recording
    title: 録音
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 止めた録音の音と形式。録音・セッション・履歴が使う
    properties:
      - name: samples
        type: numpy.ndarray
        description: モノラルの 16 bit の音
      - name: sample_rate
        type: int
        description: サンプルレート（Hz）
      - name: duration_sec
        type: float
        description: 録音の長さ（一時停止の間を除く）
    status: implemented
  - name: TranscriptionOutcome
    title: 文字起こしの結果
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 出力先へ渡す結果。セッションと出力先が使う
    properties:
      - name: session_id
        type: str
        description: セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated", "completed"]
        description: 結果の種類。completed は連続録音を完了し、全ての区間を届け終えたときだけ
      - name: text
        type: str
        description: 用語集で補正した文字。空・失敗・打ち切り・完了は空文字
      - name: error
        type: str | None
        description: 失敗の理由
      - name: segment_number
        type: int | None
        default: None
        description: 連続録音の区間の通し番号（1 始まり）。連続録音の transcribed・failed だけが持つ
      - name: segment_count
        type: int | None
        default: None
        description: 連続録音で区切った区間の数。連続録音の終わり（completed・truncated、区切りに失敗して止めたときの failed）だけが持つ
    status: implemented
  - name: AppPaths
    title: 置き場所のパス
    container: shared/constants.py
    usecase: 共通
    role: DTO
    summary: 設定・履歴・ログ・一時の音声・トークン・画面の画像の置き場所
    description: |-
      resolve_app_paths で作る。
      既定は platformdirs で、Windows は `%APPDATA%\voice-paste\`（設定）と `%LOCALAPPDATA%\voice-paste\`（それ以外）、Linux は `~/.config/voice-paste/`（設定）と `~/.local/share/voice-paste/`（それ以外）を引く。
      データの置き場所（`--data-dir`）を渡したときは、全てをその下に置く。E2E・非機能要件テストはこれで普段使いの置き場所に触れない。
      `@dataclass(frozen=True, slots=True, kw_only=True)`。
    properties:
      - name: settings_file
        type: Path
        description: '`%APPDATA%\voice-paste\settings.toml`（Linux は `~/.config/voice-paste/settings.toml`。データの置き場所を渡したときは `{data_dir}\settings.toml`）'
      - name: history_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\history\`（Linux は `~/.local/share/voice-paste/history/`。`{data_dir}\history\`）'
      - name: log_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\log\`（`{data_dir}\log\`）'
      - name: tmp_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\tmp\`（`{data_dir}\tmp\`。履歴を残さないときの一時の音声）'
      - name: token_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\api_token`（`{data_dir}\api_token`。起動ごとのトークンとポート）'
      - name: ui_image_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\ui\`（`{data_dir}\ui\`。選択欄の開くマーカーの SVG）'
      - name: lock_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\instance.lock`（Linux は `~/.local/share/voice-paste/instance.lock`。`{data_dir}\instance.lock`。Linux の単一インスタンスのロックファイル。Windows では使わない）'
      - name: openai_api_key_file
        type: Path
        description: '`%APPDATA%\voice-paste\secrets\openai_api_key`（Linux は `~/.config/voice-paste/secrets/openai_api_key`。`{data_dir}\secrets\openai_api_key`）。settings.toml と同じフォルダの下。ユーザーが置き、常駐アプリは読むだけで作らない'
    refs:
      - dev/設計書/外部ライブラリ/platformdirs#
    status: implemented
  - name: Settings
    title: 設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: settings.toml の全体。項目ごとに範囲・説明・再起動が要るかのマーカーを持ち、設定画面の欄はこのモデルから組み立てる
    inherits: pydantic.BaseModel
    description: |-
      キーの一つ一つ（型・既定値・範囲・反映）は設計書『設定』の settings.toml の行が持つ。
      まとまりのモデルも全て `pydantic.BaseModel` で、どれも `model_config = ConfigDict(extra="forbid")` にして知らないキー（書き間違い）を断る。
      各項目は `Field(description=..., json_schema_extra={"reload": "immediate" | "restart"})` で再起動が要るかのマーカーを持つ。
      出力先ごとの設定のモデルは出力先が持ち（shared は features を import しない）、アプリが使う設定のモデルは build_settings_model がこのモデルを継いで組み立てる（main.py の SETTINGS_MODEL）。組み立てたモデルでは全ての項目に既定値があり、`SETTINGS_MODEL()` が既定の設定になる。
      設定を受ける関数・画面は型としては Settings を使い、既定値・検証には受けた設定のモデル（`type(settings)`）を使う。
    properties:
      - name: transcription
        type: TranscriptionSettings
        description: 使うエンジンと、エンジンごとの設定
      - name: recording
        type: RecordingSettings
        description: 録音中の音量・画面を出さない設定
      - name: hotkeys
        type: HotkeySettings
        description: 録音の開始・一時停止・取り消しのホットキー（確定のホットキーは出力先ごとに持つ）
      - name: keyboard
        type: KeyboardSettings
        description: 貼り付けのキー
      - name: outputs
        type: list[OutputSettingsBase]
        description: 出力先ごとのオン・オフ・確定のホットキー・出力先ごとの設定。ID は重ならない。このモデルでは既定が空で、build_settings_model が出力先のモデルの判別共用体（`id` で見分ける）と既定の一覧に差し替える。値は `SerializeAsAny` で各出力先のモデルの項目ごと書き出す
      - name: history
        type: HistorySettings
        description: 履歴を残すか・保持期間
      - name: logging
        type: LoggingSettings
        description: ログのレベル・保持期間
      - name: ui
        type: UiSettings
        description: 録音の画面の出し方
      - name: glossary_path
        type: Path | None
        default: None
        description: 今までの用語集の CSV。glossaries が空のときだけ使う（resolve_glossaries）。None は設定ファイルと同じフォルダの yogo.csv
      - name: api
        type: ApiSettings
        description: 待ち受けのポート・返送を許すホスト
      - name: presets
        type: list[Preset]
        default: '[]'
        description: カスタムプリセットの一覧。種類ごとの並びが、設定画面のタブと録音の画面のボタンの並びになる
      - name: preset_options
        type: PresetOptions
        description: プリセットの種類ごとのオプション
      - name: output_models
        type: ClassVar[Mapping[str, type[OutputSettingsBase]]]
        default: '{}'
        description: 出力先の ID → 設定のモデル。build_settings_model が組み立てたモデルに入る。設定画面が失敗の場所の判別子の値から出力先のモデルを引く
      - name: glossaries
        type: list[GlossarySettings]
        default: '[]'
        description: 用語集の一覧。並びが設定画面の一覧の並びになる。空のときは glossary_path の CSV を 1 つ目の用語集として扱う。名前が重なる設定は検証で断る（find_glossary_name_overlaps）
      - name: active_glossary
        type: str | None
        default: None
        description: 補正に使う用語集の名前。glossary_presets が空のときだけ、resolve_glossary_presets が「既定」のプリセットの用語集を決めるのに読む（非推奨。設定画面で保存すると None にしてキーを消す）
      - name: hint_presets
        type: list[HintPresetSettings]
        default: '[]'
        description: 表記のヒント（文字起こしの手がかり）のプリセットの一覧。並びが設定画面の一覧と語をつなぐ順になる。キーが無い settings.toml は空の一覧として読む。名前の重なり（find_hint_preset_name_overlaps）と、有効な語をつないだ長さが HINT_MAX_BYTES を超える設定は検証で断る
      - name: edge_phrases
        type: list[EdgePhraseSettings]
        default: DEFAULT_EDGE_PHRASES のコピー
        description: 文頭・文末から削除する文言の一覧。並びが当てる順と設定画面の一覧の並びになる。キーが無い settings.toml は既定の一覧として読む（`default_factory`）。文言が空の行は `field_validator(mode="after")` で一覧から除く（各行の失敗の場所は、除く前の並びの番号のまま）
      - name: glossary_presets
        type: list[GlossaryPresetSettings]
        default: '[]'
        description: 用語集のプリセットの一覧。空なら「既定」の 1 件として読む（resolve_glossary_presets）
      - name: active_glossary_preset
        type: str | None
        default: None
        description: 補正に使う用語集のプリセットの名前。None か一覧に無い名前のときは 1 件目のプリセットを使う（pick_glossary_preset）
    refs:
      - dev/設計書/外部ライブラリ/pydantic#
      - dev/設計書/設定/常駐アプリ#
    status: implemented
  - name: TranscriptionSettings
    title: 文字起こしの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 使うエンジンと、エンジンごとの設定
    inherits: pydantic.BaseModel
    properties:
      - name: engine
        type: Literal["local_whisper", "openai"]
        default: local_whisper
        description: 使う文字起こしのエンジン（文字起こしの EngineName）。反映は restart。設定画面は `json_schema_extra` の choice_labels（local_whisper → ローカルの Whisper・openai → OpenAI API）で選択の欄の名前を出す
      - name: local_whisper
        type: LocalWhisperSettings
        description: ローカルの Whisper の設定
      - name: openai
        type: OpenAISettings
        description: OpenAI API の設定（engine が openai のときだけ使う）
    status: implemented
  - name: LocalWhisperSettings
    title: ローカルの Whisper の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 文字起こしワーカーへ渡すモデル・デバイス・量子化・言語・ビーム幅・温度・VAD
    inherits: pydantic.BaseModel
    properties:
      - name: model
        type: str
        default: large-v3
        description: faster-whisper のモデル
      - name: device
        type: Literal["cuda", "cpu"]
        default: cuda（Linux は cpu。os_default）
        description: 動かすデバイス
      - name: compute_type
        type: Literal["float16", "int8", "float32"]
        default: float16（Linux は int8。os_default）
        description: 計算の精度
      - name: cpu_threads
        type: int
        default: '0'
        description: CPU のスレッド数（0 は自動）
      - name: num_workers
        type: int
        default: '1'
        description: 並列のデコードの数
      - name: beam_size
        type: int
        default: '10'
        description: ビームサーチの幅
      - name: best_of
        type: int
        default: '5'
        description: サンプリングの候補の数
      - name: language
        type: str
        default: ja
        description: 認識する言語
      - name: vad_filter
        type: bool
        default: 'True'
        description: 無音の区間を除くか
      - name: vad_threshold
        type: float
        default: '0.5'
        description: 音声とみなす確信度の閾値
      - name: vad_min_speech_ms
        type: int
        default: '250'
        description: これより短い音を雑音として除く（ミリ秒）
      - name: vad_min_silence_ms
        type: int
        default: '2000'
        description: これ以上の無音で区間を区切る（ミリ秒）
      - name: condition_on_previous_text
        type: bool
        default: 'False'
        description: 前の区間の文字を次の区間の文脈に使うか
      - name: temperature
        type: float
        default: '0.0'
        description: サンプリングの温度
      - name: no_speech_threshold
        type: float
        default: '0.6'
        description: 区間を無音とみなす確信度の閾値
    status: implemented
  - name: RecordingSettings
    title: 録音の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 録音中のシステム音量と、画面を出さない設定
    inherits: pydantic.BaseModel
    properties:
      - name: lower_volume
        type: bool
        default: True（Linux は False。os_default）
        description: 録音中にシステム音量を下げるか。Linux では使わない（音量の外部連携が何もしない実装で、設定画面に出さない）
      - name: volume_percent
        type: float
        default: '50'
        description: 録音中の音量の、録音前の音量に対する割合（0〜100）
      - name: fade_sec
        type: float
        default: '0.5'
        description: 音量を下げる・戻すときにかける秒数（0 以上）
      - name: hide_window
        type: bool
        default: 'False'
        description: 録音の画面も文字起こし中の表示も出さず、トレイとホットキーだけで操作するか
    status: implemented
  - name: HotkeySettings
    title: ホットキーの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 録音の開始・一時停止・取り消しのホットキー（pynput の GlobalHotKeys の書式）
    inherits: pydantic.BaseModel
    properties:
      - name: start
        type: str
        default: <ctrl>+<alt>+d（Linux は <cmd>+<alt>+d。os_default）
        description: 録音を始める
      - name: pause
        type: str
        default: <ctrl>+<alt>+z（Linux は <cmd>+<alt>+z。os_default）
        description: 録音を一時停止・再開する
      - name: cancel
        type: str
        default: <ctrl>+<alt>+q（Linux は <cmd>+<alt>+q。os_default）
        description: 録音を取り消す
    status: implemented
  - name: KeyboardSettings
    title: キーボードの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 貼り付け先へ送信する貼り付けのキー
    inherits: pydantic.BaseModel
    properties:
      - name: paste_key
        type: str
        default: <ctrl>+v
        description: 貼り付けのキーの組み合わせ（pynput の書式）
    status: implemented
  - name: HistorySettings
    title: 履歴の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 履歴を残すかと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: enabled
        type: bool
        default: 'True'
        description: 録音と起こした文字を履歴に残すか
      - name: retention_days
        type: int
        default: '1'
        description: 保持する日数（1 以上）
    status: implemented
  - name: LoggingSettings
    title: ログの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ログのレベルと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        default: INFO
        description: ログのレベル
      - name: retention_days
        type: int
        default: '7'
        description: 日付ごとのログを保持する日数（1 以上）
    status: implemented
  - name: UiSettings
    title: 画面の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 画面の明暗と、録音の画面と文字起こし中の表示の出し方
    inherits: pydantic.BaseModel
    properties:
      - name: theme
        type: Literal["system", "light", "dark"]
        default: system
        description: 画面の明暗。`system` は OS の明暗に従う。反映は immediate。設定画面は `json_schema_extra` の choice_labels（system → Windows の設定に従う・light → ライト・dark → ダーク）でラジオボタンの名前を出す
      - name: topmost
        type: bool
        default: 'True'
        description: 常に最前面に出すか
      - name: position
        type: Literal["center", "top-left", "top-right", "bottom-left", "bottom-right"]
        default: center
        description: 出す位置
      - name: follow_cursor
        type: bool
        default: 'True'
        description: マウスカーソルのあるモニターに出すか
      - name: wave_gain
        type: float
        default: '4'
        description: 波形の振れの大きさ（0 より大きい）
      - name: show_hotkeys
        type: bool
        default: 'True'
        description: 録音の画面のボタンにホットキーを表示するか。反映は immediate。description の最初の文を設定の設計書の `title` にそろえる（設定画面の欄の名前になる）
      - name: transcribing_show_hotkeys
        type: bool
        default: 'True'
        description: 文字起こし中の表示のボタンにホットキーを表示するか。反映は immediate。description の最初の文を設定の設計書の `title` にそろえる（設定画面の欄の名前になる）。項目が無いときは _inherit_transcribing_show_hotkeys が show_hotkeys の値を入れる
    status: implemented
    methods:
      - name: _inherit_transcribing_show_hotkeys
        title: 文字起こし中の表示のホットキーの引き継ぎ
        container: shared/settings.py
        usecase: 設定を変える
        summary: transcribing_show_hotkeys を持たない画面の設定へ、show_hotkeys の値を入れる。UiSettings の確かめ（`model_validator(mode="before")`）
        kind: メソッド
        scope: internal
        args:
          - name: data
            type: Any
            required: true
            passing: positional
            description: 検証の前の画面の設定（settings.toml の `[ui]` の表から作った dict）
        returns:
          type: Any
          description: transcribing_show_hotkeys を入れたコピー。入れる必要が無いときは data をそのまま返す
        process: |-
          1. data が dict でないか、transcribing_show_hotkeys を持つか、show_hotkeys を持たないときは data をそのまま返す（両方を持たないときは既定の True に任せる）
          2. data のコピーに transcribing_show_hotkeys として show_hotkeys の値を入れて返す（data は書き換えない）
        unit_tests:
          - name: test_ui_settings_when_transcribing_show_hotkeys_missing
            case: 正常
            summary: 文字起こし中の表示の項目が無ければ録音の画面の値で読む
            condition: '{"show_hotkeys": false} を UiSettings.model_validate に渡す'
            mock: なし
            expected: show_hotkeys も transcribing_show_hotkeys も False
          - name: test_ui_settings_when_both_show_hotkeys_missing
            case: 正常
            summary: どちらの項目も無ければ既定で読む
            condition: '{} を UiSettings.model_validate に渡す'
            mock: なし
            expected: show_hotkeys も transcribing_show_hotkeys も True
          - name: test_ui_settings_when_transcribing_show_hotkeys_set
            case: 正常
            summary: 文字起こし中の表示の項目があればその値で読む
            condition: '{"show_hotkeys": false, "transcribing_show_hotkeys": true} を UiSettings.model_validate に渡す'
            mock: なし
            expected: show_hotkeys は False、transcribing_show_hotkeys は True
        status: planned
        introduced:
          pr: 131
