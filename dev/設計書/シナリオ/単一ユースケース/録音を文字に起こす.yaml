title: "録音を文字に起こす"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: 用語集
        description: 設定で選んでいる用語集のプリセットに、話す内容で起きる誤変換と正しい表記のオンの行と、別の誤変換のオフの行がある
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant GL as 用語集
        participant TRAY as トレイ
        participant OV as 文字起こし中の表示
        participant WK as 文字起こしワーカー（子プロセス）
        participant HIST as 履歴
        actor U as ユーザー

        SVC->>GL: 選んでいるプリセットの用語集を読み直す（オンの行だけ）
        SVC->>TRAY: 文字起こし中のアイコンにする
        SVC->>OV: 開く（経過と残りの時間・貼り付けたい場所にカーソルを合わせる案内）
        U->>U: 貼り付けたいアプリの入力欄へカーソルを移す
        SVC->>WK: 録音とローカルの Whisper の設定を送る
        loop 区間ごと
          WK-->>SVC: 区間の終わりの時刻
          SVC->>OV: 残りの時間を更新する
        end
        WK-->>SVC: 区間ごとの文字を改行でつないだ結果
        SVC->>SVC: 用語集の誤変換を正しい表記へ置き換える
        SVC->>HIST: 起こした文字を録音と同じ履歴に書き足す
        SVC->>OV: 閉じる
      ```
    expected:
      - 起こした文字の中の用語集の誤変換が、正しい表記に置き換わっている
      - オフの行の誤変換は置き換わらずに残っている
      - 起こした文字が区間ごとに改行で区切られている
      - 履歴に録音と起こした文字がある
      - 文字起こし中の表示が閉じている
      - 起こした文字を届ける へ進む
    notes:
      API から始めた録音: API から始めた録音では、文字起こし中の表示を開かない。それ以外は同じ流れである。
      録音の画面を出さない設定: 録音の画面を出さない設定でホットキー・トレイから始めた録音も、文字起こし中の表示を開かず、トレイのアイコンだけが状態を示す。
      文字起こし中の表示: フォーカスを取らずに開き、貼り付けたいアプリの入力欄からフォーカスを奪わない。
  - name: 正常シナリオ（文字起こしワーカーが落ちる）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: ワーカーの停止
        description: 文字起こしの途中で、文字起こしワーカーの子プロセスを外から終わらせる（やり直しに立てたワーカーは止めない）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant WK2 as 新しい文字起こしワーカー

        SVC->>WK: 録音と設定を送る
        WK--xSVC: 応答の途中で終わる
        SVC->>WK2: 子プロセスを起動し直し、モデルを読み込ませる
        WK2-->>SVC: ready
        SVC->>WK2: 同じ録音をもう一度送る（やり直しは 1 回だけ）
        WK2-->>SVC: 文字起こしの結果
        Note over SVC: 用語集での補正から後は 正常シナリオ と同じ
      ```
    expected:
      - 起こした文字が得られ、起こした文字を届ける へ進む
      - 文字起こしワーカーが新しい子プロセスで動いている
      - 常駐サービスのプロセスが動き続けている
  - name: 異常シナリオ（やり直したワーカーも落ちる）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: ワーカーの停止
        description: 文字起こしの途中で文字起こしワーカーの子プロセスを終わらせ、やり直しに立てたワーカーも終わらせる
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK2 as やり直しのワーカー
        participant WK3 as 次の録音のためのワーカー
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        actor U as ユーザー

        Note over SVC: 最初のワーカーが落ちてやり直すまでは 正常シナリオ（文字起こしワーカーが落ちる） と同じ
        WK2--xSVC: 応答の途中で終わる
        SVC->>WK3: 子プロセスを起動し直し、次の録音に備える
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
        SVC-->>U: 文字起こしに失敗したことを知らせる
      ```
    expected:
      - 文字起こしに失敗したことがユーザーに知らされている
      - 履歴にこの録音が残っている
      - 常駐サービスのプロセスが動き続けている
      - 文字起こしワーカーが新しい子プロセスで動いている
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしの失敗
        description: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        participant LOG as ログ
        actor U as ユーザー

        Note over SVC: 用語集を読み、表示を開くまでは 正常シナリオ と同じ
        SVC->>WK: 録音と設定を送る
        WK-->>SVC: エラー（読めない録音）
        SVC->>LOG: 失敗した理由を書く
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
        SVC-->>U: 文字起こしに失敗したことと理由を知らせる
      ```
    expected:
      - 文字起こしに失敗したことと理由がユーザーに知らされている
      - 履歴にこの録音が残っている
      - 起こした文字を届ける へ進まず、トレイのアイコンが待機中に戻っている
  - name: 異常シナリオ（文字起こしの結果が空）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 何も話さずに録音を確定する
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant OV as 文字起こし中の表示
        participant TRAY as トレイ
        participant LOG as ログ

        Note over SVC: 用語集を読み、表示を開くまでは 正常シナリオ と同じ
        SVC->>WK: 録音と設定を送る
        WK-->>SVC: 空の文字
        SVC->>LOG: 結果が空だったことを書く
        SVC->>OV: 閉じる
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - ダイアログが出ていない
      - 起こした文字を届ける へ進まず、履歴にこの録音が残っている
      - トレイのアイコンが待機中に戻っている
  - name: 正常シナリオ（API から始めた録音の結果が空）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 何も話さずに録音を確定する
      - name: 入口
        description: API から始めた録音を、API の完了で確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 録音と設定を送る（文字起こし中の表示は開かない）
        WK-->>SVC: 空の文字
        SVC->>LOG: 結果が空だったことを書く
        SVC->>SVC: 空の文字を 起こした文字を届ける へ渡す
      ```
    expected:
      - 空の文字が 起こした文字を届ける へ渡されている
      - 履歴にこの録音が残っている
      - ダイアログも文字起こし中の表示も出ていない
  - name: 異常シナリオ（API から始めた録音の文字起こしに失敗）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしの失敗
        description: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
      - name: 入口
        description: API から始めた録音を、API の完了で確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 録音と設定を送る（文字起こし中の表示は開かない）
        WK-->>SVC: エラー（読めない録音）
        SVC->>LOG: 失敗した理由を書く
        SVC->>SVC: 文字起こしの失敗を 起こした文字を届ける へ渡す
      ```
    expected:
      - 文字起こしの失敗が 起こした文字を届ける へ渡されている
      - 履歴にこの録音が残っている
      - ダイアログも文字起こし中の表示も出ていない
    notes:
      同じ扱いになる失敗: やり直したワーカーも落ちたときも同じ扱いになる。
  - name: 異常シナリオ（失敗の通知を押す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしの失敗
        description: 異常シナリオ（文字起こしに失敗） と同じ状態にして失敗の通知を出す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant EXP as エクスプローラー

        Note over TRAY: 失敗を知らせるまでは 異常シナリオ（文字起こしに失敗） と同じ
        U->>TRAY: 畳まれる前の失敗の通知を押す
        TRAY->>EXP: ログの置き場所を開く
      ```
    expected:
      - エクスプローラーでログの置き場所が開いている
      - トレイのアイコンが待機中である
  - name: 正常シナリオ（区間を区切った順に起こす）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: 入口
        description: 連続録音が、前の区間を起こしている間に次の区間を区切る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant Q as 区間の待ち行列
        participant GL as 用語集
        participant WK as 文字起こしワーカー（子プロセス）
        participant HIST as 履歴

        SVC->>Q: 区切った区間を通し番号つきで積む（録音は続ける）
        loop 待ち行列に区間がある間
          Q-->>SVC: 区切った順に 1 つ取り出す
          SVC->>WK: 区間の録音とローカルの Whisper の設定を送る（文字起こし中の表示は開かない）
          WK-->>SVC: 区間の文字
          SVC->>GL: 用語集の誤変換を正しい表記へ置き換える
          SVC->>HIST: 起こした文字を区間の録音と同じ履歴に書き足す
          SVC->>SVC: 区間の文字を通し番号つきで 起こした文字を届ける へ渡す
        end
      ```
    expected:
      - 区間の文字が区切った順に 起こした文字を届ける へ渡されている
      - 区間を起こしている間もマイクの録音が続いている
      - 区間の文字の中の用語集の誤変換が、正しい表記に置き換わっている
      - 履歴に区間ごとの録音と起こした文字がある
      - 文字起こし中の表示が開いていない
  - name: 異常シナリオ（区間の文字起こしに失敗）
    setup:
      - name: Mock
        description: 文字起こしを、通し番号 2 の区間だけ失敗を返すように差し替える
      - name: 入口
        description: 連続録音が 3 つの区間を区切る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        SVC->>WK: 通し番号 2 の区間の録音を送る
        WK-->>SVC: エラー
        SVC->>LOG: 失敗した理由と通し番号を書く
        SVC->>SVC: 区間の失敗を通し番号つきで 起こした文字を届ける へ渡す
        SVC->>WK: 通し番号 3 の区間の録音を送る（連続録音は続ける）
      ```
    expected:
      - 通し番号 2 の区間の失敗が 起こした文字を届ける へ渡されている
      - 通し番号 3 の区間がその後に起こされている
      - 履歴に通し番号 2 の区間の録音が残っている
      - ログに失敗した理由と通し番号が書かれている
    notes:
      同じ扱いになる失敗: やり直したワーカーも落ちたときも同じ扱いになる。
  - name: 正常シナリオ（文字起こしの手がかりを渡す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
      - name: 手がかりのプリセット
        description: 語を 2 つずつ持つ有効な手がかりのプリセットが 2 つと、語を持つ無効の手がかりのプリセットが 1 つある
        notes: 有効なプリセットの語を一覧の順に読点（、）でつなぐ
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      sequenceDiagram
        participant SVC as 常駐サービス
        participant WK as 文字起こしワーカー（子プロセス）

        Note over SVC: 用語集を読み、表示を開くまでは 正常シナリオ と同じ
        SVC->>SVC: 設定の有効な手がかりのプリセットの語を一覧の順に読点（、）でつなぐ
        SVC->>WK: 録音とローカルの Whisper の設定と、つないだ手がかりを送る
        WK->>WK: 手がかりを 30 秒のウィンドウごとに渡して起こす
        WK-->>SVC: 区間ごとの文字を改行でつないだ結果
        Note over SVC: 用語集での補正から後は 正常シナリオ と同じ
    expected:
      - 文字起こしワーカーが受けた要求に、有効な 2 つのプリセットの 4 つの語が一覧の順に読点（、）でつながって載り、無効のプリセットの語が載っていない
      - 文字起こしワーカーが faster-whisper の `transcribe` の `hotwords` に、受けた手がかりをそのまま渡している
      - 履歴に録音と起こした文字がある
      - 起こした文字を届ける へ進む
    notes:
      入口の違い: API から始めた録音と、連続録音の区間ごとの要求にも同じ手がかりを載せる。有効な手がかりのプリセットが無いときは手がかりを載せず、正常シナリオ と同じ要求になる。
      手がかりの効き目: 手がかりが起こした文字にどう効くかは外部ライブラリ『faster-whisper』が持ち、このシナリオは渡した値を確かめる。
    test: test_normal_when_hint
lead: 確定した録音を設定のエンジンで文字に起こし、用語集で補正するまでの単一ユースケース。
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: 録音する で録音を確定する
preconditions:
  - 確定した録音が履歴か一時の音声にある
  - 録音を始めた入口（ホットキー・トレイか API）が分かっている
notes:
  E2E のテスト: 全シナリオが録音を始め、実機のマイクを開くため、E2E のテストを置かない（#65）。録音から届けるまでは、複合ユースケース「声で入力した文字を貼り付ける」「ほかのシステムから録音を文字に起こす」の E2E が、録音のファイルを内部で渡して確かめる
test_file: tests/e2e/単一ユースケース/test_transcribe_recording.py
