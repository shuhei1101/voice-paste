title: "常駐アプリ / 共通"
lead: どの層からも使う設定のモデル・ログ・例外・置き場所のパスと、feature の間を渡る型を持つ。ほかの層に依存しない。
directory: |-
  ```
  src/voice_paste/shared/
  ├── __init__.py
  ├── settings.py       # 設定のモデル（pydantic）、TOML の読み書き（tomlkit）
  ├── logger.py         # 標準の logging の設定。日付ごとのファイルと保持期間での削除
  ├── errors.py         # 例外の階層
  ├── constants.py      # アプリ名と置き場所のパス（platformdirs）
  └── types.py          # feature の間を渡る型（入口・録音・文字起こしの結果）
  ```
enums:
  - name: Entry
    title: 入口
    container: shared/types.py
    usecase: 共通
    summary: セッションを始めた入口。セッションと出力先が使う
    values:
      - value: hotkey
        title: ホットキー
        description: 録音開始のホットキー
      - value: tray
        title: トレイ
        description: トレイのメニュー
      - value: api
        title: API
        description: POST /sessions
    status: implemented
  - name: OutputSettings
    title: 出力先の設定
    container: shared/settings.py
    usecase: 共通
    summary: 出力先ごとの設定の判別共用体（`Annotated[... | ..., Field(discriminator="id")]`）
    description: |-
      呼び出し元へ返す出力先（callback）は API から始めた録音だけが使い、オン・オフを持たないため一覧に置かない。
      既定の一覧は下の 3 件をこの並びで持つ。
      `id = "ai_chat"` の項目は、検証の前に migrate_ai_chat がカスタムプリセットへ読み替えて外す。
    values:
      - value: paste_and_send
        title: 貼り付けて送信
        description: PasteAndSendSettings
      - value: paste_only
        title: 貼り付けのみ
        description: PasteOnlySettings
      - value: copy_only
        title: コピーのみ
        description: CopyOnlySettings
    status: implemented
  - name: Preset
    title: カスタムプリセット
    container: shared/settings.py
    usecase: 共通
    summary: プリセットの種類ごとの設定の判別共用体（`Annotated[... | ..., Field(discriminator="kind")]`）
    description: |-
      種類を足すときは、種類の設定のモデルを 1 つ作ってここに足し、出力先の PRESET_KINDS と画面の種類の名前に登録する。
      セッションは確定の操作で選んだプリセットをこの型の写しとして持ち、出力先へ渡す。
    values:
      - value: browser
        title: ブラウザ添付
        description: BrowserPreset
      - value: endpoint
        title: エンドポイントへ送る
        description: EndpointPreset
    refs:
      - dev/設計書/設定/常駐アプリ#settings[presets[].kind]
    status: implemented
data_models:
  - name: Recording
    title: 録音
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 止めた録音の音と形式。録音・セッション・履歴が使う
    properties:
      - name: samples
        type: numpy.ndarray
        description: モノラルの 16 bit の音
      - name: sample_rate
        type: int
        description: サンプルレート（Hz）
      - name: duration_sec
        type: float
        description: 録音の長さ（一時停止の間を除く）
    status: implemented
  - name: TranscriptionOutcome
    title: 文字起こしの結果
    container: shared/types.py
    usecase: 共通
    role: DTO
    summary: 出力先へ渡す結果。セッションと出力先が使う
    properties:
      - name: session_id
        type: str
        description: セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated"]
        description: 結果の種類
      - name: text
        type: str
        description: 用語集で補正した文字。空・失敗・打ち切りは空文字
      - name: error
        type: str | None
        description: 失敗の理由
    status: implemented
  - name: AppPaths
    title: 置き場所のパス
    container: shared/constants.py
    usecase: 共通
    role: DTO
    summary: 設定・履歴・ログ・一時の音声・トークンの置き場所
    description: |-
      resolve_app_paths で作る。
      既定は platformdirs で `%APPDATA%\voice-paste\`（設定）と `%LOCALAPPDATA%\voice-paste\`（それ以外）を引く。
      データの置き場所（`--data-dir`）を渡したときは、全てをその下に置く。E2E・非機能要件テストはこれで普段使いの置き場所に触れない。
      `@dataclass(frozen=True, slots=True, kw_only=True)`。
    properties:
      - name: settings_file
        type: Path
        description: '`%APPDATA%\voice-paste\settings.toml`（データの置き場所を渡したときは `{data_dir}\settings.toml`）'
      - name: history_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\history\`（`{data_dir}\history\`）'
      - name: log_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\log\`（`{data_dir}\log\`）'
      - name: tmp_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\tmp\`（`{data_dir}\tmp\`。履歴を残さないときの一時の音声）'
      - name: token_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\api_token`（`{data_dir}\api_token`。起動ごとのトークンとポート）'
    refs:
      - dev/設計書/外部ライブラリ/platformdirs#
    status: implemented
  - name: Settings
    title: 設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: settings.toml の全体。項目ごとに範囲・説明・再起動が要るかの印を持ち、設定画面の欄はこのモデルから組み立てる
    inherits: pydantic.BaseModel
    description: |-
      キーの一つ一つ（型・既定値・範囲・反映）は設計書『設定』の settings.toml の行が持つ。
      まとまりのモデルも全て `pydantic.BaseModel` で、どれも `model_config = ConfigDict(extra="forbid")` にして知らないキー（書き間違い）を断る。
      各項目は `Field(description=..., json_schema_extra={"reload": "immediate" | "restart"})` で再起動が要るかの印を持つ。
      全ての項目に既定値があり、`Settings()` が既定の設定になる。
    properties:
      - name: transcription
        type: TranscriptionSettings
        description: 使うエンジンと、エンジンごとの設定
      - name: recording
        type: RecordingSettings
        description: 録音中の音量・画面を出さない設定
      - name: hotkeys
        type: HotkeySettings
        description: 録音の開始・一時停止・取り消しのホットキー（確定のホットキーは出力先ごとに持つ）
      - name: keyboard
        type: KeyboardSettings
        description: 貼り付けのキー
      - name: outputs
        type: list[OutputSettings]
        description: 出力先ごとのオン・オフ・確定のホットキー・出力先ごとの設定。ID は重ならない
      - name: history
        type: HistorySettings
        description: 履歴を残すか・保持期間
      - name: logging
        type: LoggingSettings
        description: ログのレベル・保持期間
      - name: ui
        type: UiSettings
        description: 録音の画面の出し方
      - name: glossary_path
        type: Path | None
        default: None
        description: 用語集の CSV。None は設定ファイルと同じフォルダの yogo.csv
      - name: api
        type: ApiSettings
        description: 待ち受けのポート・返送を許すホスト
      - name: presets
        type: list[Preset]
        default: '[]'
        description: カスタムプリセットの一覧。種類ごとの並びが、設定画面のタブと録音の画面のボタンの並びになる
      - name: preset_options
        type: PresetOptions
        description: プリセットの種類ごとのオプション
    refs:
      - dev/設計書/外部ライブラリ/pydantic#
      - dev/設計書/設定/常駐アプリ#
    status: implemented
  - name: TranscriptionSettings
    title: 文字起こしの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 使うエンジンと、エンジンごとの設定
    inherits: pydantic.BaseModel
    properties:
      - name: engine
        type: Literal["local_whisper"]
        default: local_whisper
        description: 使う文字起こしのエンジン（文字起こしの EngineName）。エンジンはローカルの Whisper だけで、エンジンを足すときに値を足す
      - name: local_whisper
        type: LocalWhisperSettings
        description: ローカルの Whisper の設定
    status: implemented
  - name: LocalWhisperSettings
    title: ローカルの Whisper の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 文字起こしワーカーへ渡すモデル・デバイス・量子化・言語・ビーム幅・温度・VAD
    inherits: pydantic.BaseModel
    properties:
      - name: model
        type: str
        default: large-v3
        description: faster-whisper のモデル
      - name: device
        type: Literal["cuda", "cpu"]
        default: cuda
        description: 動かすデバイス
      - name: compute_type
        type: Literal["float16", "int8", "float32"]
        default: float16
        description: 計算の精度
      - name: cpu_threads
        type: int
        default: '0'
        description: CPU のスレッド数（0 は自動）
      - name: num_workers
        type: int
        default: '1'
        description: 並列のデコードの数
      - name: beam_size
        type: int
        default: '10'
        description: ビームサーチの幅
      - name: best_of
        type: int
        default: '5'
        description: サンプリングの候補の数
      - name: language
        type: str
        default: ja
        description: 認識する言語
      - name: vad_filter
        type: bool
        default: 'True'
        description: 無音の区間を除くか
      - name: vad_threshold
        type: float
        default: '0.5'
        description: 音声とみなす確信度の閾値
      - name: vad_min_speech_ms
        type: int
        default: '250'
        description: これより短い音を雑音として除く（ミリ秒）
      - name: vad_min_silence_ms
        type: int
        default: '2000'
        description: これ以上の無音で区間を区切る（ミリ秒）
      - name: condition_on_previous_text
        type: bool
        default: 'False'
        description: 前の区間の文字を次の区間の文脈に使うか
      - name: temperature
        type: float
        default: '0.0'
        description: サンプリングの温度
      - name: no_speech_threshold
        type: float
        default: '0.6'
        description: 区間を無音とみなす確信度の閾値
    status: implemented
  - name: RecordingSettings
    title: 録音の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 録音中のシステム音量と、画面を出さない設定
    inherits: pydantic.BaseModel
    properties:
      - name: lower_volume
        type: bool
        default: 'True'
        description: 録音中にシステム音量を下げるか
      - name: volume_percent
        type: float
        default: '50'
        description: 録音中の音量の、録音前の音量に対する割合（0〜100）
      - name: fade_sec
        type: float
        default: '0.5'
        description: 音量を下げる・戻すときにかける秒数（0 以上）
      - name: hide_window
        type: bool
        default: 'False'
        description: 録音の画面も文字起こし中の表示も出さず、トレイとホットキーだけで操作するか
    status: implemented
  - name: HotkeySettings
    title: ホットキーの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 録音の開始・一時停止・取り消しのホットキー（pynput の GlobalHotKeys の書式）
    inherits: pydantic.BaseModel
    properties:
      - name: start
        type: str
        default: <ctrl>+<alt>+d
        description: 録音を始める
      - name: pause
        type: str
        default: <ctrl>+<alt>+z
        description: 録音を一時停止・再開する
      - name: cancel
        type: str
        default: <ctrl>+<alt>+q
        description: 録音を取り消す
    status: implemented
  - name: KeyboardSettings
    title: キーボードの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 貼り付け先へ送る貼り付けのキー
    inherits: pydantic.BaseModel
    properties:
      - name: paste_key
        type: str
        default: <ctrl>+v
        description: 貼り付けのキーの組み合わせ（pynput の書式）
    status: implemented
  - name: PasteAndSendSettings
    title: 貼り付けて送信の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 出力先 paste_and_send のオン・オフ・確定のホットキー・貼り付けから送信までの間
    inherits: pydantic.BaseModel
    properties:
      - name: id
        type: Literal["paste_and_send"]
        default: paste_and_send
        description: 出力先の ID（OutputSettings の判別子）
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+d
        description: この出力先で確定するホットキー
      - name: enter_delay_sec
        type: float
        default: '0.5'
        description: 貼り付けてから Enter を送るまで待つ秒数（0 以上）
    status: implemented
  - name: PasteOnlySettings
    title: 貼り付けのみの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 出力先 paste_only のオン・オフ・確定のホットキー
    inherits: pydantic.BaseModel
    properties:
      - name: id
        type: Literal["paste_only"]
        default: paste_only
        description: 出力先の ID
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+v
        description: この出力先で確定するホットキー
    status: implemented
  - name: CopyOnlySettings
    title: コピーのみの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 出力先 copy_only のオン・オフ・確定のホットキー
    inherits: pydantic.BaseModel
    properties:
      - name: id
        type: Literal["copy_only"]
        default: copy_only
        description: 出力先の ID
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+c
        description: この出力先で確定するホットキー
    status: implemented
  - name: HistorySettings
    title: 履歴の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 履歴を残すかと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: enabled
        type: bool
        default: 'True'
        description: 録音と起こした文字を履歴に残すか
      - name: retention_days
        type: int
        default: '1'
        description: 保持する日数（1 以上）
    status: implemented
  - name: LoggingSettings
    title: ログの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ログのレベルと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        default: INFO
        description: ログのレベル
      - name: retention_days
        type: int
        default: '7'
        description: 日付ごとのログを保持する日数（1 以上）
    status: implemented
  - name: UiSettings
    title: 画面の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 録音の画面と文字起こし中の表示の出し方
    inherits: pydantic.BaseModel
    properties:
      - name: topmost
        type: bool
        default: 'True'
        description: 常に最前面に出すか
      - name: position
        type: Literal["center", "top-left", "top-right", "bottom-left", "bottom-right"]
        default: center
        description: 出す位置
      - name: follow_cursor
        type: bool
        default: 'True'
        description: マウスカーソルのあるモニターに出すか
      - name: wave_gain
        type: float
        default: '4'
        description: 波形の振れの大きさ（0 より大きい）
    status: implemented
  - name: ApiSettings
    title: API の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: API の待ち受けのポートと、返送を許すホスト
    inherits: pydantic.BaseModel
    properties:
      - name: port
        type: int
        default: '47823'
        description: 127.0.0.1 で待ち受けるポート（1024〜65535）
      - name: allowed_callback_hosts
        type: list[str]
        default: '[]'
        description: loopback のほかに返送を許すホスト
    status: implemented
  - name: BrowserPreset
    title: ブラウザ添付のプリセット
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ブラウザ添付の種類のプリセット 1 件
    inherits: pydantic.BaseModel
    description: '`model_config = ConfigDict(extra="forbid", frozen=True)`（セッションが写しとして持つため変えられないようにする）。'
    properties:
      - name: kind
        type: Literal["browser"]
        default: browser
        description: プリセットの種類（Preset の判別子）
      - name: title
        type: str
        description: 録音の画面のボタンに出す名前（1 文字以上）
      - name: url
        type: str
        description: Microsoft Edge の `--app` で開く URL（`^https?://`）
      - name: hotkey
        type: str
        default: '""'
        description: このプリセットで確定するホットキー。空なら登録しない
      - name: enabled
        type: bool
        default: 'True'
        description: 録音の画面にボタンを出し、ホットキーを登録するか
      - name: send_enter
        type: bool
        default: 'True'
        description: 貼り付けた後に Enter まで送るか
    refs:
      - dev/設計書/設定/常駐アプリ#settings[presets[].kind]
    status: implemented
  - name: EndpointPreset
    title: エンドポイントへ送るのプリセット
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: エンドポイントへ送るの種類のプリセット 1 件
    inherits: pydantic.BaseModel
    description: '`model_config = ConfigDict(extra="forbid", frozen=True)`。authorization は `Field(repr=False)` にして、設定やセッションを repr でログに出しても値が出ないようにする（SecretStr は model_dump(mode="json") で伏せ字になり settings.toml へ書き戻せないため使わない）。'
    properties:
      - name: kind
        type: Literal["endpoint"]
        default: endpoint
        description: プリセットの種類（Preset の判別子）
      - name: title
        type: str
        description: 録音の画面のボタンに出す名前（1 文字以上）
      - name: url
        type: str
        description: 起こした文字を POST する送り先（`^https?://`）
      - name: hotkey
        type: str
        default: '""'
        description: このプリセットで確定するホットキー。空なら登録しない
      - name: enabled
        type: bool
        default: 'True'
        description: 録音の画面にボタンを出し、ホットキーを登録するか
      - name: authorization
        type: str
        default: '""'
        description: 空でなければ `Authorization` ヘッダーにそのまま入れる値（秘密。repr に出さない）
    refs:
      - dev/設計書/設定/常駐アプリ#settings[presets[].authorization]
    status: implemented
  - name: PresetOptions
    title: プリセットの種類のオプション
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 種類ごとに、その種類の全てのプリセットで使う設定
    inherits: pydantic.BaseModel
    properties:
      - name: browser
        type: BrowserPresetOptions
        description: ブラウザ添付のオプション
      - name: endpoint
        type: EndpointPresetOptions
        description: エンドポイントへ送るのオプション
    status: implemented
  - name: BrowserPresetOptions
    title: ブラウザ添付のオプション
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ブラウザ添付の全てのプリセットで使う、開いてから貼り付けるまでの間
    inherits: pydantic.BaseModel
    properties:
      - name: open_delay_sec
        type: float
        default: '3.0'
        description: 画面を開いてから貼り付けるまで待つ秒数（0 以上）
    refs:
      - dev/設計書/設定/常駐アプリ#settings[preset_options.browser.open_delay_sec]
    status: implemented
  - name: EndpointPresetOptions
    title: エンドポイントへ送るのオプション
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: エンドポイントへ送るの全てのプリセットで使う、送るときのタイムアウト
    inherits: pydantic.BaseModel
    properties:
      - name: timeout_sec
        type: float
        default: '1.5'
        description: 送るときのタイムアウトの秒数（`ge=0.5, le=10`。既定・範囲は非機能要件）
    refs:
      - dev/設計書/設定/常駐アプリ#settings[preset_options.endpoint.timeout_sec]
      - dev/設計書/非機能要件/非機能要件#requirements[エンドポイントへ送るときのタイムアウト]
    status: implemented
classes:
  - name: AppError
    title: アプリの例外
    container: shared/errors.py
    usecase: 共通
    role: 例外
    kind: クラス
    inherits: Exception
    summary: このアプリが送出する例外の根。API サーバーの例外ハンドラが HTTP のステータスへ変える
    description: |
      | 例外 | 意味 | HTTP |
      | --- | --- | --- |
      | `CallbackNotAllowedError` | 返送先が許されない | 400 |
      | `UnauthorizedError` | トークンが合わない | 401 |
      | `ForbiddenRequestError` | Origin が付いている・Host が違う | 403 |
      | `SessionNotFoundError` | セッションが無い・操作できない状態 | 404 |
      | `SessionBusyError` | ほかのセッションが処理中 | 409 |
      | `MicrophoneUnavailableError` | マイクを開けない | 503 |
      | `TranscriptionError` | 文字起こしに失敗した（API へは返さず返送先へ届ける） | - |
      | `EngineError` | エンジンが失敗した（外部連携が送出し、文字起こしが TranscriptionError に変える） | - |
      | `DeliveryError` | 出力先へ届けられない | - |
      | `UnknownOutputError` | 選んだ出力先が一覧に無いかオフ（`DeliveryError` の子） | - |
      | `VolumeControlError` | システム音量を操作できない | - |
      | `SettingsError` | 設定の値が合わない（合わないキーをメッセージに並べる） | - |
      | `StartupError` | 起動に失敗した（エンジンを準備できない・前のプロセスが排他を放さない） | - |
      | `HotkeyError` | ホットキーの書式を pynput が読めない | - |

      全ての例外は docstring だけを持つクラスで `shared/errors.py` に置き、親は表に書かない限り `AppError`。
    status: implemented
functions:
  - name: load_settings
    title: 設定の読み込み
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: public
    summary: settings.toml を読んで検証する。無ければ既定値で作る
    side_effects: settings.toml が無いときだけ、既定値の settings.toml を書く。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: settings.toml
    returns:
      type: Settings
      description: 検証した設定
    process: |-
      1. path が無いかを確かめる
         - 無い場合、既定の Settings を書いて返す（設定の書き戻し）
           - `[INFO]` 設定ファイルが無いため既定値で作った（path）
      2. UTF-8 で読み、tomlkit で解釈する
         - TOMLKitError の場合、SettingsError を送出する
      3. 文書を素の dict にし、古い AI チャットの設定を読み替える（migrate_ai_chat。settings.toml は書き換えない）
      4. Settings.model_validate で検証して返す
         - pydantic.ValidationError の場合、合わないキーをドット区切り（例 `transcription.local_whisper.beam_size`、出力先は `outputs[0].hotkey`、プリセットは `presets[0].url`）で並べた SettingsError を送出する
    exceptions:
      - name: SettingsError
        condition: TOML の書式が壊れている
        message: '設定ファイルを読めない（{path}: {理由}）'
      - name: SettingsError
        condition: 値がモデルに合わない・知らないキーがある・出力先の ID が重なる
        message: '設定の値が合わない（{キー}: {理由}、…）'
    unit_tests:
      - name: test_load_settings_when_missing
        case: 正常
        summary: 無ければ既定値で作る
        condition: settings.toml の無い一時フォルダ
        mock: なし（一時フォルダ）
        expected: Settings() と等しい設定が返り、settings.toml ができている
      - name: test_load_settings
        case: 正常
        summary: 書いた値を読む
        condition: transcription.local_whisper.model = "small"、outputs が copy_only だけの settings.toml
        mock: なし（一時フォルダ）
        expected: local_whisper.model が small、outputs が CopyOnlySettings 1 件、書いていない項目は既定値
      - name: test_load_settings_when_sample_file
        case: 正常
        summary: リポジトリの見本は既定値と一致する
        condition: リポジトリの直下の settings.sample.toml
        mock: なし
        expected: Settings() と等しい
      - name: test_load_settings_when_invalid_value
        case: 異常
        summary: 合わない値はキーを示して断る
        condition: parametrize で (1) transcription.local_whisper.beam_size = "x" (2) transcription.engine = "openai"（作らないエンジン）
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) transcription.local_whisper.beam_size (2) transcription.engine を含む
        exception: 値がモデルに合わない
      - name: test_load_settings_when_unknown_key
        case: 異常
        summary: 知らないキーを断る
        condition: parametrize で (1) recording.volum_percent = 30（書き間違い） (2) [transcription.openai] の表に model = "whisper-1"（消した設定）
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) recording.volum_percent (2) transcription.openai を含む
        exception: 知らないキーがある
      - name: test_load_settings_when_duplicate_output_id
        case: 異常
        summary: 出力先の ID の重なりを断る
        condition: outputs に copy_only が 2 件
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに outputs を含む
        exception: 出力先の ID が重なる
      - name: test_load_settings_when_broken_toml
        case: 異常
        summary: 壊れた TOML を断る
        condition: '`[recording` で閉じていない'
        mock: なし（一時フォルダ）
        expected: SettingsError
        exception: TOML の書式が壊れている
      - name: test_load_settings_when_ai_chat_remains
        case: 正常
        summary: 古い AI チャットの設定が残っていても読め、プリセットに読み替える
        condition: outputs に id = "ai_chat"・open_delay_sec = 2.0・targets に ChatGPT（enabled true）と Claude（enabled false）を書いた settings.toml
        mock: なし（一時フォルダ）
        expected: outputs に ai_chat が無く、presets が ChatGPT（enabled True）・Claude（enabled False）の BrowserPreset 2 件（同じ title・url・hotkey、send_enter True）、preset_options.browser.open_delay_sec が 2.0。settings.toml の中身は読む前と同じ
      - name: test_load_settings_when_invalid_preset
        case: 異常
        summary: 合わないプリセットはキーを示して断る
        condition: presets に kind = "endpoint"・url = "ftp://x" の 1 件
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに presets[0] と url を含む
        exception: 値がモデルに合わない
    refs:
      - dev/設計書/外部ライブラリ/tomlkit#
    status: implemented
  - name: save_settings
    title: 設定の書き戻し
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: public
    summary: 検証した設定を、コメントを保ったまま tomlkit で書き戻す。再起動が要る項目が変わったかを返す
    side_effects: path を書く（親のフォルダが無ければ作る）。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: settings.toml
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 書く設定（検証済み）
    returns:
      type: bool
      description: 再起動が要る項目が変わったか
    process: |-
      1. path があれば tomlkit で読み、無ければ空の文書にする
      2. 読んだ文書を、古い AI チャットの設定を読み替えてから（migrate_ai_chat）Settings として検証し、前の設定にする
         - 無い場合、前の設定は無しとする
         - 読めない・検証に通らない場合、内容を空の文書にして前の設定を「全て変わった」とする
      3. settings を `model_dump(mode="json")` する
      4. 文書の値を再帰で置き換える。表はキーごとに書き換えて既存のコメントと並びを保ち、配列（出力先の一覧・プリセットの一覧・許すホスト）は丸ごと入れ替える（出力先の一覧を入れ替えるので、文書に残っていた `id = "ai_chat"` の項目も消える）。None の項目（glossary_path）はキーを置かず、文書に既にあれば消す
      5. 親のフォルダを作り、同じフォルダの一時ファイルに UTF-8 で書いて os.replace で置き換える
      6. reload が restart の項目のうち、前の設定と値が違うものが 1 つでもあれば True、無ければ False を返す（前の設定が無いときは False）
    unit_tests:
      - name: test_save_settings_when_comments
        case: 正常
        summary: コメントを保ったまま値を書き換える
        condition: コメント付きの settings.toml に、hotkeys.start を変えた設定を書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルに元のコメントが残り、load_settings で新しい値が読める
      - name: test_save_settings_when_restart_item_changed
        case: 正常
        summary: 再起動が要る項目が変われば True
        condition: transcription.local_whisper.model を large-v3 から small へ変えて書く
        mock: なし（一時フォルダ）
        expected: 'True'
      - name: test_save_settings_when_immediate_item_changed
        case: 正常
        summary: 即時に効く項目だけなら False
        condition: hotkeys.start だけを変えて書く
        mock: なし（一時フォルダ）
        expected: 'False'
      - name: test_save_settings_when_missing
        case: 正常
        summary: 無ければフォルダごと作る
        condition: 存在しないフォルダの下の settings.toml
        mock: なし（一時フォルダ）
        expected: False。ファイルができ、glossary_path のキーが無い
      - name: test_save_settings_when_invalid_existing
        case: 正常
        summary: 壊れたファイルは書き直して再起動が要るとする
        condition: 書式の壊れた settings.toml に既定の設定を書く
        mock: なし（一時フォルダ）
        expected: True。load_settings で既定の設定が読める
      - name: test_save_settings_when_glossary_reset
        case: 正常
        summary: 用語集の場所を既定（None）に戻すとキーを消す
        condition: glossary_path = "C:/x/yogo.csv" を持つ settings.toml に Settings() を書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルに glossary_path のキーが無く、load_settings の glossary_path が None
      - name: test_save_settings_when_ai_chat_remains
        case: 正常
        summary: 読み替えた設定を保存すると、ai_chat の項目が消えてプリセットとして書かれる
        condition: outputs に id = "ai_chat" と送り先 2 件を書いた settings.toml を load_settings で読み、そのまま書く
        mock: なし（一時フォルダ）
        expected: False。書いた後のファイルの outputs に ai_chat が無く、presets に同じ title・url・hotkey・enabled の kind = "browser" が 2 件あり、preset_options.browser.open_delay_sec が読み替えた値
    refs:
      - dev/設計書/外部ライブラリ/tomlkit#
    status: implemented
  - name: setup_logging
    title: ログの設定
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 標準の logging を日付ごとのファイルへ書くようにし、uvicorn のロガーもそこへ寄せる
    side_effects: ルートロガーと uvicorn のロガーのハンドラを入れ替える。log_dir が無ければ作る。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        required: true
        passing: positional
        description: ルートロガーのレベル
    returns:
      type: None
      description: なし
    process: |-
      1. log_dir を作る
      2. ルートロガーに既にこの関数が付けたハンドラがあれば外す（2 回呼んでも 1 組だけにする）
      3. 日付ごとのファイルのハンドラ（_DailyFileHandler）を付ける。書くたびにモジュールの `_today()`（今日の `date` を返す内部の関数。単体テストが差し替える）を呼び、`{log_dir}/{YYYY-MM-DD}.log` が変わっていれば開き直す
      4. 書式は 1 行 1 JSON（JSON Lines）で、ts（ローカルの時刻を UTC オフセット付きの ISO 8601）・level・name・msg・例外があれば exc を持つ（ensure_ascii=False）
      5. sys.stderr があれば同じ書式で stderr にも出す（pythonw では無い）
      6. ルートロガーのレベルを level にする
      7. uvicorn・uvicorn.error・uvicorn.access のロガーのハンドラを外し、propagate を True にする
    unit_tests:
      - name: test_setup_logging
        case: 正常
        summary: 今日のファイルに JSON Lines で書く
        condition: level=INFO、日本語の INFO と DEBUG を 1 行ずつ出す
        mock: なし（一時フォルダ）
        expected: '{log_dir}/{今日}.log に INFO の 1 行だけがあり、JSON として読めて msg が日本語のまま、ts に UTC オフセットが付く'
      - name: test_setup_logging_when_called_twice
        case: 正常
        summary: 2 回呼んでも二重に書かない
        condition: setup_logging を 2 回呼んでから 1 行出す
        mock: なし（一時フォルダ）
        expected: ファイルに 1 行だけ
      - name: test_setup_logging_when_date_changed
        case: 正常
        summary: 日付が変われば次のファイルへ書く
        condition: 1 行出した後に今日を翌日へ差し替えて 1 行出す
        mock: 今日の日付を返す関数（monkeypatch）
        expected: 2 つの日付のファイルに 1 行ずつ
      - name: test_setup_logging_when_uvicorn_logger
        case: 正常
        summary: uvicorn のログも同じファイルへ寄せる
        condition: uvicorn.error のロガーにハンドラを 1 つ付けておき、setup_logging の後に uvicorn.error へ INFO を 1 行出す
        mock: なし（一時フォルダ）
        expected: uvicorn.error のハンドラが空になり、今日のファイルに name が uvicorn.error の 1 行がある
    notes:
      秘密の値: トークンはログに出さない（断った要求のログにも含めない）。
    status: implemented
  - name: purge_old_logs
    title: 古いログの削除
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 保持期間を過ぎた日付のログだけを消す（今日より前を全て消す今のやり方はやめる）
    side_effects: log_dir の下のファイルを消す。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: retention_days
        type: int
        required: true
        passing: positional
        description: 保持期間
      - name: today
        type: date
        required: true
        passing: positional
        description: 今日
    returns:
      type: int
      description: 消したファイルの数
    process: |-
      1. log_dir の直下の `YYYY-MM-DD.log` の形の名前のファイルを拾う（それ以外の名前は触らない）
      2. 日付が today − retention_days 日より前のものを消す
         - `[INFO]` 古いログを消した（件数）
    unit_tests:
      - name: test_purge_old_logs
        case: 正常
        summary: 保持期間を過ぎた日付のログだけ消す
        condition: 保持 1 日、今日・1 日前・2 日前のログ
        mock: なし（一時フォルダ）
        expected: 2 日前だけが消え、戻り値が 1
      - name: test_purge_old_logs_when_other_names
        case: 正常
        summary: 日付の形でない名前は消さない
        condition: 保持 1 日、`notes.log`・`2026-13-40.log`・10 日前のログ
        mock: なし（一時フォルダ）
        expected: 10 日前だけが消え、戻り値が 1
    status: implemented
  - name: resolve_app_paths
    title: 置き場所の解決
    kind: 関数
    container: shared/constants.py
    usecase: 共通
    scope: public
    summary: データの置き場所が渡されればその下、無ければ platformdirs で引いた既定の置き場所で AppPaths を作る。フォルダは作らない
