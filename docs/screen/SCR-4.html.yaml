id: SCR-4
visibility: internal
title: "取り消せない操作の確認"
elements:
  - name: 削除の確認
    id: delete_dialog
    kind: dialog
    position: 削除の確認
    description: '`<dialog>` を `showModal()` で開く。`closedby="any"` で Esc・外側の押下でも閉じる（`closedby` を持たないブラウザは Esc とキャンセルで閉じる）。閉じたら押した削除ボタンへフォーカスを戻す'
    return_focus: 押した結果の削除ボタン（削除したときは結果の見出し）
    initial_focus: 削除のキャンセルボタン
    close:
      outside_click: true
      escape: close
    visible_when: 結果の削除ボタンを押したとき
  - name: 削除の確認の見出し
    id: delete_title
    kind: label
    position: 削除の確認 > 本体
    description: 結果を削除するかを問う
    label: 結果を削除しますか
    visible_when: 常時
  - name: 削除の確認の本文
    id: delete_body
    kind: label
    position: 削除の確認 > 本体
    description: 元に戻せないことと、PC の履歴は残ること
    label: この端末から削除（復元不可）。PC の履歴は保持
    visible_when: 常時
  - name: 削除する結果
    id: delete_quote
    kind: label
    position: 削除の確認 > 本体
    description: 削除する結果の起こした文字。長いときは 3 行で省く。全文は結果の一覧の起こした文字（続きを読む）で確認できる
    overflow:
      type: truncate
      unbounded: true
    io: output
    visible_when: 常時
    source: 文字起こしの結果を返却する.text（端末に残した値）
  - name: 削除のキャンセルボタン
    id: delete_cancel
    kind: button
    position: 削除の確認 > フッター
    description: 削除せずに閉じる。最初のフォーカスを配置する
    label_display: text_only
    confirm: none
    label: キャンセル
    visible_when: 常時
    autofocus: true
    action: 確認を閉じる
  - name: 削除ボタン
    id: delete_confirm
    kind: button
    position: 削除の確認 > フッター
    description: その結果を端末（localStorage）と一覧から削除する。危険の塗りのボタン
    label_display: text_only
    confirm: none
    label: 削除
    visible_when: 常時
    action: 確認を閉じ、端末と一覧からその件だけを削除する
  - name: 置換の確認
    id: replace_dialog
    kind: dialog
    position: 置換の確認
    description: 削除の確認と同じ開き方・閉じ方のモーダル。閉じたら録音開始ボタンへフォーカスを戻す
    return_focus: 録音開始ボタン（置換して録音したときは録音停止・送信ボタン）
    initial_focus: 置換のキャンセルボタン
    close:
      outside_click: true
      escape: close
    visible_when: 端末内の音声が「送信失敗」「文字起こし前」のときに録音開始ボタンを押したとき
  - name: 置換の確認の見出し
    id: replace_title
    kind: label
    position: 置換の確認 > 本体
    description: '文字起こし前の音声を置換するかを問う。文節で折り返す（`text-wrap: balance`・`word-break: auto-phrase`）'
    label: 文字起こし前の音声を置換しますか
    visible_when: 常時
  - name: 置換の確認の本文
    id: replace_body
    kind: label
    position: 置換の確認 > 本体
    description: 消える音声と、残す方法
    label: '端末内の文字起こし前の音声（{MM/DD HH:mm}・{m:ss}）を削除して録音（復元不可）。保存する場合: キャンセル後にダウンロード'
    visible_when: 常時
  - name: 置換のキャンセルボタン
    id: replace_cancel
    kind: button
    position: 置換の確認 > フッター
    description: 録音を始めずに閉じる。最初のフォーカスを配置する
    label_display: text_only
    confirm: none
    label: キャンセル
    visible_when: 常時
    autofocus: true
    action: 確認を閉じる
  - name: 置換して録音ボタン
    id: replace_confirm
    kind: button
    position: 置換の確認 > フッター
    description: 録音を始める。端末内の音声は、新しい録音を止めて残すときに置き換わる。危険の塗りのボタン
    label_display: text_only
    confirm: none
    label: 置換して録音
    visible_when: 常時
    action: 確認を閉じ、録音を始めて録音中の表示に替える
  - name: 破棄の確認
    id: discard_dialog
    kind: dialog
    position: 破棄の確認
    description: '`<dialog>` を `showModal()` で開く。`closedby="closerequest"` で Esc・戻る操作では閉じ、外側の押下では閉じない。開いている間も録音（一時停止中なら一時停止）は続く。閉じたら破棄ボタンへフォーカスを戻し、破棄したときは録音開始ボタンへ移す（モック `docs/mock/pages/web-confirm-dialog/347/a-standard/`）'
    return_focus: 破棄ボタン（破棄したときは録音開始ボタン）
    initial_focus: 破棄のキャンセルボタン
    close:
      outside_click: false
      escape: close
    visible_when: 録音中・一時停止中に破棄ボタンを押したとき
  - name: 破棄の確認の見出し
    id: discard_title
    kind: label
    position: 破棄の確認 > 本体
    description: 録音を破棄するかを問う
    label: 録音を破棄しますか
    visible_when: 常時
  - name: 破棄の確認の本文
    id: discard_body
    kind: label
    position: 破棄の確認 > 本体
    description: 捨てる音声の長さ（録った時間の合計）と、元に戻せないこと、端末内の前の音声は残ること
    label: 録った音声（{m:ss}）は送信せず削除（復元不可）。端末内の前の音声は保持
    visible_when: 常時
  - name: 破棄のキャンセルボタン
    id: discard_cancel
    kind: button
    position: 破棄の確認 > フッター
    description: 破棄せずに閉じ、録音中・一時停止中の表示に戻る。最初のフォーカスを配置する
    label_display: text_only
    confirm: none
    label: キャンセル
    visible_when: 常時
    autofocus: true
    action: 確認を閉じる
  - name: 破棄ボタン
    id: discard_confirm
    kind: button
    position: 破棄の確認 > フッター
    description: MediaRecorder を止めて録ったデータを捨て、マイクのトラックと画面を暗くしない抑止を解放する。音声の送信も端末（IndexedDB）への保存もしない。危険の塗りのボタン
    label_display: text_only
    confirm: none
    label: 破棄
    visible_when: 常時
    action: 確認を閉じ、録音していない状態の表示（録音開始ボタン・ファイル送信ボタン）に戻す
screen: src/voice_paste/server/web/index.html
mock: docs/mock/pages/web-confirm-dialog/171/a-standard/
lead: 外の端末の文字起こしの画面で、結果の削除・文字起こし前の音声を新しい録音で置換すること・録音の破棄を確認するモーダル。
screen_type: other
leave_guard: none
refs:
  - to: SC-4
    type: references
    when: "『ブラウザで結果を受け取る』の流れと突き合わせるとき。"
tags:
  - name: topic:モーダル
    main: true
  - name: topic:ブラウザ
  - name: action:確認
  - name: action:削除
