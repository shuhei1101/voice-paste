title: "ほかのシステムから連続して録音し、区切りごとに文字で受け取る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた 3 文を読み上げ、前後の無音を削ってから、区切りの無音の長さより長い間を挟んでつないだ WAV を実時間で流す（マイクを開かない）。音量は何もせず、貼り付けのキーは送信せずに控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 出力先
        description: 出力先のうち「貼り付けて送信」をオンにする
        notes: API からの連続録音で貼り付けが起きないことを確かめるため
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>読み上げを流し終えたら完了| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（録音を止めずに無音で区切る）])
        UC2 -->|区切った区間<br>区間ごとに履歴に保存済み| UC3([録音を文字に起こす:正常シナリオ（区間を区切った順に起こす）])
        UC3 -->|区間ごとの用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ（区間ごとに呼び出し元へ返す）])
        UC4 -->|完了で最後の区間を届けた| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先に区間の文字と終わりが届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を止めずに無音で区切る"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ区間を区切った順に起こす"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ区間ごとに呼び出し元へ返す"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 返送先のエンドポイントに、区間の文字が 3 回、通し番号 1・2・3 の順に届き、それぞれ読み上げた文の言葉を含む
      - 区間の文字の返送の後に、連続録音が終わったことと区間の数 3 が 1 回届いている
      - クリップボードが録音前のままで、貼り付けのキーが送信されていない
      - 履歴に 3 つの区間の録音と起こした文字がある
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_normal
  - name: 正常シナリオ（話し続けて最大の長さで区切る）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（正常シナリオと同じ）
        notes: 録音の入力は、無音を挟まずに区間の最大の長さを超えて読み上げ続けた WAV を実時間で流す
      - name: 履歴の保存
        description: 履歴を残す設定にする
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>読み上げを流し終えたら完了| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（話し続けて最大の長さで区切る）])
        UC2 -->|最大の長さで区切った区間| UC3([録音を文字に起こす:正常シナリオ（区間を区切った順に起こす）])
        UC3 -->|区間ごとの用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ（区間ごとに呼び出し元へ返す）])
        UC4 -->|完了で最後の区間を届けた| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先に区間の文字と終わりが届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ話し続けて最大の長さで区切る"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ区間を区切った順に起こす"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ区間ごとに呼び出し元へ返す"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 返送先のエンドポイントに、区間の文字が 2 回以上、通し番号の順に届いている
      - 最初の区間の録音の長さが区間の最大の長さに話し声の前の余白を加えた長さ以下である
      - 区間の文字を通し番号の順につないだものが、読み上げた文章の言葉を落とさずに含む
      - 連続録音が終わったことと区間の数が 1 回届いている
    test: test_normal_when_speaking_without_pause
  - name: 正常シナリオ（話さないまま完了する）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（正常シナリオと同じ）
        notes: 録音の入力は、無音の WAV を実時間で流す
      - name: 履歴の保存
        description: 履歴を残す設定にする
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>無音を流し終えたら完了| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（録音を止めずに無音で区切る）])
        UC2 -->|区間なし| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先に終わりだけが届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を止めずに無音で区切る"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 返送先のエンドポイントに、区間の文字が届いていない
      - 連続録音が終わったことと区間の数 0 が 1 回届いている
      - 履歴にこの連続録音の区間が残っていない
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_normal_when_no_speech
  - name: 異常シナリオ（完了が来ないまま上限に達する）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（正常シナリオと同じ）
        notes: 録音の入力は、正常シナリオと同じ 3 文の WAV を流し、流し終えた後は無音を流し続ける
      - name: 上限の短縮
        description: 連続録音のセッションの上限時間を、読み上げを流し終えるより後で、テストで待てる短い値に差し替える
      - name: 放置されたセッション
        description: 連続録音を指定して開始を呼んだ後、完了を呼ばない
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>完了を呼ばない| UC1([APIで録音を操作する:異常シナリオ（連続録音が上限に達する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（録音を止めずに無音で区切る）])
        UC2 -->|区切った区間| UC3([録音を文字に起こす:正常シナリオ（区間を区切った順に起こす）])
        UC3 -->|区間ごとの用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ（区間ごとに呼び出し元へ返す）])
        UC4 -->|上限で打ち切った| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先に区間の文字と打ち切りが届き<br>マイクが閉じて次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#異常シナリオ連続録音が上限に達する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を止めずに無音で区切る"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ区間を区切った順に起こす"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ区間ごとに呼び出し元へ返す"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 返送先のエンドポイントに、上限までに区切った区間の文字が通し番号の順に届いている
      - 最後に、上限で打ち切ったことと区間の数が 1 回届いている
      - マイクの録音が止まり、システム音量が録音前の値に戻っている
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_error_when_session_limit_reached
  - name: 異常シナリオ（連続録音の間にホットキーで録音を始める）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える（正常シナリオと同じ）
        notes: 画面は表示せず、処理中のダイアログを出す呼び出しを控える
      - name: 連続録音
        description: 連続録音を指定して開始を呼び、完了を呼ぶ前にホットキーの入口から録音を始める
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|連続録音の間に<br>ホットキーを押す| UC2([録音する:異常シナリオ（処理中に開始が来る）])
        UC2 --> DONE([処理中のダイアログが出て<br>連続録音を続ける])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#異常シナリオ処理中に開始が来る"
      ```
    expected:
      - 処理中のダイアログを出す呼び出しが 1 回ある
      - ホットキーからの 2 つ目の録音が始まっていない
      - 連続録音が録音中のまま続き、完了を呼ぶと区間の文字と終わりが返送先へ届く
    test: test_error_when_hotkey_during_continuous_recording
  - name: 異常シナリオ（区間の文字起こしに失敗）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（正常シナリオと同じ）。文字起こしは、通し番号 2 の区間だけ失敗を返すように差し替え、ほかの区間はローカルの Whisper で起こす
        notes: 録音の入力は、正常シナリオと同じ 3 文の WAV を実時間で流す
      - name: 履歴の保存
        description: 履歴を残す設定にする
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>読み上げを流し終えたら完了| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（録音を止めずに無音で区切る）])
        UC2 -->|区切った区間| UC3([録音を文字に起こす:異常シナリオ（区間の文字起こしに失敗）])
        UC3 -->|失敗した区間の失敗<br>ほかの区間の文字| UC4([起こした文字を届ける:異常シナリオ（区間の失敗を呼び出し元へ返す）])
        UC4 -->|完了で最後の区間を届けた| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先に失敗とその後の区間と終わりが届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を止めずに無音で区切る"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#異常シナリオ区間の文字起こしに失敗"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#異常シナリオ区間の失敗を呼び出し元へ返す"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 返送先のエンドポイントに、通し番号 1 の区間の文字、通し番号 2 の失敗、通し番号 3 の区間の文字がこの順に届いている
      - その後に、連続録音が終わったことと区間の数 3 が 1 回届いている
      - 履歴に 3 つの区間の録音が残っている
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_error_when_segment_transcription_failed
  - name: 異常シナリオ（区間の返送が届かない）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（正常シナリオと同じ）。返送先のエンドポイントは、通し番号 2 の区間の返送にだけ常に 500 を返し、ほかは 200 を返す
        notes: 録音の入力は、正常シナリオと同じ 3 文の WAV を実時間で流す
      - name: 再送の設定
        description: 返送の再送の間隔をテストで待てる短い値に差し替える
    flow: |-
      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|連続録音を指定して開始<br>読み上げを流し終えたら完了| UC1([APIで録音を操作する:正常シナリオ（連続録音を始めて完了する）])
        UC1 -->|画面を出さない連続録音<br>返送先| UC2([録音する:正常シナリオ（録音を止めずに無音で区切る）])
        UC2 -->|区切った区間| UC3([録音を文字に起こす:正常シナリオ（区間を区切った順に起こす）])
        UC3 -->|区間ごとの用語集で補正した文字| UC4([起こした文字を届ける:異常シナリオ（区間の返送先に届かない）])
        UC4 -->|届かなかった区間をログに書いて<br>次の区間へ進む| UC5([起こした文字を届ける:正常シナリオ（連続録音の終わりを返す）])
        UC5 --> DONE([返送先にほかの区間と終わりが届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ連続録音を始めて完了する"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音を止めずに無音で区切る"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ区間を区切った順に起こす"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#異常シナリオ区間の返送先に届かない"
        click UC5 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ連続録音の終わりを返す"
      ```
    expected:
      - 通し番号 2 の区間の返送が、決めた回数だけ送信されている
      - ログに、届かなかったことと session_id・通し番号 2 が書かれている
      - 返送先のエンドポイントに、通し番号 1 と 3 の区間の文字と、連続録音が終わったことと区間の数 3 がこの順に届いている
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_error_when_segment_callback_unreachable
lead: 同じ端末のほかのプロセスが API で連続録音を始め、無音で区切った区間ごとに起こした文字を区切った順に返送先で受け取り、完了で終えるまでの複合ユースケース。
issue: 43
primary_actor: API を呼ぶほかのプロセス
stakeholders:
  - name: API を呼ぶほかのプロセス
    interest: 話し続ける声を止めずに録り続け、話の切れ目ごとの文字を区切った順に、抜けを見分けられる形で受け取れること
  - name: ユーザー
    interest: 連続録音の間もホットキーの録音とマイクを取り合わず、呼び出し元が落ちてもマイクが開いたままにならないこと
trigger: ほかのプロセスが、返送先のエンドポイントと連続録音を指定して API の開始を呼ぶ
preconditions:
  - Windows の端末で、ショートカットから常駐サービスを起動している
  - マイクがつながっている
  - 設定の文字起こしのエンジンに要るものがそろっている（ローカルの Whisper のモデルと GPU）
  - 呼び出し元は同じ端末で動き、常駐サービスが起動ごとに作るトークンを持っている
  - 返送先のエンドポイントは loopback か、設定で許可したホストにある
success_guarantee: |-
  話し声の後で無音が区切りの長さ以上続くたびに、その区間の用語集で補正した文字が、区間の通し番号つきで区切った順に返送先へ届く。
  完了で最後の区間を届けた後、連続録音が終わったことと区間の数が返送先へ 1 回届く。
  区間ごとの録音が履歴に残る（履歴を残す設定のとき）。
minimal_guarantee: |-
  区間の文字起こしに失敗しても連続録音は止まらず、その区間の失敗を通し番号つきで呼び出し元へ伝える。
  完了が来ないまま連続録音の上限時間に達したら、録音を止めてそこまでの区間を届け、打ち切ったことを呼び出し元へ伝える。
  同時に動く録音は 1 つだけで、連続録音の間に来たほかの開始は受け付けない。
