title: "常駐アプリを起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 文字起こしのエンジン
        description: ローカルの Whisper を使う設定にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as ファイル（ログ・履歴・トークン）
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant API as API のサーバー

        U->>SVC: ショートカットから起動する
        SVC->>SVC: 名前付きの排他を取る
        SVC->>FS: 保持期間を過ぎたログと履歴を消す
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送る
        WK-->>SVC: モデルを読み込んだ（ready）
        SVC->>FS: 起動ごとのトークンを作り、トークンのファイルに書く
        SVC->>API: 127.0.0.1 で待ち受けを始める
        API-->>SVC: 待ち受けを始めた
        SVC->>SVC: 録音開始のホットキーの受付を始める
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - トレイのアイコンが待機中になっている
      - 録音開始のホットキーを押すと録音が始まる
      - 127.0.0.1 の API が、トークンを付けた要求に応える
      - トークンのファイル（`%LOCALAPPDATA%\voice-paste\` の下）に今回の起動のトークンが書かれている
      - 文字起こしワーカーの子プロセスが動いている
    test: test_normal
  - name: 正常シナリオ（前の常駐サービスが動いている）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 前のプロセス
        description: 常駐サービスが 1 つ動いており、名前付きの排他を持っている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant NEW as 新しい常駐サービス
        participant OLD as 前の常駐サービス

        U->>NEW: ショートカットから起動する
        NEW->>NEW: 名前付きの排他が取られている
        NEW->>OLD: 終わるよう頼む（名前付きのイベント）
        OLD->>OLD: 録音・文字起こしを止め、トレイのアイコンを消して終わる
        NEW->>NEW: 名前付きの排他を取る
        Note over NEW: 以降は 正常シナリオ と同じ
      ```
    expected:
      - 前の常駐サービスのプロセスが終わり、トレイに前のアイコンが残っていない
      - 新しい常駐サービスのアイコンが待機中で出ている
      - 常駐サービスのプロセスが 1 つだけ動いている
    notes:
      起動し直しの手作業: master を取り込んだ後にショートカットから起動し直す使い方を残すため、新しいプロセスが前のプロセスに終わるよう頼む。プロセスの番号での強制終了はしない。
    test: test_normal_when_previous_running
  - name: 正常シナリオ（保持期間を過ぎた履歴とログがある）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 保持期間
        description: 履歴とログの保持期間を 1 日にする
      - name: 古い履歴とログ
        description: 今日から 2 日前の日付の履歴とログと、今日の日付の履歴とログがある
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant FS as 履歴・ログ

        U->>SVC: ショートカットから起動する
        SVC->>FS: 保持期間を過ぎた履歴とログを消す
        Note over SVC: 以降は 正常シナリオ と同じ
        loop 常駐中、非機能要件の削除の間隔ごと
          SVC->>FS: 同じ条件で古い履歴とログを消す
        end
      ```
    expected:
      - 2 日前の日付の履歴とログが消えている
      - 今日の日付の履歴とログが残っている
    test: test_normal_when_expired_history_and_logs
  - name: 異常シナリオ（文字起こしのエンジンを準備できない）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: モデルの読み込みの失敗
        description: ローカルの Whisper のモデルに存在しない名前を設定し、文字起こしワーカーがモデルを読み込めずに error を返す状態にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
        participant WK as 文字起こしワーカー（子プロセス）
        participant LOG as ログ

        U->>SVC: ショートカットから起動する
        SVC->>TRAY: 準備中のアイコンを出す
        SVC->>WK: 子プロセスを起動し、エンジンの設定を送る
        WK-->>SVC: モデルを読み込めない（error）
        SVC->>LOG: 起動に失敗した理由を書く
        SVC->>TRAY: 失敗のアイコンにし、起動に失敗したことを知らせる
      ```
    expected:
      - トレイで起動に失敗したことが知らされている
      - ログに起動に失敗した理由が書かれている
      - 常駐サービスのプロセスは終わらず、トレイのメニューから設定を開ける
      - 録音開始のホットキーを押しても録音が始まらない
    notes:
      同じ扱いになる失敗: 文字起こしワーカーが ready を返さずに終わったときも同じ扱いになる。
    test: test_error_when_engine_unavailable
  - name: 異常シナリオ（API の待ち受けを始められない）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: ポートの使用中
        description: API の待ち受けのポートを、ほかのプロセスが先に使っている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant API as API のサーバー
        participant TRAY as トレイ
        participant LOG as ログ

        U->>SVC: ショートカットから起動する
        Note over SVC: エンジンの準備までは 正常シナリオ と同じ
        SVC->>API: 127.0.0.1 で待ち受けを始める
        API-->>SVC: 待ち受けを始められない
        SVC->>LOG: 待ち受けに失敗した理由を書く
        SVC->>TRAY: API を使えないことを知らせる
        SVC->>SVC: 録音開始のホットキーの受付を始める
      ```
    expected:
      - トレイで API を使えないことが知らされている
      - ログに待ち受けに失敗した理由が書かれている
      - 録音開始のホットキーを押すと録音が始まる
    test: test_error_when_api_unavailable
  - name: 正常シナリオ（古い AI チャットの設定が残っている）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 古い設定
        description: '`settings.toml` の `outputs` に `id = "ai_chat"` の項目と送り先（`targets[]`）を 2 つ書いておく（うち 1 つは出さない）'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TOML as settings.toml
        participant TRAY as トレイ

        U->>SVC: ショートカットから起動する
        SVC->>TOML: 設定を読む
        SVC->>SVC: ai_chat の送り先を、ブラウザ添付の種類のプリセットへ読み替える
        Note over SVC: 以降は 正常シナリオ と同じ
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - トレイのアイコンが待機中になっている（起動が止まらない）
      - 録音の画面に、出すとした送り先と同じタイトル・ホットキーのプリセットのボタンだけが出る
      - そのボタンで確定すると、送り先の URL を開いて貼り付け、Enter まで送る
      - 起動しただけでは `settings.toml` が書き換わっていない
lead: 'ショートカットから常駐サービスを起動し、文字起こしのエンジン・API の待ち受け・ホットキーの受付を立てて、録音の開始を待つ状態にする単一ユースケース。'
issue: 14
primary_actor: 音声入力を使うユーザー
trigger: ユーザーが常駐サービスのショートカットを開く
preconditions:
  - Windows の端末で、リポジトリの直下に仮想環境がある
  - 設定ファイル（`%APPDATA%\voice-paste\settings.toml`）がある（無ければ既定値で作る）
test_file: tests/e2e/単一ユースケース/test_start_resident_app.py
