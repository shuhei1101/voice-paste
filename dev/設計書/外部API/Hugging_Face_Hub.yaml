title: "Hugging Face Hub"
version:
  api_version: 版の指定なし（URL は huggingface_hub が組む）
  checked_on: '2026-09-30'
auth:
  method: なし（公開のモデルを取得する）
endpoints:
  - name: GET /{リポジトリ}/resolve/{版}/{ファイル}
    method: GET
    path: /{リポジトリ}/resolve/{版}/{ファイル}
    summary: '`WHISPER_MODEL` に当たる faster-whisper のモデルのファイルを取る（手元のキャッシュに無いときだけ）'
    status_codes:
      - code: '200'
        condition: モデルを取得できた
      - code: 取得できない
        condition: 文字起こしワーカーがモデルを読み込めず ready を返さないため、起動の処理が止まる
lead: 機械学習のモデルを配るリポジトリのサービス。
used_in:
  - voice_paste_legacy/transcription/whisper_worker.py
verification:
  state: 未確認
  detail: コードは直接呼ばず、faster-whisper がモデルを読み込むときに手元に無ければ取得する。動かしてはいない
base_urls:
  - env: 本番
    url: https://huggingface.co
official_url: https://huggingface.co
