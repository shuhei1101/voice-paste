  - name: _fade_to
    title: 音量を変える
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: internal
    summary: 目標の音量へ fade_sec をかけて変える。fade_sec が 0 以下なら呼び出しの中ですぐ変える。音量のロックを持ち、進行中のフェードを打ち切った後に呼ぶ
    args:
      - name: target
        type: float
        required: true
        passing: positional
        description: 目標の音量（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: かける秒数
    returns:
      type: None
      description: なし
    process: |-
      1. fade_sec が 0 以下なら、COM を初期化して target を書き、解放する
         - pycaw・COM が例外を出した場合、VolumeControlError を送出する
      2. fade_sec が正なら、target を進行中のフェードの目標として持ち、新しい打ち切りの合図を作ってデーモンのスレッドを始める
         - スレッドの中で COM を初期化し、今の音量から target までを FADE_STEPS 段に分け、fade_sec / FADE_STEPS 秒ごとに 1 段ずつ書く（今の音量と target の差が 0.005 未満なら 1 回で書く）
         - 打ち切りを知らされたら、次の段を書かずに終わる
         - pycaw・COM が例外を出した場合、そこで終わる
           - `[ERROR]` 音量を変えられなかった（理由）
    exceptions:
      - name: VolumeControlError
        condition: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した
    unit_tests:
      - name: test_fade_to
        case: 正常
        summary: FADE_STEPS 段で目標の音量に届く
        condition: 今の音量 0.8、target=0.4・fade_sec=0.1 で呼び、1 秒待つ
        mock: _open_endpoint_volume
        expected: 書かれた音量が FADE_STEPS 個で単調に減り、最後が 0.4
      - name: test_fade_to_when_write_failed
        case: 異常
        summary: すぐ変えるときに書けなければ VolumeControlError
        condition: fade_sec=0、SetMasterVolumeLevelScalar が COMError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出される
        exception: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した
    status: implemented
