id: IF-9
visibility: internal
title: "録音を完了する"
entry:
  kind: endpoint
  value: POST /sessions/{session_id}/complete
flows:
  - name: 正常系
    summary: 停止した録音を確定し、文字起こしを始める
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジンを差し替える。履歴は一時フォルダに書く
      - name: 停止中のセッション
        description: 録音を開始する と 録音を停止する を呼んだセッション
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant HIST as 履歴
        participant ENG as 文字起こしのエンジン

        C->>IF: トークン・session_id
        IF->>HIST: 確定した録音を保存する
        IF->>ENG: 文字起こしを始める
        IF-->>C: 202
      ```
    expected:
      - 202 が返る
      - 履歴に確定した録音がある
      - 文字起こしのエンジンに録音が渡っている
    test: test_normal
  - name: 正常系（録音中から完了する）
    summary: 停止せずに完了すると、録音を停止してから確定する
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジンを差し替える。履歴は一時フォルダに書く
      - name: 録音中のセッション
        description: 録音を開始する だけを呼んだセッション
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant MIC as マイク
        participant HIST as 履歴
        participant ENG as 文字起こしのエンジン

        C->>IF: トークン・session_id
        IF->>MIC: 録音を停止する
        IF->>HIST: 確定した録音を保存する
        IF->>ENG: 文字起こしを始める
        IF-->>C: 202
      ```
    expected:
      - 202 が返る
      - システム音量が録音前の値に戻っている
      - 履歴に確定した録音がある
    test: test_normal_when_recording
  - name: 正常系（連続録音を完了する）
    summary: 連続録音の録音を停止し、区間に切り出していない話し声を最後の区間として区切る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジン・話し声の判定を差し替える。履歴は一時フォルダに書く
      - name: 連続録音のセッション
        description: 録音を開始する を continuous=true で呼び、区間を 1 つ区切った後、話し声が続いている間に完了を呼ぶ
        notes: 話し声の判定は、最初の話し声の後に区切りの無音を返し、その後は話し声を返し続ける
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant MIC as マイク
        participant HIST as 履歴
        participant ENG as 文字起こしのエンジン

        C->>IF: トークン・連続録音の session_id
        IF->>MIC: 録音を停止する
        IF->>HIST: 区間に切り出していない話し声を最後の区間として保存する
        IF->>ENG: 最後の区間を区切った順の待ちに積む
        IF-->>C: 202
      ```
    expected:
      - 202 が返る
      - システム音量が録音前の値に戻っている
      - 履歴に通し番号 1 と 2 の区間の録音がある
      - 文字起こしのエンジンに通し番号 2 の区間が通し番号 1 の後に渡っている
      - 同じセッションへの 2 度目の完了が 404 になる
    test: test_normal_when_continuous
  - name: 正常系（話し声が残っていない連続録音を完了する）
    summary: 区間に切り出していない話し声が無ければ、最後の区間を作らずに終える
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジン・話し声の判定・返送を差し替える。履歴は一時フォルダに書く
      - name: 連続録音のセッション
        description: 録音を開始する を continuous=true で呼び、無音だけを流して完了を呼ぶ
        notes: 話し声の判定は無音だけを返す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant MIC as マイク
        participant RET as 呼び出し元へ返す

        C->>IF: トークン・連続録音の session_id
        IF->>MIC: 録音を停止する
        IF->>RET: session_id・result=completed・segment_count=0
        IF-->>C: 202
      ```
    expected:
      - 202 が返る
      - 履歴にこのセッションの録音が無い
      - 文字起こしのエンジンに何も渡っていない
      - 呼び出し元へ返す に result=completed・segment_count=0 が渡っている
    test: test_normal_when_continuous_without_speech
  - name: 異常系（トークンが合わない・401）
    summary: トークンが合わなければ確定しない
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジンを差し替える
      - name: 停止中のセッション
        description: 録音を開始する と 録音を停止する を呼んだセッション
      - name: トークン
        description: 今回の起動のものと違うトークン
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant LOG as ログ

        C->>IF: 合わないトークン
        IF->>LOG: 断った理由と要求元（Host・Origin）を書く（トークンは書かない）
        IF-->>C: 401
      ```
    expected:
      - 401 が返る
      - セッションが停止中のままで、文字起こしが始まっていない
      - ログに断った理由と要求元が書かれ、トークンの値は書かれていない
    test: test_error_when_token_mismatch
  - name: 異常系（ブラウザからの要求・403）
    summary: Origin の付いた要求と、Host が待ち受けのホストでない要求を断る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジンを差し替える
      - name: 停止中のセッション
        description: 録音を開始する と 録音を停止する を呼んだセッション
      - name: 要求のヘッダー
        description: 正しいトークンに Origin を付けるか、Host をほかのホスト名にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete
        participant LOG as ログ

        C->>IF: Origin ありか、ほかの Host
        IF->>LOG: 断った理由と要求元（Host・Origin）を書く（トークンは書かない）
        IF-->>C: 403
      ```
    expected:
      - 403 が返る
      - 文字起こしが始まっていない
      - ログに断った理由と要求元が書かれ、トークンの値は書かれていない
    test: test_error_when_browser_request
  - name: 異常系（知らないセッション・404）
    summary: 録音中でも停止中でもないセッションは断る
    setup:
      - name: Mock
        description: マイク・システム音量・トレイ・文字起こしのエンジンを差し替える
      - name: セッションの ID
        description: 開始で受け取っていない ID か、既に完了したセッションの ID
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as POST /sessions/{session_id}/complete

        C->>IF: トークン・知らない session_id
        IF-->>C: 404
      ```
    expected:
      - 404 が返る
      - 文字起こしが始まっていない
      - 処理中のほかのセッションがあれば、そのまま続いている
    test: test_error_when_session_unknown
lead: API から始めた録音を確定して履歴に残し、文字起こしを始める。連続録音では録音を停止し、区間に切り出していない話し声を最後の区間として区切る。結果は応答ではなく返送先へ届く。
identifier: complete_session
permissions: 今回の起動のトークン
idempotent: false
side_effects: 録音中なら録音を停止して音量を戻す。確定した録音を履歴に保存し（履歴を残す設定のとき）、文字起こしを始める。終わったら 呼び出し元へ返す が返送先へ送信する。連続録音では、区間に切り出していない話し声が残っていれば最後の区間として履歴に保存して区切った順の待ちに積み、全ての区間を返した後に 呼び出し元へ返す が終わり（completed）を送信する。
exclusivity: 完了したセッションは、返送を終えるまで（連続録音では残りの区間と終わりを返し終えるまで）処理中としてほかの開始を断る。同じセッションへの 2 度目の完了は 404。
request:
  - name: Authorization
    type: str
    required: true
    location: header
    description: 今回の起動のトークン
    format: '`Bearer {トークン}`'
    status: implemented
  - name: session_id
    type: str
    required: true
    location: path
    description: 開始で受け取ったセッションの ID
    format: uuid
    status: implemented
response_notes: |-
  > [!NOTE]
  > 202 は文字起こしを受け付けたことだけを表し、起こした文字・空の文字・失敗は 呼び出し元へ返す が返送先へ届ける。連続録音では、残りの区間の文字と終わり（completed）が返送先へ届く。
status_codes:
  - code: '202'
    condition: 録音を確定し、文字起こしを始めた（連続録音では、録音を停止して最後の区間を区切った）
  - code: '401'
    condition: トークンが無いか、今回の起動のものと合わない
  - code: '403'
    condition: Origin が付いているか、Host が 127.0.0.1 でも localhost でもない
  - code: '404'
    condition: そのセッションが録音中でも停止中でもない（知らない ID・完了済み・上限で打ち切り済み）
error_format: 録音を開始する と同じ RFC 9457 の `application/problem+json`。
constraints:
  - item: 待ち受け
    constraint: 127.0.0.1 だけ
  - item: 認可
    constraint: 起動ごとに作るトークンの一致。Host・Origin の確かめ方は 録音を開始する と同じ
  - item: タイムアウト
    constraint: 制限なし
    notes: 文字起こしを待たずに 202 を返す
test_file: tests/integration/test_complete_session.py
