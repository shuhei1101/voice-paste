    test: test_normal_when_running_haas_differs
    notes:
      止めない理由: 起動の前から動いていたサーバーは、ほかのプロセスが使用していることがあるため止めない（正常シナリオ（Haas を使用する設定） の補足『サーバーを止める』）。
      比べる値: 比べるのはサーバーの起動で決まるモデル・計算の精度・装置だけ。サーバーが起動の引数で受けた値（`auto` は解決する前の `auto` のまま）を、設定の値と文字列で比べる。要求ごとの調整の値は要求で送信するため比べない。
lead: '常駐サービスを起動し、文字起こしのエンジン・API の待ち受け・ホットキーの受付を立てて、録音の開始を待つ状態にする単一ユースケース。'
issue: 14
primary_actor: 音声入力を使用するユーザー
trigger: ユーザーが常駐サービスを起動する（Windows はショートカットを開く、Linux は起動のスクリプト `voice-paste.sh` を流すか、アプリの一覧・ログイン時の自動起動から開く）
preconditions:
  - Windows か Linux（Ubuntu 24.04 の GNOME の Xorg か Wayland のセッション）の端末で、リポジトリの直下に仮想環境がある（起動の手段が `uv sync --frozen` で `uv.lock` に揃える）
  - Linux では OS のパッケージ `xclip`・`libportaudio2`・`libxcb-cursor0` と、依存の `evdev` のビルドに使用する `gcc`・`linux-libc-dev` が入っている
  - Linux の Wayland のセッションでは、`/dev/uinput` に書き込める（udev の規則と `input` グループへの追加の後に再起動している）
  - リポジトリの `config/defaults.yaml` に設定の既定値がある。環境の値の `settings.yaml` とリポジトリ直下の `settings.local.yaml` は無くてもよい（補足『設定のレイヤー』）
test_file: tests/e2e/単一ユースケース/test_start_resident_app.py
notes:
  設定のレイヤー: |-
    設定は、既定値 → 環境の値 → checkout の上書きの順に、キーごとに後のレイヤーの値で上書きして読み込む。

    | レイヤー | ファイル | 無いとき |
    | --- | --- | --- |
    | 既定値 | リポジトリの `config/defaults.yaml` | 起動の失敗（異常シナリオ（設定を読み込めない）） |
    | 環境の値 | 設定の配置先（Windows は `%APPDATA%\voice-paste\`、Linux は `~/.config/voice-paste/`。`--data-dir` を引き渡した起動ではそのフォルダ）の `settings.yaml` | 飛ばす（作らない） |
    | checkout の上書き | リポジトリ直下の `settings.local.yaml` | 飛ばす |

    起動しただけではどのファイルも書き換えない（`settings.toml` だけが残っているときに `settings.yaml` を作るのを除く）。
  E2E のテスト: |-
    正常シナリオと「API の待ち受けを始められない」の期待値「録音開始のホットキーを押すと録音が始まる」と、「古い AI チャットの設定が残っている」の期待値のうちプリセットのボタンと確定して送信するまでの 2 つは、録音の入力を WAV を流すものに、システム音量を下げた値と戻した値を控えるものに差し替えて確認する（マイクを開かない）。「古い AI チャットの設定が残っている」は、さらに貼り付けのキーを送信したキーを控えるものに、ブラウザを開く呼び出しを引き渡された URL を控えるものに差し替え、送信先の URL を開いて貼り付け、Enter まで送信することを、控えた URL・クリップボード・控えたキーで確認する

    E2E は実機のマウス・キーボードを使用せず、Windows のシェル（タスクバーのトレイ・通知・エクスプローラー）を読み込まない（[#75 画面・トレイの E2E のマウス・キーボードの操作をモックにし、ユーザーの PC 操作を止めずに流せるようにする](https://github.com/shuhei1101/voice-paste/issues/75)）。
    常駐アプリは pytest のプロセスの中で `main()` から起動し（`--data-dir` の一時フォルダ、Qt は offscreen で画面に出さない）、トレイの状態はトレイのアイコンのヒントの文字で、通知はログで確認する。
    トレイのメニューは項目を trigger して選び、画面のボタン・欄はクリックとキーを Qt のイベントで引き渡す。
    ホットキーの受付は差し替え、ホットキーが押された体で登録された関数を呼ぶ。「文字起こしのエンジンを準備できない」の「録音開始のホットキーを押しても録音が始まらない」は、ホットキーの受付が始まっていないことで確認する。
    「前の常駐サービスが動いている」は、別プロセスで 2 つ起動し、ログ・トークンのファイル・プロセスで確認する。前のアイコンが残っていないことは、前のプロセスが片付けでアイコンを消して終わったことで確認する
  Wayland のセッションのホットキー: |-
    Linux の Wayland のセッションでは、常駐サービスは設定のホットキーを GNOME のカスタムショートカットへ登録する。
    押されたホットキーは、GNOME が登録のコマンドを流し、コマンドが同じ uid の常駐サービスへ伝える。
    「ホットキーの受付を始める」は登録、「停止する」は登録を外すことに当たる。
    登録は、トレイの終了・再起動、SIGTERM での終了、新しい常駐サービスからの終わる依頼で外し、設定画面を開いている間も外す。
    残った登録は押したキーを GNOME が受けてアプリへ届けないため、起動のたびに前の登録の残りを外してから登録する。
    Wayland のセッションのシナリオの E2E は、Linux で E2E を自動で流す仕組み（[#219](https://github.com/shuhei1101/voice-paste/issues/219)）ができるまで持たず、検証環境の VM で確認する。
