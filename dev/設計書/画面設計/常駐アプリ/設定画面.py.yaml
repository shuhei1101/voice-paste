    description: ヒントを渡すと変わる書き方と、引っ張られた語への対処を箇条書きで伝える
    label: 'ヒントを渡すと、句読点が付く・改行がまとまる・口癖が一部消える。 / 並べた表記にほかの語が引っ張られたら、その語も足す（例: TypeScript がタイプスクリプトになったら「TypeScript」を足す）。（「 / 」で区切った 2 項目）'
    io: 表示
    visible_when: 表記のヒントのまとまりを選んだとき
    status: implemented
  - name: 保存した知らせ
    id: saved_notice
    kind: label
    position: 窓 > フッターの上
    description: 「保存」で書けたことを伝える。ホットキーの欄（`hotkeys.*`・`outputs[].hotkey`・`presets[].hotkey`。`keyboard.paste_key` は含めない）のどれかが開いたときの値から変わっていれば、設定画面を閉じると効くことを添える。反映が restart の欄が開いたときの値から変わっていれば、その件数と再起動するまで前の値で動くことを添え、右に今すぐ再起動のボタンを出す。読み上げにも伝える（role=status）
    label: 保存しました。（ホットキーの欄が開いたときの値から変わっているとき「新しいホットキーは、設定画面を閉じると効きます。」、反映が restart の欄が変わっているとき「「再起動で反映」の設定 {件数} 件は、再起動するまで前の値で動きます。」をこの順に続ける）
    visible_when: 「保存」で確かめに通って書けた後。欄を変えると消す
    refs:
