notes:
  依存の向き: |-
    コーディング規約『依存関係管理』のとおり `features`・`server`・`ui` → `integrations`・`runtime` → `shared` とし、上の層へは import しない。
    `features` どうしと、`features/outputs` の出力先どうしも import しない。録音セッションはほかの feature を SessionDeps の関数型で受け取り、`main.py` だけが全てを知る。
    `server` は録音セッションの route を include_router で集め、SessionApiDeps を app.state に置くためだけに `features/session` を import する。route は `main.py`・`server` を import せず、SessionApiDeps を app.state から受け取る。
    `ui` は `features` の中を直に呼ばず、UiDeps の関数と `shared` の設定のモデルだけを使う。型としては `features.session.types`（Session・SessionState）だけを import する。`runtime/hotkey.py` は録音セッションを import せず、`main.py` が渡す関数を呼ぶ。
  依存の向きの検査: |-
    import-linter の契約を pyproject.toml の `[tool.importlinter]`（root_package は `voice_paste`）に置き、単体テストと一緒に `lint-imports` で回す（品質シナリオ 5。コマンドは設計書『テスト実行方法』）。

    | 契約 | 種類 | 中身 |
    | --- | --- | --- |
    | 層 | layers | `voice_paste.main` → `voice_paste.server` \| `voice_paste.ui` → `voice_paste.features` → `voice_paste.integrations` \| `voice_paste.runtime` → `voice_paste.shared`（`\|` で並べた層どうしも import しない） |
    | feature の独立 | independence | `voice_paste.features.*` |
    | 出力先の独立 | independence | `voice_paste.features.outputs.*`。ignore_imports で `voice_paste.features.outputs.registry -> voice_paste.features.outputs.*`・`voice_paste.features.outputs.service -> voice_paste.features.outputs.registry`・`voice_paste.features.outputs.** -> voice_paste.features.outputs.types` を除く |
    | 画面から feature の中へ | forbidden | source_modules は `voice_paste.ui`、forbidden_modules は `voice_paste.features`・`voice_paste.integrations`。ignore_imports で `voice_paste.ui.** -> voice_paste.features.session.types` を除く |

    出力先を追加するときは `features/outputs/` にサブフォルダを追加するだけで契約の対象に入り、契約は直さない。
  OS ごとの実装: |-
    OS で分かれる実装は、Windows と Linux で別のファイルに置き、select_platform_adapters だけが CURRENT_OS で選んで import する（Windows 専用のライブラリ・ctypes の Win32 を Linux で import しない）。
    Linux のうちデスクトップのセッションで分かれる実装は、select_platform_adapters が DisplaySession でさらに選ぶ。

    | 対象 | Windows | Linux |
    | --- | --- | --- |
    | 単一インスタンス | runtime/single_instance.py（名前付きミューテックスとイベント） | runtime/single_instance_linux.py（flock のロックファイルと抽象名前空間のソケット） |
    | システム音量 | integrations/volume/adapter.py（pycaw） | integrations/volume/noop.py（下げない） |
    | ブラウザ添付のアプリのウィンドウ | integrations/browser/opener.py（Microsoft Edge の `--app`） | integrations/browser/opener_linux.py（Chromium 系の `--app`。無ければ既定のブラウザ） |
    | 文字起こしワーカーの起動 | CREATE_NO_WINDOW | 0 |
    | 再起動 | DETACHED_PROCESS・CREATE_NEW_PROCESS_GROUP | start_new_session |
    | ホットキーの受付 | runtime/hotkey.py（pynput） | Xorg: Windows と同じ。Wayland: runtime/hotkey_gnome.py（GNOME のカスタムショートカット） |
    | 貼り付けのキー | integrations/keyboard/sender.py（pynput） | Xorg: integrations/keyboard/sender_linux.py（XTEST）。Wayland: integrations/keyboard/sender_wayland.py（uinput） |
    | Enter | integrations/keyboard/sender.py（pynput） | Xorg: Windows と同じ。Wayland: integrations/keyboard/sender_wayland.py（uinput） |
    | クリップボード | pyperclip（Windows の API） | Xorg: pyperclip（xclip）。Wayland: pyperclip の書き先を xclip に指定（XWayland） |
    | Qt のプラットフォーム | Qt に任せる | Xorg: Qt に任せる。Wayland: xcb（XWayland） |

    OS に固有の実装の単体テストは、テストファイルの先頭の `pytestmark = pytest.mark.skipif(...)` で、対象でない OS では飛ばす（Windows 専用: 単一インスタンス・音量のアダプタ。Linux 専用: single_instance_linux.py・sender_linux.py・sender_wayland.py・hotkey_gnome.py・send_hotkey.py）。
