files:
- path: index.md
  visibility: public
  description: voice-paste の公開ドキュメント全体の目次として、はじめに・使い方・リファレンスのページへの入口を記載し、公開ドキュメントのページを探すときに参照する。
  tags:
  - topic:目次
  - topic:ドキュメント
  - topic:使い方
  - topic:リファレンス
- path: design-policy.md
  visibility: internal
  description: 画面全体に通すデザインスタイルと、色・書体・文言の役割を記載し、画面やモックの見た目と文言を決めるときに参照する。
  tags:
  - topic:デザインスタイル
  - topic:デザイン
  - topic:スタイル
  - topic:画面
  - topic:色
  - topic:書体
  - topic:文言
  - topic:方針
  - topic:雰囲気
  - topic:モチーフ
  - topic:装飾
  - topic:文字
  - topic:形状
  - topic:奥行き
  - topic:動き
  - action:採用
- path: README.md
  name: ドキュメント全体の目次
  visibility: internal
  description: docs/ の設計書のフォルダの一覧を index.yaml から生成した目次として受け持ち、GitHub で設計書のフォルダを探すときに参照する。
  tags:
  - topic:目次
  - topic:ドキュメント
- path: _config.yml
  name: GitHub Pages のサイトの設定
  visibility: internal
  description: docs/ を Jekyll のサイトとして公開するときのタイトル・URL・読み込むテーマを受け持ち、公開ドキュメントのサイトの設定を変えるときに参照する。
  tags:
  - tool:jekyll
  - topic:設定
- path: _theme/_data/nav.project.yml
  name: 公開ドキュメントのプロジェクト固有のタブ
  visibility: internal
  description: 公開ドキュメントのサイトの、docs/guide/ の分類から書き出したプロジェクト固有のタブを受け持ち、サイトのタブの並びを確認するときに参照する。
  tags:
  - topic:タブ
  - topic:ドキュメント
  - tool:jekyll
- path: _theme/_data/nav.yml
  name: 公開ドキュメントの上タブの並び
  visibility: internal
  description: 公開ドキュメントのサイトの上タブの並びと実体を持たないタブの行き先を受け持ち、サイトのタブを変えるときに参照する。
  tags:
  - topic:タブ
  - topic:ドキュメント
  - tool:jekyll
- path: _theme/_includes/sidebar-source.html
  name: 公開ドキュメントのサイドバーの元の目次
  visibility: internal
  description: README の目次の表からサイドバーの元になる隠し要素を埋める処理を受け持ち、サイトのサイドバーの項目の出し方を変えるときに参照する。
  tags:
  - topic:目次
  - tool:jekyll
- path: _theme/_includes/tab-link.html
  name: 公開ドキュメントの上タブのリンク
  visibility: internal
  description: 上タブ 1 つ分の種別ごとの行き先とリンクを出す処理を受け持ち、サイトのタブのリンクの出し方を変えるときに参照する。
  tags:
  - topic:タブ
  - tool:jekyll
- path: _theme/_layouts/default.html
  name: 公開ドキュメントの共通のレイアウト
  visibility: internal
  description: 公開ドキュメントの全てのページの骨格・タブ・サイドバーの配置を受け持ち、サイトのページの構成を変えるときに参照する。
  tags:
  - topic:ドキュメント
  - tool:jekyll
- path: _theme/assets/app.js
  name: 公開ドキュメントの共通のスクリプト
  visibility: internal
  description: 公開ドキュメントとモックの全てのページで読み込む表示の補助の処理を受け持ち、サイトの画面の振る舞いを変えるときに参照する。
  tags:
  - topic:ドキュメント
  - topic:モック
- path: _theme/assets/style.css
  name: 公開ドキュメントの共通のスタイル
  visibility: internal
  description: 公開ドキュメントとモックの全てのページで読み込む見た目を受け持ち、サイトの見た目を変えるときに参照する。
