普段使いのクローンの作業ツリーの書き出し直し:
  説明: 普段使いのクローン（master）で、作業ツリーの改行コードが `.gitattributes` の属性と食い違うファイル（`git ls-files --eol` の `w/` が属性の `eol` と違うもの）を、改行コードを除いて index と同じ中身であることを確かめてから index から書き出し直す。中身の差があるファイルは書き出し直さずに依頼元へ返す。書き出し直すのは改行コードだけで、中身は index と同じため、切り戻しは持たない
  タグ: [作業ツリーの書き出し直し]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: 普段使いのクローンの作業ツリーの書き出し直し/疎通確認.sh
  実行: 普段使いのクローンの作業ツリーの書き出し直し/実行.sh
  確認: 普段使いのクローンの作業ツリーの書き出し直し/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 普段使いのクローンで `git status --short` が `.claude/` 以外を出さず、`git ls-files --eol` で作業ツリーが CRLF（`w/crlf`）のファイルが `.bat` だけになっている
  状態: "-"
