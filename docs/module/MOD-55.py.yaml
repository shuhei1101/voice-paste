id: MOD-55
visibility: internal
title: 常駐アプリ / 出力先 / settings.py
data_models:
  - name: PasteAndSendSettings
    title: 貼り付けて送信の設定
    container: features/outputs/paste_and_send/settings.py
    usecase: 起こした文字を届ける
    role: 設定のモデル
    summary: 出力先 paste_and_send のオン・オフ・確定のホットキー・貼り付けから送信までの間・Enter と一緒に押す修飾キー
    inherits: OutputSettingsBase
    properties:
      - name: id
        type: Literal["paste_and_send"]
        default: paste_and_send
        description: 出力先の ID（設定の outputs[] の判別子）
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        description: この出力先で確定するホットキー。OS で既定が変わるため既定値を持たず必須（既定の一覧の値は config/defaults.yaml の outputs と os_overrides が持ち、<ctrl>+<alt>+d、Linux は <cmd>+<alt>+d）
      - name: enter_delay_sec
        type: float
        default: '0.5'
        description: 貼り付けてから Enter を送信するまで待つ秒数（0 以上）。設定画面の欄の下に、`json_schema_extra` の note の「「貼り付けて送信」と、「ブラウザ添付」の Enter まで送信するプリセットで使用する。」を出す
      - name: enter_modifiers
        type: list[EnterModifier]
        default: '[]'
        description: Enter と一緒に押す修飾キー。設定画面は「。」までを欄の名前にし、`json_schema_extra` の choice_labels（ctrl → Ctrl・alt → Alt・shift → Shift）でチェックボックスの名前を出す。反映は immediate。並びと重なりはそのまま持ち、押す順は send_enter が統一する
    status: planned
