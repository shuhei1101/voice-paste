title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/transcription
      ```
    description: pytest で実行する。faster-whisper のモデルは Mock にする。
    prerequisites:
      - 外部依存なし（GPU も録音も要らない）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {単体テストファイルパス}
        ```
  - name: 結合テスト（バック）
    run_all: 未確定
  - name: E2E テスト
    run_all: 未確定
  - name: 非機能要件テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/nfr
      ```
    description: pytest で実行する。録音・用語集・設定・期待値は git 管理外の `tests/nfr/fixtures/` から読み、今のローカルの Whisper（GPU）で起こす。
    prerequisites:
      - Windows と NVIDIA GPU が要る（無い環境では文字起こしのテストを skip する。CUDA の DLL は venv の `Lib/site-packages/nvidia/` から読む）
      - '`tests/nfr/fixtures/` に録音・用語集・設定・期待値が要る（無ければ skip する）'
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {非機能要件テストファイルパス}
        ```
  - name: 外部疎通テスト
    run_all: 未確定
prerequisites:
  - Windows の Python 3.11 以上の venv（`venv/Scripts/python.exe`）に `pip install -e .` と `pip install pytest` を済ませる
