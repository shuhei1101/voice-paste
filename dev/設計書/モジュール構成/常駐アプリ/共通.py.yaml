classes:
  - name: AppError
    title: アプリの例外
    container: shared/errors.py
    usecase: 共通
    role: 例外
    kind: クラス
    inherits: Exception
    summary: このアプリが送出する例外の根。API サーバーの例外ハンドラが HTTP のステータスへ変える
    description: |
      | 例外 | 意味 | HTTP |
      | --- | --- | --- |
      | `CallbackNotAllowedError` | 返送先が許されない | 400 |
      | `UnauthorizedError` | トークンが合わない | 401 |
      | `ForbiddenRequestError` | Origin が付いている・Host が違う | 403 |
      | `SessionNotFoundError` | セッションが無い・操作できない状態 | 404 |
      | `SessionBusyError` | ほかのセッションが処理中 | 409 |
      | `MicrophoneUnavailableError` | マイクを開けない | 503 |
      | `TranscriptionError` | 文字起こしに失敗した（API へは返さず返送先へ届ける） | - |
      | `EngineError` | エンジンが失敗した（外部連携が送出し、文字起こしが TranscriptionError に変える） | - |
      | `DeliveryError` | 出力先へ届けられない | - |
      | `UnknownOutputError` | 選んだ出力先が一覧に無いかオフ（`DeliveryError` の子） | - |
      | `VolumeControlError` | システム音量を操作できない | - |
      | `SettingsError` | 設定の値が合わない（合わないキーをメッセージに並べる） | - |
      | `StartupError` | 起動に失敗した（エンジンを準備できない・前のプロセスが排他を放さない） | - |
      | `HotkeyError` | ホットキーの書式を pynput が読めない | - |

      全ての例外は docstring だけを持つクラスで `shared/errors.py` に置き、親は表に書かない限り `AppError`。
    status: implemented
functions:
  - name: load_settings
    title: 設定の読み込み
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: public
    summary: settings.toml を読んで検証する。無ければ既定値で作る
    side_effects: settings.toml が無いときだけ、既定値の settings.toml を書く。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: settings.toml
    returns:
      type: Settings
      description: 検証した設定
    process: |-
      1. path が無いかを確かめる
         - 無い場合、既定の Settings を書いて返す（設定の書き戻し）
           - `[INFO]` 設定ファイルが無いため既定値で作った（path）
      2. UTF-8 で読み、tomlkit で解釈する
         - TOMLKitError の場合、SettingsError を送出する
      3. 文書を素の dict にして Settings.model_validate で検証して返す
         - pydantic.ValidationError の場合、合わないキーをドット区切り（例 `transcription.local_whisper.beam_size`、出力先は `outputs[0].hotkey`）で並べた SettingsError を送出する
    exceptions:
      - name: SettingsError
        condition: TOML の書式が壊れている
        message: '設定ファイルを読めない（{path}: {理由}）'
      - name: SettingsError
        condition: 値がモデルに合わない・知らないキーがある・出力先の ID が重なる
        message: '設定の値が合わない（{キー}: {理由}、…）'
    unit_tests:
      - name: test_load_settings_when_missing
        case: 正常
        summary: 無ければ既定値で作る
        condition: settings.toml の無い一時フォルダ
        mock: なし（一時フォルダ）
        expected: Settings() と等しい設定が返り、settings.toml ができている
      - name: test_load_settings
        case: 正常
        summary: 書いた値を読む
        condition: transcription.local_whisper.model = "small"、outputs が copy_only だけの settings.toml
        mock: なし（一時フォルダ）
        expected: local_whisper.model が small、outputs が CopyOnlySettings 1 件、書いていない項目は既定値
      - name: test_load_settings_when_sample_file
        case: 正常
        summary: リポジトリの見本は既定値と一致する
        condition: リポジトリの直下の settings.sample.toml
        mock: なし
        expected: Settings() と等しい
      - name: test_load_settings_when_invalid_value
        case: 異常
        summary: 合わない値はキーを示して断る
        condition: parametrize で (1) transcription.local_whisper.beam_size = "x" (2) transcription.engine = "openai"（作らないエンジン）
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) transcription.local_whisper.beam_size (2) transcription.engine を含む
        exception: 値がモデルに合わない
      - name: test_load_settings_when_unknown_key
        case: 異常
        summary: 知らないキーを断る
        condition: parametrize で (1) recording.volum_percent = 30（書き間違い） (2) [transcription.openai] の表に model = "whisper-1"（消した設定）
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) recording.volum_percent (2) transcription.openai を含む
        exception: 知らないキーがある
      - name: test_load_settings_when_duplicate_output_id
        case: 異常
        summary: 出力先の ID の重なりを断る
        condition: outputs に copy_only が 2 件
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに outputs を含む
        exception: 出力先の ID が重なる
      - name: test_load_settings_when_broken_toml
        case: 異常
        summary: 壊れた TOML を断る
        condition: '`[recording` で閉じていない'
        mock: なし（一時フォルダ）
        expected: SettingsError
        exception: TOML の書式が壊れている
    refs:
      - dev/設計書/外部ライブラリ/tomlkit#
    status: implemented
  - name: save_settings
    title: 設定の書き戻し
    kind: 関数
    container: shared/settings.py
    usecase: 共通
    scope: public
    summary: 検証した設定を、コメントを保ったまま tomlkit で書き戻す。再起動が要る項目が変わったかを返す
    side_effects: path を書く（親のフォルダが無ければ作る）。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: settings.toml
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 書く設定（検証済み）
    returns:
      type: bool
      description: 再起動が要る項目が変わったか
    process: |-
      1. path があれば tomlkit で読み、無ければ空の文書にする
      2. 読んだ文書を Settings として検証し、前の設定にする
         - 無い場合、前の設定は無しとする
         - 読めない・検証に通らない場合、内容を空の文書にして前の設定を「全て変わった」とする
      3. settings を `model_dump(mode="json")` する
      4. 文書の値を再帰で置き換える。表はキーごとに書き換えて既存のコメントと並びを保ち、配列（出力先の一覧・AI チャットの送り先・許すホスト）は丸ごと入れ替える。None の項目（glossary_path）はキーを置かず、文書に既にあれば消す
      5. 親のフォルダを作り、同じフォルダの一時ファイルに UTF-8 で書いて os.replace で置き換える
      6. reload が restart の項目のうち、前の設定と値が違うものが 1 つでもあれば True、無ければ False を返す（前の設定が無いときは False）
    unit_tests:
      - name: test_save_settings_when_comments
        case: 正常
        summary: コメントを保ったまま値を書き換える
        condition: コメント付きの settings.toml に、hotkeys.start を変えた設定を書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルに元のコメントが残り、load_settings で新しい値が読める
      - name: test_save_settings_when_restart_item_changed
        case: 正常
        summary: 再起動が要る項目が変われば True
        condition: transcription.local_whisper.model を large-v3 から small へ変えて書く
        mock: なし（一時フォルダ）
        expected: 'True'
      - name: test_save_settings_when_immediate_item_changed
        case: 正常
        summary: 即時に効く項目だけなら False
        condition: hotkeys.start だけを変えて書く
        mock: なし（一時フォルダ）
        expected: 'False'
      - name: test_save_settings_when_missing
        case: 正常
        summary: 無ければフォルダごと作る
        condition: 存在しないフォルダの下の settings.toml
        mock: なし（一時フォルダ）
        expected: False。ファイルができ、glossary_path のキーが無い
      - name: test_save_settings_when_invalid_existing
        case: 正常
        summary: 壊れたファイルは書き直して再起動が要るとする
        condition: 書式の壊れた settings.toml に既定の設定を書く
        mock: なし（一時フォルダ）
        expected: True。load_settings で既定の設定が読める
      - name: test_save_settings_when_glossary_reset
        case: 正常
        summary: 用語集の場所を既定（None）に戻すとキーを消す
        condition: glossary_path = "C:/x/yogo.csv" を持つ settings.toml に Settings() を書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルに glossary_path のキーが無く、load_settings の glossary_path が None
    refs:
      - dev/設計書/外部ライブラリ/tomlkit#
    status: implemented
  - name: setup_logging
    title: ログの設定
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 標準の logging を日付ごとのファイルへ書くようにし、uvicorn のロガーもそこへ寄せる
    side_effects: ルートロガーと uvicorn のロガーのハンドラを入れ替える。log_dir が無ければ作る。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        required: true
        passing: positional
        description: ルートロガーのレベル
    returns:
      type: None
      description: なし
    process: |-
      1. log_dir を作る
      2. ルートロガーに既にこの関数が付けたハンドラがあれば外す（2 回呼んでも 1 組だけにする）
      3. 日付ごとのファイルのハンドラ（_DailyFileHandler）を付ける。書くたびにモジュールの `_today()`（今日の `date` を返す内部の関数。単体テストが差し替える）を呼び、`{log_dir}/{YYYY-MM-DD}.log` が変わっていれば開き直す
      4. 書式は 1 行 1 JSON（JSON Lines）で、ts（ローカルの時刻を UTC オフセット付きの ISO 8601）・level・name・msg・例外があれば exc を持つ（ensure_ascii=False）
      5. sys.stderr があれば同じ書式で stderr にも出す（pythonw では無い）
      6. ルートロガーのレベルを level にする
      7. uvicorn・uvicorn.error・uvicorn.access のロガーのハンドラを外し、propagate を True にする
    unit_tests:
      - name: test_setup_logging
        case: 正常
        summary: 今日のファイルに JSON Lines で書く
        condition: level=INFO、日本語の INFO と DEBUG を 1 行ずつ出す
        mock: なし（一時フォルダ）
        expected: '{log_dir}/{今日}.log に INFO の 1 行だけがあり、JSON として読めて msg が日本語のまま、ts に UTC オフセットが付く'
      - name: test_setup_logging_when_called_twice
        case: 正常
        summary: 2 回呼んでも二重に書かない
        condition: setup_logging を 2 回呼んでから 1 行出す
        mock: なし（一時フォルダ）
        expected: ファイルに 1 行だけ
      - name: test_setup_logging_when_date_changed
        case: 正常
        summary: 日付が変われば次のファイルへ書く
        condition: 1 行出した後に今日を翌日へ差し替えて 1 行出す
        mock: 今日の日付を返す関数（monkeypatch）
        expected: 2 つの日付のファイルに 1 行ずつ
      - name: test_setup_logging_when_uvicorn_logger
        case: 正常
        summary: uvicorn のログも同じファイルへ寄せる
        condition: uvicorn.error のロガーにハンドラを 1 つ付けておき、setup_logging の後に uvicorn.error へ INFO を 1 行出す
        mock: なし（一時フォルダ）
        expected: uvicorn.error のハンドラが空になり、今日のファイルに name が uvicorn.error の 1 行がある
    notes:
      秘密の値: トークンはログに出さない（断った要求のログにも含めない）。
    status: implemented
  - name: purge_old_logs
    title: 古いログの削除
    kind: 関数
    container: shared/logger.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 保持期間を過ぎた日付のログだけを消す（今日より前を全て消す今のやり方はやめる）
    side_effects: log_dir の下のファイルを消す。
    args:
      - name: log_dir
        type: Path
        required: true
        passing: positional
        description: ログの置き場所
      - name: retention_days
        type: int
        required: true
        passing: positional
        description: 保持期間
      - name: today
        type: date
        required: true
        passing: positional
        description: 今日
    returns:
      type: int
      description: 消したファイルの数
    process: |-
      1. log_dir の直下の `YYYY-MM-DD.log` の形の名前のファイルを拾う（それ以外の名前は触らない）
      2. 日付が today − retention_days 日より前のものを消す
         - `[INFO]` 古いログを消した（件数）
    unit_tests:
      - name: test_purge_old_logs
        case: 正常
        summary: 保持期間を過ぎた日付のログだけ消す
        condition: 保持 1 日、今日・1 日前・2 日前のログ
        mock: なし（一時フォルダ）
        expected: 2 日前だけが消え、戻り値が 1
      - name: test_purge_old_logs_when_other_names
        case: 正常
        summary: 日付の形でない名前は消さない
        condition: 保持 1 日、`notes.log`・`2026-13-40.log`・10 日前のログ
        mock: なし（一時フォルダ）
        expected: 10 日前だけが消え、戻り値が 1
    status: implemented
  - name: resolve_app_paths
    title: 置き場所の解決
    kind: 関数
    container: shared/constants.py
    usecase: 共通
    scope: public
    summary: データの置き場所が渡されればその下、無ければ platformdirs で引いた既定の置き場所で AppPaths を作る。フォルダは作らない
    args:
      - name: data_dir
        type: Path | None
        required: true
        passing: positional
        description: データの置き場所（`--data-dir`）。None は既定の置き場所
    returns:
      type: AppPaths
      description: 置き場所のパス
    process: |-
      1. data_dir が渡されているか
         - ある場合、設定・履歴・ログ・一時の音声・トークンを全て data_dir の下に置く
         - 無い場合、設定は user_config_dir(APP_NAME, appauthor=False, roaming=True)、それ以外は user_data_dir(APP_NAME, appauthor=False) の下に置く
    unit_tests:
      - name: test_resolve_app_paths_when_data_dir
        case: 正常
        summary: データの置き場所の下に全てを置く
        condition: data_dir=一時フォルダ
        mock: なし
        expected: settings_file が {data_dir}/settings.toml、log_dir が {data_dir}/log など全てが data_dir の下。フォルダは作られていない
      - name: test_resolve_app_paths_when_default
        case: 正常
        summary: 既定は platformdirs の置き場所
        condition: data_dir=None
        mock: platformdirs の user_config_dir・user_data_dir（それぞれ一時フォルダの config・local を返す）
        expected: settings_file が config/settings.toml、それ以外が local の下。user_config_dir に roaming=True が渡る
    refs:
      - dev/設計書/外部ライブラリ/platformdirs#
    status: implemented
  - name: find_hotkey_overlaps
    title: ホットキーの重なりの検出
    container: shared/settings.py
    usecase: 設定を変える
    summary: 受け付けるホットキーのうち、前に並んだものと重なるものを返す。Settings の確かめ（`model_validator(mode="after")`）が呼ぶ
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 確かめる設定
    returns:
      type: list[tuple[str, str]]
      description: （重なったキー, 先に並んだ同じホットキーのキー）の並び。キーは format_error_location と同じ書式（例 `outputs[3].targets[2].hotkey`）
    process: |-
      1. 受け付けるホットキーを（キー, 値）でこの順に並べる: `hotkeys.start`・`hotkeys.pause`・`hotkeys.cancel`、オンの出力先の `outputs[].hotkey`、オンの AI チャットの送り先の `outputs[].targets[].hotkey`（空のホットキーは受け付けないので並べない）
      2. 値を小文字にして、先に並んだものと同じものを集める
         - `hotkeys.start` と「貼り付けて送信」の `hotkey` が同じ組は重なりにしない（録音中に押すとその出力先で確定する既定）
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
    notes:
      補足: Settings に `model_validator(mode="after")` を足し、この関数が返した重なりごとに `PydanticCustomError` を集めた ValidationError を送出する（場所は重なったキー、理由は「{先のキー}と同じホットキー」）。設定画面は list_validation_failures で欄ごとのエラーにする
    unit_tests:
      - name: test_find_hotkey_overlaps
        case: 正常
        summary: 前に並んだホットキーと重なるキーを、重なった組で返す
        condition: AI チャットの送り先 Claude の hotkey を <ctrl>+<alt>+v（貼り付けのみと同じ）にした設定（model_construct で確かめを飛ばして作る）
        mock: なし
        expected: '[("outputs[3].targets[2].hotkey", "outputs[1].hotkey")]'
      - name: test_find_hotkey_overlaps_when_start_equals_paste_and_send
        case: 正常
        summary: 録音の開始と貼り付けて送信が同じキー（既定）は重なりにしない
        condition: Settings()（どちらも <ctrl>+<alt>+d）
        mock: なし
        expected: '[]'
      - name: test_find_hotkey_overlaps_when_disabled_output
        case: 正常
        summary: オフの出力先のホットキーは重なりにしない
        condition: コピーのみをオフにし、その hotkey を <ctrl>+<alt>+z（一時停止と同じ）
        mock: なし
        expected: '[]'
      - name: test_settings_when_hotkeys_overlap
        case: 異常
        summary: ホットキーが重なる設定は、重なったキーと先のキーを持つ ValidationError で断る
        condition: hotkeys.cancel を <ctrl>+<alt>+z にした dict を Settings.model_validate に渡す
        mock: なし
        expected: ValidationError。list_validation_failures のキーに hotkeys.cancel、理由に hotkeys.pause
        exception: ホットキーが重なる
constants:
