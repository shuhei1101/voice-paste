  - name: group_menu_width
    title: まとまりのメニューの幅
    kind: 関数
    container: ui/windows/settings_window.py
    usecase: 設定を変える
    scope: public
    summary: まとまりのメニューの幅を、GROUP_MENU_MIN_WIDTH_PX を下限に、最も長い項目が横のスクロールバーなしで収まる幅にする。縦のスクロールバーの幅は、出ているときだけ加える
    args:
      - name: menu
        type: QListWidget
        required: true
        passing: positional
        description: 項目を入れたまとまりのメニュー
    returns:
      type: int
      description: メニューの幅（px）
    process: |-
      1. menu.ensurePolished() でスタイルシート（項目の余白）を当ててから、sizeHintForColumn(0) で最も長い項目の幅を測る
      2. 1 の幅に、枠の幅（frameWidth の 2 倍）と GROUP_MENU_MARGIN_PX を加える
         - 縦のスクロールバーが出ている（verticalScrollBar().maximum() が 0 より大きい）場合、その幅（verticalScrollBar().sizeHint().width()）も加える
      3. 2 と GROUP_MENU_MIN_WIDTH_PX の大きい方を返す
    refs:
      - SCR-9#elements[まとまりのメニュー]
    status: planned
    notes:
      使い方: SettingsWindow は、まとまりのメニューに項目を入れた後に setFixedWidth(group_menu_width(menu)) で幅を決め、verticalScrollBar().rangeChanged を受けて同じ式で決め直す（窓の高さで縦のスクロールバーが出る・消えるのに合わせる）。setHorizontalScrollBarPolicy(ScrollBarAlwaysOff) で横のスクロールバーを出さない
    unit_tests:
      - name: test_group_menu_width
        case: 正常
        summary: 項目が収まり、縦のスクロールバーが出ていなければ下限の幅にする
        condition: 項目が「出力先」「履歴とログ」だけの QListWidget を、全ての項目が収まる高さで表示する
        mock: なし（offscreen の QApplication）
        expected: 160 が返る
      - name: test_group_menu_width_when_long_item
        case: 正常
        summary: 収まらない項目があれば項目に合わせて広げる
        condition: 項目に 40 文字の文字列を含む QListWidget を、全ての項目が収まる高さで表示する
        mock: なし（offscreen の QApplication）
        expected: 160 より大きく、sizeHintForColumn(0)・frameWidth の 2 倍・GROUP_MENU_MARGIN_PX の和が返る（縦のスクロールバーの幅を含まない）
      - name: test_group_menu_width_when_scrollbar_shown
        case: 正常
        summary: 縦のスクロールバーが出ていれば、その幅も加える
        condition: 項目に 40 文字の文字列と 30 個の項目を含む QListWidget を、高さ 100px で表示する
        mock: なし（offscreen の QApplication）
        expected: sizeHintForColumn(0)・frameWidth の 2 倍・縦のスクロールバーの幅・GROUP_MENU_MARGIN_PX の和が返る
