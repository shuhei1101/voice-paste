id: IF-15
visibility: internal
title: テストの全件実行
tags:
  - name: topic:testing
    main: true
  - name: topic:ci
  - name: tool:github-actions
  - name: action:実行
entry:
  kind: trigger
  value: '`.github/workflows/test.yml`（手動の起動 `workflow_dispatch`。起動を絞る条件は無い）'
lead: 指定された層のテストの全件をランナーで実行し、ログを成果物に上げる。
idempotent: true
read_only: true
permissions: '`contents: read`'
side_effects: 成果物 `test-log`（層の全件を回した pytest の出力）を上げる。リポジトリへは書き込まない
exclusivity: '同じブランチ・同じ層の実行は、先に起動した方を止める（`concurrency` の `group: test-${{ github.ref }}-${{ inputs.layer }}`・`cancel-in-progress: true`）'
request:
  - name: layer
    type: unit / integration
    required: true
    location: argument
    description: 全件を回す層。テスト実行方法の実行場所が `runner` の層（単体テスト（バック）・結合テスト（バック））
    notes: '`on.workflow_dispatch.inputs.layer` の `type: choice` の `options`'
constraints:
  - item: ランナー
    constraint: '`windows-latest`'
    notes: 手元の全件実行と同じ Windows で回し、OS で skip するテストを手元と一致させる
  - item: 無出力の時間
    constraint: step「層の全件を回す」で、`test.log` の大きさが変わらない時間が上限を超えたら pytest を止めて失敗で終える。上限は `unit` は 190 秒、`integration` は 110 秒
    notes: 手元で測った出力の間隔の最長（`unit` 19 秒・`integration` 11 秒）の 10 倍
  - item: タイムアウト
    constraint: ジョブの `timeout-minutes` を、`unit` は 82 分、`integration` は 26 分にする
    notes: 無出力の時間の外側の止め役。手元の全件実行の実測（`unit` 488 秒・`integration` 154 秒）の 10 倍を分に切り上げた値で、GitHub Actions の 1 ジョブの上限（360 分）より短い
  - item: 除くテスト
    constraint: 制限なし
    notes: 単体テスト（バック）・結合テスト（バック）に、手元でしか用意できないものを使用するテストは無い
  - item: 層とテストのフォルダ
    constraint: '`unit` は `tests/unit/`、`integration` は `tests/integration/`'
overall_flow: |-
  <!-- map -->

  ```mermaid
  flowchart TD
    s([workflow_dispatch で起動]) --> a
    subgraph test
      a[ブランチを取得する] -- 成功 --> b1[uv を入れる]
      b1 -- 成功 --> b2[Python の依存を入れる]
      b2 -- 成功 --> c[層の全件を回す]
      a & b1 & b2 & c -->|"失敗（if: always()）"| d[ログを成果物に上げる]
      c -->|"成功（if: always()）"| d
    end
    d -->|"全ての step が成功"| ok([成功])
    d -->|"失敗した step がある"| ng([失敗])
  ```

  <!-- /map -->
flows:
  - name: 正常系
    summary: 単体テストの層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: 単体テストの全件が pass するブランチ
        notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b1[uv を入れる] --> b2[Python の依存を入れる]
        b2 --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - 成果物 `test-log` があり、pytest の集計の行を持つ
      - pytest の集計の行の skipped の件数が、同じ commit を手元の全件実行で回したときと同じ
  - name: 正常系（結合テストの層）
    summary: 結合テストの層の全件が pass して成功で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: 結合テストの全件が pass するブランチ
        notes: '`layer: integration`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: integration で起動]) --> a[ブランチを取得する] --> b1[uv を入れる] --> b2[Python の依存を入れる]
        b2 --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `success`
      - 成果物 `test-log` があり、pytest の集計の行を持つ
      - pytest の集計の行の skipped の件数が、同じ commit を手元の全件実行で回したときと同じ
  - name: 異常系（テストの fail・failure）
    summary: 層の全件に fail があり、ログを上げて失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: 単体テストに fail するテストがあるブランチ
        notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b1[uv を入れる] --> b2[Python の依存を入れる]
        b2 --> c[層の全件を回す]
        c -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - 成果物 `test-log` があり、fail したテストと pytest の集計の行を持つ
  - name: 異常系（無出力の時間を超えた・failure）
    summary: pytest の出力が上限の時間変わらず、pytest を止めてログを上げて失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: 単体テストに、上限の時間より長く出力せずに止まるテストがあるブランチ
        notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b1[uv を入れる] --> b2[Python の依存を入れる]
        b2 --> c[層の全件を回す]
        c -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - 成果物 `test-log` があり、pytest を止めた旨の行を持つ
  - name: 異常系（道具の導入に失敗・failure）
    summary: Python の依存の導入に失敗し、層の全件を回さずにログを上げて失敗で終わる
    setup:
      - name: Mock
        description: なし（本物の GitHub Actions で回す）
      - name: ブランチ
        description: '`uv.lock` を壊して `uv sync --frozen` が失敗するブランチ'
        notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b1[uv を入れる] --> b2[Python の依存を入れる]
        b2 -->|"失敗（if: always()）"| d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
      - 実行の結論が `failure`
      - step「層の全件を回す」の結論が `skipped`
refs:
  - TP-1#layers[単体テスト（バック）]
  - TP-1#layers[結合テスト（バック）]
  - LIB-34#
  - LIB-35#
  - LIB-36#
notes:
  step ごとの中身: |-
    | step | 中身 |
    | --- | --- |
    | ブランチを取得する | `actions/checkout` で起動したブランチを取得する |
    | uv を入れる | `astral-sh/setup-uv` で uv を入れる |
    | Python の依存を入れる | `uv sync --frozen` で依存を入れる（Python のバージョンは `.python-version` から uv が入れる） |
    | 層の全件を回す | `shell: bash`（Windows のランナーの Git Bash）で、`PYTHONUNBUFFERED=1 uv run pytest {層のフォルダ} -v -p no:cacheprovider` を裏で起動して出力を `test.log` に記載し、`test.log` の大きさを 10 秒ごとに確認する。無出力の時間の上限を超えたら pytest のプロセスの木を `taskkill /T /F` で止め、止めた旨を `test.log` に記載して失敗で終える。止めなかったときは pytest の終了コードを step の成否にする |
    | ログを成果物に上げる | `if: always()` で `actions/upload-artifact` により `test.log` を成果物 `test-log` に上げる |
  タイムアウトの決め方: |-
    判定フローチャート『タイムアウトの決め方』では、自分の処理の完了を待つだけで進み具合の出力（pytest の `-v` のテスト 1 件ごとの行）があるため、無出力の時間で止まったことを検知する（制約の「無出力の時間」）。
    ジョブの `timeout-minutes` は、無出力の時間の外側の止め役として、実測の 10 倍で決める。

    | 実測 | ログ |
    | --- | --- |
    | `unit` の全件 488 秒・出力の間隔の最長 19 秒（937 passed・57 skipped） | `docs/pr/318/テスト結果/20261115143850_7b48ebf_単体テスト.log` |
    | `integration` の全件 154 秒・出力の間隔の最長 11 秒（807 passed・1 skipped） | `docs/pr/318/テスト結果/20261115144721_7b48ebf_結合テスト.log` |
  フローの確認方法: |-
    `workflow_dispatch` は既定のブランチ develop にある workflow だけを起動できるため、この workflow を作る作業 PR の中では起動できない。
    develop へ入った後の最初の作業 PR のランナーでの全件実行で、正常系 2 つを確認し、skipped の件数を手元の全件実行と比べる。
