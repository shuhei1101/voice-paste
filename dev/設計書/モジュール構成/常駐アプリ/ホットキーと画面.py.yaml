    description: |-
      要素は画面設計「文字起こし中の表示」が持つ。窓は `Qt.Tool | Qt.FramelessWindowHint | Qt.WindowDoesNotAcceptFocus` と `WA_ShowWithoutActivating` で出す。窓の外側の枠の role は `window` にし、縁を frame で描かせる。
      `WindowDoesNotAcceptFocus` のため、切り替えのボタンを押しても見出しの行をつかんでも窓は前面にならず、貼り付け先の入力欄のフォーカスはそのまま残る（前面を戻す処理は持たない）。
      見出しの行・つかむ印・名前の下にホットキーを出すボタンは、録音の画面と同じ部品（window_parts.py の HeadRow・GripIcon・HotkeyButton。recording_window.py から移す）を使う。見出しの行を押したまま動かすと `QWindow.startSystemMove` で窓を動かす。
      切り替えのボタンは、設定でオンの固定の出力先（`outputs[]` の並び。名前は UiDeps.output_titles、ホットキーは format_hotkey で整えた `outputs[].hotkey`）ごとに open で組み直す。`ui.show_hotkeys` がオフのときはホットキーを空で渡し、名前だけを出す。今の出力先でないボタンを押すと output_selected を emit する（差し替えるのは UiController。印は output_changed の知らせを受けて set_output で替える）。
      残りの時間は、進み（区間の終わり ÷ 録音の長さ）と経過から「経過 ÷ 進み − 経過」で見積もる。
      コンストラクタは UiDeps と、経過を数える時計 clock（秒を返す関数。既定は time.monotonic）を受ける。
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    methods:
      - name: open
        title: 表示を出す
        summary: 経過を 0 にして進みを隠し、出力先の並び（かプリセットの名前）と貼り付けの案内を組み直して出す。at を渡されたらその座標（その回に動かした録音の画面の位置）に、渡されなければ設定の位置（place_window）に出す
        kind: メソッド
        scope: public
        args:
          - name: at
            type: QPoint | None
            required: false
            default: None
            passing: keyword
            description: 出す左上の座標（その回に動かした録音の画面の位置）
          - name: output_id
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 確定で選んだ固定の出力先の ID。この出力先のボタンに印を付け、貼り付けの案内をその出力先の文にする
          - name: preset_title
            type: str | None
            required: false
            default: None
            passing: keyword
            description: カスタムプリセットで確定したときのそのタイトル。渡されたら切り替えのボタンと貼り付けの案内を出さず、プリセットの名前だけを出す
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_open_when_window_role
            case: 正常
            summary: 窓の外側の枠の role が window
            condition: open する。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: 外側の枠の property("role") が window
          - name: test_open_when_preset
            case: 正常
            summary: カスタムプリセットで確定したときは名前だけを出す
            condition: open(preset_title="ChatGPT") する。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: preset_label が ChatGPT、switch_button_* が 1 つも表示されず、paste_hint が表示されない
      - name: set_progress
        title: 進みの反映
        summary: 進みのバーと残りの時間を書き換える
        kind: メソッド
        scope: public
        args:
