title: "常駐アプリ / 外部連携"
lead: 文字起こしワーカーの子プロセス・システム音量・キーボードとクリップボード・ブラウザ添付の画面を開くブラウザ・HTTP の POST・話し声の判定（Silero VAD）を包むアダプタ。feature の関数型を満たし、外の例外をアプリの例外に変える。
directory: |-
  ```
  src/voice_paste/integrations/
  ├── whisper/
  │   ├── client.py     # WhisperWorkerClient（子プロセスの起動・監視・立て直し・やり直し）
  │   └── worker.py     # 子プロセスの本体（文字起こしワーカーのサブシステム）
  ├── vad/
  │   └── adapter.py    # load_vad_session・StreamingVad（faster-whisper 同梱の Silero VAD を onnxruntime で窓ごとに流す）
  ├── volume/
  │   └── adapter.py    # lower_volume・restore_volume（pycaw を == で固定して包む）
  ├── keyboard/
  │   └── sender.py     # copy_to_clipboard・send_paste・send_enter
  ├── browser/
  │   └── opener.py     # open_app_window（Edge の --app で開き、無ければ既定のブラウザ）
  └── http/
      ├── types.py      # PostResult・PostJsonFn
      └── client.py     # post_json（httpx）
  ```
classes:
  - name: WhisperWorkerClient
    title: 文字起こしワーカーの窓口
    container: integrations/whisper/client.py
    usecase: 録音を文字に起こす
    role: アダプタ
    kind: クラス
    summary: 文字起こしワーカーの子プロセスを持ち、標準入出力の JSON Lines で録音を渡して結果を受け取る。落ちたら 1 回だけ立て直してやり直す
    properties:
      - name: _process
        type: subprocess.Popen | None
        access: 内部 (_)
        description: 子プロセス
      - name: _settings
        type: LocalWhisperSettings
        access: 内部 (_)
        description: モデル・デバイス・量子化・言語・ビーム幅・温度・VAD
      - name: _ready_timeout_sec
        type: float
        access: 内部 (_)
        description: 立て直しで ready を待つ上限（非機能要件の文字起こしワーカーの立て直しの時間。main.py が渡す）。起動時の 1 回目にはかけない
      - name: _log_dir
        type: Path
        access: 内部 (_)
        description: ワーカーが落ちたときのスタックを書くログの置き場所（AppPaths.log_dir）
      - name: _stop_timeout_sec
        type: float
        access: 内部 (_)
        description: 終わりを待つ時間（非機能要件の文字起こしワーカーの終わりを待つ時間。main.py が渡す）
      - name: _stopping
        type: bool
        access: 内部 (_)
        default: 'False'
        description: stop で止めている最中か。立っている間は子プロセスが終わっても立て直さない。start で下ろす
    methods:
      - name: start
        title: 起動
        kind: メソッド
        scope: public
        summary: 子プロセスを起動し、ready を待つ。起動時の 1 回目はモデルの取得や冷えた読み込みがあるため上限をかけず、立て直しだけ上限をかける
        returns:
          type: None
          description: なし
        exceptions:
          - name: EngineError
            condition: モデルを読み込めず ready が届かない（error が届いた・子プロセスが終わった・立て直しで上限を過ぎた）
        process: |-
          1. _stopping を下ろす
          2. 子プロセスの環境を作る
             - venv の `Lib/site-packages/nvidia/{cublas,cudnn,cuda_nvrtc}/bin` のうち存在するものを PATH の先頭へ足す（CUDA の DLL を子プロセスが見つけられるようにする）
             - 標準入出力を UTF-8 にする
          3. `python -u -m voice_paste.integrations.whisper.worker` をコンソールを出さずに起動し、標準エラーを別のスレッドで読んでロガーへ流す
          4. config（モデル・デバイス・量子化・スレッド数・ワーカー数・ログの置き場所）を送り、ready・error・子プロセスの終了のどれかを待つ
             - ready_timeout_sec が渡されていれば、その間だけ待つ（立て直しの経路）
             - error が届いた・子プロセスが終わった・上限を過ぎた場合、子プロセスを止めて EngineError を送出する
             - `[INFO]` 文字起こしワーカーが立ち上がった（pid・かかった秒）
        unit_tests:
          - name: test_start
            case: 正常
            summary: config を送り ready を受けて立ち上がる
            condition: 子プロセスが ready を返す
            mock: subprocess.Popen
            expected: 最初に送った行が config で、Popen の環境の PATH の先頭に存在する nvidia の bin がある
          - name: test_start_when_model_load_failed
            case: 異常
            summary: ready の代わりに error が届いたら EngineError
            condition: 子プロセスが error を返して終わる
            mock: subprocess.Popen
            expected: EngineError が送出され、理由に error の中身が残る
            exception: モデルを読み込めず ready が届かない
          - name: test_start_when_ready_timeout
            case: 異常
            summary: 立て直しで ready を待ちきれなければ子プロセスを止めて EngineError
            condition: ready_timeout_sec=0.1 を渡し（立て直しの経路）、子プロセスは何も返さない
            mock: subprocess.Popen
            expected: EngineError が送出され、子プロセスの kill か terminate が呼ばれる
            exception: モデルを読み込めず ready が届かない（error が届いた・子プロセスが終わった・立て直しで上限を過ぎた）
          - name: test_start_when_first_ready_is_slow
            case: 正常
            summary: 起動時の 1 回目は上限をかけずに ready を待つ
            condition: ready_timeout_sec を渡さず、子プロセスは _ready_timeout_sec（0.1 にする）より遅れて 0.3 秒後に ready を返す
            mock: subprocess.Popen
            expected: 例外が出ずに立ち上がり、子プロセスが止められない
        args:
          - name: ready_timeout_sec
            type: float | None
            required: false
            default: None
            passing: keyword
            description: ready を待つ上限。None（起動時の 1 回目）は上限をかけない。立て直しでは transcribe が _ready_timeout_sec を渡す
      - name: transcribe
        title: 文字起こし
        kind: メソッド
        scope: public
        inherits: EngineFn
        summary: 録音を子プロセスへ送り、区間ごとの文字を受け取る
        args:
          - name: audio_path
            type: Path
            required: true
            passing: positional
            description: 録音の WAV
          - name: on_progress
            type: Callable[[float, float], None] | None
            required: false
            default: None
            passing: keyword
            description: 区間の終わりの時刻を知らせる
        returns:
          type: list[str]
          description: 区間ごとの文字
        process: |-
          1. 録音と設定を 1 行の JSON で送り、区間の進みと結果を読む
             - 子プロセスが応答の途中で終わった場合、_stopping が立っていれば立て直さずに EngineError を送出する（常駐の終了で止めた）
             - それ以外で子プロセスが応答の途中で終わった場合、子プロセスを start(ready_timeout_sec=_ready_timeout_sec) で起動し直して同じ録音をもう一度送る（やり直しは 1 回だけ）
               - `[WARNING]` 文字起こしワーカーが落ちたので立て直す（終了コード）
               - 立て直しで ready が上限までに届かなければ、start が子プロセスを止めて EngineError を送出する
             - やり直しも落ちた場合、子プロセスを同じ上限でもう一度起動して次の録音に備え、EngineError を送出する
             - ワーカーがエラーを返した場合、起動し直さずに EngineError を送出する
        exceptions:
          - name: EngineError
            condition: やり直したワーカーも落ちた
          - name: EngineError
            condition: ワーカーがエラーを返した
        unit_tests:
          - name: test_transcribe_when_worker_crashed_once
            case: 正常
            summary: 1 回落ちてもやり直しで結果を得る
            condition: 1 つ目の子プロセスは応答の途中で終わり、2 つ目は結果を返す
            mock: subprocess.Popen
            expected: 結果が返り、Popen が 2 回呼ばれる
          - name: test_transcribe_when_retry_crashed
            case: 異常
            summary: やり直しも落ちたら EngineError、次に備えて起動し直す
            condition: 2 つの子プロセスがどちらも応答の途中で終わる
            mock: subprocess.Popen
            expected: EngineError が送出され、Popen が 3 回呼ばれる
            exception: やり直したワーカーも落ちた
          - name: test_transcribe
            case: 正常
            summary: 進みを知らせ、区間ごとの文字を返す
            condition: 子プロセスが progress（end=1.0, duration=2.0）・result（["今日は", "晴れ"]）を返す
            mock: subprocess.Popen
            expected: '["今日は", "晴れ"] が返り、on_progress が (1.0, 2.0) で 1 回呼ばれ、送った transcribe に設定の言語・ビーム幅・温度・VAD が入る'
          - name: test_transcribe_when_worker_error
            case: 異常
            summary: ワーカーが error を返したら起動し直さずに EngineError
            condition: 子プロセスが error を返し、動き続ける
            mock: subprocess.Popen
            expected: EngineError が送出され、Popen が 1 回だけ呼ばれる
            exception: ワーカーがエラーを返した
          - name: test_transcribe_when_restart_ready_timeout
            case: 異常
            summary: 立て直しで ready を待ちきれなければ _ready_timeout_sec の後に EngineError
            condition: _ready_timeout_sec=0.1。1 つ目の子プロセスは応答の途中で終わり、2 つ目は ready を返さない
            mock: subprocess.Popen
            expected: EngineError が送出され、2 つ目の子プロセスが止められ、待ちが 1 秒未満で終わる
            exception: やり直したワーカーも落ちた
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: 子プロセスの標準入力を閉じて終わりを待ち、待ちきれなければ止める。常駐の終了時に main.py が呼ぶ。文字起こしの最中に別のスレッドから呼ばれても、文字起こしの終わりを待たない
        returns:
          type: None
          description: なし
        process: |-
          1. 文字起こしが持つロックを取らずに _stopping を立てる（文字起こしの最中でも待たない。止めた子プロセスを transcribe が「落ちた」と受けて立て直さないようにする）
          2. 子プロセスが無ければ何もしない
          3. 標準入力を閉じ、終わりを _stop_timeout_sec 待つ
             - 終わらなければ terminate して同じ時間待ち、それでも終わらなければ kill する
               - `[WARNING]` 文字起こしワーカーが終わらないので止めた（terminate / kill）
        unit_tests:
          - name: test_stop_when_worker_hangs
            case: 正常
            summary: 標準入力を閉じても終わらなければ止める
            condition: 子プロセスの wait が 1 回目にタイムアウトする
            mock: subprocess.Popen
            expected: 標準入力が閉じられ、terminate が呼ばれる
          - name: test_stop_when_terminate_hangs
            case: 正常
            summary: terminate しても終わらなければ kill する
            condition: _stop_timeout_sec=0.1、子プロセスの wait が 1 回目・2 回目ともタイムアウトする
            mock: subprocess.Popen
            expected: terminate の後に kill が呼ばれ、wait がどちらも 0.1 秒で呼ばれる
          - name: test_stop_when_transcribing
            case: 正常
            summary: 文字起こしの最中に止めても _stop_timeout_sec で止まり、立て直さない
            condition: _stop_timeout_sec=0.1。子プロセスは transcribe に何も返さず、標準入力を閉じても終わらない。別のスレッドで transcribe を呼んでから stop を呼ぶ
            mock: subprocess.Popen
            expected: stop が 1 秒未満で戻り、terminate が呼ばれ、transcribe が EngineError を送出し、Popen が 1 回だけ呼ばれる
    refs:
      - dev/設計書/外部ライブラリ/faster-whisper#
    status: implemented
  - name: StreamingVad
    title: 流して使う VAD
    container: integrations/vad/adapter.py
    usecase: 録音する
    role: アダプタ
    kind: クラス
    summary: Silero VAD の ONNX のセッションで、512 サンプルの窓ごとに話し声の確率を返す。LSTM の状態と前の窓の末尾を次の窓へ持ち越す
    description: |-
      窓をまたいで状態（h・c・前の 64 サンプル）を持ち越すためクラスにする。連続録音を始めるたびに新しく作り、状態を持ち越さない。
      セッションへの入出力の形は faster-whisper の SileroVADModel と同じで、状態を呼ぶたびに 0 に戻さずに持ち越す点だけが違う（PoC #80 で、一度に渡した `get_speech_timestamps` と同じ区切りになることを確かめた）。
      録音の区切りのスレッドからだけ呼ぶ（並行で呼ばない）。
    properties:
      - name: _session
        type: onnxruntime.InferenceSession
        access: 内部 (_)
        description: Silero VAD のセッション（load_vad_session が読んだものを共有する）
      - name: _h
        type: numpy.ndarray
        access: 内部 (_)
        description: LSTM の状態 h（形 VAD_STATE_SHAPE・float32。初めは 0）
      - name: _c
        type: numpy.ndarray
        access: 内部 (_)
        description: LSTM の状態 c（形 VAD_STATE_SHAPE・float32。初めは 0）
      - name: _context
        type: numpy.ndarray
        access: 内部 (_)
        description: 前の窓の末尾 VAD_CONTEXT サンプル（初めは 0）
    methods:
      - name: __call__
        title: 話し声の確率
        kind: メソッド
        scope: public
        inherits: SpeechProbabilityFn
        summary: 1 窓（512 サンプル・float32・-1.0〜1.0）の話し声の確率を返し、状態を次の窓へ持ち越す
        args:
          - name: window
            type: numpy.ndarray
            required: true
            description: 512 サンプルの音（float32）
        returns:
          type: float
          description: 話し声の確率（0.0〜1.0）
        process: |-
          1. 前の窓の末尾と窓をつないだ (1, 576) の入力を作る
          2. セッションを input・h・c で動かし、確率と新しい h・c を受ける
          3. 窓の末尾 VAD_CONTEXT サンプルを持ち越し、確率を返す
        unit_tests:
          - name: test_streaming_vad_carries_state
            case: 正常
            summary: 状態を次の窓へ持ち越す
            condition: セッションの Mock が確率 0.9 と、呼ぶたびに違う h・c を返す。2 窓を続けて渡す
            mock: onnxruntime.InferenceSession
            expected: 0.9 が返り、2 回目の run に 1 回目が返した h・c と、1 窓目の末尾 64 サンプルで始まる形 (1, 576) の入力が渡る
          - name: test_streaming_vad_starts_fresh
            case: 正常
            summary: 新しく作ると状態を持ち越さない
            condition: 同じセッションで 2 つ作り、それぞれに 1 窓を渡す
            mock: onnxruntime.InferenceSession
            expected: どちらの run にも 0 の h・c が渡る
    refs:
      - dev/設計書/外部ライブラリ/onnxruntime#
    status: planned
    introduced:
      pr: 78
functions:
  - name: lower_volume
    title: 音量を下げる
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: public
    inherits: LowerVolumeFn
    thread_safe: true
    side_effects: 既定の再生デバイスのマスター音量を変える
    summary: pycaw で今のマスター音量を読み、割合を掛けた音量へ fade_sec をかけて下げ始める
    args:
      - name: ratio
        type: float
        required: true
        passing: positional
        description: 今の音量に対する割合（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: 下げるのにかける秒数
    returns:
      type: float
      description: 下げる前の音量（0.0〜1.0）
    process: |-
      1. 音量のロックを取り、以降をその中で行う
      2. 進行中のフェードを打ち切る（_cancel_fade）
      3. 打ち切ったフェードがあればその目標の音量を、無ければ既定の再生デバイスのマスター音量（0.0〜1.0）を COM を初期化して読んだ値を、下げる前の音量にする（_open_endpoint_volume）
         - 戻している途中に始まった録音でも、戻しの目標（元の音量）を下げる前の音量にする。下げている途中にもう一度下げることは、Recorder が録音中の開始を断るため起きない
         - pycaw・COM が例外を出した場合、VolumeControlError を送出する（理由に元の例外を残す）
      4. 下げる前の音量 × ratio を 0.0〜1.0 に収め、その音量へ変える（_fade_to）
      5. 下げる前の音量を返す
    exceptions:
      - name: VolumeControlError
        condition: 音量を読むときに pycaw・COM が例外を出した
      - name: VolumeControlError
        condition: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した（_fade_to から伝わる）
    unit_tests:
      - name: test_lower_volume
        case: 正常
        summary: 今の音量を返し、割合を掛けた音量へ書く
        condition: 今の音量 0.8、ratio=0.5・fade_sec=0
        mock: _open_endpoint_volume（音量を持つ偽のインターフェース）
        expected: 0.8 が返り、偽のインターフェースの音量が 0.4 になっている
      - name: test_lower_volume_when_restoring
        case: 正常
        summary: 戻している途中に下げると、戻しの目標の音量を下げる前の音量にする
        condition: 今の音量 0.4 から restore_volume(0.8, 0.5) の直後に lower_volume(0.5, 0) を呼ぶ
        mock: _open_endpoint_volume
        expected: 0.8 が返り、偽のインターフェースの音量が 0.4 で終わり、その後に書き換わらない
      - name: test_lower_volume_when_read_failed
        case: 異常
        summary: 読めなければ VolumeControlError
        condition: GetMasterVolumeLevelScalar が COMError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出され、音量が書かれない
        exception: 音量を読むときに pycaw・COM が例外を出した
      - name: test_lower_volume_when_api_changed
        case: 異常
        summary: pycaw の API が変わって属性が無ければ VolumeControlError
        condition: _open_endpoint_volume が AttributeError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出される
        exception: 音量を読むときに pycaw・COM が例外を出した
    connectivity_tests:
      - name: test_ext_lower_volume_when_no_fade
        api: pycaw AudioUtilities.GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar / SetMasterVolumeLevelScalar
        summary: 実機の既定の再生デバイスで、下げる前の音量を返して割合を掛けた音量へ変える
        checks: pycaw で音量を 0.6 にしてから lower_volume(0.5, 0) を呼び、0.6 が返り、pycaw で読んだ音量が 0.3（誤差 0.01 以内）
        cost: 料金なし。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
        notes: 既定の再生デバイスが無い環境では skip する
      - name: test_ext_lower_volume_when_fade
        api: pycaw AudioUtilities.GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar / SetMasterVolumeLevelScalar
        summary: フェードをかけても割合を掛けた音量に届く（別のスレッドでの COM の初期化を含む）
        checks: 音量 0.6 から lower_volume(0.5, 0.3) を呼び、2 秒以内に pycaw で読んだ音量が 0.3（誤差 0.01 以内）になる
        cost: 料金なし。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
        notes: 既定の再生デバイスが無い環境では skip する
    notes:
      契約テスト: pycaw は版で API が変わるため `==` で固定し、この関数と restore_volume の疎通テストを Windows の実機で回す契約テストにする（品質シナリオ 7。依存の版を上げたら回す）。
    refs:
      - dev/設計書/外部ライブラリ/pycaw#
      - dev/設計書/外部ライブラリ/comtypes#
    status: implemented
  - name: restore_volume
    title: 音量を戻す
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: public
    inherits: RestoreVolumeFn
    thread_safe: true
    side_effects: 既定の再生デバイスのマスター音量を変える
    summary: 下げる前の音量へ fade_sec をかけて戻し始める
    args:
      - name: volume
        type: float
        required: true
        passing: positional
        description: 戻す音量（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: 戻すのにかける秒数
    returns:
