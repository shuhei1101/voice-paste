        condition: 有効なプリセットに語 突合（読み とつごう）・voice-paste（読み 空）、無効なプリセットに語 議事録
        mock: なし
        expected: '[("突合", "とつごう"), ("voice-paste", None)]'
      - name: test_collect_hint_vocabulary_when_no_readings
        case: 正常
        summary: readings が空の一覧なら読みは全て None
        condition: words が 2 つ、readings が空の一覧
        mock: なし
        expected: 2 つとも reading が None
      - name: test_collect_hint_vocabulary_when_duplicate_word
        case: 正常
        summary: 同じ表記は 1 つにまとめ、読みのある方を残す
        condition: 1 つ目のプリセットに 突合（読み 空）、2 つ目のプリセットに 突合（読み とつごう）
        mock: なし
        expected: '[("突合", "とつごう")]'
    status: planned
