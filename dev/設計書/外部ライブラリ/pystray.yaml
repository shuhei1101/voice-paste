title: "pystray"
kind: "ライブラリ"
version:
  current: 0.19.5
  checked_on: '2026-09-30'
  source: pyproject.toml（~=0.19）と手元の venv に入っている版
  pinning: 互換リリースで固定（~=0.19）
catalogs:
  - name: API
    version: 0.19.5
    entries:
      - name: Icon
        kind: クラス
        purpose: トレイのアイコンを作る（画像・ツールチップ・メニューを持ち、画像とツールチップは後から差し替えられる）
      - name: Icon.run_detached
        kind: メソッド
        purpose: 呼び出し元を止めずにアイコンを出す
      - name: Icon.stop
        kind: メソッド
        purpose: アイコンを消す
      - name: Menu / MenuItem / Menu.SEPARATOR
        kind: クラス
        purpose: 右クリックのメニューとその項目・区切りを作る（既定の項目はアイコンのクリックでも動く）
lead: システムトレイにアイコンとメニューを出すライブラリ。
purl: pkg:pypi/pystray
dependency_scope: 必須
adoption: 採用
used_in:
  - voice_paste/tray.py
upstream: moses-palmer/pystray
verification:
  state: 未確認
  detail: 現状の棚卸しで、コードが使っている範囲を写しただけで、動かしてはいない
license: LGPL-3.0（商用利用可）
official_url: https://github.com/moses-palmer/pystray
