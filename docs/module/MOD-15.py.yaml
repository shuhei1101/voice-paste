id: MOD-15
visibility: internal
title: 常駐アプリ / APIサーバー / middleware.py
test_files:
  - tests/unit/voice_paste/server/test_middleware.py
classes:
  - name: RequestGuardMiddleware
    title: 要求の守り
    container: server/middleware.py
    usecase: APIで録音を操作する
    role: middleware
    kind: クラス
    inherits: starlette.middleware.base.BaseHTTPMiddleware
    summary: 全ての要求で Host を確認する。`/web/` の外は Origin・トークンを、`/web/` の下は Origin の許可リストを確認し、一致しなければ 403・401 で断る
    properties:
      - name: _token
        type: SecretStr
        access: 内部 (_)
        description: 今回の起動のトークン
      - name: _port
        type: int
        access: 内部 (_)
        description: 待ち受けのポート
      - name: _allowed_web_origins
        type: frozenset[str]
        access: 内部 (_)
        description: '`/web/` の下に許す Origin（設定 api.allowed_web_origins。末尾の `/` を落として持つ）'
      - name: _web_enabled
        type: bool
        access: 内部 (_)
        description: ブラウザの機能を組み込んだか。False なら `/web/` の下に許す Origin を確認しない
    methods:
      - name: dispatch
        title: 要求の確かめ
        kind: メソッド
        scope: public
        is_async: true
        summary: Origin・Host・Authorization の順に確認して、通れば次へ引き渡す
        args:
          - name: request
            type: Request
            required: true
            passing: positional
            description: 要求
          - name: call_next
            type: Callable
            required: true
            passing: positional
            description: 次の処理
        returns:
          type: Response
          description: 断ったときは problem+json の応答
        process: |-
          1. Host が `127.0.0.1:{ポート}` か `localhost:{ポート}` でなければ 403 を返却する
             - `[WARNING]` 断った要求（理由・Host・Origin。トークンは書き込まない）
          2. パスが `/web` か `/web/` で始まるかで分ける
             - `/web/` の下で _web_enabled が False の場合、次へ引き渡す（route が無いため 404 になる。Origin とトークンを確認しない）
             - `/web/` の下の場合
               - Origin が無いか、Origin が _allowed_web_origins にあれば、メソッドによらず次へ引き渡す（トークンは求めない）
               - それ以外（Origin が付いていて _allowed_web_origins に無い）は 403 を返却する
                 - `[WARNING]` 同上
             - それ以外の場合
               - Origin が付いていれば 403 を返却する
                 - `[WARNING]` 同上
               - Authorization が `Bearer {トークン}` と定数時間で一致しなければ 401 を返却する
                 - `[WARNING]` 同上
               - 次の処理へ引き渡す
        unit_tests:
          - name: test_dispatch
            case: 正常
            summary: 正しい要求は許可する
            condition: Origin 無し、Host 127.0.0.1:{ポート}、正しいトークン
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_origin_present
            case: 正常
            summary: Origin 付きは 403
            condition: 'Origin: http://evil.example'
            mock: call_next
            expected: 403 が返り、call_next が呼ばれず、WARNING のログにトークンが含まれない
          - name: test_dispatch_when_host_mismatch
            case: 正常
            summary: ほかの Host は 403
            condition: 'Host: evil.example'
            mock: call_next
            expected: 403 が返る
          - name: test_dispatch_when_token_mismatch
            case: 正常
            summary: トークンが合わなければ 401
            condition: Authorization 無しと、違うトークン
            mock: call_next
            expected: どちらも 401 が返る
          - name: test_dispatch_when_web_get_without_origin
            case: 正常
            summary: /web/ の下の Origin の無い GET はトークン無しで許可する
            condition: GET /web/、Host localhost:{ポート}、Origin と Authorization 無し
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_web_post_with_allowed_origin
            case: 正常
            summary: /web/ の下の許す Origin の POST を許可する
            condition: POST /web/transcriptions、Origin https://voice.example.com（許可リストにある）、Authorization 無し
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_web_origin_not_allowed
            case: 異常
            summary: /web/ の下の許さない Origin は 403
            condition: POST /web/transcriptions と GET /web/ を、Origin http://evil.example で送信する
            mock: call_next
            expected: どちらも 403 が返り、call_next が呼ばれない
            exception: Origin が許可リストに無い
          - name: test_dispatch_when_sessions_with_allowed_origin
            case: 異常
            summary: /web/ の外は許す Origin でも 403
            condition: POST /sessions、Origin https://voice.example.com（許可リストにある）、正しいトークン
            mock: call_next
            expected: 403 が返る
            exception: Origin が付いている
          - name: test_dispatch_when_web_disabled
            case: 正常
            summary: ブラウザの機能が無ければ /web/ の下は Origin を確認せずに次へ引き渡す
            condition: _web_enabled が False で、GET /web/ を Origin http://evil.example・Authorization 無しで送信する
            mock: call_next
            expected: call_next が呼ばれる
          - name: test_dispatch_when_web_post_without_origin
            case: 正常
            summary: /web/ の下の Origin の無い POST をトークン無しで許可する
            condition: POST /web/transcriptions、Host localhost:{ポート}、Origin と Authorization 無し
            mock: call_next
            expected: call_next が呼ばれる
    refs:
      - LIB-7#
    status: implemented
