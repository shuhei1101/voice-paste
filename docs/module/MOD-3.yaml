        録音セッションの依存["録音セッションの依存"]
        録音セッションのroute["録音セッションのroute"]
        録音セッションのroute -->|開始・停止・完了| 録音セッション管理
        録音セッション管理 -->|持つ（0..1）| 録音セッション
        録音セッション管理 -->|呼ぶ| 録音セッションの依存
      ```

