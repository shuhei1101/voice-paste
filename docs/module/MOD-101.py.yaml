title: Haas の文字起こしのサーバー / サーバー / main.py
test_files:
  - tests/unit/haas_server/test_main.py
constants:
  - name: DEFAULT_MODEL_NAME
    title: 既定のモデルの名前
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    summary: 起動の引数にモデルが無いときに Hugging Face Hub から取得するモデル
    value: '"third-intelligence/Haas-ja-v1.0"'
    refs:
      - IF-13#constraints[起動の引数]
    status: planned
  - name: DEFAULT_DTYPE
    title: 既定の計算の精度
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    summary: 起動の引数に計算の精度が無いときの値（haas_asr.load_model の既定と同じ）
    value: '"auto"'
    status: planned
  - name: DEFAULT_DEVICE
    title: 既定の装置
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    summary: 起動の引数に装置が無いときの値（haas_asr.load_model の既定と同じ）
    value: '"cuda"'
    status: planned
  - name: DTYPE_NAMES
    title: 計算の精度の名前
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    summary: 起動の引数で受ける計算の精度。`auto` はそのまま、ほかは同じ名前の torch の型にして load_model に引き渡す（load_model は `auto` 以外の文字列を受けない）
    value: ("auto", "bfloat16", "float16", "float32")
    refs:
      - LIB-30#
    status: planned
functions:
  - name: parse_args
    title: 起動の引数の読み取り
    kind: 関数
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: argparse で位置の引数（ポート・モデル・計算の精度・装置）を読み込む
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: 引数（ポートは必須。モデル・計算の精度・装置は省ける）
    returns:
      type: ServerArgs
      description: 省いた引数は DEFAULT_MODEL_NAME・DEFAULT_DTYPE・DEFAULT_DEVICE
    process: |-
      1. ポート（int）、モデル、計算の精度（choices は DTYPE_NAMES）、装置を位置の引数で読み込む（モデル以降は nargs="?"）
         - 読み込めない場合、argparse が終了コード 2 で終える
    exceptions:
      - name: SystemExit
        condition: ポートが無いか数値でない、計算の精度が DTYPE_NAMES に無い
    unit_tests:
      - name: test_parse_args
        case: 正常
        summary: 全ての引数を読み込む
        condition: '["47824", "x/model", "float32", "cpu"]'
        mock: なし
        expected: ServerArgs(port=47824, model="x/model", dtype="float32", device="cpu")
      - name: test_parse_args_when_port_only
        case: 正常
        summary: ポートだけなら既定値
        condition: '["47824"]'
        mock: なし
        expected: model・dtype・device が DEFAULT_MODEL_NAME・auto・cuda
      - name: test_parse_args_when_dtype_invalid
        case: 異常
        summary: 計算の精度が読み込めない
        condition: '["47824", "x/model", "int8", "cuda"]'
        mock: なし
        expected: SystemExit（コード 2）
        exception: 計算の精度が DTYPE_NAMES に無い
    status: planned
  - name: load_engine
    title: Haas のモデルの読み込み
    kind: 関数
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: haas_asr を import して起動の引数のモデルを読み込み、HaasEngine にする
    args:
      - name: args
        type: ServerArgs
        required: true
        passing: positional
        description: 起動の引数
    returns:
      type: HaasEngine
      description: モデルの関数の束。model_name・dtype・device は引数の文字列のまま
    process: |-
      1. haas_asr と torch を import し、load_model(args.model, device=args.device, dtype=…) で読み込む（dtype は `auto` ならそのまま、ほかは getattr(torch, args.dtype)）
         - `[INFO]` モデルを読み込んだ（モデル・計算の精度・装置・かかった秒）
      2. 次の関数を HaasEngine にまとめる

         | 関数 | 呼ぶ処理 |
         | --- | --- |
         | transcribe | haas_asr.transcribe(model, [samples], batch_size=options.batch_size, vocabulary=vocabulary, guard=options.guard)[0] |
         | transcribe_longform | haas_asr.transcribe_longform(model, samples, batch_size=options.batch_size, separator=options.separator, vocabulary=vocabulary, guard=options.guard, chunk_seconds=options.chunk_sec, search_seconds=options.search_sec, window_seconds=options.window_sec) |
         | build_vocabulary | haas_asr.Vocabulary(words, alpha=alpha) |
    unit_tests:
      - name: test_load_engine
        case: 正常
        summary: 引数と調整の値を haas_asr に引き渡す
        condition: ServerArgs(model="x/model", dtype="float32", device="cpu")。作った transcribe_longform を batch_size=8・chunk_sec=15 の TranscribeOptions で呼ぶ
        mock: haas_asr（sys.modules に差し替える）・torch
        expected: load_model に x/model・device=cpu・dtype=torch.float32 が渡る。transcribe_longform に batch_size=8・chunk_seconds=15 が渡る。HaasEngine の dtype が "float32"
      - name: test_load_engine_when_auto
        case: 正常
        summary: auto はそのまま引き渡す
        condition: ServerArgs(dtype="auto")
        mock: haas_asr・torch
        expected: load_model に dtype="auto" が渡る
    status: planned
  - name: main
    title: サーバーの入口
    kind: 関数
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: ログを設定し、モデルを読み込んでから 127.0.0.1 で待ち受ける
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: 引数（ポート・モデル・計算の精度・装置。start.sh が受けた引数をそのまま引き渡す）
    returns:
      type: None
      description: サーバーが止まると戻る（終了コード 0）
    process: |-
      1. parse_args で引数を読み込む
      2. ログの設定をする（分類『サーバー』の補足『ログ』）
      3. load_engine でモデルを読み込む（読み込みの間は待ち受けない）
         - 例外の場合（読み込めないモデル・使用できない装置を含む）、終了コード 1 で終える
           - `[ERROR]` モデルの読み込みに失敗した（スタックトレースつき）
      4. create_app で app を作り、uvicorn.Server を 127.0.0.1:{ポート} で動かす。request_shutdown は should_exit を True にする
    status: planned
    unit_tests:
      - name: test_main_when_load_failed
        case: 異常
        summary: モデルの読み込みの失敗をログへ書き込んで終わる
        condition: load_engine が RuntimeError を送出する
        mock: load_engine・LOG_FILE
        expected: 終了コード 1。ログのファイルに [ERROR] と例外の文がある
        exception: モデルを読み込めない
refs:
  - SC-5#
  - LIB-30#
  - LIB-31#
id: MOD-101
visibility: internal
data_models:
  - name: ServerArgs
    title: サーバーの起動の引数
    container: haas_server/main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: start.sh から受けたポート・モデル・計算の精度・装置
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: port
        type: int
        description: 待ち受けのポート
      - name: model
        type: str
        description: モデルの名前か .nemo ファイルのパス
      - name: dtype
        type: Literal["auto", "bfloat16", "float16", "float32"]
        description: 計算の精度
      - name: device
        type: str
        description: 装置（cuda・cuda:{番号}・cpu）
    refs:
      - IF-13#constraints[起動の引数]
    status: planned
notes:
  起動スクリプト: '`haas_server/start.sh` は受けた引数を全て（`"$@"`）`python -m haas_server.main` へ引き渡す。'
