use_cases:
  - kind: single
    scenario: docs/scenario/SC-5.yaml
    impact: run_only
    detail: Haas を使う設定で常駐アプリを起動すると、WSL の中で Haas の文字起こしのサーバーを起動する。起動スクリプトとサーバーのコードの置き場所を変えるため、起動できることを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-9.yaml
    impact: none
    detail: Haas で起こすシナリオはテスト用のエンドポイントへ向けるため、サーバーの置き場所の影響を受けない
    depends_on: []
