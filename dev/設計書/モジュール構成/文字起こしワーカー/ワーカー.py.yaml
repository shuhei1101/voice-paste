title: "文字起こしワーカー / ワーカー"
lead: 常駐サービスの子プロセスとして faster-whisper のモデルを持ち、標準入出力の JSON Lines で受けた録音を文字に起こす。CUDA のクラッシュから常駐サービスを守るためにプロセスを分ける。
directory: |-
  ```
  src/voice_paste/integrations/whisper/
  ├── worker.py      # 子プロセスの入口（python -m voice_paste.integrations.whisper.worker）
  └── protocol.py    # 常駐サービスとやり取りする 1 行の JSON の型（client.py と共有）
  ```
data_models:
  - name: WorkerMessage
    title: ワーカーのメッセージ
    container: integrations/whisper/protocol.py
    usecase: 録音を文字に起こす
    role: DTO
    summary: 標準入出力でやり取りする 1 行の JSON。type で種類を分ける
    properties:
      - name: type
        type: Literal["config", "ready", "transcribe", "progress", "result", "error"]
        description: config（常駐 → ワーカー。モデル・デバイス・量子化）/ ready（ワーカー → 常駐）/ transcribe（常駐 → ワーカー。録音のパスと言語・ビーム幅・温度・VAD）/ progress（区間の終わりの時刻）/ result（区間ごとの文字）/ error（理由）
      - name: payload
        type: dict
        description: 種類ごとの中身
    status: planned
functions:
  - name: run_worker
    title: ワーカーの本体
    kind: 関数
    container: integrations/whisper/worker.py
    usecase: 録音を文字に起こす
    scope: public
    summary: config を受けてモデルを読み、ready を返してから transcribe を 1 件ずつ処理する。標準入力が閉じたら終わる
    args:
      - name: stdin
        type: TextIO
        required: true
        passing: positional
        description: 常駐サービスからの入力
      - name: stdout
        type: TextIO
        required: true
        passing: positional
        description: 常駐サービスへの出力
      - name: load_model
        type: Callable[[dict], WhisperModel]
        required: true
        passing: injected
        description: faster-whisper のモデルを読む（テストで差し替える）
    returns:
      type: int
      description: 終了コード
    process: |-
      1. config を読み、モデルを読む
         - 読めない場合、error を書いて 1 を返す
      2. ready を書く
      3. transcribe を読むたびに、区間ごとに progress を書き、最後に result を書く
         - 例外の場合、error を書いて次の行を待つ（CUDA のクラッシュはプロセスごと落ち、常駐側が立て直す）
    unit_tests:
      - name: test_run_worker
        case: 正常
        summary: ready の後に進みと結果を返す
        condition: config・transcribe を 1 行ずつ入れて標準入力を閉じる。モデルは 2 区間を返す
        mock: load_model
        expected: 出力が ready・progress × 2・result の順で、終了コードが 0
      - name: test_run_worker_when_model_load_failed
        case: 正常
        summary: モデルを読めなければ error で終わる
        condition: load_model が例外を送出する
        mock: load_model
        expected: 出力が error だけで、終了コードが 1
    refs:
      - dev/設計書/外部ライブラリ/faster-whisper#
    status: planned
