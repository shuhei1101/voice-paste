  - name: _wire_outputs
    title: 出力先の配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: internal
    summary: OUTPUTS の各出力先の handler に、その出力先の inject が OutputDeps から選んだものを部分適用して返す（出力先の ID ごとの表を持たない）
    args:
      - name: deps
        type: OutputDeps
        required: true
        passing: positional
        description: 外部連携の関数と今の設定（build_handlers が組む）
      - name: outputs
        type: Sequence[OutputSpec]
        required: true
        passing: positional
        description: 配線する出力先の一覧（OUTPUTS。テストでは試しの出力先を渡す）
    returns:
      type: tuple[OutputSpec, ...]
      description: handler を配線した出力先の一覧（outputs と同じ並び）
    process: |-
      1. outputs を順に見て、spec.inject(deps) が返したものを spec.handler に部分適用した handler に差し替える（何も返さない出力先はそのまま残る）
    unit_tests:
      - name: test_wire_outputs
        case: 正常
        summary: 各出力先に設定の値を配線する
        condition: keyboard.paste_key が `<ctrl>+<shift>+v`、paste_and_send の enter_delay_sec が 0.2 の設定を返す OutputDeps と OUTPUTS を渡す
        mock: copy_to_clipboard・send_paste・send_enter・time.sleep
        expected: 返った一覧の ID が OUTPUTS と同じ並びで、paste_and_send の handler を呼ぶと send_paste に `<ctrl>+<shift>+v`、sleep に 0.2 が渡る
      - name: test_wire_outputs_when_settings_changed
        case: 正常
        summary: 配線の後に変えた設定が次の届け方に効く
        condition: 配線の後に get_settings が返す設定を paste_key `<ctrl>+<alt>+v`・enter_delay_sec 1.0・enter_modifiers ["ctrl"] に差し替える
        mock: copy_to_clipboard・send_paste・send_enter・time.sleep
        expected: paste_and_send の handler を呼ぶと send_paste に `<ctrl>+<alt>+v`、sleep に 1.0、send_enter に ("ctrl",) が渡る
      - name: test_wire_outputs_when_registered_output
        case: 正常
        summary: 登録しただけの出力先も、その inject が選んだもので配線される
        condition: 'OUTPUTS の後ろに、inject が {"copy": deps.copy} を返す試しの出力先を足した一覧を渡す'
        mock: copy_to_clipboard
        expected: 返った一覧の最後が試しの出力先で、その handler を呼ぶと copy_to_clipboard に起こした文字が渡る
    status: implemented
  - name: build_hotkey_bindings
    title: ホットキーの割り当て
    container: main.py
    usecase: 録音する
    summary: 設定のホットキーごとに、押されたときに呼ぶ関数を組む（HotkeyListener.start へ渡す）
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: session_manager
        type: SessionManager
        required: true
        passing: positional
        description: セッション管理
      - name: start_local_session
        type: Callable[[Entry], None]
        required: true
        passing: positional
        description: ホットキー・トレイの開始
      - name: show_recording_window
        type: Callable[[], None]
        required: true
        passing: positional
        description: 隠した録音の画面を戻す指示（notify に show_recording_window と bridge を部分適用したもの。ホットキーのスレッドから呼ぶ）
    returns:
      type: dict[str, Callable[[], None]]
      description: pynput の書式のホットキー → 呼ぶ関数
    process: |-
      1. `hotkeys.start`: ホットキー・トレイの録音が recording か paused のとき、同じホットキーのオンの出力先があればその出力先で確定し（complete）、無ければ隠した録音の画面を戻す指示を出す（show_recording_window。隠していなければ UiController が何もしない。自分の録音の最中に処理中のダイアログを出さない）。ホットキー・トレイの録音が transcribing で同じホットキーのオンの出力先があるときは、その出力先へ差し替える（switch_output。録音は始めない）。それ以外（待機中・API の録音の最中・同じホットキーの出力先が無い自分の録音の文字起こし中・delivering）は start_local_session(hotkey) を呼ぶ
      2. `hotkeys.pause`: paused なら resume、それ以外は pause を呼ぶ
      3. `hotkeys.cancel`: cancel を呼ぶ
      4. オンの出力先の `hotkey`（1 と同じホットキーを除く）: ホットキー・トレイの録音が transcribing なら switch_output(その出力先の ID) を、それ以外は complete(output_id=その出力先の ID) を呼ぶ（差し替えられないセッションは SessionManager が断る）
      5. 有効なプリセットの `hotkey`: complete(preset=そのプリセット) を呼ぶ
         - 空のホットキーは登録しない（重なりは Settings の確かめが断っている）

      apply_settings が確かめる受け付けるホットキーの並び（_collect_hotkeys）も、同じく有効なプリセットの空でない `hotkey` を含める
    unit_tests:
      - name: test_build_hotkey_bindings_when_idle
        case: 正常
        summary: 待機中の開始のホットキーは録音を始める
        condition: SETTINGS_MODEL()、current が None、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: start_local_session(hotkey) が 1 回呼ばれ、complete が呼ばれない
      - name: test_build_hotkey_bindings_when_recording
        case: 正常
        summary: 録音中の開始のホットキーは貼り付けて送信で確定する
        condition: SETTINGS_MODEL()、current が hotkey・recording、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session・show_recording_window
        expected: complete(output_id=paste_and_send) が 1 回呼ばれ、start_local_session も show_recording_window も呼ばれない
      - name: test_build_hotkey_bindings_when_preset
        case: 正常
        summary: プリセットのホットキーはそのプリセットで確定する
        condition: presets に ChatGPT（browser、<ctrl>+<alt>+1）を置いた設定、<ctrl>+<alt>+1 の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: complete(preset=ChatGPT のプリセット) が呼ばれる
      - name: test_build_hotkey_bindings_when_paused
        case: 正常
        summary: 一時停止中の一時停止のホットキーは再開する
        condition: current が hotkey・paused、<ctrl>+<alt>+z の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: resume が 1 回呼ばれ、pause が呼ばれない
      - name: test_build_hotkey_bindings_when_output_disabled
        case: 正常
        summary: オフの出力先のホットキーは登録しない
        condition: コピーのみをオフにした設定
        mock: session_manager・start_local_session
        expected: <ctrl>+<alt>+c が返り値のキーに無い
      - name: test_build_hotkey_bindings_when_recording_without_confirm_output
        case: 正常
        summary: 貼り付けて送信がオフなら、録音中の開始のホットキーは録音の画面を戻す指示を出す
        condition: 貼り付けて送信をオフにした設定、current が hotkey・recording、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session・show_recording_window
        expected: show_recording_window が 1 回呼ばれ、start_local_session も complete も呼ばれない
      - name: test_build_hotkey_bindings_when_preset_not_bound
        case: 正常
        summary: 無効のプリセットとホットキーが空のプリセットは登録しない
        condition: presets に無効のプリセット（<ctrl>+<alt>+7）と、hotkey が空の有効なプリセットを置いた設定
        mock: session_manager・start_local_session
        expected: <ctrl>+<alt>+7 と空文字が返り値のキーに無い
      - name: test_build_hotkey_bindings_when_transcribing
        case: 正常
        summary: 文字起こし中の出力先のホットキーはその出力先へ差し替える
        condition: SETTINGS_MODEL()、current が hotkey・transcribing、<ctrl>+<alt>+c の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: switch_output("copy_only") が 1 回呼ばれ、complete が呼ばれない
      - name: test_build_hotkey_bindings_when_transcribing_start_hotkey
        case: 正常
        summary: 文字起こし中の開始のホットキーは、同じキーの出力先へ差し替えて録音を始めない
        condition: SETTINGS_MODEL()、current が hotkey・transcribing、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session・show_recording_window
        expected: switch_output("paste_and_send") が 1 回呼ばれ、start_local_session・complete が呼ばれない
    refs:
      - dev/設計書/シナリオ/単一ユースケース/録音する#
    status: implemented
  - name: apply_settings
    title: 設定の保存と反映
    container: main.py
    usecase: 設定を変える
    summary: 設定画面で確かめた設定と、行を変えた用語集の CSV を書き、反映が immediate の項目を動いている常駐アプリに効かせる（UiDeps.save_settings）
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 保存する設定
      - name: settings_file
        type: Path
        required: true
        passing: injected
        description: settings.toml
      - name: store
        type: SettingsStore
        required: true
        passing: injected
        description: 今の設定
      - name: check_hotkeys
        type: Callable[[Iterable[str]], None]
        required: true
        passing: injected
        description: ホットキーを受け付けられるかの確かめ（validate_hotkeys）
      - name: glossary_rows
        type: Mapping[Path, Sequence[GlossaryEntry]]
        required: true
        passing: positional
        description: 書き戻す用語集の CSV の場所（絶対パス）→ 行。設定画面で行を変えた用語集と足した用語集だけを持つ（行を変えていなければ空）
      - name: save_glossary
        type: Callable[[Path, Sequence[GlossaryEntry]], None]
        required: true
        passing: injected
        description: 用語集の書き戻し（features/correction の save_glossary）
    returns:
      type: bool
      description: 再起動が要る項目が変わったか
    process: |-
      1. 新しい設定で受け付けるホットキー（build_hotkey_bindings のキー）を check_hotkeys で確かめる
         - HotkeyError の場合、何も書かず入れ替えずにそのまま送出する（設定画面がエラーの一覧に出す）
      2. glossary_rows の用語集の CSV を書く（save_glossary。glossary_rows に無い用語集の CSV には触れない）
         - OSError の場合、settings.toml を書かず SettingsStore も入れ替えずにそのまま送出する（先に書けた CSV は戻さない）
      3. settings.toml へ書く（save_settings）
      4. SettingsStore を入れ替える（出力先のオン・オフ・録音・用語集・`ui.*` は次の回から新しい値で動く。ホットキーは設定画面が閉じたときに resume_hotkeys がこの設定で張り直す）
         - `[INFO]` 設定を保存した（設定ファイルのパス・再起動が要るか・書いた用語集の CSV の数）
    exceptions:
      - name: HotkeyError
        condition: 新しい設定のホットキーを pynput が読めない（何も書かない）
      - name: OSError
        condition: 用語集の CSV か settings.toml を書けない（SettingsStore は入れ替えない）
    unit_tests:
      - name: test_apply_settings
        case: 正常
        summary: 確かめてから書いて入れ替える
        condition: 一時フォルダの settings.toml、コピーのみをオフにした設定
        mock: check_hotkeys
        expected: False。check_hotkeys に <ctrl>+<alt>+c を含まないホットキーが渡り、settings.toml のコピーのみの enabled が false、store.get() が渡した設定
      - name: test_apply_settings_when_restart_item_changed
        case: 正常
        summary: 再起動が要る項目の変更を返す
        condition: transcription.local_whisper.model を small にした設定
        mock: check_hotkeys
        expected: 'True'
      - name: test_apply_settings_when_hotkey_unavailable
        case: 異常
        summary: 受け付けられないホットキーなら何も書かない
        condition: check_hotkeys が HotkeyError を送出する
        mock: check_hotkeys
        expected: HotkeyError が送出され、settings.toml が変わらず、store.get() が前の設定のまま
        exception: ホットキーを受け付けられない
      - name: test_apply_settings_when_glossary_rows
        case: 正常
        summary: 渡した用語集の CSV だけを書く
        condition: 2 件の glossaries を持つ設定と、1 件目の場所だけを持つ glossary_rows で呼ぶ
        mock: save_glossary（呼ばれた引数を控える）・check_hotkeys（何もしない）
        expected: save_glossary が 1 件目の場所と行で 1 回だけ呼ばれ、settings.toml が書かれ、SettingsStore が新しい設定になる
      - name: test_apply_settings_when_glossary_write_fails
        case: 異常
        summary: 用語集の CSV を書けなければ、設定を書かず入れ替えない
        condition: save_glossary が OSError を送出する glossary_rows で呼ぶ
        mock: save_glossary（OSError を送出する）・check_hotkeys（何もしない）
        expected: OSError。settings.toml が変わらず、SettingsStore が前の設定のまま
    refs:
      - dev/設計書/シナリオ/単一ユースケース/設定を変える#
    status: implemented
  - name: build_ui_deps
    title: 画面の配線
    container: main.py
    usecase: 共通
    summary: Handlers と置き場所から、画面・トレイが呼ぶ UiDeps を組む
    kind: 関数
    scope: public
    args:
      - name: handlers
        type: Handlers
        required: true
        passing: positional
        description: 配線済みの関数
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: save_settings
        type: Callable[[Settings, Mapping[Path, Sequence[GlossaryEntry]]], bool]
        required: true
        passing: positional
        description: apply_settings を部分適用したもの
      - name: request_restart
        type: Callable[[], None]
        required: true
        passing: positional
        description: 再起動を記録してイベントループを抜ける
      - name: request_quit
        type: Callable[[], None]
        required: true
        passing: positional
        description: QApplication.quit
      - name: hotkey_listener
        type: HotkeyListener
        required: true
        passing: positional
        description: ホットキーの受付（設定画面の間は止める）
      - name: show_recording_window
        type: Callable[[], None]
        required: true
        passing: positional
        description: 隠した録音の画面を戻す指示（notify に show_recording_window と bridge を部分適用したもの。resume_hotkeys が build_hotkey_bindings へ渡す）
      - name: apply_theme
        type: Callable[[], None]
        required: true
        passing: positional
        description: SettingsStore.get の ui.theme で画面の明暗を当て直す（apply_theme に QApplication と paths.ui_image_dir を部分適用したもの）
    returns:
      type: UiDeps
      description: 画面の依存
    process: |-
      1. start に start_local_session(tray)、pause・resume・cancel・current_session・switch_output に SessionManager のメソッド、complete に output_id・preset で SessionManager.complete を呼ぶ関数、level に recorder_level、get_settings に SettingsStore.get を渡す（エンジンを準備できなかった起動の UiDeps の switch_output は、ほかの録音の関数と同じく何もしない関数）
      2. suspend_hotkeys に HotkeyListener.stop、resume_hotkeys に SettingsStore.get の設定と show_recording_window で build_hotkey_bindings して HotkeyListener.start を呼ぶ関数を渡す
      3. settings_dir に settings.toml のフォルダ、log_dir にログのフォルダを渡す
      4. output_titles に、OUTPUTS のうち api_only でない出力先の ID → title を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      5. apply_theme に引数の apply_theme を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      6. list_glossaries に SettingsStore.get の設定と settings.toml のフォルダで resolve_glossaries を呼ぶ関数、read_glossary に read_glossary_rows、new_glossary_path に settings.toml のフォルダの `glossaries` を部分適用した next_glossary_path を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
      7. copy に copy_to_clipboard を渡す（エンジンを準備できなかった起動の UiDeps も同じ）
    status: implemented
  - name: relaunch
    title: 起動し直し
    container: runtime/process.py
    usecase: トレイから操作する
    summary: 同じ Python と引数で `python -m voice_paste` を切り離したプロセスとして起動する。片付けを終えた後に呼ぶ（API のポートとエンジンを放してから次を立てる）
    kind: 関数
    scope: public
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: 起動の引数（プログラム名を除く）
    returns:
      type: None
      description: なし
    process: |-
      1. `subprocess.Popen([sys.executable, "-m", "voice_paste", *argv], creationflags=DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP, close_fds=True)` で起動する
         - OSError の場合、ログに書いて握る（終わり方は変えない）
           - `[ERROR]` 起動し直せなかった（logger.exception）
         - `[INFO]` 起動し直した（引数）
    unit_tests:
      - name: test_relaunch
        case: 正常
        summary: 同じ引数で切り離して起動する
        condition: argv=["--data-dir", "C:/tmp/vp"]
        mock: subprocess.Popen
        expected: Popen に [sys.executable, "-m", "voice_paste", "--data-dir", "C:/tmp/vp"] と DETACHED_PROCESS が渡る
      - name: test_relaunch_when_failed
        case: 異常
        summary: 起動できなくても例外を漏らさない
        condition: Popen が OSError を送出する
        mock: subprocess.Popen
        expected: 例外が出ず、ERROR のログが 1 行出る
        exception: 起動できない
    status: implemented
  - name: instance_name
    title: 単一インスタンスの名前
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: 設定の置き場所から、単一インスタンスの排他の名前を作る
    kind: 関数
    scope: public
    args:
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: 設定ファイルを置くフォルダ（AppPaths.settings_file の親）
    returns:
      type: str
      description: '`voice-paste-{ハッシュ}`（ハッシュは解決した絶対パスを小文字にした文字列の SHA-256 の先頭 16 文字）'
    process: |-
      1. settings_dir を解決した絶対パスを小文字にし、SHA-256 の 16 進の先頭 INSTANCE_HASH_LENGTH 文字を `{APP_NAME}-` に続けて返す
         - 普段使い（既定の置き場所）と E2E・非機能要件テスト（`--data-dir` の一時フォルダ）は別の名前になり、テストの起動が普段使いを終わらせない
    unit_tests:
      - name: test_instance_name
        case: 正常
        summary: 同じフォルダは大文字・小文字によらず同じ名前になる
        condition: '`C:/Users/a/AppData/Roaming/voice-paste` と `c:/users/a/appdata/roaming/VOICE-PASTE`'
        mock: なし
        expected: 同じ名前で、`voice-paste-` に 16 文字の 16 進が続く
      - name: test_instance_name_when_other_folder
        case: 正常
        summary: 違うフォルダは違う名前になる
        condition: 既定の置き場所と一時フォルダ
        mock: なし
        expected: 名前が違う
    status: implemented
  - name: purge_old_files
    title: 古いログと履歴の削除
    container: main.py
    usecase: 常駐アプリを起動する
    summary: 設定の保持期間を過ぎたログと履歴を消す
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定（ログと履歴の保持期間・履歴を残すか）
      - name: paths
        type: AppPaths
        required: true
        passing: keyword
        description: 置き場所
      - name: active_session_ids
        type: Callable[[], set[str]]
        required: true
        passing: keyword
        description: 処理中のセッションの ID を返す関数（一時の音声を消さずに残す）
    returns:
      type: None
      description: なし
    process: |-
      1. 保持期間を過ぎた日付のログを消す（purge_old_logs(paths.log_dir, settings.logging.retention_days, local_today())）
      2. 履歴を残す設定（settings.history.enabled）か
         - 残す場合、保持期間を過ぎた履歴のフォルダと取り残された一時の音声を消す（purge_expired(retention_days=settings.history.retention_days, paths, now=_local_now, active_session_ids)）
         - 残さない場合、履歴は消さない
    unit_tests:
      - name: test_purge_old_files
        case: 正常
        summary: ログと履歴の両方を消す
        condition: history.enabled=true・history.retention_days=1・logging.retention_days=7
        mock: purge_old_logs・purge_expired
        expected: purge_old_logs に (log_dir, 7, 今日) が、purge_expired に retention_days=1 と active_session_ids が渡る
      - name: test_purge_old_files_when_history_disabled
        case: 正常
        summary: 履歴を残さない設定ならログだけ消す
        condition: history.enabled=false
        mock: purge_old_logs・purge_expired
        expected: purge_old_logs が 1 回呼ばれ、purge_expired が呼ばれない
    status: implemented
  - name: _wire_preset_kinds
    title: プリセットの種類の配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: internal
    summary: PRESET_KINDS の各種類の handler に、種類ごとの外部連携の関数と設定の値を部分適用して返す
    args:
      - name: get_settings
        type: Callable[[], Settings]
        required: true
        passing: positional
        description: 今の設定を返す（keyboard.paste_key・outputs[]・preset_options を読む）
    returns:
      type: tuple[PresetKindSpec, ...]
      description: handler を配線した種類の一覧（PRESET_KINDS と同じ並び）
    process: |-
      1. 呼ぶたびに get_settings() を読む関数を作る（届けるたびに読む）
         - paste: keyboard.paste_key で send_paste を呼ぶ
         - get_enter_delay_sec: read_enter_delay_sec(get_settings())（貼り付けて送信の秒数）
         - get_open_delay_sec: preset_options.browser.open_delay_sec を返す
         - get_timeout_sec: preset_options.endpoint.timeout_sec を返す
      2. PRESET_KINDS を順に見て、種類ごとに build_handlers の 4 のとおり部分適用した handler に差し替える
         - 部分適用の対象に無い種類はそのまま残す
    unit_tests:
      - name: test_wire_preset_kinds
        case: 正常
        summary: 各種類に設定の値を配線する
        condition: preset_options.browser.open_delay_sec が 1.5、paste_and_send の enter_delay_sec が 0.2、preset_options.endpoint.timeout_sec が 2.0
        mock: copy_to_clipboard・send_paste・send_enter・open_app_window・time.sleep・post_json
        expected: 返った一覧の kind が PRESET_KINDS と同じ並びで、browser の handler を send_enter True のプリセットで呼ぶと sleep に 1.5・0.2 がこの順に渡り、endpoint の handler を呼ぶと post_json の timeout_sec に 2.0 が渡る
      - name: test_wire_preset_kinds_when_settings_changed
        case: 正常
        summary: 配線の後に変えたタイムアウトが次の送りに効く
        condition: 配線の後に get_settings が返す設定の preset_options.endpoint.timeout_sec を 5.0 に差し替える
        mock: post_json
        expected: endpoint の handler を呼ぶと post_json の timeout_sec に 5.0 が渡る
    refs:
      - dev/設計書/モジュール構成/常駐アプリ/出力先.py#constants[PRESET_KINDS]
    status: implemented
notes:
  依存の向き: |-
    コーディング規約『依存関係管理』のとおり `features`・`server`・`ui` → `integrations`・`runtime` → `shared` とし、上の層へは import しない。
    `features` どうしと、`features/outputs` の出力先どうしも import しない。セッションはほかの feature を SessionDeps の関数型で受け取り、`main.py` だけが全てを知る。
    `server` はセッションの route を include_router で集め、SessionApiDeps を app.state に置くためだけに `features/session` を import する。route は `main.py`・`server` を import せず、SessionApiDeps を app.state から受け取る。
    `ui` は `features` の中を直に呼ばず、UiDeps の関数と `shared` の設定のモデルだけを使う。型としては `features.session.types`（Session・SessionState）だけを import する。`runtime/hotkey.py` はセッションを import せず、`main.py` が渡す関数を呼ぶ。
  依存の向きの検査: |-
    import-linter の契約を pyproject.toml の `[tool.importlinter]`（root_package は `voice_paste`）に置き、単体テストと一緒に `lint-imports` で回す（品質シナリオ 5。コマンドは設計書『テスト実行方法』）。

    | 契約 | 種類 | 中身 |
    | --- | --- | --- |
    | 層 | layers | `voice_paste.main` → `voice_paste.server` \| `voice_paste.ui` → `voice_paste.features` → `voice_paste.integrations` \| `voice_paste.runtime` → `voice_paste.shared`（`\|` で並べた層どうしも import しない） |
    | feature の独立 | independence | `voice_paste.features.*` |
    | 出力先の独立 | independence | `voice_paste.features.outputs.*`。ignore_imports で `voice_paste.features.outputs.registry -> voice_paste.features.outputs.*`・`voice_paste.features.outputs.service -> voice_paste.features.outputs.registry`・`voice_paste.features.outputs.** -> voice_paste.features.outputs.types` を除く |
    | 画面から feature の中へ | forbidden | source_modules は `voice_paste.ui`、forbidden_modules は `voice_paste.features`・`voice_paste.integrations`。ignore_imports で `voice_paste.ui.** -> voice_paste.features.session.types` を除く |

    出力先を足すときは `features/outputs/` にサブフォルダを足すだけで契約の対象に入り、契約は直さない。
classes:
  - name: RepeatingTimer
    title: 定期の呼び出し
    container: runtime/timer.py
    usecase: APIで録音を操作する
    role: ランタイム
    kind: クラス
    summary: 渡された関数を専用のデーモンスレッドで一定の間隔ごとに呼ぶ
    description: |-
      終わりの合図を threading.Event で持ち、Event.wait(間隔) で待つ。
      呼んだ関数が例外を出してもスレッドを止めず、logger.exception で残して次の回を待つ（上限での打ち切りが 1 回の失敗で止まらない）。
    properties:
      - name: _action
        type: Callable[[], object]
        access: 内部 (_)
        description: 呼ぶ関数
      - name: _interval_sec
        type: float
        access: 内部 (_)
        description: 呼ぶ間隔
      - name: _stopped
        type: threading.Event
        access: 内部 (_)
        description: 終わりの合図
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: 呼び出しのスレッド。start の前は None
    methods:
      - name: start
        title: 開始
        kind: メソッド
        scope: public
        summary: スレッドを始め、間隔ごとに関数を呼ぶ
        returns:
          type: None
          description: なし
        process: |-
          1. デーモンスレッドで、終わりの合図が立つまで「間隔だけ待つ → 関数を呼ぶ」を繰り返す
             - 関数が例外を出した場合、次の回を待つ
               - `[ERROR]` 定期の呼び出しで想定外の例外（logger.exception）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 間隔ごとに呼ぶ
            condition: 間隔 0.01 秒で始め、呼ばれた回数が 3 になるまで待つ
            mock: 呼ぶ関数
            expected: 1 秒以内に 3 回呼ばれる
          - name: test_start_when_action_raised
            case: 正常
            summary: 例外でも止まらない
            condition: 呼ぶ関数が 1 回目だけ RuntimeError を送出する
            mock: 呼ぶ関数
            expected: 2 回目以降も呼ばれ、ERROR のログが 1 行出る
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: 終わりの合図を立て、スレッドの終わりを待つ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めた後は呼ばない
            condition: start の後に stop を呼び、間隔の 5 倍待つ
            mock: 呼ぶ関数
            expected: stop の後に呼ばれた回数が増えず、スレッドが終わっている
    status: implemented
  - name: SettingsStore
    title: 今の設定
    container: runtime/settings_store.py
    usecase: 設定を変える
    role: ランタイム
    summary: 動いている間の今の設定を 1 つ持ち、設定画面で保存した設定に入れ替える
    description: 出力先・録音・用語集・画面は設定を値で持たず、使うたびに get で読む。Settings は不変として扱い、入れ替えるだけにする。
    kind: クラス
    properties:
      - name: _settings
        type: Settings
        access: 内部 (_)
        description: 今の設定
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: 入れ替えと読み出しを 1 つずつにする
    methods:
      - name: get
        title: 読む
        summary: 今の設定を返す
        kind: メソッド
        scope: public
        thread_safe: true
        returns:
          type: Settings
          description: 今の設定
      - name: replace
        title: 入れ替える
        summary: 今の設定を入れ替える
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: settings
            type: Settings
            required: true
            passing: positional
            description: 新しい設定
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_replace
            case: 正常
            summary: 入れ替えた設定を読める
            condition: SETTINGS_MODEL() で作り、recording.volume_percent=30 の設定に replace する
            mock: なし
            expected: get().recording.volume_percent が 30
    status: implemented
  - name: SingleInstanceLock
    title: 単一インスタンスの排他
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    role: ランタイム
    summary: 取った名前付きのミューテックスと、終了の依頼を待つスレッドを持つ
    description: |-
      終了の依頼のイベント（名前付き）と停止のイベント（名前の無い自分専用）を専用のデーモンスレッドで待ち、終了の依頼が立ったら on_quit_requested で渡された関数を 1 回呼んでスレッドを終える（呼ぶのはそのスレッド。メインスレッドへ渡すのは渡す側の関数が行う）。
      名前付きのイベントは自分では立てない（立てると、ハンドルが残る間に次のプロセスへ依頼が引き継がれる）。
      ミューテックスは取ったスレッド（メインスレッド）で放す。
    kind: クラス
    properties:
      - name: _mutex
        type: int
        access: 内部 (_)
        description: 名前付きのミューテックスのハンドル
      - name: _quit_event
        type: int
        access: 内部 (_)
        description: 終了の依頼のイベントのハンドル
      - name: _on_quit
        type: Callable[[], None] | None
        access: 内部 (_)
        description: 終了を頼まれたときに呼ぶ関数。on_quit_requested の前は None（その間に頼まれたら、渡された時点で呼ぶ）
      - name: _thread
        type: threading.Thread
        access: 内部 (_)
        description: 終了の依頼を待つスレッド
      - name: _stop_event
        type: int
        access: 内部 (_)
        description: 待つスレッドを止める、名前の無い自分専用のイベントのハンドル
    methods:
      - name: on_quit_requested
        title: 終了の依頼の受け手の登録
        summary: 終了を頼まれたときに呼ぶ関数を渡す
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: callback
            type: Callable[[], None]
            required: true
            passing: positional
            description: 終了を頼まれたときに呼ぶ関数
        returns:
          type: None
          description: なし
        process: |-
          1. 受け手を覚える
             - 既に頼まれていた場合、その場で 1 回呼ぶ
        unit_tests:
          - name: test_on_quit_requested
            case: 正常
            summary: 頼まれたら受け手を呼ぶ
            condition: 取った後に受け手を渡し、同じ名前のイベントを立てる
            mock: 受け手
            expected: 受け手が 1 秒以内に 1 回呼ばれる
          - name: test_on_quit_requested_when_already_requested
            case: 正常
            summary: 受け手を渡す前に頼まれていても取りこぼさない
            condition: 取った後、受け手を渡す前にイベントを立てる
            mock: 受け手
            expected: 受け手を渡した時点で 1 回呼ばれる
      - name: release
        title: 排他の解放
        summary: 待つスレッドを止め、ミューテックスを放してハンドルを閉じる
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        process: |-
          1. 停止のイベント（名前の無い自分専用）を立てて待つスレッドを抜けさせ、終わりを待つ（名前付きの終了の依頼のイベントは立てない）
          2. ミューテックスを放し（ReleaseMutex）、ミューテックス・終了の依頼のイベント・停止のイベントのハンドルを閉じる（CloseHandle）
             - 2 回目以降の呼び出しは何もしない
        unit_tests:
          - name: test_release
            case: 正常
            summary: 放した後は同じ名前ですぐ取れ、受け手は呼ばれない
            condition: 取ってから release を 2 回呼ぶ
            mock: 受け手
            expected: 同じ名前で timeout_sec=0.1 で取れ、受け手が呼ばれていない
    status: implemented
constants:
  - name: API_START_TIMEOUT_SEC
    title: API の待ち受けの始まりを待つ秒数
    container: main.py
    usecase: 常駐アプリを起動する
    summary: ApiServerRunner.start が started を待つ上限。uvicorn の起動の実測が無いため仮に置き、結合テストで起動にかかる時間を測って p99.9 + 50% に直す
    value: '5.0'
    status: implemented
  - name: SESSION_LIMIT_CHECK_INTERVAL_SEC
    title: 上限での打ち切りを確かめる間隔
    container: main.py
    usecase: APIで録音を操作する
    summary: RepeatingTimer が truncate_if_expired を呼ぶ間隔。打ち切りの遅れはこの間隔までで、API のセッションの上限時間（600 秒）に対して無視できる 1 秒にする
    value: '1.0'
    status: implemented
  - name: API_SESSION_LIMIT_SEC
    title: API のセッションの上限時間
    container: main.py
    usecase: APIで録音を操作する
    summary: SessionManager へ渡す上限時間。非機能要件の API のセッションの上限時間の決定値
    value: '600'
    status: implemented
  - name: WAKE_INTERVAL_MS
    title: Python へ戻る間隔
    container: main.py
    usecase: 常駐アプリを起動する
    summary: Qt のイベントループの中で Python のシグナルのハンドラが動くようにする空の QTimer の間隔。PoC で 200 ms なら Ctrl+Break から 0.3 秒で終わった
    value: '200'
    status: implemented
  - name: SINGLE_INSTANCE_TIMEOUT_SEC
    title: 前の常駐サービスの終わりを待つ時間
    container: main.py
    usecase: 常駐アプリを起動する
    summary: acquire_single_instance に渡す、前のプロセスが排他を放すのを待つ上限。非機能要件の前の常駐サービスの終わりを待つ時間の決定値
    value: '54.0'
    status: implemented
  - name: PURGE_INTERVAL_SEC
    title: 常駐中に古いログと履歴を消す間隔
    container: main.py
    usecase: 常駐アプリを起動する
    summary: RepeatingTimer が purge_old_files を呼ぶ間隔。非機能要件の常駐中に古い履歴とログを消す間隔（24 時間）を秒にした値
    value: '86400.0'
    status: implemented
  - name: INSTANCE_HASH_LENGTH
    title: 単一インスタンスの名前のハッシュの長さ
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: instance_name が名前に使う SHA-256 の 16 進の文字数。置き場所が 1 台に数個のため、16 文字（64 ビット）で重ならない
    value: '16'
    status: implemented
  - name: OPEN_EVENT_RETRY_INTERVAL_SEC
    title: 前のプロセスのイベントを開き直す間隔
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    summary: 前のプロセスがミューテックスを作ってからイベントを作るまでの間に OpenEventW が失敗したとき、開き直す間隔。前のプロセスの起動の初めの数ミリ秒の間だけ起こるため、依頼の遅れを 0.1 秒までに抑える
    value: '0.1'
    status: implemented
  - name: SETTINGS_MODEL
    title: アプリの設定のモデル
    container: main.py
    usecase: 常駐アプリを起動する
    summary: OUTPUTS のうち settings_model を持つ出力先のモデルを OUTPUTS の並びで build_settings_model に渡して組み立てた設定のモデル。load_settings と既定の設定はこれを使う
    value: build_settings_model([spec.settings_model for spec in OUTPUTS if spec.settings_model is not None])
    status: planned
  - name: GLOSSARIES_DIR_NAME
    title: 足した用語集の CSV を置くフォルダの名前
    container: main.py
    usecase: 設定を変える
    summary: 設定画面で足した用語集の CSV を置く、settings.toml と同じフォルダの下のフォルダの名前。next_glossary_path の directory に渡す
    value: '"glossaries"'
    status: implemented
