        expected: 再読み込みした設定の outputs の最後が試しの出力先（delay_sec 1.0）、<ctrl>+<alt>+t がホットキーに登録され、設定画面に outputs[3].enabled・outputs[3].hotkey・outputs[3].delay_sec の欄があり、録音の画面に試しの出力先のボタンが出て、output_id=try_output で deliver すると試しの handler が inject の渡したものと共に呼ばれる
  - name: 音量の操作のライブラリの変化の検知
