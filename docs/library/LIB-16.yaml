id: LIB-16
visibility: internal
title: "platformdirs"
kind: "ライブラリ"
version:
  current: 4.13.3
  latest: 4.12.2
  checked_on: '2026-10-01'
  source: pyproject.toml と uv.lock のバージョン
  pinning: 互換リリースで固定（~=4.12）
catalogs:
  - name: API
    version: 4.12.2
    entries:
      - name: user_config_dir
        kind: 関数
        purpose: 環境の値の `settings.yaml`（と移す元の `settings.toml`）の配置先（Windows で roaming=True は `%APPDATA%\voice-paste`、Linux は `~/.config/voice-paste`）を取得する
      - name: user_data_dir
        kind: 関数
        purpose: 履歴・ログ・一時の音声・トークンの配置先（Windows で `%LOCALAPPDATA%\voice-paste`、Linux は `~/.local/share/voice-paste`）を取得する
lead: OS ごとの慣習に沿った設定・データ・キャッシュの配置先を返却するライブラリ。
purl: pkg:pypi/platformdirs
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/shared/constants.py
upstream: tox-dev/platformdirs
verification:
  state: 済
  date: '2026-10-01'
  detail: Windows（普段使いの venv の Python 3.14.3）で、一時フォルダへ `pip install --target` で入れた 4.12.2 を使用し、`user_config_dir("voice-paste", appauthor=False, roaming=True)` が `C:\Users\{ユーザー}\AppData\Roaming\voice-paste`（`%APPDATA%` の下）、`user_data_dir("voice-paste", appauthor=False)` が `C:\Users\{ユーザー}\AppData\Local\voice-paste`（`%LOCALAPPDATA%` の下）を返却することを確認した。venv には入れていない
license: MIT（商用利用可）
official_url: https://github.com/tox-dev/platformdirs
docs_url: https://platformdirs.readthedocs.io/
