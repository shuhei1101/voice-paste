id: MOD-11
title: 常駐アプリ / 補正 / service.py
lead: 用語集の CSV を読み書きし、補正に使う用語集の誤変換を正しい表記へ置き換える。決まった入力に決まった出力を返し、特性テストの基準になる。
test_files:
  - tests/unit/voice_paste/features/correction/test_service.py
directory: |-
  ```
  src/voice_paste/features/correction/
  ├── __init__.py   # load_glossary・read_glossary_rows・save_glossary・apply_glossary・resolve_glossaries・resolve_glossary_presets・pick_glossary_preset・list_preset_glossaries・next_glossary_path・strip_edge_phrases の公開
  └── service.py    # 用語集の一覧の解決、CSV の読み書き、置き換え、文頭・文末の文言の削除
  ```
constants:
  - name: DEFAULT_GLOSSARY_FILE_NAME
    title: 既定の用語集のファイル名
    container: features/correction/service.py
    value: '"yogo.csv"'
    summary: '`glossaries` も `glossary_path` も無いときに読む、settings.yaml と同じフォルダの用語集のファイル名（main.py の GLOSSARY_FILE_NAME を移す）'
    status: implemented
  - name: EDGE_TRAILING_CHARS
    title: 文言と一緒に削除する文字
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    summary: 一致した文言の後ろに続くとき、文言と一緒に消す句読点と空白
    value: '"。、，．,.!?！？ 　\t"'
    status: implemented
  - name: DEFAULT_GLOSSARY_PRESET_NAME
    title: 既定の用語集のプリセットの名前
    container: features/correction/service.py
    usecase: 共通
    summary: '`glossary_presets` のキーが無い・空の設定で、resolve_glossary_presets が作る 1 つだけのプリセットの名前'
    value: '"既定"'
    status: planned
    introduced:
      pr: 173
functions:
  - name: load_glossary
    title: 用語集の読み込み
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 用語集の CSV から、補正に使う行（オンで、誤変換がある行。正しい表記が空の行は誤変換を消す行）を読む。文字起こしのたびに読み直す
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV（補正に使う用語集の場所。list_preset_glossaries が返す用語集の path）
    returns:
      type: list[GlossaryEntry]
      description: 補正に使う行。ファイルが無ければ空
    process: |-
      1. read_glossary_rows で行を読む（ファイルが無ければ空）
         - GlossaryReadError の場合、空を返す（補正せずに届ける。文字起こしは失敗にしない）
           - `[WARNING]` 用語集を読めなかった（パス・理由）
      2. オフの行と、誤変換が空の行を飛ばす（正しい表記が空の行は、誤変換を消す行として残す）
         - `[INFO]` 用語集を読んだ（パス・行数・補正に使う行数）
    unit_tests:
      - name: test_load_glossary
        case: 正常
        summary: CSV の行を読む
        condition: 2 行と空行 1 つの CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry が 2 つ返る
      - name: test_load_glossary_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 存在しないパス
        mock: なし
        expected: '[] が返る'
      - name: test_load_glossary_when_bom
        case: 正常
        summary: BOM つきの CSV も列名で読める
        condition: BOM つきの UTF-8 で 1 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry が 1 つ返る
      - name: test_load_glossary_when_blank_cells
        case: 正常
        summary: 空白を除き、誤変換が空の行を飛ばし、正しい表記が空の行を残す
        condition: 「 くろーど , Claude 」・「あいう,」・「,えお」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryEntry(wrong="くろーど", right="Claude") と GlossaryEntry(wrong="あいう", right="") の 2 つが返る
      - name: test_load_glossary_when_disabled_rows
        case: 正常
        summary: オフの行を飛ばす
        condition: 列 `使う` が「1」「0」「（空）」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: 「1」と「（空）」の 2 行だけが返る
      - name: test_load_glossary_when_unreadable
        case: 正常
        summary: 読めない CSV は空として扱い、例外を上げない
        condition: Shift_JIS で書いた 1 行の CSV
        mock: なし（一時フォルダ）
        expected: '[] が返る'
      - name: test_load_glossary_when_malformed
        case: 正常
        summary: csv が解釈できない CSV も空として扱い、例外を上げない
        condition: 見出しの次の行が「あ,"」で始まり、閉じない引用符の後ろに x を 200000 文字続けた CSV
        mock: なし（一時フォルダ）
        expected: '[] が返る'
    status: implemented
  - name: apply_glossary
    title: 用語集での補正
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 誤変換を正しい表記へ置き換える（正しい表記が空の行は誤変換を消す。用語集の行の順に、前の行で置き換えた結果へ次の行を当てる）
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 起こした文字
      - name: entries
        type: list[GlossaryEntry]
        required: true
        passing: positional
        description: 用語集の行
    returns:
      type: str
      description: 補正した文字
    unit_tests:
      - name: test_apply_glossary
        case: 正常
        summary: 誤変換を置き換える
        condition: 「くろーどこーど」→「Claude Code」の行と、それを含む文
        mock: なし
        expected: 「Claude Code」に置き換わった文が返る
      - name: test_apply_glossary_when_chained
        case: 正常
        summary: 前の行で置き換えた結果に次の行を当てる
        condition: 「A」→「B」、「B」→「C」の順の 2 行と文字「A」
        mock: なし
        expected: 「C」が返る
      - name: test_apply_glossary_when_no_match
        case: 正常
        summary: 誤変換を含まなければそのまま
        condition: 「くろーどこーど」→「Claude Code」の行と文字「今日は晴れ」
        mock: なし
        expected: 「今日は晴れ」が返る
      - name: test_apply_glossary_when_right_empty
        case: 正常
        summary: 正しい表記が空の行は誤変換を消す
        condition: 「ご視聴ありがとうございました」→「」の行と、文字「今日はここまで。ご視聴ありがとうございました」
        mock: なし
        expected: 「今日はここまで。」が返る
    notes:
      特性テスト: 置き換えの結果は、#15 で固める特性テスト（今の実装の入出力）と一致させる（品質シナリオ 2）。
    status: implemented
    process: |-
      1. 用語集の行の順に、誤変換を含むなら全て正しい表記へ置き換える（正しい表記が空の行は空文字へ置き換えて消す）
         - `[INFO]` 用語集で置き換えた（置き換えた誤変換 → 正しい表記の並び。消した行は「{誤変換}→（削除）」）
  - name: read_glossary_rows
    title: 用語集の行の読み込み
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 用語集の CSV の行を、オン・オフと片方が空の行も含めて読む。設定画面の行の表と load_glossary が使う
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV
    returns:
      type: list[GlossaryEntry]
      description: CSV の行の順の行。ファイルが無ければ空
    process: |-
      1. ファイルが無ければ空を返す
         - `[WARNING]` 用語集が無い（パス）
      2. UTF-8（BOM ありも）の CSV を列名で読み、`誤変換`・`正しい表記` の前後の空白を除く
         - OSError の場合、理由「ファイルを開けません（{OS のエラー}）」の GlossaryReadError を送出する
         - UnicodeDecodeError の場合、理由「文字コードが UTF-8 ではありません」の GlossaryReadError を送出する
         - 見出しに `誤変換` か `正しい表記` の列が無い場合、理由「見出しに「誤変換」「正しい表記」の列がありません」の GlossaryReadError を送出する
         - csv.Error の場合（閉じていない引用符の後ろが csv の 1 項目の上限を超えるなど、csv が解釈できない）、理由「CSV の書式が正しくありません（{csv のエラー}）」の GlossaryReadError を送出する
         - 誤変換と正しい表記の両方が空の行は飛ばす（片方だけが空の行は返す）
      3. 列 `使う` の前後の空白を除いた値が `0` の行だけをオフにする（列が無い・空・ほかの値はオン）
    unit_tests:
      - name: test_read_glossary_rows
        case: 正常
        summary: 行をオン・オフつきで読む
        condition: '`誤変換,正しい表記,使う` の列で、使うが「1」と「0」の 2 行の CSV'
        mock: なし（一時フォルダ）
        expected: enabled が True・False の GlossaryEntry が CSV の順に返る
      - name: test_read_glossary_rows_when_no_enabled_column
        case: 正常
        summary: 列 `使う` が無い CSV の行は全てオン
        condition: '`誤変換,正しい表記` の 2 列だけの 2 行の CSV'
        mock: なし（一時フォルダ）
        expected: 2 行とも enabled が True
      - name: test_read_glossary_rows_when_half_empty
        case: 正常
        summary: 片方が空の行は返し、両方が空の行は飛ばす
        condition: 「あいう,」「,えお」「,」の 3 行の CSV
        mock: なし（一時フォルダ）
        expected: 「あいう,」と「,えお」の 2 行が返る
      - name: test_read_glossary_rows_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: 存在しないパス
        mock: なし
        expected: '[] が返る'
      - name: test_read_glossary_rows_when_not_utf8
        case: 異常
        summary: UTF-8 でない CSV は読めないとする
        condition: Shift_JIS で書いた 1 行の CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「文字コードが UTF-8 ではありません」
      - name: test_read_glossary_rows_when_no_header
        case: 異常
        summary: 見出しの列が無い CSV は読めないとする
        condition: 1 行目が「くろーど,Claude」で、見出しの無い CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「見出しに「誤変換」「正しい表記」の列がありません」
      - name: test_read_glossary_rows_when_unreadable
        case: 異常
        summary: 開けない CSV は読めないとする
        condition: path にフォルダを渡す
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「ファイルを開けません（」で始まる
      - name: test_read_glossary_rows_when_malformed
        case: 異常
        summary: csv が解釈できない CSV は読めないとする
        condition: 見出しの次の行が「あ,"」で始まり、閉じない引用符の後ろに x を 200000 文字続けた CSV
        mock: なし（一時フォルダ）
        expected: GlossaryReadError。メッセージが「CSV の書式が正しくありません（」で始まる
    status: implemented
    exceptions:
      - name: GlossaryReadError
        condition: CSV を開けない・UTF-8 として読めない・見出しに `誤変換` か `正しい表記` の列が無い・csv が解釈できない
        message: '{理由}（設定画面がそのまま出す文言）'
  - name: save_glossary
    title: 用語集の書き戻し
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 用語集の行を CSV へ書く。設定画面で行を変えた用語集と追加した用語集だけに呼ぶ
    side_effects: path を書く（親のフォルダが無ければ作る）。列 `誤変換`・`正しい表記`・`使う` のほかの列は残らない。
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 用語集の CSV
      - name: entries
        type: Sequence[GlossaryEntry]
        required: true
        passing: positional
        description: 書く行（表の順）
    returns:
      type: None
      description: なし
    process: |-
      1. 親のフォルダを作る
      2. 同じフォルダの一時ファイルに、UTF-8（BOM あり）で見出し `誤変換,正しい表記,使う` と行を書く（使うはオンが `1`、オフが `0`。誤変換と正しい表記の両方が空の行は書かない）
      3. os.replace で置き換える
         - `[INFO]` 用語集を書いた（パス・行数）
    exceptions:
      - name: OSError
        condition: CSV を書けない（元の CSV は変わらない）
    unit_tests:
      - name: test_save_glossary
        case: 正常
        summary: 書いた行を同じ順とオン・オフで読み戻せる
        condition: オンとオフの 2 行を書き、read_glossary_rows で読む
        mock: なし（一時フォルダ）
        expected: 書いた 2 行と同じ GlossaryEntry が同じ順で返る
      - name: test_save_glossary_when_new_directory
        case: 正常
        summary: 親のフォルダが無ければ作る
        condition: 存在しないフォルダの下のパスに 1 行を書く
        mock: なし（一時フォルダ）
        expected: ファイルができ、1 行が読める
      - name: test_save_glossary_when_both_empty_row
        case: 正常
        summary: 両方が空の行は書かない
        condition: 誤変換と正しい表記が空の行を 1 つ含む 2 行を書く
        mock: なし（一時フォルダ）
        expected: 読み戻すと 1 行だけ
    status: implemented
  - name: resolve_glossaries
    title: 用語集の一覧の解決
    kind: 関数
    container: features/correction/service.py
    usecase: 共通
    scope: public
    summary: 設定から、CSV の場所を絶対パスにした用語集の一覧を返す。`glossaries` が空なら、今までの `glossary_path` の CSV を 1 つ目の用語集にする
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.yaml のあるフォルダ
    returns:
      type: list[GlossarySettings]
      description: 用語集の一覧（1 件以上。path は絶対パス）
    process: |-
      1. `glossaries` が空かを確かめる
         - 空の場合、`glossary_path`（None なら settings_dir の `yogo.csv`。DEFAULT_GLOSSARY_FILE_NAME）を場所にし、名前をそのファイル名から拡張子を除いたものにした 1 件を返す。相対パスの `glossary_path` は、今までと同じく起動したフォルダからの絶対パスにする（`Path.absolute()`。保存で `glossaries[].path` に書いた後も同じファイルを指す）
      2. `glossaries` の並びのまま、相対パスの path を settings_dir からのパスにして返す（絶対パスはそのまま）
    unit_tests:
      - name: test_resolve_glossaries_when_empty
        case: 正常
        summary: 一覧が空でキーも無ければ、設定のフォルダの yogo.csv が 1 件目
        condition: 既定の設定と settings_dir
        mock: なし
        expected: 名前が「yogo」、path が settings_dir の yogo.csv の 1 件
      - name: test_resolve_glossaries_when_legacy_path
        case: 正常
        summary: 一覧が空で glossary_path があれば、その CSV が 1 件目
        condition: glossary_path = C:/x/terms.csv の設定
        mock: なし
        expected: 名前が「terms」、path が C:/x/terms.csv の 1 件
      - name: test_resolve_glossaries_when_relative_path
        case: 正常
        summary: 相対パスを設定のフォルダから解決し、絶対パスはそのまま返す
        condition: path が `glossaries/glossary_1.csv` と絶対パスの 2 件の glossaries
        mock: なし
        expected: 1 件目は settings_dir の下の絶対パス、2 件目は元のまま。並びと名前は変わらない
      - name: test_resolve_glossaries_when_relative_legacy_path
        case: 正常
        summary: 相対パスの glossary_path は、起動したフォルダからの絶対パスにする
        condition: glossary_path = terms.csv の設定と、起動したフォルダとは別の settings_dir
        mock: なし（monkeypatch.chdir で起動したフォルダを一時フォルダにする）
        expected: path が起動したフォルダの terms.csv の絶対パス（settings_dir の下ではない）
    status: implemented
  - name: pick_active_glossary
    title: 補正に使う用語集の選択
    kind: 関数
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 補正に使う単位が用語集のプリセットになったため、pick_glossary_preset と list_preset_glossaries に置き換える（#173）
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.yaml のあるフォルダ
    returns:
      type: GlossarySettings
      description: 補正に使う用語集（path は絶対パス）
    process: |-
      1. resolve_glossaries で一覧を引く
      2. `active_glossary` と同じ名前の用語集を返す
         - None か、同じ名前が無い場合、1 件目を返す
    status: removed
  - name: next_glossary_path
    title: 追加する用語集の CSV の場所
    kind: 関数
    container: features/correction/service.py
    usecase: 設定を変える
    scope: public
    summary: 設定画面で追加する用語集の CSV の場所を、今あるファイルとも一覧の用語集とも重ならない連番で決める
    args:
      - name: directory
        type: Path
        required: true
        passing: injected
        description: 追加した用語集の CSV を置くフォルダ（settings.yaml と同じフォルダの `glossaries`）
      - name: taken
        type: Collection[Path]
        required: true
        passing: positional
        description: 設定画面の一覧にある用語集の場所（保存する前に追加した分を含む）
    returns:
      type: Path
      description: '`{directory}/glossary_{n}.csv`（絶対パス）'
    process: 1. n を 1 から順に上げ、`glossary_{n}.csv` が directory に無く、taken にも無い最初の場所を返す（消した用語集の CSV が残っていれば、その番号は使わない。ファイルは作らない）
    reason: ファイル名を用語集の名前から作ると、名前を変えたときと、消した用語集と同じ名前を再追加したときに、残った CSV と重なる。Windows はファイル名の大文字と小文字を区別しないので、名前の重なりの確かめとも食い違う
    unit_tests:
      - name: test_next_glossary_path
        case: 正常
        summary: 空のフォルダなら 1 番
        condition: 存在しない directory と空の taken
        mock: なし（一時フォルダ）
        expected: directory の glossary_1.csv
      - name: test_next_glossary_path_when_file_exists
        case: 正常
        summary: 残っている CSV の番号は使わない
        condition: glossary_1.csv がある directory と空の taken
        mock: なし（一時フォルダ）
        expected: glossary_2.csv
      - name: test_next_glossary_path_when_taken
        case: 正常
        summary: 保存する前に追加した用語集の場所とも重ねない
        condition: 空の directory と、glossary_1.csv を含む taken
        mock: なし（一時フォルダ）
        expected: glossary_2.csv
    status: implemented
  - name: strip_edge_phrases
    title: 文頭・文末の文言の削除
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    summary: 一覧の行を上から順に当て、起こした文字の文頭・文末に一致した文言だけを消す
    description: |-
      文頭は 1 行目の先頭、文末は最後の行の末尾（行は改行で区切る）。文言は書いた文字との完全な一致で、`*` は改行をまたがない 0 文字以上の任意の文字列。文言の末尾の `*` は行の末尾まで、先頭の `*` は行の先頭から一致させ、途中の `*` は消す文字が最も短い一致を使う。文末で一致が複数あるときは、最も後ろから始まる一致を使う。
      文言の一致は、文言の後ろに続く EDGE_TRAILING_CHARS を含めて消す（文末では、消した後の行の末尾の空白も除く）。文言の前の句読点は残す。
    kind: 関数
    scope: public
    side_effects: なし（ログだけ）
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 起こした文字（区間ごとの文字を改行でつないだもの。連続録音は 1 区間の文字）
      - name: phrases
        type: Sequence[EdgePhraseSettings]
        required: true
        passing: positional
        description: 設定の edge_phrases（当てる順）
    returns:
      type: str
      description: 文頭・文末の文言を消した文字。全て消えたら空文字
    process: |-
      1. 文字を改行で行に分ける
      2. 一覧の行を上から順に、前の行で消した結果へ当てる
         - 位置が start か both の場合、1 行目の先頭に文言が一致する間、一致した文字を消す。1 行目が空になったらその行を除き、次の行を 1 行目として続ける
         - 位置が end か both の場合、最後の行の末尾に文言が一致する間、一致した文字を消す。最後の行が空になったらその行を除き、前の行を最後の行として続ける
      3. 行を改行でつないで返す
         - `[INFO]` 文頭・文末の文言を削除した（「文頭: {消した文字}」「文末: {消した文字}」の並び。消したものが無ければ出さない）
    unit_tests:
      - name: test_strip_edge_phrases
        case: 正常
        summary: 一覧の順に文末から消し、文頭の行は文頭だけに当てる
        condition: 一覧が上から「チャンネル登録*」（end）・「ご視聴ありがとうございました」（end）・「ありがとうございました」（end）・「えーと」（start）。文字は「えーと、ありがとうございました。本日の議題は予算です。\n以上です。ありがとうございました。ご視聴ありがとうございました。チャンネル登録よろしくお願いします。」
        mock: なし
        expected: 「ありがとうございました。本日の議題は予算です。\n以上です。」が返る
      - name: test_strip_edge_phrases_when_middle
        case: 正常
        summary: 文頭・文末以外の同じ文言は消さない
        condition: 「ありがとうございました」（both）の 1 行と、文字「先日はありがとうございましたと伝えた。」
        mock: なし
        expected: 同じ文字が返る
      - name: test_strip_edge_phrases_when_wildcard_start
        case: 正常
        summary: 文頭の末尾の `*` は 1 行目の行末まで消す
        condition: 「字幕*」（start）の 1 行と、文字「字幕：山田\n本題です。」
        mock: なし
        expected: 「本題です。」が返る
      - name: test_strip_edge_phrases_when_wildcard_middle
        case: 正常
        summary: 途中の `*` は消す文字が最も短い一致を使う
        condition: 「ご*した」（end）の 1 行と、文字「ご飯を食べた。ご視聴に感謝した」
        mock: なし
        expected: 「ご飯を食べた。」が返る
      - name: test_strip_edge_phrases_when_repeated
        case: 正常
        summary: 同じ文言が端に続けて並ぶときは続く分も消す
        condition: 「ご視聴ありがとうございました」（end）の 1 行と、文字「以上です。ご視聴ありがとうございました。ご視聴ありがとうございました」
        mock: なし
        expected: 「以上です。」が返る
      - name: test_strip_edge_phrases_when_line_emptied
        case: 正常
        summary: 最後の行が空になったら前の行で続ける
        condition: 「ご視聴ありがとうございました」（end）・「ありがとうございました」（end）の 2 行と、文字「本題です。ありがとうございました。\nご視聴ありがとうございました。」
        mock: なし
        expected: 「本題です。」が返る
      - name: test_strip_edge_phrases_when_all_removed
        case: 正常
        summary: 全て消えたら空文字を返す
        condition: 「ご視聴ありがとうございました」（end）の 1 行と、文字「ご視聴ありがとうございました。」
        mock: なし
        expected: 空文字が返る
      - name: test_strip_edge_phrases_when_empty_list
        case: 正常
        summary: 一覧が空ならそのまま
        condition: 空の一覧と、文字「ご視聴ありがとうございました」
        mock: なし
        expected: 同じ文字が返る
    refs:
      - SC-9#scenarios[正常シナリオ（文頭・文末の決まった文言を消す）]
    status: implemented
  - name: resolve_glossary_presets
    title: 用語集のプリセットの一覧の解決
    container: features/correction/service.py
    usecase: 共通
    summary: 設定から用語集のプリセットの一覧を返す。`glossary_presets` が空なら、`active_glossary` の用語集だけを使う「既定」のプリセット 1 件にする。用語集の一覧に無い名前はプリセットから外す
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.yaml のあるフォルダ
    returns:
      type: list[GlossaryPresetSettings]
      description: 用語集のプリセットの一覧（1 件以上。glossaries は用語集の一覧にある名前だけ）
    process: |-
      1. resolve_glossaries で用語集の一覧を引き、名前の並びにする
      2. `glossary_presets` が空かを確かめる
         - 空の場合、`active_glossary` が名前の並びにあればその名前、無い（None・一覧に無い）なら 1 つ目の名前だけを glossaries に持つ、名前が DEFAULT_GLOSSARY_PRESET_NAME の 1 件を返す
      3. `glossary_presets` の並びのまま、各プリセットの glossaries から用語集の一覧に無い名前を外して返す（並びは変えない）
         - `[WARNING]` 用語集の一覧に無い名前をプリセットから外した（プリセットの名前・外した名前。外したものが無ければ出さない）
    unit_tests:
      - name: test_resolve_glossary_presets_when_empty
        case: 正常
        summary: プリセットのキーが無く active_glossary も無ければ、1 つ目の用語集だけの「既定」
        condition: 名前が「yogo」「会議用」の 2 件の glossaries と、glossary_presets が空・active_glossary = None の設定
        mock: なし
        expected: 名前が「既定」、glossaries が ["yogo"] の 1 件が返る
      - name: test_resolve_glossary_presets_when_legacy_active
        case: 正常
        summary: プリセットのキーが無ければ、active_glossary の用語集だけの「既定」
        condition: 「yogo」「会議用」の 2 件の glossaries と、active_glossary = 会議用
        mock: なし
        expected: 名前が「既定」、glossaries が ["会議用"] の 1 件が返る
      - name: test_resolve_glossary_presets_when_legacy_unknown_active
        case: 正常
        summary: active_glossary が一覧に無ければ、1 つ目の用語集だけの「既定」
        condition: 「yogo」「会議用」の 2 件の glossaries と、active_glossary = 無い名前
        mock: なし
        expected: glossaries が ["yogo"] の「既定」の 1 件が返る
      - name: test_resolve_glossary_presets
        case: 正常
        summary: プリセットの並びと、プリセットの中の用語集の並びをそのまま返し、一覧に無い名前を外す
        condition: 「yogo」「会議用」の 2 件の glossaries と、「既定」（["yogo"]）・「会議」（["会議用", "消した", "yogo"]）の 2 件の glossary_presets
        mock: なし
        expected: 「既定」（["yogo"]）・「会議」（["会議用", "yogo"]）の 2 件が返る
    refs:
      - CFG-1#settings[glossary_presets[].name]
      - CFG-1#settings[glossary_presets[].glossaries]
    status: planned
    introduced:
      pr: 173
  - name: pick_glossary_preset
    title: 補正に使う用語集のプリセットの選択
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    summary: 用語集のプリセットの一覧から、補正に使うプリセットを返す。指定した名前があればそれ、無ければ `active_glossary_preset`、それも無い・一覧に無いときは 1 件目
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: settings_dir
        type: Path
        required: true
        passing: positional
        description: settings.yaml のあるフォルダ
      - name: requested
        type: str | None
        required: false
        default: None
        passing: keyword
        description: API の開始で指定した用語集のプリセットの名前（セッションの glossary_preset）。None は設定で選んでいるプリセット
    returns:
      type: GlossaryPresetSettings
      description: 補正に使う用語集のプリセット
    process: |-
      1. resolve_glossary_presets で一覧を引く
      2. requested があるかを確かめる
         - 一覧に同じ名前がある場合、そのプリセットを返す
         - 一覧に同じ名前が無い場合（開始の後に設定でそのプリセットを消した）、3 へ進む
           - `[WARNING]` 指定された用語集のプリセットが無いため、設定で選んでいるプリセットで補正する（指定された名前）
      3. `active_glossary_preset` と同じ名前のプリセットを返す
         - None か、同じ名前が無い場合、1 件目を返す
    unit_tests:
      - name: test_pick_glossary_preset
        case: 正常
        summary: active_glossary_preset の名前のプリセットを返す
        condition: 「既定」「会議」の 2 件の glossary_presets と active_glossary_preset = 会議
        mock: なし
        expected: 「会議」のプリセットが返る
      - name: test_pick_glossary_preset_when_unset
        case: 正常
        summary: active_glossary_preset が無ければ 1 件目
        condition: 2 件の glossary_presets と active_glossary_preset = None
        mock: なし
        expected: 1 件目が返る
      - name: test_pick_glossary_preset_when_unknown_name
        case: 正常
        summary: 一覧に無い名前なら 1 件目
        condition: 2 件の glossary_presets と active_glossary_preset = 無い名前
        mock: なし
        expected: 1 件目が返る
      - name: test_pick_glossary_preset_when_requested
        case: 正常
        summary: 指定した名前があれば、設定で選んでいるプリセットより優先する
        condition: 「既定」「会議」の 2 件と active_glossary_preset = 既定、requested = 会議
        mock: なし
        expected: 「会議」のプリセットが返る
      - name: test_pick_glossary_preset_when_requested_missing
        case: 正常
        summary: 指定した名前が一覧に無ければ、設定で選んでいるプリセット
        condition: 「既定」「会議」の 2 件と active_glossary_preset = 会議、requested = 消したプリセット
        mock: なし
        expected: 「会議」のプリセットが返る
    refs:
      - CFG-1#settings[active_glossary_preset]
      - IF-10#request[glossary_preset]
    status: planned
    introduced:
      pr: 173
  - name: list_preset_glossaries
    title: 用語集のプリセットの用語集
    container: features/correction/service.py
    usecase: 録音を文字に起こす
    summary: 用語集のプリセットが使う用語集を、プリセットに並べた順で返す
    kind: 関数
    scope: public
    args:
      - name: preset
        type: GlossaryPresetSettings
        required: true
        passing: positional
        description: 補正に使う用語集のプリセット（pick_glossary_preset が返したもの）
      - name: glossaries
        type: Sequence[GlossarySettings]
        required: true
        passing: positional
        description: 用語集の一覧（resolve_glossaries が返したもの。path は絶対パス）
    returns:
      type: list[GlossarySettings]
      description: プリセットの glossaries の順の用語集。一覧に無い名前は飛ばす。glossaries が空なら空
    process: 1. preset.glossaries の順に、同じ名前の用語集を一覧から引いて並べる（一覧に無い名前は飛ばす）
    unit_tests:
      - name: test_list_preset_glossaries
        case: 正常
        summary: プリセットに並べた順で返す（用語集の一覧の順ではない）
        condition: 一覧が「yogo」「会議用」の順で、glossaries が ["会議用", "yogo"] のプリセット
        mock: なし
        expected: 「会議用」「yogo」の順の 2 件が返る
      - name: test_list_preset_glossaries_when_empty
        case: 正常
        summary: 使う用語集が無いプリセットは空
        condition: glossaries が [] のプリセット
        mock: なし
        expected: '[] が返る'
    status: planned
    introduced:
      pr: 173
