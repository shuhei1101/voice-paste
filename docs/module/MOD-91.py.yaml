id: MOD-91
visibility: internal
title: 常駐アプリ / 録音 / segmenter.py
test_files:
  - tests/unit/voice_paste/features/recording/test_segmenter.py
classes:
  - name: Segmenter
    title: 区切り
    container: features/recording/segmenter.py
    usecase: 録音する
    role: サービス
    kind: クラス
    summary: 届いた音を 512 サンプルの窓に組み直し、窓ごとの話し声の確率から区間を切り出して、通し番号の順に引き渡す。録音は止めない
    description: |-
      窓をまたいで区切りの状態（話し声の始まり・無音の候補・前の区切り）と、前の区切り以降の音を持ち続けるためクラスにする。
      区切ったら区切りより前の音を手放し、持つ音は区間の最大の長さ程度に収める（連続録音の長さで増えない）。
      区切りの決め方は PoC #80 の Segmenter と同じ（faster-whisper の get_speech_timestamps と同じ閾値の決め方）。
      区切りのスレッドからだけ呼ぶ（並行で呼ばない）。
    properties:
      - name: _detect_speech
        type: SpeechProbabilityFn
        access: 内部 (_)
        description: 1 窓の話し声の確率を返却する（StreamingVad）
      - name: _on_segment
        type: OnSegmentFn
        access: 内部 (_)
        description: 区切った区間の引き渡し先
      - name: _min_silence_samples
        type: int
        access: 内部 (_)
        description: 区切る無音の長さ（サンプル数。min_silence_sec × SAMPLE_RATE）
      - name: _audio
        type: numpy.ndarray
        access: 内部 (_)
        description: 前の区切り以降の音（int16）
      - name: _audio_start
        type: int
        access: 内部 (_)
        default: '0'
        description: _audio の先頭が録音の始めから何サンプル目か
      - name: _pending
        type: numpy.ndarray
        access: 内部 (_)
        description: 窓に満たない末尾の音（float32）
      - name: _position
        type: int
        access: 内部 (_)
        default: '0'
        description: 判定し終えたサンプル数
      - name: _triggered
        type: bool
        access: 内部 (_)
        default: 'False'
        description: 話し声の途中か
      - name: _speech_start
        type: int
        access: 内部 (_)
        default: '0'
        description: 今の区間の話し声の始まり
      - name: _temp_end
        type: int
        access: 内部 (_)
        default: '0'
        description: 続いている無音の始まり（無ければ 0）
      - name: _last_short_silence
        type: int
        access: 内部 (_)
        default: '0'
        description: 直近の短い無音の中ほど（最大の長さで区切るときの候補。無ければ 0）
      - name: _previous_cut
        type: int
        access: 内部 (_)
        default: '0'
        description: 前の区切りの位置
    methods:
      - name: feed
        title: 音を流す
        kind: メソッド
        scope: public
        summary: 届いた音（int16）を貯め、1 窓ずつ話し声の確率を求めて区切りの状態を進める
        args:
          - name: block
            type: numpy.ndarray
            required: true
            description: 入力から届いた音（形状 (フレーム数, 1) か (フレーム数,)・int16。長さは揃わない）
        returns:
          type: None
          description: なし
        process: |-
          1. block を 1 次元にして _audio に追加し、INT16_SCALE で割った float32 を _pending に追加する
          2. _pending が VAD_WINDOW 以上ある間、先頭の 1 窓を取り出して話し声の確率を求め、_step で状態を進めて _position を VAD_WINDOW 進める
          3. 1 窓進めるたびに _discard_idle_audio で話し声の無い間の音を手放す
        unit_tests:
          - name: test_feed_cuts_at_silence
            case: 正常
            summary: 話し声の後の無音が区切る長さに達したら区切る
            condition: 確率を 0.5 秒分 0.0、1 秒分 0.9、続いて 2.5 秒分 0.0 にする（話し声の前の余白を取れるように先頭に無音を配置する）。min_silence_sec=2.0。16 kHz の音を 1024 フレームずつ渡す
            mock: detect_speech・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、その長さが「話し声の前の余白 SEGMENT_PAD_SEC + 1 秒 + 話し声の後の余白 SEGMENT_PAD_SEC」に 1 窓の誤差で合う
          - name: test_feed_keeps_short_pause
            case: 正常
            summary: 区切る長さに届かない無音では区切らない
            condition: 確率を 0.9 を 1 秒、0.0 を 1 秒、0.9 を 1 秒にする。min_silence_sec=2.0
            mock: detect_speech・on_segment
            expected: on_segment が呼ばれない
          - name: test_feed_cuts_at_max_length
            case: 正常
            summary: 無音が来ないまま最大の長さに達したら、直近の短い無音の中で区切る
            condition: 確率を 0.9 にし、12 秒の位置だけ 0.2 を 0.2 秒挟んで MAX_SEGMENT_SEC を超えて流す
            mock: detect_speech・on_segment
            expected: on_segment に reason=max_length の区間が渡り、その終わりが 12 秒の無音の中にあり、長さが MAX_SEGMENT_SEC 以下
          - name: test_feed_cuts_at_max_length_without_pause
            case: 正常
            summary: 短い無音も無ければ最大の長さの位置で区切る
            condition: 確率を常に 0.9 にして MAX_SEGMENT_SEC + 1 秒流す
            mock: detect_speech・on_segment
            expected: on_segment に reason=max_length の区間が 1 つ渡り、長さが MAX_SEGMENT_SEC 以下
          - name: test_feed_ignores_silence_only
            case: 正常
            summary: 話し声を含まない間は区間にしない
            condition: 確率を常に 0.0 にして 10 秒流す
            mock: detect_speech・on_segment
            expected: on_segment が呼ばれない
          - name: test_feed_does_not_drop_samples
            case: 正常
            summary: 区間をつなぐと話し声が落ちていない
            condition: 話し声と区切る無音を 3 回繰り返し、音には位置が分かる連番の値を入れる。最後に flush
            mock: detect_speech・on_segment
            expected: 区間が 3 つ渡り、話し声の窓の値が全ていずれかの区間に含まれ、区間どうしが重ならない
          - name: test_feed_trims_audio_when_silence_only
            case: 正常
            summary: 話し声を含まない間は、貯める音を余白 + 窓 1〜2 つ分に収める
            condition: 確率を常に 0.0 にして 60 秒流す。min_silence_sec=2.0
            mock: detect_speech・on_segment
            expected: _audio の長さが SEGMENT_PAD_SEC + 窓 2 つ分以下で、on_segment が呼ばれない
          - name: test_feed_trims_audio_when_silent_after_cut
            case: 正常
            summary: 無音で区切った後に無音が続いても、貯める音を余白 + 窓 1〜2 つ分に収める
            condition: 確率を 1 秒分 0.9、続いて 59 秒分 0.0 にする。min_silence_sec=2.0
            mock: detect_speech・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、流し終えた後の _audio の長さが SEGMENT_PAD_SEC + 窓 2 つ分以下
          - name: test_feed_keeps_head_pad_after_trim
            case: 正常
            summary: 無音を長く流して音を手放した後の話し声でも、話し声の前の余白まで区間に含める
            condition: 確率を 30 秒分 0.0、1 秒分 0.9、続いて 2.5 秒分 0.0 にする。min_silence_sec=2.0。音には位置が分かる連番の値を入れる
            mock: detect_speech・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、長さが「SEGMENT_PAD_SEC + 1 秒 + SEGMENT_PAD_SEC」に 1 窓の誤差で合い、話し声の窓の値が全て区間に含まれる
      - name: flush
        title: 残りを区切る
        kind: メソッド
        scope: public
        summary: 話し声の途中なら、そこまでを最後の区間として引き渡す（話し終えて無音が区切る長さに届く前の完了を含む）
        returns:
          type: None
          description: なし
        process: |-
          1. 窓に満たない末尾の音も判定せずに区間に含める
          2. 話し声の途中なら、前の区切りから末尾までを reason=flush の区間として引き渡す
             - 話し声の途中でなければ何も引き渡さない
        unit_tests:
          - name: test_flush_when_speaking
            case: 正常
            summary: 話し声の途中なら最後の区間を引き渡す
            condition: 確率 0.9 を 1 秒と、窓に満たない 100 サンプルを流して flush
            mock: detect_speech・on_segment
            expected: on_segment に reason=flush の区間が 1 つ渡り、末尾の 100 サンプルを含む
          - name: test_flush_when_silent_after_speech
            case: 正常
            summary: 話し終えて区切る長さに届く前の無音で止めても、その文を区間にする
            condition: 確率 0.9 を 1 秒、0.0 を 1 秒流して flush（min_silence_sec=2.0）
            mock: detect_speech・on_segment
            expected: on_segment に reason=flush の区間が 1 つ渡る
          - name: test_flush_when_idle
            case: 正常
            summary: 話し声が残っていなければ何も引き渡さない
            condition: 区切った直後に flush
            mock: detect_speech・on_segment
            expected: flush では on_segment が呼ばれない
      - name: _discard_idle_audio
        title: 話し声の無い間の音を手放す
        kind: メソッド
        scope: internal
        summary: 話し声の途中でない間、判定し終えた位置 − SEGMENT_PAD_SEC より前の音を手放す
        returns:
          type: None
          description: なし
        process: |-
          1. 話し声の途中なら何もしない（区間の始まりから貯め続ける）
          2. _position − SEGMENT_PAD_SEC より前の音を _audio から捨て、_audio_start をその位置へ進める（次の区間の始まりは「話し声の始まり − SEGMENT_PAD_SEC」なので、それより前の音は要らない）
      - name: _step
        title: 状態を進める
        kind: メソッド
        scope: internal
        summary: 1 窓の確率で区切りの状態を進め、区切りが決まれば _emit する
        args:
          - name: probability
            type: float
            required: true
            description: 窓の話し声の確率
        returns:
          type: None
          description: なし
        process: |-
          1. 確率が SPEECH_THRESHOLD 以上なら、続いている無音の候補を取り消す。話し声の途中でなければ、ここを話し声の始まりにして終える
          2. 話し声の途中でなければ何もしない
          3. 話し声の始まりから MAX_SEGMENT_SEC に達したら、直近の短い無音の中ほど（無ければ今の位置）で reason=max_length で区切り、そこを次の話し声の始まりにして終える
          4. 確率が NEG_THRESHOLD 未満なら無音の候補として続いた長さを数える
             - SHORT_SILENCE_SEC 以上続いたら、その無音の中ほどを短い無音として控える
             - 区切る無音の長さ以上続いたら、無音の始まり + SEGMENT_PAD_SEC で reason=silence で区切り、話し声の途中でなくする
      - name: _emit
        title: 区間を渡す
        kind: メソッド
        scope: internal
        summary: 前の区切り（か話し声の始まり − SEGMENT_PAD_SEC の遅い方）から区切りまでの音を Segment にして on_segment へ引き渡し、区切りより前の音を手放す
        args:
          - name: cut
            type: int
            required: true
            description: 区切る位置（録音の始めからのサンプル数）
          - name: reason
            type: Literal["silence", "max_length", "flush"]
            required: true
            description: 区切った理由
        returns:
          type: None
          description: なし
        process: |-
          1. 区間の始まりを「前の区切り」と「話し声の始まり − SEGMENT_PAD_SEC」の遅い方にし、_audio から始まりから cut までを切り出して Recording（16 kHz）にする
          2. Segment（recording・reason）を on_segment へ引き渡す
          3. cut を前の区切りにし、_audio から cut より前を捨てる
             - `[INFO]` 区間を区切った（理由・長さ）
    refs:
      - NFR-1#requirements[区間の最大の長さ]
      - LIB-11#
    status: planned
    introduced:
      pr: 78
constants:
  - name: VAD_WINDOW
    title: 判定の窓のサンプル数
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声の判定に 1 回で引き渡すサンプル数（16 kHz で 32 ms。Silero VAD が受ける窓の大きさ）
    value: '512'
    status: planned
    introduced:
      pr: 78
  - name: SPEECH_THRESHOLD
    title: 話し声の閾値
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声と判定する確率（faster-whisper の VadOptions の既定と同じ）
    value: '0.5'
    status: planned
    introduced:
      pr: 78
  - name: NEG_THRESHOLD
    title: 無音の閾値
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 話し声の終わり（無音の候補）と判定する確率（SPEECH_THRESHOLD − 0.15。faster-whisper の既定の決め方と同じ）
    value: '0.35'
    status: planned
    introduced:
      pr: 78
  - name: SHORT_SILENCE_SEC
    title: 短い無音の長さ
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 最大の長さで区切るときに区切りの候補にする無音の長さ（秒。faster-whisper の get_speech_timestamps の最大の長さの区切りと同じ）
    value: '0.098'
    status: planned
    introduced:
      pr: 78
  - name: SEGMENT_PAD_SEC
    title: 区間の余白
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: '話し声の前後に残す余白（秒。言葉の頭と尾を切らないため。PoC #80 と同じ）'
    value: '0.3'
    status: planned
    introduced:
      pr: 78
  - name: MAX_SEGMENT_SEC
    title: 区間の最大の長さ
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 無音が来ないままこの長さ（秒）に達したら区切る。非機能要件の区間の最大の長さの決定値
    value: '20.0'
    refs:
      - NFR-1#requirements[区間の最大の長さ]
    status: planned
    introduced:
      pr: 78
  - name: INT16_SCALE
    title: int16 を float にする除数
    container: features/recording/segmenter.py
    usecase: 録音する
    summary: 入力の int16 の音を話し声の判定が受ける -1.0〜1.0 の float32 にする除数
    value: '32768.0'
    status: planned
    introduced:
      pr: 78
