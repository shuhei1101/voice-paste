title: "httpx"
kind: "ライブラリ"
version:
  current: 0.28.1
  latest: 0.28.1
  checked_on: '2026-10-01'
  source: '動作確認に使った版（openai の依存としても入る。pyproject.toml へは #16 で書く）'
  pinning: 未定（#16 で pyproject.toml に書くときに決める）
catalogs:
  - name: API
    version: 0.28.1
    entries:
      - name: Client.post
        kind: メソッド
        purpose: 返送先のエンドポイントへ結果を JSON で送る
      - name: Timeout
        kind: クラス
        purpose: 返送のタイムアウトを渡す
      - name: follow_redirects=False
        kind: 引数
        purpose: 許可していないホストへリダイレクトで流れるのを防ぐ（既定も追わない）
      - name: HTTPError
        kind: 例外
        purpose: 届かなかったときに再送するかを判断する
lead: 同期と非同期の両方を持つ Python の HTTP クライアント。
purl: pkg:pypi/httpx
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/features/outputs/callback/service.py
upstream: encode/httpx
verification:
  state: 済
  date: '2026-10-01'
  detail: WSL（Linux・Python 3.12）で、127.0.0.1 の受け口へ結果の JSON（session_id・result・text）を POST して 200 と受け取りを確かめた。Windows の実機では未確認
