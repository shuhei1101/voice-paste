    usecase: 録音する
    scope: internal
    summary: pycaw の AudioUtilities.GetSpeakers() の EndpointVolume を返す。pycaw の API に触れるのはこの関数と音量の読み書きの 2 つのメソッドだけにする（版を上げたときに直す場所）
    returns:
