id: MOD-41
visibility: internal
title: 常駐アプリ / ホットキーと画面 / settings_edge_phrases.py
test_files:
  - tests/unit/voice_paste/ui/windows/test_settings_edge_phrases.py
classes:
  - name: EdgePhrasePanel
    title: 文頭・文末から削除する文言の一覧
    container: ui/windows/settings_edge_phrases.py
    usecase: 設定を変える
    role: 画面の部品
    summary: 設定画面の「ハルシネーション」のまとまりに配置する、説明・文言の一覧・空の文・「行を追加」・凡例。行の追加・削除・並べ替えを受ける
    description: |-
      要素（説明・一覧・つまみ・文言・位置・削除・空の文・追加・凡例）と読み上げの名前は画面設計「設定画面」が持つ。
      一覧は、用語集・表記のヒントの部品と同じく行ごとの部品（つまみ・文言の欄・位置の選択・削除ボタンと欄の下のエラーの文）を縦に並べる。行の入れ替えは、つまみ（自前の部品。離した縦の位置より上に中心がある他の行の数を移し先にする）と、文言の欄の Alt+↑ / Alt+↓（move_phrase）で行う。部品の幅が NARROW_WIDTH_PX より狭いときは、1 行を上下 2 行（上に文言の欄、下に位置と削除ボタン）に組む。行の部品の objectName の末尾の `{n}` は一覧の並びの 0 からの番号で、行を動かすたびに付け直す。動かしたら動かした行の文言の欄へフォーカスを移し、「{何行目か} 行目へ動かしました」を `QAccessible.updateAccessibility(QAccessibleAnnouncementEvent(...))` で読み上げに伝える。
      位置の選択は「文頭」「文末」「両方」を出し、値を start / end / both にする。
      追加・削除・並べ替えはこの部品の中だけを変え、settings.yaml へは設定画面の保存で書き込む。
      変えた欄の数えのため、行ごとに、開いたとき・保存したときの行を追う番号を持つ（HintPresetPanel と同じ番号の振り方）。単体テストは tests/unit/voice_paste/ui/windows/test_settings_edge_phrases.py に配置する。
    inherits: PySide6.QtWidgets.QWidget
    properties:
      - name: changed
        type: Signal()
        description: 追加・削除・並べ替え・欄の入力で値が変わった（設定画面が変えた欄の数えに使用する）
    methods:
      - name: set_phrases
        title: 一覧に入れる
        summary: 引き渡した行で一覧を作り直す。空なら空の文を出す
        kind: メソッド
        scope: public
        args:
          - name: phrases
            type: Sequence[EdgePhraseSettings]
            required: true
            passing: positional
            description: 設定の edge_phrases
        returns:
          type: None
          description: なし
      - name: collect
        title: 一覧の値の収集
        summary: 今の並びの行を 設定と同じ構造の dict（text・position）の並びにする。空の文言の行もそのまま入れる（設定のモデルが除くため、失敗の場所の番号が一覧の行とそろう）
        kind: メソッド
        scope: public
        returns:
          type: list[dict[str, str]]
          description: edge_phrases の並び
        unit_tests:
          - name: test_edge_phrase_panel_collect
            case: 正常
            summary: 入れた行をそのまま集める
            condition: 「チャンネル登録*」（end）と「えーと」（start）を set_phrases する
            mock: なし（offscreen）
            expected: 'collect が [{"text": "チャンネル登録*", "position": "end"}, {"text": "えーと", "position": "start"}] を返却し、位置の選択の表示が「文末」「文頭」'
      - name: add_phrase
        title: 行を追加
        summary: 末尾に文言が空で位置が end の行を追加し、文言の欄へフォーカスを移して changed を emit する。「行を追加」が呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_edge_phrase_panel_add_phrase
            case: 正常
            summary: 追加した行は文末で始まる
            condition: 空の一覧で add_phrase を呼ぶ
            mock: なし（offscreen）
            expected: 'collect が [{"text": "", "position": "end"}] を返却し、changed が 1 回 emit され、空の文が消える'
      - name: move_phrase
        title: 行を動かす
        summary: 行を 1 つ上へか下へ動かし、動かした行の文言の欄へフォーカスを移して読み上げに伝え、changed を emit する。先頭を上へ・末尾を下へは何もしない。文言の欄の Alt+↑ / Alt+↓ が呼ぶ
        kind: メソッド
        scope: public
        args:
          - name: position
            type: int
            required: true
            passing: positional
            description: 動かす行（0 から）
          - name: delta
            type: Literal[-1, 1]
            required: true
            passing: positional
            description: -1 は上へ、1 は下へ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_edge_phrase_panel_move_phrase
            case: 正常
            summary: Alt+↑ で行を上へ動かし、フォーカスを動かした行に残す
            condition: A・B の 2 行で、B の文言の欄に Alt+↑ を送信する
            mock: QAccessible.updateAccessibility（引き渡したイベントを記録する）
            expected: collect の文言が B・A の順。フォーカスが 1 行目の文言の欄にあり、読み上げの文が「1 行目へ動かしました」
          - name: test_edge_phrase_panel_move_phrase_when_edge
            case: 正常
            summary: 先頭を上へ・末尾を下へは何もしない
            condition: A・B の 2 行で、move_phrase(0, -1) と move_phrase(1, 1) を呼ぶ
            mock: なし（offscreen）
            expected: collect の文言が A・B のままで、changed が emit されない
      - name: focus_field
        title: 欄へフォーカスを移す
        summary: 失敗の場所で行の文言の欄を探し、フォーカスを移す（エラーの一覧の行を押したとき）
        kind: メソッド
        scope: public
        args:
          - name: location
            type: tuple[int | str, ...]
            required: true
            passing: positional
            description: edge_phrases より後ろの失敗の場所（例 (1, "text")）
        returns:
          type: None
          description: なし
      - name: change_values
        title: 変えた件数を数える値
        summary: 変えた欄の数えに使用する値を、行 1 つ = 1 キーと、並べ替えの 1 キーで返却する
        kind: メソッド
        scope: public
        returns:
          type: dict[str, object]
          description: '`edge_phrases[{番号}]` → （文言, 位置）、`edge_phrases.order` → 開いたとき・保存したときからあって今も残っている行が、番号の小さい順に並んでいるか'
        unit_tests:
          - name: test_edge_phrase_panel_change_values_when_moved
            case: 正常
            summary: 並べ替えると行の値は変わらず、並びの値だけが変わる
            condition: A・B・C の 3 行を set_phrases し、move_phrase(0, 1) を呼ぶ
            mock: なし（offscreen）
            expected: edge_phrases[0]・[1]・[2] が並べ替える前と同じ値で、edge_phrases.order が False
      - name: mark_saved
        title: 保存した行を基準にする
        summary: 今の並びの順に行の番号を 0 から振り直す。SettingsWindow.save が書き込めた後に呼ぶ
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
    refs:
      - SCR-9#elements[文言の一覧]
    status: implemented
