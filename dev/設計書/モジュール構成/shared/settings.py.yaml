      - name: pause
        type: str
        default: <ctrl>+<alt>+z（Linux は <cmd>+<alt>+z。os_overrides）
        description: 録音を一時停止・再開する
      - name: cancel
        type: str
        default: <ctrl>+<alt>+q（Linux は <cmd>+<alt>+q。os_overrides）
        description: 録音を取り消す
    status: implemented
  - name: KeyboardSettings
    title: キーボードの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 貼り付け先へ送信する貼り付けのキー
    inherits: pydantic.BaseModel
    properties:
      - name: paste_key
        type: str
        default: <ctrl>+v
        description: 貼り付けのキーの組み合わせ（pynput の書式）
    status: implemented
  - name: HistorySettings
    title: 履歴の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 履歴を残すかと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: enabled
        type: bool
        default: 'True'
        description: 録音と起こした文字を履歴に残すか
      - name: retention_days
        type: int
        default: '1'
        description: 保持する日数（1 以上）
    status: implemented
  - name: LoggingSettings
    title: ログの設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ログのレベルと保持期間
    inherits: pydantic.BaseModel
    properties:
      - name: level
        type: Literal["DEBUG", "INFO", "WARNING", "ERROR"]
        default: INFO
        description: ログのレベル
      - name: retention_days
        type: int
        default: '7'
        description: 日付ごとのログを保持する日数（1 以上）
    status: implemented
  - name: UiSettings
    title: 画面の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: 画面の明暗と、録音の画面と文字起こし中の表示の出し方
    inherits: pydantic.BaseModel
    properties:
      - name: theme
        type: Literal["system", "light", "dark"]
        default: system
        description: 画面の明暗。`system` は OS の明暗に従う。反映は immediate。設定画面は `json_schema_extra` の choice_labels（system → Windows の設定に従う・light → ライト・dark → ダーク）でラジオボタンの名前を出す
      - name: topmost
        type: bool
        default: 'True'
        description: 常に最前面に出すか
      - name: position
        type: Literal["center", "top-left", "top-right", "bottom-left", "bottom-right"]
        default: center
        description: 出す位置
      - name: follow_cursor
        type: bool
        default: 'True'
        description: マウスカーソルのあるモニターに出すか
      - name: wave_gain
        type: float
        default: '4'
        description: 波形の振れの大きさ（0 より大きい）
      - name: show_hotkeys
        type: bool
        default: 'True'
        description: 録音の画面のボタンにホットキーを表示するか。反映は immediate。description の最初の文を設定の設計書の `title` にそろえる（設定画面の欄の名前になる）
      - name: transcribing_show_hotkeys
        type: bool
        default: 'True'
        description: 文字起こし中の表示のボタンにホットキーを表示するか。反映は immediate。description の最初の文を設定の設計書の `title` にそろえる（設定画面の欄の名前になる）。前のバージョンの settings.toml を移すときだけ、項目が無ければ inherit_transcribing_show_hotkeys が show_hotkeys の値を入れる
    status: implemented
    methods:
      - name: _inherit_transcribing_show_hotkeys
        title: 文字起こし中の表示のホットキーの引き継ぎ
        container: shared/settings.py
        usecase: 設定を変える
        summary: transcribing_show_hotkeys を持たない画面の設定へ、show_hotkeys の値を入れる。既定値を重ねた後の検証では transcribing_show_hotkeys が必ずあって働かないため、移すときの settings.toml の dict に当てる inherit_transcribing_show_hotkeys へ移す
        kind: メソッド
        scope: internal
        returns:
          type: Any
          description: transcribing_show_hotkeys を入れたコピー
        status: removed
        introduced:
          pr: 131
  - name: ApiSettings
    title: API の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: API の待ち受けのポートと、返送を許すホスト
    inherits: pydantic.BaseModel
    properties:
      - name: port
        type: int
        default: '47823'
        description: 127.0.0.1 で待ち受けるポート（1024〜65535）
      - name: allowed_callback_hosts
        type: list[str]
        default: '[]'
        description: loopback のほかに返送を許すホスト
      - name: continuous
        type: ContinuousSettings
        default: ContinuousSettings()
        description: 連続録音の区切りと上限時間
      - name: allowed_web_origins
        type: list[str]
        default: '[]'
        description: '外の端末に許す Origin。`/web/` の下に許すオリジン（設定 api.allowed_web_origins。`scheme://host[:port]` の形式だけを通し、末尾の `/` とパスは SettingsError）。pydantic の Field の description の最初の 1 文を「外の端末に許す Origin」にし、設定画面の欄の名前にする'
    status: implemented
    methods:
      - name: _origins_must_be_origin_form
        title: 許す Origin の形式の確かめ
        summary: 許す Origin の全ての行が `scheme://host[:port]` の形式（ORIGIN_PATTERN に全体が一致する）であることを確かめる（`field_validator("allowed_web_origins")` のクラスメソッド）
        description: 一致しない行があれば `PydanticCustomError` を投げる。type は WEB_ORIGIN_FORM_ERROR_TYPE、文は「`scheme://host[:port]` の形式で、末尾の `/` とパスを付けない（{origins}）」、ctx は `origins`（一致しない行を `, ` でつないだ文字列。文に埋める）と `invalid`（一致しない行の tuple。入れた順）。失敗の場所は ("api", "allowed_web_origins")。
        kind: メソッド
        scope: internal
        args:
          - name: origins
            type: list[str]
            required: true
            passing: positional
            description: 許す Origin の一覧
        returns:
          type: list[str]
          description: そのままの一覧
        unit_tests:
          - name: test_api_settings_when_web_origin_form
            case: 正常
            summary: 形式の合う Origin を通す
            condition: allowed_web_origins が ["https://voice.example.com", "http://localhost:47823"]
            mock: なし
            expected: allowed_web_origins がそのまま
          - name: test_api_settings_when_web_origin_not_form
            case: 異常
            summary: 形式の違う Origin を断る
            condition: Settings の api.allowed_web_origins が ["https://voice.example.com/", "https://ok.example.com", "voice.example.com"]
            mock: なし
            expected: ValidationError。失敗の type が WEB_ORIGIN_FORM_ERROR_TYPE、場所が ("api", "allowed_web_origins")、ctx の invalid が ("https://voice.example.com/", "voice.example.com")
  - name: BrowserPreset
    title: ブラウザ添付のプリセット
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: ブラウザ添付の種類のプリセット 1 件
    inherits: pydantic.BaseModel
    description: '`model_config = ConfigDict(extra="forbid", frozen=True)`（セッションがコピーとして持つため変えられないようにする）。'
    properties:
      - name: kind
        type: Literal["browser"]
        default: browser
        description: プリセットの種類（Preset の判別子）
      - name: title
        type: str
        description: 録音の画面のボタンに出す名前（1 文字以上）
      - name: url
        type: str
        description: Microsoft Edge の `--app` で開く URL（`^https?://`）
      - name: hotkey
        type: str
        default: '""'
        description: このプリセットで確定するホットキー。空なら登録しない
      - name: enabled
        type: bool
        default: 'True'
        description: 録音の画面にボタンを出し、ホットキーを登録するか
      - name: send_enter
        type: bool
        default: 'True'
        description: 貼り付けた後に Enter まで送信するか
    refs:
      - CFG-1#settings[presets[].kind]
    status: implemented
  - name: EndpointPreset
    title: エンドポイントへ送信のプリセット
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: エンドポイントへ送信の種類のプリセット 1 件
    inherits: pydantic.BaseModel
    description: '`model_config = ConfigDict(extra="forbid", frozen=True)`。authorization は `Field(repr=False)` にして、設定やセッションを repr でログに出しても値が出ないようにする（SecretStr は model_dump(mode="json") で伏せ字になり settings.toml へ書き戻せないため使わない）。'
    properties:
      - name: kind
        type: Literal["endpoint"]
        default: endpoint
        description: プリセットの種類（Preset の判別子）
      - name: title
        type: str
        description: 録音の画面のボタンに出す名前（1 文字以上）
      - name: url
        type: str
        description: 起こした文字を POST する送信先（`^https?://`）
      - name: hotkey
        type: str
        default: '""'
        description: このプリセットで確定するホットキー。空なら登録しない
      - name: enabled
        type: bool
        default: 'True'
        description: 録音の画面にボタンを出し、ホットキーを登録するか
      - name: authorization
        type: str
        default: '""'
        description: 空でなければ `Authorization` ヘッダーにそのまま入れる値（秘密。repr に出さない）
    refs:
      - CFG-1#settings[presets[].authorization]
    status: implemented
  - name: PresetOptions
    title: プリセットの種類のオプション
    container: shared/settings.py
