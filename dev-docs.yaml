# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v0.0.0/schemas/dev-docs.schema.json
version: "3"
name: voice-input
worktrees: [".claude/worktrees/*"]
description: 録音・区切り・文字起こし・用語の補正をほかのシステムへ提供する音声入力のサービスの設計書と目次
github:
  repository: shuhei1101/voice-input
documents:
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: screen
    title: 画面設計
    paths: ["docs/screen/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/screen.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: er
    title: ER 図
    paths: ["docs/er/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/er.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: api
    title: 外部API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/dev-command.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: layout
    title: フォルダ構成
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema:
      source: knowledge
      path: schemas/design/layout.schema.yaml
      ref: design-schemas/v8.2.0
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: glossary
    title: 用語集
    paths: ["docs/glossary/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/glossary.schema.yaml
    records: terms
    alias_type: term
  - id: index
    title: 目次
    paths: ["docs/index.yaml", "docs/*/index.yaml"]
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: files_root
    title: docs の直下の Markdown
    paths: ["docs/_root/files.yml"]
    exclude: ["*.yaml", "*.yml", README.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", "*.yml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: files_mock
    title: モックの Markdown
    paths: ["docs/mock/files.yml"]
    exclude: ["*.html", "*.js", "*.css"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: files_src
    title: 常駐アプリのコード
    paths: ["src/files.yml"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: files_haas_server
    title: Haas の文字起こしのサーバーのコード
    paths: ["haas_server/files.yml"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: files_tests
    title: テスト
    paths: ["tests/files.yml"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
