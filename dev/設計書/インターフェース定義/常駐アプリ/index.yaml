summary: "常駐アプリの API と、呼び出し元への返送"
docs_index: true
items:
  - page: 録音を開始する.py.yaml
    summary: POST /sessions。画面を出さない録音（連続録音を含む）を始めてセッションの ID を返す
  - page: 録音を停止する.py.yaml
    summary: POST /sessions/{session_id}/stop。録音を止めて完了を待つ
  - page: 録音を完了する.py.yaml
    summary: POST /sessions/{session_id}/complete。録音を確定して文字起こしを始める
  - page: 呼び出し元へ返す.py.yaml
    summary: API から始めた録音の結果（連続録音は区間ごとと終わり）を、開始で指定された返送先へ送る
  - page: 上限で打ち切る.py.yaml
    summary: 完了が来ないままセッションの上限時間に達した API の録音を打ち切り、履歴に残して返送先へ知らせる
  - page: 設定のエンドポイントへ送る.py.yaml
    summary: 起こした文字を、設定の送り先のエンドポイントへ JSON で 1 回送る
  - page: 画面を配信する.py.yaml
    summary: GET /web/。外の端末のブラウザで開く文字起こしの画面と素材を返す
  - page: 音声を受け付ける.py.yaml
    summary: POST /web/transcriptions。ブラウザから送られた音声を積んでジョブの ID を返す
  - page: 文字起こしの結果を返す.py.yaml
    summary: GET /web/transcriptions/{job_id}。ジョブの状態・進み具合と、起こした文字か失敗の理由を返す
  - page: ブラウザの音声を文字に起こす.py.yaml
    summary: 受け付けたブラウザの音声を 1 件ずつ起こして補正し、履歴とジョブに残す
  - page: 用語集のプリセットの一覧を返す.py.yaml
    summary: GET /web/glossary-presets。外の端末の画面が選ぶ用語集のプリセットの名前の一覧と、設定で選んでいるプリセットを返す
