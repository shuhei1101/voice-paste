  - page: MOD-1.yaml
    summary: FastAPI の app を組み立て、127.0.0.1 での待ち受け・Host・Origin・トークンの守りと、例外の HTTP への変換を持つ。uvicorn を専用のスレッドで動かす。
  - page: MOD-3.yaml
    summary: 録音から出力までの 1 回分の流れ（録音セッション）の状態と、入口をまたいで同時に 1 つだけ動かす排他を持つ。録音・文字起こし・補正・出力先・履歴は関数型越しに受け取り、API の route もここに配置する。API の連続録音では、区切った区間を区切った順に起こして返却し、最後に終わりを返却する。
  - page: MOD-4.yaml
    summary: 外の端末のブラウザから受けた音声のジョブを積み、1 件ずつ起こして補正し、状態と結果を返却する feature（`features/web_transcription/`）。
  - page: MOD-5.yaml
    summary: 'グローバルのホットキーの受付（runtime/hotkey）と、PySide6 の画面とトレイ（ui）の入口としての境界。画面の構成・見た目・部品は [#21 画面・トレイ・ホットキーを新しい構成で作り直す](https://github.com/shuhei1101/voice-paste/issues/21) のデザインの工程で起こす。'
  - page: MOD-6.yaml
    summary: どの層からも使用する設定のモデル・ログ・例外・配置先のパスと、feature の間を渡る型を持つ。ほかの層に依存しない。
  - page: MOD-7.yaml
    summary: 起こした文字の届け方を出力先ごと・カスタムプリセットの種類ごとのサブフォルダに分け、一覧への登録で追加できる構造にする。出力先どうしは import しない。
  - page: MOD-8.yaml
    summary: 文字起こしワーカーの子プロセス・OpenAI API の文字起こし・システム音量・キーボードとクリップボード・ブラウザ添付の画面を開くブラウザ・HTTP の POST・話し声の判定（Silero VAD）を包むアダプタ。feature の関数型を満たし、外の例外をアプリの例外に変える。
  - page: MOD-10.yaml
    summary: 設定で選んだエンジンで録音を文字に起こす。エンジンは関数型で受け取り、エンジンごとの設定を引き渡す。
  - page: MOD-12.yaml
    summary: 常駐サービスの入口。単一インスタンスを確かめ、各 feature と外部連携を関数で配線し（composition root）、API・ホットキー・トレイを立てて画面のイベントループを回す。
  - page: MOD-13.yaml
    summary: マイクで録音し、録音中はシステム音量を下げて戻す。入口を問わず同じ録音を使用し、画面には触れない。連続録音では録音を止めずに無音で区切り、区間を区切った順に引き渡す。
  - page: MOD-14.yaml
    summary: 常駐サービスの子プロセスとして faster-whisper のモデルを持ち、標準入出力の JSON Lines で受けた録音を文字に起こす。CUDA のクラッシュから常駐サービスを守るためにプロセスを分ける。
  - page: MOD-98.yaml
    summary: WSL の中で Haas-ja-v1.0 のモデルを持ち、常駐アプリから HTTP で受けた音声を文字に起こす。依存が重く Linux でしか動かないため、voice_paste のパッケージとは別の Python の環境で動かす。
