id: MOD-4
visibility: internal
title: "常駐アプリ / ブラウザの文字起こし"
lead: 外の端末のブラウザから受けた音声のジョブを積み、1 件ずつ起こして補正し、状態と結果を返却する feature（`features/web_transcription/`）。
directory: |-
  ```
  src/voice_paste/features/web_transcription/
  ├── __init__.py   # WebJobQueue・accept_audio・router の公開
  ├── types.py      # ジョブの状態・ジョブ・用語集のプリセットの選択肢・ほかの feature を受け取る関数型・API の依存
  ├── service.py    # WebJobQueue（ジョブの一覧とワーカースレッド）・accept_audio（受け付け）
  ├── schemas.py    # API のレスポンス
  └── route.py      # POST /web/transcriptions・GET /web/transcriptions/{job_id}・GET /web/glossary-presets
  ```
diagrams:
  - name: 全体
    diagram: |-
      <!-- map: {"title": "全体"} -->

      ```mermaid
      flowchart LR
        n1["ブラウザの文字起こしのroute"]
        n2["用語集のプリセットの一覧のroute"]
        n3["音声の受け付け"]
        n4["ブラウザの音声のキュー"]
        n5["ジョブ"]
        n6["ブラウザの文字起こしの依存"]
        n7["ブラウザの API の依存"]
        n1 -->|受け付け| n3
        n1 -->|引く| n4
        n2 -->|一覧を引く| n7
        n3 -->|プリセットを確認する| n7
        n3 -->|積む| n4
        n4 -->|持つ（0..*）| n5
        n4 -->|呼ぶ| n6
      ```

