function_types:
  - name: ProgressFn
    title: 文字起こしの進みの知らせ先
    container: shared/types.py
    usecase: 共通
    summary: 文字起こしの区間の終わりの時刻と録音の長さ（秒）を受け取る。features/transcription と integrations/whisper が使う（integrations は features を import できないため shared に置く）
    args:
      - name: end
        type: float
        description: 区間の終わりの時刻（秒）
      - name: duration
        type: float
        description: 録音の長さ（秒）
    returns:
      type: None
      description: なし
    status: implemented
  - name: OnSegmentFn
    title: 区間の受け取り先
    container: shared/types.py
    usecase: 録音する
    summary: 区切った区間を区切った順に受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、セッションが渡す（feature の間を渡るため shared に置く）
    args:
      - name: segment
        type: Segment
        description: 区切った区間
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: OnContinuousFailedFn
    title: 連続録音の失敗の知らせ先
    container: shared/types.py
    usecase: 録音する
    summary: 区切りに失敗して連続録音を止めたことを、理由を添えて受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、セッションが渡す
    args:
      - name: reason
        type: str
        description: 失敗の理由
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: SendEnterFn
    title: Enter の送信方法
    container: shared/types.py
    usecase: 起こした文字を届ける
    summary: 渡した修飾キーを押したまま Enter を送信する（`Protocol`。修飾キーを省いて呼べるため、`Callable[[], None]` を受ける側にも渡せる）。integrations/keyboard が満たし、出力先が受ける
    args:
      - name: modifiers
        type: Sequence[EnterModifier]
        description: 一緒に押す修飾キー。既定は空（Enter だけ）
    returns:
      type: None
      description: なし
    implementations:
      - target: send_enter
        notes: pynput で送信する（外部連携）
    status: planned
