lead: トレイの「設定…」から設定画面を開き、変えた設定を設定のモデルで確認してから環境の値の `settings.yaml` に保存する単一ユースケース。
issue: 21
primary_actor: 音声入力を使用するユーザー
trigger: トレイのメニューの「設定…」を選ぶ
preconditions:
  - 常駐アプリが待機中である（録音から届けるまでの間は、API から始めた録音の間を含めて、トレイの「設定…」を押せない）
notes:
  画面の項目: '設定の全てのキーを、出力先・ホットキー・録音・文字起こし・表記のヒント・用語集・ハルシネーション・画面・履歴とログ・API のまとまりに分け、左のメニューで切り替える。欄は設定のモデルから組み立てる（キーの一覧は 設定/常駐アプリ）。「文字起こし」のまとまりは、エンジンの選択の下にエンジン（ローカルの Whisper・OpenAI API・Haas（WSL））ごとの欄の区画を配置し、今選んでいるエンジンに関係なく、どの区画の欄も変えて保存できる。手がかりのプリセットは、画面では「表記のヒント」のまとまりに「ヒントのプリセット」として出す。

    用語集のプリセットは、「用語集」のまとまりに用語集の一覧と並べて出す。'
  設定のレイヤー: |-
    欄には、既定値 `config/defaults.yaml` → 環境の値 `settings.yaml` → checkout の上書き `settings.local.yaml` を重ねた値を入れる（常駐アプリを起動する の補足『設定のレイヤー』）。
    保存は `settings.yaml` だけに書き込み、既定値と同じ値にしたキーは `settings.yaml` から除外する。`config/defaults.yaml` と `settings.local.yaml` は書き換えない。
    `settings.local.yaml` にあるキーは、保存しても `settings.local.yaml` の値で動く。
  反映の種類: |-
    キーごとの反映（`immediate` / `restart`）は 設定/常駐アプリ が持つ。反映が `restart` の欄には「再起動で反映」を出し、そうした欄を変えたときだけ「保存して再起動」を出す。`immediate` の値は保存した時点で動いている常駐アプリに有効になる。
    ホットキーの欄の値は `immediate` でも、設定画面を開いている間はホットキーを受け付けないため、設定画面を閉じた時点で新しい組み合わせが有効になる。
    「保存」で反映が `restart` の欄を書き込んだ後は、「保存して再起動」の代わりに、再起動するまで前の値で動くことの通知と「今すぐ再起動」を出す（既定に戻した後と同じ）。
  E2E のテスト: |-
    正常シナリオと「カスタムプリセットを追加する」は、変えた設定で録音を始めるため、録音の入力を WAV を供給するものに、システム音量を下げた値と戻した値を記録するものに差し替える（マイクを開かない）。

    E2E の常駐アプリの起こし方と操作の引き渡し方は、常駐アプリを起動する の補足『E2E のテスト』と同じ。
    設定画面はトレイの「設定…」を trigger して開き、まとまりのメニュー・欄・ボタンはクリックとキーを Qt のイベントで引き渡す。
    「保存して再起動する」で起動し直す新しいプロセスは別プロセスで動き（Qt は offscreen）、ログとトークンのファイルで確認する
test_file: tests/e2e/単一ユースケース/test_change_settings.py
