        participant LOG as ログ

        SVC->>SVC: 受け付けたジョブを 1 件取り出す（state: running）
        SVC->>H: 音声を録れた形式の拡張子のまま残す
        SVC->>SVC: 音声が 25 MB を超えている（OpenAI API へ送信しない）
        SVC->>LOG: job_id と、音声の大きさが OpenAI API の上限を超えたことを書く
        SVC->>SVC: ジョブを終える（state: failed・error）。次のジョブへ進む
      ```
    expected:
      - '`GET /web/transcriptions/{job_id}` が `failed` を返し、`error` に音声が OpenAI API の上限を超えたことが入っている'
      - テスト用のエンドポイントが要求を受けていない
      - 履歴にこの音声が残っている
    test: test_error_when_openai_unsupported_audio
    notes:
      上限と形式: OpenAI API へ送信できるのは 25 MB 以下で、`mp3`・`mp4`・`mpeg`・`mpga`・`m4a`・`wav`・`webm` の音声に限る。形式が外れる音声（ブラウザの `ogg`）も同じ扱いになる。
      入口ごとの結末: ホットキー・トレイから始めた録音（約 13 分で 25 MB を超える）は 異常シナリオ（OpenAI API が失敗を返す） と同じく失敗を通知し、API から始めた録音と連続録音の区間は文字起こしの失敗を 起こした文字を届ける へ渡す。
lead: 確定した録音を設定のエンジンで文字に起こし、文頭・文末の決まった文言を消して用語集で補正するまでの単一ユースケース。
