notes:
  まとまりと欄: |-
    | まとまり | キー | 欄の部品 |
    | --- | --- | --- |
    | 出力先 | `outputs[].enabled`（paste_and_send・paste_only・copy_only） | チェックボックス。右に `outputs[].hotkey` のホットキーの欄 |
    | 出力先（送信するまでの間） | `outputs[paste_and_send].enter_delay_sec` | 数値の欄。補助文「「貼り付けて送信」と、「ブラウザ添付」の Enter まで送信するプリセットで使う。」 |
    | 出力先（Enter と一緒に押す修飾キー） | `outputs[paste_and_send].enter_modifiers` | 欄の名前「Enter と一緒に押す修飾キー」の下の行に、「Ctrl」「Alt」「Shift」のチェックボックスを横に並べる（オンにしたものを一覧に入れる） |
    | ブラウザ添付（カスタムプリセット） | `presets[]` のうち `kind = "browser"` の enabled・title・url・send_enter・hotkey | プリセットの一覧 |
    | ブラウザ添付（オプション） | `preset_options.browser.open_delay_sec` | 数値の欄。補助文「貼り付けてから Enter を送信するまでの秒数は「出力先」の値を使う。」 |
    | エンドポイントへ送信（カスタムプリセット） | `presets[]` のうち `kind = "endpoint"` の enabled・title・url・authorization・hotkey | プリセットの一覧 |
    | エンドポイントへ送信（オプション） | `preset_options.endpoint.timeout_sec` | 数値の欄（0.5 刻み）。補助文「既定は 1.5 秒で、10 秒まで入れられる。この秒数で届かなければ、再送せずにトレイで通知する。」 |
    | ホットキー | `hotkeys.start`・`hotkeys.pause`・`hotkeys.cancel`・`keyboard.paste_key` | ホットキーの欄 |
    | 録音 | `recording.lower_volume`・`recording.hide_window` | チェックボックス |
    | 録音 | `recording.volume_percent` | つまみ（0〜100、右に %） |
    | 録音 | `recording.fade_sec` | 数値の欄 |
    | 文字起こし（エンジン） | `transcription.engine`・`transcription.local_whisper.model` | 選択の欄 |
    | 文字起こし（エンジン） | `transcription.local_whisper.device`・`transcription.local_whisper.compute_type` | ラジオボタン |
    | 文字起こし（エンジン） | `transcription.local_whisper.language` | 文字の欄 |
    | 文字起こし（詳しい調整） | `transcription.local_whisper` の cpu_threads・num_workers・beam_size・best_of・temperature・no_speech_threshold・vad_threshold・vad_min_speech_ms・vad_min_silence_ms | 数値の欄 |
    | 文字起こし（詳しい調整） | `transcription.local_whisper` の condition_on_previous_text・vad_filter | チェックボックス |
    | 表記のヒント | `hint_presets[]`（name・words・enabled） | 有効なヒントの長さと、ヒントのプリセットの一覧 |
    | 用語集 | `glossary_presets[]`（name・glossaries）・`active_glossary_preset` | 用語集のプリセットの一覧と、選んだプリセットの使う用語集の表 |
    | 用語集 | `glossaries[]`（name・path）と、用語集の CSV の行（誤変換・正しい表記・オン・オフ） | 用語集の一覧と、選んだ用語集の行の表 |
    | ハルシネーション | `edge_phrases[]`（text・position） | 文言の一覧 |
    | 画面 | `ui.theme` | ラジオボタン（Windows の設定に従う・ライト・ダーク）。欄の名前は「画面の明暗」で、まとまりの先頭に置く |
    | 画面 | `ui.topmost`・`ui.follow_cursor` | チェックボックス |
    | 画面 | `ui.position` | ラジオボタン（中央・左上・右上・左下・右下） |
    | 画面 | `ui.wave_gain` | 数値の欄 |
    | 画面 | `ui.show_hotkeys`・`ui.transcribing_show_hotkeys` | チェックボックス。まとまりの末尾に、録音の画面・文字起こし中の表示の順で置く |
    | 履歴とログ | `history.enabled` | チェックボックス |
    | 履歴とログ | `history.retention_days`・`logging.retention_days` | 数値の欄 |
    | 履歴とログ | `logging.level` | ラジオボタン |
    | API | `api.port` | 数値の欄 |
    | API | `api.allowed_callback_hosts` | 複数行の文字の欄（1 行 = 1 ホスト） |
    | API | `api.allowed_web_origins` | 複数行の文字の欄（1 行 = 1 オリジン）。`api.allowed_callback_hosts` の後ろに置く |
    | API（連続録音） | `api.continuous.min_silence_sec`・`api.continuous.session_limit_sec` | 数値の欄 |

    欄の部品は設定のモデルの型から決める（bool → チェックボックス、リテラルの列挙 → ラジオボタンか選択の欄、int・float → 数値の欄、str → 文字の欄、ホットキーの型 → ホットキーの欄）。上の表は欄の並びと、型からは決まらない部品（つまみ・プリセットの一覧・用語集のプリセットの一覧と使う用語集の表・用語集の一覧と行の表・ヒントのプリセットの一覧・文言の一覧）を決める。
  マーカーの見え方: |-
    チェックボックス（`checkbox`）・ラジオボタン（`radio`）・選択欄の開くマーカーは、Qt の既定の描き方に任せず、アプリのスタイルシートで描く。明暗のどちらの組でも同じ色の役割で描き、マーカーと背景の明るさの比を 3:1 以上にする。

    | 対象 | 見た目 |
    | --- | --- |
    | オフのチェックボックス・選んでいないラジオボタン | 16px の箱（チェックボックスは角を 4px 丸めた四角、ラジオボタンは丸）を `text_muted` の線で描く。マウスを重ねると線を `accent_fg` にする |
    | オンのチェックボックス | 箱を `accent_fg` で塗り、`surface` の色でチェックを描く |
    | 選んだラジオボタン | 線を `accent_fg` にし、中に `accent_fg` の 8px の点を描く |
    | 使えないチェックボックス・ラジオボタン | 線を `border` にし、名前を `text_muted` にする。オンのチェックボックスは箱を `border` で塗り、チェックを `text_muted` で描く。選んだラジオボタンは丸の中を塗らず、点を `text_muted` で描く |
    | フォーカス | マーカーと名前の組を `accent_fg` の 1px の枠で囲む（クリックでフォーカスが移ったときも出す） |
    | マーカーと名前の間・ラジオボタンの選択肢の間 | マーカーと名前の間は 8px、ラジオボタンの選択肢の間は 20px |
    | 選択欄の開くマーカー | 欄の右端に別の枠を持たせず、`text_muted` の線の V 字を置く |

    色の役割は `src/voice_paste/ui/tokens.toml` の色のトークンに従う。部品ごとの状態の見本は `dev/mock/components/check-indicator/`。
