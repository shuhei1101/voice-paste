id: LIB-17
visibility: internal
title: "pycaw"
kind: "ライブラリ"
version:
  current: '20251023'
  checked_on: '2026-10-01'
  source: pyproject.toml（==20251023）と uv.lock のバージョン
  pinning: バージョンを固定（==20251023。日付のバージョンで API が変わるため。上げるときは音量のアダプタの契約テストを回す）
catalogs:
  - name: API
    version: '20251023'
    entries:
      - name: AudioUtilities.GetSpeakers
        kind: 関数
        purpose: 既定の再生デバイスを取る
      - name: AudioDevice.EndpointVolume
        kind: プロパティ
        purpose: 再生デバイスの音量を操作するインターフェースを取る
      - name: GetMasterVolumeLevelScalar / SetMasterVolumeLevelScalar
        kind: メソッド
        purpose: マスター音量を 0.0〜1.0 で読み書きする
lead: Windows の Core Audio を Python から操作するライブラリ。
purl: pkg:pypi/pycaw
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/volume/
upstream: AndreMiras/pycaw
verification:
  state: 済
  date: '2026-10-02'
  detail: pycaw 20251023 で、Windows の実機の既定の再生デバイスに対し、音量のアダプタの契約テスト 3 件（tests/external/voice_paste/integrations/volume/test_adapter.py）を --run-external で通した。GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar で読み込み、SetMasterVolumeLevelScalar で割合を掛けた音量（0.6 → 0.3）へ下げ、下げた音量を 0.6 へ戻せることを、フェードなしと 0.3 秒のフェード（別スレッド）の両方で確認した（誤差 0.01 以内）。実行前後でマスター音量は変わらない（0.06）
license: MIT（商用利用可）
official_url: https://github.com/AndreMiras/pycaw
install: |-
  pyproject.toml の dependencies に `; sys_platform == "win32"` を付けて宣言し、Windows だけに入れる（Linux の `uv sync --frozen` では入らない）。

  ```bash
  uv sync --frozen
  ```
