scope_out:
  - item: コードの識別子（session・callback_url・features/session・/sessions など）の改名
    reason: 英語の名前で旧命名の和語を含まない。API のパス・キーを変えると呼び出し元の互換を壊す
    plan: none
  - item: 動作の「返送」（「返送のタイムアウト」「返送が届くまで」など）の呼び替え
    reason: 話し合いで決めたのはエンドポイントの「返送先」だけで、動作の呼び名は決めていない。今の判断は置き換えない（レビューで確定する）
    plan: none
  - item: 変更履歴（docs/guide/変更履歴.md）の過去の版の行の旧命名
    reason: 過去の版で入った変更の記録で、行はその版の PR のタイトルを指す。今の判断は置き換えない（レビューで確定する）
    plan: none
  - item: docs/pr/ の過去の PR ドキュメントの旧命名
    reason: マージ済みの作業 PR の記録で、書き換えるとその時の計画と食い違う
    plan: none
  - item: 一般の単語のセッション（Xorg・Wayland・GNOME・デスクトップのセッション、D-Bus のセッションバス、ONNX Runtime の VAD のセッション、検証環境の VM のログインのセッション）
    reason: ドメイン用語ではなく、置き換えると意味が変わる
    plan: none
