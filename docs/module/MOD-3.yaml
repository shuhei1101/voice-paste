id: MOD-3
visibility: internal
title: "常駐アプリ / 録音セッション"
lead: 録音から出力までの 1 回分の流れ（録音セッション）の状態と、入口をまたいで同時に 1 つだけ動かす排他を持つ。録音・文字起こし・補正・出力先・履歴は関数型越しに受け取り、API の route もここに配置する。API の連続録音では、区切った区間を区切った順に起こして返却し、最後に終わりを返却する。
directory: |-
  ```
  src/voice_paste/features/session/
  ├── __init__.py   # SessionManager・route の公開
  ├── types.py      # 録音セッションの状態・録音セッション・ほかの feature を受け取る関数型（入口・録音・結果の型は shared/types.py）
  ├── service.py    # SessionManager（状態の遷移と排他、録音から出力までの流れ）
  ├── schemas.py    # API のリクエスト・レスポンス
  └── route.py      # POST /sessions・/stop・/complete
  ```
diagrams:
  - name: 全体
    diagram: |-
      <!-- map: {"title": "全体"} -->

      ```mermaid
      flowchart LR
        録音セッション管理["録音セッション管理"]
