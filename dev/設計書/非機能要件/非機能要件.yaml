    value: '24'
    unit: 時間
    rationale: 保持期間は日単位なので、1 日ごとに消せば保持期間を過ぎて残るのは最長 1 日に収まる。起動時にも削除する
  - name: 出力先を追加するときに変える既存のモジュール
    english_name: output_extensibility
    category: 保守性
    external_constraint: 制限なし
