id: LIB-36
visibility: internal
title: actions/upload-artifact
tags:
  - name: tool:github-actions
    main: true
  - name: topic:ci
lead: GitHub Actions のジョブのファイルを、実行の成果物として上げる action。
kind: サービス
adoption: 採用
dependency_scope: 開発のみ
used_in:
  - .github/workflows/test.yml
upstream: actions/upload-artifact
license: MIT
official_url: https://github.com/actions/upload-artifact
docs_url: https://github.com/actions/upload-artifact#readme
verification:
  state: 済
  detail: 'E2E テスト tests/e2e/workflow/test_test_yml.py の 5 件と、単体・結合テストの層の全件実行で、成果物 test-log が上がり `gh run download` で test.log を取得できることを確認した。依存の導入に失敗したケース（test.log が無い）でも、if-no-files-found: ignore で step が success になることを確認した'
  date: '2026-11-15'
version:
  current: v7.0.2
  latest: v7.0.2
  checked_on: '2026-11-15'
  source: .github/workflows/test.yml
  pinning: メジャーバージョンのタグで指定する
catalogs:
  - name: action
    version: v7.0.2
    entries:
      - name: actions/upload-artifact@v7
        kind: action
        purpose: test.log を成果物 test-log に上げる
        params:
          - name: name
            type: '`string`'
            default: '`artifact`'
            description: 成果物の名前
            required: false
            verification_state: verified
          - name: path
            type: '`string`'
            description: 上げるファイルのパス
            required: true
            verification_state: verified
          - name: if-no-files-found
            type: '`warn` / `error` / `ignore`'
            default: '`warn`'
            description: 上げるファイルが無いときの扱い
            required: false
            verification_state: verified
