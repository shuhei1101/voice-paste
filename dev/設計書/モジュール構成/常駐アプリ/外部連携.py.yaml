title: "常駐アプリ / 外部連携"
lead: 文字起こしワーカーの子プロセス・OpenAI API の文字起こし・システム音量・キーボードとクリップボード・ブラウザ添付の画面を開くブラウザ・HTTP の POST・話し声の判定（Silero VAD）を包むアダプタ。feature の関数型を満たし、外の例外をアプリの例外に変える。
directory: |-
  ```
  src/voice_paste/integrations/
  ├── whisper/
  │   ├── client.py     # WhisperWorkerClient（子プロセスの起動・監視・立て直し・やり直し）・ensure_local_whisper_installed
  │   └── worker.py     # 子プロセスの本体（文字起こしワーカーのサブシステム）
  ├── openai/
  │   ├── credentials.py # read_openai_api_key（環境変数か秘匿のファイルから API キーを読む）
  │   └── transcriber.py # OpenAITranscriber（OpenAI API の文字起こしへ httpx で送信する）
  ├── audio/
  │   └── probe.py      # probe_audio（受けた音声を PyAV で開いて容れ物・秒数を読む）
  ├── vad/
  │   ├── adapter.py    # load_vad_session・StreamingVad（同梱の Silero VAD を onnxruntime で窓ごとに流す）
  │   └── assets/
  │       ├── silero_vad_v6.onnx # faster-whisper 1.2.1 が同梱するものと同じ Silero VAD のモデル（MIT）
  │       └── LICENSE.silero-vad # Silero VAD の MIT のライセンスの全文
  ├── volume/
  │   ├── adapter.py    # lower_volume・restore_volume（pycaw を == で固定して包む。Windows だけが読み込む）
  │   └── noop.py       # lower_volume_noop・restore_volume_noop（Linux の、音量を変えない実装）
  ├── keyboard/
  │   ├── sender.py     # copy_to_clipboard・use_xclip_clipboard・split_paste_key・send_paste・send_enter
  │   ├── sender_linux.py # send_paste_linux（Linux。端末アプリなら Ctrl+Shift+V にし、主キーを XTEST で送信する）
  │   ├── sender_wayland.py # UInputKeyboard（Linux の Wayland のセッション。python-evdev の UInput の仮想キーボードで貼り付けのキーと Enter を送信する）
  │   └── active_window_linux.py # read_active_wm_class（Linux。python-xlib でアクティブなウィンドウの WM_CLASS を読む）
  ├── browser/
  │   ├── opener.py     # open_app_window（Windows。Edge の --app で開き、無ければ既定のブラウザ）
  │   └── opener_linux.py # open_app_window_linux（Linux。Chromium 系の --app で開き、無ければ既定のブラウザ）
  └── http/
      ├── types.py      # PostResult・PostJsonFn
      └── client.py     # post_json（httpx）
  ```
classes:
  - name: WhisperWorkerClient
    title: 文字起こしワーカーの窓口
    container: integrations/whisper/client.py
    usecase: 録音を文字に起こす
    role: アダプタ
    kind: クラス
    summary: 文字起こしワーカーの子プロセスを持ち、標準入出力の JSON Lines で録音を渡して結果を受け取る。落ちたら 1 回だけ立て直してやり直す
    properties:
      - name: _process
        type: subprocess.Popen | None
        access: 内部 (_)
        description: 子プロセス
      - name: _settings
        type: LocalWhisperSettings
        access: 内部 (_)
        description: モデル・デバイス・量子化・言語・ビーム幅・温度・VAD
      - name: _ready_timeout_sec
        type: float
        access: 内部 (_)
        description: 立て直しで ready を待つ上限（非機能要件の文字起こしワーカーの立て直しの時間。main.py が渡す）。起動時の 1 回目にはかけない
      - name: _log_dir
        type: Path
        access: 内部 (_)
        description: ワーカーが落ちたときのスタックを書くログの置き場所（AppPaths.log_dir）
      - name: _stop_timeout_sec
        type: float
        access: 内部 (_)
        description: 終わりを待つ時間（非機能要件の文字起こしワーカーの終わりを待つ時間。main.py が渡す）
      - name: _stopping
        type: bool
        access: 内部 (_)
        default: 'False'
        description: stop で止めている最中か。立っている間は子プロセスが終わっても立て直さない。start で下ろす
      - name: _creationflags
        type: int
        access: 内部 (_)
        description: 子プロセスの起動のフラグ。main.py が PlatformAdapters.worker_creationflags（Windows は CREATE_NO_WINDOW、Linux は 0）を渡す
    methods:
      - name: start
        title: 起動
        kind: メソッド
        scope: public
        summary: 子プロセスを起動し、ready を待つ。起動時の 1 回目はモデルの取得や冷えた読み込みがあるため上限をかけず、立て直しだけ上限をかける
        returns:
          type: None
          description: なし
        exceptions:
          - name: EngineError
            condition: モデルを読み込めず ready が届かない（error が届いた・子プロセスが終わった・立て直しで上限を過ぎた）
        process: |-
          1. _stopping を下ろす
          2. 子プロセスの環境を作る
             - venv の `Lib/site-packages/nvidia/{cublas,cudnn,cuda_nvrtc}/bin` のうち存在するものを PATH の先頭へ追加する（CUDA の DLL を子プロセスが見つけられるようにする）
             - 標準入出力を UTF-8 にする
          3. `python -u -m voice_paste.integrations.whisper.worker` を _creationflags で起動し（Windows ではコンソールを出さない。sys.platform は見ない）、標準エラーを別のスレッドで読んでロガーへ流す
          4. config（モデル・デバイス・量子化・スレッド数・ワーカー数・ログの置き場所）を送信し、ready・error・子プロセスの終了のどれかを待つ
             - ready_timeout_sec が渡されていれば、その間だけ待つ（立て直しの経路）
             - error が届いた・子プロセスが終わった・上限を過ぎた場合、子プロセスを止めて EngineError を送出する
             - `[INFO]` 文字起こしワーカーが立ち上がった（pid・かかった秒）
        unit_tests:
          - name: test_start
            case: 正常
            summary: config を送信し ready を受けて立ち上がる
            condition: 子プロセスが ready を返す
            mock: subprocess.Popen
            expected: 最初に送信した行が config で、Popen の環境の PATH の先頭に存在する nvidia の bin がある
          - name: test_start_when_model_load_failed
            case: 異常
            summary: ready の代わりに error が届いたら EngineError
            condition: 子プロセスが error を返して終わる
            mock: subprocess.Popen
            expected: EngineError が送出され、理由に error の中身が残る
            exception: モデルを読み込めず ready が届かない
          - name: test_start_when_ready_timeout
            case: 異常
            summary: 立て直しで ready を待ちきれなければ子プロセスを止めて EngineError
            condition: ready_timeout_sec=0.1 を渡し（立て直しの経路）、子プロセスは何も返さない
            mock: subprocess.Popen
            expected: EngineError が送出され、子プロセスの kill か terminate が呼ばれる
            exception: モデルを読み込めず ready が届かない（error が届いた・子プロセスが終わった・立て直しで上限を過ぎた）
          - name: test_start_when_first_ready_is_slow
            case: 正常
            summary: 起動時の 1 回目は上限をかけずに ready を待つ
            condition: ready_timeout_sec を渡さず、子プロセスは _ready_timeout_sec（0.1 にする）より遅れて 0.3 秒後に ready を返す
            mock: subprocess.Popen
            expected: 例外が出ずに立ち上がり、子プロセスが止められない
        args:
          - name: ready_timeout_sec
            type: float | None
            required: false
            default: None
            passing: keyword
            description: ready を待つ上限。None（起動時の 1 回目）は上限をかけない。立て直しでは transcribe が _ready_timeout_sec を渡す
      - name: transcribe
        title: 文字起こし
        kind: メソッド
        scope: public
        inherits: EngineFn
        summary: 録音を子プロセスへ送信し、区間ごとの文字を受け取る
        args:
          - name: audio_path
            type: Path
            required: true
            passing: positional
            description: 録音の WAV
          - name: on_progress
            type: Callable[[float, float], None] | None
            required: false
            default: None
            passing: keyword
            description: 区間の終わりの時刻を知らせる
          - name: hint
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 文字起こしの手がかり。None なら transcribe の行に hotwords を載せない
        returns:
          type: list[str]
          description: 区間ごとの文字
        process: |-
          1. 録音と設定を 1 行の JSON で送信し、区間の進みと結果を読む。hint が None でなければ hotwords に載せる（立て直して再送するときも同じ手がかりを載せる）
             - 子プロセスが応答の途中で終わった場合、_stopping が立っていれば立て直さずに EngineError を送出する（常駐の終了で止めた）
             - それ以外で子プロセスが応答の途中で終わった場合、子プロセスを start(ready_timeout_sec=_ready_timeout_sec) で起動し直して同じ録音をもう一度送信する（やり直しは 1 回だけ）
               - `[WARNING]` 文字起こしワーカーが落ちたので立て直す（終了コード）
               - 立て直しで ready が上限までに届かなければ、start が子プロセスを止めて EngineError を送出する
             - やり直しも異常終了した場合、子プロセスを同じ上限でもう一度起動して次の録音に備え、EngineError を送出する
             - ワーカーがエラーを返した場合、起動し直さずに EngineError を送出する
        exceptions:
          - name: EngineError
            condition: やり直したワーカーも異常終了した
          - name: EngineError
            condition: ワーカーがエラーを返した
        unit_tests:
          - name: test_transcribe_when_worker_crashed_once
            case: 正常
            summary: 1 回落ちてもやり直しで結果を得る
            condition: 1 つ目の子プロセスは応答の途中で終わり、2 つ目は結果を返す
            mock: subprocess.Popen
            expected: 結果が返り、Popen が 2 回呼ばれる
          - name: test_transcribe_when_retry_crashed
            case: 異常
            summary: やり直しも異常終了したら EngineError、次に備えて起動し直す
            condition: 2 つの子プロセスがどちらも応答の途中で終わる
            mock: subprocess.Popen
            expected: EngineError が送出され、Popen が 3 回呼ばれる
            exception: やり直したワーカーも異常終了した
          - name: test_transcribe
            case: 正常
            summary: 進みを知らせ、区間ごとの文字を返す
            condition: 子プロセスが progress（end=1.0, duration=2.0）・result（["今日は", "晴れ"]）を返す
            mock: subprocess.Popen
            expected: '["今日は", "晴れ"] が返り、on_progress が (1.0, 2.0) で 1 回呼ばれ、送信した transcribe に設定の言語・ビーム幅・温度・VAD が入る'
          - name: test_transcribe_when_worker_error
            case: 異常
            summary: ワーカーが error を返したら起動し直さずに EngineError
            condition: 子プロセスが error を返し、動き続ける
            mock: subprocess.Popen
            expected: EngineError が送出され、Popen が 1 回だけ呼ばれる
            exception: ワーカーがエラーを返した
          - name: test_transcribe_when_restart_ready_timeout
            case: 異常
            summary: 立て直しで ready を待ちきれなければ _ready_timeout_sec の後に EngineError
            condition: _ready_timeout_sec=0.1。1 つ目の子プロセスは応答の途中で終わり、2 つ目は ready を返さない
            mock: subprocess.Popen
            expected: EngineError が送出され、2 つ目の子プロセスが止められ、待ちが 1 秒未満で終わる
            exception: やり直したワーカーも異常終了した
          - name: test_transcribe_when_hint
            case: 正常
            summary: 手がかりを hotwords に載せて送信する
            condition: hint="voice-paste、Whisper" で transcribe を呼ぶ。子プロセスは result（["今日は"]）を返す
            mock: subprocess.Popen
            expected: 送信した transcribe の payload の hotwords が "voice-paste、Whisper"
          - name: test_transcribe_when_no_hint
            case: 正常
            summary: 手がかりが無ければ hotwords を載せない
            condition: hint を省いて transcribe を呼ぶ
            mock: subprocess.Popen
            expected: 送信した transcribe の payload に hotwords のキーが無い
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: 子プロセスの標準入力を閉じて終わりを待ち、待ちきれなければ止める。常駐の終了時に main.py が呼ぶ。文字起こしの最中に別のスレッドから呼ばれても、文字起こしの終わりを待たない
        returns:
          type: None
          description: なし
        process: |-
          1. 文字起こしが持つロックを取らずに _stopping を立てる（文字起こしの最中でも待たない。止めた子プロセスを transcribe が「落ちた」と受けて立て直さないようにする）
          2. 子プロセスが無ければ何もしない
          3. 標準入力を閉じ、終わりを _stop_timeout_sec 待つ
             - 終わらなければ terminate して同じ時間待ち、それでも終わらなければ kill する
               - `[WARNING]` 文字起こしワーカーが終わらないので止めた（terminate / kill）
        unit_tests:
          - name: test_stop_when_worker_hangs
            case: 正常
            summary: 標準入力を閉じても終わらなければ止める
            condition: 子プロセスの wait が 1 回目にタイムアウトする
            mock: subprocess.Popen
            expected: 標準入力が閉じられ、terminate が呼ばれる
          - name: test_stop_when_terminate_hangs
            case: 正常
            summary: terminate しても終わらなければ kill する
            condition: _stop_timeout_sec=0.1、子プロセスの wait が 1 回目・2 回目ともタイムアウトする
            mock: subprocess.Popen
            expected: terminate の後に kill が呼ばれ、wait がどちらも 0.1 秒で呼ばれる
          - name: test_stop_when_transcribing
            case: 正常
            summary: 文字起こしの最中に止めても _stop_timeout_sec で止まり、立て直さない
            condition: _stop_timeout_sec=0.1。子プロセスは transcribe に何も返さず、標準入力を閉じても終わらない。別のスレッドで transcribe を呼んでから stop を呼ぶ
            mock: subprocess.Popen
            expected: stop が 1 秒未満で戻り、terminate が呼ばれ、transcribe が EngineError を送出し、Popen が 1 回だけ呼ばれる
    refs:
      - dev/設計書/外部ライブラリ/faster-whisper#
    status: implemented
  - name: StreamingVad
    title: 流して使う VAD
    container: integrations/vad/adapter.py
    usecase: 録音する
    role: アダプタ
    kind: クラス
    summary: Silero VAD の ONNX のセッションで、512 サンプルの窓ごとに話し声の確率を返す。LSTM の状態と前の窓の末尾を次の窓へ持ち越す
    description: |-
      窓をまたいで状態（h・c・前の 64 サンプル）を持ち越すためクラスにする。連続録音を始めるたびに新しく作り、状態を持ち越さない。
      セッションへの入出力の形式は faster-whisper の SileroVADModel と同じで、状態を呼ぶたびに 0 に戻さずに持ち越す点だけが違う（PoC #80 で、一度に渡した `get_speech_timestamps` と同じ区切りになることを確かめた）。
      録音の区切りのスレッドからだけ呼ぶ（並行で呼ばない）。
    properties:
      - name: _session
        type: onnxruntime.InferenceSession
        access: 内部 (_)
        description: Silero VAD のセッション（load_vad_session が読んだものを共有する）
      - name: _h
        type: numpy.ndarray
        access: 内部 (_)
        description: LSTM の状態 h（形状 VAD_STATE_SHAPE・float32。初めは 0）
      - name: _c
        type: numpy.ndarray
        access: 内部 (_)
        description: LSTM の状態 c（形状 VAD_STATE_SHAPE・float32。初めは 0）
      - name: _context
        type: numpy.ndarray
        access: 内部 (_)
        description: 前の窓の末尾 VAD_CONTEXT サンプル（初めは 0）
    methods:
      - name: __call__
        title: 話し声の確率
        kind: メソッド
        scope: public
        inherits: SpeechProbabilityFn
        summary: 1 窓（512 サンプル・float32・-1.0〜1.0）の話し声の確率を返し、状態を次の窓へ持ち越す
        args:
          - name: window
            type: numpy.ndarray
            required: true
            description: 512 サンプルの音（float32）
        returns:
          type: float
          description: 話し声の確率（0.0〜1.0）
        process: |-
          1. 前の窓の末尾と窓をつないだ (1, 576) の入力を作る
          2. セッションを input・h・c で動かし、確率と新しい h・c を受ける
          3. 窓の末尾 VAD_CONTEXT サンプルを持ち越し、確率を返す
        unit_tests:
          - name: test_streaming_vad_carries_state
            case: 正常
            summary: 状態を次の窓へ持ち越す
            condition: セッションの Mock が確率 0.9 と、呼ぶたびに違う h・c を返す。2 窓を続けて渡す
            mock: onnxruntime.InferenceSession
            expected: 0.9 が返り、2 回目の run に 1 回目が返した h・c と、1 窓目の末尾 64 サンプルで始まる形状 (1, 576) の入力が渡る
          - name: test_streaming_vad_starts_fresh
            case: 正常
            summary: 新しく作ると状態を持ち越さない
            condition: 同じセッションで 2 つ作り、それぞれに 1 窓を渡す
            mock: onnxruntime.InferenceSession
            expected: どちらの run にも 0 の h・c が渡る
    refs:
      - dev/設計書/外部ライブラリ/onnxruntime#
    status: planned
    introduced:
      pr: 78
  - name: OpenAITranscriber
    title: OpenAI API の文字起こし
    container: integrations/openai/transcriber.py
    usecase: 録音を文字に起こす
    role: アダプタ
    kind: クラス
    summary: 録音を OpenAI API の文字起こし（POST {base_url}/audio/transcriptions）へ httpx の multipart で送信し、起こした文字を返す。一時的な失敗は回数の上限まで送信し直す
    description: API キーはヘッダーにだけ載せ、ログ・例外の文に書かない。リダイレクトを追わない（認証のヘッダーを設定のベース URL 以外へ送信しない）。
    properties:
      - name: _settings
        type: OpenAISettings
        access: 内部 (_)
        description: モデル・言語・ベース URL
      - name: _api_key
        type: pydantic.SecretStr
        access: 内部 (_)
        description: API キー（read_openai_api_key が返したもの。送信のときだけ get_secret_value で取り出す）
      - name: _sleep
        type: Callable[[float], None]
        access: 内部 (_)
        default: time.sleep
        description: 送信し直す前に待つ関数（テストで差し替える）
      - name: _uniform
        type: Callable[[float, float], float]
        access: 内部 (_)
        default: random.uniform
        description: 待つ秒数のジッターを引く関数（テストで差し替える）
      - name: _transport
        type: httpx.BaseTransport | None
        access: 内部 (_)
        default: None
        description: httpx.Client に渡すトランスポート（テストで httpx.MockTransport に差し替える）
    methods:
      - name: transcribe
        title: 文字起こし
        kind: メソッド
        inherits: 文字起こしの EngineFn
        scope: public
        summary: 録音を送信し、起こした文字を 1 区間の並びで返す
        args:
          - name: audio_path
            type: Path
            required: true
            passing: positional
            description: 録音の WAV か、ブラウザから受けた音声
          - name: on_progress
            type: ProgressFn | None
            required: false
            default: None
            passing: keyword
            description: 受けるが呼ばない（OpenAI API は途中の進みを返さない）
          - name: hint
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 文字起こしの手がかり。None なら prompt を送信しない
        returns:
          type: list[str]
          description: 起こした文字の 1 要素の並び。起こした文字が空なら空の並び
        exceptions:
          - name: EngineError
            condition: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
        process: |-
          1. 音声の大きさが OPENAI_MAX_AUDIO_BYTES 以下で、拡張子（小文字）が OPENAI_AUDIO_SUFFIXES にあるかを確かめる
             - 外れる場合、送信せずに EngineError を送出する（理由は「音声が OpenAI API の上限（25 MB）を超えています」か「OpenAI API が受けられない形式です（{拡張子}）」）
               - `[WARNING]` OpenAI API へ送信しない音声（大きさ・拡張子）
          2. httpx.Client（timeout は OPENAI_TIMEOUT_SEC・接続は OPENAI_CONNECT_TIMEOUT_SEC、follow_redirects=False、transport=_transport）で `{base_url}/audio/transcriptions` へ POST する。ヘッダーは `Authorization: Bearer {API キー}`、本文は multipart の file（音声）・model・language・response_format=json と、hint があるときだけ prompt
          3. 応答を見る
             - 200 の場合、JSON の text の前後の空白を除き、空でなければ [text]、空なら [] を返す
               - `[INFO]` OpenAI API で起こした（モデル・音声のバイト数・かかった秒・試した回数）
             - 429・500 以上か、httpx.TimeoutException・httpx.TransportError の場合、送信し直した回数が OPENAI_MAX_RETRIES 未満なら待ってから 2 へ戻る。待つ秒数は Retry-After（秒数）があればそれ、無ければ _uniform(0, OPENAI_RETRY_BASE_SEC × 2^回数)。どちらも OPENAI_RETRY_MAX_SEC で頭打ちにする
               - `[WARNING]` OpenAI API へ送信し直す（ステータスか例外の種類・待つ秒）
             - それ以外の応答（3xx・4xx）か、回数の上限に達した場合、EngineError を送出する（理由はステータスと、JSON の error.type・error.code。読めなければステータスか例外の種類だけ。API キー・本文は書かない）
               - `[ERROR]` OpenAI API の文字起こしに失敗した（ステータスか例外の種類・error.type・error.code）
        unit_tests:
          - name: test_transcribe
            case: 正常
            summary: 録音と設定を送信して起こした文字を返す
            condition: 'エンドポイントが 200 と {"text": " 今日は晴れ "} を返す。hint="voice-paste、Whisper"'
            mock: httpx.MockTransport
            expected: '["今日は晴れ"] が返り、`{base_url}/audio/transcriptions` に Authorization: Bearer {API キー}・file・model・language・response_format=json・prompt="voice-paste、Whisper" が届いている'
          - name: test_transcribe_when_no_hint
            case: 正常
            summary: 手がかりが無ければ prompt を送信しない
            condition: hint=None
            mock: httpx.MockTransport
            expected: 届いた本文に prompt が無い
          - name: test_transcribe_when_empty_text
            case: 正常
            summary: 起こした文字が空なら空の並び
            condition: 'エンドポイントが 200 と {"text": ""} を返す'
            mock: httpx.MockTransport
            expected: '[] が返る'
          - name: test_transcribe_when_retry_after
            case: 正常
            summary: 429 は Retry-After を待って送信し直す
            condition: '1 回目が 429 と Retry-After: 2、2 回目が 200 を返す'
            mock: httpx.MockTransport・_sleep
            expected: _sleep が 2.0 で 1 回呼ばれ、起こした文字が返る
          - name: test_transcribe_when_server_error_retried
            case: 正常
            summary: 5xx とタイムアウトは待って送信し直す
            condition: 1 回目が 503、2 回目が httpx.ReadTimeout、3 回目が 200 を返す
            mock: httpx.MockTransport・_sleep・_uniform
            expected: _uniform が (0, 0.5)・(0, 1.0) で呼ばれ、起こした文字が返る
          - name: test_transcribe_when_retry_exhausted
            case: 異常
            summary: 回数の上限まで失敗したら EngineError
            condition: エンドポイントが 3 回とも 500 を返す
            mock: httpx.MockTransport・_sleep
            expected: EngineError が送出され、要求は 3 回（最初と送信し直し 2 回）
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_unauthorized
            case: 異常
            summary: 401 は送信し直さずに EngineError にし、API キーを書かない
            condition: 'エンドポイントが 401 と {"error": {"type": "invalid_request_error", "code": "invalid_api_key"}} を返す'
            mock: httpx.MockTransport
            expected: 要求は 1 回で、EngineError の理由に 401・invalid_api_key が入り API キーが入っていない。ログにも API キーが無い
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_audio_too_large
            case: 異常
            summary: 25 MB を超える音声は送信しない
            condition: OPENAI_MAX_AUDIO_BYTES + 1 バイトの webm
            mock: httpx.MockTransport
            expected: EngineError が送出され、エンドポイントに要求が届いていない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_unsupported_suffix
            case: 異常
            summary: 受けられない形式は送信しない
            condition: 拡張子 .ogg の音声
            mock: httpx.MockTransport
            expected: EngineError の理由に ogg が入り、エンドポイントに要求が届いていない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
          - name: test_transcribe_when_redirected
            case: 異常
            summary: リダイレクトを追わない
            condition: エンドポイントが 307 で別のホストを指す
            mock: httpx.MockTransport
            expected: EngineError が送出され、別のホストへの要求が出ない
            exception: 音声が上限を超えるか受けられない形式・4xx（429 を除く。リダイレクトを含む）・送信し直しても 429・5xx・タイムアウト・接続できない
        connectivity_tests:
          - name: test_ext_transcribe
            api: OpenAI API POST /v1/audio/transcriptions
            summary: 実際の OpenAI API で、短い音声を起こせる
            checks: 約 3 秒の日本語の WAV を既定のモデル・language=ja・prompt 付きで送信し、空でない文字が 1 区間で返る。かかった秒を記録する（非機能要件のタイムアウトを実測で見直す材料）
            cost: 従量課金。約 3 秒 × $0.003/分 で 1 回あたり約 $0.0002。実行の前に規約『開発時の従量課金APIの実行』で見積もる
            notes: API キー（環境変数 OPENAI_API_KEY か secrets/openai_api_key）が無い環境では skip する
    refs:
      - dev/設計書/外部API/OpenAI#
      - dev/設計書/外部ライブラリ/httpx#
      - dev/設計書/非機能要件/非機能要件#requirements[OpenAIの文字起こしのタイムアウトと再送]
      - dev/設計書/非機能要件/非機能要件#requirements[OpenAIへ送信する音声の上限]
    status: planned
    introduced:
      pr: 204
  - name: UInputKeyboard
    title: 仮想キーボード
    container: integrations/keyboard/sender_wayland.py
    usecase: 起こした文字を届ける
    role: アダプタ
    kind: クラス
    summary: Wayland のセッションで、python-evdev の UInput の仮想キーボードから貼り付けのキーと Enter を送信する。起動のときに 1 回開き、終了のときに閉じる
    description: |-
      Wayland のセッションでは pynput・XTEST のキーがネイティブのアプリへ届かないため、カーネルの uinput で入力の機器を作ってキーを送信する。`/dev/uinput` を開く権限（udev の規則と `input` グループ）が要り、無ければ open が DeliveryError を送出する（配線がトレイで知らせ、「コピーのみ」は使える）。

      send_paste は sender.py の send_paste の代わりに、send_enter は SendEnterFn として配線する。
    properties:
      - name: _device
        type: evdev.UInput | None
        access: 内部 (_)
        default: None
        description: 開いた仮想キーボード。open の前と close の後は None
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: 送信と close を 1 つずつにする（キーの並びを混ぜない）
    methods:
      - name: open
        title: 仮想キーボードを開く
        kind: メソッド
        scope: public
        summary: 仮想キーボードを作り、コンポジターが入力の機器として受け付けるまで待つ
        returns:
          type: None
          description: なし
        process: |-
          1. 開いていれば何もしない
          2. `UInput(name=VIRTUAL_KEYBOARD_NAME)` で仮想キーボードを作る
             - OSError・UInputError（`/dev/uinput` を開く権限が無い・uinput が無い）の場合、DeliveryError を送出する（理由に例外の文言を残す）
          3. DEVICE_READY_SEC だけ待つ
             - `[INFO]` 仮想キーボードを開いた
        exceptions:
          - name: DeliveryError
            condition: '`/dev/uinput` を開けない'
        unit_tests:
          - name: test_open
            case: 正常
            summary: 仮想キーボードを作って待つ
            condition: open を 2 回呼ぶ
            mock: evdev.UInput・time.sleep
            expected: UInput(name="voice-paste-keyboard") が 1 回だけ作られ、sleep(0.3) が呼ばれる
          - name: test_open_when_permission_denied
            case: 異常
            summary: 開けなければ DeliveryError
            condition: UInput が PermissionError を送出する
            mock: evdev.UInput
            expected: 理由に Permission denied を含む DeliveryError が送出される
            exception: '`/dev/uinput` を開けない'
      - name: send_paste
        title: 貼り付けのキーの送信
        kind: メソッド
        scope: public
        thread_safe: true
        summary: 設定の貼り付けのキーを仮想キーボードで送信する
        args:
          - name: paste_key
            type: str
            required: true
            passing: positional
            description: 貼り付けのキー（pynput の GlobalHotKeys の書式。設定の keyboard.paste_key）
        returns:
          type: None
          description: なし
        process: |-
          1. 開いていなければ DeliveryError（「貼り付けのキーを送信できません。起こした文字はクリップボードにあります」）を送出する
          2. split_paste_key で修飾キーと主キーに分ける（DeliveryError はそのまま送出する）
             - 主キーが 1 文字でない場合、DeliveryError を送出する
          3. 修飾キーを EVDEV_MODIFIER_CODES で、主キーを `ecodes.ecodes["KEY_" + 主キーの大文字]` でキーコードに替える
             - 替えられない場合、DeliveryError を送出する
          4. FOCUS_SETTLE_SEC だけ待つ
          5. 修飾キーを順に押し、主キーを押して離し、修飾キーを逆順に離してから syn で確定する（EV_KEY を write）
             - write が OSError を送出した場合、押した修飾キーを離してから DeliveryError を送出する（押されたままにしない）
             - `[INFO]` 貼り付けのキーを送信した（paste_key、uinput）
        exceptions:
          - name: DeliveryError
            condition: 開いていない・送信できないキー・書き込めない
        unit_tests:
          - name: test_send_paste
            case: 正常
            summary: 待ってから修飾キーと主キーを順に押して離す
            condition: open の後、paste_key が `<ctrl>+v`
            mock: evdev.UInput・time.sleep
            expected: sleep(0.1) の後、write が KEY_LEFTCTRL 1・KEY_V 1・KEY_V 0・KEY_LEFTCTRL 0 の順に呼ばれ、syn が 1 回呼ばれる
          - name: test_send_paste_when_not_opened
            case: 異常
            summary: 開いていなければ DeliveryError
            condition: open を呼ばずに `<ctrl>+v`
            mock: evdev.UInput
            expected: DeliveryError が送出され、write が呼ばれない
            exception: 開いていない
          - name: test_send_paste_when_unsupported_key
            case: 異常
            summary: 1 文字でない主キーは DeliveryError
            condition: open の後、paste_key が `<ctrl>+<insert>`
            mock: evdev.UInput・time.sleep
            expected: DeliveryError が送出され、write が呼ばれない
            exception: 送信できないキー
          - name: test_send_paste_when_write_failed
            case: 異常
            summary: 書き込めなければ押した修飾キーを離して DeliveryError
            condition: open の後、主キーの write が OSError を送出する
            mock: evdev.UInput・time.sleep
            expected: DeliveryError が送出され、KEY_LEFTCTRL 0 の write が呼ばれている
            exception: 書き込めない
      - name: send_enter
        title: Enter の送信
        kind: メソッド
        scope: public
        inherits: SendEnterFn
        thread_safe: true
        summary: 渡した修飾キーを押したまま Enter を仮想キーボードで送信する（待ちは呼ぶ側が置く）
        args:
          - name: modifiers
            type: Sequence[EnterModifier]
            required: false
            default: ()
            passing: positional
            description: 一緒に押す修飾キー。並びと重なりは問わない
        returns:
          type: None
          description: なし
        process: |-
          1. 開いていなければ DeliveryError を送出する
          2. modifiers を ENTER_MODIFIER_KEYS の並び（Ctrl・Alt・Shift）に揃え、重なりを除いて EVDEV_MODIFIER_CODES でキーコードに替える
          3. 修飾キーを順に押し、Enter（KEY_ENTER）を押して離し、修飾キーを逆順に離してから syn で確定する（EV_KEY を write）
             - write が OSError を送出した場合、押した修飾キーを離してから DeliveryError を送出する（押されたままにしない）
             - `[INFO]` Enter を送信した（修飾キー: {揃えた修飾キー。無ければ「なし」}、uinput）
        exceptions:
          - name: DeliveryError
            condition: 開いていない・書き込めない
        unit_tests:
          - name: test_send_enter_when_modifiers
            case: 正常
            summary: 修飾キーを Ctrl・Alt・Shift の順に押し、逆順に離す
            condition: open の後、modifiers が ("shift", "ctrl", "shift")
            mock: evdev.UInput・time.sleep
            expected: write が KEY_LEFTCTRL 1・KEY_LEFTSHIFT 1・KEY_ENTER 1・KEY_ENTER 0・KEY_LEFTSHIFT 0・KEY_LEFTCTRL 0 の順に呼ばれ、syn が 1 回呼ばれる
          - name: test_send_enter_when_not_opened
            case: 異常
            summary: 開いていなければ DeliveryError
            condition: open を呼ばずに引数なし
            mock: evdev.UInput
            expected: DeliveryError が送出され、write が呼ばれない
            exception: 開いていない
      - name: close
        title: 仮想キーボードを閉じる
        kind: メソッド
        scope: public
        thread_safe: true
        summary: 仮想キーボードを閉じて _device を None にする。開いていなければ何もしない（2 回呼んでもよい）
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_close
            case: 正常
            summary: 閉じた後は送信できず、2 回目は何もしない
            condition: open の後に close を 2 回呼び、send_enter を呼ぶ
            mock: evdev.UInput・time.sleep
            expected: UInput.close が 1 回だけ呼ばれ、send_enter は DeliveryError を送出する
    refs:
      - dev/設計書/外部ライブラリ/evdev#
    status: planned
functions:
  - name: lower_volume
    title: 音量を下げる
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: public
    inherits: LowerVolumeFn
    thread_safe: true
    side_effects: 既定の再生デバイスのマスター音量を変える
    summary: pycaw で今のマスター音量を読み、割合を掛けた音量へ fade_sec をかけて下げ始める
    args:
      - name: ratio
        type: float
        required: true
        passing: positional
        description: 今の音量に対する割合（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: 下げるのにかける秒数
    returns:
      type: float
      description: 下げる前の音量（0.0〜1.0）
    process: |-
      1. 音量のロックを取り、以降をその中で行う
      2. 進行中のフェードを打ち切る（_cancel_fade）
      3. 打ち切ったフェードがあればその目標の音量を、無ければ既定の再生デバイスのマスター音量（0.0〜1.0）を COM を初期化して読んだ値を、下げる前の音量にする（_open_endpoint_volume）
         - 戻している途中に始まった録音でも、戻しの目標（元の音量）を下げる前の音量にする。下げている途中にもう一度下げることは、Recorder が録音中の開始を断るため起きない
         - pycaw・COM が例外を出した場合、VolumeControlError を送出する（理由に元の例外を残す）
      4. 下げる前の音量 × ratio を 0.0〜1.0 に収め、その音量へ変える（_fade_to）
      5. 下げる前の音量を返す
    exceptions:
      - name: VolumeControlError
        condition: 音量を読むときに pycaw・COM が例外を出した
      - name: VolumeControlError
        condition: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した（_fade_to から伝わる）
    unit_tests:
      - name: test_lower_volume
        case: 正常
        summary: 今の音量を返し、割合を掛けた音量へ書く
        condition: 今の音量 0.8、ratio=0.5・fade_sec=0
        mock: _open_endpoint_volume（音量を持つ偽のインターフェース）
        expected: 0.8 が返り、偽のインターフェースの音量が 0.4 になっている
      - name: test_lower_volume_when_restoring
        case: 正常
        summary: 戻している途中に下げると、戻しの目標の音量を下げる前の音量にする
        condition: 今の音量 0.4 から restore_volume(0.8, 0.5) の直後に lower_volume(0.5, 0) を呼ぶ
        mock: _open_endpoint_volume
        expected: 0.8 が返り、偽のインターフェースの音量が 0.4 で終わり、その後に書き換わらない
      - name: test_lower_volume_when_read_failed
        case: 異常
        summary: 読めなければ VolumeControlError
        condition: GetMasterVolumeLevelScalar が COMError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出され、音量が書かれない
        exception: 音量を読むときに pycaw・COM が例外を出した
      - name: test_lower_volume_when_api_changed
        case: 異常
        summary: pycaw の API が変わって属性が無ければ VolumeControlError
        condition: _open_endpoint_volume が AttributeError を送出する
        mock: _open_endpoint_volume
        expected: VolumeControlError が送出される
        exception: 音量を読むときに pycaw・COM が例外を出した
    connectivity_tests:
      - name: test_ext_lower_volume_when_no_fade
        api: pycaw AudioUtilities.GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar / SetMasterVolumeLevelScalar
        summary: 実機の既定の再生デバイスで、下げる前の音量を返して割合を掛けた音量へ変える
        checks: pycaw で音量を 0.6 にしてから lower_volume(0.5, 0) を呼び、0.6 が返り、pycaw で読んだ音量が 0.3（誤差 0.01 以内）
        cost: 料金なし。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
        notes: 既定の再生デバイスが無い環境では skip する
      - name: test_ext_lower_volume_when_fade
        api: pycaw AudioUtilities.GetSpeakers().EndpointVolume の GetMasterVolumeLevelScalar / SetMasterVolumeLevelScalar
        summary: フェードをかけても割合を掛けた音量に届く（別のスレッドでの COM の初期化を含む）
        checks: 音量 0.6 から lower_volume(0.5, 0.3) を呼び、2 秒以内に pycaw で読んだ音量が 0.3（誤差 0.01 以内）になる
        cost: 料金なし。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
        notes: 既定の再生デバイスが無い環境では skip する
    notes:
      契約テスト: pycaw はバージョンで API が変わるため `==` で固定し、この関数と restore_volume の疎通テストを Windows の実機で回す契約テストにする（品質シナリオ 7。依存のバージョンを上げたら回す）。
    refs:
      - dev/設計書/外部ライブラリ/pycaw#
      - dev/設計書/外部ライブラリ/comtypes#
    status: implemented
  - name: restore_volume
    title: 音量を戻す
    kind: 関数
    container: integrations/volume/adapter.py
    usecase: 録音する
    scope: public
    inherits: RestoreVolumeFn
    thread_safe: true
    side_effects: 既定の再生デバイスのマスター音量を変える
    summary: 下げる前の音量へ fade_sec をかけて戻し始める
    args:
      - name: volume
        type: float
        required: true
        passing: positional
        description: 戻す音量（0.0〜1.0）
      - name: fade_sec
        type: float
        required: true
        passing: positional
        description: 戻すのにかける秒数
    returns:
      type: None
      description: なし
    process: |-
      1. 音量のロックを取り、以降をその中で行う
      2. 進行中のフェードを打ち切る（_cancel_fade。下げている途中のフェードを含む）
      3. volume を 0.0〜1.0 に収め、その音量へ変える（_fade_to）
    exceptions:
      - name: VolumeControlError
        condition: fade_sec が 0 以下で、音量を書くときに pycaw・COM が例外を出した（_fade_to から伝わる）
    unit_tests:
      - name: test_restore_volume_when_lowering
        case: 正常
        summary: 下げている途中でも戻す音量で終わる
        condition: 今の音量 0.8 から lower_volume(0.5, 0.5) の直後に restore_volume(0.8, 0.1) を呼び、1 秒待つ
        mock: _open_endpoint_volume
        expected: 偽のインターフェースの音量が 0.8 で終わり、その後に書き換わらない
    connectivity_tests:
      - name: test_ext_restore_volume_when_no_fade
        api: pycaw AudioUtilities.GetSpeakers().EndpointVolume の SetMasterVolumeLevelScalar
        summary: 実機の既定の再生デバイスで、下げた音量を戻す
        checks: 音量 0.6 から lower_volume(0.5, 0) の後に restore_volume(0.6, 0) を呼び、pycaw で読んだ音量が 0.6（誤差 0.01 以内）
        cost: 料金なし。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
        notes: 既定の再生デバイスが無い環境では skip する
    status: implemented
