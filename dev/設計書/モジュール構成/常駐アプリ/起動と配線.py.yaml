title: "常駐アプリ / 起動と配線"
lead: 常駐サービスの入口。単一インスタンスを確かめ、各 feature と外部連携を関数で配線し（composition root）、API・ホットキー・トレイを立てて画面のイベントループを回す。
directory: |-
  ```
  src/voice_paste/
  ├── __init__.py
  ├── __main__.py              # python -m voice_paste で main() を呼ぶ
  ├── main.py                  # parse_args・build_handlers・build_ui_deps・apply_settings・start_local_session・main
  └── runtime/
      ├── single_instance.py   # 名前付きのミューテックスと終了の依頼（名前付きのイベント）
      ├── settings_store.py    # SettingsStore（動いている間の今の設定）
      ├── process.py           # relaunch（同じ引数で起動し直す）
      └── timer.py             # RepeatingTimer（上限での打ち切りを定期に呼ぶ）
  ```

  リポジトリの直下は `pyproject.toml`・起動のバッチファイル 1 つ・`settings.sample.toml`・`README.md`・`CLAUDE.md`・`src/`・`resources/`・`tests/`・`dev/`・`docs/` に絞る。
diagrams:
  - name: 依存の向き
    diagram: |-
      ```mermaid
      classDiagram
        direction TB
        class 起動と配線
        class APIサーバー
        class ホットキーと画面
        class セッション
        class 録音
        class 文字起こし
        class 補正
        class 出力先
        class 履歴
        class 外部連携
        class 共通
        起動と配線 --> APIサーバー
        起動と配線 --> ホットキーと画面
        起動と配線 --> セッション
        起動と配線 --> 外部連携
        APIサーバー --> セッション : route の集約
        セッション --> 共通
        録音 --> 共通
        文字起こし --> 共通
        補正 --> 共通
        出力先 --> 外部連携
        履歴 --> 共通
        ホットキーと画面 --> 共通
        外部連携 --> 共通
      ```
data_models:
  - name: Handlers
    title: 配線済みの関数の束
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: 入口（API・ホットキー・画面）が使う配線済みのもの
    properties:
      - name: session_manager
        type: SessionManager
        description: セッション管理
      - name: session_api
        type: SessionApiDeps
        description: API サーバーへ渡すセッションの API の依存（設定の許可ホストを部分適用した返送先の確かめを含む）
      - name: settings_store
        type: SettingsStore
        description: 今効いている設定。出力先・録音・画面はここから読むため、保存した immediate の項目が次の回から効く
      - name: start_local_session
        type: Callable[[Entry], None]
        description: ホットキー・トレイの開始（SessionManager と notify を部分適用した start_local_session）
      - name: recorder_level
        type: Callable[[], float]
        description: 録音中の音量（Recorder.level）。録音の画面の波形に使う
      - name: stop_engine
        type: Callable[[], None]
        description: 文字起こしのエンジンを止める（WhisperWorkerClient.stop）。終了時に呼ぶ
    status: implemented
  - name: CliArgs
    title: 起動の引数
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: '`python -m voice_paste` に渡した引数'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: data_dir
        type: Path | None
        description: データの置き場所（`--data-dir`）。設定・履歴・ログ・一時の音声・トークンをこの下に置く
      - name: migrate_env
        type: Path | None
        description: 設定へ移す .env（`--migrate-env`）。渡されたときだけ移す
    status: implemented
functions:
  - name: build_handlers
    title: 配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: public
    summary: 設定からエンジン・録音機・出力先・履歴を組み立て、SessionDeps を作って SessionManager と SessionApiDeps を返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 設定
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: notify
        type: NotifyFn
        required: true
        passing: positional
        description: 画面への知らせ
      - name: report_progress
        type: ProgressFn
        required: true
        passing: positional
        description: 文字起こしの進みの知らせ（ui の report_progress）
    returns:
      type: Handlers
      description: 配線済みの関数の束
    process: |-
      1. 設定を SettingsStore に入れる。以降の配線は設定を値でなく SettingsStore.get から読む（保存した immediate の項目を次の回から効かせる）
      2. 設定のエンジン（local_whisper）の WhisperWorkerClient を作って起動し、その transcribe を文字起こしの engine に渡す
         - EngineError の場合、StartupError を送出する
      3. Recorder に音量のアダプタと、SettingsStore から録音の設定を返す関数を渡す
      4. 出力先の deliver に OUTPUTS と、届けるたびに SettingsStore からオンの出力先の ID を引く関数を部分適用し、Session を入口・出力先・出力先に固有の宛先・返送先に分けて渡すアダプタを作る。各出力先には出力先の ID ごとに次を部分適用する（_wire_outputs に SettingsStore.get を渡す）
         - 貼り付けて送信: copy_to_clipboard・設定の keyboard.paste_key で send_paste を呼ぶ関数・send_enter・time.sleep・設定の enter_delay_sec を返す関数
         - 貼り付けのみ: copy_to_clipboard・send_paste を呼ぶ関数
         - コピーのみ: copy_to_clipboard
         - AI チャットへ送る: copy_to_clipboard・open_app_window・send_paste を呼ぶ関数・send_enter・time.sleep・設定の open_delay_sec を返す関数・貼り付けて送信の enter_delay_sec を返す関数
         - 呼び出し元へ返す: タイムアウトを部分適用した post_json・設定の許可ホスト・再送の回数と間隔の基数・time.sleep・random.uniform(0, x)
      5. 用語集を文字起こしのたびに読み直す correct を作る（load_glossary → apply_glossary。読む場所はそのたびに SettingsStore の glossary_path から決める）
      6. SessionDeps を組み（report_progress を含む）、API のセッションの上限時間と共に SessionManager を作る
      7. SessionManager と、設定の許可ホストを部分適用した is_callback_allowed を SessionApiDeps に束ねる
      8. start_local_session に SessionManager と notify を部分適用する
    exceptions:
      - name: StartupError
        condition: 文字起こしのエンジンを準備できない
    status: implemented
  - name: main
    title: 起動
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 常駐サービスを起動し、終わるまで画面のイベントループを回す
    returns:
      type: int
      description: 終了コード
    process: |-
      1. 起動の引数を読む（parse_args。argv が None なら sys.argv[1:]）
      2. 置き場所を決め、ログを INFO で設定する（resolve_app_paths・setup_logging）
      3. `--migrate-env` が渡されていれば、.env を移して書く（migrate_env・save_settings）
         - settings.toml が既にある場合、1 を返す（書き換えた設定を上書きしない）
           - `[ERROR]` 設定ファイルが既にあるため .env を移さなかった（設定ファイルのパス）
         - SettingsError の場合、1 を返す
           - `[ERROR]` .env を移せなかった（理由）
         - `[INFO]` .env を設定ファイルへ移した（.env のパス・設定ファイルのパス）
      4. QApplication（最後の窓を閉じても終わらない）・UiBridge・Tray を作り、build_stylesheet を当ててトレイに準備中を出す。WAKE_INTERVAL_MS ごとの空の QTimer を置き、SIGINT・SIGBREAK で QApplication.quit を呼ぶ
      5. 設定を読む（load_settings）
         - SettingsError の場合、トレイを失敗にして設定を読めないことを通知し（Tray.show_failure(settings_invalid, 理由)）、「録音を始める」「設定…」を押せないまま 11 へ（フォルダを開いて settings.toml を直し、再起動できる）
           - `[ERROR]` 起動に失敗した（理由）
      6. ルートロガーのレベルを設定のログのレベルにし、保持期間で古いログを消す（purge_old_logs）
         - `[INFO]` 設定を読んだ（設定ファイルのパス・エンジン・オンの出力先の ID）
      7. 配線する（build_handlers。notify と report_progress は UiBridge を部分適用した ui のもの）
         - StartupError の場合、トレイを失敗にして起動の失敗を通知し（Tray.show_failure(engine_unavailable, 理由)）、「設定…」だけを押せるまま 11 へ（設定画面は読んだ設定で開き、保存は settings.toml へ書くだけにする。Handlers が無いため、UiDeps のうち録音・ホットキーの関数（start・pause・resume・complete・cancel・current_session・level・suspend_hotkeys・resume_hotkeys）は何もしない関数にし、設定画面を閉じてもホットキーの受付を始めない）
           - `[ERROR]` 起動に失敗した（理由）
      8. UiController を作り（build_ui_deps）、UiBridge の知らせの受け手につなぐ（9 で待ち受けを始められない知らせを取りこぼさないよう、API より先に作る）
      9. トークンを作り、API サーバーを起動する（create_token・build_fastapi・ApiServerRunner.start(API_START_TIMEOUT_SEC)）
         - True の場合だけ、トークンのファイルを書く（write_token_file）
         - False の場合、トークンのファイルを書かずに api_unavailable を知らせて続ける（ホットキーとトレイからの録音は使える）。理由は「ポート {ポート} で待ち受けを始められません」の 1 文にする
      10. ホットキーの受付を始め（HotkeyListener.start(build_hotkey_bindings(設定))）、上限の打ち切りを RepeatingTimer で SESSION_LIMIT_CHECK_INTERVAL_SEC ごとに呼ぶ（SessionManager.truncate_if_expired）。トレイを待機中にする
         - HotkeyError の場合、ホットキーを受け付けずに続ける（トレイから録音でき、設定画面で直せる）
           - `[ERROR]` ホットキーを受け付けられなかった（理由）
         - `[INFO]` 常駐サービスを始めた（API のポート）
      11. イベントループを回す（exec_loop）
      12. 抜けたら、新しい開始が来ないように入口とタイマー（ホットキー・API サーバー・タイマー）を先に止め、録音を捨て（SessionManager.close）、エンジンを止め、トレイを消す（8 までで立てたものだけ）
          - `[INFO]` 常駐サービスを終えた
      13. 再起動を頼まれていれば、同じ引数で起動し直す（relaunch）
      14. 0 を返す
    status: implemented
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: コマンドの引数。None なら sys.argv[1:]
      - name: exec_loop
        type: Callable[[QApplication], int]
        required: false
        default: QApplication.exec を呼ぶ関数
        passing: keyword
        description: イベントループを回す関数。テストではすぐ抜ける関数を渡す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 設定を読んで API・ホットキー・トレイを立て、イベントループが抜けたら片付けて 0 を返す
        condition: --data-dir に空の一時フォルダ。QT_QPA_PLATFORM=offscreen、exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。{data_dir}/settings.toml が既定値ででき、token_file があり、HotkeyListener.start に既定のホットキーが渡り、HotkeyListener.stop・RepeatingTimer.stop・ApiServerRunner.stop・SessionManager.close・stop_engine・Tray.hide がこの順に 1 回ずつ呼ばれる
      - name: test_main_when_migrate_env
        case: 正常
        summary: .env を移してから読む
        condition: --data-dir に空の一時フォルダ、--migrate-env に WHISPER_MODEL=small の .env。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。settings.toml の transcription.local_whisper.model が small、.env の中身が変わらない
      - name: test_main_when_settings_exists_and_migrate_env
        case: 異常
        summary: 設定ファイルがあれば移さない
        condition: hotkeys.start を変えた settings.toml がある data_dir、--migrate-env に .env
        mock: build_handlers
        expected: 1。settings.toml が変わらず、ERROR のログが 1 行、build_handlers が呼ばれない
        exception: settings.toml が既にある
      - name: test_main_when_invalid_settings
        case: 異常
        summary: 設定が合わなければトレイで知らせて入口を立てない
        condition: transcription.local_whisper.beam_size = "x" の settings.toml がある data_dir。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed と Tray.show_failure(settings_invalid, 理由) が呼ばれ（理由に transcription.local_whisper.beam_size が出る）、ERROR のログに transcription.local_whisper.beam_size が出、build_handlers・ApiServerRunner・HotkeyListener.start が呼ばれない
        exception: SettingsError
      - name: test_main_when_startup_error
        case: 異常
        summary: エンジンを準備できなければトレイを失敗にして続ける
        condition: build_handlers が StartupError を送出する。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed と Tray.show_failure(engine_unavailable) が呼ばれ、ApiServerRunner が作られず、HotkeyListener.start が呼ばれない
        exception: StartupError
      - name: test_main_when_api_unavailable
        case: 正常
        summary: 待ち受けを始められなければトークンのファイルを書かずに知らせて続ける
        condition: 前回の起動の token_file がある data_dir。ApiServerRunner.start が False を返す。exec_loop はイベントを処理してから 0 を返す
        mock: build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray
        expected: 0。token_file が前回の内容のままで、Tray.show_failure に api_unavailable と「ポート {ポート} で待ち受けを始められません」が渡り、HotkeyListener.start が呼ばれる
      - name: test_main_when_restart_requested
        case: 正常
        summary: 再起動を頼まれたら片付けた後に起動し直す
        condition: exec_loop の中で UiDeps.request_restart を呼ぶ
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray・relaunch
        expected: 0。relaunch が ApiServerRunner.stop と stop_engine の後に、同じ argv で 1 回呼ばれる
  - name: acquire_single_instance
    title: 単一インスタンスの確保
    kind: 関数
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 名前付きのミューテックスを取る。取られていれば名前付きのイベントで前のプロセスに終わるよう頼み、解放を待ってから取る
    args:
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 前のプロセスの終わりを待つ上限
    returns:
      type: SingleInstanceLock
      description: 取った排他（終了時に解放する。終了の依頼を待つスレッドも持つ）
    exceptions:
      - name: StartupError
        condition: 上限まで待っても前のプロセスが排他を放さない
    notes:
      強制終了しない: プロセスの番号での強制終了はしない（番号を使い回された無関係なプロセスを止めない）。
    status: planned
  - name: start_local_session
    title: ホットキー・トレイからの開始
    kind: 関数
    container: main.py
    usecase: 録音する
    scope: public
    summary: SessionManager.start を呼び、断られた理由をユーザーへ知らせる。例外を pynput・画面のスレッドへ漏らさない
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: hotkey か tray
      - name: session_manager
        type: SessionManager
        required: true
        passing: injected
        description: セッション管理
      - name: notify
        type: NotifyFn
        required: true
        passing: injected
        description: ユーザーへの知らせ
    returns:
      type: None
      description: なし
    process: |-
      1. SessionManager.start(entry) を呼ぶ
         - SessionBusyError の場合、busy を知らせる（ダイアログ）
         - MicrophoneUnavailableError の場合、microphone_unavailable を知らせる（トレイ）
         - それ以外の例外の場合、ログに書いて握る
           - `[ERROR]` 録音を始められなかった（logger.exception）
    unit_tests:
      - name: test_start_local_session_when_busy
        case: 正常
        summary: 処理中なら busy を知らせる
        condition: start が SessionBusyError を送出する
        mock: session_manager・notify
        expected: notify に busy が渡り、例外が出ない
      - name: test_start_local_session_when_microphone_unavailable
        case: 正常
        summary: マイクを開けなければ microphone_unavailable を知らせる
        condition: start が MicrophoneUnavailableError を送出する
        mock: session_manager・notify
        expected: notify に microphone_unavailable が渡り、例外が出ない
      - name: test_start_local_session_when_unexpected_error
        case: 正常
        summary: 想定外の例外も漏らさない
        condition: start が RuntimeError を送出する
        mock: session_manager・notify
        expected: 例外が出ず、ERROR のログが 1 行出る
    status: implemented
  - name: parse_args
    title: 起動の引数の解釈
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: argparse で `--data-dir` と `--migrate-env` を読む
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: コマンドの引数（プログラム名を除く）
    returns:
      type: CliArgs
      description: 起動の引数
    process: |-
      1. `--data-dir {フォルダ}` と `--migrate-env {ファイル}` を読む
         - 並走の間（起動を切り替える #22 まで）は `--data-dir` を必須にし、普段使いの既定の置き場所へ書かない
         - 知らない引数・`--data-dir` が無い場合、argparse が使い方を出して SystemExit(2) で終わる
    unit_tests:
      - name: test_parse_args
        case: 正常
        summary: データの置き場所だけを読む
        condition: '["--data-dir", "C:/tmp/vp"]'
        mock: なし
        expected: data_dir が Path("C:/tmp/vp")、migrate_env が None
      - name: test_parse_args_when_migrate_env
        case: 正常
        summary: 移す .env も読む
        condition: '["--data-dir", "C:/tmp/vp", "--migrate-env", "C:/repo/.env"]'
        mock: なし
        expected: migrate_env が Path("C:/repo/.env")
      - name: test_parse_args_when_no_data_dir
        case: 異常
        summary: データの置き場所が無ければ終わる
        condition: '[]'
        mock: なし
        expected: SystemExit（code 2）
    status: implemented
  - name: _wire_outputs
    title: 出力先の配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: internal
    summary: OUTPUTS の各出力先の handler に、出力先の ID ごとの外部連携の関数と設定の値を部分適用して返す
    args:
      - name: get_settings
        type: Callable[[], Settings]
        required: true
        passing: positional
        description: 今の設定を返す（keyboard.paste_key・outputs[]・api.allowed_callback_hosts を読む）
    returns:
      type: tuple[OutputSpec, ...]
      description: handler を配線した出力先の一覧（OUTPUTS と同じ並び）
    process: |-
      1. 呼ぶたびに get_settings() を読む関数を作る（Recorder の get_settings と同じく、反映が immediate の設定を届けるたびに読む）
         - paste: keyboard.paste_key で send_paste を呼ぶ
         - get_enter_delay_sec: outputs[] の paste_and_send の enter_delay_sec を返す（一覧に無ければそのモデルの既定値）
         - get_open_delay_sec: outputs[] の ai_chat の open_delay_sec を返す（同上）
      2. OUTPUTS を順に見て、出力先の ID ごとに build_handlers の 3 のとおり部分適用した handler に差し替える
         - 部分適用の対象に無い ID はそのまま残す
         - 呼び出し元へ返すの許可ホストは、この時点の get_settings() から読む
    unit_tests:
      - name: test_wire_outputs
        case: 正常
        summary: 各出力先に設定の値を配線する
        condition: keyboard.paste_key が `<ctrl>+<shift>+v`、paste_and_send の enter_delay_sec が 0.2、ai_chat の open_delay_sec が 1.5
        mock: copy_to_clipboard・send_paste・send_enter・open_app_window・time.sleep
        expected: 返った一覧の ID が OUTPUTS と同じ並びで、paste_and_send の handler を呼ぶと send_paste に `<ctrl>+<shift>+v`、sleep に 0.2 が渡り、ai_chat の handler を呼ぶと sleep に 1.5・0.2 がこの順に渡る
      - name: test_wire_outputs_when_settings_changed
        case: 正常
        summary: 配線の後に変えた設定が次の届け方に効く
        condition: 配線の後に get_settings が返す設定を paste_key `<ctrl>+<alt>+v`・enter_delay_sec 1.0 に差し替える
        mock: copy_to_clipboard・send_paste・send_enter・open_app_window・time.sleep
        expected: paste_and_send の handler を呼ぶと send_paste に `<ctrl>+<alt>+v`、sleep に 1.0 が渡る
    status: implemented
  - name: build_hotkey_bindings
    title: ホットキーの割り当て
    container: main.py
    usecase: 録音する
    summary: 設定のホットキーごとに、押されたときに呼ぶ関数を組む（HotkeyListener.start へ渡す）
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 今の設定
      - name: session_manager
        type: SessionManager
        required: true
        passing: positional
        description: セッション管理
      - name: start_local_session
        type: Callable[[Entry], None]
        required: true
        passing: positional
        description: ホットキー・トレイの開始
    returns:
      type: dict[str, Callable[[], None]]
      description: pynput の書式のホットキー → 呼ぶ関数
    process: |-
      1. `hotkeys.start`: ホットキー・トレイの録音が recording か paused のとき、同じホットキーのオンの出力先があればその出力先で確定し（complete）、無ければ何もしない（自分の録音の最中に処理中のダイアログを出さない）。それ以外（待機中・API の録音の最中・自分の録音の文字起こし中）は start_local_session(hotkey) を呼ぶ
         - `[DEBUG]` 録音中の開始のホットキーを無視した（確定する出力先が無い）
      2. `hotkeys.pause`: paused なら resume、それ以外は pause を呼ぶ
      3. `hotkeys.cancel`: cancel を呼ぶ
      4. オンの出力先の `hotkey`（1 と同じホットキーを除く）: complete(output_id=その出力先の ID) を呼ぶ
      5. オンの AI チャットの送り先の `hotkey`: complete(output_id=ai_chat, output_target=送り先の URL) を呼ぶ
         - 空のホットキーは登録しない（重なりは Settings の確かめが断っている）
    unit_tests:
      - name: test_build_hotkey_bindings_when_idle
        case: 正常
        summary: 待機中の開始のホットキーは録音を始める
        condition: Settings()、current が None、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: start_local_session(hotkey) が 1 回呼ばれ、complete が呼ばれない
      - name: test_build_hotkey_bindings_when_recording
        case: 正常
        summary: 録音中の開始のホットキーは貼り付けて送信で確定する
        condition: Settings()、current が hotkey・recording、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: complete(output_id=paste_and_send) が 1 回呼ばれ、start_local_session が呼ばれない
      - name: test_build_hotkey_bindings_when_ai_chat_target
        case: 正常
        summary: 送り先のホットキーはその URL で確定する
        condition: Settings()、<ctrl>+<alt>+1 の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: complete(output_id=ai_chat, output_target=https://chatgpt.com) が呼ばれる
      - name: test_build_hotkey_bindings_when_paused
        case: 正常
        summary: 一時停止中の一時停止のホットキーは再開する
        condition: current が hotkey・paused、<ctrl>+<alt>+z の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: resume が 1 回呼ばれ、pause が呼ばれない
      - name: test_build_hotkey_bindings_when_output_disabled
        case: 正常
        summary: オフの出力先のホットキーは登録しない
        condition: コピーのみをオフにした設定
        mock: session_manager・start_local_session
        expected: <ctrl>+<alt>+c が返り値のキーに無い
      - name: test_build_hotkey_bindings_when_recording_without_confirm_output
        case: 正常
        summary: 貼り付けて送信がオフなら、録音中の開始のホットキーは何もしない
        condition: 貼り付けて送信をオフにした設定、current が hotkey・recording、<ctrl>+<alt>+d の関数を呼ぶ
        mock: session_manager・start_local_session
        expected: start_local_session も complete も呼ばれない
    refs:
      - dev/設計書/シナリオ/単一ユースケース/録音する#
    status: implemented
  - name: apply_settings
    title: 設定の保存と反映
    container: main.py
    usecase: 設定を変える
    summary: 設定画面で確かめた設定を settings.toml へ書き、反映が immediate の項目を動いている常駐アプリに効かせる（UiDeps.save_settings）
    kind: 関数
    scope: public
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 保存する設定
      - name: settings_file
        type: Path
        required: true
        passing: injected
        description: settings.toml
      - name: store
        type: SettingsStore
        required: true
        passing: injected
        description: 今の設定
      - name: check_hotkeys
        type: Callable[[Iterable[str]], None]
        required: true
        passing: injected
        description: ホットキーを受け付けられるかの確かめ（validate_hotkeys）
    returns:
      type: bool
      description: 再起動が要る項目が変わったか
    process: |-
      1. 新しい設定で受け付けるホットキー（build_hotkey_bindings のキー）を check_hotkeys で確かめる
         - HotkeyError の場合、何も書かず入れ替えずにそのまま送出する（設定画面がエラーの一覧に出す）
      2. settings.toml へ書く（save_settings）
      3. SettingsStore を入れ替える（出力先のオン・オフ・録音・用語集・`ui.*` は次の回から新しい値で動く。ホットキーは設定画面が閉じたときに resume_hotkeys がこの設定で張り直す）
         - `[INFO]` 設定を保存した（設定ファイルのパス・再起動が要るか）
    exceptions:
      - name: HotkeyError
        condition: 新しい設定のホットキーを pynput が読めない（何も書かない）
      - name: OSError
        condition: settings.toml を書けない（SettingsStore は入れ替えない）
    unit_tests:
      - name: test_apply_settings
        case: 正常
        summary: 確かめてから書いて入れ替える
        condition: 一時フォルダの settings.toml、コピーのみをオフにした設定
        mock: check_hotkeys
        expected: False。check_hotkeys に <ctrl>+<alt>+c を含まないホットキーが渡り、settings.toml のコピーのみの enabled が false、store.get() が渡した設定
      - name: test_apply_settings_when_restart_item_changed
        case: 正常
        summary: 再起動が要る項目の変更を返す
        condition: transcription.local_whisper.model を small にした設定
        mock: check_hotkeys
        expected: 'True'
      - name: test_apply_settings_when_hotkey_unavailable
        case: 異常
        summary: 受け付けられないホットキーなら何も書かない
        condition: check_hotkeys が HotkeyError を送出する
        mock: check_hotkeys
        expected: HotkeyError が送出され、settings.toml が変わらず、store.get() が前の設定のまま
        exception: ホットキーを受け付けられない
    refs:
      - dev/設計書/シナリオ/単一ユースケース/設定を変える#
    status: implemented
  - name: build_ui_deps
    title: 画面の配線
    container: main.py
    usecase: 共通
    summary: Handlers と置き場所から、画面・トレイが呼ぶ UiDeps を組む
    kind: 関数
    scope: public
    args:
      - name: handlers
        type: Handlers
        required: true
        passing: positional
        description: 配線済みの関数
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: save_settings
        type: Callable[[Settings], bool]
        required: true
        passing: positional
        description: apply_settings を部分適用したもの
      - name: request_restart
        type: Callable[[], None]
        required: true
        passing: positional
        description: 再起動を記録してイベントループを抜ける
      - name: request_quit
        type: Callable[[], None]
        required: true
        passing: positional
        description: QApplication.quit
      - name: hotkey_listener
        type: HotkeyListener
        required: true
        passing: positional
        description: ホットキーの受付（設定画面の間は止める）
    returns:
      type: UiDeps
      description: 画面の依存
    process: |-
      1. start に start_local_session(tray)、pause・resume・cancel・current_session に SessionManager のメソッド、complete に output_id・output_target で SessionManager.complete を呼ぶ関数、level に recorder_level、get_settings に SettingsStore.get を渡す
      2. suspend_hotkeys に HotkeyListener.stop、resume_hotkeys に SettingsStore.get の設定で build_hotkey_bindings して HotkeyListener.start を呼ぶ関数を渡す
      3. settings_dir に settings.toml のフォルダ、log_dir にログのフォルダを渡す
    status: implemented
  - name: relaunch
    title: 起動し直し
    container: runtime/process.py
    usecase: トレイから操作する
    summary: 同じ Python と引数で `python -m voice_paste` を切り離したプロセスとして起動する。片付けを終えた後に呼ぶ（API のポートとエンジンを放してから次を立てる）
    kind: 関数
    scope: public
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: 起動の引数（プログラム名を除く）
    returns:
      type: None
      description: なし
    process: |-
      1. `subprocess.Popen([sys.executable, "-m", "voice_paste", *argv], creationflags=DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP, close_fds=True)` で起動する
         - OSError の場合、ログに書いて握る（終わり方は変えない）
           - `[ERROR]` 起動し直せなかった（logger.exception）
         - `[INFO]` 起動し直した（引数）
    unit_tests:
      - name: test_relaunch
        case: 正常
        summary: 同じ引数で切り離して起動する
        condition: argv=["--data-dir", "C:/tmp/vp"]
        mock: subprocess.Popen
        expected: Popen に [sys.executable, "-m", "voice_paste", "--data-dir", "C:/tmp/vp"] と DETACHED_PROCESS が渡る
      - name: test_relaunch_when_failed
        case: 異常
        summary: 起動できなくても例外を漏らさない
        condition: Popen が OSError を送出する
        mock: subprocess.Popen
        expected: 例外が出ず、ERROR のログが 1 行出る
        exception: 起動できない
    status: implemented
notes:
  依存の向き: |-
    コーディング規約『依存関係管理』のとおり `features`・`server`・`ui` → `integrations`・`runtime` → `shared` とし、上の層へは import しない。
    `features` どうしと、`features/outputs` の出力先どうしも import しない。セッションはほかの feature を SessionDeps の関数型で受け取り、`main.py` だけが全てを知る。
    `server` はセッションの route を include_router で集め、SessionApiDeps を app.state に置くためだけに `features/session` を import する。route は `main.py`・`server` を import せず、SessionApiDeps を app.state から受け取る。
    `ui` は `features` の中を直に呼ばず、UiDeps の関数と `shared` の設定のモデルだけを使う。型としては `features.session.types`（Session・SessionState）だけを import する。`runtime/hotkey.py` はセッションを import せず、`main.py` が渡す関数を呼ぶ。
  依存の向きの検査: |-
    import-linter の契約を pyproject.toml の `[tool.importlinter]`（root_package は `voice_paste`）に置き、単体テストと一緒に `lint-imports` で回す（品質シナリオ 5。コマンドは設計書『テスト実行方法』）。

    | 契約 | 種類 | 中身 |
    | --- | --- | --- |
    | 層 | layers | `voice_paste.main` → `voice_paste.server` \| `voice_paste.ui` → `voice_paste.features` → `voice_paste.integrations` \| `voice_paste.runtime` → `voice_paste.shared`（`\|` で並べた層どうしも import しない） |
    | feature の独立 | independence | `voice_paste.features.*` |
    | 出力先の独立 | independence | `voice_paste.features.outputs.*`。ignore_imports で `voice_paste.features.outputs.registry -> voice_paste.features.outputs.*`・`voice_paste.features.outputs.service -> voice_paste.features.outputs.registry`・`voice_paste.features.outputs.** -> voice_paste.features.outputs.types` を除く |
    | 画面から feature の中へ | forbidden | source_modules は `voice_paste.ui`、forbidden_modules は `voice_paste.features`・`voice_paste.integrations`。ignore_imports で `voice_paste.ui.** -> voice_paste.features.session.types` を除く |

    出力先を足すときは `features/outputs/` にサブフォルダを足すだけで契約の対象に入り、契約は直さない。
classes:
  - name: RepeatingTimer
    title: 定期の呼び出し
    container: runtime/timer.py
    usecase: APIで録音を操作する
    role: ランタイム
    kind: クラス
    summary: 渡された関数を専用のデーモンスレッドで一定の間隔ごとに呼ぶ
    description: |-
      終わりの合図を threading.Event で持ち、Event.wait(間隔) で待つ。
      呼んだ関数が例外を出してもスレッドを止めず、logger.exception で残して次の回を待つ（上限での打ち切りが 1 回の失敗で止まらない）。
    properties:
      - name: _action
        type: Callable[[], object]
        access: 内部 (_)
        description: 呼ぶ関数
      - name: _interval_sec
        type: float
        access: 内部 (_)
        description: 呼ぶ間隔
      - name: _stopped
        type: threading.Event
        access: 内部 (_)
        description: 終わりの合図
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: 呼び出しのスレッド。start の前は None
    methods:
      - name: start
        title: 開始
        kind: メソッド
        scope: public
        summary: スレッドを始め、間隔ごとに関数を呼ぶ
        returns:
          type: None
          description: なし
        process: |-
          1. デーモンスレッドで、終わりの合図が立つまで「間隔だけ待つ → 関数を呼ぶ」を繰り返す
             - 関数が例外を出した場合、次の回を待つ
               - `[ERROR]` 定期の呼び出しで想定外の例外（logger.exception）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 間隔ごとに呼ぶ
            condition: 間隔 0.01 秒で始め、呼ばれた回数が 3 になるまで待つ
            mock: 呼ぶ関数
            expected: 1 秒以内に 3 回呼ばれる
          - name: test_start_when_action_raised
            case: 正常
            summary: 例外でも止まらない
            condition: 呼ぶ関数が 1 回目だけ RuntimeError を送出する
            mock: 呼ぶ関数
            expected: 2 回目以降も呼ばれ、ERROR のログが 1 行出る
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: 終わりの合図を立て、スレッドの終わりを待つ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めた後は呼ばない
            condition: start の後に stop を呼び、間隔の 5 倍待つ
            mock: 呼ぶ関数
            expected: stop の後に呼ばれた回数が増えず、スレッドが終わっている
    status: implemented
  - name: SettingsStore
    title: 今の設定
    container: runtime/settings_store.py
    usecase: 設定を変える
    role: ランタイム
    summary: 動いている間の今の設定を 1 つ持ち、設定画面で保存した設定に入れ替える
    description: 出力先・録音・用語集・画面は設定を値で持たず、使うたびに get で読む。Settings は不変として扱い、入れ替えるだけにする。
    kind: クラス
    properties:
      - name: _settings
        type: Settings
        access: 内部 (_)
        description: 今の設定
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: 入れ替えと読み出しを 1 つずつにする
    methods:
      - name: get
        title: 読む
        summary: 今の設定を返す
        kind: メソッド
        scope: public
        thread_safe: true
        returns:
          type: Settings
          description: 今の設定
      - name: replace
        title: 入れ替える
        summary: 今の設定を入れ替える
        kind: メソッド
        scope: public
        thread_safe: true
        args:
          - name: settings
            type: Settings
            required: true
            passing: positional
            description: 新しい設定
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_replace
            case: 正常
            summary: 入れ替えた設定を読める
            condition: Settings() で作り、recording.volume_percent=30 の設定に replace する
            mock: なし
            expected: get().recording.volume_percent が 30
    status: implemented
constants:
  - name: API_START_TIMEOUT_SEC
    title: API の待ち受けの始まりを待つ秒数
    container: main.py
    usecase: 常駐アプリを起動する
    summary: ApiServerRunner.start が started を待つ上限。uvicorn の起動の実測が無いため仮に置き、結合テストで起動にかかる時間を測って p99.9 + 50% に直す
    value: '5.0'
    status: implemented
  - name: SESSION_LIMIT_CHECK_INTERVAL_SEC
    title: 上限での打ち切りを確かめる間隔
    container: main.py
    usecase: APIで録音を操作する
    summary: RepeatingTimer が truncate_if_expired を呼ぶ間隔。打ち切りの遅れはこの間隔までで、API のセッションの上限時間（600 秒）に対して無視できる 1 秒にする
    value: '1.0'
    status: implemented
  - name: API_SESSION_LIMIT_SEC
    title: API のセッションの上限時間
    container: main.py
    usecase: APIで録音を操作する
    summary: SessionManager へ渡す上限時間。非機能要件の API のセッションの上限時間の決定値
    value: '600'
    status: implemented
  - name: CALLBACK_TIMEOUT_SEC
    title: 返送のタイムアウト
    container: main.py
    usecase: 起こした文字を届ける
    summary: post_json へ渡す 1 回の POST のタイムアウト。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.5'
    status: implemented
  - name: CALLBACK_RETRY_COUNT
    title: 返送の再送回数
    container: main.py
    usecase: 起こした文字を届ける
    summary: 最初の 1 回の後に再送する回数。非機能要件の返送のタイムアウトと再送の決定値
    value: '3'
    status: implemented
  - name: CALLBACK_RETRY_BASE_SEC
    title: 返送の再送の間隔の基数
    container: main.py
    usecase: 起こした文字を届ける
    summary: 再送の間隔の基数（回ごとに 2 倍にし、フルジッターをかける）。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.0'
    status: implemented
  - name: WAKE_INTERVAL_MS
    title: Python へ戻る間隔
    container: main.py
    usecase: 常駐アプリを起動する
    summary: Qt のイベントループの中で Python のシグナルのハンドラが動くようにする空の QTimer の間隔。PoC で 200 ms なら Ctrl+Break から 0.3 秒で終わった
    value: '200'
    status: implemented
