        condition: outputs に id = ai_chat と送信先 2 件を書いた settings_file を load_settings で読み、outputs と presets を変えずに recording.fade_sec だけを変えて書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルの outputs に ai_chat が無く、presets に同じ title・url・hotkey・enabled の kind = browser が 2 件あり、preset_options.browser.open_delay_sec が読み替えた値
      - name: test_save_settings_when_glossaries
