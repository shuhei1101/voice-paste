id: MOD-35
title: 常駐アプリ / ホットキーと画面 / transcribing_indicator.py
test_files:
  - tests/unit/voice_paste/ui/windows/test_transcribing_indicator.py
classes:
  - name: TranscribingIndicator
    title: 文字起こし中の表示
    container: ui/windows/transcribing_indicator.py
    usecase: 録音を文字に起こす
    role: 画面
    summary: 確定から届けるまで、経過と残りの時間・進みをフォーカスを取らずに出す
    description: |
      要素は画面設計「文字起こし中の表示」が持つ。窓は `Qt.Tool | Qt.FramelessWindowHint | Qt.WindowDoesNotAcceptFocus` と `WA_ShowWithoutActivating` で出す。窓の外側の枠の role は `window` にし、縁を frame で描かせる。
      `WindowDoesNotAcceptFocus` のため、切り替えのボタンを押しても見出しの行をつかんでも窓は前面にならず、貼り付け先の入力欄のフォーカスはそのまま残る（前面を戻す処理は持たない）。
      見出しの行・ドラッグのハンドル・名前の下にホットキーを出すボタンは、録音の画面と同じ部品（window_parts.py の HeadRow・GripIcon・HotkeyButton。recording_window.py から移す）を使う。見出しの行を押したまま動かすと `QWindow.startSystemMove` で窓を動かす。
      切り替えのボタンは、設定でオンの固定の出力先（`outputs[]` の並び。名前は UiDeps.output_titles、ホットキーは format_hotkey で整えた `outputs[].hotkey`）ごとに open で組み直す。`ui.transcribing_show_hotkeys` がオフのときはホットキーを空で渡し、名前だけを出す（録音の画面の `ui.show_hotkeys` は見ない）。今の出力先でないボタンを押すと output_selected を emit する（差し替えるのは UiController。マーカーは output_changed の知らせを受けて set_output で替える）。
      切り替えのボタンは、`ui.transcribing_show_hotkeys` のどちらでも等しい幅で並べる。全てのボタンを同じ固定の幅（setFixedWidth）にし、行の右に stretch を 1 つ置く。組み直したときは、固定の幅をボタンの sizeHint の幅のうち最も大きい値にする（前の回の窓の幅を引き継がず、窓の最小の幅はその幅のボタンの行と SWITCH_WINDOW_WIDTH_PX から決まる）。窓の resizeEvent と、レイアウトの組み直し（QEvent.LayoutRequest。最初に表示を出した回は resizeEvent の時点で行に幅が割り当てられていない）のたびに、「（行の幅（切り替えのボタンの行のレイアウトに割り当てられた幅。テーマの枠の線と余白を除いた幅） − 間隔 ×（ボタンの数 − 1））÷ ボタンの数」の切り捨てと、その最も大きい値の、大きい方に取り直す（割り切れない数 px だけが行の右の stretch に残る）。
      切り替えのボタンは、右と上にマーカーがはみ出す分の余白を枠の外に取り、選んだときの丸いマーカーを枠の右上の角からその余白へはみ出して描く。名前とホットキーの文字の範囲にはマーカーを重ねない。
      残りの時間は、進み（区間の終わり ÷ 録音の長さ）と経過から「経過 ÷ 進み − 経過」で見積もる。UiDeps.reports_progress が False なら、進みが届かないため、open で「残りを計っています」を出さず「経過 {秒}」だけを出す。
      コンストラクタは UiDeps と、経過を数える時計 clock（秒を返す関数。既定は time.monotonic）を受ける。
    kind: クラス
    inherits: PySide6.QtWidgets.QWidget
    methods:
      - name: open
        title: 表示を出す
        summary: 経過を 0 にして進みを隠し、出力先の並び（かプリセットの名前）と貼り付けの案内を組み直して出す。at を渡されたらその座標（その回に動かした録音の画面の位置）に、渡されなければ設定の位置（place_window）に出す
        kind: メソッド
        scope: public
        args:
          - name: at
            type: QPoint | None
            required: false
            default: None
            passing: keyword
            description: 出す左上の座標（その回に動かした録音の画面の位置）
          - name: output_id
            type: str | None
            required: false
            default: None
            passing: keyword
            description: 確定で選んだ固定の出力先の ID。この出力先のボタンにマーカーを付け、貼り付けの案内をその出力先の文にする
          - name: preset_title
            type: str | None
            required: false
            default: None
            passing: keyword
            description: カスタムプリセットで確定したときのそのタイトル。渡されたら切り替えのボタンと貼り付けの案内を出さず、プリセットの名前だけを出す
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_open_when_window_role
            case: 正常
            summary: 窓の外側の枠の role が window
            condition: open する。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: 外側の枠の property("role") が window
          - name: test_open_when_preset
            case: 正常
            summary: カスタムプリセットで確定したときは名前だけを出す
            condition: open(preset_title="ChatGPT") する。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: preset_label が ChatGPT、switch_button_* が 1 つも表示されず、paste_hint が表示されない
          - name: test_open_when_switch_buttons_same_width
            case: 正常
            summary: 切り替えのボタンを、名前の最も長いボタンが収まる同じ固定の幅にする
            condition: 名前の長さの違う paste_and_send・paste_only・copy_only をオンにして open し、窓を minimumSizeHint の幅にする。`ui.transcribing_show_hotkeys` が true と false の両方。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: switch_button_* の minimumWidth と maximumWidth が全て同じ値で、その値が各ボタンの sizeHint の幅の最大以上
          - name: test_open_when_window_widened
            case: 正常
            summary: 窓を広げても切り替えのボタンの幅が全て同じで、行からはみ出さない
            condition: paste_and_send・paste_only・copy_only をオンにした回と、paste_only・copy_only だけをオンにした回で open し、窓を minimumSizeHint の幅から 1 px・2 px・3 px・4 px 広げる。`ui.transcribing_show_hotkeys` が true と false の両方。テーマを当てない回と apply_theme(light) を当てた回の両方。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: どの幅でも switch_button_* の width() が全て同じ値で、最後のボタンの右端が行の右端を超えず、最後のボタンの右に残る空きがボタンの数より小さい px
          - name: test_open_when_previous_window_wide
            case: 正常
            summary: 前の回の広い窓の幅を引き継がず、切り替えのボタンを名前の最も長いボタンの幅で並べる
            condition: paste_and_send・paste_only・copy_only をオンにして open し、窓を 800 px に広げてから、もう一度 open して窓を minimumSizeHint の幅にする。`ui.transcribing_show_hotkeys` が true と false の両方。テーマを当てない回と apply_theme(light) を当てた回の両方。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: switch_button_* の width() が全て、各ボタンの sizeHint の幅の最大と等しく、最後のボタンの右端が行の右端を超えない
          - name: test_open_when_reopened
            case: 正常
            summary: 開き直しても窓の幅が広がらない
            condition: apply_theme(light) を当て、paste_and_send・paste_only・copy_only をオンにした回と、paste_only・copy_only だけをオンにした回で、open(at=座標) してから close_window して open(at=座標) することを 3 回繰り返す。`ui.transcribing_show_hotkeys` が true と false の両方。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: 開き直した後の窓の width() がどの回も最初に開いた幅と同じで、最後のボタンの右端が行の右端を超えない
          - name: test_open_when_progress_not_reported
            case: 正常
            summary: 進みを知らせないエンジンのときは経過だけを出す
            condition: UiDeps.reports_progress を False にし、設定の transcription.engine は local_whisper のままで open し、経過 1.4 秒で時間の文字を書き換える。QT_QPA_PLATFORM=offscreen
            mock: UiDeps・経過を返す時計
            expected: 経過と残りの時間が「経過 1.4 秒」で、進みのバーが表示されない
      - name: set_progress
        title: 進みの反映
        summary: 進みのバーと残りの時間を書き換える
        kind: メソッド
        scope: public
        args:
          - name: position_sec
            type: float
            required: true
            passing: positional
            description: 起こし終えた区間の終わりの時刻
          - name: duration_sec
            type: float
            required: true
            passing: positional
            description: 録音の長さ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_set_progress
            case: 正常
            summary: 進みと残りを出す
            condition: 経過 3.0 秒のときに set_progress(3.1, 5.0)
            mock: 経過を返す時計
            expected: 進みのバーが 62、経過と残りの時間が「経過 3.0 秒 残り 2 秒 / 5 秒」
      - name: close_window
        title: 表示を閉じる
        summary: タイマーを止めて窓を隠す
        kind: メソッド
        scope: public
        returns:
          type: None
          description: なし
      - name: set_output
        title: 今の出力先の反映
        kind: メソッド
        scope: public
        summary: 切り替えのボタンのマーカーと貼り付けの案内を、渡された出力先に替える
        args:
          - name: output_id
            type: str
            required: true
            passing: positional
            description: 切り替えた先の出力先の ID
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_set_output
            case: 正常
            summary: マーカーと案内を切り替えた先に替える
            condition: paste_and_send・paste_only・copy_only をオンにして open(output_id="paste_and_send") した後、set_output("copy_only")。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: switch_button_copy_only だけが選んだ状態で、paste_hint が「起こした文字をクリップボードにコピーします」
          - name: test_set_output_badge_clear_of_text
            case: 正常
            summary: 選んだボタンの丸いマーカーが名前とホットキーの文字に重ならない
            condition: paste_and_send・paste_only・copy_only をオンにして open した後、各出力先へ set_output する。`ui.transcribing_show_hotkeys` が true と false の両方。QT_QPA_PLATFORM=offscreen
            mock: UiDeps
            expected: 選んだボタンごとに、丸いマーカーの範囲が名前のラベルの文字の範囲（QFontMetrics で求めた文字の幅をラベルの配置でボタンの座標へ移したもの）とも、ホットキーのラベルの範囲とも交わらない
        status: planned
        introduced:
          pr: 108
    refs:
      - SCR-7#
    status: implemented
    properties:
      - name: output_selected
        type: Signal(str)
        description: 今の出力先でない切り替えのボタンが押された（押したボタンの出力先の ID）
