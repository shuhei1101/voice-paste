scope_out:
  - item: シナリオの `test_file`（tests/e2e/ を指す）の削除・書き換え
    reason: 'D-311 で、作り直すときの対応の印として残すと決まった。スキーマは `x-test-file-optional: true` で、ファイルが無くても点検は止まらない見込み（実装で validate を流して確かめる）'
    plan: none
  - item: tests/conftest.py のオプション `--run-e2e` の改名
    reason: 実機の非機能要件テスト（tests/nfr/）が前提にしており、改名は E2E の削除と目的が別。名前はそのまま、help の文言の E2E だけを外す。E2E を作り直すときにまた使用する
    plan: none
  - item: dev/テンプレート/ のシナリオ・テスト実行方法のスキーマの E2E の記述
    reason: AI Monitor の配布物で、このリポジトリでは書き換えない（配布元の変更は shuhei1101/ai-monitor#3317 の側で扱う）
    plan: none
  - item: 分類『APIサーバー』・外部ライブラリ『pyside6-essentials』の「E2E で確かめる」の記述
    reason: 作り直す E2E で確かめることを書いた設計の記述と、過去の検証の記録で、今ある E2E のファイルを指していない
    plan: none
  - item: docs/はじめに/変更履歴.md と過去の dev/pr/ の E2E のログ・記述
    reason: 過去の記録で、書き換えると履歴が崩れる
    plan: none
  - item: 開発コマンド『管理作業』の仮想マイクと tests/support/feed_mic.py
    reason: VM で手で録音を確かめる管理作業が使用し、E2E だけの部品ではないため残す
    plan: none
