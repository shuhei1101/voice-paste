id: MOD-82
visibility: internal
title: 常駐アプリ / 文字起こし / types.py
enums:
  - name: EngineName
    title: エンジンの種類
    container: features/transcription/types.py
    usecase: 録音を文字に起こす
    summary: 設定で選ぶ文字起こしのエンジン
    values:
      - value: local_whisper
        title: ローカルの Whisper
        description: 文字起こしワーカーの子プロセスで起こす
      - value: openai
        title: OpenAI API
        description: OpenAI API の文字起こしのエンドポイントへ送信して起こす（文字起こしワーカーを起動しない）
      - value: haas
        title: Haas
        description: WSL の中の Haas の文字起こしのサーバーへ HTTP で送信して起こす（文字起こしワーカーを起動しない）
    status: implemented
function_types:
  - name: EngineFn
    title: エンジン
    container: features/transcription/types.py
    usecase: 録音を文字に起こす
    summary: 1 つのエンジンで録音を起こす。エンジンを 1 つ追加するときはこの型の実装を追加して main.py で登録する
    args:
      - name: audio_path
        type: Path
        description: 録音の WAV
      - name: on_progress
        type: Callable[[float, float], None] | None
        description: 経過秒と録音の長さ
      - name: hint
        type: str | None
        description: 文字起こしの手がかり（有効な表記のヒントの語を読点でつないだもの）。None なら手がかりを渡さずに起こす。キーワード引数で、省いたら None
    returns:
      type: list[str]
      description: 区間ごとの文字
    implementations:
      - target: 外部連携の WhisperWorkerClient.transcribe
        notes: エンジンが local_whisper のとき
      - target: 外部連携の OpenAITranscriber.transcribe
        notes: エンジンが openai のとき。on_progress を呼ばない（OpenAI API は途中の進みを返さない）
      - target: 外部連携の HaasTranscriber.transcribe
        notes: エンジンが haas のとき。on_progress を呼ばず（サーバーは途中の進みを返さない）、hint を使わない（表記と読みの組を get_vocabulary で読む）
    status: implemented
