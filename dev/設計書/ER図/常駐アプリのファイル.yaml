title: "ER 図: 常駐アプリのファイル"
lead: 常駐アプリが書き出して持つファイル（履歴・一時の音声・トークン・ログ）。データベースは持たない。`%LOCALAPPDATA%\voice-paste\` を基準にし、名前の先頭に置き場を書く。
tables:
  - name: '%LOCALAPPDATA%\voice-paste\history\{YYYYMMDD}\{YYYYMMDDHHMMSS}_{session_id}.wav'
    title: 録音の履歴
    datastore: ファイル（WAV）
    summary: 確定した録音。文字起こしより先に書き、文字起こしに失敗しても結果が空でも残る
    growth: 録音を確定するたびに 1 つ増える（`history.enabled = true` のとき）。連続録音では区間を区切るたびに 1 つ増える
    retention: '`history.retention_days` 日（日付のフォルダごと削除する）'
    deletion: 物理削除（起動時と、常駐中は非機能要件の削除の間隔ごと）
    columns:
      - name: sample_rate
        title: サンプリングレート
        type: number
        description: 録音のサンプルレート（Hz）
      - name: channels
        title: チャンネル数
        type: number
        description: 1（モノラル）
      - name: samples
        title: 音
        type: array
        description: 16 ビット整数の音（一時停止の間の音は含まない）
    description: 連続録音の区間は、同じセッションの区間を分けるためにファイル名の末尾へ通し番号を付ける（`{YYYYMMDDHHMMSS}_{session_id}_{通し番号}.wav`。日時は区間を区切った時刻）。
  - name: '%LOCALAPPDATA%\voice-paste\history\{YYYYMMDD}\{YYYYMMDDHHMMSS}_{session_id}.txt'
    title: 起こした文字の履歴
    datastore: ファイル（テキスト、UTF-8）
    summary: 起こした文字（用語集で補正した後）。同じ名前の録音の履歴と対になる
    growth: 文字起こしを終えるたびに 1 つ増える（結果が空でも書く。失敗した回は無い）
    retention: '`history.retention_days` 日（日付のフォルダごと削除する）'
    deletion: 物理削除（録音の履歴と同じ）
    columns:
      - name: text
        title: 起こした文字
        type: string
        description: 区間ごとに改行で区切った文字
    description: 連続録音の区間は、区間の録音と同じ名前（`{YYYYMMDDHHMMSS}_{session_id}_{通し番号}.txt`）に書く。
  - name: '%LOCALAPPDATA%\voice-paste\tmp\{session_id}.wav'
    title: 一時の音声
    datastore: ファイル（WAV）
    summary: 履歴を残さない設定のときに、確定した録音を文字に起こすまで置く
    growth: 録音を確定するたびに 1 つ増える（`history.enabled = false` のとき）
    retention: そのセッションの確定後の流れが終わるまで（文字起こしに失敗しても結果が空でも、終わったら削除する）
    deletion: 物理削除（確定後の流れの最後に一時の音声の削除で取り除く。常駐が落ちた・削除できなかったときの取り残しは、古い履歴の削除が処理中のセッションのものを除いて取り除く）
    columns:
      - name: sample_rate
        title: サンプリングレート
        type: number
        description: 録音のサンプルレート（Hz）
      - name: channels
        title: チャンネル数
        type: number
        description: 1（モノラル）
      - name: samples
        title: 音
        type: array
        description: 16 ビット整数の音
  - name: '%LOCALAPPDATA%\voice-paste\api_token'
    title: API のトークンのファイル
    datastore: JSON
    summary: 起動ごとに作る API のトークンと待ち受けのポート。同じユーザーのほかのプロセスが読んで API を呼ぶ
    scale: 1 件
    growth: 増えない（起動のたびに上書きする）
    retention: 次の起動まで
    deletion: 消さない（次の起動で上書きする。古いトークンは照合で 401 になる）
    access: 全件（呼び出し元が丸ごと読む）
    description: |-
      置き場所は `shared/constants.py` の `token_file`（`--data-dir` を渡したときはその下の `api_token`）。
      同じフォルダの一時ファイルに書いてから置き換えるため、読む側が書きかけを読むことはない。
    columns:
      - name: port
        title: ポート
        type: number
        not_null: true
        description: API を待ち受けている 127.0.0.1 のポート（設定の api.port）
      - name: token
        title: トークン
        type: string
        not_null: true
        description: '今回の起動のトークン。`Authorization: Bearer {トークン}` で付ける'
  - name: '%LOCALAPPDATA%\voice-paste\log\{YYYY-MM-DD}.log'
    title: アプリのログ
    datastore: ファイル（テキスト、UTF-8）
    summary: 日付ごとに追記するアプリのログ（文字起こしワーカーの標準エラーも転送する）
    growth: 日付が変わるたびに 1 つ増える
    retention: '`logging.retention_days` 日'
    deletion: 物理削除（起動時と、常駐中は非機能要件の削除の間隔ごと。`YYYY-MM-DD.log` の名前のファイルだけを削除する）
    columns:
      - name: ts
        title: 日時
        type: string
        description: ローカルの時刻（UTC オフセット付きの ISO 8601）
      - name: level
        title: レベル
        type: string
        description: ログのレベル
      - name: name
        title: ロガー名
        type: string
        description: 書いたロガーの名前
      - name: msg
        title: 本文
        type: string
        description: ログの本文
      - name: exc
        title: 例外
        type: string
        description: 例外のスタックトレース（例外があるときだけ）
    description: 1 行 1 JSON で書く。
  - name: '%LOCALAPPDATA%\voice-paste\log\worker_crash.log ほか'
    title: クラッシュと起動の記録
    datastore: ファイル（テキスト）
    summary: 文字起こしワーカーのネイティブのクラッシュのスタック（`worker_crash.log`）と、起動のバッチファイルの記録（`launcher.log`。import の確かめの結果と `uv sync --frozen` の出力を含む）
    growth: worker_crash.log は追記、launcher.log は起動ごとに上書きする
    retention: 消さない（日付の名前を持たないため、ログの保持期間の削除の対象にならない）
    columns:
      - name: line
        title: 記録の行
        type: string
        description: スタックトレースや起動の手順の行
  - name: '%APPDATA%\voice-paste\glossaries\glossary_{n}.csv'
    title: 用語集の CSV
    datastore: ファイル（CSV、UTF-8。BOM はあり・なしの両方を読み、書くときはあり）
    summary: 用語集 1 つの行（誤変換・正しい表記・補正に使うか）。1 行目は列名の見出し
    growth: 設定画面で用語集を追加して保存するたびに 1 つ増える。n は 1 からの連番で、フォルダに残っているファイルの番号は使わない
    retention: 期限なし
    deletion: 削除しない（設定画面の一覧から用語集を削除しても、ファイルは残す）
    access: 全件。補正は録音を確定するたびに、補正に使う用語集の CSV を再読み込みす
    description: |-
      用語集ごとの場所は設定の `glossaries[].path` が持つ。設定画面で追加した用語集はこの名前で作り、今までの用語集（`glossary_path`。キーが無ければ settings.toml と同じフォルダの `yogo.csv`）も同じ列で読む。
      手で書いた CSV は列 `使う` が無くても読める。設定画面でその用語集の行を変えて保存すると、3 つの列だけの CSV に書き換える（ほかの列と、誤変換と正しい表記の両方が空の行は残らない）。行を変えていない用語集の CSV は書き換えない。
    columns:
      - name: 誤変換
        title: 誤変換
        type: string
        description: 置き換える前の文字。前後の空白は除いて読む
        example: くろーど
      - name: 正しい表記
        title: 正しい表記
        type: string
        description: 置き換えた後の文字。空の行は、起こした文字から誤変換を削除する。前後の空白は除いて読む
        example: Claude
      - name: 使う
        title: 補正に使うか
        type: string
        default: （列が無い・空はオン）
        description: その行を補正に使うか。`0` の行だけがオフで、列が無い・空・ほかの値はオン
        enum_values: "'1' = オン / '0' = オフ"
        example: '1'
    status: implemented
    implementation: src/voice_paste/features/correction/service.py
    refs:
      - dev/設計書/設定/常駐アプリ#settings[glossaries[].path]
  - name: '%LOCALAPPDATA%\voice-paste\ui\{ハッシュ}.svg'
    title: 開くマーカーの画像
    datastore: SVG
    summary: 選択欄の開くマーカー（V 字）の画像。スタイルシートの `::down-arrow` が指す
    scale: 明暗ごとに 1 件
    growth: tokens.toml の text_muted が変わったときだけ増える（ファイル名は中身のハッシュ）
    retention: 消さない
    deletion: 消さない（同じ中身なら書き直さず使う）
    description: |-
      置き場所は `shared/constants.py` の `ui_image_dir`（`--data-dir` を渡したときはその下の `ui`）。
      write_arrow_image が明暗を当てるたびに無ければ書く。
    columns:
      - name: svg
        title: 画像
        type: string
        description: text_muted の色の線で描いた V 字の SVG
    status: implemented
    introduced:
      pr: 159
  - name: '%LOCALAPPDATA%\voice-paste\history\{YYYYMMDD}\{YYYYMMDDHHMMSS}_web_{job_id}.{webm|ogg|mp4|mp3|wav}'
    title: ブラウザの音声の履歴
    datastore: ファイル（録れた形式の音声）
    summary: 外の端末のブラウザから受けた音声。文字起こしより先に一時の音声から移し、文字起こしに失敗しても残る
    growth: ブラウザの音声を 1 件起こすたびに 1 つ増える（`history.enabled = true` のとき）
    retention: '`history.retention_days` 日（日付のフォルダごと削除する）'
    deletion: 物理削除（録音の履歴と同じ）
    columns:
      - name: container
        title: 容れ物
        type: string
        description: 受け付けで PyAV が読んだ容れ物の形式。拡張子になる
      - name: audio
        title: 音声
        type: array
        description: 録れた形式のままの音声（WAV へ変えない）
    description: 起こした文字は同じ名前の `.txt`（起こした文字の履歴）に書く。日時は履歴へ移した時刻。
    status: planned
    introduced:
      pr: 171
  - name: '%LOCALAPPDATA%\voice-paste\tmp\web\{job_id}.{webm|ogg|mp4|mp3|wav}'
    title: ブラウザの音声の一時のファイル
    datastore: ファイル（録れた形式の音声）
    summary: 受け付けた音声を起こすまで置く。履歴を残す設定なら起こす前に履歴へ移し、残さない設定なら起こし終えた後に削除する
    scale: 最大でブラウザの音声の待ちの上限（10 件）。合計で最大 1 GB
    growth: 音声を受け付けるたびに 1 つ増え、起こし始めるか起こし終えると消える
    retention: 起こし終えるまで
    deletion: 物理削除（起こし終えたとき、常駐サービスの開始時と終了時）
    columns:
      - name: audio
        title: 音声
        type: array
        description: 受けた本文の audio の中身そのまま
    status: planned
    introduced:
      pr: 171
