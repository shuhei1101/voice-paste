    properties:
      - name: name
        type: str
        description: 設定画面の用語集のプリセットの一覧と `POST /sessions` の `glossary_preset` で指す名前（前後の空白を除く。空は、重なりと同じ回に欄ごとのエラーとして出すため、Settings の確かめが種類 `string_too_short` で断る）
      - name: glossaries
        type: list[str]
        default: '[]'
        description: 補正に使う用語集の名前（`glossaries[].name`）の並び。補正はこの順に当てる。同じ名前を 2 回並べると検証に通さない（`field_validator`）。一覧に無い名前は検証では断らず、resolve_glossary_presets が外す
    refs:
      - dev/設計書/設定/常駐アプリ#settings[glossary_presets[].name]
      - dev/設計書/設定/常駐アプリ#settings[glossary_presets[].glossaries]
    status: planned
    introduced:
      pr: 173
  - name: OpenAISettings
    title: OpenAI API の設定
    container: shared/settings.py
    usecase: 共通
    role: 設定のモデル
    summary: OpenAI API の文字起こしへ渡すモデル・言語・送信先のベース URL。API キーは持たない
    inherits: pydantic.BaseModel
    description: API キーは設定のファイルに置かず、起動の配線が外部連携の read_openai_api_key で環境変数か秘匿のファイルから読む。反映は全て restart。
    properties:
      - name: model
        type: str
        default: gpt-transcribe
        description: 文字起こしに使うモデル。設定画面は `json_schema_extra` の note で、まとまりの補助文（「文字起こしのエンジンが OpenAI API のときに使う。API キーはここでは入れず、環境変数 OPENAI_API_KEY か、settings.toml と同じフォルダの secrets/openai_api_key に置く。」）を欄の下に出す
      - name: language
        type: str
        default: ja
        description: 文字起こしの言語（ISO-639-1）
      - name: base_url
        type: str
        default: https://api.openai.com/v1
        description: 送信先のベース URL。`pattern=URL_PATTERN`（http:// か https:// で始まる）。テストでは 127.0.0.1 のテスト用のエンドポイントへ向ける
    status: planned
    introduced:
      pr: 204
classes:
  - name: AppError
    title: アプリの例外
    container: shared/errors.py
    usecase: 共通
    role: 例外
    kind: クラス
    inherits: Exception
    summary: このアプリが送出する例外の根。API サーバーの例外ハンドラが HTTP のステータスへ変える
    description: |-
      | 例外 | 意味 | HTTP |
      | --- | --- | --- |
      | `CallbackNotAllowedError` | 返送先が許されない | 400 |
      | `GlossaryPresetNotFoundError` | API の開始かブラウザの音声の受け付けで指定した用語集のプリセットが一覧に無い（メッセージに指定した名前を含める） | 400 |
      | `UnauthorizedError` | トークンが合わない | 401 |
      | `ForbiddenRequestError` | Origin が付いている・Host が違う | 403 |
      | `SessionNotFoundError` | セッションが無い・操作できない状態 | 404 |
      | `SessionBusyError` | ほかのセッションが処理中 | 409 |
      | `SessionConflictError` | セッションの種類がその操作を受けない（連続録音への停止） | 409 |
      | `MicrophoneUnavailableError` | マイクを開けない | 503 |
      | `WebJobNotFoundError` | ブラウザの音声のジョブが無い（受け付けていない・件数を超えて捨てた・起動し直した） | 404 |
      | `RequestBodyTooLargeError` | ブラウザの本文が上限以上 | 413 |
      | `AudioUnreadableError` | 受けた音声を PyAV で開けないか、音声のストリームが無い | 415 |
      | `WebQueueFullError` | 終わっていないブラウザの音声のジョブが上限に達している | 503 |
      | `TranscriptionError` | 文字起こしに失敗した（API へは返さず返送先へ届ける） | - |
      | `EngineError` | エンジンが失敗した（外部連携が送出し、文字起こしが TranscriptionError に変える） | - |
      | `DeliveryError` | 出力先へ届けられない | - |
      | `UnknownOutputError` | 選んだ出力先が一覧に無いかオフ（`DeliveryError` の子） | - |
      | `VolumeControlError` | システム音量を操作できない | - |
      | `SettingsError` | 設定の値が合わない（合わないキーをメッセージに並べる） | - |
      | `StartupError` | 起動に失敗した（エンジンを準備できない・前のプロセスが排他を放さない） | - |
      | `HotkeyError` | ホットキーの書式を pynput が読めない | - |
      | `GlossaryReadError` | 用語集の CSV を読めない（開けない・UTF-8 でない・見出しの列が無い・csv が解釈できない。メッセージが設定画面に出す理由になる） | - |

      全ての例外は docstring だけを持つクラスで `shared/errors.py` に置き、親は表に書かない限り `AppError`。
    status: implemented
functions:
  - name: load_settings
    title: 設定の読み込み
    kind: 関数
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 既定値 → 環境の値 → checkout の上書きの順に重ねて検証する。環境の値が無く settings.toml があれば、先に移す
    side_effects: settings_file が無く legacy_settings_file があるときだけ、settings_file を書く（migrate_settings_toml）。それ以外はどのファイルも書かない。
    args:
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所（defaults_file・settings_file・local_settings_file・legacy_settings_file を使う）
      - name: model
        type: type[Settings]
        required: true
        passing: positional
        description: 検証に使う設定のモデル（main.py の SETTINGS_MODEL）
    returns:
      type: Settings
      description: 検証した設定
    process: |-
      1. 既定値を読む（_read_defaults(paths.defaults_file)）
         - SettingsError の場合、そのまま送出する
      2. settings_file が無く legacy_settings_file があれば、settings.toml を移す（migrate_settings_toml(legacy_settings_file, settings_file, 既定値)）
         - SettingsError の場合、settings_file を作らずにそのまま送出する
      3. 環境の値と checkout の上書きを読む（read_yaml_mapping。無いファイルは空の dict にする。local_settings_file が None なら読まない）
         - SettingsError の場合、そのまま送出する
         - 読んだレイヤーごとに、文字起こし中の表示のホットキーを引き継ぐ（inherit_transcribing_show_hotkeys）
      4. 既定値 → 環境の値 → checkout の上書きの順に重ねる（merge_layers）
      5. 古い AI チャットの設定を読み替え（migrate_ai_chat。ファイルは書き換えない）、model.model_validate で検証して返す
         - pydantic.ValidationError の場合、合わないキーをドット区切り（例 `transcription.local_whisper.beam_size`、出力先は `outputs[0].hotkey`、プリセットは `presets[0].url`）で並べた SettingsError を送出する
         - `[INFO]` 設定を読んだレイヤー（既定値・環境の値・checkout の上書きのうち読んだファイルのパス）
    exceptions:
      - name: SettingsError
        condition: 既定値が無い・YAML として読めない・あるのに読めない環境の値か checkout の上書き・移すときに読めない settings.toml
        message: '設定ファイルを読めない（{path}: {理由}）'
      - name: SettingsError
        condition: 重ねた値がモデルに合わない・知らないキーがある・出力先の ID が重なる
        message: '設定の値が合わない（{キー}: {理由}、…）'
    unit_tests:
      - name: test_load_settings_when_only_defaults
        case: 正常
        summary: 環境の値と checkout の上書きが無ければ既定値で動き、ファイルを作らない
        condition: 一時フォルダの既定値だけがある AppPaths
        mock: なし（一時フォルダ）
        expected: load_default_settings と等しい設定が返り、settings_file ができていない
      - name: test_load_settings
        case: 正常
        summary: 環境の値に書いたキーだけが既定値に勝つ
        condition: settings_file に transcription.local_whisper.model = small と、outputs が copy_only だけの一覧を書く
        mock: なし（一時フォルダ）
        expected: local_whisper.model が small、outputs が CopyOnlySettings 1 件、書いていない項目は既定値
      - name: test_load_settings_when_local_override
        case: 正常
        summary: checkout の上書きが環境の値に勝つ
        condition: settings_file に hotkeys.start = A、local_settings_file に hotkeys.start = B、両方に書いていない hotkeys.cancel は既定値
        mock: なし（一時フォルダ）
        expected: hotkeys.start が B、hotkeys.cancel が既定値。どのファイルも書き換わっていない
      - name: test_load_settings_when_local_override_disabled
        case: 正常
        summary: local_settings_file が None なら checkout の上書きを読まない
        condition: local_settings_file を None にした AppPaths（同じフォルダに settings.local.yaml を置いておく）
        mock: なし（一時フォルダ）
        expected: settings.local.yaml の値が効いていない
      - name: test_load_settings_when_only_settings_toml
        case: 正常
        summary: settings.yaml が無く settings.toml があれば移してから読む
        condition: legacy_settings_file に hotkeys.start を既定と違う値にした settings.toml
        mock: なし（一時フォルダ）
        expected: settings_file ができて hotkeys.start が書かれ、既定値と同じキーが無い。返った設定の hotkeys.start が settings.toml の値。settings.toml が変わっていない
      - name: test_load_settings_when_both_files
        case: 正常
        summary: settings.yaml があれば settings.toml を読まない
        condition: settings_file に hotkeys.start = A、legacy_settings_file に hotkeys.start = B
        mock: なし（一時フォルダ）
        expected: hotkeys.start が A。settings_file が変わっていない
      - name: test_load_settings_when_invalid_value
        case: 異常
        summary: 合わない値はキーを示して断る
        condition: parametrize で (1) transcription.local_whisper.beam_size = "x" (2) transcription.engine = "gemini"（作らないエンジン）を settings_file に書く
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) transcription.local_whisper.beam_size (2) transcription.engine を含む
        exception: 値がモデルに合わない
      - name: test_load_settings_when_unknown_key
        case: 異常
        summary: 知らないキーを断る
        condition: parametrize で (1) recording.volum_percent = 30（書き間違い） (2) transcription.openai.modle = gpt-4o-mini-transcribe（書き間違い）を settings_file に書く
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに (1) recording.volum_percent (2) transcription.openai.modle を含む
        exception: 知らないキーがある
      - name: test_load_settings_when_duplicate_output_id
        case: 異常
        summary: 出力先の ID の重なりを断る
        condition: settings_file の outputs に copy_only が 2 件
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに outputs を含む
        exception: 出力先の ID が重なる
      - name: test_load_settings_when_broken_yaml
        case: 異常
        summary: 読めない YAML は、読めなかったファイルと行・列を示して断る
        condition: parametrize で settings_file・local_settings_file・defaults_file のそれぞれを、字下げの崩れた YAML にする
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージにそのファイルのパスと行・列を含み、settings_file が書き換わっていない
        exception: YAML として読めない
      - name: test_load_settings_when_defaults_missing
        case: 異常
        summary: 既定値が無ければ断る
        condition: defaults_file が無い AppPaths
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに defaults_file のパスを含む
        exception: 既定値が無い
      - name: test_load_settings_when_broken_settings_toml
        case: 異常
        summary: 移すときに settings.toml を読めなければ、settings.yaml を作らずに断る
        condition: settings_file が無く、legacy_settings_file が `[recording` で閉じていない
        mock: なし（一時フォルダ）
        expected: SettingsError。settings_file ができていない
        exception: 移すときに読めない settings.toml
      - name: test_load_settings_when_ai_chat_remains
        case: 正常
        summary: 古い AI チャットの設定が残っていても読め、プリセットに読み替える
        condition: settings_file の outputs に id = ai_chat・open_delay_sec = 2.0・targets に ChatGPT（enabled true）と Claude（enabled false）を書く
        mock: なし（一時フォルダ）
        expected: outputs に ai_chat が無く、presets が ChatGPT（enabled True）・Claude（enabled False）の BrowserPreset 2 件（同じ title・url・hotkey、send_enter True）、preset_options.browser.open_delay_sec が 2.0。settings_file の中身は読む前と同じ
      - name: test_load_settings_when_invalid_preset
        case: 異常
        summary: 合わないプリセットはキーを示して断る
        condition: settings_file の presets に kind = endpoint・url = "ftp://x" の 1 件
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに presets[0] と url を含む
        exception: 値がモデルに合わない
      - name: test_load_settings_when_sample_file
        case: 正常
        summary: リポジトリの見本は、既定値に重ねて設定のモデルの検証に通る
        condition: リポジトリの直下の settings.sample.yaml を settings_file に写す
        mock: なし（一時フォルダ）
        expected: SettingsError にならない
      - name: test_load_settings_when_only_show_hotkeys
        case: 正常
        summary: 録音の画面のホットキーの表示だけを書いたレイヤーは、文字起こし中の表示も同じ値で読む
        condition: parametrize で (1) settings_file (2) local_settings_file に ui.show_hotkeys = false だけを書く
        mock: なし（一時フォルダ）
        expected: ui.show_hotkeys も ui.transcribing_show_hotkeys も False
    refs:
      - dev/設計書/外部ライブラリ/ruamel.yaml#
    status: planned
  - name: load_default_settings
    title: 既定の設定の読み込み
    kind: 関数
    container: shared/settings.py
    usecase: 設定を変える
    scope: public
    summary: 既定値のファイルに、動いている OS の上書きを重ねて検証した既定の設定を返す
    args:
      - name: defaults_file
        type: Path
        required: true
        passing: positional
        description: config/defaults.yaml
      - name: model
        type: type[Settings]
        required: true
        passing: positional
        description: 検証に使う設定のモデル
      - name: os_kind
        type: OsKind
        required: false
        default: CURRENT_OS
        passing: keyword
        description: 上書きを当てる OS
    returns:
      type: Settings
      description: 既定の設定
    process: |-
      1. 既定値を読み（_read_defaults(defaults_file, os_kind=os_kind)）、model.model_validate で検証して返す
         - pydantic.ValidationError の場合、合わないキーを並べた SettingsError を送出する
    exceptions:
      - name: SettingsError
        condition: 既定値が無い・読めない・モデルに合わない（キーが欠けている）
    unit_tests:
      - name: test_load_default_settings
        case: 正常
        summary: リポジトリの既定値は、全ての OS で設定のモデルの検証に通る
        condition: リポジトリの config/defaults.yaml を、OsKind の全ての値で parametrize
        mock: なし
        expected: SettingsError にならない
      - name: test_load_default_settings_when_linux
        case: 正常
        summary: Linux では OS の上書きの値になる
        condition: リポジトリの config/defaults.yaml・os_kind=OsKind.LINUX
        mock: なし
        expected: recording.lower_volume = False・transcription.local_whisper.device = "cpu"・transcription.local_whisper.compute_type = "int8"・hotkeys.start = "<cmd>+<alt>+d"・hotkeys.pause = "<cmd>+<alt>+z"・hotkeys.cancel = "<cmd>+<alt>+q"・outputs の paste_and_send・paste_only・copy_only の hotkey が "<cmd>+<alt>+d"・"<cmd>+<alt>+v"・"<cmd>+<alt>+c"
      - name: test_load_default_settings_when_missing_key
        case: 異常
        summary: 既定値に欠けたキーがあれば断る
        condition: hotkeys.cancel を除いた既定値のファイル
        mock: なし（一時フォルダ）
        expected: SettingsError。メッセージに hotkeys.cancel を含む
        exception: キーが欠けている
    status: planned
  - name: _read_defaults
    title: 既定値の読み込み
    kind: 関数
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    scope: internal
    summary: 既定値のファイルを読み、os_overrides のうち動いている OS の分を重ねて、os_overrides を外した dict を返す
    args:
      - name: defaults_file
        type: Path
        required: true
        passing: positional
        description: config/defaults.yaml
      - name: os_kind
        type: OsKind
        required: false
        default: CURRENT_OS
        passing: keyword
        description: 上書きを当てる OS
    returns:
      type: dict[str, Any]
      description: OS の上書きを重ねた既定値
    process: |-
      1. defaults_file が無ければ SettingsError を送出する
      2. read_yaml_mapping で読む
      3. DEFAULTS_OS_OVERRIDES_KEY のキーを取り外し、その中の os_kind の値（OsKind の値の文字列のキー）があれば merge_layers で重ねて返す
    exceptions:
      - name: SettingsError
        condition: 既定値が無い・読めない
    status: planned
  - name: save_settings
    title: 設定の書き戻し
    kind: 関数
    container: shared/settings.py
    usecase: 設定を変える
    scope: public
    summary: 前の設定から変わったキーだけを環境の値に書き、既定値と同じ値にしたキーは外す。再起動が要る項目が変わったかを返す
    side_effects: settings_file を書く（親のフォルダが無ければ作る）。defaults_file と local_settings_file は書かない。
    args:
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所（defaults_file・settings_file を使う）
      - name: previous
        type: Settings
        required: true
        passing: positional
        description: 今効いている設定（SettingsStore.get）
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 書く設定（検証済み）
    returns:
      type: bool
      description: 再起動が要る項目が変わったか
    process: |-
      1. previous と settings と既定の設定（load_default_settings(paths.defaults_file, type(settings))）を `model_dump(mode="json")` する。`glossaries[].path` は、settings_file の親のフォルダの下にある場所ならそのフォルダからの相対パス（区切りは `/`）にし、それ以外は絶対パスのままにする
      2. previous と settings で値が変わったキーを集める（changed_keys。表はキーごと、一覧と値は丸ごとで比べる）
      3. settings_file を読む（read_yaml_document。無ければ空の文書）
         - SettingsError の場合、そのまま送出する（読めない settings.yaml は書き換えない）
      4. 変わったキーごとに、新しい値が既定の設定の値と等しければ文書から外し（delete_key。中のキーが無くなった表も外す）、違えば書く（set_key。無い表は作る）
      5. None の項目（glossary_path・active_glossary・active_glossary_preset）を変えたときは、キーを書かずに外す
      6. 親のフォルダを作り、同じフォルダの一時ファイルに UTF-8 で書いて os.replace で置き換える（write_yaml_document）
      7. has_restart_change(previous, settings) を返す
    exceptions:
      - name: SettingsError
        condition: settings_file があるのに読めない（書き換えない）
    unit_tests:
      - name: test_save_settings_when_comments
        case: 正常
        summary: 変えたキーの行だけを書き換え、コメントと空行を保つ
        condition: コメントと空行のある settings_file に、hotkeys.start を既定と違う値に変えた設定を書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルで、hotkeys.start の行の他の行が書く前と一致し、load_settings で新しい値が読める
      - name: test_save_settings_when_reset_to_default
        case: 正常
        summary: 既定値と同じ値にしたキーを外し、外したキーの後ろのコメントを残す
        condition: hotkeys.cancel を既定と違う値にし、その後ろにコメントと空行を置いた settings_file に、hotkeys.cancel を既定値に戻した設定を書く。parametrize で、まとまりの中のキーを全て既定値に戻して表ごと外すときも書く
        mock: なし（一時フォルダ）
        expected: 書いた後のファイルに hotkeys.cancel（表ごと外すときは hotkeys の表）が無く、外したキーの行末のコメントの他のコメントが残り、YAML として読める
      - name: test_save_settings_when_added_key
        case: 正常
        summary: 書いていなかったキーを、次の表の見出しのコメントより前に追加する
