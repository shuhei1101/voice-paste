title: "非機能要件"
requirements:
  - name: 対応 OS
    english_name: supported_os
    category: 動作環境
    external_constraint: 録音・貼り付け・システム音量の操作を Windows の機能（pycaw・Win32）で行う
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/1_%E7%9B%AE%E7%9A%84%E3%81%A8%E5%88%B6%E7%B4%84.md
    value: Windows・Linux（Ubuntu 24.04 の Xorg のセッションと Wayland のセッション）
    rationale: '方針の制約（Windows のショートカットから起動する・録音と貼り付けは端末の OS の機能）。Linux は #196 で起動までを対応し、Linux ではシステムの音量を変えない。Linux の起動の手段は起動のスクリプト（`voice-paste.sh`）とログイン時の自動起動の `.desktop` で、OS のパッケージ `xclip`・`libportaudio2`・`libxcb-cursor0` と、依存の `evdev` のビルドに使う `gcc`・`linux-libc-dev` が要る（#199・#222）。Wayland のセッションは、貼り付けのキーと Enter を uinput の仮想のキーボードから送信するため、`/dev/uinput` の権限（udev の規則と `input` グループへの追加の後に再起動）が要る（#200）。Wayland のセッションで端末アプリへ Ctrl+Shift+V で貼り付けるには、GNOME Shell の拡張 Focused Window D-Bus が要る（無ければ設定の貼り付けのキーを送信する。#223）。Mac は #9 で扱う'
  - name: 入力方式
    english_name: input_method
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: ホットキーとマイクで操作する。対応するマイク・キーの組み合わせはリバースエンジニアリングで現状を起こし、方針決めで決める
  - name: 通信
    english_name: network
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: 文字起こしはローカルの Whisper だけで、モデルを取得した後は通信なしで動く。通信なしでの利用を保証するか（モデルの取得を起動の前提にするか）は方針決めで決める
  - name: API のセッションの上限時間
    english_name: api_session_limit
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '600'
    unit: 秒
    rationale: '放置されたセッションがホットキーと API を塞ぐのをこの時間で解く。文字起こしはローカルの Whisper だけで、録音の長さに外部の上限は無い。刷新前の履歴の録音の最長（特性テストの録音で 140.8 秒）の 4 倍を超え、貯める録音が 16 kHz・モノラル・16 bit で 19.2 MB に収まる 600 秒にする。API を作った #19 で、実機のマイクとシステム音量を使う本物の録音機で確かめた。上限を 3 秒に差し替えたセッションは、録音中は開始から 4.22 秒後・停止中は 3.05 秒後に打ち切られて返送先へ truncated が届き（上限から確かめる間隔の 1 秒までの遅れ）、実機の WAV の大きさから求めた 600 秒分は 19.21〜19.23 MB で、根拠の 19.2 MB と合った（2026-10-02）。#65 で録音の入力を無音の WAV を実時間で流すものに差し替えて再測定し、録音中は 3.05 秒・停止中は 3.03 秒で打ち切られ、600 秒分は 19.21・19.23 MB だった（2026-10-06）。決定値は 600 秒のままにする'
    overflow: 上限で打ち切り、録音を履歴に残して返送先へ truncated を送信する（上限で打ち切る）
    measurement: 録音の入力を、テストの中で書き出した無音の WAV（16 kHz・モノラル・16 bit）を実時間で流すものに、システム音量を何もしないものに差し替えた録音機で（実機のマイクを開かない）、上限時間を 3 秒に差し替えた SessionManager を上限のタイマーで回し、録音中と停止中の両方で打ち切られて返送先へ truncated が届くことを確かめる。履歴の WAV の長さと大きさから 600 秒分の大きさを求め、根拠の 19.2 MB と 5% 以内で合うことを確かめる。`--run-e2e` を付けて実行する（Windows 11）
    test_file: tests/nfr/test_api_session_limit.py
    tests:
      - name: test_api_session_limit_when_recording
        summary: 録音中のまま上限時間に達したセッションが打ち切られ、返送先へ truncated が届く
        condition: 上限時間を 3 秒に差し替えた SessionManager を、録音の入力を無音の WAV を実時間で流すものに、システム音量を何もしないものに差し替えた録音機と上限のタイマー（1 秒ごと）で動かし、API のセッションを始めて何もしない。返送先は 127.0.0.1 のテスト用のエンドポイント
        measurement: 開始から返送が届くまでの時間と、履歴の WAV の長さ・大きさから求めた 600 秒分の大きさを測る
        expected: 返送が上限時間（3 秒）以上、3 秒以内の遅れで届いて result=truncated で、600 秒分の大きさが 19.2 MB の 5% 以内
        notes: --run-e2e が無い環境では skip する
      - name: test_api_session_limit_when_stopped
        summary: 停止中のまま上限時間に達したセッションも打ち切られ、返送先へ truncated が届く
        condition: 上限時間を 3 秒に差し替えた同じ構成で、API のセッションを始めて 1 秒後に停止し、完了を呼ばない
        measurement: 開始から返送が届くまでの時間と、履歴の WAV の長さ・大きさから求めた 600 秒分の大きさを測る
        expected: 返送が上限時間（3 秒）以上、3 秒以内の遅れで届いて result=truncated で、600 秒分の大きさが 19.2 MB の 5% 以内
        notes: --run-e2e が無い環境では skip する
  - name: API の開始の応答時間
    english_name: api_start_response_time
    category: 性能
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/2_%E5%93%81%E8%B3%AA%E7%9B%AE%E6%A8%99.md
    value: '500'
    unit: ミリ秒
    rationale: '品質シナリオ 1。API が無かったため、刷新前（voice_paste_legacy）のホットキーを受けてから録音が始まるまでを読み替えた仮の値 500 ms を決定値にしていた。API を作った #19 で、本物の起動（実機のマイク・ローカルの Whisper）へ開始 → 停止 → 完了を 50 回続けて呼んで再測定した。開始の応答は最小 19.1 ms・中央値 20.8 ms・最大 46.8 ms で、決定値 500 ms を大きく下回り、50 回とも返送が届いた（起こした文字は空になる設定で測った。2026-10-02）。#65 で pytest のプロセスの中で配線し、録音の入力を無音の WAV に差し替えて再測定し、開始の応答は最小 1.9 ms・中央値 2.4 ms・最大 7.8 ms だった（2026-10-06）。決定値は 500 ms のままにする'
    measurement: pytest のプロセスの中で build_handlers で配線し、録音の入力をテストの中で書き出した無音の WAV を流すものに、システム音量を何もしないものに差し替える（実機のマイクを開かない）。build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせ、POST /sessions → 停止 → 完了を 50 回続けて呼び（返送が速く終わるよう vad_threshold = 1.0 の設定）、毎回の開始の応答時間を測る。`--run-e2e` を付けて実行する（Windows 11・NVIDIA GPU）
    test_file: tests/nfr/test_api_start_response_time.py
    tests:
      - name: test_api_start_response_time
        summary: 開始 → 停止 → 完了を 50 回続け、50 回とも返送先に文字が届き、開始の応答が決定値以内である
        condition: pytest のプロセスの中で配線した常駐サービスを vad_threshold = 1.0 の設定で立て、録音の入力に無音の WAV を流しながら 0.3 秒録っては停止・完了を呼ぶことを 50 回続ける。返送先は 127.0.0.1 のテスト用のエンドポイント
        measurement: 毎回の POST /sessions の応答時間（ミリ秒）を測り、返送先に届いた件数とセッションの ID の重なりを数える
        expected: 返送が 50 件届いて全て result=transcribed で ID が重ならず、開始の応答時間の最大が 500 ms 以下
        notes: --run-e2e が無い環境では skip する
  - name: 処理中の開始へのエラーの応答時間
    english_name: busy_response_time
    category: 性能
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/2_%E5%93%81%E8%B3%AA%E7%9B%AE%E6%A8%99.md
    value: '1'
    unit: 秒
    rationale: '品質シナリオ 6。API が無かったため、刷新前（voice_paste_legacy）の処理中のホットキーを受けて捨てるまでを読み替えた仮の値 1 秒を決定値にしていた。API を作った #19 で、本物の起動（実機のマイク）で API のセッションを処理中にしたまま開始を 20 回呼んで再測定した。409 の応答は最小 1.0 ms・最大 2.0 ms で、決定値 1 秒を大きく下回った（2026-10-02）。ホットキーの受付は新しい構成に無いため（#21）、処理中は API で始めたセッションで測った。#65 で pytest のプロセスの中で配線し、録音の入力を無音の WAV に差し替えて再測定し、409 の応答は最小 1.0 ms・最大 1.6 ms だった（2026-10-06）。決定値は 1 秒のままにする'
    measurement: pytest のプロセスの中で build_handlers で配線し、録音の入力をテストの中で書き出した無音の WAV を流すものに、システム音量を何もしないものに差し替える（実機のマイクを開かない）。build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせ、API の開始で処理中にしたまま POST /sessions を 20 回呼び、409 の応答時間を測る。2 つ目の録音が始まらないことは、処理中のセッションを完了させた後のログで、セッションを始めたのが 1 回だけであることから確かめる。`--run-e2e` を付けて実行する（Windows 11・NVIDIA GPU）
    test_file: tests/nfr/test_busy_response_time.py
    tests:
      - name: test_busy_response_time
        summary: 処理中に開始を呼ぶと 409 が決定値以内に返り、2 つ目の録音が始まらない
        condition: pytest のプロセスの中で配線した常駐サービスを立て、録音の入力に無音の WAV を流しながら API の開始で処理中にしたまま、開始を 20 回呼ぶ。返送先は 127.0.0.1 のテスト用のエンドポイント
        measurement: 20 回の応答のステータスと応答時間（ミリ秒）を記録し、処理中のセッションを完了させた後に、常駐サービスのログでセッションを始めた回数を数える
        expected: 20 回とも 409 で、応答時間の最大が 1000 ms 以下。セッションを始めたのは 1 回だけで、処理中のセッションの返送が 1 件届く
        notes: 'ホットキーの受付が新しい構成に入る #21 までは、処理中を API で始めたセッションにする。--run-e2e が無い環境では skip する'
  - name: 話し終えてから貼り付くまでの時間
    english_name: paste_latency
    category: 性能
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/2_%E5%93%81%E8%B3%AA%E7%9B%AE%E6%A8%99.md
    value: '1.59'
    unit: 秒
    rationale: '品質シナリオ 3（新しい構成の中央値が、刷新前の中央値以下）。刷新前を PR #27 で測った録音（`20260930010513.wav`）は残っておらず、同じ条件で比べられないため、#22 で履歴の約 10 秒の録音（`20261002212623`）・`.env` の `WHISPER_*`（large-v3・cuda・int8）・`resources/yogo.csv` で刷新前を `scripts/measure_legacy_latency.py` で再測定した。中央値 1,588 ms（20 回。最小 1,239 ms・最大 2,817 ms。2026-10-03、Windows 11・RTX 5070）を切り上げた値で、新しい構成の中央値がこの値以下になる。区間は録音を止めた時点から貼り付けのキーを押す直前までで、録音の保存・用語集の読み込み・文字起こし・補正・クリップボード・貼り付けの待ち（0.1 秒）を含み、録音中の画面・トレイ・履歴の保存は含まない。測った生の値は PR #41 の dev/pr/41/テスト結果/ の非機能要件テストのログに残している'
    measurement: 常駐中・ローカルの Whisper（GPU）・モデル読み込み済みで、約 10 秒話してホットキーで止めてから貼り付くまでを新旧それぞれ 20 回、実機で測る。新しい構成は build_handlers で配線した SessionManager を、マイクの入力と貼り付けのキーだけを差し替えて通し、刷新前と同じ録音・設定・用語集（`tests/nfr/fixtures/`）で測る。`--run-e2e` を付けて実行する（Windows 11・NVIDIA GPU）
    tests:
      - name: test_paste_latency
        summary: 録音を止めてから貼り付けのキーを押す直前までの中央値が決定値以下である
        condition: 固めた設定（`tests/nfr/fixtures/whisper.env` の large-v3・cuda・int8）と用語集（`tests/nfr/fixtures/yogo.csv`。`resources/yogo.csv` と同じ）で build_handlers を一時フォルダの置き場所で配線し、モデルの読み込みを待つ。マイクの入力（open_input）は、刷新前を再測定したのと同じ録音（`tests/nfr/fixtures/recordings/latency/20261002212623.wav`）の先頭 10 秒を 1024 フレームずつ渡すもの、音量の操作は何もしないもの、貼り付けのキー（send_paste）は押した時刻だけを控えるものに差し替える。ホットキーの入口でセッションを始め、録音が 10 秒分たまったら貼り付けのみ（paste_only）で確定する。先に捨てる 1 回の後、これを 20 回続ける
        measurement: SessionManager.complete を呼んだ時点から、差し替えた貼り付けのキーが押された時点までを time.perf_counter で測り、20 回の生の値と中央値・最小・最大を出す
        expected: 20 回とも貼り付けのキーが押され、中央値が 1.59 秒以下
        notes: クリップボードは実物を書き換えるため、測る前の文字を控えて測った後に戻す。録音は特性テスト（test_transcription_parity）が拾わない `recordings/latency/` に置く。`--run-e2e` が無い環境・録音が無い環境では skip する
    test_file: tests/nfr/test_paste_latency.py
  - name: 文字起こしワーカーの立て直しの時間
    english_name: worker_recovery_time
    category: 耐障害
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/2_%E5%93%81%E8%B3%AA%E7%9B%AE%E6%A8%99.md
    value: '27'
    unit: 秒
    rationale: '品質シナリオ 4（ワーカーが落ちてから 30 秒以内に次の録音を受け付ける）。立て直しはワーカーの起動からモデルの読み込みが終わるまでで決まる。#22 で新しい構成のワーカーを 20 回ずつ 2 回測り、モデルのファイルが OS のキャッシュに載る前の 1 回目が 17.68 秒、キャッシュ済みは中央値 5.09 秒・最大 5.50 秒だった（2026-10-03、Windows 11・RTX 5070）。立ち上げ直後の 1 回目も ready を待ち切れるよう、実測の最大 17.68 秒を p99.9 の代わりに置き、規約『資源の値の決め方』の余裕（実測の 50%）を加算した 26.52 秒を切り上げた。品質シナリオ 4 の 30 秒に収まる。`main.py` の WORKER_READY_TIMEOUT_SEC がこの値を使う'
    measurement: 文字起こしの途中でワーカーを止め、常駐が止まらず録音が履歴に残り、決定値以内に次の録音を受け付けることを実機で測る
    breakdown:
      - part: モデルの読み込みの実測の最大
        value: 17.68 秒
        notes: キャッシュに載る前の 1 回目（キャッシュ済みは中央値 5.09 秒・最大 5.50 秒）
      - part: 余裕
        value: + 8.84 秒
        notes: 実測の 50%（規約『資源の値の決め方』の既定）
      - part: 切り上げ
        value: 27 秒
        notes: 26.52 秒を秒の単位へ。品質シナリオ 4 の 30 秒以内
    tests:
      - name: test_worker_recovery_time
        summary: 新しい構成のワーカーの起動からモデルの読み込みが終わるまでが決定値以内である
        condition: 固めた設定（`tests/nfr/fixtures/whisper.env` の large-v3・cuda）で WhisperWorkerClient を作り、start → stop を 20 回続ける
        measurement: 毎回の start（ワーカーの起動から ready を受けるまで）の時間（秒）を測り、生の値と中央値・最大を出す
        expected: 20 回とも ready を受け、最大が 27 秒以内
        notes: 測った最大から規約『資源の値の決め方』で決定値を再決定する。`tests/nfr/fixtures/` が無い環境・GPU が無い環境では skip する
    test_file: tests/nfr/test_worker_recovery_time.py
  - name: 刷新の前後での起こした文字の一致
    english_name: transcription_parity
    category: 機能適合性
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/blob/develop/dev/pr/12/%E6%96%B9%E9%87%9D%E6%B1%BA%E3%82%81/2_%E5%93%81%E8%B3%AA%E7%9B%AE%E6%A8%99.md
    value: '10'
    unit: 件
    rationale: '品質シナリオ 2。履歴から選んだ長さの違う録音 10 件（3.0〜140.8 秒）で、補正後の文字が刷新前（voice_paste_legacy）が返した文字と 10 件一致する。録音・用語集・設定・期待値は git 管理外の `tests/nfr/fixtures/` に置く（作り方は PR #27 の dev/pr/27/常駐アプリ.md の `## テスト結果`）'
    measurement: '#15 の特性テストを新しい構成で回す（一致しない件は差分を記録する）'
    test_file: tests/nfr/test_transcription_parity.py
    tests:
      - name: test_transcription_parity_when_history_recordings
        summary: 履歴から選んだ録音を、固めた用語集と設定で起こして補正した文字が、刷新前の実装が同じ入力で返した文字と一致する
        condition: 履歴から選んでローカルのエンジンで起こした 10 件の録音と、コピーした時点で効いている用語集と `.env` の文字起こしの設定を `tests/nfr/fixtures/` へコピーし、その用語集と設定で新しい構成の文字起こし（文字起こしワーカーの窓口と transcribe、ローカルの Whisper（GPU））で起こし、新しい構成の補正（load_glossary・apply_glossary）で補正する。期待値は、同じ録音・用語集・設定で `voice_paste_legacy` が返した文字を `tests/nfr/fixtures/` に固めたもの
        measurement: 10 件それぞれで、起こして補正した文字と固めた期待値を比べ、一致した件数を数える（一致しない件は差分を記録する）
        expected: 10 件中 10 件が一致する
        notes: Windows の GPU と `tests/nfr/fixtures/` の録音が要り、どちらかが無い環境では skip する。履歴の文字は録音を選ぶときの目安にだけ使う
      - name: test_transcription_parity_when_correction_only
        summary: 用語集の補正だけを切り出し、決まった入力に決まった出力を返す
        condition: 誤変換を含む決まった入力の文字列と、`tests/nfr/fixtures/` へコピーした用語集を与え、新しい構成の補正（load_glossary・apply_glossary）で補正する。録音と Whisper は使わない
        measurement: 入力ごとに補正の関数を呼び、返った文字をあらかじめ決めた出力と比べる
        expected: すべての入力で、返った文字が決めた出力と完全に一致する
        notes: '`tests/nfr/fixtures/` の用語集が無い環境では skip する'
  - name: 返送のタイムアウトと再送
    english_name: callback_retry
    category: 耐障害
    external_constraint: エンドポイントは受け取ってから 1 秒以内に 2xx を返す（インターフェース定義『呼び出し元へ返す』の取り決め）
    source_kind: ユーザー要望
    value: タイムアウト 1.5 秒・再送 3 回・間隔の基数 1 秒
    rationale: '規約『資源の値の決め方』で導く。下流（呼び出し元のエンドポイント）は利用者ごとに違い実測できないため、公開仕様の値としてインターフェース定義『呼び出し元へ返す』の取り決め（受け取ってから 1 秒以内に 2xx）を使い、その 50% を余裕として加算する（loopback 以外の許可ホストへの往復もこの余裕で吸収する）。再送は 1 層だけで、回数に上限を置き、指数バックオフとフルジッター（再送の n 回目の前に、0 以上、基数 × 2^(n−1) 以下の乱数の秒数を待つ）にする。返送先の回復にかかる時間の実測が無いため、間隔の基数は仮に 1 秒を置く。各回のタイムアウトと待ちの合計の間（最長 13 秒）は、返送中のセッションが残り、次の開始を 409 で断る。エンドポイントが 2xx を返す前にタイムアウトすると同じ中身が再送される（エンドポイントは session_id で重複を見分ける取り決め）'
    overflow: 再送しても届かなければログに書いて終える（履歴は残る）
    measurement: '結合テストで、127.0.0.1 のテスト用のエンドポイントが 1 秒待ってから 2xx を返すときに再送されず 1 回で届くことを確かめる。参考の実測（2026-10-02、Windows 11・Python 3.14.3・httpx 0.28.1）: 同じプロセスの 204 を返すだけのエンドポイントへの POST は 15,000 回で p50 1.00 ms・p99.9 26.05 ms・最大 62.58 ms（loopback の往復の分だけで、エンドポイントの処理の時間を含まない）'
    breakdown:
      - part: エンドポイントが 2xx を返すまでの取り決め
        value: 1 秒
        notes: インターフェース定義『呼び出し元へ返す』のエンドポイントの応答時間
      - part: 余裕
        value: + 0.5 秒
        notes: 取り決めの 50%（規約『資源の値の決め方』の既定）。loopback 以外の許可ホストへの往復も含める
      - part: タイムアウト
        value: 1.5 秒
      - part: 再送の回数の上限
        value: 3 回
        notes: 最初の 1 回と合わせて最大 4 回。返送の間はセッションが残るため、待ちの合計を小さく抑える
      - part: 間隔の基数
        value: 1 秒
        notes: 返送先の回復の実測が無いため仮に置く
      - part: 待ちの上限（Retry-After の上限）
        value: 4 秒
        notes: 基数 × 2^(再送の回数の上限 − 1)。Retry-After がこれを超えるときは待たずに終える
      - part: 返送の最長
        value: 13 秒
        notes: 4 回 × 1.5 秒 + 待ち（1 + 2 + 4 秒）。待ちが全て上限のとき
    source: dev/設計書/インターフェース定義/常駐アプリ/呼び出し元へ返す.py#constraints[エンドポイントの応答時間]
  - name: 常駐中に古い履歴とログを削除する間隔
    english_name: purge_interval
    category: 保守性
