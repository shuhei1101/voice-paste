id: MOD-90
visibility: internal
title: 常駐アプリ / 録音 / service.py
test_files:
  - tests/unit/voice_paste/features/recording/test_service.py
classes:
  - name: Recorder
    title: 録音機
    container: features/recording/service.py
    usecase: 録音する
    role: サービス
    kind: クラス
    summary: 開いているマイクの入力と貯めた音、下げる前の音量、画面の消灯を抑止しているかを持つ
    description: |-
      マイクの入力（コールバックのストリーム）を長く持つためクラスにする。
      入力のスレッドが音を貯める処理と、呼び出し元のスレッドの操作を 1 つのロックで守る。
      どの終わり方（停止・破棄・開始の失敗・連続録音の停止・区切りの失敗）でも、下げた音量を 1 回だけ戻し、画面の消灯の抑止を 1 回だけ解除する。
      設定は録音を始めるたびに読み込み直す（`recording.*` は再起動なしで有効になる）。
      連続録音では、入力のスレッドは届いた音を待ち行列へ追加するだけにし、話し声の判定と区切りは区切りのスレッドで行う（入力のコールバックを遅らせない）。音は貯めず、区間は Segmenter が引き渡す。
    properties:
      - name: _lower_volume
        type: LowerVolumeFn
        access: 内部 (_)
        description: 音量を下げる
      - name: _restore_volume
        type: RestoreVolumeFn
        access: 内部 (_)
        description: 音量を戻す
      - name: _inhibit_display
        type: InhibitDisplayFn
        access: 内部 (_)
        description: 画面の消灯を抑止する
      - name: _release_display
        type: ReleaseDisplayFn
        access: 内部 (_)
        description: 画面の消灯の抑止を解除する
      - name: _display_inhibited
        type: bool
        access: 内部 (_)
        default: 'False'
        description: この録音で画面の消灯を抑止しているか（抑止できたときだけ真。解除は真のときだけ 1 回）
      - name: _open_input
        type: OpenInputFn
        access: 内部 (_)
        description: マイクの入力を開く（client.py の open_input）
      - name: _get_settings
        type: Callable[[], RecordingSettings]
        access: 内部 (_)
        description: 今の録音の設定を返却する（main.py が設定の持ち主から取得する関数を引き渡す）
      - name: _stream
        type: sounddevice.InputStream | None
        access: 内部 (_)
        default: None
        description: 開いている入力。録音していなければ None
      - name: _frames
        type: list[numpy.ndarray]
        access: 内部 (_)
        default: '[]'
        description: 貯めた音
      - name: _paused
        type: bool
        access: 内部 (_)
        default: 'False'
        description: 一時停止中か
      - name: _latest_frame
        type: numpy.ndarray | None
        access: 内部 (_)
        default: None
        description: 直近に届いた音（音の大きさの元）。一時停止で None に戻す
      - name: _volume_before
        type: float | None
        access: 内部 (_)
        default: None
        description: 下げる前の音量。下げていなければ None
      - name: _fade_sec
        type: float
        access: 内部 (_)
        default: '0.0'
        description: 始めたときに読み込んだ、音量を変えるときの秒数（戻すときも同じ値を使用する）
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: 入力のスレッドと呼び出し元のスレッドの間で、貯めた音と状態を守る
      - name: _create_speech_detector
        type: CreateSpeechDetectorFn
        access: 内部 (_)
        description: 連続録音を始めるたびに、状態を持たない新しい話し声の判定を作る（main.py が VAD のセッションを部分適用した StreamingVad を引き渡す）
      - name: _blocks
        type: queue.Queue[numpy.ndarray | None] | None
        access: 内部 (_)
        default: None
        description: 連続録音で、入力のスレッドから区切りのスレッドへ引き渡す音の待ち行列（None は残りを区切って終えるマーカー、固定の空の配列 _DISCARD_MARK は残りを区間にせずに終えるマーカー）。連続録音でなければ None
      - name: _segment_thread
        type: threading.Thread | None
        access: 内部 (_)
        default: None
        description: 連続録音で、待ち行列の音を Segmenter へ流すスレッド（名前 SEGMENT_THREAD_NAME）
    methods:
      - name: start
        title: 録音の開始
        kind: メソッド
        scope: public
        inherits: StartRecordingFn
        summary: 音量を下げ、画面の消灯を抑止してマイクを開く。開けなければ音量と抑止を戻して送出する
        returns:
          type: None
          description: なし
        process: |-
          1. 録音中（_stream がある）なら RuntimeError を送出する（呼び出し順の誤り。録音セッションが排他する）
          2. 設定を読み込み、貯めた音・一時停止・直近の音を空に戻す
          3. 設定の lower_volume が真なら、volume_percent / 100 の割合と fade_sec で音量を下げ、返った音量を _volume_before に持つ（音量を下げる）
             - VolumeControlError の場合、音量を下げずに続ける（_volume_before は None のまま）
               - `[WARNING]` 音量を下げられなかった（理由）
          4. 設定の keep_display_on が真なら、画面の消灯を抑止し、_display_inhibited を真にする
             - DisplayInhibitError の場合、抑止せずに続ける（_display_inhibited は偽のまま）
               - `[WARNING]` 画面の消灯を抑止できなかった（理由）
          5. マイクの入力を開く（入力のスレッドから音を受け取る関数を引き渡す）
             - 例外の場合、音量を戻して抑止を解除し（_close）、MicrophoneUnavailableError を送出する（理由に元の例外を残す）
               - `[ERROR]` マイクを開けなかった（理由）
          6. `[INFO]` 録音を始めた（音量を下げたか・画面の消灯を抑止したか）
        exceptions:
          - name: MicrophoneUnavailableError
            condition: マイクの入力を開けない
          - name: RuntimeError
            condition: 録音中（呼び出し順の誤り）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 音量を下げてマイクを開く
            condition: lower_volume=True・volume_percent=50・fade_sec=0.5
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: lower_volume に (0.5, 0.5) が渡り、その後に open_input が呼ばれる
          - name: test_start_when_lower_volume_disabled
            case: 正常
            summary: 音量を下げない設定なら音量に触れない
            condition: lower_volume=False
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: open_input が呼ばれ、lower_volume が呼ばれない
          - name: test_start_when_microphone_unavailable
            case: 異常
            summary: マイクを開けなければ音量を戻す
            condition: lower_volume が 0.8 を返却し、open_input が例外を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: MicrophoneUnavailableError が送出され、restore_volume に (0.8, fade_sec) が 1 回渡り、続く start が通る
            exception: マイクの入力を開けない
          - name: test_start_when_volume_control_failed
            case: 正常
            summary: 音量を下げられなくても録音は始める
            condition: lower_volume が VolumeControlError を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: open_input が呼ばれ、例外が出ず、続く stop で restore_volume が呼ばれない
          - name: test_start_when_keep_display_on
            case: 正常
            summary: 画面を暗くしない設定なら抑止してからマイクを開く
            condition: keep_display_on=True
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: inhibit_display が 1 回呼ばれ、その後に open_input が呼ばれ、release_display が呼ばれない
          - name: test_start_when_keep_display_off
            case: 正常
            summary: 画面を暗くしない設定でなければ抑止に触れない
            condition: keep_display_on=False。start・stop
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: inhibit_display・release_display が呼ばれない
          - name: test_start_when_inhibit_failed
            case: 正常
            summary: 抑止できなくても録音は始め、解除しない
            condition: keep_display_on=True、inhibit_display が DisplayInhibitError を送出する。start・stop
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: open_input が呼ばれ、例外が出ず、警告がログに出て、stop で release_display が呼ばれない
          - name: test_start_when_microphone_unavailable_with_display
            case: 異常
            summary: マイクを開けなければ抑止も解除する
            condition: keep_display_on=True、open_input が例外を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: MicrophoneUnavailableError が送出され、release_display が 1 回呼ばれる
            exception: マイクの入力を開けない
          - name: test_start_when_already_recording
            case: 異常
            summary: 録音中の開始は断る
            condition: start の後にもう一度 start を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: RuntimeError が送出され、open_input・lower_volume が 1 回だけ呼ばれる
            exception: 録音中（呼び出し順の誤り）
      - name: pause
        title: 一時停止
        kind: メソッド
        scope: public
        summary: 入力は開いたまま、音を貯めるのを止める
        returns:
          type: None
          description: なし
        process: 1. 一時停止中にし、直近の音を None に戻す（録音していなければ何もしない）
        unit_tests:
          - name: test_pause_when_not_recording
            case: 正常
            summary: 録音していなければ何もしない
            condition: start の前に pause を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: 例外が出ず、続く start が通る
      - name: resume
        title: 再開
        kind: メソッド
        scope: public
        summary: 音を貯めるのを再び始める
        returns:
          type: None
          description: なし
        process: 1. 一時停止を解く（録音していなければ何もしない）
      - name: stop
        title: 録音の停止
        kind: メソッド
        scope: public
        inherits: StopRecordingFn
        summary: 入力を閉じ、音量を戻して画面の消灯の抑止を解除し、貯めた音を返却する
        returns:
          type: Recording
          description: 貯めた音（16 kHz・モノラル・int16。貯めた音が無ければ長さ 0 の音）
        process: |-
          1. 録音していなければ RuntimeError を送出する
          2. 入力を閉じて音量を戻す（_close）
          3. 貯めた音をつないで Recording にする。長さはサンプル数 / サンプルレート
             - `[INFO]` 録音を止めた（長さ）
        exceptions:
          - name: RuntimeError
            condition: 録音していない（呼び出し順の誤り）
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 貯めた音を返却して音量を戻す
            condition: lower_volume が 0.8 を返却する。入力に 1 秒分の音を供給した後に止める
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: duration_sec が 1.0・sample_rate が 16000 の Recording が返り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡る
          - name: test_stop_when_display_inhibited
            case: 正常
            summary: 抑止の解除は 1 回だけ
            condition: keep_display_on=True。start・pause・resume・stop の後にもう一度 discard を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: release_display が 1 回だけ呼ばれ、一時停止の間は呼ばれていない
          - name: test_stop_when_release_failed
            case: 正常
            summary: 抑止を解除できなくても録音は返却する
            condition: keep_display_on=True、release_display が DisplayInhibitError を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: Recording が返り、例外が出ず、警告がログに出る
          - name: test_stop_when_paused_between
            case: 正常
            summary: 一時停止の間の音は貯めない
            condition: 1 秒流す → pause → 1 秒流す → resume → 1 秒流す
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: duration_sec が 2.0
          - name: test_stop_when_no_frames
            case: 正常
            summary: 音が届く前に止めたら長さ 0 の音を返却する
            condition: start の直後に stop を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: duration_sec が 0.0 の Recording が返る
          - name: test_stop_when_restore_failed
            case: 正常
            summary: 音量を戻せなくても録音は返却する
            condition: restore_volume が VolumeControlError を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: Recording が返り、例外が出ない
          - name: test_stop_when_not_recording
            case: 異常
            summary: 録音していなければ断る
            condition: start の前に stop を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: RuntimeError が送出される
            exception: 録音していない（呼び出し順の誤り）
      - name: discard
        title: 録音の破棄
        kind: メソッド
        scope: public
        summary: 入力を閉じ、音量を戻して画面の消灯の抑止を解除し、貯めた音を捨てる
        returns:
          type: None
          description: なし
        process: |-
          1. 録音していなければ何もしない
          2. 入力を閉じて音量を戻し（_close）、貯めた音を空にする
          3. 連続録音なら、待ち行列を空にして区切りのスレッドを flush せずに止め（残りの音は区間にしない）、待ち行列とスレッドを手放す
             - `[INFO]` 録音を捨てた
        unit_tests:
          - name: test_discard
            case: 正常
            summary: 音を捨てて音量を戻す
            condition: lower_volume が 0.8 を返却する。1 秒供給した後に discard、続けて start・stop
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: restore_volume に (0.8, fade_sec) が渡り、後の stop の duration_sec に捨てた 1 秒が入らない
          - name: test_discard_when_not_recording
            case: 正常
            summary: 録音していなければ何もしない
            condition: start の前に discard を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: 例外が出ず、restore_volume が呼ばれない
          - name: test_discard_when_continuous
            case: 正常
            summary: 連続録音を捨てると残りの音を区間にしない
            condition: 話し声の判定が常に 0.9 を返却する。start_continuous で 1 秒分の音を供給して discard
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment が呼ばれず、restore_volume が呼ばれ、区切りのスレッドが残らず、続く start が通る
      - name: restore_volume
        title: 音量だけを戻す
        kind: メソッド
        scope: public
        summary: 入力は開いたまま、下げた音量があれば録音前の値に戻す（取り消しの猶予の間）
        returns:
          type: None
          description: なし
        process: |-
          1. 下げる前の音量があれば戻し、持っていた音量を捨てる（_restore_volume_once）
             - 下げていなければ何もしない
        unit_tests:
          - name: test_restore_volume_keeps_input
            case: 正常
            summary: 入力を閉じずに音量だけを戻す
            condition: lower_volume が 0.8 を返却する。start の後に restore_volume
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: restore_volume に (0.8, fade_sec) が渡り、入力の stop・close が呼ばれない
      - name: lower_volume
        title: 音量を下げ直す
        kind: メソッド
        scope: public
        summary: 入力は開いたまま、今の設定が音量を下げるなら下げる（猶予の間に始め直したとき）
        returns:
          type: None
          description: なし
        process: |-
          1. 録音していなければ何もしない
          2. 設定を読み直し、音量を下げる設定で、下げる前の音量を持っていなければ下げて、下げる前の音量を持つ
             - 音量を操作できなければ録音は止めない
               - `[WARNING]` 音量を下げられなかった（理由）
        unit_tests:
          - name: test_lower_volume_after_restore
            case: 正常
            summary: 戻した音量を下げ直す
            condition: start → restore_volume → lower_volume
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: lower_volume が 2 回呼ばれ、入力の open_input は 1 回だけ
      - name: clear
        title: 貯めた音を捨てる
        kind: メソッド
        scope: public
        summary: 入力は開いたまま、貯めた音と直近の音を捨てる（猶予の間に始め直したとき）
        returns:
          type: None
          description: なし
        process: |-
          1. ロックを取り、貯めた音を空にし、直近の音を捨てて、一時停止を解く
        unit_tests:
          - name: test_clear_drops_frames
            case: 正常
            summary: それまでの音を捨て、その後の音だけを残す
            condition: 1 秒供給 → clear → 0.5 秒供給 → stop
            mock: lower_volume・restore_volume・open_input・get_settings
            expected: stop の duration_sec が 0.5
      - name: level
        title: 音の大きさ
        kind: メソッド
        scope: public
        summary: 直近に届いた音の RMS を int16 の最大（32767）で割り、0.0〜1.0 で返却する。録音していない・一時停止中・音が届いていなければ 0.0
        returns:
          type: float
          description: 音の大きさ（0.0〜1.0）
        unit_tests:
          - name: test_level
            case: 正常
            summary: 直近の音の大きさを返却する
            condition: 振幅 16384 の矩形の音を供給する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: 0.5 に近い値（誤差 0.01 以内）が返る
          - name: test_level_when_paused
            case: 正常
            summary: 一時停止中は 0
            condition: 音を供給した後に pause
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings
            expected: 0.0 が返る
      - name: _close
        title: 入力を閉じて音量と画面の消灯の抑止を戻す
        kind: メソッド
        scope: internal
        summary: 入力を止めて閉じ、下げた音量があれば戻して _volume_before を None にし、抑止していれば解除して _display_inhibited を偽にする
        returns:
          type: None
          description: なし
        process: |-
          1. 入力を stop・close して _stream を None にする
             - 例外の場合、閉じたものとして続ける
               - `[WARNING]` マイクの入力を閉じられなかった（理由）
          2. _volume_before があれば、その音量と _fade_sec で音量を戻し、_volume_before を None にする（戻すのは 1 回だけ）
             - VolumeControlError の場合、続ける
               - `[WARNING]` 音量を戻せなかった（理由）
          3. _display_inhibited が真なら、偽にしてから画面の消灯の抑止を解除する（解除は 1 回だけ）
             - DisplayInhibitError の場合、続ける
               - `[WARNING]` 画面の消灯の抑止を解除できなかった（理由）
      - name: start_continuous
        title: 連続録音の開始
        kind: メソッド
        scope: public
        inherits: StartContinuousRecordingFn
        summary: 音量を下げてマイクを開き、届いた音を区切りのスレッドで Segmenter へ流す。区切った区間は on_segment へ渡る
        args:
          - name: on_segment
            type: OnSegmentFn
            required: true
            description: 区切った区間を受け取る（区切りのスレッドから呼ばれる）
          - name: on_failed
            type: OnContinuousFailedFn
            required: true
            description: 区切りに失敗して連続録音を止めたことを受け取る（区切りのスレッドから呼ばれる）
          - name: min_silence_sec
            type: float
            required: true
            passing: keyword
            description: 区切る無音の長さ（設定の api.continuous.min_silence_sec。main.py が部分適用する）
        returns:
          type: None
          description: なし
        process: |-
          1. start と同じく、録音中なら RuntimeError を送出し、設定を読み込んで音量を下げ、画面の消灯を抑止する
          2. 新しい話し声の判定（_create_speech_detector）と on_segment・min_silence_sec で Segmenter を作り、音の待ち行列を空で作る
          3. 区切りのスレッドを始める（待ち行列から音を取り出して Segmenter.feed へ引き渡し、終わりのマーカーで Segmenter.flush を呼んで終える。捨てるマーカーでは flush せずに終える）
             - feed・flush の例外の場合、そこで連続録音を終える。入力を閉じて音量と抑止を戻し（_close。入力は待ち行列へ積めなくなり、音は貯まらない）、待ち行列を空にして、on_failed に理由を引き渡してスレッドを終える（それまでに引き渡した区間はそのまま）
               - `[ERROR]` 連続録音の区切りに失敗したため録音を止めた（logger.exception）
          4. マイクの入力を開く（_on_frames は音を待ち行列へ追加する）
             - 例外の場合、区切りのスレッドを flush せずに止め、音量と抑止を戻して MicrophoneUnavailableError を送出する
               - `[ERROR]` マイクを開けなかった（理由）
          5. `[INFO]` 連続録音を始めた（区切る無音の長さ・音量を下げたか）
        exceptions:
          - name: MicrophoneUnavailableError
            condition: マイクの入力を開けない
          - name: RuntimeError
            condition: 録音中（呼び出し順の誤り）
        unit_tests:
          - name: test_start_continuous
            case: 正常
            summary: 届いた音が区切りへ流れ、区間が on_segment へ渡る
            condition: 話し声の判定を「最初の 1 秒は 0.9、その後は 0.0」を返却するものにし、min_silence_sec=0.5 で始めて入力へ 2 秒分の音を供給する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment に reason=silence の区間が 1 つ渡り、lower_volume が呼ばれ、入力が開いたままである
          - name: test_start_continuous_when_microphone_unavailable
            case: 異常
            summary: マイクを開けなければ区切りのスレッドを止めて音量を戻す
            condition: lower_volume が 0.8 を返却し、open_input が例外を送出する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: MicrophoneUnavailableError が送出され、restore_volume に (0.8, fade_sec) が 1 回渡り、on_segment が呼ばれず、区切りのスレッドが残らない
            exception: マイクの入力を開けない
          - name: test_start_continuous_when_segmenter_failed
            case: 異常
            summary: 区切りに失敗したら入力を閉じて音量を戻し、on_failed に通知する
            condition: 話し声の判定が 3 窓目で RuntimeError を送出する。lower_volume が 0.8 を返却する。1 秒分の音を供給する
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment・on_failed
            expected: on_failed に理由が 1 回渡り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡り、その後に入力へ流した音が待ち行列に貯まらず、続く start が通る
      - name: stop_continuous
        title: 連続録音の停止
        kind: メソッド
        scope: public
        summary: 入力を閉じて音量を戻し、待ち行列に残った音を区切り終えてから、区間に切り出していない話し声を最後の区間として引き渡す
        description: 戻るまでに、最後の区間を含む全ての区間を on_segment へ引き渡し終える（呼び出し元は、戻った後に終わりを区間の後ろへ並べられる）。
        returns:
          type: None
          description: なし
        process: |-
          1. 連続録音していなければ RuntimeError を送出する（区切りに失敗して自ら止めた後を含む）
          2. 入力を閉じて音量と抑止を戻す（_close）
          3. 待ち行列へ終わりのマーカーを追加し、区切りのスレッドの終わりを待つ（スレッドが残りの音を feed し、flush で最後の区間を引き渡す）
          4. 待ち行列とスレッドを手放す
             - `[INFO]` 連続録音を止めた
        exceptions:
          - name: RuntimeError
            condition: 連続録音していない（呼び出し順の誤り）
        unit_tests:
          - name: test_stop_continuous
            case: 正常
            summary: 話し声の途中で止めると、残りを最後の区間として引き渡してから戻る
            condition: 話し声の判定が常に 0.9 を返却する。lower_volume が 0.8 を返却する。1 秒分の音を供給した直後に stop_continuous を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: stop_continuous が戻るまでに on_segment へ reason=flush の区間が 1 つ渡り、入力の stop・close が呼ばれ、restore_volume に (0.8, fade_sec) が渡り、続く start が通る
          - name: test_stop_continuous_when_no_speech
            case: 正常
            summary: 話し声が無ければ区間を引き渡さない
            condition: 話し声の判定が常に 0.0 を返却する。2 秒分の音を供給して止める
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: on_segment が呼ばれない
          - name: test_stop_continuous_when_not_recording
            case: 異常
            summary: 連続録音していなければ断る
            condition: start（連続でない録音）の後に stop_continuous を呼ぶ
            mock: lower_volume・restore_volume・inhibit_display・release_display・open_input・get_settings・create_speech_detector・on_segment
            expected: RuntimeError が送出される
            exception: 連続録音していない（呼び出し順の誤り）
    refs:
      - LIB-11#
    status: implemented
