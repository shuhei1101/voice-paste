id: SC-11
visibility: internal
title: "ほかのシステムから録音を文字に起こす"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる。コールバック先は 127.0.0.1 で待ち受けるテスト用のエンドポイント）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は何もせず、貼り付けのキーは送信せずに控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 出力先
        description: 出力先のうち「貼り付けて送信」をオンにする
        notes: API からの録音で貼り付けが起きないことを確かめるため
    flow: |-
      <!-- map: {"title": "正常シナリオ"} -->

      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|開始・停止・完了を呼ぶ| UC1([APIで録音を操作する:正常シナリオ])
        UC1 -->|画面を出さない録音<br>コールバック先| UC2([録音する:正常シナリオ（録音の画面を出さない）])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:正常シナリオ])
        UC3 -->|用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ（呼び出し元へ返す）])
        UC4 --> DONE([コールバック先に文字が届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音の画面を出さない"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオ"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ呼び出し元へ返す"
      ```

      <!-- /map -->
    expected:
      - コールバック先のエンドポイントに、用語集で補正した文字が 1 回届き、書き出した文の言葉を含む
      - クリップボードが録音前のままで、貼り付けのキーが送信されていない
      - 履歴に録音と起こした文字がある
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_normal
  - name: 正常シナリオ（文字起こしの結果が空）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる。コールバック先は 127.0.0.1 で待ち受けるテスト用のエンドポイント）
        notes: 音量は何もせず、貼り付けのキーは送信せずに控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 文字起こしのエンジン
        description: ローカルの Whisper で、無音の区間を除く設定にする
      - name: 無音の録音
        description: 開始から完了まで録音の入力に無音の WAV を流し、起こした文字が空になるようにする
    flow: |-
      <!-- map: {"title": "正常シナリオ（文字起こしの結果が空）"} -->

      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|開始・停止・完了を呼ぶ| UC1([APIで録音を操作する:正常シナリオ])
        UC1 -->|画面を出さない録音<br>コールバック先| UC2([録音する:正常シナリオ（録音の画面を出さない）])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:正常シナリオ（API から始めた録音の結果が空）])
        UC3 -->|空の文字| UC4([起こした文字を届ける:正常シナリオ（呼び出し元へ空の文字を返す）])
        UC4 --> DONE([コールバック先に空の文字が届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音の画面を出さない"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオAPI-から始めた録音の結果が空"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ呼び出し元へ空の文字を返す"
      ```

      <!-- /map -->
    expected:
      - コールバック先のエンドポイントに、空の文字が 1 回届いている
      - 履歴にこの録音が残っている
      - 続けて API の開始を呼ぶと、次の録音を始められる
    test: test_normal_when_transcription_empty
  - name: 異常シナリオ（文字起こしに失敗）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる。コールバック先は 127.0.0.1 で待ち受けるテスト用のエンドポイント）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は何もせず、貼り付けのキーは送信せずに控える
      - name: 履歴の保存
        description: 履歴を残す設定にする
      - name: 文字起こしの失敗
        description: 文字起こしのエンジンが失敗を返す状態にする
        notes: 中身の壊れた録音の WAV を確定し、文字起こしワーカーがエラーを返す状態にする
    flow: |-
      <!-- map: {"title": "異常シナリオ（文字起こしに失敗）"} -->

      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|開始・停止・完了を呼ぶ| UC1([APIで録音を操作する:正常シナリオ])
        UC1 -->|画面を出さない録音<br>コールバック先| UC2([録音する:正常シナリオ（録音の画面を出さない）])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:異常シナリオ（API から始めた録音の文字起こしに失敗）])
        UC3 -->|文字起こしの失敗| UC4([起こした文字を届ける:異常シナリオ（呼び出し元へ失敗を返す）])
        UC4 --> DONE([コールバック先に失敗が届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音の画面を出さない"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#異常シナリオAPI-から始めた録音の文字起こしに失敗"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#異常シナリオ呼び出し元へ失敗を返す"
      ```

      <!-- /map -->
    expected:
      - コールバック先のエンドポイントに、文字起こしに失敗したことが 1 回届いている
      - 履歴にこの録音が残っている
      - 録音セッションの管理が動き続けており、続けて API の開始を呼ぶと次の録音を始められる
    test: test_error_when_transcription_failed
  - name: 異常シナリオ（ホットキーの録音中に開始を呼ぶ）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキー・通知を差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は何もせず、貼り付けのキーは送信せずに控え、通知は控える
      - name: ホットキーの録音
        description: ホットキーの入口から録音を始め、確定する前に API の開始を呼ぶ
    flow: |-
      <!-- map: {"title": "異常シナリオ（ホットキーの録音中に開始を呼ぶ）"} -->

      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|ホットキーの録音中に<br>開始を呼ぶ| UC1([APIで録音を操作する:異常シナリオ（処理中に開始が来る）])
        UC1 --> DONE([開始がエラーで返り<br>ホットキーの録音を続ける])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#異常シナリオ処理中に開始が来る"
      ```

      <!-- /map -->
    expected:
      - API の開始が処理中を表すエラー（409）で返っている
      - 2 つ目の録音が始まっていない
      - ホットキーの録音が録音中のまま続いている
    test: test_error_when_hotkey_recording
  - name: 正常シナリオ（用語集のプリセットを指定する）
    setup:
      - name: Mock
        description: 録音の入力・システム音量・貼り付けのキーを差し替える（常駐アプリは pytest のプロセスの中で build_handlers で配線し、API は build_fastapi で組み立てた app を 127.0.0.1 で待ち受けさせる。コールバック先は 127.0.0.1 で待ち受けるテスト用のエンドポイント）
        notes: 録音の入力は、テストの中で Windows の音声合成（SAPI）で決めた文を書き出した WAV を流す（マイクを開かない）。音量は何もせず、貼り付けのキーは送信せずに控える
      - name: 用語集のプリセット
        description: 用語集のプリセットを 2 つ置き、それぞれ別の用語集を使う。2 つの用語集に、書き出した文の別々の言葉を置き換える行を 1 つずつ入れる
        notes: 設定で選んでいるのは 1 つ目のプリセット
      - name: 開始の指定
        description: API の開始で 2 つ目のプリセットの名前を指定する
        notes: '-'
    flow: |-
      <!-- map: {"title": "正常シナリオ（用語集のプリセットを指定する）"} -->

      ```mermaid
      flowchart TD
        P0([ほかのプロセス]) -->|プリセットを指定して<br>開始・停止・完了を呼ぶ| UC1([APIで録音を操作する:正常シナリオ（用語集のプリセットを指定して始める）])
        UC1 -->|画面を出さない録音<br>コールバック先・プリセット| UC2([録音する:正常シナリオ（録音の画面を出さない）])
        UC2 -->|確定した録音<br>履歴に保存済み| UC3([録音を文字に起こす:正常シナリオ（API で指定したプリセットで補正する）])
        UC3 -->|指定したプリセットの用語集で補正した文字| UC4([起こした文字を届ける:正常シナリオ（呼び出し元へ返す）])
        UC4 --> DONE([コールバック先に文字が届き<br>常駐サービスは次の開始を待つ])

        click UC1 "../単一ユースケース/APIで録音を操作する.yaml#正常シナリオ用語集のプリセットを指定して始める"
        click UC2 "../単一ユースケース/録音する.yaml#正常シナリオ録音の画面を出さない"
        click UC3 "../単一ユースケース/録音を文字に起こす.yaml#正常シナリオAPI-で指定したプリセットで補正する"
        click UC4 "../単一ユースケース/起こした文字を届ける.yaml#正常シナリオ呼び出し元へ返す"
      ```

      <!-- /map -->
    expected:
      - コールバック先のエンドポイントに届いた文字で、2 つ目のプリセットの用語集の言葉が置き換わっている
      - 1 つ目のプリセットの用語集の言葉は置き換わらずに残っている
      - 設定で選んでいるプリセットが 1 つ目のまま変わっていない
    test: test_normal_when_glossary_preset
lead: 同じ端末のほかのプロセスが API で録音を開始・停止・完了し、指定したエンドポイントで起こした文字を受け取るまでの複合ユースケース。
issue: 14
primary_actor: API を呼ぶほかのプロセス
stakeholders:
  - name: API を呼ぶほかのプロセス
    interest: 貼り付けを通らずに、話した内容を文字で受け取れること
  - name: ユーザー
    interest: API からの録音とホットキーの録音がマイクを取り合わず、端末の外やブラウザのページから録音を始められないこと
trigger: ほかのプロセスが、コールバック先のエンドポイントを指定して API の開始を呼ぶ
preconditions:
  - Windows の端末で、ショートカットから常駐サービスを起動している
  - マイクがつながっている
  - 設定の文字起こしのエンジンに要るものがそろっている（ローカルの Whisper のモデルと GPU）
  - 呼び出し元は同じ端末で動き、常駐サービスが起動ごとに作るトークンを持っている
  - コールバック先のエンドポイントは loopback か、設定で許可したホストにある
success_guarantee: |-
  コールバック先のエンドポイントに、用語集で補正した文字が届く。
  録音を確定した時点で、録音が履歴に残る（履歴を残す設定のとき）。
minimal_guarantee: |-
  文字起こしに失敗しても常駐サービスは止まらず、失敗を呼び出し元へ伝える。
  確定した録音は、文字起こしの成否によらず履歴に残る（履歴を残す設定のとき）。
  同時に動く録音は 1 つだけで、処理中に来た開始は受け付けない。
test_file: tests/e2e/複合ユースケース/test_transcribe_from_other_system.py
