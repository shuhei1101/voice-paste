title: "常駐アプリ / 起動と配線"
lead: 常駐サービスの入口。単一インスタンスを確かめ、各 feature と外部連携を関数で配線し（composition root）、API・ホットキー・トレイを立てて画面のイベントループを回す。
directory: |-
  ```
  src/voice_paste/
  ├── __init__.py
  ├── __main__.py              # python -m voice_paste で main() を呼ぶ
  ├── main.py                  # parse_args・build_handlers・build_ui_deps・apply_settings・start_local_session・main
  └── runtime/
      ├── single_instance.py   # 名前付きのミューテックスと終了の依頼（名前付きのイベント）
      ├── settings_store.py    # SettingsStore（動いている間の今の設定）
      ├── process.py           # relaunch（同じ引数で起動し直す）
      └── timer.py             # RepeatingTimer（上限での打ち切りを定期に呼ぶ）
  ```

  リポジトリの直下は `pyproject.toml`・`uv.lock`・`.python-version`・起動のバッチファイル 1 つ・`settings.sample.toml`・`README.md`・`CLAUDE.md`・`src/`・`resources/`・`tests/`・`dev/`・`docs/` に絞る。

  動かす環境は、リポジトリの直下で Windows の uv（WSL からは `uv.exe`）で `uv sync --frozen` を流して `.venv/` に作る（`uv.lock` の版で入り、Python の版は `.python-version` の 3.14）。
  Linux の uv で流すと `.venv/` を Linux の構成に作り直したうえで `pywin32` を入れられず止まるため、環境を作るコマンドと環境で流すコマンドは Windows の uv で流す（`uv lock` はどちらでもよい）。
  起動のバッチファイル（`voice-paste.bat`）は、`.venv` を有効にし、CUDA の DLL（`.venv` の `Lib/site-packages/nvidia/` の `cublas`・`cudnn`・`cuda_nvrtc` の `bin`）を `PATH` に足して、`pythonw -m voice_paste` を引数なしで起動する（コンソールを出さない）。
  起動の記録（起動した時刻・使った Python・起動の終了コード）は `%LOCALAPPDATA%\voice-paste\log\launcher.log` へ起動ごとに上書きで書く。
  ログの保持期間の削除（purge_old_logs）は日付の名前のログだけを消すため、上書きで大きさを保ち、日付でログを消す処理は持たない。
  `pyproject.toml` の `[project.scripts]` の `voice-paste` は `voice_paste.main:main` を指す。
diagrams:
  - name: 依存の向き
    diagram: |-
      ```mermaid
      classDiagram
        direction TB
        class 起動と配線
        class APIサーバー
        class ホットキーと画面
        class セッション
        class 録音
        class 文字起こし
        class 補正
        class 出力先
        class 履歴
        class 外部連携
        class 共通
        起動と配線 --> APIサーバー
        起動と配線 --> ホットキーと画面
        起動と配線 --> セッション
        起動と配線 --> 外部連携
        APIサーバー --> セッション : route の集約
        セッション --> 共通
        録音 --> 共通
        文字起こし --> 共通
        補正 --> 共通
        出力先 --> 外部連携
        履歴 --> 共通
        ホットキーと画面 --> 共通
        外部連携 --> 共通
      ```
data_models:
  - name: Handlers
    title: 配線済みの関数の束
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: 入口（API・ホットキー・画面）が使う配線済みのもの
    properties:
      - name: session_manager
        type: SessionManager
        description: セッション管理
      - name: session_api
        type: SessionApiDeps
        description: API サーバーへ渡すセッションの API の依存（設定の許可ホストを部分適用した返送先の確かめを含む）
      - name: settings_store
        type: SettingsStore
        description: 今効いている設定。出力先・録音・画面はここから読むため、保存した immediate の項目が次の回から効く
      - name: start_local_session
        type: Callable[[Entry], None]
        description: ホットキー・トレイの開始（SessionManager と notify を部分適用した start_local_session）
      - name: recorder_level
        type: Callable[[], float]
        description: 録音中の音量（Recorder.level）。録音の画面の波形に使う
      - name: stop_engine
        type: Callable[[], None]
        description: 文字起こしのエンジンを止める（WhisperWorkerClient.stop）。終了時に呼ぶ
    status: implemented
  - name: CliArgs
    title: 起動の引数
    container: main.py
    usecase: 常駐アプリを起動する
    role: DTO
    summary: '`python -m voice_paste` に渡した引数'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: data_dir
        type: Path | None
        description: データの置き場所（`--data-dir`）。渡したときは設定・履歴・ログ・一時の音声・トークンをこの下に置き、渡さなければ None（既定の置き場所）
    status: implemented
functions:
  - name: build_handlers
    title: 配線
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    role: composition root
    scope: public
    summary: 設定からエンジン・録音機・出力先・履歴を組み立て、SessionDeps を作って SessionManager と SessionApiDeps を返す
    args:
      - name: settings
        type: Settings
        required: true
        passing: positional
        description: 設定
      - name: paths
        type: AppPaths
        required: true
        passing: positional
        description: 置き場所
      - name: notify
        type: NotifyFn
        required: true
        passing: positional
        description: 画面への知らせ
      - name: report_progress
        type: ProgressFn
        required: true
        passing: positional
        description: 文字起こしの進みの知らせ（ui の report_progress）
      - name: notify_copied
        type: Callable[[str], None]
        required: true
        passing: positional
        description: コピーの完了の知らせ（ui の notify_copied）
    returns:
      type: Handlers
      description: 配線済みの関数の束
    process: |-
      1. 設定を SettingsStore に入れる。以降の配線は設定を値でなく SettingsStore.get から読む（保存した immediate の項目を次の回から効かせる）
      2. 設定のエンジン（local_whisper）の WhisperWorkerClient を作って起動し、その transcribe を文字起こしの engine に渡す。get_hint には、SettingsStore.get の hint_presets を join_hint_words でつなぎ、空なら None を返す関数を渡す
         - EngineError の場合、StartupError を送出する
      3. 連続録音の話し声の判定に使う VAD のセッションを 1 回だけ読む（load_vad_session。StartupError はそのまま送出する）
      4. Recorder に音量のアダプタと、SettingsStore から録音の設定を返す関数と、VAD のセッションを部分適用した StreamingVad（話し声の判定を作る）を渡す
      5. 出力先の deliver に、配線した OUTPUTS（_wire_outputs）・配線した PRESET_KINDS（_wire_preset_kinds）と、届けるたびに SettingsStore からオンの出力先の ID を引く関数を部分適用し、Session を入口・出力先の ID・選んだプリセット・返送先に分けて渡すアダプタを作る
         - 出力先には OutputDeps（copy_to_clipboard・設定の keyboard.paste_key で send_paste を呼ぶ関数・send_enter・time.sleep・random.uniform(0, x)・post_json・SettingsStore.get・notify_copied）を渡し、各出力先の inject が選ぶ
         - ブラウザ添付（種類）: copy_to_clipboard・open_app_window・send_paste を呼ぶ関数・send_enter・time.sleep・設定の preset_options.browser.open_delay_sec を返す関数・貼り付けて送信の enter_delay_sec を返す関数（read_enter_delay_sec）
         - エンドポイントへ送る（種類）: post_json・設定の preset_options.endpoint.timeout_sec を返す関数
      6. 用語集を文字起こしのたびに読み直す correct を作る（load_glossary → apply_glossary。読む場所はそのたびに、SettingsStore の設定と settings.toml のフォルダから pick_active_glossary で補正に使う用語集を引いて決める）
         - `[INFO]` 用語集で補正する（用語集の名前・補正に使う行数）
      7. SessionDeps を組み（report_progress、起動時の設定の api.continuous.min_silence_sec を部分適用した Recorder.start_continuous、Recorder.stop_continuous を含む）、API のセッションの上限時間と、起動時の設定の api.continuous.session_limit_sec の連続録音の上限時間と共に SessionManager を作る（api.continuous.* は再起動で効く）
      8. SessionManager と、設定の許可ホストを部分適用した is_callback_allowed を SessionApiDeps に束ねる
      9. start_local_session に SessionManager と notify を部分適用する
    exceptions:
      - name: StartupError
        condition: 文字起こしのエンジンを準備できない
    status: implemented
  - name: main
    title: 起動
    kind: 関数
    container: main.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 常駐サービスを起動し、終わるまで画面のイベントループを回す
    returns:
      type: int
      description: 終了コード
    process: |-
      1. 起動の引数を読む（parse_args。argv が None なら sys.argv[1:]）
      2. 置き場所を決め、ログを INFO で設定する（resolve_app_paths・setup_logging）
      3. 置き場所ごとの名前で単一インスタンスを確保する（instance_name・acquire_single_instance(SINGLE_INSTANCE_TIMEOUT_SEC)）
         - StartupError の場合、1 を返す（トレイを出す前のため、ログにだけ残す）
           - `[ERROR]` 起動に失敗した（理由）
      4. QApplication（最後の窓を閉じても終わらない）・UiBridge・Tray を作り、apply_theme(app, "system", image_dir=paths.ui_image_dir) で画面の明暗を当ててトレイに準備中を出す。WAKE_INTERVAL_MS ごとの空の QTimer を置き、SIGINT・SIGBREAK で QApplication.quit を呼ぶ。後から起動したプロセスに終わるよう頼まれたら、QApplication.quit をメインスレッドで呼ぶ（SingleInstanceLock.on_quit_requested に、QMetaObject.invokeMethod で QApplication.quit をキューに入れる関数を渡す）
      5. 設定を読む（load_settings(settings_file, SETTINGS_MODEL)）
         - SettingsError の場合、トレイを失敗にして設定を読めないことを通知し（Tray.show_failure(settings_invalid, 理由)）、「録音を始める」「設定…」を押せないまま 11 へ（フォルダを開いて settings.toml を直し、再起動できる）
           - `[ERROR]` 起動に失敗した（理由）
      6. 設定の ui.theme で画面の明暗を当て直し（apply_theme。image_dir は paths.ui_image_dir）、QStyleHints.colorSchemeChanged に、SettingsStore.get の ui.theme で apply_theme を呼ぶ関数をつなぐ（OS の明暗が変わったときに当て直す）。ルートロガーのレベルを設定のログのレベルにし、保持期間で古いログと履歴を消す（purge_old_files。処理中のセッションは無いため、一時の音声も全て消す対象にする）
         - `[INFO]` 設定を読んだ（設定ファイルのパス・エンジン・オンの出力先の ID）
      7. 配線する（build_handlers。notify・report_progress・notify_copied は UiBridge を部分適用した ui のもの）
         - StartupError の場合、トレイを失敗にして起動の失敗を通知し（Tray.show_failure(engine_unavailable, 理由)）、「設定…」だけを押せるまま 11 へ（設定画面は読んだ設定で開き、保存は settings.toml へ書くだけにする。Handlers が無いため、UiDeps のうち録音・ホットキーの関数（start・pause・resume・complete・cancel・current_session・level・suspend_hotkeys・resume_hotkeys）は何もしない関数にし、設定画面を閉じてもホットキーの受付を始めない）
           - `[ERROR]` 起動に失敗した（理由）
      8. UiController を作り（build_ui_deps）、UiBridge の知らせの受け手につなぐ（notified → on_notified・progressed → on_progressed・copied → on_copied。9 で待ち受けを始められない知らせを取りこぼさないよう、API より先に作る）
      9. トークンを作り、API サーバーを起動する（create_token・build_fastapi・ApiServerRunner.start(API_START_TIMEOUT_SEC)）
         - True の場合だけ、トークンのファイルを書く（write_token_file）
         - False の場合、トークンのファイルを書かずに api_unavailable を知らせて続ける（ホットキーとトレイからの録音は使える）。理由は「ポート {ポート} で待ち受けを始められません」の 1 文にする
      10. ホットキーの受付を始め（HotkeyListener.start(build_hotkey_bindings(設定))）、上限の打ち切りを RepeatingTimer で SESSION_LIMIT_CHECK_INTERVAL_SEC ごとに呼ぶ（SessionManager.truncate_if_expired）。古いログと履歴の削除を RepeatingTimer で PURGE_INTERVAL_SEC ごとに呼ぶ（purge_old_files。設定は呼ぶたびに SettingsStore.get から引き、設定画面で変えた保持期間・履歴を残すかを次の回から効かせる。処理中のセッションの ID は SessionManager.current から引く）。トレイを待機中にする
         - HotkeyError の場合、ホットキーを受け付けずに続ける（トレイから録音でき、設定画面で直せる）
           - `[ERROR]` ホットキーを受け付けられなかった（理由）
         - `[INFO]` 常駐サービスを始めた（API のポート）
      11. イベントループを回す（exec_loop）
      12. 抜けたら、新しい開始が来ないように入口とタイマー（ホットキー・API サーバー・2 つのタイマー）を先に止め、録音を捨て（SessionManager.close）、エンジンを止め、トレイを消す（8 までで立てたものだけ）。最後に単一インスタンスの排他を放す（SingleInstanceLock.release）
          - `[INFO]` 常駐サービスを終えた
      13. 再起動を頼まれていれば、同じ引数で起動し直す（relaunch。排他を放した後に呼ぶため、次のプロセスは待たずに排他を取れる）
      14. 0 を返す
    status: implemented
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: コマンドの引数。None なら sys.argv[1:]
      - name: exec_loop
        type: Callable[[QApplication], int]
        required: false
        default: QApplication.exec を呼ぶ関数
        passing: keyword
        description: イベントループを回す関数。テストではすぐ抜ける関数を渡す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 設定を読んで API・ホットキー・トレイを立て、イベントループが抜けたら片付けて 0 を返す
        condition: --data-dir に空の一時フォルダ。QT_QPA_PLATFORM=offscreen、exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。{data_dir}/settings.toml が既定値ででき、token_file があり、HotkeyListener が引数なしで作られ、HotkeyListener.start に既定のホットキーが渡り、RepeatingTimer が SESSION_LIMIT_CHECK_INTERVAL_SEC と PURGE_INTERVAL_SEC の 2 つ作られ、HotkeyListener.stop・2 つの RepeatingTimer.stop・ApiServerRunner.stop・SessionManager.close・stop_engine・Tray.hide がこの順に 1 回ずつ呼ばれ、最後に単一インスタンスの排他が放される（同じ data_dir でもう一度取れる）
      - name: test_main_when_invalid_settings
        case: 異常
        summary: 設定が合わなければトレイで知らせて入口を立てない
        condition: transcription.local_whisper.beam_size = "x" の settings.toml がある data_dir。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed と Tray.show_failure(settings_invalid, 理由) が呼ばれ（理由に transcription.local_whisper.beam_size が出る）、ERROR のログに transcription.local_whisper.beam_size が出、build_handlers・ApiServerRunner・HotkeyListener.start が呼ばれない
        exception: SettingsError
      - name: test_main_when_startup_error
        case: 異常
        summary: エンジンを準備できなければトレイを失敗にして続ける
        condition: build_handlers が StartupError を送出する。exec_loop はすぐ 0 を返す
        mock: build_handlers・ApiServerRunner・HotkeyListener・Tray
        expected: 0。Tray.set_failed と Tray.show_failure(engine_unavailable) が呼ばれ、ApiServerRunner が作られず、HotkeyListener.start が呼ばれない
        exception: StartupError
      - name: test_main_when_api_unavailable
        case: 正常
        summary: 待ち受けを始められなければトークンのファイルを書かずに知らせて続ける
        condition: 前回の起動の token_file がある data_dir。ApiServerRunner.start が False を返す。exec_loop はイベントを処理してから 0 を返す
        mock: build_handlers・ApiServerRunner・RepeatingTimer・HotkeyListener・Tray
        expected: 0。token_file が前回の内容のままで、Tray.show_failure に api_unavailable と「ポート {ポート} で待ち受けを始められません」が渡り、HotkeyListener.start が呼ばれる
      - name: test_main_when_restart_requested
        case: 正常
        summary: 再起動を頼まれたら片付けた後に起動し直す
        condition: exec_loop の中で UiDeps.request_restart を呼ぶ
        mock: build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray・relaunch
        expected: 0。relaunch が ApiServerRunner.stop と stop_engine の後に、同じ argv で 1 回呼ばれる
      - name: test_main_when_no_data_dir
        case: 正常
        summary: データの置き場所を渡さなければ既定の置き場所で起動する
        condition: argv=[]。QT_QPA_PLATFORM=offscreen、exec_loop はすぐ 0 を返す
        mock: platformdirs の user_config_dir・user_data_dir（それぞれ一時フォルダの config・local を返す）・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。一時フォルダの config/settings.toml が既定値ででき、local/api_token があり、local/log の下にログが書かれる
      - name: test_main_when_previous_instance_not_released
        case: 異常
        summary: 前のプロセスが排他を放さなければトレイを出さずに終わる
        condition: acquire_single_instance が StartupError を送出する
        mock: acquire_single_instance・build_handlers・Tray
        expected: 1。ERROR のログが 1 行出、Tray・build_handlers が作られない
        exception: 前のプロセスが排他を放さない
      - name: test_main_when_quit_requested
        case: 正常
        summary: 後から起動したプロセスに頼まれたら片付けて排他を放す
        condition: --data-dir に空の一時フォルダ。exec_loop の中で、on_quit_requested に渡された関数を別のスレッドから呼び、イベントを処理してから抜ける
        mock: acquire_single_instance（SingleInstanceLock の代わりを返す）・build_handlers・ApiServerRunner（start が True）・RepeatingTimer・HotkeyListener・Tray
        expected: 0。QApplication.quit がメインスレッドで呼ばれ、stop_engine・Tray.hide の後に SingleInstanceLock.release が 1 回呼ばれ、relaunch が呼ばれない
  - name: acquire_single_instance
    title: 単一インスタンスの確保
    kind: 関数
    container: runtime/single_instance.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: 名前付きのミューテックスを取る。取られていれば名前付きのイベントで前のプロセスに終わるよう頼み、解放を待ってから取る
    args:
      - name: name
        type: str
        required: true
        passing: positional
        description: 排他の名前（instance_name）。ミューテックスは `Local\{name}`、終了の依頼のイベントは `Local\{name}-quit` にする
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 前のプロセスの終わりを待つ上限
    returns:
      type: SingleInstanceLock
      description: 取った排他（終了の依頼を待つスレッドを持つ。終了時に release で放す）
    exceptions:
      - name: StartupError
        condition: 上限まで待っても前のプロセスが排他を放さない
    notes:
      強制終了しない: プロセスの番号での強制終了はしない（番号を使い回された無関係なプロセスを止めない）。
    status: implemented
    process: |-
      1. 名前付きのミューテックスを作る（ctypes で Win32 の CreateMutexW）
      2. 既にあった（ERROR_ALREADY_EXISTS）か
         - ある場合、前のプロセスの終了の依頼のイベントを開いて立て（OpenEventW・SetEvent）、ミューテックスの解放を timeout_sec まで待つ（WaitForSingleObject。前のプロセスが片付けずに落ちて放棄されたミューテックス（WAIT_ABANDONED）も取れたものとして扱う）
           - イベントを開けない場合（前のプロセスがミューテックスを作ってからイベントを作るまでの間）、OPEN_EVENT_RETRY_INTERVAL_SEC ごとに開き直しながら、同じ上限までミューテックスの解放を待つ（開けたらその時点で立てる）
           - `[INFO]` 前の常駐サービスに終わるよう頼んだ
           - 上限まで取れない場合、ミューテックスのハンドルを閉じて StartupError を送出する。上限まで一度もイベントを開けなかったときは、理由にその旨を書く
         - 無い場合、そのまま取れている
      3. 自分の終了の依頼のイベント（自動リセット）を作り、作った直後に ResetEvent で立ったまま残っていた依頼を消す（同じ名前のイベントは前のプロセスのハンドルが残る間は引き継がれ、取る前に立った依頼は前のプロセス宛てのため）
      4. 終了の依頼のイベントと、名前の無い自分専用の停止のイベントを WaitForMultipleObjects で待つデーモンスレッドを始めて SingleInstanceLock を返す
         - 終了の依頼のイベントが立った場合、受け手を 1 回呼んでスレッドを終える（2 回目以降の依頼は、既に終わりに向かっているため受けない）
         - 停止のイベントが立った場合、受け手を呼ばずにスレッドを終える
         - `[INFO]` 単一インスタンスを確保した（名前）
    unit_tests:
      - name: test_acquire_single_instance
        case: 正常
        summary: ほかに持つプロセスが無ければすぐ取れる
        condition: 一意の名前（テストごとに uuid を付ける）
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: SingleInstanceLock が返り、release の後に同じ名前でもう一度取れる
      - name: test_acquire_single_instance_when_held
        case: 正常
        summary: 持っている側に終わるよう頼み、放されたら取れる
        condition: 別のスレッドで同じ名前の SingleInstanceLock を先に取り、その on_quit_requested には呼ばれたことを知らせるだけの関数を渡す。知らせを受けたら、取ったスレッドが release する（名前付きのミューテックスは取ったスレッドだけが放せる）。テストのスレッドで timeout_sec=5 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: 先の on_quit_requested が 1 回呼ばれ、後の呼び出しが SingleInstanceLock を返す
      - name: test_acquire_single_instance_when_not_released
        case: 異常
        summary: 上限まで放されなければ StartupError
        condition: 別のスレッドで同じ名前の SingleInstanceLock を先に取り、頼まれても放さない。テストのスレッドで timeout_sec=0.2 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: StartupError。先の SingleInstanceLock は持ったまま
        exception: 上限まで待っても前のプロセスが排他を放さない
      - name: test_acquire_single_instance_when_taken_over
        case: 正常
        summary: 前の持ち主が依頼を受けて放した直後に取ったロックは、受け手を呼ばない
        condition: test_acquire_single_instance_when_held の流れで後から取ったロックに受け手を渡す。先のロックを取ったスレッドは、依頼の知らせを受けたら、同じ名前のイベントのハンドルを開いたまま、3 つ目の依頼として同じ名前のイベントをもう 1 回立ててから release する（立ったままの依頼が残り、acquire_single_instance の ResetEvent が無ければ後のロックの受け手が呼ばれる）
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: 後から取ったロックの受け手が 1 秒呼ばれない
      - name: test_acquire_single_instance_when_event_not_ready
        case: 正常
        summary: 前のプロセスのイベントがまだ無くても、開き直して頼む
        condition: 別のスレッドが CreateMutexW だけで同じ名前のミューテックスを持ち、0.3 秒後に同じ名前の終了の依頼のイベントを作り、立ったら放す。timeout_sec=5 で取る
        mock: なし（実物の Win32 の名前付きのミューテックスとイベント）
        expected: SingleInstanceLock が返り、別のスレッドがイベントの立ったことを受けている
  - name: start_local_session
    title: ホットキー・トレイからの開始
    kind: 関数
    container: main.py
    usecase: 録音する
    scope: public
    summary: SessionManager.start を呼び、断られた理由をユーザーへ知らせる。例外を pynput・画面のスレッドへ漏らさない
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: hotkey か tray
      - name: session_manager
        type: SessionManager
        required: true
        passing: injected
        description: セッション管理
      - name: notify
        type: NotifyFn
        required: true
        passing: injected
        description: ユーザーへの知らせ
    returns:
      type: None
      description: なし
    process: |-
      1. SessionManager.start(entry) を呼ぶ
         - SessionBusyError の場合、busy を知らせる（ダイアログ）
         - MicrophoneUnavailableError の場合、microphone_unavailable を知らせる（トレイ）
         - それ以外の例外の場合、ログに書いて握る
           - `[ERROR]` 録音を始められなかった（logger.exception）
    unit_tests:
      - name: test_start_local_session_when_busy
        case: 正常
        summary: 処理中なら busy を知らせる
        condition: start が SessionBusyError を送出する
        mock: session_manager・notify
        expected: notify に busy が渡り、例外が出ない
      - name: test_start_local_session_when_microphone_unavailable
        case: 正常
        summary: マイクを開けなければ microphone_unavailable を知らせる
        condition: start が MicrophoneUnavailableError を送出する
        mock: session_manager・notify
        expected: notify に microphone_unavailable が渡り、例外が出ない
      - name: test_start_local_session_when_unexpected_error
        case: 正常
        summary: 想定外の例外も漏らさない
        condition: start が RuntimeError を送出する
        mock: session_manager・notify
        expected: 例外が出ず、ERROR のログが 1 行出る
    status: implemented
  - name: parse_args
    title: 起動の引数の解釈
    kind: 関数
    container: main.py
