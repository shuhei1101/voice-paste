title: haas_asr
kind: ライブラリ
lead: Haas-ja-v1.0 のモデルで日本語の音声を文字に起こす Python のライブラリ。
used_in:
  - haas_server/main.py
version:
  current: 0.1.0（acc614f）
  checked_on: '2026-11-06'
  source: haas_server/pyproject.toml の git の依存と haas_server/uv.lock
  pinning: git の commit で固定（PyPI に無いため）
license: Apache-2.0
official_url: https://github.com/third-intelligence/Haas-ASR
verification:
  state: 済
  date: '2026-11-05'
  detail: PoC（#265）で、WSL の RTX 5070 で load_model・transcribe・transcribe_longform・Vocabulary を動かし、全件を起こせることを確かめた
catalogs:
  - name: API
    version: 0.1.0
    entries:
      - name: load_model
        kind: 関数
        purpose: モデルを読み込む。device（既定 cuda）と dtype（既定 auto。auto 以外は torch の型）を受ける
      - name: transcribe
        kind: 関数
        purpose: 約 30 秒までの音声の配列を起こす。batch_size（既定 64）・vocabulary・guard（既定 true）を受ける
      - name: transcribe_longform
        kind: 関数
        purpose: 30 秒を超える音声を静かな箇所で区切って起こす。途中の進みは返さない。batch_size・separator（既定は空）・vocabulary・guard と、split_at_quiet_points へ渡す chunk_seconds・search_seconds・window_seconds を受ける。batch_size を変えると紙一重の箇所の結果がまれに変わる
      - name: Vocabulary
        kind: クラス
        purpose: 表記 → 読みの一覧の対応で語の手がかりを持つ。読みが空の語は表記だけで持つ。alpha（既定 2.0）は手がかりの強さで、上げると聞き逃した単語を検出しやすくなるが、話していない単語も出力しやすくなる
      - name: split_at_quiet_points
        kind: 関数
        purpose: 音声を chunk_seconds（既定 30.0）ごとに、前後 search_seconds（既定 2.0）の範囲で window_seconds（既定 0.1）の窓のいちばん静かな箇所で区切る。transcribe_longform が使う
notes:
  制限: load_audio は soundfile で読むため webm・mp4 を読めない。voice-paste は PyAV で復号した配列を渡す。Haas-ASR の pyproject.toml の `[tool.uv]`（compile-bytecode・override-dependencies）は依存へ伝わらないため `haas_server/pyproject.toml` へ写す。flash-linear-attention 0.5.2 は triton 3.9 でモデルの読み込みに失敗するため torch・triton を PoC の版に固定する
id: LIB-30
