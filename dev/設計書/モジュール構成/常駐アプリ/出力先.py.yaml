title: "常駐アプリ / 出力先"
lead: 起こした文字の届け方を出力先ごと・カスタムプリセットの種類ごとのサブフォルダに分け、一覧への登録で足せる形にする。出力先どうしは import しない。
directory: |-
  ```
  src/voice_paste/features/outputs/
  ├── __init__.py          # deliver・OUTPUTS・PRESET_KINDS・is_callback_allowed の公開
  ├── types.py             # 出力先・プリセットの種類の関数型と定義、配線に渡すもの（OutputDeps）、送る中身（pydantic）
  ├── registry.py          # OUTPUTS・PRESET_KINDS（出力先・プリセットの種類の一覧。足すときはここに 1 行足す）
  ├── service.py           # deliver（入口と確定の操作で出力先かプリセットを選んで呼ぶ）
  ├── paste_and_send/
  │   ├── settings.py      # PasteAndSendSettings（貼り付けて送信の設定のモデル）
  │   └── service.py       # paste_and_send・inject_paste_and_send・read_enter_delay_sec・read_enter_modifiers
  ├── paste_only/
  │   ├── settings.py      # PasteOnlySettings
  │   └── service.py       # paste_only・inject_paste_only
  ├── copy_only/
  │   ├── settings.py      # CopyOnlySettings
  │   └── service.py       # copy_only・inject_copy_only
  ├── browser/
  │   └── service.py       # send_to_browser（ブラウザ添付の種類のプリセット。Edge のアプリの画面）
  ├── endpoint/
  │   └── service.py       # deliver_to_endpoint（エンドポイントへ送るの種類のプリセット）
  └── callback/
      └── service.py       # deliver_to_caller・is_callback_allowed・inject_callback・返送の決定値（呼び出し元へ返す）
  ```

  出力先を 1 つ足すときは、`features/outputs/{出力先}/` に届ける関数・注入するものを選ぶ関数（InjectFn）・設定のモデル（OutputSettingsBase を継ぐ。設定の outputs[] に置かない出力先は持たない）を置き、OUTPUTS に 1 件登録する。設定のモデル・既定の出力先の一覧・確定のホットキー・設定画面の欄・録音の画面のボタン・配線は OUTPUTS から組み立てるため、既存のモジュールは変えない。

  各出力先・プリセットの種類はクリップボード・キー・ブラウザ・HTTP の操作を関数で受け取り、`integrations` の関数を import しない（main.py が外部連携の copy_to_clipboard・send_paste・send_enter・open_app_window・post_json を OutputDeps に束ねて渡し、各出力先の InjectFn がそこから選んで部分適用させる）。型注釈のために integrations の型（PostResult・PostJsonFn）だけを import する。
data_models:
  - name: OutputSpec
    title: 出力先の定義
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: 出力先の ID・表示名・届ける関数・設定のモデル・注入するものを選ぶ関数の組。出力先を足すときに既存のモジュールが要る知識はここに全て持たせる
    properties:
      - name: id
        type: str
        description: 出力先の ID。設定の出力先の一覧と確定の操作がこの ID で指す
        example: paste_and_send
      - name: title
        type: str
        description: '画面に出す名前（文言は #21 で決める）'
      - name: handler
        type: OutputFn
        description: 届ける関数
      - name: api_only
        type: bool
        default: 'False'
        description: API から始めた録音だけが使うか（呼び出し元へ返すだけが True）
      - name: settings_model
        type: type[OutputSettingsBase] | None
        default: None
        description: 出力先の設定のモデル（id の既定値が OutputSpec.id と同じ）。設定の outputs[] の検証・既定の一覧・設定画面の欄はこれから組み立てる。オン・オフを持たず設定の outputs[] に置かない出力先（API 専用の呼び出し元へ返す）は None
      - name: inject
        type: InjectFn
        default: 注入するものの無い関数（空の dict を返す）
        description: 配線で handler に部分適用するものを OutputDeps から選ぶ（_wire_outputs が呼ぶ）
    status: implemented
  - name: PresetKindSpec
    title: プリセットの種類の定義
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: カスタムプリセットの種類・表示名・届ける関数の組
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: str
        description: プリセットの種類。設定の presets[].kind がこの値で指す
        example: browser
      - name: title
        type: str
        description: 種類の名前（ブラウザ添付・エンドポイントへ送る）
      - name: handler
        type: PresetFn
        description: 届ける関数
    status: implemented
  - name: ResultPayload
    title: 送る中身
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: スキーマ
    summary: 呼び出し元へ返す・エンドポイントへ送るが送る JSON
    inherits: pydantic.BaseModel
    properties:
      - name: session_id
        type: str
        description: セッションの ID
      - name: result
        type: Literal["transcribed", "failed", "truncated"]
        description: 結果の種類
      - name: text
        type: str
        description: 起こした文字（空もある）
      - name: error
        type: str | None
        description: 失敗の理由
    methods:
      - name: from_outcome
        title: 結果から作る
        kind: メソッド
        summary: 結果から送る中身を作る（@classmethod）
        args:
          - name: outcome
            type: TranscriptionOutcome
            required: true
            passing: positional
            description: 届ける結果
        returns:
          type: ResultPayload
          description: outcome の session_id・result・text・error を写した中身
        unit_tests:
          - name: test_result_payload_from_outcome
            case: 正常
            summary: 結果を写す
            condition: session_id が s1・result が transcribed・text が「テスト」・error が None の outcome
            mock: なし
            expected: 'model_dump() が {session_id: s1, result: transcribed, text: テスト, error: None}'
    refs:
      - dev/設計書/インターフェース定義/常駐アプリ/呼び出し元へ返す.py#
      - dev/設計書/インターフェース定義/常駐アプリ/設定のエンドポイントへ送信する.py#
    status: implemented
  - name: OutputDeps
    title: 出力先の配線に渡すもの
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: main.py が組み、各出力先の InjectFn が handler に部分適用するものを選ぶ元にする、外部連携の関数と今の設定の束
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。出力先が増えても、新しい出力先が使う外部連携がここに無いときだけ項目を足す（そのときは出力先の追加ではなく外部連携の追加として扱う）。'
    properties:
      - name: copy
        type: Callable[[str], None]
        description: クリップボードへ書く（copy_to_clipboard。書けなければ DeliveryError）
      - name: paste
        type: Callable[[], None]
        description: 貼り付けのキーを送る（呼ぶたびに設定の keyboard.paste_key を読んで send_paste を呼ぶ）
      - name: send_enter
        type: SendEnterFn
        description: 渡した修飾キーを押したまま Enter を送る（修飾キーを省くと Enter だけ）
      - name: sleep
        type: Callable[[float], None]
        description: 間を置く（time.sleep）
      - name: jitter
        type: Callable[[float], float]
        description: 0 以上この値以下の乱数を返す（random.uniform(0, x)）
      - name: post
        type: PostJsonFn
        description: JSON を POST してステータスを返す（外部連携の post_json）
      - name: get_settings
        type: Callable[[], Settings]
        description: 今の設定を返す（SettingsStore.get。届けるたびに読み、保存した immediate の項目を次の回から効かせる）
      - name: notify_copied
        type: Callable[[str], None]
        description: コピーの完了を起こした文字と共に画面へ知らせる（ui の notify_copied に UiBridge を部分適用したもの）
    status: planned
  - name: PasteAndSendSettings
    title: 貼り付けて送信の設定
    container: features/outputs/paste_and_send/settings.py
    usecase: 起こした文字を届ける
    role: 設定のモデル
    summary: 出力先 paste_and_send のオン・オフ・確定のホットキー・貼り付けから送信までの間・Enter と一緒に押す修飾キー
    inherits: OutputSettingsBase
    properties:
      - name: id
        type: Literal["paste_and_send"]
        default: paste_and_send
        description: 出力先の ID（設定の outputs[] の判別子）
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+d
        description: この出力先で確定するホットキー
      - name: enter_delay_sec
        type: float
        default: '0.5'
        description: 貼り付けてから Enter を送るまで待つ秒数（0 以上）。設定画面の欄の下に、`json_schema_extra` の note の「「貼り付けて送信」と、「ブラウザ添付」の Enter まで送るプリセットで使う。」を出す
      - name: enter_modifiers
        type: list[EnterModifier]
        default: '[]'
        description: Enter と一緒に押す修飾キー。設定画面は「。」までを欄の名前にし、`json_schema_extra` の choice_labels（ctrl → Ctrl・alt → Alt・shift → Shift）でチェックボックスの名前を出す。反映は immediate。並びと重なりはそのまま持ち、押す順は send_enter が揃える
    status: planned
  - name: PasteOnlySettings
    title: 貼り付けのみの設定
    container: features/outputs/paste_only/settings.py
    usecase: 起こした文字を届ける
    role: 設定のモデル
    summary: 出力先 paste_only のオン・オフ・確定のホットキー
    inherits: OutputSettingsBase
    properties:
      - name: id
        type: Literal["paste_only"]
        default: paste_only
        description: 出力先の ID
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+v
        description: この出力先で確定するホットキー
    status: planned
  - name: CopyOnlySettings
    title: コピーのみの設定
    container: features/outputs/copy_only/settings.py
    usecase: 起こした文字を届ける
    role: 設定のモデル
    summary: 出力先 copy_only のオン・オフ・確定のホットキー
    inherits: OutputSettingsBase
    properties:
      - name: id
        type: Literal["copy_only"]
        default: copy_only
        description: 出力先の ID
      - name: enabled
        type: bool
        default: 'True'
        description: オンか
      - name: hotkey
        type: str
        default: <ctrl>+<alt>+c
        description: この出力先で確定するホットキー
    status: planned
  - name: CallbackPayload
    title: 呼び出し元へ返す中身
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    role: スキーマ
    summary: 呼び出し元へ返すが送る JSON。送る中身に、連続録音の区間の通し番号と区間の数を足す
    description: 設定のエンドポイントへ送信する中身（ResultPayload）は変えないため、呼び出し元へ返すときだけこの子を使う。
    inherits: ResultPayload
    properties:
      - name: result
        type: Literal["transcribed", "failed", "truncated", "completed"]
        description: 結果の種類（completed は連続録音だけ）
      - name: segment_number
        type: int | None
        description: 連続録音の区間の通し番号。それ以外は None
      - name: segment_count
        type: int | None
        description: 連続録音の終わり（completed・truncated）の区間の数。それ以外は None
    methods:
      - name: from_outcome
        title: 結果から作る
        kind: メソッド
        summary: 結果から返す中身を作る（@classmethod）
        args:
          - name: outcome
            type: TranscriptionOutcome
            required: true
            passing: positional
            description: 届ける結果
        returns:
          type: CallbackPayload
          description: outcome の session_id・result・text・error・segment_number・segment_count を写した中身
        unit_tests:
          - name: test_callback_payload_from_outcome
            case: 正常
            summary: 区間の結果を写す
            condition: session_id が s1・result が transcribed・text が「テスト」・segment_number が 2 の outcome
            mock: なし
            expected: 'model_dump() が {session_id: s1, result: transcribed, text: テスト, error: None, segment_number: 2, segment_count: None}'
          - name: test_callback_payload_from_outcome_when_single
            case: 正常
            summary: 1 回の録音の結果は通し番号と区間の数が None
            condition: segment_number・segment_count を持たない transcribed の outcome
            mock: なし
            expected: segment_number・segment_count が None
    refs:
      - dev/設計書/インターフェース定義/常駐アプリ/呼び出し元へ返す.py#
    status: planned
    introduced:
      pr: 78
function_types:
  - name: OutputFn
    title: 出力先
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    summary: 1 つの出力先へ結果を届ける。届けられなければ DeliveryError
    args:
      - name: outcome
        type: TranscriptionOutcome
        description: 届ける結果
      - name: target
        type: str | None
        description: 出力先に固有の宛先（返送先の URL）。持たない出力先は None
    returns:
      type: None
      description: なし
    implementations:
      - target: paste_and_send
        notes: クリップボードへ書き、貼り付けのキーと Enter を送る
      - target: paste_only
        notes: クリップボードへ書き、貼り付けのキーを送る
      - target: copy_only
        notes: クリップボードへ書く
      - target: deliver_to_caller
        notes: 返送先へ POST する。API から始めた録音だけが使う
    status: implemented
  - name: PresetFn
    title: プリセットの種類
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    summary: 確定の操作で選んだカスタムプリセット 1 つへ結果を届ける。届けられなければ DeliveryError
    args:
      - name: outcome
        type: TranscriptionOutcome
        description: 届ける結果
      - name: preset
        type: Preset
        description: 確定の操作で選んだプリセット（確定したときの設定の写し）
    returns:
      type: None
      description: なし
    implementations:
      - target: send_to_browser
        notes: ブラウザ添付。Edge のアプリの画面を開いて貼り付け、設定によって Enter まで送る
      - target: deliver_to_endpoint
        notes: エンドポイントへ送る。プリセットの URL へ JSON を 1 回 POST する
    status: implemented
  - name: InjectFn
    title: 注入するものの選び方
    container: features/outputs/types.py
    usecase: 起こした文字を届ける
    summary: 配線に渡すものから、1 つの出力先の handler に部分適用するキーワード引数を選んで返す
    args:
      - name: deps
        type: OutputDeps
        description: 外部連携の関数と今の設定
    returns:
      type: Mapping[str, object]
      description: handler の injected の引数名 → 渡すもの
    implementations:
      - target: inject_paste_and_send
        notes: 貼り付けて送信
      - target: inject_paste_only
        notes: 貼り付けのみ
      - target: inject_copy_only
        notes: コピーのみ
      - target: inject_callback
        notes: 呼び出し元へ返す
    status: planned
constants:
  - name: OUTPUTS
    title: 出力先の一覧
    container: features/outputs/registry.py
    usecase: 起こした文字を届ける
    summary: 登録した出力先。出力先を 1 つ足すときに既存のモジュールで変えるのはここだけ（品質シナリオ 5）
    entries:
      - key: '0'
        value: OutputSpec(id="paste_and_send", title="貼り付けて送信", handler=paste_and_send, settings_model=PasteAndSendSettings, inject=inject_paste_and_send)
        description: 貼り付けて送信
      - key: '1'
        value: OutputSpec(id="paste_only", title="貼り付けのみ", handler=paste_only, settings_model=PasteOnlySettings, inject=inject_paste_only)
        description: 貼り付けのみ
      - key: '2'
        value: OutputSpec(id="copy_only", title="コピーのみ", handler=copy_only, settings_model=CopyOnlySettings, inject=inject_copy_only)
        description: コピーのみ
      - key: '3'
        value: OutputSpec(id="callback", title="呼び出し元へ返す", handler=deliver_to_caller, inject=inject_callback, api_only=True)
        description: 呼び出し元へ返す
    status: implemented
    notes:
      配線: 各 handler が受け取るクリップボード・キー・HTTP の操作と設定の値は、各出力先の inject が OutputDeps から選び、main.py の _wire_outputs が部分適用する（main.py は出力先の ID ごとの表を持たない）。
      一覧から組み立てるもの: 設定のモデル（main.py の SETTINGS_MODEL = build_settings_model(settings_model を持つ出力先のモデルを OUTPUTS の並びで)）・既定の出力先の一覧（同じ並び）・画面に出す出力先の名前（UiDeps.output_titles）・配線。設定画面の出力先固有の欄は設定のモデルの項目から組み立てる。
  - name: PRESET_KINDS
    title: プリセットの種類の一覧
    container: features/outputs/registry.py
    usecase: 起こした文字を届ける
    summary: 登録したカスタムプリセットの種類。種類を足すときはここと、設定のプリセットのモデルの判別共用体と、画面の種類の名前に 1 行ずつ足す
    entries:
      - key: '0'
        value: PresetKindSpec(kind="browser", title="ブラウザ添付", handler=send_to_browser)
        description: ブラウザ添付
      - key: '1'
        value: PresetKindSpec(kind="endpoint", title="エンドポイントへ送る", handler=deliver_to_endpoint)
        description: エンドポイントへ送る
    notes:
      配線: 各 handler が受け取るクリップボード・キー・ブラウザ・HTTP の操作と設定の値は、main.py が種類ごとに部分適用する（起動と配線の _wire_preset_kinds）。
    status: implemented
  - name: CALLBACK_TIMEOUT_SEC
    title: 返送のタイムアウト
    container: features/outputs/callback/service.py
    usecase: 起こした文字を届ける
    summary: post_json へ渡す 1 回の POST のタイムアウト。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.5'
    status: planned
  - name: CALLBACK_RETRY_COUNT
    title: 返送の再送回数
    container: features/outputs/callback/service.py
    usecase: 起こした文字を届ける
    summary: 最初の 1 回の後に再送する回数。非機能要件の返送のタイムアウトと再送の決定値
    value: '3'
    status: planned
  - name: CALLBACK_RETRY_BASE_SEC
    title: 返送の再送の間隔の基数
    container: features/outputs/callback/service.py
    usecase: 起こした文字を届ける
    summary: 再送の間隔の基数（回ごとに 2 倍にし、フルジッターをかける）。非機能要件の返送のタイムアウトと再送の決定値
    value: '1.0'
    status: planned
functions:
  - name: deliver
    title: 出力先への配送
    kind: 関数
    container: features/outputs/service.py
    usecase: 起こした文字を届ける
    role: サービス
    scope: public
    inherits: DeliverFn（main.py でセッションを分けて渡す）
    summary: 入口と確定の操作で、出力先かカスタムプリセットを 1 つ選んで届ける
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: 入口
      - name: output_id
        type: str | None
        required: true
        passing: positional
        description: 確定の操作で選んだ固定の出力先の ID（プリセットを選んだときと API のときは None）
      - name: preset
        type: Preset | None
        required: true
        passing: positional
        description: 確定の操作で選んだカスタムプリセット（固定の出力先を選んだときと API のときは None）
      - name: callback_url
        type: str | None
        required: true
        passing: positional
        description: 返送先（API のときだけ）
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: enabled_ids
        type: frozenset[str]
        required: true
        passing: injected
        description: 設定でオンにした出力先の ID
      - name: outputs
        type: Sequence[OutputSpec]
        required: true
        passing: injected
        description: 出力先の一覧（OUTPUTS）
      - name: preset_kinds
        type: Sequence[PresetKindSpec]
        required: true
        passing: injected
        description: プリセットの種類の一覧（PRESET_KINDS）
    returns:
      type: None
      description: なし
    process: |-
      1. 入口が api なら、呼び出し元へ返す出力先を選び、返送先を宛先にして届ける（設定のオン・オフ・プリセットによらない）
