title: 常駐アプリ / 外部連携 / server.py
constants:
  - name: HAAS_START_TIMEOUT_SEC
    title: Haas のサーバーの起動の待ち時間
    container: integrations/haas/server.py
    usecase: 常駐アプリを起動する
    summary: サーバーを起動してから応答するまで待つ秒数
    value: '60.0'
    refs:
      - NFR-1#requirements[Haasのサーバーの起動の待ち時間]
    status: planned
  - name: HAAS_HEALTH_INTERVAL_SEC
    title: Haas のサーバーの応答の確認の間隔
    container: integrations/haas/server.py
    usecase: 常駐アプリを起動する
    summary: 起動を待つ間に GET /health を送信する間隔
    value: '0.5'
    refs:
      - NFR-1#requirements[Haasのサーバーの起動の待ち時間]
    status: planned
  - name: HAAS_SERVER_DIR
    title: Haas のサーバーのフォルダ
    container: integrations/haas/server.py
    usecase: 常駐アプリを起動する
    summary: リポジトリの haas_server フォルダ。wsl.exe の --cd に引き渡す
    value: REPO_ROOT / "haas_server"
    status: planned
classes:
  - name: HaasServer
    title: Haas の文字起こしのサーバー
    container: integrations/haas/server.py
    usecase: 常駐アプリを起動する
    role: アダプタ
    kind: クラス
    summary: WSL の中の Haas の文字起こしのサーバーを、必要なら wsl.exe で起動して応答を待ち、自分が起動したサーバーだけを止める
    description: 起動の前から応答するサーバーは使用するだけで止めない。止めるのは POST /shutdown で、モデルの読み込み中など /shutdown が届かないときだけ wsl.exe のプロセスを終わらせる。wsl.exe を終わらせると WSL の中のプロセスも終わることを、2026-11-06 に Windows の Stop-Process で確認した（torch を import した python。wsl.exe を止めた直後に終了した）。
    properties:
      - name: _settings
        type: HaasSettings
        access: 内部 (_)
        description: ディストリビューション・ポート・モデル・計算の精度・装置
      - name: _stopped
        type: threading.Event
        access: 内部 (_)
        description: stop が呼ばれたら起動の待ちを打ち切る
      - name: _popen
        type: Callable[..., subprocess.Popen]
        access: 内部 (_)
        default: subprocess.Popen
        description: wsl.exe を起動する関数（テストで差し替える）
      - name: _clock
        type: Callable[[], float]
        access: 内部 (_)
        default: time.monotonic
        description: 待ちの時計（テストで差し替える）
      - name: _transport
        type: httpx.BaseTransport | None
        access: 内部 (_)
        default: None
        description: httpx.Client に引き渡すトランスポート（テストで差し替える）
      - name: _process
        type: subprocess.Popen | None
        access: 内部 (_)
        default: None
        description: このインスタンスが起動した wsl.exe。None なら起動していない
    methods:
      - name: ensure_started
        title: サーバーの起動の確認
        kind: メソッド
        scope: public
        summary: 接続先が応答すれば設定と起動の引数を比べてそのまま使い、応答が無ければ wsl.exe で設定の値を引数にして起動し、応答を待つ
        returns:
          type: tuple[Literal["model", "dtype", "device"], ...]
          description: 起動の前から動いていたサーバーのうち設定と違う項目を model・dtype・device の順で。起動したときと全て同じときは空
        process: |-
          1. GET /health を送信する（_read_health）
             - 200 の場合、応答の model・dtype・device を設定の値と文字列で比べ、違う項目（応答に無い項目も違うものとする）を返却して終える
               - `[INFO]` 動いている Haas のサーバーを使用する（ポート）
               - 違う項目がある場合
                 - `[WARNING]` 動いている Haas のサーバーが設定と違う（項目ごとのサーバーの値と設定の値。設定の値で動かすにはサーバーを止めてから起動し直す）
          2. `wsl.exe [-d {distribution}] --cd {HAAS_SERVER_DIR} -e bash start.sh {port} {model} {dtype} {device}` を _popen で起動し、_process に持つ（標準入出力は開かない。Windows では CREATE_NO_WINDOW）
             - wsl.exe を起動できない（OSError）場合、EngineError を送出する
          3. HAAS_START_TIMEOUT_SEC まで、HAAS_HEALTH_INTERVAL_SEC ごとに _read_health を呼ぶ
             - 200 の場合、空を返却して終える
               - `[INFO]` Haas のサーバーを起動した（かかった秒・ポート）
             - 起動した wsl.exe が 0 以外で終わった場合、EngineError を送出する
             - stop が呼ばれた場合、_process.terminate で wsl.exe を終わらせ（stop が _process を確認した後に起動しても残さない）、EngineError を送出する
          4. _process.terminate で wsl.exe を終わらせ、EngineError を送出する（理由は待ち時間までに応答が無いこと。読み込み中のサーバーが残って GPU を使い続けないようにする）
        exceptions:
          - name: EngineError
            condition: wsl.exe を起動できない・起動スクリプトが失敗して終わった・待ち時間までに応答が無い・起動の待ちの間に stop された
        unit_tests:
          - name: test_ensure_started_when_already_running
            case: 正常
            summary: 接続先が応答すれば起動しない
            condition: /health が 200 で、model・dtype・device が設定と同じ
            mock: httpx.MockTransport・_popen
            expected: 空が返る。_popen が呼ばれない。stop の後に /shutdown が送信されない
          - name: test_ensure_started_when_not_running
            case: 正常
            summary: 応答が無ければ起動して応答を待つ
            condition: /health が 1 回目は接続エラー、2 回目は 200。distribution="Ubuntu-24.04"・port=47824・model="x/model"・dtype="float32"・device="cpu"
            mock: httpx.MockTransport・_popen・_clock
            expected: _popen に wsl.exe -d Ubuntu-24.04 --cd {HAAS_SERVER_DIR} -e bash start.sh 47824 x/model float32 cpu が渡り、空が返る
          - name: test_ensure_started_when_default_distribution
            case: 正常
            summary: ディストリビューションが空なら -d を付けない
            condition: distribution=""
            mock: httpx.MockTransport・_popen・_clock
            expected: _popen の引数に -d が無い
          - name: test_ensure_started_when_wsl_missing
            case: 異常
            summary: wsl.exe を起動できない
            condition: _popen が FileNotFoundError を送出する
            mock: httpx.MockTransport・_popen
            expected: EngineError
            exception: wsl.exe を起動できない
          - name: test_ensure_started_when_script_failed
            case: 異常
            summary: 起動スクリプトが失敗して終わる
            condition: Popen.poll が 1 を返却する
            mock: httpx.MockTransport・_popen・_clock
            expected: EngineError
            exception: 起動スクリプトが失敗して終わった
          - name: test_ensure_started_when_timeout
            case: 異常
            summary: 待ち時間までに応答が無い
            condition: /health が接続エラーのまま _clock が HAAS_START_TIMEOUT_SEC を過ぎる
            mock: httpx.MockTransport・_popen・_clock
            expected: EngineError。Popen.terminate が呼ばれている
            exception: 待ち時間までに応答が無い
          - name: test_ensure_started_when_running_differs
            case: 正常
            summary: 動いているサーバーが設定と違う
            condition: /health が 200 で dtype="float32"・device="cpu"。設定は dtype="auto"・device="cuda"、model は同じ
            mock: httpx.MockTransport・_popen
            expected: ("dtype", "device") が返る。_popen が呼ばれない。[WARNING] のログがある
          - name: test_ensure_started_when_running_without_fields
            case: 正常
            summary: 動いているサーバーが dtype・device を返却しない
            condition: /health が 200 で model だけを返却する（前のバージョンのサーバー）。model は設定と同じ
            mock: httpx.MockTransport・_popen
            expected: ("dtype", "device") が返る
        status: planned
      - name: stop
        title: サーバーの停止
        kind: メソッド
        scope: public
        summary: このインスタンスが起動したサーバーを止める。起動の待ちも打ち切る
        returns:
          type: None
          description: 応答を待たない
        process: |-
          1. _stopped をセットする
          2. _process が None なら終える（起動の前から動いていたサーバーは止めない）
          3. POST /shutdown を送信する（接続 HAAS_CONNECT_TIMEOUT_SEC）
             - httpx.HTTPError の場合、_process.terminate で wsl.exe を終わらせる
               - `[WARNING]` Haas のサーバーへ /shutdown が届かないため wsl.exe を終わらせた（例外の種類）
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 起動したサーバーを止める
            condition: ensure_started で起動した後に stop
            mock: httpx.MockTransport・_popen・_clock
            expected: POST /shutdown が 1 回送信される
          - name: test_stop_when_unreachable
            case: 正常
            summary: 止められなくても例外を出さない
            condition: /shutdown が接続エラー
            mock: httpx.MockTransport・_popen・_clock
            expected: 例外が出ない
          - name: test_stop_when_loading
            case: 正常
            summary: 起動の待ちの間に止めると wsl.exe を終わらせる
            condition: /health も /shutdown も接続エラーの間に別スレッドから stop を呼ぶ
            mock: httpx.MockTransport・_popen・_clock
            expected: Popen.terminate が呼ばれ、ensure_started が EngineError を送出する
        status: planned
      - name: _read_health
        title: 準備の確認の応答の読み取り
        kind: メソッド
        scope: internal
        summary: GET /health を送信し、200 なら応答の JSON を返却する
        returns:
          type: dict[str, object] | None
          description: 200 の応答の JSON。接続できない・200 以外・JSON でないときは None
        process: |-
          1. httpx.Client（接続 HAAS_CONNECT_TIMEOUT_SEC）で GET /health を送信する
             - 200 で JSON のオブジェクトの場合、それを返却する
             - httpx.HTTPError・200 以外・JSON でない場合、None を返却する
        status: planned
    refs:
      - SC-5#
      - SC-2#
      - IF-13#
      - IF-14#
    status: planned
id: MOD-96
visibility: internal
test_files:
  - tests/unit/voice_paste/integrations/haas/test_server.py
