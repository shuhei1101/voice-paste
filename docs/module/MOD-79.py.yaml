id: MOD-79
visibility: internal
title: 常駐アプリ / 外部連携 / probe.py
test_files:
  - tests/unit/voice_paste/integrations/audio/test_probe.py
functions:
  - name: probe_audio
    title: 音声の形式の読み取り
    kind: 関数
    container: integrations/audio/probe.py
    usecase: ブラウザから音声を送信する
    scope: public
    inherits: ブラウザの文字起こしの ProbeAudioFn
    summary: 受けた音声を PyAV（av.open）で開き、容れ物の形式・秒数・大きさを返却する。開けない・音声のストリームが無いときは AudioUnreadableError
    args:
      - name: file
        type: BinaryIO
        required: true
        passing: positional
        description: 受けた音声（頂から読み込めるもの。読み込んだ後は頂へ戻す）
    returns:
      type: AudioProbe
      description: 読み込んだ形式
    process: |-
      1. file の大きさを数えて頂へ戻す
      2. av.open で開き、音声のストリームが 1 つ以上あるかを確認する
         - av.error.FFmpegError の場合、または音声のストリームが無い場合、AudioUnreadableError を送出する（理由には音声の中身を含めない）
      3. container.format.name を拡張子の表で拡張子にする（`matroska,webm` → `.webm`、`mov,mp4,m4a,3gp,3g2,mj2` → `.mp4`、`ogg` → `.ogg`、`mp3` → `.mp3`、`wav` → `.wav`。表に無い形式は `.bin`）
      4. 秒数を求める
         - container.duration があれば container.duration / av.time_base
         - 無ければ（Edge の MediaRecorder の webm）、音声のストリームを demux し、pts と duration を持つパケットの (pts + duration) × time_base の最大を秒数にする（デコードはしない）。パケットからも求まらなければ None
      5. file を頂へ戻して AudioProbe を返却する
    exceptions:
      - name: AudioUnreadableError
        condition: PyAV で開けないか、音声のストリームが無い
    unit_tests:
      - name: test_probe_audio
        case: 正常
        summary: 録れた形式を読み込む
        condition: PoC で Edge が録った webm/opus（Cues 無し）・fragmented MP4（AAC）と、テストの中で書き出した WAV・ogg・MP3
        mock: なし（本物の PyAV）
        expected: suffix がそれぞれ `.webm`・`.mp4`・`.wav`・`.ogg`・`.mp3` で、duration_sec がどれも元の音声の秒数と 0.2 秒以内（Cues の無い webm もパケットから求まる）、size_bytes がファイルの大きさ、file の位置が頂
      - name: test_probe_audio_when_unreadable
        case: 異常
        summary: 音声でない中身と音声の無い mp4 は断る
        condition: テキストの中身と、映像だけの mp4
        mock: なし（本物の PyAV）
        expected: どちらも AudioUnreadableError が送出される
        exception: PyAV で開けないか、音声のストリームが無い
    refs:
      - LIB-4#
    status: planned
