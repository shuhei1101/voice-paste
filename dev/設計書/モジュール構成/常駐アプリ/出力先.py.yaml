        required: true
        passing: injected
        description: 貼り付けのキーを送る（呼ぶたびに設定の keyboard.paste_key を読んで send_paste を呼ぶ）
      - name: send_enter
        type: Callable[[], None]
        required: true
        passing: injected
        description: Enter を送る
      - name: sleep
        type: Callable[[float], None]
        required: true
        passing: injected
