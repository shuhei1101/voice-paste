      1. Edge の実行ファイルを探す（PATH の `msedge`、無ければ EDGE_PATHS の順に存在するもの）
      2. 見つかった場合、`[{Edge}, "--app={url}"]` を subprocess.Popen で起動する
         - `[INFO]` URL を Edge のアプリのウィンドウで開いた（url）
      3. 見つからない場合、os.startfile で既定のブラウザで開く
         - `[INFO]` URL を既定のブラウザで開いた（url）
         - 2・3 で OSError が出た場合、DeliveryError を送出する。理由は `ブラウザ添付のプリセットの画面を開けませんでした（{元の例外}）` にし、元の例外を連鎖して残す（トレイの通知の `{理由}` にそのまま出る）
