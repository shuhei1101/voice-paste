        expected: Popen に ["msedge", "--app=https://chatgpt.com"] が渡り、os.startfile が呼ばれない
      - name: test_open_app_window_when_installed_path
        case: 正常
        summary: PATH に無くても既定の置き場所の Edge で開く
        condition: shutil.which が None で、EDGE_PATHS の 2 つ目だけが存在する
        mock: shutil.which・Path.exists・subprocess.Popen
        expected: Popen の先頭に EDGE_PATHS の 2 つ目が渡る
      - name: test_open_app_window_when_edge_missing
        case: 正常
        summary: Edge が無ければ既定のブラウザで開く
        condition: shutil.which が None で、EDGE_PATHS がどれも存在しない
        mock: shutil.which・Path.exists・subprocess.Popen・os.startfile
        expected: os.startfile に URL が渡り、Popen が呼ばれない
      - name: test_open_app_window_when_failed
        case: 異常
        summary: 起動できなければ DeliveryError
        condition: subprocess.Popen が OSError を送出する
        mock: shutil.which・subprocess.Popen
        expected: DeliveryError が送出され、理由が `ブラウザ添付のプリセットの画面を開けませんでした（` で始まり「起動できない」を含む（「AI チャット」を含まない）
        exception: Edge も既定のブラウザも起動できない
  - name: post_json
    title: JSON の POST
    kind: 関数
    container: integrations/http/client.py
    usecase: 起こした文字を届ける
    role: client
    scope: public
    inherits: PostJsonFn
    summary: httpx で JSON を POST してステータスと Retry-After を返す。タイムアウトと接続できないことは DeliveryError に変える
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 送り先
      - name: payload
        type: dict[str, object]
        required: true
        passing: positional
        description: 送る JSON
      - name: timeout_sec
        type: float
        required: true
        passing: positional
        description: 1 回の POST のタイムアウト（呼び出し元へ返すは非機能要件の返送のタイムアウトを部分適用し、エンドポイントへ送るは設定の値を渡す）
      - name: headers
        type: Mapping[str, str]
        required: false
        default: 空の辞書
        passing: positional
        description: 付けるヘッダー（Authorization など。値はログと例外の文に書かない）
    returns:
      type: PostResult
      description: 送り先が返したステータスと Retry-After
    process: |-
      1. httpx.Client(timeout=timeout_sec, follow_redirects=False) で headers を付けて POST する（リダイレクトで許していないホストへ行かず、認証のヘッダーを他の先へ流さない）
         - httpx.TransportError（タイムアウト・接続できない）の場合、DeliveryError を送出する
      2. Retry-After を秒に直す（秒数はそのまま、HTTP の日付は今の時刻からの差。負の値は 0 にそろえる。無い・読めない場合は None）
      3. ステータスと Retry-After を PostResult で返す（2xx 以外でも送出しない）
    exceptions:
      - name: DeliveryError
        condition: タイムアウトか接続できない
    unit_tests:
      - name: test_post_json
        case: 正常
        summary: JSON を送ってステータスを返す
        condition: 受け口が 204 を返す
        mock: httpx.MockTransport
        expected: status 204・retry_after_sec None が返り、受け口に Content-Type application/json で payload が届いている
      - name: test_post_json_when_headers
        case: 正常
        summary: 渡したヘッダーを付けて送る
        condition: 'headers に {"Authorization": "Bearer test-token"} を渡す'
        mock: httpx.MockTransport
        expected: '受け口に Authorization: Bearer test-token が届いている'
      - name: test_post_json_when_retry_after_seconds
        case: 正常
        summary: 秒数の Retry-After を返す
        condition: '受け口が 429 と Retry-After: 3 を返す'
        mock: httpx.MockTransport
        expected: status 429・retry_after_sec 3.0 が返る
      - name: test_post_json_when_retry_after_invalid
        case: 正常
        summary: 読めない Retry-After は None
        condition: '受け口が 503 と Retry-After: soon を返す'
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec None が返る
      - name: test_post_json_when_retry_after_past_date
        case: 正常
        summary: 過去の日付の Retry-After は 0
        condition: 受け口が 503 と、今より 1 分前の HTTP の日付の Retry-After を返す
        mock: httpx.MockTransport
        expected: status 503・retry_after_sec 0.0 が返る
      - name: test_post_json_when_redirected
        case: 正常
        summary: リダイレクトを追わない
        condition: 受け口が 307 で別のホストを指す
        mock: httpx.MockTransport
        expected: status 307 が返り、別のホストへの要求が出ない
      - name: test_post_json_when_timeout
        case: 異常
        summary: タイムアウトは DeliveryError
        condition: 受け口が httpx.ReadTimeout を送出する
        mock: httpx.MockTransport
        expected: DeliveryError が送出される
        exception: タイムアウトか接続できない
    refs:
      - dev/設計書/外部ライブラリ/httpx#
    status: implemented
  - name: load_vad_session
    title: VAD のセッションの読み込み
    container: integrations/vad/adapter.py
    usecase: 録音する
    role: アダプタ
    kind: 関数
    scope: public
    summary: faster-whisper に同梱の Silero VAD（ONNX）を、faster-whisper を import せずに onnxruntime の CPU で開き、セッションを返す
    description: faster_whisper を import するとパッケージの `__init__` が ctranslate2 と CUDA の DLL を常駐サービスに読み込み、文字起こしワーカーを子プロセスに隔離した構造の決定（`dev/pr/12/方針決め/4_構造の決定.md`）に反する。そのため `importlib.util.find_spec` でパッケージの場所だけを引いてモデルのファイルを開く（`find_spec` は `__init__` を実行しない）。起動の配線で 1 回だけ呼ぶ。
    returns:
      type: onnxruntime.InferenceSession
      description: Silero VAD のセッション
    process: |-
      1. `importlib.util.find_spec("faster_whisper")` の submodule_search_locations からパッケージの場所を引き、VAD_MODEL_RELATIVE_PATH をつなぐ
      2. onnxruntime の SessionOptions（inter_op_num_threads=1・intra_op_num_threads=1・enable_cpu_mem_arena=False・log_severity_level=4）と CPUExecutionProvider で InferenceSession を開いて返す
         - パッケージが見つからない・モデルのファイルが無い・開けない場合、StartupError を送出する（理由に元の例外を残す）
           - `[ERROR]` VAD を読めなかった（理由）
    exceptions:
      - name: StartupError
        condition: VAD のモデルを開けない（faster-whisper のパッケージが無い・モデルのファイルが無い・onnxruntime が開けない）
    unit_tests:
      - name: test_load_vad_session
        case: 正常
        summary: 同梱のモデルを CPU で開き、faster_whisper を import しない
        condition: find_spec を一時フォルダ（assets/silero_vad_v6.onnx を置く）を指すものに、InferenceSession を Mock に差し替える
        mock: importlib.util.find_spec・onnxruntime.InferenceSession
        expected: InferenceSession にそのファイルのパスと providers=["CPUExecutionProvider"] が渡って返り、sys.modules に faster_whisper が入っていない
      - name: test_load_vad_session_when_model_missing
        case: 異常
        summary: モデルのファイルが無ければ起動の失敗にする
        condition: find_spec が None を返す場合と、フォルダにモデルのファイルが無い場合
        mock: importlib.util.find_spec
        expected: どちらも StartupError が送出される
        exception: VAD のモデルを開けない
    refs:
      - dev/設計書/外部ライブラリ/onnxruntime#
      - dev/設計書/外部ライブラリ/faster-whisper#
    status: planned
    introduced:
      pr: 78
