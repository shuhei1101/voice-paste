id: MOD-19
visibility: internal
title: 常駐アプリ / APIサーバー / app.py
test_files:
  - tests/unit/voice_paste/server/test_app.py
functions:
  - name: build_fastapi
    title: app の組み立て
    kind: 関数
    container: server/app.py
    usecase: 常駐アプリを起動する
    scope: public
    summary: セッションとブラウザの文字起こしの route・画面の配信・要求の守り・本文の上限・例外ハンドラを組み込んだ app を返す
    args:
      - name: session_api
        type: SessionApiDeps
        required: true
        passing: positional
        description: セッションの API の依存（app.state.session_api に置く）
      - name: token
        type: SecretStr
        required: true
        passing: positional
        description: 今回の起動のトークン
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: web_api
        type: WebApiDeps | None
        required: true
        passing: keyword
        description: ブラウザの API の依存（app.state.web_api に置く）。None なら外の端末のブラウザの機能を組み込まない（Linux）
      - name: allowed_web_origins
        type: Sequence[str]
        required: true
        passing: keyword
        description: '`/web/` の下に許す Origin（設定 api.allowed_web_origins）'
    returns:
      type: FastAPI
      description: 組み立てた app
    status: implemented
    process: |-
      1. 自動で作られる文書のページ（docs・redoc・openapi.json）を持たない FastAPI を作る
      2. app.state.session_api にセッションの API の依存を置き、セッションの route（開始・停止・完了）を include_router で集める
      3. web_api が None でなければ、app.state.web_api にブラウザの API の依存を置き、ブラウザの文字起こしの route（受け付け・結果の取得）と画面の配信（web_page_router）を集め、画面の素材を組み込む（mount_web_assets）
      4. 例外ハンドラを登録する（register_exception_handlers）
      5. 本文の上限（BodyLimitMiddleware）を組み込む
      6. 要求の守り（RequestGuardMiddleware）にトークン・ポート・許す Origin・ブラウザの機能を組み込んだか（web_api が None でないか）を渡して組み込む（最後に追加するため、本文の上限より先に動き、断る要求の本文を読まない）
    unit_tests:
      - name: test_build_fastapi
        case: 正常
        summary: 守りを通った開始がセッション管理へ届く
        condition: TestClient（base_url は http://127.0.0.1:{ポート}）で正しいトークンと loopback の返送先を付けて POST /sessions
        mock: SessionManager（start がセッションを返す）・is_callback_allowed
        expected: 202 と session_id が返り、start が entry=api と返送先で 1 回呼ばれる
      - name: test_build_fastapi_when_docs_requested
        case: 正常
        summary: 文書のページを出さない
        condition: 正しいトークンで GET /docs と GET /openapi.json
        mock: SessionManager
        expected: どちらも 404
      - name: test_build_fastapi_when_web_disabled
        case: 正常
        summary: web_api が None ならブラウザの画面と API を持たない
        condition: 'web_api=None で組み立て、GET /web/ を Origin 無しと Origin: http://evil.example で、POST /web/transcriptions を Origin 無しで送る'
        mock: SessionManager
        expected: どれも 404
