id: MOD-42
visibility: internal
title: 常駐アプリ / ホットキーと画面 / hotkey_gnome.py
test_files:
  - tests/unit/voice_paste/runtime/test_hotkey_gnome.py
classes:
  - name: GnomeShortcutListener
    title: GNOME のショートカットのホットキーの受付
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    role: ランタイム
    summary: Wayland のセッションで HotkeyListener の代わりに使用する。設定のホットキーを GNOME のカスタムショートカットへ登録し、押されたら配線された関数を呼ぶ。録音セッションは import しない
    description: |-
      HotkeyListener と同じ start・stop を持ち、main・UiDeps はどちらも同じように扱う。

      ショートカットのコマンドは send_hotkey を流し、send_hotkey が単一インスタンスの終了の依頼のソケットへ押されたホットキーを送信する。LinuxSingleInstanceLock の待つスレッドが on_hotkey で引き渡した _dispatch を呼ぶ。

      登録は gsettings（`org.gnome.settings-daemon.plugins.media-keys` の `custom-keybindings` の一覧と、ショートカットごとの name・command・binding）で行う。常駐サービスの登録はパスが CUSTOM_KEYBINDING_PATH_PREFIX で始まり、ユーザーが自分で作ったショートカットは一覧に残す。

      呼ぶ関数は単一インスタンスの待つスレッドで動くため、例外を握ってログに書き込み、受付を止めない（HotkeyListener と同じ包み方）。
    kind: クラス
    properties:
      - name: _name
        type: str
        access: 内部 (_)
        description: 排他の名前（instance_name）。send_hotkey のコマンドに引き渡す
      - name: _bindings
        type: dict[str, Callable[[], None]]
        access: 内部 (_)
        description: 登録したホットキー（pynput の書式）→ 例外を握る関数で包んだ関数。start の前と stop の後は空
      - name: _lock
        type: threading.Lock
        access: 内部 (_)
        description: start・stop・_dispatch の _bindings の読み込み書きを 1 つずつにする
    methods:
      - name: __init__
        title: 受付の用意
        kind: メソッド
        scope: public
        summary: 排他の名前と単一インスタンスの排他を受け、排他の on_hotkey に _dispatch を引き渡す。登録はまだしない
        args:
          - name: name
            type: str
            required: true
            passing: positional
            description: 排他の名前（instance_name）
          - name: lock
            type: LinuxSingleInstanceLock
            required: true
            passing: positional
            description: 押されたホットキーを受ける単一インスタンスの排他
        returns:
          type: None
          description: なし
      - name: start
        title: 受付の開始
        kind: メソッド
        scope: public
        thread_safe: true
        summary: 常駐サービスの前の登録を外してから、ホットキーごとにカスタムショートカットを登録する
        args:
          - name: bindings
            type: dict[str, Callable[[], None]]
            required: true
            passing: positional
            description: pynput の書式のホットキー → 呼ぶ関数（build_hotkey_bindings。同じキーは 1 つにまとまっている）
        returns:
          type: None
          description: なし
        process: |-
          1. ロックを取る
          2. 各ホットキーを to_gnome_accelerator で GNOME のアクセラレーターに替える
             - ValueError（替えられないキー）の場合、登録を変えずに HotkeyError を送出する
          3. 各関数を例外を握る関数で包む
             - 呼んだ関数が例外を出した場合、握って受付を続ける
               - `[ERROR]` ホットキーの処理で想定外の例外（ホットキー。logger.exception）
          4. `custom-keybindings` の一覧を読み込み、常駐サービスの登録（CUSTOM_KEYBINDING_PATH_PREFIX で始まるパス）を除いた一覧を書き戻す（前の起動の残りと、張り直す前の登録を外す）
          5. ホットキーごとに `{CUSTOM_KEYBINDING_PATH_PREFIX}{番号}/` のショートカットへ、name（`voice-paste {ホットキー}`）・command（`shlex.join([sys.executable, "-m", "voice_paste.runtime.send_hotkey", 排他の名前, ホットキー])`）・binding（2 のアクセラレーター）を書き込み、4 の一覧の後ろに追加して書き込む
             - gsettings が 0 以外で終わるか見つからない場合、5 で書き込んだ登録を外してから HotkeyError を送出する（理由に gsettings の標準エラーを残す）
          6. 包んだ関数を _bindings に入れる
             - `[INFO]` GNOME のショートカットを登録した（ホットキーの一覧）
        exceptions:
          - name: HotkeyError
            condition: GNOME のアクセラレーターに替えられないキー
          - name: HotkeyError
            condition: gsettings で登録できない
        unit_tests:
          - name: test_start
            case: 正常
            summary: ホットキーごとにショートカットを登録し、ユーザーの登録を残す
            condition: '一覧が [ユーザーのパス] の状態で {"<cmd>+<alt>+d": 関数, "<cmd>+<alt>+v": 関数} で始める'
            mock: subprocess.run（gsettings）
            expected: '`voice-paste-0/`・`voice-paste-1/` の binding に `<Super><Alt>d`・`<Super><Alt>v`、command に send_hotkey と排他の名前とホットキーが書き込まれ、一覧が [ユーザーのパス, voice-paste-0/, voice-paste-1/] で書き込まれる'
          - name: test_start_when_leftover
            case: 正常
            summary: 前の起動の登録の残りを外してから登録する
            condition: 一覧が [ユーザーのパス, voice-paste-0/, voice-paste-1/, voice-paste-2/] の状態で、ホットキー 1 つで始める
            mock: subprocess.run（gsettings）
            expected: 最後に書き込まれた一覧が [ユーザーのパス, voice-paste-0/]
          - name: test_start_when_dispatched
            case: 正常
            summary: 受けたホットキーの関数を呼び、例外で受付を止めない
            condition: 始めた後、排他の on_hotkey に引き渡された関数を、登録したホットキー・登録していないホットキーで呼ぶ。登録した関数は 1 回目に RuntimeError を送出する
            mock: subprocess.run（gsettings）・LinuxSingleInstanceLock
            expected: 登録したホットキーで関数が呼ばれ、例外が漏れず ERROR のログが 1 行出て、もう一度呼ぶとまた呼ばれる。登録していないホットキーでは何も呼ばれない
          - name: test_start_when_unsupported_key
            case: 異常
            summary: 替えられないキーは登録を変えずに断る
            condition: '{"<cmd>+<alt>+<page_up>": 関数}'
            mock: subprocess.run（gsettings）
            expected: HotkeyError が送出され、gsettings の set が呼ばれない
            exception: GNOME のアクセラレーターに替えられないキー
          - name: test_start_when_gsettings_failed
            case: 異常
            summary: gsettings で登録できなければ書き込んだ登録を外して断る
            condition: 2 つ目のショートカットの binding の set が CalledProcessError を送出する
            mock: subprocess.run（gsettings）
            expected: HotkeyError が送出され、最後に書き込まれた一覧に常駐サービスのパスが無い
            exception: gsettings で登録できない
      - name: stop
        title: 受付の停止
        kind: メソッド
        scope: public
        thread_safe: true
        summary: 常駐サービスの登録を一覧から外し、_bindings を空にする。gsettings が失敗しても送出せず WARNING のログを書き込む（終了の片付けで呼ぶため）。登録が無ければ一覧を書き込まない
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 常駐サービスの登録を外し、ユーザーの登録を残す
            condition: start の後に stop を 2 回呼ぶ
            mock: subprocess.run（gsettings）
            expected: 一覧が [ユーザーのパス] で 1 回だけ書かれ、2 回目は一覧を書き込まない。stop の後に受けたホットキーでは関数が呼ばれない
          - name: test_stop_when_gsettings_failed
            case: 正常
            summary: 外せなくても例外を出さない
            condition: start の後、gsettings が FileNotFoundError を送出する状態で stop を呼ぶ
            mock: subprocess.run（gsettings）
            expected: 例外が出ず、WARNING のログが 1 行出る
    refs:
      - SC-5#
    status: planned
constants:
  - name: MEDIA_KEYS_SCHEMA
    title: カスタムショートカットの一覧のスキーマ
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    summary: カスタムショートカットのパスの一覧（`custom-keybindings`）を持つ gsettings のスキーマ
    value: '"org.gnome.settings-daemon.plugins.media-keys"'
    status: planned
  - name: CUSTOM_KEYBINDING_SCHEMA
    title: カスタムショートカットのスキーマ
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    summary: カスタムショートカット 1 つ（name・command・binding）の gsettings のスキーマ。`{スキーマ}:{パス}` で指す
    value: '"org.gnome.settings-daemon.plugins.media-keys.custom-keybinding"'
    status: planned
  - name: CUSTOM_KEYBINDING_PATH_PREFIX
    title: 常駐サービスの登録のパスの前半
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    summary: 常駐サービスが登録するカスタムショートカットのパスの前半。ユーザーが自分で作ったショートカットと見分ける
    value: '"/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/voice-paste-"'
    status: planned
  - name: PYNPUT_TO_GNOME_MODIFIERS
    title: 修飾キーの書式の対応
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    summary: pynput の書式の修飾キーと、GNOME のアクセラレーターの修飾キーの対応
    value: '{"<ctrl>": "<Control>", "<alt>": "<Alt>", "<shift>": "<Shift>", "<cmd>": "<Super>"}'
    status: planned
functions:
  - name: to_gnome_accelerator
    title: GNOME のアクセラレーターへの変換
    kind: 関数
    container: runtime/hotkey_gnome.py
    usecase: 録音する
    scope: public
    summary: pynput の書式のホットキー（`<cmd>+<alt>+d`）を GNOME のアクセラレーター（`<Super><Alt>d`）に替える
    args:
      - name: hotkey
        type: str
        required: true
        passing: positional
        description: pynput の書式のホットキー
    returns:
      type: str
      description: GNOME のアクセラレーター
    process: |-
      1. `+` で分け、最後を主キー、それより前を修飾キーとする
      2. 修飾キーを PYNPUT_TO_GNOME_MODIFIERS で替えてつなぐ
         - 表に無い修飾キーの場合、ValueError を送出する
      3. 主キーを替えて後ろにつなぐ
         - 1 文字の場合、そのまま
         - `<f1>`〜`<f24>` の場合、`F1`〜`F24`
         - それ以外の場合、ValueError を送出する
    exceptions:
      - name: ValueError
        condition: 表に無い修飾キー・1 文字でもファンクションキーでもない主キー
    unit_tests:
      - name: test_to_gnome_accelerator
        case: 正常
        summary: 修飾キーと 1 文字の主キーを替える
        condition: '"<cmd>+<alt>+d" と "<ctrl>+<shift>+v"'
        mock: なし
        expected: '"<Super><Alt>d" と "<Control><Shift>v"'
      - name: test_to_gnome_accelerator_when_function_key
        case: 正常
        summary: ファンクションキーを替える
        condition: '"<ctrl>+<f9>"'
        mock: なし
        expected: '"<Control>F9"'
      - name: test_to_gnome_accelerator_when_unsupported
        case: 異常
        summary: 替えられないキーは ValueError
        condition: '"<cmd>+<page_up>"'
        mock: なし
        expected: ValueError が送出される
        exception: 1 文字でもファンクションキーでもない主キー
    status: planned
  - name: validate_gnome_hotkeys
    title: GNOME のショートカットに登録できるかの確かめ
    kind: 関数
    container: runtime/hotkey_gnome.py
    usecase: 設定を変える
    scope: public
    summary: ホットキーを pynput が読み込めて、GNOME のアクセラレーターに替えられるかを、登録せずに確認する。Wayland のセッションの PlatformAdapters.validate_hotkeys
    args:
      - name: hotkeys
        type: Iterable[str]
        required: true
        passing: positional
        description: pynput の書式のホットキー
    returns:
      type: None
      description: なし
    process: |-
      1. validate_hotkeys で pynput が読み込めるかを確認する（HotkeyError はそのまま送出する）
      2. 各ホットキーを to_gnome_accelerator で替える
         - ValueError の場合、HotkeyError（「GNOME のショートカットに登録できないキーです（{ホットキー}）」）を送出する
    exceptions:
      - name: HotkeyError
        condition: pynput が読み込めない・GNOME のアクセラレーターに替えられないホットキーがある
    unit_tests:
      - name: test_validate_gnome_hotkeys
        case: 正常
        summary: 替えられるホットキーは通す
        condition: '["<cmd>+<alt>+d", "<ctrl>+<f9>"]'
        mock: なし
        expected: 例外が出ない
      - name: test_validate_gnome_hotkeys_when_unsupported
        case: 異常
        summary: pynput は読み込めるが替えられないキーを断る
        condition: '["<ctrl>+<page_up>"]'
        mock: なし
        expected: HotkeyError が送出され、メッセージに <ctrl>+<page_up> が出る
        exception: GNOME のアクセラレーターに替えられないホットキーがある
    status: planned
