    test: test_normal_when_haas
    notes:
      動いているサーバー: 起動の前に設定の接続先が応答したとき（前の常駐サービスが起動したサーバーが残っている、ユーザーが WSL の中で別に起動している）は、サーバーを起動せずにそのサーバーを使用する。そのサーバーのモデル・計算の精度・装置が設定と違うときは 正常シナリオ（動いている Haas のサーバーが設定と違う）。
      サーバーを止める: 常駐サービスが起動したサーバーは、トレイの終了・再起動と、新しい常駐サービスからの終わる依頼で止める（トレイから操作する）。起動の前から動いていたサーバーは止めない。
      起動の時間: サーバーの起動からモデルを読み込むまで約 20 秒かかる（PoC の実測は 22.2 秒。WSL は起動済み。WSL が止まっている状態からの時間は、非機能要件の起動の待ち時間を決める前に測る）。待つ間も 正常シナリオ（Linux でモデルを取得する初回の起動） と同じく画面とトレイの操作を受け付け、録音の開始は選べない。
      動作環境: Windows の端末で、WSL2 のネットワークが mirrored のモードであり、設定のディストリビューションにサーバーの環境（NeMo・haas_asr）を作ってある（作り方は 開発コマンド）。Linux の常駐サービスで Haas を選んだときは、接続先を確認せずに 正常シナリオ（Haas のサーバーへ接続できない） と同じくローカルの Whisper で起こす（Linux の常駐アプリから Haas を使用するのはスコープ外）。
  - name: 正常シナリオ（Haas のサーバーへ接続できない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで引き渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV。WSL でサーバーを起動するコマンドは、何も立てずに終わるコマンドに差し替える
      - name: 文字起こしのエンジン
        description: Haas を使用する設定にし、ローカルの Whisper の設定は既定のままにする
        notes: '`transcription.engine: haas`。起動の待ち時間はテストのために短くする'
    flow: |-
      <!-- map: {"title": "正常シナリオ（Haas のサーバーへ接続できない）"} -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SVC as 常駐サービス
        participant TRAY as トレイ
