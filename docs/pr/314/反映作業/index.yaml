  確認方法: 配布先の ER 図（docs/er/）の全てのテーブルが `source` を持ち、テーブルとカラムの `source` が指すデータの設計書（docs/data/）の ID とキーが全てある（確認.py が読み取りだけで数える）。配布先の設計書の検査で、ER 図の参照先の ID の設計書が無い違反と `tables[].source` の欠落の違反が 0 件
