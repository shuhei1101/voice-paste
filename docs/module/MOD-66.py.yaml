id: MOD-66
visibility: internal
title: 常駐アプリ / 外部連携 / types.py
data_models:
  - name: PostResult
    title: POST の応答
    container: integrations/http/types.py
    usecase: 起こした文字を届ける
    role: DTO
    summary: post_json が返す、送信先のステータスと再送までに待つ秒数
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: status
        type: int
        description: 送信先が返したステータス
      - name: retry_after_sec
        type: float | None
        description: Retry-After を秒に直した値。無い・読めないときは None
    status: implemented
function_types:
  - name: PostJsonFn
    title: JSON の POST
    container: integrations/http/types.py
    usecase: 起こした文字を届ける
    summary: 送信先へ JSON を POST してステータスと Retry-After を返す。タイムアウト・接続できないことは DeliveryError
    args:
      - name: url
        type: str
        description: 送信先
      - name: payload
        type: dict[str, object]
        description: 送信する JSON
      - name: timeout_sec
        type: float
        description: 1 回の POST のタイムアウト
      - name: headers
        type: Mapping[str, str]
        description: 付けるヘッダー
    returns:
      type: PostResult
      description: 送信先が返したステータスと Retry-After
    implementations:
      - target: post_json
        notes: httpx で送信する
    status: implemented
