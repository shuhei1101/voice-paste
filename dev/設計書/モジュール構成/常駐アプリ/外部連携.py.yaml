  - name: send_paste
    title: 貼り付けのキーの送信
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: pynput で設定の貼り付けのキー（既定 Ctrl+V）を今のアクティブなウィンドウへ送信する
    args:
      - name: paste_key
        type: str
        required: true
        passing: positional
        description: 貼り付けのキー（pynput の GlobalHotKeys の書式。設定の keyboard.paste_key）
    returns:
      type: None
      description: なし
    process: |-
      1. split_paste_key で paste_key を修飾キーと主キーに分ける（DeliveryError はそのまま送出し、キーを送信しない）
      2. 主キーは文字のまま pynput に渡す（Windows の送り方。Linux は send_paste_linux を使う）
      3. FOCUS_SETTLE_SEC だけ待つ（貼り付け先のフォーカスが落ち着くのを待つ）
      4. 修飾キーを順に押し、主キーを押して離し、修飾キーを逆順に離す
         - `[INFO]` 貼り付けのキーを送信した（paste_key）
    refs:
      - dev/設計書/外部ライブラリ/pynput#
    status: implemented
    unit_tests:
      - name: test_send_paste
        case: 正常
        summary: 待ってから修飾キーと主キーを順に押して離す
        condition: paste_key が `<ctrl>+v`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press('v')・release('v')・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_multiple_modifiers
        case: 正常
        summary: 修飾キーが 2 つでも逆順に離す
        condition: paste_key が `<ctrl>+<shift>+v`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press(shift)・press('v')・release('v')・release(shift)・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_spaced_and_uppercase
        case: 正常
        summary: キーの前後の空白と大文字を揃えて同じキーとして送信する
        condition: paste_key が `<Ctrl> + V`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press('v')・release('v')・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_no_main_key
        case: 異常
        summary: 主キーが 1 つ無ければキーを送信せずに DeliveryError
        condition: paste_key が `<ctrl>`
        mock: pynput.keyboard.Controller・time.sleep
        expected: DeliveryError が送出され、press が呼ばれない
        exception: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
    exceptions:
      - name: DeliveryError
        condition: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
