    status: implemented
  - name: to_field_message
    title: 欄のエラーの文言
    container: ui/windows/settings_window.py
    usecase: 設定を変える
    summary: pydantic の失敗 1 件を、画面設計「設定画面」の入力チェックの文言にする
    kind: 関数
    scope: public
    args:
      - name: error
        type: pydantic_core.ErrorDetails
        required: true
        passing: positional
        description: ValidationError.errors() の 1 件
      - name: model
        type: type[Settings]
        required: true
        passing: keyword
        description: 失敗の場所から項目（既定値・範囲）を引く設定のモデル。出力先の項目はその output_models から引く。SettingsWindow は開いたときの設定のモデル（`type(設定)`）を渡す（ui は features・main を import しない）
      - name: defaults
        type: Settings
        required: true
        passing: keyword
        description: 既定の設定（UiDeps.default_settings）。表のまとまりのモデルの項目は既定値を持たないため、数値の例はこの設定の同じキーの値から引く
    returns:
      type: str
      description: 欄の下とエラーの一覧に出す文言
    process: |-
      1. type と場所で文言を選ぶ
         - float_parsing・int_parsing・int_from_float: 「数値を入れてください（例: {既定の値}）。」。既定の値は、項目が既定値を持てば（一覧の要素のモデル）その値、持たなければ defaults の同じキーの値
         - greater_than_equal・less_than_equal・greater_than: 「{最小}〜{最大} の値を入れてください。」（上限が無ければ「{最小} 以上の値を入れてください。」）
         - string_too_short（プリセットのタイトル）: 「タイトルを入れてください。」
         - string_too_short（表記のヒントのプリセットの名前）: 「名前を入れてください。」
         - URL の形式が合わない（プリセットの URL）: 空なら「URL を入れてください（例: https://example.com/hook）。」、空でなければ「http:// か https:// で始まる URL を入れてください。」
         - URL の形式が合わない（transcription.openai.base_url）: 空なら「API の URL を入れてください（例: https://api.openai.com/v1）。」、空でなければ「http:// か https:// で始まる URL を入れてください。」
         - hotkey_overlap（find_hotkey_overlaps）: 重なった先がプリセットなら「プリセット「{タイトル}」と同じキーです。別のキーにしてください。」（もう一方の種類のプリセットなら「「{種類}」のプリセット「{タイトル}」と同じキーです。別のキーにしてください。」）、それ以外は「「{重なった欄の名前}」と同じホットキーです。別のキーにしてください。」
         - hint_too_long: 「有効なヒントが長すぎます（{今の長さ} / 222 バイト）。語を減らすか、プリセットを無効にしてください。」
         - hint_word_empty: 「語を入れるか、この欄を削除してください。」
         - hint_word_separator: 「読点（、）・句点（。）・改行は入れられません。語を分けて追加してください。」
         - hint_reading_not_kana: 「読みはひらがなかカタカナで入れてください。」
         - hint_reading_conflict: 「同じ語に違う読みが入っています。読みを揃えるか、語を削除してください。」
         - hint_readings_length: 「読みの数が語の数と合いません。settings.yaml の readings を修正してください。」
         - haas_port_overlap: 「API を待ち受けるポートと同じ番号です。別の番号を入れてください。」
         - haas_model_empty: 「モデルの名前かパスを入れてください。」
         - haas_device_form: 「cuda・cuda:0 のような番号つきの cuda・cpu のどれかを入れてください。」
         - haas_separator_too_long: 「16 文字以内で入れてください。」
         - hint_preset_name_overlap（find_hint_preset_name_overlaps）: 「プリセット「{名前}」と同じ名前です。別の名前にしてください。」
         - WEB_ORIGIN_FORM_ERROR_TYPE（ApiSettings._origins_must_be_origin_form）: 「形式の違うオリジンがあります（{ctx の invalid を読点でつないだもの}）。https://example.com のように、http:// か https:// で始め、末尾の / とパスを付けずに入れてください。」
         - それ以外: pydantic の msg をそのまま出す
    unit_tests:
      - name: test_to_field_message_when_not_number
        case: 正常
        summary: 数値でない文字
        condition: outputs[0].enter_delay_sec に abc を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL・defaults=既定の設定で渡す
        mock: なし
        expected: '数値を入れてください（例: 0.5）。'
      - name: test_to_field_message_when_not_number_in_table
        case: 正常
        summary: 表のまとまりの項目の数値の例は、既定の設定の値から引く
        condition: transcription.local_whisper.beam_size に abc を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL・defaults=beam_size を 7 にした既定の設定で渡す
        mock: なし
        expected: '数値を入れてください（例: 7）。'
      - name: test_to_field_message_when_out_of_range
        case: 正常
        summary: 範囲の外
        condition: api.port に 80 を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: 1024〜65535 の値を入れてください。
      - name: test_to_field_message_when_preset_url_empty
        case: 正常
        summary: プリセットの URL が空
        condition: presets[0] を kind endpoint・url が空にした SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: 'URL を入れてください（例: https://example.com/hook）。'
      - name: test_to_field_message_when_hint_too_long
        case: 正常
        summary: 有効なヒントが長すぎる
        condition: 有効な語をつないだ長さが 258 バイトの hint_presets を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: 有効なヒントが長すぎます（258 / 222 バイト）。語を減らすか、プリセットを無効にしてください。
      - name: test_to_field_message_when_hint_preset_name_overlap
        case: 正常
        summary: 表記のヒントのプリセットの名前が重なる
        condition: 名前が「開発」の 2 件の hint_presets を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: プリセット「開発」と同じ名前です。別の名前にしてください。
      - name: test_to_field_message_when_openai_base_url_empty
        case: 正常
        summary: OpenAI の API の URL が空
        condition: transcription.openai.base_url を空にした SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: 'API の URL を入れてください（例: https://api.openai.com/v1）。'
      - name: test_to_field_message_when_web_origin_not_form
        case: 正常
        summary: 形式の違う許す Origin
        condition: api.allowed_web_origins に ["https://voice.example.com/", "voice.example.com"] を入れた SETTINGS_MODEL.model_validate の失敗を、model=SETTINGS_MODEL で渡す
        mock: なし
        expected: 形式の違うオリジンがあります（https://voice.example.com/、voice.example.com）。https://example.com のように、http:// か https:// で始め、末尾の / とパスを付けずに入れてください。
      - name: test_to_field_message_when_hint_reading_not_kana
        case: 正常
        summary: 読みにかな以外の文字が入っている
        condition: hint_presets[0].readings[0] が totsugou の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: 読みはひらがなかカタカナで入れてください。
      - name: test_to_field_message_when_hint_reading_conflict
        case: 正常
        summary: 同じ語に違う読みが入っている
        condition: words が 突合・突合、readings が とつごう・とつあわせ の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: 同じ語に違う読みが入っています。読みを揃えるか、語を削除してください。（失敗の場所は後ろの語の readings[1]）
      - name: test_to_field_message_when_haas_port_overlap
        case: 正常
        summary: Haas のポートが API のポートと同じ
        condition: transcription.haas.port と api.port が同じ番号の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: API を待ち受けるポートと同じ番号です。別の番号を入れてください。（失敗の場所は transcription.haas.port）
      - name: test_to_field_message_when_haas_device_form
        case: 正常
        summary: Haas の装置の形式が違う
        condition: transcription.haas.device が gpu の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: cuda・cuda:0 のような番号つきの cuda・cpu のどれかを入れてください。（失敗の場所は transcription.haas.device）
      - name: test_to_field_message_when_haas_model_empty
        case: 正常
        summary: Haas のモデルが空
        condition: transcription.haas.model が空の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: モデルの名前かパスを入れてください。（失敗の場所は transcription.haas.model）
      - name: test_to_field_message_when_haas_separator_too_long
        case: 正常
        summary: Haas の区切りをつなぐ文字が長い
        condition: transcription.haas.separator が 17 文字の SETTINGS_MODEL.model_validate の失敗を渡す
        mock: なし
        expected: 16 文字以内で入れてください。（失敗の場所は transcription.haas.separator）
    refs:
      - SCR-9#
    status: implemented
