title: "トレイの通知"
elements:
  - name: 通知
    id: tray_notification
    kind: notification
    position: 通知
    description: トレイのアイコンから出す Windows の通知。アプリ名は voice-paste。モーダルにせず、作業中のアプリの入力を遮らない
    visible_when: '`notify` で microphone_unavailable・transcription_failed・delivery_failed・api_unavailable を受けたときと、文字起こしのエンジンを準備できなかった・設定ファイルを読めなかった起動のとき'
    source: UiBridge.notified（知らせの種類と理由）
    action: 通知を押すとログフォルダを開く。閉じると待機中（トレイ）に戻る
  - name: 見出し
    id: notification_title
    kind: label
    position: 通知 > 見出し
    description: 何ができなかったかを短く出す（知らせの種類ごとの文言は補足）
    io: 表示
    type: 文字列
    visible_when: 常時
    source: 知らせの種類
  - name: 本文
    id: notification_body
    kind: label
    position: 通知 > 本文
    description: 理由を 1 文で出し、履歴に残っていること・次にすることを添える
    io: 表示
    type: 文字列
    visible_when: 常時
    source: UiBridge.notified の理由（`notify` の detail）
  - name: ログフォルダを開く
    id: open_log_folder
    kind: action
    position: 通知 > 下
    description: 通知の操作はこの 1 つ。ログのフォルダをエクスプローラーで開く
    label: ログフォルダを開く
    visible_when: 常時
    action: ログのフォルダを開く
screen: src/voice_paste/ui/tray.py
mock: dev/mock/pages/tray-notification/37/a-notification/
lead: 裏の処理で起きた失敗を Windows の通知で知らせる。通知は数秒で畳まれ、通知センターに残る。
refs:
  - dev/設計書/モジュール構成/常駐アプリ/ホットキーと画面.py#functions[notify]
  - dev/設計書/シナリオ/単一ユースケース/常駐アプリを起動する#
notes:
  知らせの種類ごとの文言: |-
    | 知らせ | 見出し | 本文 |
    | --- | --- | --- |
    | `microphone_unavailable` | 録音を始められませんでした | マイクを開けません。マイクがつながっているか、ほかのアプリが使っていないかを確かめてください。 |
    | `transcription_failed` | 文字起こしに失敗しました | {理由}。録音は履歴に残っています。 |
    | `delivery_failed` | 届けられませんでした | {理由}。起こした文字は履歴に残っています。 |
    | `api_unavailable` | API を使えません | {理由}。ホットキーとトレイからの録音は使えます。 |
    | 文字起こしのエンジンを準備できない（`engine_unavailable`） | 起動に失敗しました | 文字起こしのエンジンを準備できません（{理由}）。設定を直して再起動してください。 |
    | 設定ファイルを読めない（`settings_invalid`） | 起動に失敗しました | 設定ファイルを読めません（{理由}）。設定フォルダの settings.toml を直して再起動してください。 |

    {理由} は `notify` の `detail` を 1 文で出し、詳しい内容はログに書く。届けられないときは、どの出力先でも同じ見出しで出し、理由を変える。
  通知の操作: PySide6 のトレイの通知（`QSystemTrayIcon.showMessage`）は通知の中にボタンを置けないため、モックの「ログフォルダを開く」は「通知を押す（`messageClicked`）とログフォルダを開く」で実現する
test_file: tests/integration/ui/test_tray_notification.py
