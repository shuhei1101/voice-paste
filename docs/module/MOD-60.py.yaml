id: MOD-60
visibility: internal
title: 常駐アプリ / 出力先 / service.py
test_files:
  - tests/unit/voice_paste/features/outputs/test_service.py
functions:
  - name: deliver
    title: 出力先への配送
    kind: 関数
    container: features/outputs/service.py
    usecase: 起こした文字を届ける
    role: サービス
    scope: public
    inherits: DeliverFn（main.py で録音セッションを分けて渡す）
    summary: 入口と確定の操作で、出力先かカスタムプリセットを 1 つ選んで届ける
    args:
      - name: entry
        type: Entry
        required: true
        passing: positional
        description: 入口
      - name: output_id
        type: str | None
        required: true
        passing: positional
        description: 確定の操作で選んだ固定の出力先の ID（プリセットを選んだときと API のときは None）
      - name: preset
        type: Preset | None
        required: true
        passing: positional
        description: 確定の操作で選んだカスタムプリセット（固定の出力先を選んだときと API のときは None）
      - name: callback_url
        type: str | None
        required: true
        passing: positional
        description: コールバック先（API のときだけ）
      - name: outcome
        type: TranscriptionOutcome
        required: true
        passing: positional
        description: 届ける結果
      - name: enabled_ids
        type: frozenset[str]
        required: true
        passing: injected
        description: 設定でオンにした出力先の ID
      - name: outputs
        type: Sequence[OutputSpec]
        required: true
        passing: injected
        description: 出力先の一覧（OUTPUTS）
      - name: preset_kinds
        type: Sequence[PresetKindSpec]
        required: true
        passing: injected
        description: プリセットの種類の一覧（PRESET_KINDS）
    returns:
      type: None
      description: なし
    process: |-
      1. 入口が api なら、呼び出し元へ返す出力先を選び、コールバック先を宛先にして届ける（設定のオン・オフ・プリセットによらない）
      2. preset があれば、preset.kind と同じ種類の関数で outcome と preset を届ける
         - 同じ種類が一覧に無い場合、UnknownOutputError を送出する
      3. それ以外は、output_id の出力先を選び、宛先を None にして届ける
         - 選んだ出力先が無いか、API 専用か、オフの場合、UnknownOutputError を送出する
         - `[INFO]` 出力先へ渡した（録音セッションの ID・出力先の ID かプリセットの種類とタイトル）
    exceptions:
      - name: UnknownOutputError
        condition: 選んだ出力先・プリセットの種類が一覧に無いか、出力先が設定でオフ
    unit_tests:
      - name: test_deliver_when_api_session
        case: 正常
        summary: API の録音セッションは呼び出し元へ返すだけ
        condition: 入口が api、設定で paste_and_send がオン
        mock: 各出力先・各種類の handler
        expected: callback の handler だけがコールバック先と共に呼ばれ、paste_and_send は呼ばれない
      - name: test_deliver_when_hotkey_session
        case: 正常
        summary: ホットキーの録音セッションは選んだ出力先へ届ける
        condition: 入口が hotkey、output_id が paste_only でオン
        mock: 各出力先・各種類の handler
        expected: paste_only の handler だけが outcome と None で呼ばれる
      - name: test_deliver_when_output_disabled
        case: 異常
        summary: オフの出力先は届けない
        condition: output_id が copy_only で設定でオフ
        mock: 各出力先・各種類の handler
        expected: UnknownOutputError が送出される
        exception: 設定でオフ
      - name: test_deliver_when_preset
        case: 正常
        summary: 選んだプリセットの種類の関数で届ける
        condition: 入口が hotkey、output_id が None、preset が kind endpoint のプリセット
        mock: 各出力先・各種類の handler
        expected: endpoint の handler だけが outcome と preset で呼ばれ、出力先の handler は呼ばれない
      - name: test_deliver_when_unknown_preset_kind
        case: 異常
        summary: 一覧に無い種類のプリセットは届けない
        condition: preset_kinds に browser だけを渡し、kind endpoint の preset で呼ぶ
        mock: 各種類の handler
        expected: UnknownOutputError が送出される
        exception: 種類が一覧に無い
    status: implemented
