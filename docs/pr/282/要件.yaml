scope_out:
  - item: schemas/ の Schema の変更
    reason: AI Monitor の配布物で、手で変更すると次の配布物への追従で上書きされる
    plan: none
  - item: rules.yaml からの旧規約（markdown マーメイド・判定フローチャート）の除外
    reason: origin/develop の rules.yaml の rules は空で、除外する ID が無い
    plan: none
  - item: 過去の PR ドキュメント（docs/pr/）の文・メタデータの移行
    reason: 判断が分かれる。今の判断は Mermaid の図だけを置き換え、文・メタデータはマージ時点の記録として変えない（要件.md の未確定）。ドキュメント修正のレビューで確定する
    plan: none
  - item: YAML の設計書のタグ・エイリアス・descriptionと、コード・テストの files.yml の行のタグ・description
    reason: YAML の設計書は今の Schema がキーを持たない。コード・テストの行は設計書のタグと同じ語彙で付けるため、ai-monitor#3188 の後にまとめて移行する（確認ログの推奨案 A）
    plan: to_file
  - item: モジュール構成『常駐アプリ / 録音セッション / service.py』の状態遷移図（stateDiagram-v2）の置き換え
    reason: mdmark に状態遷移図の部品が無く、map は flowchart・sequenceDiagram だけを描くため、Mermaid のまま残す
    plan: to_file
