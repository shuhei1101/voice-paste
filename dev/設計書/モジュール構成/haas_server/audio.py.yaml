title: Haas の文字起こしのサーバー / サーバー / audio.py
test_files:
  - tests/unit/haas_server/test_audio.py
classes:
  - name: AudioDecodeError
    title: 音声の復号の失敗
    container: haas_server/audio.py
    usecase: 録音を文字に起こす
    role: 例外
    kind: クラス
    inherits: Exception
    summary: 受けた音声を復号できない
    status: planned
functions:
  - name: decode_audio
    title: 音声の復号
    kind: 関数
    container: haas_server/audio.py
    usecase: 録音を文字に起こす
    scope: public
    summary: 受けた音声のバイト列を PyAV で復号し、16 kHz モノラルの float32 の配列にする
    args:
      - name: data
        type: bytes
        required: true
        passing: positional
        description: 受けた音声（WAV・webm・ogg・mp4 など）
    returns:
      type: numpy.ndarray
      description: 16 kHz モノラルの float32 の 1 次元配列
    exceptions:
      - name: AudioDecodeError
        condition: PyAV が開けない・音声のストリームが無い
    process: |-
      1. io.BytesIO(data) を av.open で開く
      2. 音声のストリームを AudioResampler（format=flt・layout=mono・rate=16000）に通して配列をつなぐ
         - av.error.FFmpegError か、音声のストリームが無い場合、AudioDecodeError を送出する
    unit_tests:
      - name: test_decode_audio
        case: 正常
        summary: 48 kHz のステレオの WAV を 16 kHz のモノラルにする
        condition: 約 1 秒の 48 kHz・2 チャンネルの WAV のバイト列
        mock: なし
        expected: 長さが約 16000 の float32 の 1 次元配列
      - name: test_decode_audio_when_webm
        case: 正常
        summary: webm（Opus）を復号できる
        condition: 約 1 秒の webm のバイト列（テストの中で PyAV で作る）
        mock: なし
        expected: 長さが約 16000 の配列
      - name: test_decode_audio_when_not_audio
        case: 異常
        summary: 音声でないバイト列
        condition: b"not audio"
        mock: なし
        expected: AudioDecodeError
        exception: PyAV が開けない
    status: planned
refs:
  - IF-12#
  - LIB-4#
id: MOD-100
