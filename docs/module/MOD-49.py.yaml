id: MOD-49
visibility: internal
title: 常駐アプリ / 共通 / constants.py
test_files:
  - tests/unit/voice_paste/shared/test_constants.py
data_models:
  - name: AppPaths
    title: 置き場所のパス
    container: shared/constants.py
    usecase: 共通
    role: DTO
    summary: 設定の 3 レイヤーのファイル・settings.toml・履歴・ログ・一時の音声・トークン・画面の画像の配置先
    description: |-
      resolve_app_paths で作る。
      既定値と checkout の上書きはリポジトリの直下（REPO_ROOT）から引き、環境の値はユーザーごとの設定のフォルダから取得する。
      既定は platformdirs で、Windows は `%APPDATA%\voice-paste\`（設定）と `%LOCALAPPDATA%\voice-paste\`（それ以外）、Linux は `~/.config/voice-paste/`（設定）と `~/.local/share/voice-paste/`（それ以外）を取得する。
      データの配置先（`--data-dir`）を引き渡したときは、既定値の他は全てをその下に配置し、checkout の上書きを読み込まない（local_settings_file を None にする）。非機能要件テストはこれで普段使いの配置先と手元の `settings.local.yaml` に触れない。
      `@dataclass(frozen=True, slots=True, kw_only=True)`。
    properties:
      - name: defaults_file
        type: Path
        description: '`{REPO_ROOT}/config/defaults.yaml`（データの配置先を引き渡したときも同じ）。設定の既定値'
      - name: settings_file
        type: Path
        description: '`%APPDATA%\voice-paste\settings.yaml`（Linux は `~/.config/voice-paste/settings.yaml`。データの配置先を引き渡したときは `{data_dir}\settings.yaml`）。環境の値で、設定画面の保存が書き込む'
      - name: local_settings_file
        type: Path | None
        description: '`{REPO_ROOT}/settings.local.yaml`。checkout の上書き。データの配置先を引き渡したときは None（読み込まない）'
      - name: legacy_settings_file
        type: Path
        description: '`%APPDATA%\voice-paste\settings.toml`（`{data_dir}\settings.toml`）。前のバージョンの設定で、settings_file が無いときに移す元'
      - name: history_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\history\`（Linux は `~/.local/share/voice-paste/history/`。`{data_dir}\history\`）'
      - name: log_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\log\`（`{data_dir}\log\`）'
      - name: tmp_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\tmp\`（`{data_dir}\tmp\`。履歴を残さないときの一時の音声）'
      - name: token_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\api_token`（`{data_dir}\api_token`。起動ごとのトークンとポート）'
      - name: ui_image_dir
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\ui\`（`{data_dir}\ui\`。選択欄の開くマーカーの SVG）'
      - name: lock_file
        type: Path
        description: '`%LOCALAPPDATA%\voice-paste\instance.lock`（Linux は `~/.local/share/voice-paste/instance.lock`。`{data_dir}\instance.lock`。Linux の単一インスタンスのロックファイル。Windows では使用しない）'
      - name: openai_api_key_file
        type: Path
        description: '`%APPDATA%\voice-paste\secrets\openai_api_key`（Linux は `~/.config/voice-paste/secrets/openai_api_key`。`{data_dir}\secrets\openai_api_key`）。settings.yaml と同じフォルダの下。ユーザーが配置し、常駐アプリは読み込むだけで作らない'
    refs:
      - LIB-16#
    status: implemented
constants:
  - name: APP_NAME
    title: アプリ名
    container: shared/constants.py
    usecase: 共通
    summary: 配置先のフォルダ名に使用するアプリの名前
    value: '"voice-paste"'
    status: implemented
  - name: REPO_ROOT
    title: リポジトリの直下
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 配置先
    summary: config/defaults.yaml と settings.local.yaml を取得する、リポジトリの直下のフォルダ
    value: Path(__file__).resolve().parents[3]
    status: planned
  - name: DEFAULTS_FILE_NAME
    title: 既定値のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 配置先
    summary: リポジトリの直下の config フォルダに配置する既定値のファイル
    value: '"defaults.yaml"'
    status: planned
  - name: SETTINGS_FILE_NAME
    title: 環境の値のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 配置先
    summary: 設定のフォルダ（data_dir）に配置する環境の値のファイル
    value: '"settings.yaml"'
    status: planned
  - name: LOCAL_SETTINGS_FILE_NAME
    title: checkout の上書きのファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 配置先
    summary: リポジトリの直下に配置する checkout の上書きのファイル（git の管理から除外する）
    value: '"settings.local.yaml"'
    status: planned
  - name: LEGACY_SETTINGS_FILE_NAME
    title: 前のバージョンの設定のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 配置先
    summary: settings.yaml が無いときに移す元のファイル
    value: '"settings.toml"'
    status: planned
functions:
  - name: resolve_app_paths
    title: 置き場所の解決
    kind: 関数
    container: shared/constants.py
    usecase: 共通
    scope: public
    summary: データの配置先が引き渡されればその下、無ければ platformdirs で取得した既定の配置先で AppPaths を作る。フォルダは作らない
    args:
      - name: data_dir
        type: Path | None
        required: true
        passing: positional
        description: データの配置先（`--data-dir`）。None は既定の配置先
    returns:
      type: AppPaths
      description: 配置先のパス
    process: |-
      1. data_dir が引き渡されているか
         - ある場合、環境の値・settings.toml・OpenAI の API キーのファイル・履歴・ログ・一時の音声・トークン・画面の画像・ロックファイルを全て data_dir の下に配置し、local_settings_file を None にする
         - 無い場合、環境の値・settings.toml・OpenAI の API キーのファイル（`secrets/openai_api_key`）は user_config_dir(APP_NAME, appauthor=False, roaming=True)、それ以外は user_data_dir(APP_NAME, appauthor=False) の下に配置し、local_settings_file を `{REPO_ROOT}/settings.local.yaml` にする
      2. defaults_file はどちらも `{REPO_ROOT}/config/defaults.yaml` にする
    unit_tests:
      - name: test_resolve_app_paths_when_data_dir
        case: 正常
        summary: データの配置先の下に全てを配置する
        condition: data_dir=一時フォルダ
        mock: なし
        expected: settings_file が {data_dir}/settings.yaml、legacy_settings_file が {data_dir}/settings.toml、local_settings_file が None、defaults_file が {REPO_ROOT}/config/defaults.yaml、openai_api_key_file が {data_dir}/secrets/openai_api_key、log_dir が {data_dir}/log、ui_image_dir が {data_dir}/ui、lock_file が {data_dir}/instance.lock など全てが data_dir の下。フォルダは作られていない
      - name: test_resolve_app_paths_when_default
        case: 正常
        summary: 既定は platformdirs の配置先
        condition: data_dir=None
        mock: platformdirs の user_config_dir・user_data_dir（それぞれ一時フォルダの config・local を返却する）
        expected: settings_file が config/settings.yaml、legacy_settings_file が config/settings.toml、local_settings_file が {REPO_ROOT}/settings.local.yaml、openai_api_key_file が config/secrets/openai_api_key、それ以外が local の下。user_config_dir に roaming=True が渡る
    refs:
      - LIB-16#
    status: implemented
