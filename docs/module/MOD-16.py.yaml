id: MOD-16
visibility: internal
title: 常駐アプリ / APIサーバー / runner.py
test_files:
  - tests/unit/voice_paste/server/test_runner.py
classes:
  - name: ApiServerRunner
    title: API サーバーの起動
    container: server/runner.py
    usecase: 常駐アプリを起動する
    role: ランタイム
    kind: クラス
    summary: uvicorn.Server を専用のスレッドで動かし、待ち受けを始められたかを確かめる
    methods:
      - name: start
        title: 起動
        kind: メソッド
        scope: public
        summary: スレッドで serve() を始め、started が True になるかスレッドが終わるまで待つ
        args:
          - name: timeout_sec
            type: float
            required: true
            passing: positional
            description: 待つ上限
        returns:
          type: bool
          description: 待ち受けを始められたか。uvicorn は待ち受けに失敗しても例外を出さずスレッドを終えるため、戻り値で判断する
        process: |-
          1. スレッドで asyncio.run(server.serve()) を始める
          2. started が True になるか、スレッドが終わるか、timeout_sec が過ぎるまで待つ
             - started が False のままの場合、False を返す
               - `[ERROR]` API の待ち受けを始められなかった（ポート）
        unit_tests:
          - name: test_start
            case: 正常
            summary: 空きポートなら待ち受けを始める
            condition: 127.0.0.1 の空きポート
            mock: なし（GET だけを返す小さな app）
            expected: True が返り、そのポートへの要求に応答が返る
          - name: test_start_when_port_in_use
            case: 正常
            summary: ポートが使われていれば False
            condition: 先に同じポートを開いておく
            mock: なし（127.0.0.1 の空きポート）
            expected: False が返り、ERROR のログが 1 行出る
      - name: stop
        title: 停止
        kind: メソッド
        scope: public
        summary: should_exit を立ててスレッドの終わりを待つ
        returns:
          type: None
          description: なし
        process: |-
          1. スレッドが無ければ何もしない
          2. should_exit を立て、スレッドの終わりを待つ
             - `[INFO]` API の待ち受けを止めた（ポート）
        unit_tests:
          - name: test_stop
            case: 正常
            summary: 止めるとポートが空く
            condition: start で True が返った後に stop を呼ぶ
            mock: なし（127.0.0.1 の空きポート）
            expected: スレッドが終わっており、同じポートを開き直せる
          - name: test_stop_when_not_started
            case: 正常
            summary: 始めていなければ何もしない
            condition: start を呼ばずに stop を呼ぶ
            mock: なし
            expected: 例外が出ない
    refs:
      - LIB-29#
    status: implemented
    description: |-
      app とポートを受けて `uvicorn.Server`（host は `127.0.0.1` 固定、アクセスログを出さない）を作る。
      待ち受けの成否を戻り値で返すのは、uvicorn が待ち受けに失敗しても例外を出さずスレッドを終えるため。
    properties:
      - name: _server
        type: uvicorn.Server
        access: 内部 (_)
        description: 127.0.0.1:{ポート} で待ち受ける uvicorn のサーバー
      - name: _thread
        type: threading.Thread | None
        access: 内部 (_)
        description: serve() を動かすスレッド。start の前は None
