設定スキーマの追従:
  説明: AI Monitor の `settings.yaml`（`~/.config/ai-monitor/settings.yaml`）に、v0.3.0 の `settings.yaml.example` で増えたキーを追加し、voice-paste の行（`name` が `voice-input`）の `rule_indexes` を、実在する `docs/rules.yaml` だけを指す値にする。書き換える前に日付つきのバックアップを同じフォルダに置く
  タグ: [設定]
  実行者: planner
  時期: マージの前
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: MCP `reload_settings` の結果に反映しなかった項目が無く、voice-paste のエージェントの起動時に `voice-paste/rules.yaml` を読めないというルール注入の案内が出ない
  状態: 未
