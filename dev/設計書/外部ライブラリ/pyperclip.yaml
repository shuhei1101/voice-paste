title: "pyperclip"
kind: "ライブラリ"
version:
  current: 1.11.0
  checked_on: '2026-09-30'
  source: pyproject.toml（~=1.9）と uv.lock のバージョン
  pinning: 互換リリースで固定（~=1.9）
catalogs:
  - name: API
    version: 1.11.0
    entries:
      - name: copy
        kind: 関数
        purpose: 起こした文字をクリップボードへ書く
lead: OS のクリップボードへ文字を書き、読むライブラリ。
purl: pkg:pypi/pyperclip
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/integrations/keyboard/sender.py
upstream: asweigart/pyperclip
verification:
  state: 済
  date: '2026-10-01'
  detail: Windows で pyperclip.copy / paste を呼び、起こした文字をクリップボードへ書いて元の文字へ戻せることを確かめた
license: BSD（商用利用可）
official_url: https://github.com/asweigart/pyperclip
install: |-
  `uv sync --frozen` で入る。Linux（Xorg）ではクリップボードを `xclip` か `xsel` で扱うため、OS のパッケージを入れる。

  ```bash
  sudo apt install xclip
  ```
