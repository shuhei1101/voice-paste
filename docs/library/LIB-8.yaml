id: LIB-8
visibility: internal
title: "faster-whisper"
kind: "ライブラリ"
version:
  current: 1.2.1
  checked_on: '2026-09-30'
  source: pyproject.toml の `[project.optional-dependencies] local-whisper`（~=1.0）と uv.lock のバージョン
  pinning: 互換リリースで固定（~=1.0）
catalogs:
  - name: API
    version: 1.2.1
    entries:
      - name: WhisperModel
        kind: クラス
        purpose: モデル名・デバイス・量子化・CPU スレッド数・ワーカー数を指定してモデルを読み込む（手元に無ければ Hugging Face Hub から取得する）
      - name: WhisperModel.transcribe
        kind: メソッド
        purpose: 音声ファイルを言語・ビーム幅・候補数・温度・VAD・前の区間の文脈・無音の閾値・手がかりの単語（hotwords）を指定して文字に起こし、区間ごとの文字と音声の長さを返却する
        params:
          - name: hotwords
            type: str | None
            required: false
            default: None
            description: 表記を合わせたい単語の並び。録音の長さによらず 30 秒のウィンドウごとに、頭に半角の空白を追加して前の文脈の範囲へ入る
            constraints: トークンが 224 以上なら先頭の 223 トークン（`max_length // 2 - 1`、`max_length = 448`）に切られる（v1.2.1 の transcribe.py L1542-1548）
            notes: prefix を引き渡すと使用されない。引き渡すと句読点が付く・区間ごとの改行がまとまる・口癖が一部消える、など記載方法も変わる（[#99 文字起こしに渡す手がかりの語をプリセットで保存して切り替え、設定画面から編集できるようにする](https://github.com/shuhei1101/voice-paste/issues/99) の PoC）
      - name: assets/silero_vad_v6.onnx
        kind: ファイル
        purpose: 同梱の Silero VAD のモデル。常駐アプリは同じファイルを `src/voice_paste/integrations/vad/assets/` に同梱して開く
        description: 'faster-whisper を `local-whisper` の extra へ移したため（PR [#204 文字起こしのエンジンに OpenAI API を追加し、faster-whisper・nvidia-* を入れなくても使えるようにする](https://github.com/shuhei1101/voice-paste/issues/204)）、常駐アプリは faster-whisper のパッケージからは開かず、faster-whisper 1.2.1 のこのファイルを `src/voice_paste/integrations/vad/assets/silero_vad_v6.onnx` へコピーして同梱する（MIT。ライセンスの表記を添える）。入力は input（(1, 576) の float32）・h・c（(1, 1, 128)）、出力は確率・h・c（PoC [#80 PoC: 録音を止めずに Silero VAD で区切り、区間ごとの文字起こしが追いつくかを確かめる](https://github.com/shuhei1101/voice-paste/issues/80) で確認した構造）。faster-whisper のバージョンを上げるときは、同梱したファイルと入出力が変わっていないかを確認する。'
        refs:
          - LIB-15#
        status: planned
        introduced:
          pr: 78
lead: CTranslate2 で Whisper のモデルを動かし、音声を文字に起こすライブラリ。
purl: pkg:pypi/faster-whisper
dependency_scope: 任意
adoption: 採用
used_in:
  - src/voice_paste/integrations/whisper/worker.py
  - src/voice_paste/integrations/whisper/client.py
upstream: SYSTRAN/faster-whisper
verification:
  state: 済
  date: '2026-10-01'
  detail: ワーカーのサブプロセスで WhisperModel（large-v3・cuda・int8）を読み込み、履歴の録音 10 件を beam_size=10・VAD ありで起こして文字が返ることを確認した
license: MIT（商用利用可）
official_url: https://github.com/SYSTRAN/faster-whisper
issues:
  - title: av 19 で録音を読むときに TypeError になる
    summary: av 19 では faster-whisper 1.2.1 の av.open(..., metadata_errors="ignore") が TypeError になり、文字起こしが毎回失敗する
    occurred_on: '2026-10-05'
    state: 回避策あり
    description: |-
      av 19.0.1 が入った環境で faster-whisper 1.2.1 に録音を引き渡すと、録音を読み込む `av.open(input_file, mode="r", metadata_errors="ignore")` が `TypeError: open() got an unexpected keyword argument 'metadata_errors'` で失敗し、文字起こしが毎回失敗する。
      faster-whisper 1.2.1 は `av>=11` と下限しか宣言しないため、依存を再インストールすると最新の av 19 が入る。
      av 18.1.0 では同じ録音が読み込める（faster-whisper 1.2.1 と av 18.1.0 / 19.0.1 の組で `decode_audio` を呼んで確認した）。
      上流では master で修正済み（コミット 2ce7f9d）だが、リリースは 1.2.1 のまま（2026-10-05 時点）。
    conditions:
      - faster-whisper 1.2.1
      - av 19 以降（19.0.1 で確認）
    workarounds:
      - method: '`pyproject.toml` の `dependencies` に `av>=11,<19` を宣言する'
        result: 新しく作った venv でも av 19 未満が入り、文字起こしが通る。faster-whisper が av 19 に対応したバージョンを出すまで av の上限を解除できない
        recommended: true
    upstream_issue: https://github.com/SYSTRAN/faster-whisper/issues/1589
    refs:
      - LIB-4#
  - title: 話していない定型句が文末に入る
    summary: 無音・雑音の区間に、話していない「ご視聴ありがとうございました」などの定型句が起こした文字に入る
    occurred_on: '2026-10-22'
    state: 回避策あり
    description: |-
      Whisper（large-v3 を含む）は、話し声の無い区間を学習データの動画の末尾に多い定型句で埋めることがある（ハルシネーション）。
      完全な無音では「ご視聴ありがとうございました」や直前の文の繰り返し、BGM・雑音だけの区間では「チャンネル登録お願いします」が出やすい（出所: https://claudelab.net/articles/api-sdk/claude-whisper-japanese-silence-hallucination-no-speech-prob-vad-field-notes ）。
      このアプリでは録音の終わりの無音から、文末に「ご視聴ありがとうございました」「ありがとうございました」が入る（Issue [#158 ハルシネーション対策](https://github.com/shuhei1101/voice-paste/issues/158)）。
    conditions:
      - 録音の終わりか始めに無音・雑音の区間がある
      - '`vad_filter` をオンにしても、VAD が話し声とみなした短い雑音が残る'
    workarounds:
      - method: 補正で、文頭・文末から削除する文言の一覧に一致した文言を削除する
        result: 一覧に書き込んだ定型句が、文中の同じ言葉を残して文頭・文末から消える
        recommended: true
      - method: '`vad_filter` をオン、`condition_on_previous_text` をオフにする（既定）'
        result: 無音の区間と前の文の繰り返しは減るが、定型句は残ることがある
        recommended: true
      - method: '`word_timestamps=True` と `hallucination_silence_threshold`（1.0 / 2.0 秒）を `transcribe` へ引き渡す'
        result: 履歴の録音で起こし比べた結果、定型句が出なくなったのは 8 件中 2 件で、どの組み合わせも同じ。定型句の出ない 20 件では話した区間が欠けた（文字の変化率は最大 `word_timestamps` のみ 13.0%・しきい値 1.0 秒 66.7%・2.0 秒 25.2%）。しきい値を入れた組み合わせでは、基準に無い定型句が 1 件出た。引き渡さない。出た定型句は、文頭・文末から削除する文言の一覧（既定に「ありがとうございました」を含む）で扱う
    refs:
      - SC-9#scenarios[正常シナリオ（文頭・文末の決まった文言を消す）]
