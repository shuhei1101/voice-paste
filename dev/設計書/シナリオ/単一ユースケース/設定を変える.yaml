title: "設定を変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 変える設定
        description: 録音開始のホットキーを別のキーの組み合わせに変える
        notes: '`RESIDENT_HOTKEY`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant TRAY as トレイ
        participant APP as 常駐アプリ
        participant SW as 設定画面
        participant ENV as .env

        U->>TRAY: 「設定」を選ぶ
        TRAY->>APP: 設定画面を開く要求
        APP->>SW: 「voice-paste 設定」を最前面で開く（今の設定を欄に入れる）
        U->>SW: 「録音開始」の「入力」を押し、新しいキーの組み合わせを押す
        SW-->>U: 押した組み合わせを表示する
        U->>SW: 「保存」を押す
        SW->>ENV: 変わったキーだけを書く
        SW->>APP: 変わった設定を実行中の設定へ反映し、画面を閉じる
        APP->>APP: 録音開始のホットキーを登録し直す
      ```
    expected:
      - '`.env` の `RESIDENT_HOTKEY` が新しい組み合わせになっている'
      - 再起動せずに、新しい組み合わせで録音の画面が開き、前の組み合わせでは開かない
      - 設定画面が閉じている
  - name: 正常シナリオ（保存して再起動する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 変える設定
        description: Whisper のモデルを別のモデルに変える
        notes: '`WHISPER_MODEL`。再起動しないと効かない項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant ENV as .env
        participant APP as 常駐アプリ
        participant NEW as 新しい常駐アプリ

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: Whisper のモデルを変えて「保存+再起動」を押す
        SW->>ENV: 変わったキーだけを書く
        SW->>APP: 画面を閉じ、再起動を求める
        APP->>NEW: 同じ引数で新しいプロセスを起動する
        APP->>APP: 自分のプロセスを終える
        Note over NEW: 以降は 常駐アプリを起動する の 正常シナリオ（新しいモデルを読み込む）
      ```
    expected:
      - '`.env` の `WHISPER_MODEL` が新しいモデルになっている'
      - 前の常駐アプリのプロセスが終わり、新しいプロセスが新しいモデルで文字を起こす
  - name: 正常シナリオ（初期化する）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 変えた設定
        description: '`.env` に `.env.sample` と違う値がある'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant ENV as .env

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「初期化」を押す
        SW-->>U: 「設定の初期化」の確認（反映には再起動が必要です）
        U->>SW: 「はい」を押す
        SW->>ENV: .env.sample で上書きする
        SW->>SW: 画面を閉じる
      ```
    expected:
      - '`.env` の中身が `.env.sample` と同じになっている'
      - 動いている常駐アプリは、再起動するまで前の設定のまま動く
  - name: 正常シナリオ（取り消す）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 取り消し
        description: 欄を書き換えてから「キャンセル」を押す
        notes: Esc でも同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 欄を書き換えて「キャンセル」を押す
        SW->>SW: 何も書かずに画面を閉じる
      ```
    expected:
      - '`.env` が変わっていない'
      - 動いている常駐アプリの設定が変わっていない
  - name: 異常シナリオ（数値の欄に数値でない値を入れる）
    setup:
      - name: Mock
        description: なし（実機の Windows で実行）
      - name: 数値でない値
        description: 「送信待機（秒）」に `abc` を入れて「保存」を押す
        notes: '`PASTE_ENTER_DELAY`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant SW as 設定画面
        participant ENV as .env

        Note over SW: 設定画面を開くまでは 正常シナリオ と同じ
        U->>SW: 「送信待機（秒）」を abc にして「保存」を押す
        SW->>ENV: 値を確かめずに PASTE_ENTER_DELAY=abc を書く
        SW->>SW: 実行中の設定へ数値として反映しようとして例外になる
      ```
    expected:
      - '`.env` に `PASTE_ENTER_DELAY` の数値でない値が書かれている'
      - 設定画面が閉じずに残り、入力の誤りは画面に出ない
      - 次に起動すると、設定を読むところで例外になり起動できない
lead: トレイの「設定」から設定画面を開き、変えた設定を `.env` に保存する単一ユースケース。
issue: 3
primary_actor: 音声入力を使うユーザー
trigger: トレイのメニューの「設定」を選ぶ
preconditions:
  - 常駐アプリが待機中である（録音や文字起こしの間に「設定」を選んでも開かない）
notes:
  画面の項目: 上から、ホットキー（録音開始・録音確定・確定（貼付のみ）・録音キャンセル・コピーのみ・一時停止）・貼り付けキー・送信待機（秒）・ログレベル、文字起こしエンジン設定（エンジン・OpenAI API キー）、Whisper のモデル・デバイス・量子化タイプ、画面の表示位置・常に最前面・カーソル側モニター・ウィンドウ非表示、用語集ファイル、AI 送信設定（AI1〜AI3 の有効・名前・URL・ホットキー、AI 送信待機（秒））、波形の感度、録音中音量設定（録音中音量制御・音量比率（%）・フェード時間（秒））。
  再起動しないと効かない項目: 文字起こしのエンジン・OpenAI API キー・Whisper のモデル・デバイス・量子化タイプは、保存しても動いている文字起こしのエンジンを作り直さない。画面にも「再起動後に反映」と出している。そのほかの項目は、保存した時点で動いている常駐アプリにも効く。
