    reason: 別の Issue の要望。この作業 PR で録音セッションの状態が変わった後に描き直す
    plan: '#284'
  - item: API の録音セッションの取り消し・停止の待ち合わせ
    reason: 要望はホットキー・トレイから始めた録音の取り消しで、API の録音セッションは取り消しの操作を持たない
    plan: none
