id: MOD-77
visibility: internal
title: 常駐アプリ / 外部連携 / active_window_wayland.py
test_files:
  - tests/unit/voice_paste/integrations/keyboard/test_active_window_wayland.py
constants:
  - name: FOCUSED_WINDOW_COMMAND
    title: フォーカスしているウィンドウを読むコマンド
    container: integrations/keyboard/active_window_wayland.py
    usecase: 起こした文字を届ける
    summary: 拡張 Focused Window D-Bus の Get をセッションバスで呼ぶ gdbus の引数
    value: ("gdbus", "call", "--session", "--dest", "org.gnome.Shell", "--object-path", "/org/gnome/shell/extensions/FocusedWindow", "--method", "org.gnome.shell.extensions.FocusedWindow.Get")
    status: planned
  - name: FOCUSED_WINDOW_TIMEOUT_SEC
    title: フォーカスしているウィンドウを読む上限
    container: integrations/keyboard/active_window_wayland.py
    usecase: 起こした文字を届ける
    summary: gdbus の応答を待つ秒数。超えたら読めなかったとして設定の貼り付けのキーを送信する
    value: '1.0'
    reason: 'PoC #239 で読む時間は 0.006〜0.009 秒だった。応答しない GNOME Shell で貼り付けを長く止めない上限にする'
    status: planned
functions:
  - name: read_focused_wm_class
    title: フォーカスしているウィンドウの wm_class の読み取り（Wayland）
    kind: 関数
    container: integrations/keyboard/active_window_wayland.py
    usecase: 起こした文字を届ける
    scope: public
    summary: GNOME Shell の拡張 Focused Window D-Bus の Get を `gdbus call` で呼び、フォーカスしているウィンドウの wm_class_instance・wm_class を読む。拡張に触れるのはこのファイルだけ
    returns:
      type: tuple[str, ...]
      description: （wm_class_instance, wm_class）のうち空でないもの。読めないときは空
    process: |-
      1. FOCUSED_WINDOW_COMMAND を subprocess.run（capture_output・text・check=True・timeout=FOCUSED_WINDOW_TIMEOUT_SEC）で流す
      2. 標準出力（`('{...}',)` の GVariant の書式）を ast.literal_eval でタプルにし、先頭の文字列を json.loads で読む
      3. wm_class_instance・wm_class のうち空でない文字列をこの順に返す
      4. 1〜3 で OSError（`gdbus` が無い）・subprocess.SubprocessError（拡張が無い・無効で終了コードが 0 でない・時間切れ）・ValueError・SyntaxError（出力の書式が違う）が出た場合、空を返す（貼り付けを止めない）
         - `[WARNING]` フォーカスしているウィンドウの wm_class を読めなかった（元の例外）
    refs:
      - LIB-1#
    status: planned
    notes:
      テスト: 単体テストのファイルは `tests/unit/voice_paste/integrations/keyboard/test_active_window_wayland.py`。subprocess.run を差し替える。実物の拡張は検証環境の VM での通しの確認で確かめる
    unit_tests:
      - name: test_read_focused_wm_class
        case: 正常
        summary: 拡張の返す wm_class_instance・wm_class を返す
        condition: subprocess.run の標準出力が `('{"wm_class":"Gnome-terminal","wm_class_instance":"gnome-terminal-server","title":"端末"}',)` と改行
        mock: subprocess.run
        expected: ("gnome-terminal-server", "Gnome-terminal") が返り、subprocess.run に FOCUSED_WINDOW_COMMAND と timeout=1.0・check=True が渡る
      - name: test_read_focused_wm_class_when_empty_values
        case: 正常
        summary: 空の値を除いて返す
        condition: 標準出力の JSON が `{"wm_class":"python3","wm_class_instance":""}`
        mock: subprocess.run
        expected: ("python3",) が返る
      - name: test_read_focused_wm_class_when_extension_missing
        case: 異常
        summary: 拡張が無ければ空を返す
        condition: subprocess.run が CalledProcessError（終了コード 1）を送出する
        mock: subprocess.run
        expected: () が返り、WARNING のログが出る
      - name: test_read_focused_wm_class_when_gdbus_missing
        case: 異常
        summary: gdbus が無ければ空を返す
        condition: subprocess.run が FileNotFoundError を送出する
        mock: subprocess.run
        expected: () が返る
      - name: test_read_focused_wm_class_when_timeout
        case: 異常
        summary: 応答が遅ければ空を返す
        condition: subprocess.run が TimeoutExpired を送出する
        mock: subprocess.run
        expected: () が返る
      - name: test_read_focused_wm_class_when_malformed
        case: 異常
        summary: 出力の書式が違えば空を返す
        condition: 標準出力が `('not json',)`
        mock: subprocess.run
        expected: () が返る
