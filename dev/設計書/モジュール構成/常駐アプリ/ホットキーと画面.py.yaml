            required: true
            passing: positional
            description: 録音の長さ
        returns:
          type: None
          description: なし
        unit_tests:
          - name: test_set_progress
            case: 正常
            summary: 進みと残りを出す
            condition: 経過 3.0 秒のときに set_progress(3.1, 5.0)
            mock: 経過を返す時計
            expected: 進みのバーが 62、経過と残りの時間が「経過 3.0 秒 残り 2 秒 / 5 秒」
      - name: close_window
        title: 表示を閉じる
        summary: タイマーを止めて窓を隠す
        kind: メソッド
        scope: public
        returns:
