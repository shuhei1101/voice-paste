        condition: 'choices=(system, light, dark)、current=light、labels={system: Windows の設定に従う, light: ライト, dark: ダーク}。QT_QPA_PLATFORM=offscreen'
        mock: なし
        expected: ボタンの名前が「Windows の設定に従う」「ライト」「ダーク」の順で、「ライト」だけが選ばれている
      - name: test_make_radio_group_when_no_labels
        case: 正常
        summary: labels が無ければ値をそのまま名前にする
        condition: choices=(center, top-left)、current=center、labels なし。QT_QPA_PLATFORM=offscreen
        mock: なし
        expected: ボタンの名前が「center」「top-left」で、「center」が選ばれている
    status: implemented
  - name: selected_radio
    title: 選んだラジオボタンの値
    container: ui/windows/settings_fields.py
    usecase: 設定を変える
    summary: make_radio_group の組で選んでいるボタンの値（名前ではなく列挙の値）を返す。単体テストは test_settings_window.py に置く
    kind: 関数
    scope: public
    args:
      - name: container
        type: QWidget
        required: true
        passing: positional
        description: make_radio_group が返した組
    returns:
      type: str
      description: 選んでいるボタンの値。どれも選んでいなければ空の文字
    unit_tests:
      - name: test_selected_radio_when_labels
        case: 正常
        summary: 名前ではなく値を返す
        condition: test_make_radio_group_when_labels と同じ組で「ダーク」を選ぶ。QT_QPA_PLATFORM=offscreen
        mock: なし
        expected: dark
    status: implemented
  - name: find_glossary_row_errors
    title: 用語集の行の確かめ
    container: ui/windows/settings_glossaries.py
    usecase: 設定を変える
    summary: 用語集の行のうち、誤変換か正しい表記の片方だけが空の行と、空の側の項目を返す。単体テストは tests/unit/voice_paste/ui/windows/test_settings_glossaries.py に置く
    kind: 関数
    scope: public
    args:
      - name: entries
        type: Sequence[GlossaryEntry]
        required: true
        passing: positional
        description: 用語集 1 つの行（表の順。前後の空白を除いた値）
    returns:
      type: list[tuple[int, Literal["wrong", "right"]]]
      description: （何行目か（0 から）, 空の側の項目）の並び。オフの行も確かめる。両方が空の行は返さない
    unit_tests:
      - name: test_find_glossary_row_errors
        case: 正常
        summary: 片方だけが空の行を、空の側の項目つきで返す
        condition: 「あ,い」「,う」「え,」「,」の 4 行（2 行目はオフ）
        mock: なし
        expected: '[(1, "wrong"), (2, "right")] が返る'
      - name: test_find_glossary_row_errors_when_valid
        case: 正常
        summary: 両方がある行と両方が空の行だけなら空
        condition: 「あ,い」「,」の 2 行
        mock: なし
        expected: '[] が返る'
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#
    status: implemented
  - name: notify_copied
    title: コピーの完了の知らせ
    container: ui/bridge.py
    usecase: 起こした文字を届ける
    summary: UiBridge.copied を emit して、メインスレッドでトレイにコピーの完了の通知を出す
    description: 起こした文字は「理由」を運ぶ notify の detail と分けて渡し、ログに書かない。
    kind: 関数
    scope: public
    thread_safe: true
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: クリップボードへ書いた起こした文字
      - name: bridge
        type: UiBridge
        required: true
        passing: injected
        description: メインスレッドで作った橋渡し
    returns:
      type: None
      description: なし
    process: |-
      1. `bridge.copied.emit(text)` を呼ぶ
         - `[INFO]` ユーザーへの知らせ（copy_completed。起こした文字は書かない）
    unit_tests:
      - name: test_notify_copied
        case: 正常
        summary: 起こした文字を Signal で渡し、ログには書かない
        condition: text="テストの文字"
        mock: なし（copied に受け手をつなぐ）
        expected: 受け手に "テストの文字" が届き、INFO のログが 1 行出て、ログに "テストの文字" が含まれない
    status: planned
    refs:
      - dev/設計書/画面設計/常駐アプリ/トレイの通知.py#elements[コピーし直す]
notes:
  画面が触ってよいもの: |-
    ui は UiDeps の関数（配線された SessionManager のメソッド・音量・設定の読み書き・再起動と終了）と、共通の設定のモデルだけを呼ぶ。録音・文字起こし・出力先を直に呼ばない。
    設定画面の欄は Settings のモデルから組み立て、項目を足しても画面の直しが増えないようにする。
  スレッド: |-
    画面の部品はメインスレッド（Qt のイベントループ）だけが触る。API・ホットキー・ワーカーのスレッドからは notify・report_progress で UiBridge の Signal を emit するだけにする。
    ホットキーが呼ぶ関数は SessionManager（ロックで守られている）だけを呼び、画面は state_changed の知らせで変える。
  テスト: 画面を使う単体テスト・結合テストは `QT_QPA_PLATFORM=offscreen` で QApplication を 1 つ作り、操作は PySide6 の QtTest（QTest）で行う。画面の振る舞いは画面設計を元にした結合テスト（`tests/integration/ui/`）で確かめる。
data_models:
  - name: UiDeps
    title: 画面の依存
    container: ui/controller.py
    usecase: 共通
    role: DTO
    summary: 画面・トレイが呼ぶ配線済みの関数。ui は features を import せず、main.py がこの束を渡す
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: start
        type: Callable[[], None]
        description: トレイからの録音の開始（entry=tray を部分適用した start_local_session）
      - name: pause
        type: Callable[[], None]
        description: SessionManager.pause
      - name: resume
        type: Callable[[], None]
        description: SessionManager.resume
      - name: complete
        type: Callable[[str, str | None], None]
        description: 固定の出力先の ID かカスタムプリセットのどちらかで確定する（SessionManager.complete を output_id・preset で呼ぶ）
      - name: cancel
        type: Callable[[], None]
        description: SessionManager.cancel
      - name: current_session
        type: Callable[[], Session | None]
        description: SessionManager.current
      - name: level
        type: Callable[[], float]
        description: 録音中の音量（0.0〜1.0。Recorder.level）
      - name: get_settings
        type: Callable[[], Settings]
        description: 今効いている設定（SettingsStore.get）
      - name: save_settings
        type: Callable[[Settings, Mapping[Path, Sequence[GlossaryEntry]]], bool]
        description: 設定と、行を変えた用語集の CSV（場所 → 行）を書いて効かせ、再起動が要る項目が変わったかを返す（apply_settings）
      - name: settings_dir
        type: Path
        description: settings.toml のあるフォルダ
      - name: log_dir
        type: Path
        description: ログのフォルダ
      - name: request_restart
        type: Callable[[], None]
        description: 終わった後に起動し直すようにしてイベントループを抜ける
      - name: request_quit
        type: Callable[[], None]
        description: イベントループを抜ける（QApplication.quit）
      - name: suspend_hotkeys
        type: Callable[[], None]
        description: ホットキーの受付を止める（HotkeyListener.stop）。設定画面を開いている間、欄で押したキーで録音が始まらないようにする
      - name: resume_hotkeys
        type: Callable[[], None]
        description: 今の設定でホットキーの受付を始める（build_hotkey_bindings → HotkeyListener.start）。設定画面を閉じたときに呼ぶ
      - name: output_titles
        type: Mapping[str, str]
        description: 画面に出す出力先の名前（出力先の ID → OUTPUTS の title。API 専用の出力先を除く）。設定画面の欄と録音の画面のボタンが引く
      - name: apply_theme
        type: Callable[[], None]
        description: 今の設定の ui.theme で画面の明暗を当て直す（配線で apply_theme に QApplication と SettingsStore.get の ui.theme を渡したもの）
      - name: list_glossaries
        type: Callable[[], list[GlossarySettings]]
        description: 今の設定の用語集の一覧（path は絶対パス。glossaries が空なら今までの用語集の 1 件。resolve_glossaries）
      - name: read_glossary
        type: Callable[[Path], list[GlossaryEntry]]
        description: 用語集の CSV の行を、オン・オフと片方が空の行も含めて読む（read_glossary_rows）。読めなければ GlossaryReadError を送出する
      - name: new_glossary_path
        type: Callable[[Collection[Path]], Path]
        description: 足す用語集の CSV の場所を、一覧にある場所と重ならないように決める（フォルダを部分適用した next_glossary_path）
      - name: copy
        type: Callable[[str], None]
        description: クリップボードへ書く（copy_to_clipboard。書けなければ DeliveryError）。コピーの完了の通知を押したときにコピーし直す
      - name: switch_output
        type: Callable[[str], None]
        description: 文字起こし中に届ける出力先を差し替える（SessionManager.switch_output）。文字起こし中の表示の切り替えのボタンが呼ぶ
    status: implemented
enums:
  - name: TrayState
    title: トレイの状態
    container: ui/tray.py
    usecase: トレイから操作する
    summary: トレイのアイコンとヒントの出し分け。値は `resources/tray/{値}.png` のファイル名
    values:
      - value: starting
        member: STARTING
        title: 準備中
        description: 起動してから待機中になるまで
      - value: idle
        member: IDLE
        title: 待機中
        description: セッションが無い
      - value: recording
        member: RECORDING
        title: 録音中
        description: recording・paused・stopped
      - value: transcribing
        member: TRANSCRIBING
        title: 文字起こし中
        description: transcribing・delivering
      - value: failed
        member: FAILED
        title: 失敗
        description: 文字起こしのエンジンを準備できなかった起動。次の起動まで続く
    refs:
      - dev/設計書/画面設計/常駐アプリ/トレイ.py#
    status: implemented
  - name: RecordingWindowState
    title: 録音の画面の状態
    container: ui/tray.py
    usecase: 録音する
    summary: トレイの「録音の画面を出す」の出し分け
    values:
      - value: hidden
        member: HIDDEN
        title: 隠している
        description: hotkey・tray の recording・paused で、その回の録音の画面を隠している。項目を押せる
      - value: shown
        member: SHOWN
        title: 表示中
        description: hotkey・tray の recording・paused で、録音の画面が出ている
      - value: no_window
        member: NO_WINDOW
        title: 画面を出さない録音
        description: '`recording.hide_window` がオンの録音か、api の録音'
      - value: not_recording
        member: NOT_RECORDING
        title: 録音していない
        description: 待機中・文字起こし中・準備に失敗した起動
    refs:
      - dev/設計書/画面設計/常駐アプリ/トレイ.py#elements[録音の画面を出す]
    status: implemented
