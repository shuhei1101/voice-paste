  detail: keyboard.Controller の生成と keyboard.Key の ctrl・shift・alt・cmd・enter が 1.8.1 で引けることだけ確かめた（2026-10-02）。キーを送信して貼り付け先で受かるかは、今のアクティブなウィンドウへ入力が飛んで使っている画面を壊すため、動かしていない
