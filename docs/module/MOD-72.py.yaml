id: MOD-72
visibility: internal
title: 常駐アプリ / 外部連携 / sender.py
test_files:
  - tests/unit/voice_paste/integrations/keyboard/test_sender.py
external_test_files:
  - tests/external/voice_paste/integrations/keyboard/test_sender.py
constants:
  - name: FOCUS_SETTLE_SEC
    title: フォーカスが落ち着くまでの待ち
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    summary: 貼り付けのキーを送信する前に待つ秒数。刷新前と同じ値
    value: '0.1'
    status: implemented
  - name: ENTER_MODIFIER_KEYS
    title: Enter と一緒に押す修飾キーの対応
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    summary: EnterModifier の値と押す pynput のキー。並びが押す順（Ctrl・Alt・Shift）
    value: '{"ctrl": Key.ctrl, "alt": Key.alt, "shift": Key.shift}'
    status: planned
  - name: TERMINAL_WM_CLASSES
    title: 端末アプリの WM_CLASS
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    summary: 'send_paste_linux（Xorg）と UInputKeyboard.send_paste（Wayland）が端末アプリと見なす WM_CLASS の名前（小文字）。インスタンス名かクラス名を小文字にした値がどれかに当たれば端末アプリとする。Wayland では拡張 Focused Window D-Bus が Xorg と同じ名前を返却する（PoC [#239 PoC: 初回の起動のトレイのアイコンと、Wayland の端末アプリの見分け](https://github.com/shuhei1101/voice-paste/issues/239)）'
    value: frozenset({"gnome-terminal-server", "gnome-terminal", "kgx", "org.gnome.console", "ptyxis", "org.gnome.ptyxis", "tilix", "terminator", "konsole", "xfce4-terminal", "alacritty", "kitty"})
    reason: 設定のスキーマを変えないため定数で持つ。Ctrl+Shift+V がクリップボードの貼り付けになる端末を並べる。実際に確認したのは GNOME Terminal（`gnome-terminal-server`。[#211](https://github.com/shuhei1101/voice-paste/pull/211)）だけで、ほかの端末のクラス名と貼り付けのキーは未確認。Ctrl+Shift+V で貼り付けない xterm は入れない
    status: planned
functions:
  - name: copy_to_clipboard
    title: クリップボードへの書き込み
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: pyperclip でクリップボードへ書き込む
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 書き込む文字
    returns:
      type: None
      description: なし
    process: |-
      1. pyperclip.copy で text を書き込む
         - pyperclip が例外を出した場合、DeliveryError を送出する（理由に元の例外を残す）
         - `[INFO]` クリップボードへ書き込んだ（文字数）
    exceptions:
      - name: DeliveryError
        condition: ほかのアプリがクリップボードを開いたままで書き込めない
    refs:
      - LIB-20#
    status: implemented
    unit_tests:
      - name: test_copy_to_clipboard
        case: 正常
        summary: クリップボードへ書き込む
        condition: text が「テスト」
        mock: pyperclip.copy
        expected: pyperclip.copy に「テスト」が 1 回渡る
      - name: test_copy_to_clipboard_when_failed
        case: 異常
        summary: 書き込めなければ DeliveryError
        condition: pyperclip.copy が pyperclip.PyperclipException を送出する
        mock: pyperclip.copy
        expected: DeliveryError が送出される
        exception: ほかのアプリがクリップボードを開いたままで書き込めない
    connectivity_tests:
      - name: test_ext_copy_to_clipboard
        api: pyperclip.copy / pyperclip.paste
        summary: 実機のクリップボードへ書き込んで読み込み戻せる
        checks: copy_to_clipboard("voice-paste のテスト") の後に pyperclip.paste で読み込んだ文字が一致する
        cost: 料金なし。実行中はクリップボードの中身が変わり、終わりに実行前の中身へ戻す
        notes: クリップボードを持たない環境では skip する
  - name: send_paste
    title: 貼り付けのキーの送信
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: pynput で設定の貼り付けのキー（既定 Ctrl+V）を今のアクティブなウィンドウへ送信する
    args:
      - name: paste_key
        type: str
        required: true
        passing: positional
        description: 貼り付けのキー（pynput の GlobalHotKeys の書式。設定の keyboard.paste_key）
    returns:
      type: None
      description: なし
    process: |-
      1. split_paste_key で paste_key を修飾キーと主キーに分ける（DeliveryError はそのまま送出し、キーを送信しない）
      2. 主キーは文字のまま pynput に引き渡す（Windows の送り方。Linux は send_paste_linux を使用する）
      3. FOCUS_SETTLE_SEC だけ待つ（貼り付け先のフォーカスが落ち着くのを待つ）
      4. 修飾キーを順に押し、主キーを押して離し、修飾キーを逆順に離す
         - `[INFO]` 貼り付けのキーを送信した（paste_key）
    refs:
      - LIB-19#
    status: implemented
    unit_tests:
      - name: test_send_paste
        case: 正常
        summary: 待ってから修飾キーと主キーを順に押して離す
        condition: paste_key が `<ctrl>+v`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press('v')・release('v')・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_multiple_modifiers
        case: 正常
        summary: 修飾キーが 2 つでも逆順に離す
        condition: paste_key が `<ctrl>+<shift>+v`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press(shift)・press('v')・release('v')・release(shift)・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_spaced_and_uppercase
        case: 正常
        summary: キーの前後の空白と大文字を揃えて同じキーとして送信する
        condition: paste_key が `<Ctrl> + V`
        mock: pynput.keyboard.Controller・time.sleep
        expected: sleep(0.1)・press(ctrl)・press('v')・release('v')・release(ctrl) の順に呼ばれる
      - name: test_send_paste_when_no_main_key
        case: 異常
        summary: 主キーが 1 つ無ければキーを送信せずに DeliveryError
        condition: paste_key が `<ctrl>`
        mock: pynput.keyboard.Controller・time.sleep
        expected: DeliveryError が送出され、press が呼ばれない
        exception: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
    exceptions:
      - name: DeliveryError
        condition: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
  - name: send_enter
    title: Enter の送信
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    inherits: SendEnterFn
    summary: pynput で、引き渡した修飾キーを押したまま Enter を今のアクティブなウィンドウへ送信する（待ちは呼ぶ側が配置する）
    args:
      - name: modifiers
        type: Sequence[EnterModifier]
        required: false
        default: ()
        passing: positional
        description: 一緒に押す修飾キー。並びと重なりは問わない
    returns:
      type: None
      description: なし
    process: |-
      1. modifiers を ENTER_MODIFIER_KEYS の並び（Ctrl・Alt・Shift）に揃え、重なりを除く
      2. 修飾キーを順に押し、Enter を押して離し、修飾キーを逆順に離す（修飾キーが無ければ Enter だけ）
         - 押している途中で例外が起きても、押した修飾キーは離してから送出する（押されたままにしない）
         - `[INFO]` Enter を送信した（修飾キー: {揃えた修飾キー。無ければ「なし」}）
    refs:
      - LIB-19#
    status: implemented
    unit_tests:
      - name: test_send_enter
        case: 正常
        summary: 修飾キーが無ければ Enter を押して離す
        condition: 引数なし
        mock: pynput.keyboard.Controller
        expected: press(Key.enter)・release(Key.enter) の順に 1 回ずつ呼ばれる
      - name: test_send_enter_when_modifiers
        case: 正常
        summary: 修飾キーを Ctrl・Alt・Shift の順に押し、逆順に離す
        condition: modifiers が ("shift", "ctrl", "shift")
        mock: pynput.keyboard.Controller
        expected: press(ctrl)・press(shift)・press(Key.enter)・release(Key.enter)・release(shift)・release(ctrl) の順に呼ばれる
      - name: test_send_enter_when_press_failed
        case: 異常
        summary: 途中で失敗しても押した修飾キーを離す
        condition: modifiers が ("ctrl",)、press(Key.enter) が例外を送出する
        mock: pynput.keyboard.Controller
        expected: 例外が送出され、release(ctrl) が呼ばれている
        exception: キーを押せない
  - name: split_paste_key
    title: 貼り付けのキーの分解
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: 設定の貼り付けのキーを、押す修飾キーの並びと主キーに分ける。send_paste と send_paste_linux が使用する
    args:
      - name: paste_key
        type: str
        required: true
        passing: positional
        description: 貼り付けのキー（pynput の GlobalHotKeys の書式。設定の keyboard.paste_key）
    returns:
      type: tuple[list[keyboard.Key], str]
      description: 押す修飾キー（paste_key の並び）と、主キー（小文字にした 1 つのキー）
    process: |-
      1. paste_key を KEY_SEPARATOR（`+`）で区切り、各キーの前後の空白を除いて小文字にする（`<Ctrl> + v` も `<ctrl>+v` と同じに扱う。刷新前と同じ）
      2. MODIFIER_KEYS にある `<ctrl>`・`<shift>`・`<alt>`・`<cmd>`・`<win>` を修飾キー、それ以外を主キーにする
         - 主キーが 1 つでない場合、DeliveryError を送出する
    status: planned
    unit_tests:
      - name: test_split_paste_key
        case: 正常
        summary: 修飾キーと主キーに分ける
        condition: paste_key が `<ctrl>+<shift>+v`
        mock: なし
        expected: ([Key.ctrl, Key.shift], "v") が返る
      - name: test_split_paste_key_when_spaced_and_uppercase
        case: 正常
        summary: 前後の空白と大文字を揃える
        condition: paste_key が `<Ctrl> + V`
        mock: なし
        expected: ([Key.ctrl], "v") が返る
      - name: test_split_paste_key_when_no_main_key
        case: 異常
        summary: 主キーが 1 つ無ければ DeliveryError
        condition: paste_key が `<ctrl>`、`<ctrl>+v+c`
        mock: なし
        expected: どちらも DeliveryError が送出される
        exception: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
    exceptions:
      - name: DeliveryError
        condition: paste_key に主キーが 1 つ無い（修飾キーだけ・主キーが 2 つ以上）
  - name: use_xclip_clipboard
    title: クリップボードの書き先を xclip に固定
    kind: 関数
    container: integrations/keyboard/sender.py
    usecase: 起こした文字を届ける
    scope: public
    summary: pyperclip の書き込み先を xclip（XWayland）に固定する。Wayland のセッションの配線が起動のときに 1 回呼ぶ
    description: pyperclip は `WAYLAND_DISPLAY` を見て `wl-copy` を選ぶが、GNOME の `wl-copy` は書き込むたびに貼り付け先のフォーカスを取り、貼り付けのキーが落ちる。xclip はフォーカスを取らず、GNOME が X のクリップボードを Wayland のアプリへ引き渡す。
    returns:
      type: None
      description: なし
    process: 1. `pyperclip.set_clipboard("xclip")` を呼ぶ
    refs:
      - LIB-20#
    unit_tests:
      - name: test_use_xclip_clipboard
        case: 正常
        summary: 書き込み先を xclip に固定する
        condition: 引数なし
        mock: pyperclip.set_clipboard
        expected: set_clipboard("xclip") が 1 回呼ばれる
    status: planned
