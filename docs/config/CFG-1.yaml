id: CFG-1
visibility: internal
title: '設定: 常駐アプリ'
lead: 常駐アプリが既定値（`config/defaults.yaml`）・環境の値（`settings.yaml`）・checkout の上書き（`settings.local.yaml`）の順に重ねて読む設定の一覧。読み書きは `src/voice_paste/shared/settings.py`、見本は `settings.sample.yaml`。
files:
  - file: resources/yogo.csv
    manages: 用語集（誤変換 → 正しい表記。正しい表記が空の行は誤変換を消す）
    notes: 列は `誤変換`・`正しい表記` と、行のオン・オフの `使う`（`0` がオフ。列が無い行はオン）。録音を確定するたびに読み直す。置き場所は `glossary_path` で変えられる。設定画面で追加した用語集は `glossaries[].path` の CSV に同じ列で持つ（列の定義は ER 図『常駐アプリのファイル』の用語集の CSV）。
  - file: config/defaults.yaml
    manages: 設定の全てのキーの既定値と、OS ごとの既定値の上書き（`os_overrides.{windows|linux}`）
    notes: git で管理する。3 レイヤーの 1 つ目で、全てのキーを持つ（欠けていれば起動時に設定を読めない扱い）。`os_overrides` の中は動いている OS の分だけを共通の既定値に重ねる（表はキーごと、一覧は丸ごと）。
  - file: settings.yaml
    manages: 環境の値（この端末で既定値から変えたキー）
    notes: git の管理外。3 レイヤーの 2 つ目。既定は `%APPDATA%\voice-paste\settings.yaml`（Linux は `~/.config/voice-paste/settings.yaml`）、`--data-dir` を渡したときはその下。起動では作らない（`settings.toml` だけがあるときに移すのを除く）。設定画面の保存は、変えたキーのうち既定値と違うものを書き、既定値と同じにしたキーは外す（コメントは保つ）。「既定に戻す」は全てのキーを外す。
  - file: settings.local.yaml
    manages: checkout の上書き（この checkout でだけ変えたいキー）
    notes: git の管理外。リポジトリの直下に置く 3 レイヤーの 3 つ目で、settings.yaml の値に勝つ。`--data-dir` を渡した起動では読まない。常駐アプリは書かない。
  - file: settings.toml
    manages: 前のバージョンの設定
    notes: settings.yaml が無く、同じフォルダにこのファイルがあれば、起動時に既定値と違うキーだけを settings.yaml へ移す（このファイルは残す）。settings.yaml があれば読まない。
  - file: settings.sample.yaml
    manages: settings.yaml・settings.local.yaml の見本
    notes: git で管理する。よく変えるキーを、コメントにした行で並べる（コメントを外したキーだけが既定値に勝つ）。既定値に重ねて設定のモデルの検証に通ることを単体テストで確かめる。
  - file: secrets/openai_api_key
    manages: OpenAI API の API キー（中身はキーの文字列だけ）
    notes: git の管理外。`settings.yaml` と同じフォルダの下（Windows は `%APPDATA%\voice-paste\secrets\openai_api_key`、Linux は `~/.config/voice-paste/secrets/openai_api_key`、`--data-dir` を渡したときはその下）。ユーザーが置き、常駐アプリは読むだけで作らない。環境変数 `OPENAI_API_KEY` があればそちらを使う。`transcription.engine` が `openai` のときだけ読む
settings:
  - key: transcription.engine
    title: 使う文字起こしのエンジン
    file: settings.yaml
    type: "'local_whisper' | 'openai' | 'haas'"
    default: local_whisper
    description: '`local_whisper` は文字起こしワーカー（faster-whisper）で、`openai` は OpenAI API で、`haas` は WSL の中の Haas の文字起こしのサーバーで文字を起こす。`local_whisper` は `local-whisper` の extra を含めて作った環境でだけ動く。`haas` は起動のときにサーバーへ接続できなければ、終了まで `local_whisper` で起こす。'
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: transcription.local_whisper.model
    title: ローカルの Whisper のモデル
    file: settings.yaml
    type: string
    default: large-v3
    description: faster-whisper に読み込ませるモデル。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: transcription.local_whisper.device
    title: ローカルの Whisper のデバイス
    file: settings.yaml
    type: "'cuda' | 'cpu'"
    default: cuda
    description: GPU（cuda）と CPU のどちらで動かすか。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: cuda。Linux: cpu（config/defaults.yaml の os_overrides。Linux では CUDA のライブラリを読ませる手当てが無い）'
  - key: transcription.local_whisper.compute_type
    title: ローカルの Whisper の量子化タイプ
    file: settings.yaml
    type: "'float16' | 'int8' | 'float32'"
    default: float16
    description: 計算の精度。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: float16。Linux: int8（config/defaults.yaml の os_overrides）'
  - key: transcription.local_whisper.cpu_threads
    title: ローカルの Whisper の CPU スレッド数
    file: settings.yaml
    type: int
    default: '0'
    description: 使う CPU のスレッド数（0 は自動）。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
  - key: transcription.local_whisper.num_workers
    title: ローカルの Whisper の並列ワーカー数
    file: settings.yaml
    type: int
    default: '1'
    description: 並列のデコードの数。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 1'
  - key: transcription.local_whisper.beam_size
    title: ローカルの Whisper のビーム幅
    file: settings.yaml
    type: int
    default: '10'
    description: ビームサーチの幅。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 1'
  - key: transcription.local_whisper.best_of
    title: ローカルの Whisper の候補数
    file: settings.yaml
    type: int
    default: '5'
    description: サンプリングの候補の数。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 1'
  - key: transcription.local_whisper.language
    title: ローカルの Whisper の言語
    file: settings.yaml
    type: string
    default: ja
    description: 文字起こしの言語。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: transcription.local_whisper.vad_filter
    title: ローカルの Whisper で無音の区間を除くか
    file: settings.yaml
    type: bool
    default: 'true'
    description: VAD で無音の区間を除くか。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: transcription.local_whisper.vad_threshold
    title: ローカルの Whisper の VAD の閾値
    file: settings.yaml
    type: float
    default: '0.5'
    description: 音声とみなす確信度の閾値。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: 0〜1
  - key: transcription.local_whisper.vad_min_speech_ms
    title: ローカルの Whisper の VAD の最小の音声
    file: settings.yaml
    type: int（ミリ秒）
    default: '250'
    description: これより短い音を雑音として除く。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
  - key: transcription.local_whisper.vad_min_silence_ms
    title: ローカルの Whisper の VAD の最小の無音
    file: settings.yaml
    type: int（ミリ秒）
    default: '2000'
    description: これ以上の無音で区間を区切る（起こした文字の改行の位置に効く）。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
  - key: transcription.local_whisper.condition_on_previous_text
    title: ローカルの Whisper で前の区間を文脈に使うか
    file: settings.yaml
    type: bool
    default: 'false'
    description: 前の区間の文字を次の区間の文脈に使うか。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: transcription.local_whisper.temperature
    title: ローカルの Whisper の温度
    file: settings.yaml
    type: float
    default: '0.0'
    description: サンプリングの温度（0.0 は決定的）。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
  - key: transcription.local_whisper.no_speech_threshold
    title: ローカルの Whisper の無音判定の閾値
    file: settings.yaml
    type: float
    default: '0.6'
    description: 区間を無音とみなす確信度の閾値。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: 0〜1
  - key: recording.lower_volume
    title: 録音中に音量を下げるか
    file: settings.yaml
    type: bool
    default: 'true'
    description: '`true` のとき、録音を始める前にシステム音量を下げ、録音を終えたら戻す。'
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: true。Linux: false（config/defaults.yaml の os_overrides）。Linux では値によらず音量を変えず、設定画面にも出さない'
  - key: recording.volume_percent
    title: 録音中の音量の割合
    file: settings.yaml
    type: float（%）
    default: '50'
    description: 録音中のシステム音量を、録音前の音量に対する割合で指定する（50 は半分）。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: 0〜100
    per_env: Linux では使わず、設定画面にも出さない（settings.yaml の値は保つ）
  - key: recording.fade_sec
    title: 音量を変えるときの秒数
    file: settings.yaml
    type: float（秒）
    default: '0.5'
    description: 音量を下げるときと戻すときにかける秒数。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
    per_env: Linux では使わず、設定画面にも出さない（settings.yaml の値は保つ）
  - key: recording.hide_window
    title: 録音中に画面を出さないか
    file: settings.yaml
    type: bool
    default: 'false'
    description: '`true` のとき、録音の画面も文字起こし中の表示も出さず、トレイとホットキーだけで操作する。'
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: hotkeys.start
    title: 録音開始のホットキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: <ctrl>+<alt>+d
    description: 待機中に録音を始める。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: <ctrl>+<alt>+d。Linux: <cmd>+<alt>+d（config/defaults.yaml の os_overrides。Ubuntu は Ctrl+Alt+D を「デスクトップを表示」に割り当てている）'
  - key: hotkeys.pause
    title: 録音を一時停止するホットキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: <ctrl>+<alt>+z
    description: 録音を一時停止・再開する。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: <ctrl>+<alt>+z。Linux: <cmd>+<alt>+z（config/defaults.yaml の os_overrides）'
  - key: hotkeys.cancel
    title: 録音の取り消しのホットキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: <ctrl>+<alt>+q
    description: 録音を確定せずに捨てる。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: <ctrl>+<alt>+q。Linux: <cmd>+<alt>+q（config/defaults.yaml の os_overrides）'
  - key: keyboard.paste_key
    title: 貼り付けに送信するキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: <ctrl>+v
    description: 貼り付け先へ送信する貼り付けのキーの組み合わせ。Linux の Xorg のセッションと、拡張 Focused Window D-Bus を入れた Wayland のセッションでは、貼り付け先が端末アプリのときだけこのキーに代えて Ctrl+Shift+V を送信する。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: outputs[].id
    title: 出力先の ID
    file: settings.yaml
    type: "'paste_and_send' | 'paste_only' | 'copy_only'"
    default: 3 件（paste_and_send・paste_only・copy_only の順）
    description: 出力先の一覧の 1 件がどの出力先かを表す。一覧の中で重ならない。`id = "ai_chat"` の項目は、読み込むときに送信先（`targets[]`）をブラウザ添付種類のカスタムプリセットへ読み替えて外す。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: outputs[].enabled
    title: 出力先がオンか
    file: settings.yaml
    type: bool
    default: 'true'
    description: '`false` の出力先は確定の操作に出さず、ホットキーも登録しない。'
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: outputs[].hotkey
    title: 出力先で確定するホットキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: 'paste_and_send: <ctrl>+<alt>+d / paste_only: <ctrl>+<alt>+v / copy_only: <ctrl>+<alt>+c'
    description: |-
      録音の画面でこの出力先として確定する。
      固定の出力先で確定した録音の文字起こし中は、届ける出力先をこの出力先へ切り替える（録音開始と同じキーでも録音を始めない）。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    per_env: 'Windows: 既定値のとおり。Linux: paste_and_send: <cmd>+<alt>+d / paste_only: <cmd>+<alt>+v / copy_only: <cmd>+<alt>+c（config/defaults.yaml の os_overrides）'
  - key: outputs[].enter_delay_sec
    title: 貼り付けてから送信するまでの秒数
    file: settings.yaml
    type: float（秒）
    default: '0.5'
    description: paste_and_send だけが持つ。貼り付けてから Enter を送信するまで待つ秒数。ブラウザ添付種類の、Enter まで送信するプリセットでも使う。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/features/outputs/paste_and_send/settings.py
    allowed: '>= 0'
  - key: outputs[].open_delay_sec
    title: AI チャットを開いてから貼り付けるまでの秒数
    file: settings.yaml
    type: float（秒）
    default: '3.0'
    description: ai_chat だけが持つ。読み込むときに `preset_options.browser.open_delay_sec` へ読み替え、保存では書かない。
    reload: immediate
    status: deprecated
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 0'
  - key: outputs[].targets[].name
    title: AI チャットの送信先の名前
    file: settings.yaml
    type: string
    default: '（1: ChatGPT / 2: Google AI / 3: Claude）'
    description: ai_chat だけが持つ。読み込むときにブラウザ添付種類のプリセットの `presets[].title` へ読み替え、保存では書かない。
    reload: immediate
    status: deprecated
    implementation: src/voice_paste/shared/settings.py
    allowed: 1 文字以上
  - key: outputs[].targets[].url
    title: AI チャットの送信先の URL
    file: settings.yaml
    type: string（URL）
    default: '（1: https://chatgpt.com / 2: https://gemini.google.com/app / 3: https://claude.ai/new）'
    description: ai_chat だけが持つ。読み込むときにブラウザ添付種類のプリセットの `presets[].url` へ読み替え、保存では書かない。
    reload: immediate
    status: deprecated
    implementation: src/voice_paste/shared/settings.py
    allowed: http か https
  - key: outputs[].targets[].hotkey
    title: AI チャットの送信先へ送信するホットキー
    file: settings.yaml
    type: string（pynput の GlobalHotKeys 形式）
    default: <ctrl>+<alt>+{n}
    description: ai_chat だけが持つ。読み込むときにブラウザ添付種類のプリセットの `presets[].hotkey` へ読み替え、保存では書かない。
    reload: immediate
    status: deprecated
    implementation: src/voice_paste/shared/settings.py
  - key: outputs[].targets[].enabled
    title: AI チャットの送信先を出すか
    file: settings.yaml
    type: bool
    default: 'true'
    description: ai_chat だけが持つ。読み込むときにブラウザ添付種類のプリセットの `presets[].enabled` へ読み替え、保存では書かない。
    reload: immediate
    status: deprecated
    implementation: src/voice_paste/shared/settings.py
  - key: history.enabled
    title: 履歴に残すか
    file: settings.yaml
    type: bool
    default: 'true'
    description: 録音の WAV と起こした文字を履歴に残すか。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: history.retention_days
    title: 履歴を残す日数
    file: settings.yaml
    type: int（日）
    default: '1'
    description: この日数より前の日付の履歴を、起動時と常駐中に消す。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 1'
  - key: logging.level
    title: ログに書くレベル
    file: settings.yaml
    type: "'DEBUG' | 'INFO' | 'WARNING' | 'ERROR'"
    default: INFO
    description: ログに書くレベル。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: logging.retention_days
    title: ログを残す日数
    file: settings.yaml
    type: int（日）
    default: '7'
    description: この日数より前の日付のログを、起動時と常駐中に消す。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '>= 1'
  - key: ui.topmost
    title: 画面を最前面に表示するか
    file: settings.yaml
    type: bool
    default: 'true'
    description: 録音の画面と文字起こし中の表示を最前面に出すか。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: ui.position
    title: 画面を表示する位置
    file: settings.yaml
    type: "'center' | 'top-left' | 'top-right' | 'bottom-left' | 'bottom-right'"
    default: center
    description: 録音の画面と文字起こし中の表示を出す位置。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: ui.follow_cursor
    title: カーソルのあるモニターに画面を表示するか
    file: settings.yaml
    type: bool
    default: 'true'
    description: '`true` のとき、マウスカーソルのあるモニターに画面を出す。'
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: ui.wave_gain
    title: 録音の画面の波形の感度
    file: settings.yaml
    type: float
    default: '4'
    description: 波形の振れの大きさ。大きいほど小さい声でも大きく振れる。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: '> 0'
  - key: glossary_path
    title: 用語集の CSV の場所
    file: settings.yaml
    type: string（パス）
    default: （無し。settings.yaml と同じフォルダの yogo.csv）
    description: 用語集の CSV の場所。`glossaries` が空のときだけ読み、この CSV を 1 つ目の用語集として扱う（名前は CSV のファイル名から拡張子を除いたもの）。キーが無いときは settings.yaml と同じフォルダの `yogo.csv` を使う。設定画面で保存すると `glossaries` へ書き、このキーは消す。
    reload: immediate
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: api.port
    title: API を待ち受けるポート
    file: settings.yaml
    type: int
    default: '47823'
    description: 127.0.0.1 で待ち受けるポート。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
    allowed: 1024〜65535
  - key: api.allowed_callback_hosts
    title: 返送を許すホスト
    file: settings.yaml
    type: list[string]
    default: '[]'
    description: loopback のほかに、起こした文字の返送を許すホスト。
    reload: restart
    status: implemented
    implementation: src/voice_paste/shared/settings.py
  - key: presets[].kind
    title: カスタムプリセットの種類
    file: settings.yaml
