  - name: ヒントのプリセットを足すボタン
    id: hint_preset_add
    kind: button
    position: 窓 > 右 > 表記のヒント > ヒントのプリセットの一覧の下
    description: 名前と語が空で有効のプリセットを一覧の末尾に足し、名前の欄へフォーカスを移す
    label: プリセットを足す
    visible_when: 表記のヒントのまとまりを選んだとき
    action: ヒントのプリセットの一覧に 1 件足す
    reason: 足して語を入れただけで効くように、有効で足す（確認ログ）
    status: implemented
  - name: 表記のヒントの補足
    id: hint_notes
