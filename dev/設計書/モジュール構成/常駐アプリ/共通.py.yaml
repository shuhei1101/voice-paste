    introduced:
      pr: 173
  - name: detect_os
    title: OS の判定
    kind: 関数
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS の判定
    summary: sys.platform の値から OsKind を返す
    scope: public
    args:
      - name: platform
        title: プラットフォーム
        type: str
        required: false
        default: sys.platform
        passing: positional
        description: 判定する sys.platform の値
    returns:
      type: OsKind
      description: 動いている OS
    process: |-
      1. platform が `win32` か
         - そうである場合、OsKind.WINDOWS を返す
         - それ以外の場合、OsKind.LINUX を返す
    unit_tests:
      - name: test_detect_os_when_windows
        case: 正常
        summary: win32 は Windows
        condition: platform="win32"
        mock: なし
        expected: OsKind.WINDOWS
      - name: test_detect_os_when_linux
        case: 正常
        summary: linux は Linux
        condition: platform="linux"
        mock: なし
        expected: OsKind.LINUX
    status: planned
  - name: os_default
    title: OS ごとの既定値
    kind: 関数
    container: shared/settings.py
    usecase: 設定を変える
    role: 設定のモデル
    summary: 設定のキーの既定値を、OS_DEFAULT_OVERRIDES にその OS の上書きがあればその値、無ければ共通の既定値で返す
    description: 設定のモデルの項目の既定値（_item の default）に使う。スキーマ（項目・型・範囲）は OS で変えない。
    scope: public
    args:
      - name: key
        title: 設定のキー
        type: str
        required: true
        passing: positional
        description: ドットで結んだ設定のキー（例 `recording.lower_volume`）
      - name: common
        title: 共通の既定値
        type: T
        required: true
        passing: positional
        description: どの OS でも使う既定値
      - name: os_kind
        title: OS
        type: OsKind
        required: false
        default: CURRENT_OS
        passing: keyword
        description: 既定値を引く OS
    returns:
      type: T
      description: その OS の既定値
    process: 1. OS_DEFAULT_OVERRIDES[os_kind] に key があればその値、無ければ common を返す
    unit_tests:
      - name: test_os_default_when_linux
        case: 正常
        summary: Linux の上書きがあるキーは上書きの値
        condition: key="recording.lower_volume"・common=True・os_kind=OsKind.LINUX
        mock: なし
        expected: 'False'
      - name: test_os_default_when_windows
        case: 正常
        summary: Windows は共通の既定値
        condition: key="transcription.local_whisper.device"・common="cuda"・os_kind=OsKind.WINDOWS
        mock: なし
        expected: '"cuda"'
      - name: test_os_default_when_not_overridden
        case: 正常
        summary: 上書きの無いキーは共通の既定値
        condition: key="recording.hide_window"・common=False・os_kind=OsKind.LINUX
        mock: なし
        expected: False（common のまま）
      - name: test_os_default_when_settings_model_linux
        case: 正常
        summary: Linux で組み立てた設定のモデルの既定値は、OS_DEFAULT_OVERRIDES[OsKind.LINUX] の全ての値になる
        condition: 子プロセス（`sys.executable -c`）で、voice_paste.shared.os_kind を先に import して CURRENT_OS を OsKind.LINUX に置き換えてから voice_paste.main を import し、引数なしで組み立てた SETTINGS_MODEL() の model_dump と OS_DEFAULT_OVERRIDES[OsKind.LINUX] を JSON で標準出力に出させる。テストのプロセスのモジュールは読み直さない（import のときに CURRENT_OS を読むのは os_default だけで、Windows でも走る）
        mock: なし
        expected: 子プロセスが 0 で終わる。OS_DEFAULT_OVERRIDES[OsKind.LINUX] のキーの集まりがテストに書いた 9 つのキーと等しく、model_dump のそれぞれのキーの値がテストに書いた固定の値と等しい（recording.lower_volume = False・transcription.local_whisper.device = "cpu"・transcription.local_whisper.compute_type = "int8"・hotkeys.start = "<cmd>+<alt>+d"・hotkeys.pause = "<cmd>+<alt>+z"・hotkeys.cancel = "<cmd>+<alt>+q"・outputs.paste_and_send.hotkey = "<cmd>+<alt>+d"・outputs.paste_only.hotkey = "<cmd>+<alt>+v"・outputs.copy_only.hotkey = "<cmd>+<alt>+c"）。`outputs.{出力先の ID}.{項目}` のキーは、outputs の id が一致する項目で引く（引けないキーがあれば fail）
    status: removed
  - name: detect_display_session
    title: デスクトップのセッションの判定
    kind: 関数
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS の判定
    summary: 環境変数 `XDG_SESSION_TYPE` から DisplaySession を返す
    scope: public
    args:
      - name: environ
        title: 環境変数
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数（main が os.environ を渡す）
    returns:
      type: DisplaySession
      description: デスクトップのセッションの種類
    process: |-
      1. environ の `XDG_SESSION_TYPE` が `wayland` か
         - そうである場合、DisplaySession.WAYLAND を返す
         - それ以外の場合（無いときを含む）、DisplaySession.X11 を返す
    unit_tests:
      - name: test_detect_display_session_when_wayland
        case: 正常
        summary: wayland は Wayland のセッション
        condition: 'environ={"XDG_SESSION_TYPE": "wayland"}'
        mock: なし
        expected: DisplaySession.WAYLAND
      - name: test_detect_display_session_when_x11
        case: 正常
        summary: x11 は Xorg のセッション
        condition: 'environ={"XDG_SESSION_TYPE": "x11"}'
        mock: なし
        expected: DisplaySession.X11
      - name: test_detect_display_session_when_missing
        case: 正常
        summary: 無ければ Xorg のセッション
        condition: environ={}
        mock: なし
        expected: DisplaySession.X11
    status: planned
  - name: unavailable_features
    title: 使えない機能の取得
    kind: 関数
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS ごとの機能
    summary: その OS で使えない機能を OS_UNAVAILABLE_FEATURES から返す
    scope: public
    args:
      - name: os_kind
        title: OS
        type: OsKind
        required: true
        passing: positional
        description: 動いている OS（main は CURRENT_OS を渡す）
    returns:
      type: frozenset[Feature]
      description: 使えない機能（無ければ空）
    process: 1. OS_UNAVAILABLE_FEATURES に os_kind があればその集合、無ければ空の集合を返す
    unit_tests:
      - name: test_unavailable_features_when_linux
        case: 正常
        summary: Linux は音量と外の端末のブラウザの機能を使えない
        condition: os_kind=OsKind.LINUX
        mock: なし
        expected: frozenset({Feature.LOWER_VOLUME, Feature.WEB_TRANSCRIPTION})
      - name: test_unavailable_features_when_windows
        case: 正常
        summary: Windows は全ての機能を使える
        condition: os_kind=OsKind.WINDOWS
        mock: なし
        expected: 空の frozenset
    status: planned
  - name: hidden_setting_keys
    title: 出さない設定のキーの導出
    kind: 関数
    container: shared/os_kind.py
    usecase: 設定を変える
    role: OS ごとの機能
    summary: 使えない機能の設定のキーを FEATURE_SETTING_KEYS から集めて返す（設定画面で出さない欄）
    scope: public
    args:
      - name: features
        title: 使えない機能
        type: Iterable[Feature]
        required: true
        passing: positional
        description: 使えない機能（unavailable_features の戻り値）
    returns:
      type: frozenset[str]
      description: 出さない設定のキー
    process: 1. features の各機能の FEATURE_SETTING_KEYS の集合をつないだ集合を返す（FEATURE_SETTING_KEYS に無い機能は空として扱う）
    unit_tests:
      - name: test_hidden_setting_keys
        case: 正常
        summary: 使えない機能の設定のキーを集める
        condition: features=unavailable_features(OsKind.LINUX)
        mock: なし
        expected: frozenset({"recording.lower_volume", "recording.volume_percent", "recording.fade_sec", "api.allowed_web_origins"})
      - name: test_hidden_setting_keys_when_empty
        case: 正常
        summary: 使えない機能が無ければ空
        condition: features=frozenset()
        mock: なし
        expected: 空の frozenset
      - name: test_hidden_setting_keys_when_keys_exist
        case: 正常
        summary: 表の設定のキーは全て設定のモデルにある
        condition: FEATURE_SETTING_KEYS の全てのキーを、Settings() の既定の値からドットで辿る
        mock: なし
        expected: 全てのキーを辿れる（辿れないキーがあれば fail）
    status: planned
constants:
  - name: APP_NAME
    title: アプリ名
    container: shared/constants.py
    usecase: 共通
    summary: 置き場所のフォルダ名に使うアプリの名前
    value: '"voice-paste"'
    status: implemented
  - name: HINT_MAX_BYTES
    title: 表記のヒントの長さの上限
    container: shared/settings.py
    usecase: 設定を変える
    summary: 有効なプリセットの語をつないだ手がかりの UTF-8 のバイト数の上限。faster-whisper が hotwords を先頭の 223 トークンに切ることから、頭に追加する空白の 1 バイトを引いた値（導き方は PR の要件と外部ライブラリ『faster-whisper』）
    value: '222'
    status: implemented
  - name: DEFAULT_EDGE_PHRASES
    title: 既定の文頭・文末から削除する文言
    container: shared/settings.py
    usecase: 録音を文字に起こす
    summary: '`edge_phrases` のキーが無いときに使う一覧（出所は外部ライブラリ『faster-whisper』の不具合「話していない定型句が文末に入る」）'
    value: (EdgePhraseSettings(text="チャンネル登録*"), EdgePhraseSettings(text="ご視聴ありがとうございました"), EdgePhraseSettings(text="ありがとうございました"))（位置は全て end）
    status: removed
  - name: EDGE_PHRASE_WILDCARD_ONLY_ERROR_TYPE
    title: '`*` だけの文言の失敗の種類'
    container: shared/settings.py
    usecase: 設定を変える
    summary: 文言が `*` だけのときの PydanticCustomError の type。設定画面の to_field_message がエラーの文に変える
    value: '"edge_phrase_wildcard_only"'
    status: implemented
  - name: EDGE_PHRASE_WILDCARD
    title: 文言の任意の文字列を表す文字
    container: shared/settings.py
    usecase: 録音を文字に起こす
    summary: 文頭・文末から削除する文言で、0 文字以上の任意の文字列を表す文字（EdgePhraseSettings の確かめと strip_edge_phrases が使う）
    value: '"*"'
    status: implemented
  - name: EDGE_PHRASES_FIELD_NAME
    title: 文頭・文末から削除する文言の一覧のキー
    container: shared/settings.py
    usecase: 設定を変える
    summary: 設定のキー `edge_phrases`。設定画面がまとまりの欄と失敗の場所を引くのに使う
    value: '"edge_phrases"'
    status: implemented
  - name: GLOSSARY_PRESET_NAME_OVERLAP_ERROR_TYPE
    title: 用語集のプリセットの名前の重なりのエラーの種類
    container: shared/settings.py
    usecase: 設定を変える
    summary: 用語集のプリセットの名前の重なりで Settings の確かめが出す `PydanticCustomError` の type。設定画面がエラーの文言を引くのに使う
    value: '"glossary_preset_name_overlap"'
    status: planned
    introduced:
      pr: 173
  - name: GLOSSARY_PRESETS_FIELD_NAME
    title: 用語集のプリセットの一覧のキー
    container: shared/settings.py
    usecase: 設定を変える
    summary: 設定のキー `glossary_presets`。設定画面が収集の値と失敗の場所を引くのに使う
    value: '"glossary_presets"'
    status: planned
    introduced:
      pr: 173
  - name: CURRENT_OS
    title: 動いている OS
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS の判定
    summary: 読み込んだときに detect_os で決めた、動いている OS。OS を見る処理は sys.platform を直に読まず、これを読むか main.py の配線で渡される
    value: detect_os()
    status: planned
  - name: OS_DEFAULT_OVERRIDES
    title: OS ごとの既定値の上書き
    container: shared/settings.py
    usecase: 設定を変える
    role: 設定のモデル
    summary: 共通の既定値に重ねる、OS ごとの既定値。キーは設定のドットで結んだキー。載っていない OS・キーは共通の既定値のまま
    entries:
      - key: linux / recording.lower_volume
        value: 'False'
        description: Linux では音量を変えない
      - key: linux / transcription.local_whisper.device
        value: '"cpu"'
        description: Linux では CUDA のライブラリを読ませる手当てが無く、cuda では文字起こしワーカーが起動に失敗する
      - key: linux / transcription.local_whisper.compute_type
        value: '"int8"'
        description: CPU で動く精度
      - key: linux / hotkeys.start
        value: '"<cmd>+<alt>+d"'
        description: Ubuntu は `<Primary><Alt>d` を「デスクトップを表示」に割り当てており、Ctrl+Alt+D では貼り付け先のウィンドウが隠れる。Linux の既定のホットキーは修飾キーを Super+Alt にそろえる
      - key: linux / hotkeys.pause
        value: '"<cmd>+<alt>+z"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / hotkeys.cancel
        value: '"<cmd>+<alt>+q"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / outputs.paste_and_send.hotkey
        value: '"<cmd>+<alt>+d"'
        description: hotkeys.start と同じキー。出力先のキーは `outputs.{出力先の ID}.{項目}`
      - key: linux / outputs.paste_only.hotkey
        value: '"<cmd>+<alt>+v"'
        description: hotkeys.start と同じく Super+Alt にそろえる
      - key: linux / outputs.copy_only.hotkey
        value: '"<cmd>+<alt>+c"'
        description: hotkeys.start と同じく Super+Alt にそろえる
    description: 型は `Mapping[OsKind, Mapping[str, object]]`。
    status: removed
  - name: DEFAULTS_OS_OVERRIDES_KEY
    title: 既定値の OS ごとの上書きのキー
    container: shared/settings.py
    usecase: 常駐アプリを起動する
    role: 設定のモデル
    summary: config/defaults.yaml の中で、OS ごとの既定値の上書きを持つ一番上のキー。中は OsKind の値（windows・linux）→ 設定と同じ構造の上書き
    value: '"os_overrides"'
    description: 上書きは共通の既定値に表はキーごと、一覧は丸ごとで重ねる（outputs の一覧は、出力先のホットキーを変える OS で一覧ごと持つ）。
    status: planned
  - name: REPO_ROOT
    title: リポジトリの直下
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 置き場所
    summary: config/defaults.yaml と settings.local.yaml を引く、リポジトリの直下のフォルダ
    value: Path(__file__).resolve().parents[3]
    status: planned
  - name: DEFAULTS_FILE_NAME
    title: 既定値のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 置き場所
    summary: リポジトリの直下の config フォルダに置く既定値のファイル
    value: '"defaults.yaml"'
    status: planned
  - name: SETTINGS_FILE_NAME
    title: 環境の値のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 置き場所
    summary: 設定のフォルダ（data_dir）に置く環境の値のファイル
    value: '"settings.yaml"'
    status: planned
  - name: LOCAL_SETTINGS_FILE_NAME
    title: checkout の上書きのファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 置き場所
    summary: リポジトリの直下に置く checkout の上書きのファイル（git の管理から外す）
    value: '"settings.local.yaml"'
    status: planned
  - name: LEGACY_SETTINGS_FILE_NAME
    title: 前のバージョンの設定のファイルの名前
    container: shared/constants.py
    usecase: 常駐アプリを起動する
    role: 置き場所
    summary: settings.yaml が無いときに移す元のファイル
    value: '"settings.toml"'
    status: planned
  - name: OS_UNAVAILABLE_FEATURES
    title: OS ごとに使えない機能
    container: shared/os_kind.py
    usecase: 常駐アプリを起動する
    role: OS ごとの機能
    summary: その OS では使えない機能。載っていない OS は全ての機能を使える。OS で機能を止めるのはこの表だけで決める
    entries:
      - key: linux
        value: frozenset({Feature.LOWER_VOLUME, Feature.WEB_TRANSCRIPTION})
        description: Linux では音量を変えず、外の端末のブラウザの機能を持たない
    description: 型は `Mapping[OsKind, frozenset[Feature]]`。macOS などの OS は、OsKind と表の行の追加で足す。
    status: planned
  - name: FEATURE_SETTING_KEYS
    title: 機能ごとの設定のキー
    container: shared/os_kind.py
    usecase: 設定を変える
    role: OS ごとの機能
    summary: 機能だけが使う設定のキー。その機能を使えない OS では、設定画面にこれらの欄を出さない
    entries:
      - key: lower_volume
        value: frozenset({"recording.lower_volume", "recording.volume_percent", "recording.fade_sec"})
        description: 録音中の音量
      - key: web_transcription
        value: frozenset({"api.allowed_web_origins"})
        description: 外の端末のブラウザに許す Origin
    description: 型は `Mapping[Feature, frozenset[str]]`。キーは設定のドットで結んだキー。
    refs:
      - dev/設計書/画面設計/常駐アプリ/設定画面.py#elements[設定の欄]
    status: planned
  - name: WEB_ORIGIN_FORM_ERROR_TYPE
    title: 形式の違う Origin の失敗の種類
    container: shared/settings.py
    usecase: 設定を変える
    summary: api.allowed_web_origins に `scheme://host[:port]` の形式でない行があるときの PydanticCustomError の type。設定画面の to_field_message がエラーの文に変える
    value: '"web_origin_form"'
    status: planned
    introduced:
      pr: 226
test_files:
  - tests/unit/voice_paste/shared/test_settings.py
  - tests/unit/voice_paste/shared/test_logger.py
  - tests/unit/voice_paste/shared/test_constants.py
  - tests/unit/voice_paste/shared/test_os_kind.py
function_types:
  - name: ProgressFn
    title: 文字起こしの進みの知らせ先
    container: shared/types.py
    usecase: 共通
    summary: 文字起こしの区間の終わりの時刻と録音の長さ（秒）を受け取る。features/transcription と integrations/whisper が使う（integrations は features を import できないため shared に置く）
    args:
      - name: end
        type: float
        description: 区間の終わりの時刻（秒）
      - name: duration
        type: float
        description: 録音の長さ（秒）
    returns:
      type: None
      description: なし
    status: implemented
  - name: OnSegmentFn
    title: 区間の受け取り先
    container: shared/types.py
    usecase: 録音する
    summary: 区切った区間を区切った順に受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、セッションが渡す（feature の間を渡るため shared に置く）
    args:
      - name: segment
        type: Segment
        description: 区切った区間
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: OnContinuousFailedFn
    title: 連続録音の失敗の知らせ先
    container: shared/types.py
    usecase: 録音する
    summary: 区切りに失敗して連続録音を止めたことを、理由を添えて受け取る。録音の区切りのスレッドから呼ばれる。録音が呼び、セッションが渡す
    args:
      - name: reason
        type: str
        description: 失敗の理由
    returns:
      type: None
      description: なし
    status: planned
    introduced:
      pr: 78
  - name: SendEnterFn
    title: Enter の送信方法
    container: shared/types.py
    usecase: 起こした文字を届ける
    summary: 渡した修飾キーを押したまま Enter を送信する（`Protocol`。修飾キーを省いて呼べるため、`Callable[[], None]` を受ける側にも渡せる）。integrations/keyboard が満たし、出力先が受ける
    args:
      - name: modifiers
        type: Sequence[EnterModifier]
        description: 一緒に押す修飾キー。既定は空（Enter だけ）
    returns:
      type: None
      description: なし
    implementations:
      - target: send_enter
        notes: pynput で送信する（外部連携。Windows と Xorg のセッション）
      - target: UInputKeyboard.send_enter
        notes: python-evdev の UInput の仮想キーボードで送信する（外部連携。Wayland のセッション）
    status: planned
