title: "テスト実行方法"
layers:
  - name: 単体テスト（バック）
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/transcription tests/unit
      ```
    description: pytest で実行する。`tests/transcription` は voice_paste_legacy（faster-whisper のモデルは Mock）、`tests/unit` は新しい構成（`src/voice_paste/` をミラーした並び）の単体テスト。
    prerequisites:
      - 外部依存なし（GPU も録音も要らない）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {単体テストファイルパス}
        ```
  - name: 結合テスト（バック）
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/integration
      ```
    description: pytest で実行する。`tests/integration/` の下に、インターフェース定義ごとのファイルを置き、`tests/integration/ui/` の下に画面設計ごとのファイルを置く。
    prerequisites:
      - 外部依存なし（GPU も実機のマイクも要らない）
      - マイク・システム音量・文字起こしのエンジンは Mock に差し替え、履歴は一時フォルダに書く
      - 画面のテスト（`tests/integration/ui/`）は offscreen（`QT_QPA_PLATFORM=offscreen`。`tests/conftest.py` が設定する）の QApplication で開き、操作は QtTest で行う。実機の画面・トレイ・ホットキーは使わず、UiDeps の関数は Mock で受ける
      - 返送先は 127.0.0.1 で待ち受けるテスト用の受け口で、テストが立てる
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {結合テストファイルパス}
        ```
  - name: E2E テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/e2e --run-e2e
      ```
    description: pytest で実行する。`tests/e2e/` の下に、シナリオごとのファイルを置く（複合ユースケースは `tests/e2e/複合ユースケース/test_transcribe_from_other_system.py`）。
    prerequisites:
      - Windows の実機とマイクが要る（Mock なし。録音は実機のマイクで取る）
      - ローカルの Whisper（GPU）で起こす。NVIDIA GPU が要り、CUDA の DLL は venv の `Lib/site-packages/nvidia/` から読む
      - 返送先は 127.0.0.1 で待ち受けるテスト用の受け口で、テストが立てて返送を受ける
      - 実行中はマイクで録音する。誤実行を防ぐため `--run-e2e` を必須にする（付けなければ全て skip する）
      - 画面・トレイ・ホットキーの E2E（`tests/e2e/単一ユースケース/` と `tests/e2e/複合ユースケース/test_paste_voice_text.py`）は、実機の Windows のデスクトップにサインインし、画面がロックされていない状態で流す。`python -m voice_paste --data-dir {一時フォルダ}` で常駐アプリを起動し、画面・トレイ・メニュー・通知は UI Automation で、トレイのアイコンの右クリックとメニューの選択だけマウスで操作する。実行中はキーボードとマウスを触らない
      - 画面・トレイ・ホットキーの E2E は、普段使いの voice-paste（`voice_paste_legacy` を含む）のトレイのアイコンが出ていると、同じ実行ファイルのアイコンが 1 つのボタンにまとまってこの常駐アプリのメニューを開けないため、終了してから流す（出ていれば skip する）
      - 録音開始のホットキーを押す行は、物理のキー入力を作れる外部コマンドを環境変数 `VOICE_PASTE_E2E_HOTKEY_DRIVER`（`{hotkey}` に pynput の書式のホットキーを入れて実行する）で指定したときだけ走る。合成したキー（SendInput）は pynput の GlobalHotKeys が無視するため、指定が無ければ理由を出して skip し、録音はトレイのメニューから始める行だけが走る
      - 貼り付け先は、テストが別プロセスで出す入力欄（`tests/support/paste_target.py`）で、起こした文字と Enter の回数をファイルへ書き出す。普段使いのアプリへは貼り付けない
      - 録音の画面が「常に手前に表示」でないほかの窓の上に残ること（#4）は、貼り付け先を前面に出して録音の画面との前後で確かめる
      - 複数のモニターでの録音の画面の表示位置は、モニターが 2 枚以上つながっているときだけ流す（1 枚なら枚数を出して skip する）。拡大率の違うモニターでの表示位置は、拡大率の違うモニターをつないだ環境で流して確かめる
      - マイクを開けない行は、録音の入力の音声デバイスを外し、環境変数 `VOICE_PASTE_E2E_NO_MICROPHONE=1` を指定したときだけ走る（無ければ理由を出して skip する）
      - 通知センターに残った通知を押してログフォルダが開く行と、設定画面で欄を変えたままトレイの「終了」・Ctrl+Break で終える行は、実機の Windows の通知センター・エクスプローラー・設定画面で確かめる
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {E2Eテストファイルパス} --run-e2e
        ```
  - name: 非機能要件テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/nfr --run-e2e
      ```
    description: pytest で実行する。録音・用語集・設定・期待値は git 管理外の `tests/nfr/fixtures/` から読み、今のローカルの Whisper（GPU）で起こす。
    prerequisites:
      - Windows と NVIDIA GPU が要る（無い環境では文字起こしのテストを skip する。CUDA の DLL は venv の `Lib/site-packages/nvidia/` から読む）
      - '`tests/nfr/fixtures/` に録音・用語集・設定・期待値が要る（無ければ skip する）'
      - API の開始・処理中・セッションの上限時間のテスト（`tests/nfr/test_api_start_response_time.py`・`test_busy_response_time.py`・`test_api_session_limit.py`）は実機のマイクで録音し、システム音量を一時的に下げる。誤実行を防ぐため `--run-e2e` を付けたときだけ走る（付けなければ skip する）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {非機能要件テストファイルパス} --run-e2e
        ```
  - name: 外部疎通テスト
    run_all: |-
      ```bash
      venv/Scripts/python.exe -m pytest tests/external --run-external
      ```
    description: pytest で実行する。`tests/external/` のテストは `--run-external` を付けたときだけ走り、付けなければ全て skip する。
    prerequisites:
      - 接続先の外部サービスの認証情報（API キーなど）を環境変数で渡す（無ければそのテストは skip する）
      - 従量課金のかかる外部サービスは、実行のたびに課金がかかる
      - 音量の契約テスト（`tests/external/voice_paste/integrations/volume/`）は Windows の実機の既定の再生デバイスが要る（無ければ skip する）。実行中はシステム音量が変わり、終わりに実行前の音量へ戻す
      - AI はユーザーが実行を許可したときだけ実行する（CI では実行しない）
    run_one:
      label: ファイル
      command: |-
        ```bash
        venv/Scripts/python.exe -m pytest {外部疎通テストファイルパス} --run-external
        ```
  - name: lint
    description: import-linter で pyproject.toml の `[tool.importlinter]` の契約（層・feature の独立・出力先の独立）を検査する。単体テストと一緒に回す。
    prerequisites:
      - 外部依存なし
    run_all: |-
      ```bash
      venv/Scripts/lint-imports
      ```
    results: 契約ごとの KEPT / BROKEN と、破った import の行を標準出力に出す（破れていれば終了コード 1）
prerequisites:
  - Windows の Python 3.11 以上の venv（`venv/Scripts/python.exe`）に `pip install -e . --group dev` を済ませる（pip 25.1 以上。pytest と import-linter は pyproject.toml の `[dependency-groups]` の dev から入る）
