id: MOD-95
title: 文字起こしワーカー / ワーカー / worker.py
test_files:
  - tests/unit/voice_paste/integrations/whisper/test_worker.py
functions:
  - name: run_worker
    title: ワーカーの本体
    kind: 関数
    container: integrations/whisper/worker.py
    usecase: 録音を文字に起こす
    scope: public
    summary: config を受けてモデルを読み、ready を返してから transcribe を 1 件ずつ処理する。標準入力が閉じたら終わる
    args:
      - name: stdin
        type: TextIO
        required: true
        passing: positional
        description: 常駐サービスからの入力
      - name: stdout
        type: TextIO
        required: true
        passing: positional
        description: 常駐サービスへの出力
      - name: load_model
        type: Callable[[dict], WhisperModel]
        required: true
        passing: injected
        description: faster-whisper のモデルを読む（テストで差し替える）
    returns:
      type: int
      description: 終了コード
    process: |-
      1. config を読み、log_dir の `worker_crash.log` へ faulthandler を向けてからモデルを読む
         - 最初の行が config でない・モデルを読めない場合、error を書いて 1 を返す
      2. ready を書く
      3. transcribe を読むたびに、faster-whisper を刷新前と同じ引数（VAD がオフなら vad_parameters は渡さない）と hotwords（payload に無ければ None）で呼び、区間ごとに progress、最後に result を書く。prefix は渡さない（渡すと hotwords が効かない）
         - 例外・JSON として読めない行・知らない種類の場合、error を書いて次の行を待つ（CUDA のクラッシュはプロセスごと落ち、常駐側が立て直す）
         - ログは標準エラーへ書き、標準出力にはメッセージだけを書く
      4. 標準入力が閉じたら 0 を返す
    unit_tests:
      - name: test_run_worker
        case: 正常
        summary: ready の後に進みと結果を返す
        condition: config・transcribe を 1 行ずつ入れて標準入力を閉じる。モデルは 2 区間を返す
        mock: load_model
        expected: 出力が ready・progress × 2・result の順で、終了コードが 0
      - name: test_run_worker_when_model_load_failed
        case: 正常
        summary: モデルを読めなければ error で終わる
        condition: load_model が例外を送出する
        mock: load_model
        expected: 出力が error だけで、終了コードが 1
      - name: test_run_worker_when_transcribe_failed
        case: 正常
        summary: 1 件の失敗では終わらず次の行を処理する
        condition: transcribe を 2 行入れ、モデルは 1 件目で例外、2 件目で 1 区間を返す
        mock: load_model
        expected: 出力が ready・error・progress・result の順で、終了コードが 0
      - name: test_run_worker_when_blank_segment
        case: 正常
        summary: 区間の空白を除き、空の区間を result に含めない
        condition: モデルが「 今日は 」・「 」の 2 区間を返す
        mock: load_model
        expected: progress が 2 行、result の segments が ["今日は"]
      - name: test_run_worker_when_vad_disabled
        case: 正常
        summary: VAD がオフなら vad_parameters を渡さない
        condition: vad_filter=false の transcribe を 1 行入れる
        mock: load_model
        expected: モデルの transcribe が vad_filter=False・vad_parameters=None で呼ばれる
      - name: test_run_worker_when_hotwords
        case: 正常
        summary: 手がかりを hotwords に渡す
        condition: hotwords="voice-paste、Whisper" の transcribe を 1 行入れる
        mock: load_model
        expected: モデルの transcribe が hotwords="voice-paste、Whisper" で呼ばれる
      - name: test_run_worker_when_no_hotwords
        case: 正常
        summary: 手がかりが無ければ hotwords を None で渡す
        condition: hotwords のキーを持たない transcribe を 1 行入れる
        mock: load_model
        expected: モデルの transcribe が hotwords=None で呼ばれる
    refs:
      - LIB-8#
    status: implemented
