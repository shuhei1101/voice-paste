  - name: 正常シナリオ（文頭・文末の決まった文言を消す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー・文字起こし。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV（中身は問わない）。文字起こしは、「えーと、ありがとうございました。本日の議題は予算です。\n以上です。ありがとうございました。ご視聴ありがとうございました。チャンネル登録よろしくお願いします。」（`\n` は改行）を返す
      - name: 文頭・文末から削除する文言
        description: 一覧に上から「チャンネル登録*」（文末）・「ご視聴ありがとうございました」（文末）・「ありがとうございました」（文末）・「えーと」（文頭）の行がある
        notes: 反映は `immediate`
      - name: 入口
        description: ホットキーから始めた録音を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant ST as 設定
        participant LOG as ログ

        Note over SVC: 文字起こしの結果を受け取るまでは 正常シナリオ と同じ
        SVC->>ST: 文頭・文末から削除する文言の一覧を読む
        loop 一覧の行を上から順に
          SVC->>SVC: 行の位置が文頭なら 1 行目の先頭、文末なら最後の行の末尾に文言が一致する間、一致した文言とその後ろに続く句読点・空白を消す
        end
        SVC->>LOG: 消した文字を位置（文頭・文末）つきで書く
        Note over SVC: 用語集での補正から後は 正常シナリオ と同じ
      ```
    expected:
      - 最後の行が「以上です。」になっている（「チャンネル登録よろしくお願いします。」「ご視聴ありがとうございました。」「ありがとうございました。」が一覧の順に消え、「ご視聴」が残っていない）
      - 1 行目の先頭の「えーと、」が消え、続く「ありがとうございました。」は残っている（位置が文末の行は文頭に当てない）
      - ログに、消した文字が位置つきで出ている
      - 起こした文字を届ける へ進む
    test: test_normal_when_edge_phrases_removed
    notes:
      一致の書き方: 文言は書いた文字との完全な一致で、`*` は 0 文字以上の任意の文字列として扱う。`*` は改行をまたがない。文言の末尾の `*` は行の末尾まで、先頭の `*` は行の先頭から一致させる（文頭の「字幕*」は 1 行目を「字幕」から行末まで消す）。途中の `*` は、消す文字が最も短い一致を使う。
      文頭・文末の単位: 起こした文字は区間ごとの文字を改行でつないだもので、文頭は 1 行目の先頭、文末は最後の行の末尾とする。消して最後の行（1 行目）が空になったら、その行を除いて前（次）の行を最後の行（1 行目）として続ける。連続録音は区間の文字ごとに当てる。
      消した結果が空: 起こした文字が全て消えたときは、異常シナリオ（文字起こしの結果が空）と同じに扱う（API から始めた録音は空の文字を返す）。
