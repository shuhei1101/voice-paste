id: SCR-7
title: "文字起こし中の表示"
elements:
  - name: 窓
    id: transcribing_indicator
    kind: window
    position: 窓
    description: 文字起こし中の表示の窓。録音の画面と同じ設定の位置に出し、フォーカスを取らない（貼り付け先の入力欄からフォーカスを奪わない）。録音の画面を動かした回は、確定した時点の録音の画面の位置（隠したまま確定した回は隠す前の位置）に出す。録音の画面と同じく、面は `color.*.surface`、外側の縁は `color.*.frame` の 1px の線で描く（`*` は `ui.theme` で決まる明暗）。タスクバーに出ない枠なしの窓のまま、見出しの行をつかんで動かす。動かした位置はその回だけ使い、次の回は今までどおりの位置に出す。出力先の切り替えのボタンを出す回は、ボタンが名前を省かずに収まる幅（既定 380px）にする
    visible_when: ホットキー・トレイから始めたセッションが transcribing か delivering の間（`recording.hide_window` がオフのとき）。API から始めた録音では出さない
    source: UiBridge.notified（state_changed）
    refs:
      - CFG-1#settings[recording.hide_window]
      - CFG-1#settings[ui.theme]
  - name: 状態の表示
    id: state_label
    kind: label
    position: 窓 > 見出し
    description: 文字起こし中であることを、回るマーカーと文字で出す
    label: 文字起こし中
    visible_when: 常時
  - name: 進みのバー
    id: progress_bar
    kind: progress
    position: 窓 > 見出しの下
    description: 文字起こしの進みを割合で出す
    label: 文字起こしの進み
    io: 表示
    type: 数値（%）
    visible_when: 最初の区間の終わりが届いてから（それまでは回るマーカーだけを出す）。OpenAI API と Haas は区間ごとの進みを返さないため、設定のエンジンが OpenAI API か Haas のときは出さない
    display_format: 整数の %（例 62%）
    source: 文字起こしの経過（起こし終えた区間の終わり ÷ 録音の長さ）
  - name: 経過と残りの時間
    id: time_label
    kind: label
    position: 窓 > 進みのバーの下
    description: 確定してからの経過と、見積もった残りの時間・全体の時間
    io: 表示
    type: 時間
    visible_when: 常時
    display_format: 「経過 3.2 秒 残り 2 秒 / 5 秒」。1 分以上は「3 分 06 秒」。残りが分かるまでは「経過 1.4 秒 残りを計っています」。設定のエンジン（`transcription.engine`）が OpenAI API か Haas のときは残りを見積もらず、経過だけを出す（「経過 1.4 秒」）
    source: 文字起こしの経過
  - name: 貼り付けの案内
    id: paste_hint
    kind: label
    position: 窓 > 下
    description: 今の出力先で何が起きるかを案内する。貼り付けて送信・貼り付けのみは貼り付けたい場所にカーソルを合わせるよう案内し、コピーのみはクリップボードへコピーすることを案内する。出力先を切り替えると切り替えた先の文に変える
    label: 貼り付けたい場所にカーソルを合わせてください（貼り付けて送信・貼り付けのみ） / 起こした文字をクリップボードにコピーします（コピーのみ）
    visible_when: 固定の出力先で確定した録音のとき。カスタムプリセットで確定した録音では出さない（プリセットはカーソルを合わせた場所へ貼らない）
  - name: 見出しの行
    id: head_row
    kind: drag_handle
    position: 窓 > 見出し
    description: 状態の表示を並べる行。録音の画面の見出しの行と同じく、左端につかむマーカーを置き、行のどこをつかんでも窓をドラッグで動かせる。かざすと行に面が付き、つかむマーカーが濃くなり、カーソルが移動の形になる。動かしている間も文字起こしと経過は止めない。つかんでも窓は前面にならず、貼り付け先のフォーカスは動かない
    visible_when: 常時
    action: ドラッグで窓を動かし、放した位置に置く
    refs:
      - SCR-10#elements[見出しの行]
    status: planned
    introduced:
      pr: 108
  - name: 出力先の見出し
    id: output_heading
    kind: label
    position: 窓 > 出力先
    description: 今の出力先と切り替えの並びの見出し。経過と残りの時間の下に区切りの線を引いて置く
    label: 出力先
    visible_when: 常時
    status: planned
    introduced:
      pr: 108
  - name: 出力先の切り替えのボタン
    id: switch_button_{output_id}
    kind: button
    position: 窓 > 出力先 > 切り替えの並び
    description: 届ける出力先をその出力先へ切り替える。設定でオンの固定の出力先ごとに設定の並びで 1 つずつ、等しい幅で横に並べる。今の出力先のボタンは地と枠を強め、右上の角に丸いマーカー（チェック）を重ねる（色だけで伝えない。マーカーは名前の幅を取らず、選び直しで名前を動かさない）。マーカーは採用したモックのとおり右上の角から外へはみ出して置き、名前とホットキーの文字には重ねない（`ui.transcribing_show_hotkeys` のどちらでも）。録音の画面の出力先の確定のボタンと同じく名前の下にその出力先のホットキーを出し、同じホットキーを押しても切り替わる。今の出力先のボタンを押しても何もしない。押しても窓は前面にならず、貼り付け先のフォーカスは動かない
    label: 貼り付けて送信 / 貼り付けのみ / コピーのみ（名前の下に [outputs[].hotkey]）
    visible_when: 固定の出力先で確定した録音で、その出力先の `outputs[].enabled` がオンのとき
    enabled_when: セッションが transcribing の間。届け始めた後（delivering）は押しても切り替えず、表示も変えない
    options: '`outputs[]` の並び（paste_and_send・paste_only・copy_only）のうちオンのもの'
    source: Session.output_id（今の出力先にマーカーを付ける）
    target: 届ける出力先の差し替え（押したボタンの出力先の ID。入り口はモジュール構成『セッション』）
    action: 今の出力先のマーカーと貼り付けの案内を切り替えた先に変える
    refs:
      - CFG-1#settings[outputs[].enabled]
      - CFG-1#settings[outputs[].hotkey]
      - CFG-1#settings[ui.transcribing_show_hotkeys]
      - SCR-10#elements[出力先の確定のボタン]
    status: planned
    introduced:
      pr: 108
  - name: プリセットの名前
    id: preset_label
    kind: label
    position: 窓 > 出力先
    description: カスタムプリセットで確定した録音で、確定したプリセットのタイトルを出す。切り替えのボタンは出さず、切り替えを受けない
    io: 表示
    type: 文字列
    visible_when: カスタムプリセットで確定した録音のとき
    source: Session.output_preset.title
    refs:
      - CFG-1#settings[presets[].title]
    status: planned
    introduced:
      pr: 108
screen: src/voice_paste/ui/windows/transcribing_indicator.py
mock: dev/mock/pages/transcribing-indicator/108/c-both/
lead: 確定から届けるまで、録音の画面と同じ位置に出る小さな表示。文字起こしの経過と残りの時間、今の出力先を出し、固定の出力先への切り替えを受ける。
refs:
  - SC-9#
notes:
  閉じるとき: 届けた・結果が空のときは閉じてトレイだけに戻る。文字起こしに失敗・届けられないときは閉じてトレイの通知で知らせる
  出力先の切り替え: |-
    切り替えは、切り替えのボタンと、出力先の確定のホットキーのどちらでも受ける。ホットキーはどこにフォーカスがあっても効き、フォーカスを動かさない。
    録音開始と同じホットキーの出力先（既定の貼り付けて送信）は、文字起こし中は録音を始めずに切り替える。
    ホットキーが空の出力先は名前だけのボタンにし、ボタンで切り替える。
    `ui.transcribing_show_hotkeys` がオフのときは、全てのボタンを名前だけで出す（ホットキーでの切り替えはそのまま効く）。録音の画面の `ui.show_hotkeys` にはよらない。
  フォーカス: 窓はフォーカスを受けない窓（`WindowDoesNotAcceptFocus`）のまま出し、切り替えのボタンを押しても見出しの行をつかんでも前面にならない。貼り付けて送信・貼り付けのみは、届けるときのアクティブなウィンドウへ貼る
test_file: tests/integration/ui/test_transcribing_indicator.py
