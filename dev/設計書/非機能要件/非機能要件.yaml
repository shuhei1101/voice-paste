  - name: 文字起こしワーカーの終わりを待つ時間
    english_name: worker_stop_timeout
    category: 保守性
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '2'
    unit: 秒
    rationale: '常駐の終了時に標準入力を閉じてからワーカーが終わるまでと、terminate してから終わるまでを待つ時間。#22 で新しい構成のワーカーを 20 回測り、標準入力を閉じてから終わるまでが中央値 0.26 秒・最大 0.81 秒だった（2026-10-03、Windows 11・RTX 5070）。規約『資源の値の決め方』の下流を待つタイムアウトとして、実測の最大を p99.9 の代わりに置いて余裕 50% を加算した 1.22 秒を切り上げた。`main.py` の WORKER_STOP_TIMEOUT_SEC がこの値を使う'
    measurement: モデルを読み込んだワーカーの標準入力を閉じてからプロセスが終わるまでと、terminate から終わるまでを実機で測る
    overflow: 標準入力を閉じて待ちきれなければ terminate、さらに同じ時間待って終わらなければ kill する
    tests:
      - name: test_worker_stop_timeout
        summary: モデルを読み込んだワーカーが、標準入力を閉じてから決定値以内に終わる
        condition: 固めた設定（`tests/nfr/fixtures/whisper.env` の large-v3・cuda）で WhisperWorkerClient を start しては標準入力を閉じることを 20 回続ける
        measurement: 毎回、標準入力を閉じてからワーカーのプロセスが終わるまでの時間（秒）を測り、生の値と中央値・最大を出す
        expected: 20 回とも terminate せずに終わり、最大が 2 秒以内
        notes: 測った最大から規約『資源の値の決め方』の下流を待つタイムアウトで決定値を再決定する。`tests/nfr/fixtures/` が無い環境・GPU が無い環境では skip する
    test_file: tests/nfr/test_worker_stop_timeout.py
  - name: 前の常駐サービスの終わりを待つ時間
    english_name: single_instance_timeout
    category: 可用性
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '55'
    unit: 秒
    rationale: 'ショートカットから起動したときに前の常駐サービスが動いていれば、終わるよう頼んで名前付きの排他が放されるのを待つ上限。前のプロセスがモデルの読み込み中だと、依頼はイベントループが回るまで処理されないため、内側の待ちはワーカーの立て直しの時間（ready を待つ上限 27 秒）と片付けの待ち（API サーバーの停止 5 秒・ワーカーの終わりを待つ 2 秒 × 2 回・ホットキーの受付の終わりを待つ 0.5 秒）の和 36.5 秒になる。規約『資源の値の決め方』の入れ子の待ちの余裕を加算して整数の秒に切り上げた 55 秒にする。余裕は内側の待ち以外の処理の実測で決めるが、test_single_instance_timeout で測った依頼から確保までの時間は内側の待ち（前のプロセスの読み込みと片付け）を含んでおり、それ以外の処理だけを切り出せないため、既定の内側の合計の 50% を置く。上限を超えると後のプロセスは終わり、前のプロセスもキューの依頼で終わるため、常駐サービスが 0 個になる。#22 の実測（PR #41 の `dev/pr/41/テスト結果/20261003154619_1c1e118_非機能要件テスト.log`、2026-10-03）では、前が待機中なら最大 0.78 秒、前がモデルの読み込み中なら最大 8.10 秒だった（再決定し前の実行の `20261003152550_948b9f5_非機能要件テスト.log` では 0.81 秒・12.64 秒）。文字起こしワーカーの立て直しの時間・終わりを待つ時間を再決定したときは、内訳とこの決定値も再導出する'
    measurement: 実機で常駐サービスが動いている状態から同じ置き場所でもう 1 つ起動し、終わるよう頼んでから単一インスタンスの排他（Windows は名前付きミューテックス、Linux はロックファイルの flock）を取れるまでを測る。決定値は OS で分けない。`--run-e2e` を付けて実行する（Windows 11・NVIDIA GPU）
    overflow: 上限までに排他を取れなければ、新しいプロセスは起動に失敗した理由をログに書いて終わる（前のプロセスを番号で強制終了しない）
    breakdown:
      - part: ワーカーの立て直しの時間
        value: 27 秒
        notes: 前のプロセスがモデルの読み込み中に頼まれたとき、読み込みが終わるまで依頼が処理されない（文字起こしワーカーの立て直しの時間）
      - part: API サーバーの停止を待つ上限
        value: + 5 秒
        notes: server/runner.py の STOP_TIMEOUT_SEC
      - part: ワーカーの終わりを待つ時間
        value: + 4 秒
        notes: 標準入力を閉じてから 2 秒と terminate から 2 秒（文字起こしワーカーの終わりを待つ時間）
      - part: ホットキーの受付の終わりを待つ時間
        value: + 0.5 秒
        notes: 片付けで HotkeyListener.stop が待つ上限（Linux では毎回この上限まで待つ）
      - part: 余裕
        value: + 18.5 秒
        notes: 内側の待ちの合計 36.5 秒の 50%（規約『資源の値の決め方』の既定。合計を整数の秒に切り上げる分を含む）
      - part: 合計
        value: 55 秒
    tests:
      - name: test_single_instance_timeout
        summary: 常駐中に同じ置き場所でもう 1 つ起動すると、前の常駐サービスが終わり、決定値以内に後のプロセスが排他を取る
        condition: 固めた設定（`tests/nfr/fixtures/whisper.env` の large-v3・cuda）で `python -m voice_paste --data-dir {一時フォルダ}` を起動して待機中（トークンのファイルが書かれる）を待ち、同じ `--data-dir` でもう 1 つ起動する。これを 10 回続ける
        measurement: 後のプロセスのログの「前の常駐サービスに終わるよう頼んだ」から「単一インスタンスを確保した」までの時間（秒）を測り、生の値と中央値・最大を出す。前のプロセスが終わったことも確かめる
        expected: 10 回とも前のプロセスが終わって後のプロセスが待機中になり、常駐サービスのプロセスが 1 つだけで、最大が 55 秒以内
        notes: 測った値から余裕を再決定する。`--run-e2e` が無い環境・`tests/nfr/fixtures/` が無い環境では skip する
      - name: test_single_instance_timeout_when_previous_starting
        summary: 前の常駐サービスがモデルの読み込み中でも、決定値以内に入れ替わり、常駐サービスが 0 個にならない
        condition: 固めた設定で `python -m voice_paste --data-dir {一時フォルダ}` を起動し、ログに「単一インスタンスを確保した」が出た直後（トークンのファイルが書かれる前の、モデルの読み込み中）に同じ `--data-dir` でもう 1 つ起動する。これを 5 回続ける
        measurement: 後のプロセスのログの「前の常駐サービスに終わるよう頼んだ」から「単一インスタンスを確保した」までの時間（秒）を測り、生の値と中央値・最大を出す
        expected: 5 回とも後のプロセスが待機中になり、常駐サービスのプロセスが 1 つだけで、最大が 55 秒以内
        notes: '`--run-e2e` が無い環境・`tests/nfr/fixtures/` が無い環境では skip する'
    test_file: tests/nfr/test_single_instance_timeout.py
  - name: エンドポイントへ送信するときのタイムアウト
    english_name: endpoint_timeout
    category: 耐障害
    external_constraint: 利用者が用意するエンドポイントは受け取ってから 1 秒以内に 2xx を返す（呼び出し元へ返すと同じ取り決め）。外のエンドポイント（Webhook 等）には課せない
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/pull/44#discussion_r4173735056
    value: 既定 1.5 秒・設定できる範囲 0.5〜10 秒
    unit: 秒
    rationale: '規約『資源の値の決め方』で導く。エンドポイントは利用者ごとに違い実測できないため、既定値は公開仕様の値として呼び出し元へ返すと同じ取り決め（受け取ってから 1 秒以内に 2xx）に余裕 50% を加算した 1.5 秒にする（「返送のタイムアウトと再送」と同じ導き方）。外のエンドポイントはこの取り決めを守らないので、設定で延ばせるようにする。上限はユーザーが待てる時間として 10 秒と決めた（PR #44 の確認ログ）。ホットキー・トレイの録音は届け終えるまで待機中に戻らず、その間は次の録音を始められない。下限は、127.0.0.1 の往復だけの実測の最大 62.58 ms に余裕 50% を加算した約 94 ms を上回り、エンドポイントの処理の分も含めて誤って届かない扱いにならないよう、設定画面の欄の刻みと同じ 0.5 秒にする。届かなければ再送しない（インターフェース定義『設定のエンドポイントへ送信する』）'
    overflow: 設定の秒数で届かなければ再送せず DeliveryError にし、トレイで知らせてログに理由を書く。範囲の外の値は設定の確かめが断り、保存できない
    measurement: 結合テストで、127.0.0.1 のテスト用のエンドポイントが 1 秒待ってから 2xx を返すときに既定の 1.5 秒で 1 回で届き、設定の秒数より遅く返すときに DeliveryError になることを確かめる
    breakdown:
      - part: エンドポイントが 2xx を返すまでの取り決め
        value: 1 秒
        notes: インターフェース定義『設定のエンドポイントへ送信する』のエンドポイントの応答時間（呼び出し元へ返すと同じ）
      - part: 余裕
        value: + 0.5 秒
        notes: 取り決めの 50%（規約『資源の値の決め方』の既定）
      - part: 既定値
        value: 1.5 秒
      - part: 上限
        value: 10 秒
        notes: 'ユーザーが待てる時間（PR #44 の確認ログ）。届け終えるまで次の録音を始められない時間の上限'
      - part: 下限
        value: 0.5 秒
        notes: 127.0.0.1 の往復の実測の最大 62.58 ms（「返送のタイムアウトと再送」の測り方）に余裕 50% を加算した約 94 ms を上回り、設定画面の欄の刻みとそろえる
  - name: 連続録音のセッションの上限時間
    english_name: continuous_session_limit
    category: 耐障害
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/issues/43
    value: '14400'
    unit: 秒
    rationale: 呼び出し元が完了を呼ばないまま落ちても、マイクが開いたままホットキーと API を塞ぎ続けないように、この時間で解く。連続録音は区間ごとに切り出して手放すため、貯める録音は区間の最大の長さ（20 秒に前の余白を加算して 20.3 秒、0.65 MB）までで、セッションの長さでは増えない。そのため 1 回の録音向けの API のセッションの上限時間（600 秒）は当てず、想定する使い方（#1 のゲーム実況の配信で配信者の声を常時録音する）の 1 回の配信の長さを覆う 4 時間を既定にする。配信の長さは使う側ごとに違うため、設定（api.continuous.session_limit_sec）で変えられる。履歴を残す設定では区間の録音が履歴に残り、4 時間話し続けると最大で 460 MB（16 kHz・モノラル・16 bit）になる（削除するのは履歴の保持日数）
    overflow: 上限で打ち切り、区間に切り出していない話し声を最後の区間として起こして届けた後、返送先へ truncated と区間の数を送信する（上限で打ち切る）
    measurement: 録音の入力を、テストの中で書き出した WAV（話し声の後に無音が続く）を実時間で流すものに、システム音量を何もしないものに差し替えた録音機で（実機のマイクを開かない）、連続録音の上限時間を 3 秒に差し替えた SessionManager を上限のタイマーで回し、打ち切られて返送先へ truncated と区間の数が届くことを確かめる。`--run-e2e` を付けて実行する（Windows 11）
    test_file: tests/nfr/test_continuous_session_limit.py
    tests:
      - name: test_continuous_session_limit
        summary: 完了が来ないまま上限時間に達した連続録音が打ち切られ、返送先へ truncated と区間の数が届く
        condition: 連続録音の上限時間を 3 秒に差し替えた SessionManager を、録音の入力を 1 秒の話し声の後に無音が続く WAV を実時間で流すものに、システム音量を何もしないものに差し替えた録音機と上限のタイマー（1 秒ごと）で動かし、continuous=true で API のセッションを始めて完了を呼ばない。返送先は 127.0.0.1 のテスト用のエンドポイント
        measurement: 開始から終わりの返送が届くまでの時間と、届いた返送の中身を記録する
        expected: 終わりの返送が上限時間（3 秒）以上、上限時間 + 確かめる間隔（1 秒）+ 区切ってから返送が届くまでの時間の決定値（4 秒）以内に届いて result=truncated・segment_count=1 で、その前に segment_number=1 の返送が届いている。続けて呼んだ開始が 202 になる
        notes: --run-e2e が無い環境では skip する
    status: planned
    introduced:
      pr: 78
  - name: 区間の最大の長さ
    english_name: max_segment_length
    category: 性能
    external_constraint: Whisper は音を 30 秒の窓ごとに起こす（30 秒を超える音は窓をずらして繰り返し起こす）
    source_kind: 外部ライブラリの制限
    source: dev/設計書/外部ライブラリ/faster-whisper#
    value: '20'
    unit: 秒
    rationale: 無音が来ないまま話し続けても、区切ってから返送が届くまでの時間の決定値（4 秒）に収まるように、この長さで区切る。PoC（#80）は 30 秒で区切り、28.3 秒の区間を区切ってから文字が出るまで 2.53 秒だったが、非機能要件テスト（#78、2026-10-10、Windows 11・RTX 5070）では 30.1 秒の区間が 3.24〜3.75 秒かかり、20 秒にすると 18〜19 秒の区間で 2.0〜3.5 秒だった。そのため 20 秒にする。区間の長さは、話し声の前の余白（SEGMENT_PAD_SEC、0.3 秒）を加算して最大 20.3 秒になり、Whisper の 1 窓（30 秒）に収まる。区切りが増える分、短い無音が無い所では言葉の途中で切れることが増える
    overflow: 直近の短い無音の中（無ければその位置）で区切る。言葉の途中で切れることがある
    measurement: 区切りの部品に、区切りの無音の長さに届かない間だけで 20 秒を超えて話し続けた録音を流し、切り出した区間の長さを測る（文字起こしと実機のマイクは使わない）
    test_file: tests/nfr/test_max_segment_length.py
    tests:
      - name: test_max_segment_length
        summary: 話し続けた録音から切り出した区間が、どれも決定値に前の余白を加算した長さ以下である
        condition: Windows の音声合成（SAPI）で、文の間を 0.5 秒以下にして 45 秒以上読み上げ続けた WAV を作り、前に 1 秒の無音を置いて（前の余白を区間に含めるため）、区切りの部品に録音の入力と同じ大きさの塊（160〜1024 フレーム）で流す
        measurement: 切り出した区間ごとの長さ（秒）を測る
        expected: 区間が 2 つ以上あり、どの区間の長さも 20.3 秒（決定値 + 前の余白 0.3 秒）以下
        notes: SAPI が使えない環境では skip する
    status: planned
    introduced:
      pr: 78
  - name: 区切ってから返送が届くまでの時間
    english_name: segment_callback_latency
    category: 性能
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/voice-paste/pull/78#discussion_r4237300832
    value: '4'
    unit: 秒
    rationale: 区切った区間ごとに順に渡すことが要望（#43）の中心で、話し終えてから文字が届くまでを使う側が待たされないようにする。PoC（#80、2026-10-09、Windows 11・RTX 5070）の成功条件の 3 秒から始めたが、非機能要件テスト（#78、2026-10-10）で区間の最大の長さを 20 秒にしても、18〜19 秒の区間の文字起こしが話した中身で 2.0〜3.5 秒にばらつき、6 回のうち 2 回で 3 秒を超えた（最大 3.46 秒）。ばらつきは区間の長さでは抑えきれないため、測った最大に余裕を加算した 4 秒にする（ユーザーの回答）。区間の最大の長さ（20 秒）より十分に短く、前の区間を起こし終える前に次の区間がたまって待ちが伸びることはない（PoC で待ち行列は常に 1 以下）。返送先に届かず再送するときは、返送の最長（13 秒）まで後の区間が待つ（順を保つため）
    measurement: 常駐中・ローカルの Whisper（GPU）・モデル読み込み済みで、録音の入力だけを差し替えた連続録音に、無音で区切る話し声と最大の長さで区切る話し声を流し、区切った時点から返送先に届いた時点までを区間ごとに測る。`--run-e2e` を付けて実行する（Windows 11・NVIDIA GPU）
    breakdown:
      - part: 区切ってから文字が出るまで
        value: 3.43 秒
        notes: 非機能要件テストで測った区間の最大（3.46 秒）から返送の往復を除いた分。18.9 秒の区間で、用語集の補正・履歴の保存を含む
      - part: 返送の往復
        value: + 0.03 秒
        notes: loopback の p99.9（26 ms）
      - part: 余裕
        value: + 0.54 秒
        notes: 測った回数（6 回）で見えていないばらつきの分
      - part: 決定値
        value: 4 秒
    test_file: tests/nfr/test_segment_callback_latency.py
    tests:
      - name: test_segment_callback_latency
        summary: 区切ってからその区間の返送が届くまでが、どの区間も決定値以内である
        condition: build_handlers で配線した常駐サービスをローカルの Whisper（GPU）で立て、モデルの読み込みを待つ。録音の入力は、Windows の音声合成（SAPI）で作った、区切りの無音の長さより長い間を挟んだ 5 文の後に 45 秒以上読み上げ続ける WAV を実時間で流すものに差し替え、continuous=true で始めて流し終えたら完了を呼ぶ。返送先は 127.0.0.1 のテスト用のエンドポイント
        measurement: 区切った時点（常駐サービスのログ）から、同じ通し番号の返送がエンドポイントに届いた時点までを time.perf_counter の時刻で区間ごとに測る
        expected: 全ての区間で 4 秒以下
        notes: 最初の区間はワーカーの温まりで遅れるため、測る前に別の連続録音で 1 区間を起こして温める。完了で閉じた最後の区間は、完了を呼んだ時点から測る。--run-e2e が無い環境では skip する
    status: planned
    introduced:
      pr: 78
  - name: ブラウザの要求の応答時間
    english_name: web_response_time
    category: 性能
    external_constraint: ゲートウェイ（shuhdev-gateway）の応答待ちの上限 83 秒
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/voice-paste/issues/92
    value: '66'
    unit: 秒
    rationale: '`/web/` の下の各要求は、ゲートウェイが打ち切る前に返す。ゲートウェイの 83 秒（`upstream.header_timeout_sec`）は、利用者からの本文を流しながら応答のヘッダーを待つ時間で、端末から本文を送信し終えるまでの時間を含む（[relay.py](https://github.com/shuhei1101/shuhdev-gateway/blob/master/src/shuhdev_gateway/relay.py) の 102〜115 行目）。外部の上限から規約『資源の値の決め方』の安全率 20% を引いて 66 秒にする。常駐アプリの受け付けは一時のファイルに書いてキューに積むだけで、文字起こしの時間を応答に含めない。PR #171 の PoC で、127.0.0.1 へ直接 95 MiB を送信し、99,614,720 バイトを一時のファイルへコピーして 0.41 秒で 202 が返った（ゲートウェイは通していない。2026-10-23）。そのため応答時間のほとんどは端末からのアップロードの時間で、ブラウザの本文の上限を 66 秒で送信しきるには端末の上りで約 12 Mbps（100,000,000 × 8 ÷ 66）が要る。画面で録った音声は 30 分・約 100 kbps で約 22.5 MB のため、上り約 2.7 Mbps で足りる。外の端末から一時的に使う道具で、主な使い方は画面で録る音声のため、本文の上限は下げず、遅い回線で大きなファイルを選んだときは送信失敗にする'
    breakdown:
      - part: ゲートウェイの応答待ちの上限
        value: 83 秒
        notes: 端末からのアップロードの時間を含む
      - part: 安全率
        value: − 20%
        notes: 規約『資源の値の決め方』の既定
      - part: 決定値
        value: 66 秒
        notes: 66.4 秒を秒の単位へ切り捨て
      - part: 常駐アプリの受け付け
        value: 0.41 秒
        notes: PoC で 127.0.0.1 へ直接 95 MiB を送信した実測
      - part: 本文の上限を送信しきるのに要る上り
        value: 約 12 Mbps
        notes: 100,000,000 バイト × 8 ÷ 66 秒。画面で録った 30 分（約 22.5 MB）は約 2.7 Mbps
    overflow: ゲートウェイが 504 で要求を打ち切り、画面は送信失敗を出して端末内の音声を残す（遅い回線で大きなファイルを選んだとき）
    measurement: pytest のプロセスの中で配線した常駐サービスへ、本文の上限に近い音声を `POST /web/transcriptions` で送信し、202 が返るまでを測る
    test_file: tests/nfr/test_web_response_time.py
    tests:
      - name: test_web_response_time
        summary: 本文の上限に近い音声の受け付けが決定値以内に返る
        condition: 本文が 99,000,000 バイトになる webm の音声を 5 回送信する。文字起こしのエンジンは受けたパスを控える関数に差し替える
        measurement: 送信を始めてから 202 を受けるまでの時間（秒）
        expected: 5 回とも 202 で、最大が 66 秒以内
    status: planned
    introduced:
      pr: 171
  - name: ブラウザの本文の上限
    english_name: web_body_limit
    category: レート制限
    external_constraint: Cloudflare の無料プランの要求の本文の上限 100 MB
    source_kind: 実行基盤の制限
    source: https://developers.cloudflare.com/workers/platform/limits/#request-limits
    value: '100000000'
    unit: バイト未満
    rationale: '本文の大きさは推定ではなくバイト数で正確に数えられるため、安全率を引かず、100 MB を 10 進の 100,000,000 バイトと読んで小さい方に揃える。multipart の境界とヘッダーも本文に含めて数える。PR #171 の PoC で、127.0.0.1 へ直接送信した 95 MiB（99,614,720 バイト）を受け付けた（Cloudflare とゲートウェイは通していない。2026-10-23）。上限に近い大きさをゲートウェイ越しに送信するには、ブラウザの要求の応答時間の内訳の上りの速さが要る'
    overflow: 413 の problem+json で断り、一時のファイルもジョブも作らない
    measurement: pytest のプロセスの中で配線した常駐サービスへ、上限の前後の大きさの本文を送信する
