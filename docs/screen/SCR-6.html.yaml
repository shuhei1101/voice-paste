id: SCR-6
visibility: internal
title: "外の端末の文字起こしの画面"
elements:
  - name: 画面の頭
    id: page_title
    kind: label
    position: 画面の頭
    description: 製品名と画面名
    label: voice-paste 文字起こし
    visible_when: 常時
  - name: 音声送信の見出し
    id: send_heading
    kind: label
    position: 音声送信
    description: 音声送信の区画の見出し
    label: 音声送信
    visible_when: 常時
  - name: 録音開始ボタン
    id: record_button
    kind: button
    position: 音声送信 > 操作
    description: 画面での録音を始める。MediaRecorder の形式を `isTypeSupported` で webm/opus・mp4・ogg の順に選び、audioBitsPerSecond に画面の録音のビットレートを引き渡す。マイクの許可はブラウザ標準の確認に任せる。端末内の音声が「送信失敗」「未送信」「文字起こし前」のときは塗りを除外し、主の操作を再送信ボタンへ移す
    label: 録音開始
    visible_when: 録音中でないとき
    enabled_when: 送信中でないとき
    error_message: マイクを開けないときは、音声送信のエラーに「マイク使用不可」「ブラウザのマイクの許可を確認」を出す
    action: 端末内の音声が「送信失敗」「未送信」「文字起こし前」なら置換の確認を開く。それ以外（音声が無い・送信済み）なら確認せずに録音を始め、録音中の表示に替える
    action_ref: SCR-4#
    status: planned
  - name: ファイル送信ボタン
    id: file_input
    kind: input
    position: 音声送信 > 操作
    description: 録ってある音声ファイルを選ぶ。選んだら確認せずにすぐ送信し、送信している間はファイルの送信中の行を出す。選んだファイルは端末内の音声に残さない（元が端末にあるため）
    label: ファイル送信
    io: 入力
    type: File
    visible_when: 録音中でないとき
    enabled_when: 送信中でないとき
    constraints: '`accept="audio/*"`。大きさがブラウザの本文の上限以上なら送信せずにファイルサイズ超過を出す'
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 送信の補足
    id: send_hint
    kind: label
    position: 音声送信 > 操作
    description: 録音の上限時間とファイルの大きさの上限
    label: 録音 最大 30 分・ファイル 100 MB 未満
    visible_when: 録音中でないとき
    refs:
      - NFR-1#requirements[画面の録音の上限時間]
      - NFR-1#requirements[ブラウザの本文の上限]
  - name: 録音中の状態
    id: recording_state
    kind: label
    position: 音声送信 > 録音中の表示
    description: 録音中であることを、点と文言で出す（色だけに頼らない）
    label: 録音中
    visible_when: 録音中
  - name: 経過時間
    id: recording_elapsed
    kind: label
    position: 音声送信 > 録音中の表示
    description: 録音を始めてからの時間。1 秒ごとに更新する（role=timer）。読み上げ名は「経過時間 {分} 分 {秒} 秒」
    io: 表示
    visible_when: 録音中
    display_format: '`mm:ss`（例 `02:14`）'
  - name: 上限までの録音時間
    id: recording_progress
    kind: progress
    position: 音声送信 > 録音中の表示
    description: 画面の録音の上限時間に対する経過時間（秒）
    io: 表示
    visible_when: 録音中
    range:
      min: '0'
      max: '1800'
  - name: 上限と残り時間
    id: recording_remaining
    kind: label
    position: 音声送信 > 録音中の表示
    description: 上限時間と残り時間。残り 60 秒未満になったら残り時間を注意の色にし、「（上限で自動送信）」を添える
    label: 上限 30:00 / 残り {m:ss}
    io: 表示
    visible_when: 録音中
    display_format: '`m:ss`（例 `27:46`・`0:48`）'
  - name: 録音停止・送信ボタン
    id: stop_button
    kind: button
    position: 音声送信 > 録音中の表示
    description: 録音を止め、録った音声を保存日時つきで端末（IndexedDB）に 1 件だけ残して（前の 1 件を置き換える）送信する。上限時間に達したときも同じ動きを自動で行う
    label: 録音停止・送信
    visible_when: 録音中
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 上限到達のメッセージ
    id: limit_notice
    kind: label
    position: 音声送信
    description: 上限時間で録音が止まり、送信していること（role=status）
    label: 上限 30 分に到達。録音停止・送信中
    visible_when: 上限時間で録音が止まってから、その送信が終わるまで
  - name: 音声送信のエラー
    id: send_error
    kind: label
    position: 音声送信
    description: 送信の失敗を、見出しと本文で出す（role=alert）。次の送信か録音を始めると削除する
    io: 表示
    visible_when: 直前の送信か録音の開始が失敗したとき
    error_message: '415: 「非対応形式」「{ファイル名} は未送信。対応形式: WAV・MP3・webm・ogg・mp4」。413（送信前に大きさで弾いたときも）: 「ファイルサイズ超過」「{ファイル名}（{大きさ}）は未送信。上限: 100 MB 未満。MP3 等に圧縮して再選択」。届かない・403・503・504・そのほか（一覧に無いプリセットの 400 は除く。一覧に無いプリセットのエラー に出す）: 「送信失敗」「PC の voice-paste に接続不可。音声は端末内に保存済み。PC の起動を確認後に再送信」（選んだファイルのときは「音声は端末内に保存済み」を出さない）。マイクを開けない: 「マイク使用不可」「ブラウザのマイクの許可を確認」'
    source: 音声を受け付ける の応答のステータス
  - name: 端末内の音声の情報
    id: kept_meta
    kind: label
    position: 音声送信 > 端末内の音声
    description: 画面で録った直近 1 件の音声の録った日時・長さ・形式・大きさ。送信中は、送信した時点の用語集のプリセット（選択欄の表示文言のまま）を末尾に添え、次に送信する音声の選択と分ける。見出しは「端末内の音声」
    io: 表示
    visible_when: 端末（IndexedDB）に音声があるとき
    display_format: '`MM/DD HH:mm 録音・{m:ss}・{形式}・{大きさ}`（例 `10/23 14:05 録音・2:14・webm・540 KB`）。送信中は末尾に `・プリセット「{名前}」`'
  - name: 端末内の音声の状態
    id: kept_state
    kind: label
    position: 音声送信 > 端末内の音声
    description: その音声の送信と文字起こしの状態。マーカーと文言で分け、色だけに頼らない
    io: 表示
    visible_when: 端末（IndexedDB）に音声があるとき
    options: 「送信中 {n}%」（送信中）・「送信済み」（202 を受けた後。そのジョブが failed か 404 になるまで）・「送信失敗」（送信が失敗した）・「未送信」（一覧に無いプリセットで 400 になった）・「文字起こし前」（そのジョブが failed か 404）
  - name: 送信の進捗
    id: kept_progress
    kind: progress
    position: 音声送信 > 端末内の音声
    description: 送信したバイト数の割合（XMLHttpRequest の upload の progress）。読み上げ名は「送信の進捗」
    io: 表示
    visible_when: 送信中
    range:
      min: '0'
      max: '100'
  - name: ダウンロードボタン
    id: download_button
    kind: button
    position: 音声送信 > 端末内の音声
    description: 端末内の音声を、録った日時の名前と形式の拡張子で端末へ保存する
    label: ダウンロード
    visible_when: 端末（IndexedDB）に音声があるとき
    action: '`voice-paste_{YYYYMMDD-HHmmss}.{拡張子}` の名前で保存する'
  - name: 再送信ボタン
    id: resend_button
    kind: button
    position: 音声送信 > 端末内の音声
    description: 端末内の音声を、再送信した時点の用語集のプリセットの選択でもう一度送信する。このときの主の操作（塗り）。新しい job_id で結果の一覧に待ちの件を追加し、失敗した前の件は一覧から除外する
    label: 再送信
    visible_when: 端末内の音声が「送信失敗」「未送信」「文字起こし前」のとき
    target: 音声を受け付ける.audio
    action_ref: IF-11#
    status: planned
  - name: 結果の見出し
    id: results_heading
    kind: label
    position: 結果
    description: 結果の区画の見出し
    label: 結果
    visible_when: 常時
  - name: 結果の件数
    id: results_meta
    kind: label
    position: 結果 > 見出し
    description: 一覧の件数（待ちの件を含む）と、残す件数・期限
    label: '{n} 件・最大 10 件・保存 7 日（0 件のときは「最大 10 件・保存 7 日」）'
    io: 表示
    visible_when: 常時
  - name: 結果なしの表示
    id: results_empty
    kind: label
    position: 結果
    description: 一覧に件が無いこと
    label: 結果 0 件
    visible_when: 一覧に件が無いとき
  - name: 結果の一覧
    id: results_list
    kind: list
    position: 結果
    description: 新しい件を先頭に並べる（aria-live=polite）。終わっていない件（文字起こし待ち・文字起こし中）は 2 秒ごとに結果を取りに行き、done・failed・404 で取りに行くのをやめる。取りに行けなかったとき（届かない・5xx）は次の間隔で取りに行く。終わっていない件の job_id も端末（localStorage）に持ち、画面を開き直したら取りに行くのを続ける。画面を開いたときに、保存日時から 7 日を過ぎた結果と端末内の音声を削除する。結果は直近 10 件を残し、超えたらいちばん古い件を削除する
    io: 表示
    visible_when: 一覧に件があるとき
    source: 文字起こしの結果を返却する.state
    action_ref: IF-4#
    status: planned
  - name: 結果の日時
    id: result_time
    kind: label
    position: 結果 > 結果の 1 件
    description: 送信した日時
    io: 表示
    visible_when: 常時
    display_format: '`MM/DD HH:mm`'
  - name: 結果の元の音声
    id: result_source
    kind: label
    position: 結果 > 結果の 1 件
    description: 画面で録った音声は「画面録音・{長さ}」、選んだファイルはファイル名。長い名前は 1 行で末尾を `…` で省く
    io: 表示
    visible_when: 常時
  - name: 結果の状態
    id: result_status
    kind: label
    position: 結果 > 結果の 1 件
    description: 終わっていない件と失敗した件の状態
    io: 表示
    visible_when: state が queued・running・failed か 404 のとき
    options: 'queued: 「文字起こし待ち」。running: reports_progress が true なら「文字起こし中 {n}%」、false なら「文字起こし中」。failed: 「文字起こし失敗」。404: 「結果消失」'
    source: 文字起こしの結果を返却する.state・文字起こしの結果を返却する.reports_progress
  - name: 文字起こしの進捗
    id: result_progress
    kind: progress
    position: 結果 > 結果の 1 件
    description: 文字起こしの進み具合。読み上げ名は「文字起こしの進捗」
    io: 表示
    visible_when: state が running で、reports_progress が true のとき（false のときは hidden にして読み上げにも出さない）
    range:
      min: '0'
      max: '100'
    source: 文字起こしの結果を返却する.progress（× 100 して整数に丸める）
  - name: 起こした文字
    id: result_text
    kind: label
    position: 結果 > 結果の 1 件
    description: 用語集で補正した文字。改行を保ち、長い単語も折り返す。done を受けたら保存日時つきで端末（localStorage）に残す
    io: 表示
    visible_when: state が done のとき
    source: 文字起こしの結果を返却する.text
  - name: 失敗の詳細
    id: result_detail
    kind: label
    position: 結果 > 結果の 1 件
    description: 失敗の理由と対処。失敗した件は端末（localStorage）に残さず、画面を開いている間だけ出す
    io: 表示
    visible_when: state が failed か 404 のとき
    error_message: 'failed: 「PC の voice-paste で文字起こしが停止。端末内の音声から再送信可」と「詳細: {error}」。404: 「PC の voice-paste の再起動で結果が消失。端末内の音声から再送信可」'
    source: 文字起こしの結果を返却する.error
  - name: コピーボタン
    id: copy_button
    kind: button
    position: 結果 > 結果の 1 件 > 操作
    description: 起こした文字をクリップボードへ入れる（`navigator.clipboard.writeText`）。押した直後は 2 秒だけ「コピー済み」に替え、読み上げにも伝える
    label: コピー
    visible_when: state が done のとき
    action: 起こした文字をクリップボードへ入れる
  - name: 削除ボタン
    id: delete_button
    kind: button
    position: 結果 > 結果の 1 件 > 操作
    description: その結果を端末から削除する確認を開く。アイコンだけのボタンで、読み上げ名は「この結果を削除」
    visible_when: state が done のとき
    action_ref: SCR-4#
  - name: 送信中のファイル名
    id: file_sending_name
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 選んで送信しているファイルの名前と大きさ。操作のすぐ下に出し、録音開始ボタンとファイル送信ボタンが押せない理由をその場で確認できるようにする。長い名前は名前だけを 1 行で末尾を `…` で省き、大きさは省かずに残す
    io: 表示
    visible_when: 選んだファイルを送信している間（202 か失敗を受けたら削除する）
    display_format: '`{ファイル名}・{大きさ}`（例 `interview-part2.m4a・38.4 MB`）'
  - name: ファイルの送信の状態
    id: file_sending_state
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 送信したバイト数の割合（role=status）。202 を受けたらこの行を削除し、結果の一覧の先頭に待ちの件を出す。失敗したらこの行を削除し、音声送信のエラーを出す
    label: 送信中 {n}%
    io: 表示
    visible_when: 選んだファイルを送信している間
  - name: ファイルの送信の進捗
    id: file_sending_progress
    kind: progress
    position: 音声送信 > ファイルの送信中
    description: 送信したバイト数の割合（XMLHttpRequest の upload の progress）。読み上げ名は「送信の進捗」
    io: 表示
    visible_when: 選んだファイルを送信している間
    range:
      min: '0'
      max: '100'
  - name: 用語集のプリセットの選択欄
    id: preset_select
    kind: select
    position: 音声送信 > 用語集のプリセット
    description: 次に送信する音声の補正に使用する用語集のプリセットを選ぶ。録音開始ボタン・ファイル送信ボタンの上に配置する。録音停止・送信・ファイル送信・再送信のどれも、送信した時点の選択を送信する。送信中も次に送信する音声のために変えられる
    label: 用語集のプリセット
    io: 入力
    type: 文字列
    visible_when: 常時
    enabled_when: 録音中でないとき
    required: false
    initial_value: 端末（localStorage voice-paste.glossary_preset）に覚えた名前が presets にあればその名前。覚えた名前が無い・一覧に無いときは「設定に従う」
    options: 先頭に「設定に従う（{active}）」（値は空文字。既定）、続けて presets を一覧の並びのまま並べる。一覧を取得できないときは「設定に従う」だけ。複数選択はしない
    source: 用語集のプリセットの一覧を返却する.presets・用語集のプリセットの一覧を返却する.active（画面を開いたときに 1 回取得する）
    target: 音声を受け付ける.glossary_preset（「設定に従う」は空文字）
    action: 選んだら、その名前を端末（localStorage voice-paste.glossary_preset）に覚える（「設定に従う」は空文字）
    action_ref: IF-5#
    status: planned
  - name: 録音中の選択欄の補足
    id: preset_help
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 選択欄が押せない理由。選択欄の aria-describedby で読み上げにも伝える
    label: 録音中は変更不可
    visible_when: 録音中
    status: planned
  - name: 一覧の取得失敗のメッセージ
    id: preset_fetch_notice
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 用語集のプリセットの一覧を取得できなかったこと（role=status）。送信は続けられるため、注意ではなく通知の色にする。取得し直すのは画面を開き直したとき。選択欄の aria-describedby で読み上げにも伝える
    label: プリセットの一覧を取得できませんでした。送信した音声は、PC の設定で選択中のプリセットで補正します。
    visible_when: 画面を開いたときの一覧の取得が失敗したとき（届かない・403・5xx）
    source: 用語集のプリセットの一覧を返却する の応答のステータス
    status: planned
  - name: 一覧に無いプリセットのエラー
    id: preset_not_found_error
    kind: label
    position: 音声送信 > 用語集のプリセット
    description: 選んだプリセットが PC の設定から削除済みで、音声を受け付ける が 400 を返却したことを、見出しと本文で選択欄のすぐ下に出す（role=alert）。glossary_preset を付けた送信の 400 をこのエラーとして扱う。出す前に一覧を取得し直し、選択と端末に覚えた名前を「設定に従う」へ戻す。録った音声は端末内の音声に「未送信」で残る。次の送信か録音を始めると削除する
    visible_when: 直前の送信が一覧に無いプリセットで 400 になったとき
    error_message: '見出しは「選択したプリセットが見つかりません」。選んだファイル: 「「{名前}」は PC の設定から削除済みのため、{ファイル名} は未送信です。一覧を再取得し、「設定に従う」に戻しました。プリセットを確認して、ファイルをもう一度選択してください。」。録った音声: 「「{名前}」は PC の設定から削除済みのため、録った音声は未送信です。一覧を再取得し、「設定に従う」に戻しました。プリセットを確認して、再送信してください。」'
    source: 音声を受け付ける の応答のステータス
    action_ref: IF-5#
    status: planned
  - name: 送信中のファイルのプリセット
    id: file_sending_preset
    kind: label
    position: 音声送信 > ファイルの送信中
    description: 送信しているファイルに付けた用語集のプリセット。送信した時点の選択欄の表示文言をそのまま出し、次に送信する音声の選択と分ける。ファイル名が長いと省かれるため、送信中のファイル名とは別の行に出す
    io: 表示
    visible_when: 選んだファイルを送信している間
