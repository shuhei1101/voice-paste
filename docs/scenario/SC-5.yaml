        notes: 録音の入力は無音の WAV。WSL でサーバーを起動するコマンドは、起動された回数を記録するコマンドに差し替える
      - name: 動いているサーバー
        description: 設定の接続先で、テスト用のエンドポイントが先に待ち受け、準備の確認に設定と違う計算の精度を返却する
        notes: '設定は `transcription.haas.dtype: auto`、エンドポイントは `float32` を返却する'
      - name: 文字起こしのエンジン
