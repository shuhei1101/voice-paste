input_checks:
  - element: 設定の欄
    violation: 数値の欄に数値でない文字が入っている
    trigger: 保存・保存して再起動のボタンのクリック
    message: '数値を入れてください（例: {既定の値}）。'
    position: その欄の下とエラーの一覧
  - element: 設定の欄
    violation: 数値が設定の設計書の許す範囲の外（例 `api.port` が 1024〜65535 の外、日数が 1 未満、`preset_options.endpoint.timeout_sec` が 0.5〜10 の外）
    trigger: 保存・保存して再起動のボタンのクリック
    message: '{最小}〜{最大} の値を入れてください。（上限が無ければ「{最小} 以上の値を入れてください。」）'
    position: その欄の下とエラーの一覧
  - element: ホットキーの欄
    violation: ほかのホットキーの欄と同じ組み合わせ（録音を始めると「貼り付けて送信」が同じものは除く）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 「{重なった欄の名前}」と同じホットキーです。別のキーにしてください。
    position: その欄の下とエラーの一覧
  - element: プリセットのホットキーの欄
    violation: ほかのプリセットのホットキーと同じ組み合わせ（種類をまたいで確かめる。空どうしは重なりとしない）
    trigger: 保存・保存して再起動のボタンのクリック
    message: プリセット「{重なったプリセットのタイトル}」と同じキーです。別のキーにしてください。（もう一方のタブのプリセットなら「「{種類}」のプリセット「{タイトル}」と同じキーです。別のキーにしてください。」）
    position: その欄の下とエラーの一覧
  - element: プリセットのホットキーの欄
    violation: プリセット以外のホットキーの欄（`hotkeys.*`・`keyboard.paste_key`・`outputs[].hotkey`）と同じ組み合わせ
    trigger: 保存・保存して再起動のボタンのクリック
    message: 「{重なった欄の名前}」と同じホットキーです。別のキーにしてください。
    position: その欄の下とエラーの一覧
  - element: ホットキーの欄
    violation: pynput が読めない組み合わせ
    trigger: 保存・保存して再起動のボタンのクリック
    message: ホットキーを受け付けられませんでした（{理由}）。別のキーにしてください。
    position: エラーの一覧
  - element: プリセットのタイトルの欄
    violation: 空
    trigger: 保存・保存して再起動のボタンのクリック
    message: タイトルを入れてください。
    position: その欄の下とエラーの一覧
  - element: プリセットの URL の欄
    violation: 空
    trigger: 保存・保存して再起動のボタンのクリック
    message: 'URL を入れてください（例: https://example.com/hook）。'
    position: その欄の下とエラーの一覧
  - element: プリセットの URL の欄
    violation: 空でなく、http:// か https:// で始まらない
    trigger: 保存・保存して再起動のボタンのクリック
    message: http:// か https:// で始まる URL を入れてください。
    position: その欄の下とエラーの一覧
  - element: 用語集の名前の欄
    violation: 空（前後の空白を除いて）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 名前を入れてください。
    position: その欄の下とエラーの一覧
  - element: 用語集の名前の欄
    violation: 空でなく、ほかの用語集と同じ名前（一覧で後ろにある側の欄に出す）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 用語集「{名前}」と同じ名前です。別の名前にしてください。（エラーの一覧では「用語集「{名前}」と同じ名前です」）
    position: その欄の下とエラーの一覧
  - element: 誤変換の欄
    violation: 空で、同じ行の正しい表記が空でない（補正に使わない用語集とオフの行も確かめる。両方が空の行は違反にせず、保存で捨てる）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 誤変換を入れてください。
    position: その欄の下とエラーの一覧
  - element: 有効なヒントの長さ
    violation: 有効なプリセットの語を一覧の順に読点（、）でつないだ長さが UTF-8 で 222 バイトを超える
    trigger: 保存・保存して再起動のボタンのクリック
    message: 有効なヒントが長すぎます（{今の長さ} / 222 バイト）。語を減らすか、プリセットを無効にしてください。
    position: 有効なヒントの長さの行の下とエラーの一覧
  - element: ヒントの語の欄
    violation: 空（前後の空白を除いて。無効のプリセットも確かめる）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 語を入れるか、この欄を消してください。
    position: その欄の下とエラーの一覧
  - element: ヒントの語の欄
    violation: 読点（、）・句点（。）・改行のどれかが入っている（無効のプリセットも確かめる）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 読点（、）・句点（。）・改行は入れられません。語を分けて足してください。
    position: その欄の下とエラーの一覧
  - element: ヒントのプリセットの名前の欄
    violation: 空（前後の空白を除いて）
    trigger: 保存・保存して再起動のボタンのクリック
    message: 名前を入れてください。
    position: その欄の下とエラーの一覧
  - element: ヒントのプリセットの名前の欄
    violation: 空でなく、ほかのヒントのプリセットと同じ名前（一覧で後ろにある側の欄に出す）
    trigger: 保存・保存して再起動のボタンのクリック
    message: プリセット「{名前}」と同じ名前です。別の名前にしてください。
    position: その欄の下とエラーの一覧
