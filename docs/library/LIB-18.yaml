id: LIB-18
visibility: internal
title: "pydantic"
kind: "ライブラリ"
version:
  current: 2.14.1
  latest: 2.13.5
  checked_on: '2026-10-01'
  source: pyproject.toml（fastapi の依存としても入る）と uv.lock のバージョン
  pinning: 互換リリースで固定（~=2.13）
catalogs:
  - name: API
    version: 2.13.5
    entries:
      - name: BaseModel
        kind: クラス
        purpose: 設定のモデルと、API のリクエスト・レスポンス・返送の中身を定義して検証する
      - name: Field
        kind: 関数
        purpose: 設定の項目ごとに範囲と説明、再起動が要るかのマーカー（json_schema_extra）を持たせる
      - name: AnyHttpUrl
        kind: 型
        purpose: コールバック先の URL を検証する
      - name: SecretStr
        kind: 型
        purpose: API キーをログに出さない
      - name: ValidationError
        kind: 例外
        purpose: 設定の値が合わないときに書き込まずに通知する
lead: 型ヒントからデータの検証と変換をする Python のライブラリ。
purl: pkg:pypi/pydantic
dependency_scope: 必須
adoption: 採用
used_in:
  - src/voice_paste/shared/settings.py
  - src/voice_paste/features/session/schemas.py
  - src/voice_paste/features/outputs/types.py
upstream: pydantic/pydantic
verification:
  state: 済
  date: '2026-10-01'
  detail: 'WSL（Linux・Python 3.12）で、AnyHttpUrl の callback_url と Literal の result を持つモデルを FastAPI 経由で検証し、不正な URL を断ることと、返送の中身を受け取れることを確認した。Windows（Python 3.14.3の一時の venv、pydantic 2.13.5）で、設定のモデル（extra="forbid"、`Field(discriminator="id")` の判別共用体、SecretStr、範囲の制約、`json_schema_extra` のマーカー）を単体テストで動かし、値の検証と `model_dump(mode="json")` が想定どおりであることを確認した'
license: MIT（商用利用可）
official_url: https://docs.pydantic.dev/
