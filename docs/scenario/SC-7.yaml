id: SC-7
visibility: internal
title: "起こした文字を届ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 出力先
        description: 「貼り付けて送信」をオンにし、録音する で「貼り付けて送信」を選んだ
      - name: Enter と一緒に押す修飾キー
        description: 設定画面で Ctrl・Alt・Shift を全てオフにした（既定）
        notes: '`outputs[paste_and_send]` の修飾キーの項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（貼り付けて送信）
        participant CB as クリップボード
        participant TGT as 貼り付け先のアプリ
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TGT: 貼り付けのキーを送信する
        OUT->>TGT: 設定の間を置いて Enter を送信する
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 貼り付け先の入力欄に起こした文字が入り、Enter が送信されている
      - クリップボードに起こした文字が入っている
      - トレイのアイコンが待機中に戻っている
    test: test_normal
  - name: 正常シナリオ（貼り付けのみ）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 出力先
        description: 「貼り付けのみ」をオンにし、録音する で「貼り付けのみ」を選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（貼り付けのみ）
        participant CB as クリップボード
        participant TGT as 貼り付け先のアプリ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TGT: 貼り付けのキーを送信する
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - 貼り付け先の入力欄に起こした文字が入り、Enter は送信されていない
      - クリップボードに起こした文字が入っている
    test: test_normal_when_paste_only
  - name: 正常シナリオ（コピーのみ）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 出力先
        description: 「コピーのみ」をオンにし、録音する で「コピーのみ」を選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（コピーのみ）
        participant CB as クリップボード
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字を渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>TRAY: コピーの完了と起こした文字を通知する
        TRAY->>TRAY: コピーの完了の通知を出す
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - クリップボードに起こした文字が入っている
      - 貼り付けのキーも Enter も送信されていない
      - トレイからコピーの完了の通知が出ている
    test: test_normal_when_copy_only
  - name: 正常シナリオ（ブラウザ添付のプリセット）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー・ブラウザを開く呼び出し。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。ブラウザを開く呼び出しは渡された URL を控え、Microsoft Edge を開かない
      - name: プリセット
        description: 種類「ブラウザ添付」・Enter まで送信をオンにしたプリセットを 1 つ追加し、録音する でそのプリセットを選んだ
      - name: Enter と一緒に押す修飾キー
        description: 設定画面の「貼り付けて送信」で Ctrl をオンにした（ブラウザ添付のプリセットには当てない）
        notes: '`outputs[paste_and_send]` の修飾キーの項目'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（ブラウザ添付）
        participant CB as クリップボード
        participant EDGE as Microsoft Edge

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>EDGE: プリセットの URL をアプリのウィンドウとして開く（Edge が見つからなければ既定のブラウザで開く）
        OUT->>OUT: 設定の間を置く
        OUT->>EDGE: 貼り付けのキーを送信し、設定の間を置いて Enter を送信する
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - プリセットの URL の画面がアプリのウィンドウとして開いている
      - その画面の入力欄に起こした文字が入り、送信されている
      - Enter は修飾キーを押さずに送信されている
    test: test_normal_when_browser_preset
  - name: 正常シナリオ（呼び出し元へ返す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: API から始めた録音で、起こした文字が得られた
      - name: ほかの出力先
        description: 「貼り付けて送信」をオンにしている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字と返送先を渡す
        OUT->>OUT: 返送先が loopback か設定で許可したホストであることを確かめる
        OUT->>CB: セッションの ID と起こした文字を送信する
        CB-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 返送先のエンドポイントに、セッションの ID と起こした文字が 1 回届いている
      - クリップボードと貼り付け先が届ける前のままである
      - トレイのアイコンが待機中に戻っている
    test: test_normal_when_return_to_caller
  - name: 正常シナリオ（呼び出し元へ空の文字を返す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は無音の WAV。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: API から始めた録音で、文字起こしの結果が空だった
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        SVC->>OUT: 空の文字と返送先を渡す
        OUT->>CB: セッションの ID と空の文字を送信する
        CB-->>OUT: 受け取った
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - 返送先のエンドポイントに、セッションの ID と空の文字が 1 回届いている
      - トレイのアイコンが待機中に戻っている
    test: test_normal_when_return_empty_text
  - name: 異常シナリオ（呼び出し元へ失敗を返す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。保存した録音を読めない中身に書き換える。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: API から始めた録音で、文字起こしに失敗した
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        SVC->>OUT: 文字起こしの失敗と返送先を渡す
        OUT->>CB: セッションの ID と文字起こしに失敗したことを送信する
        CB-->>OUT: 受け取った
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - 返送先のエンドポイントに、セッションの ID と文字起こしに失敗したことが 1 回届いている
      - トレイのアイコンが待機中に戻っている
    test: test_error_when_return_failure
  - name: 異常シナリオ（返送先に届かない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: 入口
        description: API から始めた録音で、起こした文字が得られた
      - name: 返送先の停止
        description: 返送先のエンドポイントを停止しておき、送信しても届かないようにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant LOG as ログ

        SVC->>OUT: 起こした文字と返送先を渡す
        loop 決めた回数まで
          OUT->>CB: セッションの ID と起こした文字を送信する
          CB--xOUT: 届かない（タイムアウトか接続できない）
          OUT->>OUT: 決めた間を置く
        end
        OUT->>LOG: 返送先に届かなかったこととセッションの ID を書く
        Note over SVC: 待機中に戻すのは 正常シナリオ（呼び出し元へ返す） と同じ
      ```
    expected:
      - ログに返送先に届かなかったこととセッションの ID が書かれている
      - 履歴に録音と起こした文字が残っている
      - トレイのアイコンが待機中に戻り、次の録音を始められる
    notes:
      再送の回数と間: 再送の回数・間・タイムアウトは非機能要件で決める。
    test: test_error_when_callback_unreachable
  - name: 正常シナリオ（エンドポイントへ送信のプリセット）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。送信先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: プリセット
        description: 種類「エンドポイントへ送信」で URL にテスト用のエンドポイントを設定したプリセットを 1 つ追加し、録音する でそのプリセットを選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（エンドポイントへ送信）
        participant EP as 送信先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>EP: セッションの ID と起こした文字を送信する
        EP-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 送信先のエンドポイントに、セッションの ID と起こした文字が 1 回届いている
      - クリップボードと貼り付け先が届ける前のままである
      - トレイのアイコンが待機中に戻っている
    test: test_normal_when_endpoint_preset
  - name: 異常シナリオ（送信先に届かない）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV
      - name: プリセット
        description: 種類「エンドポイントへ送信」で URL にテスト用のエンドポイントを設定したプリセットを 1 つ追加し、録音する でそのプリセットを選んだ
      - name: 応えない送信先
        description: 送信先のエンドポイントが、受け取っても設定のタイムアウトより長く応えないようにしておき、送信しても届かない（タイムアウト）ようにする
        notes: エンドポイントは動かしたままにして、送信した回数を数える（既定のタイムアウト 1.5 秒に対し 3 秒応えない）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（エンドポイントへ送信）
        participant EP as 送信先のエンドポイント
        participant TRAY as トレイ
        participant LOG as ログ

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>EP: セッションの ID と起こした文字を送信する
        EP--xOUT: 届かない（タイムアウトか接続できないか、2xx 以外）
        OUT-->>SVC: 届けられなかった
        SVC->>TRAY: 届けられなかったことを通知する
        SVC->>LOG: 届けられなかった理由とセッションの ID を書く
        SVC->>SVC: 待機中に戻す
      ```
    expected:
      - トレイで届けられなかったことが知らされている
      - ログに届けられなかった理由とセッションの ID が書かれている
      - 送信先へ送信したのは 1 回だけである（再送しない）
      - 履歴に録音と起こした文字が残っている
      - トレイのアイコンが待機中に戻り、次の録音を始められる
    test: test_error_when_endpoint_unreachable
  - name: 正常シナリオ（ブラウザ添付のプリセット・貼り付けだけ）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー・ブラウザを開く呼び出し。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は音声合成の WAV。ブラウザを開く呼び出しは渡された URL を控え、Microsoft Edge を開かない
      - name: プリセット
        description: 種類「ブラウザ添付」・Enter まで送信をオフにしたプリセットを 1 つ追加し、録音する でそのプリセットを選んだ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as プリセット（ブラウザ添付）
        participant CB as クリップボード
        participant EDGE as Microsoft Edge

        SVC->>OUT: 起こした文字と選んだプリセットを渡す
        OUT->>CB: 起こした文字をコピーする
        OUT->>EDGE: プリセットの URL をアプリのウィンドウとして開く
        OUT->>OUT: 設定の間を置く
        OUT->>EDGE: 貼り付けのキーを送信する（Enter は送信しない）
        Note over SVC: 待機中に戻すのは 正常シナリオ と同じ
      ```
    expected:
      - プリセットの URL の画面がアプリのウィンドウとして開いている
      - その画面の入力欄に起こした文字が入り、送信はされていない
    test: test_normal_when_browser_preset_paste_only
  - name: 正常シナリオ（区間ごとに呼び出し元へ返す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV を実時間で流す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: 連続録音で、区間の文字が通し番号つきで得られた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント

        loop 区間ごと（通し番号の順）
          SVC->>OUT: 区間の文字・通し番号・返送先を渡す
          OUT->>OUT: 返送先が loopback か設定で許可したホストであることを確かめる
          OUT->>CB: セッションの ID・通し番号・区間の文字を送信する
          CB-->>OUT: 受け取った
        end
      ```
    expected:
      - 返送先のエンドポイントに、区間ごとにセッションの ID・通し番号・区間の文字が 1 回ずつ届いている
      - 届いた順が通し番号の順である
      - クリップボードと貼り付け先が届ける前のままである
    notes:
      順の保ち方: 前の区間の返送を終えて（届かなかったときは再送を終えて）から次の区間を送信する。
    test: test_normal_when_return_segments
  - name: 正常シナリオ（連続録音の終わりを返す）
    setup:
      - name: Mock
        description: マウス・キーボード・Windows のシェル・録音の入力・システム音量・貼り付けのキー。常駐アプリを pytest のプロセスの中で起動し、操作を Qt のイベントで渡す（補足『E2E のテスト』）
        notes: 録音の入力は、音声合成の文の間に無音を挟んだ WAV を実時間で流す。返送先は 127.0.0.1 で待ち受けるテスト用のエンドポイント
      - name: 入口
        description: 連続録音が完了か上限で終わり、最後の区間まで届け終えた（区間が 1 つも無い場合を含む）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SVC as 常駐サービス
        participant OUT as 出力先（呼び出し元へ返す）
        participant CB as 返送先のエンドポイント
        participant TRAY as トレイ

        SVC->>OUT: 終わった理由（完了か上限での打ち切り）と区間の数を渡す
        OUT->>CB: セッションの ID・終わった理由・区間の数を送信する
        CB-->>OUT: 受け取った
        SVC->>SVC: 待機中に戻す
        SVC->>TRAY: 待機中のアイコンにする
      ```
    expected:
      - 返送先のエンドポイントに、最後の区間の返送の後で、セッションの ID・終わった理由・区間の数が 1 回届いている
