id: IF-11
visibility: internal
title: 音声を受け付ける
entry:
  kind: endpoint
  value: POST /web/transcriptions
flows:
  - name: 正常系
    summary: 許す Origin から送信された音声を受け付け、job_id を返却する
    setup:
      - name: Mock
        description: ブラウザの音声のキューを、追加されたジョブを記録して取り出さないものに差し替える。一時のフォルダはテストの一時フォルダ
      - name: 許す Origin
        description: api.allowed_web_origins に要求の Origin を入れる
        notes: '`https://voice.example.com`'
      - name: 音声
        description: テストの中で書き出した短い webm/opus
    flow: |-
      <!-- map: {"title": "正常系"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant TMP as 一時のフォルダ
        participant Q as ブラウザの音声のキュー
        participant LOG as ログ

        C->>IF: audio（許す Origin）
        IF->>IF: Host・Origin・大きさ・待ちの数を確認する
        IF->>IF: PyAV で開いて形式と秒数を読み込む
        IF->>TMP: 録れた形式の拡張子で書き込む
        IF->>Q: ジョブを追加する（queued）
        IF->>LOG: 受け付けた（job_id・大きさ・形式・秒数）
        IF-->>C: 202・job_id
      ```

      <!-- /map -->
    expected:
      - 202 と 22 文字の job_id が返る
      - 一時のフォルダに `.webm` のファイルが 1 つあり、中身が送信した音声と同じ
      - キューにその job_id のジョブが queued で 1 件積まれている
      - ログに job_id・大きさ・形式・秒数が書き込まれている
    test: test_normal
  - name: 正常系（録音セッションの処理中）
    summary: ホットキーの録音中でも音声を受け付ける
    setup:
      - name: Mock
        description: マイク・システム音量・トレイを差し替える。ブラウザの音声のキューは追加されたジョブを記録するもの
      - name: 処理中
        description: ホットキーから始めた録音が録音中である
    flow: |-
      <!-- map: {"title": "正常系（録音セッションの処理中）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant Q as ブラウザの音声のキュー

        C->>IF: audio（許す Origin）
        IF->>Q: ジョブを追加する（queued）
        IF-->>C: 202・job_id
      ```

      <!-- /map -->
    expected:
      - 202 と job_id が返る
      - ホットキーの録音が録音中のまま続いている
    test: test_normal_when_session_busy
  - name: 異常系（audio が無い・400）
    summary: '`audio` の項目が無い要求を断る'
    setup:
      - name: Mock
        description: ブラウザの音声のキューは追加されたジョブを記録するもの
      - name: 要求
        description: 許す Origin で、multipart の項目名を `file` にする
    flow: |-
      <!-- map: {"title": "異常系（audio が無い・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions

        C->>IF: audio の無い multipart
        IF-->>C: 400（problem+json）
      ```

      <!-- /map -->
    expected:
      - 400 の problem+json が返る
      - キューにジョブが追加されていない
    test: test_error_when_audio_missing
  - name: 異常系（許されていない Origin・403）
    summary: 許す Origin に無い Origin が付いた要求を、本文を読み込まずに断る
    setup:
      - name: Mock
        description: ブラウザの音声のキューは追加されたジョブを記録するもの。一時のフォルダはテストの一時フォルダ
      - name: 要求のヘッダー
        description: 許す Origin に無い Origin を付ける
        notes: '`Origin: http://evil.example`'
    flow: |-
      <!-- map: {"title": "異常系（許されていない Origin・403）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ほかのオリジンのページ
        participant IF as POST /web/transcriptions
        participant LOG as ログ

        C->>IF: audio（許していない Origin）
        IF->>LOG: 断った理由と要求元（Host・Origin）を書き込む
        IF-->>C: 403（problem+json）
      ```

      <!-- /map -->
    expected:
      - 403 の problem+json が返る
      - 一時のフォルダにファイルが無く、キューにジョブが追加されていない
      - ログに断った理由と要求元が書き込まれている
    test: test_error_when_origin_not_allowed
  - name: 異常系（大きすぎる・413）
    summary: 本文が上限以上の要求を断り、一時のファイルを残さない
    setup:
      - name: Mock
        description: ブラウザの本文の上限を 1,000 バイトに差し替える。一時のフォルダはテストの一時フォルダ
      - name: 要求
        description: 本文が 1,000 バイトになる音声を、Content-Length を付けて送信するものと、chunked で送信するものの 2 通り
    flow: |-
      <!-- map: {"title": "異常系（大きすぎる・413）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant LOG as ログ

        C->>IF: 上限以上の本文
        IF->>IF: 大きさを確認する（上限以上）
        IF->>LOG: 断った理由と大きさを書き込む
        IF-->>C: 413（problem+json）
      ```

      <!-- /map -->
    expected:
      - どちらも 413 の problem+json が返る
      - 一時のフォルダにファイルが残らず、キューにジョブが追加されていない
    test: test_error_when_too_large
  - name: 異常系（読めない形式・415）
    summary: PyAV で開けない中身と、音声のストリームの無い中身を断る
    setup:
      - name: Mock
        description: 一時のフォルダはテストの一時フォルダ
      - name: 音声
        description: 拡張子を `.mp3` にしたテキストの中身と、音声の無い映像だけの mp4 の 2 通り
    flow: |-
      <!-- map: {"title": "異常系（読めない形式・415）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant LOG as ログ

        C->>IF: audio（読み込めない中身）
        IF->>IF: PyAV で開く（開けない・音声が無い）
        IF->>LOG: 断った理由と大きさを書き込む
        IF-->>C: 415（problem+json）
      ```

      <!-- /map -->
    expected:
      - どちらも 415 の problem+json が返る
      - 一時のフォルダにファイルが残らず、キューにジョブが追加されていない
    test: test_error_when_unreadable_format
  - name: 異常系（待ちが上限・503）
    summary: 終わっていないジョブが待ちの上限に達していれば断る
    setup:
      - name: Mock
        description: ブラウザの音声の待ちの上限を 2 件に差し替え、キューから取り出さないようにする。一時のフォルダはテストの一時フォルダ
      - name: 待ちのジョブ
        description: 音声を 2 件受け付けておく
    flow: |-
      <!-- map: {"title": "異常系（待ちが上限・503）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant LOG as ログ

        C->>IF: audio（3 件目）
        IF->>IF: 待ちの数を確認する（上限）
        IF->>LOG: 断った理由と待ちの数を書き込む
        IF-->>C: 503（problem+json）
      ```

      <!-- /map -->
    expected:
      - 503 の problem+json が返る
      - 一時のフォルダのファイルが 2 つのままで、キューのジョブも 2 件のまま
    test: test_error_when_queue_full
  - name: 正常系（用語集のプリセットを指定）
    summary: glossary_preset で指定した用語集のプリセットの名前をジョブに持たせて追加する
    setup:
      - name: Mock
        description: ブラウザの音声のキューを、追加されたジョブを記録して取り出さないものに差し替える。一時のフォルダはテストの一時フォルダ
      - name: 用語集のプリセット
        description: 設定に用語集のプリセット「既定」と「会議」があり、設定で選んでいるのは「既定」
        notes: multipart の `glossary_preset` に「会議」を入れる
      - name: 音声
        description: テストの中で書き出した短い webm/opus
    flow: |-
      <!-- map: {"title": "正常系（用語集のプリセットを指定）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions
        participant Q as ブラウザの音声のキュー

        C->>IF: audio・glossary_preset（許す Origin）
        IF->>IF: glossary_preset が設定の一覧にあるかを確認する
        IF->>Q: プリセットの名前を持たせたジョブを追加する（queued）
        IF-->>C: 202・job_id
      ```

      <!-- /map -->
    expected:
      - 202 と job_id が返る
      - キューにその job_id のジョブが queued で 1 件積まれ、用語集のプリセットの名前が「会議」
      - glossary_preset を付けない要求と空文字の要求は、ジョブの用語集のプリセットの名前が空
    test: test_normal_when_glossary_preset
  - name: 異常系（一覧に無い用語集のプリセット・400）
    summary: 設定の一覧に無い用語集のプリセットを指定した音声を、追加せずに断る
    setup:
      - name: Mock
        description: ブラウザの音声のキューは追加されたジョブを記録するもの。一時のフォルダはテストの一時フォルダ
      - name: 無いプリセット
        description: 設定の用語集のプリセットの一覧に無い名前を指定する
        notes: multipart の `glossary_preset` に「無いプリセット」を入れる
    flow: |-
      <!-- map: {"title": "異常系（一覧に無い用語集のプリセット・400）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions

        C->>IF: audio・一覧に無い glossary_preset
        IF->>IF: glossary_preset が設定の一覧にあるかを確認する（無い）
        IF-->>C: 400（detail に指定したプリセットの名前）
      ```

      <!-- /map -->
    expected:
      - 400 の problem+json が返り、detail に指定したプリセットの名前が含まれている
      - 一時のフォルダにファイルが残らず、キューにジョブが追加されていない
    test: test_error_when_glossary_preset_not_found
  - name: 異常系（Linux で動いている・404）
    summary: 常駐サービスが Linux で動いているときは `/web/` の下のルートが無く、Origin によらず 404 を返却する
    setup:
      - name: Mock
        description: なし（常駐アプリの app を、Linux で使用できない機能を除外して TestClient で作成する）
        notes: 動いている OS を Linux にする
      - name: 要求のヘッダー
        description: Origin を付けない要求と、許す Origin に無い Origin を付けた要求の 2 つを送信する
        notes: '`Origin: http://evil.example`'
    flow: |-
      <!-- map: {"title": "異常系（Linux で動いている・404）"} -->

      ```mermaid
      sequenceDiagram
        participant C as ブラウザ
        participant IF as POST /web/transcriptions

        C->>IF: 音声を送信する（Origin なし・許す Origin に無い Origin）
        IF->>IF: Host を確認する（Origin は確認しない）
        IF-->>C: 404（problem+json）
      ```

      <!-- /map -->
    expected:
      - Origin を付けない要求と、許す Origin に無い Origin を付けた要求のどちらにも 404（problem+json）が返る
      - ジョブを追加していない（ブラウザの音声のキューを作成していない）
    test: test_error_when_running_on_linux
  - name: 正常系（Origin が無い）
    summary: 同じ端末のほかのプロセスが Origin を付けずに送信した音声を受け付け、job_id を返却する
    setup:
      - name: Mock
        description: ブラウザの音声のキューを、追加されたジョブを記録して取り出さないものに差し替える。一時のフォルダはテストの一時フォルダ
      - name: 要求のヘッダー
        description: Origin を付けない。Host は `localhost:{ポート}`
      - name: 音声
        description: テストの中で書き出した短い webm/opus
    flow: |-
      <!-- map: {"title": "正常系（Origin が無い）"} -->

      ```mermaid
      sequenceDiagram
        participant C as 同じ端末のほかのプロセス
        participant IF as POST /web/transcriptions
        participant Q as ブラウザの音声のキュー

        C->>IF: audio（Origin なし）
        IF->>IF: Host を確認する（Origin が無いため許可リストを確認しない）
        IF->>Q: ジョブを追加する（queued）
        IF-->>C: 202・job_id
      ```

      <!-- /map -->
    expected:
      - 202 と 22 文字の job_id が返る
      - キューにその job_id のジョブが queued で 1 件積まれている
    test: test_normal_when_no_origin
lead: 外の端末のブラウザから送信された音声を受け、一時のファイルに書き込んで文字起こしのジョブを追加し、ジョブの ID を返却する。
identifier: create_web_transcription
permissions: なし（外からの認証は Cloudflare Access が持つ。常駐アプリは Host と Origin だけを確認する）
idempotent: false
side_effects: '受けた音声を一時のフォルダへ録れた形式の拡張子のまま書き、受け付けた時点の用語集のプリセットの名前（指定が無ければ空）を持たせたジョブ（state: queued）をブラウザの音声のキューに追加する。受け付けたことを、job_id・大きさ・形式・秒数でログに 1 行書く（音声の中身は書き込まない）。追加したジョブは ブラウザの音声を文字に起こす が 1 件ずつ取り出す。'
exclusivity: 録音セッション（`/sessions`・ホットキー・トレイ）とは排他しない。録音・文字起こしの処理中も受け付け、終わっていないジョブが待ちの上限に達しているときだけ断る
request:
  - name: Host
    type: str
    required: true
    location: header
    description: 待ち受けのホスト。ゲートウェイは `localhost:{ポート}` に書き換えて引き渡す
    constraints: '`127.0.0.1:{ポート}` か `localhost:{ポート}`'
    status: planned
  - name: Origin
    type: str
    required: false
    location: header
    description: 画面を開いたオリジン。ブラウザは POST に必ず付け、同じ端末のほかのプロセスは付けない
    constraints: 付いていれば、設定の許す Origin（api.allowed_web_origins）にあること
    example: https://voice.example.com
    status: planned
    default: なし（Origin を確かめずに通す）
  - name: Content-Length
    type: int
    required: false
    default: なし（読みながら数えて上限で断る）
    location: header
    description: 本文の大きさ。付いていれば本文を読み込む前に上限と比べる
    constraints: ブラウザの本文の上限未満
    status: planned
  - name: audio
    type: UploadFile
    required: true
    location: body
    description: 送信する音声。`multipart/form-data` のファイルの項目
    constraints: PyAV（faster-whisper）で音声のストリームを読み込める形式（webm・ogg・mp4・MP3・WAV など）
    format: binary
    notes: 形式は Content-Type やファイル名ではなく、中身を PyAV で開いて決める。一時のファイルの拡張子は PyAV が読み込んだ容れ物の形式から付ける
    status: planned
  - name: glossary_preset
    type: str
    required: false
    default: なし（補正の時点で設定で選んでいる用語集のプリセットを使う）
    location: body
    description: この音声の補正に使用する用語集のプリセットの名前。`multipart/form-data` の文字の項目。受け付けの時点で決まり、後から設定で選ぶプリセットを変えても、この音声は指定したプリセットで補正する
    constraints: 設定の用語集のプリセットの一覧にある名前（大文字と小文字を区別する）。空文字は指定なしとして扱う
    example: 会議
    notes: '`POST /sessions` の `glossary_preset` と同じ名前で指す'
    status: planned
request_example: |-
  ```http
  POST /web/transcriptions HTTP/1.1
  Host: localhost:47823
  Origin: https://voice.example.com
  Content-Type: multipart/form-data; boundary=----b

  ------b
  Content-Disposition: form-data; name="audio"; filename="recording.webm"
  Content-Type: audio/webm;codecs=opus

  {音声のバイト列}
  ------b
  Content-Disposition: form-data; name="glossary_preset"

  会議
  ------b--
  ```
response:
  - name: job_id
    type: str
    description: 追加したジョブの ID。文字起こしの結果を返却する で結果を取りに行くときに使用する
    constraints: 推測できない乱数（`secrets.token_urlsafe(16)`、22 文字）
    example: q3Vb8sXk2mJf0tLw9eRzAg
response_example: |-
  ```json
  {
    "job_id": "q3Vb8sXk2mJf0tLw9eRzAg"
  }
  ```
response_notes: 同じ音声を 2 回送信すると、別のジョブが 2 つ積まれる（画面の再送信は新しい job_id を受け取る）。
status_codes:
  - code: '202'
    condition: 音声を受け付けてジョブを追加した
  - code: '400'
    condition: multipart でないか、`audio` の項目が無い。または、glossary_preset が設定の用語集のプリセットの一覧に無い
  - code: '403'
    condition: Host が 127.0.0.1 でも localhost でもないか、Origin が付いていて許す Origin に無い（Linux では Origin を確認せず、Host が合わないときだけ）
  - code: '404'
    condition: 常駐サービスが Linux で動いている（`/web/` の下のルートを登録していない。Origin によらない）
  - code: '413'
    condition: 本文がブラウザの本文の上限以上
  - code: '415'
    condition: '`audio` を PyAV で開けないか、音声のストリームが無い'
  - code: '503'
    condition: 終わっていないジョブがブラウザの音声の待ちの上限に達している
error_format: RFC 9457 の `application/problem+json`（`type`・`title`・`status`・`detail`）で返す。今の API の `problem_response` に揃える。`detail` には断った理由を書き、音声の中身やファイルの置き場所を含めない。
constraints:
  - item: 待ち受け
    constraint: 127.0.0.1 だけ。外からはゲートウェイ（shuhdev-gateway、Cloudflare Access）を経由して届く
  - item: 認可
    constraint: トークンを求めない。Host が待ち受けのホストで、Origin が無いか許す Origin にあること
  - item: 応答時間
    constraint: ブラウザの要求の応答時間以内。文字起こしを待たずに返却する
    decided_by: NFR-1#requirements[ブラウザの要求の応答時間]
  - item: 本文の大きさ
    constraint: ブラウザの本文の上限未満。Content-Length があれば読み込む前に、無ければ読み込みながら数えて、上限に達した時点で断る
    decided_by: NFR-1#requirements[ブラウザの本文の上限]
  - item: 待ちの上限
    constraint: 終わっていないジョブ（queued・running）の数がブラウザの音声の待ちの上限に達していれば断る
    decided_by: NFR-1#requirements[ブラウザの音声の待ちの上限]
  - item: 音声の長さ
    constraint: 制限なし
    notes: 画面で録る長さは画面の録音の上限時間で抑え、選んだファイルは本文の上限で抑える
  - item: レート制限
    constraint: 制限なし
    notes: 待ちの上限で足りる
  - item: 使用できる OS
    constraint: 常駐サービスが Windows で動いているときだけ。Linux では `/web/` の下のルートを登録せず、Origin によらず 404 を返却する（要求の守りは Host だけを確認し、Origin を確認せずにルートへ引き渡す）
    notes: OS ごとに使用できる機能の表で、外の端末のブラウザの機能を Linux で使用できない機能にしている。Host が合わない要求は Linux でも 403
test_file: tests/integration/test_accept_web_audio.py
